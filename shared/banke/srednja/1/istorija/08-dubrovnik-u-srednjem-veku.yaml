          - "Trgovci rade u unutrašnjosti, uz dozvole."
          - "Veza sa Mediteranom i zapadnom kulturom."
        objasnjenje: "Spona je ono što spaja: Dubrovnik povezuje kopno i more, Balkan i Zapad."
        iz_udzbenika:
          strana: 37
          odeljak: "Zapamtite"
          tekst: "Dubrovačka republika je veoma važna spona Balkana i mediteranskih zemalja."
