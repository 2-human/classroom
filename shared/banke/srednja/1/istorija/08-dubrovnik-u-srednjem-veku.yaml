        uzor: "Dubrovčani su poslovali sa državom Nemanjića i vodili poslovne knjige i pisma. Ta građa je sačuvana u Dubrovačkom arhivu. Zato je ona danas među najvrednijim dokumentima o srpskoj državi."
        ideje:
          - "Trgovci posluju sa državom Nemanjića."
          - "Ostavljaju poslovne knjige i pisma."
          - "Građa je sačuvana u arhivu."
        objasnjenje: "Istorija se ne uči samo iz vladarskih povelja nego i iz svakodnevnih poslovnih zapisa."
        iz_udzbenika:
          strana: 36
          odeljak: "Dubrovački arhiv"
          tekst: "Poslovne knjige i pisma Dubrovčana ubrajaju se u najvrednije dokumente o srpskoj srednjovekovnoj državi."

