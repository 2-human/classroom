        pitanje: "Šta sve uređuje povelja Stefana Nemanjića upućena Dubrovčanima?"
        uzor: "Povelja uređuje prijateljstvo Srbije i Dubrovnika i izručenje neprijatelja grada. Trgovcima daje bezbedan put, slobodnu kupovinu i prodaju i plaćanje samo po zakonu. Spore rešavaju sudije, a imovina se ne oduzima silom."
        ideje:
          - "Prijateljstvo i izručenje neprijatelja."
          - "Bezbedan put i slobodna trgovina."
          - "Dažbine samo po zakonu."
          - "Sud i zabrana oduzimanja imovine."
        objasnjenje: "Povelja je pravni temelj rada dubrovačkih trgovaca u Srbiji."
        iz_udzbenika:
          strana: 37
          odeljak: "Iz istorijskih izvora: Povelja o prijateljstvu i trgovini"
          tekst: "Povelja uređuje prijateljstvo, izručenje, bezbednost i slobodu trgovine, dažbine po zakonu i sudsku zaštitu."

