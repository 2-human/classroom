          tekst: "Sva vlast je u rukama vlastele; pučani su slobodni, ali bez učešća u vlasti."

      - id: l08-ure-lanac-organi-tesko
        vrsta: lanac
        tezina: tesko
        pojmovi: [veliko-vece, senat, malo-vece, knez, vlastela]
        karike:
          - "Vlastela se ne meša sa ostalim stanovništvom"
          - "Plemići čine Veliko veće"
          - "?"
          - "Vlast u svim organima ostaje u krugu vlastele"
        praznina: 2
        odgovori:
          - {tekst: "Veliko veće bira sve državne organe", tacan: true}
          - {tekst: "Pučani biraju kneza", tacan: false, zasto: "Pučani nemaju učešće u vlasti; organe bira Veliko veće."}
          - {tekst: "Ugarski kralj postavlja Senat", tacan: false, zasto: "Ugarska vlast je samo formalna; organe bira Veliko veće."}
        pomoc:
          - "Korak 1: Šta sve radi Veliko veće osim donošenja zakona?"
          - "Korak 2: Ko onda dolazi na ostale funkcije?"
          - "Iz lekcije: plemići preko Velikog veća biraju sve državne organe."
        objasnjenje: "Pravo da bira sve organe čuva vlast u rukama jednog sloja."
        iz_udzbenika:
          strana: 36
          odeljak: "Društveno i državno uređenje"
          tekst: "Plemići preko Velikog veća donose zakone i biraju sve državne organe."

      - id: l08-ure-izvor-veduta
        vrsta: izvor
        tezina: lako
        pojmovi: [dubrovnik, grad-drzava]
        izvor:
          autor: "Slika iz udžbenika"
          naslov: "Dubrovnik u srednjem veku (opis slike)"
          tekst: "Pogled odozgo na gusto zbijene kuće u pravilnim blokovima, opasane zidinama, uz more i luku, sa kulama i zvonikom i brdima iza grada."
          napomena: "Odlomak je prepričan; udžbenik, str. 37."
        pitanje: "Šta nam ova slika pokazuje o Dubrovniku?"
        odgovori:
          - {tekst: "Bio je utvrđen primorski grad", tacan: true}
          - {tekst: "Bio je selo bez kuća", tacan: false, zasto: "Slika pokazuje gusto zbijene kuće, dakle razvijen grad."}
          - {tekst: "Bio je daleko od mora", tacan: false, zasto: "Grad je uz more i luku."}
          - {tekst: "Nije imao nikakvu odbranu", tacan: false, zasto: "Grad je opasan zidinama sa kulama."}
        pomoc:
          - "Pronađi u opisu more i zidine."
          - "Šta znači kada je grad opasan zidinama?"
          - "Iz lekcije: slika pokazuje Dubrovnik kao utvrđen primorski grad-državu."
        objasnjenje: "Zidine čuvaju bogatstvo grada, a luka mu daje izlaz na more."
        iz_udzbenika:
          strana: 37
          odeljak: "Društveno i državno uređenje"
          tekst: "Slika prikazuje grad opasan zidinama, uz more i luku."
          slika: 08-dubrovnik-u-srednjem-veku/02-dubrovnik-u-srednjem-veku.jpg

      - id: l08-ure-uporedi-vlastela-pucani
        vrsta: uporedi
        tezina: srednje
        pojmovi: [vlastela, pucani, veliko-vece]
        a: "Vlastela"
        b: "Pučani"
        pitanje: "Na koga se odnosi tvrdnja: vlastelu, pučane, oba ili nijednog?"
        tvrdnje:
          - {tekst: "Donose zakone preko svoje skupštine.", odgovor: a, zasto: "To je Veliko veće, skupština plemića."}
          - {tekst: "Slobodni su građani bez učešća u vlasti.", odgovor: b, zasto: "Tako lekcija opisuje pučane."}
          - {tekst: "Čine građanstvo Dubrovnika.", odgovor: oba, zasto: "Pored plemstva, građanstvo čine i pučani."}
          - {tekst: "Ne mešaju se sa ostalim stanovništvom.", odgovor: a, zasto: "To važi za vlastelu."}
          - {tekst: "Biraju srpskog vladara.", odgovor: nijedan, zasto: "Srpski vladari nisu izbor Dubrovčana; srpska država je sused."}
        pomoc:
          - "Ko ima vlast, a ko je nema?"
          - "Jedna tvrdnja važi za oba sloja."
          - "Iz lekcije: vlastela vlada, pučani su slobodni, ali bez vlasti."
        objasnjenje: "Oba sloja su građani, ali je samo vlastela imala vlast."
        iz_udzbenika:
          strana: 36
          odeljak: "Društveno i državno uređenje"
          tekst: "Vlastela drži svu vlast, a pučani su slobodni građani bez učešća u vlasti."

      - id: l08-ure-uporedi-bosna-tesko
        vrsta: uporedi
        tezina: tesko
        pojmovi: [dubrovnik, bosna, vlastela, ugarska]
        a: "Dubrovnik"
        b: "Bosna"
        pitanje: "Na koga se odnosi tvrdnja: Dubrovnik, Bosnu, oba ili nijedno?"
        tvrdnje:
          - {tekst: "Formalno je priznavao vlast Ugarske, a stvarno je bio samostalan.", odgovor: oba, zasto: "Bosna u XIII veku i Dubrovnik pod Ugarskom imaju formalnu, a ne stvarnu zavisnost."}
          - {tekst: "Vlastela ima veliku moć u državi.", odgovor: oba, zasto: "U Bosni vlastela bira vladara, a u Dubrovniku drži svu vlast."}
          - {tekst: "Ima skupštinu plemića koja donosi zakone.", odgovor: a, zasto: "Veliko veće je dubrovačko."}
          - {tekst: "Ima vladarsku dinastiju Kotromanića.", odgovor: b, zasto: "Kotromanići su bosanska dinastija."}
          - {tekst: "Stvorio je sopstvenu versku organizaciju bogumila.", odgovor: b, zasto: "Crkva bosanska nastaje u Bosni."}
          - {tekst: "Bio je grad-država.", odgovor: a, zasto: "To je Dubrovnik."}
        pomoc:
          - "Seti se šta si učio o Bosni u prošloj lekciji."
          - "Formalna vlast je sličnost između njih."
          - "Iz lekcije: oba su formalno pod Ugarskom; uređenje im je različito."
        objasnjenje: "Sličnost je u formalnoj zavisnosti i moći vlastele, a razlika u obliku države."
        iz_udzbenika:
          strana: 36
          odeljak: "Društveno i državno uređenje"
          tekst: "Dubrovnik je formalno pod Ugarskom, ali istupa kao potpuno nezavisna država."

      - id: l08-ure-ko-sam-pucanin
        vrsta: ko_sam
        tezina: tesko
        pojmovi: [pucani, vlastela]
        tragovi:
          - "Slobodan sam građanin Dubrovnika."
          - "Nemam mesto u skupštini koja donosi zakone."
          - "Nisam plemić, ali živim u gradu kojim plemići vladaju."
        odgovori:
          - {tekst: "Pučanin", tacan: true}
          - {tekst: "Član vlastele", tacan: false, zasto: "Vlastela sedi u Velikom veću i drži vlast."}
          - {tekst: "Dubrovački knez", tacan: false, zasto: "Knez učestvuje u upravljanju gradom."}
          - {tekst: "Senator", tacan: false, zasto: "Senat ima važnu ulogu u upravljanju, a pučani nemaju učešće u vlasti."}
        objasnjenje: "Pučanin je slobodan građanin, ali bez ikakvog udela u vlasti."
        iz_udzbenika:
          strana: 36
          odeljak: "Društveno i državno uređenje"
          tekst: "Pučani su slobodni građani bez učešća u vlasti."

      - id: l08-ure-objasni-uredjenje
        vrsta: objasni
        tezina: srednje
        pojmovi: [vlastela, veliko-vece, pucani, grad-drzava]
        pitanje: "Objasni ko je i kako vladao Dubrovnikom."
        uzor: "Dubrovnikom je vladala vlastela, zatvoren sloj plemića. Preko svoje skupštine, Velikog veća, donosila je zakone i birala sve državne organe, a važnu ulogu imali su Senat, Malo veće i knez. Pučani su bili slobodni, ali bez učešća u vlasti."
        ideje:
          - "Vlada vlastela."
          - "Veliko veće donosi zakone i bira organe."
          - "Važni su i Senat, Malo veće i knez."
          - "Pučani su bez vlasti."
        objasnjenje: "Dubrovnik je grad-država sa vlašću plemstva, slično Mletačkoj republici."
        iz_udzbenika:
          strana: 36
          odeljak: "Društveno i državno uređenje"
          tekst: "Sva vlast je u rukama vlastele, koja preko Velikog veća donosi zakone i bira organe."

      - id: l08-ure-objasni-nezavisnost
        vrsta: objasni
        tezina: tesko
        pojmovi: [dubrovnik, mletacka-republika, ugarska]
        pitanje: "Kako je Dubrovnik mogao da bude pod tuđom vlašću, a da se ipak ponaša kao nezavisna država?"
        uzor: "Vlast Mlečana, a zatim Ugarske bila je samo formalna. Gradom su i dalje upravljali njegovi organi, a spoljna politika je u suštini bila nezavisna. Zato su i gospodari mogli da se menjaju, a da grad ostane samostalan."
        ideje:
          - "Tuđa vlast je bila formalna."
          - "Grad ima sopstvene organe vlasti."
          - "Spoljna politika je nezavisna."
        objasnjenje: "Uporedi sa Bosnom u XIII veku: i tamo je priznanje Ugarske bilo samo formalno."
        iz_udzbenika:
          strana: 37
          odeljak: "Zapamtite"
          tekst: "Formalni gospodari su se menjali, ali je spoljna politika u suštini bila nezavisna."

