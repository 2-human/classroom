        pojmovi: [stefan-nemanjic, trgovina, dubrovnik]
        izvor:
          autor: "Stefan Nemanjić"
          naslov: "Povelja o prijateljstvu i trgovini sa Dubrovnikom"
          tekst: "Dubrovački ljudi mogu slobodno da putuju s robom, bez straha i nasilja, da slobodno kupuju i prodaju, a plaćaju samo ono što propisuje trgovački zakon."
          napomena: "Odlomak je prepričan; udžbenik, str. 37."
        pitanje: "Šta je trgovcu ovim tekstom zagarantovano? (više tačnih)"
        odgovori:
          - {tekst: "Bezbedno putovanje s robom", tacan: true}
          - {tekst: "Slobodna kupovina i prodaja", tacan: true}
          - {tekst: "Dažbine samo prema zakonu", tacan: true}
          - {tekst: "Oslobođenje od svih dažbina", tacan: false, zasto: "Trgovci plaćaju ono što propisuje trgovački zakon, pa dažbine ipak postoje."}
          - {tekst: "Pravo da vodi srpsku vojsku", tacan: false, zasto: "Povelja se tiče trgovine i sigurnosti, a ne vojske."}
        pomoc:
          - "Prati glagole u odlomku: putuju, kupuju, prodaju, plaćaju."
          - "Da li se nešto ipak plaća?"
          - "Iz lekcije: slobodan put, slobodna trgovina, plaćanje po zakonu."
        objasnjenje: "Povelja ne ukida dažbine, nego ih čini predvidivim."
        iz_udzbenika:
          strana: 37
          odeljak: "Iz istorijskih izvora: Povelja o prijateljstvu i trgovini"
          tekst: "Dubrovčani slobodno putuju s robom, slobodno kupuju i prodaju, a plaćaju samo ono što propisuje trgovački zakon."

      - id: l08-ulo-izvor-neprijatelj
