        objasnjenje: "Kada nema više sile iznad vladara, jemac je Bog: to obećanje čini teškim za kršenje."
        iz_udzbenika:
          strana: 37
          odeljak: "Iz istorijskih izvora: Povelja o prijateljstvu i trgovini"
          tekst: "Vladar polaže zakletvu i poziva Boga i Bogorodicu da mu sude ako prekrši obećanje."

