# Banka pitanja: Dubrovnik u srednjem veku (istorija, 1. razred srednje škole, str. 36–37). Sopstvenim rečima, po belešci lekcije.
# Lekcija ne daje nijednu tačnu godinu (samo vekove), pa nema zadataka vrste `datum`; događaji na osi imaju `oznaka`.
# Povelja nema godinu, a knjiga vladara zove različitim titulama: zato bez ose i bez pitanja o tituli.
lekcija: 8
naslov: "Dubrovnik u srednjem veku"
pojmovi:
  dubrovnik: Dubrovnik
  grad-drzava: grad-država
  epidaurus: Epidaurus
  cavtat: Cavtat
  peljesac: Pelješac
  vlastela: vlastela
  veliko-vece: Veliko veće
  senat: Senat
  malo-vece: Malo veće
  knez: knez
  pucani: pučani
  mletacka-republika: Mletačka republika
  ugarska: Ugarska
  vizantija: Vizantija
  dubrovacki-arhiv: Dubrovački arhiv
  trgovina: trgovina
  carine: carine
  rudnici: rudnici
  stefan-nemanjic: Stefan Nemanjić
  zan-dandolo: Žan Dandolo
  vlah: Vlah
  srbija: Srbija
  bosna: Bosna
  mediteran: Mediteran
delovi:
  # ==========================================================================
  - naslov: "Postanak i razvoj Dubrovnika"
    zadaci:
      - id: l08-pos-izbor-ko-podigao
        vrsta: izbor
        tezina: lako
        pojmovi: [dubrovnik, epidaurus]
        pitanje: "Ko je podigao Dubrovnik?"
        odgovori:
          - {tekst: "Izbeglice iz razorenog Epidaurusa", tacan: true}
          - {tekst: "Trgovci iz Bosne", tacan: false, zasto: "Bosna je kasnije trgovački partner Dubrovnika; grad su podigle izbeglice iz Epidaurusa."}
          - {tekst: "Mlečani", tacan: false, zasto: "Mlečani su kasnije bili formalni gospodari grada, a ne njegovi osnivači."}
          - {tekst: "Srpski vladari", tacan: false, zasto: "Srpski vladari su prodavali zemlju Dubrovniku, a grad su podigle izbeglice iz Epidaurusa."}
        pomoc:
          - "Grad su podigli ljudi koji su izgubili svoj dom."
          - "Njihov stari grad je stradao u napadima Slovena."
          - "Iz lekcije: podigle su ga izbeglice iz Epidaurusa."
        objasnjenje: "Dubrovnik su u VII veku podigle izbeglice iz Epidaurusa, koji je stradao u napadima Slovena."
        iz_udzbenika:
          strana: 36
          odeljak: "Postanak i razvoj Dubrovnika"
          tekst: "Dubrovnik je nastao u VII veku; podigle su ga izbeglice iz Epidaurusa."
        osa: {naziv: "Nastanak Dubrovnika", od: 600, do: 700, traka: dogadjaji, oznaka: "VII vek"}

      - id: l08-pos-izbor-cavtat
        vrsta: izbor
        tezina: lako
        pojmovi: [epidaurus, cavtat]
        pitanje: "Kako se danas zove mesto na kome je bio Epidaurus?"
        odgovori:
          - {tekst: "Cavtat", tacan: true}
          - {tekst: "Pelješac", tacan: false, zasto: "Pelješac je poluostrvo koje je Dubrovnik kasnije stekao."}
          - {tekst: "Split", tacan: false, zasto: "Lekcija ne povezuje Split sa Epidaurusom; današnji Epidaurus je Cavtat."}
          - {tekst: "Kotor", tacan: false, zasto: "Kotor je drugi primorski grad; Epidaurus je današnji Cavtat."}
        pomoc:
          - "Mesto je sasvim blizu Dubrovnika."
          - "Ime počinje slovom C."
          - "Iz lekcije: Epidaurus je današnji Cavtat."
        objasnjenje: "Epidaurus je današnji Cavtat, odakle su izbeglice došle da podignu Dubrovnik."
        iz_udzbenika:
          strana: 36
          odeljak: "Uvod"
          tekst: "Dubrovnik su podigli stanovnici razorenog Epidaurusa, današnjeg Cavtata."

      - id: l08-pos-izbor-vizantija
        vrsta: izbor
        tezina: lako
        pojmovi: [vizantija, dubrovnik]
        pitanje: "Pod čijom upravom je Dubrovnik bio na početku?"
        odgovori:
          - {tekst: "Pod upravom Vizantije", tacan: true}
          - {tekst: "Pod upravom Turaka", tacan: false, zasto: "U VII veku Turaka u ovoj priči nema; grad je tada pod Vizantijom."}
          - {tekst: "Pod upravom Bosne", tacan: false, zasto: "Bosanska država nastaje tek krajem XII veka."}
          - {tekst: "Pod upravom Ugarske", tacan: false, zasto: "Ugarska je tek kasniji formalni gospodar, posle Mlečana."}
        pomoc:
          - "Na Balkanu je tada jako veliko carstvo."
          - "Mlečani i Ugarska dolaze tek kasnije."
          - "Iz lekcije: u početku je to bilo malo mesto pod upravom Vizantije."
        objasnjenje: "Dubrovnik je počeo kao malo mesto pod upravom Vizantije."
        iz_udzbenika:
          strana: 36
          odeljak: "Postanak i razvoj Dubrovnika"
          tekst: "U početku je Dubrovnik bio malo mesto pod upravom Vizantije."

      - id: l08-pos-izbor-bogatstvo
        vrsta: izbor
        tezina: srednje
        pojmovi: [trgovina, mediteran, dubrovnik]
        pitanje: "Odakle je poticalo bogatstvo Dubrovnika? (više tačnih)"
        odgovori:
          - {tekst: "Od trgovine sa slovenskim oblastima u zaleđu", tacan: true}
          - {tekst: "Od trgovine sa državama Mediterana", tacan: true}
          - {tekst: "Od pljačke susednih zemalja", tacan: false, zasto: "Grad se bogatio trgovinom, a zemlju je čak kupovao."}
          - {tekst: "Od poreza koji je plaćala Vizantija", tacan: false, zasto: "Grad je bio pod Vizantijom, pa nije ubirao porez od nje; bogatstvo je došlo od trgovine."}
        pomoc:
          - "Zamisli grad između kopna i mora."
          - "Dve strane trgovine: zaleđe i more."
          - "Iz lekcije: bogatstvo potiče od trgovine sa slovenskim zaleđem i Mediteranom."
        objasnjenje: "Dubrovnik je posrednik između slovenskog zaleđa i Mediterana, pa se na toj trgovini bogatio."
        iz_udzbenika:
          strana: 36
          odeljak: "Postanak i razvoj Dubrovnika"
          tekst: "Bogatstvo potiče od trgovine sa slovenskim oblastima u zaleđu i sa državama Mediterana."
          slika: 08-dubrovnik-u-srednjem-veku/01-dubrovacki-trgovacki-brod.jpg

      - id: l08-pos-izbor-zakup
        vrsta: izbor
        tezina: srednje
        pojmovi: [carine, rudnici, srbija, bosna]
        pitanje: "Šta su Dubrovčani često uzimali u zakup u Srbiji i Bosni?"
        odgovori:
          - {tekst: "Carine i rudnike", tacan: true}
          - {tekst: "Manastire i crkve", tacan: false, zasto: "Lekcija govori o privrednom zakupu carina i rudnika."}
          - {tekst: "Vojsku i tvrđave", tacan: false, zasto: "Dubrovčani su trgovci; u zakup uzimaju carine i rudnike."}
          - {tekst: "Prestonice vladara", tacan: false, zasto: "Prestonice se ne iznajmljuju; zakup se tiče izvora prihoda, carina i rudnika."}
        pomoc:
          - "Razmisli šta donosi novac: promet robe i iskopavanje."
          - "Jedno je vezano za promet robe, drugo za rude."
          - "Iz lekcije: često su uzimali u zakup carine i rudnike."
        objasnjenje: "Zakup carina i rudnika pokazuje da su Dubrovčani učestvovali u privredi Srbije i Bosne, a ne samo u trgovini."
        iz_udzbenika:
          strana: 36
          odeljak: "Postanak i razvoj Dubrovnika"
          tekst: "Dubrovčani su često uzimali u zakup carine i rudnike u Srbiji i Bosni."

      - id: l08-pos-izbor-prisutnost-tesko
        vrsta: izbor
        tezina: tesko
        pojmovi: [dubrovnik, trgovina, srbija, bosna, carine]
        pitanje: "Šta od navedenog pokazuje da je Dubrovnik bio prisutan u životu balkanskih država? (više tačnih)"
        odgovori:
          - {tekst: "Trgovci otvaraju poslove u Srbiji i Bosni", tacan: true}
          - {tekst: "Uzimaju u zakup carine i rudnike", tacan: true}
          - {tekst: "Nose luksuznu robu i vina u unutrašnjost", tacan: true}
          - {tekst: "Dubrovački knez postavlja srpske vladare", tacan: false, zasto: "Knez učestvuje u upravi grada; srpske vladare ne postavlja, a trgovci i traže dozvolu od njih."}
          - {tekst: "Dubrovnik upravlja Bosnom kao svojom pokrajinom", tacan: false, zasto: "Bosna ima svoje vladare, od kojih trgovci dobijaju dozvolu."}
        pomoc:
          - "Traži privredne veze, a ne političku vlast."
          - "Trgovci zavise od dozvole vladara."
          - "Iz lekcije: prisutni su trgovinom, zakupom i otvaranjem poslova."
        objasnjenje: "Prisustvo Dubrovnika je privredno: trgovina, zakup i poslovi, a ne vlast nad susedima."
        iz_udzbenika:
          strana: 36
          odeljak: "Uvod"
          tekst: "Dubrovnik postaje trgovačka sila prisutna u svim oblastima života balkanskih država."

      - id: l08-pos-tn-vii-vek
        vrsta: tacno_netacno
        tezina: lako
        pojmovi: [dubrovnik]
        tvrdnja: "Dubrovnik je nastao u VII veku."
        tacno: true
        pomoc:
          - "To je vreme slovenskih napada na Balkan."
          - "Iz lekcije: Dubrovnik je nastao u VII veku."
        objasnjenje: "Tačno. Nastao je u VII veku, kada su izbeglice iz Epidaurusa podigle novo naselje."
        iz_udzbenika:
          strana: 36
          odeljak: "Postanak i razvoj Dubrovnika"
          tekst: "Dubrovnik je nastao u VII veku."
        osa: {naziv: "Nastanak Dubrovnika", od: 600, do: 700, traka: dogadjaji, oznaka: "VII vek"}

      - id: l08-pos-tn-romanizovani
        vrsta: tacno_netacno
        tezina: srednje
        pojmovi: [epidaurus, dubrovnik]
        tvrdnja: "Naselje Dubrovnik podigli su romanizovani stanovnici Epidaurusa."
        tacno: true
        pomoc:
          - "Romanizovan znači ko je primio rimski jezik i način života."
          - "Iz lekcije: naselje su podigli romanizovani stanovnici razorenog Epidaurusa."
        objasnjenje: "Tačno. Osnivači su romanizovani stanovnici Epidaurusa, a ne Sloveni koji su taj grad razorili."
        iz_udzbenika:
          strana: 36
          odeljak: "Uvod"
          tekst: "Naselje su podigli romanizovani stanovnici razorenog Epidaurusa."

      - id: l08-pos-tn-peljesac
        vrsta: tacno_netacno
        tezina: srednje
        pojmovi: [peljesac, dubrovnik]
        tvrdnja: "Dubrovnik je Pelješac i susedna ostrva stekao vojnim osvajanjem."
        tacno: false
        ispravke:
          - {tekst: "Gradske vlasti su kupovale zemlju od srpskih vladara i vlastele.", tacan: true}
          - {tekst: "Pelješac je dobio na poklon od Vizantije.", tacan: false, zasto: "Lekcija ne govori o poklonu; posed se širio kupovinom."}
          - {tekst: "Pelješac je Dubrovnik imao od samog osnivanja.", tacan: false, zasto: "U početku je obuhvatao samo najbližu okolinu grada; Pelješac stiče do XIV veka."}
        pomoc:
          - "Dubrovnik je trgovački, a ne vojnički grad."
          - "Čime trgovac najlakše dolazi do zemlje?"
          - "Iz lekcije: vlasti su kupovale zemlju od srpskih vladara i vlastele."
        objasnjenje: "Netačno. Dubrovnik je širio posed novcem, kupovinom od srpskih vladara i vlastele."
        iz_udzbenika:
          strana: 36
          odeljak: "Postanak i razvoj Dubrovnika"
          tekst: "Vlasti su kupovale zemlju od srpskih vladara i vlastele, pa se posed do XIV veka proširio na Pelješac i susedna ostrva."
        osa: {naziv: "Širenje Dubrovnika do Pelješca", od: 1300, traka: dogadjaji, oznaka: "do XIV veka"}

      - id: l08-pos-tn-razlog-jacanja-tesko
        vrsta: tacno_netacno
        tezina: tesko
        pojmovi: [dubrovnik, trgovina]
        tvrdnja: "Dubrovnik je od XII do XV veka jačao prvenstveno zato što je imao veliku teritoriju."
        tacno: false
        ispravke:
          - {tekst: "Jačao je prvenstveno zbog privrede, a veća teritorija je posledica bogatstva.", tacan: true}
          - {tekst: "Jačao je zato što su ga štitili bogumili.", tacan: false, zasto: "Bogumili nisu tema Dubrovnika; grad jača trgovinom."}
          - {tekst: "Jačao je zato što je vladao Srbijom.", tacan: false, zasto: "Nije vladao Srbijom; trgovao je sa njom uz dozvolu njenih vladara."}
        pomoc:
          - "Šta je bilo prvo: novac ili zemlja?"
          - "Kako je grad došao do novih poseda?"
          - "Iz lekcije: grad jača prvenstveno zbog privrede; zemlju kupuje."
        objasnjenje: "Netačno. Tvrdnja obrće uzrok i posledicu: bogatstvo od trgovine omogućilo je kupovinu zemlje."
        iz_udzbenika:
          strana: 36
          odeljak: "Postanak i razvoj Dubrovnika"
          tekst: "Od XII do XV veka grad znatno jača, prvenstveno zbog privrede."
        osa: {naziv: "Uspon Dubrovnika", od: 1100, do: 1500, traka: dogadjaji, oznaka: "XII–XV vek"}

      - id: l08-pos-dopuni-postanak
        vrsta: dopuni
        tezina: lako
        pojmovi: [epidaurus, cavtat, vizantija, dubrovnik]
        pitanje: "Dopuni rečenice o postanku grada."
        tekst: "Dubrovnik su podigle izbeglice iz {{Epidaurusa}}, današnjeg {{Cavtata}}, koji su razorili {{Sloveni}}. U početku je to bilo malo mesto pod upravom {{Vizantije}}."
        ponudjene: [Epidaurusa, Cavtata, Sloveni, Vizantije, Turci, Bosne]
        pomoc:
          - "Turci stižu mnogo kasnije."
          - "Grad je razoren u VII veku."
          - "Iz lekcije: izbeglice iz Epidaurusa (Cavtat), napadi Slovena, uprava Vizantije."
        objasnjenje: "Napadi Slovena razorili su Epidaurus, a izbeglice su pod vizantijskom vlašću podigle Dubrovnik."
        iz_udzbenika:
          strana: 36
          odeljak: "Postanak i razvoj Dubrovnika"
          tekst: "Dubrovnik su podigle izbeglice iz Epidaurusa; bio je malo mesto pod upravom Vizantije."

      - id: l08-pos-dopuni-posed
        vrsta: dopuni
        tezina: srednje
        pojmovi: [peljesac, dubrovnik, vlastela]
        pitanje: "Dopuni rečenicu o širenju poseda."
        tekst: "Kupovinom zemlje od srpskih vladara i {{vlastele}} posed se do {{XIV}} veka proširio na poluostrvo {{Pelješac}} i susedna {{ostrva}}."
        ponudjene: [vlastele, XIV, Pelješac, ostrva, Mlečana, VII, Cavtat]
        pomoc:
          - "VII vek je vreme nastanka grada."
          - "Zemlju su prodavali srpski vladari i njihovo plemstvo."
          - "Iz lekcije: do XIV veka posed se širi na Pelješac i susedna ostrva."
        objasnjenje: "Od najbliže okoline grada posed je do XIV veka narastao do Pelješca i susednih ostrva."
        iz_udzbenika:
          strana: 36
          odeljak: "Postanak i razvoj Dubrovnika"
          tekst: "Posed se do XIV veka proširio na Pelješac i susedna ostrva."

      - id: l08-pos-povezi-pojmovi
        vrsta: povezi
        tezina: lako
        pojmovi: [epidaurus, peljesac, carine, grad-drzava]
        pitanje: "Poveži pojam sa objašnjenjem."
        parovi:
          - ["Epidaurus", "Grad iz koga dolaze osnivači Dubrovnika"]
          - ["Pelješac", "Poluostrvo koje je ušlo u dubrovački posed"]
          - ["Carine", "Prihod koji su Dubrovčani uzimali u zakup"]
          - ["Grad-država", "Grad koji je istovremeno samostalna država"]
        pomoc:
          - "Prva dva pojma su geografska."
          - "Carine su vezane za promet robe."
          - "Iz lekcije: Epidaurus je prethodnik Dubrovnika, a Pelješac je kasniji posed."
        objasnjenje: "Ovi pojmovi pričaju priču o gradu: odakle dolazi, šta je stekao, od čega živi i šta je bio."
        iz_udzbenika:
          strana: 36
          odeljak: "Postanak i razvoj Dubrovnika"
          tekst: "Lekcija povezuje Epidaurus, Pelješac, zakup carina i pojam grada-države."

      - id: l08-pos-zakljuci-trgovci
        vrsta: zakljuci
        tezina: lako
        pojmovi: [dubrovnik, trgovina, mediteran]
        pitanje: "Čemu je služio veliki jedrenjak prikazan u lekciji?"
        odgovori:
          - {tekst: "Prevozio je robu između Dubrovnika i mediteranskih zemalja", tacan: true}
          - {tekst: "Prevozio je seljake u Bosnu", tacan: false, zasto: "Bosna nije na moru; brod je trgovački i plovi Mediteranom."}
          - {tekst: "Služio je samo za ribolov u luci", tacan: false, zasto: "Veliki trgovački jedrenjak nosi robu, a ne služi za ribolov."}
          - {tekst: "Bio je ratni brod Ugarske", tacan: false, zasto: "Ovo je dubrovački trgovački brod, a ne ugarski ratni."}
        pomoc:
          - "Korak 1: Kako se zove slika?"
          - "Korak 2: Sa kim je Dubrovnik trgovao morem?"
          - "Iz lekcije: takvi brodovi nosili su robu između Dubrovnika i Mediterana."
        objasnjenje: "Brodovi poput ovog nosili su glavni izvor bogatstva grada: trgovinu morem."
        iz_udzbenika:
          strana: 36
          odeljak: "Postanak i razvoj Dubrovnika"
          tekst: "Slika prikazuje veliki dubrovački trgovački jedrenjak."
          slika: 08-dubrovnik-u-srednjem-veku/01-dubrovacki-trgovacki-brod.jpg

      - id: l08-pos-zakljuci-polozaj
        vrsta: zakljuci
        tezina: srednje
        pojmovi: [dubrovnik, trgovina, mediteran]
        pitanje: "Zašto je položaj Dubrovnika bio toliko važan za njegov razvoj?"
        odgovori:
          - {tekst: "Stajao je između slovenskog zaleđa i mediteranskih zemalja, pa je mogao da trguje sa obe strane", tacan: true}
          - {tekst: "Bio je daleko od mora, pa ga niko nije mogao napasti", tacan: false, zasto: "Dubrovnik je primorski grad sa lukom."}
          - {tekst: "Bio je u sredini Bosne", tacan: false, zasto: "Bosna je zaleđe sa kojim Dubrovnik trguje, a grad je na moru."}
          - {tekst: "Imao je velika polja za žito", tacan: false, zasto: "Posed je isprva bio samo najbliža okolina; bogatstvo je došlo od trgovine."}
        pomoc:
          - "Korak 1: Gde je grad, na kopnu ili na moru?"
          - "Korak 2: Sa kojim stranama trguje?"
          - "Iz lekcije: trgovina sa slovenskim zaleđem i državama Mediterana."
        objasnjenje: "Grad je povezivao dva sveta: unutrašnjost Balkana i Mediteran."
        iz_udzbenika:
          strana: 36
          odeljak: "Postanak i razvoj Dubrovnika"
          tekst: "Dubrovnik je bogatstvo sticao trgovinom sa zaleđem i Mediteranom."
          slika: 08-dubrovnik-u-srednjem-veku/02-dubrovnik-u-srednjem-veku.jpg

      - id: l08-pos-poredjaj-postanak
        vrsta: poredjaj
        tezina: lako
        pojmovi: [epidaurus, dubrovnik, vizantija]
        pitanje: "Poređaj korake od razaranja Epidaurusa do jačanja Dubrovnika."
        stavke:
          - {tekst: "Sloveni napadaju i razaraju Epidaurus"}
          - {tekst: "Izbeglice podižu novo naselje"}
          - {tekst: "Naselje je malo mesto pod upravom Vizantije"}
          - {tekst: "Grad se bogati trgovinom"}
        pomoc:
          - "Prvo mora da postoji razlog za bekstvo."
          - "Bogatstvo dolazi na kraju."
          - "Iz lekcije: napad → izbeglice → malo mesto → jačanje."
        objasnjenje: "Iz razaranja jednog grada nastao je drugi, koji je tek vekovima kasnije postao moćan."
        iz_udzbenika:
          strana: 36
          odeljak: "Postanak i razvoj Dubrovnika"
          tekst: "Izbeglice iz razorenog Epidaurusa podigle su malo mesto koje je kasnije ojačalo."

      - id: l08-pos-poredjaj-razvoj
        vrsta: poredjaj
        tezina: srednje
        pojmovi: [dubrovnik, peljesac]
        pitanje: "Poređaj događaje hronološki, od najranijeg."
        stavke:
          - {tekst: "Nastaje Dubrovnik", godina: 600, do: 700, naziv: "Nastanak Dubrovnika", traka: dogadjaji, oznaka: "VII vek"}
          - {tekst: "Grad počinje znatno da jača", godina: 1100, do: 1500, naziv: "Uspon Dubrovnika", traka: dogadjaji, oznaka: "XII–XV vek"}
          - {tekst: "Posed dostiže Pelješac i susedna ostrva", godina: 1300, naziv: "Širenje Dubrovnika do Pelješca", traka: dogadjaji, oznaka: "do XIV veka"}
        pomoc:
          - "Grad mora da nastane pre svega ostalog."
          - "Zemlja se kupuje novcem od uspona."
          - "Iz lekcije: VII vek, pa jačanje od XII veka, pa posed do XIV veka."
