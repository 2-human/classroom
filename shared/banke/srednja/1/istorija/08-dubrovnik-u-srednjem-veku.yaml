          - {tekst: "Kvalitetna vina", odgovor: a, zasto: "Vina se donose u Srbiju."}
          - {tekst: "Živa stoka", odgovor: b, zasto: "Stoka se izvozi iz Srbije."}
          - {tekst: "Koža", odgovor: b, zasto: "Koža je stočni proizvod koji se izvozi."}
          - {tekst: "Ukrašeno oružje", odgovor: a, zasto: "Ukrašeno oružje je luksuzna roba koja se donosi u Srbiju."}
