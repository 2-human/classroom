          naslov: "Povelja o prijateljstvu i trgovini sa Dubrovnikom"
          tekst: "Srbin ne sme goniti Vlaha bez suda. Spor između Grada i vladareve zemlje rešavaju sudije po zakonu, a imovina se ne oduzima silom."
