          tekst: "Vladar se zajedno sa svojom decom zaklinje dubrovačkom knezu Žanu Dandolu i gradskoj opštini da će im biti prijatelj dokle god su iskreni."
          napomena: "Odlomak je prepričan; udžbenik, str. 37."
        pitanje: "Kome vladar daje zakletvu?"
        odgovori:
          - {tekst: "Dubrovačkom knezu Žanu Dandolu i gradskoj opštini", tacan: true}
          - {tekst: "Papi Inoćentiju III", tacan: false, zasto: "Papa se javlja u lekciji o Bosni; ovde je reč o Dubrovniku."}
          - {tekst: "Ugarskom kralju", tacan: false, zasto: "Povelja se obraća Dubrovniku."}
          - {tekst: "Svojoj deci", tacan: false, zasto: "Deca se zaklinju zajedno s njim, a zakletva je upućena Dubrovniku."}
        pomoc:
          - "Pročitaj kome se obraća u prvoj rečenici."
          - "Povelja je o prijateljstvu sa gradom."
          - "Iz lekcije: zakletva knezu Žanu Dandolu i gradskoj opštini."
        objasnjenje: "Zakletva je ugovor o prijateljstvu između srpskog vladara i Dubrovnika."
