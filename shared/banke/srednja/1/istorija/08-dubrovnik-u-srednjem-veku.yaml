          odeljak: "Iz istorijskih izvora: Povelja o prijateljstvu i trgovini"
          tekst: "Sa svojom decom polaže zakletvu knezu Žanu Dandolu i gradskoj opštini."

      - id: l08-ulo-izvor-obaveze
