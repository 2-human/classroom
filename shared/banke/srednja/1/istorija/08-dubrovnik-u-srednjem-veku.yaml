          naslov: "Povelja o prijateljstvu i trgovini sa Dubrovnikom"
          tekst: "Ako neprijatelj Dubrovnika pobegne u vladarevu zemlju i odatle bi činio štetu, vladar će ga izručiti."
          napomena: "Odlomak je prepričan; udžbenik, str. 37."
        pitanje: "Zašto je ova odredba bila važna za Dubrovnik?"
