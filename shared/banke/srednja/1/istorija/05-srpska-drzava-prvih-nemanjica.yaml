  # ==========================================================================
  - naslov: "Srpska država u periodu Nemanjića"
    zadaci:
      - id: l05-izbor-dinastija
        vrsta: izbor
        tezina: lako
        pojmovi: [nemanjici, dinastija, raska]
        pitanje: "Koja porodica je upravljala srpskom feudalnom državom koja se od XII veka razvijala u Raškoj?"
        odgovori:
          - {tekst: "Nemanjići", tacan: true}
          - {tekst: "krstaši", tacan: false, zasto: "Krstaši su ratnici iz zapadne Evrope koji su napadali Vizantiju; Raškom je upravljala porodica Nemanjić."}
          - {tekst: "bogumili", tacan: false, zasto: "Bogumili su bili verska zajednica, a ne vladarska porodica; Nemanja ih je progonio."}
          - {tekst: "vizantijski carevi", tacan: false, zasto: "Upravo od Vizantije se srpska država borila da postane nezavisna; vladali su joj Nemanjići."}
        pomoc:
          - "Pogledaj naslov lekcije."
          - "Porodica je dobila ime po svom rodonačelniku, Stefanu."
          - "Iz lekcije: od XII veka u Raškoj se razvija feudalna država kojom upravlja porodica Nemanjić."
        objasnjenje: "Feudalnom državom Srba koja se od XII veka razvijala u Raškoj upravljala je porodica Nemanjić."
        iz_udzbenika: {strana: 26, odeljak: "Uvod", tekst: "Od XII veka u Raškoj se razvija feudalna država Srba kojom upravlja porodica Nemanjić."}
        osa: {naziv: "Nastanak srpske feudalne države", od: 1100, do: 1200, traka: dogadjaji, oznaka: "XII vek"}

      - id: l05-izbor-titula-nemanje
        vrsta: izbor
        tezina: lako
        pojmovi: [stefan-nemanja, veliki-zupan]
        pitanje: "Koju je titulu imao Stefan Nemanja dok je vladao državom?"
        odgovori:
          - {tekst: "veliki župan", tacan: true}
          - {tekst: "patrijarh", tacan: false, zasto: "Patrijarh je crkveni poglavar; patrijarha u Nikeji Sava je pitao za samostalnost crkve, a Nemanja je svetovni vladar, veliki župan."}
          - {tekst: "arhiepiskop", tacan: false, zasto: "Arhiepiskop je crkvena titula; prvi srpski arhiepiskop bio je Nemanjin sin Sava."}
          - {tekst: "papa", tacan: false, zasto: "Papa je poglavar crkve u Rimu; od njega je Nemanjin sin Stefan dobio krunu."}
        pomoc:
          - "Traži svetovnu, a ne crkvenu titulu."
          - "Reč sadrži naziv koji su Srbi koristili još u pradomovini."
          - "Iz lekcije: veliki župan Stefan Nemanja vladao je 1166–1196."
        objasnjenje: "Stefan Nemanja je bio veliki župan; kraljevsku krunu dobiće tek njegov sin Stefan."
        iz_udzbenika: {strana: 26, odeljak: "Srpska država u periodu Nemanjića", tekst: "Veliki župan Stefan Nemanja vladao je od 1166. do 1196. godine.", slika: "05-srpska-drzava-prvih-nemanjica/02-stefan-nemanja-monah-simeon.jpg"}
        osa: {naziv: "Stefan Nemanja", od: 1166, do: 1196, traka: vladari}

      - id: l05-izbor-ras
        vrsta: izbor
        tezina: lako
        pojmovi: [ras, novi-pazar, nemanjici]
        pitanje: "Koje mesto je bilo prestonica u prvim decenijama vladavine Nemanjića?"
        odgovori:
          - {tekst: "Ras", tacan: true}
          - {tekst: "Žiča", tacan: false, zasto: "Žiča je manastir i od 1220. sedište arhiepiskopije, dakle crkveno, a ne državno središte."}
          - {tekst: "Nikeja", tacan: false, zasto: "U Nikeju su se preselili vizantijski car i patrijarh; srpska prestonica bila je Ras."}
          - {tekst: "Trnovo", tacan: false, zasto: "Trnovo je u Bugarskoj i tamo je umro Sveti Sava; prestonica Nemanjića bio je Ras."}
        pomoc:
          - "Mesto je u Raškoj i oblast nosi ime slično njemu."
          - "Nalazi se kod Novog Pazara."
          - "Iz lekcije: Ras, kod Novog Pazara, bio je prestonica u prvim decenijama vladavine Nemanjića."
        objasnjenje: "Ras, kod Novog Pazara, bio je prestonica Nemanjića u prvim decenijama njihove vladavine."
        iz_udzbenika: {strana: 26, odeljak: "Srpska država u periodu Nemanjića", tekst: "Ras kod Novog Pazara bio je prestonica u prvim decenijama vladavine Nemanjića.", slika: "05-srpska-drzava-prvih-nemanjica/01-stari-ras.jpg"}

      - id: l05-izbor-hilandar-gde
        vrsta: izbor
        tezina: lako
        pojmovi: [manastir-hilandar, sveta-gora]
        pitanje: "Gde se nalazi manastir Hilandar?"
        odgovori:
          - {tekst: "na Svetoj Gori", tacan: true}
          - {tekst: "kod Kraljeva", tacan: false, zasto: "Kod Kraljeva je manastir Žiča; Hilandar je na Svetoj Gori."}
          - {tekst: "kod Novog Pazara", tacan: false, zasto: "Kod Novog Pazara je Ras, stara prestonica; Hilandar je na Svetoj Gori."}
          - {tekst: "u Nikeji", tacan: false, zasto: "U Nikeju su se sklonili vizantijski car i patrijarh; Hilandar su Nemanja i Sava podigli na Svetoj Gori."}
        pomoc:
          - "Seti se kuda se Nemanja povukao pred kraj života."
          - "Tamo je Sava već bio monah."
          - "Iz lekcije: Nemanja i Sava podigli su Hilandar na Svetoj Gori."
        objasnjenje: "Hilandar je na Svetoj Gori, gde su ga zajedno podigli Nemanja i njegov sin Sava."
        iz_udzbenika: {strana: 27, odeljak: "Srpska država u periodu Nemanjića", tekst: "Na Svetoj Gori su Nemanja i njegov sin Sava podigli manastir Hilandar.", slika: "05-srpska-drzava-prvih-nemanjica/03-manastir-hilandar.jpg"}

      - id: l05-izbor-monaska-imena
        vrsta: izbor
        slika_u_pitanju: true
        tezina: lako
        pojmovi: [stefan-nemanja, monah-simeon]
        pitanje: "Pod kojim imenom je Stefan Nemanja prikazan kao monah na freski iz udžbenika?"
        odgovori:
          - {tekst: "Simeon", tacan: true}
          - {tekst: "Sava", tacan: false, zasto: "Sava je Nemanjin najmlađi sin, koji je monah bio pre oca; Nemanja je kao monah Simeon."}
          - {tekst: "Jeftimije", tacan: false, zasto: "Jeftimije je episkop sa kojim se Nemanja savetovao o bogumilima."}
          - {tekst: "Stefan", tacan: false, zasto: "Stefan je njegovo svetovno ime, a tako se zvao i sin koji ga je nasledio; monaško ime mu je Simeon."}
        pomoc:
          - "Monah dobija novo ime, drugačije od svetovnog."
          - "Ne mešaj ga sa imenom njegovog sina monaha."
          - "Iz lekcije: slika 21 prikazuje Stefana Nemanju kao monaha Simeona."
        objasnjenje: "Kao monah, Stefan Nemanja nosi ime Simeon, a tako ga prikazuje i freska iz udžbenika."
        iz_udzbenika: {strana: 26, odeljak: "Srpska država u periodu Nemanjića", tekst: "Freska prikazuje Stefana Nemanju kao monaha Simeona, sa dugom belom bradom i u monaškoj odeći.", slika: "05-srpska-drzava-prvih-nemanjica/02-stefan-nemanja-monah-simeon.jpg"}

      - id: l05-izbor-unutrasnjost
        vrsta: izbor
        tezina: srednje
        pojmovi: [stefan-nemanja, zapadna-morava, velika-morava, kosovo, hvosno]
        pitanje: "Koje oblasti u unutrašnjosti je osvojio Stefan Nemanja? (više tačnih)"
        odgovori:
          - {tekst: "krajeve uz Zapadnu i Veliku Moravu", tacan: true}
          - {tekst: "Kosovo", tacan: true}
          - {tekst: "Hvosno (Metohiju)", tacan: true}
          - {tekst: "Zahumlje", tacan: false, zasto: "Nemanja jeste osvojio Zahumlje, ali je ono u primorju, a pitanje traži unutrašnjost."}
          - {tekst: "Duklju", tacan: false, zasto: "Duklja je takođe osvojena, ali spada u primorske oblasti."}
        pomoc:
          - "Podeli osvajanja na kopno u unutrašnjosti i obalu."
          - "Tri odgovora su tačna: reke i dve oblasti na jugu."
          - "Iz lekcije: u unutrašnjosti krajevi uz Zapadnu i Veliku Moravu, Kosovo i Hvosno (Metohija)."
        objasnjenje: "U unutrašnjosti je Nemanja osvojio krajeve uz Zapadnu i Veliku Moravu, Kosovo i Hvosno; Zahumlje i Duklja su u primorju."
        iz_udzbenika: {strana: 26, odeljak: "Srpska država u periodu Nemanjića", tekst: "U unutrašnjosti je Nemanja osvojio krajeve uz Zapadnu i Veliku Moravu, Kosovo i Hvosno.", slika: "05-srpska-drzava-prvih-nemanjica/04-srpske-zemlje-kraj-xii-pocetak-xiii-veka-karta.jpg"}

      - id: l05-izbor-primorje
        vrsta: izbor
        tezina: srednje
        pojmovi: [stefan-nemanja, zahumlje, travunija, duklja, severna-albanija]
        pitanje: "Koje primorske oblasti je Stefan Nemanja uključio u svoju državu? (više tačnih)"
        odgovori:
          - {tekst: "Zahumlje", tacan: true}
          - {tekst: "Travuniju", tacan: true}
          - {tekst: "Duklju", tacan: true}
          - {tekst: "severnu Albaniju", tacan: true}
          - {tekst: "Hvosno", tacan: false, zasto: "Hvosno, odnosno Metohija, jeste osvojeno, ali spada u unutrašnjost."}
          - {tekst: "Kosovo", tacan: false, zasto: "Kosovo je osvojeno, ali nije primorska oblast, već deo unutrašnjosti."}
        pomoc:
          - "Pogledaj koje su oblasti uz more."
          - "Četiri odgovora su tačna."
          - "Iz lekcije: u primorju Zahumlje, Travunija, Duklja i severna Albanija."
        objasnjenje: "Primorska osvajanja su Zahumlje, Travunija, Duklja i severna Albanija."
        iz_udzbenika: {strana: 27, odeljak: "Srpska država u periodu Nemanjića", tekst: "U primorju je Nemanja osvojio Zahumlje, Travuniju, Duklju i severnu Albaniju.", slika: "05-srpska-drzava-prvih-nemanjica/04-srpske-zemlje-kraj-xii-pocetak-xiii-veka-karta.jpg"}

      - id: l05-izbor-najmladji-sin
        vrsta: izbor
        tezina: srednje
        pojmovi: [stefan-nemanja, sveti-sava, sveta-gora]
        pitanje: "Zašto je Sava već bio na Svetoj Gori kada je tamo stigao njegov otac?"
        odgovori:
          - {tekst: "Tamo je već bio monah", tacan: true}
          - {tekst: "Upravljao je srpskom državom sa Svete Gore", tacan: false, zasto: "Državom je posle Nemanje upravljao njegov sin Stefan; Sava je na Svetoj Gori bio monah."}
          - {tekst: "Bio je tamo arhiepiskop", tacan: false, zasto: "Arhiepiskop je postao tek 1219, u Nikeji, a Nemanja je umro 1199."}
          - {tekst: "Pobegao je pred krstašima iz Carigrada", tacan: false, zasto: "Iz Carigrada su u Nikeju otišli vizantijski car i patrijarh; Sava sa tim nema veze, on je na Svetoj Gori bio monah."}
        pomoc:
          - "Šta se na Svetoj Gori radi, ko tamo živi?"
          - "Pazi na vreme: crkvene službe dobija tek mnogo kasnije."
          - "Iz lekcije: Nemanja je otišao na Svetu Goru, gde je već bio monah njegov najmlađi sin Sava."
        objasnjenje: "Sava, najmlađi Nemanjin sin, bio je monah na Svetoj Gori pre nego što se tamo povukao njegov otac."
        iz_udzbenika: {strana: 27, odeljak: "Srpska država u periodu Nemanjića", tekst: "Pred kraj života Nemanja je otišao na Svetu Goru, gde je već bio monah njegov najmlađi sin Sava."}

      - id: l05-izbor-hilandar-znacaj
        vrsta: izbor
        tezina: srednje
        pojmovi: [manastir-hilandar, manastir-zica]
        pitanje: "Kakvu je ulogu imao Hilandar za Srbe u srednjem veku?"
        odgovori:
          - {tekst: "Postao je središte srpske srednjovekovne kulture", tacan: true}
          - {tekst: "Bio je prestonica velikih župana", tacan: false, zasto: "Prestonica u prvim decenijama Nemanjića bio je Ras, dok je Hilandar manastir na Svetoj Gori."}
          - {tekst: "Bio je sedište srpske arhiepiskopije od 1220.", tacan: false, zasto: "Sedište arhiepiskopije od 1220. bila je Žiča kod Kraljeva."}
          - {tekst: "Služio je kao tvrđava protiv krstaša", tacan: false, zasto: "Knjiga Hilandar opisuje kao manastir i središte kulture, a ne kao vojno utvrđenje."}
        pomoc:
          - "Ne mešaj Hilandar i Žiču."
          - "Uloga mu nije državna ni vojna."
          - "Iz lekcije: Hilandar je postao središte srpske srednjovekovne kulture."
        objasnjenje: "Hilandar je bio središte srpske srednjovekovne kulture, a Žiča sedište arhiepiskopije."
        iz_udzbenika: {strana: 27, odeljak: "Srpska država u periodu Nemanjića", tekst: "Hilandar je postao središte srpske srednjovekovne kulture.", slika: "05-srpska-drzava-prvih-nemanjica/03-manastir-hilandar.jpg"}

      - id: l05-izbor-bogumili-gde
        vrsta: izbor
        tezina: srednje
        pojmovi: [bogumili]
        pitanje: "U kojoj zemlji knjiga posebno ističe delatnost bogumila u Nemanjino vreme?"
        odgovori:
          - {tekst: "u Bosni", tacan: true}
          - {tekst: "u Duklji", tacan: false, zasto: "Duklja je primorska oblast koju je Nemanja osvojio; bogumili su bili naročito delatni u Bosni."}
          - {tekst: "u Nikeji", tacan: false, zasto: "Nikeja je mesto gde su se preselili vizantijski car i patrijarh, a ne središte bogumila."}
          - {tekst: "na Svetoj Gori", tacan: false, zasto: "Sveta Gora je pravoslavno monaško središte; bogumili su bili naročito delatni u Bosni."}
        pomoc:
          - "Knjiga je navodi kao zemlju gde su bili najdelatniji."
          - "Ime zemlje počinje slovom B."
          - "Iz lekcije: bogumili su bili naročito delatni u Bosni."
        objasnjenje: "Bogumili se javljaju i u Srbiji, ali su bili naročito delatni u Bosni."
        iz_udzbenika: {strana: 27, odeljak: "Srpska država u periodu Nemanjića", tekst: "Za vreme Nemanje u Srbiji se javlja verska zajednica bogumila, naročito delatna u Bosni."}

      - id: l05-izbor-zupan-staro
        vrsta: izbor
        tezina: tesko
        pojmovi: [zupan, veliki-zupan]
        pitanje: "Knjiga kaže da su Srbi titulu župan imali još u pradomovini. Šta iz toga sledi?"
        odgovori:
          - {tekst: "Titula je starija od države Nemanjića", tacan: true}
          - {tekst: "Titulu je izmislio Stefan Nemanja", tacan: false, zasto: "Ako je postojala još u pradomovini, nastala je mnogo pre Nemanje, koji vlada od 1166."}
          - {tekst: "Titulu su Srbi preuzeli od krstaša", tacan: false, zasto: "Krstaši stižu u vreme Stefana Nemanjića; titula župan je od njih mnogo starija."}
          - {tekst: "Titulu je Srbima dodelio rimski papa", tacan: false, zasto: "Papa je dao kraljevsku krunu 1217; župan je stara titula Srba iz pradomovine."}
        pomoc:
          - "Šta znači reč pradomovina: da li je to pre ili posle dolaska na Balkan?"
          - "Uporedi to sa vremenom kada živi Nemanja."
          - "Iz lekcije: titulu župan Srbi su imali još u pradomovini."
        objasnjenje: "Pošto su Srbi tu titulu imali još u pradomovini, ona je mnogo starija od Nemanjine države."
        iz_udzbenika: {strana: 27, odeljak: "Srpska država u periodu Nemanjića", tekst: "Nemanja se smatra tvorcem nezavisne srpske države, a titulu župan Srbi su imali još u pradomovini."}

