        uzor: "Nemanja je potpuno ugušio njihovo delovanje u Srbiji. Posle saveta sa episkopom, monasima i velikašima poslao je vojsku: jedne je kaznio, druge proterao, a vođi je odsečen jezik. To znamo iz biografije koju je napisao njegov sin Stefan Prvovenčani."
        ideje: ["Potpuno je ugušio njihovo delovanje u Srbiji.", "Korišćene su teške kazne i proterivanje.", "Izvor je biografija koju je napisao Stefan Prvovenčani."]
        objasnjenje: "Pored činjenice treba navesti i izvor iz kog je znamo."
        iz_udzbenika: {strana: 29, odeljak: "Iz istorijskih izvora", tekst: "Biografija Nemanje opisuje progon bogumila: kazne, proterivanje i kažnjavanje njihovog vođe."}

      - id: l05-objasni-hilandar
        vrsta: objasni
        tezina: lako
        pojmovi: [manastir-hilandar, sveta-gora, stefan-nemanja, sveti-sava]
        pitanje: "Ko je podigao Hilandar, gde je i zašto je važan za Srbe?"
        uzor: "Hilandar su podigli Stefan Nemanja i njegov sin Sava. Nalazi se na Svetoj Gori. Važan je zato što je postao središte srpske srednjovekovne kulture."
