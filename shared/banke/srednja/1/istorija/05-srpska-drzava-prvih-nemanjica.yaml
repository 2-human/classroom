          - "Iz lekcije: rodonačelnik dinastije je Stefan Nemanja."
        objasnjenje: "Netačno. Rodonačelnik je Stefan Nemanja, a Sava je njegov najmlađi sin."
        iz_udzbenika: {strana: 26, odeljak: "Uvod", tekst: "Rodonačelnik dinastije Nemanjić bio je Stefan Nemanja."}

      - id: l05-tn-ras-prestonica
        vrsta: tacno_netacno
        tezina: lako
        pojmovi: [ras, novi-pazar]
        tvrdnja: "Ras se nalazi kod Novog Pazara."
        tacno: true
        pomoc:
