        tezina: srednje
        pojmovi: [stefan-nemanja, vizantija]
        pitanje: "Objasni zašto kažemo da je Nemanja nezavisnost osvajao postepeno, a ne odjednom."
        uzor: "Najpre je morao da pobedi u unutrašnjim borbama i učvrsti vlast u Raškoj. Zatim je ratovao sa Vizantijom i širio državu u unutrašnjosti i primorju. Ni poraz na Moravi 1190. nije sve poništio, jer je veći deo zemalja zadržan."
