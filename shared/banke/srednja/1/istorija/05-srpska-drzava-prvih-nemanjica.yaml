      - id: l05-tn-nemanja-umro
        vrsta: tacno_netacno
        tezina: lako
        pojmovi: [stefan-nemanja, manastir-hilandar]
        tvrdnja: "Stefan Nemanja je umro u Rasu dok je još bio na vlasti."
