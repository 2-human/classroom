        objasnjenje: "Tri dela odgovora: ko, gde i zašto je važan."
        iz_udzbenika: {strana: 27, odeljak: "Srpska država u periodu Nemanjića", tekst: "Nemanja i Sava su podigli Hilandar, koji je postao središte srpske srednjovekovne kulture.", slika: "05-srpska-drzava-prvih-nemanjica/03-manastir-hilandar.jpg"}

      - id: l05-objasni-tesko-izvor-i-cilj
        vrsta: objasni
        tezina: tesko
        pojmovi: [bogumili, stefan-nemanja, stefan-prvovencani]
        pitanje: "Zašto biografiju Nemanje ne možemo da uzmemo kao potpuno nepristrasan opis događaja, iako je to važan izvor?"
        uzor: "Autor je Nemanjin sin Stefan Prvovenčani, pa piše o svom ocu i sa strane vlasti. Progon predstavlja kao ispravan i ne prenosi glas bogumila. Izvor je ipak važan, jer nam govori šta je vlast radila i kako je o tome mislila."
        ideje: ["Autor je Nemanjin sin.", "Piše sa strane vlasti i progonitelja.", "Glas bogumila ne čujemo.", "Izvor je ipak koristan jer pokazuje postupke i stav vlasti."]
        objasnjenje: "Izvor treba čitati sa pitanjem ko ga je napisao i zašto."
        iz_udzbenika: {strana: 29, odeljak: "Iz istorijskih izvora", tekst: "O progonu bogumila pisao je Stefan Prvovenčani, sin čoveka koji je progon naredio."}

