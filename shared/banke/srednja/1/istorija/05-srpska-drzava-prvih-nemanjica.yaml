        objasnjenje: "Postepeno znači kroz više faza, a ne jednim događajem."
        iz_udzbenika: {strana: 26, odeljak: "Srpska država u periodu Nemanjića", tekst: "Nemanja se učvrstio posle unutrašnjih borbi, ratovao za nezavisnost i sačuvao veći deo osvojenog."}

      - id: l05-objasni-zasto-bogumili
