        vrsta: tacno_netacno
        tezina: lako
        pojmovi: [stefan-nemanja]
        tvrdnja: "Stefan Nemanja je nezavisnost osvajao postepeno, a ne jednim potezom."
        tacno: true
        pomoc:
          - "Seti se: prvo unutrašnje borbe, pa rat, pa osvajanja."
          - "Iz lekcije: rodonačelnik dinastije nezavisnost je osvajao postepeno."
        objasnjenje: "Tačno. Nezavisnost je dolazila korak po korak, kroz borbe u zemlji i rat sa Vizantijom."
        iz_udzbenika: {strana: 26, odeljak: "Uvod", tekst: "Rodonačelnik dinastije, Stefan Nemanja, nezavisnost je osvajao postepeno."}

