delovi:
  # ==========================================================================
  - naslov: "Uspon i širenje kraljevine Srbije"
    zadaci:
      - id: l06-izbor-sasi-ko
        vrsta: izbor
        tezina: lako
        pojmovi: [sasi, rudarstvo, erdelj]
        pitanje: "Ko su bili Sasi?"
        odgovori:
          - {tekst: "nemački rudari", tacan: true}
          - {tekst: "dubrovački trgovci", tacan: false, zasto: "Trgovinu su razvijali Dubrovčani, a Sasi su bili nemački rudari."}
          - {tekst: "vizantijski velikaši", tacan: false, zasto: "Sasi nisu Vizantinci; došli su iz Erdelja kao vešti rudari."}
          - {tekst: "krupno srpsko plemstvo", tacan: false, zasto: "Krupno plemstvo su vlastela ili velmože; Sasi su došljaci rudari."}
        pomoc:
          - "Uz njih se otvara mnogo rudnika."
          - "Došli su iz Erdelja, ali su po poreklu Nemci."
          - "Iz lekcije: za vreme Uroša I iz Erdelja stižu vešti nemački rudari Sasi."
        objasnjenje: "Sasi su vešti nemački rudari koji su u Srbiju stigli iz Erdelja za vreme Uroša I."
        iz_udzbenika: {strana: 30, odeljak: "Uspon i širenje kraljevine Srbije", tekst: "Za vreme Uroša I iz Erdelja stižu vešti nemački rudari Sasi."}

      - id: l06-izbor-trgovina-ko
        vrsta: izbor
        tezina: lako
        pojmovi: [dubrovcani]
        pitanje: "Ko je u ovom razdoblju razvijao trgovinu u Srbiji?"
        odgovori:
          - {tekst: "Dubrovčani", tacan: true}
          - {tekst: "Sasi", tacan: false, zasto: "Sasi su bili rudari; trgovinu su razvijali Dubrovčani."}
          - {tekst: "Turci Osmanlije", tacan: false, zasto: "Osmanlije se javljaju kao osvajači u drugoj polovini XIV veka, a ne kao nosioci trgovine u Srbiji."}
          - {tekst: "zavisni seljaci", tacan: false, zasto: "Zavisni seljaci su obrađivali zemlju; trgovinu su razvijali Dubrovčani."}
        pomoc:
          - "Rudari i trgovci su različite grupe."
          - "Trgovci su došli iz grada na Jadranu."
          - "Iz lekcije: trgovinu razvijaju Dubrovčani."
        objasnjenje: "Dok su Sasi otvarali rudnike, trgovinu su razvijali Dubrovčani."
        iz_udzbenika: {strana: 30, odeljak: "Uvod", tekst: "U Srbiju dolaze nemački rudari, a trgovinu razvijaju Dubrovčani."}

      - id: l06-izbor-jelena-veroispovest
        vrsta: izbor
        tezina: lako
        pojmovi: [jelena-anzujska, stefan-uros-i]
        pitanje: "Ko je bila Jelena Anžujska?"
        odgovori:
          - {tekst: "francuska princeza i žena kralja Uroša I", tacan: true}
          - {tekst: "ćerka cara Dušana", tacan: false, zasto: "Jelena je bila žena Uroša I, mnogo pre Dušanovog vremena."}
          - {tekst: "bosanska banica", tacan: false, zasto: "Bila je francuska princeza, a ne vladarka Bosne."}
          - {tekst: "vizantijska carica", tacan: false, zasto: "Knjiga je opisuje kao francusku princezu i ženu Uroša I."}
        pomoc:
          - "Ime Anžujska upućuje na njeno zapadno poreklo."
          - "Bila je katolkinja na srpskom dvoru."
          - "Iz lekcije: Uroš I je oženio francusku princezu Jelenu Anžujsku."
        objasnjenje: "Jelena Anžujska je francuska princeza koju je oženio Uroš I."
        iz_udzbenika: {strana: 30, odeljak: "Uspon i širenje kraljevine Srbije", tekst: "Uroš I je oženio francusku princezu Jelenu Anžujsku."}

      - id: l06-izbor-sta-kopa
        vrsta: izbor
        tezina: srednje
        pojmovi: [srebro, olovo, rudarstvo]
        pitanje: "Šta se kopalo u srpskim rudnicima? (više tačnih)"
        odgovori:
          - {tekst: "srebro", tacan: true}
          - {tekst: "olovo", tacan: true}
          - {tekst: "so", tacan: false, zasto: "Knjiga navodi srebro, olovo i druge skupocene metale, a so nije metal."}
          - {tekst: "ugalj", tacan: false, zasto: "Ugalj se u lekciji ne pominje; kopali su se srebro i olovo."}
        pomoc:
          - "Traže se metali."
          - "Dva odgovora su tačna."
          - "Iz lekcije: kopali su se srebro i olovo i drugi skupoceni metali."
        objasnjenje: "U rudnicima su se kopali srebro, olovo i drugi skupoceni metali."
        iz_udzbenika: {strana: 30, odeljak: "Uspon i širenje kraljevine Srbije", tekst: "Kopali su se srebro i olovo i drugi skupoceni metali.", slika: "06-uspon-srbije-xiii-xiv-vek/06-srednjovekovni-srpski-novac.jpg"}

      - id: l06-izbor-privreda-uros
        vrsta: izbor
        tezina: srednje
        pojmovi: [stefan-uros-i, rudarstvo, trgovi, gradovi]
        pitanje: "Šta je bilo novo u privredi Srbije pod Urošem I u odnosu na ranije?"
        odgovori:
          - {tekst: "Uz zemljoradnju i stočarstvo razvija se rudarstvo, a zatim trgovi i gradovi", tacan: true}
          - {tekst: "Zemljoradnja je potpuno napuštena", tacan: false, zasto: "Zemljoradnja i stočarstvo su ostali; rudarstvo im se pridružilo."}
          - {tekst: "Država je prvi put počela da ratuje", tacan: false, zasto: "Ratovalo se i ranije; pod Urošem I težište je na privredi."}
          - {tekst: "Sasi su preuzeli presto", tacan: false, zasto: "Sasi su bili rudari, a presto je ostao Nemanjićima."}
        pomoc:
          - "Traži šta je dodato starim zanimanjima."
          - "Prvo rudnici, pa mesta trgovine."
          - "Iz lekcije: uz zemljoradnju i stočarstvo razvija se rudarstvo, a zatim trgovi i gradovi."
        objasnjenje: "Staroj zemljoradnji i stočarstvu pridružuje se rudarstvo, a sa njim rastu trgovi i gradovi."
        iz_udzbenika: {strana: 30, odeljak: "Uspon i širenje kraljevine Srbije", tekst: "Pod Urošem I razvija se rudarstvo, a zatim trgovi i gradovi kao mesta trgovine."}
        osa: {naziv: "Stefan Uroš I", od: 1243, do: 1276, traka: vladari}

      - id: l06-izbor-rudnici-gde
        vrsta: izbor
        tezina: srednje
        pojmovi: [brskovo, novo-brdo]
        pitanje: "Koja dva rudnika knjiga posebno navodi?"
        odgovori:
          - {tekst: "Brskovo na Tari i Novo Brdo kod Kosova", tacan: true}
          - {tekst: "Gradac i Banjsku", tacan: false, zasto: "To su manastiri: Gradac je Jelenina, a Banjska Milutinova zadužbina."}
          - {tekst: "Velbužd i Ser", tacan: false, zasto: "Velbužd je mesto bitke, a Ser grad u kom se Dušan proglasio za cara."}
          - {tekst: "Braničevo i Hum", tacan: false, zasto: "To su oblasti: Braničevo je vezano za Milutina, a Hum za gubitak pod Dušanom."}
        pomoc:
          - "Jedan je na reci Tari."
          - "Drugi u imenu ima reč brdo."
          - "Iz lekcije: važni rudnici su Brskovo na Tari i Novo Brdo kod Kosova."
        objasnjenje: "Knjiga izdvaja Brskovo na Tari i Novo Brdo kod Kosova."
        iz_udzbenika: {strana: 30, odeljak: "Uspon i širenje kraljevine Srbije", tekst: "Otvoreni su važni rudnici, među njima Brskovo na Tari i Novo Brdo kod Kosova."}

      - id: l06-izbor-radoslav-vladislav
        vrsta: izbor
        tezina: srednje
        pojmovi: [stefan-radoslav, stefan-vladislav, stefan-uros-i]
        pitanje: "U kakvom su odnosu bila trojica kraljeva koji su vladali posle Stefana Prvovenčanog?"
        odgovori:
          - {tekst: "Bili su njegovi sinovi: Radoslav, Vladislav i Uroš I", tacan: true}
          - {tekst: "Bili su njegova braća", tacan: false, zasto: "Bili su mu sinovi, a ne braća."}
          - {tekst: "Bili su vizantijski namesnici", tacan: false, zasto: "To su Nemanjići, kraljevi Srbije."}
          - {tekst: "Bili su unuci Stefana Dušana", tacan: false, zasto: "Dušan živi mnogo kasnije; ova trojica su sinovi Stefana Prvovenčanog."}
        pomoc:
          - "Presto ostaje u porodici Nemanjić."
          - "Radi se o sledećoj generaciji."
          - "Iz lekcije: presto su redom držali njegovi sinovi."
        objasnjenje: "Posle Stefana Prvovenčanog vladali su redom njegovi sinovi Radoslav, Vladislav i Uroš I."
        iz_udzbenika: {strana: 30, odeljak: "Uspon i širenje kraljevine Srbije", tekst: "Posle Stefana Prvovenčanog presto su redom držali njegovi sinovi."}

      - id: l06-tn-sukobi
        vrsta: tacno_netacno
        tezina: lako
        pojmovi: [dinasticki-sukobi, nemanjici]
        tvrdnja: "Tipična pojava ovog doba bili su sukobi unutar dinastije oko nasleđivanja prestola."
        tacno: true
        pomoc:
          - "Seti se kako je Dušan došao na vlast."
          - "Iz lekcije: tipična pojava tog doba su sukobi unutar dinastije oko prestola."
        objasnjenje: "Tačno. Sukobi oko prestola bili su česti, a Dušan je čak silom preuzeo vlast od oca."
        iz_udzbenika: {strana: 30, odeljak: "Uvod", tekst: "Tipična pojava tog doba su sukobi unutar dinastije oko nasleđivanja prestola."}

      - id: l06-tn-jelena-katolkinja
        vrsta: tacno_netacno
        tezina: lako
        pojmovi: [jelena-anzujska]
        tvrdnja: "Jelena Anžujska je prešla u pravoslavlje kada se udala za Uroša I."
        tacno: false
        ispravke:
          - {tekst: "Ostala je katolkinja, ali je poštovala Srpsku pravoslavnu crkvu.", tacan: true}
          - {tekst: "Prešla je u pravoslavlje, a katolike je progonila.", tacan: false, zasto: "Ostala je katolkinja, a cenili su je i pravoslavni i katolici."}
          - {tekst: "Bila je bogumilka.", tacan: false, zasto: "Knjiga kaže da je bila katolkinja."}
        pomoc:
          - "Poreklom je sa zapada."
          - "Bila je ktitor i pored druge vere."
          - "Iz lekcije: ostala je katolkinja, ali je poštovala Srpsku pravoslavnu crkvu."
        objasnjenje: "Netačno. Jelena je ostala katolkinja, ali je poštovala pravoslavnu crkvu i bila njen ktitor."
        iz_udzbenika: {strana: 30, odeljak: "Uspon i širenje kraljevine Srbije", tekst: "Ostala je katolkinja, ali je poštovala Srpsku pravoslavnu crkvu i bila njen ktitor."}

      - id: l06-tn-dragutin
        vrsta: tacno_netacno
        tezina: srednje
        pojmovi: [stefan-dragutin, kralj-milutin]
        tvrdnja: "Dragutin je od brata Milutina preuzeo presto."
        tacno: false
        ispravke:
          - {tekst: "Dragutin je presto ustupio bratu Milutinu.", tacan: true}
          - {tekst: "Dragutin je presto ustupio sinu Dušanu.", tacan: false, zasto: "Dušan nije Dragutinov sin; Dragutin je presto ustupio bratu."}
          - {tekst: "Dragutin je presto izgubio u bici kod Velbužda.", tacan: false, zasto: "Velbužd je 1330, u vreme Stefana Dečanskog."}
        pomoc:
          - "Pazi na redosled vladanja."
          - "Dragutin vlada pre Milutina."
          - "Iz lekcije: Dragutin (1276–1282) ustupio je presto bratu Milutinu."
        objasnjenje: "Netačno. Dragutin je vladao pre Milutina i ustupio mu je presto."
        iz_udzbenika: {strana: 31, odeljak: "Uspon i širenje kraljevine Srbije", tekst: "Urošev sin Stefan Dragutin (1276–1282) ustupio je presto bratu Milutinu."}
        osa: {naziv: "Stefan Dragutin", od: 1276, do: 1282, traka: vladari}

      - id: l06-tn-feudalni-poredak
        vrsta: tacno_netacno
        tezina: srednje
        pojmovi: [feudalno-drustvo]
        tvrdnja: "U XIII i XIV veku feudalni društveni poredak u Srbiji dobija potpun oblik."
        tacno: true
        pomoc:
          - "Pogledaj uvod lekcije."
          - "Iz lekcije: u XIII i XIV veku feudalni poredak dobija potpun oblik."
        objasnjenje: "Tačno. U tom razdoblju feudalni poredak se u Srbiji potpuno oblikuje."
        iz_udzbenika: {strana: 30, odeljak: "Uvod", tekst: "U XIII i XIV veku feudalni društveni poredak u Srbiji dobija potpun oblik."}
        osa: {naziv: "Razvoj feudalnog društva u Srbiji", od: 1100, do: 1400, traka: dogadjaji, oznaka: "od XII do XIV veka"}

      - id: l06-dopuni-rudari-lako
        vrsta: dopuni
        tezina: lako
        pojmovi: [sasi, dubrovcani, stefan-uros-i]
        pitanje: "Dopuni rečenicu."
        tekst: "Za vreme kralja {{Uroša I}} nemački rudari {{Sasi}} otvaraju rudnike, a trgovinu razvijaju {{Dubrovčani}}."
        ponudjene: ["Uroša I", "Sasi", "Dubrovčani", "Dušana", "Grci", "Osmanlije"]
        pomoc:
          - "Vladar je sin Stefana Prvovenčanog."
          - "Rudari su Nemci."
          - "Iz lekcije: Sasi dolaze za vreme Uroša I, a trgovinu razvijaju Dubrovčani."
        objasnjenje: "Pod Urošem I dolaze Sasi, a uz njih trgovinu razvijaju Dubrovčani."
        iz_udzbenika: {strana: 30, odeljak: "Uspon i širenje kraljevine Srbije", tekst: "Za vreme Uroša I stižu Sasi, a trgovinu razvijaju Dubrovčani."}

      - id: l06-dopuni-vladari-tesko
        vrsta: dopuni
        tezina: tesko
        pojmovi: [stefan-radoslav, stefan-vladislav, stefan-uros-i, stefan-dragutin, kralj-milutin]
        pitanje: "Dopuni niz vladara (bez ponuđenih reči)."
        tekst: "Posle Stefana Prvovenčanog vladaju njegovi sinovi Radoslav, {{Vladislav}} i Uroš I, a zatim Urošev sin {{Dragutin}}, koji presto ustupa bratu {{Milutinu}}."
        pomoc:
          - "Dva brata, a zatim dvojica Uroševih sinova."
          - "Poslednji je veliki ktitor."
          - "Iz lekcije: Radoslav, Vladislav, Uroš I, Dragutin, Milutin."
        objasnjenje: "Niz je Radoslav, Vladislav, Uroš I, Dragutin, Milutin."
        iz_udzbenika: {strana: 31, odeljak: "Uspon i širenje kraljevine Srbije", tekst: "Presto drže Radoslav, Vladislav, Uroš I, Dragutin i Milutin."}

      - id: l06-povezi-privreda
        vrsta: povezi
        tezina: lako
        pojmovi: [sasi, dubrovcani, brskovo, jelena-anzujska]
        pitanje: "Poveži pojam sa onim što ga opisuje."
        parovi:
          - ["Sasi", "nemački rudari iz Erdelja"]
          - ["Dubrovčani", "razvijali su trgovinu"]
          - ["Brskovo", "rudnik na Tari"]
          - ["Gradac", "zadužbina Jelene Anžujske"]
        pomoc:
          - "Dve grupe ljudi i dva mesta."
          - "Gradac je manastir."
          - "Iz lekcije: Sasi su rudari, Dubrovčani trgovci, Brskovo rudnik, a Gradac Jelenina zadužbina."
        objasnjenje: "Sasi su rudari, Dubrovčani trgovci, Brskovo rudnik, Gradac zadužbina."
        iz_udzbenika: {strana: 30, odeljak: "Uspon i širenje kraljevine Srbije", tekst: "Sasi i Dubrovčani jačaju privredu, a Jelena Anžujska podiže Gradac."}

      - id: l06-zakljuci-jelena-ktitor
        vrsta: zakljuci
        tezina: srednje
        pojmovi: [jelena-anzujska, ktitor]
        pitanje: "Jelena je ostala katolkinja, a bila je ktitor pravoslavne crkve. Šta iz toga zaključujemo?"
        odgovori:
          - {tekst: "Različita vera nije sprečila vladarku da poštuje i pomaže crkvu svoje nove zemlje", tacan: true}
          - {tekst: "Katolici u Srbiji nisu smeli da imaju svoju veru", tacan: false, zasto: "Jelena je ostala katolkinja i cenili su je i katolici."}
          - {tekst: "Ona je zapravo tajno bila pravoslavna", tacan: false, zasto: "Knjiga kaže da je ostala katolkinja."}
          - {tekst: "Pravoslavna crkva je odbila njenu pomoć", tacan: false, zasto: "Bila je njen ktitor, a cenili su je i pravoslavni."}
        pomoc:
          - "Korak 1: Koje je vere bila?"
          - "Korak 2: Kako se ponašala prema pravoslavnoj crkvi?"
          - "Iz lekcije: cenili su je i pravoslavni i katolici."
        objasnjenje: "Jelena pokazuje da su katolkinja na dvoru i pravoslavna crkva mogle da sarađuju."
        iz_udzbenika: {strana: 30, odeljak: "Uspon i širenje kraljevine Srbije", tekst: "Ostala je katolkinja, poštovala je pravoslavnu crkvu i cenili su je i pravoslavni i katolici."}

      - id: l06-zakljuci-rudnici-gradovi
        vrsta: zakljuci
        tezina: srednje
        pojmovi: [rudarstvo, trgovi, gradovi]
        pitanje: "Zašto knjiga navodi da su se trgovi i gradovi razvili posle rudarstva?"
        odgovori:
          - {tekst: "Rudno bogatstvo je trebalo prodavati, pa su rasla mesta trgovine", tacan: true}
          - {tekst: "Gradove su osnovali monasi radi hodočašća", tacan: false, zasto: "Knjiga trgove i gradove opisuje kao mesta trgovine."}
          - {tekst: "Gradovi su služili samo kao vojne tvrđave", tacan: false, zasto: "Lekcija ih navodi kao mesta trgovine."}
          - {tekst: "Rudari su odbijali da žive na selu", tacan: false, zasto: "O tome knjiga ništa ne kaže; veza je trgovina."}
        pomoc:
          - "Korak 1: Šta se radi sa srebrom i olovom?"
          - "Korak 2: Gde se trguje?"
          - "Iz lekcije: dolazak Sasa → rudnici → razvoj rudarstva, zatim trgova i gradova."
        objasnjenje: "Rudnici proizvode robu vrednu trgovine, a trgovini su potrebna mesta: trgovi i gradovi."
        iz_udzbenika: {strana: 30, odeljak: "Uzrok → posledica", tekst: "Dolazak Sasa doveo je do rudnika, a zatim do trgova i gradova."}

      - id: l06-zakljuci-strana-znanja
        vrsta: zakljuci
        tezina: tesko
        pojmovi: [sasi, dubrovcani, jelena-anzujska]
        pitanje: "Sasi, Dubrovčani i Jelena Anžujska došli su izvan Srbije. Šta to govori o njenom usponu?"
        odgovori:
