        iz_udzbenika: {strana: 31, odeljak: "Dalje širenje državne teritorije", tekst: "Dvorovi velikih župana u Rasu bili su obične drvene kuće sa palisadama."}

      - id: l06-tn-dusan-u-velbuzdu-i-bosni
        vrsta: tacno_netacno
        tezina: srednje
        pojmovi: [car-dusan]
        tvrdnja: "Dušan se u borbama dokazao tek kada je postao vladar."
        tacno: false
        ispravke:
          - {tekst: "Dokazao se još pre stupanja na presto, protiv bosanskog vladara i kod Velbužda.", tacan: true}
          - {tekst: "Nikada nije učestvovao u borbama.", tacan: false, zasto: "Učestvovao je, a kao vladar je osvojio velike delove vizantijskih zemalja."}
          - {tekst: "Dokazao se samo u borbi protiv Turaka.", tacan: false, zasto: "Knjiga navodi bosanskog vladara i Velbužd."}
        pomoc:
          - "Pazi na reč tek."
          - "Velbužd je 1330, a on vlada od 1331."
          - "Iz lekcije: još pre stupanja na presto dokazao se u borbama sa bosanskim vladarem i kod Velbužda."
        objasnjenje: "Netačno. Dušan se dokazao još pre stupanja na presto."
        iz_udzbenika: {strana: 31, odeljak: "Dalje širenje državne teritorije", tekst: "Još pre stupanja na presto Dušan se dokazao u borbama sa bosanskim vladarem i kod Velbužda."}

      - id: l06-tn-dvor-seljak
        vrsta: tacno_netacno
        tezina: tesko
        pojmovi: [palisada, nemanjici]
        tvrdnja: "Dvor prvih kraljeva Nemanjića se po izgledu nije mnogo razlikovao od doma vlastele ili većeg seoskog gazdinstva."
        tacno: true
        pomoc:
          - "Ko je još živeo u sličnim kućama?"
          - "Iz lekcije: bila su to skromna zdanja, slična domovima vlastele ili većim seoskim gazdinstvima."
        objasnjenje: "Tačno. Knjiga ih poredi sa domovima vlastele i većim seoskim gazdinstvima."
        iz_udzbenika: {strana: 31, odeljak: "Dalje širenje državne teritorije", tekst: "Bila su to skromna zdanja, slična domovima vlastele ili većim seoskim gazdinstvima."}

      - id: l06-dopuni-dusan-lako
        vrsta: dopuni
        tezina: lako
        pojmovi: [car-dusan, hum, bosanski-ban-stjepan-ii]
        pitanje: "Dopuni rečenicu."
        tekst: "Dušan je osvojio {{Albaniju}} i veliki deo Grčke, ali je izgubio {{Hum}}, koji mu je oteo ban {{Stjepan II}}."
        ponudjene: ["Albaniju", "Hum", "Stjepan II", "Erdelj", "Braničevo", "Palman"]
        pomoc:
          - "Hum je gubitak, a ne osvajanje."
          - "Ban je vladar Bosne."
          - "Iz lekcije: Albanija i Grčka osvojene; Hum izgubljen od bana Stjepana II."
        objasnjenje: "Dušan osvaja jug, a na zapadu gubi Hum."
        iz_udzbenika: {strana: 31, odeljak: "Dalje širenje državne teritorije", tekst: "Dušan je osvojio Albaniju, severnu i srednju Grčku, a izgubio Hum."}

      - id: l06-dopuni-dvor-srednje
        vrsta: dopuni
        tezina: srednje
        pojmovi: [palisada, kralj-milutin]
        pitanje: "Dopuni rečenicu."
        tekst: "Prvi dvorovi su bile drvene kuće sa {{palisadama}}, a {{Milutin}} je uveo raskoš, pa su unutrašnjost krasili {{duborez}} i svila."
        ponudjene: ["palisadama", "Milutin", "duborez", "Dušan", "mermer", "rudnicima"]
        pomoc:
          - "Ograda od šiljatih greda."
          - "Kralj je isto veliki ktitor."
          - "Iz lekcije: palisade, raskoš pod Milutinom, duborez i svila."
        objasnjenje: "Sa jačanjem države Milutin ukrašava drvene dvorove duborezom i svilom."
        iz_udzbenika: {strana: 31, odeljak: "Dalje širenje državne teritorije", tekst: "Milutin uvodi raskoš: drvene građevine se ukrašavaju duborezom i svilom."}

      - id: l06-zakljuci-dusan-hum
        vrsta: zakljuci
        tezina: srednje
        pojmovi: [hum, car-dusan, bosanski-ban-stjepan-ii]
        pitanje: "Zašto je Dušan izgubio Hum baš dok je osvajao jug?"
        odgovori:
          - {tekst: "Njegove snage bile su usmerene na jug, pa je sused to iskoristio", tacan: true}
          - {tekst: "Dao je Hum banu kao miraz", tacan: false, zasto: "Knjiga kaže da mu ga je ban oteo."}
          - {tekst: "Hum se odvojio i pripao Vizantiji", tacan: false, zasto: "Hum je oteo bosanski ban."}
          - {tekst: "Stanovnici Huma su prešli u Erdelj", tacan: false, zasto: "O tome nema reči u lekciji."}
        pomoc:
          - "Korak 1: Gde je bila Dušanova vojska?"
          - "Korak 2: Ko je mogao da iskoristi to što je on zauzet?"
          - "Iz lekcije: Dušan osvaja jug → gubi Hum, koji zauzima ban Stjepan II."
        objasnjenje: "Osvajanje jednog kraja može da ostavi drugi nezaštićen."
        iz_udzbenika: {strana: 31, odeljak: "Uzrok → posledica", tekst: "Dušan osvaja jug, a gubi Hum, koji zauzima ban Stjepan II."}

      - id: l06-zakljuci-raskos
        vrsta: zakljuci
        tezina: srednje
        pojmovi: [kralj-milutin]
        pitanje: "Šta nam raskoš na Milutinovom dvoru govori o državi?"
        odgovori:
          - {tekst: "Država je ojačala i imala je više bogatstva", tacan: true}
          - {tekst: "Država je bila na ivici propasti", tacan: false, zasto: "Raskoš dolazi sa jačanjem države."}
          - {tekst: "Vladari su prestali da grade manastire", tacan: false, zasto: "Milutin je bio jedan od najvećih ktitora."}
          - {tekst: "Dvor se preselio na Svetu Goru", tacan: false, zasto: "Sveta gora je mesto gde je Milutin vojskom upadao, a ne njegov dvor."}
        pomoc:
          - "Korak 1: Kada je raskoš moguća?"
          - "Korak 2: Šta je prethodilo tome?"
          - "Iz lekcije: jačanje države → luksuz na dvoru pod Milutinom."
        objasnjenje: "Raskoš je znak jačanja države i njenih prihoda."
        iz_udzbenika: {strana: 31, odeljak: "Uzrok → posledica", tekst: "Jačanje države dovelo je do luksuza na dvoru pod Milutinom."}

      - id: l06-zakljuci-veza-rudarstvo-rat
        vrsta: zakljuci
        tezina: tesko
        pojmovi: [najamnici, rudarstvo, stefan-uros-i, car-dusan]
        pitanje: "Kako je ono što je započeto pod Urošem I pomoglo Dušanu više od pola veka kasnije?"
        odgovori:
          - {tekst: "Rudarstvo pokrenuto u doba Uroša I davalo je prihode za plaćanje najamnika", tacan: true}
          - {tekst: "Uroš I je ostavio Dušanu krunu cara", tacan: false, zasto: "Dušan se sam proglasio za cara 1345."}
          - {tekst: "Jelena Anžujska je komandovala Dušanovom vojskom", tacan: false, zasto: "Vojskom najamnika komandovao je Palman."}
          - {tekst: "Sasi su bili Dušanovi vojnici", tacan: false, zasto: "Sasi su rudari; najamnici su bili drugi Nemci, pod Palmanom."}
        pomoc:
          - "Korak 1: Šta je Uroš I razvio?"
          - "Korak 2: Šta je trebalo Dušanu za najamnike?"
          - "Iz lekcije: prihodi od rudarstva i trgovine omogućili su mu da plati vojnike."
        objasnjenje: "Privreda stvorena ranije finansira vojsku kasnije: bez prihoda nema plaćenih vojnika."
        iz_udzbenika: {strana: 31, odeljak: "Dalje širenje državne teritorije", tekst: "Prihodi od rudarstva i trgovine omogućili su Dušanu da plati najamnike."}

      - id: l06-zakljuci-dinastija-dusan
        vrsta: zakljuci
        tezina: tesko
        pojmovi: [dinasticki-sukobi, car-dusan, stefan-dragutin]
        pitanje: "Uporedi Dragutina i Dušana: šta pokazuju o načinima na koje je presto menjao vladara?"
        odgovori:
          - {tekst: "Presto se ponekad ustupao, a ponekad otimao, pa nije bilo jednog mirnog pravila", tacan: true}
          - {tekst: "Presto se uvek birao na izborima", tacan: false, zasto: "Dragutin ga ustupa, Dušan ga uzima silom; izbora nema."}
          - {tekst: "Presto su uvek dodeljivali Vizantinci", tacan: false, zasto: "O tome odlučuju Nemanjići među sobom."}
          - {tekst: "Dragutin i Dušan su učinili isto", tacan: false, zasto: "Dragutin je ustupio presto, a Dušan ga je uzeo silom."}
        pomoc:
          - "Korak 1: Kako je Dragutin predao vlast?"
          - "Korak 2: Kako ju je Dušan dobio?"
          - "Iz lekcije: tipična pojava su sukobi unutar dinastije oko nasleđivanja."
        objasnjenje: "Dva primera pokazuju da nasleđivanje nije bilo mirno i jednoobrazno."
        iz_udzbenika: {strana: 30, odeljak: "Uvod", tekst: "Tipična pojava tog doba su sukobi unutar dinastije oko nasleđivanja prestola."}

      - id: l06-datum-dusan
        vrsta: datum
        tezina: srednje
        pojmovi: [car-dusan]
        dogadjaj: "Stefan Dušan"
        pitanje: "Od koje do koje godine je vladao Dušan Silni?"
        od: 1331
        do: 1355
        traka: vladari
        pomoc:
          - "Počeo je godinu posle Velbužda."
          - "Završio je smrću sredinom XIV veka."
          - "Iz lekcije: Dušan Silni (1331–1355)."
        objasnjenje: "Dušan je vladao 1331–1355."
        iz_udzbenika: {strana: 31, odeljak: "Dalje širenje državne teritorije", tekst: "Teritorijalni vrhunac dostignut je pod Dušanom Silnim (1331–1355)."}

      - id: l06-uporedi-dvor-pre-posle
        vrsta: uporedi
        tezina: srednje
        pojmovi: [palisada, kralj-milutin]
        a: "Rani dvorovi"
        b: "Dvor pod Milutinom"
        pitanje: "Na šta se tvrdnja odnosi: rane dvorove, dvor pod Milutinom, oba ili nijedno?"
        tvrdnje:
          - {tekst: "Građevine su drvene.", odgovor: oba, zasto: "I pod Milutinom građevine ostaju drvene."}
          - {tekst: "Iznutra se ukrašavaju duborezom i svilom.", odgovor: b, zasto: "To uvodi Milutin."}
          - {tekst: "Slični su domovima vlastele ili većim gazdinstvima.", odgovor: a, zasto: "Tako knjiga opisuje rane dvorove."}
          - {tekst: "Ograđuju ih palisade ili slične ograde.", odgovor: a, zasto: "To se navodi za rane dvorove u Rasu."}
          - {tekst: "Podignuti su od mermera.", odgovor: nijedan, zasto: "U oba slučaja građevine su drvene."}
        pomoc:
          - "Pod Milutinom se menja unutrašnjost, a ne materijal."
          - "Drvo je zajedničko."
          - "Iz lekcije: građevine ostaju drvene, ali su iznutra bogato ukrašene."
        objasnjenje: "Promena je u unutrašnjosti: drvo ostaje, a stiže raskoš."
        iz_udzbenika: {strana: 31, odeljak: "Dalje širenje državne teritorije", tekst: "Dvorovi su bili skromne drvene kuće, a Milutin uvodi raskoš u unutrašnjost."}

      - id: l06-objasni-kako-ziveli
        vrsta: objasni
        tezina: lako
        pojmovi: [palisada, kralj-milutin, rezidencija]
        pitanje: "Kako su živeli srpski vladari?"
        uzor: "U početku su živeli u skromnim drvenim dvorovima sa palisadama. Od Milutina se javlja raskoš u unutrašnjosti, duborez i svila. Vladari su stalno putovali po zemlji, a rezidencije se javljaju tek pod Milutinom."
        ideje: ["Skromni drveni dvorovi sa palisadama.", "Raskoš u unutrašnjosti od Milutina.", "Stalno putovanje po zemlji.", "Rezidencije tek pod Milutinom."]
        objasnjenje: "Ovo je pitanje iz udžbenika sa str. 33."
        iz_udzbenika: {strana: 33, odeljak: "Pitanja za razmišljanje / Zadaci iz udžbenika", tekst: "Vladari su živeli u skromnim drvenim dvorovima, a raskoš i rezidencije se javljaju tek pod Milutinom."}

      - id: l06-objasni-dusan-osvajanja
        vrsta: objasni
        tezina: lako
        pojmovi: [car-dusan, albanija, grcka]
        pitanje: "Koje teritorije je osvojio car Dušan?"
        uzor: "Dušan je osvojio velike delove vizantijskih zemalja: Albaniju, severnu i srednju Grčku. Istovremeno je izgubio Hum, koji mu je oteo ban Stjepan II."
        ideje: ["Albanija.", "Severna i srednja Grčka.", "Izgubio je Hum."]
        objasnjenje: "Ovo je pitanje iz udžbenika sa str. 33."
        iz_udzbenika: {strana: 33, odeljak: "Pitanja za razmišljanje / Zadaci iz udžbenika", tekst: "Dušan je osvojio Albaniju, severnu i srednju Grčku."}

