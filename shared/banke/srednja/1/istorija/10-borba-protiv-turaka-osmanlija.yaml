  - naslov: "Slabljenje balkanskih država u drugoj polovini XIV veka"
    zadaci:
      - id: l10-lazar-sediste-izbor
        vrsta: izbor
        tezina: lako
        pojmovi: [knez-lazar, krusevac]
        pitanje: "Gde je bilo sedište kneza Lazara?"
        odgovori:
          - {tekst: "U Kruševcu", tacan: true}
          - {tekst: "U Solunu", tacan: false, zasto: "Solun je grad koji su Turci osvojili 1387. godine; nije bio Lazarevo sedište."}
          - {tekst: "U Zeti", tacan: false, zasto: "Zeta je stara srpska oblast u kojoj su najjači bili Balšići, a ne Lazar."}
          - {tekst: "U Epiru", tacan: false, zasto: "Epir je daleki jug, gde su se plemići među prvima osamostalili; Lazar je vladao severnije."}
        pomoc: ["Traži grad u oblasti između Dunava i Kosova.", "Naziv grada počinje slovom K.", "Iz lekcije: sedište kneza Lazara bilo je u Kruševcu."]
        objasnjenje: "Lazar je iz Kruševca vladao prostorom od Dunava na severu do Kosova na jugu."
        iz_udzbenika: {strana: 41, odeljak: "Slabljenje balkanskih država u drugoj polovini XIV veka", tekst: "Knez Lazar je bio najistaknutiji oblasni gospodar, a sedište mu je bilo u Kruševcu.", slika: "10-borba-protiv-turaka-osmanlija/02-knez-lazar-i-knjeginja-milica.jpg"}
      - id: l10-balsici-zeta-izbor
        vrsta: izbor
        tezina: lako
        pojmovi: [balsici, zeta]
        pitanje: "Koja je porodica bila najjača u Zeti?"
        odgovori:
          - {tekst: "Balšići", tacan: true}
          - {tekst: "Mrnjavčevići", tacan: false, zasto: "Braća Mrnjavčević izdvojila su se u Makedoniji, ne u Zeti."}
          - {tekst: "Nemanjići", tacan: false, zasto: "Nemanjić je bio car Uroš, a Zeta se odvajala upravo od njegove centralne vlasti."}
          - {tekst: "Brankovići", tacan: false, zasto: "Vuk Branković se pominje među velikašima, ali lekcija u Zeti ističe Balšiće."}
        pomoc: ["Zeta je stara srpska oblast.", "Prezime počinje na B, ali nije Branković.", "Iz lekcije: u Zeti su najjači bili Balšići."]
        objasnjenje: "Osamostaljivanje se sa dalekog juga proširilo i na stare srpske oblasti, pa su u Zeti vlast držali Balšići."
        iz_udzbenika: {strana: 41, odeljak: "Slabljenje balkanskih država u drugoj polovini XIV veka", tekst: "Velikaši se osamostaljuju i u starim srpskim oblastima, na primer u Zeti, gde su najjači Balšići."}
      - id: l10-mrnjavcevici-makedonija-izbor
        vrsta: izbor
        tezina: lako
        pojmovi: [mrnjavcevici, kralj-vukasin, despot-ugljesa]
        pitanje: "U kojoj oblasti su se izdvojila braća Mrnjavčević, Vukašin i Uglješa?"
        odgovori:
          - {tekst: "U Makedoniji", tacan: true}
          - {tekst: "U Zeti", tacan: false, zasto: "Zeta je oblast Balšića."}
          - {tekst: "U Bosni", tacan: false, zasto: "Bosna je posebna država u kojoj je takođe vladala feudalna anarhija; Mrnjavčevići su bili srpski velikaši."}
          - {tekst: "U Epiru", tacan: false, zasto: "Epir je daleki jug, gde su se osamostalili drugi plemići."}
        pomoc: ["Seti se gde su Turci posle Marice nametnuli vazalne obaveze.", "To je oblast južno od Kosova.", "Iz lekcije: braća Mrnjavčević izdvojila su se u Makedoniji."]
        objasnjenje: "Vukašin i Uglješa bili su moćni velikaši u Makedoniji, zato ih je turski pritisak prve i pogodio."
        iz_udzbenika: {strana: 41, odeljak: "Slabljenje balkanskih država u drugoj polovini XIV veka", tekst: "U Makedoniji se izdvajaju braća Mrnjavčević, Vukašin i Uglješa."}
      - id: l10-anarhija-znacenje-izbor
        vrsta: izbor
        tezina: lako
        pojmovi: [anarhija, feudalna-anarhija]
        pitanje: "Šta je anarhija?"
        odgovori:
          - {tekst: "Stanje u kome nema zakona i reda, jer ih niko ne sprovodi", tacan: true}
          - {tekst: "Podređenost plemića jačem feudalnom gospodaru", tacan: false, zasto: "To opisuje vazala; vazal ima gospodara, dok je anarhija stanje bez reda."}
          - {tekst: "Stajaća vojska plaćena doživotno", tacan: false, zasto: "To su janičari, turska vojska, a ne stanje u državi."}
          - {tekst: "Vlast dvojice vladara u isto vreme", tacan: false, zasto: "To bi bilo savladarstvo, kao kod Uroša i Vukašina; anarhija znači da reda uopšte nema."}
        pomoc: ["Reč opisuje stanje u državi, a ne osobu.", "Zamisli zemlju u kojoj zakoni postoje, ali ih niko ne sprovodi.", "Iz lekcije: anarhija je stanje bez zakona i reda, jer ih niko ne sprovodi."]
        objasnjenje: "Kada niko ne sprovodi zakone, svaki moćnik radi po svome. Takvo stanje vladalo je i u Bosni."
        iz_udzbenika: {strana: 41, odeljak: "Slabljenje balkanskih država u drugoj polovini XIV veka", tekst: "Anarhija je stanje u kome nema zakona i reda, jer ih niko ne sprovodi."}
      - id: l10-osamostaljivanje-prvo-izbor
        vrsta: izbor
        tezina: srednje
        pojmovi: [epir, tesalija, car-uros]
        pitanje: "Gde su se plemići pod carem Urošem najpre osamostalili?"
        odgovori:
          - {tekst: "Na dalekom jugu, u Epiru i Tesaliji", tacan: true}
          - {tekst: "U Zeti i starim srpskim oblastima", tacan: false, zasto: "I tamo su se velikaši osamostalili, ali tek posle dalekog juga."}
          - {tekst: "U Kruševcu i Braničevu", tacan: false, zasto: "To su Lazarevi posedi, a ne prva otcepljena područja."}
          - {tekst: "U Trnovu i Vidinu", tacan: false, zasto: "To su delovi podeljene Bugarske, ne srpske oblasti."}
        pomoc: ["Razmisli: koje oblasti su najdalje od središta države?", "Te oblasti su na dalekom jugu.", "Iz lekcije: plemići se prvo osamostaljuju u Epiru i Tesaliji, a zatim i u starim srpskim oblastima."]
        objasnjenje: "Raspad je krenuo sa dalekog juga, iz Epira i Tesalije, pa se proširio i na stare srpske oblasti poput Zete."
        iz_udzbenika: {strana: 41, odeljak: "Slabljenje balkanskih država u drugoj polovini XIV veka", tekst: "Plemići se prvo osamostaljuju u Epiru i Tesaliji, a zatim i u starim srpskim oblastima."}
      - id: l10-lazarevi-posedi-izbor
        vrsta: izbor
        tezina: srednje
        pojmovi: [knez-lazar, nis, krusevac]
        pitanje: "Koji su od ovih poseda pripadali knezu Lazaru? (više tačnih)"
        odgovori:
          - {tekst: "Braničevo", tacan: true}
          - {tekst: "Golubac", tacan: true}
          - {tekst: "Rudnik", tacan: true}
          - {tekst: "Novo Brdo", tacan: true}
          - {tekst: "Zeta", tacan: false, zasto: "Zeta je bila oblast Balšića."}
          - {tekst: "Tesalija", tacan: false, zasto: "Tesalija je na dalekom jugu i među prvima se odvojila; Lazarova vlast je išla od Dunava do Kosova."}
          - {tekst: "Solun", tacan: false, zasto: "Solun nije među Lazarevim posedima; lekcija ga pominje kao grad koji su Turci osvojili 1387."}
        pomoc: ["Lazareva oblast se prostirala od Dunava do Kosova.", "Odbaci mesta na dalekom jugu i na moru.", "Iz lekcije: pored Kruševca, važni posedi su Braničevo, Golubac, Rudnik, Užice, Niš i Novo Brdo."]
        objasnjenje: "Lazarevi najvažniji posedi bili su, pored Kruševca, Braničevo, Golubac, Rudnik, Užice, Niš i Novo Brdo."
        iz_udzbenika: {strana: 41, odeljak: "Slabljenje balkanskih država u drugoj polovini XIV veka", tekst: "Među najvažnijim Lazarevim posedima, pored Kruševca, bili su Braničevo, Golubac, Rudnik, Užice, Niš i Novo Brdo."}
      - id: l10-vukasin-savladar-izbor
        vrsta: izbor
        tezina: srednje
        pojmovi: [kralj-vukasin, car-uros, mrnjavcevici]
        pitanje: "Kakav je zaista bio položaj kralja Vukašina prema caru Urošu?"
        odgovori:
          - {tekst: "Bio je krunisan za kralja i savladar, ali se ponašao potpuno nezavisno", tacan: true}
          - {tekst: "Bio je Urošev verni zapovednik bez ikakve sopstvene vlasti", tacan: false, zasto: "Vukašin je imao svoju oblast u Makedoniji i ponašao se nezavisno od Uroša."}
          - {tekst: "Zbacio je Uroša i sam postao car", tacan: false, zasto: "Uroš je ostao car do 1371; Vukašin je bio kralj i savladar."}
          - {tekst: "Bio je turski sultan u Makedoniji", tacan: false, zasto: "Vukašin je bio srpski velikaš koji je krenuo protiv Osmanlija na Maricu; sultan je bio Murat."}
        pomoc: ["Titula i stvarna moć ne moraju da se poklapaju.", "Formalno je delio vlast sa carem, ali da li ga je slušao?", "Iz lekcije: Vukašin je krunisan za kralja i bio je savladar, ali se ponašao potpuno nezavisno."]
        objasnjenje: "Vukašin je primer raspada vlasti: na papiru savladar, u stvari samostalan gospodar."
        iz_udzbenika: {strana: 41, odeljak: "Slabljenje balkanskih država u drugoj polovini XIV veka", tekst: "Vukašin je krunisan za kralja i bio je savladar cara Uroša, ali se ponašao potpuno nezavisno.", slika: "10-borba-protiv-turaka-osmanlija/01-car-uros-i-kralj-vukasin.jpg"}
      - id: l10-feudalni-sukobi-tn
        vrsta: tacno_netacno
        tezina: lako
        pojmovi: [feudalizam, osmanlije]
        tvrdnja: "Feudalni sukobi na Balkanu olakšali su tursko osvajanje."
        tacno: true
        pomoc: ["Da li je lakše osvojiti složnu ili podeljenu zemlju?", "Iz lekcije: feudalni sukobi su u velikoj meri olakšali tursko osvajanje."]
        objasnjenje: "Tačno. Takvi sukobi su bili uobičajeni u srednjem veku, a ovde su Turcima otvorili put."
        iz_udzbenika: {strana: 41, odeljak: "Uvod", tekst: "Feudalni sukobi bili su uobičajeni u srednjovekovnim državama, a ovde su u velikoj meri olakšali tursko osvajanje."}
      - id: l10-uros-jak-vladar-tn
        vrsta: tacno_netacno
        tezina: lako
        pojmovi: [car-uros, feudalizam]
        tvrdnja: "Pod carem Urošem Nemanjićem centralna vlast je ojačala, pa se vlastela nije odvajala."
        tacno: false
        ispravke:
          - {tekst: "Pod nejakim Urošem vlastela se odvajala od centralne vlasti.", tacan: true}
          - {tekst: "Pod Urošem je centralna vlast ojačala samo u Epiru i Tesaliji.", tacan: false, zasto: "Upravo su se Epir i Tesalija prvi osamostalili."}
          - {tekst: "Vlastela se odvajala tek posle Kosovskog boja.", tacan: false, zasto: "Odvajanje je počelo znatno ranije, pod Urošem (1355–1371)."}
        pomoc: ["Seti se kakvim su Uroša smatrali savremenici.", "Šta rade velikaši kad je vladar nejak?", "Iz lekcije: vlastela se često odvajala od centralne vlasti, posebno pod nejakim vladarom, kakav je bio Uroš."]
        objasnjenje: "Netačno. Slab vladar znači da se moćna vlastela lakše izdvaja, pa se država cepa na oblasti."
        iz_udzbenika: {strana: 41, odeljak: "Slabljenje balkanskih država u drugoj polovini XIV veka", tekst: "U razvijenom feudalizmu vlastela se odvajala od centralne vlasti, a u Srbiji se to dešava pod carem Urošem."}
        osa: {naziv: "Car Uroš", od: 1355, do: 1371, traka: vladari}
      - id: l10-bosna-anarhija-tn
        vrsta: tacno_netacno
        tezina: lako
        pojmovi: [bosna, feudalna-anarhija]
        tvrdnja: "I u Bosni je vladala feudalna anarhija, a velikaši su samostalno držali velike oblasti."
        tacno: true
        pomoc: ["Kriza nije zahvatila samo Srbiju.", "Iz lekcije: Bosna je takođe u feudalnoj anarhiji."]
        objasnjenje: "Tačno. Slična slika bila je u Srbiji, Bosni i Bugarskoj: mnogo gospodara i slaba centralna vlast."
        iz_udzbenika: {strana: 41, odeljak: "Slabljenje balkanskih država u drugoj polovini XIV veka", tekst: "I Bosna je u feudalnoj anarhiji, a velikaši samostalno vladaju velikim oblastima."}
      - id: l10-bugarska-podela-tn
        vrsta: tacno_netacno
        tezina: srednje
        pojmovi: [bugarska, trnovsko-carstvo, vidinsko-carstvo]
        tvrdnja: "Bugarska je dočekala Turke kao jedinstvena i jaka država."
        tacno: false
        ispravke:
          - {tekst: "Bugarska je bila podeljena: car je pred smrt razdelio državu na dva dela, a neki delovi su se dalje usitnjavali.", tacan: true}
          - {tekst: "Bugarska je bila podeljena između Srbije i Bosne.", tacan: false, zasto: "Državu je podelio sam bugarski car; delovi su bili Trnovsko i Vidinsko carstvo."}
          - {tekst: "Bugarska je bila jaka, ali ju je napala Vizantija.", tacan: false, zasto: "Bugarska je oslabila unutrašnjom podelom, a pala je pod Turke."}
        pomoc: ["Seti se dva bugarska carstva koja su kasnije pala.", "Koliko je delova bilo?", "Iz lekcije: car pred smrt deli državu na dva dela, a neki se kasnije dalje usitnjavaju."]
        objasnjenje: "Netačno. Bugarska je, kao i Srbija, bila podeljena, zato je i pala samo nekoliko godina posle Kosova."
        iz_udzbenika: {strana: 41, odeljak: "Slabljenje balkanskih država u drugoj polovini XIV veka", tekst: "Bugarski car je pred smrt podelio državu na dva dela, a neki delovi su se kasnije usitnjavali."}
      - id: l10-lazar-prostor-tn
        vrsta: tacno_netacno
        tezina: srednje
        pojmovi: [knez-lazar]
        tvrdnja: "Vlast kneza Lazara prostirala se od Dunava na severu do Kosova na jugu."
        tacno: true
        pomoc: ["Priseti se najistaknutijeg oblasnog gospodara.", "Iz lekcije: Lazareva vlast se prostire od Dunava do Kosova."]
        objasnjenje: "Tačno. Zbog tolikog prostora Lazar je bio najistaknutiji među oblasnim gospodarima."
        iz_udzbenika: {strana: 41, odeljak: "Slabljenje balkanskih država u drugoj polovini XIV veka", tekst: "Lazareva vlast prostirala se od Dunava na severu do Kosova na jugu."}
      - id: l10-feudalizam-red-tn
        vrsta: tacno_netacno
        tezina: tesko
        pojmovi: [feudalizam, knez-lazar, kralj-vukasin]
        tvrdnja: "Velikaši poput Vukašina i Lazara dobili su moć tek kada su Turci srušili carsku vlast."
        tacno: false
        ispravke:
          - {tekst: "Velikaši su jačali zbog slabe centralne vlasti još pre turskih osvajanja u Srbiji.", tacan: true}
          - {tekst: "Velikaše su na vlast postavili Turci kao svoje namesnike.", tacan: false, zasto: "Turci su velikašima u Makedoniji nametnuli vazalne obaveze tek posle Marice; oni su već imali svoje oblasti."}
          - {tekst: "Velikaši su moć dobili od Vizantije posle Dušanove smrti.", tacan: false, zasto: "Oni su jačali unutar srpske države, odvajanjem od slabog cara."}
        pomoc: ["Uporedi vreme: kada je Uroš vladao, a kada je bila Marica?", "Da li su se oblasti već izdvojile pre 1371?", "Iz lekcije: u razvijenom feudalizmu oblasni gospodari jačaju, a vlast cara slabi; Turci stižu do već oslabljenih država."]
        objasnjenje: "Netačno. Redosled je obrnut: najpre slabi centralna vlast, pa Turci nailaze na već podeljene države."
        iz_udzbenika: {strana: 44, odeljak: "Zapamtite", tekst: "Turci su stigli do granica hrišćanskih država u razvijenom feudalizmu, kada jačaju oblasni gospodari, a slabi vlast kralja ili cara."}
      - id: l10-velikasi-dopuni
        vrsta: dopuni
        tezina: lako
        pojmovi: [balsici, zeta, mrnjavcevici, knez-lazar, krusevac]
        pitanje: "Dopuni rečenice o srpskim oblasnim gospodarima."
        tekst: "U Zeti su najjači bili {{Balšići}}. U Makedoniji su se izdvojila braća {{Mrnjavčević}}. Najistaknutiji oblasni gospodar bio je knez {{Lazar}}, sa sedištem u {{Kruševcu}}."
        ponudjene: ["Balšići", "Mrnjavčević", "Lazar", "Kruševcu", "Murat", "Solunu"]
        pomoc: ["Murat je turski sultan, pa ne spada među srpske velikaše.", "Solun nije bio sedište nijednog od ovih gospodara.", "Iz lekcije: Balšići u Zeti, Mrnjavčevići u Makedoniji, Lazar u Kruševcu."]
        objasnjenje: "Svaka oblast imala je svog gospodara: Balšići Zetu, Mrnjavčevići Makedoniju, a Lazar prostor sa sedištem u Kruševcu."
        iz_udzbenika: {strana: 41, odeljak: "Slabljenje balkanskih država u drugoj polovini XIV veka", tekst: "Lekcija navodi Balšiće u Zeti, Mrnjavčeviće u Makedoniji i kneza Lazara sa sedištem u Kruševcu."}
      - id: l10-uvod-kriza-dopuni
        vrsta: dopuni
        tezina: lako
        pojmovi: [bosna, bugarska, osmanlije]
        pitanje: "Dopuni uvod lekcije."
        tekst: "Srbija, Bosna, Bugarska i Ugarska bile su oslabljene slabom {{centralnom}} vlašću i unutrašnjim borbama kada su počeli upadi {{turskih}} četa na Balkan."
        ponudjene: ["centralnom", "turskih", "crkvenom", "mongolskih"]
        pomoc: ["Vlast može biti centralna ili oblasna.", "Mongoli se u lekciji pojavljuju tek kod Angore.", "Iz lekcije: države su bile pogođene slabom centralnom vlašću kada su počeli upadi turskih četa."]
        objasnjenje: "Turci su na Balkan stigli u najgorem trenutku za te države, kada su bile razjedinjene."
        iz_udzbenika: {strana: 41, odeljak: "Uvod", tekst: "Srbija, Bosna, Bugarska i Ugarska bile su oslabljene upravo kada su počeli upadi turskih četa."}
      - id: l10-lazarevi-gradovi-dopuni
        vrsta: dopuni
        tezina: srednje
        pojmovi: [knez-lazar, nis, krusevac]
        pitanje: "Dopuni spisak važnih Lazarevih poseda."
        tekst: "Pored Kruševca, važni Lazarevi posedi bili su {{Braničevo}}, {{Golubac}}, Rudnik, {{Užice}}, Niš i {{Novo Brdo}}."
        ponudjene: ["Braničevo", "Golubac", "Užice", "Novo Brdo", "Cimpe", "Solun"]
        pomoc: ["Cimpe je tvrđava koju su zauzeli Turci.", "Solun je Turcima pao 1387. i nije među Lazarevim posedima.", "Iz lekcije: Braničevo, Golubac, Rudnik, Užice, Niš i Novo Brdo."]
        objasnjenje: "Ovi posedi pokazuju koliki je prostor držao Lazar, od Dunava do Kosova."
        iz_udzbenika: {strana: 41, odeljak: "Slabljenje balkanskih država u drugoj polovini XIV veka", tekst: "Lekcija navodi Kruševac, Braničevo, Golubac, Rudnik, Užice, Niš i Novo Brdo."}
      - id: l10-uros-opis-dopuni
        vrsta: dopuni
        tezina: tesko
        pojmovi: [car-dusan, car-uros, epir, tesalija, zeta]
        pitanje: "Dopuni bez ponuđenih reči."
        tekst: "Posle smrti cara {{Dušana}} vladao je njegov sin {{Uroš}}. Plemići su se prvo osamostalili u Epiru i {{Tesaliji}}, a zatim i u starim oblastima kao što je {{Zeta}}."
        pomoc: ["Prva praznina je otac, druga sin.", "Daleki jug čine dve oblasti, a u staroj oblasti su jačali Balšići.", "Iz lekcije: Dušan, pa Uroš; Epir i Tesalija, zatim Zeta."]
        objasnjenje: "Posle Dušana, pod slabim Urošem, država se raspadala od dalekog juga prema starim oblastima."
        iz_udzbenika: {strana: 41, odeljak: "Slabljenje balkanskih država u drugoj polovini XIV veka", tekst: "Pod Dušanovim sinom Urošem plemići se osamostaljuju u Epiru, Tesaliji i Zeti."}
      - id: l10-gospodari-oblasti-povezi
        vrsta: povezi
        tezina: lako
        pojmovi: [balsici, mrnjavcevici, knez-lazar, bosna]
