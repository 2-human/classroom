          - {tekst: "Posle Marice Turci su Srbiju dali Mongolima.", tacan: false, zasto: "Mongoli nemaju veze sa Srbijom; lekcija ih pominje samo kod Angore."}
        pomoc: ["Između Marice i Kosova prošlo je 18 godina.", "Šta su Turci slali u oblasti van Makedonije?", "Iz lekcije: Turci ne prodiru odmah, nego polako šire vlast."]
        objasnjenje: "Netačno. Turci su širili vlast postepeno: preko vazala u Makedoniji i manjih pljačkaških jedinica."
        iz_udzbenika: {strana: 42, odeljak: "Bitka na Kosovu 1389.", tekst: "Posle Marice Turci ne prodiru odmah u unutrašnjost Srbije, već polako šire vlast."}
      - id: l10-prvo-verovanje-tn
