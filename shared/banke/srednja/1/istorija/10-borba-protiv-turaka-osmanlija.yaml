        pitanje: "Poveži bitku sa njenim ishodom."
        parovi:
          - ["Marica 1371.", "Potpun poraz braće Mrnjavčević"]
          - ["Pločnik 1386.", "Srpska pobeda, ali Niš pada iste godine"]
          - ["Kosovo 1389.", "Pogibija oba vladara i gubitak većine vlastele"]
          - ["Angora 1402.", "Mongoli zarobljavaju sultana Bajazita"]
        pomoc: ["Samo je jedna srpska pobeda.", "Pred Mongolima je izgubio Bajazit.", "Iz lekcije: Marica poraz, Pločnik pobeda, Kosovo gubitak vlastele, Angora Bajazit zarobljen."]
        objasnjenje: "Četiri bitke čine okosnicu lekcije; njihov redosled i ishodi su osnov za razumevanje."
        iz_udzbenika: {strana: 44, odeljak: "Zapamtite", tekst: "Lekcija beleži poraz na Marici 1371, gubitak bitke na Kosovu 1389. i Angoru 1402."}
      - id: l10-istina-predanje-povezi
        vrsta: povezi
        tezina: tesko
        pojmovi: [milos-obilic, marko-kraljevic, kosovski-boj]
