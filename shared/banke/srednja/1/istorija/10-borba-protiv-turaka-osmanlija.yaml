        pomoc: ["Uporedi šta je ostalo posle bitke: ko je nasledio Murata i kakva je država nastavila dalje.", "Iz lekcije: gubici su veliki na obe strane, ali srpsko društvo ne može da nadoknadi gubitak većine vlastele."]
