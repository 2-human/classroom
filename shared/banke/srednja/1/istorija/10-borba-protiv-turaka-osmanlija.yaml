        pojmovi: [vlatko-vukovic, ivan-palizna, bosna]
        pitanje: "Dopuni rečenicu o pomoći Srbima."
        tekst: "Srbima su na Kosovu pomogli odredi iz {{Bosne}} pod komandom Vlatka {{Vukovića}} i iz {{Hrvatske}}, koje je predvodio feudalac Ivan {{Paližna}}."
        ponudjene: ["Bosne", "Vukovića", "Hrvatske", "Paližna", "Bugarske", "Balšića"]
        pomoc: ["Balšići su bili u Zeti.", "Bugarska je tada već bila podeljena i uskoro je pala.", "Iz lekcije: Bosna i Vlatko Vuković; Hrvatska i Ivan Paližna."]
        objasnjenje: "Dve zemlje poslale su pomoć, ali to nije nadoknadilo gubitke."
        iz_udzbenika: {strana: 43, odeljak: "Bitka na Kosovu 1389.", tekst: "Pomogli su odredi iz Bosne pod Vlatkom Vukovićem i iz Hrvatske pod Ivanom Paližnom."}
      - id: l10-posle-marice-dopuni
