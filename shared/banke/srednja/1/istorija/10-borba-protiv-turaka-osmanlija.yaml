        tezina: lako
        pojmovi: [kosovski-boj, gazimestan]
        pitanje: "Na kom mestu je vođena velika bitka 1389?"
        odgovori:
          - {tekst: "Na Gazimestanu, na Kosovu", tacan: true}
          - {tekst: "Kod Pločnika", tacan: false, zasto: "Pločnik je srpska pobeda iz 1386, tri godine ranije."}
          - {tekst: "Na Marici", tacan: false, zasto: "Na Marici je bitka vođena 1371, a tada su potučeni Mrnjavčevići."}
          - {tekst: "Kod Angore", tacan: false, zasto: "Kod Angore su se 1402. borili Turci i Mongoli."}
        pomoc: ["Sama bitka nosi ime oblasti.", "Tačno mesto u toj oblasti zove se Gazimestan.", "Iz lekcije: 15. (28) juna 1389. bitka se vodi na Gazimestanu, na Kosovu."]
        objasnjenje: "Bitka se zove Kosovski boj, a tačno mesto je Gazimestan."
        iz_udzbenika: {strana: 42, odeljak: "Bitka na Kosovu 1389.", tekst: "Velika bitka vođena je 15. (28) juna 1389. na Gazimestanu, na Kosovu."}
        osa: {naziv: "Bitka na Kosovu", od: 1389, traka: dogadjaji}
      - id: l10-kosovo-vladari-izbor
        vrsta: izbor
        tezina: lako
        pojmovi: [kosovski-boj, knez-lazar, sultan-murat]
        pitanje: "Šta se dogodilo sa dvojicom vladara u Kosovskom boju?"
        odgovori:
          - {tekst: "Obojica su izgubila život", tacan: true}
          - {tekst: "Obojica su preživela i sklopila mir", tacan: false, zasto: "Lazar je zarobljen i pogubljen, a sultana je ubio jedan srpski plemić."}
          - {tekst: "Poginuo je samo sultan Murat", tacan: false, zasto: "Život je izgubio i knez Lazar."}
          - {tekst: "Nijedan nije lično došao na bojište", tacan: false, zasto: "Baš zbog značaja bitke došla su obojica."}
        pomoc: ["Na bojište su došla obojica.", "Seti se ko je Muratov naslednik.", "Iz lekcije: knez Lazar i sultan Murat obojica su izgubili život."]
        objasnjenje: "To je retkost: oba vladara poginula su u istoj bici."
        iz_udzbenika: {strana: 42, odeljak: "Bitka na Kosovu 1389.", tekst: "Na bojište lično dolaze oba vladara, i obojica gube život."}
        osa: {naziv: "Bitka na Kosovu", od: 1389, traka: dogadjaji}
      - id: l10-zaduzbine-izbor
        vrsta: izbor
        tezina: lako
        pojmovi: [knez-lazar, ravanica, lazarica]
        pitanje: "Koje je dve zadužbine podigao knez Lazar? (više tačnih)"
        odgovori:
          - {tekst: "Ravanicu", tacan: true}
          - {tekst: "Lazaricu", tacan: true}
          - {tekst: "Gazimestan", tacan: false, zasto: "Gazimestan je bojište na Kosovu, a ne manastir."}
          - {tekst: "Cimpe", tacan: false, zasto: "Cimpe je tvrđava koju su zauzeli Turci."}
        pomoc: ["Jedna zadužbina nosi ime slično Lazarevom.", "Druga se završava na -nica.", "Iz lekcije: Lazar je podigao Ravanicu i Lazaricu."]
        objasnjenje: "Ravanica i Lazarica su dve zadužbine kneza Lazara."
        iz_udzbenika: {strana: 43, odeljak: "Bitka na Kosovu 1389.", tekst: "Lazar je podigao dve zadužbine, manastire Ravanicu i Lazaricu.", slika: "10-borba-protiv-turaka-osmanlija/04-manastir-ravanica.jpg"}
      - id: l10-saveznici-izbor
        vrsta: izbor
        tezina: srednje
        pojmovi: [vlatko-vukovic, ivan-palizna, bosna]
        pitanje: "Odakle su Srbima na Kosovu stigli pomoćni odredi? (više tačnih)"
        odgovori:
          - {tekst: "Iz Bosne, pod Vlatkom Vukovićem", tacan: true}
          - {tekst: "Iz Hrvatske, pod Ivanom Paližnom", tacan: true}
          - {tekst: "Iz Vizantije, pod Kantakuzinom", tacan: false, zasto: "Kantakuzin je opisivao nemire posle Dušana; on ne učestvuje u ovoj bici."}
          - {tekst: "Iz Bugarske, pod Bajazitom", tacan: false, zasto: "Bajazit je turski sultan, Muratov sin."}
        pomoc: ["Pomoć je stigla iz dva pravca.", "Obe zemlje su zapadno od Srbije.", "Iz lekcije: odredi iz Bosne pod Vlatkom Vukovićem i iz Hrvatske pod Ivanom Paližnom."]
        objasnjenje: "Kosovski boj nije bio samo srpski: pomogli su odredi iz Bosne i Hrvatske."
        iz_udzbenika: {strana: 43, odeljak: "Bitka na Kosovu 1389.", tekst: "Srbima su pomogli odredi iz Bosne pod Vlatkom Vukovićem i iz Hrvatske pod Ivanom Paližnom."}
        osa: {naziv: "Bitka na Kosovu", od: 1389, traka: dogadjaji}
      - id: l10-lazar-smrt-izbor
        vrsta: izbor
        tezina: srednje
        pojmovi: [knez-lazar, kosovski-boj]
        pitanje: "Kako je knez Lazar izgubio život?"
        odgovori:
          - {tekst: "Zarobljen je u borbi i pogubljen", tacan: true}
          - {tekst: "Umro je u ropstvu u Aziji", tacan: false, zasto: "U ropstvu je umro sultan Bajazit, posle Angore."}
          - {tekst: "Ubio ga je jedan srpski plemić", tacan: false, zasto: "Srpski plemić je ubio sultana Murata, a ne Lazara."}
          - {tekst: "Umro je nekoliko meseci posle bitke", tacan: false, zasto: "To se odnosi na cara Uroša posle Marice."}
        pomoc: ["Nije poginuo na isti način kao sultan.", "Prvo je pao u ruke Turcima.", "Iz lekcije: Lazar je zarobljen u borbi i pogubljen."]
        objasnjenje: "Lazar je zarobljen i pogubljen, a sultana je ubio srpski plemić."
        iz_udzbenika: {strana: 43, odeljak: "Bitka na Kosovu 1389.", tekst: "Lazar je zarobljen u borbi i pogubljen."}
        osa: {naziv: "Bitka na Kosovu", od: 1389, traka: dogadjaji}
      - id: l10-slika44-manastiri-izbor
        vrsta: izbor
        tezina: srednje
        pojmovi: [lazarica, ljubostinja, kalenic]
        pitanje: "Koja tri manastira zajedno prikazuje slika na poslednjoj strani lekcije? (više tačnih)"
        odgovori:
          - {tekst: "Lazarica", tacan: true}
          - {tekst: "Ljubostinja", tacan: true}
          - {tekst: "Kalenić", tacan: true}
          - {tekst: "Gazimestan", tacan: false, zasto: "Gazimestan je bojište, a ne manastir."}
          - {tekst: "Kruševac", tacan: false, zasto: "Kruševac je Lazarevo sedište, grad, a ne manastir."}
        pomoc: ["Jedan je Lazareva zadužbina.", "Druga dva se u tekstu lekcije ne opisuju, ali su na zajedničkoj slici.", "Iz lekcije: zajednički natpis navodi Lazaricu, Ljubostinju i Kalenić."]
        objasnjenje: "Sva tri manastira navedena su u zajedničkom natpisu ispod fotografija."
        iz_udzbenika: {strana: 44, odeljak: "Slike i karte", tekst: "Jedan natpis na str. 44 navodi manastire Lazaricu, Ljubostinju i Kalenić."}
      - id: l10-kosovo-pobeda-izbor
        vrsta: izbor
        tezina: tesko
        pojmovi: [kosovski-boj, feudalizam]
        pitanje: "Koji je podatak presudan da se Kosovski boj na kraju računa kao srpski poraz?"
        odgovori:
          - {tekst: "Srpsko društvo nije moglo da nadoknadi gubitak većine vlastele", tacan: true}
          - {tekst: "Turci su posle bitke ostali na Kosovu", tacan: false, zasto: "Turci su napustili Kosovo, zato se u prvi mah verovalo u srpsku pobedu."}
          - {tekst: "Sultan Murat je preživeo", tacan: false, zasto: "Murat je izgubio život u boju."}
          - {tekst: "Gubici su bili veliki samo na srpskoj strani", tacan: false, zasto: "Gubici su bili veliki na obe strane; razlika je u tome ko je mogao da ih nadoknadi."}
