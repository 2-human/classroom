          - ["Vlatko Vuković", "Zapovednik odreda iz Bosne"]
          - ["Ivan Paližna", "Hrvatski feudalac koji predvodi odrede iz Hrvatske"]
        pomoc: ["Prvo razdvoji vladare od zapovednika pomoćnih odreda.", "Vlatko je iz Bosne, Ivan iz Hrvatske.", "Iz lekcije: Lazar pogubljen, Murat ubijen, Vuković iz Bosne, Paližna iz Hrvatske."]
        objasnjenje: "Dva vladara i dva zapovednika pomoćnih odreda."
        iz_udzbenika: {strana: 43, odeljak: "Bitka na Kosovu 1389.", tekst: "Lekcija navodi kneza Lazara, sultana Murata, Vlatka Vukovića i Ivana Paližnu."}
      - id: l10-bitke-povezi
