        iz_udzbenika: {strana: 42, odeljak: "Bitka na Kosovu 1389.", tekst: "Zbog značaja bitke na bojište lično dolaze knez Lazar i sultan Murat."}
        osa: {naziv: "Bitka na Kosovu", od: 1389, traka: dogadjaji}
      - id: l10-posle-marice-odmah-tn
        vrsta: tacno_netacno
        tezina: lako
        pojmovi: [bitka-na-marici, osmanlije]
        tvrdnja: "Turci su odmah posle Marice prodrli u unutrašnjost Srbije i zauzeli je."
