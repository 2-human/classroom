        objasnjenje: "Vazalstvo je bilo način da Turci vladaju oblastima i bez potpunog osvajanja."
        iz_udzbenika: {strana: 42, odeljak: "Bitka na Marici 1371.", tekst: "Posle Marice Turci srpskim velikašima u Makedoniji nameću vazalne obaveze."}
        osa: {naziv: "Bitka na Marici", od: 1371, traka: dogadjaji}
  - naslov: "Bitka na Kosovu 1389."
