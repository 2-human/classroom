        parovi:
          - ["Balšići", "Zeta"]
          - ["Braća Mrnjavčević", "Makedonija"]
          - ["Knez Lazar", "Kruševac i prostor od Dunava do Kosova"]
          - ["Samostalni velikaši u feudalnoj anarhiji", "Bosna"]
        pomoc: ["Počni od Lazara, jer je njegovo sedište najpoznatije.", "Balšići su u staroj srpskoj oblasti.", "Iz lekcije: Balšići u Zeti, Mrnjavčevići u Makedoniji, Lazar u Kruševcu, a anarhija i u Bosni."]
        objasnjenje: "Uz svakog gospodara ide njegova oblast; svuda je slika ista, slaba centralna vlast i jaki velikaši."
        iz_udzbenika: {strana: 41, odeljak: "Slabljenje balkanskih država u drugoj polovini XIV veka", tekst: "Lekcija navodi oblasne gospodare i prostor na kome su delovali."}
      - id: l10-pojmovi-znacenje-povezi
        vrsta: povezi
        tezina: srednje
        pojmovi: [anarhija, vazal, janicari, feudalizam]
        pitanje: "Poveži pojam i njegovo značenje."
        parovi:
          - ["Anarhija", "Nema zakona i reda, jer ih niko ne sprovodi"]
          - ["Vazal", "Plemić podređen jačem gospodaru, kome se zaklinje na vernost"]
          - ["Janičari", "Vojnici plaćeni doživotno, stajaća vojska"]
          - ["Razvijeni feudalizam", "Oblasni gospodari jačaju, a vlast kralja ili cara slabi"]
        pomoc: ["Dva pojma opisuju osobu ili vojnika, dva stanje.", "Zakletva na vernost vezuje se za odnos gospodara i plemića.", "Iz lekcije: anarhija je stanje bez reda, vazal je podređeni plemić, janičari su stajaća vojska."]
        objasnjenje: "Ova četiri pojma zajedno objašnjavaju krizu: raspad vlasti s jedne, a tursku organizovanost s druge strane."
        iz_udzbenika: {strana: 42, odeljak: "Bitka na Marici 1371.", tekst: "Vazal je plemić podređen jačem gospodaru i obavezan da mu se zakune na vernost."}
      - id: l10-velikasi-titule-povezi
        vrsta: povezi
        tezina: tesko
        pojmovi: [nikola-altomanovic, knez-lazar, vuk-brankovic, kralj-vukasin, despot-ugljesa]
        pitanje: "Poveži ličnost sa titulom ili odrednicom koju joj daje lekcija."
        parovi:
          - ["Nikola Altomanović", "župan"]
          - ["Lazar Hrebeljanović", "knez"]
          - ["Vukašin Mrnjavčević", "kralj"]
          - ["Uglješa Mrnjavčević", "despot"]
          - ["Vuk Branković", "velikaš"]
        pomoc: ["Jedina krunisana ličnost bila je savladar cara.", "Bratu krunisanog kralja lekcija daje titulu despota.", "Iz lekcije: župan Nikola Altomanović, knez Lazar, kralj Vukašin, despot Uglješa, velikaš Vuk Branković."]
        objasnjenje: "Različite titule pokazuju koliko je gospodara bilo: svaki je vladao svojim delom, a jedinstvene vlasti više nije bilo."
        iz_udzbenika: {strana: 41, odeljak: "Slabljenje balkanskih država u drugoj polovini XIV veka", tekst: "Pored Mrnjavčevića, značajni su župan Nikola Altomanović, knez Lazar Hrebeljanović i velikaš Vuk Branković."}
      - id: l10-osamostaljivanje-zakljuci
        vrsta: zakljuci
        tezina: lako
        pojmovi: [car-uros, feudalizam]
        pitanje: "Zašto se vlastela baš pod Urošem počela odvajati od centralne vlasti?"
        odgovori:
          - {tekst: "Zato što je Uroš bio nejak vladar, a jaka vlastela je to iskoristila", tacan: true}
          - {tekst: "Zato što su to tražili Turci sa Marice", tacan: false, zasto: "Odvajanje je počelo pre Marice; Turci su kasnije samo iskoristili podelu."}
          - {tekst: "Zato što je Uroš podelio državu sinovima", tacan: false, zasto: "Državu je pred smrt podelio bugarski car; u Srbiji su se velikaši sami izdvajali."}
          - {tekst: "Zato što je vlastela želela da pomogne Vizantiji", tacan: false, zasto: "Velikaši su gledali sopstveni interes, ne Vizantiju."}
        pomoc: ["Korak 1: Kakav je bio Uroš kao vladar?", "Korak 2: Šta velikaš radi kad centralna vlast nema snage da ga obuzda?", "Iz lekcije: vlastela se odvajala posebno pod nejakim vladarom."]
        objasnjenje: "U razvijenom feudalizmu vlastela je već bila jaka, a slab vladar joj je dozvolio da se izdvoji."
        iz_udzbenika: {strana: 41, odeljak: "Slabljenje balkanskih država u drugoj polovini XIV veka", tekst: "Vlastela se često odvajala od centralne vlasti, posebno pod nejakim vladarom."}
      - id: l10-vukasin-freska-zakljuci
        vrsta: zakljuci
        slika_u_pitanju: true
        tezina: srednje
        pojmovi: [kralj-vukasin, car-uros]
        pitanje: "Na freski stoje zajedno, kao ravnopravni, car Uroš i kralj Vukašin. Šta to najbolje govori o srpskoj državi tog doba?"
        odgovori:
          - {tekst: "Car više nije imao vlast iznad moćnog velikaša koji je bio krunisan kao savladar", tacan: true}
          - {tekst: "Uroš je bio Vukašinov vazal, a Vukašin car", tacan: false, zasto: "Car je bio Uroš, a Vukašin kralj i savladar; o vazalstvu lekcija govori u vezi sa Turcima."}
          - {tekst: "Srbija je tada bila potpuno jedinstvena država", tacan: false, zasto: "Baš tada se država cepala na oblasti."}
          - {tekst: "Vukašin je bio sultanov namesnik u Srbiji", tacan: false, zasto: "Vukašin je bio srpski velikaš koji je krenuo u sukob sa Osmanlijama na Maricu."}
        pomoc: ["Korak 1: Ko je Vukašin bio po tituli?", "Korak 2: Da li se ponašao kao podređen?", "Iz lekcije: Vukašin je bio savladar, ali se ponašao potpuno nezavisno."]
        objasnjenje: "Prikaz dvojice vladara jedan pored drugog odgovara stvarnosti u kojoj carska vlast više nije bila jedina."
        iz_udzbenika: {strana: 41, odeljak: "Slabljenje balkanskih država u drugoj polovini XIV veka", tekst: "Freska prikazuje odnos cara Uroša i kralja Vukašina, koji je bio savladar, ali je vladao samostalno.", slika: "10-borba-protiv-turaka-osmanlija/01-car-uros-i-kralj-vukasin.jpg"}
      - id: l10-nesloga-primena-zakljuci
        vrsta: zakljuci
        tezina: tesko
        pojmovi: [feudalizam, bosna, bugarska, osmanlije]
        pitanje: "Zamisli državu čiji se velikaši svađaju, a spolja stiže novi jak neprijatelj. Po iskustvu iz ove lekcije, šta je najverovatnije?"
        odgovori:
          - {tekst: "Neprijatelj će lakše osvajati, jer svaki velikaš brani samo svoj deo", tacan: true}
          - {tekst: "Velikaši će se odmah i trajno ujediniti pod jednim vladarom", tacan: false, zasto: "Kantakuzin opisuje suprotno: neki su čekali da se pridruže pobedniku."}
          - {tekst: "Neprijatelj neće smeti da napadne tako veliku državu", tacan: false, zasto: "Veličina ne pomaže ako je država podeljena; Turci su napredovali upravo u takvim državama."}
          - {tekst: "Država će jačati jer sukobi vežbaju vojsku", tacan: false, zasto: "Lekcija kaže suprotno: unutrašnje borbe slabe državu i olakšavaju osvajanje."}
        pomoc: ["Korak 1: Šta je bilo zajedničko Srbiji, Bosni i Bugarskoj?", "Korak 2: Kako su im to Turci iskoristili?", "Iz lekcije: feudalni sukobi su u velikoj meri olakšali tursko osvajanje."]
        objasnjenje: "Zajedničko pravilo lekcije: nesloga u državi je prednost za spoljnog osvajača."
        iz_udzbenika: {strana: 41, odeljak: "Uvod", tekst: "Unutrašnji sukobi su u velikoj meri olakšali tursko osvajanje."}
      - id: l10-uros-oblasti-lanac
        vrsta: lanac
        tezina: lako
        pojmovi: [car-uros, feudalizam]
        karike: ["Slab vladar Uroš", "?", "Država se cepa na oblasti"]
        praznina: 1
        odgovori:
          - {tekst: "Vlastela se izdvaja iz centralne vlasti", tacan: true}
          - {tekst: "Janičari preuzimaju vlast u državi", tacan: false, zasto: "Janičari su turska vojska; srpska država se cepala zbog svoje vlastele."}
          - {tekst: "Vizantija zauzima celu Srbiju", tacan: false, zasto: "Vizantinci su imali priliku da povrate izgubljeno, ali su je uludo potrošili."}
        pomoc: ["Korak 1: Ko je mogao da iskoristi slabost cara?", "Korak 2: Šta rade moćni plemići bez jakog gospodara?", "Iz lekcije: slab vladar → vlastela se izdvaja → država se cepa na oblasti."]
        objasnjenje: "Osnovni lanac raspada: slab vladar, jaka vlastela, podeljena država."
        iz_udzbenika: {strana: 41, odeljak: "Slabljenje balkanskih država u drugoj polovini XIV veka", tekst: "U razvijenom feudalizmu vlastela se odvajala od centralne vlasti, posebno pod nejakim vladarom."}
        osa: {naziv: "Car Uroš", od: 1355, do: 1371, traka: vladari}
      - id: l10-sukobi-osvajanje-lanac
        vrsta: lanac
        tezina: srednje
        pojmovi: [feudalizam, feudalna-anarhija, osmanlije]
        karike: ["U Srbiji, Bosni i Bugarskoj jačaju velikaši", "Unutrašnji sukobi i slaba centralna vlast", "?"]
        praznina: 2
        odgovori:
          - {tekst: "Turcima je osvajanje mnogo lakše", tacan: true}
          - {tekst: "Balkanske države zajedno teraju Turke iz Evrope", tacan: false, zasto: "Do toga nije došlo; srpske zemlje i Bugarska postepeno su dolazile pod tursku vlast."}
          - {tekst: "Velikaši se odriču svojih oblasti", tacan: false, zasto: "Baš naprotiv: velikaši su samostalno vladali velikim oblastima."}
        pomoc: ["Korak 1: Ko je spoljna opasnost u to vreme?", "Korak 2: Da li je podeljena država jača ili slabija pred njim?", "Iz lekcije: feudalni sukobi na Balkanu olakšali su tursko osvajanje."]
        objasnjenje: "Unutrašnji sukobi nisu bili neobični u srednjem veku, ali su ovde došli u trenutku spoljne opasnosti."
        iz_udzbenika: {strana: 41, odeljak: "Uvod", tekst: "Feudalni sukobi su u velikoj meri olakšali tursko osvajanje."}
      - id: l10-srbija-bugarska-uporedi
        vrsta: uporedi
        tezina: srednje
        pojmovi: [bugarska, car-uros, bosna, feudalna-anarhija]
        a: "Srbija"
        b: "Bugarska"
        pitanje: "Na koju se državu odnosi tvrdnja: Srbiju, Bugarsku, obe ili nijednu?"
        tvrdnje:
          - {tekst: "Car je pred smrt podelio državu na dva dela.", odgovor: b, zasto: "To je učinio bugarski car; u Srbiji su se velikaši sami izdvajali."}
          - {tekst: "Velikaši su se izdvajali pod slabim carem Urošem.", odgovor: a, zasto: "Uroš je bio srpski car (1355–1371)."}
          - {tekst: "Država je bila oslabljena unutrašnjim borbama kada su stigli Turci.", odgovor: oba, zasto: "Obe države su bile oslabljene, što je Turcima olakšalo osvajanje."}
          - {tekst: "Posle pobede kod Angore osvojila je Tursku.", odgovor: nijedan, zasto: "Kod Angore su pobedili Mongoli i zarobili sultana Bajazita."}
          - {tekst: "Knez Lazar je vladao od Dunava do Kosova na njenom tlu.", odgovor: a, zasto: "Lazar je bio srpski oblasni gospodar sa sedištem u Kruševcu."}
        pomoc: ["Koji car je sam podelio državu?", "Koja se država raspadala bez takve podele?", "Iz lekcije: u Bugarskoj car deli državu, a u Srbiji se vlastela izdvaja pod Urošem."]
        objasnjenje: "Način podele se razlikovao, ali je posledica bila ista: slaba država pred Turcima."
        iz_udzbenika: {strana: 41, odeljak: "Slabljenje balkanskih država u drugoj polovini XIV veka", tekst: "Slično Srbiji, i Bugarska je bila podeljena, jer je car pred smrt razdelio državu."}
      - id: l10-lazar-ko-sam
        vrsta: ko_sam
        tezina: lako
        pojmovi: [knez-lazar, krusevac, kosovski-boj]
        tragovi: ["Bio sam najistaknutiji među oblasnim gospodarima.", "Sedište mi je bilo u Kruševcu, a vlast od Dunava do Kosova.", "Izgubio sam život 1389, u boju sa vojskom sultana Murata."]
        odgovori:
          - {tekst: "Knez Lazar", tacan: true}
          - {tekst: "Kralj Vukašin", tacan: false, zasto: "Vukašin je bio u Makedoniji i vezuje se za Maricu 1371."}
          - {tekst: "Vuk Branković", tacan: false, zasto: "Branković je bio značajan velikaš, ali sedište u Kruševcu imao je Lazar."}
          - {tekst: "Car Uroš", tacan: false, zasto: "Uroš je umro 1371, mnogo pre Kosova."}
        objasnjenje: "To je knez Lazar Hrebeljanović, najjači srpski gospodar uoči Kosovskog boja."
        iz_udzbenika: {strana: 41, odeljak: "Slabljenje balkanskih država u drugoj polovini XIV veka", tekst: "Knez Lazar je najistaknutiji oblasni gospodar, sa sedištem u Kruševcu.", slika: "10-borba-protiv-turaka-osmanlija/02-knez-lazar-i-knjeginja-milica.jpg"}
      - id: l10-vukasin-ko-sam
        vrsta: ko_sam
        tezina: srednje
        pojmovi: [kralj-vukasin, mrnjavcevici, marko-kraljevic]
        tragovi: ["Imao sam krunu, ali nisam bio car.", "Bio sam savladar, a ponašao sam se potpuno nezavisno.", "Brat mi je bio despot Uglješa, a sin Marko."]
        odgovori:
          - {tekst: "Kralj Vukašin", tacan: true}
          - {tekst: "Knez Lazar", tacan: false, zasto: "Lazar je bio knez i nije bio krunisan za savladara."}
          - {tekst: "Nikola Altomanović", tacan: false, zasto: "Altomanović je bio župan, a ne krunisani savladar."}
          - {tekst: "Marko Kraljević", tacan: false, zasto: "Marko je sin ličnosti koju tražimo."}
        objasnjenje: "Vukašin Mrnjavčević je bio krunisan za kralja i savladar cara Uroša, a Marko Kraljević mu je sin."
        iz_udzbenika: {strana: 41, odeljak: "Slabljenje balkanskih država u drugoj polovini XIV veka", tekst: "Vukašin je bio krunisan za kralja i bio savladar cara Uroša, ali potpuno nezavisan."}
      - id: l10-zasto-oslabila-objasni
        vrsta: objasni
        tezina: lako
        pojmovi: [car-uros, feudalizam]
        pitanje: "Objasni svojim rečima zašto se Srbija posle Dušana raspala na oblasti."
        uzor: "Posle Dušana vladao je slab car Uroš, koji nije mogao da obuzda moćnu vlastelu. Velikaši su se odvajali od centralne vlasti, najpre u Epiru i Tesaliji, a zatim i u starim oblastima. Tako je država ostala podeljena među oblasnim gospodarima."
        ideje: ["Uroš je bio slab vladar.", "Vlastela je bila jaka i odvajala se od centralne vlasti.", "Odvajanje je išlo od dalekog juga ka starim oblastima."]
        objasnjenje: "Uzrok je spoj slabog vladara i jake vlastele u razvijenom feudalizmu."
        iz_udzbenika: {strana: 41, odeljak: "Slabljenje balkanskih država u drugoj polovini XIV veka", tekst: "Pod Urošem se plemići osamostaljuju, prvo na jugu, pa i u starim srpskim oblastima."}
      - id: l10-nesloga-vlastele-objasni
        vrsta: objasni
        tezina: srednje
        pojmovi: [feudalizam, jovan-vi-kantakuzin]
        pitanje: "Zašto vlastela hrišćanskih država krajem XIV veka nije bila složna?"
        uzor: "U razvijenom feudalizmu oblasni gospodari su jačali, a centralna vlast je slabila. Svaki velikaš je gledao svoj interes i svoju oblast. Zato se nisu okupljali oko jednog vladara čak ni pred turskom opasnošću."
        ideje: ["Oblasni gospodari jačaju, a centralna vlast slabi.", "Svaki velikaš gleda sopstveni interes.", "Kantakuzin opisuje velikaše koji čekaju da se pridruže pobedniku."]
        objasnjenje: "Ovo je pitanje iz udžbenika: odgovor spaja feudalno društvo i lični interes velikaša."
        iz_udzbenika: {strana: 44, odeljak: "Pitanja za razmišljanje / Zadaci iz udžbenika", tekst: "Razvijeni feudalizam jača oblasne gospodare i slabi centralnu vlast, a svaki velikaš gleda svoj interes."}
  - naslov: "Turci Osmanlije i njihova prva osvajanja"
    zadaci:
      - id: l10-cimpe-izbor
        vrsta: izbor
        tezina: lako
        pojmovi: [cimpe, osmanlije]
        pitanje: "Koju su tvrđavu Turci zauzeli 1352. i odatle počeli da se naseljavaju u Evropi?"
        odgovori:
          - {tekst: "Cimpe", tacan: true}
          - {tekst: "Golubac", tacan: false, zasto: "Golubac je bio Lazarev posed, a ne prva turska tačka u Evropi."}
          - {tekst: "Niš", tacan: false, zasto: "Niš su Turci uzeli tek 1386, više od trideset godina kasnije."}
          - {tekst: "Gazimestan", tacan: false, zasto: "Gazimestan nije tvrđava, nego mesto na Kosovu gde je vođena bitka 1389."}
        pomoc: ["Tvrđava je bila napuštena kada su je Turci zauzeli.", "Ime joj počinje na C.", "Iz lekcije: 1352. Turci zauzimaju napuštenu tvrđavu Cimpe."]
        objasnjenje: "Cimpe je prva turska tačka oslonca u Evropi; odatle počinje njihovo naseljavanje."
        iz_udzbenika: {strana: 41, odeljak: "Turci Osmanlije i njihova prva osvajanja", tekst: "Turci su 1352. zauzeli napuštenu tvrđavu Cimpe, i odatle je počelo njihovo naseljavanje Evrope."}
        osa: {naziv: "Turci zauzimaju Cimpe", od: 1352, traka: dogadjaji}
      - id: l10-janicari-izbor
        vrsta: izbor
        tezina: lako
        pojmovi: [janicari, osmanlije]
        pitanje: "Ko su bili janičari?"
        odgovori:
          - {tekst: "Turski vojnici plaćeni doživotno, prva stajaća vojska u Evropi", tacan: true}
          - {tekst: "Srpski velikaši u Makedoniji", tacan: false, zasto: "Velikaši u Makedoniji bili su turski vazali, a ne janičari."}
