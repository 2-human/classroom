        objasnjenje: "Smrću jakog vladara nestalo je onoga ko drži velikaše pod kontrolom."
        iz_udzbenika: {strana: 43, odeljak: "Iz istorijskih izvora", tekst: "Kantakuzin piše da se posle Dušanove smrti među Srbima razbuktao veliki nered."}
