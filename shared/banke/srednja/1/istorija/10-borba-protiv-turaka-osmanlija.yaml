          naslov: "Zapis o nemirima posle Dušanove smrti"
          tekst: "Jedni velikaši pomagali su Urošu, ali nisu učestvovali u borbi niti su ga priznavali za gospodara. Drugi su pomagali njegovog strica Simeona. Treći nisu prišli nikome, nego su čuvali vojsku i čekali da se pridruže pobedniku."
          napomena: "Odlomak je prepričan; udžbenik, str. 43–44."
        pitanje: "Šta odlomak najbolje pokazuje o srpskim velikašima?"
        odgovori:
          - {tekst: "Svaki je gledao svoj interes, a ne interes države", tacan: true}
