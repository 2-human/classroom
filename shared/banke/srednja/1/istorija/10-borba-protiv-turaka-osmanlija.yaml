        pomoc: ["1371. je godina Marice.", "Bajazit je nasledio sultana poginulog na Kosovu.", "Iz lekcije: 15. (28) juna 1389, Gazimestan, knez Lazar i sultan Murat."]
        objasnjenje: "Ovo su osnovni podaci: datum, mesto i dvojica vladara."
        iz_udzbenika: {strana: 42, odeljak: "Bitka na Kosovu 1389.", tekst: "Bitka se vodi 15. (28) juna 1389. na Gazimestanu, a na bojište dolaze knez Lazar i sultan Murat."}
        osa: {naziv: "Bitka na Kosovu", od: 1389, traka: dogadjaji}
