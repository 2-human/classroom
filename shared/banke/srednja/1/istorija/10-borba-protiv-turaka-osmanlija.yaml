        objasnjenje: "Presudile su posledice: većina vlastele je izginula, a društvo taj gubitak nije moglo da nadoknadi."
        iz_udzbenika: {strana: 43, odeljak: "Bitka na Kosovu 1389.", tekst: "Srpsko društvo nije moglo da nadoknadi gubitak većine vlastele, pa se Lazareva vojska računa kao poražena."}
        osa: {naziv: "Bitka na Kosovu", od: 1389, traka: dogadjaji}
      - id: l10-lazar-murat-licno-tn
