        tekst: "Posle Marice velikaši u Makedoniji bili su turski {{vazali}}, a u druge oblasti Turci su slali manje jedinice da {{pljačkaju}} i šire strah. U prvi mah se verovalo da su na Kosovu pobedili {{Srbi}}, jer su Turci {{napustili}} Kosovo."
        pomoc: ["Prva praznina je pojam iz okvira uz Maricu.", "Manje jedinice nisu osvajale, već su oduzimale plen.", "Iz lekcije: vazali; pljačka i širenje straha; Turci su napustili Kosovo."]
        objasnjenje: "Turci su između dve bitke polako slabili protivnika, a posle Kosova su se povukli, što je zavaralo savremenike."
        iz_udzbenika: {strana: 42, odeljak: "Bitka na Kosovu 1389.", tekst: "Velikaši u Makedoniji su turski vazali, a manje jedinice pljačkaju i šire strah."}
      - id: l10-kosovo-ucesnici-povezi
