        objasnjenje: "Istorija razlikuje ono što je potvrđeno od onoga što su kasnije dodali predanje i prvi utisak."
        iz_udzbenika: {strana: 43, odeljak: "Bitka na Kosovu 1389.", tekst: "Lekcija razlikuje činjenice od legende o Milošu Obiliću i prvog verovanja u pobedu."}
