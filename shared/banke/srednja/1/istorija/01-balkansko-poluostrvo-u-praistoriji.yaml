        uzor: "Sve što znamo o praistoriji dolazi iz nalaza, pa svako novo iskopavanje može da dopuni ili ispravi sliku. Neistraženi lokaliteti mogu da kriju važne tragove prošlosti. Zato ih treba čuvati i istraživati."
