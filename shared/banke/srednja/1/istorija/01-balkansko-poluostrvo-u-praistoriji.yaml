          - "Navodi kamena i metalna doba."
          - "Alat ostaje kao materijalni trag kad nema pisma."
        objasnjenje: "Merilo podele je ono što se sačuvalo: alat."
        iz_udzbenika:
          strana: 8
          odeljak: "Preistorijska nalazišta i kulture na Balkanu"
          tekst: "Podela na razdoblja vrši se po materijalu od kog je čovek pravio alat."
