        uzor: "Arheologija je nauka koja istražuje ono što je od prošlosti materijalno ostalo. To su posuđe, oružje i nakit, ali i ostaci kuća i tvrđava. Za praistoriju je najvažnija jer pisanih izvora nema."
        ideje:
          - "Proučava materijalne ostatke prošlosti."
          - "Navodi primere: posuđe, oružje, nakit, kuće, tvrđave."
          - "Za praistoriju nema pisanih izvora."
        objasnjenje: "Arheologija čita stvari kao što istoričar čita tekstove."
        iz_udzbenika:
          strana: 8
          odeljak: "Preistorijska nalazišta i kulture na Balkanu"
          tekst: "Arheologija istražuje posuđe, oružje, nakit i ostatke objekata."
