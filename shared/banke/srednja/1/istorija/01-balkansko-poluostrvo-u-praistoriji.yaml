        uzor: "Praistorija se najčešće deli po materijalu od kog je čovek pravio alat. Zato imamo kamena doba (paleolit, mezolit, neolit) i metalna doba (bakarno, bronzano, gvozdeno). Materijal je pogodno merilo jer alat ostaje sačuvan, a pisanih izvora nema."
