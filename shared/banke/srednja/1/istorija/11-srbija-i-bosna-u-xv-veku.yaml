delovi:
  # ==========================================================================
  - naslov: "Srpska država nakon Kosovske bitke"
    zadaci:
      - id: l11-lazarevic-izbor-ko
        vrsta: izbor
        tezina: lako
        pojmovi: [stefan-lazarevic, knez-lazar, kosovski-boj]
        pitanje: "Ko preuzima vlast nad srpskom državom u godinama posle boja na Kosovu?"
        odgovori:
          - {tekst: "Stefan Lazarević, sin kneza Lazara", tacan: true}
          - {tekst: "Vuk Branković", tacan: false, zasto: "Vuk Branković je protivnička strana: njegovi potomci se sukobljavaju sa Lazarevićima, a vlast drži Lazarev sin Stefan."}
          - {tekst: "Tvrtko I Kotromanić", tacan: false, zasto: "Tvrtko I je bosanski kralj i umire 1391; srpskom državom vlada Stefan Lazarević."}
          - {tekst: "Stefan Vukčić Kosača", tacan: false, zasto: "Kosača je vlastelin koji se osamostaljuje na jugu Bosne, a ne srpski vladar."}
        pomoc:
          - "Vlast posle Kosova ostaje u porodici vladara koji je predvodio Srbe."
          - "Traži sina kneza Lazara."
          - "Iz lekcije: Lazarev sin Stefan Lazarević vlada od 1389. do 1427."
        objasnjenje: "Nasleđe srpske države preuzima Stefan Lazarević, sin kneza Lazara. Očevim teritorijama vlada kao vazal Turaka."
        iz_udzbenika: {strana: 45, odeljak: "Srpska država nakon Kosovske bitke", tekst: "Posle Kosova državu preuzima Stefan Lazarević (1389–1427), koji očevim zemljama vlada kao turski vazal."}
        osa: {naziv: "Stefan Lazarević", od: 1389, do: 1427, traka: vladari}

      - id: l11-despot-izbor-od-koga
        vrsta: izbor
        tezina: lako
        pojmovi: [despot, stefan-lazarevic]
        pitanje: "Od koga Stefan Lazarević dobija titulu despota?"
        odgovori:
          - {tekst: "Od vizantijskog cara", tacan: true}
          - {tekst: "Od ugarskog kralja", tacan: false, zasto: "Od ugarskog kralja dobija teritorije, Mačvu s Beogradom; titula stiže iz Vizantije."}
          - {tekst: "Od turskog sultana", tacan: false, zasto: "Turcima je vazal, ali titulu despota dodeljuje vizantijski car."}
          - {tekst: "Od dubrovačkih trgovaca", tacan: false, zasto: "Dubrovčani posluju u Despotovini kao trgovci i ne dodeljuju titule; to čini vizantijski car."}
        pomoc:
          - "Titula je visoka i odmah je ispod carske."
          - "Dodeljuje je vladar koji i sam nosi carsku titulu."
          - "Iz lekcije: titulu despota dobija 1402. od vizantijskog cara."
        objasnjenje: "Stefan Lazarević 1402. dobija titulu despota od vizantijskog cara. Zato se njegova država zove Despotovina."
        iz_udzbenika: {strana: 45, odeljak: "Srpska država nakon Kosovske bitke", tekst: "Titulu despota Stefan dobija 1402. od vizantijskog cara.", slika: "11-srbija-i-bosna-u-xv-veku/01-despot-stefan-lazarevic.jpg"}
        osa: {naziv: "Stefan Lazarević dobija titulu despota", od: 1402, traka: dogadjaji}

      - id: l11-macva-izbor-sta-dobija
        vrsta: izbor
        tezina: srednje
        pojmovi: [macva, beograd, ugarska, vazal]
        pitanje: "Šta Stefan Lazarević dobija na upravu 1403. kao ugarski vazal?"
        odgovori:
          - {tekst: "Mačvu s Beogradom", tacan: true}
          - {tekst: "Novo Brdo i Srebrenicu", tacan: false, zasto: "To su važni rudnici Despotovine, a ne ono što Ugarska daje 1403; od nje dobija Mačvu s Beogradom."}
          - {tekst: "Hercegovinu", tacan: false, zasto: "Hercegovina je zemlja Stefana Vukčića Kosače, na jugu Bosne."}
          - {tekst: "Smederevo", tacan: false, zasto: "Smederevo Ugarska ne daje; to je grad čija tvrđava nastaje novcem iz rudnika."}
        pomoc:
          - "Ugarska mu daje oblast sa gradom koji odmah postaje važan."
          - "U tom paketu je budući glavni grad."
          - "Iz lekcije: 1403. dobija na upravu Mačvu s Beogradom."
        objasnjenje: "Zauzvrat za vazalne obaveze prema Ugarskoj, Stefan 1403. dobija Mačvu s Beogradom."
        iz_udzbenika: {strana: 45, odeljak: "Srpska država nakon Kosovske bitke", tekst: "Prihvatajući obaveze prema Ugarskoj, Stefan 1403. dobija na upravu Mačvu s Beogradom."}
        osa: {naziv: "Beograd postaje srpska prestonica", od: 1403, traka: dogadjaji}

      - id: l11-beograd-izbor-novo
        vrsta: izbor
        tezina: srednje
        pojmovi: [beograd, srpska-prestonica]
        pitanje: "Šta je 1403. bilo novo u vezi sa Beogradom? Izaberi sve što je tačno."
        odgovori:
          - {tekst: "Prvi put je duže vreme u granicama srpske države", tacan: true}
          - {tekst: "Prvi put je srpska prestonica", tacan: true}
          - {tekst: "Prvi put pada pod Turke", tacan: false, zasto: "Beograd te godine ne osvajaju Turci, nego ga Stefan dobija od Ugarske."}
          - {tekst: "Postaje sedište bosanskih kraljeva", tacan: false, zasto: "Beograd postaje srpska, a ne bosanska prestonica."}
        pomoc:
          - "Važna su dva „prvi put”."
          - "Jedno se tiče granica, drugo uloge grada u državi."
          - "Iz lekcije: Beograd je prvi put duže u srpskoj državi i prvi put prestonica."
        objasnjenje: "Dobijanjem Mačve s Beogradom grad prvi put duže ostaje u srpskoj državi i prvi put postaje njena prestonica."
        iz_udzbenika: {strana: 45, odeljak: "Srpska država nakon Kosovske bitke", tekst: "Beograd je tada prvi put duže vreme u srpskoj državi i prvi put srpska prestonica.", slika: "11-srbija-i-bosna-u-xv-veku/02-beograd-despota-stefana.jpg"}
        osa: {naziv: "Beograd postaje srpska prestonica", od: 1403, traka: dogadjaji}

      - id: l11-vazal-izbor-dvostruki
        vrsta: izbor
        tezina: tesko
        pojmovi: [vazal, stefan-lazarevic, ugarska, osmanlije]
        pitanje: "Šta je bilo najosobenije u položaju Stefana Lazarevića?"
        odgovori:
          - {tekst: "Bio je istovremeno vazal dve sile koje su međusobno ratovale na njegovoj teritoriji", tacan: true}
          - {tekst: "Bio je potpuno nezavisan od svih suseda", tacan: false, zasto: "Imao je obaveze i prema Turcima i prema Ugarskoj, pa nije bio nezavisan od suseda."}
          - {tekst: "Bio je vazal samo Bosne", tacan: false, zasto: "Bosna mu nije bila gospodar; vazal je Turcima i Ugarskoj."}
          - {tekst: "Vladao je i Vizantijom", tacan: false, zasto: "Vizantija mu je dala titulu; njom vlada vizantijski car, a ne Stefan."}
        pomoc:
          - "Nabroj kome je sve imao vazalne obaveze."
          - "Seti se čije vojske se sukobljavaju na tlu Despotovine."
          - "Iz lekcije: vazal je Turaka i Ugarske, a njihove vojske se bore na tlu Despotovine."
        objasnjenje: "Stefan je dvostruki vazal: Turaka i Ugarske. Te dve sile su se više puta sukobile baš na tlu Despotovine, pa je položaj bio veoma težak."
        iz_udzbenika: {strana: 45, odeljak: "Srpska država nakon Kosovske bitke", tekst: "Stefan je vazal Turaka i Ugarske, a ugarska i turska vojska se više puta sukobljavaju na tlu despotovine."}

      - id: l11-lazar-tn-sin
        vrsta: tacno_netacno
        tezina: lako
        pojmovi: [stefan-lazarevic, knez-lazar]
        tvrdnja: "Stefan Lazarević je sin kneza Lazara."
        tacno: true
        pomoc:
          - "Pogledaj prezime: šta ono govori o ocu?"
          - "Ime Lazarević znači Lazarev potomak."
          - "Iz lekcije: Stefan Lazarević je sin kneza Lazara."
        objasnjenje: "Tačno. Stefan je Lazarev sin i posle Kosova preuzima očeve teritorije."
        iz_udzbenika: {strana: 45, odeljak: "Uvod", tekst: "Stefan Lazarević, sin kneza Lazara, posle boja na Kosovu ulazi u vazalni odnos prema Turcima."}

      - id: l11-kosovo-tn-nestala
        vrsta: tacno_netacno
        tezina: lako
        pojmovi: [kosovski-boj, srpska-despotovina, vazal]
        tvrdnja: "Posle boja na Kosovu 1389. srpska država je odmah potpuno nestala."
        tacno: false
        ispravke:
          - {tekst: "Srbija je posle Kosova postala turska vazalna kneževina i opstala do 1459.", tacan: true}
          - {tekst: "Srbija je posle Kosova postala deo Bosne.", tacan: false, zasto: "Srbija ne ulazi u Bosnu; opstaje kao država pod turskim vazalstvom."}
          - {tekst: "Srbija je posle Kosova postala carstvo.", tacan: false, zasto: "Stefan ima titulu despota, a država je vazalna, pa carstva nema."}
        pomoc:
          - "Koliko dugo je trajala Despotovina?"
          - "Lekcija se bavi državom koja postoji i posle Kosova."
          - "Iz lekcije: posle 1389. Srbija je turska vazalna kneževina."
        objasnjenje: "Netačno. Država opstaje kao turski vazal, učvršćuje se pod Stefanom Lazarevićem i traje do pada Smedereva 1459."
        iz_udzbenika: {strana: 47, odeljak: "Zapamtite", tekst: "Posle Kosova 1389. Srbija je turska vazalna kneževina."}
        osa: {naziv: "Bitka na Kosovu", od: 1389, traka: dogadjaji}

      - id: l11-vojske-tn-tlo
        vrsta: tacno_netacno
        tezina: srednje
        pojmovi: [srpska-despotovina, ugarska, osmanlije]
        tvrdnja: "Ugarska i turska vojska su se više puta sukobile na tlu Despotovine."
        tacno: true
        pomoc:
          - "Pogledaj gde je Despotovina u odnosu na te dve sile."
          - "Zemlja između dve sile lako postane bojište."
          - "Iz lekcije: na tlu despotovine više puta su se sukobljavale ugarska i turska vojska."
        objasnjenje: "Tačno. Despotovina se nalazi između dve sile, pa je njena zemlja postajala bojište."
        iz_udzbenika: {strana: 45, odeljak: "Srpska država nakon Kosovske bitke", tekst: "Na tlu despotovine više puta su se sukobljavale ugarska i turska vojska."}

      - id: l11-sukob-tn-pocetak
        vrsta: tacno_netacno
        tezina: srednje
        pojmovi: [vuk-brankovic, stefan-lazarevic, knez-lazar]
        tvrdnja: "Sukobi Lazarevića i potomaka Vuka Brankovića počinju tek posle smrti Stefana Lazarevića."
        tacno: false
        ispravke:
          - {tekst: "Ti sukobi traju još od smrti kneza Lazara.", tacan: true}
          - {tekst: "Ti sukobi počinju tek padom Smedereva.", tacan: false, zasto: "Pad Smedereva je kraj države; sukobi su počeli mnogo ranije, od Lazareve smrti."}
          - {tekst: "Lazarevići i Brankovići se nikada nisu sukobljavali.", tacan: false, zasto: "Sukobljavali su se, a pomirenje dolazi tek 1413."}
        pomoc:
          - "Seti se kada dolazi pomirenje: još za Stefanovog života."
          - "Sukob je morao da počne pre 1413."
          - "Iz lekcije: sukobi traju od smrti kneza Lazara."
        objasnjenje: "Netačno. Sukobi počinju smrću kneza Lazara, a smiruju se pomirenjem iz 1413. i priznanjem naslednika 1425."
        iz_udzbenika: {strana: 45, odeljak: "Srpska država nakon Kosovske bitke", tekst: "Od smrti kneza Lazara u Srbiji traju sukobi Lazarevića i potomaka Vuka Brankovića."}

      - id: l11-redosled-tn-pomirenje
        vrsta: tacno_netacno
        tezina: srednje
        pojmovi: [stefan-lazarevic, djuradj-brankovic]
        tvrdnja: "Stefan je prvo priznao Đurđa Brankovića za naslednika, a tek onda se pomirio s njim."
        tacno: false
        ispravke:
          - {tekst: "Prvo je došlo pomirenje (1413), a priznanje za naslednika dvanaest godina kasnije (1425).", tacan: true}
          - {tekst: "Oba događaja su se desila iste godine.", tacan: false, zasto: "Između njih je dvanaest godina: pomirenje je 1413, a priznanje 1425."}
          - {tekst: "Do pomirenja nikada nije došlo.", tacan: false, zasto: "Do pomirenja jeste došlo, 1413, i ono je doprinelo stabilnosti."}
        pomoc:
          - "Da li bi priznao za naslednika nekoga s kim je u sukobu?"
          - "Uporedi godine 1413. i 1425."
          - "Iz lekcije: pomirenje 1413, priznanje 1425."
        objasnjenje: "Netačno. Redosled je logičan: pomirenje 1413, pa priznanje naslednika 1425."
        iz_udzbenika: {strana: 45, odeljak: "Srpska država nakon Kosovske bitke", tekst: "Stabilnosti su doprineli pomirenje Stefana i Đurđa (1413) i Stefanovo priznanje Đurđa za naslednika (1425)."}

      - id: l11-trajanje-tn-sedamdeset
        vrsta: tacno_netacno
        tezina: tesko
        pojmovi: [kosovski-boj, srpska-despotovina, smederevo]
        tvrdnja: "Srpska država je posle boja na Kosovu opstala još oko sedamdeset godina."
        tacno: true
        pomoc:
          - "Pronađi godinu boja i godinu pada Smedereva."
          - "Oduzmi: 1459 minus 1389."
          - "Iz lekcije: Kosovo 1389, pad Smedereva 1459."
        objasnjenje: "Tačno. Od 1389. do 1459. prošlo je sedamdeset godina, iako je država sve vreme bila u teškom položaju."
        iz_udzbenika: {strana: 45, odeljak: "Uvod", tekst: "Despotovina se, iako u vrlo teškom položaju, održava do sredine XV veka i propada 1459."}

      - id: l11-dvostruki-tn-samo-ugarska
        vrsta: tacno_netacno
        tezina: tesko
        pojmovi: [vazal, ugarska, osmanlije, macva]
        tvrdnja: "Kad je postao vazal Ugarske i dobio Mačvu, Stefan je prestao da bude vazal Turaka."
        tacno: false
        ispravke:
          - {tekst: "Vazalne obaveze prema Ugarskoj je primio uz one prema Turcima, pa je bio vazal obema silama.", tacan: true}
          - {tekst: "Stefan nikada nije bio vazal Turaka.", tacan: false, zasto: "Očevim teritorijama je vladao upravo kao vazal Turaka."}
          - {tekst: "Stefan je Mačvu osvojio ratom protiv Ugarske.", tacan: false, zasto: "Mačvu dobija na upravu od Ugarske, zauzvrat za vazalne obaveze, a ne ratom."}
        pomoc:
          - "Pročitaj pažljivo: lekcija kaže da obaveze prima „i” prema Ugarskoj."
          - "Reč „i” znači da se jedno dodaje drugom."
          - "Iz lekcije: vazal je i Turcima i Ugarskoj."
        objasnjenje: "Netačno. Ugarsko vazalstvo se dodaje turskom, pa je Stefan dvostruki vazal."
        iz_udzbenika: {strana: 45, odeljak: "Srpska država nakon Kosovske bitke", tekst: "Vazalne obaveze Stefan prima i prema Ugarskoj, a ostaje vazal Turaka."}

      - id: l11-titula-dopuni-godine
        vrsta: dopuni
        tezina: srednje
        pojmovi: [despot, macva, beograd, ugarska]
        pitanje: "Dopuni tekst."
        tekst: "Titulu despota Stefan dobija {{1402}}. od {{vizantijskog}} cara, a već {{1403}}. od {{Ugarske}} prima Mačvu s Beogradom."
        ponudjene: ["1402", "1403", "1413", "vizantijskog", "turskog", "Ugarske", "Bosne"]
        pomoc:
          - "Dve godine stoje jedna do druge: titula je prva."
          - "Teritorije daje Ugarska, a titulu vizantijski car."
          - "Iz lekcije: 1402. titula od vizantijskog cara, 1403. Mačva s Beogradom od Ugarske."
        objasnjenje: "U dve uzastopne godine Stefan dobija ugled (titulu 1402) i zemlju (Mačvu s Beogradom 1403)."
        iz_udzbenika: {strana: 45, odeljak: "Srpska država nakon Kosovske bitke", tekst: "Stefan 1402. dobija titulu despota od vizantijskog cara, a 1403. od Ugarske Mačvu s Beogradom."}

      - id: l11-stabilnost-dopuni-brankovic
        vrsta: dopuni
        tezina: tesko
        pojmovi: [djuradj-brankovic, vuk-brankovic, stefan-lazarevic]
        pitanje: "Dopuni tekst bez ponuđenih reči."
        tekst: "Sukobi {{Lazarevića}} i potomaka Vuka {{Brankovića}} smiruju se pomirenjem {{1413}}. godine, a {{1425}}. Stefan priznaje Đurđa za {{naslednika}}."
        pomoc:
          - "Jedna porodica nosi ime po knezu Lazaru."
          - "Godine se razlikuju za dvanaest."
          - "Iz lekcije: pomirenje 1413, priznanje za naslednika 1425."
        objasnjenje: "Pomirenje i priznanje naslednika doneli su stabilnost posle dugog sukoba dve porodice."
        iz_udzbenika: {strana: 45, odeljak: "Srpska država nakon Kosovske bitke", tekst: "Stabilnosti su doprineli pomirenje Stefana i Đurđa (1413) i priznanje Đurđa za naslednika (1425)."}

      - id: l11-povezi-godine
        vrsta: povezi
        tezina: lako
        pojmovi: [kosovski-boj, despot, beograd, smederevo]
        pitanje: "Poveži godinu sa događajem."
        parovi:
          - ["1389", "Boj na Kosovu"]
          - ["1402", "Stefan dobija titulu despota"]
          - ["1403", "Beograd postaje srpska prestonica"]
          - ["1459", "Turci osvajaju Smederevo"]
        pomoc:
          - "Prva i poslednja godina su početak i kraj Despotovine."
          - "Titula dolazi godinu dana pre prestonice."
          - "Iz lekcije: 1389. Kosovo, 1402. titula, 1403. Beograd, 1459. Smederevo."
        objasnjenje: "Ove četiri godine su okvir lekcije o Srbiji: od Kosova do pada Smedereva."
        iz_udzbenika: {strana: 45, odeljak: "Srpska država nakon Kosovske bitke", tekst: "Lekcija prati srpsku državu od 1389. do 1459."}

      - id: l11-povezi-pojmovi
        vrsta: povezi
        tezina: srednje
        pojmovi: [despot, vazal, macva, srpska-despotovina]
        pitanje: "Poveži pojam sa njegovim opisom."
        parovi:
          - ["despot", "titula odmah ispod carske"]
          - ["vazal", "vladar sa obavezama prema jačem gospodaru"]
          - ["Mačva s Beogradom", "teritorija dobijena od Ugarske"]
          - ["Despotovina", "srpska država koja traje do 1459."]
        pomoc:
          - "Jedan pojam je titula, drugi je položaj vladara."
          - "Dva pojma su mesta: teritorija i država."
          - "Iz lekcije: despot je titula, vazal položaj, Mačva dar Ugarske, Despotovina država do 1459."
        objasnjenje: "Stefan je despot po tituli, vazal po položaju, gospodar Mačve po ugovoru sa Ugarskom i vladar Despotovine."
        iz_udzbenika: {strana: 45, odeljak: "Srpska država nakon Kosovske bitke", tekst: "Stefan ima titulu despota, vazal je Turaka i Ugarske i od Ugarske dobija Mačvu s Beogradom."}

      - id: l11-povezi-uzrok-posledica
        vrsta: povezi
        tezina: tesko
        pojmovi: [kosovski-boj, vazal, macva, djuradj-brankovic, srpska-despotovina]
        pitanje: "Poveži uzrok sa njegovom posledicom."
        parovi:
          - ["Poraz na Kosovu", "Srbija postaje turski vazal"]
