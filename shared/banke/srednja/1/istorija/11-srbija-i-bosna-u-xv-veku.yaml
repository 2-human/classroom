          napomena: "Odlomak je prepričan; udžbenik, str. 47."
        pitanje: "Kakvi su odnosi despota i ugarskog kralja, prema ovom odlomku?"
        odgovori:
          - {tekst: "Dobri i bliski", tacan: true}
          - {tekst: "Neprijateljski, stalno ratuju", tacan: false, zasto: "Odlomak govori o darovima i posetama, a to su znaci dobrih odnosa."}
          - {tekst: "Nikada se nisu sreli", tacan: false, zasto: "Sreću se često i posete su uzajamne."}
          - {tekst: "Despot je kralju plaćao danak u zlatu", tacan: false, zasto: "U odlomku darove prima despot, a ne kralj."}
        pomoc:
          - "Pronađi u odlomku reči koje pokazuju prijateljstvo."
          - "Ko kome daje darove i ko koga posećuje?"
          - "Iz lekcije: odlomak govori o dobrim odnosima despota i kralja Žigmunda."
        objasnjenje: "Darovi i uzajamne posete pokazuju dobre odnose despota i kralja Žigmunda."
        iz_udzbenika: {strana: 47, odeljak: "Iz istorijskih izvora", tekst: "Konstantin Filozof piše o dobrim odnosima despota i ugarskog kralja Žigmunda."}

      - id: l11-izvor-sta-dobija
        vrsta: izvor
        tezina: srednje
        pojmovi: [konstantin-filozof, zigmund, stefan-lazarevic]
        izvor:
          autor: "Konstantin Filozof"
          naslov: "O despotu i ugarskom kralju"
          tekst: "Sa ugarske strane despot prima utvrđene gradove, sela i drugo, i to znaju sve okolne države. Od sedme godine po kraljevom dolasku, svake godine putuje na zapadni sabor, odakle se vraća sa novim gradovima i zemljama."
          napomena: "Odlomak je prepričan; udžbenik, str. 47."
        pitanje: "Šta iz odlomka saznajemo o tome kako je rasla Stefanova teritorija?"
        odgovori:
          - {tekst: "Rasla je i posle Mačve, kroz dobre odnose sa Ugarskom, jer se sa sabora vraćao sa novim gradovima i zemljama", tacan: true}
          - {tekst: "Rasla je samo ratovima protiv Ugarske", tacan: false, zasto: "Odlomak ne govori o ratu, nego o darovima i saborima."}
          - {tekst: "Nije rasla, jer je despot sve vreme gubio gradove", tacan: false, zasto: "U odlomku despot gradove dobija, a ne gubi."}
          - {tekst: "Rasla je kupovinom gradova od Dubrovčana", tacan: false, zasto: "Izvor navodi darove sa ugarske strane, a ne kupovinu."}
        pomoc:
          - "Šta se u odlomku ponavlja svake godine?"
          - "Pronađi šta despot donosi sa sabora."
          - "Iz lekcije: po izvoru dobija gradove, sela i zemlje na ugarskoj strani."
        objasnjenje: "Pored Mačve s Beogradom, izvor navodi i gradove, sela i zemlje koje je dobijao od Ugarske."
        iz_udzbenika: {strana: 47, odeljak: "Iz istorijskih izvora", tekst: "Po izvoru despot dobija gradove, sela i zemlje, a sa zapadnog sabora se vraća sa novim posedima."}

      - id: l11-izvor-kod-kuce
        vrsta: izvor
        tezina: srednje
        pojmovi: [konstantin-filozof, zigmund, beograd]
        izvor:
          autor: "Konstantin Filozof"
          naslov: "O despotu i ugarskom kralju"
          tekst: "Biograf kaže da su se kralj i despot kretali po ugarskim i srpskim gradovima sasvim opušteno, kao da u oba kraja borave u sopstvenoj kući. Beograd pritom naziva Beli grad."
          napomena: "Odlomak je prepričan; udžbenik, str. 47."
        pitanje: "Šta biograf želi da pokaže ovom slikom?"
        odgovori:
          - {tekst: "Koliko su bliski i poverljivi odnosi kralja i despota", tacan: true}
          - {tekst: "Da su Srbija i Ugarska ujedinjene u jednu državu", tacan: false, zasto: "Biograf i dalje razlikuje ugarske i srpske gradove; to je slika prijateljstva, a ne jedne države."}
          - {tekst: "Da kralj i despot nisu imali svoje dvorove", tacan: false, zasto: "Slika ne govori o nedostatku dvorova, nego o bliskosti: u gradovima drugog osećaju se kao kod svoje kuće."}
          - {tekst: "Da je Beograd bio ugarska prestonica", tacan: false, zasto: "Beograd je srpska prestonica, a kralj u njega dolazi kao gost."}
        pomoc:
          - "To je poređenje, ne doslovan opis."
          - "Kako se čovek oseća u sopstvenoj kući?"
          - "Iz lekcije: odlomak govori o dobrim odnosima despota i kralja."
        objasnjenje: "Poređenje sa sopstvenom kućom pokazuje poverenje i bliskost dvojice vladara."
        iz_udzbenika: {strana: 47, odeljak: "Iz istorijskih izvora", tekst: "Kralj i despot kretali su se po ugarskim i srpskim gradovima kao po sopstvenim domovima."}

      - id: l11-izvor-biograf
        vrsta: izvor
        tezina: tesko
        pojmovi: [konstantin-filozof, stefan-lazarevic]
        izvor:
          autor: "Konstantin Filozof"
          naslov: "Biografija despota Stefana Lazarevića"
          tekst: "Pisac despotove biografije opisuje kako je Stefan dobijao darove i kako su mu kralj i okolne zemlje ukazivali veliku pažnju."
          napomena: "Odlomak je prepričan; udžbenik, str. 47."
        pitanje: "Zašto istoričar treba da bude oprezan kada čita ovaj izvor?"
        odgovori:
          - {tekst: "Pisac je Stefanov biograf, pa može da ga prikazuje u što lepšem svetlu", tacan: true}
          - {tekst: "Odlomak uopšte ne govori o despotu", tacan: false, zasto: "Govori upravo o despotu i njegovim odnosima sa kraljem; oprezni smo zato što ga piše njegov biograf."}
          - {tekst: "Konstantin Filozof nije znao za despota", tacan: false, zasto: "Upravo je napisao njegovu biografiju."}
          - {tekst: "Izvor je ugarski, pa je protiv Stefana", tacan: false, zasto: "Izvor je nastao na tlu Despotovine i naklonjen je despotu."}
        pomoc:
          - "Pitaj se: ko piše i o kome?"
          - "Da li biograf vladara piše o njemu neutralno?"
          - "Iz lekcije: Konstantin Filozof je biograf despota Stefana."
        objasnjenje: "Izvor je koristan, ali pisac biografije je naklonjen svom junaku, zato njegove reči poredimo sa drugim izvorima."
        iz_udzbenika: {strana: 47, odeljak: "Iz istorijskih izvora", tekst: "Autor odlomka je Konstantin Filozof, biograf despota Stefana Lazarevića."}

      - id: l11-izvor-freska
        vrsta: izvor
        slika_u_pitanju: true
        tezina: srednje
        pojmovi: [stefan-lazarevic, despot]
        izvor:
          autor: "Freska iz udžbenika (Slika 46)"
          naslov: "Vladar sa krunom"
          tekst: "Vladar sa krunom i oreolom drži visok krst. Odeća mu je ukrašena krugovima i dvoglavim orlovima, a sa obe strane su manji likovi svetaca. Lice je delimično oštećeno."
          napomena: "Odlomak je prepričan; udžbenik, str. 45."
        pitanje: "Koga prikazuje ova freska?"
        odgovori:
          - {tekst: "Despota Stefana Lazarevića", tacan: true}
          - {tekst: "Kralja Stefana Tomaševića", tacan: false, zasto: "Tomašević je prikazan na drugoj slici u lekciji, u profilu i sa rukama u molitvi."}
          - {tekst: "Stefana Vukčića Kosaču", tacan: false, zasto: "Kosača je vlastelin u Bosni; ova freska prikazuje despota Stefana Lazarevića."}
          - {tekst: "Kralja Žigmunda", tacan: false, zasto: "Žigmund je ugarski kralj; ova freska prikazuje srpskog despota."}
        pomoc:
          - "Slika stoji uz odeljak o srpskoj državi posle Kosova."
          - "Vladar na njoj dobija titulu od vizantijskog cara."
          - "Iz lekcije: Slika 46 je despot Stefan Lazarević."
        objasnjenje: "Slika 46 prikazuje despota Stefana Lazarevića (1389–1427)."
        iz_udzbenika: {strana: 45, odeljak: "Srpska država nakon Kosovske bitke", tekst: "Uz tekst je prikazan despot Stefan Lazarević.", slika: "11-srbija-i-bosna-u-xv-veku/01-despot-stefan-lazarevic.jpg"}

      - id: l11-uporedi-gospodari
        vrsta: uporedi
        tezina: lako
        pojmovi: [osmanlije, ugarska, vazal, stefan-lazarevic]
        a: "Turci"
        b: "Ugarska"
        pitanje: "Na koga se odnosi tvrdnja: Turke, Ugarsku, oba ili nijedno?"
        tvrdnje:
          - {tekst: "Stefan Lazarević ima vazalne obaveze prema njima.", odgovor: oba, zasto: "Stefan je dvostruki vazal, i Turaka i Ugarske."}
          - {tekst: "Od njih dobija Mačvu s Beogradom.", odgovor: b, zasto: "Mačvu s Beogradom daje Ugarska, 1403."}
          - {tekst: "Pobedili su Srbiju na Kosovu.", odgovor: a, zasto: "Na Kosovu su Srbi poraženi od Turaka."}
          - {tekst: "Osvajaju Smederevo 1459.", odgovor: a, zasto: "Smederevo osvajaju Turci."}
          - {tekst: "Dodeljuju Stefanu titulu despota.", odgovor: nijedan, zasto: "Titulu daje vizantijski car."}
        pomoc:
          - "Seti se šta je Stefan dobijao od kog gospodara."
          - "Titula ne dolazi ni od jednih ni od drugih."
          - "Iz lekcije: vazal je obema silama, Mačva je od Ugarske, a titula od Vizantije."
        objasnjenje: "Obe sile su gospodari Despotovine, ali Turci je na kraju osvajaju, a Ugarska joj daje teritorije."
        iz_udzbenika: {strana: 45, odeljak: "Srpska država nakon Kosovske bitke", tekst: "Stefan je vazal Turaka i Ugarske; od Ugarske dobija Mačvu s Beogradom, a titulu od Vizantije."}

      - id: l11-uporedi-1402-1403
        vrsta: uporedi
        tezina: srednje
        pojmovi: [despot, macva, beograd]
        a: "Dobitak iz 1402."
        b: "Dobitak iz 1403."
        pitanje: "Na koji se dobitak odnosi tvrdnja: 1402, 1403, oba ili nijedan?"
        tvrdnje:
          - {tekst: "Stigao je iz Vizantije.", odgovor: a, zasto: "Titulu despota 1402. daje vizantijski car."}
          - {tekst: "Doneo je državi novu teritoriju.", odgovor: b, zasto: "Teritoriju donosi 1403, Mačva s Beogradom; 1402. je samo titula."}
          - {tekst: "Doneo je državi prestonicu.", odgovor: b, zasto: "Beograd je prestonica od 1403."}
          - {tekst: "Dobio ga je Stefan Lazarević.", odgovor: oba, zasto: "Oba dobitka su Stefanova."}
          - {tekst: "Oslobodio je državu od vazalstva.", odgovor: nijedan, zasto: "Stefan ostaje vazal; 1403. mu čak donosi i nove vazalne obaveze."}
        pomoc:
          - "Razlikuj ugled od zemlje."
          - "Godina 1402. je titula, 1403. teritorija."
          - "Iz lekcije: 1402. titula od Vizantije, 1403. Mačva s Beogradom od Ugarske."
        objasnjenje: "Godina 1402. donosi ugled, a 1403. zemlju i prestonicu; nezavisnost ne donosi nijedna."
        iz_udzbenika: {strana: 45, odeljak: "Srpska država nakon Kosovske bitke", tekst: "Stefan 1402. dobija titulu, a 1403. Mačvu s Beogradom."}

      - id: l11-ko-sam-stefan
        vrsta: ko_sam
        tezina: lako
        pojmovi: [stefan-lazarevic, despot, beograd]
        tragovi:
          - "Vlast nad srpskom državom preuzeo sam 1389, posle oca, kneza Lazara."
          - "Imam titulu odmah ispod carske."
          - "U moje vreme Beograd prvi put postaje srpska prestonica."
        odgovori:
          - {tekst: "Stefan Lazarević", tacan: true}
          - {tekst: "Đurađ Branković", tacan: false, zasto: "Đurađ je Stefanov priznati naslednik, a ne vladar od 1389."}
          - {tekst: "Stefan Tomašević", tacan: false, zasto: "Tomašević je poslednji bosanski vladar."}
          - {tekst: "Knez Lazar", tacan: false, zasto: "Lazar je otac despota Stefana; on nije nosio titulu despota."}
        objasnjenje: "To je despot Stefan Lazarević (1389–1427)."
        iz_udzbenika: {strana: 45, odeljak: "Srpska država nakon Kosovske bitke", tekst: "Stefan Lazarević vlada od 1389, ima titulu despota, a Beograd mu je prestonica.", slika: "11-srbija-i-bosna-u-xv-veku/01-despot-stefan-lazarevic.jpg"}

      - id: l11-ko-sam-djuradj
        vrsta: ko_sam
        tezina: srednje
        pojmovi: [djuradj-brankovic, vuk-brankovic, stefan-lazarevic]
        tragovi:
          - "Moja porodica se dugo sukobljavala sa Lazarevićima."
          - "Pomirio sam se sa despotom Stefanom 1413."
          - "Stefan me je 1425. priznao za naslednika."
        odgovori:
          - {tekst: "Đurađ Branković", tacan: true}
          - {tekst: "Vuk Branković", tacan: false, zasto: "Vuk je predak: sukobe vode njegovi potomci, a pomirenje sklapa Đurađ."}
          - {tekst: "Grigorije Camblak", tacan: false, zasto: "Camblak je pisac biografije Stefana Dečanskog, a ne naslednik."}
          - {tekst: "Žigmund", tacan: false, zasto: "Žigmund je ugarski kralj, a ne srpski naslednik."}
        objasnjenje: "To je Đurađ Branković, priznati naslednik despota Stefana."
        iz_udzbenika: {strana: 45, odeljak: "Srpska država nakon Kosovske bitke", tekst: "Stefan se 1413. pomirio sa Đurđem Brankovićem, a 1425. ga priznao za naslednika."}

      - id: l11-ko-sam-zigmund
        vrsta: ko_sam
        tezina: tesko
        pojmovi: [zigmund, ugarska, stefan-lazarevic]
        tragovi:
          - "Biograf despota Stefana piše o mojim dobrim odnosima sa despotom."
          - "Dolazio sam u Beli grad, a despot je dolazio kod mene."
          - "Ja sam ugarski kralj."
        odgovori:
          - {tekst: "Žigmund", tacan: true}
          - {tekst: "Tvrtko I", tacan: false, zasto: "Tvrtko I je bosanski kralj, a ne ugarski."}
          - {tekst: "Konstantin Filozof", tacan: false, zasto: "Konstantin je pisac tog odlomka, a ne kralj."}
          - {tekst: "Stefan Tomaš", tacan: false, zasto: "Stefan Tomaš je bosanski vladar, a ne ugarski kralj."}
        objasnjenje: "To je ugarski kralj Žigmund, o čijem prijateljstvu sa despotom piše Konstantin Filozof."
        iz_udzbenika: {strana: 47, odeljak: "Iz istorijskih izvora", tekst: "Odlomak Konstantina Filozofa govori o dobrim odnosima despota i ugarskog kralja Žigmunda."}

      - id: l11-objasni-vazal
        vrsta: objasni
        tezina: lako
        pojmovi: [vazal, stefan-lazarevic]
        pitanje: "Šta znači da je Stefan Lazarević bio vazal? Objasni svojim rečima i navedi kome je bio vazal."
        uzor: "Vazal je vladar koji ima obaveze prema jačem gospodaru. Stefan vlada svojom zemljom, ali zavisi od jačih. Bio je vazal Turaka, a kasnije i Ugarske, od koje je zauzvrat dobio Mačvu s Beogradom."
        ideje:
          - "Vazal ima obaveze prema jačem gospodaru."
          - "Stefan je bio vazal Turaka."
          - "Bio je i vazal Ugarske."
        objasnjenje: "Vazalstvo znači vladanje uz zavisnost; Stefan je imao dva gospodara."
        iz_udzbenika: {strana: 45, odeljak: "Srpska država nakon Kosovske bitke", tekst: "Stefan očevim teritorijama vlada kao turski vazal, a prima i vazalne obaveze prema Ugarskoj."}

      - id: l11-objasni-dve-sile
        vrsta: objasni
        tezina: srednje
        pojmovi: [srpska-despotovina, ugarska, osmanlije, vazal]
        pitanje: "Zašto se kaže da je položaj Despotovine bio vrlo težak?"
        uzor: "Despotovina je bila vazal dve sile, Turaka i Ugarske, koje su bile suprotstavljene. Njihove vojske su se više puta sukobljavale na njenom tlu. Pored toga, država je trpela turska pustošenja, a dugo su trajali i unutrašnji sukobi Lazarevića i Brankovića."
        ideje:
          - "Država je bila vazal dve sile."
          - "Vojske tih sila su se borile na njenom tlu."
          - "Turci su pustošili zemlju."
          - "Dugo su trajali unutrašnji sukobi."
        objasnjenje: "Teškoće su dolazile i spolja (dve sile) i iznutra (sukob porodica)."
        iz_udzbenika: {strana: 45, odeljak: "Srpska država nakon Kosovske bitke", tekst: "Despotovina je između dve sile, a od Lazareve smrti traju i unutrašnji sukobi."}

      - id: l11-objasni-kraj
        vrsta: objasni
        tezina: tesko
        pojmovi: [kosovski-boj, smederevo, srpska-despotovina]
        pitanje: "Zašto je Kosovo 1389. poraz, ali ne i kraj srpske države? Šta je onda kraj?"
        uzor: "Na Kosovu je Srbija poražena i postala je turski vazal, ali je država nastavila da postoji. Stefan Lazarević ju je učvrstio, a pod despotima je čak doživela privredni polet. Kraj dolazi 1459, kada Turci osvajaju Smederevo i srednjovekovna srpska država nestaje."
        ideje:
          - "Posle Kosova Srbija postoji kao turski vazal."
          - "Država se pod Stefanom učvršćuje i razvija."
          - "Kraj je pad Smedereva 1459."
        objasnjenje: "Razlika je između gubitka samostalnosti i nestanka države."
        iz_udzbenika: {strana: 45, odeljak: "Uvod", tekst: "Despotovina se održava do sredine XV veka, a konačno propada 1459."}
        osa: {naziv: "Pad Smedereva", od: 1459, traka: dogadjaji}

      - id: l11-objasni-beograd-cena
        vrsta: objasni
        tezina: tesko
        pojmovi: [beograd, ugarska, vazal, srpska-prestonica]
        pitanje: "Šta je Stefan dobio, a šta je „platio” prihvatajući vazalstvo prema Ugarskoj? Da li ti se ta razmena čini dobrom? Objasni."
        uzor: "Stefan je primio vazalne obaveze prema Ugarskoj, pa je zavisio od još jedne sile. Zauzvrat je dobio Mačvu s Beogradom, a Beograd je postao prestonica. Razmena je bila korisna jer je država dobila zemlju i glavni grad, iako je cena bila manja samostalnost."
        ideje:
          - "Cena: vazalne obaveze prema još jednoj sili."
          - "Dobitak: Mačva s Beogradom."
          - "Beograd je postao prestonica."
          - "Učenik obrazlaže svoj sud o toj razmeni."
        objasnjenje: "Vazalstvo nije samo gubitak: ponekad je to cena za zemlju i opstanak."
        iz_udzbenika: {strana: 45, odeljak: "Srpska država nakon Kosovske bitke", tekst: "Stefan prima vazalne obaveze prema Ugarskoj i zauzvrat 1403. dobija Mačvu s Beogradom."}
        osa: {naziv: "Beograd postaje srpska prestonica", od: 1403, traka: dogadjaji}

