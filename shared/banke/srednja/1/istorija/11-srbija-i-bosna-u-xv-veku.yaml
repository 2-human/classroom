          - "Mala Azija je jugoistočno od Balkana."
          - "Iz lekcije: strelice polaze iz Male Azije i idu ka severozapadu."
        objasnjenje: "Karta pokazuje pravac osvajanja: iz Male Azije preko Balkana ka Jadranu."
