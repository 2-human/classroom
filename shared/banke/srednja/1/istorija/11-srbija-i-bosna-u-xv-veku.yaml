        odgovori:
          - {tekst: "Rudarstvo i trgovina", tacan: true}
          - {tekst: "Ribolov i pomorstvo", tacan: false, zasto: "Lekcija ističe rudnike i trgovinu sa Dubrovčanima, a ne more."}
          - {tekst: "Štamparstvo i bankarstvo", tacan: false, zasto: "O njima lekcija ne govori; polet donose rudarstvo i trgovina."}
          - {tekst: "Samo stočarstvo", tacan: false, zasto: "Lekcija ističe rudnike Novo Brdo i Srebrenicu i trgovinu."}
        pomoc:
          - "Seti se Novog Brda i dubrovačkih trgovaca."
          - "Jedna grana je ispod zemlje, druga na putevima."
          - "Iz lekcije: u usponu su naročito rudarstvo i trgovina."
        objasnjenje: "I pored turskih pustošenja, privreda je u usponu, naročito rudarstvo i trgovina."
        iz_udzbenika: {strana: 46, odeljak: "Privredni i kulturni razvoj Despotovine", tekst: "Privreda Despotovine je u usponu, naročito rudarstvo i trgovina."}

      - id: l11-beograd-izbor-razvoj
        vrsta: izbor
        tezina: srednje
        pojmovi: [beograd]
        pitanje: "Kako se menja Beograd u doba Despotovine?"
