  novo-brdo: Novo Brdo
  srebrenica: Srebrenica
  dubrovcani: Dubrovčani
  pohvala-knezu-lazaru: Pohvala knezu Lazaru
  monahinja-jefimija: monahinja Jefimija
  konstantin-filozof: Konstantin Filozof
  grigorije-camblak: Grigorije Camblak
  stefan-decanski: Stefan Dečanski
