          naslov: "Turska osvajanja Balkanskog poluostrva"
          tekst: "Debele strelice polaze iz Male Azije, prelaze na Balkan i idu ka severozapadu, a zatim se granaju ka unutrašnjosti i Jadranu. Tanje strelice vode ka pojedinim mestima."
