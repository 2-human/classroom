      - id: l11-uporedi-srbija-bosna
        vrsta: uporedi
        tezina: tesko
        pojmovi: [srpska-despotovina, bosna, osmanlije]
        a: "Srpska despotovina"
        b: "Bosna"
        pitanje: "Na koju državu se odnosi tvrdnja: Despotovinu, Bosnu, obe ili nijednu?"
        tvrdnje:
          - {tekst: "Pala je pod Osmanlije.", odgovor: oba, zasto: "Obe su osvojene: 1459. i 1463."}
          - {tekst: "Unutrašnji sukob je smiren pomirenjem i priznanjem naslednika.", odgovor: a, zasto: "To je dogovor Stefana i Đurđa."}
          - {tekst: "Jugom se osamostaljuje vlastelin sa titulom herceg.", odgovor: b, zasto: "To je Kosača na jugu Bosne."}
          - {tekst: "Ima važne rudnike Novo Brdo i Srebrenicu.", odgovor: a, zasto: "To su rudnici despota Lazarevića."}
          - {tekst: "Sačuvala je slobodu do kraja srednjeg veka.", odgovor: nijedan, zasto: "Obe države su pale u XV veku."}
        pomoc:
          - "Seti se šta je smirivalo Srbiju, a šta se dešavalo u Bosni."
          - "Obe države imaju isti kraj."
          - "Iz lekcije: Despotovina pada 1459, Bosna 1463."
        objasnjenje: "Razvoj je različit, a kraj isti: pad pod Osmanlije."
        iz_udzbenika: {strana: 47, odeljak: "Zapamtite", tekst: "Srbija i Bosna imaju različite unutrašnje prilike, ali obe padaju pod Osmanlije."}

      - id: l11-objasni-hercegovina
        vrsta: objasni
        tezina: lako
        pojmovi: [hercegovina, herceg, stefan-vukcic-kosaca]
        pitanje: "Objasni kako je Hercegovina dobila ime."
        uzor: "Vlastelin Stefan Vukčić Kosača osamostalio se na jugu Bosne. Koristio je titulu „herceg od Svetog Save”. Po toj tituli njegova zemlja je nazvana Hercegovina."
        ideje:
          - "Kosača se osamostalio na jugu Bosne."
          - "Nosio je titulu herceg od Svetog Save."
          - "Ime zemlje dolazi od titule."
        objasnjenje: "Ime Hercegovina je ostatak titule herceg."
        iz_udzbenika: {strana: 47, odeljak: "Bosna u XV veku", tekst: "Kosača je koristio titulu herceg od Svetog Save, po čemu je njegova zemlja nazvana Hercegovina."}

      - id: l11-objasni-bosna-slabljenje
        vrsta: objasni
        tezina: srednje
        pojmovi: [bosna, tvrtko-i-kotromanic, osmanlije]
        pitanje: "Objasni korak po korak kako je Bosna od moćne države došla do pada 1463."
        uzor: "Smrću Tvrtka I 1391. moć Bosne naglo opada. Naslednici se suočavaju sa osamostaljivanjem vlastele i slabljenjem centralne vlasti, a jaki feudalci zovu ugarske i osmanlijske odrede. Jug se izdvaja kao Hercegovina. Poslednji vladari pokušavaju da ojačaju vlast, ali država pada 1463."
        ideje:
          - "Smrt Tvrtka I je početak slabljenja."
          - "Vlastela se osamostaljuje."
          - "Feudalci zovu strane odrede."
          - "Pokušaji poslednjih vladara ne uspevaju."
        objasnjenje: "Pad je kraj niza: smrt kralja, slaba vlast, razdor i osvajanje."
        iz_udzbenika: {strana: 46, odeljak: "Bosna u XV veku", tekst: "Moć Bosne opada od 1391, a država pada 1463."}
        osa: {naziv: "Pad Bosne", od: 1463, traka: dogadjaji}

      - id: l11-objasni-srbija-bosna
        vrsta: objasni
        tezina: tesko
        pojmovi: [srpska-despotovina, bosna, smederevo]
        pitanje: "Uporedi Srbiju i Bosnu u XV veku. Po čemu su slične, a po čemu se razlikuju?"
        uzor: "Obe države ugrožavaju Osmanlije i obe padaju, Srbija 1459, a Bosna 1463. Razlika je u unutrašnjim prilikama: u Srbiji se porodice Lazarević i Branković mire, a država doživljava privredni polet, dok u Bosni centralna vlast slabi i moćni feudalci se osamostaljuju."
        ideje:
          - "Obe padaju pod Osmanlije (1459. i 1463)."
          - "U Srbiji pomirenje i stabilnost."
          - "U Srbiji privredni polet."
          - "U Bosni slabljenje centralne vlasti."
        objasnjenje: "Uporedo: isti spoljni neprijatelj, različite unutrašnje prilike."
        iz_udzbenika: {strana: 47, odeljak: "Zapamtite", tekst: "Lekcija prikazuje Srbiju pod despotima i Bosnu posle smrti Tvrtka I."}
