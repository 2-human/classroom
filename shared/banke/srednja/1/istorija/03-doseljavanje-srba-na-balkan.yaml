          - {tekst: "Nisu prelazili granicu sve do IX veka.", tacan: false, zasto: "Sredinom VII veka već postoje snažne naseobine, pa je prelazak bio mnogo ranije."}
        pomoc:
          - "Seti se zašto Vizantija u VI veku nije mogla da brani granicu."
          - "Da li su se te teškoće popravile?"
