        pojmovi: [bugari, madjari, asparuh, oton-i]
        pitanje: "Opiši dolazak Bugara i Mađara i šta je bilo sa njima na novom tlu."
        uzor: "Bugari su pod kanom Asparuhom prešli Dunav i stigli do planine Balkan, ali su se stopili sa Slovenima, koji su preuzeli njihovo ime. Mađari su se krajem IX veka nastanili u Panonskoj niziji i odatle upadali u susedne zemlje dok ih Oton I nije zaustavio 955. U XI veku primili su hrišćanstvo."
        ideje:
          - "Bugari prelaze Dunav pod Asparuhom."
          - "Bugari se asimiluju među Slovenima."
          - "Mađari se krajem IX veka nastanjuju u Panoniji."
          - "Oton I ih zaustavlja 955. na Lehu."
        objasnjenje: "Odgovor treba da pokaže oba puta i različitu sudbinu dva naroda."
        iz_udzbenika:
          strana: 22
          odeljak: "Pitanja za razmišljanje / Zadaci iz udžbenika"
          tekst: "Udžbenik traži da opišeš dolazak Bugara i Mađara."

      - id: l03-ime-bez-naroda-objasni
        vrsta: objasni
        tezina: tesko
        pojmovi: [bugari, asimilacija, stari-sloveni]
        pitanje: "Zašto današnji Bugari nose ime azijskog plemena, iako su azijski Bugari nestali među Slovenima? Objasni i navedi šta je ovde asimilacija."
        uzor: "Azijski Bugari su bili manjina među Slovenima između Dunava i planine Balkan. Nisu ih izbrisali, nego su se sami stopili sa njima, što je primer asimilacije. Ime je ipak ostalo, jer su ga Sloveni preuzeli."
        ideje:
          - "Bugari su pleme iz Azije, manje brojno od Slovena."
          - "Stopili su se sa Slovenima (asimilacija)."
          - "Sloveni su preuzeli ime Bugari."
        objasnjenje: "Nestaje narod, a ostaje ime: to pokazuje koliko je asimilacija drugačija od osvajanja."
        iz_udzbenika:
          strana: 20
          odeljak: "Doseljavanje Bugara i Mađara"
          tekst: "Bugari su se asimilovali među Slovenima, a Sloveni su preuzeli ime Bugari."

  - naslov: "Pokrštavanje Južnih Slovena"
