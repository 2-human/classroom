          - {tekst: "To je naziv za pravu državu sa jakom vlašću.", tacan: false, zasto: "Sklavinije su plemenske oblasti, a ne razvijene države."}
        pomoc:
          - "Ko je o Slovenima tada pisao?"
          - "Sloveni tada nisu imali pismo."
          - "Iz lekcije: Vizantinci su te oblasti nazivali sklavinije."
        objasnjenje: "Netačno. To je vizantijski naziv, pogled sa strane na plemenske oblasti Slovena."
        iz_udzbenika:
          strana: 20
          odeljak: "Plemenski savezi"
          tekst: "Vizantinci su plemenske oblasti Slovena nazivali sklavinije."

      - id: l03-savezi-dopuni
        vrsta: dopuni
        tezina: lako
        pojmovi: [plemenski-savezi, raska, sklavinije]
        pitanje: "Dopuni rečenicu."
