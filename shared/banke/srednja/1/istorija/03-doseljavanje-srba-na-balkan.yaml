          - {tekst: "Bogatstvo", tacan: false, zasto: "O bogatstvu nema ni reči; naprotiv, drugi deo izvora pominje oskudicu."}
          - {tekst: "Učenost i pismenost", tacan: false, zasto: "Tada nisu imali pismo; izvor govori o slobodi, a ne o obrazovanju."}
        pomoc:
          - "Pročitaj drugu rečenicu."
          - "Šta ne podnose?"
          - "Iz lekcije: slobodoljubivi su i ne trpe da njima vladaju, naročito u svojoj zemlji."
        objasnjenje: "Vizantijski pisac ističe da Sloveni i Anti vole slobodu i ne podnose tuđu vlast."
        iz_udzbenika:
          strana: 21
          odeljak: "Iz istorijskih izvora"
          tekst: "Vizantijski izvor opisuje Slovene i Ante kao slobodoljubive i kaže da ne trpe da njima vladaju."

