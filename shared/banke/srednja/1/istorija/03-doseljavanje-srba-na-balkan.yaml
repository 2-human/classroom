delovi:
  - naslov: "Život u pradomovini, uzroci i pravci seobe"
    zadaci:
      - id: l03-huni-pokrecu-seobu-izbor
        vrsta: izbor
        tezina: lako
        pojmovi: [huni, velika-seoba-naroda]
        pitanje: "Čiji je upad u Evropu pokrenuo Veliku seobu naroda?"
        odgovori:
          - {tekst: "Upad Huna", tacan: true}
          - {tekst: "Upad Avara", tacan: false, zasto: "Avari stižu tek sredinom VI veka, skoro dva veka posle Huna, kada je seoba već uveliko trajala."}
          - {tekst: "Upad Mađara", tacan: false, zasto: "Mađari se javljaju u srednjoj Evropi tek krajem IX veka; seobu su pokrenuli Huni 375."}
          - {tekst: "Upad Bugara", tacan: false, zasto: "Bugari su pleme koje je doseljavalo kasnije; Huni su ti koji su prvi potisnuli narode na svom putu."}
        pomoc:
          - "Traži nomade koji su došli iz Azije još u IV veku."
          - "Njihov prolaz 375. uzima se kao početak seobe."
          - "Iz lekcije: upad nomada Huna u Evropu pokrenuo je veliku seobu naroda."
        objasnjenje: "Nomadi Huni došli su iz Azije i pokrenuli plemena na svom putu; zato se njihov upad uzima za početak Velike seobe naroda."
        iz_udzbenika:
          strana: 18
          odeljak: "Uvod"
          tekst: "Sredinom IV veka rimska granica slabi jer upad Huna u Evropu pokreće veliku seobu naroda."
        osa: {naziv: "Huni prolaze kroz Vrata naroda", od: 375, traka: dogadjaji}

      - id: l03-pradomovina-reke-izbor
        vrsta: izbor
        tezina: lako
        pojmovi: [pradomovina-slovena, odra, visla]
        pitanje: "Između kojih reka se nalazila pradomovina Slovena?"
        odgovori:
          - {tekst: "Između Odre i Visle", tacan: true}
          - {tekst: "Između Save i Dunava", tacan: false, zasto: "Sava i Dunav su na jugu, a Dunav je bio vizantijska granica do koje su Sloveni tek stigli; pradomovina je bila severnije."}
          - {tekst: "Između Pive i Tare", tacan: false, zasto: "Piva i Tara se pominju uz srpske saveze na Balkanu, dakle posle doseljavanja, a ne u pradomovini."}
          - {tekst: "Između Urala i Kaspijskog mora", tacan: false, zasto: "To su Vrata naroda, ravnica kroz koju su prošli Huni, a ne slovenska pradomovina."}
        pomoc:
          - "Pradomovina je na severu, u današnjoj Poljskoj i okolini."
          - "Obe reke teku kroz današnju Poljsku ili uz nju."
          - "Iz lekcije: pradomovina je između Odre i Visle, Azovskog mora i Karpata."
        objasnjenje: "Pradomovina Slovena bila je na severu, između Odre i Visle, Azovskog mora i Karpata."
        iz_udzbenika:
          strana: 18
          odeljak: "Život u pradomovini, uzroci i pravci seobe"
          tekst: "Sloveni su živeli na severu, između reka Odre i Visle, Azovskog mora i Karpata."
          slika: 03-doseljavanje-srba-na-balkan/01-karta-pradomovina-slovena.jpg

      - id: l03-zanimanje-izbor
        vrsta: izbor
        tezina: lako
        pojmovi: [stari-sloveni, pradomovina-slovena]
        pitanje: "Šta je u pradomovini bilo glavno zanimanje Slovena?"
        odgovori:
          - {tekst: "Stočarstvo", tacan: true}
          - {tekst: "Zemljoradnja", tacan: false, zasto: "Zemljoradnja je postojala, ali kao sporedno zanimanje; glavno je bilo stočarstvo."}
          - {tekst: "Pomorstvo", tacan: false, zasto: "Lekcija ne govori o pomorstvu; Sloveni su bili kopneni narod koji je živeo od stoke."}
          - {tekst: "Trgovina u velikim gradovima", tacan: false, zasto: "Živeli su u rodovima i plemenima, a ne u trgovačkim gradovima; glavno zanimanje bila je stoka."}
        pomoc:
          - "Seti se da su se lako selili sa onim što imaju."
          - "Zemljoradnja je bila sporedna."
          - "Iz lekcije: glavno zanimanje je stočarstvo, a zemljoradnja je sporedna."
        objasnjenje: "Sloveni su u pradomovini živeli prvenstveno od stočarstva, a zemljoradnja im je bila sporedno zanimanje."
        iz_udzbenika:
          strana: 18
          odeljak: "Život u pradomovini, uzroci i pravci seobe"
          tekst: "Glavno zanimanje Slovena u pradomovini bilo je stočarstvo, a zemljoradnja je bila sporedna."

      - id: l03-danasnje-zemlje-izbor
        vrsta: izbor
        tezina: srednje
        pojmovi: [pradomovina-slovena]
        pitanje: "Na prostoru kojih današnjih zemalja je bila pradomovina Slovena? (više tačnih)"
        odgovori:
          - {tekst: "Istočna i južna Poljska", tacan: true}
          - {tekst: "Ukrajina", tacan: true}
          - {tekst: "Jugozapadna Rusija", tacan: true}
          - {tekst: "Srbija", tacan: false, zasto: "Na tlo Srbije Sloveni dolaze tek seobom; pradomovina je bila severno od Karpata i šire."}
          - {tekst: "Grčka", tacan: false, zasto: "Grčka je vizantijski jug Balkana do kog su Sloveni stizali u pljačkaškim pohodima (Tesalija, Epir), a ne njihova pradomovina."}
        pomoc:
          - "Pogledaj kartu: Odra, Visla, Dnjepar, Karpati."
          - "Tri tačna odgovora su sve severno od Karpata i Crnog mora."
          - "Iz lekcije: današnja istočna i južna Poljska, Ukrajina i jugozapadna Rusija."
        objasnjenje: "Pradomovina se poklapa sa današnjom istočnom i južnom Poljskom, Ukrajinom i jugozapadnom Rusijom."
        iz_udzbenika:
          strana: 18
          odeljak: "Život u pradomovini, uzroci i pravci seobe"
          tekst: "Pradomovina odgovara današnjoj istočnoj i južnoj Poljskoj, Ukrajini i jugozapadnoj Rusiji."
          slika: 03-doseljavanje-srba-na-balkan/01-karta-pradomovina-slovena.jpg

      - id: l03-ime-slovena-izbor
        vrsta: izbor
        tezina: srednje
        pojmovi: [stari-sloveni, herodot]
        pitanje: "Šta od navedenog tačno opisuje najstarije vesti o Slovenima?"
        odgovori:
          - {tekst: "Ime Slovena javlja se u VI veku, a o njihovim precima možda piše već Herodot", tacan: true}
          - {tekst: "Herodot u V veku pre n. e. izričito piše o Slovenima pod tim imenom", tacan: false, zasto: "Samo se misli da Herodot govori o njihovim precima; samo ime Slovena javlja se tek u VI veku."}
          - {tekst: "Ime Slovena prvi put se javlja u IX veku, uz Ćirila i Metodija", tacan: false, zasto: "U IX veku Sloveni već odavno žive na Balkanu; ime se javlja u VI veku."}
          - {tekst: "O Slovenima su najpre pisali sami Sloveni", tacan: false, zasto: "Pre glagoljice i ćirilice Sloveni nisu imali pismo; vesti o njima ostavili su vizantijski pisci."}
        pomoc:
          - "Razlikuj ime naroda od nagađanja o njegovim precima."
          - "Ime se javlja u istom veku u kom vlada Justinijan I."
          - "Iz lekcije: ime u VI veku; o precima se, kako se misli, govori kod Herodota."
        objasnjenje: "Ime Slovena pojavljuje se u VI veku, a pretpostavlja se da je o njihovim precima pisao već Herodot u V veku pre n. e."
        iz_udzbenika:
          strana: 18
          odeljak: "Život u pradomovini, uzroci i pravci seobe"
          tekst: "Ime Slovena prvi put se javlja u VI veku, ali se misli da o njihovim precima govori već Herodot."
        osa: {naziv: "Prvi pomen slovenskog imena", od: 500, do: 600, oznaka: "VI vek", traka: dogadjaji}

      - id: l03-pravci-seobe-izbor
        vrsta: izbor
        tezina: srednje
        pojmovi: [stari-sloveni, velika-seoba-naroda]
        pitanje: "U kojim pravcima su Sloveni krenuli iz pradomovine i koja grupa je išla ka Balkanu?"
        odgovori:
          - {tekst: "Na zapad, istok i jug; južna grupa išla je ka Balkanu", tacan: true}
          - {tekst: "Samo na jug; svi Sloveni došli su na Balkan", tacan: false, zasto: "Pravca je bilo tri; na Balkan je išla samo južna grupa, a ostale su otišle na zapad i istok."}
          - {tekst: "Na sever i jug; severna grupa išla je ka Balkanu", tacan: false, zasto: "Balkan je južno od pradomovine, pa je tamo mogla da ide samo južna grupa; sever nije među pravcima."}
          - {tekst: "Na zapad i istok; na Balkan nisu išli", tacan: false, zasto: "Bio je i treći, južni pravac, i upravo njim su Sloveni stigli do Dunava i na Balkan."}
        pomoc:
          - "Pravaca ima tri."
          - "Pogledaj gde je Balkan u odnosu na Karpate."
          - "Iz lekcije: tri pravca (zapad, istok, jug), južna grupa ide ka Balkanu."
        objasnjenje: "Sloveni su se razišli u tri pravca, a južna grupa, među njima i srpska plemena, krenula je ka Balkanu."
        iz_udzbenika:
          strana: 18
          odeljak: "Život u pradomovini, uzroci i pravci seobe"
          tekst: "Po odlasku iz pradomovine Sloveni kreću na zapad, istok i jug; južna grupa ide ka Balkanu."

      - id: l03-vrata-naroda-tn
        vrsta: tacno_netacno
        tezina: lako
        pojmovi: [vrata-naroda, huni]
        tvrdnja: "Vrata naroda su naziv za ravnicu između Urala i Kaspijskog mora."
        tacno: true
        pomoc:
          - "To je prolaz iz Azije u Evropu."
          - "Iz lekcije: tako se zove ravnica između Urala i Kaspijskog mora."
        objasnjenje: "Tačno. Kroz tu ravnicu Huni su prošli 375. i ušli u Evropu."
        iz_udzbenika:
          strana: 18
          odeljak: "Život u pradomovini, uzroci i pravci seobe"
          tekst: "Vrata naroda su ravnica između Urala i Kaspijskog mora."
        osa: {naziv: "Huni prolaze kroz Vrata naroda", od: 375, traka: dogadjaji}

      - id: l03-srpska-plemena-vii-tn
        vrsta: tacno_netacno
        tezina: lako
        pojmovi: [stari-sloveni, doseljavanje, vizantija]
        tvrdnja: "Srpska plemena su bila deo slovenskih seoba i na vizantijsko tlo stigla su u VII veku."
        tacno: true
        pomoc:
          - "Seti se kada se Sloveni zaista naseljavaju, a ne samo pljačkaju."
          - "Iz lekcije: među Slovenima su i srpska plemena, a na vizantijsko tlo stižu u VII veku."
        objasnjenje: "Tačno. Srbi su deo južnih Slovena i na vizantijsku teritoriju dolaze u VII veku."
        iz_udzbenika:
          strana: 18
          odeljak: "Uvod"
          tekst: "Među Slovenima su i srpska plemena, koja na vizantijsko tlo stižu u VII veku."

      - id: l03-dva-razloga-tn
        vrsta: tacno_netacno
        tezina: srednje
        pojmovi: [velika-seoba-naroda, stari-sloveni]
        tvrdnja: "Sloveni su napustili pradomovinu isključivo zato što su ih terali Huni."
        tacno: false
        ispravke:
          - {tekst: "Bila su dva razloga: pritisak Velike seobe naroda, ali i traženje povoljnijeg mesta za život.", tacan: true}
          - {tekst: "Huni ih nisu terali; otišli su samo zato što su tražili bolje tle.", tacan: false, zasto: "Pritisak je stvaran: Huni su na svom putu naterali plemena u bekstvo, a bolje tle je drugi, dodatni razlog."}
          - {tekst: "Terali su ih Avari, a ne Huni.", tacan: false, zasto: "Avari stižu tek sredinom VI veka; Velika seoba naroda vezuje se za Hune."}
        pomoc:
          - "Lekcija navodi dva razloga."
          - "Jedan je sila spolja, a drugi sopstvena želja."
          - "Iz lekcije: Velika seoba naroda i traženje povoljnijeg mesta za život."
        objasnjenje: "Netačno. Pored hunskog pritiska, Sloveni su i sami tražili bolje mesto za život."
        iz_udzbenika:
          strana: 18
          odeljak: "Život u pradomovini, uzroci i pravci seobe"
          tekst: "Lekcija navodi dva razloga seobe: pritisak Velike seobe naroda i potragu za povoljnijim mestom za život."

      - id: l03-rodovi-bez-saveza-tn
        vrsta: tacno_netacno
        tezina: srednje
        pojmovi: [rodovsko-plemenska-zajednica, plemenski-savezi, pradomovina-slovena]
        tvrdnja: "U pradomovini Sloveni su već imali čvrste plemenske saveze."
        tacno: false
        ispravke:
          - {tekst: "Živeli su u rodovsko-plemenskim zajednicama, još bez plemenskih saveza.", tacan: true}
          - {tekst: "Imali su jedinstvenu državu sa jednim vladarem.", tacan: false, zasto: "Države još nije bilo; postojali su rodovi i plemena, a vladari su poticali iz ustaljenih vladarskih rodova pojedinih zajednica."}
          - {tekst: "Živeli su u gradovima-državama, kao stari Grci.", tacan: false, zasto: "O gradovima-državama nema ni reči; osnovna zajednica bili su rod i pleme."}
        pomoc:
          - "Savezi nastaju kasnije, u ratovima posle doseljavanja."
          - "Osnovna zajednica bila je manja od saveza."
          - "Iz lekcije: rodovsko-plemenske zajednice, još bez saveza."
        objasnjenje: "Netačno. Savezi nastaju tek na Balkanu; u pradomovini su postojale rodovsko-plemenske zajednice, ali sa ustaljenim vladarskim rodovima."
        iz_udzbenika:
          strana: 18
          odeljak: "Život u pradomovini, uzroci i pravci seobe"
          tekst: "Živeli su u rodovsko-plemenskim zajednicama, još bez saveza, a vladari su poticali iz ustaljenih vladarskih rodova."
          slika: 03-doseljavanje-srba-na-balkan/02-skupstina-starih-slovena.jpg

      - id: l03-podredjeni-saveznici-tn
        vrsta: tacno_netacno
        tezina: tesko
        pojmovi: [stari-sloveni, huni, bugari, vizantija]
        tvrdnja: "Do vizantijske granice na Dunavu Sloveni su došli sa Hunima i Bugarima kao ravnopravni saveznici."
        tacno: false
        ispravke:
          - {tekst: "Bili su više u podređenom položaju nego pravi saveznici.", tacan: true}
          - {tekst: "Bili su im vođe, a Huni i Bugari su ih slušali.", tacan: false, zasto: "Odnos je bio obrnut: Sloveni su bili potčinjeniji deo, a ne predvodnici tih pokreta."}
          - {tekst: "Do Dunava su stigli potpuno sami, bez ikakve veze sa njima.", tacan: false, zasto: "Stigli su upravo u pokretu sa Hunima i Bugarima, ali u slabijem položaju."}
        pomoc:
          - "Seti se kako su Huni postupali sa plemenima na svom putu."
          - "Razmisli ko je u tom pokretu odlučivao."
          - "Iz lekcije: stigli su sa Hunima i Bugarima, više podređeni nego kao pravi saveznici."
        objasnjenje: "Netačno. Sloveni su se kretali sa Hunima i Bugarima, ali u podređenom položaju, ne kao jednaki partneri."
        iz_udzbenika:
          strana: 18
          odeljak: "Život u pradomovini, uzroci i pravci seobe"
          tekst: "Do dunavske granice stigli su sa Hunima i Bugarima, više u podređenom položaju nego kao pravi saveznici."

      - id: l03-pradomovina-dopuni
        vrsta: dopuni
        tezina: lako
        pojmovi: [pradomovina-slovena, odra, visla, karpati]
        pitanje: "Dopuni rečenicu o pradomovini Slovena."
        tekst: "Pradomovina Slovena bila je između reka {{Odre}} i {{Visle}}, Azovskog mora i {{Karpata}}."
        ponudjene: [Odre, Visle, Karpata, Dunava, Urala]
        pomoc:
          - "Dunav je bio granica Vizantije, a Ural je kod Vrata naroda."
          - "Planine koje tražiš su južna međa pradomovine."
          - "Iz lekcije: između Odre i Visle, Azovskog mora i Karpata."
        objasnjenje: "Odra, Visla, Azovsko more i Karpati omeđuju pradomovinu Slovena."
        iz_udzbenika:
          strana: 18
          odeljak: "Život u pradomovini, uzroci i pravci seobe"
          tekst: "Pradomovina je na severu, između Odre i Visle, Azovskog mora i Karpata."
          slika: 03-doseljavanje-srba-na-balkan/01-karta-pradomovina-slovena.jpg

      - id: l03-vrata-naroda-dopuni
        vrsta: dopuni
        tezina: srednje
        pojmovi: [vrata-naroda, huni, velika-seoba-naroda]
        pitanje: "Dopuni rečenicu o početku Velike seobe naroda."
        tekst: "Prolaz {{Huna}} kroz ravnicu između Urala i {{Kaspijskog}} mora, koja se zove {{Vrata naroda}}, uzima se za početak Velike seobe naroda."
        ponudjene: [Huna, Avara, Kaspijskog, Azovskog, Vrata naroda, Slovenska]
        pomoc:
          - "Azovsko more je uz pradomovinu Slovena, a ne uz ovu ravnicu."
          - "Slovenska je naziv zemlje na Balkanu."
          - "Iz lekcije: Huni, ravnica između Urala i Kaspijskog mora, Vrata naroda."
        objasnjenje: "Huni su 375. prošli kroz Vrata naroda, ravnicu između Urala i Kaspijskog mora."
        iz_udzbenika:
          strana: 18
          odeljak: "Život u pradomovini, uzroci i pravci seobe"
          tekst: "Prolaz Huna kroz Vrata naroda 375. uzima se za početak Velike seobe naroda."
        osa: {naziv: "Huni prolaze kroz Vrata naroda", od: 375, traka: dogadjaji}

      - id: l03-razlozi-seobe-dopuni
        vrsta: dopuni
        tezina: tesko
        pojmovi: [velika-seoba-naroda, stari-sloveni]
        pitanje: "Dopuni svojim znanjem, bez ponuđenih reči."
        tekst: "Sloveni su pradomovinu napustili zbog Velike {{seobe}} naroda, koju su pokrenuli {{Huni}}, i zato što su tražili {{povoljnije|bolje}} mesto za život. Krenuli su u {{tri}} pravca."
        pomoc:
          - "Prva praznina je deo naziva velikog pokreta naroda."
          - "Razmisli šta nomadi iz Azije pokreću i šta Sloveni sami žele."
          - "Iz lekcije: Velika seoba naroda (Huni) i traženje povoljnijeg mesta; tri pravca."
        objasnjenje: "Dva razloga seobe su pritisak Velike seobe naroda i potraga za boljim mestom, a posle odlaska Sloveni idu na zapad, istok i jug."
        iz_udzbenika:
          strana: 22
          odeljak: "Zapamtite"
          tekst: "Zbog Velike seobe naroda, ali i radi boljeg tla, Sloveni su napustili zemlje između Odre i Visle."

      - id: l03-pojmovi-seobe-povezi
        vrsta: povezi
        tezina: lako
        pojmovi: [vrata-naroda, huni, pradomovina-slovena, herodot]
        pitanje: "Poveži pojam sa njegovim opisom."
        parovi:
          - ["Vrata naroda", "Ravnica između Urala i Kaspijskog mora"]
          - ["Huni", "Nomadi iz Azije koji pokreću seobu"]
          - ["Pradomovina Slovena", "Zemlje između Odre i Visle, Azovskog mora i Karpata"]
          - ["Herodot", "Grčki istoričar iz V veka pre n. e."]
        pomoc:
          - "Dva pojma su mesta, a dva su ljudi."
          - "Jedan od ljudi je pisac."
          - "Iz lekcije: Vrata naroda su ravnica kod Urala; Herodot je grčki istoričar."
        objasnjenje: "Huni su kroz Vrata naroda ušli u Evropu i pokrenuli plemena; Herodot je najstariji pisac za kog se misli da spominje pretke Slovena."
        iz_udzbenika:
          strana: 18
          odeljak: "Život u pradomovini, uzroci i pravci seobe"
          tekst: "Lekcija opisuje Vrata naroda, Hune, pradomovinu Slovena i Herodotove moguće vesti o njihovim precima."

      - id: l03-uzroci-posledice-povezi
        vrsta: povezi
        tezina: srednje
        pojmovi: [huni, velika-seoba-naroda, stari-sloveni]
        pitanje: "Poveži uzrok sa posledicom."
        parovi:
          - ["Huni prolaze kroz Vrata naroda", "Počinje Velika seoba naroda"]
          - ["Velika seoba naroda", "Plemena, pa i Sloveni, beže sa svojih zemalja"]
          - ["Traženje boljeg tla", "Seoba Slovena u tri pravca"]
          - ["Malo starih vesti, i to kratkih", "Slabo poznajemo najstarije doba Slovena"]
        pomoc:
          - "Prati lanac od Huna ka Slovenima."
          - "Poslednji par nije o selidbi, nego o tome šta danas znamo."
          - "Iz lekcije: Huni → seoba → bekstvo plemena; bolje tle → tri pravca."
        objasnjenje: "Hunski upad pokreće seobu, ona tera plemena, a potraga za boljim tlom određuje dalje kretanje Slovena; o svemu tome imamo malo vesti."
        iz_udzbenika:
          strana: 18
          odeljak: "Život u pradomovini, uzroci i pravci seobe"
          tekst: "Upad Huna pokreće seobu i tera plemena u bekstvo; Sloveni uz to traže bolje mesto za život."

      - id: l03-malo-podataka-zakljuci
        vrsta: zakljuci
        tezina: srednje
        pojmovi: [stari-sloveni, vizantija]
        pitanje: "Zašto je najstarije doba Slovena teško pouzdano opisati?"
        odgovori:
          - {tekst: "Podataka je malo, a vizantijski pisci daju kratke i često neprecizne vesti", tacan: true}
          - {tekst: "Sloveni su ostavili mnogo tekstova, ali na jeziku koji niko ne razume", tacan: false, zasto: "Sloveni pre glagoljice i ćirilice uopšte nisu imali pismo, pa njihovih tekstova iz tog doba nema."}
          - {tekst: "Vizantinci o Slovenima nisu napisali ništa", tacan: false, zasto: "Pisali su, i to su naši glavni izvori; problem je što su te vesti kratke i neprecizne."}
          - {tekst: "Sve vesti su izgubljene u seobi", tacan: false, zasto: "Lekcija ne kaže da su izgubljene; vesti postoje, ali ih je malo i pisali su ih stranci."}
        pomoc:
          - "Korak 1: Ko je tada pisao o Slovenima?"
          - "Korak 2: Kakve su te vesti: duge i tačne ili kratke?"
          - "Iz lekcije: podataka ima malo, kod vizantijskih pisaca, kratki su i često neprecizni."
        objasnjenje: "Sloveni tada nisu pisali, pa znamo samo ono što su zabeležili Vizantinci, a te vesti su malobrojne, kratke i često neprecizne."
        iz_udzbenika:
          strana: 18
          odeljak: "Život u pradomovini, uzroci i pravci seobe"
          tekst: "Podataka iz najstarijeg doba ima malo, kod vizantijskih pisaca, čije su vesti kratke i često neprecizne."

      - id: l03-zasto-375-pocetak-zakljuci
        vrsta: zakljuci
        tezina: tesko
        pojmovi: [velika-seoba-naroda, huni, vrata-naroda]
        pitanje: "Zašto se baš prolaz Huna kroz Vrata naroda uzima za početak Velike seobe naroda, iako su Sloveni na Balkan stigli vekovima kasnije?"
        odgovori:
          - {tekst: "Huni su tada pokrenuli lanac: plemena na njihovom putu krenula su u bekstvo i potiskivala jedna druga", tacan: true}
          - {tekst: "Jer su Huni odmah 375. stigli na Balkan i tu se naselili", tacan: false, zasto: "Prolaz kroz Vrata naroda je na granici Azije i Evrope, daleko od Balkana; važan je kao početni podsticaj, a ne kao naseljavanje."}
          - {tekst: "Jer su tada i Sloveni prešli Dunav sa porodicama", tacan: false, zasto: "Sa porodicama prelaze tek početkom VII veka, više od dva veka kasnije."}
          - {tekst: "Jer je tada Vizantija podeljena na dva dela", tacan: false, zasto: "Lekcija ovde ne govori o podeli; početak seobe se računa po pokretu naroda, ne po promeni u carstvu."}
        pomoc:
          - "Korak 1: Šta su Huni uradili plemenima na svom putu?"
          - "Korak 2: Šta se dešava kada se jedno pleme pomeri, a pored njega živi drugo?"
          - "Iz lekcije: Huni su naterali u bekstvo plemena na svom putu, među njima i Slovene."
        objasnjenje: "Početak seobe nije dolazak Slovena, nego prvi udar koji je pokrenuo plemena. Taj udar je hunski prolaz 375, a posledice su trajale vekovima."
        iz_udzbenika:
          strana: 18
          odeljak: "Život u pradomovini, uzroci i pravci seobe"
          tekst: "Huni su 375. prošli kroz Vrata naroda i naterali u bekstvo plemena na svom putu, među njima i Slovene."
        osa: {naziv: "Huni prolaze kroz Vrata naroda", od: 375, traka: dogadjaji}

      - id: l03-huni-375-datum
        vrsta: datum
        tezina: lako
        pojmovi: [huni, vrata-naroda, velika-seoba-naroda]
        dogadjaj: "Huni prolaze kroz Vrata naroda"
        pitanje: "Koje godine su Huni prošli kroz Vrata naroda?"
        godina: 375
        traka: dogadjaji
        pomoc:
          - "To je IV vek, njegova druga polovina."
          - "Godina se završava sa 5 i počinje sa 3."
          - "Iz lekcije: Huni su kroz Vrata naroda prošli 375."
        objasnjenje: "Godine 375. Huni su prošli kroz Vrata naroda; to se uzima za početak Velike seobe naroda."
        iz_udzbenika:
          strana: 18
          odeljak: "Život u pradomovini, uzroci i pravci seobe"
          tekst: "Huni iz Azije prošli su 375. kroz Vrata naroda."

      - id: l03-rane-vesti-poredjaj
        vrsta: poredjaj
        tezina: srednje
        pojmovi: [herodot, huni, stari-sloveni]
        pitanje: "Poređaj hronološki, od najstarijeg."
        stavke:
          - {tekst: "Herodot, po mišljenju istoričara, piše o precima Slovena", godina: -450, oznaka: "V vek pre n. e.", naziv: "Herodotove vesti o precima Slovena", traka: crkva-kultura}
          - {tekst: "Huni prolaze kroz Vrata naroda", godina: 375, naziv: "Huni prolaze kroz Vrata naroda", traka: dogadjaji}
          - {tekst: "Prvi put se javlja ime Slovena", godina: 500, do: 600, oznaka: "VI vek", naziv: "Prvi pomen slovenskog imena", traka: dogadjaji}
        pomoc:
          - "Jedno od ovoga je pre naše ere."
          - "Ime Slovena javlja se vek i po posle Huna."
          - "Iz lekcije: Herodot V vek pre n. e., Huni 375, ime Slovena VI vek."
        objasnjenje: "Herodot (V vek pre n. e.) → Huni (375) → ime Slovena (VI vek)."
        iz_udzbenika:
          strana: 18
          odeljak: "Život u pradomovini, uzroci i pravci seobe"
          tekst: "Herodot je pisao u V veku pre n. e., Huni prolaze 375, a ime Slovena javlja se u VI veku."

      - id: l03-huni-beg-lanac
        vrsta: lanac
        tezina: lako
        pojmovi: [huni, velika-seoba-naroda, stari-sloveni]
        karike:
          - "Huni upadaju u Evropu"
          - "?"
          - "Sloveni kreću iz pradomovine"
        praznina: 1
        odgovori:
          - {tekst: "Počinje Velika seoba naroda, plemena beže", tacan: true}
          - {tekst: "Vizantija ih poziva da se nasele na Balkanu", tacan: false, zasto: "Sloveni kreću pod pritiskom i u potrazi za boljim tlom, a Vizantija ih dugo pokušava da zadrži."}
          - {tekst: "Stvara se Slovenska između Dunava i Balkana", tacan: false, zasto: "Slovenska nastaje tek sredinom VII veka, kao posledica naseljavanja, a ne kao uzrok seobe."}
        pomoc:
          - "Korak 1: Šta se desilo plemenima na putu Huna?"
          - "Korak 2: Kako se zove taj pokret?"
          - "Iz lekcije: upad Huna → Velika seoba naroda → bekstvo plemena, pa i Slovena."
        objasnjenje: "Hunski upad pokrenuo je plemena, pa su i Sloveni napustili svoju zemlju."
        iz_udzbenika:
          strana: 18
          odeljak: "Život u pradomovini, uzroci i pravci seobe"
          tekst: "Upad Huna pokreće Veliku seobu naroda, u kojoj plemena, pa i Sloveni, beže sa svog tla."
        osa: {naziv: "Huni prolaze kroz Vrata naroda", od: 375, traka: dogadjaji}

      - id: l03-bolje-tle-lanac
        vrsta: lanac
        tezina: srednje
        pojmovi: [stari-sloveni, doseljavanje]
        karike:
          - "Sloveni traže povoljnije mesto za život"
          - "Razilaze se u tri pravca"
          - "?"
          - "Dolaze do vizantijske granice na Dunavu"
        praznina: 2
        odgovori:
          - {tekst: "Južna grupa ide ka Balkanu", tacan: true}
          - {tekst: "Zapadna grupa stiže u Franačku i osniva je", tacan: false, zasto: "Franačka je bila jak sused Slovena, a ne njihova tvorevina; ka Dunavu je išla južna grupa."}
          - {tekst: "Istočna grupa se vraća u Aziju za Hunima", tacan: false, zasto: "O tome nema podataka; sledeći korak do Dunava mogla je da napravi samo južna grupa."}
        pomoc:
          - "Korak 1: Gde je Dunav u odnosu na pradomovinu?"
          - "Korak 2: Koja je grupa onda stigla do njega?"
          - "Iz lekcije: traženje boljeg tla → tri pravca; južna grupa ide ka Balkanu."
        objasnjenje: "Od tri grupe ka Dunavu i Balkanu je išla južna; tako su Sloveni izbili na vizantijsku granicu."
        iz_udzbenika:
          strana: 18
          odeljak: "Život u pradomovini, uzroci i pravci seobe"
          tekst: "Južna grupa Slovena ide ka Balkanu i stiže do vizantijske granice na Dunavu."

      - id: l03-iz-pradomovine-na-balkan-lanac
        vrsta: lanac
        tezina: tesko
        pojmovi: [huni, stari-sloveni, vizantija]
        karike:
          - "Huni prolaze kroz Vrata naroda (375)"
          - "Sloveni, u podređenom položaju, stižu sa Hunima i Bugarima do Dunava"
          - "?"
        praznina: 2
        odgovori:
          - {tekst: "Počinju brojni napadi na vizantijsku odbranu", tacan: true}
          - {tekst: "Sloveni odmah postaju vizantijski podanici i prelaze u hrišćanstvo", tacan: false, zasto: "Hrišćanstvo se učvršćuje tek u IX veku; na Dunavu je prvo usledio niz napada."}
          - {tekst: "Sloveni se vraćaju u pradomovinu", tacan: false, zasto: "Iz napada su se vraćali samo na levu obalu Dunava, a ne u pradomovinu; njihov pritisak na granicu je rastao."}
        pomoc:
          - "Korak 1: Šta se nalazi preko Dunava?"
          - "Korak 2: Šta rade plemena koja stoje na bogatoj granici?"
          - "Iz lekcije: stigli su do granice na Dunavu; sledili su brojni napadi na vizantijsku odbranu."
        objasnjenje: "Kada su izbili na Dunav, Sloveni su imali pred sobom bogato carstvo i počeli su napade na njegovu odbranu."
        iz_udzbenika:
          strana: 18
          odeljak: "Život u pradomovini, uzroci i pravci seobe"
          tekst: "Do Dunava su stigli sa Hunima i Bugarima, a sledili su brojni napadi na vizantijsku odbranu."

      - id: l03-karta-pradomovine-izvor
        vrsta: izvor
        slika_u_pitanju: true
        tezina: srednje
        pojmovi: [pradomovina-slovena, karpati, visla]
        izvor:
          autor: "Karta iz udžbenika"
          naslov: "Pradomovina Slovena (opis karte)"
          tekst: "Karta razlikuje širu i užu slovensku teritoriju. Uža, tamnije osenčena, pruža se severno od Karpata, od Krakova i Varšave prema Kijevu i Černigovu. Na karti su i Baltičko i Crno more i reke Odra, Visla, Dnjestar, Dnjepar i Dunav."
          napomena: "Odlomak je prepričan; udžbenik, str. 18."
        pitanje: "Šta sa karte potvrđuje da je pradomovina bila daleko od Balkana?"
        odgovori:
          - {tekst: "Uža slovenska teritorija leži severno od Karpata", tacan: true}
          - {tekst: "Uža teritorija leži južno od Dunava", tacan: false, zasto: "Dunav je južno od te teritorije; karta je stavlja severno od Karpata, pa je Dunav morao tek da se dosegne."}
          - {tekst: "Teritorija izlazi na Jadransko more", tacan: false, zasto: "Jadransko more nije među morima na karti; označena su Baltičko i Crno more."}
          - {tekst: "Teritorija se poklapa sa Trakijom i Tesalijom", tacan: false, zasto: "Trakija i Tesalija su vizantijske oblasti do kojih su Sloveni dopirali u pljačkaškim upadima."}
        pomoc:
          - "Nađi planine koje stoje između pradomovine i Balkana."
          - "Da li je uža teritorija severno ili južno od njih?"
          - "Iz lekcije: uža oblast proteže se severno od Karpata."
        objasnjenje: "Karpati su međa: uža teritorija je severno od njih, pa je do Balkana trebalo preći dug put."
        iz_udzbenika:
          strana: 18
          odeljak: "Život u pradomovini, uzroci i pravci seobe"
          tekst: "Karta pokazuje šire i uže slovensko područje; uže je severno od Karpata."
          slika: 03-doseljavanje-srba-na-balkan/01-karta-pradomovina-slovena.jpg

      - id: l03-skupstina-izvor
        vrsta: izvor
        slika_u_pitanju: true
        tezina: lako
        pojmovi: [stari-sloveni, rodovsko-plemenska-zajednica]
        izvor:
          autor: "Ilustracija iz udžbenika"
          naslov: "Skupština starih Slovena (opis crteža)"
          tekst: "Pod krošnjama u šumi okupili su se muškarci sa kopljima i štapovima. U prvom planu stoje stariji ljudi dugih brada."
          napomena: "Odlomak je prepričan; udžbenik, str. 19."
        pitanje: "Kakvo uređenje stvarnih zajednica ovaj crtež dočarava?"
        odgovori:
          - {tekst: "Rodovsko-plemensku zajednicu, u kojoj se zajedno odlučuje o važnim stvarima", tacan: true}
          - {tekst: "Dvor cara sa činovnicima", tacan: false, zasto: "Dvor i činovnici pripadaju Vizantiji; Sloveni su živeli po rodovima i plemenima."}
          - {tekst: "Crkveni sabor posle pokrštavanja", tacan: false, zasto: "Prizor je iz paganskog doba, a pokrštavanje dolazi tek vekovima kasnije."}
          - {tekst: "Trgovački sajam u velikom gradu", tacan: false, zasto: "Ljudi su u šumi i naoružani; to nije grad nego skup slobodnih članova plemena."}
        pomoc:
          - "Gde se ljudi okupljaju: u gradu ili u prirodi?"
          - "Zašto su stariji u prvom planu?"
          - "Iz lekcije: stari Sloveni živeli su u rodovsko-plemenskim zajednicama."
        objasnjenje: "Skup slobodnih muškaraca, sa starijima napred, odgovara rodovsko-plemenskoj zajednici."
        iz_udzbenika:
          strana: 19
          odeljak: "Život u pradomovini, uzroci i pravci seobe"
          tekst: "Sloveni su živeli u rodovsko-plemenskim zajednicama; crtež prikazuje njihovu skupštinu."
          slika: 03-doseljavanje-srba-na-balkan/02-skupstina-starih-slovena.jpg

      - id: l03-pritisak-i-privlacnost-uporedi
        vrsta: uporedi
        tezina: srednje
        pojmovi: [velika-seoba-naroda, huni, stari-sloveni]
        a: "Pritisak Huna (Velika seoba naroda)"
        b: "Traženje boljeg tla"
        pitanje: "Na koji razlog seobe Slovena se odnosi tvrdnja?"
        tvrdnje:
          - {tekst: "Razlog dolazi spolja, Sloveni su naterani u bekstvo.", odgovor: a, zasto: "Huni su na putu terali plemena da beže; to nije bila slobodna odluka."}
          - {tekst: "Razlog dolazi od samih Slovena, koji žele bolji život.", odgovor: b, zasto: "Traženje povoljnijeg mesta je sopstvena želja, a ne prinuda."}
          - {tekst: "Doveo je do napuštanja pradomovine.", odgovor: oba, zasto: "Lekcija navodi oba kao razloge odlaska iz pradomovine."}
          - {tekst: "Vezuje se za godinu 375.", odgovor: a, zasto: "Prolaz Huna kroz Vrata naroda datiran je 375; potraga za boljim tlom nema jednu godinu."}
          - {tekst: "Sloveni su pošli zato što im je Vizantija obećala zemlju u pradomovini.", odgovor: nijedan, zasto: "Vizantija im nije ništa obećavala u pradomovini; lekcija navodi samo hunski pritisak i potragu za boljim tlom."}
        pomoc:
          - "Jedan razlog je prinuda, drugi želja."
          - "Pazi: jedna tvrdnja važi za oba, a jedna ni za jedan."
          - "Iz lekcije: dva razloga su Velika seoba naroda i traženje povoljnijeg mesta."
        objasnjenje: "Pritisak Huna je spoljna prinuda, a traženje boljeg tla sopstveni motiv; zajedno objašnjavaju odlazak Slovena."
        iz_udzbenika:
          strana: 18
          odeljak: "Život u pradomovini, uzroci i pravci seobe"
          tekst: "Sloveni su pošli i zbog pritiska Velike seobe naroda i zbog traženja boljeg mesta za život."

      - id: l03-herodot-ko-sam
        vrsta: ko_sam
        tezina: srednje
        pojmovi: [herodot, stari-sloveni]
        tragovi:
          - "Živeo sam u V veku pre n. e."
          - "Bio sam grčki istoričar."
          - "Misli se da sam pisao o precima Slovena, iako njihovo ime tada još niko nije zapisao."
        odgovori:
          - {tekst: "Herodot", tacan: true}
          - {tekst: "Justinijan I", tacan: false, zasto: "Justinijan je vizantijski car iz VI veka, a tragovi govore o grčkom istoričaru iz V veka pre n. e."}
          - {tekst: "Konstantin (Ćirilo)", tacan: false, zasto: "Ćirilo je misionar iz IX veka koji je Slovene opismenio, a ne istoričar iz stare Grčke."}
        objasnjenje: "To je Herodot, grčki istoričar kod kog se, kako se misli, govori o precima Slovena."
        iz_udzbenika:
          strana: 18
          odeljak: "Život u pradomovini, uzroci i pravci seobe"
          tekst: "Misli se da o precima Slovena govori već grčki istoričar Herodot u V veku pre n. e."

      - id: l03-huni-ko-sam
        vrsta: ko_sam
        tezina: lako
        pojmovi: [huni, vrata-naroda, velika-seoba-naroda]
        tragovi:
          - "Mi smo nomadi koji su došli iz Azije."
          - "Prošli smo kroz ravnicu između Urala i Kaspijskog mora."
          - "Naš upad 375. pokrenuo je Veliku seobu naroda."
        odgovori:
          - {tekst: "Huni", tacan: true}
          - {tekst: "Bugari", tacan: false, zasto: "I Bugari su azijsko pleme, ali početak Velike seobe naroda vezuje se za Hune."}
          - {tekst: "Avari", tacan: false, zasto: "Avari su takođe iz Azije, ali u Panoniju stižu sredinom VI veka, mnogo posle 375."}
        objasnjenje: "To su Huni, čiji se prolaz kroz Vrata naroda uzima za početak Velike seobe naroda."
        iz_udzbenika:
          strana: 18
          odeljak: "Život u pradomovini, uzroci i pravci seobe"
          tekst: "Huni iz Azije prošli su 375. kroz Vrata naroda."
        osa: {naziv: "Huni prolaze kroz Vrata naroda", od: 375, traka: dogadjaji}

      - id: l03-zasto-seoba-objasni
        vrsta: objasni
        tezina: lako
        pojmovi: [velika-seoba-naroda, huni, stari-sloveni]
        pitanje: "Iz kojih razloga su Sloveni otišli iz pradomovine? Objasni svojim rečima."
        uzor: "Sloveni su otišli iz dva razloga. Huni su pokrenuli Veliku seobu naroda i terali plemena sa njihovog tla, pa su i Sloveni morali da beže. Pored toga, sami su tražili povoljnije mesto za život."
        ideje:
          - "Velika seoba naroda, koju pokreću Huni."
          - "Plemena su na hunskom putu naterana u bekstvo."
          - "Sloveni sami traže povoljnije mesto za život."
        objasnjenje: "Odgovor mora da spoji spoljašnji pritisak i sopstveni motiv."
        iz_udzbenika:
          strana: 22
          odeljak: "Pitanja za razmišljanje / Zadaci iz udžbenika"
          tekst: "Udžbenik pita iz kojih razloga su Sloveni otišli iz pradomovine."

      - id: l03-kako-znamo-objasni
        vrsta: objasni
        tezina: srednje
        pojmovi: [stari-sloveni, vizantija, herodot]
        pitanje: "Zašto je za najstariji život Slovena važno ko je pisao vesti o njima? Objasni."
        uzor: "O najstarijem dobu Slovena pisali su stranci, vizantijski pisci, jer Sloveni još nisu imali pismo. Njihove vesti su malobrojne, kratke i često neprecizne. Zato naše znanje o tom dobu ostaje nepotpuno i o tome treba suditi oprezno."
        ideje:
          - "Sloveni tada nisu imali svoje pismo."
          - "Vesti su pisali vizantijski pisci, dakle stranci."
          - "Vesti su malobrojne, kratke i neprecizne."
          - "Zato je znanje o tom dobu nepotpuno."
        objasnjenje: "Ko piše i koliko zna određuje vrednost izvora, pa je oprez nužan."
        iz_udzbenika:
          strana: 18
          odeljak: "Život u pradomovini, uzroci i pravci seobe"
          tekst: "Podataka iz najstarijeg doba ima malo, i to kod vizantijskih pisaca čije su vesti kratke i često neprecizne."

  - naslov: "Stari Sloveni i naseljavanje Balkanskog poluostrva"
    zadaci:
      - id: l03-justinijan-upadi-izbor
        vrsta: izbor
        tezina: lako
        pojmovi: [justinijan-i, stari-sloveni, vizantija]
        pitanje: "Za vreme kog vizantijskog cara počinju upadi Slovena na Balkan?"
        odgovori:
          - {tekst: "Justinijana I", tacan: true}
          - {tekst: "Iraklija", tacan: false, zasto: "Iraklije vlada 610–641, u vreme naseljavanja; upadi su počeli ranije, u VI veku, pod Justinijanom I."}
          - {tekst: "Konstantina VII Porfirogenita", tacan: false, zasto: "On vlada u X veku i piše o doseljavanju Srba, mnogo posle prvih upada."}
          - {tekst: "Otona I", tacan: false, zasto: "Oton I je nemački vladar iz X veka koji je pobedio Mađare, a ne vizantijski car."}
        pomoc:
          - "Traži cara iz VI veka."
          - "Vladao je 527–565."
          - "Iz lekcije: upadi počinju u VI veku, pod carem Justinijanom I."
        objasnjenje: "Upadi Slovena počinju u VI veku, pod carem Justinijanom I (527–565)."
        iz_udzbenika:
          strana: 19
          odeljak: "Stari Sloveni i naseljavanje Balkanskog poluostrva"
          tekst: "Upadi na Balkan počinju u VI veku, pod carem Justinijanom I (527–565)."
        osa: {naziv: "Vladavina Justinijana I", od: 527, do: 565, traka: vladari}

      - id: l03-karakter-upada-izbor
        vrsta: izbor
        tezina: lako
        pojmovi: [stari-sloveni, vizantija]
        pitanje: "Kakvi su bili slovenski upadi na Balkan u VI veku?"
        odgovori:
          - {tekst: "Pljačkaški: posle borbi Sloveni se sa plenom vraćaju preko Dunava", tacan: true}
          - {tekst: "Naseljavanje: dolazili su sa porodicama da ostanu", tacan: false, zasto: "To je odlika VII veka; u VI veku su još dolazili radi plena i vraćali se."}
          - {tekst: "Misionarski: širili su hrišćanstvo", tacan: false, zasto: "Sloveni su tada bili mnogobošci, a hrišćanstvo će tek primiti."}
          - {tekst: "Trgovački: mirno su razmenjivali robu", tacan: false, zasto: "Upadi su bili oružani i završavali su se plenom, a ne trgovinom."}
        pomoc:
          - "Šta su nosili sa sobom kada su se vraćali?"
          - "Vraćali su se na levu obalu Dunava."
          - "Iz lekcije: upadi su bili pljačkaški; posle borbi Sloveni se sa plenom vraćaju."
        objasnjenje: "U VI veku Sloveni pljačkaju i vraćaju se na levu obalu Dunava; naseljavanje dolazi tek u VII veku."
        iz_udzbenika:
          strana: 19
          odeljak: "Stari Sloveni i naseljavanje Balkanskog poluostrva"
          tekst: "Upadi su bili pljačkaški: posle borbi Sloveni se sa plenom vraćaju na levu obalu Dunava."

      - id: l03-vrhovni-bog-izbor
        vrsta: izbor
        tezina: lako
        pojmovi: [perun, svetovid, dazbog]
        pitanje: "Ko je bio vrhovni bog starih Slovena?"
        odgovori:
          - {tekst: "Perun ili Svetovid", tacan: true}
          - {tekst: "Dažbog", tacan: false, zasto: "Dažbog je bog Sunca i podzemlja, ali ne i vrhovni bog."}
          - {tekst: "Vukodlak", tacan: false, zasto: "Vukodlaci su bića u koja se verovalo, a ne bogovi."}
          - {tekst: "Vila", tacan: false, zasto: "I vile su bića iz verovanja, a ne vrhovno božanstvo."}
        pomoc:
          - "Lekcija navodi dva imena za vrhovnog boga."
          - "Dažbog je zadužen za Sunce."
          - "Iz lekcije: vrhovni bog je Perun ili Svetovid."
        objasnjenje: "Vrhovni bog starih Slovena nosio je ime Perun ili Svetovid."
        iz_udzbenika:
          strana: 19
          odeljak: "Stari Sloveni i naseljavanje Balkanskog poluostrva"
          tekst: "Vrhovni bog Slovena je Perun ili Svetovid."

      - id: l03-dokle-su-stizali-izbor
        vrsta: izbor
        tezina: srednje
        pojmovi: [stari-sloveni, vizantija, bugari, avari]
        pitanje: "Do kojih oblasti su u VI veku dopirali slovenski pljačkaški upadi? (više tačnih)"
        odgovori:
          - {tekst: "Trakija", tacan: true}
          - {tekst: "Tesalija", tacan: true}
          - {tekst: "Epir", tacan: true}
          - {tekst: "Panonija", tacan: false, zasto: "Panonska nizija je severno od Dunava, a ne vizantijska oblast u koju se upada; tamo stižu Avari."}
          - {tekst: "Duklja", tacan: false, zasto: "Duklja je ime srpske oblasti i saveza koji nastaju kasnije, posle naseljavanja."}
        pomoc:
          - "Sve tri tačne oblasti su duboko na jugu Balkana."
          - "Pomisli na vizantijske krajeve južno od planine Balkan."
          - "Iz lekcije: stizali su do Trakije, Tesalije i Epira."
        objasnjenje: "Napadajući sa Bugarima, pa sa Avarima, Sloveni su stizali do Trakije, Tesalije i Epira."
        iz_udzbenika:
          strana: 19
          odeljak: "Stari Sloveni i naseljavanje Balkanskog poluostrva"
          tekst: "Sloveni su napadali prvo sa Bugarima, pa sa Avarima, i stizali do Trakije, Tesalije i Epira."

      - id: l03-sta-ostaje-vizantiji-izbor
        vrsta: izbor
        tezina: srednje
        pojmovi: [slovenska, vizantija]
        pitanje: "Šta je sredinom VII veka ostalo Vizantiji na Balkanu? (više tačnih)"
        odgovori:
          - {tekst: "Dolina Morave, Niš i Sofija", tacan: true}
          - {tekst: "Nekoliko primorskih gradova", tacan: true}
          - {tekst: "Ostrva u Egejskom, Jonskom i Jadranskom moru", tacan: true}
          - {tekst: "Cela zemlja od Dunava do planine Balkan", tacan: false, zasto: "Ta zemlja se tada zove Slovenska, jer je pod Slovenima; Vizantiji je ostala samo pomenuta dolina."}
          - {tekst: "Pradomovina između Odre i Visle", tacan: false, zasto: "Pradomovina nikada nije bila vizantijska; ona je daleko severno od Dunava."}
        pomoc:
          - "Vizantiji ostaju mesta koja je lako braniti: uz more, na ostrvima i na važnom putu."
          - "Jedan niz gradova je u unutrašnjosti Balkana."
          - "Iz lekcije: dolina Morave, Niš i Sofija, nekoliko primorskih gradova i ostrva."
        objasnjenje: "Unutrašnjost je pretežno slovenska, a Vizantija drži dolinu Morave sa Nišom i Sofijom, nekoliko primorskih gradova i ostrva."
        iz_udzbenika:
          strana: 19
          odeljak: "Stari Sloveni i naseljavanje Balkanskog poluostrva"
          tekst: "Vizantiji ostaju dolina Morave, Niš i Sofija, nekoliko primorskih gradova i ostrva u tri mora."
        osa: {naziv: "Slovenska između Dunava i planine Balkan", od: 650, oznaka: "sredina VII veka", traka: dogadjaji}

      - id: l03-avari-panonija-izbor
        vrsta: izbor
        tezina: srednje
        pojmovi: [avari, stari-sloveni]
        pitanje: "Šta su Avari uradili kada su sredinom VI veka stigli u Panonsku niziju?"
        odgovori:
          - {tekst: "Potčinili su tamošnja slovenska plemena", tacan: true}
          - {tekst: "Proterali su sve Slovene u pradomovinu", tacan: false, zasto: "Nisu ih proterali, već potčinili; zato ih kasnije zajedno vidimo u napadima na Vizantiju."}
          - {tekst: "Stvorili su Slovensku", tacan: false, zasto: "Slovenska je naziv zemlje južno od Dunava sredinom VII veka; Avari su bili u Panoniji."}
          - {tekst: "Primili su hrišćanstvo od Justinijana", tacan: false, zasto: "Lekcija to ne kaže; Avari se javljaju kao napadači na Vizantiju, a ne kao hrišćani."}
        pomoc:
          - "Avari su bili jača sila od slovenskih plemena u Panoniji."
          - "Posle toga Sloveni napadaju Vizantiju zajedno sa njima."
          - "Iz lekcije: Avari stižu iz Azije i potčinjavaju tamošnja slovenska plemena."
        objasnjenje: "Avari su došli iz Azije i potčinili slovenska plemena u Panonskoj niziji."
        iz_udzbenika:
          strana: 19
          odeljak: "Stari Sloveni i naseljavanje Balkanskog poluostrva"
          tekst: "Avari stižu iz Azije u Panonsku niziju sredinom VI veka i potčinjavaju tamošnja slovenska plemena."
        osa: {naziv: "Avari stižu u Panonsku niziju", od: 550, oznaka: "sredina VI veka", traka: dogadjaji}

