          - {tekst: "Asparuh", tacan: false, zasto: "Asparuh je bugarski kan koji je svoj narod doveo na Balkan."}
          - {tekst: "Rastislav", tacan: false, zasto: "Rastislav je knez Velikomoravske, koji je pozvao Ćirila i Metodija."}
        objasnjenje: "To je Oton I, pobednik u bici na reci Leh."
        iz_udzbenika:
          strana: 20
          odeljak: "Doseljavanje Bugara i Mađara"
          tekst: "Nemački vladar Oton I porazio je Mađare 955. na Lehu kod Augzburga."
