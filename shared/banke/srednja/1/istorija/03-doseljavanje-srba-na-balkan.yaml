        tezina: lako
        pojmovi: [kliment-i-naum, velikomoravska-knezevina]
        karike:
          - "U Moravskoj prevlađuje nemačko sveštenstvo"
          - "?"
          - "Učenici prelaze među balkanske Slovene"
        praznina: 1
        odgovori:
          - {tekst: "Učenici Ćirila i Metodija su proterani", tacan: true}
          - {tekst: "Učenici postaju vladari Moravske", tacan: false, zasto: "Oni su izgubili uticaj i morali da odu, a ne da preuzmu vlast."}
          - {tekst: "Papa šalje Hune u Moravsku", tacan: false, zasto: "Huni nemaju veze sa ovim dobom; radi se o sukobu sveštenstva u IX veku."}
        pomoc:
          - "Korak 1: Ko je prevladao u Moravskoj?"
          - "Korak 2: Šta je to značilo za učenike braće?"
          - "Iz lekcije: prevlast nemačkog sveštenstva → progon učenika → prelazak na Balkan."
        objasnjenje: "Nemačko sveštenstvo je proteralo učenike, pa su oni došli na Balkan."
        iz_udzbenika:
          strana: 21
          odeljak: "Pokrštavanje Južnih Slovena"
          tekst: "Posle smrti braće u Moravskoj prevlađuje nemačko sveštenstvo, a učenici su proterani."

      - id: l03-vera-pismo-lanac
        vrsta: lanac
        tezina: srednje
        pojmovi: [hristijanizacija, cirilica, glagoljica]
        karike:
          - "Širi se hrišćanstvo među Slovenima"
          - "?"
          - "Nastaje ćirilica"
        praznina: 1
        odgovori:
          - {tekst: "Širi se i pismenost, jer vera traži knjige na slovenskom", tacan: true}
          - {tekst: "Stari bogovi dobijaju svoje zapise", tacan: false, zasto: "Hrišćanstvo potiskuje mnogoboštvo; pismenost služi verskim knjigama."}
          - {tekst: "Sloveni prelaze na latinski i prestaju da pišu", tacan: false, zasto: "Pisanje se širi, a slovensko pismo se usavršava."}
        pomoc:
          - "Korak 1: Šta je potrebno za širenje vere?"
          - "Korak 2: Šta se onda radi sa pismom?"
          - "Iz lekcije: širenje vere → širenje pismenosti → ćirilica."
        objasnjenje: "Vera je tražila knjige, knjige pismene ljude, a pismenost jednostavnije pismo."
        iz_udzbenika:
          strana: 21
          odeljak: "Pokrštavanje Južnih Slovena"
          tekst: "Širenje vere išlo je uz širenje pismenosti; misionari su usavršili pismo i stvorili ćirilicu."

      - id: l03-susedi-vera-lanac
        vrsta: lanac
        tezina: srednje
        pojmovi: [pokrstavanje, vizantija, veliki-raskol]
        karike:
          - "Južni Sloveni imaju hrišćanske susede Franačku i Vizantiju"
          - "Vera dolazi sa obe strane"
          - "?"
        praznina: 2
        odgovori:
          - {tekst: "Raskol 1054. ih deli na katolike i pravoslavne", tacan: true}
          - {tekst: "Svi Južni Sloveni ostaju mnogobošci", tacan: false, zasto: "Upravo su prešli u hrišćanstvo; u IX veku ono se učvršćuje."}
          - {tekst: "Svi postaju pravoslavni", tacan: false, zasto: "Hrvati i Slovenci pripali su katoličkoj crkvi."}
        pomoc:
          - "Korak 1: Sa koje strane je bio ko od Južnih Slovena?"
          - "Korak 2: Šta se 1054. desilo sa crkvom?"
          - "Iz lekcije: raskol 1054 → verska podela Južnih Slovena."
        objasnjenje: "Dva izvora vere postala su, posle raskola, dve crkve kojima pripadaju različiti Južni Sloveni."
        iz_udzbenika:
          strana: 21
          odeljak: "Pokrštavanje Južnih Slovena"
          tekst: "Vera je dolazila od Franačke i Vizantije, a raskol 1054. podelio je Južne Slovene."
        osa: {naziv: "Veliki raskol", od: 1054, traka: crkva-kultura}

      - id: l03-kultura-hrista-lanac
        vrsta: lanac
        tezina: tesko
        pojmovi: [hristijanizacija, glagoljica, cirilica]
        karike:
          - "Braća i učenici stvaraju slovensko pismo i prevode knjige"
          - "Sloveni postaju pismeni narodi"
          - "?"
        praznina: 2
        odgovori:
          - {tekst: "Otvara im se put u svet razvijenije latinske i grčke kulture", tacan: true}
          - {tekst: "Prekidaju sve veze sa Vizantijom i Rimom", tacan: false, zasto: "Pismenost i vera ih upravo povezuju sa Vizantijom i Rimom."}
          - {tekst: "Prestaju da budu Sloveni", tacan: false, zasto: "Pismo na slovenskom jeziku jača slovensku kulturu, a ne briše je."}
        pomoc:
          - "Korak 1: Šta pismen čovek može da radi što nepismen ne može?"
          - "Korak 2: Čiju kulturu je mogao da upozna?"
          - "Iz lekcije: hristijanizacija je Slovenima otvorila put u svet razvijenije latinske i grčke kulture."
        objasnjenje: "Pismenost i vera povezale su Slovene sa kulturom hrišćanskog sveta."
        iz_udzbenika:
          strana: 21
          odeljak: "Pokrštavanje Južnih Slovena"
          tekst: "Hristijanizacija je Slovenima otvorila put u svet razvijenije latinske i grčke kulture."

      - id: l03-slika-braca-izvor
        vrsta: izvor
        slika_u_pitanju: true
        tezina: srednje
        pojmovi: [cirilo-i-metodije, glagoljica]
        izvor:
          autor: "Ilustracija iz udžbenika"
          naslov: "Ćirilo i Metodije (opis crteža)"
          tekst: "Dvojica svetitelja sa oreolima stoje na pozadini ispisanoj slovima. Jedan u tamnoj monaškoj odeći drži krst i otvoren svitak sa pismom, a drugi, duge brade, nosi bogatu svešteničku odoru."
          napomena: "Odlomak je prepričan; udžbenik, str. 21."
        pitanje: "Zašto su na crtežu pozadina i svitak puni slova?"
        odgovori:
          - {tekst: "Zato što se njihovo delo vezuje za slovensko pismo i pismenost", tacan: true}
          - {tekst: "Zato što su bili trgovci koji vode knjige", tacan: false, zasto: "Bili su misionari, a slova na crtežu upućuju na pismo koje su dali Slovenima."}
          - {tekst: "Zato što su pisali zakone za vizantijskog cara", tacan: false, zasto: "Lekcija ih pamti po misiji i pismu, a ne po zakonima."}
          - {tekst: "Zato što su u Moravskoj bili učitelji latinskog", tacan: false, zasto: "Njihov rad bio je na slovenskom: pismo i prevodi verskih knjiga."}
        pomoc:
          - "Šta su braća, osim propovedanja, dala Slovenima?"
          - "Krst je za veru, a šta su slova?"
          - "Iz lekcije: Ćirilo sastavlja glagoljicu, a braća prevode verske knjige."
        objasnjenje: "Krst simbolizuje veru, a slova pismenost: to su dve strane njihovog dela."
        iz_udzbenika:
          strana: 21
          odeljak: "Pokrštavanje Južnih Slovena"
          tekst: "Ćirilo i Metodije su šireći veru Slovenima dali pismo i prevode verskih knjiga."
          slika: 03-doseljavanje-srba-na-balkan/04-cirilo-i-metodije.jpg

      - id: l03-glagoljica-cirilica-uporedi
        vrsta: uporedi
        tezina: lako
        pojmovi: [glagoljica, cirilica]
        a: "Glagoljica"
        b: "Ćirilica"
        pitanje: "Na koje pismo se odnosi tvrdnja?"
        tvrdnje:
          - {tekst: "Sastavio ju je Ćirilo (Konstantin).", odgovor: a, zasto: "Ćirilo je sastavio glagoljicu; ćirilica je nastala kasnije."}
          - {tekst: "Prostija je i lakša.", odgovor: b, zasto: "Usavršavanjem je nastala ćirilica, prostija od glagoljice."}
          - {tekst: "Koriste je danas, sa izmenama, Srbi, Makedonci, Bugari i Rusi.", odgovor: b, zasto: "To važi za ćirilicu."}
          - {tekst: "To je slovensko pismo.", odgovor: oba, zasto: "Lekcija ih navodi kao prva slovenska pisma."}
          - {tekst: "Koristili su ga stari Grci u Herodotovo doba.", odgovor: nijedan, zasto: "Oba pisma nastaju u IX veku i kasnije, za Slovene."}
        pomoc:
          - "Koje je pismo starije?"
          - "Jedno i danas svako od nas koristi."
          - "Iz lekcije: glagoljica je prva, a ćirilica prostija i lakša."
        objasnjenje: "Glagoljica je prvo pismo, a ćirilica njegova prostija, lakša naslednica u delu misionara."
        iz_udzbenika:
          strana: 21
          odeljak: "Pokrštavanje Južnih Slovena"
          tekst: "Ćirilo je sastavio glagoljicu, a misionari su stvorili ćirilicu, prostiju i lakšu."

      - id: l03-braca-ucenici-uporedi
        vrsta: uporedi
        tezina: srednje
        pojmovi: [cirilo-i-metodije, kliment-i-naum]
        a: "Ćirilo i Metodije"
        b: "Kliment i Naum"
        pitanje: "Na koga se odnosi tvrdnja?"
        tvrdnje:
          - {tekst: "Poslao ih je vizantijski car u Moravsku.", odgovor: a, zasto: "Car je poslao braću; učenici dolaze na Balkan posle progona."}
          - {tekst: "Propovedali su među makedonskim Slovenima i Bugarima.", odgovor: b, zasto: "To lekcija kaže za Klimenta i Nauma."}
          - {tekst: "Širili su hrišćanstvo među Slovenima.", odgovor: oba, zasto: "I braća i učenici bili su misionari."}
          - {tekst: "Sastavljena je glagoljica.", odgovor: a, zasto: "Glagoljica je delo Ćirila."}
          - {tekst: "Proterani su iz Moravske posle smrti učitelja.", odgovor: b, zasto: "Proterani su učenici, a braća su tada već bila mrtva."}
          - {tekst: "Bili su bugarski kanovi.", odgovor: nijedan, zasto: "Svi su bili verski radnici; kan je bio Asparuh."}
        pomoc:
          - "Prvo vreme: IX vek u Moravskoj; drugo: na Balkanu."
          - "Ko je kome učitelj?"
          - "Iz lekcije: braća u Moravskoj, učenici među makedonskim Slovenima i Bugarima."
        objasnjenje: "Braća započinju delo u Moravskoj, a učenici ga nastavljaju na Balkanu."
        iz_udzbenika:
          strana: 21
          odeljak: "Pokrštavanje Južnih Slovena"
          tekst: "Braća rade u Moravskoj, a njihovi učenici Kliment i Naum, posle progona, na Balkanu."

      - id: l03-franacka-vizantija-uporedi
        vrsta: uporedi
        tezina: tesko
        pojmovi: [pokrstavanje, vizantija, veliki-raskol]
        a: "Franačka"
        b: "Vizantija"
        pitanje: "Na kog suseda Južnih Slovena se odnosi tvrdnja?"
        tvrdnje:
          - {tekst: "Bila je moćan hrišćanski sused.", odgovor: oba, zasto: "Lekcija obe navodi kao moćne hrišćanske susede."}
          - {tekst: "Nalazila se zapadno od Južnih Slovena.", odgovor: a, zasto: "Franačka je zapadni sused."}
          - {tekst: "Njen car je poslao Ćirila i Metodija u Moravsku.", odgovor: b, zasto: "Misionare je poslao vizantijski car."}
          - {tekst: "Bila je u blizini Karantanskih Slovena, prvih hrišćana među Južnim Slovenima.", odgovor: a, zasto: "Karantanci su na zapadu, u današnjoj Sloveniji, uz franački prostor."}
          - {tekst: "Bila je u blizini Srba i Bugara, koji će pripasti pravoslavnoj crkvi.", odgovor: b, zasto: "Srbi i Bugari su bili uz Vizantiju na istoku."}
          - {tekst: "Njena vojska je u IX veku proterala učenike iz Soluna.", odgovor: nijedan, zasto: "Učenici su proterani iz Moravske, i to pod pritiskom nemačkog sveštenstva, a ne vojske."}
        pomoc:
          - "Prvo odredi gde je koja država."
          - "Seti se ko je poslao braću."
          - "Iz lekcije: Franačka na zapadu, Vizantija na istoku; vera je dolazila sa obe strane."
        objasnjenje: "Dva suseda su dve strane hrišćanskog uticaja, a kasnija podela ih samo potvrđuje."
        iz_udzbenika:
          strana: 21
          odeljak: "Pokrštavanje Južnih Slovena"
          tekst: "Moćni hrišćanski susedi bili su Franačka na zapadu i Vizantija na istoku, pa je vera dolazila sa obe strane."

      - id: l03-cirilo-ko-sam
        vrsta: ko_sam
        tezina: lako
        pojmovi: [cirilo-i-metodije, glagoljica]
        tragovi:
          - "Poticao sam iz okoline Soluna i znao sam slovenski jezik."
          - "Zovu me i Konstantin."
          - "Sastavio sam glagoljicu."
        odgovori:
          - {tekst: "Ćirilo", tacan: true}
          - {tekst: "Metodije", tacan: false, zasto: "Metodije je brat i saradnik, ali glagoljicu je sastavio Ćirilo."}
          - {tekst: "Naum", tacan: false, zasto: "Naum je učenik koji je kasnije radio među makedonskim Slovenima i Bugarima."}
        objasnjenje: "To je Ćirilo (Konstantin), tvorac prvog slovenskog pisma."
        iz_udzbenika:
          strana: 21
          odeljak: "Pokrštavanje Južnih Slovena"
          tekst: "Ćirilo (Konstantin) je sastavio prvo slovensko pismo, glagoljicu."
          slika: 03-doseljavanje-srba-na-balkan/04-cirilo-i-metodije.jpg
        osa: {naziv: "Misija Ćirila i Metodija", od: 863, do: 885, traka: crkva-kultura}

      - id: l03-kliment-naum-ko-sam
        vrsta: ko_sam
        tezina: srednje
        pojmovi: [kliment-i-naum, cirilica]
        tragovi:
          - "Učili smo od dvojice braće iz okoline Soluna."
          - "Proterani smo iz Moravske."
          - "Propovedali smo među makedonskim Slovenima i Bugarima."
        odgovori:
          - {tekst: "Kliment i Naum", tacan: true}
          - {tekst: "Ćirilo i Metodije", tacan: false, zasto: "Oni su učitelji, a ne proterani učenici."}
          - {tekst: "Perun i Svetovid", tacan: false, zasto: "To su imena slovenskog vrhovnog boga, a ne propovednika hrišćanstva."}
        objasnjenje: "To su Kliment i Naum, najpoznatiji učenici Ćirila i Metodija."
        iz_udzbenika:
          strana: 21
          odeljak: "Pokrštavanje Južnih Slovena"
          tekst: "Najpoznatiji učenici su Kliment i Naum, koji propovedaju među makedonskim Slovenima i Bugarima."
        osa: {naziv: "Rad Klimenta i Nauma", od: 885, do: 915, oznaka: "kraj IX i početak X veka", traka: crkva-kultura}

      - id: l03-hristijanizacija-objasni
        vrsta: objasni
        tezina: lako
        pojmovi: [hristijanizacija, pokrstavanje]
        pitanje: "Opiši hristijanizaciju Slovena: odakle je vera dolazila i ko ju je prvi primao?"
        uzor: "Sloveni su hrišćanstvo prvo upoznali preko starosedelaca, a vera je dolazila i od Franačke, Vizantije i dalmatinskih gradova. U IX veku učvrstili su je Ćirilo, Metodije i njihovi učenici. Najpre su je primali članovi vladarskih porodica, a posle ostali narod."
        ideje:
          - "Prvo preko starosedelaca."
          - "Vera dolazi od Franačke, Vizantije i dalmatinskih gradova."
          - "Učvršćuje se u IX veku, radom braće i učenika."
          - "Prvo je primaju vladarske porodice, pa narod."
        objasnjenje: "Dobar odgovor navodi puteve, vreme i redosled primanja vere."
        iz_udzbenika:
          strana: 22
          odeljak: "Pitanja za razmišljanje / Zadaci iz udžbenika"
          tekst: "Udžbenik traži da opišeš hristijanizaciju Slovena."
        osa: {naziv: "Učvršćivanje hrišćanstva kod Južnih Slovena", od: 800, do: 900, oznaka: "IX vek", traka: crkva-kultura}

      - id: l03-glagoljica-znacaj-objasni
        vrsta: objasni
        tezina: srednje
        pojmovi: [glagoljica, cirilica, cirilo-i-metodije]
        pitanje: "Zašto kažemo da pokrštavanje i opismenjavanje Slovena dugujemo Ćirilu, Metodiju i njihovim učenicima? Objasni."
        uzor: "Pre njih Sloveni nisu imali pismo. Ćirilo je sastavio glagoljicu, braća su prevela najvažnije verske knjige na slovenski, a učenici su, posle progona iz Moravske, rad nastavili na Balkanu i stvorili prostiju ćirilicu. Vera i pismenost širili su se zajedno."
        ideje:
          - "Pre njih Sloveni nisu imali pismo."
          - "Glagoljica i prevodi verskih knjiga."
          - "Učenici nastavljaju rad na Balkanu."
          - "Ćirilica je prostija i lakša."
        objasnjenje: "Važna je veza: vera traži knjige, a knjige pismo."
        iz_udzbenika:
          strana: 22
          odeljak: "Zapamtite"
          tekst: "Pokrštavanje i opismenjavanje dugujemo braći Ćirilu i Metodiju i njihovim učenicima."

      - id: l03-raskol-znacaj-objasni
        vrsta: objasni
        tezina: tesko
        pojmovi: [veliki-raskol, hristijanizacija]
        pitanje: "Zašto je Veliki raskol važan za dalji razvoj Južnih Slovena, iako se desio među crkvenim vrhovima daleko od njih? Objasni."
        uzor: "Raskol je 1054. podelio crkvu na istočnu i zapadnu. Hrvati i Slovenci pripali su katoličkoj, a makedonski Sloveni, Srbi i Bugari pravoslavnoj crkvi. Tako su se narodi jednog porekla našli u dva različita verska i kulturna kruga, što je mnogo značilo za njihov dalji razvoj."
        ideje:
          - "Crkva je podeljena na istočnu i zapadnu."
          - "Hrvati i Slovenci su katolici, a Srbi, Bugari i makedonski Sloveni pravoslavni."
          - "Sličan narod ulazi u različite kulturne krugove."
          - "Podela utiče na dalji razvoj tih naroda."
        objasnjenje: "Vera je ovde mnogo više od verovanja: određuje uticaje, kulturu i pripadnost."
        iz_udzbenika:
          strana: 21
          odeljak: "Pokrštavanje Južnih Slovena"
          tekst: "Raskol 1054. podelio je Južne Slovene, a ta podela je mnogo značila za dalji razvoj tih naroda."
        osa: {naziv: "Veliki raskol", od: 1054, traka: crkva-kultura}

      - id: l03-hristijanizacija-pojam-zakljuci
        vrsta: zakljuci
        tezina: lako
        pojmovi: [hristijanizacija]
        pitanje: "Pleme ostavlja stare bogove i prihvata hrišćanstvo i njegovo učenje. Kako se taj proces zove?"
        odgovori:
          - {tekst: "Hristijanizacija", tacan: true}
          - {tekst: "Asimilacija", tacan: false, zasto: "Asimilacija je stapanje manjine sa većinskim narodom; ovde se menja vera, a ne narod."}
          - {tekst: "Raskol", tacan: false, zasto: "Raskol je podela već postojeće crkve, kao 1054."}
          - {tekst: "Seoba", tacan: false, zasto: "Seoba je kretanje naroda sa jednog tla na drugo."}
        pomoc:
          - "Korak 1: Šta se u primeru menja?"
          - "Korak 2: Od čijeg imena dolazi reč za tu veru?"
          - "Iz lekcije: hristijanizacija je prihvatanje hrišćanstva i njegovog učenja."
        objasnjenje: "Hristijanizacija znači prihvatanje hrišćanstva i njegovog učenja."
        iz_udzbenika:
          strana: 21
          odeljak: "Pokrštavanje Južnih Slovena"
          tekst: "Hristijanizacija je prihvatanje hrišćanstva i njegovog učenja."

      - id: l03-knez-i-narod-izbor
        vrsta: izbor
        tezina: tesko
        pojmovi: [hristijanizacija, perun, pokrstavanje]
        pitanje: "Zamisli slovenskog kneza koji je primio hrišćanstvo, dok mu seljaci još prinose žrtve Perunu. Šta to pokazuje o pokrštavanju?"
        odgovori:
          - {tekst: "Bilo je postepen proces: najpre vladarske porodice, a narod kasnije", tacan: true}
          - {tekst: "Knez nije pravi hrišćanin, jer hrišćanstvo nema veze sa politikom", tacan: false, zasto: "Pokrštavanje je bilo i politički čin, pa se upravo vladari prvi odlučuju na njega."}
          - {tekst: "Seljaci su zapravo Avari", tacan: false, zasto: "Perun je vrhovni bog Slovena, pa su to slovenski mnogobošci koji se postepeno odriču stare vere."}
          - {tekst: "Takvo stanje je nemoguće, jer svi primaju veru u istom trenutku", tacan: false, zasto: "Sloveni su mnogoboštvo ostavljali postepeno, pa je razlika između vladara i naroda očekivana."}
        pomoc:
          - "Ko je u novoj veri prvi?"
          - "Da li su se Sloveni odjednom odrekli starih bogova?"
          - "Iz lekcije: Sloveni su postepeno ostavljali mnogoboštvo; najpre vladarske porodice, a posle ostali narod."
        objasnjenje: "Vera se širi odozgo nadole i polako, pa stari bogovi i nova vera neko vreme žive jedno pored drugog."
        iz_udzbenika:
          strana: 22
