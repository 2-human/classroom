        objasnjenje: "Raška je najvažniji srpski savez, a sklavinije su vizantijski naziv za slovenske plemenske oblasti."
        iz_udzbenika:
          strana: 22
          odeljak: "Zapamtite"
          tekst: "Rano nastaju plemenski savezi; najvažniji srpski je u Raškoj."

