        karike:
          - "Asparuh dovodi Bugare preko Dunava do planine Balkan"
          - "?"
          - "Vizantija je u stalnim sukobima sa novim susedom"
        praznina: 1
        odgovori:
          - {tekst: "Bugari zauzimaju krajeve koje carstvo pokušava da povrati", tacan: true}
          - {tekst: "Bugari predaju zemlju Vizantiji", tacan: false, zasto: "Da su je predali, ne bi bilo sukoba; lekcija beleži brojne sukobe."}
          - {tekst: "Bugari se vraćaju preko Dunava", tacan: false, zasto: "Ostali su i stopili se sa Slovenima."}
        pomoc:
          - "Korak 1: Čija je to bila zemlja pre dolaska Bugara?"
          - "Korak 2: Šta Vizantija od sredine VII veka pokušava da uradi?"
