        pitanje: "Šta iz ovog odlomka možemo da zaključimo o ropstvu kod Slovena?"
        odgovori:
          - {tekst: "Ropstvo je bilo ograničeno vremenom, a zarobljenik je mogao da postane slobodan", tacan: true}
          - {tekst: "Zarobljenici su ostajali robovi do smrti", tacan: false, zasto: "Izvor kaže upravo da ih ne drže trajno u ropstvu."}
          - {tekst: "Sloveni nikada nisu uzimali zarobljenike", tacan: false, zasto: "Uzimali su ih, jer izvor opisuje šta dalje sa njima rade."}
          - {tekst: "Zarobljenici su odmah puštani bez ikakvog roka", tacan: false, zasto: "Oslobađanje dolazi posle određenog roka, a ne odmah."}
        pomoc:
          - "Nađi izraz koji govori o vremenu."
          - "Koje dve mogućnosti ima zarobljenik?"
          - "Iz lekcije: posle određenog roka mogu da se otkupe i vrate ili da ostanu kao slobodni i prijatelji."
        objasnjenje: "Izvor pokazuje blaži oblik ropstva: posle roka zarobljenik se može otkupiti ili ostati kao slobodan i prijatelj."
        iz_udzbenika:
          strana: 22
          odeljak: "Iz istorijskih izvora"
          tekst: "Sloveni zarobljenike ne drže trajno u ropstvu: posle roka mogu da se otkupe ili da ostanu kao slobodni i prijatelji."

      - id: l03-izvor-zaseda-izvor
        vrsta: izvor
        tezina: tesko
        pojmovi: [stari-sloveni, zaseda, pesadija, avari]
        izvor:
          autor: "Vizantijski izvor (ime nije navedeno)"
          naslov: "O Slovenima i Antima"
          tekst: "Protivnika radije napadaju u šumama, klancima i na strminama. Umešno se služe zasedama i iznenadnim napadima."
          napomena: "Odlomak je prepričan; udžbenik, str. 21–22."
        pitanje: "Kako se ovaj opis slaže sa podatkom da su Sloveni bili pešadija, a ne konjica?"
        odgovori:
          - {tekst: "Pešak se u šumi i klancu lako kreće i skriva, pa je takav teren njegova prednost", tacan: true}
          - {tekst: "Ne slaže se, jer je za zasede u šumi potrebna teška konjica", tacan: false, zasto: "Konjica traži otvoren prostor, kakav imaju Avari i Bugari; šuma i strmina pogoduju pešacima."}
          - {tekst: "Ne slaže se, jer su Sloveni izbegavali borbu", tacan: false, zasto: "Nisu je izbegavali, nego su birali mesto i trenutak koji im odgovaraju."}
          - {tekst: "Opis govori o Avarima, a ne o Slovenima", tacan: false, zasto: "Izvor izričito govori o Slovenima i Antima."}
        pomoc:
          - "Zamisli konjanika na strmini među drvećem."
          - "Ko se u šumi bolje skriva: čovek ili konj?"
          - "Iz lekcije: Sloveni su pešadija; napadaju u šumama, klancima i na strminama, koristeći zasede."
        objasnjenje: "Sloveni su birali teren na kom njihova pešadija ima prednost, a konjica protivnika je nema."
        iz_udzbenika:
          strana: 22
          odeljak: "Iz istorijskih izvora"
          tekst: "Protivnike napadaju u šumama, klancima i na strminama i dobro koriste zasede i iznenađenja."
          slika: 03-doseljavanje-srba-na-balkan/05-sloveni-u-zasedi.jpg

      - id: l03-vi-protiv-vii-uporedi
        vrsta: uporedi
        tezina: srednje
        pojmovi: [stari-sloveni, doseljavanje, vizantija]
        a: "Upadi u VI veku"
        b: "Naseljavanje u VII veku"
        pitanje: "Na koji period se odnosi tvrdnja?"
        tvrdnje:
          - {tekst: "Sloveni se sa plenom vraćaju preko Dunava.", odgovor: a, zasto: "To je obrazac pljačke u VI veku; u VII veku ostaju."}
          - {tekst: "Sloveni dolaze sa porodicama.", odgovor: b, zasto: "Porodice dolaze u VII veku, jer je cilj trajni ostanak."}
          - {tekst: "Glavni protivnik je Vizantija.", odgovor: oba, zasto: "I upadi i naseljavanje odvijaju se na vizantijskoj teritoriji."}
          - {tekst: "Vlada Justinijan I.", odgovor: a, zasto: "Justinijan I vlada 527–565, u vreme prvih upada."}
          - {tekst: "Nastaje naziv Slovenska.", odgovor: b, zasto: "Naziv se javlja sredinom VII veka, kada su naseobine snažne."}
          - {tekst: "Sloveni su već primili hrišćanstvo.", odgovor: nijedan, zasto: "Hrišćanstvo se kod Južnih Slovena učvršćuje tek u IX veku."}
        pomoc:
          - "Pitaj se: ide li se kući posle borbe ili se ostaje?"
          - "Pazi na tvrdnje koje važe za oba perioda ili ni za jedan."
          - "Iz lekcije: u VI veku pljačka, u VII veku naseljavanje sa porodicama."
        objasnjenje: "U VI veku Sloveni dolaze radi plena, a u VII veku radi ostanka; protivnik je isti, Vizantija."
        iz_udzbenika:
          strana: 19
          odeljak: "Stari Sloveni i naseljavanje Balkanskog poluostrva"
          tekst: "Upadi u VI veku su pljačkaški, a u VII veku Sloveni dolaze sa porodicama i ostaju."

      - id: l03-sloveni-avari-uporedi
        vrsta: uporedi
        tezina: lako
        pojmovi: [stari-sloveni, avari, pesadija]
        a: "Sloveni"
        b: "Avari"
        pitanje: "Na koji narod se odnosi tvrdnja?"
        tvrdnje:
          - {tekst: "U borbi su bili pešadija.", odgovor: a, zasto: "Sloveni su ratovali pešice; Avari su bili konjica."}
          - {tekst: "U borbi su bili konjica.", odgovor: b, zasto: "Konjica su bili Avari, kao i Bugari."}
          - {tekst: "Stigli su iz Azije u Panonsku niziju.", odgovor: b, zasto: "Avari su došli iz Azije; pradomovina Slovena bila je u Evropi."}
          - {tekst: "Napadali su Carigrad 626.", odgovor: oba, zasto: "Napad 626. izveli su zajedno."}
          - {tekst: "Poticali su iz zemalja između Odre i Visle.", odgovor: a, zasto: "To je slovenska pradomovina."}
        pomoc:
          - "Ko je došao iz Azije?"
          - "Jedna tvrdnja važi za oba."
          - "Iz lekcije: Sloveni su pešadija, Avari konjica; zajedno napadaju 626."
        objasnjenje: "Sloveni i Avari su se razlikovali po poreklu i načinu ratovanja, a povezivali su ih zajednički napadi."
        iz_udzbenika:
          strana: 19
          odeljak: "Stari Sloveni i naseljavanje Balkanskog poluostrva"
          tekst: "Avari stižu iz Azije; u borbama su konjica, a Sloveni pešadija."

      - id: l03-justinijan-ko-sam
        vrsta: ko_sam
        tezina: srednje
        pojmovi: [justinijan-i, vizantija, stari-sloveni]
        tragovi:
          - "Bio sam vizantijski car u VI veku."
          - "Vladao sam od 527. do 565."
          - "Pod mojom vlašću počeli su upadi Slovena na Balkan."
        odgovori:
          - {tekst: "Justinijan I", tacan: true}
          - {tekst: "Iraklije", tacan: false, zasto: "Iraklije vlada u VII veku (610–641), posle Justinijana."}
          - {tekst: "Herodot", tacan: false, zasto: "Herodot je grčki istoričar iz V veka pre n. e., a ne vizantijski car."}
        objasnjenje: "To je Justinijan I, pod kojim počinju pljačkaški upadi Slovena."
        iz_udzbenika:
          strana: 19
          odeljak: "Stari Sloveni i naseljavanje Balkanskog poluostrva"
          tekst: "Upadi na Balkan počinju pod carem Justinijanom I (527–565)."
        osa: {naziv: "Vladavina Justinijana I", od: 527, do: 565, traka: vladari}

      - id: l03-avari-ko-sam
        vrsta: ko_sam
        tezina: lako
        pojmovi: [avari, stari-sloveni, carigrad]
        tragovi:
          - "Stigli smo iz Azije u Panonsku niziju sredinom VI veka."
          - "Potčinili smo tamošnja slovenska plemena."
          - "Sa Slovenima smo 626. neuspešno napali Carigrad."
        odgovori:
          - {tekst: "Avari", tacan: true}
          - {tekst: "Mađari", tacan: false, zasto: "I Mađari dolaze u Panoniju iz Azije, ali tek krajem IX veka."}
          - {tekst: "Bugari", tacan: false, zasto: "Bugari su sa Slovenima napadali ranije, ali Panoniju i napad 626. lekcija vezuje za Avare."}
        objasnjenje: "To su Avari, koji su Slovene u Panoniji potčinili, a posle ih poveli na Vizantiju."
        iz_udzbenika:
          strana: 19
          odeljak: "Stari Sloveni i naseljavanje Balkanskog poluostrva"
          tekst: "Avari stižu iz Azije, potčinjavaju slovenska plemena, a 626. napadaju Carigrad sa Slovenima."

      - id: l03-kada-naseljavanje-objasni
        vrsta: objasni
        tezina: lako
        pojmovi: [doseljavanje, stari-sloveni]
        pitanje: "Kada počinje naseljavanje Slovena na Balkanu i po čemu znamo da to više nisu pljačkaški upadi? Objasni."
        uzor: "Naseljavanje počinje u VII veku. U VI veku Sloveni su pljačkali i sa plenom se vraćali preko Dunava. Od početka VII veka prelaze sa porodicama i sa namerom da ostanu, a sredinom veka već postoje snažne naseobine."
        ideje:
          - "Naseljavanje počinje u VII veku."
          - "U VI veku su se posle pljačke vraćali."
          - "U VII veku dolaze sa porodicama."
          - "Nastaju snažne slovenske naseobine."
        objasnjenje: "Ključna razlika je namera: povratak sa plenom ili ostanak sa porodicom."
        iz_udzbenika:
          strana: 22
          odeljak: "Pitanja za razmišljanje / Zadaci iz udžbenika"
          tekst: "Udžbenik pita kada počinje naseljavanje Balkana."

      - id: l03-zasto-vizantija-gubi-objasni
        vrsta: objasni
        tezina: srednje
        pojmovi: [vizantija, slovenska, stari-sloveni]
        pitanje: "Kako je Vizantija do sredine VII veka izgubila veliki deo Balkana, iako nije izgubila ni Solun ni Carigrad? Objasni."
        uzor: "Vizantija je ratovala i na drugim stranama pa nije mogla da brani Dunav. Sloveni su zato početkom VII veka prelazili granicu bez većeg otpora i naseljavali unutrašnjost. Veliki gradovi su odoleli napadima, ali je zemlja do planine Balkan postala Slovenska."
        ideje:
          - "Ratovi na drugim stranama carstva oslabili su granicu."
          - "Sloveni prelaze bez većeg otpora i naseljavaju se."
          - "Solun i Carigrad odolevaju, a unutrašnjost je izgubljena."
        objasnjenje: "Zemlja se ne gubi samo padom velikih gradova, nego i trajnim naseljavanjem unutrašnjosti."
        iz_udzbenika:
          strana: 19
          odeljak: "Stari Sloveni i naseljavanje Balkanskog poluostrva"
          tekst: "Vizantija nije mogla da brani granicu, napadi na gradove nisu uspeli, a sredinom VII veka zemlja do planine Balkan zove se Slovenska."

      - id: l03-koliko-verovati-izvoru-objasni
        vrsta: objasni
        tezina: tesko
        pojmovi: [stari-sloveni, anti, vizantija, zaseda]
        pitanje: "Vizantijski izvor o Slovenima i Antima napisao je stranac i protivnik. Šta iz njega možemo da saznamo, a na šta moramo da pazimo? Objasni."
        uzor: "Izvor nam kazuje da su Sloveni bili brojni, izdržljivi i slobodoljubivi, da su zarobljenike posle roka oslobađali i da su ratovali iz zasede. Ali pisac nije Sloven, nego pripadnik carstva koje su Sloveni napadali, pa je gledao spolja i svojim očima. Zato je dobro da takvu vest uporedimo sa drugim podacima."
        ideje:
          - "Izvor daje podatke o običajima i načinu ratovanja Slovena."
          - "Pisac je Vizantinac, dakle stranac i protivnik."
          - "Vizantijske vesti često su kratke i neprecizne."
          - "Vest treba uporediti sa drugim podacima."
        objasnjenje: "Izvor je dragocen jer drugih gotovo nema, ali ga treba čitati znajući ko ga je napisao."
        iz_udzbenika:
          strana: 21
          odeljak: "Iz istorijskih izvora"
          tekst: "Vizantijski izvor opisuje Slovene i Ante; vesti vizantijskih pisaca su inače kratke i često neprecizne."

      - id: l03-severno-od-dunava-izbor
        vrsta: izbor
        tezina: tesko
        pojmovi: [stari-sloveni, vizantija, doseljavanje]
        pitanje: "Vizantijski pisci u VI veku pominju Slovene severno od Dunava, a isti ti Sloveni tada pljačkaju Trakiju i Epir. Kako se ova dva podatka slažu?"
        odgovori:
          - {tekst: "Sloveni su još živeli preko Dunava, a na carsku zemlju dolazili su samo radi plena", tacan: true}
          - {tekst: "Podaci se ne slažu, pa je jedan sigurno izmišljen", tacan: false, zasto: "Slažu se: dom je severno od reke, a pljačka je pohod koji se završava povratkom na levu obalu."}
          - {tekst: "Trakija i Epir su severno od Dunava", tacan: false, zasto: "To su vizantijske oblasti na Balkanu, dakle južno od Dunava."}
          - {tekst: "Sloveni su već živeli u Trakiji i Epiru sa porodicama", tacan: false, zasto: "Porodice prelaze tek početkom VII veka; u VI veku ostajanja još nema."}
        pomoc:
          - "Razlikuj gde neko živi od toga dokle stiže u pohodu."
          - "Gde su se vraćali sa plenom?"
          - "Iz lekcije: u VI veku pominju se severno od Dunava; posle upada vraćaju se na levu obalu."
        objasnjenje: "U VI veku granica je još razdvajala dom i plen: Sloveni žive severno od Dunava, a na jug idu u pljačku."
        iz_udzbenika:
          strana: 18
          odeljak: "Život u pradomovini, uzroci i pravci seobe"
          tekst: "U VI veku Sloveni se pominju severno od Dunava, a tada već pljačkaju vizantijske oblasti."

      - id: l03-vera-i-priroda-objasni
        vrsta: objasni
        tezina: srednje
        pojmovi: [stari-sloveni, perun, dazbog]
        pitanje: "Kako se vera starih Slovena vezuje za njihov život u prirodi? Objasni."
        uzor: "Sloveni su bili tesno vezani za prirodu, pa su verovali da mnogi bogovi žive u šumama i rekama. Vrhovni bog bio je Perun ili Svetovid, a Dažbog je bio bog Sunca i podzemlja. Verovali su i u vile i vukodlake. Ono što su svakodnevno videli oko sebe pretvarali su u svoja verovanja."
        ideje:
          - "Sloveni su tesno vezani za prirodu."
          - "Bogovi žive u šumama i rekama."
          - "Vrhovni bog je Perun ili Svetovid, a Dažbog bog Sunca i podzemlja."
          - "Verovali su u vile i vukodlake."
        objasnjenje: "Mnogoboštvo Slovena izrasta iz života u prirodi."
        iz_udzbenika:
          strana: 19
          odeljak: "Stari Sloveni i naseljavanje Balkanskog poluostrva"
          tekst: "Sloveni su bili vezani za prirodu; mnogi bogovi su živeli u šumama i rekama."

  - naslov: "Odnosi sa susedima i starosedeocima"
    zadaci:
      - id: l03-vlasi-izbor
        vrsta: izbor
        tezina: lako
        pojmovi: [vlasi, starosedeoci]
        pitanje: "Koga su Sloveni nazivali Vlasima?"
        odgovori:
          - {tekst: "Romanizovane Ilire i Tračane", tacan: true}
          - {tekst: "Avare i Bugare", tacan: false, zasto: "Avari i Bugari su azijski došljaci, a Vlasi su staro romanizovano stanovništvo Balkana."}
          - {tekst: "Vizantijske sveštenike", tacan: false, zasto: "Naziv se odnosi na starosedeoce u planinama, a ne na sveštenike carstva."}
          - {tekst: "Hrvatska plemena", tacan: false, zasto: "Hrvati su južnoslovenska plemena, a Vlasi potomci starog romanizovanog stanovništva."}
        pomoc:
          - "Oni su na Balkanu živeli pre Slovena."
          - "Primili su rimsku kulturu i jezik."
          - "Iz lekcije: tako su Sloveni zvali romanizovane Ilire i Tračane."
        objasnjenje: "Vlasi su romanizovani Iliri i Tračani, koji su se povukli u planine i živeli kao stočari."
        iz_udzbenika:
          strana: 20
          odeljak: "Odnosi sa susedima i starosedeocima"
          tekst: "Vlasima su Sloveni zvali romanizovane Ilire i Tračane, koji su se povukli u planine i bavili stočarstvom."

      - id: l03-asimilacija-izbor
        vrsta: izbor
        tezina: lako
        pojmovi: [asimilacija]
        pitanje: "Šta je asimilacija?"
        odgovori:
          - {tekst: "Nestajanje jednog naroda, obično manjine, stapanjem sa većinskim narodom", tacan: true}
          - {tekst: "Prelazak na hrišćanstvo", tacan: false, zasto: "To je hristijanizacija; asimilacija je stapanje sa drugim narodom."}
          - {tekst: "Seoba naroda u novu zemlju", tacan: false, zasto: "Seoba je kretanje naroda, a asimilacija ono što se može desiti posle, kad se narodi izmešaju."}
          - {tekst: "Povlačenje naroda u planine", tacan: false, zasto: "Tako su Vlasi izbegli stapanje, pa je to pre suprotnost asimilaciji."}
        pomoc:
          - "Razmisli šta se desi sa malom grupom među mnogo većom."
          - "Traži reč „stapanje”."
          - "Iz lekcije: jedan narod, obično manjina, nestaje stapanjem sa većinskim narodom."
        objasnjenje: "Asimilacija znači da se manjina stopi sa većinom i nestane kao poseban narod."
        iz_udzbenika:
          strana: 20
          odeljak: "Odnosi sa susedima i starosedeocima"
          tekst: "Asimilacija je kada jedan narod, obično manjina, nestaje stapanjem sa većinskim narodom na nekom području."

      - id: l03-primorski-gradovi-izbor
        vrsta: izbor
        tezina: srednje
        pojmovi: [starosedeoci]
        pitanje: "U kojim primorskim gradovima su opstali delovi starog rimskog stanovništva? (više tačnih)"
        odgovori:
          - {tekst: "Drač", tacan: true}
          - {tekst: "Skadar", tacan: true}
          - {tekst: "Trogir", tacan: true}
          - {tekst: "Zadar", tacan: true}
          - {tekst: "Niš", tacan: false, zasto: "Niš je ostao vizantijski, ali je u unutrašnjosti, a pitanje traži gradove na obali."}
          - {tekst: "Sofija", tacan: false, zasto: "I Sofija je ostala Vizantiji, ali nije primorski grad."}
        pomoc:
          - "Svi tačni gradovi su na Jadranu ili blizu njega."
          - "Izbaci gradove iz unutrašnjosti Balkana."
          - "Iz lekcije: Drač, Skadar, Trogir i Zadar."
        objasnjenje: "Stari stanovnici opstali su u Draču, Skadru, Trogiru i Zadru, a Sloveni su se naselili u njihovom zaleđu."
        iz_udzbenika:
          strana: 20
          odeljak: "Odnosi sa susedima i starosedeocima"
          tekst: "Delovi rimskog stanovništva opstali su u Draču, Skadru, Trogiru i Zadru, iza kojih su se naselili Sloveni."

      - id: l03-varvari-tn
        vrsta: tacno_netacno
        tezina: lako
        pojmovi: [varvari]
        tvrdnja: "Varvarima su nazivani stranci izvan antičke grčko-rimske kulture."
        tacno: true
        pomoc:
          - "Pomisli na plemena van rimskih granica."
          - "Iz lekcije: varvari su stranci izvan antičke grčko-rimske kulture."
        objasnjenje: "Tačno. Varvari su, gledano iz Rima i Grčke, bili oni koji ne pripadaju toj kulturi, na primer plemena van rimskih granica."
        iz_udzbenika:
          strana: 20
          odeljak: "Odnosi sa susedima i starosedeocima"
          tekst: "Varvari su stranci izvan antičke grčko-rimske kulture, na primer plemena van rimskih granica."

      - id: l03-povratak-teritorije-tn
        vrsta: tacno_netacno
        tezina: srednje
        pojmovi: [vizantija, slovenska]
        tvrdnja: "Vizantija se pomirila sa gubitkom Balkana i nije pokušavala da ga vrati."
        tacno: false
        ispravke:
          - {tekst: "Od sredine VII veka vodila je brojne ratove da povrati teritoriju.", tacan: true}
          - {tekst: "Vratila je celu teritoriju već 626, posle pobede kod Carigrada.", tacan: false, zasto: "Odbrana Carigrada nije vratila zemlju; sredinom VII veka ta zemlja se zvala Slovenska."}
          - {tekst: "Prepustila je Balkan Avarima ugovorom.", tacan: false, zasto: "O tome nema reči; carstvo je, naprotiv, ratovalo da povrati izgubljeno."}
        pomoc:
          - "Seti se koliko je carstvu bio važan Balkan."
          - "Traži podatak o sredini VII veka."
          - "Iz lekcije: Vizantija je od sredine VII veka vodila brojne ratove da povrati teritoriju."
        objasnjenje: "Netačno. Od sredine VII veka Vizantija je mnogo ratovala da povrati izgubljene krajeve."
        iz_udzbenika:
          strana: 20
          odeljak: "Odnosi sa susedima i starosedeocima"
          tekst: "Vizantija je od sredine VII veka vodila brojne ratove da povrati teritoriju."

      - id: l03-vlasi-dopuni
        vrsta: dopuni
        tezina: lako
        pojmovi: [vlasi, cincari]
        pitanje: "Dopuni rečenicu."
        tekst: "Vlasi su se povukli u {{planine}} i živeli kao {{stočari}}, a i {{Cincari}} potiču od romanizovanog stanovništva."
        ponudjene: [planine, stočari, Cincari, gradove, pomorci, Avari]
        pomoc:
          - "Mesto povlačenja je daleko od nizija u koje stižu Sloveni."
          - "Zanimanje se dobro slaže sa planinom."
          - "Iz lekcije: povukli su se u planine i živeli kao stočari; i Cincari potiču od romanizovanog stanovništva."
        objasnjenje: "Vlasi su opstali u planinama kao stočari; od romanizovanog stanovništva potiču i Cincari."
        iz_udzbenika:
          strana: 20
          odeljak: "Odnosi sa susedima i starosedeocima"
          tekst: "Vlasi su se povukli u planine i živeli kao stočari, a Cincari takođe potiču od romanizovanog stanovništva."

      - id: l03-starosedeoci-sudbina-dopuni
        vrsta: dopuni
        tezina: tesko
        pojmovi: [starosedeoci, asimilacija]
        pitanje: "Dopuni bez ponuđenih reči."
        tekst: "Starosedeoci su uglavnom bili potisnuti i {{asimilovani}}. Izuzetak je današnja {{Albanija}}, čije stanovništvo svoje poreklo vezuje za antičke {{Ilire}}."
        pomoc:
          - "Prva praznina je pridev od reči za stapanje naroda."
          - "Traži zemlju uz Jadran južno od Crne Gore."
          - "Iz lekcije: potisnuti i asimilovani; izuzetak je Albanija, poreklo od antičkih Ilira."
        objasnjenje: "Stari narodi su se većinom stopili sa Slovenima, a stanovništvo Albanije poreklo vezuje za Ilire."
        iz_udzbenika:
          strana: 20
          odeljak: "Odnosi sa susedima i starosedeocima"
          tekst: "Starosedeoci su uglavnom potisnuti i asimilovani; izuzetak je današnja Albanija."

      - id: l03-pojmovi-starosedeoci-povezi
        vrsta: povezi
        tezina: srednje
        pojmovi: [vlasi, cincari, varvari, asimilacija]
        pitanje: "Poveži pojam sa objašnjenjem."
        parovi:
          - ["Vlasi", "Romanizovani Iliri i Tračani, stočari u planinama"]
          - ["Cincari", "Takođe potomci romanizovanog stanovništva"]
          - ["Varvari", "Stranci izvan grčko-rimske kulture"]
          - ["Asimilacija", "Stapanje manjine sa većinskim narodom"]
          - ["Drač i Zadar", "Primorski gradovi sa ostacima rimskog stanovništva"]
        pomoc:
          - "Dve stavke su potomci romanizovanog stanovništva, a jednu odredi po zanimanju."
          - "Varvar je pogled iz grčko-rimskog sveta."
          - "Iz lekcije: Vlasi u planinama, Cincari od romanizovanog stanovništva, varvari van rimskih granica."
        objasnjenje: "Pojmovi opisuju šta se desilo sa starim stanovništvom Balkana kada su došli Sloveni."
        iz_udzbenika:
          strana: 20
          odeljak: "Odnosi sa susedima i starosedeocima"
          tekst: "Lekcija objašnjava Vlahe, Cincare, varvare i asimilaciju i navodi primorske gradove sa starim stanovništvom."

      - id: l03-albanija-zakljuci
        vrsta: zakljuci
        tezina: srednje
        pojmovi: [starosedeoci, asimilacija]
        pitanje: "Zašto se današnja Albanija u lekciji navodi kao izuzetak?"
        odgovori:
          - {tekst: "Starosedeoci drugde su uglavnom asimilovani, a stanovništvo Albanije poreklo vezuje za antičke Ilire", tacan: true}
          - {tekst: "U Albaniji su živeli Avari", tacan: false, zasto: "Avari su bili u Panoniji; u Albaniji se radi o potomcima antičkih Ilira."}
          - {tekst: "Sloveni su tamo stigli pre Huna", tacan: false, zasto: "Sloveni na Balkan stižu mnogo posle Huna, svuda pa i tamo."}
          - {tekst: "Stanovništvo Albanije potiče iz pradomovine Slovena", tacan: false, zasto: "Upravo nije tako: ono poreklo vezuje za Ilire, starosedeoce Balkana."}
        pomoc:
          - "Korak 1: Šta se uglavnom desilo sa starosedeocima?"
          - "Korak 2: Sa kojim antičkim narodom se Albanci povezuju?"
          - "Iz lekcije: izuzetak je Albanija, čije stanovništvo poreklo vezuje za antičke Ilire."
        objasnjenje: "Pravilo je asimilacija starosedelaca, a izuzetak je stanovništvo Albanije, koje poreklo vezuje za Ilire."
        iz_udzbenika:
          strana: 20
          odeljak: "Odnosi sa susedima i starosedeocima"
          tekst: "Izuzetak je današnja Albanija, čije stanovništvo poreklo vezuje za antičke Ilire."

      - id: l03-romani-uticaj-zakljuci
        vrsta: zakljuci
        tezina: tesko
        pojmovi: [starosedeoci, stari-sloveni, hristijanizacija]
        pitanje: "Šta je opstanak romanskog gradskog stanovništva značio za budući razvoj Slovena?"
        odgovori:
          - {tekst: "Sloveni su od njih mogli da prime kulturne uticaje, pa i prva znanja o hrišćanstvu", tacan: true}
          - {tekst: "Ništa, jer Sloveni i Romani nisu imali nikakav dodir", tacan: false, zasto: "Dodira je bilo: Sloveni su se naselili odmah iza tih gradova, a romansko stanovništvo je kulturno uticalo na njih."}
          - {tekst: "Sloveni su zato prešli na romanski jezik i nestali", tacan: false, zasto: "Dogodilo se obrnuto: starosedeoci su se uglavnom stopili sa Slovenima."}
          - {tekst: "Romani su Slovene odmah proterali iz primorja", tacan: false, zasto: "Bili su slabiji: opstali su u nekoliko gradova, a Sloveni su im naselili zaleđe."}
        pomoc:
          - "Korak 1: Gde su se Sloveni naselili u odnosu na primorske gradove?"
          - "Korak 2: Preko koga su Sloveni prvo upoznali hrišćanstvo?"
          - "Iz lekcije: romansko stanovništvo je kulturno uticalo na Slovene; hrišćanstvo su prvo upoznali preko starosedelaca."
        objasnjenje: "Sloveni su živeli odmah uz stare gradove, pa su od njihovih stanovnika primali kulturu i prve hrišćanske uticaje."
        iz_udzbenika:
          strana: 20
          odeljak: "Odnosi sa susedima i starosedeocima"
          tekst: "Ponegde je gradsko romansko stanovništvo opstalo i kulturno uticalo na Slovene."

      - id: l03-napustena-naselja-lanac
        vrsta: lanac
        tezina: lako
        pojmovi: [varvari, avari, bugari, starosedeoci]
        karike:
          - "Avari, Bugari i Sloveni u VI veku stalno napadaju Balkan"
          - "Život u antičkim naseljima postaje nesiguran"
          - "?"
        praznina: 2
        odgovori:
          - {tekst: "Mnoga antička naselja su sasvim napuštena", tacan: true}
          - {tekst: "Antička naselja postaju bogatija nego ikad", tacan: false, zasto: "Napadi su donosili pustošenje, a ne bogaćenje; mnoga naselja su ostala prazna."}
          - {tekst: "Stanovnici naselja odmah primaju slovensku veru", tacan: false, zasto: "Stanovnici su uglavnom bežali ili propadali; o takvom prelasku nema reči."}
        pomoc:
          - "Korak 1: Kako je živeti u mestu koje stalno pljačkaju?"
          - "Korak 2: Šta ljudi tada rade?"
          - "Iz lekcije: stalni napadi → napuštanje antičkih naselja."
        objasnjenje: "Pod stalnim napadima mnoga antička naselja su sasvim napuštena."
        iz_udzbenika:
          strana: 19
          odeljak: "Odnosi sa susedima i starosedeocima"
          tekst: "Pod napadima Avara, Bugara i Slovena u VI veku mnoga antička naselja su sasvim napuštena."

      - id: l03-vlasi-planine-lanac
        vrsta: lanac
        tezina: srednje
        pojmovi: [starosedeoci, vlasi, asimilacija]
        karike:
          - "Sloveni se naseljavaju na Balkan"
          - "Starosedeoci su potisnuti"
          - "?"
        praznina: 2
        odgovori:
          - {tekst: "Većina se asimiluje, a Vlasi se povlače u planine kao stočari", tacan: true}
          - {tekst: "Svi starosedeoci odlaze u pradomovinu Slovena", tacan: false, zasto: "Pradomovina je slovenska i daleko je; starosedeoci su ostajali na Balkanu."}
          - {tekst: "Starosedeoci preuzimaju vlast nad Slovenima", tacan: false, zasto: "Bili su potisnuti, pa je vlast ostala kod došljaka; preživeli su kao stočari ili u nekoliko gradova."}
        pomoc:
          - "Korak 1: Šta može da uradi potisnuti narod: da se stopi ili da se skloni?"
          - "Korak 2: Gde su se sklonili Vlasi?"
          - "Iz lekcije: naseljavanje → potiskivanje i asimilacija; Vlasi u planinama kao stočari."
        objasnjenje: "Potisnuti starosedeoci su se većinom stopili sa Slovenima, a Vlasi su opstali u planinama."
        iz_udzbenika:
          strana: 20
          odeljak: "Odnosi sa susedima i starosedeocima"
          tekst: "Starosedeoci su potisnuti i asimilovani, a Vlasi su se povukli u planine i živeli kao stočari."

      - id: l03-gradovi-planine-uporedi
        vrsta: uporedi
        tezina: tesko
        pojmovi: [starosedeoci, vlasi, asimilacija]
        a: "Romani u primorskim gradovima"
        b: "Vlasi u planinama"
        pitanje: "Na koju grupu starog stanovništva se odnosi tvrdnja?"
        tvrdnje:
          - {tekst: "Opstali su u Draču, Skadru, Trogiru i Zadru.", odgovor: a, zasto: "To su primorski gradovi sa ostacima rimskog stanovništva."}
          - {tekst: "Živeli su pretežno kao stočari.", odgovor: b, zasto: "Vlasi su se u planinama bavili stočarstvom."}
          - {tekst: "Potiču iz vremena pre dolaska Slovena.", odgovor: oba, zasto: "Obe grupe su staro romanizovano stanovništvo Balkana."}
          - {tekst: "Mogli su da kulturno utiču na Slovene iz svojih gradova.", odgovor: a, zasto: "Kulturni uticaj lekcija pripisuje gradskom romanskom stanovništvu."}
          - {tekst: "Došli su iz Azije.", odgovor: nijedan, zasto: "Iz Azije su Huni, Avari, Bugari i Mađari; ove grupe su starosedeoci."}
        pomoc:
          - "Prvo odredi gde koja grupa živi."
          - "Pazi: obe su starosedeoci."
          - "Iz lekcije: Romani u primorskim gradovima, Vlasi u planinama kao stočari."
        objasnjenje: "Starosedeoci su preživeli na dva načina: iza gradskih zidina uz more ili povlačenjem u planine."
        iz_udzbenika:
          strana: 20
          odeljak: "Odnosi sa susedima i starosedeocima"
          tekst: "Rimsko stanovništvo opstalo je u primorskim gradovima, a Vlasi su se povukli u planine."

      - id: l03-vlasi-ko-sam
        vrsta: ko_sam
        tezina: lako
        pojmovi: [vlasi, starosedeoci]
        tragovi:
          - "Potomci smo Ilira i Tračana koji su primili rimsku kulturu."
          - "Ime su nam dali Sloveni."
          - "Pred došljacima smo se povukli u planine i živeli kao stočari."
        odgovori:
          - {tekst: "Vlasi", tacan: true}
          - {tekst: "Avari", tacan: false, zasto: "Avari su azijski došljaci, a ne romanizovani starosedeoci."}
          - {tekst: "Anti", tacan: false, zasto: "Anti su srodnici Slovena koje opisuje vizantijski izvor, a ne romanizovani Iliri i Tračani."}
        objasnjenje: "To su Vlasi, romanizovani Iliri i Tračani koji su opstali kao planinski stočari."
        iz_udzbenika:
          strana: 20
          odeljak: "Odnosi sa susedima i starosedeocima"
          tekst: "Sloveni su Vlasima zvali romanizovane Ilire i Tračane."

      - id: l03-sudbina-starosedelaca-objasni
        vrsta: objasni
        tezina: srednje
        pojmovi: [starosedeoci, asimilacija, vlasi]
        pitanje: "Šta se dogodilo sa starim stanovništvom Balkana posle dolaska Slovena? Objasni."
        uzor: "Starosedeoci su uglavnom potisnuti i asimilovani, odnosno stopili su se sa Slovenima. Deo je opstao u primorskim gradovima, poput Drača i Zadra, a Vlasi su se povukli u planine i živeli kao stočari. Izuzetak je današnja Albanija."
        ideje:
          - "Većina je potisnuta i asimilovana."
          - "Deo opstaje u primorskim gradovima."
          - "Vlasi se povlače u planine i žive kao stočari."
          - "Albanija je izuzetak."
        objasnjenje: "Odgovor treba da pokaže i pravilo (asimilacija) i načine opstanka."
        iz_udzbenika:
          strana: 20
          odeljak: "Odnosi sa susedima i starosedeocima"
          tekst: "Starosedeoci su uglavnom potisnuti i asimilovani, uz primorske gradove, Vlahe i Albaniju kao izuzetke."

      - id: l03-vlasi-stocari-zakljuci
        vrsta: zakljuci
        tezina: lako
        pojmovi: [vlasi, starosedeoci]
        pitanje: "Zašto su Vlasi živeli baš kao stočari?"
        odgovori:
          - {tekst: "Povukli su se u planine, gde je stočarstvo prirodno zanimanje", tacan: true}
          - {tekst: "Bili su pomorci koji su čuvali stoku na brodovima", tacan: false, zasto: "Vlasi nisu vezani za more; romansko stanovništvo u primorju živelo je po gradovima."}
          - {tekst: "Car im je zabranio da žive u planinama", tacan: false, zasto: "Upravo u planinama su živeli, povukavši se pred došljacima."}
          - {tekst: "Doneli su stoku iz Azije", tacan: false, zasto: "Vlasi nisu došli iz Azije; to su romanizovani Iliri i Tračani sa Balkana."}
        pomoc:
          - "Korak 1: Kuda su se povukli?"
          - "Korak 2: Šta se na takvom tlu može raditi?"
          - "Iz lekcije: povukli su se u planine i živeli kao stočari."
        objasnjenje: "Planina daje pašnjake, a ne njive i gradove, pa je potisnuto stanovništvo živelo od stoke."
        iz_udzbenika:
          strana: 20
          odeljak: "Odnosi sa susedima i starosedeocima"
          tekst: "Vlasi su se povukli u planine i živeli kao stočari."

  - naslov: "Plemenski savezi"
    zadaci:
      - id: l03-sklavinije-izbor
        vrsta: izbor
        tezina: lako
        pojmovi: [sklavinije, vizantija]
        pitanje: "Šta su sklavinije?"
        odgovori:
          - {tekst: "Plemenske oblasti Slovena na Balkanu, kako su ih zvali Vizantinci", tacan: true}
          - {tekst: "Vizantijski primorski gradovi", tacan: false, zasto: "Gradovi kao Drač i Zadar nisu bili sklavinije; to su oblasti koje drže slovenska plemena."}
          - {tekst: "Slovenski bogovi", tacan: false, zasto: "Bogovi su Perun, Svetovid i Dažbog; sklavinije su oblasti."}
          - {tekst: "Zemlje slovenske pradomovine", tacan: false, zasto: "Pradomovina je između Odre i Visle, a sklavinije su na Balkanu."}
        pomoc:
          - "Naziv sadrži podsetnik na reč Sloveni."
          - "Naziv potiče od vizantijskih pisaca."
          - "Iz lekcije: Vizantinci su slovenske plemenske oblasti nazivali sklavinije."
        objasnjenje: "Sklavinije su plemenske oblasti Slovena na Balkanu; naziv su koristili Vizantinci."
        iz_udzbenika:
          strana: 20
          odeljak: "Plemenski savezi"
          tekst: "Vizantinci su slovenske plemenske oblasti nazivali sklavinije."

      - id: l03-srpski-savezi-izbor
        vrsta: izbor
        tezina: lako
        pojmovi: [plemenski-savezi, raska, duklja]
        pitanje: "U kojim oblastima su nastali najvažniji srpski plemenski savezi?"
        odgovori:
          - {tekst: "U Raškoj i Duklji", tacan: true}
          - {tekst: "U Trakiji i Tesaliji", tacan: false, zasto: "To su vizantijske oblasti do kojih su stizali pljačkaški upadi, a ne središta srpskih saveza."}
          - {tekst: "U Panoniji i Moravskoj", tacan: false, zasto: "Panonija je vezana za Avare i Mađare, a Moravska za misiju Ćirila i Metodija."}
          - {tekst: "U Dalmaciji i Karantaniji", tacan: false, zasto: "Dalmatinski gradovi i Karantanski Sloveni pominju se uz pokrštavanje, a ne kao srpski savezi."}
        pomoc:
          - "Obe oblasti imaće kasnije prve srpske države."
          - "Jedna od njih izlazi na Jadran."
          - "Iz lekcije: najvažniji su u Raškoj i u Duklji."
        objasnjenje: "Najvažniji srpski savezi nastali su u Raškoj i Duklji."
        iz_udzbenika:
          strana: 20
          odeljak: "Plemenski savezi"
          tekst: "Srpski savezi nastali su u nekoliko oblasti, a najvažniji su u Raškoj i Duklji."

      - id: l03-ratovi-na-zapadu-izbor
        vrsta: izbor
        tezina: srednje
        pojmovi: [plemenski-savezi, vizantija]
        pitanje: "Sa kojim protivnicima na zapadu su ratovali Sloveni, što je ubrzalo stvaranje saveza? (više tačnih)"
        odgovori:
          - {tekst: "Langobardi", tacan: true}
          - {tekst: "Bavari", tacan: true}
          - {tekst: "Franci", tacan: true}
          - {tekst: "Huni", tacan: false, zasto: "Huni su Slovene pokrenuli još u IV veku; savezi se vežu za kasnije ratove."}
          - {tekst: "Vizantija", tacan: false, zasto: "Vizantija je zaista bila protivnik, ali na istoku, a pitanje traži zapad."}
        pomoc:
          - "Vizantija je na istoku, pa je ovde ne traži."
          - "Tačni odgovori su tri germanska naroda iz srednje Evrope."
          - "Iz lekcije: Langobardi, Bavari i Franci na zapadu."
        objasnjenje: "Ratovi sa Vizantijom na istoku i sa Langobardima, Bavarima i Francima na zapadu ubrzali su stvaranje saveza."
        iz_udzbenika:
          strana: 20
          odeljak: "Plemenski savezi"
          tekst: "Ratovi sa Vizantijom na istoku i sa Langobardima, Bavarima i Francima na zapadu ubrzali su stvaranje saveza."

      - id: l03-nestabilni-savezi-tn
        vrsta: tacno_netacno
        tezina: lako
        pojmovi: [plemenski-savezi]
        tvrdnja: "Slovenski plemenski savezi bili su nestabilni: brzo su nastajali i brzo se raspadali."
        tacno: true
        pomoc:
          - "Seti se zašto su nastali: zbog rata."
          - "Iz lekcije: bili su nestabilni, brzo su nastajali i brzo se raspadali."
        objasnjenje: "Tačno. Savezi su bili povezani potrebom rata, pa nisu bili trajni."
        iz_udzbenika:
          strana: 20
          odeljak: "Plemenski savezi"
          tekst: "Savezi su bili nestabilni: brzo su nastajali i brzo se raspadali."

