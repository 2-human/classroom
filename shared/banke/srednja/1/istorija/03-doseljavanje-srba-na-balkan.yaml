          - {tekst: "Vizantija nije imala granicu na Dunavu", tacan: false, zasto: "Imala je: Dunav je upravo bio vizantijska granica koju je trebalo braniti."}
          - {tekst: "Slovena je bilo manje nego Vizantinaca, pa ih nisu smatrali opasnim", tacan: false, zasto: "Lekcija daje drugi razlog: vojska carstva bila je zauzeta na drugim frontovima."}
