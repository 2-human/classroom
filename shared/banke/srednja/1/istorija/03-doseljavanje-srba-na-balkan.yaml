        a: "Bugari"
        b: "Mađari"
        pitanje: "Na koji narod se odnosi tvrdnja?"
        tvrdnje:
          - {tekst: "Došli su iz Azije.", odgovor: oba, zasto: "Oba naroda potiču iz Azije."}
          - {tekst: "Stopili su se sa Slovenima, a ostalo je njihovo ime.", odgovor: a, zasto: "Tako je bilo sa Bugarima u krajevima oko planine Balkan."}
          - {tekst: "Nastanili su se u Panonskoj niziji.", odgovor: b, zasto: "Panonija je mađarska oblast od kraja IX veka."}
          - {tekst: "Porazio ih je Oton I na Lehu.", odgovor: b, zasto: "Oton I je 955. pobedio Mađare."}
          - {tekst: "Snažno su uticali na zbivanja u Podunavlju i na Balkanu.", odgovor: oba, zasto: "Lekcija to izričito kaže za oba naroda."}
          - {tekst: "Doveo ih je knez Rastislav.", odgovor: nijedan, zasto: "Rastislav je moravski knez; Bugare je doveo Asparuh."}
        pomoc:
          - "Prati gde se koji narod naselio."
          - "Dve tvrdnje važe za oba."
          - "Iz lekcije: Bugari do planine Balkan i asimilovani, Mađari u Panoniji."
        objasnjenje: "Isto poreklo, različita sudbina: Bugari se stapaju sa Slovenima, a Mađari ostaju poseban narod u Panoniji."
        iz_udzbenika:
          strana: 20
          odeljak: "Doseljavanje Bugara i Mađara"
          tekst: "Bugari i Mađari došli su iz Azije i snažno uticali na Podunavlje i Balkan."

      - id: l03-oton-ko-sam
