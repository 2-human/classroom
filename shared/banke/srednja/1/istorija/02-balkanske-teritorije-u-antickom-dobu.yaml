        tezina: srednje
        pojmovi: [romanizacija]
        pitanje: "Šta je romanizacija i zašto je do nje došlo?"
        uzor: "Romanizacija je usvajanje rimske kulture, običaja i latinskog jezika. Do nje je došlo jer je rimska uprava na Balkanu trajala nekoliko vekova, uz gradove, puteve i vojsku. Većina starosedelaca se romanizovala, osim u južnoj Srbiji i Makedoniji, gde je ostao jači grčki uticaj."
