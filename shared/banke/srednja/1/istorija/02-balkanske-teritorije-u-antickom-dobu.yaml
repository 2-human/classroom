          - {tekst: "Tada su Kelti postali Rimljani", tacan: false, zasto: "Rim tada još nije na Balkanu."}
          - {tekst: "Tada su Kelti napustili Balkan", tacan: false, zasto: "Skordisci ostaju kod ušća Save u Dunav."}
