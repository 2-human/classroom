      - id: l02-izbor-antika
        vrsta: izbor
        tezina: lako
        pojmovi: [antika]
        pitanje: "Šta je antika?"
        odgovori:
          - {tekst: "Razdoblje vodeće uloge grčke i rimske kulture", tacan: true}
          - {tekst: "Razdoblje pre pojave pisma", tacan: false, zasto: "To je praistorija; antika počinje mnogo kasnije."}
          - {tekst: "Doba srpskih srednjovekovnih vladara", tacan: false, zasto: "Srednji vek dolazi posle antike."}
          - {tekst: "Naziv za kameno oruđe", tacan: false, zasto: "Antika je istorijsko razdoblje, a ne predmet."}
        pomoc:
          - "Seti se koje dve kulture stoje uz ovaj pojam."
          - "Jedna je grčka."
          - "Iz lekcije: antika je razdoblje vodeće uloge grčke i rimske kulture."
        objasnjenje: "Antika je vreme kada grčka i rimska kultura imaju vodeću ulogu."
        iz_udzbenika:
          strana: 12
          odeljak: "Uvod"
          tekst: "Antika je naziv za razdoblje vodeće uloge grčke i rimske kulture."
        osa: {naziv: "Antika", od: -800, do: 600, traka: dogadjaji, oznaka: "VIII vek pre n. e. – VI vek n. e."}
      - id: l02-izbor-grci-gde
        vrsta: izbor
        tezina: lako
        pojmovi: [grci]
        pitanje: "Gde su u antici pretežno živeli Grci?"
        odgovori:
          - {tekst: "Na jugu Balkanskog poluostrva", tacan: true}
          - {tekst: "Na severu, uz Dunav", tacan: false, zasto: "Uz Dunav su bila druga plemena, npr. Kelti Skordisci."}
          - {tekst: "Duž Rajne", tacan: false, zasto: "Iz oblasti duž Rajne potiču Kelti."}
          - {tekst: "Samo u Maloj Aziji", tacan: false, zasto: "Lekcija ih smešta pretežno na jug poluostrva."}
        pomoc:
          - "Pomisli gde je današnja Grčka."
          - "To je najjužniji deo poluostrva."
          - "Iz lekcije: Grci su pretežno na jugu poluostrva."
        objasnjenje: "Na jugu poluostrva, kod Grka, nastala je antička kultura."
        iz_udzbenika:
          strana: 12
          odeljak: "Uvod"
          tekst: "Grci su pretežno na jugu poluostrva, gde je nastala antička kultura."
      - id: l02-izbor-ostali-narodi
        vrsta: izbor
        tezina: srednje
        pojmovi: [makedonci, mezi, iliri, kelti]
        pitanje: "Koji su narodi u uvodu navedeni kao oni koji još žive u rodovsko-plemenskom uređenju? (više tačnih)"
        odgovori:
          - {tekst: "Makedonci", tacan: true}
          - {tekst: "Mezi", tacan: true}
          - {tekst: "Iliri", tacan: true}
          - {tekst: "Keltska plemena", tacan: true}
          - {tekst: "Rimljani", tacan: false, zasto: "Rimljani su osvajači koji stižu spolja, u III veku pre n. e."}
        pomoc:
          - "Svi su na Balkanu, a nisu Grci."
          - "Jedan odgovor nije tačan."
          - "Iz lekcije: Makedonci, Mezi, Iliri i keltska plemena."
        objasnjenje: "Van grčkog juga živeli su narodi još u rodovsko-plemenskom uređenju."
        iz_udzbenika:
          strana: 12
          odeljak: "Uvod"
          tekst: "Ostatak Balkana držali su Makedonci, Mezi, Iliri i keltska plemena."
      - id: l02-tn-legije
        vrsta: tacno_netacno
        tezina: lako
        pojmovi: [rimske-legije]
        tvrdnja: "Rimske legije stigle su na Balkan u III veku pre n. e."
        tacno: true
        pomoc:
          - "Seti se kada je bio Prvi ilirski rat."
          - "Iz lekcije: legije stižu u III veku pre n. e."
        objasnjenje: "Tačno: tada počinje postepeno širenje rimske vlasti."
        iz_udzbenika:
          strana: 12
          odeljak: "Uvod"
          tekst: "U III veku pre n. e. na poluostrvo stižu rimske legije."
        osa: {naziv: "Rimske legije stižu na Balkan", od: -300, do: -201, traka: dogadjaji, oznaka: "III vek pre n. e."}
