        pojmovi: [aleksandar-makedonski, kelti]
        izvor:
          autor: "Antička anegdota"
          naslov: "Čega se plaše Kelti?"
          tekst: "Aleksandar je upitao Kelte čega se najviše plaše, očekujući da će čuti da se boje njega. Oni su odgovorili da strahuju jedino da im nebo ne padne na glavu."
          napomena: "Odlomak je prepričan; udžbenik, str. 15."
        pitanje: "Šta je Aleksandar želeo da čuje?"
        odgovori:
          - {tekst: "Da se Kelti najviše boje njega", tacan: true}
          - {tekst: "Da se boje Rimljana", tacan: false, zasto: "Rim se u priči ne pojavljuje."}
          - {tekst: "Da se boje Tribala", tacan: false, zasto: "Pitanje je bilo o njemu samom."}
          - {tekst: "Da se boje Dunava", tacan: false, zasto: "U odlomku je očekivao strah od sebe."}
        pomoc:
          - "Pročitaj prvu rečenicu."
          - "Mladi vladar je ponosan."
          - "Iz lekcije: očekivao je da će čuti da se boje njega."
        objasnjenje: "Aleksandar je tražio potvrdu svoje moći, a dobio ponosan odgovor."
        iz_udzbenika:
          strana: 15
          odeljak: "Iz istorijskih izvora"
          tekst: "Aleksandar je očekivao da će čuti da se boje njega."
        osa: {naziv: "Aleksandar Makedonski protiv Tribala", od: -335, traka: dogadjaji}
      - id: l02-izvor-nebo-zasto
        vrsta: izvor
        tezina: tesko
        pojmovi: [aleksandar-makedonski, kelti]
        izvor:
          autor: "Antička anegdota"
          naslov: "Čega se plaše Kelti?"
          tekst: "Kelti, živeći daleko i nedostupno, a videći da Aleksandar ide u drugom pravcu, odgovorili su da strahuju jedino da im nebo ne padne na glavu. Proglasio ih je saveznicima i prijateljima, poslao nazad i primetio da su hvalisavci."
          napomena: "Odlomak je prepričan; udžbenik, str. 15."
        pitanje: "Zašto su Kelti mogli da daju tako smeo odgovor?"
        odgovori:
          - {tekst: "Živeli su daleko i videli da on ide u drugom pravcu, pa im nije pretila neposredna opasnost", tacan: true}
          - {tekst: "Već su pobedili Makedonce u boju", tacan: false, zasto: "U odlomku nema takvog boja."}
          - {tekst: "Nisu znali ko je Aleksandar", tacan: false, zasto: "Došli su mu kao poslanici i ponudili prijateljstvo."}
          - {tekst: "Rimljani su ih štitili", tacan: false, zasto: "Rim tada nije na Balkanu."}
        pomoc:
          - "Gde su živeli u odnosu na njega?"
          - "Kuda je on išao?"
          - "Iz lekcije: živeli su daleko i nedostupno, a on je išao u drugom pravcu."
        objasnjenje: "Smelost dolazi iz bezbednosti: daleko su i nisu mu na putu."
        iz_udzbenika:
          strana: 15
          odeljak: "Iz istorijskih izvora"
          tekst: "Kelti su živeli daleko i nedostupno, pa su odgovorili smelo."
      - id: l02-zakljuci-hvalisavci
        vrsta: zakljuci
        tezina: tesko
        pojmovi: [aleksandar-makedonski, kelti]
        pitanje: "Zašto je Aleksandar Kelte proglasio saveznicima, a ipak ih nazvao hvalisavcima?"
        odgovori:
