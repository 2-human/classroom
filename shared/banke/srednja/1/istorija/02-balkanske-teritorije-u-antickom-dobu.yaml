        ideje:
          - "Linija prolazi kroz poluostrvo."
          - "Zapad: Rim i latinska kultura."
          - "Istok: Carigrad i vizantijska kultura."
          - "Uticaj je bio trajan."
        objasnjenje: "Kulturne granice mogu da traju mnogo duže od država."
        iz_udzbenika:
          strana: 15
          odeljak: "Zapamtite"
          tekst: "Podela carstva 395. presudno je uticala na dalju istoriju Balkana."
      - id: l02-objasni-grade
        vrsta: objasni
        tezina: tesko
        pojmovi: [provincija, limes]
        pitanje: "Rimljani nisu samo osvajali, nego i gradili. Objasni kako je izgradnja pomagala da zadrže vlast."
        uzor: "Vojni logori i limes štitili su granicu i čuvali red. Putevi su povezivali oblasti, a gradovi su bili vojna, upravna i privredna središta. Rudnici i vodovodi donosili su korist i udobnost. Tako je osvojeno tlo postajalo stalni deo države."
