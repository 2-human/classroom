        tacno: false
        ispravke:
          - {tekst: "Trgovali su sa grčko-makedonskim svetom.", tacan: true}
          - {tekst: "Dodire su imala samo sa Rimljanima.", tacan: false, zasto: "Rim dolazi tek u III veku pre n. e., a trgovina sa Grcima je starija."}
          - {tekst: "Dodire su imala samo sa Keltima sa Rajne.", tacan: false, zasto: "Uvod naglašava trgovinu sa grčko-makedonskim svetom."}
        pomoc:
          - "Grčki uticaj širio se kolonijama."
          - "Iz lekcije: plemena su trgovala sa grčko-makedonskim svetom."
        objasnjenje: "Netačno: plemena su trgovala sa grčko-makedonskim svetom i pre Rima."
        iz_udzbenika:
          strana: 12
          odeljak: "Uvod"
          tekst: "Narodi u rodovsko-plemenskom uređenju trgovali su sa grčko-makedonskim svetom."
      - id: l02-dopuni-uvod
        vrsta: dopuni
        tezina: lako
        pojmovi: [grci, kolonija, rimske-legije]
        pitanje: "Dopuni rečenice."
        tekst: "Grci su širili uticaj preko brojnih {{kolonija}} duž obale {{Jadrana}}. Sve se menja kada na poluostrvo stižu {{rimske}} legije."
        ponudjene: ["kolonija", "Jadrana", "rimske", "provincija", "Rajne", "keltske"]
        pomoc:
          - "Provincije su rimske, a ne grčke."
          - "Rajna nije more."
          - "Iz lekcije: kolonije duž obale Jadrana; rimske legije."
        objasnjenje: "Kolonije šire grčki uticaj, a rimske legije menjaju odnose."
        iz_udzbenika:
          strana: 12
          odeljak: "Uvod"
          tekst: "Grčki uticaj širio se preko kolonija duž Jadrana, a sve se menja dolaskom rimskih legija."
      - id: l02-zakljuci-antika-trajanje
        vrsta: zakljuci
        tezina: tesko
        pojmovi: [antika]
        pitanje: "Antika traje od VIII veka pre n. e. do VI veka n. e. Koliko je to približno?"
        odgovori:
          - {tekst: "Oko 1300–1400 godina", tacan: true}
          - {tekst: "Oko 200 godina", tacan: false, zasto: "Samo do početka nove ere prođe oko 700–800 godina."}
          - {tekst: "Oko 600 godina", tacan: false, zasto: "Toliko traje samo deo u novoj eri; treba sabrati oba dela."}
          - {tekst: "Oko 5000 godina", tacan: false, zasto: "Toliko je trajao neolit."}
        pomoc:
          - "Korak 1: Koliko je od VIII veka pre n. e. do početka nove ere?"
          - "Korak 2: Dodaj vreme do VI veka n. e."
          - "Iz lekcije: antika traje od VIII veka pre n. e. do VI veka n. e."
        objasnjenje: "Sabiraju se dva dela: oko 700–800 godina pre nove ere i oko 500–600 posle."
        iz_udzbenika:
          strana: 12
          odeljak: "Uvod"
          tekst: "Antika traje od VIII veka pre n. e. do VI veka n. e."
        osa: {naziv: "Antika", od: -800, do: 600, traka: dogadjaji, oznaka: "VIII vek pre n. e. – VI vek n. e."}
