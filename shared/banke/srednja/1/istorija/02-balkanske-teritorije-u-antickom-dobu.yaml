        vrsta: objasni
        tezina: srednje
        pojmovi: [rimske-legije, grci, kolonija]
        pitanje: "Kako izgleda Balkan pre dolaska Rimljana i šta se menja njihovim dolaskom?"
        uzor: "Pre Rimljana na jugu su Grci sa razvijenom kulturom i kolonijama, a ostatak drže narodi u rodovsko-plemenskom uređenju, koji trguju sa grčko-makedonskim svetom. Od III veka pre n. e. rimske legije donose postepeno širenje rimske vlasti i novi način života."
        ideje:
          - "Grci na jugu, kolonije na obali."
          - "Ostali narodi u rodovsko-plemenskom uređenju."
          - "Rim donosi postepeno širenje vlasti i nov način života."
        objasnjenje: "Dolazak Rima je preokret: plemenski svet ulazi u jednu državu."
        iz_udzbenika:
          strana: 12
          odeljak: "Uvod"
          tekst: "Sve se menja kad u III veku pre n. e. na poluostrvo stižu rimske legije."
