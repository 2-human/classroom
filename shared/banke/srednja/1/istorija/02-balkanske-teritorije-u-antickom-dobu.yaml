          - "Vekovna rimska uprava."
          - "Izuzetak: južna Srbija i Makedonija."
        objasnjenje: "Romanizacija je posledica dugog života u okviru rimske države."
        iz_udzbenika:
          strana: 15
          odeljak: "Rimska osvajanja na Balkanu i romanizacija"
          tekst: "Posle nekoliko vekova rimske uprave većina starosedelaca se romanizovala."
