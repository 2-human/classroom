delovi:
  # ==========================================================================
  - naslov: "Uvod"
    zadaci:
      - id: l07-uvod-izbor-nastanak
        vrsta: izbor
        tezina: lako
        pojmovi: [bosna]
        pitanje: "Kada je u Bosni oformljena država?"
        odgovori:
          - {tekst: "Krajem XII veka", tacan: true}
          - {tekst: "Početkom IX veka", tacan: false, zasto: "Tako rano lekcija ne govori o bosanskoj državi; ona se oblikuje krajem XII veka, u doba bana Kulina."}
          - {tekst: "Sredinom XIV veka", tacan: false, zasto: "Sredina XIV veka je vreme jačanja već postojeće države; nastala je krajem XII veka."}
          - {tekst: "Godine 1463.", tacan: false, zasto: "To je godina kada je Bosna pala pod tursku vlast, dakle kraj države, a ne njen početak."}
        pomoc:
          - "Prvi vladar nezavisne Bosne počinje da vlada 1180."
          - "Traži vek pre XIII, i to njegov kraj."
          - "Iz lekcije: država u Bosni oformljena je krajem XII veka."
        objasnjenje: "Bosanska država nastaje krajem XII veka, a njen prvi nezavisni vladar je ban Kulin."
        iz_udzbenika:
          strana: 34
          odeljak: "Uvod"
          tekst: "Država se u Bosni oblikuje krajem XII veka."
        osa: {naziv: "Nastanak bosanske države", od: 1180, do: 1200, traka: dogadjaji, oznaka: "kraj XII veka"}

      - id: l07-uvod-izbor-sile
        vrsta: izbor
        tezina: lako
        pojmovi: [ugarska, vizantija, bosna]
        pitanje: "Čiji su se interesi sudarali na bosanskom prostoru? (više tačnih)"
        odgovori:
          - {tekst: "Ugarske", tacan: true}
          - {tekst: "Vizantije", tacan: true}
          - {tekst: "Turaka", tacan: false, zasto: "Turci počinju da upadaju u Bosnu tek posle Tvrtkove smrti; rano nadmetanje vode Ugarska i Vizantija."}
          - {tekst: "Dubrovnika", tacan: false, zasto: "Dubrovnik je sused i trgovac, a ne sila koja se bori za prevlast nad Bosnom; to su Ugarska i Vizantija."}
        pomoc:
          - "Jedna sila je severno od Bosne, a druga je veliko carstvo na istoku Balkana."
          - "Ban Kulin je hteo da se oslobodi vlasti baš te dve sile."
          - "Iz lekcije: u Bosni su se sudarali interesi Ugarske i Vizantije."
        objasnjenje: "Bosna je ležala između Ugarske i Vizantije, pa su se te dve sile nadmetale oko uticaja na nju."
        iz_udzbenika:
          strana: 34
          odeljak: "Uvod"
          tekst: "Na bosanskom prostoru sudarali su se interesi Ugarske i Vizantije."

      - id: l07-uvod-tn-kotromanici
        vrsta: tacno_netacno
        tezina: lako
        pojmovi: [kotromanici, turci]
        tvrdnja: "Dinastija Kotromanića držala je vlast u Bosni sve do pada države pod Turke."
        tacno: true
        pomoc:
          - "Seti se koja dinastija se pominje uz Stjepana II."
          - "Iz lekcije: Kotromanići su na vlasti do pada 1463."
        objasnjenje: "Tačno. Kotromanići vladaju Bosnom sve dok ona 1463. ne padne pod tursku vlast."
        iz_udzbenika:
          strana: 34
          odeljak: "Uvod"
          tekst: "Kotromanići su držali vlast sve do pada države pod Turke."

      - id: l07-uvod-zakljuci-polozaj
        vrsta: zakljuci
        tezina: srednje
        pojmovi: [bosna, ugarska, vizantija, ban-kulin]
        pitanje: "Bosna se nalazila između dve jake sile. Kakav je cilj zato bio najvažniji prvom nezavisnom vladaru?"
        odgovori:
          - {tekst: "Da izvuče zemlju ispod vlasti i Vizantije i Ugarske", tacan: true}
          - {tekst: "Da pokori Vizantiju i zauzme njene gradove", tacan: false, zasto: "Bosna je tada mala država koja tek stiče nezavisnost, pa joj je cilj da se oslobodi, a ne da osvaja carstvo."}
          - {tekst: "Da pozove Turke kao saveznike", tacan: false, zasto: "Turci se u lekciji pojavljuju tek posle Tvrtkove smrti, skoro dva veka kasnije."}
          - {tekst: "Da zemlju preda Ugarskoj kako bi bila sigurna", tacan: false, zasto: "Kulin je hteo suprotno: da se izvuče i iz ugarske i iz vizantijske vlasti."}
        pomoc:
          - "Korak 1: Šta želi mala zemlja između dve velike sile?"
          - "Korak 2: Kako se zove Kulin u lekciji: prvi vladar kakve Bosne?"
          - "Iz lekcije: Kulin se trudio da zemlju izvuče i iz vizantijske i iz ugarske vlasti."
        objasnjenje: "Položaj između dve sile značio je stalan pritisak, pa je put do nezavisnosti vodio kroz oslobađanje od obe."
        iz_udzbenika:
          strana: 34
          odeljak: "Bosna od XII do XIV veka"
          tekst: "Ban Kulin je nastojao da oslobodi zemlju i vizantijske i ugarske vlasti."

      - id: l07-uvod-objasni-posebnost
        vrsta: objasni
        tezina: srednje
        pojmovi: [bosna, bogumili, crkva-bosanska, vlastela]
        pitanje: "Navedi po čemu se srednjovekovna Bosna razlikovala od drugih država u okruženju i objasni svojim rečima."
        uzor: "Bosanski vladari su podržali bogumile koje su drugi progonili, pa je tamo nastala Crkva bosanska. Pored toga, presto se nije automatski nasleđivao: vlastela je birala naslednika, ali samo iz vladarske dinastije. Tako su i vera i način dolaska na vlast Bosnu činili posebnom."
        ideje:
          - "Vladari su podržali bogumile."
          - "Nastala je sopstvena Crkva bosanska."
          - "Vlastela bira naslednika prestola."
          - "Birati se može samo član vladarske dinastije."
        objasnjenje: "Dve posebnosti su verska (Crkva bosanska) i državna (izbor vladara unutar dinastije)."
        iz_udzbenika:
          strana: 35
          odeljak: "Posebnost bosanske države"
          tekst: "Presto se nije nasleđivao automatski; vlastela je birala naslednika, i to samo iz dinastije."

  # ==========================================================================
  - naslov: "Bosna od XII do XIV veka"
    zadaci:
      - id: l07-bos-izbor-kulin
        vrsta: izbor
        tezina: lako
        pojmovi: [ban-kulin, bosna]
        pitanje: "Ko je bio prvi vladar nezavisne Bosne?"
        odgovori:
          - {tekst: "Ban Kulin", tacan: true}
          - {tekst: "Tvrtko I", tacan: false, zasto: "Tvrtko I vlada mnogo kasnije (1353–1391) i dovodi Bosnu do vrhunca; prvi je bio Kulin."}
          - {tekst: "Stefan Nemanja", tacan: false, zasto: "Stefan Nemanja je vladar Srbije koji je proterao bogumile; prvi vladar Bosne je Kulin."}
          - {tekst: "Stjepan II Kotromanić", tacan: false, zasto: "Stjepan II vlada u XIV veku i širi državu; prvi nezavisni vladar je Kulin."}
        pomoc:
          - "Vladao je od 1180. do 1204."
          - "Nosio je titulu bana i primio je bogumile."
          - "Iz lekcije: ban Kulin (1180–1204) je prvi vladar nezavisne Bosne."
        objasnjenje: "Ban Kulin (1180–1204) je prvi vladar nezavisne Bosne, poznat po naklonosti prema bogumilima."
        iz_udzbenika:
          strana: 34
          odeljak: "Bosna od XII do XIV veka"
          tekst: "Ban Kulin je vladao od 1180. do 1204. i prvi je vladar nezavisne Bosne."
        osa: {naziv: "Ban Kulin", od: 1180, do: 1204, traka: vladari}

      - id: l07-bos-izbor-jeretik
        vrsta: izbor
        tezina: lako
        pojmovi: [jeretik]
        pitanje: "Šta znači reč jeretik?"
        odgovori:
          - {tekst: "Osoba koja se ne drži zvanično priznatog verskog učenja", tacan: true}
          - {tekst: "Visoki crkveni poglavar", tacan: false, zasto: "Crkveni poglavar čuva zvanično učenje; jeretik od njega odstupa."}
          - {tekst: "Vojnik u krstaškom pohodu", tacan: false, zasto: "Krstaški pohod se vodio protiv onih koje je crkva smatrala jereticima."}
          - {tekst: "Velikaš koji bira vladara", tacan: false, zasto: "Vladara u Bosni bira vlastela; jeretik je verski pojam."}
        pomoc:
          - "Pojam je verski, a ne vojni."
          - "Tako je crkva gledala na bogumile."
          - "Iz lekcije: jeretik je osoba koja se ne drži zvanično priznatog verskog učenja."
        objasnjenje: "Jeretik odstupa od učenja koje je crkva zvanično priznala, pa je hrišćanska crkva tako gledala i na bogumile."
        iz_udzbenika:
          strana: 34
          odeljak: "Bosna od XII do XIV veka"
          tekst: "Jeretik je osoba koja se ne drži zvanično priznatog verskog učenja."

      - id: l07-bos-izbor-patareni
        vrsta: izbor
        tezina: lako
        pojmovi: [patareni, bogumili]
        pitanje: "Koje je drugo ime za bogumile?"
        odgovori:
          - {tekst: "Patareni", tacan: true}
          - {tekst: "Kotromanići", tacan: false, zasto: "Kotromanići su bosanska vladarska dinastija, a ne verska zajednica."}
          - {tekst: "Krstaši", tacan: false, zasto: "Krstaški pohodi su pokretani protiv bogumila, pa to nije njihovo ime."}
          - {tekst: "Vlastela", tacan: false, zasto: "Vlastela je plemstvo koje bira vladara, a ne verska zajednica."}
        pomoc:
          - "To ime koristi i papa u svom pismu."
          - "Počinje na slovo P."
          - "Iz lekcije: bogumile su zvali i patarenima."
        objasnjenje: "Bogumili se u izvorima javljaju i pod imenom patareni, kao u pismu pape Inoćentija III."
        iz_udzbenika:
          strana: 34
          odeljak: "Bosna od XII do XIV veka"
          tekst: "Bogumili su poznati i pod imenom patareni."

      - id: l07-bos-izbor-crkva-tesko
        vrsta: izbor
        tezina: tesko
        pojmovi: [crkva-bosanska, ban-kulin, bogumili, jeretik]
        pitanje: "Koje su tvrdnje o Crkvi bosanskoj tačne? (više tačnih)"
        odgovori:
          - {tekst: "Izgradili su je bogumili kada su postali dovoljno brojni", tacan: true}
          - {tekst: "Nastala je zato što je Kulin dozvolio i pomagao rad bogumila", tacan: true}
          - {tekst: "Hrišćanska crkva ju je smatrala jeretičkom", tacan: true}
          - {tekst: "Osnovao ju je papa da bi učvrstio svoju vlast u Bosni", tacan: false, zasto: "Papa je bio protivnik bogumila i tražio je pohod protiv njih; Crkvu bosansku izgradili su sami bogumili."}
          - {tekst: "Prenesena je iz Srbije, gde je već bila zvanična crkva", tacan: false, zasto: "Iz Srbije su bogumili proterani; tek su u Bosni izgradili sopstvenu organizaciju."}
        pomoc:
          - "Ko je gradio tu organizaciju, a ko ju je osuđivao?"
          - "Razmisli da li je papa mogao da osnuje ono što smatra jeresom."
          - "Iz lekcije: uz Kulinovu podršku bogumili su izgradili Crkvu bosansku, a crkva ju je smatrala jeretičkom."
        objasnjenje: "Crkva bosanska je delo samih bogumila; omogućila ju je Kulinova podrška, a zvanična crkva ju je osuđivala kao jeres."
        iz_udzbenika:
          strana: 34
          odeljak: "Bosna od XII do XIV veka"
          tekst: "Bogumili su, uz Kulinovu pomoć, izgradili Crkvu bosansku, a hrišćanska crkva ju je smatrala jeretičkom."

      - id: l07-bos-tn-nemanja
        vrsta: tacno_netacno
        tezina: lako
        pojmovi: [stefan-nemanja, bogumili, bosna]
        tvrdnja: "Bogumili su sklonište u Bosni pronašli pošto ih je Stefan Nemanja proterao iz Srbije."
        tacno: true
        pomoc:
          - "Seti se šta je Nemanja uradio sa bogumilima u Srbiji."
          - "Iz lekcije: Nemanja ih je proterao, a utočište su našli u Bosni."
        objasnjenje: "Tačno. Progon iz Srbije doveo je bogumile u Bosnu, gde ih je Kulin prihvatio."
        iz_udzbenika:
          strana: 34
          odeljak: "Bosna od XII do XIV veka"
          tekst: "Stefan Nemanja je proterao bogumile iz Srbije, pa su sklonište našli u Bosni."

      - id: l07-bos-tn-pohodi
        vrsta: tacno_netacno
        tezina: srednje
        pojmovi: [krstaski-rat, ugarska, bogumili]
        tvrdnja: "Krstaški pohodi Ugarske uništili su bosanske bogumile."
        tacno: false
        ispravke:
          - {tekst: "Papa je pozivao ugarske vladare na pohod, ali pohodi nisu uspeli.", tacan: true}
          - {tekst: "Pohode su vodili bosanski vladari protiv Ugarske.", tacan: false, zasto: "Rimski papa je pozivao ugarske vladare da krenu protiv bosanskih bogumila, a ne obrnuto."}
          - {tekst: "Do pohoda nije ni došlo jer je papa to zabranio.", tacan: false, zasto: "Papa je upravo pozivao na pohod; pohodi su izvedeni, ali nisu uspeli."}
        pomoc:
          - "Da li su bogumili ostali u Bosni i posle poziva pape?"
          - "Lekcija kaže kako su se pohodi završili."
          - "Iz lekcije: papa je zvao Ugarsku u krstaški rat, ali pohodi nisu uspeli."
        objasnjenje: "Netačno. Pohodi protiv bogumila nisu uspeli, pa je pokret u Bosni ostao snažan."
        iz_udzbenika:
          strana: 34
          odeljak: "Bosna od XII do XIV veka"
          tekst: "Rimski papa je zvao ugarske vladare u krstaški rat protiv bosanskih bogumila, ali pohodi nisu uspeli."

      - id: l07-bos-tn-hriscani-tesko
        vrsta: tacno_netacno
        tezina: tesko
        pojmovi: [bogumili, jeretik]
        tvrdnja: "Bogumili nisu bili hrišćani, pa je zato crkva bila protiv njih."
        tacno: false
        ispravke:
          - {tekst: "Bogumili su bili hrišćani koji ne prihvataju zvanično crkveno učenje.", tacan: true}
          - {tekst: "Bogumili su bili sveštenici koji strogo slede učenje Rima.", tacan: false, zasto: "Upravo su odstupali od zvaničnog učenja, pa su smatrani jereticima."}
          - {tekst: "Crkva nije imala ništa protiv bogumila.", tacan: false, zasto: "Imala je, jer ih je smatrala jereticima, a papa je tražio pohod protiv njih."}
        pomoc:
          - "Jeretik odstupa od učenja, a ne napušta nužno veru."
          - "Šta je o bogumilima rečeno u delu Zapamtite?"
          - "Iz lekcije: bogumili su hrišćani koji ne prihvataju zvanično crkveno učenje."
        objasnjenje: "Netačno. Spor je bio unutar hrišćanstva: bogumili jesu hrišćani, ali bez prihvatanja zvaničnog učenja."
        iz_udzbenika:
          strana: 35
          odeljak: "Zapamtite"
          tekst: "Bogumili su hrišćani koji ne prihvataju zvanično crkveno učenje."

      - id: l07-bos-dopuni-bogumili
        vrsta: dopuni
        tezina: lako
        pojmovi: [stefan-nemanja, ban-kulin, bogumili, crkva-bosanska]
        pitanje: "Dopuni rečenice o bogumilima."
        tekst: "Bogumile je iz Srbije proterao {{Stefan Nemanja}}. U Bosni ih je primio ban {{Kulin}}, a oni su izgradili {{Crkvu bosansku}}."
        ponudjene: [Stefan Nemanja, Kulin, Crkvu bosansku, Tvrtko, Mileševu]
        pomoc:
          - "Tvrtko vlada tek u XIV veku."
          - "Mileševa je manastir u kome se Tvrtko krunisao."
          - "Iz lekcije: Nemanja ih proteruje, Kulin prima, a oni grade Crkvu bosansku."
        objasnjenje: "Niz je: progon iz Srbije, prihvat u Bosni i sopstvena crkvena organizacija."
        iz_udzbenika:
          strana: 34
          odeljak: "Bosna od XII do XIV veka"
          tekst: "Nemanja je proterao bogumile, Kulin ih je primio, a oni su izgradili Crkvu bosansku."

      - id: l07-bos-dopuni-papa
        vrsta: dopuni
        tezina: srednje
        pojmovi: [papa-inocentije-iii, krstaski-rat, ugarska, patareni]
        pitanje: "Dopuni rečenicu o reakciji crkve."
        tekst: "Rimski {{papa}} je zvao vladare {{Ugarske}} u {{krstaški}} rat protiv bosanskih bogumila, koje su zvali i {{patarenima}}."
        ponudjene: [papa, Ugarske, krstaški, patarenima, Vizantije, građanski, Kotromanićima]
        pomoc:
          - "Ko je u Rimu bio na čelu crkve?"
          - "Pozvani su vladari severnih suseda Bosne."
          - "Iz lekcije: papa je zvao ugarske vladare u krstaški rat protiv bogumila (patarena)."
        objasnjenje: "Papa je u borbi protiv jeresi računao na vojsku susedne Ugarske."
        iz_udzbenika:
          strana: 34
          odeljak: "Bosna od XII do XIV veka"
          tekst: "Rimski papa je pozivao ugarske vladare u krstaški rat protiv bosanskih bogumila."

      - id: l07-bos-povezi-pojmovi
        vrsta: povezi
        tezina: lako
        pojmovi: [bogumili, ban-kulin, jeretik, papa-inocentije-iii]
        pitanje: "Poveži pojam ili ličnost sa objašnjenjem."
        parovi:
          - ["bogumili", "Hrišćani koji ne prihvataju zvanično crkveno učenje"]
          - ["ban Kulin", "Prvi vladar nezavisne Bosne"]
          - ["jeretik", "Ko se ne drži zvanično priznatog verskog učenja"]
          - ["Inoćentije III", "Papa koji traži od ugarskog kralja da uništi bogumile"]
        pomoc:
          - "Jedan od pojmova je ime verske zajednice, a drugi opšti verski pojam."
          - "Kulin je vladar, a Inoćentije crkveni poglavar."
          - "Iz lekcije: bogumili ne prihvataju zvanično učenje; Kulin je prvi vladar nezavisne Bosne."
        objasnjenje: "Ova četiri pojma čine priču o bogumilima: zajednica, njen zaštitnik, oznaka koju joj daje crkva i njen protivnik."
        iz_udzbenika:
          strana: 34
          odeljak: "Bosna od XII do XIV veka"
          tekst: "Lekcija objašnjava bogumile, jeretike, bana Kulina, a papu Inoćentija III uvodi kroz izvor."

      - id: l07-bos-zakljuci-zasto-bosna
        vrsta: zakljuci
        tezina: lako
        pojmovi: [bogumili, ban-kulin, stefan-nemanja]
        pitanje: "Zašto su proterani bogumili otišli baš u Bosnu?"
        odgovori:
          - {tekst: "Tamo im je ban Kulin dozvolio da dođu i pomagao im", tacan: true}
          - {tekst: "Papa im je dao Bosnu na upravu", tacan: false, zasto: "Papa je bio njihov protivnik; utočište im je dao Kulin."}
          - {tekst: "Nemanja im je naredio da idu u Bosnu", tacan: false, zasto: "Nemanja ih je samo proterao iz Srbije; Bosnu je otvorio Kulin."}
          - {tekst: "Bosna je tada bila pod Turcima", tacan: false, zasto: "Turci su u Bosni tek mnogo kasnije; Bosna je tada imala svog vladara, Kulina."}
        pomoc:
          - "Korak 1: Ko je tada vladao Bosnom?"
          - "Korak 2: Kakav je bio njegov stav prema bogumilima?"
          - "Iz lekcije: Kulin im je dozvolio da dođu i pomagao njihovo delovanje."
        objasnjenje: "Progonjena zajednica odlazi tamo gde je vladar prima, a to je bila Kulinova Bosna."
        iz_udzbenika:
          strana: 34
          odeljak: "Bosna od XII do XIV veka"
          tekst: "Kulin je dozvolio bogumilima da dođu i pomagao njihovo delovanje."

      - id: l07-bos-zakljuci-pohod
        vrsta: zakljuci
        tezina: srednje
        pojmovi: [papa-inocentije-iii, ugarska, krstaski-rat]
        pitanje: "Zašto se papa za pohod protiv bogumila obraćao baš Ugarskoj?"
        odgovori:
          - {tekst: "Ugarska je bila moćan sused Bosne, a i sama je strahovala da će se jeres preliti na nju", tacan: true}
          - {tekst: "Ugarska je bila vlast koju je Kulin priznao kao svog cara", tacan: false, zasto: "Kulin je hteo da se izvuče iz ugarske vlasti, a ne da je prizna."}
          - {tekst: "U Ugarskoj je sedište pape", tacan: false, zasto: "Sedište pape je Rim; Ugarska je pozvana kao sila u susedstvu Bosne."}
          - {tekst: "Ugarski kralj je i sam bio bogumil", tacan: false, zasto: "Papa ga upravo poziva da uništi bogumile, pa bogumil nije mogao biti."}
        pomoc:
          - "Korak 1: Gde se Ugarska nalazi u odnosu na Bosnu?"
          - "Korak 2: Čega se papa boji u svom pismu?"
          - "Iz lekcije: papa se boji da se jeres iz susedstva ne prelije na Ugarsku."
        objasnjenje: "Ugarska je imala i snagu i razlog: bila je sused, a papa je tvrdio da je i njoj jeres opasna."
        iz_udzbenika:
          strana: 35
          odeljak: "Iz istorijskih izvora: Pismo pape o bogumilima"
          tekst: "Papa strahuje da se jeres iz susedstva ne prelije na Ugarsku i poziva kralja da se spremi za oružanu akciju."

      - id: l07-bos-zakljuci-kulin-rizik
        vrsta: zakljuci
        tezina: tesko
        pojmovi: [ban-kulin, bogumili, papa-inocentije-iii, ugarska]
        pitanje: "Kakvu je opasnost za Bosnu nosila Kulinova podrška bogumilima?"
        odgovori:
          - {tekst: "Davala je papi i Ugarskoj povod za oružani napad na zemlju", tacan: true}
          - {tekst: "Dovela je do toga da Turci odmah zauzmu Bosnu", tacan: false, zasto: "Turci stižu tek posle Tvrtkove smrti, a Bosna pada 1463; Kulinova opasnost dolazila je od pape i Ugarske."}
          - {tekst: "Zbog nje je Vizantija uvela Crkvu bosansku u svoje carstvo", tacan: false, zasto: "Lekcija tako nešto ne kaže; reakcija je stigla iz Rima, preko Ugarske."}
          - {tekst: "Nije nosila nikakvu opasnost jer je crkva to podržala", tacan: false, zasto: "Crkva je organizaciju bogumila smatrala jeretičkom, a papa je tražio krstaški rat."}
        pomoc:
          - "Korak 1: Kako je crkva gledala na bogumile?"
          - "Korak 2: Koju je akciju papa tražio i od koga?"
          - "Iz lekcije: papa je pozivao ugarske vladare u krstaški rat protiv bosanskih bogumila."
        objasnjenje: "Zaštita jeretika bila je politički rizična: Ugarska, od koje je Kulin želeo da se oslobodi, dobijala je versko opravdanje za rat."
        iz_udzbenika:
          strana: 34
          odeljak: "Bosna od XII do XIV veka"
          tekst: "Crkva je Kulinove štićenike smatrala jereticima, pa je papa zvao Ugarsku u rat protiv njih."

      - id: l07-bos-datum-kulin
        vrsta: datum
        tezina: srednje
        pojmovi: [ban-kulin]
        dogadjaj: "Ban Kulin"
        pitanje: "Od koje do koje godine je vladao ban Kulin?"
        od: 1180
        do: 1204
        traka: vladari
        pomoc:
          - "Počeo je krajem XII veka, a završio na početku XIII veka."
          - "Vladao je oko dvadeset i pet godina."
          - "Iz lekcije: ban Kulin (1180–1204)."
        objasnjenje: "Ban Kulin je vladao od 1180. do 1204. godine."
        iz_udzbenika:
          strana: 34
          odeljak: "Bosna od XII do XIV veka"
          tekst: "Ban Kulin je vladao od 1180. do 1204."

      - id: l07-bos-poredjaj-bogumili
        vrsta: poredjaj
        tezina: lako
        pojmovi: [bogumili, stefan-nemanja, ban-kulin, crkva-bosanska]
        pitanje: "Poređaj šta se dešavalo sa bogumilima, od prvog koraka do poslednjeg."
        stavke:
          - {tekst: "Stefan Nemanja proteruje bogumile iz Srbije"}
          - {tekst: "Bogumili nalaze utočište kod bana Kulina"}
          - {tekst: "Bogumili grade Crkvu bosansku"}
          - {tekst: "Papa zove Ugarsku u krstaški rat"}
        pomoc:
          - "Pre svega moraju da napuste Srbiju."
          - "Papa reaguje tek kada je pokret u Bosni već jak."
          - "Iz lekcije: progon → utočište → Crkva bosanska → poziv na krstaški rat."
        objasnjenje: "Svaki korak vodi sledećem: progon, prihvat, jačanje zajednice i reakcija crkve."
        iz_udzbenika:
          strana: 34
          odeljak: "Bosna od XII do XIV veka"
          tekst: "Bogumili iz Srbije prelaze u Bosnu, grade svoju crkvu, a papa traži pohod protiv njih."

      - id: l07-bos-lanac-crkva
        vrsta: lanac
        tezina: lako
        pojmovi: [ban-kulin, bogumili, crkva-bosanska]
        karike:
          - "Kulin pomaže delovanje bogumila"
          - "?"
          - "Nastaje Crkva bosanska"
        praznina: 1
        odgovori:
          - {tekst: "Bogumili postaju veoma brojni", tacan: true}
          - {tekst: "Bogumili napuštaju Bosnu", tacan: false, zasto: "Ostali su i ojačali; iz Srbije su otišli, a u Bosni su ostali."}
          - {tekst: "Turci osvajaju Bosnu", tacan: false, zasto: "To se dešava tek 1463, a Crkva bosanska nastaje mnogo ranije."}
        pomoc:
          - "Šta je potrebno jednoj zajednici da izgradi sopstvenu organizaciju?"
          - "Razmisli o broju pripadnika."
          - "Iz lekcije: postali su toliko brojni da su izgradili sopstvenu versku organizaciju."
        objasnjenje: "Podrška vladara uvećala je zajednicu, a brojnost joj je omogućila da stvori sopstvenu crkvu."
        iz_udzbenika:
          strana: 34
          odeljak: "Bosna od XII do XIV veka"
          tekst: "Uz Kulinovu podršku bogumili su postali toliko brojni da su izgradili Crkvu bosansku."

      - id: l07-bos-lanac-pohod
        vrsta: lanac
        tezina: srednje
        pojmovi: [bogumili, papa-inocentije-iii, krstaski-rat, ugarska]
        karike:
          - "Bogumili jačaju u Bosni"
          - "Crkva to vidi kao jeres"
          - "?"
          - "Pohodi ne uspevaju"
        praznina: 2
        odgovori:
          - {tekst: "Papa traži od Ugarske krstaški rat", tacan: true}
          - {tekst: "Papa priznaje Crkvu bosansku", tacan: false, zasto: "Papa je smatra jeretičkom i traži njeno uništenje."}
          - {tekst: "Nemanja kreće na Bosnu", tacan: false, zasto: "Nemanja je proterao bogumile iz Srbije; pohod je papa tražio od Ugarske."}
        pomoc:
          - "Šta sledi posle osude jeresi?"
          - "O kakvim pohodima je reč i ko ih pokreće?"
          - "Iz lekcije: papa je zvao ugarske vladare u krstaški rat, ali pohodi nisu uspeli."
        objasnjenje: "Crkva je na jačanje jeresi odgovorila pozivom na oružje, ali je pokret u Bosni opstao."
        iz_udzbenika:
          strana: 34
          odeljak: "Bosna od XII do XIV veka"
          tekst: "Jačanje bogumila podstaklo je papu da traži krstaški rat, ali pohodi nisu uspeli."

      - id: l07-bos-izvor-sta-trazi
        vrsta: izvor
        tezina: lako
        pojmovi: [papa-inocentije-iii, ugarska, bogumili]
        izvor:
          autor: "Papa Inoćentije III"
          naslov: "Pismo ugarskom kralju o bogumilima"
          tekst: "Papa javlja kralju da je splitski nadbiskup isterao mnoge patarene iz Splita i Trogira, a da im je bosanski ban Kulin dao utočište. Podstiče kralja da se pripremi za oružanu akciju."
          napomena: "Odlomak je prepričan; udžbenik, str. 35."
        pitanje: "Šta papa traži od ugarskog kralja?"
        odgovori:
          - {tekst: "Da se pripremi za oružanu akciju protiv patarena", tacan: true}
          - {tekst: "Da pošalje poslanike Kulinu i sklopi mir", tacan: false, zasto: "Papa ne traži mir nego oružanu akciju."}
          - {tekst: "Da primi patarene u Ugarsku", tacan: false, zasto: "Papa se upravo boji da jeres ne pređe u Ugarsku."}
          - {tekst: "Da postavi novog splitskog nadbiskupa", tacan: false, zasto: "Nadbiskup se u pismu spominje samo kao onaj koji je proterao patarene."}
        pomoc:
          - "Pročitaj poslednju rečenicu odlomka."
          - "Papa govori jezikom rata, a ne pregovora."
          - "Iz lekcije: papa nalaže ugarskom kralju da uništi bosanske bogumile."
        objasnjenje: "Pismo je poziv na oružje: papa želi da kralj silom reši pitanje bogumila u Bosni."
        iz_udzbenika:
          strana: 35
          odeljak: "Iz istorijskih izvora: Pismo pape o bogumilima"
          tekst: "Papa Inoćentije III nalaže ugarskom kralju da uništi bosanske bogumile."

      - id: l07-bos-izvor-kulin
        vrsta: izvor
        tezina: srednje
        pojmovi: [ban-kulin, patareni, papa-inocentije-iii]
        izvor:
          autor: "Papa Inoćentije III"
          naslov: "Pismo ugarskom kralju o bogumilima"
          tekst: "Ban Kulin je, kaže papa, patarenima pružio utočište i zaštitu, primio ih kao da su katolici i javno ih nazivao hrišćanima."
          napomena: "Odlomak je prepričan; udžbenik, str. 35."
        pitanje: "Šta papi najviše smeta u Kulinovom ponašanju?"
        odgovori:
          - {tekst: "Što ljude koje crkva smatra jereticima štiti i javno priznaje kao hrišćane", tacan: true}
          - {tekst: "Što je Kulin proterao patarene iz Bosne", tacan: false, zasto: "Kulin ih je primio; proterao ih je splitski nadbiskup."}
          - {tekst: "Što Kulin ratuje protiv Ugarske", tacan: false, zasto: "O tome odlomak ne govori; zamerka je verska, zbog zaštite patarena."}
          - {tekst: "Što Kulin ne plaća porez papi", tacan: false, zasto: "Odlomak ne govori o porezu; papu ljuti zaštita patarena."}
        pomoc:
          - "Podvuci šta je Kulin uradio sa patarenima."
          - "Šta za papu znači kada neko jeretika nazove hrišćaninom?"
          - "Iz lekcije: Kulin im je dao utočište, primio ih kao katolike i nazivao hrišćanima."
        objasnjenje: "Za papu su patareni jeretici, pa je Kulinovo javno priznanje za njega bilo veći greh od samog prihvata."
        iz_udzbenika:
          strana: 35
          odeljak: "Iz istorijskih izvora: Pismo pape o bogumilima"
          tekst: "Kulin je patarenima dao utočište i zaštitu, primio ih kao katolike i javno ih nazivao hrišćanima."

      - id: l07-bos-izvor-bolest
        vrsta: izvor
        tezina: srednje
        pojmovi: [jeretik, papa-inocentije-iii, ugarska]
        izvor:
          autor: "Papa Inoćentije III"
          naslov: "Pismo ugarskom kralju o bogumilima"
          tekst: "Papa jeres naziva bolešću i boji se da se ona iz susedstva ne prelije na Ugarsku."
          napomena: "Odlomak je prepričan; udžbenik, str. 35."
        pitanje: "Zašto papa jeres upoređuje sa bolešću?"
        odgovori:
          - {tekst: "Jer je vidi kao nešto što se širi sa jedne zemlje na drugu ako se ne zaustavi", tacan: true}
          - {tekst: "Jer su bogumili bili lekari", tacan: false, zasto: "Lekcija to ne kaže; reč bolest je ovde slika za širenje učenja."}
          - {tekst: "Jer je u Bosni tada vladala zarazna bolest", tacan: false, zasto: "Papa govori o verskom učenju, a ne o stvarnoj bolesti."}
          - {tekst: "Jer želi da pomogne bogumilima da ozdrave", tacan: false, zasto: "Papa traži oružanu akciju protiv njih, a ne pomoć."}
        pomoc:
          - "Šta bolest radi ako se ne leči?"
          - "Čega se papa boji za Ugarsku?"
          - "Iz lekcije: boji se da se „bolest” jeresi ne prelije iz susedstva na Ugarsku."
        objasnjenje: "Slika bolesti opravdava hitnost: kao zaraza, jeres se navodno širi na susede, pa je treba zaustaviti silom."
        iz_udzbenika:
          strana: 35
          odeljak: "Iz istorijskih izvora: Pismo pape o bogumilima"
          tekst: "Papa se boji da se „bolest” jeresi ne prelije iz susedstva na Ugarsku."

      - id: l07-bos-izvor-pristrasnost
        vrsta: izvor
        tezina: tesko
        pojmovi: [papa-inocentije-iii, bogumili, ban-kulin]
        izvor:
          autor: "Papa Inoćentije III"
          naslov: "Pismo ugarskom kralju o bogumilima"
          tekst: "Papa kralja podstiče da se spremi za oružanu akciju i da osveti, kako kaže, uvredu nanetu Hristu i hrišćanima."
          napomena: "Odlomak je prepričan; udžbenik, str. 35."
        pitanje: "Šta istoričar mora da ima na umu kada iz ovog pisma uči o bogumilima?"
        odgovori:
          - {tekst: "Pismo je napisao njihov protivnik, pa ih prikazuje iz ugla onoga ko hoće da ih uništi", tacan: true}
          - {tekst: "Pismo su napisali sami bogumili, pa je sve u njemu nesumnjivo tačno", tacan: false, zasto: "Pisac je papa, njihov protivnik, a ne bogumili."}
          - {tekst: "Pismo je nevažno jer ne govori ništa o Bosni", tacan: false, zasto: "Pismo govori o Kulinu i patarenima, pa je važan izvor, ali iz jednog ugla."}
          - {tekst: "Pismo je napisao ban Kulin da bi se odbranio", tacan: false, zasto: "Pismo je uputio papa ugarskom kralju."}
        pomoc:
          - "Ko je pisac i kome piše?"
          - "Šta on želi da postigne ovim pismom?"
          - "Iz lekcije: papa ugarskom kralju nalaže da uništi bosanske bogumile."
        objasnjenje: "Izvor je dragocen, ali pristrasan: papa nastoji da ubedi kralja na rat, pa bogumile opisuje kao bolest i uvredu."
        iz_udzbenika:
          strana: 35
          odeljak: "Iz istorijskih izvora: Pismo pape o bogumilima"
          tekst: "Papa podstiče kralja da se spremi i osveti, kako kaže, uvredu nanetu Hristu i hrišćanima."

      - id: l07-bos-uporedi-kulin-nemanja
        vrsta: uporedi
        tezina: srednje
        pojmovi: [ban-kulin, stefan-nemanja, bogumili]
        a: "Ban Kulin"
        b: "Stefan Nemanja"
        pitanje: "Na koga se odnosi tvrdnja: Kulina, Nemanju, obojicu ili nijednog?"
        tvrdnje:
          - {tekst: "Proterao je bogumile iz svoje zemlje.", odgovor: b, zasto: "Nemanja ih je proterao iz Srbije; Kulin ih je primio."}
          - {tekst: "Dozvolio je bogumilima da dođu i pomagao im.", odgovor: a, zasto: "To je Kulin u Bosni, a Nemanja je postupio suprotno."}
          - {tekst: "Bio je vladar u vreme kada su bogumili bili važno pitanje.", odgovor: oba, zasto: "Obojica su morala da zauzmu stav prema bogumilima, ali su zauzeli suprotne stavove."}
          - {tekst: "Papa ga u pismu optužuje da je patarene javno nazivao hrišćanima.", odgovor: a, zasto: "To papa piše za Kulina."}
          - {tekst: "Krunisao se u Mileševi za kralja Srba i Bosne.", odgovor: nijedan, zasto: "To je uradio Tvrtko I, 1377."}
        pomoc:
          - "Jedan vladar proteruje, drugi prima."
          - "Krunisanje u Mileševi je iz XIV veka."
          - "Iz lekcije: Nemanja proteruje bogumile, Kulin ih prima."
        objasnjenje: "Isti verski pokret dva suseda su rešavala suprotno: Nemanja progonom, a Kulin zaštitom."
        iz_udzbenika:
          strana: 34
          odeljak: "Bosna od XII do XIV veka"
          tekst: "Nemanja je proterao bogumile iz Srbije, a Kulin ih je primio u Bosnu."

      - id: l07-bos-uporedi-bogumili-crkva
        vrsta: uporedi
        tezina: lako
        pojmovi: [bogumili, crkva-bosanska, papa-inocentije-iii]
        a: "Bogumili"
        b: "Rimski papa"
        pitanje: "Na koga se odnosi tvrdnja: bogumile, papu, oba ili nijednog?"
        tvrdnje:
          - {tekst: "Ne prihvataju zvanično crkveno učenje.", odgovor: a, zasto: "To je odlika bogumila; papa je čuvar zvaničnog učenja."}
          - {tekst: "Poziva ugarske vladare u krstaški rat.", odgovor: b, zasto: "Papa poziva na rat, a bogumili su njegova meta."}
          - {tekst: "Smatraju sebe hrišćanima.", odgovor: oba, zasto: "Bogumili su hrišćani koji ne prihvataju zvanično učenje, a papa je poglavar crkve u Rimu."}
          - {tekst: "Izgradili su Crkvu bosansku.", odgovor: a, zasto: "To su uradili bogumili, uz Kulinovu podršku."}
          - {tekst: "Proterali su Kulina iz Bosne.", odgovor: nijedan, zasto: "Niko ga nije proterao; lekcija kaže da su pohodi protiv Bosne propali."}
        pomoc:
          - "Ko je progonjen, a ko progoni?"
          - "Jedna tvrdnja važi za obe strane."
          - "Iz lekcije: bogumili su hrišćani bez prihvatanja zvaničnog učenja; papa zove na krstaški rat."
        objasnjenje: "Sukob je vođen unutar hrišćanstva: obe strane su hrišćanske, ali se spore oko učenja."
        iz_udzbenika:
          strana: 35
          odeljak: "Zapamtite"
          tekst: "Bogumili su hrišćani koji ne prihvataju zvanično crkveno učenje."

      - id: l07-bos-ko-sam-kulin
        vrsta: ko_sam
        tezina: lako
        pojmovi: [ban-kulin, bogumili]
        tragovi:
          - "Vladao sam krajem XII i početkom XIII veka."
          - "Pokušao sam da Bosnu izvučem ispod vizantijske i ugarske vlasti."
          - "Primio sam bogumile proterane iz Srbije."
        odgovori:
          - {tekst: "Ban Kulin", tacan: true}
          - {tekst: "Stefan Nemanja", tacan: false, zasto: "Nemanja je bogumile proterao, a ne primio."}
          - {tekst: "Tvrtko I", tacan: false, zasto: "Tvrtko I vlada u XIV veku."}
          - {tekst: "Stjepan II Kotromanić", tacan: false, zasto: "Stjepan II vlada 1322–1353. i osvaja Hum."}
        objasnjenje: "To je ban Kulin (1180–1204), prvi vladar nezavisne Bosne."
        iz_udzbenika:
          strana: 34
          odeljak: "Bosna od XII do XIV veka"
          tekst: "Ban Kulin je prvi vladar nezavisne Bosne i pomagao je bogumile."

      - id: l07-bos-objasni-kulin
        vrsta: objasni
        tezina: lako
        pojmovi: [ban-kulin, bogumili, crkva-bosanska]
        pitanje: "Kako se ban Kulin odnosio prema bogumilima i šta je iz toga proisteklo?"
        uzor: "Kulin je bogumilima proteranim iz Srbije dozvolio da dođu u Bosnu i pomagao njihov rad. Zbog toga su postali veoma brojni i izgradili sopstvenu Crkvu bosansku. Crkva ih je smatrala jereticima, pa je papa zvao Ugarsku u krstaški rat, koji nije uspeo."
        ideje:
          - "Kulin ih je primio i pomagao."
          - "Postali su brojni i izgradili Crkvu bosansku."
          - "Papa je zbog toga zvao na krstaški rat."
        objasnjenje: "Vladarska zaštita stvorila je jak verski pokret, ali i sukob sa papom."
        iz_udzbenika:
          strana: 34
          odeljak: "Bosna od XII do XIV veka"
          tekst: "Kulin je primio bogumile i pomagao ih, pa su izgradili Crkvu bosansku."

      - id: l07-bos-objasni-jeres
        vrsta: objasni
        tezina: tesko
        pojmovi: [bogumili, jeretik, papa-inocentije-iii, krstaski-rat]
        pitanje: "Zašto je versko pitanje u Bosni preraslo u pitanje rata? Objasni oslanjajući se na papino pismo."
        uzor: "Bogumile je crkva smatrala jereticima, a Kulin ih je štitio i javno zvao hrišćanima. Papa se bojao da se učenje ne proširi na Ugarsku, pa je kralja podsticao na oružanu akciju. Tako je spor o veri postao poziv na krstaški rat, a susedi su dobili razlog za napad."
        ideje:
          - "Crkva bogumile smatra jereticima."
          - "Kulin ih štiti, što papu ljuti."
          - "Papa se boji širenja na Ugarsku."
          - "Rešenje vidi u oružanoj akciji."
        objasnjenje: "U srednjem veku vera i politika nisu bile odvojene, pa je jeres mogla da bude povod za rat."
        iz_udzbenika:
          strana: 35
          odeljak: "Iz istorijskih izvora: Pismo pape o bogumilima"
          tekst: "Papa strahuje od širenja jeresi na Ugarsku i traži oružanu akciju."

