# Banka pitanja: Pad balkanskih zemalja pod osmanlijsku vlast (istorija, 1. razred srednje škole, str. 48–49). Sopstvenim rečima, po belešci lekcije.
lekcija: 12
naslov: "Pad balkanskih zemalja pod osmanlijsku vlast"
pojmovi:
  osmanlije: Osmanlije
  osmansko-carstvo: Osmansko carstvo
  murat: sultan Murat
  kosovski-boj: Kosovski boj
  mehmed-ii-osvajac: Mehmed II Osvajač
  vizantija: Vizantija
  carigrad: Carigrad
  srpska-despotovina: Srpska despotovina
  bosna: Bosna
  hercegovina: Hercegovina
  zeta: Zeta
  albanija: Albanija
  grcka: Grčka
  ugarska: Ugarska
  mletacka-republika: Mletačka republika
  dubrovacka-republika: Dubrovačka republika
  janicari: janičari
  novo-brdo: Novo Brdo
  konstantin-mihailovic: Konstantin Mihailović iz Ostrovice
  uspomene-janicara: Uspomene janičara
  bugarska: Bugarska
delovi:
  # ==========================================================================
  - naslov: "Pad Srbije, Bosne, Hercegovine i Zete"
    zadaci:
      - id: l12-carigrad-izbor-ko
        vrsta: izbor
        tezina: lako
        pojmovi: [mehmed-ii-osvajac, carigrad]
        pitanje: "Koji sultan je zauzeo Carigrad?"
        odgovori:
          - {tekst: "Mehmed II Osvajač", tacan: true}
          - {tekst: "Murat", tacan: false, zasto: "Murat je umro na Kosovu 1389, a Carigrad pada tek 1453."}
          - {tekst: "Stefan Tomašević", tacan: false, zasto: "On je poslednji bosanski vladar, a ne sultan."}
          - {tekst: "Žigmund", tacan: false, zasto: "Žigmund je ugarski kralj; Carigrad osvaja osmanlijski sultan Mehmed II."}
        pomoc:
          - "Nadimak ovog sultana govori o tome šta je radio."
          - "Vlada od 1451. do 1481."
          - "Iz lekcije: Mehmed II Osvajač 1453. zauzima Carigrad."
        objasnjenje: "Mehmed II Osvajač 1453. zauzima Carigrad i time uništava Vizantiju."
        iz_udzbenika: {strana: 48, odeljak: "Pad Srbije, Bosne, Hercegovine i Zete", tekst: "Sultan Mehmed II Osvajač 1453. zauzima Carigrad i time uništava Vizantiju."}
        osa: {naziv: "Pad Carigrada", od: 1453, traka: dogadjaji}

      - id: l12-dubrovnik-izbor-sloboda
        vrsta: izbor
        tezina: lako
        pojmovi: [dubrovacka-republika]
        pitanje: "Koja država na Balkanu je sačuvala slobodu?"
        odgovori:
          - {tekst: "Dubrovačka republika", tacan: true}
          - {tekst: "Bosna", tacan: false, zasto: "Bosna je osvojena 1463."}
          - {tekst: "Zeta", tacan: false, zasto: "Zeta je pala pod Turke 1499, kao poslednja srpska oblast."}
          - {tekst: "Grčka", tacan: false, zasto: "Turci su osvojili i Grčku i Albaniju."}
        pomoc:
          - "To je republika, ne kraljevina."
          - "Njeni trgovci su poslovali po Despotovini."
          - "Iz lekcije: jedina država koja je sačuvala slobodu bila je Dubrovačka republika."
        objasnjenje: "Dubrovačka republika je jedini izuzetak: formalno pod sultanom, ali u suštini slobodna."
        iz_udzbenika: {strana: 48, odeljak: "Uvod", tekst: "Jedina država koja je sačuvala slobodu bila je Dubrovačka republika."}

      - id: l12-pravac-izbor-sledeci
        vrsta: izbor
        tezina: srednje
        pojmovi: [ugarska, mletacka-republika]
        pitanje: "Koje dve države se posle pokoravanja Balkana nalaze neposredno na pravcu daljeg širenja Osmanskog carstva?"
        odgovori:
          - {tekst: "Kraljevina Ugarska i Mletačka republika", tacan: true}
          - {tekst: "Bosna i Hercegovina", tacan: false, zasto: "One su već osvojene, 1463. i 1482."}
          - {tekst: "Albanija i Grčka", tacan: false, zasto: "I one su osvojene; pod udarom su sada države iza njih."}
          - {tekst: "Bugarska i Vizantija", tacan: false, zasto: "Bugarska carstva su zauzeta ranije, a Vizantija je uništena 1453."}
        pomoc:
          - "Traži države koje još nisu osvojene."
          - "Jedna je kraljevina, druga republika."
          - "Iz lekcije: Ugarska i Mletačka republika su na pravcu širenja."
        objasnjenje: "Pošto je Balkan pokoren, na redu su susedi: Ugarska i Mletačka republika."
        iz_udzbenika: {strana: 48, odeljak: "Pad Srbije, Bosne, Hercegovine i Zete", tekst: "Kraljevina Ugarska i Mletačka republika nalaze se na pravcu daljeg širenja Osmanskog carstva."}

      - id: l12-zastoj-izbor-uzrok
        vrsta: izbor
        tezina: srednje
        pojmovi: [osmanlije, murat, osmansko-carstvo]
        pitanje: "Šta je privremeno zaustavilo tursko širenje?"
        odgovori:
          - {tekst: "Dinastičke borbe pretendenata na turski presto", tacan: true}
          - {tekst: "Poraz od Ugarske i Mletaka", tacan: false, zasto: "Širenje zaustavljaju unutrašnji sukobi, a ne spoljni poraz."}
          - {tekst: "Mirovni ugovor sa Dubrovnikom", tacan: false, zasto: "Dubrovnik se potčinjava mnogo kasnije, 1526."}
          - {tekst: "Nedostatak janičara", tacan: false, zasto: "Lekcija zastoj objašnjava borbama oko prestola, a ne manjkom vojske."}
        pomoc:
          - "Uzrok je unutar same turske države."
          - "Počinje posle smrti sultana na Kosovu."
          - "Iz lekcije: širenje privremeno zaustavljaju dinastičke borbe."
        objasnjenje: "Posle Muratove smrti 1389. pretendenti se bore za presto, pa osvajanja staju."
        iz_udzbenika: {strana: 49, odeljak: "Zapamtite", tekst: "Dalje širenje privremeno zaustavljaju dinastičke borbe unutar Osmanskog carstva."}

      - id: l12-bosna-izbor-gradjanski
        vrsta: izbor
        tezina: srednje
        pojmovi: [bosna, osmanlije]
        pitanje: "U kakvom stanju je bila Bosna kad je osvojena 1463?"
        odgovori:
          - {tekst: "Zahvaćena građanskim ratom", tacan: true}
          - {tekst: "U zlatnom dobu pod Tvrtkom I", tacan: false, zasto: "Tvrtko je umro 1391, a Bosna je potom slabila."}
          - {tekst: "U savezu sa Vizantijom", tacan: false, zasto: "Vizantija je već uništena 1453."}
          - {tekst: "Pod upravom Dubrovnika", tacan: false, zasto: "Dubrovnik nije upravljao Bosnom; zemlju razdire građanski rat."}
        pomoc:
          - "Seti se slabljenja vlasti iz prethodne lekcije."
          - "Sukob je unutar same zemlje."
          - "Iz lekcije: Bosna, zahvaćena građanskim ratom, osvojena je 1463."
        objasnjenje: "Građanski rat je Bosnu učinio lakšim plenom."
        iz_udzbenika: {strana: 48, odeljak: "Pad Srbije, Bosne, Hercegovine i Zete", tekst: "Bosna, zahvaćena građanskim ratom, osvojena je 1463."}
        osa: {naziv: "Pad Bosne", od: 1463, traka: dogadjaji}

      - id: l12-mehmed-izbor-posle
        vrsta: izbor
        tezina: tesko
        pojmovi: [mehmed-ii-osvajac, hercegovina, zeta]
        pitanje: "Mehmed II vlada do 1481. Koji padovi su se, sudeći po godinama, desili posle kraja njegove vladavine?"
        odgovori:
          - {tekst: "Pad Hercegovine i pad Zete", tacan: true}
          - {tekst: "Pad Carigrada i pad Smedereva", tacan: false, zasto: "To je 1453. i 1459, usred njegove vladavine."}
          - {tekst: "Pad Bosne", tacan: false, zasto: "Bosna pada 1463, dok on još vlada."}
          - {tekst: "Pad Novog Brda", tacan: false, zasto: "Novo Brdo pada 1455, a sam sultan ga zauzima."}
        pomoc:
          - "Uporedi svaku godinu sa 1481."
          - "Traži godine veće od 1481."
          - "Iz lekcije: Hercegovina 1482, Zeta 1499."
        objasnjenje: "Hercegovina (1482) i Zeta (1499) padaju posle 1481, pa osvajanja traju i posle Mehmeda II."
        iz_udzbenika: {strana: 48, odeljak: "Pad Srbije, Bosne, Hercegovine i Zete", tekst: "Mehmed II vlada 1451–1481, Hercegovina pada 1482, a Zeta 1499."}

      - id: l12-tn-hercegovina-pre-bosne
        vrsta: tacno_netacno
        tezina: lako
        pojmovi: [bosna, hercegovina]
        tvrdnja: "Hercegovina je pala pre Bosne."
        tacno: false
        ispravke:
          - {tekst: "Bosna je pala 1463, a Hercegovina malo kasnije, 1482.", tacan: true}
          - {tekst: "Bosna i Hercegovina su pale iste godine.", tacan: false, zasto: "Između njihovih padova prošlo je devetnaest godina."}
          - {tekst: "Hercegovinu Turci nisu osvojili.", tacan: false, zasto: "Osvojena je 1482."}
        pomoc:
          - "Uporedi 1463. i 1482."
          - "Koja je godina ranija?"
          - "Iz lekcije: Bosna 1463, Hercegovina 1482."
        objasnjenje: "Netačno. Prvo pada Bosna, 1463, pa Hercegovina, 1482."
        iz_udzbenika: {strana: 48, odeljak: "Pad Srbije, Bosne, Hercegovine i Zete", tekst: "Bosna je osvojena 1463, a Hercegovina je zauzeta malo kasnije, 1482."}

      - id: l12-tn-dubrovnik-slobodan
        vrsta: tacno_netacno
        tezina: srednje
        pojmovi: [dubrovacka-republika]
        tvrdnja: "Dubrovačka republika se nikada nije potčinila Osmanlijama."
        tacno: false
        ispravke:
          - {tekst: "Potčinila se 1526, ali je u suštini sačuvala slobodu.", tacan: true}
          - {tekst: "Osmanlije su je osvojile i ukinule.", tacan: false, zasto: "Nije ukinuta; formalno je pod sultanom, ali čuva slobodu."}
          - {tekst: "Potčinila se Ugarskoj 1526.", tacan: false, zasto: "Lekcija navodi potčinjavanje Osmanlijama, a ne Ugarskoj."}
        pomoc:
          - "Razlikuj formalnu vlast od stvarne slobode."
          - "Godina je 1526."
          - "Iz lekcije: potčinila se 1526, a u suštini je sačuvala slobodu."
        objasnjenje: "Netačno. Dubrovnik je formalno pod sultanom od 1526, a suštinski slobodan."
        iz_udzbenika: {strana: 48, odeljak: "Pad Srbije, Bosne, Hercegovine i Zete", tekst: "Dubrovačka republika se potčinila Osmanlijama 1526, ali je u suštini sačuvala slobodu."}
        osa: {naziv: "Dubrovačka republika se potčinjava Osmanlijama", od: 1526, traka: dogadjaji}

      - id: l12-tn-bugarska
        vrsta: tacno_netacno
        tezina: srednje
        pojmovi: [bugarska, kosovski-boj, osmanlije]
        tvrdnja: "Posle srpskog poraza na Kosovu Turci zauzimaju dva bugarska carstva."
        tacno: true
        pomoc:
          - "Pogledaj okvir „Zapamtite”."
          - "Razmisli ko je još bio na putu Turaka posle Kosova."
          - "Iz lekcije: posle Kosova Turci zauzimaju dva bugarska carstva."
        objasnjenje: "Tačno. Širenje se posle Kosova nastavlja zauzimanjem dva bugarska carstva."
        iz_udzbenika: {strana: 49, odeljak: "Zapamtite", tekst: "Posle srpskog poraza na Kosovu Turci zauzimaju dva bugarska carstva."}

      - id: l12-tn-zastoj-kosovo
        vrsta: tacno_netacno
        tezina: tesko
        pojmovi: [murat, osmanlije, kosovski-boj]
        tvrdnja: "Smrt sultana Murata na Kosovu pomogla je balkanskim državama da dobiju na vremenu."
        tacno: true
        pomoc:
          - "Šta je usledilo posle Muratove smrti?"
          - "Borbe oko prestola su zaustavile osvajanja."
          - "Iz lekcije: sukobi pretendenata traju od smrti Murata, a osvajanja se nastavljaju tek kad su rešeni."
        objasnjenje: "Tačno. Sukobi oko prestola privremeno zaustavljaju osvajanja, pa balkanske države dobijaju na vremenu."
        iz_udzbenika: {strana: 48, odeljak: "Uvod", tekst: "Turska osvajanja se nastavljaju tek kad su rešeni obračuni pretendenata, koji traju od Muratove smrti 1389."}
        osa: {naziv: "Bitka na Kosovu", od: 1389, traka: dogadjaji}

      - id: l12-dopuni-mehmed
        vrsta: dopuni
        tezina: lako
        pojmovi: [mehmed-ii-osvajac, carigrad, vizantija]
        pitanje: "Dopuni rečenicu."
        tekst: "Sultan {{Mehmed II}} Osvajač 1453. zauzima {{Carigrad}} i uništava {{Vizantiju}}."
        ponudjene: ["Mehmed II", "Murat", "Carigrad", "Smederevo", "Vizantiju", "Ugarsku"]
        pomoc:
          - "Murat je umro 1389."
          - "Grad je prestonica Vizantije."
          - "Iz lekcije: Mehmed II, Carigrad, Vizantija."
        objasnjenje: "Mehmed II Osvajač je 1453. okončao Vizantiju."
        iz_udzbenika: {strana: 48, odeljak: "Pad Srbije, Bosne, Hercegovine i Zete", tekst: "Mehmed II 1453. zauzima Carigrad i time uništava Vizantiju."}
        osa: {naziv: "Pad Carigrada", od: 1453, traka: dogadjaji}

      - id: l12-dopuni-padovi
        vrsta: dopuni
        tezina: srednje
        pojmovi: [bosna, hercegovina, zeta]
        pitanje: "Dopuni godine."
        tekst: "Bosna pada {{1463}}, Hercegovina {{1482}}, a Zeta {{1499}}."
        ponudjene: ["1463", "1482", "1499", "1453", "1526"]
        pomoc:
          - "Godine idu od najranije ka najkasnijoj."
          - "Godina 1453. je Carigrad, a 1526. Dubrovnik."
          - "Iz lekcije: 1463, 1482, 1499."
        objasnjenje: "Bosna, Hercegovina pa Zeta: tok padova do kraja XV veka."
        iz_udzbenika: {strana: 48, odeljak: "Pad Srbije, Bosne, Hercegovine i Zete", tekst: "Bosna je osvojena 1463, Hercegovina 1482, a Zeta 1499."}

      - id: l12-dopuni-tok-bez-banke
        vrsta: dopuni
        tezina: tesko
        pojmovi: [mehmed-ii-osvajac, ugarska, mletacka-republika, albanija, grcka]
        pitanje: "Dopuni tekst bez ponuđenih reči."
        tekst: "Kad Turci pokore i {{Albaniju}} i {{Grčku}}, Balkan je pokoren, a neposredno na pravcu širenja ostaju Kraljevina {{Ugarska}} i {{Mletačka|Mletačka republika}} republika."
        pomoc:
          - "Dve zemlje su na jugu Balkana."
          - "Dve države su severno i zapadno od Balkana."
          - "Iz lekcije: Albanija i Grčka su osvojene, a na udaru su Ugarska i Mletačka republika."
        objasnjenje: "Sa padom Albanije i Grčke granica osvajanja stiže do Ugarske i Mletačke republike."
        iz_udzbenika: {strana: 48, odeljak: "Pad Srbije, Bosne, Hercegovine i Zete", tekst: "Turci osvajaju Albaniju i Grčku, a Ugarska i Mletačka republika ostaju na pravcu širenja."}

      - id: l12-povezi-godine
        vrsta: povezi
        tezina: lako
        pojmovi: [carigrad, srpska-despotovina, bosna, zeta]
        pitanje: "Poveži godinu sa padom."
        parovi:
          - ["1453", "Carigrad"]
          - ["1459", "Srpska despotovina"]
          - ["1463", "Bosna"]
          - ["1499", "Zeta"]
        pomoc:
          - "Prvi pad je pad Vizantije."
          - "Poslednja je poslednja srpska oblast."
          - "Iz lekcije: 1453, 1459, 1463, 1499."
        objasnjenje: "Četiri godine prate tok osvajanja kroz drugu polovinu XV veka."
        iz_udzbenika: {strana: 49, odeljak: "Zapamtite", tekst: "Vizantija pada 1453, Srpska despotovina 1459, a zatim Bosna, Hercegovina i Zeta."}

      - id: l12-povezi-sudbine
        vrsta: povezi
        tezina: srednje
        pojmovi: [dubrovacka-republika, ugarska, zeta, vizantija]
        pitanje: "Poveži državu sa njenom sudbinom."
        parovi:
          - ["Vizantija", "uništena padom prestonice"]
          - ["Zeta", "poslednja srpska oblast koja pada"]
          - ["Ugarska", "sledeća na pravcu širenja"]
          - ["Dubrovačka republika", "potčinjena, a u suštini slobodna"]
        pomoc:
          - "Samo jedna od ovih država ostaje slobodna."
          - "Jedna još nije osvojena, ali je sledeća."
          - "Iz lekcije: svaka država ima drugačiji ishod."
        objasnjenje: "Sudbine su različite: uništenje, poslednji pad, pretnja i očuvana sloboda."
        iz_udzbenika: {strana: 48, odeljak: "Pad Srbije, Bosne, Hercegovine i Zete", tekst: "Lekcija navodi kako je prošla svaka država na putu osvajanja."}

      - id: l12-zakljuci-konsolidacija
        vrsta: zakljuci
        tezina: lako
        pojmovi: [osmansko-carstvo, murat]
        pitanje: "Zašto se turska osvajanja nastavljaju tek posle rešavanja sukoba oko prestola?"
        odgovori:
          - {tekst: "Zato što je država u unutrašnjem sukobu slabija za spoljne ratove", tacan: true}
          - {tekst: "Zato što sultani nisu želeli osvajanja", tacan: false, zasto: "Želeli su ih, ali su ih sprečile borbe oko prestola."}
          - {tekst: "Zato što ih je Dubrovnik sprečavao", tacan: false, zasto: "Prepreka je bila unutrašnja, a ne Dubrovnik."}
          - {tekst: "Zato što je Balkan već bio osvojen", tacan: false, zasto: "Balkan je pokoren tek posle nastavka osvajanja."}
        pomoc:
          - "Korak 1: Čime se bave pretendenti na presto?"
          - "Korak 2: Da li tada mogu da vode velika osvajanja?"
          - "Iz lekcije: posle turske konsolidacije usledilo je snažno širenje."
        objasnjenje: "Tek sređena država može snažno da se širi."
        iz_udzbenika: {strana: 48, odeljak: "Uvod", tekst: "Posle turske konsolidacije usledilo je snažno širenje Osmanskog carstva."}

      - id: l12-zakljuci-gradjanski-rat
        vrsta: zakljuci
        tezina: srednje
        pojmovi: [bosna, osmanlije]
        pitanje: "Šta je zajedničko Osmanlijama posle 1389. i Bosni pred 1463?"
        odgovori:
          - {tekst: "Unutrašnji sukob slabi državu: Osmanlije privremeno, Bosnu do pada", tacan: true}
          - {tekst: "Obe su tada pobedile Ugarsku", tacan: false, zasto: "Lekcija ne govori o tome; zajednički su im unutrašnji sukobi."}
          - {tekst: "Obe su bile republike", tacan: false, zasto: "Republike su Dubrovnik i Mleci, a ne Osmanlije i Bosna."}
          - {tekst: "Obe su pale pod Dubrovnik", tacan: false, zasto: "Dubrovnik nije osvajač ni jednih ni drugih."}
        pomoc:
          - "Korak 1: Šta se dešava u turskoj državi posle Muratove smrti?"
          - "Korak 2: Šta se dešava u Bosni pred osvajanje?"
          - "Iz lekcije: borbe oko prestola kod Turaka, građanski rat u Bosni."
        objasnjenje: "Osmanlije su sredile prilike i nastavile, a Bosna nije i pala je."
        iz_udzbenika: {strana: 48, odeljak: "Pad Srbije, Bosne, Hercegovine i Zete", tekst: "Sukobi oko prestola zaustavljaju Turke, a Bosna, zahvaćena građanskim ratom, biva osvojena."}

      - id: l12-zakljuci-osvajac
        vrsta: zakljuci
        tezina: srednje
        pojmovi: [mehmed-ii-osvajac, osmansko-carstvo]
        pitanje: "Zašto je Mehmed II dobio nadimak Osvajač?"
        odgovori:
          - {tekst: "Zato što je nastavio osvajačku politiku i zauzeo Carigrad, pa pod njim padaju i Despotovina i Bosna", tacan: true}
          - {tekst: "Zato što je osvojio Dubrovnik 1526.", tacan: false, zasto: "Mehmed II vlada do 1481, a Dubrovnik se potčinjava 1526, bez osvajanja."}
          - {tekst: "Zato što je pobedio na Kosovu 1389.", tacan: false, zasto: "Od tada do njegovog dolaska na vlast (1451) prošlo je više od šezdeset godina."}
          - {tekst: "Zato što je osvojio Ugarsku", tacan: false, zasto: "Ugarska je samo na pravcu daljeg širenja; lekcija je ne navodi kao osvojenu."}
        pomoc:
          - "Korak 1: Koji je najveći uspeh njegove vladavine?"
          - "Korak 2: Koje države padaju između 1451. i 1481?"
          - "Iz lekcije: Mehmed II nastavlja osvajačku politiku i zauzima Carigrad."
        objasnjenje: "Pod njim padaju Vizantija, Despotovina i Bosna."
        iz_udzbenika: {strana: 48, odeljak: "Pad Srbije, Bosne, Hercegovine i Zete", tekst: "Mehmed II Osvajač (1451–1481) nastavlja osvajačku politiku prethodnika."}
