          - {tekst: "Prekinute su sve kulturne i privredne veze, osim kod Dubrovnika.", tacan: true}
          - {tekst: "Veze su prekinute samo sa Ugarskom.", tacan: false, zasto: "Prekid se odnosi na celu Zapadnu Evropu."}
          - {tekst: "Veze su ojačale.", tacan: false, zasto: "Veze su prekinute, a ne ojačane."}
        pomoc:
          - "Seti se reči „prekid” u delu o posledicama."
          - "Važi za kulturu i privredu."
          - "Iz lekcije: prekidaju se sve kulturne i privredne veze sa Zapadnom Evropom."
        objasnjenje: "Netačno. Veze su prekinute, osim kod Dubrovnika."
        iz_udzbenika: {strana: 48, odeljak: "Posledice osmanlijskih osvajanja", tekst: "Prekidaju se sve kulturne i privredne veze Balkana sa Zapadnom Evropom."}

      - id: l12-dopuni-posledice
        vrsta: dopuni
        tezina: lako
        pojmovi: [dubrovacka-republika]
        pitanje: "Dopuni rečenicu."
        tekst: "Osvajanja su prekinula {{razvoj}} balkanskih država i veze sa {{Zapadnom}} Evropom, a izuzetak je {{Dubrovačka}} republika."
        ponudjene: ["razvoj", "Zapadnom", "Dubrovačka", "Mletačka", "Istočnom"]
        pomoc:
          - "Mletačka republika nije na Balkanu pod Turcima."
          - "Veze su sa suprotne strane Evrope."
          - "Iz lekcije: prekinut razvoj i veze sa Zapadnom Evropom; izuzetak je Dubrovnik."
        objasnjenje: "Dubrovnik je jedini izuzetak od opšteg prekida."
        iz_udzbenika: {strana: 48, odeljak: "Posledice osmanlijskih osvajanja", tekst: "Razvoj balkanskih država i veze sa Zapadnom Evropom su prekinuti, a izuzetak je Dubrovačka republika."}

      - id: l12-zakljuci-znacaj-dubrovnika
        vrsta: zakljuci
        tezina: srednje
        pojmovi: [dubrovacka-republika]
        pitanje: "Zašto je Dubrovnik posle osvajanja imao posebnu važnost za balkanski svet?"
        odgovori:
          - {tekst: "Jedini je ostao izuzetak od prekida veza sa Zapadnom Evropom", tacan: true}
          - {tekst: "Bio je prestonica Osmanskog carstva", tacan: false, zasto: "Dubrovnik je mala republika, a ne prestonica carstva."}
          - {tekst: "Osvojio je Ugarsku", tacan: false, zasto: "Dubrovnik nije osvajao, nego se potčinio 1526."}
          - {tekst: "Bio je najveći rudnik", tacan: false, zasto: "Rudnik je Novo Brdo; Dubrovnik je važan po slobodi i vezama."}
        pomoc:
          - "Korak 1: Šta se desilo sa vezama svih ostalih?"
          - "Korak 2: Ko je jedini izuzetak?"
          - "Iz lekcije: izuzetak je bila Dubrovačka republika."
        objasnjenje: "Dok je ostatak Balkana odsečen, Dubrovnik ostaje jedini izuzetak."
        iz_udzbenika: {strana: 48, odeljak: "Posledice osmanlijskih osvajanja", tekst: "Izuzetak od prekida veza bila je Dubrovačka republika."}

      - id: l12-zakljuci-razlika-srednji-vek
        vrsta: zakljuci
        tezina: tesko
        pojmovi: [osmanlije]
        pitanje: "Zašto se za osvajanja kaže da su prekinula razvoj, a ne samo promenila vladara?"
        odgovori:
          - {tekst: "Zato što su nestale države, a sa njima i veze koje su vodile razvoju kulture i privrede", tacan: true}
          - {tekst: "Zato što je novi vladar govorio drugim jezikom", tacan: false, zasto: "Lekcija razvoj povezuje sa nestankom država i veza, a ne sa jezikom vladara."}
          - {tekst: "Zato što su svi stanovnici napustili Balkan", tacan: false, zasto: "Lekcija to ne kaže; stanovništvo je ostalo pod novom vlašću."}
          - {tekst: "Zato što je Dubrovnik zatvorio trgovinu", tacan: false, zasto: "Dubrovnik je upravo izuzetak."}
        pomoc:
          - "Korak 1: Šta je nestalo osim vladara?"
          - "Korak 2: Šta znači prekid veza za kulturu i privredu?"
          - "Iz lekcije: nestaju države, prekidaju se veze sa Zapadnom Evropom."
        objasnjenje: "Prekid nije samo promena vlasti: nestaju države i veze koje su ih razvijale."
        iz_udzbenika: {strana: 48, odeljak: "Posledice osmanlijskih osvajanja", tekst: "Prekinut je razvoj država i sve kulturne i privredne veze sa Zapadnom Evropom."}

      - id: l12-uporedi-pre-posle
        vrsta: uporedi
        tezina: lako
        pojmovi: [osmanlije, dubrovacka-republika]
        a: "Balkan pre osvajanja"
        b: "Balkan posle osvajanja"
        pitanje: "Na koje vreme se odnosi tvrdnja: pre, posle, oba ili nijedno?"
        tvrdnje:
          - {tekst: "Postoje samostalne hrišćanske države.", odgovor: a, zasto: "Posle osvajanja one nestaju."}
          - {tekst: "Veze sa Zapadnom Evropom su prekinute.", odgovor: b, zasto: "Prekid je posledica osvajanja."}
          - {tekst: "Postoji Dubrovačka republika.", odgovor: oba, zasto: "Dubrovnik postoji pre i posle osvajanja."}
          - {tekst: "Vizantijom vlada Stefan Lazarević.", odgovor: nijedan, zasto: "Vizantijom vlada car, a Stefan je srpski despot."}
        pomoc:
          - "Šta je nestalo osvajanjima?"
          - "Jedna republika ostaje."
          - "Iz lekcije: nestaju države i veze, a Dubrovnik ostaje izuzetak."
        objasnjenje: "Osvajanja menjaju sliku Balkana, osim kod Dubrovnika."
        iz_udzbenika: {strana: 48, odeljak: "Posledice osmanlijskih osvajanja", tekst: "Lekcija navodi šta se menja posle osmanlijskih osvajanja."}

      - id: l12-objasni-posledice
        vrsta: objasni
        tezina: srednje
        pojmovi: [osmanlije, dubrovacka-republika]
        pitanje: "Navedi i objasni posledice osmanlijskih osvajanja na Balkanu."
        uzor: "Prekinut je razvoj balkanskih srednjovekovnih država, a samostalne hrišćanske države su nestale. Prekinute su i sve kulturne i privredne veze sa Zapadnom Evropom. Izuzetak je bila Dubrovačka republika."
        ideje:
          - "Prekinut je razvoj država."
          - "Nestaju samostalne hrišćanske države."
          - "Prekinute su veze sa Zapadnom Evropom."
          - "Izuzetak je Dubrovnik."
        objasnjenje: "Tri posledice i jedan izuzetak."
        iz_udzbenika: {strana: 48, odeljak: "Posledice osmanlijskih osvajanja", tekst: "Lekcija navodi prekid razvoja, nestanak država i prekid veza sa Zapadnom Evropom."}

      - id: l12-objasni-sta-bi-bilo
        vrsta: objasni
        tezina: tesko
        pojmovi: [osmanlije, srpska-despotovina]
        pitanje: "Uporedi Despotovinu iz prethodne lekcije sa Balkanom posle osvajanja. Šta je izgubljeno? Objasni."
        uzor: "U Despotovini su cvetali rudarstvo i trgovina, a nastajala su važna dela. Posle osvajanja nestaje samostalna država, a prekidaju se razvoj i veze sa Zapadnom Evropom. Izgubljeni su i samostalnost i mogućnost da se privreda i kultura dalje razvijaju."
        ideje:
          - "Despotovina je imala privredni polet."
          - "Država je izgubila samostalnost."
          - "Prekinuti su razvoj i veze sa Zapadom."
        objasnjenje: "Poređenje pokazuje koliko je osvajanje promenilo Balkan."
        iz_udzbenika: {strana: 48, odeljak: "Posledice osmanlijskih osvajanja", tekst: "Prekinut je dotadašnji razvoj balkanskih srednjovekovnih država."}

  # ==========================================================================
  - naslov: "Pad Novog Brda"
    zadaci:
      - id: l12-novo-brdo-izbor-sta
        vrsta: izbor
        tezina: lako
        pojmovi: [novo-brdo]
        pitanje: "Zbog čega je Novo Brdo bilo važno mesto?"
        odgovori:
          - {tekst: "Imalo je rudnik i majdane zlata i srebra", tacan: true}
          - {tekst: "Bilo je prestonica Vizantije", tacan: false, zasto: "Prestonica Vizantije je Carigrad."}
          - {tekst: "Bilo je luka Dubrovnika", tacan: false, zasto: "Novo Brdo je rudarsko mesto, a ne luka."}
          - {tekst: "Bilo je sedište janičara", tacan: false, zasto: "Janičari se tamo odvode iz grada, ali grad je važan zbog rudnika."}
        pomoc:
          - "Seti se prethodne lekcije o prihodima Despotovine."
          - "Tražimo plemenite metale."
          - "Iz lekcije: Novo Brdo je mesto sa rudnikom i majdanima zlata i srebra."
        objasnjenje: "Novo Brdo ima rudnik i majdane zlata i srebra."
        iz_udzbenika: {strana: 48, odeljak: "Iz istorijskih izvora: Pad Novog Brda", tekst: "Sultan zauzima Novo Brdo, mesto sa rudnikom i majdanima zlata i srebra."}
        osa: {naziv: "Pad Novog Brda", od: 1455, traka: dogadjaji}

      - id: l12-mihailovic-izbor
        vrsta: izbor
        tezina: srednje
        pojmovi: [konstantin-mihailovic, uspomene-janicara, janicari]
        pitanje: "Zašto su Uspomene janičara dragocene za istoričara?"
        odgovori:
          - {tekst: "Pisac je kao mladić sam zarobljen u Novom Brdu i odveden u janičare", tacan: true}
          - {tekst: "Napisao ih je sultan Mehmed II", tacan: false, zasto: "Napisao ih je Konstantin Mihailović iz Ostrovice."}
          - {tekst: "Pisac je bio dubrovački trgovac", tacan: false, zasto: "Konstantin je zarobljenik i janičar."}
          - {tekst: "Nastale su pre pada Novog Brda", tacan: false, zasto: "Opisuju pad Novog Brda koji je pisac doživeo."}
        pomoc:
          - "Da li je pisac bio prisutan?"
          - "Ko je odveden u janičare 1455?"
          - "Iz lekcije: Konstantin Mihailović je zarobljen u Novom Brdu i 1455. odveden u janičare."
        objasnjenje: "Delo je svedočanstvo očevica."
        iz_udzbenika: {strana: 48, odeljak: "Iz istorijskih izvora: Pad Novog Brda", tekst: "Konstantin Mihailović je kao mladić zarobljen u Novom Brdu i 1455. odveden u janičare."}
        osa: {naziv: "Pad Novog Brda", od: 1455, traka: dogadjaji}

      - id: l12-tn-brojevi
        vrsta: tacno_netacno
        tezina: srednje
        pojmovi: [novo-brdo, konstantin-mihailovic]
        tvrdnja: "Prema odlomku, sultan je podanicima podelio 320 momaka i 700 žena."
        tacno: true
        pomoc:
          - "Pogledaj brojeve u odlomku."
          - "Oba broja su navedena."
          - "Iz lekcije: momke (320) i žene (700) deli podanicima."
        objasnjenje: "Tačno. Odlomak navodi te brojeve."
        iz_udzbenika: {strana: 49, odeljak: "Iz istorijskih izvora: Pad Novog Brda", tekst: "Momke (320) i žene (700) sultan deli svojim podanicima."}

      - id: l12-tn-kapije
        vrsta: tacno_netacno
        tezina: srednje
        pojmovi: [novo-brdo, mehmed-ii-osvajac]
        tvrdnja: "Sultan je naredio da se otvore sve gradske kapije."
        tacno: false
        ispravke:
          - {tekst: "Naredio je da se sve kapije zatvore osim jedne.", tacan: true}
          - {tekst: "Naredio je da se sruši grad.", tacan: false, zasto: "Odlomak ne govori o rušenju; ostali su pušteni natrag u varoš."}
          - {tekst: "Naredio je da svi ostanu u kućama.", tacan: false, zasto: "Svi domaćini sa ukućanima morali su da izađu na šanac."}
        pomoc:
          - "Zašto bi sultan hteo da svi prođu kroz jedno mesto?"
          - "Razmisli o izlazu na šanac."
          - "Iz lekcije: zatvaraju se sve kapije osim jedne."
        objasnjenje: "Netačno. Otvorena je samo jedna kapija, pa je sultan mogao da pregleda sve koji izlaze."
        iz_udzbenika: {strana: 48, odeljak: "Iz istorijskih izvora: Pad Novog Brda", tekst: "Posle predaje sultan naređuje da se sve kapije zatvore osim jedne."}

      - id: l12-dopuni-izvor
        vrsta: dopuni
        tezina: srednje
        pojmovi: [konstantin-mihailovic, uspomene-janicara, novo-brdo]
        pitanje: "Dopuni rečenicu."
        tekst: "Konstantin Mihailović iz {{Ostrovice}} napisao je {{Uspomene janičara}}. Zarobljen je u {{Novom Brdu}} i {{1455}}. odveden u janičare."
        ponudjene: ["Ostrovice", "Uspomene janičara", "Novom Brdu", "1455", "Carigradu", "1453"]
        pomoc:
          - "Godina nije pad Carigrada."
          - "Zarobljen je u rudarskom mestu."
          - "Iz lekcije: Konstantin Mihailović iz Ostrovice, Uspomene janičara, Novo Brdo, 1455."
        objasnjenje: "Pisac je očevidac pada Novog Brda."
        iz_udzbenika: {strana: 48, odeljak: "Iz istorijskih izvora: Pad Novog Brda", tekst: "Konstantin Mihailović iz Ostrovice, pisac Uspomena janičara, 1455. je iz Novog Brda odveden u janičare."}

      - id: l12-dopuni-bez-banke-kapija
        vrsta: dopuni
        tezina: tesko
        pojmovi: [novo-brdo, janicari]
        pitanje: "Dopuni tekst bez ponuđenih reči."
        tekst: "Sultan razdvaja momke, muškarce i žene na {{tri}} strane. Najistaknutije među {{muškarcima}} pogubljuje, a mladiće uzima sebi za {{janičare}}."
        pomoc:
          - "Prebroj: momci, muškarci, žene."
          - "Mladići idu u posebnu vojsku."
          - "Iz lekcije: tri strane; pogubljuje najistaknutije muškarce; mladiće uzima za janičare."
        objasnjenje: "Razdvajanje pokazuje plan: pogubiti ugledne, a mlade iskoristiti."
        iz_udzbenika: {strana: 49, odeljak: "Iz istorijskih izvora: Pad Novog Brda", tekst: "Sultan razdvaja stanovnike na tri strane, pogubljuje najistaknutije, a mladiće uzima za janičare."}

      - id: l12-povezi-podela
        vrsta: povezi
        tezina: tesko
        pojmovi: [novo-brdo, janicari]
        pitanje: "Poveži grupu stanovnika Novog Brda sa njenom sudbinom po izvoru."
        parovi:
          - ["najistaknutiji muškarci", "pogubljeni"]
          - ["ostali muškarci", "pušteni u varoš, imanje netaknuto"]
          - ["momci i žene", "podeljeni sultanovim podanicima"]
          - ["mladići", "uzeti za janičare"]
        pomoc:
          - "Sultan uklanja moguće vođe."
          - "Ostali mogu da nastave život u varoši."
          - "Iz lekcije: svaka grupa ima drugačiju sudbinu."
        objasnjenje: "Četiri sudbine pokazuju smišljen postupak prema pokorenom gradu."
        iz_udzbenika: {strana: 49, odeljak: "Iz istorijskih izvora: Pad Novog Brda", tekst: "Sultan najistaknutije pogubljuje, ostale pušta u varoš, momke i žene deli, a mladiće uzima za janičare."}

      - id: l12-zakljuci-jedna-kapija
        vrsta: zakljuci
        tezina: srednje
        pojmovi: [novo-brdo, mehmed-ii-osvajac]
        pitanje: "Zašto je sultan ostavio otvorenu samo jednu kapiju?"
        odgovori:
          - {tekst: "Da svi prođu pored njega, pa da ih razdvoji i niko ne pobegne", tacan: true}
          - {tekst: "Da građani lakše pobegnu", tacan: false, zasto: "Jedna kapija otežava, a ne olakšava bekstvo."}
          - {tekst: "Zato što ostale kapije nisu postojale", tacan: false, zasto: "Zatvorene su po naređenju, što znači da su postojale."}
          - {tekst: "Da zaštiti grad od Ugara", tacan: false, zasto: "Odlomak ne spominje Ugre; kroz kapiju prolaze stanovnici, koje sultan razdvaja."}
        pomoc:
          - "Korak 1: Gde stoji sultan?"
          - "Korak 2: Šta može da radi sa ljudima koji prolaze?"
          - "Iz lekcije: sultan stoji kod te kapije i razdvaja ljude."
        objasnjenje: "Jedna kapija omogućava potpunu kontrolu nad stanovništvom."
        iz_udzbenika: {strana: 48, odeljak: "Iz istorijskih izvora: Pad Novog Brda", tekst: "Sultan stoji kod jedine otvorene kapije i razdvaja ljude."}

      - id: l12-zakljuci-obecanje
        vrsta: zakljuci
        tezina: tesko
        pojmovi: [novo-brdo, mehmed-ii-osvajac, janicari]
        pitanje: "Šta je sultan od obećanja održao, a šta prekršio?"
        odgovori:
          - {tekst: "Puštenima je ostavio imanje, a oduzeo je mlade, iako je obećao da neće", tacan: true}
          - {tekst: "Održao je sva obećanja", tacan: false, zasto: "Obećao je da neće oduzimati mlade, a odveo ih je."}
          - {tekst: "Prekršio je sve: svi su izgubili imovinu", tacan: false, zasto: "Puštenima u varoš imanje nije dirao."}
          - {tekst: "Nije dao nikakvo obećanje", tacan: false, zasto: "Grad se predao po dogovoru, uz obećanja."}
        pomoc:
          - "Korak 1: Koja dva obećanja je dao?"
          - "Korak 2: Šta je učinio sa mladima, a šta sa imanjem puštenih?"
          - "Iz lekcije: obećao je imovinu i mlade; ostale je pustio i nije im dirao imanje, a momke i mladiće je uzeo."
        objasnjenje: "Pogodba je samo delimično poštovana, a mladi su odvedeni."
        iz_udzbenika: {strana: 49, odeljak: "Iz istorijskih izvora: Pad Novog Brda", tekst: "Sultan je obećao da će ostaviti imovinu i mlade, a ipak je uzeo momke i mladiće."}

      - id: l12-izvor-obecanje
        vrsta: izvor
        tezina: lako
        pojmovi: [novo-brdo, mehmed-ii-osvajac, konstantin-mihailovic]
        izvor:
          autor: "Konstantin Mihailović iz Ostrovice"
          naslov: "Uspomene janičara"
          tekst: "Sultan je došao pred Novo Brdo, mesto bogato zlatom i srebrom. Građani su pristali na predaju, a on im je zauzvrat obećao da će im imovina ostati i da im neće uzimati mlade ljude."
          napomena: "Odlomak je prepričan; udžbenik, str. 48."
        pitanje: "Šta je sultan obećao građanima?"
        odgovori:
          - {tekst: "Da će im ostaviti imovinu i da im neće oduzimati devojke i mladiće", tacan: true}
          - {tekst: "Da će im dati Carigrad", tacan: false, zasto: "Carigrad nije deo obećanja."}
          - {tekst: "Da će ih sve poslati u Dubrovnik", tacan: false, zasto: "Takvog obećanja u odlomku nema."}
          - {tekst: "Da će im ukinuti rudnik", tacan: false, zasto: "Odlomak spominje rudnik, ali ne i obećanje o njemu."}
        pomoc:
          - "Pročitaj drugu rečenicu odlomka."
          - "Traži imovinu i mlade."
          - "Iz lekcije: sultan obećava imovinu i da neće oduzimati mlade."
        objasnjenje: "Obećanje se tiče imovine i mladih."
        iz_udzbenika: {strana: 48, odeljak: "Iz istorijskih izvora: Pad Novog Brda", tekst: "Sultan je obećao da će stanovnicima ostaviti imovinu i da im neće oduzimati ni devojke ni mladiće."}

      - id: l12-izvor-razdvajanje
        vrsta: izvor
        tezina: srednje
        pojmovi: [novo-brdo, mehmed-ii-osvajac]
        izvor:
          autor: "Konstantin Mihailović iz Ostrovice"
          naslov: "Uspomene janičara"
          tekst: "Stanovnici izlaze na šanac kroz jednu kapiju, a imovinu ostavljaju kod kuće. Sultan ih deli na tri grupe. Ugledne muškarce daje da se pogube, a ostale vraća u varoš i ne uzima im imanje."
          napomena: "Odlomak je prepričan; udžbenik, str. 49."
        pitanje: "Zašto je sultan pogubio baš najistaknutije muškarce?"
        odgovori:
          - {tekst: "Da ukloni one oko kojih bi građani mogli da se okupe", tacan: true}
          - {tekst: "Zato što su bili janičari", tacan: false, zasto: "Janičari postaju mladići, a ne ugledni muškarci."}
          - {tekst: "Zato što su bili najmlađi", tacan: false, zasto: "Najmlađi su uzeti, a pogubljeni su najistaknutiji."}
          - {tekst: "Zato što su sami to tražili", tacan: false, zasto: "U odlomku oni nemaju izbora."}
        pomoc:
          - "Ko u gradu ima najviše uticaja?"
          - "Šta sultan dobija ako ih nema?"
          - "Iz lekcije: najistaknutije pogubljuje, ostale pušta."
        objasnjenje: "Uklanjanjem uglednih ljudi sultan sprečava otpor."
        iz_udzbenika: {strana: 49, odeljak: "Iz istorijskih izvora: Pad Novog Brda", tekst: "Sultan najistaknutije pogubljuje, a ostale pušta u varoš."}

      - id: l12-izvor-ocevidac
        vrsta: izvor
        tezina: tesko
