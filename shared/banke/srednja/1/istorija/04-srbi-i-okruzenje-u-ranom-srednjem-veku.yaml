          - {tekst: "Primorske oblasti se objedinjuju pod dukljanskim vladarem", tacan: true}
          - {tekst: "Duklja pada pod Samuila", tacan: false, zasto: "Samuilovo carstvo je već nestalo 1018."}
          - {tekst: "Raška postaje središte", tacan: false, zasto: "To je XII vek, posle Bodinove smrti."}
        pomoc:
          - "Korak 1: Šta se dešava sa Dukljom kad popusti vizantijska vlast?"
          - "Korak 2: Koje oblasti su uz nju?"
          - "Iz lekcije: Travunija, Zahumlje i Duklja bile su objedinjene."
        objasnjenje: "Slabost Vizantije i ustanci omogućili su da se primorske oblasti objedine pod Dukljom."
        iz_udzbenika:
          strana: 24
          odeljak: "Razvoj države u Duklji"
          tekst: "Stefan Vojislav je dizao ustanke, a Travunija, Zahumlje i Duklja jedno vreme su bile objedinjene."

      - id: l04-raska-primat-lanac
        vrsta: lanac
        tezina: tesko
        pojmovi: [bodin, raska, zeta]
        karike:
          - "Bodin širi državu"
          - "Bodin umire"
          - "?"
          - "Raška postaje središte srpskih oblasti u XII veku"
        praznina: 2
        odgovori:
          - {tekst: "Vode se borbe za prevlast u Zeti i Raški, u kojima pobeđuju raški vladari", tacan: true}
          - {tekst: "Papa šalje krunu Raškoj", tacan: false, zasto: "Lekcija govori o borbama, a ne o novoj kruni."}
          - {tekst: "Vizantija vraća Duklju Bugarima", tacan: false, zasto: "Bugarska se ovde ne pominje; prevlast se rešava među srpskim vladarima."}
        pomoc:
          - "Korak 1: Šta se dešava kad umre jak vladar velike države?"
          - "Korak 2: Ko je pobedio?"
          - "Iz lekcije: posle Bodinove smrti borbe za prevlast; pobedili su raški vladari."
        objasnjenje: "Smrt jakog vladara otvara borbe, a pobeda raških vladara premešta središte u Rašku."
        iz_udzbenika:
          strana: 25
          odeljak: "Razvoj države u Duklji"
          tekst: "Posle Bodinove smrti vođene su borbe za prevlast; pobedili su raški vladari."
        osa: {naziv: "Raška postaje središte srpskih oblasti", od: 1100, do: 1200, oznaka: "XII vek", traka: dogadjaji}

      - id: l04-karta-duklje-izvor
        vrsta: izvor
        tezina: srednje
        pojmovi: [duklja, vizantija, hrvatska-drzava]
        izvor:
          autor: "Karta iz udžbenika"
          naslov: "Duklja (opis karte)"
          tekst: "Različitim tonovima obojeni su Duklja, Bosna i Raška, Neretljani, Hrvatska i Vizantija. Posebni znaci označavaju gradove i trgove, episkopije, nadbiskupiju, biskupije i katoličke crkve i manastire. Duklja se pruža uz Jadran; čitaju se Dubrovnik, Boka Kotorska i Ulcinj."
          napomena: "Odlomak je prepričan; udžbenik, str. 25."
        pitanje: "Šta nam legenda sa crkvenim znacima govori o Duklji?"
        odgovori:
          - {tekst: "U njenim krajevima su uticaji crkvenih središta bili značajni, pa i katolički", tacan: true}
          - {tekst: "Stanovništvo Duklje još je verovalo u Peruna", tacan: false, zasto: "Karta prikazuje crkve i biskupije, a ne staru slovensku veru."}
          - {tekst: "Duklja je bila deo Franačke", tacan: false, zasto: "Franačka nije na karti; prikazana je Duklja sa svojim susedima."}
          - {tekst: "U Duklji nije bilo gradova", tacan: false, zasto: "Legenda izričito ima znake za gradove i trgove."}
        pomoc:
          - "Pročitaj drugu rečenicu opisa."
          - "Koje vrste crkvenih ustanova se navode?"
          - "Iz lekcije: legenda označava episkopije, nadbiskupiju, biskupije i katoličke crkve i manastire."
        objasnjenje: "Biskupije i katoličke crkve pokazuju da je primorje bilo povezano sa crkvenim središtima, što se slaže i sa krunom iz Rima."
        iz_udzbenika:
          strana: 25
          odeljak: "Razvoj države u Duklji"
          tekst: "Karta Duklje prikazuje susede i crkvene ustanove, među njima episkopije, biskupije i katoličke crkve."
          slika: 04-srbi-i-okruzenje-u-ranom-srednjem-veku/03-duklja-karta.jpg

      - id: l04-duklja-raska-uporedi
        vrsta: uporedi
        tezina: srednje
        pojmovi: [duklja, raska, kralj-mihailo]
        a: "Duklja"
        b: "Raška"
        pitanje: "Na koju oblast se odnosi tvrdnja?"
        tvrdnje:
          - {tekst: "Nalazi se uz Jadran, između Boke Kotorske i Bojane.", odgovor: a, zasto: "To je položaj Duklje."}
          - {tekst: "Imala je najbrojniju grupu srpskih plemena.", odgovor: b, zasto: "Lekcija to kaže za Rašku."}
          - {tekst: "Dobila je kralja 1077.", odgovor: a, zasto: "Mihailo je dukljanski kralj."}
          - {tekst: "Postala je središte srpskih oblasti u XII veku.", odgovor: b, zasto: "Tada primat prelazi na Rašku."}
          - {tekst: "Bila je pod uticajem Vizantije.", odgovor: oba, zasto: "Raška ju je priznavala nominalno, a Duklja je bila pod njenim uticajem i vlašću."}
          - {tekst: "Bila je u sastavu Franačke.", odgovor: nijedan, zasto: "Franačka se u lekciji ne vezuje ni za jednu."}
        pomoc:
          - "Jedna je primorska, a druga u unutrašnjosti."
          - "Ko je prvi, a ko kasnije središte?"
          - "Iz lekcije: Duklja je prva, a Raška zatim preuzima primat."
        objasnjenje: "Dve oblasti, dve faze: Duklja kraljevina u XI veku, a Raška središte u XII veku."
        iz_udzbenika:
          strana: 25
          odeljak: "Zapamtite"
          tekst: "Za nezavisnost se prva izborila Duklja, a posle nje vodeća snaga postaje Raška."

      - id: l04-vladimir-mihailo-uporedi
        vrsta: uporedi
        tezina: tesko
        pojmovi: [jovan-vladimir, kralj-mihailo, duklja]
        a: "Jovan Vladimir"
        b: "Mihailo"
        pitanje: "Na kog dukljanskog vladara se odnosi tvrdnja?"
        tvrdnje:
          - {tekst: "Bio je knez koji priznaje tuđeg cara.", odgovor: a, zasto: "Jovan Vladimir je priznao Samuila."}
          - {tekst: "Bio je kralj i njime je Duklja dobila nezavisnost.", odgovor: b, zasto: "Mihailo je kralj od 1077."}
          - {tekst: "Lekcija ga vezuje za Bugarsku.", odgovor: a, zasto: "Priznao je bugarskog cara Samuila."}
          - {tekst: "Lekcija ga vezuje za Rim.", odgovor: b, zasto: "Krunu je najverovatnije primio od rimskog pape."}
          - {tekst: "Vladao je Dukljom.", odgovor: oba, zasto: "Obojica su dukljanski vladari."}
          - {tekst: "Priključio je Bosnu i Srbiju.", odgovor: nijedan, zasto: "To je učinio Bodin."}
        pomoc:
          - "Uporedi njihove titule."
          - "Čiju krunu ili vlast prima svaki od njih?"
          - "Iz lekcije: Vladimir priznaje Samuila; Mihailo postaje kralj 1077."
        objasnjenje: "Razlika između njih pokazuje uspon Duklje: od potčinjene kneževine do nezavisne kraljevine."
        iz_udzbenika:
          strana: 24
          odeljak: "Razvoj države u Duklji"
          tekst: "Jovan Vladimir priznaje vlast Samuila, a Mihailo 1077. postaje kralj i Duklja dobija nezavisnost."

      - id: l04-mihailo-ko-sam
        vrsta: ko_sam
        tezina: lako
        pojmovi: [kralj-mihailo, papa-grgur-vii]
        tragovi:
          - "Bio sam naslednik Stefana Vojislava."
          - "Krunu sam primio 1077."
          - "Njome je moja država dobila nezavisnost."
        odgovori:
          - {tekst: "Mihailo", tacan: true}
          - {tekst: "Bodin", tacan: false, zasto: "Bodin je Mihailov naslednik, koji je širio državu."}
          - {tekst: "Časlav", tacan: false, zasto: "Časlav je raški knez iz X veka, bez krune."}
        objasnjenje: "To je Mihailo, prvi kralj Duklje."
        iz_udzbenika:
          strana: 24
          odeljak: "Razvoj države u Duklji"
          tekst: "Vojislavljev naslednik Mihailo postao je kralj 1077, čime je Duklja dobila nezavisnost."
          slika: 04-srbi-i-okruzenje-u-ranom-srednjem-veku/02-zetski-kralj-mihailo.jpg
        osa: {naziv: "Krunisanje kralja Mihaila", od: 1077, traka: dogadjaji}

      - id: l04-vojislav-ko-sam
        vrsta: ko_sam
        tezina: srednje
        pojmovi: [stefan-vojislav, zeta]
        tragovi:
          - "Bio sam dukljanski knez posle 1018."
          - "Iskoristio sam slabljenje velikog carstva."
          - "Dva puta sam digao ustanak."
        odgovori:
          - {tekst: "Stefan Vojislav", tacan: true}
          - {tekst: "Jovan Vladimir", tacan: false, zasto: "Jovan Vladimir je umro 1016, pre pada Samuilovog carstva."}
          - {tekst: "Mihailo", tacan: false, zasto: "Mihailo je Vojislavljev naslednik i kralj."}
        objasnjenje: "To je Stefan Vojislav, koji je dva puta dizao ustanak protiv Vizantije."
        iz_udzbenika:
          strana: 24
          odeljak: "Razvoj države u Duklji"
          tekst: "Stefan Vojislav je dva puta dizao ustanak protiv Vizantije."

      - id: l04-bodin-ko-sam
        vrsta: ko_sam
        tezina: tesko
        pojmovi: [bodin, bosna]
        tragovi:
          - "Mog prethodnika krunisao je, najverovatnije, papa."
          - "Mojoj državi priključene su još dve oblasti."
          - "Posle moje smrti počele su borbe u kojima je Raška preuzela vođstvo."
        odgovori:
          - {tekst: "Bodin", tacan: true}
          - {tekst: "Stefan Vojislav", tacan: false, zasto: "Vojislav je prethodnik Mihaila, a ne njegov naslednik."}
          - {tekst: "Grgur VII", tacan: false, zasto: "Grgur VII je papa, verovatni davalac krune, a ne dukljanski vladar."}
        objasnjenje: "To je Bodin, naslednik kralja Mihaila."
        iz_udzbenika:
          strana: 25
          odeljak: "Razvoj države u Duklji"
          tekst: "Bodin je priključio Bosnu i Srbiju; posle njegove smrti vođene su borbe za prevlast."

      - id: l04-razvoj-duklje-objasni
        vrsta: objasni
        tezina: srednje
        pojmovi: [duklja, jovan-vladimir, stefan-vojislav, kralj-mihailo, bodin]
        pitanje: "Kako je tekao razvoj Duklje? Opiši korake."
        uzor: "U X veku Dukljom upravljaju domaći kneževi, pod uticajem Bugarske i Vizantije. Jovan Vladimir je priznao cara Samuila, a posle 1018. Duklja je pod Vizantijom. Stefan Vojislav diže ustanke i objedinjuje primorske oblasti, Mihailo 1077. postaje kralj i Duklja je nezavisna, a Bodin dodaje Bosnu i Srbiju. Posle toga borbe donose prevlast Raške."
        ideje:
          - "Domaći kneževi pod uticajem Bugarske i Vizantije."
          - "Jovan Vladimir pod Samuilom; od 1018. pod Vizantijom."
          - "Ustanci Stefana Vojislava i objedinjavanje primorja."
          - "Mihailo kralj 1077, nezavisnost."
          - "Bodin širi državu; zatim prevlast Raške."
        objasnjenje: "Odgovor treba da pokaže sled: zavisnost, ustanak, nezavisnost, širenje i gubitak primata."
        iz_udzbenika:
          strana: 25
          odeljak: "Pitanja za razmišljanje / Zadaci iz udžbenika"
          tekst: "Udžbenik pita kako je tekao razvoj Duklje."

      - id: l04-sta-znaci-kruna-objasni
        vrsta: objasni
        tezina: lako
        pojmovi: [kralj-mihailo, papa-grgur-vii, duklja]
        pitanje: "Od koga je kralj Mihailo primio krunu i šta je to značilo za Duklju?"
        uzor: "Krunu je najverovatnije primio od rimskog pape Grgura VII, 1077. godine. Time je Duklja dobila nezavisnost."
        ideje:
          - "Krunu je najverovatnije dao papa Grgur VII."
          - "Dogodilo se 1077."
          - "Duklja je dobila nezavisnost."
        objasnjenje: "Reč „najverovatnije” je važna: izvor to ne potvrđuje sa potpunom sigurnošću."
        iz_udzbenika:
          strana: 25
          odeljak: "Pitanja za razmišljanje / Zadaci iz udžbenika"
          tekst: "Udžbenik pita od koga je Mihailo primio krunu."

      - id: l04-duklja-raska-smena-objasni
        vrsta: objasni
        tezina: tesko
        pojmovi: [duklja, raska, bodin]
        pitanje: "Zašto je primat među srpskim oblastima najpre pripao Duklji, a potom Raškoj? Objasni."
        uzor: "Duklja je iskoristila slabljenje Vizantije: posle ustanaka Stefana Vojislava i krunisanja Mihaila postala je nezavisna i proširila se pod Bodinom. Posle Bodinove smrti vođene su borbe za prevlast u Zeti i Raški, a pobedili su raški vladari. Raška, u kojoj je bila najbrojnija grupa srpskih plemena, tako je u XII veku postala središte."
        ideje:
          - "Duklja koristi slabost Vizantije i prva dobija nezavisnost."
          - "Pod Bodinom se država širi."
          - "Posle njegove smrti počinju borbe za prevlast."
          - "Pobeđuju raški vladari; Raška postaje središte u XII veku."
        objasnjenje: "Primat zavisi od prilike i snage, a ne od toga ko je prvi."
        iz_udzbenika:
          strana: 25
          odeljak: "Razvoj države u Duklji"
          tekst: "Duklja je prva izborila nezavisnost, a posle borbi raški vladari su pobedili i Raška je u XII veku postala središte."

  - naslov: "Iz istorijskih izvora"
    zadaci:
      - id: l04-boris-osveta-izvor
        vrsta: izvor
        tezina: lako
        pojmovi: [mihajlo-boris, presijam, bugari]
        izvor:
          autor: "Konstantin VII Porfirogenit"
          naslov: "Spis o narodima"
          tekst: "Bugarski vladar Mihajlo Boris krenuo je na srpske knezove želeći da se osveti za poraz svog oca kod Presijama."
          napomena: "Odlomak je prepričan; udžbenik, str. 24–25."
        pitanje: "Zašto je Boris napao Srbe?"
        odgovori:
          - {tekst: "Da se osveti za očev poraz", tacan: true}
          - {tekst: "Da im donese hrišćanstvo", tacan: false, zasto: "Izvor navodi osvetu, a ne širenje vere."}
          - {tekst: "Da im pomogne protiv Vizantije", tacan: false, zasto: "Napao ih je, pa ne može biti reč o pomoći."}
          - {tekst: "Zato što su mu zarobili sina", tacan: false, zasto: "Sin je zarobljen tek u toku ovog pohoda, kao posledica napada."}
        pomoc:
          - "Pročitaj kraj rečenice."
          - "Koga su Srbi porazili kod Presijama?"
          - "Iz lekcije: napao ih je da bi se osvetio za poraz svog oca kod Presijama."
        objasnjenje: "Boris je došao da osveti očev poraz kod Presijama."
        iz_udzbenika:
          strana: 24
          odeljak: "Iz istorijskih izvora"
          tekst: "Bugarski vladar Mihajlo Boris napao je Srbe da bi se osvetio za poraz svog oca kod Presijama."

      - id: l04-sinovi-izvor
        vrsta: izvor
        tezina: lako
        pojmovi: [mutimir, strojimir, gojnik, knez-vlastimir]
        izvor:
          autor: "Konstantin VII Porfirogenit"
          naslov: "Spis o narodima"
          tekst: "Kada je Vlastimir umro, njegova trojica sinova, Mutimir, Strojimir i Gojnik, podelili su zemlju i vlast."
          napomena: "Odlomak je prepričan; udžbenik, str. 24–25."
        pitanje: "Kako je posle Vlastimirove smrti uređena vlast?"
        odgovori:
          - {tekst: "Sinovi su podelili zemlju i vlast", tacan: true}
          - {tekst: "Vlast je preuzeo najstariji sin sam", tacan: false, zasto: "Izvor kaže da su trojica podelila vlast."}
          - {tekst: "Vlast je preuzeo bugarski vladar", tacan: false, zasto: "Bugari su kasnije napali, ali su odbijeni; vlast je ostala kod sinova."}
          - {tekst: "Zemlju je dobio vizantijski car", tacan: false, zasto: "Izvor ne govori o caru, već o Vlastimirovim sinovima."}
        pomoc:
          - "Pronađi broj sinova."
          - "Šta su uradili sa zemljom?"
          - "Iz lekcije: Mutimir, Strojimir i Gojnik podelili su zemlju i vlast."
        objasnjenje: "Vlast se delila među sinovima, što je drugačije od kasnijeg nasleđivanja jednog naslednika."
        iz_udzbenika:
          strana: 24
          odeljak: "Iz istorijskih izvora"
          tekst: "Po Vlastimirovoj smrti trojica sinova, Mutimir, Strojimir i Gojnik, podelila su zemlju i vlast."

      - id: l04-mir-izvor
        vrsta: izvor
        tezina: srednje
        pojmovi: [mihajlo-boris, bugari]
        izvor:
          autor: "Konstantin VII Porfirogenit"
          naslov: "Spis o narodima"
          tekst: "Srbi su Borisa toliko pritisnuli da su mu u ropstvo pali sin Vladimir i dvanaest velikih boljara. Zbog sina je, i protiv svoje volje, sklopio mir."
          napomena: "Odlomak je prepričan; udžbenik, str. 24–25."
        pitanje: "Zašto je Boris sklopio mir?"
        odgovori:
          - {tekst: "Zato što su mu sin i boljari bili u ropstvu", tacan: true}
          - {tekst: "Zato što je pobedio", tacan: false, zasto: "Bio je pritisnut i nevoljno je sklopio mir; to nije pobednik."}
          - {tekst: "Zato što ga je na to nagovorio vizantijski car", tacan: false, zasto: "Izvor car Vizantije ovde ne pominje."}
          - {tekst: "Zato što je voleo Srbe", tacan: false, zasto: "Mir je sklopio „protiv svoje volje”, posle poraza."}
        pomoc:
          - "Ko je pao u ropstvo?"
          - "Šta znači „protiv svoje volje”?"
          - "Iz lekcije: zbog sina je nevoljno sklopio mir."
        objasnjenje: "Zarobljavanje sina i boljara primoralo je Borisa na mir."
        iz_udzbenika:
          strana: 25
          odeljak: "Iz istorijskih izvora"
          tekst: "Srbi su zarobili Borisovog sina Vladimira i dvanaest velikih boljara, pa je zbog sina nevoljno sklopio mir."

      - id: l04-pratnja-izvor
        vrsta: izvor
        tezina: srednje
        pojmovi: [mihajlo-boris, ras, mutimir]
        izvor:
          autor: "Konstantin VII Porfirogenit"
          naslov: "Spis o narodima"
          tekst: "Bojeći se zasede na povratku, Boris je zatražio pratnju. Do granice, do Rasa, bezbedno su ga ispratili Mutimirovi sinovi, Borena i Stevan."
          napomena: "Odlomak je prepričan; udžbenik, str. 24–25."
        pitanje: "Šta nam ovaj odlomak govori o odnosu snaga posle mira?"
        odgovori:
          - {tekst: "Bugarski vladar se plašio Srba i tražio njihovu zaštitu, pa su u tom trenutku Srbi bili jača strana", tacan: true}
          - {tekst: "Srbi su bili potčinjeni Borisu i morali su da ga služe", tacan: false, zasto: "Pratnja je usluga koju je tražio pobeđeni, a ne služba pobedniku."}
          - {tekst: "Boris je osvojio Ras", tacan: false, zasto: "Do Rasa je ispraćen kao do granice, a ne kao osvajač."}
          - {tekst: "Srbi i Bugari su se ujedinili u jednu državu", tacan: false, zasto: "Izvor govori o granici između njih, dakle o dve države."}
        pomoc:
          - "Ko traži pratnju, jači ili slabiji?"
          - "Šta znači da neko strahuje od zasede?"
          - "Iz lekcije: Boris je tražio pratnju, a ispratili su ga Borena i Stevan."
        objasnjenje: "Sam čin traženja pratnje otkriva da je Boris bio slabija strana."
        iz_udzbenika:
          strana: 25
          odeljak: "Iz istorijskih izvora"
          tekst: "Plašeći se zasede, Boris je tražio pratnju; do Rasa su ga ispratili Mutimirovi sinovi, Borena i Stevan."

      - id: l04-ras-granica-izvor
        vrsta: izvor
        tezina: srednje
        pojmovi: [ras, raska]
        izvor:
          autor: "Konstantin VII Porfirogenit"
          naslov: "Spis o narodima"
          tekst: "Do granice, do Rasa, bugarskog vladara su bezbedno ispratili sinovi srpskog vladara."
          napomena: "Odlomak je prepričan; udžbenik, str. 24–25."
        pitanje: "Šta iz ovog podatka saznajemo o Rasu u IX veku?"
        odgovori:
          - {tekst: "Bio je na granici srpske oblasti prema Bugarima", tacan: true}
          - {tekst: "Bio je glavni grad Bugarske", tacan: false, zasto: "Ras se navodi kao mesto do kog su ga ispratili Srbi, na granici; to nije bugarska prestonica."}
          - {tekst: "Bio je na obali Jadrana", tacan: false, zasto: "Izvor govori o međi Srba i Bugara, a Jadran je na suprotnoj strani srpskih oblasti."}
          - {tekst: "Bio je vizantijski grad na Dunavu", tacan: false, zasto: "Izvor ga vezuje za srpsko-bugarsku granicu, a ne za Dunav."}
        pomoc:
          - "Ponovo pročitaj: „do granice, do Rasa”."
          - "Između koga je ta granica?"
          - "Iz lekcije: do granice, do Rasa, ispratili su ga sinovi Mutimira."
        objasnjenje: "Ras se javlja kao mesto na srpsko-bugarskoj granici."
        iz_udzbenika:
          strana: 25
          odeljak: "Iz istorijskih izvora"
          tekst: "Do granice, do Rasa, Borisa su ispratili sinovi Mutimira."

      - id: l04-danak-izvor
        vrsta: izvor
        tezina: tesko
        pojmovi: [mihajlo-boris, bugari, mutimir]
        izvor:
          autor: "Konstantin VII Porfirogenit"
          naslov: "Spis o narodima"
          tekst: "Za uslugu im je Boris dao bogate poklone, a oni njemu dva roba, dva sokola, dva psa i devedeset koža. Bugari su to posle tumačili kao ugovoreni danak."
          napomena: "Odlomak je prepričan; udžbenik, str. 24–25."
        pitanje: "Šta ovaj odlomak pokazuje o tome kako ista stvar može da se tumači?"
        odgovori:
          - {tekst: "Razmena poklona u kojoj su Srbi bili pobednici mogla je kod Bugara da se predstavi kao danak", tacan: true}
          - {tekst: "Srbi su zaista bili potčinjeni i plaćali danak", tacan: false, zasto: "Izvor kaže da su to Bugari tumačili; ispred toga stoji razmena poklona posle srpske pobede."}
          - {tekst: "Bugari su Srbima plaćali danak", tacan: false, zasto: "Boris je dao poklone za uslugu pratnje; reč danak potiče od bugarskog tumačenja darova koje su Srbi njemu dali."}
          - {tekst: "Izvor je nepouzdan jer ga je pisao Bugarin", tacan: false, zasto: "Spis je napisao vizantijski car Konstantin VII, a ne Bugarin."}
        pomoc:
          - "Ko kaže da je to danak?"
          - "Kakav je bio ishod rata pre razmene?"
          - "Iz lekcije: Bugari su to tumačili kao ugovoreni danak."
        objasnjenje: "Pobeđeni može da pretvori poklon u znak svoje nadmoći: zato izvore čitamo kritički."
        iz_udzbenika:
          strana: 25
          odeljak: "Iz istorijskih izvora"
          tekst: "Boris im je dao bogate poklone, a oni njemu dva roba, dva sokola, dva psa i devedeset koža; Bugari su to tumačili kao danak."

      - id: l04-vizantijski-pogled-izvor
        vrsta: izvor
        tezina: tesko
        pojmovi: [konstantin-vii-porfirogenit, spis-o-narodima, bugari]
        izvor:
          autor: "Konstantin VII Porfirogenit"
          naslov: "Spis o narodima"
          tekst: "Vizantijski car opisuje kako su Srbi pritisnuli bugarskog vladara i zarobili mu sina, i kako su Bugari kasnije predstavljali razmenu poklona."
          napomena: "Odlomak je prepričan; udžbenik, str. 24–25."
        pitanje: "Zašto je za nas važno što ovaj spor ne opisuje ni Srbin ni Bugarin, nego vizantijski car?"
        odgovori:
          - {tekst: "Pisac je treća strana, ali ima sopstveni pogled, pa ga treba čitati sa oprezom", tacan: true}
          - {tekst: "To dokazuje da izvor ne može biti pogrešan", tacan: false, zasto: "I vizantijski pisac je čovek sa svojim stavovima i piše vek posle događaja."}
          - {tekst: "To znači da je bio očevidac", tacan: false, zasto: "Pisao je u X veku, a događaj je iz IX veka."}
          - {tekst: "To znači da nije znao ništa o Srbima", tacan: false, zasto: "Baš suprotno: on je glavni izvor o Srbima tog doba."}
        pomoc:
          - "Ko su ovde učesnici, a ko pripoveda?"
          - "Uporedi doba pisanja i doba događaja."
          - "Iz lekcije: spis je napisao Konstantin VII u X veku, o sukobima iz IX veka."
        objasnjenje: "Treća strana može da vidi šire, ali nije bez svoje perspektive; dobar čitalac to uvek ima na umu."
        iz_udzbenika:
          strana: 24
          odeljak: "Iz istorijskih izvora"
          tekst: "Konstantin VII Porfirogenit u Spisu o narodima opisuje sukobe Srba i Bugara u IX veku."

      - id: l04-presijam-lanac
        vrsta: lanac
        tezina: lako
        pojmovi: [presijam, mihajlo-boris]
        karike:
          - "Borisov otac je poražen kod Presijama"
          - "?"
          - "Srbi zarobljavaju Borisovog sina"
        praznina: 1
        odgovori:
          - {tekst: "Boris napada Srbe da se osveti", tacan: true}
          - {tekst: "Boris šalje mirovne poslanike", tacan: false, zasto: "Boris je krenuo u osvetu, a na mir je pristao tek posle poraza."}
          - {tekst: "Mutimir se povlači u Azovsko more", tacan: false, zasto: "Mutimir nije bežao; Srbi su pritisnuli Bugare."}
        pomoc:
          - "Korak 1: Šta vladar želi posle očevog poraza?"
          - "Korak 2: Protiv koga je krenuo?"
          - "Iz lekcije: poraz Borisovog oca kod Presijama → Borisov napad na Srbe."
        objasnjenje: "Poraz oca vodi u Borisov osvetnički pohod, u kome mu Srbi zarobljavaju sina."
        iz_udzbenika:
          strana: 24
          odeljak: "Iz istorijskih izvora"
          tekst: "Boris je napao Srbe da bi se osvetio za poraz svog oca kod Presijama."

      - id: l04-sin-mir-lanac
        vrsta: lanac
        tezina: srednje
        pojmovi: [mihajlo-boris, bugari, ras]
        karike:
          - "Boris napada Srbe"
          - "Srbi zarobljavaju njegovog sina i boljare"
          - "?"
          - "Borisa do granice prate Mutimirovi sinovi"
        praznina: 2
        odgovori:
          - {tekst: "Boris nevoljno sklapa mir", tacan: true}
          - {tekst: "Boris osvaja Ras", tacan: false, zasto: "Do Rasa je ispraćen, a nije ga osvojio."}
          - {tekst: "Srbi ga zarobljavaju", tacan: false, zasto: "Zarobljen mu je sin, a on je ispraćen do granice."}
        pomoc:
          - "Korak 1: Šta otac radi kad mu je sin u ropstvu?"
          - "Korak 2: Šta dolazi pre ispraćaja?"
          - "Iz lekcije: zarobljavanje sina → mir."
        objasnjenje: "Bez mira ne bi bilo ni ispraćaja do granice."
        iz_udzbenika:
          strana: 25
          odeljak: "Iz istorijskih izvora"
          tekst: "Zarobljavanje sina primoralo je Borisa na mir, a posle mira je ispraćen do Rasa."

      - id: l04-sukob-poredjaj
        vrsta: poredjaj
        tezina: srednje
        pojmovi: [mihajlo-boris, mutimir, ras]
        pitanje: "Poređaj tok sukoba iz izvora, od početka do kraja."
        stavke:
          - {tekst: "Vlastimirovi sinovi dele zemlju i vlast"}
          - {tekst: "Boris napada Srbe"}
          - {tekst: "Srbi mu zarobljavaju sina i boljare"}
          - {tekst: "Boris sklapa mir"}
          - {tekst: "Borena i Stevan ga prate do Rasa"}
          - {tekst: "Bugari i Srbi razmenjuju poklone"}
        pomoc:
          - "Podela vlasti je pre rata."
          - "Pokloni su za uslugu pratnje, pa dolaze na kraju."
          - "Iz lekcije: podela, napad, zarobljavanje, mir, pratnja, pokloni."
        objasnjenje: "Sled je: podela vlasti → napad → zarobljavanje → mir → pratnja → pokloni."
        iz_udzbenika:
          strana: 25
          odeljak: "Iz istorijskih izvora"
          tekst: "Izvor opisuje podelu vlasti, Borisov napad, zarobljavanje sina, mir, ispraćaj do Rasa i razmenu poklona."

      - id: l04-sukob-dopuni
        vrsta: dopuni
        tezina: srednje
        pojmovi: [mutimir, strojimir, gojnik, mihajlo-boris, presijam]
        pitanje: "Dopuni sažetak izvora."
        tekst: "Po Vlastimirovoj smrti sinovi {{Mutimir}}, Strojimir i {{Gojnik}} podelili su zemlju. Bugarski vladar {{Mihajlo Boris}} napao ih je da osveti očev poraz kod {{Presijama}}."
        ponudjene: [Mutimir, Gojnik, Mihajlo Boris, Presijama, Simeon, Augzburga]
        pomoc:
          - "Simeon je vladao kasnije."
          - "Augzburg je mesto bitke sa Mađarima."
          - "Iz lekcije: Mutimir, Strojimir, Gojnik; Mihajlo Boris; Presijam."
        objasnjenje: "Izvor o sukobu počinje podelom vlasti među Vlastimirovim sinovima i Borisovim osvetničkim pohodom."
        iz_udzbenika:
          strana: 24
          odeljak: "Iz istorijskih izvora"
          tekst: "Vlastimirovi sinovi podelili su zemlju, a Mihajlo Boris ih je napao zbog poraza svog oca kod Presijama."

      - id: l04-licnosti-izvora-povezi
        vrsta: povezi
        tezina: srednje
        pojmovi: [mutimir, mihajlo-boris, presijam, ras]
        pitanje: "Poveži ličnost ili mesto iz izvora sa podatkom."
        parovi:
          - ["Mihajlo Boris", "Bugarski vladar koji je napao Srbe"]
          - ["Vladimir", "Borisov sin, zarobljen od Srba"]
          - ["Borena i Stevan", "Mutimirovi sinovi koji su pratili Borisa"]
          - ["Presijam", "Mesto poraza Borisovog oca"]
          - ["Ras", "Mesto na granici do kog je Boris ispraćen"]
        pomoc:
          - "Dva pojma su mesta."
          - "Pazi: Vladimir je ovde Bugarin, a ne dukljanski knez."
          - "Iz lekcije: Boris, sin Vladimir, Borena i Stevan, Presijam, Ras."
        objasnjenje: "Izvor spaja bugarske i srpske ličnosti i mesta u jednu priču o sukobu."
        iz_udzbenika:
          strana: 25
          odeljak: "Iz istorijskih izvora"
          tekst: "Izvor navodi Borisa, njegovog sina Vladimira, Borenu i Stevana, Presijam i Ras."

      - id: l04-spis-pisac-tn
        vrsta: tacno_netacno
        tezina: lako
        pojmovi: [spis-o-narodima, konstantin-vii-porfirogenit]
        tvrdnja: "Spis o narodima napisao je car Konstantin VII Porfirogenit."
        tacno: true
        pomoc:
          - "Taj car je glavni izvor o doseljavanju Srba."
          - "Iz lekcije: odlomak je iz dela Spis o narodima cara Konstantina VII Porfirogenita."
        objasnjenje: "Tačno. Spis o narodima je delo Konstantina VII Porfirogenita."
        iz_udzbenika:
          strana: 24
          odeljak: "Iz istorijskih izvora"
          tekst: "Odlomak je iz dela Spis o narodima cara Konstantina VII Porfirogenita."

      - id: l04-boris-pobednik-tn
        vrsta: tacno_netacno
        tezina: srednje
        pojmovi: [mihajlo-boris, bugari]
        tvrdnja: "Prema Spisu o narodima, Boris je pobedio Srbe i odveo Mutimirove sinove u ropstvo."
        tacno: false
        ispravke:
          - {tekst: "Srbi su pritisli Bugare i zarobili Borisovog sina i boljare; Mutimirovi sinovi su ga ispratili do granice.", tacan: true}
          - {tekst: "Boris i Srbi nisu ni ratovali.", tacan: false, zasto: "Boris ih je napao, a pritisak Srba doveo je do zarobljavanja."}
          - {tekst: "Mutimirove sinove zarobio je vizantijski car.", tacan: false, zasto: "Mutimirovi sinovi su bili slobodni i pratili su Borisa."}
        pomoc:
          - "Ko je kome zarobio sina?"
          - "Ko je tražio pratnju?"
          - "Iz lekcije: u ropstvo su pali Borisov sin i boljari."
        objasnjenje: "Netačno. Srbi su pobedili, a Boris je zatražio mir i pratnju."
        iz_udzbenika:
          strana: 25
          odeljak: "Iz istorijskih izvora"
          tekst: "Srbi su pritisnuli Borisa; u ropstvo su mu pali sin i dvanaest boljara."

      - id: l04-darovi-uporedi
        vrsta: uporedi
        tezina: srednje
        pojmovi: [mihajlo-boris, mutimir]
        a: "Dali su Bugari"
        b: "Dali su Srbi"
        pitanje: "Ko je šta dao pri razmeni poklona posle ispraćaja?"
        tvrdnje:
          - {tekst: "Bogate poklone za uslugu.", odgovor: a, zasto: "Boris je dao bogate poklone za pratnju."}
          - {tekst: "Dva roba i dva sokola.", odgovor: b, zasto: "To su dali Srbi Borisu."}
          - {tekst: "Dva psa i devedeset koža.", odgovor: b, zasto: "I to je srpski uzvratni dar."}
          - {tekst: "Zlatnu krunu iz Rima.", odgovor: nijedan, zasto: "Kruna je vezana za Mihaila 1077, a ne za ovaj događaj."}
        pomoc:
          - "Ko je davao „bogate” poklone?"
          - "Srbi su uzvratili brojnim stvarima."
          - "Iz lekcije: Boris im je dao bogate poklone, a oni njemu dva roba, dva sokola, dva psa i devedeset koža."
        objasnjenje: "Razmena je bila obostrana, a Bugari su srpski dar kasnije tumačili kao danak."
        iz_udzbenika:
          strana: 25
          odeljak: "Iz istorijskih izvora"
          tekst: "Boris im je dao bogate poklone, a oni njemu dva roba, dva sokola, dva psa i devedeset koža."

      - id: l04-boris-ko-sam
        vrsta: ko_sam
        tezina: srednje
        pojmovi: [mihajlo-boris, presijam]
        tragovi:
          - "Bio sam bugarski vladar u IX veku."
          - "Krenuo sam da osvetim oca poraženog kod Presijama."
          - "Sin mi je pao u srpsko ropstvo, pa sam nevoljno sklopio mir."
        odgovori:
          - {tekst: "Mihajlo Boris", tacan: true}
          - {tekst: "Car Simeon", tacan: false, zasto: "Simeon je pokorio Srbiju 924; on nije nevoljno molio za mir."}
          - {tekst: "Asparuh", tacan: false, zasto: "Asparuh je doveo Bugare na Balkan, mnogo pre ovih događaja."}
        objasnjenje: "To je Mihajlo Boris, kako ga opisuje Konstantin VII Porfirogenit."
        iz_udzbenika:
          strana: 24
          odeljak: "Iz istorijskih izvora"
          tekst: "Bugarski vladar Mihajlo Boris napao je Srbe zbog poraza svog oca kod Presijama."

      - id: l04-danak-objasni
        vrsta: objasni
        tezina: tesko
        pojmovi: [mihajlo-boris, bugari, spis-o-narodima]
        pitanje: "Zašto bi Bugari razmenu poklona posle poraza tumačili kao ugovoreni danak? Objasni i reci šta to govori o izvorima."
        uzor: "Bugari su bili poraženi i Boris je morao da traži pratnju, pa su želeli da to prikažu u boljem svetlu. Ako su srpski darovi danak, ispada da su Srbi potčinjeni. To pokazuje da se isti događaj može različito tumačiti, zavisno od toga ko o njemu govori, pa izvore treba čitati pažljivo."
        ideje:
          - "Bugari su u sukobu bili poražena strana."
          - "Danak bi značio da su Srbi potčinjeni."
          - "Isti događaj različite strane tumače različito."
          - "Izvore treba čitati kritički."
        objasnjenje: "Pitanje vežba čitanje izvora: ko govori i šta time dobija."
        iz_udzbenika:
          strana: 25
          odeljak: "Iz istorijskih izvora"
          tekst: "Bugari su srpske poklone tumačili kao ugovoreni danak."

      - id: l04-sta-pokazuje-izvor-objasni
        vrsta: objasni
        tezina: srednje
        pojmovi: [mutimir, strojimir, gojnik, mihajlo-boris]
        pitanje: "Šta iz Porfirogenitove priče o Borisu saznajemo o snazi Srba u IX veku? Objasni."
        uzor: "Iako su trojica sinova podelila vlast, Srbi su pobedili bugarskog vladara i zarobili mu sina i boljare. Boris je morao da sklopi mir i da traži njihovu pratnju do granice. To pokazuje da su Srbi u IX veku bili sposobni da se odupru Bugarima."
        ideje:
          - "Vlast je bila podeljena među sinovima."
          - "Srbi su pobedili i zarobili Borisovog sina."
          - "Boris je morao da sklopi mir i da traži pratnju."
        objasnjenje: "Priča potvrđuje ono što lekcija kaže o uspešnoj odbrani od Bugara."
        iz_udzbenika:
          strana: 25
          odeljak: "Iz istorijskih izvora"
          tekst: "Izvor opisuje sukob Srba i Bugara u IX veku, u kome je Boris morao da sklopi mir."
