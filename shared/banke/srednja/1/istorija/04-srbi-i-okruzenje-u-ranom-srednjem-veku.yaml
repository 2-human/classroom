      - id: l04-vojislav-izbor
        vrsta: izbor
        tezina: lako
        pojmovi: [stefan-vojislav, vizantija]
        pitanje: "Protiv koga je Stefan Vojislav dva puta dizao ustanak?"
        odgovori:
          - {tekst: "Protiv Vizantije", tacan: true}
          - {tekst: "Protiv Mađara", tacan: false, zasto: "Sa Mađarima je ratovao Časlav u Raškoj; Vojislav je dizao ustanak protiv Vizantije."}
          - {tekst: "Protiv pape", tacan: false, zasto: "Papa je, najverovatnije, njegovom nasledniku dao krunu, pa nije bio protivnik."}
          - {tekst: "Protiv Hrvata", tacan: false, zasto: "Hrvatska država nije bila vlast nad Dukljom; od 1018. to je Vizantija."}
        pomoc:
          - "Ko je vladao Dukljom posle 1018?"
          - "Ta sila je tada slabila."
          - "Iz lekcije: Stefan Vojislav je dva puta dizao ustanak protiv Vizantije."
        objasnjenje: "Vojislav je iskoristio slabljenje Vizantije i dva puta se podigao protiv nje."
        iz_udzbenika:
          strana: 24
          odeljak: "Razvoj države u Duklji"
          tekst: "Slabljenje Vizantije iskoristio je knez Stefan Vojislav: dva puta je dizao ustanak protiv nje."

      - id: l04-kruna-izbor
        vrsta: izbor
