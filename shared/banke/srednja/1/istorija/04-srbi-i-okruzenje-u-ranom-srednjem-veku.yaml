    zadaci:
      - id: l04-glavni-izvor-izbor
        vrsta: izbor
        tezina: lako
        pojmovi: [konstantin-vii-porfirogenit, doseljavanje-srba, spis-o-narodima]
        pitanje: "Ko je ostavio glavni izvor o naseljavanju Srba na Balkanu?"
        odgovori:
          - {tekst: "Vizantijski car Konstantin VII Porfirogenit", tacan: true}
          - {tekst: "Bugarski car Simeon", tacan: false, zasto: "Simeon je vladar koji je ratovao protiv Srba; izvor je napisao vizantijski car."}
          - {tekst: "Papa Grgur VII", tacan: false, zasto: "Papa Grgur VII vezuje se za krunu kralja Mihaila 1077, a ne za pisanje o doseljavanju."}
          - {tekst: "Knez Vlastimir", tacan: false, zasto: "Vlastimir je srpski vladar o kome izvor piše, a ne pisac izvora."}
        pomoc:
          - "Pisac je car iz X veka."
          - "Delo je napisao za svog naslednika."
          - "Iz lekcije: glavni izvor dao je car Konstantin VII Porfirogenit."
        objasnjenje: "Glavni izvor o srpskom naseljavanju je delo vizantijskog cara Konstantina VII Porfirogenita, pisano za njegovog naslednika."
        iz_udzbenika:
          strana: 23
          odeljak: "Prve srpske države"
          tekst: "Glavni izvor o teritorijama srpskog naseljavanja dao je car Konstantin VII Porfirogenit (913–959), u delu za svog naslednika."
        osa: {naziv: "Vladavina Konstantina VII Porfirogenita", od: 913, do: 959, traka: vladari}

      - id: l04-iraklije-izbor
        vrsta: izbor
        tezina: lako
        pojmovi: [car-iraklije, doseljavanje-srba]
        pitanje: "Za vreme kog cara su, po Porfirogenitu, Srbi stigli na Balkan?"
        odgovori:
          - {tekst: "Cara Iraklija", tacan: true}
          - {tekst: "Cara Simeona", tacan: false, zasto: "Simeon je bugarski car iz X veka, a Srbi su stigli u VII veku."}
          - {tekst: "Konstantina VII Porfirogenita", tacan: false, zasto: "On je pisac izvora, koji živi tri veka posle doseljavanja."}
          - {tekst: "Cara Samuila", tacan: false, zasto: "Samuilo je vladar sa kraja X veka, kome se potčinio Jovan Vladimir."}
        pomoc:
          - "Traži vizantijskog cara iz VII veka."
          - "Vladao je 610–641."
          - "Iz lekcije: Srbi su stigli za vladavine cara Iraklija, sa carevim pristankom."
        objasnjenje: "Po Porfirogenitu, Srbi su stigli za vladavine cara Iraklija (610–641) i sa njegovim pristankom."
        iz_udzbenika:
          strana: 23
          odeljak: "Prve srpske države"
          tekst: "Po ovom izvoru Srbi su stigli za vladavine cara Iraklija (610–641), sa carevim pristankom."
        osa: {naziv: "Vladavina cara Iraklija", od: 610, do: 641, traka: vladari}

      - id: l04-prostor-izbor
        vrsta: izbor
        tezina: lako
        pojmovi: [doseljavanje-srba, avari]
        pitanje: "Koji prostor su Srbi dobili po Porfirogenitovom izvoru?"
        odgovori:
          - {tekst: "Od Save do Jadranskog mora", tacan: true}
          - {tekst: "Od Dunava do planine Balkan", tacan: false, zasto: "Ta zemlja se sredinom VII veka zvala Slovenska; srpski prostor izvor opisuje od Save do Jadrana."}
          - {tekst: "Između Odre i Visle", tacan: false, zasto: "To je pradomovina Slovena, odakle su Srbi došli."}
          - {tekst: "Između Urala i Kaspijskog mora", tacan: false, zasto: "To su Vrata naroda, kroz koja su prošli Huni."}
        pomoc:
          - "Južna međa je more."
          - "Severna međa je reka koja se kod Beograda uliva u Dunav."
          - "Iz lekcije: dobili su prostor od Save do Jadranskog mora."
        objasnjenje: "Srbi su dobili prostor od Save do Jadrana, koji su Avari pre toga poharali."
        iz_udzbenika:
          strana: 23
          odeljak: "Prve srpske države"
          tekst: "Srbi su dobili prostor od Save do Jadranskog mora, prazan jer su ga poharali Avari."

      - id: l04-viseslav-izbor
        vrsta: izbor
        tezina: lako
        pojmovi: [knez-viseslav, raska]
        pitanje: "Ko je prvi srpski vladar u Raškoj čije ime znamo?"
        odgovori:
          - {tekst: "Knez Višeslav", tacan: true}
          - {tekst: "Knez Časlav", tacan: false, zasto: "Časlav je oslobodio Srbiju tek 927, mnogo posle prvog poznatog vladara."}
          - {tekst: "Kralj Mihailo", tacan: false, zasto: "Mihailo je kralj Duklje iz XI veka, a ne prvi raški vladar."}
          - {tekst: "Jovan Vladimir", tacan: false, zasto: "Jovan Vladimir je dukljanski knez, poznat sa kraja X veka."}
        pomoc:
          - "Ime mu je povezano sa početkom spiska raških vladara."
          - "Posle njega dolaze Radoslav i Prosigoj."
          - "Iz lekcije: knez Višeslav je prvi srpski vladar u Raški čije ime znamo."
        objasnjenje: "Višeslav je najstariji raški vladar čije nam je ime poznato."
        iz_udzbenika:
          strana: 23
          odeljak: "Prve srpske države"
          tekst: "Knez Višeslav je prvi srpski vladar u Raški čije ime znamo."

      - id: l04-srpske-oblasti-izbor
        vrsta: izbor
        tezina: srednje
        pojmovi: [paganija, travunija, bosna, raska, zahumlje, duklja]
        pitanje: "Koje oblasti se u izvoru izričito navode kao srpske? (više tačnih)"
        odgovori:
          - {tekst: "Paganija", tacan: true}
          - {tekst: "Travunija", tacan: true}
          - {tekst: "Bosna", tacan: true}
          - {tekst: "Raška", tacan: true}
          - {tekst: "Zahumlje", tacan: false, zasto: "Za Zahumlje nema neposrednog podatka da je pripadalo srpskoj državi."}
          - {tekst: "Panonija", tacan: false, zasto: "Panonija je severno, oblast Avara i kasnije Mađara, a ne srpska sklavinija."}
        pomoc:
          - "Lekcija navodi četiri izričito srpske oblasti."
          - "Za dve oblasti (Zahumlje i Duklja) nema neposrednog podatka."
          - "Iz lekcije: Paganija, Travunija, Bosna i Raška."
        objasnjenje: "Izričito srpske su Paganija, Travunija, Bosna i Raška; za Zahumlje i Duklju neposrednog podatka nema."
        iz_udzbenika:
          strana: 23
          odeljak: "Prve srpske države"
          tekst: "Kao srpske se izričito navode Paganija, Travunija, Bosna i Raška."
          slika: 04-srbi-i-okruzenje-u-ranom-srednjem-veku/01-prve-srpske-drzave-karta.jpg

      - id: l04-najbrojniji-izbor
        vrsta: izbor
        tezina: srednje
        pojmovi: [raska, plemenska-organizacija]
        pitanje: "Šta je tačno za Rašku u prvoj polovini IX veka?"
        odgovori:
          - {tekst: "U njoj je bila najbrojnija grupa srpskih plemena, a još je trajalo staro plemensko uređenje", tacan: true}
          - {tekst: "Bila je nezavisna kraljevina sa krunom od pape", tacan: false, zasto: "Kruna od pape vezuje se za Duklju 1077; Raška u IX veku još ima plemensko uređenje."}
          - {tekst: "Bila je pod potpunom vlašću Avara", tacan: false, zasto: "Avari su pre dolaska Srba poharali te krajeve; Raška je Vizantiju priznavala nominalno."}
          - {tekst: "Bila je sedište hrvatske države", tacan: false, zasto: "Hrvatska država bila je zapadni sused, a ne vlast u Raškoj."}
        pomoc:
          - "Seti se da prve države nastaju korak po korak."
          - "Po čemu se Raška izdvajala od ostalih oblasti?"
          - "Iz lekcije: najbrojnija grupa srpskih plemena bila je u Raški, gde je trajalo staro plemensko uređenje."
        objasnjenje: "Raška je imala najviše Srba, ali je u prvoj polovini IX veka i dalje imala plemensko uređenje."
        iz_udzbenika:
          strana: 23
          odeljak: "Prve srpske države"
          tekst: "Najbrojnija grupa srpskih plemena bila je u Raški, gde je i u prvoj polovini IX veka trajalo staro plemensko uređenje."
        osa: {naziv: "Staro plemensko uređenje u Raški", od: 800, do: 850, oznaka: "prva polovina IX veka", traka: dogadjaji}

      - id: l04-zanimanja-izbor
        vrsta: izbor
        tezina: srednje
        pojmovi: [doseljavanje-srba, vizantija]
        pitanje: "Od čega su, po vizantijskim izvorima, živeli doseljeni Srbi? (više tačnih)"
        odgovori:
          - {tekst: "Od zemljoradnje", tacan: true}
          - {tekst: "Od stočarstva", tacan: true}
          - {tekst: "Od pčelarstva", tacan: true}
          - {tekst: "Od lova i ribolova", tacan: true}
          - {tekst: "Od rudarstva za izvoz srebra", tacan: false, zasto: "Lekcija rudarstvo ovde ne navodi; za doseljene Srbe spominje zemlju, stoku, pčele, lov i ribolov."}
          - {tekst: "Od prekomorske trgovine", tacan: false, zasto: "Izvori navode zanimanja vezana za zemlju i prirodu, a ne prekomorsku trgovinu."}
        pomoc:
          - "Svi tačni odgovori su vezani za zemlju i prirodu."
          - "Lekcija navodi pet zanimanja."
          - "Iz lekcije: zemljoradnja, stočarstvo, pčelarstvo, lov i ribolov."
        objasnjenje: "Doseljeni Srbi živeli su od zemljoradnje, stočarstva, pčelarstva, lova i ribolova."
        iz_udzbenika:
          strana: 23
          odeljak: "Prve srpske države"
          tekst: "Po vizantijskim izvorima doseljeni Srbi živeli su od zemljoradnje, stočarstva, pčelarstva, lova i ribolova."

      - id: l04-susedi-izbor
        vrsta: izbor
        tezina: srednje
        pojmovi: [hrvatska-drzava, madjari]
        pitanje: "Ko su bili susedi Srba na zapadu i na severu?"
        odgovori:
          - {tekst: "Na zapadu hrvatska, a na severu mađarska država", tacan: true}
          - {tekst: "Na zapadu mađarska, a na severu hrvatska država", tacan: false, zasto: "Strane su zamenjene: Hrvatska je zapadno, a Ugarska severno, što se vidi i na karti."}
          - {tekst: "Na zapadu Vizantija, a na severu Bugarska", tacan: false, zasto: "Vizantija i Bugarska su istočno i južno; zapadni sused je Hrvatska."}
          - {tekst: "Na zapadu Franačka, a na severu Avari", tacan: false, zasto: "Lekcija u ovom dobu navodi hrvatsku i mađarsku državu kao susede."}
        pomoc:
          - "Pogledaj kartu prvih srpskih država."
          - "Tamnija Ugarska je iznad srpskih oblasti."
          - "Iz lekcije: na zapadu hrvatska, na severu mađarska država."
        objasnjenje: "Na zapadu je bila hrvatska, a na severu mađarska država."
        iz_udzbenika:
          strana: 23
          odeljak: "Prve srpske države"
          tekst: "Susedi su bili hrvatska država na zapadu i mađarska država na severu."
          slika: 04-srbi-i-okruzenje-u-ranom-srednjem-veku/01-prve-srpske-drzave-karta.jpg

      - id: l04-nominalno-primena-izbor
        vrsta: izbor
        tezina: tesko
        pojmovi: [nominalna-potcinjenost, vizantija, raska]
        pitanje: "Koji primer odgovara odnosu Raške prema Vizantiji?"
        odgovori:
          - {tekst: "Knez priznaje cara kao gospodara, a sam vlada svojom zemljom kako hoće", tacan: true}
          - {tekst: "Car postavlja svoje vojnike u svako selo i naplaćuje porez", tacan: false, zasto: "To bi bila stvarna vlast, a Raška je Vizantiju priznavala samo po formi."}
          - {tekst: "Knez ne zna da carstvo postoji", tacan: false, zasto: "Knez zna i priznaje cara; poenta je da je to priznanje bez stvarne zavisnosti."}
          - {tekst: "Knez otvoreno ratuje da sruši cara u Carigradu", tacan: false, zasto: "To je otvoren rat, a nominalno priznanje znači da se vlast formalno prihvata."}
        pomoc:
          - "„Nominalno” znači po imenu, samo na rečima."
          - "Da li u takvom odnosu car stvarno odlučuje?"
          - "Iz lekcije: vlast se priznaje samo po formi, a stvarne zavisnosti nema."
        objasnjenje: "Nominalna potčinjenost je priznanje vlasti bez stvarne zavisnosti: na rečima car, a u praksi knez."
        iz_udzbenika:
          strana: 23
          odeljak: "Prve srpske države"
          tekst: "Nominalna potčinjenost znači da se vlast nekog gospodara priznaje samo po formi, a stvarne zavisnosti nema."

      - id: l04-kako-znamo-izbor
        vrsta: izbor
        tezina: tesko
        pojmovi: [konstantin-vii-porfirogenit, spis-o-narodima, doseljavanje-srba, car-iraklije]
        pitanje: "Šta treba imati na umu kada koristimo Porfirogenitovo svedočanstvo o dolasku Srba?"
        odgovori:
          - {tekst: "Pisao je u X veku o događajima iz VII veka, dakle tri veka kasnije", tacan: true}
          - {tekst: "Bio je očevidac dolaska Srba", tacan: false, zasto: "Nije mogao biti: vladao je 913–959, a Srbi su došli pod Iraklijem (610–641)."}
          - {tekst: "Bio je srpski knez koji piše o svom narodu", tacan: false, zasto: "Bio je vizantijski car i delo je pisao za svog naslednika."}
          - {tekst: "Pisao je pre dolaska Srba, kao predviđanje", tacan: false, zasto: "Pisao je posle, u X veku; opisao je događaj star tri veka."}
        pomoc:
          - "Uporedi godine Porfirogenitove i Iraklijeve vladavine."
          - "Koliko vekova ih deli?"
          - "Iz lekcije: Konstantin VII (913–959), Iraklije (610–641)."
        objasnjenje: "Glavni izvor je nastao vekovima posle događaja i potiče od vizantijskog cara, pa ga treba čitati sa tom svešću."
        iz_udzbenika:
          strana: 23
          odeljak: "Prve srpske države"
          tekst: "Konstantin VII (913–959) piše o dolasku Srba za vladavine Iraklija (610–641)."

      - id: l04-vizantija-vera-tn
        vrsta: tacno_netacno
        tezina: lako
        pojmovi: [hristijanizacija-srba, vizantija]
        tvrdnja: "Većina srpskih plemena primila je hrišćanstvo preko Vizantije."
        tacno: true
        pomoc:
          - "Seti se koja je velika hrišćanska sila bila najbliža."
          - "Iz lekcije: hrišćanstvo je većina srpskih plemena primila preko Vizantije."
        objasnjenje: "Tačno. Većina srpskih plemena primila je hrišćanstvo preko Vizantije."
        iz_udzbenika:
          strana: 23
          odeljak: "Uvod"
          tekst: "Hrišćanstvo je većina srpskih plemena primila preko Vizantije."

      - id: l04-plemena-ostaju-tn
        vrsta: tacno_netacno
        tezina: lako
        pojmovi: [plemenska-organizacija, pradomovina]
        tvrdnja: "Srbi su odmah po dolasku na Balkan ukinuli plemena i osnovali jednu državu."
        tacno: false
        ispravke:
          - {tekst: "Ostali su podeljeni na plemena, kao u pradomovini.", tacan: true}
          - {tekst: "Prihvatili su vizantijsku upravu i razišli se po gradovima.", tacan: false, zasto: "Nisu menjali način organizovanja; živeli su po plemenima u svojim oblastima."}
          - {tekst: "Podelili su se na dve države, Rašku i Duklju, još u pradomovini.", tacan: false, zasto: "Raška i Duklja su na Balkanu, a države nastaju kasnije i korak po korak."}
        pomoc:
          - "Da li se organizacija naroda menja preko noći?"
          - "Traži reč „pradomovina”."
          - "Iz lekcije: Srbi nisu menjali način organizovanja i ostali su podeljeni na plemena."
        objasnjenje: "Netačno. Plemena su ostala, a savezi i države nastali su postepeno."
        iz_udzbenika:
          strana: 23
          odeljak: "Uvod"
          tekst: "Posle naseljavanja Srbi su ostali podeljeni na plemena, kao ranije u pradomovini."

      - id: l04-cetina-tn
        vrsta: tacno_netacno
        tezina: lako
        pojmovi: [reka-cetina]
        tvrdnja: "Reka Cetina bila je zapadna međa srpskih teritorija."
        tacno: true
        pomoc:
          - "Dodatni podatak je na str. 24."
          - "Iz lekcije: Cetina je bila zapadna granica Srba."
        objasnjenje: "Tačno. Cetina se navodi kao zapadna međa srpskih teritorija."
        iz_udzbenika:
          strana: 24
          odeljak: "Prve srpske države"
          tekst: "Reka Cetina bila je zapadna međa srpskih teritorija."

      - id: l04-duklja-prva-tn
        vrsta: tacno_netacno
        tezina: lako
        pojmovi: [duklja, raska]
        tvrdnja: "Prva među srpskim oblastima izdvojila se Duklja, a primat je potom prešao na Rašku."
        tacno: true
        pomoc:
          - "Šta je sa Raškom od XII veka?"
          - "Iz lekcije: prva se izdvojila Duklja, a primat je potom prešao na Rašku."
        objasnjenje: "Tačno. Duklja je prva, a posle nje vodeća snaga postaje Raška."
        iz_udzbenika:
          strana: 23
          odeljak: "Uvod"
          tekst: "Prva među srpskim oblastima izdvojila se Duklja; primat je potom prešao na Rašku."

      - id: l04-iraklije-osvajanje-tn
        vrsta: tacno_netacno
        tezina: srednje
        pojmovi: [car-iraklije, doseljavanje-srba]
        tvrdnja: "Po Porfirogenitu, Srbi su zemlju oteli caru Irakliju u ratu."
        tacno: false
        ispravke:
          - {tekst: "Stigli su sa carevim pristankom i dobili krajeve koje su Avari poharali.", tacan: true}
          - {tekst: "Kupili su je od Vizantije za zlato.", tacan: false, zasto: "O kupovini nema reči; izvor govori o carevom pristanku."}
          - {tekst: "Dobili su je od Avara kao nagradu.", tacan: false, zasto: "Avari su te krajeve opustošili, a pristanak je dao car."}
        pomoc:
          - "Izvor piše vizantijski car, pa pazi kako prikazuje odnos cara i Srba."
          - "Zašto je zemlja bila prazna?"
          - "Iz lekcije: stigli su sa carevim pristankom; prostor su pre toga poharali Avari."
        objasnjenje: "Netačno. Po izvoru su Srbi došli sa carevim pristankom, na prostor koji su opustošili Avari."
        iz_udzbenika:
          strana: 23
          odeljak: "Prve srpske države"
          tekst: "Srbi su stigli sa carevim pristankom i dobili prostor koji su poharali Avari."
        osa: {naziv: "Vladavina cara Iraklija", od: 610, do: 641, traka: vladari}

      - id: l04-duklja-zahumlje-tn
        vrsta: tacno_netacno
        tezina: srednje
        pojmovi: [zahumlje, duklja]
        tvrdnja: "Za Zahumlje i Duklju nema neposrednog podatka da su pripadale srpskoj državi."
        tacno: true
        pomoc:
          - "Uporedi sa četiri izričito navedene oblasti."
          - "Iz lekcije: za Zahumlje i Duklju nema neposrednog podatka."
        objasnjenje: "Tačno. Izričito se kao srpske navode Paganija, Travunija, Bosna i Raška, a za ove dve oblasti neposrednog podatka nema."
        iz_udzbenika:
          strana: 23
          odeljak: "Prve srpske države"
          tekst: "Za Zahumlje i Duklju nema neposrednog podatka da su pripadale srpskoj državi."

      - id: l04-caslav-madjari-tn
        vrsta: tacno_netacno
        tezina: srednje
        pojmovi: [knez-caslav, madjari]
        tvrdnja: "Knez Časlav poginuo je u borbi protiv Bugara 927. godine."
        tacno: false
        ispravke:
          - {tekst: "Bugarsku vlast zbacio je 927, a poginuo je nešto kasnije u sukobu sa Mađarima.", tacan: true}
          - {tekst: "Poginuo je u borbi protiv Vizantije kod Carigrada.", tacan: false, zasto: "Časlav je poginuo u sukobu sa Mađarima, a ne sa Vizantijom."}
          - {tekst: "Umro je u dubokoj starosti kao kralj Duklje.", tacan: false, zasto: "Bio je knez u Srbiji, a dukljanski kralj je Mihailo, tek 1077."}
        pomoc:
          - "Godine 927. Časlav je pobedio, a nije izgubio."
          - "Ko je bio severni sused?"
          - "Iz lekcije: 927. je zbacio bugarsku vlast; poginuo je kasnije u sukobu sa Mađarima."
        objasnjenje: "Netačno. Časlav je 927. oslobodio Srbiju, a poginuo je kasnije u sukobu sa Mađarima."
        iz_udzbenika:
          strana: 24
          odeljak: "Prve srpske države"
          tekst: "Bugarsku vlast zbacio je knez Časlav 927; poginuo je nešto kasnije u sukobu sa Mađarima."
        osa: {naziv: "Časlav zbacuje bugarsku vlast", od: 927, traka: dogadjaji}

      - id: l04-bugarske-granice-tn
        vrsta: tacno_netacno
        tezina: tesko
        pojmovi: [ekspanzija, bugari, carigrad]
        tvrdnja: "Bugarska ekspanzija bila je opasna samo za Srbe, jer Bugari nikada nisu ugrozili Vizantiju."
        tacno: false
        ispravke:
          - {tekst: "Bugari su u svojim napadima dopirali sve do Carigrada, pa su ugrožavali i Vizantiju.", tacan: true}
          - {tekst: "Bugari su ratovali samo protiv Mađara.", tacan: false, zasto: "Lekcija navodi njihove ratove sa Srbima i napade do Carigrada."}
          - {tekst: "Bugari su se uvek povlačili pred Srbima i nikada ih nisu pokorili.", tacan: false, zasto: "Pod Simeonom je Srbija privremeno pala pod bugarsku vlast (924)."}
        pomoc:
          - "Pronađi dokle su stizali bugarski napadi."
          - "Carigrad je bio prestonica Vizantije."
          - "Iz lekcije: Bugari su dopirali sve do Carigrada."
        objasnjenje: "Netačno. Bugarski napadi dopirali su do Carigrada, pa je ekspanzija ugrožavala i carstvo."
        iz_udzbenika:
          strana: 24
          odeljak: "Prve srpske države"
          tekst: "U IX veku i prvim decenijama X veka Bugari su bili u ekspanziji i u napadima dopirali do Carigrada."
        osa: {naziv: "Bugarska ekspanzija", od: 800, do: 930, oznaka: "IX vek i prve decenije X veka", traka: dogadjaji}

      - id: l04-oblasti-dopuni
        vrsta: dopuni
        tezina: lako
        pojmovi: [sklavinije, raska, doseljavanje-srba]
        pitanje: "Dopuni rečenicu."
        tekst: "Srbi su, kao i druga južnoslovenska plemena, osnovali plemenske oblasti, koje se zovu {{sklavinije}}, a najbrojnija grupa bila je u {{Raškoj}}."
        ponudjene: [sklavinije, Raškoj, Panoniji, ekspanzije]
        pomoc:
          - "Prva reč je vizantijski naziv."
          - "Panonija nije srpska oblast."
          - "Iz lekcije: sklavinije; najbrojnija grupa u Raški."
        objasnjenje: "Srpske plemenske oblasti su sklavinije, a najviše Srba bilo je u Raškoj."
        iz_udzbenika:
          strana: 23
          odeljak: "Prve srpske države"
          tekst: "Srbi su osnovali sklavinije, a najbrojnija grupa bila je u Raški."

      - id: l04-simeon-caslav-dopuni
        vrsta: dopuni
        tezina: lako
        pojmovi: [car-simeon, knez-caslav, bugari]
        pitanje: "Dopuni rečenice."
        tekst: "Bugarski car {{Simeon}} privremeno je pokorio Srbiju 924, a knez {{Časlav}} je zbacio bugarsku vlast {{927}}."
        ponudjene: [Simeon, Samuilo, Časlav, Vlastimir, "927", "1077"]
        pomoc:
          - "Samuilo i 1077. pripadaju kasnijem dobu."
          - "Oslobođenje je samo tri godine posle pokoravanja."
          - "Iz lekcije: Simeon 924; Časlav 927."
        objasnjenje: "Simeonova vlast nad Srbijom trajala je kratko: od 924. do 927."
        iz_udzbenika:
          strana: 24
          odeljak: "Prve srpske države"
          tekst: "Pod Simeonom Srbija je došla pod bugarsku vlast 924, a 927. ju je zbacio knez Časlav."

      - id: l04-pojmovi-dopuni
        vrsta: dopuni
        tezina: srednje
        pojmovi: [nominalna-potcinjenost, ekspanzija]
        pitanje: "Dopuni objašnjenja pojmova."
        tekst: "Nominalna potčinjenost znači da se vlast priznaje samo po {{formi}}, a {{ekspanzija}} znači širenje, povećavanje obima ili teritorije."
        ponudjene: [formi, sili, ekspanzija, asimilacija]
        pomoc:
          - "Prva reč je suprotnost stvarnoj zavisnosti."
          - "Asimilacija je stapanje naroda, a ne širenje."
          - "Iz lekcije: nominalna potčinjenost je po formi; ekspanzija je širenje."
        objasnjenje: "Nominalno znači samo po formi; ekspanzija je širenje teritorije ili obima."
        iz_udzbenika:
          strana: 23
          odeljak: "Prve srpske države"
          tekst: "Nominalna potčinjenost je priznanje vlasti samo po formi, a ekspanzija je širenje."

      - id: l04-avari-dopuni
        vrsta: dopuni
        tezina: srednje
        pojmovi: [car-iraklije, avari]
        pitanje: "Dopuni rečenicu o dolasku Srba."
        tekst: "Za vladavine cara {{Iraklija}} Srbi dobijaju prostor od {{Save}} do Jadranskog mora, koji su ranije opustošili {{Avari}}."
        ponudjene: [Iraklija, Justinijana, Save, Dunava, Avari, Mađari]
        pomoc:
          - "Justinijan vlada u VI veku, a Srbi stižu u VII."
          - "Mađari dolaze tek krajem IX veka."
          - "Iz lekcije: Iraklije, od Save do Jadrana, Avari."
        objasnjenje: "Srbi dolaze pod Iraklijem na krajeve koje su opustošili Avari."
        iz_udzbenika:
          strana: 23
          odeljak: "Prve srpske države"
          tekst: "Srbi su pod Iraklijem dobili prostor od Save do Jadranskog mora, prazan zbog avarskih pustošenja."

      - id: l04-raska-reke-dopuni
        vrsta: dopuni
        tezina: tesko
        pojmovi: [raska, nominalna-potcinjenost, vizantija]
        pitanje: "Dopuni bez ponuđenih reči."
        tekst: "Najbrojnija grupa srpskih plemena bila je u {{Raškoj|Raški}}, koja je {{Vizantiju}} priznavala samo {{nominalno|po formi}}, a kroz koju teku reke Piva, Tara i {{Ibar}}."
        pomoc:
          - "Treća praznina je reč za priznanje samo po formi."
          - "Četvrta je reka koja se u lekciji navodi uz Pivu i Taru."
          - "Iz lekcije: Raška, nominalno priznanje Vizantije, reke Piva, Tara, Ibar."
        objasnjenje: "Raška je imala najviše Srba, a carstvo je priznavala samo po formi."
        iz_udzbenika:
          strana: 23
          odeljak: "Prve srpske države"
          tekst: "Raška se prostirala među rekama Pivom, Tarom i Ibrom i Vizantiju je priznavala samo nominalno."

      - id: l04-vladari-povezi
        vrsta: povezi
        tezina: lako
        pojmovi: [knez-viseslav, knez-vlastimir, car-simeon, knez-caslav]
        pitanje: "Poveži vladara sa podatkom."
        parovi:
          - ["Višeslav", "Prvi raški vladar čije ime znamo"]
          - ["Vlastimir", "Uspešno je odbijao bugarske napade"]
          - ["Simeon", "Bugarski car koji je pokorio Srbiju"]
          - ["Časlav", "Zbacio je bugarsku vlast 927."]
        pomoc:
          - "Jedan vladar nije srpski."
          - "Oslobodilac dolazi posle pokoritelja."
          - "Iz lekcije: Višeslav prvi poznat, Vlastimir odbija Bugare, Simeon pokorava, Časlav oslobađa."
        objasnjenje: "Prati tok: Višeslav prvi poznat, Vlastimir odbija Bugare, Simeon pokorava Srbiju, a Časlav je oslobađa."
        iz_udzbenika:
          strana: 24
          odeljak: "Prve srpske države"
          tekst: "Lekcija opisuje Višeslava, Vlastimira, Simeona i Časlava."

      - id: l04-pojmovi-povezi
        vrsta: povezi
        tezina: srednje
        pojmovi: [nominalna-potcinjenost, ekspanzija, sklavinije, pradomovina, reka-cetina]
        pitanje: "Poveži pojam sa objašnjenjem."
        parovi:
          - ["Nominalna potčinjenost", "Priznanje vlasti samo po formi"]
          - ["Ekspanzija", "Širenje teritorije ili obima"]
          - ["Sklavinije", "Slovenske plemenske oblasti"]
          - ["Pradomovina", "Zemlja iz koje su Sloveni došli"]
          - ["Cetina", "Zapadna međa srpskih teritorija"]
        pomoc:
          - "Jedan pojam je reka."
          - "Nominalno znači samo po imenu."
          - "Iz lekcije: nominalna potčinjenost, ekspanzija, sklavinije."
        objasnjenje: "Ovi pojmovi su ključ lekcije: kako su Srbi bili organizovani i u kakvom odnosu sa susedima."
        iz_udzbenika:
          strana: 23
          odeljak: "Prve srpske države"
          tekst: "Lekcija objašnjava nominalnu potčinjenost i ekspanziju, sklavinije i međe srpskih oblasti."

      - id: l04-uzroci-povezi
        vrsta: povezi
        tezina: tesko
        pojmovi: [avari, car-simeon, knez-caslav, plemenski-savezi]
        pitanje: "Poveži uzrok sa posledicom."
        parovi:
          - ["Avari pustoše krajeve između Save i Jadrana", "Car Iraklije ih prepušta Srbima"]
          - ["Plemenske celine se povezuju", "Nastaju savezi i prve države"]
          - ["Bugarska ekspanzija pod Simeonom", "Srbija pada pod bugarsku vlast"]
          - ["Časlavova akcija 927.", "Kraj bugarske vlasti"]
        pomoc:
          - "Svaki uzrok je iz drugog veka ili teme."
          - "Prati jednu nit: Avari, plemena, Bugari."
          - "Iz lekcije: Avari → prazna zemlja; povezivanje → države; Simeon → 924; Časlav → 927."
        objasnjenje: "Prazna zemlja omogućava naseljavanje, povezivanje plemena stvara države, a bugarski pritisak i otpor određuju X vek."
        iz_udzbenika:
          strana: 24
          odeljak: "Prve srpske države"
          tekst: "Lekcija povezuje pustošenje Avara, povezivanje plemena, bugarsku ekspanziju i Časlavovo oslobođenje."

      - id: l04-prazna-zemlja-zakljuci
        vrsta: zakljuci
        tezina: lako
        pojmovi: [avari, doseljavanje-srba]
        pitanje: "Zašto je prostor od Save do Jadrana bio slobodan za Srbe?"
        odgovori:
          - {tekst: "Avari su ga pre toga poharali i opustošili", tacan: true}
          - {tekst: "Bio je pod vodom i tek se osušio", tacan: false, zasto: "Prostor je bio prazan zbog pustošenja, a ne zbog prirode."}
          - {tekst: "Svi tamošnji stanovnici otišli su u Aziju", tacan: false, zasto: "Izvor kaže da su ga poharali Avari, a ne da su ljudi otišli u Aziju."}
          - {tekst: "Mađari su ga već napustili", tacan: false, zasto: "Mađari dolaze tek krajem IX veka, kada su Srbi već odavno tamo."}
        pomoc:
          - "Korak 1: Ko je tu bio pre Srba i šta je radio?"
          - "Korak 2: Šta ostaje iza pustošenja?"
          - "Iz lekcije: prostor je bio prazan jer su ga pre toga poharali Avari."
        objasnjenje: "Avari su opustošili te krajeve, pa je car mogao da ih prepusti Srbima."
        iz_udzbenika:
          strana: 23
          odeljak: "Prve srpske države"
          tekst: "Prostor od Save do Jadrana bio je prazan jer su ga poharali Avari."

      - id: l04-carev-pristanak-zakljuci
        vrsta: zakljuci
        tezina: srednje
        pojmovi: [car-iraklije, vizantija, doseljavanje-srba]
        pitanje: "Zašto bi vizantijski car dozvolio Srbima da se nasele na pustoj zemlji?"
        odgovori:
          - {tekst: "Prazan kraj nije donosio ništa carstvu, a naseljenici koji priznaju cara su bolji od pustoši i Avara", tacan: true}
          - {tekst: "Zato što su Srbi već bili pravoslavni", tacan: false, zasto: "Hrišćanstvo Srbi primaju kasnije, preko Vizantije; raskola 1054. još nema."}
          - {tekst: "Zato što je Irakliju ta zemlja bila potpuno nepoznata", tacan: false, zasto: "Bila je vizantijska, inače car ne bi ni davao pristanak."}
          - {tekst: "Zato što je time hteo da osnuje srpsku kraljevinu", tacan: false, zasto: "Kraljevina se javlja tek u Duklji 1077; Srbi su živeli u plemenima."}
        pomoc:
          - "Korak 1: Šta se desi sa zemljom koju su pregazili Avari?"
          - "Korak 2: Šta caru donosi naseljen kraj, makar nominalno pod njim?"
          - "Iz lekcije: car je dao pristanak, a zemlja je bila opustošena; Srbi su Vizantiju priznavali."
        objasnjenje: "Za cara je naseljen kraj sa nominalno potčinjenim stanovništvom bolji od pustoši izložene Avarima."
        iz_udzbenika:
          strana: 23
          odeljak: "Prve srpske države"
          tekst: "Sa carevim pristankom Srbi su dobili opustošeni prostor i formalno priznavali Vizantiju."

      - id: l04-malo-znamo-zakljuci
        vrsta: zakljuci
        tezina: srednje
        pojmovi: [knez-viseslav, knez-vlastimir]
        pitanje: "Zašto o Višeslavu znamo gotovo samo ime, a o Vlastimiru mnogo više?"
        odgovori:
          - {tekst: "Podaci o srpskoj istoriji postaju bogatiji tek od Vlastimirovog doba", tacan: true}
          - {tekst: "Višeslav je vladao samo jedan dan", tacan: false, zasto: "O dužini vladavine lekcija ništa ne kaže; razlika je u izvorima."}
          - {tekst: "Višeslav je bio bugarski, a ne srpski vladar", tacan: false, zasto: "Lekcija ga izričito zove prvim srpskim vladarom u Raški."}
          - {tekst: "Vlastimir je sam napisao svoju biografiju", tacan: false, zasto: "Podatke imamo iz stranih izvora, poput Porfirogenitovog."}
        pomoc:
          - "Korak 1: Od čega zavisi šta znamo o prošlosti?"
          - "Korak 2: Od koga podaci postaju bogatiji?"
          - "Iz lekcije: o tom razdoblju se malo zna; podaci postaju bogatiji tek uz kneza Vlastimira."
        objasnjenje: "Znanje o prošlosti zavisi od izvora: što su kasniji, to su bogatiji."
        iz_udzbenika:
          strana: 23
          odeljak: "Prve srpske države"
          tekst: "O tom razdoblju se malo zna; podaci postaju bogatiji tek uz kneza Vlastimira."

      - id: l04-simeon-caslav-godine-zakljuci
        vrsta: zakljuci
        tezina: srednje
        pojmovi: [car-simeon, knez-caslav]
        pitanje: "Uporedi godine Simeonove vladavine (893–927) i Časlavovog oslobođenja (927). Šta uočavaš?"
        odgovori:
          - {tekst: "Bugarska vlast je zbačena iste godine kada se završava Simeonova vladavina", tacan: true}
          - {tekst: "Časlav je oslobodio Srbiju dok je Simeon bio dete", tacan: false, zasto: "Simeon je 927. završio vladavinu dugu više od tri decenije."}
          - {tekst: "Simeon je vladao tek posle Časlava", tacan: false, zasto: "Simeon je počeo da vlada 893, davno pre 927."}
          - {tekst: "Između ta dva događaja proteklo je sto godina", tacan: false, zasto: "Obe godine su iste: 927."}
        pomoc:
          - "Korak 1: Koja je poslednja godina Simeonove vladavine?"
          - "Korak 2: Uporedi je sa godinom oslobođenja."
          - "Iz lekcije: Simeon 893–927; Časlav 927."
        objasnjenje: "Obe godine se poklapaju: bugarska vlast nad Srbijom pada iste godine kada Simeonova vladavina prestaje."
        iz_udzbenika:
          strana: 24
          odeljak: "Prve srpske države"
          tekst: "Simeon je vladao 893–927, a Časlav je bugarsku vlast zbacio 927."
        osa: {naziv: "Časlav zbacuje bugarsku vlast", od: 927, traka: dogadjaji}

      - id: l04-sklavinija-do-drzave-zakljuci
        vrsta: zakljuci
        tezina: tesko
        pojmovi: [plemenska-organizacija, plemenski-savezi, sklavinije]
        pitanje: "Zašto lekcija kaže da su savezi i države nastajali „korak po korak”, a ne odjednom?"
        odgovori:
          - {tekst: "Veza među plemenskim celinama bila je negde čvršća, a negde labavija, pa se povezivanje dešavalo postepeno i nejednako", tacan: true}
          - {tekst: "Zato što je Vizantija propisala tačan datum osnivanja država", tacan: false, zasto: "Vizantija je Srbima bila samo nominalni gospodar; nije im propisivala kako da se organizuju."}
          - {tekst: "Zato što se plemena nisu poznavala", tacan: false, zasto: "Bila su povezana, samo različito snažno."}
          - {tekst: "Zato što su Srbi čekali dolazak Ćirila i Metodija", tacan: false, zasto: "Lekcija povezivanje plemena ne vezuje za njih."}
        pomoc:
          - "Korak 1: Kakve su bile veze među plemenima?"
          - "Korak 2: Šta to znači za brzinu nastanka države?"
          - "Iz lekcije: veza je bila negde čvršća, negde labavija; iz toga korak po korak nastaju savezi i države."
        objasnjenje: "Država raste iz veza među plemenima, a one nisu bile jednake, pa ni proces nije bio nagao."
        iz_udzbenika:
          strana: 23
          odeljak: "Uvod"
          tekst: "Veza među plemenskim celinama bila je negde čvršća, negde labavija; iz njih su korak po korak nastali savezi i države."

      - id: l04-srbija-kao-bedem-zakljuci
        vrsta: zakljuci
        tezina: tesko
        pojmovi: [bugari, ekspanzija, knez-vlastimir, mutimir, car-simeon]
        pitanje: "Vlastimir i Mutimir su odbijali Bugare, a pod Simeonom je Srbija ipak pala. Šta je najverovatnije objašnjenje iz lekcije?"
        odgovori:
          - {tekst: "Pod najsposobnijim vladarem Simeonom bugarska sila je bila na vrhuncu ekspanzije", tacan: true}
          - {tekst: "Srbi su prestali da imaju vojsku", tacan: false, zasto: "Nema tog podatka; Časlav je već 927. zbacio bugarsku vlast, pa su imali snage."}
          - {tekst: "Vizantija je Srbiju prodala Simeonu", tacan: false, zasto: "O prodaji nema reči; lekcija razlog traži u bugarskoj ekspanziji i Simeonovoj sposobnosti."}
          - {tekst: "Bugari su došli sa Mađarima", tacan: false, zasto: "Lekcija ih ne povezuje; Mađari su sukobljeni sa Časlavom."}
        pomoc:
          - "Korak 1: Kako lekcija opisuje Simeona?"
          - "Korak 2: U kakvoj fazi je tada bila Bugarska?"
          - "Iz lekcije: Simeon je njihov najsposobniji vladar; Bugari su u ekspanziji."
        objasnjenje: "Isti protivnik postao je jači: sposoban vladar i vrhunac širenja učinili su ono što raniji napadi nisu."
        iz_udzbenika:
          strana: 24
          odeljak: "Prve srpske države"
          tekst: "Pod Vlastimirom i Mutimirom napadi su odbijani, a kad je zavladao Simeon, njihov najsposobniji vladar, Srbija je pala pod njegovu vlast."
        osa: {naziv: "Raška pada pod bugarsku vlast", od: 924, traka: dogadjaji}

      - id: l04-924-datum
        vrsta: datum
        tezina: lako
        pojmovi: [car-simeon, raska]
        dogadjaj: "Raška pada pod bugarsku vlast"
        pitanje: "Koje godine je Srbija (Raška) došla pod vlast cara Simeona?"
        godina: 924
        traka: dogadjaji
        pomoc:
