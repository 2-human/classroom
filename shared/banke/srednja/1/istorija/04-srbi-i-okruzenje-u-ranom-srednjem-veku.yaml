        pojmovi: [kralj-mihailo, papa-grgur-vii]
        pitanje: "Od koga je Mihailo najverovatnije primio krunu?"
        odgovori:
          - {tekst: "Od rimskog pape Grgura VII", tacan: true}
          - {tekst: "Od vizantijskog cara", tacan: false, zasto: "Kruna je znak nezavisnosti upravo od Vizantije, a dolazi iz Rima."}
          - {tekst: "Od bugarskog cara Samuila", tacan: false, zasto: "Samuilovo carstvo palo je još 1018, pre Mihailovog krunisanja 1077."}
          - {tekst: "Od Otona I", tacan: false, zasto: "Oton I je nemački vladar iz X veka, a krunisanje je 1077."}
        pomoc:
          - "Dolazi sa zapada."
          - "Bio je crkveni poglavar u Rimu."
          - "Iz lekcije: krunu je najverovatnije primio od rimskog pape Grgura VII."
        objasnjenje: "Mihailo je postao kralj 1077, a krunu je najverovatnije primio od pape Grgura VII."
        iz_udzbenika:
          strana: 24
          odeljak: "Razvoj države u Duklji"
          tekst: "Mihailo je postao kralj 1077; krunu je najverovatnije primio od rimskog pape Grgura VII."
          slika: 04-srbi-i-okruzenje-u-ranom-srednjem-veku/02-zetski-kralj-mihailo.jpg
        osa: {naziv: "Krunisanje kralja Mihaila", od: 1077, traka: dogadjaji}

      - id: l04-sredista-xii-izbor
        vrsta: izbor
        tezina: lako
        pojmovi: [raska, duklja]
        pitanje: "Koja oblast je u XII veku postala središte srpskih oblasti?"
        odgovori:
          - {tekst: "Raška", tacan: true}
          - {tekst: "Duklja", tacan: false, zasto: "Duklja je bila prva, ali posle Bodinove smrti primat prelazi na Rašku."}
          - {tekst: "Paganija", tacan: false, zasto: "Paganija je jedna od oblasti, ali se nije izdvojila kao središte."}
          - {tekst: "Bosna", tacan: false, zasto: "Bosnu je Bodin priključio državi, a središte je postala Raška."}
        pomoc:
          - "To je oblast sa najviše Srba."
          - "Pobedili su njeni vladari."
          - "Iz lekcije: Raška u XII veku postaje središte srpskih oblasti."
        objasnjenje: "Pobedom raških vladara u borbama posle Bodinove smrti, Raška postaje središte srpskih oblasti."
        iz_udzbenika:
          strana: 25
          odeljak: "Razvoj države u Duklji"
          tekst: "Pobedili su raški vladari, pa je Raška u XII veku postala središte srpskih oblasti."
        osa: {naziv: "Raška postaje središte srpskih oblasti", od: 1100, do: 1200, oznaka: "XII vek", traka: dogadjaji}

      - id: l04-jovan-vladimir-izbor
        vrsta: izbor
        tezina: srednje
        pojmovi: [jovan-vladimir, car-samuilo]
        pitanje: "Čiju je vlast priznao najpoznatiji dukljanski knez Jovan Vladimir?"
        odgovori:
          - {tekst: "Vlast bugarskog cara Samuila", tacan: true}
          - {tekst: "Vlast pape Grgura VII", tacan: false, zasto: "Papa je vezan za Mihaila i 1077; Jovan Vladimir je umro 1016."}
          - {tekst: "Vlast Otona I", tacan: false, zasto: "Oton I je nemački vladar koji se borio sa Mađarima; Duklja nije bila pod njim."}
          - {tekst: "Vlast kneza Časlava", tacan: false, zasto: "Časlav je raški knez iz ranijeg doba, a ne gospodar Jovana Vladimira."}
        pomoc:
          - "Traži bugarskog cara, ali ne Simeona."
          - "Njegovo carstvo je palo 1018."
          - "Iz lekcije: Jovan Vladimir je priznao vlast bugarskog cara Samuila."
        objasnjenje: "Jovan Vladimir je priznao vlast cara Samuila, čije je carstvo palo 1018."
        iz_udzbenika:
          strana: 24
          odeljak: "Razvoj države u Duklji"
          tekst: "Najpoznatiji dukljanski knez, Jovan Vladimir, priznao je vlast bugarskog cara Samuila."
        osa: {naziv: "Vladavina Jovana Vladimira", od: 990, do: 1016, oznaka: "kraj X veka – 1016", traka: vladari}

      - id: l04-objedinjene-izbor
        vrsta: izbor
        tezina: srednje
        pojmovi: [travunija, zahumlje, duklja, zeta]
        pitanje: "Koje su oblasti uz Jadran jedno vreme bile objedinjene pod dukljanskim vladarem? (više tačnih)"
        odgovori:
          - {tekst: "Travunija", tacan: true}
          - {tekst: "Zahumlje", tacan: true}
          - {tekst: "Duklja", tacan: true}
          - {tekst: "Raška", tacan: false, zasto: "Raška je u unutrašnjosti; ovde je reč o primorskim oblastima, a Srbiju pripaja kasnije Bodin."}
          - {tekst: "Bosna", tacan: false, zasto: "Bosna nije primorska oblast iz ovog niza; državi ju je pripojio Bodin."}
        pomoc:
          - "Sve tri oblasti su uz more."
          - "Raška i Bosna dolaze kasnije, pod Bodinom."
          - "Iz lekcije: Travunija, Zahumlje i Duklja."
        objasnjenje: "Travunija, Zahumlje i Duklja bile su objedinjene, a tada se za Duklju počinje koristiti i ime Zeta."
        iz_udzbenika:
          strana: 24
          odeljak: "Razvoj države u Duklji"
          tekst: "Jedno vreme su sve srpske oblasti uz Jadran, Travunija, Zahumlje i Duklja, bile objedinjene pod dukljanskim vladarem."

      - id: l04-bodin-izbor
        vrsta: izbor
        tezina: srednje
        pojmovi: [bodin, bosna]
        pitanje: "Šta je uradio Bodin, Mihailov naslednik?"
        odgovori:
          - {tekst: "Priključio je državi Bosnu i Srbiju", tacan: true}
          - {tekst: "Prvi je primio krunu od pape", tacan: false, zasto: "Krunu je primio Mihailo, njegov prethodnik."}
          - {tekst: "Priznao je vlast cara Samuila", tacan: false, zasto: "To je učinio Jovan Vladimir, pre 1016."}
          - {tekst: "Dva puta je dizao ustanak protiv Vizantije", tacan: false, zasto: "To je učinio Stefan Vojislav."}
        pomoc:
          - "Širio je državu."
          - "Duklja dobija dve nove oblasti u unutrašnjosti."
          - "Iz lekcije: Bodin je priključio državi Bosnu i Srbiju."
        objasnjenje: "Bodin je proširio državu priključivši joj Bosnu i Srbiju."
        iz_udzbenika:
          strana: 25
          odeljak: "Razvoj države u Duklji"
          tekst: "Mihailov naslednik Bodin priključio je državi Bosnu i Srbiju."

      - id: l04-kruna-znacaj-izbor
        vrsta: izbor
        tezina: tesko
        pojmovi: [kralj-mihailo, nominalna-potcinjenost, vizantija, papa-grgur-vii]
        pitanje: "Zašto je važno što je Mihailo krunu dobio verovatno iz Rima, a ne iz Carigrada?"
        odgovori:
          - {tekst: "Kruna iz Rima značila je priznanje od sile koja nije bila Vizantija, od koje se Duklja oslobađala", tacan: true}
          - {tekst: "Zato što je Duklja bila pod papskom vojskom", tacan: false, zasto: "Papa nije imao vlast nad Dukljom; dao je krunu kao priznanje."}
          - {tekst: "Zato što je Rim bio bliži Bugarskoj", tacan: false, zasto: "Bugarska nije tema: Samuilovo carstvo palo je još 1018."}
          - {tekst: "Zato što je Vizantija tada prestala da postoji", tacan: false, zasto: "Vizantija je oslabila, ali nije nestala; nezavisnost se sticala upravo od nje."}
        pomoc:
          - "Pod kim je bila Duklja pre krunisanja?"
          - "Zašto se krunom od tog gospodara ne bi dobila nezavisnost?"
          - "Iz lekcije: Mihailo je postao kralj 1077, čime je Duklja dobila nezavisnost; krunu je najverovatnije dao papa."
        objasnjenje: "Nezavisnost od Vizantije nije mogla da potvrdi Vizantija; zato je važno priznanje iz Rima."
        iz_udzbenika:
          strana: 24
          odeljak: "Razvoj države u Duklji"
          tekst: "Mihailo je postao kralj 1077, čime je Duklja dobila nezavisnost; krunu je najverovatnije primio od pape."
        osa: {naziv: "Krunisanje kralja Mihaila", od: 1077, traka: dogadjaji}

