          - {tekst: "Simeon", tacan: false, zasto: "Simeon je bugarski car, a ne pisac ovog dela."}
        objasnjenje: "To je Konstantin VII Porfirogenit, pisac Spisa o narodima."
        iz_udzbenika:
          strana: 23
          odeljak: "Prve srpske države"
          tekst: "Vizantijski car Konstantin VII Porfirogenit (913–959) pisao je delo za svog naslednika."

      - id: l04-simeon-ko-sam
        vrsta: ko_sam
        tezina: srednje
        pojmovi: [car-simeon, bugari, ekspanzija]
        tragovi:
          - "Lekcija me zove najsposobnijim vladarem svog naroda."
          - "Vladao sam od 893. do 927."
          - "Srbija je 924. privremeno došla pod moju vlast."
        odgovori:
          - {tekst: "Car Simeon", tacan: true}
          - {tekst: "Car Samuilo", tacan: false, zasto: "Samuilo je kasniji bugarski car, čije je carstvo palo 1018."}
          - {tekst: "Mihajlo Boris", tacan: false, zasto: "Mihajlo Boris je bugarski vladar iz IX veka, koga su Srbi porazili; on nije pokorio Srbiju."}
        objasnjenje: "To je bugarski car Simeon (893–927)."
        iz_udzbenika:
          strana: 24
          odeljak: "Prve srpske države"
          tekst: "Car Simeon (893–927) bio je najsposobniji bugarski vladar; Srbija je 924. došla pod njegovu vlast."
        osa: {naziv: "Vladavina cara Simeona", od: 893, do: 927, traka: vladari}

      - id: l04-caslav-ko-sam
        vrsta: ko_sam
        tezina: tesko
        pojmovi: [knez-caslav, knez-vlastimir, madjari]
        tragovi:
          - "Potičem iz roda kneza Vlastimira."
          - "Godine 927. zbacio sam tuđu vlast."
          - "Poginuo sam u sukobu sa severnim susedima."
        odgovori:
          - {tekst: "Knez Časlav", tacan: true}
          - {tekst: "Mutimir", tacan: false, zasto: "Mutimir je Vlastimirov sin koji je odbijao Bugare u IX veku; 927. oslobađa Časlav."}
          - {tekst: "Jovan Vladimir", tacan: false, zasto: "Jovan Vladimir je dukljanski knez koji je priznao vlast cara Samuila."}
        objasnjenje: "To je knez Časlav, Vlastimirov potomak."
        iz_udzbenika:
          strana: 24
          odeljak: "Prve srpske države"
          tekst: "Bugarsku vlast 927. zbacio je knez Časlav, Vlastimirov potomak, koji je poginuo u sukobu sa Mađarima."

      - id: l04-koji-izvor-objasni
        vrsta: objasni
        tezina: lako
        pojmovi: [konstantin-vii-porfirogenit, doseljavanje-srba, spis-o-narodima]
        pitanje: "Koji istorijski izvor pominje doseljavanje Srba na Balkan? Šta o tome kaže?"
        uzor: "To je delo vizantijskog cara Konstantina VII Porfirogenita, napisano u X veku za njegovog naslednika. Po njemu su Srbi došli za vladavine cara Iraklija, sa carevim pristankom. Dobili su prostor od Save do Jadranskog mora, koji su ranije opustošili Avari."
        ideje:
          - "Pisac je Konstantin VII Porfirogenit."
          - "Pisano je u X veku."
          - "Srbi stižu pod Iraklijem, sa carevim pristankom."
          - "Dobijaju prostor od Save do Jadrana."
        objasnjenje: "Odgovor imenuje pisca, doba i sadržaj izvora."
        iz_udzbenika:
          strana: 25
          odeljak: "Pitanja za razmišljanje / Zadaci iz udžbenika"
          tekst: "Udžbenik pita koji istorijski izvor pominje doseljavanje Srba na Balkan."

      - id: l04-srpske-oblasti-objasni
        vrsta: objasni
        tezina: srednje
        pojmovi: [paganija, travunija, bosna, raska, zahumlje, duklja]
        pitanje: "Nabroj srpske srednjovekovne oblasti i objasni zašto se Zahumlje i Duklja navode odvojeno."
        uzor: "Izričito se kao srpske navode Paganija, Travunija, Bosna i Raška. Za Zahumlje i Duklju nema neposrednog podatka da su pripadale srpskoj državi, pa ih pažljivi istoričar navodi odvojeno. Razlog je u izvoru, a ne u našem mišljenju."
        ideje:
          - "Paganija, Travunija, Bosna i Raška su izričito navedene."
          - "Za Zahumlje i Duklju nema neposrednog podatka."
          - "Tačnost zavisi od onoga što izvor stvarno kaže."
        objasnjenje: "Razlikovanje onoga što izvor kaže od onoga što samo pretpostavljamo osnova je istorijskog rada."
        iz_udzbenika:
          strana: 25
          odeljak: "Pitanja za razmišljanje / Zadaci iz udžbenika"
          tekst: "Udžbenik traži da nabrojiš srpske srednjovekovne oblasti."

      - id: l04-nominalna-objasni
        vrsta: objasni
        tezina: lako
        pojmovi: [nominalna-potcinjenost, raska, vizantija]
        pitanje: "Objasni svojim rečima šta je nominalna potčinjenost i navedi primer iz lekcije."
        uzor: "Nominalna potčinjenost znači da se vlast nekog gospodara priznaje samo po formi, a stvarne zavisnosti nema. Primer je Raška, koja je Vizantiju priznavala samo tako."
        ideje:
          - "Vlast se priznaje samo po formi."
          - "Stvarne zavisnosti nema."
          - "Primer je Raška prema Vizantiji."
        objasnjenje: "Dobar odgovor ima i značenje i primer."
        iz_udzbenika:
          strana: 23
          odeljak: "Prve srpske države"
          tekst: "Nominalna potčinjenost znači priznavanje vlasti samo po formi; Raška je tako priznavala Vizantiju."

      - id: l04-bugari-srbi-objasni
        vrsta: objasni
        tezina: tesko
        pojmovi: [ekspanzija, bugari, knez-vlastimir, car-simeon, knez-caslav]
        pitanje: "Opiši odnos Srba i Bugara u IX i X veku kao niz uspona i padova."
        uzor: "Bugari su u IX veku i prvim decenijama X veka bili u ekspanziji. Pod Vlastimirom i Mutimirom Srbi su njihove napade uspešno odbijali. Pod Simeonom, najsposobnijim bugarskim vladarem, Srbija je 924. privremeno pala pod bugarsku vlast. Već 927. tu vlast je zbacio knez Časlav."
        ideje:
          - "Bugarska ekspanzija u IX i ranom X veku."
          - "Vlastimir i Mutimir odbijaju napade."
          - "Simeon pokorava Srbiju 924."
          - "Časlav je oslobađa 927."
        objasnjenje: "Odnos nije jedna pobeda, nego smena sile i otpora."
        iz_udzbenika:
          strana: 24
          odeljak: "Prve srpske države"
          tekst: "Srbi su odbijali Bugare pod Vlastimirom i Mutimirom, pali pod Simeona 924. i oslobodili se pod Časlavom 927."

  - naslov: "Razvoj države u Duklji"
    zadaci:
      - id: l04-duklja-gde-izbor
        vrsta: izbor
        tezina: lako
        pojmovi: [duklja]
        pitanje: "Gde je nastala dukljanska država?"
        odgovori:
          - {tekst: "Između Boke Kotorske i reke Bojane", tacan: true}
          - {tekst: "Između Save i Dunava", tacan: false, zasto: "To je sever; Duklja je uz Jadran, na jugu srpskih oblasti."}
          - {tekst: "Između Odre i Visle", tacan: false, zasto: "To je pradomovina Slovena."}
          - {tekst: "Između Cetine i Save", tacan: false, zasto: "Cetina je zapadna međa srpskih teritorija, ali Duklja je južnije, između Boke i Bojane."}
        pomoc:
          - "Duklja je na obali Jadrana."
          - "Jedna međa je zaliv, druga reka."
          - "Iz lekcije: između Boke Kotorske i reke Bojane, zaleđe do Zete i Morače."
        objasnjenje: "Duklja je nastala između Boke Kotorske i Bojane, a zaleđe joj je dopiralo do Zete i Morače."
        iz_udzbenika:
          strana: 24
          odeljak: "Razvoj države u Duklji"
          tekst: "Dukljanska država nastala je između Boke Kotorske i reke Bojane."
