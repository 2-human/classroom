          - "Iz koje vlasti je Duklja izlazila?"
          - "Iz lekcije: Mihailo je postao kralj 1077, čime je Duklja dobila nezavisnost."
        objasnjenje: "Netačno. Krunisanje je Duklji donelo nezavisnost."
        iz_udzbenika:
          strana: 24
          odeljak: "Razvoj države u Duklji"
          tekst: "Mihailo je postao kralj 1077, čime je Duklja dobila nezavisnost."
        osa: {naziv: "Krunisanje kralja Mihaila", od: 1077, traka: dogadjaji}

      - id: l04-domaci-knezovi-tn
        vrsta: tacno_netacno
        tezina: srednje
        pojmovi: [duklja, bugari, vizantija]
        tvrdnja: "U X veku Dukljom su upravljali domaći kneževi, ali pod uticajem Bugarske i Vizantije."
        tacno: true
        pomoc:
          - "Duklja je bila između dve velike sile."
          - "Iz lekcije: domaći kneževi, ali pod uticajem Bugarske i Vizantije."
        objasnjenje: "Tačno. Vlast je bila domaća, ali zavisna od susednih sila."
        iz_udzbenika:
