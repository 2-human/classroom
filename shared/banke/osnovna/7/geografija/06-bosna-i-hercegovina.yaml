delovi:
  - naslov: Položaj i opšti podaci
    zadaci:
      - id: l06-polozaj-poluostrvo
        vrsta: izbor
        tezina: lako
        pojmovi: [bosna-i-hercegovina, balkansko-poluostrvo]
        pitanje: Na kom poluostrvu leži Bosna i Hercegovina?
        odgovori:
          - {tekst: "na Balkanskom", tacan: true}
          - {tekst: "na Apeninskom", tacan: false}
          - {tekst: "na Pirinejskom", tacan: false}
          - {tekst: "na Skandinavskom", tacan: false}
        pomoc:
          - BiH je jedna od država bivše SFRJ, kao i Srbija.
          - Traži poluostrvo na jugoistoku Evrope.
          - "Iz lekcije: BiH leži u zapadnom delu Balkanskog poluostrva."
        objasnjenje: Bosna i Hercegovina leži u zapadnom delu Balkanskog poluostrva, između Hrvatske, Srbije i Crne Gore.
        iz_udzbenika:
          strana: 24
          odeljak: Položaj
          tekst: BiH se nalazi na zapadu Balkanskog poluostrva i graniči se sa Hrvatskom, Srbijom i Crnom Gorom.
          slika: 06-bosna-i-hercegovina/01-zastava-i-polozaj-bih.jpg

      - id: l06-polozaj-zastava
        vrsta: izbor
        tezina: lako
        pojmovi: [bosna-i-hercegovina]
        pitanje: Koji opis odgovara zastavi Bosne i Hercegovine?
        odgovori:
          - {tekst: "plavo polje, žuti trougao i niz belih zvezdica", tacan: true}
          - {tekst: "crveno-plavo-bela polja sa grbom", tacan: false}
          - {tekst: "crveno polje sa žutim orlom", tacan: false}
          - {tekst: "crveno-bele kocke", tacan: false}
        pomoc:
          - Na zastavi BiH nema grba ni orla.
          - Glavna boja je plava, a na njoj su žuti oblik i bele zvezdice.
          - "Iz lekcije: zastava ima plavo polje, žuti trougao i bele zvezdice."
        objasnjenje: Zastava BiH ima plavo polje, žuti trougao i niz belih zvezdica. Crvena zastava sa orlom je albanska, a crveno-bele kocke su na hrvatskom grbu.
        iz_udzbenika:
          strana: 24
          odeljak: Opšti podaci
          tekst: Uz osnovne podatke o državi prikazana je zastava BiH — plava, sa žutim trouglom i belim zvezdicama.
          slika: 06-bosna-i-hercegovina/01-zastava-i-polozaj-bih.jpg

      - id: l06-polozaj-jezici
        vrsta: izbor
        tezina: srednje
        pojmovi: [bosna-i-hercegovina, bosnjaci, srbi, hrvati]
        pitanje: Koji su službeni jezici u Bosni i Hercegovini? (Više tačnih.)
        odgovori:
          - {tekst: bosanski, tacan: true}
          - {tekst: srpski, tacan: true}
          - {tekst: hrvatski, tacan: true}
          - {tekst: slovenački, tacan: false}
          - {tekst: albanski, tacan: false}
        pomoc:
          - Svaki od tri naroda koji žive u BiH ima svoj službeni jezik.
          - Tačna su tri jezika — po jedan za Bošnjake, Srbe i Hrvate.
          - "Iz lekcije: službeni jezici su bosanski, srpski i hrvatski."
        objasnjenje: Službeni jezici su bosanski, srpski i hrvatski — jezici tri naroda koji žive u BiH.
        iz_udzbenika:
          strana: 24
          odeljak: Opšti podaci
          tekst: BiH ima tri službena jezika — bosanski, srpski i hrvatski.

      - id: l06-polozaj-susedi
        vrsta: izbor
        tezina: srednje
        pojmovi: [bosna-i-hercegovina, srbija]
        pitanje: Sa kojim državama se graniči Bosna i Hercegovina? (Više tačnih.)
        odgovori:
          - {tekst: Hrvatska, tacan: true}
          - {tekst: Srbija, tacan: true}
          - {tekst: Crna Gora, tacan: true}
          - {tekst: Slovenija, tacan: false}
          - {tekst: Mađarska, tacan: false}
        pomoc:
          - Pogledaj kartu — BiH ima samo tri suseda.
          - Na severu i zapadu je jedna država, na istoku druga, a na jugoistoku treća.
          - "Iz lekcije: BiH leži između Hrvatske, Srbije i Crne Gore."
        objasnjenje: BiH se graniči sa Hrvatskom (sever, zapad i jug), Srbijom (istok) i Crnom Gorom (jugoistok). Slovenija i Mađarska nisu njeni susedi.
        iz_udzbenika:
          strana: 24
          odeljak: Položaj
          tekst: BiH je okružena sa tri države — Hrvatskom, Srbijom i Crnom Gorom.
          slika: 06-bosna-i-hercegovina/02-karta-entiteta-bih.jpg

      - id: l06-polozaj-tn-kontinentalna
        vrsta: tacno_netacno
        tezina: tesko
        pojmovi: [kontinentalna-zemlja, neum]
        tvrdnja: Bosna i Hercegovina je potpuno kontinentalna zemlja, bez ikakvog izlaza na more.
        tacno: false
        ispravke:
          - {tekst: "Većim delom je kontinentalna, ali kod Neuma izlazi na Jadransko more.", tacan: true}
          - {tekst: "Ima dugu, razuđenu obalu na Jadranskom moru.", tacan: false}
          - {tekst: "Izlazi na Crno more kod ušća Save.", tacan: false}
        pomoc:
          - Razmisli o razlici između „potpuno” i „većim delom” kontinentalne zemlje.
          - Postoji jedno malo primorsko mesto u BiH.
          - "Iz lekcije: BiH je većim delom kontinentalna; na Jadran izlazi samo kod Neuma."
        objasnjenje: Netačno — BiH je većim delom kontinentalna, ali ima kratak izlaz na Jadransko more kod Neuma (21 km).
        iz_udzbenika:
          strana: 24
          odeljak: Položaj
          tekst: BiH je većim delom kontinentalna zemlja; na Jadransko more izlazi samo kod Neuma.

      - id: l06-polozaj-dopuni-neum
        vrsta: dopuni
        tezina: lako
        pojmovi: [neum, jadransko-more]
        pitanje: Dopuni rečenicu rečima iz banke.
        tekst: Bosna i Hercegovina izlazi na {{Jadransko}} more samo kod grada {{Neuma|Neum}}.
        ponudjene: [Jadransko, Neuma, Crno, Mostara]
        pomoc:
          - More je ono isto koje zapljuskuje obalu Hrvatske i Crne Gore.
          - Mostar je na reci, a ne na moru.
          - "Iz lekcije: jedini izlaz na Jadransko more je kod Neuma."
        objasnjenje: BiH izlazi na Jadransko more samo kod Neuma.
        iz_udzbenika:
          strana: 25
          odeljak: Zadatak — dopuni rečenice
          tekst: U zadatku se traži ime jedinog naselja BiH na obali Jadranskog mora — to je Neum.

      - id: l06-polozaj-dopuni-brojevi
        vrsta: dopuni
        tezina: srednje
        pojmovi: [bosna-i-hercegovina]
        pitanje: Dopuni rečenicu.
        tekst: Bosna i Hercegovina ima površinu od {{51.129|51129|51 129}} km² i oko {{3,2|3.2}} miliona stanovnika, a obala joj je duga svega {{21}} km.
        ponudjene: ["51.129", "3,2", "21", "88.499", "6,6", "210"]
        pomoc:
          - Površina BiH je nešto veća od 50.000 km².
          - Stanovnika ima malo više od tri miliona, a obala je kraća od 30 km.
          - "Iz lekcije: 51.129 km², 3,2 miliona stanovnika, 21 km obale."
        objasnjenje: BiH ima 51.129 km², oko 3,2 miliona stanovnika i samo 21 km obale kod Neuma.
        iz_udzbenika:
          strana: 24
          odeljak: Opšti podaci
          tekst: Površina BiH je 51.129 km², a broj stanovnika 3,2 miliona; obala kod Neuma duga je 21 km.

      - id: l06-polozaj-povezi-podaci
        vrsta: povezi
        tezina: lako
        pojmovi: [bosna-i-hercegovina, sarajevo, neum]
        pitanje: Poveži podatak o BiH sa vrednošću.
        parovi:
          - [glavni grad, Sarajevo]
          - [površina, "51.129 km²"]
          - [broj stanovnika, "3,2 miliona"]
          - [dužina obale, "21 km"]
        pomoc:
          - Kreni od onoga što je sigurno — glavnog grada.
          - Najveći broj je površina, a najmanji dužina obale.
          - "Iz lekcije: Sarajevo; 51.129 km²; 3,2 miliona; 21 km obale."
        objasnjenje: Glavni grad je Sarajevo, površina 51.129 km², stanovnika 3,2 miliona, a obala je duga 21 km.
        iz_udzbenika:
          strana: 24
          odeljak: Opšti podaci
          tekst: Infookvir daje osnovne podatke — Sarajevo kao glavni grad, 51.129 km² površine i 3,2 miliona stanovnika.
          slika: 06-bosna-i-hercegovina/01-zastava-i-polozaj-bih.jpg

      - id: l06-polozaj-zakljuci-kontinentalna
        vrsta: zakljuci
        tezina: srednje
        pojmovi: [kontinentalna-zemlja, neum]
        pitanje: Zašto se za BiH kaže da je „većim delom kontinentalna”, a ne potpuno kontinentalna zemlja?
        odgovori:
          - {tekst: "Ima izlaz na more, ali samo 21 km kod Neuma — zanemarljivo prema površini države.", tacan: true}
          - {tekst: "Polovina države je na obali, a polovina u unutrašnjosti.", tacan: false}
          - {tekst: "Ima veliko jezero koje se računa kao more.", tacan: false}
          - {tekst: "Reke iz BiH teku u more.", tacan: false}
        pomoc:
          - "Korak 1: Da li BiH uopšte izlazi na more? Gde?"
          - "Korak 2: Uporedi 21 km obale sa površinom od preko 51.000 km²."
          - "Iz lekcije: BiH izlazi na Jadran samo kod Neuma, na dužini od 21 km."
        objasnjenje: BiH ima izlaz na more, ali je on toliko kratak (21 km) da je skoro cela država u unutrašnjosti kopna.
        iz_udzbenika:
          strana: 24
          odeljak: Položaj
          tekst: BiH je većim delom kontinentalna zemlja — na more izlazi samo kod Neuma, obalom od 21 km.

      - id: l06-polozaj-zakljuci-split-dubrovnik
        vrsta: zakljuci
        tezina: tesko
        pojmovi: [neum, jadransko-more]
        pitanje: Put duž obale od Splita do Dubrovnika (oba grada su u Hrvatskoj) kratko prolazi kroz BiH. Zašto?
        odgovori:
          - {tekst: "Kod Neuma obala BiH prekida hrvatsku obalu na dva dela.", tacan: true}
          - {tekst: "Dubrovnik se nalazi u BiH.", tacan: false}
          - {tekst: "Put mora da obiđe Neretvu kroz Sarajevo.", tacan: false}
          - {tekst: "Hrvatska nema puteve uz more.", tacan: false}
        pomoc:
          - "Korak 1: Pronađi na karti Neum — gde je u odnosu na Split i Dubrovnik?"
          - "Korak 2: Šta se dešava sa hrvatskom obalom tamo gde BiH izlazi na more?"
          - "Iz lekcije: Neum je jedini izlaz BiH na Jadran, između dva dela hrvatske obale."
        objasnjenje: Kratka obala BiH kod Neuma prekida kontinuitet hrvatske obale, pa obalni put od Splita do Dubrovnika prolazi kroz BiH.
        iz_udzbenika:
          strana: 24
          odeljak: Položaj
          tekst: Neum leži između dva dela hrvatske obale, pa 21 km obale BiH prekida hrvatsko primorje.

      - id: l06-polozaj-klik-bih
        vrsta: karta_klik
        tezina: lako
        pojmovi: [bosna-i-hercegovina]
        pitanje: Klikni na Bosnu i Hercegovinu.
        cilj: {drzava: BIH}
        pomoc:
          - BiH je u sredini karte, između tri države.
          - Ima oblik nalik srcu ili trouglu, a skoro je odsečena od mora.
          - Klikni na državu između Hrvatske (sever i zapad), Srbije (istok) i Crne Gore (jugoistok).
        objasnjenje: Bosna i Hercegovina je između Hrvatske, Srbije i Crne Gore; na more izlazi samo kod Neuma.
        iz_udzbenika:
          strana: 24
          odeljak: Položaj
          tekst: BiH leži na zapadu Balkanskog poluostrva, okružena Hrvatskom, Srbijom i Crnom Gorom.
          slika: 06-bosna-i-hercegovina/01-zastava-i-polozaj-bih.jpg

      - id: l06-polozaj-klik-neum
        vrsta: karta_klik
        tezina: srednje
        pojmovi: [neum, jadransko-more]
        pitanje: Klikni na Neum — jedini izlaz BiH na more.
        cilj: {mesto: neum}
        pomoc:
          - Neum je na jugu BiH, na obali Jadranskog mora.
          - Traži mesto gde BiH „dodiruje” more, između dva dela hrvatske obale.
          - Klikni na obalu jugozapadno od Mostara, severozapadno od Dubrovnika.
        objasnjenje: Neum je na jugu BiH, na Jadranskom moru — tu BiH ima svoja 21 km obale.
        iz_udzbenika:
          strana: 24
          odeljak: Položaj
          tekst: Neum je jedino primorsko mesto BiH i leži između dva dela hrvatske obale.

      - id: l06-polozaj-klik-crna-gora
        vrsta: karta_klik
        tezina: srednje
        pojmovi: [bosna-i-hercegovina, maglic, volujak]
        pitanje: Klikni na susednu državu sa kojom BiH deli planine Maglić i Volujak.
        cilj: {drzava: MNE}
        pomoc:
          - Maglić i Volujak su na jugoistoku BiH.
          - Taj sused je na jugoistoku i izlazi na Jadransko more.
          - Klikni na Crnu Goru.
        objasnjenje: Maglić i Volujak leže na granici BiH i Crne Gore, na jugoistoku BiH.
        iz_udzbenika:
          strana: 24
          odeljak: Fizičko-geografske odlike
          tekst: Najviše planine BiH, Maglić i Volujak, nalaze se na jugoistoku, uz granicu sa Crnom Gorom.

      - id: l06-polozaj-gde-bih
        vrsta: gde_sam
        tezina: lako
        pojmovi: [bosna-i-hercegovina, neum, sarajevo]
        pitanje: Gde sam? Pročitaj trag i klikni državu na karti.
        cilj: {drzava: BIH}
        tragovi:
          - Imam tri službena jezika i dva entiteta.
          - Na more izlazim samo na 21 km, kod Neuma.
          - Preko mene se pružaju Dinaridi, a na istoku me od Srbije deli Drina.
          - Moj glavni grad je Sarajevo.
        objasnjenje: Bosna i Hercegovina — glavni grad Sarajevo, dva entiteta, izlaz na more samo kod Neuma.
        iz_udzbenika:
          strana: 24
          odeljak: Položaj
          tekst: BiH je planinska, većim delom kontinentalna zemlja na zapadu Balkanskog poluostrva, sa glavnim gradom Sarajevom.
          slika: 06-bosna-i-hercegovina/01-zastava-i-polozaj-bih.jpg

      - id: l06-polozaj-gde-hrvatska
        vrsta: gde_sam
        tezina: srednje
        pojmovi: [sava, una, neum, hrvati]
        pitanje: Gde sam? Pročitaj trag i klikni državu na karti.
        cilj: {drzava: HRV}
        tragovi:
          - Moju obalu na jednom mestu prekida kratka obala BiH.
          - Narod po kome se zovem jedan je od tri naroda BiH.
          - Reke Sava i Una čine granicu između mene i BiH.
          - Obavijam BiH sa severa, zapada i juga.
        objasnjenje: Hrvatska — Sava i Una su granica prema BiH, a Neum prekida hrvatsku obalu.
        iz_udzbenika:
          strana: 24
          odeljak: Fizičko-geografske odlike
          tekst: Sava čini granicu BiH prema Hrvatskoj na severu, a Una delom na severozapadu.

  - naslov: Reljef i reke
    zadaci:
      - id: l06-reljef-izbor-tip
        vrsta: izbor
        tezina: lako
        pojmovi: [dinarske-planine]
        pitanje: Kakav je reljef Bosne i Hercegovine?
        odgovori:
          - {tekst: "pretežno planinski", tacan: true}
          - {tekst: "pretežno ravničarski", tacan: false}
          - {tekst: "pretežno pustinjski", tacan: false}
          - {tekst: "pretežno močvaran", tacan: false}
        pomoc:
          - Preko BiH se pruža veliki planinski sistem.
          - Nizije postoje samo uz reke.
          - "Iz lekcije: reljef je izrazito planinski, jer ga prekrivaju Dinaridi."
        objasnjenje: Reljef BiH je izrazito planinski — preko cele zemlje pružaju se Dinarske planine.
        iz_udzbenika:
          strana: 24
          odeljak: Fizičko-geografske odlike
          tekst: BiH je planinska zemlja jer se preko cele njene teritorije pružaju Dinaridi; nizije su samo uz reke.

      - id: l06-reljef-izbor-reke
        vrsta: izbor
        tezina: srednje
        pojmovi: [sava, drina, una, vrbas, bosna-reka, neretva]
        pitanje: Koje su među najdužim rekama Bosne i Hercegovine? (Više tačnih.)
        odgovori:
          - {tekst: Vrbas, tacan: true}
          - {tekst: Neretva, tacan: true}
          - {tekst: Una, tacan: true}
          - {tekst: Morava, tacan: false}
          - {tekst: Tisa, tacan: false}
        pomoc:
          - Jedna od ovih reka dala je ime državi, ali nije ponuđena.
          - Morava i Tisa teku kroz Srbiju, ne kroz BiH.
          - "Iz lekcije: najduže reke su Sava, Drina, Una, Vrbas, Bosna i Neretva."
        objasnjenje: Najduže reke BiH su Sava, Drina, Una, Vrbas, Bosna i Neretva. Morava i Tisa su reke Srbije.
        iz_udzbenika:
          strana: 24
          odeljak: Fizičko-geografske odlike
          tekst: Najduže reke BiH su Sava, Drina, Una, Vrbas, Bosna i Neretva.
          slika: 06-bosna-i-hercegovina/02-karta-entiteta-bih.jpg

      - id: l06-reljef-tn-dinaridi
        vrsta: tacno_netacno
        tezina: lako
        pojmovi: [dinarske-planine]
        tvrdnja: Preko teritorije Bosne i Hercegovine pružaju se Dinarske planine (Dinaridi).
        tacno: true
        pomoc:
          - Planinski sistem se pruža uz Jadransko more, kroz Hrvatsku, BiH i Crnu Goru.
          - BiH je pretežno planinska upravo zbog tog sistema.
          - "Iz lekcije: preko cele BiH pružaju se Dinaridi."
        objasnjenje: Tačno — Dinaridi prekrivaju gotovo celu BiH, pa je reljef izrazito planinski.
        iz_udzbenika:
          strana: 24
          odeljak: Fizičko-geografske odlike
          tekst: Dinarske planine se pružaju preko cele teritorije BiH.

      - id: l06-reljef-tn-jahorina
        vrsta: tacno_netacno
        tezina: srednje
        pojmovi: [jahorina, maglic, volujak]
        tvrdnja: Jahorina je najviša planina Bosne i Hercegovine.
        tacno: false
        ispravke:
          - {tekst: "Jahorina je turistički najpoznatija planina; najviše su Maglić i Volujak.", tacan: true}
          - {tekst: "Jahorina je najniža planina BiH.", tacan: false}
          - {tekst: "Jahorina je planina u Srbiji.", tacan: false}
        pomoc:
          - Po čemu je Jahorina poznata — po visini ili po skijanju?
          - Najviše planine su uz granicu sa Crnom Gorom.
          - "Iz lekcije: najviše planine su Maglić i Volujak, a turistički najpoznatija je Jahorina."
        objasnjenje: Netačno — Jahorina je turistički najpoznatija planina BiH (kod Sarajeva), a najviše su Maglić i Volujak.
