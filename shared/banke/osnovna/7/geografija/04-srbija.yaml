delovi:
  - naslov: Položaj, granice i sastav
    zadaci:
      - id: l04-polozaj-izbor-glavni-grad
        vrsta: izbor
        tezina: lako
        pojmovi: [srbija, beograd]
        pitanje: Koji je glavni grad Republike Srbije?
        odgovori:
          - {tekst: Beograd, tacan: true}
          - {tekst: Novi Sad, tacan: false}
          - {tekst: Niš, tacan: false}
          - {tekst: Kragujevac, tacan: false}
        pomoc:
          - Glavni grad je najveći grad Srbije.
          - Leži na ušću Save u Dunav.
          - "Iz lekcije: glavni grad Srbije je Beograd."
        objasnjenje: Glavni grad Srbije je Beograd, na ušću Save u Dunav. Novi Sad i Niš su veliki gradovi, ali nisu prestonica.
        iz_udzbenika:
          strana: 18
          odeljak: Uvod — infokutija
          tekst: U okviru sa osnovnim podacima stoji da je glavni grad Srbije Beograd, a službeni jezik srpski.
          slika: 04-srbija/01-srbija-infografika.jpg

      - id: l04-polozaj-dopuni-infokutija
        vrsta: dopuni
        tezina: lako
        pojmovi: [srbija, beograd]
        pitanje: Dopuni rečenicu rečima iz banke.
        tekst: Srbija ima oko {{8,3|8.3}} miliona stanovnika, glavni grad joj je {{Beograd}}, a službeni jezik je {{srpski}}.
        ponudjene: ["8,3", "83", Beograd, Novi Sad, srpski, engleski]
        pomoc:
          - Broj stanovnika je između 8 i 9 miliona.
          - Glavni grad leži na ušću Save u Dunav; jezik nosi ime naroda.
          - "Iz lekcije: 8,3 miliona stanovnika, glavni grad Beograd, jezik srpski."
        objasnjenje: Srbija ima oko 8,3 miliona stanovnika, glavni grad je Beograd, a službeni jezik srpski.
        iz_udzbenika:
          strana: 18
          odeljak: Uvod — infokutija
          tekst: Infokutija navodi oko 8,3 miliona stanovnika, površinu od 88.499 km², glavni grad Beograd i srpski kao službeni jezik.
          slika: 04-srbija/01-srbija-infografika.jpg

      - id: l04-polozaj-izbor-povrsina
        vrsta: izbor
        tezina: srednje
        pojmovi: [srbija]
        pitanje: Kolika je površina Srbije prema udžbeniku?
        odgovori:
          - {tekst: "88.499 km²", tacan: true}
          - {tekst: "8.849 km²", tacan: false}
          - {tekst: "884.990 km²", tacan: false}
          - {tekst: "48.899 km²", tacan: false}
        pomoc:
          - Srbija je srednje velika evropska država — nije ni sasvim mala ni ogromna.
          - Broj ima pet cifara i počinje dvema osmicama.
          - "Iz lekcije: površina Srbije je 88.499 km²."
        objasnjenje: Srbija ima 88.499 km². Ponuđeni brojevi sa jednom cifrom više ili manje su deset puta veći ili manji.
        iz_udzbenika:
          strana: 18
          odeljak: Uvod — infokutija
          tekst: Prema infokutiji, površina Srbije je 88.499 km², a u njoj živi oko 8,3 miliona ljudi.
          slika: 04-srbija/01-srbija-infografika.jpg

      - id: l04-polozaj-dopuni-povrsina
        vrsta: dopuni
        tezina: tesko
        pojmovi: [srbija]
        pitanje: Dopuni rečenicu (bez ponuđenih reči).
        tekst: Površina Srbije je {{88.499|88499|88 499}} km², a službeni jezik je {{srpski}}.
        pomoc:
          - Površina ima pet cifara i počinje sa 88.
          - Posle 88 dolazi broj od tri cifre koji počinje četvorkom i završava se dvema devetkama.
          - "Iz lekcije: 88.499 km²; službeni jezik je srpski."
        objasnjenje: Površina Srbije je 88.499 km², a službeni jezik je srpski.
        iz_udzbenika:
          strana: 18
          odeljak: Uvod — infokutija
          tekst: Osnovni podaci o Srbiji — 8,3 miliona stanovnika, 88.499 km², glavni grad Beograd, službeni jezik srpski.
          slika: 04-srbija/01-srbija-infografika.jpg

      - id: l04-polozaj-tn-more
        vrsta: tacno_netacno
        tezina: lako
        pojmovi: [srbija, jadransko-more]
        tvrdnja: Srbija ima izlaz na Jadransko more.
        tacno: false
        ispravke:
          - {tekst: "Srbija nema izlaz na more — ona je kontinentalna zemlja.", tacan: true}
          - {tekst: "Srbija izlazi na Crno more.", tacan: false}
          - {tekst: "Srbija izlazi na Egejsko more.", tacan: false}
        pomoc:
          - Pogledaj na karti da li Srbija ima obalu.
          - Između Srbije i Jadrana nalaze se druge države.
          - "Iz lekcije: Srbija je kontinentalna zemlja — nema izlaz na more."
        objasnjenje: Netačno — Srbija je kontinentalna zemlja, bez izlaza na more.
        iz_udzbenika:
          strana: 18
          odeljak: Uvod — položaj
          tekst: Srbija nema more, pa je kontinentalna zemlja; najvećim delom leži na Balkanskom poluostrvu.
          slika: 04-srbija/01-srbija-infografika.jpg

      - id: l04-polozaj-izbor-cetiri
        vrsta: izbor
        tezina: srednje
        pojmovi: [srbija, balkansko-poluostrvo, panonska-nizija, dunav]
        pitanje: Kako udžbenik opisuje Srbiju prema njenom položaju? (Više tačnih.)
        odgovori:
          - {tekst: balkanska, tacan: true}
          - {tekst: podunavska, tacan: true}
          - {tekst: panonska, tacan: true}
          - {tekst: planinska, tacan: true}
          - {tekst: primorska, tacan: false}
          - {tekst: alpska, tacan: false}
        pomoc:
          - Razmisli na kom poluostrvu leži, koja velika reka kroz nju teče i kakav joj je reljef na severu i jugu.
          - Tačna su četiri odgovora; Srbija nema more, a Alpi su daleko na zapadu.
          - "Iz lekcije: Srbija je balkanska, podunavska, panonska i planinska država."
        objasnjenje: Srbija je balkanska (leži na Balkanu), podunavska (kroz nju teče Dunav), panonska (sever je u Panonskoj niziji) i planinska (jug je planinski). Primorska nije jer nema more.
        iz_udzbenika:
          strana: 18
          odeljak: Uvod — položaj
          tekst: Srbija se opisuje kao balkanska, podunavska, panonska i planinska država — leži na Balkanu, uz Dunav, delom u Panonskoj niziji, a jug joj je planinski.

      - id: l04-polozaj-povezi-opis
        vrsta: povezi
        tezina: srednje
        pojmovi: [srbija, balkansko-poluostrvo, panonska-nizija, dunav]
        pitanje: Poveži opis Srbije sa razlogom zbog kog se tako zove.
        parovi:
          - [balkanska, najvećim delom leži na Balkanskom poluostrvu]
          - [podunavska, kroz nju teče Dunav]
          - [panonska, sever joj je deo Panonske nizije]
          - [planinska, jug joj je pretežno planinski]
          - [kontinentalna, nema izlaz na more]
        pomoc:
          - Svaka reč kaže nešto o poluostrvu, reci, nizini, planinama ili moru.
          - „Podunavska” dolazi od imena reke, a „panonska” od imena nizije.
          - "Iz lekcije: balkanska, podunavska, panonska i planinska — i kontinentalna, jer nema more."
        objasnjenje: Balkanska — Balkansko poluostrvo; podunavska — Dunav; panonska — Panonska nizija na severu; planinska — planinski jug; kontinentalna — bez mora.
        iz_udzbenika:
          strana: 18
          odeljak: Uvod — položaj
          tekst: Srbija je kontinentalna zemlja koja najvećim delom leži na Balkanskom poluostrvu; ujedno je podunavska, panonska i planinska.

      - id: l04-polozaj-zakljuci-podunavska
        vrsta: zakljuci
        tezina: lako
        pojmovi: [srbija, dunav]
        pitanje: Zašto se za Srbiju kaže da je „podunavska” zemlja?
        odgovori:
          - {tekst: "Zato što kroz nju protiče reka Dunav.", tacan: true}
          - {tekst: "Zato što leži na obali Crnog mora.", tacan: false}
          - {tekst: "Zato što je cela ravničarska.", tacan: false}
          - {tekst: "Zato što u njoj izvire Dunav.", tacan: false}
        pomoc:
          - "Korak 1: Koje ime reke se krije u reči „podunavska”?"
          - "Korak 2: Da li Dunav izvire u Srbiji ili samo protiče kroz nju (pored Novog Sada i Beograda)?"
          - "Iz lekcije: Srbija je podunavska država — leži uz Dunav."
        objasnjenje: Kroz Srbiju protiče Dunav (pored Novog Sada i Beograda), pa je ona podunavska zemlja. Dunav ne izvire u Srbiji, a Srbija nema more.
        iz_udzbenika:
          strana: 18
          odeljak: Uvod — položaj
          tekst: Srbija leži uz Dunav, pa se ubraja u podunavske zemlje; uz to je balkanska, panonska i planinska.

      - id: l04-polozaj-zakljuci-saobracaj
        vrsta: zakljuci
        tezina: srednje
        pojmovi: [saobracajno-geografski-polozaj, srbija]
        pitanje: Srbija nema more, a ipak ima povoljan saobraćajno-geografski položaj. Zašto?
        odgovori:
          - {tekst: "Preko nje idu putevi koji spajaju srednju i zapadnu Evropu sa jugom Balkana i Malom Azijom.", tacan: true}
          - {tekst: "Zato što ima velike morske luke na Dunavu.", tacan: false}
          - {tekst: "Zato što je cela Srbija ravnica, pa je lako graditi puteve.", tacan: false}
          - {tekst: "Zato što se graniči sa više od deset država.", tacan: false}
        pomoc:
          - "Korak 1: Pogledaj kartu — šta se nalazi severozapadno od Srbije, a šta jugoistočno (Grčka, Turska)?"
          - "Korak 2: Ko putuje kopnom iz Nemačke u Grčku ili Tursku, preko koje zemlje najkraće ide?"
          - "Iz lekcije: kroz Srbiju prolaze saobraćajnice od zapadne i srednje Evrope ka jugu Balkana i zapadu Male Azije."
        objasnjenje: Preko Srbije (dolinama Morave i Dunava) idu najkraći kopneni putevi između srednje i zapadne Evrope i juga Balkana, Grčke i Male Azije. Srbija nema morske luke, a jug joj je planinski.
        iz_udzbenika:
          strana: 18
          odeljak: Uvod — položaj
          tekst: Saobraćajno-geografski položaj Srbije je povoljan, jer kroz nju prolaze putevi koji povezuju zapadnu i srednju Evropu sa južnim delom Balkana i zapadnim delom Male Azije.

      - id: l04-polozaj-izbor-pokrajine
        vrsta: izbor
        tezina: lako
        pojmovi: [ap-vojvodina, ap-kosovo-i-metohija]
        pitanje: Koje su autonomne pokrajine u sastavu Srbije? (Više tačnih.)
        odgovori:
          - {tekst: AP Vojvodina, tacan: true}
          - {tekst: AP Kosovo i Metohija, tacan: true}
          - {tekst: Šumadija, tacan: false}
          - {tekst: Srem, tacan: false}
        pomoc:
          - Jedna pokrajina je na severu, a jedna na jugu Srbije.
          - Srem je samo deo jedne od pokrajina, a Šumadija nije pokrajina.
          - "Iz lekcije: u sastavu Srbije su AP Vojvodina i AP Kosovo i Metohija."
        objasnjenje: Srbija ima dve autonomne pokrajine — Vojvodinu na severu i Kosovo i Metohiju na jugu. Srem je deo Vojvodine.
        iz_udzbenika:
          strana: 18
          odeljak: Uvod — sastav
          tekst: U sastavu Republike Srbije nalaze se dve autonomne pokrajine — AP Vojvodina i AP Kosovo i Metohija.

      - id: l04-polozaj-tn-pokrajine
        vrsta: tacno_netacno
        tezina: lako
        pojmovi: [ap-vojvodina, ap-kosovo-i-metohija]
        tvrdnja: U sastavu Srbije nalaze se dve autonomne pokrajine.
        tacno: true
        pomoc:
          - Jedna pokrajina je ravničarska na severu, druga planinska na jugu.
          - Imena su im Vojvodina i Kosovo i Metohija.
          - "Iz lekcije: AP Vojvodina i AP Kosovo i Metohija."
        objasnjenje: Tačno — to su AP Vojvodina i AP Kosovo i Metohija.
        iz_udzbenika:
          strana: 18
          odeljak: Uvod — sastav
          tekst: Srbija u svom sastavu ima dve autonomne pokrajine — Vojvodinu i Kosovo i Metohiju.

      - id: l04-polozaj-klik-srbija
        vrsta: karta_klik
        tezina: lako
        pojmovi: [srbija]
        pitanje: Klikni na kartu — Republika Srbija.
        cilj: {drzava: SRB}
        pomoc:
          - Srbija je u sredini ove karte i nema obalu mora.
          - Na severu joj je Mađarska, a na istoku Rumunija i Bugarska.
          - Klikni na veliku državu u sredini karte (sa Vojvodinom na severu i Kosovom i Metohijom na jugu).
        objasnjenje: Srbija je u središtu Balkana; na ovoj karti AP Kosovo i Metohija je deo Srbije, kao u udžbeniku.
        iz_udzbenika:
          strana: 18
          odeljak: Uvod — položaj
          tekst: Na maloj karti u infokutiji Srbija je istaknuta crvenom bojom usred Balkanskog poluostrva, bez izlaza na more.
          slika: 04-srbija/01-srbija-infografika.jpg

      - id: l04-polozaj-izbor-susedi-broj
        vrsta: izbor
        tezina: srednje
        pojmovi: [srbija]
        pitanje: Sa koliko se država Srbija graniči?
        odgovori:
          - {tekst: "8", tacan: true}
          - {tekst: "5", tacan: false}
          - {tekst: "6", tacan: false}
          - {tekst: "11", tacan: false}
        pomoc:
          - Prebroj susede na karti, krećući se od Mađarske na severu u krug.
          - Na nemoj karti u udžbeniku susedi su obeleženi brojevima — poslednji broj je osam.
          - "Iz lekcije: Mađarska, Hrvatska, BiH, Crna Gora, Albanija, Severna Makedonija, Bugarska, Rumunija."
        objasnjenje: Srbija ima 8 suseda — Mađarsku, Rumuniju, Bugarsku, Severnu Makedoniju, Albaniju, Crnu Goru, Bosnu i Hercegovinu i Hrvatsku.
        iz_udzbenika:
          strana: 19
          odeljak: Zadatak — susedne države
          tekst: Na nemoj karti susedi Srbije označeni su brojevima od 1 do 8, a učenik uz pomoć atlasa upisuje njihova imena.
          slika: 04-srbija/02-granice-srbije-karta.jpg

      - id: l04-polozaj-klik-madjarska
        vrsta: karta_klik
        tezina: lako
        pojmovi: [madjarska, vojvodina]
        pitanje: Klikni na susednu državu Srbije koja je na severu, iznad Vojvodine.
        cilj: {drzava: HUN}
        pomoc:
          - Traži državu odmah severno od Srbije.
          - Kroz nju Dunav i Tisa teku pre nego što uđu u Vojvodinu.
          - Klikni na Mađarsku.
        objasnjenje: Na severu se Srbija graniči sa Mađarskom; iz nje u Vojvodinu dolaze Dunav i Tisa.
        iz_udzbenika:
          strana: 19
          odeljak: Zadatak — susedne države
          tekst: Na nemoj karti suseda broj 1 je Mađarska, na severu, iznad Vojvodine.
          slika: 04-srbija/02-granice-srbije-karta.jpg

      - id: l04-polozaj-klik-crna-gora
        vrsta: karta_klik
        tezina: srednje
        pojmovi: [crna-gora, prokletije]
        pitanje: Klikni na susednu državu na jugozapadu Srbije, između Bosne i Hercegovine i Albanije.
        cilj: {drzava: MNE}
        pomoc:
          - To je mala primorska država na jugozapadu Srbije.
          - Sa njom je Srbija do 2006. bila u zajednici; deli sa njom Prokletije.
          - Klikni na Crnu Goru.
        objasnjenje: Na jugozapadu je Crna Gora (sused broj 4 na nemoj karti). Albanija se sa Srbijom graniči preko AP Kosova i Metohije.
        iz_udzbenika:
          strana: 19
          odeljak: Zadatak — susedne države
          tekst: Pod brojem 4 na nemoj karti je Crna Gora. Prokletije se nalaze na granici Srbije sa Crnom Gorom i Albanijom.
          slika: 04-srbija/02-granice-srbije-karta.jpg

      - id: l04-polozaj-klik-rumunija
        vrsta: karta_klik
        tezina: srednje
        pojmovi: [rumunija, dunav, banat]
        pitanje: Klikni na susednu državu na severoistoku, sa kojom Srbija deli Banat i deo toka Dunava.
        cilj: {drzava: ROU}
        pomoc:
          - Traži državu istočno od Vojvodine.
          - Na jednom delu granicu prema njoj čini Dunav, pre nego što skrene ka Crnom moru.
          - Klikni na Rumuniju.
        objasnjenje: Na severoistoku je Rumunija; deo granice čini Dunav, a Banat se nastavlja i u Rumuniji.
        iz_udzbenika:
          strana: 19
          odeljak: Zadatak — susedne države
          tekst: Na nemoj karti suseda broj 8 je Rumunija, na severoistoku Srbije.
          slika: 04-srbija/02-granice-srbije-karta.jpg

      - id: l04-polozaj-klik-albanija
        vrsta: karta_klik
        tezina: srednje
        pojmovi: [albanija, ap-kosovo-i-metohija]
        pitanje: Klikni na susednu državu sa kojom se Srbija graniči samo preko AP Kosova i Metohije.
        cilj: {drzava: ALB}
        pomoc:
          - Traži državu na jugozapadu, iza Prokletija.
