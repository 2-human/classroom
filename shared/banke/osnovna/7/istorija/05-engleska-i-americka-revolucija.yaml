          - {tekst: "Da se ukida monarhija i uvodi republika", tacan: false, zasto: "Povelja zadržava kralja, ali ga vezuje za odluke parlamenta."}
          - {tekst: "Da kralj vlada po božjoj milosti, bez parlamenta", tacan: false, zasto: "Upravo suprotno — vladar više ne može mimo parlamenta."}
          - {tekst: "Da svi stanovnici dobijaju pravo glasa", tacan: false, zasto: "Pravo glasa je i u XVIII i u većem delu XIX veka imao mali deo stanovništva."}
        pomoc:
          - "Ko posle 1689. ima poslednju reč — kralj ili parlament?"
          - "Kralj ostaje, ali je ograničen."
          - "Iz lekcije: vladar mora da vlada u saglasnosti sa odlukama parlamenta."
        objasnjenje: "Povelja o pravima obavezuje vladara da vlada u skladu sa odlukama parlamenta — tako nastaje parlamentarna monarhija."
        iz_udzbenika:
          strana: 41
          odeljak: Stvaranje parlamentarne monarhije
          tekst: "Povelja o pravima je utvrdila da vladar mora da vlada u skladu sa odlukama parlamenta."

      - id: l05-parl-izbor-gornji-dom
