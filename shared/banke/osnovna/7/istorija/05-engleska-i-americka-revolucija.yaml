          - {tekst: "Ustav SAD", tacan: false, zasto: "Ustav SAD donet je 1787. u Americi."}
          - {tekst: "Patent o verskoj toleranciji", tacan: false, zasto: "Patent o verskoj toleranciji izdao je Josif II u Habzburškoj monarhiji 1781."}
        pomoc:
