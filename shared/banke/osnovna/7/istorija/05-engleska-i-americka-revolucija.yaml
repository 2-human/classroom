          strana: 41
          odeljak: Stvaranje parlamentarne monarhije
          tekst: "Vlada je morala da podnosi izveštaje parlamentu, koji je mogao da izglasa smenu vlade i nove izbore."

      - id: l05-parl-zakljuci-ne-za-sve
        vrsta: zakljuci
        tezina: tesko
        pojmovi: [pravo-glasa, gornji-dom, parlamentarna-monarhija]
        pitanje: "Zašto britanski parlament u XVIII veku nije predstavljao većinu stanovnika?"
        odgovori:
          - {tekst: "Pravo glasa imao je mali deo ljudi, a odluke izabranog doma odobravalo je nasledno plemstvo", tacan: true}
          - {tekst: "Parlament se uopšte nije sastajao", tacan: false, zasto: "Parlament je imao glavnu ulogu u političkom životu zemlje."}
          - {tekst: "Svi poslanici su bili sveštenici", tacan: false, zasto: "Gornji dom je krupno plemstvo, Donji dom sitno plemstvo i bogato građanstvo."}
          - {tekst: "Kralj je i dalje vladao apsolutistički", tacan: false, zasto: "Posle Povelje o pravima kralj vlada u skladu sa odlukama parlamenta."}
        pomoc:
          - "Korak 1: Koliko je ljudi moglo da glasa?"
          - "Korak 2: Ko je imao poslednju reč o odlukama Donjeg doma?"
          - "Iz lekcije: mali deo stanovništva ima pravo glasa; Gornji dom odobrava odluke Donjeg doma."
        objasnjenje: "Glasao je samo mali deo stanovništva, a nasledni Gornji dom je odobravao odluke izabranog Donjeg doma — moć je ostajala u rukama malobrojnih."
        iz_udzbenika:
          strana: 41
          odeljak: Stvaranje parlamentarne monarhije
          tekst: "Pravo glasa je imao mali deo stanovništva, a odluke Donjeg doma morao je da odobri Gornji dom."

      - id: l05-parl-zakljuci-dve-revolucije
        vrsta: zakljuci
        tezina: srednje
        pojmovi: [slavna-revolucija, gradjanski-rat-u-engleskoj]
        pitanje: "Po čemu se Slavna revolucija (1688) najviše razlikuje od Građanskog rata (1642–1649)?"
        odgovori:
          - {tekst: "Prošla je bez nasilja, a završila se trajnim dogovorom — kralj prihvata vlast parlamenta", tacan: true}
          - {tekst: "U njoj je pogubljen kralj", tacan: false, zasto: "Kralj je pogubljen posle Građanskog rata, ne 1688."}
          - {tekst: "Posle nje Engleska je postala republika", tacan: false, zasto: "Republika je bila posle Građanskog rata; 1688–1689. nastaje parlamentarna monarhija."}
          - {tekst: "Vodili su je američki kolonisti", tacan: false, zasto: "Obe su engleski događaji; kolonisti se bune tek 1775."}
        pomoc:
          - "Korak 1: Kako se završio Građanski rat — za kralja i za državu?"
          - "Korak 2: Šta je 1688–1689. bilo drugačije: krv, ishod?"
          - "Iz lekcije: Beskrvna revolucija bez sukoba i nasilja → Povelja o pravima → parlamentarna monarhija."
        objasnjenje: "Građanski rat je krvav i daje republiku pod Kromvelom; Slavna revolucija je bez nasilja i daje parlamentarnu monarhiju."
        iz_udzbenika:
          strana: 41
          odeljak: Stvaranje parlamentarne monarhije
          tekst: "Slavna revolucija prošla je bez sukoba i nasilja i dovela do parlamentarne monarhije."

