        pitanje: "Zašto su američki kolonisti bili nezadovoljni britanskom vlašću i kako su to pokazali?"
        uzor: "Britanske vlasti su kolonijama nametale stroga pravila u trgovini, carine i druge dažbine, pa je razvoj privrede bio sputan. Kolonisti su tražili da njihovi predstavnici učestvuju u radu britanskog parlamenta. Kad je zahtev odbijen, počeli su da protestuju i prestali su da kupuju britansku robu."
        ideje:
          - "Stroga trgovačka pravila, carine i dažbine."
          - "Sputan razvoj privrede, nezadovoljno građanstvo."
          - "Zahtev za predstavnicima u parlamentu je odbijen."
          - "Protesti i bojkot britanske robe."
        objasnjenje: "Kolonisti su plaćali namete, a nisu imali glas u parlamentu koji ih je uvodio."
        iz_udzbenika:
          strana: 42
          odeljak: Britanske kolonije u Severnoj Americi
          tekst: "Mere britanskih vlasti sputavale su privredu; kolonisti su tražili predstavnike, a posle odbijanja protestovali i bojkotovali robu."

