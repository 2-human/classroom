# Banka zadataka — 2.3. Engleska i Američka revolucija (istorija, 7. razred, str. 40–44). Spaja se u spec.yaml.
# Pitanja sopstvenim rečima na osnovu beleške tools/istorija/_source/lekcije-7/05-engleska-i-americka-revolucija.md.
# Svaki pogrešan ponuđeni odgovor ima `zasto` — greška treba da nauči, ne samo da kazni.
# Vremenska osa — isti događaj uvek sa istim nazivom i godinama:
#   Građanski rat u Engleskoj 1642–1649 · Obnova monarhije u Engleskoj 1660 · Slavna revolucija 1688 ·
#   Povelja o pravima 1689 · Bostonska čajanka 1773 · Prvi kongres kolonista u Filadelfiji 1774 ·
#   Američka revolucija 1775–1783 (lekcija 1 ima „Američki rat za nezavisnost” sa oznakom „kraj XVIII veka”, zato drugi naziv) ·
#   Britanci pokušavaju da uhapse vođe kolonista 1775 · Deklaracija nezavisnosti 1776 · Karikatura „Državne kotlokrpe” 1780 ·
#   Bitka kod Jorktauna 1781 · Pariski mir 1783 · Ustav SAD 1787 · Džordž Vašington, prvi predsednik SAD 1789 ·
#   Osnovan grad Vašington 1800 · SAD kupuju teritoriju od Francuske 1803 · SAD kupuju Floridu od Španije 1819 ·
#   Teksas pripojen SAD 1845 · Pripajanje posle Meksičkog rata 1848
# Str. 45 (rezime, pitanja) nije snimljena; godina poslednje stavke legende karte (kupovina od Meksika) nije pouzdana, pa se ne pita.

