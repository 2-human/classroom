          odeljak: Uređenje Sjedinjenih Američkih Država
          tekst: "Kao i u Velikoj Britaniji, u politici SAD je krajem XVIII i u prvoj polovini XIX veka učestvovao manji deo stanovništva."

      - id: l05-sad-uporedi-grane
        vrsta: uporedi
        tezina: tesko
        pojmovi: [predsednik, kongres, podela-vlasti]
        a: Izvršna vlast (predsednik)
        b: Zakonodavna vlast (Kongres)
        pitanje: "Na koju granu vlasti u SAD se odnosi tvrdnja?"
        tvrdnje:
          - {tekst: "Bira se na četiri godine i ima je jedna osoba.", odgovor: a, zasto: "Predsednik se bira na četiri godine."}
          - {tekst: "Sastoji se od Senata i Predstavničkog doma.", odgovor: b, zasto: "To su dva tela Kongresa."}
          - {tekst: "Biraju je građani na izborima.", odgovor: oba, zasto: "I predsednika i članove Kongresa birali su građani."}
          - {tekst: "Pod nadzorom je Vrhovnog suda.", odgovor: oba, zasto: "Sva tela vlasti bila su pod nadzorom Vrhovnog suda."}
          - {tekst: "Mesto se nasleđuje po rođenju.", odgovor: nijedan, zasto: "U SAD se ništa ne nasleđuje — sve se bira."}
        pomoc:
          - "Jedna grana je jedan čovek, druga skupština."
          - "Obe su izborne i obe nadzire sud."
          - "Iz lekcije: predsednik na 4 godine; Kongres — Senat i Predstavnički dom; sve biraju građani i nadzire Vrhovni sud."
        objasnjenje: "Predsednik i Kongres su različite grane, ali obe biraju građani i obe nadzire Vrhovni sud."
        iz_udzbenika:
          strana: 44
          odeljak: Uređenje Sjedinjenih Američkih Država
          tekst: "Predsednika i članove Kongresa birali su građani, a sva tela vlasti nadzirao je Vrhovni sud."

      - id: l05-sad-objasni-ustav
        vrsta: objasni
        tezina: lako
        pojmovi: [ustav, republika, podela-vlasti]
        pitanje: "Šta je ustav i šta je uredio ustav SAD iz 1787?"
        uzor: "Ustav je najviši pravni akt jedne zemlje. Američki ustav iz 1787. uredio je SAD kao republiku i podelio vlast na tri grane: izvršnu (predsednik), zakonodavnu (Kongres) i sudsku (Vrhovni sud)."
        ideje:
          - "Ustav je najviši pravni akt."
          - "Donet je 1787."
          - "SAD su republika."
          - "Podela vlasti na izvršnu, zakonodavnu i sudsku."
        objasnjenje: "Ustav SAD je temelj republike i podele vlasti."
        iz_udzbenika:
          strana: 44
          odeljak: Uređenje Sjedinjenih Američkih Država
          tekst: "Kongres je 1787. doneo ustav: SAD su republika sa podelom vlasti na tri grane."

      - id: l05-sad-objasni-podela
        vrsta: objasni
        tezina: srednje
        pojmovi: [podela-vlasti, predsednik, kongres, vrhovni-sud]
        pitanje: "Objasni kako je bila podeljena vlast u SAD i zašto je to važno."
        uzor: "Izvršnu vlast imao je predsednik biran na četiri godine, zakonodavnu Kongres (Senat i Predstavnički dom), a sva tela vlasti nadzirao je Vrhovni sud. Svaka grana je nezavisna; grane sarađuju, ali se i nadziru, pa nijedna ne može da zloupotrebi vlast i krši ustav."
        ideje:
          - "Izvršna vlast — predsednik (4 godine)."
          - "Zakonodavna — Kongres (Senat i Predstavnički dom)."
          - "Vrhovni sud nadzire sva tela vlasti."
          - "Grane se međusobno nadziru i sprečavaju kršenje ustava."
        objasnjenje: "Podela vlasti po Monteskjeovoj ideji sprečava da se moć skupi u jednim rukama."
        iz_udzbenika:
          strana: 44
          odeljak: Uređenje Sjedinjenih Američkih Država
          tekst: "Predsednik, Kongres i Vrhovni sud su nezavisni, sarađuju i nadziru jedni druge."

      - id: l05-sad-objasni-ucesce
        vrsta: objasni
        tezina: tesko
        pojmovi: [pravo-glasa, velika-britanija, sjedinjene-americke-drzave]
        pitanje: "Uporedi ko je mogao da učestvuje u politici u SAD i u Velikoj Britaniji krajem XVIII veka."
        uzor: "U SAD je pravo da bira i bude biran imao samo beli vlasnik zemlje; siromašni belci, žene, crni robovi i Indijanci nisu imali političkih prava. U Velikoj Britaniji je pravo glasa takođe imao samo mali deo stanovništva, a članovi Gornjeg doma mesto su nasleđivali. Dakle, u obe zemlje u politici je učestvovala manjina, iako SAD nisu imale kralja i nasledne lordove."
        ideje:
          - "SAD: pravo glasa samo beli zemljoposednici."
          - "Bez prava: siromašni belci, žene, robovi, Indijanci."
          - "Britanija: mali deo stanovništva glasa; nasledni Gornji dom."
          - "Zaključak: u obe zemlje politiku vodi manjina."
        objasnjenje: "Iako su uređenja različita, ni u jednoj zemlji većina ljudi nije učestvovala u politici."
        iz_udzbenika:
          strana: 44
          odeljak: Uređenje Sjedinjenih Američkih Država
          tekst: "Kao i u Velikoj Britaniji, u politici SAD učestvovao je samo manji deo stanovništva."
