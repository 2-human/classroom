        uzor: "Vladari su do tada tvrdili da vladaju po božjoj milosti i da su zato iznad zakona, pa im niko nije mogao suditi. Posle Građanskog rata pristalice parlamenta izvele su Čarlsa I pred sud i osudile ga na smrt. Time su pokazale da i kralj mora da odgovara za svoja dela."
        ideje:
          - "Vladari su se smatrali iznad zakona (božja milost)."
          - "Pobednici u Građanskom ratu su kralju sudili."
          - "Čarls I je osuđen na smrt."
          - "Pokazano je da ni kralj nije iznad zakona."
        objasnjenje: "Suđenje je srušilo ideju da je kralj iznad zakona."
        iz_udzbenika:
          strana: 40
          odeljak: Građanski rat i republika u Engleskoj
          tekst: "Vladari su tvrdili da su po božjoj milosti iznad zakona, a Čarlsu I je ipak suđeno."

      - id: l05-grat-objasni-prava-republika
        vrsta: objasni
        tezina: tesko
        pojmovi: [republika, oliver-kromvel, lord-zastitnik]
        pitanje: "Da li je Engleska pod Kromvelom bila prava republika? Obrazloži."
        uzor: "Engleska je posle osude Čarlsa I proglašena republikom, ali njom je doživotno upravljao Kromvel sa titulom lord zaštitnik. To liči na vlast kralja bez krune, a ne na republiku u kojoj se vlast bira na određeno vreme. Posle Kromvelove smrti, 1660, monarhija je obnovljena."
        ideje:
          - "Engleska je zvanično proglašena republikom."
          - "Kromvel je vladao doživotno, kao nekrunisani kralj."
          - "U pravoj republici vlast se bira na određeno vreme."
          - "Posle njegove smrti vraćena je monarhija (1660)."
        objasnjenje: "Republika je postojala po imenu, ali vlast jednog čoveka doživotno ličila je na monarhiju."
        iz_udzbenika:
          strana: 40
          odeljak: Građanski rat i republika u Engleskoj
          tekst: "Engleska je proglašena republikom, ali Kromvel je njom upravljao doživotno, poput nekrunisanog kralja."

