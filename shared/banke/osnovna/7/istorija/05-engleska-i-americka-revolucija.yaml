delovi:
  # ==========================================================================
  - naslov: Uvod
    zadaci:
      - id: l05-uvod-izbor-revolucija
        vrsta: izbor
        tezina: lako
        pojmovi: [revolucija]
        pitanje: "Šta je revolucija?"
        odgovori:
          - {tekst: "Nagli i koreniti preobražaj", tacan: true}
          - {tekst: "Spora i neprimetna promena koja traje vekovima", tacan: false, zasto: "Revolucija je upravo suprotno — brza i duboka promena."}
          - {tekst: "Svaki rat između dve države", tacan: false, zasto: "Rat nije isto što i revolucija; revolucija je preobražaj društva, države ili privrede."}
          - {tekst: "Krunisanje novog kralja", tacan: false, zasto: "Smena vladara po naslednom pravu ništa korenito ne menja."}
        pomoc:
          - "Seti se kako je Prva industrijska revolucija promenila proizvodnju."
          - "Promena je bila i brza i duboka."
          - "Iz lekcije: revolucija je nagli i koreniti preobražaj."
        objasnjenje: "Revolucija je nagli i koreniti preobražaj — najčešće u politici, ali može se desiti u bilo kojoj oblasti života."
        iz_udzbenika:
          strana: 40
          odeljak: Uvod
          tekst: "Revolucija je nagli i koreniti preobražaj; obično je vezujemo za političke promene."

      - id: l05-uvod-dopuni-revolucija
        vrsta: dopuni
        tezina: lako
        pojmovi: [revolucija]
        pitanje: "Dopuni objašnjenje pojma."
        tekst: "Revolucija je {{nagli}} i {{koreniti}} preobražaj. Najčešće je vezujemo za {{političke}} promene, ali može se desiti u bilo kojoj oblasti života."
        ponudjene: [nagli, koreniti, političke, spori, površni, verske]
        pomoc:
          - "Revolucija se ne dešava polako."
          - "Ona menja stvari iz korena."
          - "Iz lekcije: nagli i koreniti preobražaj, najčešće u politici (npr. državno uređenje)."
        objasnjenje: "Revolucija je nagli i koreniti preobražaj; najčešće se misli na političke promene, kao što je promena državnog uređenja."
        iz_udzbenika:
          strana: 40
          odeljak: Uvod
          tekst: "Revoluciju obično vezujemo za političke promene, npr. u državnom uređenju, ali može se desiti u svakoj oblasti života."

      - id: l05-uvod-tn-samo-politika
        vrsta: tacno_netacno
        tezina: lako
        pojmovi: [revolucija]
        tvrdnja: "Revolucija može biti samo promena državnog uređenja."
        tacno: false
        ispravke:
          - {tekst: "Revolucija se može desiti u bilo kojoj oblasti života, npr. i u proizvodnji.", tacan: true}
          - {tekst: "Revolucija je samo promena vere u nekoj zemlji.", tacan: false, zasto: "Ni to nije jedina vrsta — revolucija može biti politička, privredna ili neka druga."}
          - {tekst: "Revolucija je samo smena kralja istom porodicom.", tacan: false, zasto: "Smena po naslednom pravu nije koreniti preobražaj."}
        pomoc:
          - "Seti se naslova prethodne lekcije o mašinama i fabrikama."
          - "I ona se zove revolucija, a nije politička."
          - "Iz lekcije: revolucije se mogu desiti u svakoj oblasti života."
        objasnjenje: "Netačno — najčešće govorimo o političkim revolucijama, ali postoji i, na primer, industrijska revolucija u proizvodnji."
        iz_udzbenika:
          strana: 40
          odeljak: Uvod
          tekst: "Revoluciju najčešće vezujemo za političke promene, ali ona se može desiti u svakoj oblasti života."

      - id: l05-uvod-zakljuci-industrijska
        vrsta: zakljuci
        tezina: srednje
        pojmovi: [revolucija]
        pitanje: "Zašto se i velike promene u proizvodnji krajem XVIII veka nazivaju revolucijom?"
        odgovori:
          - {tekst: "Jer su naglo i iz korena promenile način proizvodnje i život ljudi", tacan: true}
          - {tekst: "Jer su radnici zbacili kralja i proglasili republiku", tacan: false, zasto: "To bi bila politička promena; industrijska revolucija je promena u proizvodnji (mašine, fabrike)."}
          - {tekst: "Jer su se odigrale tokom Građanskog rata u Engleskoj", tacan: false, zasto: "Građanski rat je 1642–1649, a industrijska revolucija počinje u drugoj polovini XVIII veka."}
          - {tekst: "Jer su trajale nekoliko vekova bez većih promena", tacan: false, zasto: "Revolucija je nagla, a ne spora promena."}
        pomoc:
          - "Korak 1: Šta znači reč revolucija?"
          - "Korak 2: Da li su mašine i fabrike promenile proizvodnju naglo i duboko?"
          - "Iz lekcije: revolucija je nagli i koreniti preobražaj u bilo kojoj oblasti."
        objasnjenje: "Mašine su zamenile ljudsku ruku, nastale su fabrike i novi društveni slojevi — nagli i koreniti preobražaj, dakle revolucija, ali u privredi."
        iz_udzbenika:
          strana: 40
          odeljak: Uvod
          tekst: "Udžbenik traži da se podsetiš kakve je promene donela Prva industrijska revolucija."

      - id: l05-uvod-izbor-slike-parlament
        vrsta: izbor
        slika_u_pitanju: true
        tezina: lako
        pojmovi: [parlament, engleska]
        pitanje: "Šta prikazuju dve slike na početku lekcije?"
        odgovori:
          - {tekst: "Engleski parlament u XIII i u XVII veku", tacan: true}
          - {tekst: "Američki Kongres 1776. i 1787.", tacan: false, zasto: "Slike su mnogo starije — prikazuju engleski parlament u srednjem veku i u XVII veku."}
          - {tekst: "Krunisanje dva engleska kralja", tacan: false, zasto: "Prikazana su zasedanja skupa predstavnika, a ne krunisanja."}
          - {tekst: "Francuske prosvetitelje na skupu", tacan: false, zasto: "Prosvetitelji su iz XVIII veka; slike prikazuju englesku skupštinu."}
        pomoc:
          - "Pogledaj: mnogo ljudi sedi oko kralja i u klupama."
          - "To je skup koji je savetovao engleskog kralja."
          - "Iz lekcije: predstava engleskog parlamenta u XIII veku (levo) i XVII veku (desno)."
        objasnjenje: "Leva slika prikazuje engleski parlament u XIII veku, desna u XVII veku."
        iz_udzbenika:
          strana: 40
          odeljak: Uvod
          tekst: "Na dve slike prikazan je engleski parlament u XIII i u XVII veku."
          slika: 05-engleska-i-americka-revolucija/01-engleski-parlament-xiii-i-xvii-vek.jpg

      - id: l05-uvod-zakljuci-slike-poredjenje
        vrsta: zakljuci
        slika_u_pitanju: true
        tezina: tesko
        pojmovi: [parlament, engleska]
        pitanje: "Uporedi dve slike engleskog parlamenta. Šta se najviše promenilo od XIII do XVII veka?"
        odgovori:
          - {tekst: "U XVII veku parlament ima mnogo više članova — dvorana je puna klupa sa poslanicima", tacan: true}
          - {tekst: "U XVII veku parlament više ne postoji, a kralj sedi sam", tacan: false, zasto: "Na desnoj slici dvorana je puna ljudi — parlament postoji i veći je."}
          - {tekst: "U XIII veku parlament je bio veći nego u XVII veku", tacan: false, zasto: "Na levoj slici je mali broj ljudi oko kralja; na desnoj stotine poslanika."}
          - {tekst: "Na obe slike nema kralja ni prestola", tacan: false, zasto: "Na obe slike vidi se presto na čelu skupa."}
        pomoc:
          - "Korak 1: Prebroj otprilike ljude na levoj slici."
          - "Korak 2: Uporedi sa redovima klupa na desnoj."
          - "Iz lekcije: levo je parlament u XIII veku, desno u XVII veku."
        objasnjenje: "Parlament je rastao — u XVII veku zasedaju stotine poslanika, što pokazuje koliko je postao važan; baš u tom veku izbija sukob kralja i parlamenta."
        iz_udzbenika:
          strana: 40
          odeljak: Uvod
          tekst: "Udžbenik upoređuje predstave engleskog parlamenta iz XIII i XVII veka."
          slika: 05-engleska-i-americka-revolucija/01-engleski-parlament-xiii-i-xvii-vek.jpg

      - id: l05-uvod-uporedi-revolucije
        vrsta: uporedi
        tezina: srednje
        pojmovi: [revolucija, engleska-revolucija]
        a: Revolucija u politici (Engleska u XVII veku)
        b: Industrijska revolucija
        pitanje: "Na koju revoluciju se odnosi tvrdnja — prvu, drugu, obe ili nijednu?"
        tvrdnje:
          - {tekst: "Menja se državno uređenje — ko i kako vlada.", odgovor: a, zasto: "To je politička revolucija, npr. kad Engleska postaje republika."}
          - {tekst: "Mašine zamenjuju rad ljudske ruke.", odgovor: b, zasto: "To je promena u proizvodnji — industrijska revolucija."}
          - {tekst: "To je nagli i koreniti preobražaj.", odgovor: oba, zasto: "Svaka revolucija je nagli i koreniti preobražaj, ma u kojoj oblasti."}
          - {tekst: "Odigrala se u Engleskoj (Velikoj Britaniji).", odgovor: oba, zasto: "Građanski rat i Slavna revolucija su u Engleskoj, a industrijska revolucija počinje u Velikoj Britaniji."}
          - {tekst: "Počela je u Rusiji.", odgovor: nijedan, zasto: "Nijedna nije počela u Rusiji."}
        pomoc:
          - "Pitaj se: menja li se vlast ili proizvodnja?"
          - "Zajedničko im je ono što svaku promenu čini revolucijom."
          - "Iz lekcije: revolucija je nagli i koreniti preobražaj — u politici ili bilo kojoj oblasti."
        objasnjenje: "Politička revolucija menja vlast, industrijska proizvodnju; obe su nagle i korenite i obe se vezuju za Englesku."
        iz_udzbenika:
          strana: 40
          odeljak: Uvod
          tekst: "Revolucija može biti politička, ali i u bilo kojoj drugoj oblasti, kao Prva industrijska revolucija."

      - id: l05-uvod-objasni-revolucija
        vrsta: objasni
        tezina: srednje
        pojmovi: [revolucija]
        pitanje: "Šta je revolucija? Navedi primer političke i primer nepolitičke revolucije."
        uzor: "Revolucija je nagli i koreniti preobražaj. Najčešće se misli na političke promene, kao kad je Engleska u XVII veku postala republika. Ali revolucija može biti i u privredi — Prva industrijska revolucija promenila je proizvodnju jer su mašine zamenile ljudsku ruku."
        ideje:
          - "Revolucija je nagla i korenita promena."
          - "Najčešće se vezuje za politiku i državno uređenje."
          - "Može se desiti i u drugim oblastima."
          - "Primer: Prva industrijska revolucija (mašine)."
        objasnjenje: "Bitno je da je promena brza i duboka; oblast može biti politika, privreda ili nešto drugo."
        iz_udzbenika:
          strana: 40
          odeljak: Uvod
          tekst: "Revolucija je nagli i koreniti preobražaj, najčešće politički, ali moguć u svakoj oblasti života."

  # ==========================================================================
  - naslov: Građanski rat i republika u Engleskoj
    zadaci:
      - id: l05-grat-izbor-parlament-ko
        vrsta: izbor
        tezina: lako
        pojmovi: [parlament, plemstvo, svestenstvo]
        pitanje: "Čiji su predstavnici činili engleski parlament? (više tačnih)"
        odgovori:
          - {tekst: "Plemstva", tacan: true}
          - {tekst: "Sveštenstva", tacan: true}
          - {tekst: "Gradova", tacan: true}
          - {tekst: "Robova", tacan: false, zasto: "Robovi nisu imali nikakva prava, pa ni predstavnike."}
          - {tekst: "Svih seljaka", tacan: false, zasto: "Seljaci nisu bili među grupama koje su slale predstavnike u parlament."}
        pomoc:
          - "Seti se tri grupe koje su bile najuticajnije u srednjem veku."
          - "Među njima su i oni koji služe crkvi i stanovnici varoši."
          - "Iz lekcije: parlament su činili predstavnici plemstva, sveštenstva i gradova."
        objasnjenje: "Parlament su činili predstavnici plemstva, sveštenstva i gradova; s njima se kralj savetovao još od kasnog srednjeg veka."
        iz_udzbenika:
          strana: 40
          odeljak: Građanski rat i republika u Engleskoj
          tekst: "Parlament su činili predstavnici plemstva, sveštenstva i gradova."
          slika: 05-engleska-i-americka-revolucija/01-engleski-parlament-xiii-i-xvii-vek.jpg

      - id: l05-grat-izbor-stjuarti
        vrsta: izbor
        tezina: lako
        pojmovi: [stjuarti, parlament]
        pitanje: "Vladari iz koje dinastije su u XVII veku narušili odnos kralja i parlamenta u Engleskoj?"
        odgovori:
          - {tekst: "Stjuart", tacan: true}
          - {tekst: "Habzburg", tacan: false, zasto: "Habzburzi su vladali Habzburškom monarhijom (Austrija, Češka, Ugarska), ne Engleskom."}
          - {tekst: "Romanov", tacan: false, zasto: "Romanovi su ruska dinastija."}
          - {tekst: "Hoencolern", tacan: false, zasto: "Hoencolerni su vladali Pruskom."}
        pomoc:
          - "Pogubljeni kralj nosi ime te dinastije u svom imenu."
          - "Taj kralj je Čarls I …"
          - "Iz lekcije: poredak su u XVII veku narušili vladari iz dinastije Stjuart."
        objasnjenje: "Vladari iz dinastije Stjuart u XVII veku pokušali su da vladaju mimo parlamenta, što je dovelo do Građanskog rata."
        iz_udzbenika:
          strana: 40
          odeljak: Građanski rat i republika u Engleskoj
          tekst: "Vekovni poredak saradnje kralja i parlamenta narušili su u XVII veku Stjuarti."

      - id: l05-grat-izbor-sudjenje
        vrsta: izbor
        tezina: srednje
        pojmovi: [carls-i-stjuart, gradjanski-rat-u-engleskoj]
        pitanje: "Šta je bilo nezabeleženo (bez presedana) posle pobede pristalica parlamenta?"
        odgovori:
          - {tekst: "Kralj je izveden pred sud i osuđen", tacan: true}
          - {tekst: "Kralj je pobegao u Francusku", tacan: false, zasto: "Čarls I je bio zarobljen, a ne pobegao."}
          - {tekst: "Parlament je izabrao novog kralja iz Škotske", tacan: false, zasto: "Engleska je proglašena republikom, a ne kraljevinom sa novim kraljem."}
          - {tekst: "Plemstvo je izgubilo mesto u parlamentu", tacan: false, zasto: "Lekcija o tome ne govori; novina je bila suđenje kralju."}
        pomoc:
          - "Šta su pobednici uradili sa zarobljenim kraljem?"
          - "Vladari su do tada smatrani iznad zakona."
          - "Iz lekcije: pobednici su kralja izveli pred sud — do tada nezabeležen slučaj."
        objasnjenje: "Do tada se smatralo da kralj vlada po božjoj milosti i da je iznad zakona; zato je suđenje Čarlsu I bilo bez presedana."
        iz_udzbenika:
          strana: 40
          odeljak: Građanski rat i republika u Engleskoj
          tekst: "Pobednici su kralja izveli pred sud, što je bio do tada nezabeležen slučaj."

      - id: l05-grat-izbor-kromvel-portret
        vrsta: izbor
        slika_u_pitanju: true
        tezina: lako
        pojmovi: [oliver-kromvel, lord-zastitnik]
        pitanje: "Kako je na portretu prikazan Oliver Kromvel?"
        odgovori:
          - {tekst: "U oklopu, kao vojskovođa", tacan: true}
          - {tekst: "Sa krunom i plaštom od hermelina", tacan: false, zasto: "Kromvel nije bio krunisan — na portretu nosi oklop."}
          - {tekst: "U sveštenićkoj odeždi", tacan: false, zasto: "Bio je plemić i vojskovođa, a ne sveštenik."}
          - {tekst: "Sa belom perikom, kao američki predsednik", tacan: false, zasto: "To je opis Vašingtonovog portreta; Kromvel ima dugu kosu i oklop."}
        pomoc:
          - "Pogledaj šta nosi na grudima i ramenu."
          - "Predvodio je vojsku pristalica parlamenta."
          - "Iz lekcije: Oliver Kromvel kao lord zaštitnik — u oklopu."
        objasnjenje: "Kromvel je prikazan u oklopu — kao vojskovođa koji je pobedio u Građanskom ratu i potom vladao kao lord zaštitnik."
        iz_udzbenika:
          strana: 40
          odeljak: Građanski rat i republika u Engleskoj
          tekst: "Portret prikazuje Olivera Kromvela kao lorda zaštitnika."
          slika: 05-engleska-i-americka-revolucija/02-oliver-kromvel.jpg

      - id: l05-grat-tn-kromvel
        vrsta: tacno_netacno
        tezina: lako
        pojmovi: [oliver-kromvel, gradjanski-rat-u-engleskoj]
        tvrdnja: "U Građanskom ratu pristalice parlamenta predvodio je plemić Oliver Kromvel."
        tacno: true
        pomoc:
          - "Ko je kasnije dobio titulu lord zaštitnik?"
          - "Iz lekcije: pristalice parlamenta vodio je plemić Oliver Kromvel."
        objasnjenje: "Tačno — Kromvel je predvodio pristalice parlamenta i porazio kralja Čarlsa I."
        iz_udzbenika:
          strana: 40
