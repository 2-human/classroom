          naslov: O vladama (sažetak odlomka)
          tekst: "Da bi se ta prava osigurala, ljudi ustanovljavaju vlade. Pravedna moć vlade potiče iz volje onih kojima ona upravlja."
          napomena: "Odlomak je prepričan; udžbenik, str. 44."
        pitanje: "Odakle, prema Deklaraciji, vlada dobija svoju pravednu moć?"
        odgovori:
          - {tekst: "Iz volje ljudi kojima upravlja", tacan: true}
          - {tekst: "Od Boga, po božjoj milosti", tacan: false, zasto: "Tako su govorili kraljevi poput Stjuarta; Deklaracija vlast izvodi iz volje naroda."}
          - {tekst: "Od britanskog parlamenta", tacan: false, zasto: "Kolonisti se upravo odvajaju od britanske vlasti."}
          - {tekst: "Iz snage vojske", tacan: false, zasto: "Deklaracija govori o volji naroda, ne o sili."}
        pomoc:
          - "Šta je suprotno od „božje milosti”?"
          - "Ko daje vlast vladi?"
          - "Iz lekcije: pravedna moć vlade proističe iz volje onih kojima vlada."
        objasnjenje: "Deklaracija kaže da vlast dolazi od naroda — suprotno ideji o vlasti po božjoj milosti."
        iz_udzbenika:
          strana: 44
          odeljak: "Svedočanstvo: Deklaracija nezavisnosti"
          tekst: "Vlade se osnivaju da čuvaju prava, a njihova pravedna moć potiče iz volje onih kojima vladaju."

      - id: l05-amr-izvor-smena
        vrsta: izvor
        tezina: tesko
        pojmovi: [deklaracija-nezavisnosti, neotudjiva-prava]
        izvor:
          autor: Deklaracija nezavisnosti, 1776.
          naslov: O pravu naroda (sažetak odlomka)
          tekst: "Kad god neki oblik vlade počne da šteti ciljevima zbog kojih je osnovan, narod ima pravo da ga promeni ili ukine i da osnuje novu vladu, onako kako smatra da će najbolje obezbediti svoju sigurnost i sreću."
          napomena: "Odlomak je prepričan; udžbenik, str. 44."
        pitanje: "Pod kojim uslovom, prema Deklaraciji, narod sme da smeni vladu?"
        odgovori:
          - {tekst: "Kad vlada počne da ugrožava prava zbog kojih je osnovana", tacan: true}
          - {tekst: "Nikada — vladi se mora uvek pokoravati", tacan: false, zasto: "Deklaracija izričito daje narodu pravo da promeni ili ukine vladu."}
          - {tekst: "Samo kada to dozvoli kralj", tacan: false, zasto: "Deklaracija se ne oslanja na kralja; pravo pripada narodu."}
          - {tekst: "Svake godine, bez razloga", tacan: false, zasto: "Uslov je da vlada šteti pravima naroda."}
        pomoc:
          - "Zbog čega se, prema odlomku, vlade uopšte osnivaju?"
          - "Šta ako vlada počne da radi suprotno tom cilju?"
          - "Iz lekcije: kad oblik vlade postane štetan po te ciljeve, narod ima pravo da ga promeni ili ukine."
        objasnjenje: "Vlada postoji da čuva prava; ako ih ugrožava, narod može da je promeni ili ukine — tako kolonisti opravdavaju odvajanje od Britanije."
        iz_udzbenika:
          strana: 44
          odeljak: "Svedočanstvo: Deklaracija nezavisnosti"
          tekst: "Udžbenik pita ima li narod pravo da smeni vladu i pod kojim uslovima."

      - id: l05-amr-ko-sam-dzeferson
        vrsta: ko_sam
        tezina: tesko
        pojmovi: [tomas-dzeferson, deklaracija-nezavisnosti, prosvetitelji]
        tragovi:
          - "Bio sam jedan od vođa američkih kolonista."
          - "Ideje sam crpeo od francuskih prosvetitelja."
          - "Sastavio sam dokument koji je Kongres izglasao 4. jula 1776."
        odgovori:
          - {tekst: "Tomas Džeferson", tacan: true}
          - {tekst: "Džordž Vašington", tacan: false, zasto: "Vašington je bio glavni zapovednik vojske, a ne pisac Deklaracije."}
          - {tekst: "Monteskje", tacan: false, zasto: "Monteskje je francuski prosvetitelj, a ne američki kolonista."}
          - {tekst: "Oliver Kromvel", tacan: false, zasto: "Kromvel je engleski vođa iz XVII veka."}
        objasnjenje: "To je Tomas Džeferson, pisac Deklaracije nezavisnosti."
        iz_udzbenika:
          strana: 43
          odeljak: Američka revolucija
          tekst: "Deklaraciju je, prema idejama francuskih prosvetitelja, sastavio Tomas Džeferson."

      - id: l05-amr-uporedi-cajanka-jorktaun
        vrsta: uporedi
        tezina: lako
        pojmovi: [bostonska-cajanka, jorktaun]
        a: Bostonska čajanka
        b: Jorktaun
        pitanje: "Na koji događaj se odnosi tvrdnja?"
        tvrdnje:
          - {tekst: "Dogodio se 1773.", odgovor: a, zasto: "Bostonska čajanka je 1773."}
          - {tekst: "Dogodio se 1781.", odgovor: b, zasto: "Predaja kod Jorktauna je 1781."}
          - {tekst: "Kolonisti prerušeni u Indijance bacaju čaj u more.", odgovor: a, zasto: "To je Bostonska čajanka."}
          - {tekst: "Pomogli su francuski ratni brodovi i vojska.", odgovor: b, zasto: "Kod Jorktauna Vašington pobeđuje uz francusku pomoć."}
          - {tekst: "Deo je borbe kolonista protiv britanske vlasti.", odgovor: oba, zasto: "Čajanka je povod, a Jorktaun odlučujuća pobeda iste borbe."}
          - {tekst: "Tu je potpisan mir 1783.", odgovor: nijedan, zasto: "Mir je potpisan u Parizu."}
        pomoc:
          - "Jedan događaj je povod, drugi odlučujuća pobeda."
          - "Ko je pomagao Vašingtonu na kraju rata?"
          - "Iz lekcije: Bostonska čajanka 1773; Jorktaun 1781 uz francusku pomoć; mir u Parizu 1783."
        objasnjenje: "Čajanka (1773) je povod revolucije, Jorktaun (1781) odlučujuća pobeda; mir je potpisan u Parizu."
        iz_udzbenika:
          strana: 43
          odeljak: Američka revolucija
          tekst: "Lekcija opisuje Bostonsku čajanku kao povod i predaju kod Jorktauna kao odlučujući događaj."

      - id: l05-amr-uporedi-revolucije
        vrsta: uporedi
        tezina: tesko
        pojmovi: [engleska-revolucija, americka-revolucija, republika]
        a: Engleska u XVII veku (Građanski rat i Slavna revolucija)
        b: Američka revolucija
        pitanje: "Na koju revoluciju se odnosi tvrdnja?"
        tvrdnje:
          - {tekst: "Kralj je izveden pred sud i osuđen na smrt.", odgovor: a, zasto: "Čarls I je osuđen posle Građanskog rata; u Americi kralj nije suđen."}
          - {tekst: "Nastala je nova, nezavisna država.", odgovor: b, zasto: "Iz kolonija su nastale SAD; Engleska je ostala ista država."}
          - {tekst: "Pomogla je strana sila, Francuska.", odgovor: b, zasto: "Francuska je pomagala američke koloniste."}
          - {tekst: "Vodila se protiv neograničene vlasti kralja (krune).", odgovor: oba, zasto: "U Engleskoj protiv Stjuarta, u Americi protiv britanske krune i njenih mera."}
          - {tekst: "Posle nje je bila uspostavljena republika.", odgovor: oba, zasto: "Engleska je posle Građanskog rata proglašena republikom, a SAD su republika od nastanka."}
          - {tekst: "Počela je u Francuskoj.", odgovor: nijedan, zasto: "Jedna je u Engleskoj, druga u Severnoj Americi."}
        pomoc:
          - "Šta se desilo sa kraljem u Engleskoj, a šta sa kolonijama u Americi?"
          - "U obe se vodi borba protiv vlasti krune."
          - "Iz lekcije: Engleska — suđenje kralju, republika, pa parlamentarna monarhija; Amerika — nezavisnost uz pomoć Francuske, republika."
        objasnjenje: "Obe revolucije ograničavaju ili odbacuju vlast krune i vode do republike, ali samo američka stvara novu državu i to uz francusku pomoć."
        iz_udzbenika:
          strana: 43
          odeljak: Američka revolucija
          tekst: "Lekcija opisuje dve revolucije: englesku u XVII i američku u XVIII veku."

      - id: l05-amr-objasni-cajanka
        vrsta: objasni
        tezina: srednje
        pojmovi: [bostonska-cajanka, kongres, americka-revolucija]
        pitanje: "Šta je bila Bostonska čajanka i zašto se smatra povodom Američke revolucije?"
        uzor: "Britanska vlada je 1773. htela da u kolonijama rasproda čaj iz Indije. Kolonisti su to sprečavali, a u Bostonu su, prerušeni u Indijance, bacili tovare čaja sa britanskih brodova u more. Britanci su zatvorili luku i doveli nove trupe, a te „nepodnošljive” mere bile su povod za prvi kongres kolonista u Filadelfiji 1774, što neki istoričari smatraju početkom revolucije."
        ideje:
          - "Britanija hoće da proda čaj iz Indije u kolonijama."
          - "Kolonisti prerušeni u Indijance bacaju čaj u more (1773)."
          - "Britanci zatvaraju luku i dovode trupe („nepodnošljive mere”)."
          - "Povod za prvi kongres u Filadelfiji 1774."
        objasnjenje: "Čajanka je izazvala oštre britanske kazne, a one su ujedinile koloniste na prvom kongresu."
        iz_udzbenika:
          strana: 43
          odeljak: "Znatiželja: Bostonska čajanka"
          tekst: "Bostonska čajanka 1773. i britanske kazne bile su povod za prvi kongres kolonista 1774."
          slika: 05-engleska-i-americka-revolucija/06-bostonska-cajanka.jpg

      - id: l05-amr-objasni-francuska
        vrsta: objasni
        tezina: srednje
        pojmovi: [francuska, jorktaun, pariski-mir-1783]
        pitanje: "Zašto je ulazak Francuske u rat bio prekretnica za američke koloniste?"
        uzor: "Francuska je želela da nanese što veću štetu Britaniji, pa je pomogla kolonistima ratnim brodovima i redovnom vojskom. Uz tu pomoć Vašington je 1781. primorao Britance na predaju kod Jorktauna. Mešanje Francuske i drugih sila nateralo je Britaniju na mir u Parizu 1783. i priznanje SAD."
        ideje:
          - "Francuska hoće da naudi Britaniji."
          - "Pomaže ratnim brodovima i vojskom."
          - "Pobeda kod Jorktauna 1781."
          - "Britanija pristaje na mir u Parizu 1783."
        objasnjenje: "Bez francuske flote i vojske kolonisti teško da bi pobedili kod Jorktauna i izborili mir."
        iz_udzbenika:
          strana: 43
          odeljak: Američka revolucija
          tekst: "Uz francusku pomoć Britanci su se predali kod Jorktauna 1781, a mir u Parizu 1783. priznao je SAD."

      - id: l05-amr-objasni-deklaracija
        vrsta: objasni
        tezina: tesko
        pojmovi: [deklaracija-nezavisnosti, neotudjiva-prava]
        pitanje: "Prema Deklaraciji nezavisnosti, zašto nastaju vlade i ima li narod pravo da smeni vladu? Šta ti misliš o tome?"
        uzor: "Prema Deklaraciji, svi ljudi su jednaki i imaju neotuđiva prava na život, slobodu i težnju ka sreći. Vlade nastaju da bi čuvale ta prava, a moć dobijaju od naroda. Ako vlada počne da ugrožava ta prava, narod ima pravo da je promeni ili ukine i osnuje novu. Mislim da je to pravedno, jer vlast treba da služi ljudima."
        ideje:
          - "Neotuđiva prava: život, sloboda, težnja ka sreći."
          - "Vlade nastaju da čuvaju ta prava."
          - "Moć vlade potiče iz volje naroda."
          - "Narod može da promeni vladu koja ugrožava ta prava (+ lični stav)."
        objasnjenje: "Deklaracija vlast zasniva na narodu, a ne na božjoj milosti — zato narod može i da je smeni."
        iz_udzbenika:
          strana: 44
          odeljak: "Svedočanstvo: Deklaracija nezavisnosti"
          tekst: "Udžbenik pita koja su neotuđiva prava, zašto nastaju vlade i ima li narod pravo da smeni vladu."

  # ==========================================================================
  - naslov: Uređenje Sjedinjenih Američkih Država
    zadaci:
      - id: l05-sad-izbor-republika
        vrsta: izbor
        tezina: lako
        pojmovi: [republika, sjedinjene-americke-drzave]
        pitanje: "Kako je bila uređena nova američka država?"
        odgovori:
          - {tekst: "Kao republika", tacan: true}
          - {tekst: "Kao apsolutistička monarhija", tacan: false, zasto: "SAD nisu imale kralja; predsednika su birali građani."}
          - {tekst: "Kao parlamentarna monarhija", tacan: false, zasto: "To je britansko uređenje; u SAD nema vladara."}
          - {tekst: "Kao kolonija Francuske", tacan: false, zasto: "SAD su postale nezavisne; Francuska im je samo pomogla u ratu."}
        pomoc:
          - "Ko je na čelu SAD — kralj ili izabrani predsednik?"
          - "Država bez kralja je …"
          - "Iz lekcije: nova država bila je organizovana kao republika."
        objasnjenje: "SAD su republika: na čelu je predsednik koga biraju građani."
        iz_udzbenika:
          strana: 44
          odeljak: Uređenje Sjedinjenih Američkih Država
          tekst: "Nova država bila je organizovana kao republika."

      - id: l05-sad-izbor-mandat
        vrsta: izbor
        tezina: lako
        pojmovi: [predsednik]
        pitanje: "Na koliko godina se birao američki predsednik?"
        odgovori:
          - {tekst: "Na četiri godine", tacan: true}
          - {tekst: "Doživotno", tacan: false, zasto: "Doživotno je vladao Kromvel u Engleskoj; u SAD predsednik se bira na četiri godine."}
          - {tekst: "Na jednu godinu", tacan: false, zasto: "Mandat je četiri godine."}
          - {tekst: "Na četrdeset godina", tacan: false, zasto: "Mandat je četiri, ne četrdeset godina."}
        pomoc:
          - "Mandat je kraći od deset godina."
          - "Izbori su svake … godine."
          - "Iz lekcije: predsednik je biran na četiri godine."
        objasnjenje: "Izvršnu vlast u SAD ima predsednik biran na četiri godine."
        iz_udzbenika:
          strana: 44
          odeljak: Uređenje Sjedinjenih Američkih Država
          tekst: "Izvršnu vlast je predstavljao predsednik biran na četiri godine."

      - id: l05-sad-izbor-kongres
        vrsta: izbor
        tezina: lako
        pojmovi: [kongres, senat, predstavnicki-dom]
        pitanje: "Od koja dva tela se sastojao američki Kongres?"
        odgovori:
          - {tekst: "Senata i Predstavničkog doma", tacan: true}
          - {tekst: "Gornjeg doma i Donjeg doma", tacan: false, zasto: "To su domovi britanskog parlamenta."}
          - {tekst: "Predsednika i Vrhovnog suda", tacan: false, zasto: "Predsednik je izvršna, a Vrhovni sud sudska vlast — nisu delovi Kongresa."}
          - {tekst: "Vigovaca i torijevaca", tacan: false, zasto: "To su britanske stranke, ne tela Kongresa."}
        pomoc:
          - "Kongres je zakonodavna vlast SAD."
          - "Jedno telo ima ime koje podseća na stari Rim."
          - "Iz lekcije: Kongres čine Senat i Predstavnički dom."
        objasnjenje: "Zakonodavnu vlast u SAD ima Kongres sa dva tela — Senatom i Predstavničkim domom."
        iz_udzbenika:
          strana: 44
          odeljak: Uređenje Sjedinjenih Američkih Država
          tekst: "Zakonodavnu vlast predstavljao je Kongres, sastavljen od Senata i Predstavničkog doma."

      - id: l05-sad-izbor-bez-prava
        vrsta: izbor
        tezina: srednje
        pojmovi: [pravo-glasa, indijanci, robovlasnistvo]
        pitanje: "Ko je u SAD krajem XVIII veka bio lišen političkih prava? (više tačnih)"
        odgovori:
          - {tekst: "Siromašni belci", tacan: true}
          - {tekst: "Žene", tacan: true}
          - {tekst: "Crni robovi", tacan: true}
          - {tekst: "Starosedeoci (Indijanci)", tacan: true}
          - {tekst: "Beli vlasnici zemlje", tacan: false, zasto: "Samo su oni imali pravo da biraju i budu birani."}
        pomoc:
          - "Ko je JEDINI imao pravo glasa?"
          - "Svi ostali su bez prava."
          - "Iz lekcije: pravo glasa samo beli zemljoposednici; siromašni belci, žene, crni robovi i Indijanci bez političkih prava."
        objasnjenje: "Pravo da biraju i budu birani imali su samo beli vlasnici zemlje; svi ostali — siromašni belci, žene, robovi i Indijanci — bili su bez političkih prava."
        iz_udzbenika:
          strana: 44
          odeljak: Uređenje Sjedinjenih Američkih Država
          tekst: "Siromašni belci, žene, crni robovi i starosedeoci bili su lišeni političkih prava."

      - id: l05-sad-izbor-ime-grada
        vrsta: izbor
        tezina: srednje
        pojmovi: [vasington-grad, dzordz-vasington]
        pitanje: "Zašto je glavni grad SAD, osnovan 1800, dobio ime po Džordžu Vašingtonu?"
        odgovori:
          - {tekst: "Kao junak revolucije i prvi predsednik uživao je veliki ugled", tacan: true}
          - {tekst: "Zato što je on lično sagradio grad", tacan: false, zasto: "Lekcija razlog vidi u njegovom ugledu, ne u gradnji."}
          - {tekst: "Zato što je sastavio Deklaraciju nezavisnosti", tacan: false, zasto: "Deklaraciju je sastavio Džeferson."}
          - {tekst: "Zato što je bio britanski kralj", tacan: false, zasto: "Vašington je vodio vojsku protiv Britanije."}
        pomoc:
          - "Šta je Vašington radio u ratu, a šta posle njega?"
          - "Ljudi su ga veoma poštovali."
          - "Iz lekcije: kao jedan od junaka revolucije uživao je veliki ugled; glavni grad je nazvan po njemu."
        objasnjenje: "Vašington je bio junak revolucije i prvi predsednik, pa je po njemu nazvan glavni grad osnovan 1800."
        iz_udzbenika:
          strana: 44
          odeljak: Uređenje Sjedinjenih Američkih Država
          tekst: "Vašington je kao junak revolucije uživao veliki ugled; glavni grad SAD, osnovan 1800, dobio je ime po njemu."
          slika: 05-engleska-i-americka-revolucija/07-dzordz-vasington.jpg

