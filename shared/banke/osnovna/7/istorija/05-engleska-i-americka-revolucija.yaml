          - "Seti se uloge Gornjeg doma u odlukama."
          - "Iz lekcije: Donji dom — izabrani poslanici sitnog plemstva i bogatog građanstva; pobednička stranka sastavlja vladu."
        objasnjenje: "Donji dom je bio izborni dom sitnog plemstva i bogatog građanstva; iz njega je nastajala vlada, ali su njegove odluke prolazile i kroz Gornji dom."
        iz_udzbenika:
          strana: 41
          odeljak: Stvaranje parlamentarne monarhije
          tekst: "Donji dom su činili izabrani poslanici, uglavnom sitno plemstvo i bogato građanstvo."

