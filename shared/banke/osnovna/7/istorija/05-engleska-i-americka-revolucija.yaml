        b: Kolonisti
        pitanje: "Ko je to uradio — britanske vlasti, kolonisti, obe strane ili niko?"
        tvrdnje:
          - {tekst: "Uvele su carine i druge dažbine.", odgovor: a, zasto: "Carine i dažbine nametale su britanske vlasti."}
          - {tekst: "Tražili su predstavnike u britanskom parlamentu.", odgovor: b, zasto: "To je bio zahtev kolonista."}
          - {tekst: "Prestali su da kupuju britansku robu.", odgovor: b, zasto: "Bojkot je bio odgovor kolonista na odbijanje."}
          - {tekst: "Pokušala je da uhapsi vođe protesta 1775.", odgovor: a, zasto: "Britanska vojska je pokušala hapšenje i razoružavanje."}
          - {tekst: "Učestvovali su u sukobima koji su prerasli u Američku revoluciju.", odgovor: oba, zasto: "Rat su vodile obe strane."}
          - {tekst: "Ukinuli su robovlasništvo u kolonijama.", odgovor: nijedan, zasto: "Robovlasništvo je postojalo i nije ga ukinula nijedna strana u ovom periodu."}
        pomoc:
          - "Ko je nametao pravila, a ko se bunio?"
          - "Rat uvek ima dve strane."
          - "Iz lekcije: Britanci — pravila, carine, pokušaj hapšenja; kolonisti — zahtev za predstavnicima, protesti, bojkot."
        objasnjenje: "Britanske vlasti su nametale mere i poslale vojsku; kolonisti su tražili prava, protestovali i bojkotovali robu."
        iz_udzbenika:
          strana: 42
          odeljak: Britanske kolonije u Severnoj Americi
          tekst: "Lekcija opisuje mere Britanaca i odgovor kolonista do 1775."

      - id: l05-kol-objasni-nezadovoljstvo
