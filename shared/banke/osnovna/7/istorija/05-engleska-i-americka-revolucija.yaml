        objasnjenje: "Povelja vezuje kralja za odluke parlamenta → parlamentarna monarhija."
        iz_udzbenika:
          strana: 41
          odeljak: Stvaranje parlamentarne monarhije
          tekst: "Povelja o pravima obavezuje vladara na odluke parlamenta i tako nastaje parlamentarna monarhija."
        osa: {naziv: Povelja o pravima, od: 1689, traka: dogadjaji}

      - id: l05-parl-lanac-vlada
        vrsta: lanac
        tezina: srednje
        pojmovi: [donji-dom, vlada, vigovci, torijevci]
        karike:
          - "Stranka dobija najviše poslanika na izborima za Donji dom"
          - "?"
          - "Vlada podnosi izveštaje o svom radu parlamentu"
        praznina: 1
        odgovori:
          - {tekst: "Ta stranka dobija priliku da sastavi vladu", tacan: true}
          - {tekst: "Kralj raspušta parlament", tacan: false, zasto: "Posle Povelje o pravima kralj vlada u skladu sa parlamentom."}
          - {tekst: "Gornji dom bira predsednika", tacan: false, zasto: "U Britaniji nema predsednika — na čelu je kralj, a vladu sastavlja pobednička stranka."}
        pomoc:
          - "Šta dobija pobednik izbora?"
          - "Pobednik izbora vodi državne poslove."
          - "Iz lekcije: stranka sa najviše poslanika sastavlja vladu."
        objasnjenje: "Pobednička stranka u Donjem domu sastavlja vladu, a vlada odgovara parlamentu."
        iz_udzbenika:
          strana: 41
          odeljak: Stvaranje parlamentarne monarhije
          tekst: "Stranka sa najviše poslanika u Donjem domu dobija mogućnost da sastavi vladu."

      - id: l05-parl-izvor-zakoni
        vrsta: izvor
        tezina: lako
        pojmovi: [povelja-o-pravima, parlament]
        izvor:
          autor: Povelja o pravima, 1689.
          naslov: Prava i slobode (sažetak odlomka)
          tekst: "Nezakonito je da kraljevska vlast bez pristanka parlamenta obustavlja zakone ili ih primenjuje po svom nahođenju. Izbori za članove parlamenta treba da budu slobodni."
          napomena: "Odlomak je prepričan; udžbenik, str. 41."
        pitanje: "Čiji je pristanak, prema ovom odlomku, potreban da bi se zakon obustavio?"
        odgovori:
          - {tekst: "Parlamenta", tacan: true}
          - {tekst: "Samo kralja", tacan: false, zasto: "Upravo to Povelja zabranjuje — kralj ne može sam."}
          - {tekst: "Pape", tacan: false, zasto: "Crkva se u odlomku ne pominje."}
          - {tekst: "Američkih kolonista", tacan: false, zasto: "Kolonisti nisu imali predstavnike u britanskom parlamentu."}
        pomoc:
          - "Pročitaj prvu rečenicu odlomka."
          - "Bez čijeg pristanka je to nezakonito?"
          - "Iz lekcije: kralj ne može bez pristanka parlamenta da obustavi ili primeni zakone."
        objasnjenje: "Povelja zahteva pristanak parlamenta — kralj više ne može sam da menja ili obustavlja zakone."
        iz_udzbenika:
          strana: 41
          odeljak: "Svedočanstvo: Povelja o pravima"
          tekst: "Povelja zabranjuje kralju da bez pristanka parlamenta obustavlja ili primenjuje zakone."

      - id: l05-parl-izvor-sloboda-govora
        vrsta: izvor
        tezina: srednje
        pojmovi: [povelja-o-pravima, parlament]
        izvor:
          autor: Povelja o pravima, 1689.
          naslov: Prava i slobode (sažetak odlomka)
          tekst: "Za ono što se u parlamentu kaže, raspravlja i radi, niko ne sme da bude osuđen ni pozvan na odgovornost na sudu ili bilo gde van parlamenta. Parlament treba da se sastaje često, da bi se žalbe i izmene zakona rešavale na vreme."
          napomena: "Odlomak je prepričan; udžbenik, str. 41."
        pitanje: "Šta ova tačka znači za poslanike?"
        odgovori:
          - {tekst: "Mogu slobodno da govore u parlamentu, bez straha da će zbog toga biti kažnjeni", tacan: true}
          - {tekst: "Ne smeju ništa da govore bez kraljeve dozvole", tacan: false, zasto: "Odlomak štiti upravo slobodu govora u parlamentu."}
          - {tekst: "Smeju da se sastaju samo jednom u deset godina", tacan: false, zasto: "Povelja traži da se parlament sastaje često."}
          - {tekst: "Mogu da sude kralju kad god žele", tacan: false, zasto: "Odlomak govori o zaštiti poslanika, a ne o suđenju kralju."}
        pomoc:
          - "Ko je zaštićen ovom tačkom?"
          - "Šta se ne sme raditi zbog onoga što je rečeno u parlamentu?"
          - "Iz lekcije: sloboda govora, rasprave i postupaka u parlamentu ne sme se kažnjavati van parlamenta."
        objasnjenje: "Poslanici mogu slobodno da govore i kritikuju, jer ih niko van parlamenta ne može goniti zbog toga."
        iz_udzbenika:
          strana: 41
          odeljak: "Svedočanstvo: Povelja o pravima"
          tekst: "Povelja štiti slobodu govora, rasprave i postupaka u parlamentu i traži da se parlament često sastaje."

      - id: l05-parl-izvor-nasledje
        vrsta: izvor
        tezina: srednje
        pojmovi: [povelja-o-pravima]
        izvor:
          autor: Udžbenik (prepričano)
          naslov: Uvod u odlomak Povelje o pravima
          tekst: "Odlomak iz Povelje o pravima iz 1689. je deo kojim se proglašavaju prava i slobode pojedinaca i rešava pitanje nasleđivanja krune."
          napomena: "Prepričano; udžbenik, str. 41."
        pitanje: "Koja dva pitanja, prema ovom opisu, rešava Povelja o pravima?"
        odgovori:
          - {tekst: "Prava i slobode pojedinaca i nasleđivanje krune", tacan: true}
          - {tekst: "Nezavisnost američkih kolonija i ropstvo", tacan: false, zasto: "Povelja je engleski dokument iz 1689; kolonije se odvajaju tek 1776."}
          - {tekst: "Ujedinjenje sa Škotskom i granice sa Francuskom", tacan: false, zasto: "Ujedinjenje sa Škotskom je početkom XVIII veka i ne pominje se u Povelji."}
          - {tekst: "Gradnju fabrika i rad dece", tacan: false, zasto: "To su teme industrijske revolucije, ne Povelje o pravima."}
        pomoc:
          - "Pročitaj uvodnu rečenicu iznad odlomka."
          - "Jedno se tiče ljudi, drugo kralja."
          - "Iz lekcije: Povelja proglašava prava i slobode pojedinaca i rešava nasleđivanje krune."
        objasnjenje: "Povelja o pravima proglašava prava i slobode pojedinaca i uređuje ko nasleđuje krunu."
        iz_udzbenika:
          strana: 41
          odeljak: "Svedočanstvo: Povelja o pravima"
          tekst: "Odlomak proglašava prava i slobode pojedinaca i rešava pitanje nasleđivanja krune."

      - id: l05-parl-izvor-najvaznije
        vrsta: izvor
        tezina: tesko
        pojmovi: [povelja-o-pravima, parlamentarna-monarhija]
        izvor:
          autor: Povelja o pravima, 1689.
          naslov: Četiri tačke (sažetak)
          tekst: "1) Kralj bez pristanka parlamenta ne sme da obustavlja niti po svom nahođenju primenjuje zakone. 2) Izbori za parlament su slobodni. 3) Za reči i postupke u parlamentu niko ne sme biti gonjen van parlamenta. 4) Parlament treba često da se sastaje."
          napomena: "Odlomak je prepričan; udžbenik, str. 41."
        pitanje: "Koja tačka najneposrednije pretvara Englesku u parlamentarnu monarhiju?"
        odgovori:
          - {tekst: "Prva — kralj ne može mimo parlamenta da menja i obustavlja zakone", tacan: true}
          - {tekst: "Treća — sloboda govora poslanika", tacan: false, zasto: "Važna je za rad parlamenta, ali ne određuje odnos kralja i parlamenta prema zakonima."}
          - {tekst: "Četvrta — česta zasedanja", tacan: false, zasto: "Česta zasedanja pomažu, ali sama ne oduzimaju kralju vlast nad zakonima."}
          - {tekst: "Nijedna — Povelja ne ograničava kralja", tacan: false, zasto: "Povelja upravo vezuje kralja za odluke parlamenta."}
        pomoc:
          - "Parlamentarna monarhija = vladar deli vlast sa parlamentom."
          - "Koja tačka direktno govori o kralju i zakonima?"
          - "Iz lekcije: vladar mora da vlada u skladu sa odlukama parlamenta."
        objasnjenje: "Kad kralj ne može bez parlamenta da obustavi ili primeni zakon, on deli vlast sa parlamentom — to je parlamentarna monarhija."
        iz_udzbenika:
          strana: 41
          odeljak: "Svedočanstvo: Povelja o pravima"
          tekst: "Udžbenik traži da navedeš šta Povelja utvrđuje i koju tačku smatraš najvažnijom."

      - id: l05-parl-uporedi-domovi
        vrsta: uporedi
        tezina: srednje
        pojmovi: [gornji-dom, donji-dom]
        a: Gornji dom (Dom lordova)
        b: Donji dom
        pitanje: "Na koji dom britanskog parlamenta se odnosi tvrdnja?"
        tvrdnje:
          - {tekst: "Članovi su bili predstavnici krupnog plemstva.", odgovor: a, zasto: "Dom lordova je bio dom krupnog plemstva."}
          - {tekst: "Članovi su bili izabrani poslanici.", odgovor: b, zasto: "U Donji dom se biralo."}
          - {tekst: "Mesto se dobijalo naslednim pravom.", odgovor: a, zasto: "Lordovi su nasleđivali mesto u parlamentu."}
          - {tekst: "Stranka sa najviše poslanika u njemu sastavlja vladu.", odgovor: b, zasto: "Vlada je zavisila od izbora za Donji dom."}
          - {tekst: "Deo je britanskog parlamenta.", odgovor: oba, zasto: "Parlament je imao oba doma."}
          - {tekst: "Činili su ga predstavnici američkih kolonija.", odgovor: nijedan, zasto: "Zahtev kolonista da uđu u britanski parlament bio je odbijen."}
        pomoc:
          - "Jedan dom je nasledni, drugi izborni."
          - "Vlada potiče iz izbornog doma."
          - "Iz lekcije: Gornji dom — krupno plemstvo, nasledno; Donji dom — izabrani poslanici, iz njega vlada."
        objasnjenje: "Gornji dom = nasledno krupno plemstvo; Donji dom = izabrani poslanici sitnog plemstva i građanstva, iz kojih nastaje vlada."
        iz_udzbenika:
          strana: 41
          odeljak: Stvaranje parlamentarne monarhije
          tekst: "Gornji dom činili su krupni plemići po naslednom pravu, a Donji dom izabrani poslanici."

      - id: l05-parl-uporedi-stranke
        vrsta: uporedi
        tezina: tesko
        pojmovi: [vigovci, torijevci]
        a: Vigovci
        b: Torijevci
        pitanje: "Na koju stranku se odnosi tvrdnja?"
        tvrdnje:
          - {tekst: "Protive se apsolutističkoj vlasti kralja.", odgovor: a, zasto: "Vigovci su protivnici apsolutističke kraljevske vlasti."}
          - {tekst: "Zalažu se za snažnu kraljevsku vlast.", odgovor: b, zasto: "Torijevci su pristalice snažne kraljevske vlasti."}
          - {tekst: "Njeni poslanici sede u britanskom parlamentu.", odgovor: oba, zasto: "Poslanici su se delili na ove dve stranke."}
          - {tekst: "Ako dobije najviše poslanika, može da sastavi vladu.", odgovor: oba, zasto: "To pravilo važi za svaku stranku koja pobedi na izborima za Donji dom."}
          - {tekst: "To je stranka u američkom Kongresu iz 1787.", odgovor: nijedan, zasto: "Vigovci i torijevci su britanske stranke; lekcija ne govori o strankama u Kongresu."}
        pomoc:
          - "Jedna stranka je za jakog kralja, druga protiv."
          - "Obe se takmiče na istim izborima."
          - "Iz lekcije: vigovci — protivnici apsolutizma; torijevci — pristalice snažne kraljevske vlasti."
        objasnjenje: "Razlikuju se po stavu prema kraljevskoj vlasti, a obe su britanske parlamentarne stranke koje mogu sastaviti vladu."
        iz_udzbenika:
          strana: 41
          odeljak: "Definicije: parlamentarna monarhija, vigovci, torijevci"
          tekst: "Vigovci su protivnici apsolutističke vlasti, torijevci pristalice snažne kraljevske vlasti."

      - id: l05-parl-objasni-parlamentarna
        vrsta: objasni
        tezina: lako
        pojmovi: [parlamentarna-monarhija, povelja-o-pravima]
        pitanje: "Šta je parlamentarna monarhija i kako je nastala u Engleskoj?"
        uzor: "Parlamentarna monarhija je monarhija u kojoj vladar deli vlast sa parlamentom. U Engleskoj je nastala posle Slavne revolucije 1688, kada je kralj 1689. prihvatio Povelju o pravima. Njom je utvrđeno da vladar mora da vlada u skladu sa odlukama parlamenta."
        ideje:
          - "Vladar deli vlast sa parlamentom."
          - "Slavna revolucija 1688."
          - "Povelja o pravima 1689."
          - "Kralj mora da poštuje odluke parlamenta."
        objasnjenje: "Kralj ostaje na prestolu, ali ne vlada sam — vezan je odlukama parlamenta."
        iz_udzbenika:
          strana: 41
          odeljak: Stvaranje parlamentarne monarhije
          tekst: "Povelja o pravima (1689) je utvrdila da vladar vlada u skladu sa odlukama parlamenta; uspostavljena je parlamentarna monarhija."

      - id: l05-parl-objasni-povelja-tacka
        vrsta: objasni
        tezina: tesko
        pojmovi: [povelja-o-pravima, parlament]
        pitanje: "Navedi šta je utvrđeno Poveljom o pravima. Koju tačku smatraš najvažnijom i zašto?"
        uzor: "Povelja o pravima zabranjuje kralju da bez pristanka parlamenta obustavlja ili primenjuje zakone, traži slobodne izbore za parlament, štiti slobodu govora u parlamentu i traži da se parlament često sastaje. Najvažnija mi je prva tačka, jer kralj više ne može da vlada mimo parlamenta — vlast više nije u rukama jednog čoveka."
        ideje:
          - "Kralj ne može bez parlamenta da obustavlja ili primenjuje zakone."
          - "Slobodni izbori i sloboda govora u parlamentu."
          - "Parlament treba često da se sastaje."
          - "Izabrana tačka je obrazložena (npr. ograničava kralja)."
        objasnjenje: "Svaki izbor je dobar ako je obrazložen; ključno je da Povelja ograničava kralja i štiti parlament."
        iz_udzbenika:
          strana: 41
          odeljak: "Svedočanstvo: Povelja o pravima"
          tekst: "Udžbenik traži da navedeš šta je utvrđeno Poveljom o pravima i obrazložiš koja je tačka najvažnija."

      - id: l05-parl-objasni-slavna
        vrsta: objasni
        tezina: srednje
        pojmovi: [slavna-revolucija, parlamentarna-monarhija]
        pitanje: "Zašto se revolucija iz 1688. zove Slavna ili Beskrvna i šta je njome postignuto?"
        uzor: "Posle novih sukoba naslednika Čarlsa I i parlamenta, 1688. je došlo do promene vlasti bez sukoba i nasilja, pa je revolucija nazvana Beskrvnom ili Slavnom. Kralj je 1689. prihvatio Povelju o pravima i Engleska je postala parlamentarna monarhija."
        ideje:
          - "Prošla je bez sukoba i nasilja."
          - "Okončala je sukobe kralja i parlamenta."
          - "Kralj prihvata Povelju o pravima 1689."
          - "Nastaje parlamentarna monarhija."
        objasnjenje: "Za razliku od Građanskog rata, promena je bila mirna, a ishod trajan — parlamentarna monarhija."
        iz_udzbenika:
          strana: 41
          odeljak: Stvaranje parlamentarne monarhije
          tekst: "Slavna ili Beskrvna revolucija (1688) prošla je bez nasilja i dovela do Povelje o pravima."

