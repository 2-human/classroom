          - "Iz lekcije: bivše kolonije su se ujedinile u savez država (federaciju)."
        objasnjenje: "Tačno — samostalne bivše kolonije ujedinile su se u federaciju."
        iz_udzbenika:
          strana: 44
          odeljak: Uređenje Sjedinjenih Američkih Država
          tekst: "Bivše kolonije bile su zasebne države i ujedinile su se u savez država (federaciju)."

      - id: l05-sad-tn-dzeferson-grad
        vrsta: tacno_netacno
        tezina: lako
        pojmovi: [vasington-grad, tomas-dzeferson]
        tvrdnja: "Glavni grad SAD, osnovan 1800, dobio je ime po Tomasu Džefersonu."
        tacno: false
        ispravke:
          - {tekst: "Glavni grad je dobio ime po Džordžu Vašingtonu.", tacan: true}
          - {tekst: "Glavni grad je dobio ime po Filadelfiji.", tacan: false, zasto: "Filadelfija je poseban grad, gde je zasedao Kongres."}
          - {tekst: "Glavni grad je Boston, osnovan 1800.", tacan: false, zasto: "Boston je stari kolonijalni grad; glavni grad je Vašington."}
        pomoc:
          - "Ko je prvi predsednik i junak revolucije?"
          - "Grad se zove kao on."
          - "Iz lekcije: glavni grad SAD, osnovan 1800, dobio je ime po Vašingtonu."
        objasnjenje: "Netačno — glavni grad nosi ime Džordža Vašingtona."
        iz_udzbenika:
          strana: 44
          odeljak: Uređenje Sjedinjenih Američkih Država
          tekst: "Glavni grad SAD, osnovan 1800, dobio je ime po Vašingtonu."

      - id: l05-sad-tn-vrhovni-sud
        vrsta: tacno_netacno
        tezina: tesko
