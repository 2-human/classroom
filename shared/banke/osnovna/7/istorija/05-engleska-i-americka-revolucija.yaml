          - {tekst: "Poslanici su uglavnom bili sitno plemstvo i bogato građanstvo", tacan: true}
          - {tekst: "Stranka sa najviše poslanika u njemu sastavljala je vladu", tacan: true}
          - {tekst: "Njegove odluke nije morao niko da odobri", tacan: false, zasto: "Sve odluke Donjeg doma morao je najpre da odobri Gornji dom."}
          - {tekst: "Članom se postajalo naslednim pravom", tacan: false, zasto: "Nasledno pravo važi za Gornji dom; u Donji dom se biralo."}
        pomoc:
