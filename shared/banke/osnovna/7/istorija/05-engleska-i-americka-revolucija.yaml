          - {tekst: "Izabrani poslanici sitnog plemstva i građanstva", tacan: false, zasto: "To je sastav Donjeg doma."}
          - {tekst: "Predstavnici kolonija, izabrani u Americi", tacan: false, zasto: "Kolonisti nisu dobili predstavnike u britanskom parlamentu — to je bio njihov neispunjen zahtev."}
          - {tekst: "Sveštenici koje imenuje papa", tacan: false, zasto: "Lekcija Gornji dom opisuje kao skup krupnog plemstva."}
        pomoc:
          - "Ime „Dom lordova” govori ko tu sedi."
          - "Na izbore se ne ide — mesto se nasleđuje."
          - "Iz lekcije: Gornji dom čine predstavnici krupnog plemstva, po naslednom pravu."
        objasnjenje: "Članovi Gornjeg doma bili su krupni plemići koji su mesto nasleđivali."
        iz_udzbenika:
          strana: 41
          odeljak: Stvaranje parlamentarne monarhije
          tekst: "Gornji dom ili Dom lordova činili su predstavnici krupnog plemstva, članovi po naslednom pravu."

