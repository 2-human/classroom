          - "Kralj prihvata Povelju o pravima (1689)"
          - "?"
        praznina: 2
        odgovori:
          - {tekst: "U Engleskoj je uspostavljena parlamentarna monarhija", tacan: true}
          - {tekst: "Engleska je proglašena republikom", tacan: false, zasto: "Republika je bila posle Građanskog rata; Povelja zadržava kralja."}
          - {tekst: "Kralj ponovo vlada apsolutistički", tacan: false, zasto: "Povelja upravo ograničava kralja odlukama parlamenta."}
        pomoc:
          - "Kralj ostaje, ali mora da poštuje parlament."
          - "Kako se zove takva monarhija?"
