        pojmovi: [becki-kongres, napoleon-bonaparta]
        izvor:
          autor: "Karikatura iz 1814."
          naslov: "Bečki kongres (opis karikature)"
          tekst: "Vladari stoje oko stola: Napoleon desno vraća teritorije koje je osvojio, ruski car pruža krunu jednom gospodinu, austrijski car trpa zemlje u veliku korpu, pruski kralj se saginje po gradove, a španski kralj levo zadovoljno odlazi."
          napomena: "Opis karikature je prepričan; udžbenik, str. 58."
        pitanje: "Šta karikatura poručuje o Bečkom kongresu?"
        odgovori:
          - {tekst: "Pobednici dele teritorije koje je Napoleon morao da vrati", tacan: true}
          - {tekst: "Napoleon osvaja nove zemlje", tacan: false, zasto: "On ih upravo vraća — „iskašljava”."}
          - {tekst: "Vladari se odriču svih teritorija", tacan: false, zasto: "Naprotiv, grabe ih — austrijski car ih trpa u korpu."}
          - {tekst: "Kongres je uveo republike", tacan: false, zasto: "Vraćeni su kraljevi — ruski car pruža krunu Burbonu."}
        pomoc:
          - "Šta radi austrijski car sa korpom?"
          - "Šta radi Napoleon?"
          - "Iz lekcije: Napoleon vraća osvojeno, a vladari grabe teritorije."
        objasnjenje: "Karikatura ismeva pobednike koji grabe teritorije koje je Napoleon morao da vrati."
        iz_udzbenika: {strana: 58, odeljak: "Karikatura Bečkog kongresa", tekst: "Karikatura iz 1814. prikazuje kako Napoleon vraća osvojeno, a vladari dele teritorije.", slika: 07-napoleonovo-doba/08-karikatura-becki-kongres.jpg}

