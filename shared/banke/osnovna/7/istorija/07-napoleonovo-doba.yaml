          - "Nemačka konfederacija; Italija razjedinjena."
        objasnjenje: "Kongres je vratio stari poredak, stare dinastije i granice."
        iz_udzbenika: {strana: 58, odeljak: "Bečki kongres", tekst: "Bečki kongres je vratio predrevolucionarni poredak, Burbone i granice iz 1792."}

