        objasnjenje: "Bez flote vojska nije mogla nazad, pa je ostala u Egiptu, gde je stradala od klime i bolesti."
        iz_udzbenika: {strana: 54, odeljak: "Napoleonov uspon i pad Direktorijuma", tekst: "Bez brodova Napoleon je ostao zatočen u Egiptu, a vojnici su stradali od klime i bolesti."}

