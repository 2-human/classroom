        tezina: tesko
        pojmovi: [egipat, napoleon-bonaparta, velika-britanija]
        pitanje: "Kako bi ocenio pohod na Egipat kada se sve sabere?"
        odgovori:
          - {tekst: "Neuspeh — flota je izgubljena, vojska je stradala od klime i bolesti, a Napoleon ju je napustio", tacan: true}
          - {tekst: "Potpun uspeh — Egipat je postao francuska provincija", tacan: false, zasto: "Egipat nije pripojen; vojska je ostala bez brodova i stradala."}
          - {tekst: "Uspeh, jer je uništena britanska flota", tacan: false, zasto: "Obrnuto — Britanci su uništili francuske brodove."}
          - {tekst: "Nije se ni dogodio, jer je Napoleon ostao u Italiji", tacan: false, zasto: "Napoleon je 1798/99. bio u Egiptu."}
        pomoc:
          - "Korak 1: Šta se desilo sa flotom?"
          - "Korak 2: Šta je bilo sa vojnicima posle pobede kod piramida?"
          - "Iz lekcije: flota uništena na ušću Nila, vojnici stradali, Napoleon ih napustio."
        objasnjenje: "Iako je pobedio kod piramida, pohod je bio neuspeh: bez flote, sa bolesnom vojskom koju je Napoleon ostavio."
        iz_udzbenika: {strana: 54, odeljak: "Napoleonov uspon i pad Direktorijuma", tekst: "U Egiptu je Napoleon izgubio flotu, vojska je stradala, a on ju je napustio."}

