          - "Iz lekcije: zvanično — mir; tajno — sprečiti revolucije."
        objasnjenje: "Zvanično mir, a tajno gušenje revolucija, i to silom ako treba."
        iz_udzbenika: {strana: 59, odeljak: "Bečki kongres", tekst: "Zvanični cilj alijanse bio je očuvanje mira, a tajni sprečavanje novih revolucija."}

