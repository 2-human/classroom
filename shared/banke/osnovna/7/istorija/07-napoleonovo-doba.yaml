        objasnjenje: "Slaba vlast + slavni general + prevrat 1799 = Napoleon na vlasti."
        iz_udzbenika: {strana: 54, odeljak: "Napoleonov uspon i pad Direktorijuma", tekst: "Napoleon je od slavnog generala postao vođa prevrata 1799."}

