# Banka zadataka — 2.5. Napoleonovo doba (istorija, 7. razred, str. 54–60). Spaja se u spec.yaml.
# Pitanja sopstvenim rečima na osnovu beleške tools/istorija/_source/lekcije-7/07-napoleonovo-doba.md.
# Svaki pogrešan ponuđeni odgovor ima `zasto` — greška treba da nauči, ne samo da kazni.
# Vremenska osa — isti događaj uvek sa istim nazivom i godinama:
#   Napoleon Bonaparta (život) 1769–1821 · Napoleonov rat protiv Austrije u Italiji 1796–1797 ·
#   Ukidanje Mletačke republike 1797 · Napoleonov pohod na Egipat 1798–1799 · Prevrat protiv Direktorijuma 1799 ·
#   Ustav iz 1799. · Bitka kod Abukira 1799 · David slika „Napoleon prelazi Alpe” 1801 · Napoleon doživotni konzul 1802 ·
#   Mir sa Velikom Britanijom 1802 · Građanski zakonik (Napoleonov kodeks) 1804 · Napoleon se proglašava za cara 1804 ·
#   Prvo francusko carstvo 1804–1815 · Bitka kod Trafalgara 1805 · Bitka kod Austerlica 1805 · Mir sa Austrijom 1806 ·
#   Savez Napoleona i Aleksandra I 1807 · Napoleonova ženidba Marijom Lujzom 1810 · Pohod na Rusiju 1812 ·
#   Bitka kod Borodina 1812 · Bitka naroda kod Lajpciga 1813 · Napoleon se odriče prestola 1814 · Bečki kongres 1814–1815 ·
#   Napoleonovih sto dana 1815 · Bitka kod Vaterloa 1815 · Napoleonova smrt na Svetoj Jeleni 1821
# Str. 60 nije snimljena: nema pitanja iz rezimea ni završnih pitanja; objašnjenja pojmova „koalicija” i
# „konfederacija” iz rečnika nisu na snimku (koalicija se koristi samo onako kako je tekst objašnjava: savez sila).

