delovi:
  # ==========================================================================
  - naslov: "Napoleonov uspon i pad Direktorijuma"
    zadaci:
      - id: l07-uspon-izbor-direktorijum
        vrsta: izbor
        tezina: lako
        pojmovi: [direktorijum]
        pitanje: "Zašto vlast Direktorijuma nije bila sigurna?"
        odgovori:
          - {tekst: "Zbog neprekidnih ratova", tacan: true}
          - {tekst: "Zbog kontinentalne blokade", tacan: false, zasto: "Kontinentalnu blokadu Napoleon je proglasio tek kao car, mnogo posle pada Direktorijuma."}
          - {tekst: "Zbog poraza kod Vaterloa", tacan: false, zasto: "Vaterlo je bio 1815, kada Direktorijuma odavno nije bilo."}
          - {tekst: "Zbog povratka Burbona", tacan: false, zasto: "Burboni su vraćeni tek posle Napoleonovog pada, na Bečkom kongresu."}
        pomoc:
          - "Šta je Francuska stalno vodila u to vreme?"
          - "Upravo u tome su se proslavili generali."
          - "Iz lekcije: zbog stalnih ratova vlast Direktorijuma bila je nesigurna."
        objasnjenje: "Stalni ratovi su potresali Direktorijum, a istovremeno su generalima, pre svih Napoleonu, donosili slavu."
        iz_udzbenika: {strana: 54, odeljak: "Napoleonov uspon i pad Direktorijuma", tekst: "Zbog neprekidnih ratova vlast Direktorijuma nije bila stabilna."}

      - id: l07-uspon-izbor-italija
        vrsta: izbor
        tezina: lako
        pojmovi: [napoleon-bonaparta, austrija, italija]
        pitanje: "U kom ratu se Napoleon Bonaparta prvi put proslavio?"
        odgovori:
          - {tekst: "U ratu protiv Austrije u Italiji", tacan: true}
          - {tekst: "U ratu protiv Rusije", tacan: false, zasto: "Pohod na Rusiju bio je 1812. i završio se njegovim velikim porazom."}
          - {tekst: "U ratu protiv Pruske kod Berlina", tacan: false, zasto: "U Berlin je ušao tek kao car, posle 1805."}
          - {tekst: "U bici kod Trafalgara", tacan: false, zasto: "Kod Trafalgara (1805) francuska flota je teško poražena."}
        pomoc:
          - "Bilo je to 1796–1797, još pod Direktorijumom."
          - "Neprijatelj je bila habzburška država, a bojište južno od Alpa."
          - "Iz lekcije: slavu je stekao ratujući protiv Austrije u Italiji 1796–1797."
        objasnjenje: "Napoleon se proslavio pobedama nad Austrijom u Italiji 1796–1797."
        iz_udzbenika: {strana: 54, odeljak: "Napoleonov uspon i pad Direktorijuma", tekst: "Napoleon Bonaparta postao je slavan ratujući protiv Austrije u Italiji 1796–1797."}
        osa: {naziv: "Napoleonov rat protiv Austrije u Italiji", od: 1796, do: 1797, traka: dogadjaji}

      - id: l07-uspon-izbor-egipat-vlast
        vrsta: izbor
        tezina: srednje
        pojmovi: [egipat, osmansko-carstvo]
        pitanje: "Pod čijom vlašću je bio Egipat kada je tamo poslat Napoleon?"
        odgovori:
          - {tekst: "Osmanskog carstva", tacan: true}
          - {tekst: "Velike Britanije", tacan: false, zasto: "Britanska flota je ratovala kod Egipta, ali Egipat je tada pripadao Osmanskom carstvu."}
          - {tekst: "Habzburške monarhije", tacan: false, zasto: "Habzburška monarhija nije imala posede u Africi."}
          - {tekst: "Rusije", tacan: false, zasto: "Rusija nije vladala Egiptom."}
        pomoc:
          - "Ista sila je vladala i Balkanom."
          - "Njena prestonica je bio Istanbul."
          - "Iz lekcije: Egipat je tada bio pod vlašću Osmanskog carstva."
        objasnjenje: "Egipat je 1798/99. bio deo Osmanskog carstva."
        iz_udzbenika: {strana: 54, odeljak: "Napoleonov uspon i pad Direktorijuma", tekst: "Direktorijum je poslao Napoleona u Egipat, koji je tada pripadao Osmanskom carstvu."}

      - id: l07-uspon-izbor-nil
        vrsta: izbor
        tezina: srednje
        pojmovi: [velika-britanija, nil, egipat]
        pitanje: "Zbog čega je Napoleon ostao „zarobljen” u Egiptu?"
        odgovori:
          - {tekst: "Britanska flota je uništila francuske brodove na ušću Nila", tacan: true}
          - {tekst: "Osmanska vojska ga je opkolila kod piramida", tacan: false, zasto: "Kod piramida su Francuzi pobedili."}
          - {tekst: "Direktorijum mu je zabranio povratak", tacan: false, zasto: "Napoleon se na kraju sam vratio i srušio Direktorijum — zabrana nije bila razlog."}
          - {tekst: "Zima je zatvorila puteve", tacan: false, zasto: "Zima je uništila njegovu vojsku u Rusiji 1812, ne u Egiptu."}
        pomoc:
          - "Iz Egipta se u Francusku vraćalo morem."
          - "Šta se dogodilo sa brodovima?"
          - "Iz lekcije: britanska flota uništila je francuske brodove na ušću Nila."
        objasnjenje: "Bez brodova francuska vojska nije mogla da se vrati morem — Britanci su uništili flotu na ušću Nila."
        iz_udzbenika: {strana: 54, odeljak: "Napoleonov uspon i pad Direktorijuma", tekst: "Kada je britanska flota potopila francuske brodove na ušću Nila, Napoleon je ostao zatočen u Egiptu."}

      - id: l07-uspon-tn-piramide
        vrsta: tacno_netacno
        tezina: lako
        pojmovi: [bitka-kod-piramida, egipat]
        tvrdnja: "U Bici kod piramida francuska vojska je pobedila."
        tacno: true
        pomoc:
          - "Problemi Francuza u Egiptu nisu došli od bitke."
          - "Iz lekcije: pobedili su kod piramida, ali su stradali od klime i bolesti."
        objasnjenje: "Tačno — Francuzi su pobedili kod piramida, ali su vojnici stradali od surove klime i bolesti."
        iz_udzbenika: {strana: 54, odeljak: "Napoleonov uspon i pad Direktorijuma", tekst: "Francuska vojska je pobedila u Bici kod piramida, ali su vojnici stradali od klime i bolesti."}

      - id: l07-uspon-tn-ostavio-vojsku
        vrsta: tacno_netacno
        tezina: srednje
        pojmovi: [napoleon-bonaparta, egipat]
        tvrdnja: "Napoleon je ostao sa svojom vojskom u Egiptu do kraja pohoda i vratio se sa njom u Francusku."
        tacno: false
        ispravke:
          - {tekst: "Napoleon je napustio svoje vojnike da bi se što pre vratio u Francusku i učestvovao u prevratu.", tacan: true}
          - {tekst: "Napoleon je poginuo u Egiptu.", tacan: false, zasto: "Napoleon je živeo do 1821. i umro na Svetoj Jeleni."}
          - {tekst: "Napoleon je ostao u Egiptu kao njegov vladar.", tacan: false, zasto: "Egipat je bio osmanski; Napoleon se vratio u Francusku 1799."}
        pomoc:
          - "Šta mu je bilo važnije — vojska ili vlast u Parizu?"
          - "Iz lekcije: napustio je vojnike da bi stigao na prevrat protiv Direktorijuma."
        objasnjenje: "Netačno — Napoleon je ostavio vojsku u Egiptu i žurno se vratio u Francusku da bi učestvovao u prevratu."
        iz_udzbenika: {strana: 54, odeljak: "Napoleonov uspon i pad Direktorijuma", tekst: "Napoleon je napustio vojnike i vratio se u Francusku da bi učestvovao u prevratu 1799."}

      - id: l07-uspon-tn-mletacka
        vrsta: tacno_netacno
        tezina: srednje
        pojmovi: [mletacka-republika, venecija, napoleon-bonaparta]
        tvrdnja: "Napoleon je osvojio Veneciju i 1797. ukinuo Mletačku republiku."
        tacno: true
        pomoc:
          - "Seti se kojom je državom vladala Venecija."
          - "Iz lekcije: osvojio je Veneciju i ukinuo Mletačku republiku 1797."
        objasnjenje: "Tačno — u ratu u Italiji Napoleon je zauzeo Veneciju i ukinuo Mletačku republiku (1797)."
        iz_udzbenika: {strana: 54, odeljak: "Napoleonov uspon i pad Direktorijuma", tekst: "Napoleon je zauzeo Veneciju i ukinuo Mletačku republiku 1797."}
        osa: {naziv: "Ukidanje Mletačke republike", od: 1797, traka: dogadjaji}

      - id: l07-uspon-dopuni-uspon
        vrsta: dopuni
        tezina: lako
        pojmovi: [napoleon-bonaparta, mletacka-republika, egipat, direktorijum, konzulat]
        pitanje: "Dopuni rečenice o Napoleonovom usponu."
        tekst: "Napoleon je 1797. ukinuo {{Mletačku republiku}}, a 1798/99. ratovao je u {{Egiptu}}. Posle prevrata 1799. {{Direktorijum}} je raspušten i uveden je {{Konzulat}}."
        ponudjene: ["Mletačku republiku", "Egiptu", "Direktorijum", "Konzulat", "Rusiji", "Carstvo"]
        pomoc:
          - "Prvo se vodio rat u Italiji, pa u Africi."
          - "Carstvo dolazi tek 1804."
          - "Iz lekcije: Mletačka republika 1797, Egipat 1798/99, prevrat 1799 — Direktorijum raspušten, uveden Konzulat."
        objasnjenje: "Redom: Mletačka republika (1797), Egipat (1798/99), Direktorijum raspušten i uveden Konzulat (1799)."
        iz_udzbenika: {strana: 54, odeljak: "Napoleonov uspon i pad Direktorijuma", tekst: "Od Italije i Egipta Napoleon je stigao do prevrata 1799, posle koga je uveden Konzulat."}

      - id: l07-uspon-dopuni-egipat-tesko
        vrsta: dopuni
        tezina: tesko
        pojmovi: [egipat, nil, bitka-kod-piramida, osmansko-carstvo]
        pitanje: "Dopuni bez ponuđenih reči."
        tekst: "Egipat je tada bio pod vlašću {{Osmanskog carstva|Osmanlija}}. Britanska flota je potopila francuske brodove na ušću reke {{Nila|Nil}}, a francuska vojska je pobedila u Bici kod {{piramida}}."
        pomoc:
          - "Najveća reka Egipta."
          - "Najpoznatiji spomenici starog Egipta."
          - "Iz lekcije: Osmansko carstvo, ušće Nila, Bitka kod piramida."
        objasnjenje: "Egipat je bio osmanski; flota je uništena na ušću Nila; Francuzi su pobedili kod piramida."
        iz_udzbenika: {strana: 54, odeljak: "Napoleonov uspon i pad Direktorijuma", tekst: "U Egiptu, osmanskoj zemlji, Britanci su uništili francusku flotu na ušću Nila, a Francuzi pobedili kod piramida."}

      - id: l07-uspon-datum-zivot
        vrsta: datum
        tezina: srednje
        pojmovi: [napoleon-bonaparta]
        dogadjaj: "Napoleon Bonaparta (život)"
        pitanje: "Od koje do koje godine je živeo Napoleon Bonaparta?"
        od: 1769
        do: 1821
        traka: vladari
        pomoc:
          - "Rođen je u drugoj polovini XVIII veka, oko 20 godina pre Francuske revolucije."
          - "Umro je šest godina posle Vaterloa."
          - "Iz lekcije: Napoleon Bonaparta (1769–1821)."
        objasnjenje: "Napoleon je živeo od 1769. do 1821. godine."
        iz_udzbenika: {strana: 54, odeljak: "Napoleonov uspon i pad Direktorijuma", tekst: "Napoleon Bonaparta živeo je od 1769. do 1821."}

      - id: l07-uspon-datum-egipat
        vrsta: datum
        tezina: lako
        pojmovi: [egipat, napoleon-bonaparta]
        dogadjaj: "Napoleonov pohod na Egipat"
        pitanje: "Kada je Napoleon ratovao u Egiptu?"
        od: 1798
        do: 1799
        traka: dogadjaji
        pomoc:
          - "Posle rata u Italiji (1796–1797), a pre prevrata 1799."
          - "Udžbenik piše dve godine sa kosom crtom."
          - "Iz lekcije: Egipat 1798/99."
        objasnjenje: "Pohod na Egipat trajao je 1798–1799."
        iz_udzbenika: {strana: 54, odeljak: "Napoleonov uspon i pad Direktorijuma", tekst: "Direktorijum je poslao Napoleona u Egipat 1798/99."}

      - id: l07-uspon-datum-prevrat
        vrsta: datum
        tezina: lako
        pojmovi: [prevrat-1799, direktorijum]
        dogadjaj: "Prevrat protiv Direktorijuma"
        pitanje: "Koje godine je izveden prevrat protiv Direktorijuma?"
        godina: 1799
        traka: dogadjaji
        pomoc:
          - "Iste godine kada se Napoleon vratio iz Egipta."
          - "Poslednja godina XVIII veka pre 1800."
          - "Iz lekcije: prevrat protiv Direktorijuma 1799."
        objasnjenje: "Prevrat je izveden 1799; Direktorijum je raspušten i uveden Konzulat."
        iz_udzbenika: {strana: 54, odeljak: "Napoleonov uspon i pad Direktorijuma", tekst: "Napoleon je učestvovao u prevratu protiv Direktorijuma 1799."}

      - id: l07-uspon-poredjaj
        vrsta: poredjaj
        tezina: srednje
        pojmovi: [napoleon-bonaparta, mletacka-republika, egipat, prevrat-1799]
        pitanje: "Poređaj događaje Napoleonovog uspona hronološki."
        stavke:
          - {tekst: "Napoleon ratuje protiv Austrije u Italiji", godina: 1796, do: 1797, naziv: "Napoleonov rat protiv Austrije u Italiji", traka: dogadjaji}
          - {tekst: "Ukinuta je Mletačka republika", godina: 1797, naziv: "Ukidanje Mletačke republike", traka: dogadjaji}
          - {tekst: "Napoleon vodi vojsku u Egipat", godina: 1798, do: 1799, naziv: "Napoleonov pohod na Egipat", traka: dogadjaji}
          - {tekst: "Prevrat ruši Direktorijum", godina: 1799, naziv: "Prevrat protiv Direktorijuma", traka: dogadjaji}
        pomoc:
          - "Italija je bila pre Egipta."
          - "Mletačka republika ukinuta je na kraju rata u Italiji."
          - "Iz lekcije: Italija 1796–1797, Venecija 1797, Egipat 1798/99, prevrat 1799."
        objasnjenje: "Italija (1796–1797) → ukidanje Mletačke republike (1797) → Egipat (1798/99) → prevrat (1799)."
        iz_udzbenika: {strana: 54, odeljak: "Napoleonov uspon i pad Direktorijuma", tekst: "Od rata u Italiji preko Egipta Napoleon je došao do prevrata 1799."}

      - id: l07-uspon-povezi
        vrsta: povezi
        tezina: srednje
        pojmovi: [italija, egipat, nil, bitka-kod-piramida]
        pitanje: "Poveži mesto sa onim što se tamo dogodilo."
        parovi:
          - ["Italija", "Pobede nad Austrijom 1796–1797"]
          - ["Venecija", "Kraj Mletačke republike"]
          - ["Ušće Nila", "Britanci uništavaju francuske brodove"]
          - ["Piramide", "Pobeda francuske vojske u Egiptu"]
        pomoc:
          - "Dva mesta su u Evropi, dva u Egiptu."
          - "Na ušću reke bila je pomorska bitka."
          - "Iz lekcije: Italija — pobede nad Austrijom; Venecija — Mletačka republika; Nil — flota; piramide — pobeda."
        objasnjenje: "Italija i Venecija su mesta Napoleonovih uspeha 1796–1797; u Egiptu je flota uništena na ušću Nila, a vojska pobedila kod piramida."
        iz_udzbenika: {strana: 54, odeljak: "Napoleonov uspon i pad Direktorijuma", tekst: "Napoleon je pobeđivao u Italiji, ukinuo Mletačku republiku, a u Egiptu izgubio flotu, ali pobedio kod piramida."}

      - id: l07-uspon-zakljuci-slava
        vrsta: zakljuci
        tezina: srednje
        pojmovi: [napoleon-bonaparta, direktorijum, prevrat-1799]
        pitanje: "Zašto je baš jedan general mogao da sruši Direktorijum?"
        odgovori:
          - {tekst: "U vreme stalnih ratova uspešan vojskovođa ima slavu i vojsku iza sebe, a vlast je bila slaba", tacan: true}
          - {tekst: "Zato što je Napoleon bio iz kraljevske porodice Burbona", tacan: false, zasto: "Napoleon nije bio Burbon — Burboni su se vratili tek posle njegovog pada."}
          - {tekst: "Zato što ga je papa postavio za vladara", tacan: false, zasto: "Papa ga nije postavio; čak se i krunisao sam."}
          - {tekst: "Zato što je pobedio Britance kod Trafalgara", tacan: false, zasto: "Kod Trafalgara je francuska flota poražena, i to tek 1805."}
        pomoc:
          - "Korak 1: Kakva je bila vlast Direktorijuma?"
          - "Korak 2: Ko je u ratovima stekao ugled — političari ili generali?"
          - "Iz lekcije: zbog ratova vlast je bila nesigurna, a Napoleon je slavu stekao kao general."
        objasnjenje: "Slaba vlast u ratno doba i slavan, uspešan general — to je omogućilo prevrat 1799."
