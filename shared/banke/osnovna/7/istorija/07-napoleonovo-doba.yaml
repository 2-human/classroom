          - "Zvanični cilj: mir u Evropi."
          - "Tajni cilj: sprečiti revolucije, i silom."
        objasnjenje: "Sveta alijansa je savez vladara koji je, pod izgovorom mira, trebalo da guši revolucije."
        iz_udzbenika: {strana: 59, odeljak: "Bečki kongres", tekst: "Sveta alijansa imala je zvanični cilj očuvanje mira, a tajni sprečavanje revolucija."}

