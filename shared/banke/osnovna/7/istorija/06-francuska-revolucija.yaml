# Banka zadataka — 2.4. Francuska revolucija (istorija, 7. razred, str. 46–51).
# Pitanja sopstvenim rečima na osnovu beleške tools/istorija/_source/lekcije-7/06-francuska-revolucija.md.
# Svaki pogrešan ponuđeni odgovor ima `zasto` — greška treba da nauči, ne samo da kazni.
# Vremenska osa — isti događaj uvek sa istim nazivom i godinama:
#   Vladavina Luja XVI 1774–1792 · Marija Antoaneta 1755–1793 · Skupština državnih staleža 1789 ·
#   Zakletva Narodne skupštine 1789 · Pad Bastilje 1789 · Ukidanje feudalizma u Francuskoj 1789 ·
#   Deklaracija o pravima čoveka i građanina 1789 · Marš žena na Versaj 1789 · Bekstvo kraljevske porodice 1791 ·
#   Prvi ustav Francuske 1791 · Metrički sistem 1791 · Rat Habzburškoj monarhiji i Pruskoj 1792 ·
#   Zbacivanje Luja XVI 1792 · Proglašenje republike u Francuskoj 1792 · Republikanski kalendar 1792–1806 ·
#   Pogubljenje Luja XVI 1793 · Pogubljenje Marije Antoanete 1793 · Jakobinska diktatura 1793–1794 ·
#   Pad Robespjera 1794 · Trobojka postaje državna zastava 1794 · Marseljeza postaje himna 1795 ·
#   Direktorijum 1795–1799 · Nacionalizam i romantizam (oznaka „sredina XIX veka”)
# Ne pitamo: mesec ukidanja feudalizma (udžbenik piše „početkom jula 1789”, verovatno greška), optužbu protiv
# Luja XVI (reč delom nečitka), koliko kasnije je pogubljena Marija Antoaneta, definiciju diktature (presečena).

