        odgovori:
          - {tekst: "Jer je u državnoj blagajni ponestalo novca", tacan: true}
          - {tekst: "Jer je hteo da proglasi republiku", tacan: false, zasto: "Kralj nije hteo republiku — republika ga je kasnije zbacila."}
          - {tekst: "Jer je hteo da objavi rat Pruskoj", tacan: false, zasto: "Rat Pruskoj objavili su revolucionari tek 1792."}
