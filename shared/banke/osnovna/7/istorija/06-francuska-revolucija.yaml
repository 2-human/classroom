          - "Parižani su hteli kralja pod svojim okom."
          - "Iz lekcije: kralj je morao da pređe iz Versaja u Pariz, a za njim i skupština."
        objasnjenje: Pod pritiskom Parižana kralj se sa dvorom preselio iz Versaja u Pariz, a zatim i Ustavotvorna skupština.
        iz_udzbenika: {strana: 48, odeljak: Širenje revolucije, tekst: "Pod pritiskom pobunjenih Parižana Luj XVI je sa dvorom prešao iz Versaja u Pariz, a zatim i Ustavotvorna skupština."}

