        tezina: lako
        pojmovi: [skupstina-drzavnih-staleza, versaj]
        pitanje: "Gde se sastala Skupština državnih staleža?"
        odgovori:
          - {tekst: "U Versaju", tacan: true}
          - {tekst: "U Bastilji", tacan: false, zasto: "Bastilja je bila tvrđava-zatvor u Parizu."}
          - {tekst: "U Londonu", tacan: false, zasto: "London je glavni grad Britanije; skupština je bila francuska."}
          - {tekst: "U Beču", tacan: false, zasto: "Beč je bio prestonica Habzburške monarhije."}
        pomoc:
          - "Tamo je bio kraljevski dvor."
          - "Dvor čiji su troškovi bili ogromni."
          - "Iz lekcije: skupština se sastala u Versaju."
        objasnjenje: Skupština se sastala u Versaju, gde je bio kraljevski dvor.
        iz_udzbenika: {strana: 47, odeljak: "Početak revolucije: događaji iz 1789. godine", tekst: "Skupština se sastala u Versaju, ali predstavnici staleža nisu mogli da se dogovore."}

      - id: l06-poc-uporedi-glasanje
        vrsta: uporedi
        tezina: srednje
        pojmovi: [treci-stalez, prvi-stalez, drugi-stalez, skupstina-drzavnih-staleza]
        a: Treći stalež
        b: Prvi i Drugi stalež
        pitanje: "Čiji je zahtev ili stav u Skupštini državnih staleža — Trećeg staleža, Prvog i Drugog, oba ili nijednog?"
        tvrdnje:
          - {tekst: "Svaka osoba ima pravo na jedan glas.", odgovor: a, zasto: "To je bio novi način glasanja koji je tražio Treći stalež."}
          - {tekst: "Svaki stalež ima po jedan glas.", odgovor: b, zasto: "Glasanjem po staležima povlašćeni bi imali dva glasa protiv jednog."}
          - {tekst: "Imao je najviše poslanika.", odgovor: a, zasto: "Poslanici Trećeg staleža bili su najbrojniji."}
          - {tekst: "Ovim načinom glasanja bio bi siguran da ima većinu.", odgovor: oba, zasto: "Svaka strana je birala način koji joj donosi većinu: Treći po glavi, povlašćeni po staležima."}
          - {tekst: "Tražio je da se zasedanje prekine i poslanici raziđu.", odgovor: nijedan, zasto: "To je naredio kralj Luj XVI."}
        pomoc:
          - "Ko ima više ljudi, a ko više staleža?"
          - "Prebroj: dva staleža protiv jednog."
          - "Iz lekcije: Treći stalež traži glas po osobi, Prvi i Drugi glasanje po staležima."
        objasnjenje: "Treći stalež, sa najviše poslanika, tražio je glas po osobi; povlašćeni su tražili glas po staležu (2 : 1). Prekid zasedanja naredio je kralj."
        iz_udzbenika: {strana: 47, odeljak: "Početak revolucije: događaji iz 1789. godine", tekst: "Treći stalež je tražio da svaka osoba ima jedan glas, a Prvi i Drugi da svaki stalež ima jedan glas."}

