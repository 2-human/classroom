        iz_udzbenika: {strana: 49, odeljak: Ustavna monarhija, tekst: "Luj XVI je javno prihvatao tekovine revolucije, a tajno tražio pomoć; po ustavu je mogao da spreči donošenje zakona.", slika: 06-francuska-revolucija/02-luj-xvi.jpg}

