          - {tekst: "Da je bila daleko od života običnih ljudi i nije razumela njihovu glad", tacan: true}
          - {tekst: "Da je bila vrlo dobra kuvarica", tacan: false, zasto: "Anegdota ne govori o kuvanju, već o neosetljivosti prema gladnima."}
          - {tekst: "Da je delila hranu gladnima", tacan: false, zasto: "Upravo suprotno — kolači umesto hleba pokazuju nerazumevanje."}
          - {tekst: "Da je predvodila marš žena na Versaj", tacan: false, zasto: "Marš su predvodile gladne Parižanke, protiv dvora."}
        pomoc:
          - "Može li gladan čovek koji nema za hleb da kupi kolače?"
          - "Šta kraljica, po anegdoti, ne razume?"
          - "Iz lekcije: izreka je navodno izrečena kada je čula da je narod gladan i da se buni."
        objasnjenje: Anegdota (koju udžbenik naziva navodnom) prikazuje kraljicu kao nekog ko ne razume nevolju gladnog naroda.
        iz_udzbenika: {strana: 49, odeljak: "Potpis: Marija Antoaneta", tekst: "O Mariji Antoaneti postoje mnoge anegdote; najpoznatija je njena navodna izreka o hlebu i kolačima.", slika: 06-francuska-revolucija/06-marija-antoaneta.jpg}
        osa: {naziv: Marija Antoaneta, od: 1755, do: 1793, traka: vladari}

      # ---- Znatiželja: Republikanski kalendar ----
      - id: l06-kal-izbor-pocetak
