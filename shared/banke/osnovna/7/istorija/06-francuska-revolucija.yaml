delovi:
  # ==========================================================================
  - naslov: Uvod
    zadaci:
      - id: l06-uvod-izbor-tri-staleza
        vrsta: izbor
        tezina: lako
        pojmovi: [stalezi, francuska]
        pitanje: "Na koliko staleža je bilo podeljeno francusko društvo u XVIII veku?"
        odgovori:
          - {tekst: "Na tri", tacan: true}
          - {tekst: "Na dva", tacan: false, zasto: "Pored sveštenstva i plemstva postojao je i Treći stalež — svi ostali."}
          - {tekst: "Na pet", tacan: false, zasto: "Staleža je bilo tri; građanstvo, seljaci i zanatlije bili su zajedno u Trećem staležu."}
          - {tekst: "Društvo nije bilo podeljeno na staleže", tacan: false, zasto: "Bilo je — upravo razlike među staležima dovele su do revolucije."}
        pomoc:
          - "Seti se brojeva u nazivima: Prvi, Drugi, …"
          - "Poslednji stalež okuplja sve koji nisu sveštenici ni plemići."
          - "Iz lekcije: sveštenstvo, plemstvo i Treći stalež."
        objasnjenje: Francusko društvo XVIII veka delilo se na tri staleža — sveštenstvo, plemstvo i Treći stalež.
        iz_udzbenika: {strana: 46, odeljak: Uvod, tekst: "U XVIII veku francusko društvo je bilo podeljeno na tri staleža: sveštenstvo, plemstvo i Treći stalež."}

      - id: l06-uvod-tn-pobuna
        vrsta: tacno_netacno
        tezina: lako
        pojmovi: [treci-stalez, francuska-revolucija]
        tvrdnja: "Francusku revoluciju pokrenula je pobuna Trećeg staleža."
        tacno: true
        pomoc:
          - "Koji stalež je bio najbrojniji i najviše opterećen?"
          - "Iz lekcije: razlike među staležima dovele su do pobune jednog od njih krajem XVIII veka."
        objasnjenje: Tačno — razlike u bogatstvu, pravima i obavezama dovele su do pobune Trećeg staleža, kojom je počela revolucija.
        iz_udzbenika: {strana: 46, odeljak: Uvod, tekst: "Razlike među staležima krajem XVIII veka dovele su do pobune Trećeg staleža, koja je pokrenula revoluciju."}

      - id: l06-uvod-izbor-karikatura
        vrsta: izbor
        slika_u_pitanju: true
        tezina: lako
        pojmovi: [treci-stalez, seljastvo, stalezi]
        pitanje: "Pogledaj karikaturu. Koji stalež predstavlja starac u skromnoj odeći koji na leđima nosi drugu dvojicu?"
        odgovori:
          - {tekst: "Treći stalež (seljaka)", tacan: true}
          - {tekst: "Prvi stalež (sveštenstvo)", tacan: false, zasto: "Sveštenik je jedan od dvojice koje starac nosi — Prvi stalež nije plaćao porez."}
          - {tekst: "Drugi stalež (plemstvo)", tacan: false, zasto: "Plemić sa perjem i mačem sedi na leđima — on ne nosi teret, nego ga nose."}
          - {tekst: "Kralja", tacan: false, zasto: "Karikatura prikazuje staleže, a starac sa motikom je seljak, ne kralj."}
        pomoc:
          - "Pogledaj odeću i alat koji starac drži."
          - "Ko je radio zemlju i plaćao poreze i dažbine?"
          - "Iz lekcije: samo Treći stalež je plaćao poreze — on „nosi” ostala dva."
        objasnjenje: Starac sa motikom je seljak iz Trećeg staleža; na leđima nosi sveštenika i plemića, koji ne plaćaju poreze.
        iz_udzbenika: {strana: 46, odeljak: Uvod, tekst: "Karikatura prikazuje lik koji na leđima nosi preostalu dvojicu; staleže treba prepoznati po odeći i nakitu.", slika: 06-francuska-revolucija/01-karikatura-tri-staleza.jpg}

      - id: l06-uvod-zakljuci-simbolika
        vrsta: zakljuci
        slika_u_pitanju: true
        tezina: srednje
        pojmovi: [treci-stalez, prvi-stalez, drugi-stalez, porezi]
        pitanje: "Šta je autor karikature hteo da poruči time što jedan lik nosi druga dvojicu?"
        odgovori:
          - {tekst: "Da Treći stalež svojim radom i porezima izdržava sveštenstvo i plemstvo", tacan: true}
          - {tekst: "Da sveštenstvo i plemstvo pomažu seljacima u radu", tacan: false, zasto: "Na slici je obrnuto — seljak nosi njih, a oni samo sede."}
          - {tekst: "Da su sva tri staleža bila ravnopravna", tacan: false, zasto: "Da su ravnopravni, niko ne bi nosio druge; karikatura pokazuje nepravdu."}
          - {tekst: "Da je seljak bio najbogatiji stalež", tacan: false, zasto: "Seljak je u skromnoj odeći i pogrbljen — bogati su oni na njegovim leđima."}
        pomoc:
          - "Korak 1: Ko na slici radi, a ko se odmara?"
          - "Korak 2: Ko je plaćao poreze, a ko je bio oslobođen?"
          - "Iz lekcije: Treći stalež plaća poreze, a Prvi i Drugi žive od dažbina seljaka."
        objasnjenje: Karikatura pokazuje nepravdu — Treći stalež plaća poreze i dažbine i tako „nosi” sveštenstvo i plemstvo.
        iz_udzbenika: {strana: 46, odeljak: Uvod, tekst: "Karikatura simbolično prikazuje podelu društva na staleže: jedan lik nosi preostalu dvojicu.", slika: 06-francuska-revolucija/01-karikatura-tri-staleza.jpg}

      - id: l06-uvod-izvor-karikatura
        vrsta: izvor
        slika_u_pitanju: true
        tezina: tesko
        pojmovi: [prvi-stalez, drugi-stalez, svestenstvo, plemstvo]
        izvor:
          autor: Karikatura iz doba revolucije
          naslov: Podela francuskog društva na staleže (opis slike)
          tekst: "Pogrbljeni starac u jednostavnoj odeći, oslonjen na motiku, nosi na leđima dvojicu: jednog u crkvenoj odeždi i jednog u raskošnom odelu, sa perjanicom na šeširu i mačem o boku. Oko starčevih nogu su ptice, zec i kupus."
          napomena: "Opis slike je prepričan; udžbenik, str. 46."
        pitanje: "Kojim staležima pripadaju dvojica koje starac nosi?"
        odgovori:
          - {tekst: "Lik u crkvenoj odeždi Prvom, a lik sa perjem i mačem Drugom staležu", tacan: true}
          - {tekst: "Obojica pripadaju Trećem staležu", tacan: false, zasto: "Treći stalež je starac koji ih nosi; oni su povlašćeni staleži."}
          - {tekst: "Lik sa perjem i mačem je sveštenik, a drugi plemić", tacan: false, zasto: "Mač i perjanica su znaci plemića, a odežda sveštenika — ne obrnuto."}
          - {tekst: "Obojica su kraljevi", tacan: false, zasto: "Karikatura govori o staležima — sveštenstvu i plemstvu."}
        pomoc:
          - "Ko nosi mač i perje — vojnik-plemić ili sveštenik?"
          - "Prvi stalež su sveštenici, Drugi plemići."
          - "Iz lekcije: Prvi stalež = rimokatoličko sveštenstvo, Drugi = plemstvo."
        objasnjenje: Odežda otkriva sveštenika (Prvi stalež), a mač i perjanica plemića (Drugi stalež); obojicu nosi seljak iz Trećeg staleža.
        iz_udzbenika: {strana: 46, odeljak: Uvod, tekst: "Udžbenik traži da se po odeći i nakitu prepoznaju staleži na karikaturi.", slika: 06-francuska-revolucija/01-karikatura-tri-staleza.jpg}

      - id: l06-uvod-dopuni-sastav-treceg
        vrsta: dopuni
        tezina: srednje
        pojmovi: [treci-stalez, gradjanstvo, seljastvo]
        pitanje: "Dopuni rečenicu o Trećem staležu."
        tekst: "Treći stalež činili su {{građanstvo|građani|buržoazija}}, {{seljaci|seljaštvo}}, zanatlije i ostali."
        ponudjene: [građanstvo, seljaci, plemići, sveštenici]
        pomoc:
          - "Treći stalež su svi koji nisu ni sveštenici ni plemići."
          - "Jedna grupa živi u gradovima, druga obrađuje zemlju."
          - "Iz lekcije: građanstvo, seljaci, zanatlije i ostali."
        objasnjenje: Treći stalež su činili svi koji nisu bili sveštenici ni plemići — građanstvo, seljaci, zanatlije i ostali.
        iz_udzbenika: {strana: 46, odeljak: Uvod, tekst: "Treći stalež su činili građanstvo, seljaci, zanatlije i ostali."}

      - id: l06-uvod-objasni-razlike
        vrsta: objasni
        tezina: srednje
        pojmovi: [stalezi, treci-stalez, francuska-revolucija]
        pitanje: "Objasni kako su razlike među staležima dovele do Francuske revolucije."
        uzor: "Staleži su se razlikovali po bogatstvu, pravima i obavezama prema državi. Sveštenstvo i plemstvo nisu plaćali porez i imali su povlastice, a Treći stalež, najbrojniji, nosio je sve obaveze. Zbog te nepravde Treći stalež se krajem XVIII veka pobunio i pokrenuo revoluciju."
        ideje:
          - "Staleži se razlikuju po bogatstvu, pravima i obavezama."
          - "Prvi i Drugi stalež imaju povlastice i ne plaćaju porez."
          - "Treći stalež nosi teret i nezadovoljan je."
          - "Pobuna Trećeg staleža pokreće revoluciju."
        objasnjenje: Nejednakost staleža u pravima i obavezama izazvala je nezadovoljstvo i pobunu Trećeg staleža.
        iz_udzbenika: {strana: 46, odeljak: Uvod, tekst: "Razlike u bogatstvu, pravima i obavezama prema državi dovele su do pobune Trećeg staleža."}

  # ==========================================================================
  - naslov: Uzroci revolucije
    zadaci:
      - id: l06-uzr-izbor-prvi-stalez
        vrsta: izbor
        tezina: lako
        pojmovi: [prvi-stalez, svestenstvo]
        pitanje: "Ko je činio Prvi stalež?"
        odgovori:
          - {tekst: "Rimokatoličko sveštenstvo", tacan: true}
          - {tekst: "Plemstvo", tacan: false, zasto: "Plemstvo je bilo Drugi stalež."}
          - {tekst: "Građanstvo", tacan: false, zasto: "Građanstvo je pripadalo Trećem staležu."}
          - {tekst: "Seljaštvo", tacan: false, zasto: "Seljaci su bili deo Trećeg staleža."}
        pomoc:
          - "Prvi stalež je bio vezan za crkvu."
          - "U Francuskoj je preovladavala katolička vera."
          - "Iz lekcije: Prvi stalež — rimokatoličko sveštenstvo."
        objasnjenje: Prvi stalež je činilo rimokatoličko sveštenstvo.
        iz_udzbenika: {strana: 46, odeljak: Uzroci revolucije, tekst: "Prvi stalež činilo je rimokatoličko sveštenstvo, Drugi plemstvo, a Treći svi ostali."}

      - id: l06-uzr-povezi-stalezi
        vrsta: povezi
        tezina: lako
        pojmovi: [prvi-stalez, drugi-stalez, treci-stalez, svestenstvo, plemstvo, gradjanstvo]
        pitanje: "Poveži stalež sa onima koji su ga činili."
        parovi:
          - ["Prvi stalež", "rimokatoličko sveštenstvo"]
          - ["Drugi stalež", "plemstvo"]
          - ["Treći stalež", "građanstvo, seljaštvo i ostali"]
        pomoc:
          - "Crkva je bila na prvom mestu."
          - "Plemići su odmah posle sveštenika."
          - "Iz lekcije: Prvi — sveštenstvo, Drugi — plemstvo, Treći — svi ostali."
        objasnjenje: Prvi stalež — sveštenstvo, Drugi — plemstvo, Treći — svi ostali, pre svega građanstvo i seljaštvo.
        iz_udzbenika: {strana: 46, odeljak: Uzroci revolucije, tekst: "Stanovništvo Francuske se delilo na tri staleža: sveštenstvo, plemstvo i sve ostale."}

      - id: l06-uzr-datum-luj-xvi
        vrsta: datum
        tezina: srednje
        pojmovi: [luj-xvi]
        dogadjaj: Vladavina Luja XVI
        pitanje: "Od koje do koje godine je vladao francuski kralj Luj XVI?"
        od: 1774
        do: 1792
        traka: vladari
        pomoc:
          - "Zbačen je iste godine kad je proglašena republika."
          - "Počeo je da vlada petnaestak godina pre revolucije."
          - "Iz lekcije: Luj XVI (1774–1792)."
        objasnjenje: Luj XVI je vladao od 1774. do 1792, kada je zbačen sa prestola.
        iz_udzbenika: {strana: 46, odeljak: Uzroci revolucije, tekst: "Kralj Luj XVI vladao je 1774–1792.", slika: 06-francuska-revolucija/02-luj-xvi.jpg}

      - id: l06-uzr-izbor-procenat
        vrsta: izbor
        tezina: srednje
        pojmovi: [treci-stalez]
        pitanje: "Koliki deo stanovništva Francuske je pripadao Trećem staležu?"
        odgovori:
          - {tekst: "Više od 90%", tacan: true}
          - {tekst: "Oko polovine", tacan: false, zasto: "Mnogo više — sveštenstvo i plemstvo zajedno bili su sasvim mala manjina."}
          - {tekst: "Oko 10%", tacan: false, zasto: "Toliko su otprilike bila prva dva staleža zajedno; Treći je bio ogromna većina."}
          - {tekst: "Tačno trećina", tacan: false, zasto: "Tri staleža nisu bila jednako brojna — Treći je bio daleko najbrojniji."}
        pomoc:
          - "Treći stalež su „svi ostali”."
          - "Sveštenika i plemića bilo je malo."
          - "Iz lekcije: Treći stalež je činio više od 90% stanovništva."
        objasnjenje: Treći stalež je činio više od 90% stanovništva — ogromnu većinu.
        iz_udzbenika: {strana: 46, odeljak: Uzroci revolucije, tekst: "Pripadnici Trećeg staleža činili su više od 90% stanovništva Francuske."}

      - id: l06-uzr-tn-porez
        vrsta: tacno_netacno
        tezina: lako
        pojmovi: [treci-stalez, porezi, prvi-stalez, drugi-stalez]
        tvrdnja: "Sva tri staleža u Francuskoj plaćala su poreze jednako."
        tacno: false
        ispravke:
          - {tekst: "Poreze je plaćao samo Treći stalež; Prvi i Drugi bili su oslobođeni.", tacan: true}
          - {tekst: "Poreze su plaćali samo sveštenici.", tacan: false, zasto: "Sveštenstvo je, naprotiv, bilo oslobođeno poreza."}
          - {tekst: "Porez je plaćalo samo plemstvo, jer je bilo najbogatije.", tacan: false, zasto: "Plemstvo je bilo oslobođeno poreza i živelo je od dažbina seljaka."}
        pomoc:
          - "Seti se karikature — ko koga nosi?"
          - "Povlašćeni staleži su imali posebna prava."
          - "Iz lekcije: Treći stalež je plaćao poreze, a prvi i drugi su bili oslobođeni."
        objasnjenje: Netačno — porez je plaćao samo Treći stalež, dok su sveštenstvo i plemstvo bili oslobođeni.
        iz_udzbenika: {strana: 46, odeljak: Uzroci revolucije, tekst: "Treći stalež je plaćao poreze, dok su prvi i drugi bili toga oslobođeni."}

      - id: l06-uzr-izbor-prihodi-plemstva
        vrsta: izbor
        tezina: srednje
        pojmovi: [prvi-stalez, drugi-stalez, seljastvo]
        pitanje: "Od čega su živeli Prvi i Drugi stalež?"
        odgovori:
          - {tekst: "Od velikih zemljišnih poseda, sa kojih su ubirali dažbine od seljaka", tacan: true}
          - {tekst: "Od plata koje im je isplaćivala država", tacan: false, zasto: "Lekcija kaže da su živeli od svojih poseda i dažbina seljaka."}
          - {tekst: "Od rada u fabrikama", tacan: false, zasto: "U fabrikama su radili radnici; sveštenici i plemići nisu."}
          - {tekst: "Od trgovine sa kolonijama", tacan: false, zasto: "Trgovinom i bankarstvom bavilo se građanstvo, a ne povlašćeni staleži."}
        pomoc:
          - "Šta su posedovali sveštenstvo i plemstvo?"
          - "Ko je obrađivao njihovu zemlju?"
          - "Iz lekcije: živeli su od velikih zemljišnih poseda i dažbina seljaštva."
        objasnjenje: Sveštenstvo i plemstvo živeli su od velikih zemljišnih poseda, sa kojih su ubirali dažbine od seljaka.
        iz_udzbenika: {strana: 46, odeljak: Uzroci revolucije, tekst: "Prvi i Drugi stalež živeli su od velikih zemljišnih poseda, sa kojih su ubirali dažbine od seljaštva."}

      - id: l06-uzr-izbor-uzroci
        vrsta: izbor
        tezina: srednje
        pojmovi: [apsolutisticka-monarhija, versaj, velika-britanija, prosvetiteljstvo, americka-revolucija]
        pitanje: "Šta je od navedenog bio uzrok Francuske revolucije? (više tačnih)"
        odgovori:
          - {tekst: "Ogromni troškovi kraljevskog dvora u Versaju", tacan: true}
          - {tekst: "Zaostajanje Francuske za Velikom Britanijom u privredi, trgovini i bankarstvu", tacan: true}
          - {tekst: "Ideje prosvetiteljstva među građanstvom", tacan: true}
          - {tekst: "Uspeh Američke revolucije", tacan: true}
          - {tekst: "Napad Pruske na Francusku", tacan: false, zasto: "Rat sa Pruskom počinje tek 1792, i to tako što su ga revolucionari objavili."}
          - {tekst: "Pogubljenje kralja", tacan: false, zasto: "Kralj je pogubljen 1793 — to je posledica revolucije, a ne uzrok."}
        pomoc:
          - "Traži stvari koje su se desile PRE 1789."
          - "Uzroci su bili i privredni (novac), i idejni (knjige), i primer iz sveta."
          - "Iz lekcije: troškovi dvora, zaostajanje za Britanijom, prosvetiteljstvo, Američka revolucija."
        objasnjenje: Kriza je imala više uzroka — rasipnički dvor, slabiju privredu od britanske, prosvetiteljske ideje i ohrabrujući primer Američke revolucije.
        iz_udzbenika: {strana: 46, odeljak: Uzroci revolucije, tekst: "Troškovi dvora u Versaju bili su ogromni, Francuska je zaostajala za Britanijom, a građanstvo su podstakle prosvetiteljske ideje i uspeh Američke revolucije."}

      - id: l06-uzr-tn-luj-xiv
        vrsta: tacno_netacno
        tezina: srednje
        pojmovi: [luj-xiv, apsolutisticka-monarhija]
        tvrdnja: "Kriza apsolutističke monarhije u Francuskoj snažno se osećala još za vreme Luja XIV."
        tacno: false
        ispravke:
          - {tekst: "Kriza se snažno osećala u vreme naslednika Luja XIV.", tacan: true}
          - {tekst: "Kriza je počela tek posle pada Bastilje.", tacan: false, zasto: "Kriza je bila uzrok revolucije, pa je postojala pre pada Bastilje."}
          - {tekst: "Kriza se osećala samo u Velikoj Britaniji.", tacan: false, zasto: "Britanija je bila napredniji uzor; reč je o krizi u Francuskoj."}
        pomoc:
          - "Pročitaj prvu rečenicu odeljka o uzrocima."
          - "Luj XVI nije neposredno nasledio Luja XIV, ali je jedan od njegovih naslednika."
          - "Iz lekcije: kriza se snažno osećala u vreme naslednika Luja XIV."
        objasnjenje: Netačno — kriza se snažno osetila tek kod naslednika Luja XIV.
        iz_udzbenika: {strana: 46, odeljak: Uzroci revolucije, tekst: "U vreme naslednika Luja XIV u Francuskoj se snažno osećala kriza apsolutističke monarhije."}

      - id: l06-uzr-dopuni-burzoazija
        vrsta: dopuni
        tezina: lako
        pojmovi: [burzoazija, gradjanstvo]
        pitanje: "Dopuni."
        tekst: "Drugi naziv za građanstvo je {{buržoazija}}."
        ponudjene: [buržoazija, plemstvo, sveštenstvo, seljaštvo]
        pomoc:
          - "Reč dolazi iz francuskog i znači „građani”."
          - "Počinje na slovo B."
          - "Iz lekcije: buržoazija — drugi naziv za građanstvo."
        objasnjenje: Buržoazija je drugi naziv za građanstvo.
        iz_udzbenika: {strana: 46, odeljak: "Definicije („?\" kućice)", tekst: "Buržoazija je drugi naziv za građanstvo."}

      - id: l06-uzr-izbor-trazi-gradjanstvo
        vrsta: izbor
        tezina: srednje
        pojmovi: [gradjanstvo, prosvetiteljstvo]
        pitanje: "Šta je tražio obrazovaniji i bogatiji deo građanstva?"
        odgovori:
          - {tekst: "Učešće u državnoj vlasti i društvene reforme", tacan: true}
          - {tekst: "Da postane deo plemstva i prestane da plaća porez", tacan: false, zasto: "Tražili su promenu sistema — učešće u vlasti i reforme, ne lične titule."}
          - {tekst: "Povratak na vladavinu Luja XIV", tacan: false, zasto: "Kriza je počela upravo posle Luja XIV; građanstvo je tražilo promene, ne povratak."}
          - {tekst: "Da kralj dobije još više vlasti", tacan: false, zasto: "Prosvetitelji su kritikovali apsolutizam; građanstvo je htelo deo vlasti za sebe."}
        pomoc:
          - "Na šta su ih podstakle ideje prosvetitelja?"
          - "Imali su novac i obrazovanje, ali ne i vlast."
          - "Iz lekcije: zahtevali su učešće u državnoj vlasti i društvene reforme."
        objasnjenje: Obrazovano i bogato građanstvo, podstaknuto prosvetiteljstvom, tražilo je učešće u vlasti i reforme.
        iz_udzbenika: {strana: 46, odeljak: Uzroci revolucije, tekst: "Obrazovani i bogatiji deo građanstva, podstaknut idejama prosvetiteljstva, zahtevao je učešće u vlasti i društvene reforme."}

      - id: l06-uzr-zakljuci-amerika
        vrsta: zakljuci
        tezina: tesko
        pojmovi: [americka-revolucija, burzoazija, francuska]
        pitanje: "Zašto je baš uspeh Američke revolucije posebno ohrabrio francusku buržoaziju?"
        odgovori:
          - {tekst: "Francuska je i sama pomogla Amerikancima, pa su Francuzi videli da se ideje slobode mogu ostvariti", tacan: true}
          - {tekst: "Amerikanci su obećali da će napasti francuskog kralja", tacan: false, zasto: "Lekcija o tome ništa ne kaže; Francuska je pomagala Amerikancima, a ne obrnuto."}
          - {tekst: "Američka revolucija se desila u Parizu", tacan: false, zasto: "Desila se u Severnoj Americi — zato je bila primer izdaleka."}
          - {tekst: "Posle nje je Luj XVI sam ukinuo staleže", tacan: false, zasto: "Staleže je ukinula tek revolucija u Francuskoj, ne kralj."}
        pomoc:
          - "Korak 1: Ko je pomogao uspeh Američke revolucije?"
          - "Korak 2: Šta Francuzi mogu da zaključe kad vide da je pobuna protiv vlasti uspela?"
          - "Iz lekcije: uspeh Američke revolucije, kojoj je doprinela Francuska, ohrabrio je buržoaziju."
        objasnjenje: Francuska je doprinela uspehu Američke revolucije; buržoazija je videla da pobuna u ime slobode može da uspe — i to ju je ohrabrilo.
        iz_udzbenika: {strana: 46, odeljak: Uzroci revolucije, tekst: "Uspešan ishod Američke revolucije, kojoj je doprinela upravo Francuska, dodatno je ohrabrio buržoaziju."}

      - id: l06-uzr-tn-luj-reforme
        vrsta: tacno_netacno
        tezina: lako
        pojmovi: [luj-xvi]
        tvrdnja: "Luj XVI je pokušao da sprovede neke reforme, ali je bio neodlučan i nesposoban vladar."
        tacno: true
        pomoc:
          - "Seti se kako udžbenik opisuje Luja XVI."
          - "Iz lekcije: pokušao je reforme, ali se pokazao neodlučnim i nesposobnim."
        objasnjenje: Tačno — Luj XVI je pokušao reforme, ali nije umeo da ih sprovede.
        iz_udzbenika: {strana: 46, odeljak: Uzroci revolucije, tekst: "Luj XVI pokušao je da izvrši određene reforme, ali se pokazao kao neodlučan i nesposoban vladar.", slika: 06-francuska-revolucija/02-luj-xvi.jpg}

      - id: l06-uzr-uporedi-stalezi
        vrsta: uporedi
        tezina: srednje
        pojmovi: [treci-stalez, prvi-stalez, drugi-stalez, porezi]
        a: Prvi i Drugi stalež
        b: Treći stalež
        pitanje: "Na koga se odnosi tvrdnja — na Prvi i Drugi stalež, na Treći stalež, na sve ili ni na jedan?"
        tvrdnje:
          - {tekst: "Plaćao je poreze.", odgovor: b, zasto: "Samo Treći stalež je plaćao poreze."}
          - {tekst: "Bio je oslobođen poreza.", odgovor: a, zasto: "Sveštenstvo i plemstvo nisu plaćali porez."}
          - {tekst: "Činio je više od 90% stanovništva.", odgovor: b, zasto: "Treći stalež je bio ogromna većina."}
          - {tekst: "Ubirao je dažbine od seljaka sa velikih poseda.", odgovor: a, zasto: "Sveštenstvo i plemstvo su živeli od dažbina sa svojih poseda."}
          - {tekst: "U njega je spadalo i građanstvo.", odgovor: b, zasto: "Građanstvo je bilo deo Trećeg staleža."}
          - {tekst: "Bio je deo francuskog društva u XVIII veku.", odgovor: oba, zasto: "Sva tri staleža činila su francusko društvo."}
          - {tekst: "Imao je pravo da sam bira kralja.", odgovor: nijedan, zasto: "Francuska je bila apsolutistička monarhija — kralj je vlast nasleđivao."}
        pomoc:
          - "Ko plaća, a ko ubira?"
          - "Povlašćeni su bili malobrojni."
          - "Iz lekcije: Treći stalež (90%+) plaća poreze; Prvi i Drugi su oslobođeni i žive od poseda."
        objasnjenje: Povlašćeni staleži (sveštenstvo, plemstvo) nisu plaćali porez i živeli su od dažbina, a Treći stalež, ogromna većina, plaćao je poreze.
        iz_udzbenika: {strana: 46, odeljak: Uzroci revolucije, tekst: "Treći stalež je plaćao poreze, dok su prvi i drugi bili oslobođeni i živeli od zemljišnih poseda."}

      - id: l06-uzr-lanac-nezadovoljstvo
        vrsta: lanac
        tezina: srednje
        pojmovi: [treci-stalez, porezi, francuska-revolucija]
        karike:
          - "Samo Treći stalež plaća poreze, a povlašćeni žive od njegovih dažbina"
          - "?"
          - "Pobuna Trećeg staleža pokreće revoluciju"
        praznina: 1
        odgovori:
          - {tekst: "Raste nezadovoljstvo najbrojnijeg staleža nejednakošću", tacan: true}
          - {tekst: "Treći stalež postaje najbogatiji", tacan: false, zasto: "Plaćao je sve poreze i dažbine, pa nije mogao postati najbogatiji."}
          - {tekst: "Kralj ukida sve poreze", tacan: false, zasto: "Kralj je, naprotiv, tražio nove poreze jer mu je blagajna bila prazna."}
        pomoc:
          - "Kako se oseća neko ko nosi sav teret?"
          - "Pobuna dolazi iz nezadovoljstva."
          - "Iz lekcije: razlike u pravima i obavezama dovele su do pobune Trećeg staleža."
        objasnjenje: Nejednakost u porezima i pravima izazvala je nezadovoljstvo Trećeg staleža, a ono pobunu.
        iz_udzbenika: {strana: 46, odeljak: Uzroci revolucije, tekst: "Treći stalež je plaćao poreze, a razlike u pravima i obavezama dovele su do njegove pobune."}

      - id: l06-uzr-lanac-prosvetiteljstvo
        vrsta: lanac
        tezina: tesko
        pojmovi: [prosvetiteljstvo, gradjanstvo, americka-revolucija]
        karike:
          - "Prosvetitelji kritikuju apsolutizam i povlastice"
          - "Obrazovano građanstvo traži učešće u vlasti i reforme"
          - "?"
        praznina: 2
        odgovori:
          - {tekst: "Uspeh Američke revolucije ga dodatno ohrabruje da se izbori za promene", tacan: true}
          - {tekst: "Građanstvo odustaje i prelazi u plemstvo", tacan: false, zasto: "Građanstvo nije odustalo — upravo ono predvodi Treći stalež u revoluciji."}
          - {tekst: "Kralj odmah prihvata sve zahteve i revolucija nije potrebna", tacan: false, zasto: "Luj XVI je bio neodlučan; zahtevi nisu ispunjeni, pa je došlo do revolucije."}
        pomoc:
          - "Šta se desilo preko okeana, uz pomoć Francuske?"
          - "Primer uspeha daje hrabrost."
          - "Iz lekcije: uspeh Američke revolucije dodatno je ohrabrio buržoaziju."
        objasnjenje: Prosvetiteljske ideje pokrenule su zahteve građanstva, a uspeh Američke revolucije dao mu je hrabrost da ih ostvari.
        iz_udzbenika: {strana: 46, odeljak: Uzroci revolucije, tekst: "Građanstvo podstaknuto prosvetiteljstvom zahtevalo je reforme; uspeh Američke revolucije ga je dodatno ohrabrio."}

      - id: l06-uzr-ko-sam-luj-xvi
        vrsta: ko_sam
        tezina: lako
        pojmovi: [luj-xvi, skupstina-drzavnih-staleza, marija-antoaneta]
        tragovi:
          - "Vladao sam Francuskom od 1774. do 1792."
          - "Kad mi je ponestalo novca, sazvao sam Skupštinu državnih staleža."
          - "Moja žena bila je Marija Antoaneta; oboje smo pogubljeni 1793."
        odgovori:
          - {tekst: "Luj XVI", tacan: true}
          - {tekst: "Luj XIV", tacan: false, zasto: "Luj XIV je vladao ranije; kriza je nastupila u vreme njegovih naslednika."}
          - {tekst: "Maksimilijan Robespjer", tacan: false, zasto: "Robespjer je bio vođa jakobinaca, a ne kralj."}
          - {tekst: "Fridrih II Veliki", tacan: false, zasto: "Fridrih II je bio pruski kralj iz lekcije o prosvetiteljstvu."}
        objasnjenje: To je Luj XVI — poslednji francuski kralj pre republike, zbačen 1792. i pogubljen 1793.
        iz_udzbenika: {strana: 46, odeljak: Uzroci revolucije, tekst: "Luj XVI (1774–1792) bio je neodlučan vladar koji je 1789. sazvao Skupštinu državnih staleža.", slika: 06-francuska-revolucija/02-luj-xvi.jpg}

      - id: l06-uzr-objasni-uzroci
        vrsta: objasni
        tezina: tesko
        pojmovi: [apsolutisticka-monarhija, treci-stalez, prosvetiteljstvo, americka-revolucija]
        pitanje: "Navedi i objasni bar tri uzroka Francuske revolucije."
        uzor: "Apsolutistička monarhija bila je u krizi: dvor u Versaju trošio je ogroman novac, a Francuska je u privredi zaostajala za Britanijom. Poreze je plaćao samo Treći stalež, iako je činio više od 90% stanovništva. Građanstvo je pod uticajem prosvetiteljstva i uspeha Američke revolucije tražilo učešće u vlasti, a kralj Luj XVI bio je neodlučan."
        ideje:
          - "Kriza monarhije: troškovi dvora, zaostajanje privrede."
          - "Nepravedna podela poreza među staležima."
          - "Ideje prosvetiteljstva i primer Američke revolucije."
          - "Neodlučan i nesposoban kralj."
        objasnjenje: Revolucija ima više uzroka — finansijske, društvene, idejne i lične (slab vladar).
        iz_udzbenika: {strana: 46, odeljak: Uzroci revolucije, tekst: "Kriza monarhije, nepravedna podela na staleže, prosvetiteljske ideje, primer Amerike i neodlučni kralj bili su uzroci revolucije."}

      - id: l06-uzr-objasni-luj
        vrsta: objasni
        tezina: lako
        pojmovi: [luj-xvi]
        pitanje: "Kakav je vladar bio Luj XVI? Objasni svojim rečima."
        uzor: "Luj XVI je vladao Francuskom od 1774. do 1792. Pokušao je da sprovede neke reforme, ali je bio neodlučan i nije umeo da reši krizu."
        ideje:
          - "Vladao od 1774. do 1792."
          - "Pokušao je reforme."
          - "Bio je neodlučan i nesposoban."
        objasnjenje: Luj XVI je imao nameru da menja stvari, ali mu je nedostajala odlučnost.
        iz_udzbenika: {strana: 46, odeljak: Uzroci revolucije, tekst: "Luj XVI je pokušao reforme, ali se pokazao kao neodlučan i nesposoban vladar.", slika: 06-francuska-revolucija/02-luj-xvi.jpg}


