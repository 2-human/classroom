          - {tekst: "Jer stari kalendar nije imao dvanaest meseci", tacan: false, zasto: "I novi kalendar je imao dvanaest meseci; promena je bila simbolična."}
          - {tekst: "Da bi se Francuska uskladila sa ostatkom Evrope", tacan: false, zasto: "Upravo suprotno — novim kalendarom Francuska se izdvojila od drugih."}
