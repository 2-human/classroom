        pitanje: "Zašto su Prvi i Drugi stalež tražili glasanje po staležima?"
        odgovori:
          - {tekst: "Jer bi tada sa dva glasa protiv jednog uvek imali većinu", tacan: true}
          - {tekst: "Jer su imali najviše poslanika", tacan: false, zasto: "Najviše poslanika imao je Treći stalež — zato je on tražio glas po osobi."}
          - {tekst: "Jer su hteli da pomognu Trećem staležu", tacan: false, zasto: "Takvo glasanje bi Trećem staležu oduzelo snagu, a ne pomoglo mu."}
