          - {tekst: "vlasništvo", tacan: true}
          - {tekst: "sigurnost", tacan: true}
          - {tekst: "otpor ugnjetavanju", tacan: true}
          - {tekst: "povlastice plemstva", tacan: false, zasto: "Deklaracija ukida povlastice — svi se rađaju sa istim pravima."}
