        objasnjenje: Luj XVI je bio kralj, Marija Antoaneta njegova žena i ćerka Marije Terezije; oboje su pogubljeni 1793.
        iz_udzbenika: {strana: 46, odeljak: Uzroci revolucije, tekst: "Luj XVI je vladao 1774–1792; njegova žena Marija Antoaneta bila je ćerka Marije Terezije.", slika: 06-francuska-revolucija/02-luj-xvi.jpg}

      - id: l06-uzr-ko-sam-luj-tesko
        vrsta: ko_sam
        tezina: tesko
        pojmovi: [luj-xvi, ustavna-monarhija, versaj]
        tragovi:
          - "Javno sam prihvatao promene, a tajno sam tražio pomoć stranih vladara."
          - "Po ustavu iz 1791. mogao sam da sprečim donošenje zakona."
          - "Morao sam da napustim Versaj i preselim se u Pariz."
        odgovori:
          - {tekst: "Luj XVI", tacan: true}
          - {tekst: "Maksimilijan Robespjer", tacan: false, zasto: "Robespjer nije imao pravo da sprečava zakone kao kralj; bio je vođa jakobinaca."}
