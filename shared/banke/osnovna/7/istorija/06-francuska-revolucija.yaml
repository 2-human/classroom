      - id: l06-dekl-izvor-cl4
        vrsta: izvor
        tezina: srednje
        pojmovi: [deklaracija-o-pravima-coveka-i-gradjanina]
        izvor:
          autor: Deklaracija o pravima čoveka i građanina
          naslov: Član 4 (1789)
          tekst: "Sloboda znači da čovek sme da radi sve što ne nanosi štetu drugome. Prava svakog čoveka sežu do tačke na kojoj počinju prava drugih ljudi, a tu granicu može da odredi samo zakon."
          napomena: "Odlomak je prepričan; udžbenik, str. 48."
        pitanje: "Ko, prema ovom članu, sme da odredi granice slobode?"
        odgovori:
          - {tekst: "Samo zakon", tacan: true}
          - {tekst: "Kralj, po svojoj volji", tacan: false, zasto: "Deklaracija odbacuje samovolju kralja — granice postavlja zakon."}
          - {tekst: "Crkva", tacan: false, zasto: "Član govori o zakonu, ne o crkvi."}
          - {tekst: "Svaki čovek sam za sebe", tacan: false, zasto: "Tada bi jači mogao da šteti slabijem; zato granice određuje zakon, isti za sve."}
        pomoc:
          - "Pročitaj poslednju rečenicu odlomka."
          - "Ista pravila za sve."
          - "Iz Svedočanstva: takve granice može odrediti samo zakon."
        objasnjenje: Granice slobode određuje samo zakon — isti za sve, a ne volja vladara.
        iz_udzbenika: {strana: 48, odeljak: "Svedočanstvo: Deklaracija o pravima čoveka i građanina iz 1789.", tekst: "Sloboda je činiti sve što ne šteti drugome; granice slobode može odrediti samo zakon."}

      - id: l06-dekl-izvor-cl9
        vrsta: izvor
        tezina: tesko
        pojmovi: [deklaracija-o-pravima-coveka-i-gradjanina, bastilja]
        izvor:
          autor: Deklaracija o pravima čoveka i građanina
          naslov: Član 9 (1789)
          tekst: "Svaki čovek se smatra nevinim sve dok se ne utvrdi da je kriv. Ako je hapšenje neophodno, zakon mora strogo da spreči svaku grubost koja nije potrebna."
          napomena: "Odlomak je prepričan; udžbenik, str. 48."
        pitanje: "Protiv kakve prakse starog poretka je bio usmeren ovaj član?"
        odgovori:
          - {tekst: "Protiv zatvaranja ljudi bez dokazane krivice, kao političkih zatvorenika u Bastilji", tacan: true}
          - {tekst: "Protiv plaćanja poreza", tacan: false, zasto: "Član govori o hapšenju i krivici, a ne o porezima."}
          - {tekst: "Protiv slobode štampe", tacan: false, zasto: "Slobodu štampe Deklaracija štiti (čl. 11); ovaj član štiti optužene."}
          - {tekst: "Protiv republikanskog kalendara", tacan: false, zasto: "Kalendar je uveden tek 1792, posle Deklaracije."}
        pomoc:
          - "O čemu govori član — o novcu ili o hapšenju?"
          - "Seti se čemu je služila Bastilja."
          - "Iz Svedočanstva: svako je nevin dok ga ne proglase krivim."
        objasnjenje: Član 9 uvodi pretpostavku nevinosti — suprotno starom poretku, u kome su protivnici vlasti mogli da završe u Bastilji bez suđenja.
        iz_udzbenika: {strana: 48, odeljak: "Svedočanstvo: Deklaracija o pravima čoveka i građanina iz 1789.", tekst: "Svako se smatra nevinim dok ga ne proglase krivim; prestroga postupanja pri hapšenju moraju se suzbiti zakonom."}

