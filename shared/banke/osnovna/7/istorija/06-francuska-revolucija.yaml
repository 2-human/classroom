        odgovori:
          - {tekst: "Dan proglašenja republike, 22. septembar 1792.", tacan: true}
          - {tekst: "Dan pada Bastilje, 14. jul 1789.", tacan: false, zasto: "Pad Bastilje je početak revolucije, ali kalendar broji od proglašenja republike."}
          - {tekst: "Dan usvajanja Deklaracije, 26. avgust 1789.", tacan: false, zasto: "Kalendar nije računao od Deklaracije, već od republike."}
          - {tekst: "1. januar 1793.", tacan: false, zasto: "Nova godina je počinjala u jesen, danom republike."}
        pomoc:
          - "Kalendar se zove „republikanski”."
          - "Prvi dan Prve godine je dan kada je nastala republika."
          - "Iz lekcije: 22. septembar 1792 = prvi dan Prve godine."
        objasnjenje: Republikanski kalendar je brojao godine od proglašenja republike — 22. septembar 1792. bio je prvi dan Prve godine.
        iz_udzbenika: {strana: 50, odeljak: "Znatiželja: Republikanski kalendar", tekst: "Za početak novog kalendara uzet je datum proglašenja republike, 22. septembar 1792."}
        osa: {naziv: Republikanski kalendar, od: 1792, do: 1806, traka: ideje}

