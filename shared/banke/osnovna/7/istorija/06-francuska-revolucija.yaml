        objasnjenje: "Kad svaki stalež ima jedan glas, sveštenstvo i plemstvo zajedno uvek nadglasaju Treći stalež (2 : 1)."
        iz_udzbenika: {strana: 47, odeljak: "Početak revolucije: događaji iz 1789. godine", tekst: "Prvi i drugi stalež zahtevali su glasanje po staležima — tako su mogli biti sigurni da će imati većinu."}

      - id: l06-poc-zakljuci-po-osobi
        vrsta: zakljuci
        tezina: tesko
        pojmovi: [treci-stalez, skupstina-drzavnih-staleza]
        pitanje: "Zašto je Treći stalež tražio da svaka osoba ima jedan glas?"
        odgovori:
          - {tekst: "Jer je imao najviše poslanika, pa bi tako mogao da nadglasa povlašćene", tacan: true}
          - {tekst: "Jer je hteo da kralj odlučuje sam", tacan: false, zasto: "Treći stalež je tražio više uticaja za sebe, a ne više vlasti za kralja."}
          - {tekst: "Jer je imao samo jednog poslanika", tacan: false, zasto: "Naprotiv, njegovi poslanici bili su najbrojniji."}
          - {tekst: "Jer je hteo da odobri nove poreze", tacan: false, zasto: "Poreze je plaćao upravo Treći stalež, pa nije želeo nove."}
        pomoc:
          - "Korak 1: Koji stalež je imao najviše poslanika?"
          - "Korak 2: Ko pobeđuje kada se broji svaki glas posebno?"
          - "Iz lekcije: Treći stalež, čiji su poslanici bili najbrojniji, tražio je glas po osobi."
        objasnjenje: Brojanjem svakog glasa najbrojniji Treći stalež bi stekao većinu — zato je to tražio.
        iz_udzbenika: {strana: 47, odeljak: "Početak revolucije: događaji iz 1789. godine", tekst: "Treći stalež, čiji su poslanici bili najbrojniji, tražio je da svaka osoba ima pravo na jedan glas."}

