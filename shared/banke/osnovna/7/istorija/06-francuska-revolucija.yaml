        tezina: lako
        pojmovi: [luj-xvi, marija-antoaneta]
        a: Luj XVI
        b: Marija Antoaneta
        pitanje: "Na koga se odnosi tvrdnja — na Luja XVI, Mariju Antoanetu, oboje ili nikoga?"
