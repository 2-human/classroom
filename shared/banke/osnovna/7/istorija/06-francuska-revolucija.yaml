          - {tekst: "Da donese prvi ustav Francuske", tacan: false, zasto: "Ustav je zahtevao Treći stalež, protiv volje kralja."}
          - {tekst: "Da ga proglasi carem", tacan: false, zasto: "Luj XVI je već bio kralj; potreban mu je bio novac."}
          - {tekst: "Da ukine povlastice plemstva", tacan: false, zasto: "Kralj nije tražio ukidanje povlastica — to je kasnije učinila Ustavotvorna skupština."}
        pomoc:
          - "Šta je kralju nedostajalo?"
          - "Novac država dobija od poreza."
          - "Iz lekcije: očekivao je da skupština odobri nove poreze."
        objasnjenje: Luj XVI je hteo da skupština odobri nove poreze i tako popuni praznu blagajnu.
        iz_udzbenika: {strana: 47, odeljak: "Početak revolucije: događaji iz 1789. godine", tekst: "Vladar je očekivao da će skupština odobriti uvođenje novih poreza i tako prevazići finansijsku krizu."}

      - id: l06-poc-izbor-mesto
