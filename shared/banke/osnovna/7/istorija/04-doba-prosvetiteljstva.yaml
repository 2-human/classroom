          tekst: "Na političkoj karti Evrope oko 1780. krunom su označena tri vladara: Fridrih II (1740–1786) u Pruskoj, Josif II (1780–1790) u Habzburškoj monarhiji i Katarina II (1762–1796) u Rusiji."
          napomena: "Odlomak je prepričan; udžbenik, str. 34."
        pitanje: Šta je zajedničko vladarima koje karta označava krunom?
        odgovori:
          - {tekst: "Svi su bili vladari prosvećenog apsolutizma", tacan: true}
          - {tekst: "Svi su vladali istom državom", tacan: false, zasto: "Svako je vladao drugom državom — Pruskom, Habzburškom monarhijom i Rusijom."}
          - {tekst: "Svi su bili iz dinastije Habzburg", tacan: false, zasto: "Samo je Josif II Habzburg; Fridrih II je iz dinastije Hoencolern."}
          - {tekst: "Svi su bili izabrani predsednici republika", tacan: false, zasto: "Bili su monarsi sa neograničenom vlašću — republike su bile samo male države."}
        pomoc:
