          - {tekst: "Republika je bila Francuska, zahvaljujući prosvetiteljima.", tacan: false, zasto: "Francuska je bila apsolutistička monarhija; prosvetitelji su je kritikovali, ali je uređenje ostalo isto."}
        pomoc:
          - "Seti se koje su države bile republike."
          - "Jesu li Venecija ili Švajcarska bile velike sile?"
          - "Iz lekcije: republikansko uređenje imale su samo manje države."
        objasnjenje: Netačno — sve velike sile bile su monarhije; republike su bile male države.
        iz_udzbenika:
          strana: 34
          odeljak: Uvod — Evropa oko 1780.
          tekst: Samo manje države, Venecija, Đenova, Švajcarska i Holandija, bile su republike.

