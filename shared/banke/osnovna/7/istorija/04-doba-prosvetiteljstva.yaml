  # ==========================================================================
  - naslov: Evropa oko 1780.
    zadaci:
      - id: evr-izbor-britanija
        vrsta: izbor
        tezina: lako
        pojmovi: [apsolutisticka-monarhija, velika-britanija]
        pitanje: Koja evropska sila sredinom XVIII veka NIJE bila apsolutistička monarhija?
        odgovori:
          - {tekst: "Velika Britanija", tacan: true}
          - {tekst: "Francuska", tacan: false, zasto: "Francuska je bila apsolutistička monarhija — upravo su francuski prosvetitelji kritikovali apsolutizam svojih kraljeva."}
          - {tekst: "Rusija", tacan: false, zasto: "Rusijom su apsolutistički vladali carevi, kao Petar I i Katarina II."}
          - {tekst: "Pruska", tacan: false, zasto: "Pruskom je neograničeno vladao kralj Fridrih II — kao prosvećeni apsolutista."}
        pomoc:
          - "Seti se koju zemlju je Monteskje uzimao za uzor."
          - "Ta zemlja je imala parlament, pa vladar nije imao neograničenu vlast."
          - "Iz lekcije: osim Velike Britanije, sve evropske sile bile su apsolutističke monarhije."
        objasnjenje: Sredinom XVIII veka sve velike sile osim Velike Britanije bile su apsolutističke monarhije — vladar je imao neograničenu vlast.
        iz_udzbenika:
          strana: 34
          odeljak: Uvod — Evropa oko 1780.
          tekst: Većina evropskih država bile su monarhije; sve sile osim Velike Britanije bile su apsolutističke monarhije.
          slika: 04-doba-prosvetiteljstva/01-karta-evrope-1780.jpg

      - id: evr-izbor-republike
        vrsta: izbor
        tezina: srednje
        pojmovi: [republika, venecija, djenova, svajcarska, holandija]
        pitanje: Koje države su sredinom XVIII veka imale republikansko uređenje? (više tačnih)
        odgovori:
          - {tekst: "Venecija", tacan: true}
          - {tekst: "Đenova", tacan: true}
          - {tekst: "Švajcarska", tacan: true}
          - {tekst: "Holandija", tacan: true}
          - {tekst: "Velika Britanija", tacan: false, zasto: "Velika Britanija je bila monarhija — doduše ne apsolutistička, nego sa parlamentom."}
          - {tekst: "Pruska", tacan: false, zasto: "Pruska je bila kraljevina kojom je apsolutistički vladao Fridrih II."}
        pomoc:
          - "Republike su bile samo manje države."
          - "Dve od njih su italijanski primorski gradovi-države."
          - "Iz lekcije: republike su bile Venecija, Đenova, Švajcarska i Holandija."
        objasnjenje: Republikansko uređenje imale su samo manje države — Venecija, Đenova, Švajcarska i Holandija.
        iz_udzbenika:
          strana: 34
          odeljak: Uvod — Evropa oko 1780.
          tekst: Samo manje države, Venecija, Đenova, Švajcarska i Holandija, imale su republikansko uređenje.
          slika: 04-doba-prosvetiteljstva/01-karta-evrope-1780.jpg

      - id: evr-izbor-apsolutisticke
        vrsta: izbor
        slika_u_pitanju: true
        tezina: tesko
        pojmovi: [apsolutisticka-monarhija, francuska, rusija, osmansko-carstvo, holandija, velika-britanija]
        pitanje: Koje su od navedenih država na karti Evrope oko 1780. bile apsolutističke monarhije? (više tačnih)
        odgovori:
          - {tekst: "Francuska", tacan: true}
          - {tekst: "Rusija", tacan: true}
          - {tekst: "Osmansko carstvo", tacan: true}
          - {tekst: "Habzburška monarhija", tacan: true}
          - {tekst: "Holandija", tacan: false, zasto: "Holandija je bila republika — jedna od manjih država bez monarha."}
          - {tekst: "Venecija", tacan: false, zasto: "Venecija je bila republika."}
          - {tekst: "Velika Britanija", tacan: false, zasto: "Velika Britanija je jedina sila koja nije bila apsolutistička — imala je parlament."}
        pomoc:
          - "Pravilo iz lekcije: sve velike sile, osim jedne, bile su apsolutističke."
          - "Izbaci manje države sa republikanskim uređenjem i silu sa parlamentom."
          - "Iz lekcije: osim Velike Britanije sve sile su apsolutističke; Venecija, Đenova, Švajcarska i Holandija su republike."
        objasnjenje: Velike sile (Francuska, Rusija, Habzburška monarhija, Osmansko carstvo, Pruska, Španija…) bile su apsolutističke; izuzetak je Velika Britanija, a republike su bile manje države.
        iz_udzbenika:
          strana: 34
          odeljak: Uvod — Evropa oko 1780.
          tekst: Udžbenik traži da na karti pokažeš apsolutističke monarhije — to su sve sile osim Velike Britanije.
          slika: 04-doba-prosvetiteljstva/01-karta-evrope-1780.jpg

      - id: evr-tn-monarhije
        vrsta: tacno_netacno
        tezina: lako
        pojmovi: [apsolutisticka-monarhija, republika]
        tvrdnja: Sredinom XVIII veka većina evropskih država bile su monarhije.
        tacno: true
        pomoc:
          - "Pogledaj kartu: koliko je republika, a koliko kraljevina i carstava?"
          - "Iz lekcije: republike su bile samo nekoliko manjih država."
        objasnjenje: Tačno — monarhije su bile pravilo, a republike retke i male (Venecija, Đenova, Švajcarska, Holandija).
        iz_udzbenika:
          strana: 34
          odeljak: Uvod — Evropa oko 1780.
          tekst: Sredinom XVIII veka većina evropskih država imala je monarhijsko uređenje.

