      - id: evr-zakljuci-josif-na-karti
        vrsta: zakljuci
        slika_u_pitanju: true
        tezina: srednje
        pojmovi: [josif-ii, marija-terezija, habzburska-monarhija]
        pitanje: Zašto je na karti oko 1780. krunom označen Josif II, a ne Marija Terezija, iako je i ona sprovodila reforme?
        odgovori:
          - {tekst: "Marija Terezija je vladala do 1780. godine, a tada je presto preuzeo njen sin Josif II", tacan: true}
          - {tekst: "Marija Terezija nije bila habzburška vladarka", tacan: false, zasto: "Bila je — i to prva žena na habzburškom prestolu (1740–1780)."}
          - {tekst: "Žene u Habzburškoj monarhiji nisu smele da nasleđuju presto", tacan: false, zasto: "Karlo VI je doneo akt po kome i ženski potomci mogu da naslede presto — zato je Marija Terezija vladala."}
          - {tekst: "Marija Terezija nije sprovodila nikakve reforme", tacan: false, zasto: "Sprovela je mnogo reformi — porezi, vojska, školstvo, zdravstvo, nadzor nad crkvom."}
        pomoc:
          - "Korak 1: Do koje godine je vladala Marija Terezija?"
          - "Korak 2: Ko je nasledio presto te godine?"
          - "Iz lekcije: Marija Terezija (1740–1780), Josif II (1780–1790)."
        objasnjenje: Karta prikazuje stanje oko 1780 — tada se vladavina Marije Terezije završava i počinje vladavina Josifa II.
        iz_udzbenika:
          strana: 34
          odeljak: Uvod — karta; Habzburška monarhija
          tekst: Na karti je za Habzburšku monarhiju označen Josif II (1780–1790), sin i naslednik Marije Terezije (1740–1780).
          slika: 04-doba-prosvetiteljstva/01-karta-evrope-1780.jpg
        osa: {naziv: Josif II, od: 1780, do: 1790, traka: vladari}

      - id: evr-zakljuci-engleska
        vrsta: zakljuci
        tezina: tesko
        pojmovi: [velika-britanija, monteskje, parlamentarna-monarhija, apsolutizam]
        pitanje: Monteskje je predlagao uređenje „po engleskom uzoru”. Šta je Englesku (Veliku Britaniju) izdvajalo od drugih velikih sila na karti?
        odgovori:
          - {tekst: "Bila je jedina velika sila koja nije bila apsolutistička monarhija", tacan: true}
          - {tekst: "Bila je republika", tacan: false, zasto: "Bila je monarhija, ali sa parlamentom — zato Monteskje govori o parlamentarnoj monarhiji."}
          - {tekst: "Njen vladar je na karti označen krunom kao prosvećeni apsolutista", tacan: false, zasto: "Krunom su označeni samo Fridrih II, Josif II i Katarina II."}
          - {tekst: "Bila je najveće carstvo u Evropi", tacan: false, zasto: "Lekcija o tome ne govori; prostrano carstvo je bila Rusija. Razlika je u uređenju, ne u veličini."}
        pomoc:
          - "Korak 1: Šta je Monteskje kritikovao kod francuskih kraljeva?"
          - "Korak 2: Koja sila je jedina izuzetak od tog uređenja?"
          - "Iz lekcije: osim Velike Britanije sve sile su apsolutističke; Monteskje je za parlamentarnu monarhiju po engleskom uzoru."
        objasnjenje: Monteskje kritikuje apsolutizam, a Engleska je jedina velika sila koja nije apsolutistička — vlast kralja ograničava parlament. Zato mu je ona uzor.
        iz_udzbenika:
          strana: 34
          odeljak: Uvod; Prosvetiteljstvo
          tekst: Velika Britanija je jedina sila koja nije apsolutistička monarhija; Monteskje traži parlamentarnu monarhiju po engleskom uzoru.

      - id: evr-uporedi-monarhija-republika
        vrsta: uporedi
        tezina: lako
        pojmovi: [republika, apsolutisticka-monarhija, ruso, volter]
        a: Monarhija
        b: Republika
        pitanje: Na koje uređenje se odnosi tvrdnja — monarhiju, republiku, oba ili nijedno?
        tvrdnje:
          - {tekst: "Na čelu je vladar koji vlast nasleđuje i drži doživotno.", odgovor: a, zasto: "To je monarhija; u republici građani biraju vlast."}
          - {tekst: "Građani biraju vlast na određeno vreme.", odgovor: b, zasto: "To je odlika republike."}
          - {tekst: "Ovakvo uređenje imale su Venecija i Holandija.", odgovor: b, zasto: "Venecija, Đenova, Švajcarska i Holandija bile su republike."}
          - {tekst: "Ovakvo uređenje imale su sve velike sile sredinom XVIII veka.", odgovor: a, zasto: "Sve velike sile bile su monarhije — sve osim Velike Britanije čak apsolutističke."}
          - {tekst: "Ruso ga je smatrao najboljim uređenjem.", odgovor: b, zasto: "Ruso: zakoni samo uz odobrenje naroda, pa je republika najbolja."}
          - {tekst: "Postojalo je u Evropi sredinom XVIII veka.", odgovor: oba, zasto: "Bilo je i monarhija (većina) i republika (manje države)."}
        pomoc:
          - "Ko je na čelu — naslednik ili izabrani?"
          - "Velike sile su monarhije, male države republike."
          - "Iz lekcije: u monarhiji vlast se nasleđuje, u republici je biraju građani na određeno vreme."
        objasnjenje: Monarhija = naslednji vladar (sve velike sile); republika = vlast izabrana na određeno vreme (Venecija, Đenova, Švajcarska, Holandija; Rusoov ideal).
        iz_udzbenika:
          strana: 34
          odeljak: Okvir — Podseti se
          tekst: Udžbenik traži da se podsetiš glavnih razlika između republike i monarhije.

      - id: evr-poredjaj-krune
        vrsta: poredjaj
        slika_u_pitanju: true
        tezina: srednje
