      - id: rus-objasni-kmetovi
        vrsta: objasni
        tezina: tesko
        pojmovi: [kmetstvo, petar-i-veliki, katarina-ii-velika, prosveceni-apsolutizam]
        pitanje: Petar I i Katarina II bili su reformatori, a ipak se položaj seljaka u Rusiji pogoršao. Kako je to moguće?
        uzor: Da bi plemstvo podržalo njihove reforme, Petar I i Katarina II dozvolili su da se seljaci pretvaraju u kmetove. Gospodar je mogao slobodno da raspolaže životom kmeta i njegove porodice, a bune kmetova su surovo gušene. Reforme su jačale državu, upravu i vojsku, ali ne i slobodu seljaka.
        ideje:
          - Hteli su da pridobiju plemstvo za svoje reforme.
          - Zato su odobrili pretvaranje seljaka u kmetove.
          - Reforme su jačale državu, ali ne i položaj običnog naroda.
        objasnjenje: Prosvećeni apsolutizam je prvo jačao državu; u Rusiji je cena za podršku plemstva bila sloboda seljaka.
        iz_udzbenika:
          strana: 38
          odeljak: Rusija
          tekst: Da bi pridobili plemstvo za reforme, Petar I i Katarina II odobrili su pretvaranje seljaka u kmetove; bune su surovo gušene.
