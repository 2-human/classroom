        objasnjenje: Volter ne veruje narodu — vlast treba da drži prosvećeni monarh; zato je pristalica prosvećenog apsolutizma.
        iz_udzbenika:
          strana: 36
          odeljak: Svedočanstvo — Volter o prosvećenom apsolutizmu
          tekst: Udžbenik donosi Volterovo pismo Katarini Velikoj o prosvećenom apsolutizmu.
          slika: 04-doba-prosvetiteljstva/03-volter.jpg

      - id: apso-izvor-volter-genije
        vrsta: izvor
        tezina: srednje
        pojmovi: [volter, prosveceni-apsolutizam]
        izvor:
          autor: Volter
          naslov: Pismo Katarini Velikoj (sažetak)
          tekst: Monarsi vladaju svetom zato što je narod retko dostojan da vlada sam. Gotovo sve veliko u svetu delo je genija i upornosti jednog čoveka koji se suprotstavio predrasudama mnoštva. Ne volim kada vlada rulja.
          napomena: "Odlomak je prepričan; udžbenik, str. 36 (Svedočanstvo)."
        pitanje: Kome Volter pripisuje gotovo sve velike stvari u svetu i kako to podržava njegovo omiljeno uređenje?
        odgovori:
          - {tekst: "Geniju i upornosti pojedinca — zato veruje u jakog, prosvećenog vladara", tacan: true}
          - {tekst: "Mnoštvu ljudi — zato veruje u republiku", tacan: false, zasto: "Volter kaže da se veliki pojedinac suprotstavio predrasudama mnoštva; republiku zagovara Ruso."}
          - {tekst: "Crkvi — zato traži da crkva vlada", tacan: false, zasto: "Volter je kritikovao crkvu; u pismu crkve uopšte nema."}
          - {tekst: "Parlamentu — zato traži podelu vlasti", tacan: false, zasto: "Parlamentarnu monarhiju i podelu vlasti traži Monteskje."}
        pomoc:
          - "Ko se u odlomku suprotstavlja predrasudama mnoštva?"
          - "Ako veliko delo stvara jedan čovek, ko treba da vlada?"
          - "Iz lekcije: Volter smatra najboljim prosvećeni apsolutizam."
        objasnjenje: Volter veliča pojedinca koji se uzdiže iznad mnoštva — pa i prosvećenog monarha. Odatle njegova podrška prosvećenom apsolutizmu.
        iz_udzbenika:
          strana: 36
          odeljak: Svedočanstvo — Volter o prosvećenom apsolutizmu
          tekst: U pismu Katarini Volter piše da je gotovo sve veliko delo genija i upornosti pojedinca.

      - id: apso-izvor-dva-autora
        vrsta: izvor
        tezina: tesko
        pojmovi: [volter, ruso, republika, prosveceni-apsolutizam]
        izvor:
          autor: Volter i Ruso
          naslov: Dva svedočanstva (sažeci)
          tekst: "Volter Katarini: monarsi vladaju svetom jer je narod retko dostojan da vlada sam; ne volim kad vlada rulja. — Ruso, Društveni ugovor: monarhija je uvek lošija od republike; narod se u izboru vara mnogo ređe nego vladar."
          napomena: "Odlomak je prepričan; udžbenik, str. 36 (Svedočanstvo)."
        pitanje: Koji autor hvali, a koji kritikuje monarhiju — i zašto?
        odgovori:
          - {tekst: "Volter hvali monarhiju jer ne veruje narodu; Ruso je kritikuje jer veruje narodu", tacan: true}
          - {tekst: "Ruso hvali monarhiju, a Volter je kritikuje", tacan: false, zasto: "Obrnuto — Ruso piše da je monarhija uvek lošija od republike."}
          - {tekst: "Obojica hvale monarhiju", tacan: false, zasto: "Ruso monarhiju jasno kritikuje i bira republiku."}
          - {tekst: "Obojica kritikuju monarhiju jer veruju narodu", tacan: false, zasto: "Volter piše da je narod retko dostojan da vlada sam — on ne veruje narodu."}
        pomoc:
          - "Pronađi u svakom odlomku šta autor misli o narodu."
          - "Ko kaže da se narod ređe vara? Ko kaže da je retko dostojan?"
          - "Iz lekcije: Volter hvali prosvećenu monarhiju, Ruso je kritikuje i bira republiku."
        objasnjenje: "Ključ je odnos prema narodu: Volter mu ne veruje pa hvali prosvećenu monarhiju; Ruso mu veruje pa kritikuje monarhiju i bira republiku."
        iz_udzbenika:
          strana: 36
          odeljak: Svedočanstvo
          tekst: Udžbenik pita koji autor hvali, a koji kritikuje monarhiju i kako posmatraju ulogu naroda.

      - id: apso-izvor-fridrih-volter
        vrsta: izvor
        tezina: srednje
        pojmovi: [fridrih-ii-veliki, volter]
        izvor:
          autor: Fridrih II Veliki
          naslov: Zapis po vesti o Volterovoj smrti (sažetak)
          tekst: Kad je čuo da je Volter umro, pruski kralj je zapisao da ga teši to što je živeo u Volterovo doba.
          napomena: "Odlomak je prepričan; udžbenik, str. 36 (Znatiželja)."
        pitanje: Šta ovaj zapis pokazuje o odnosu Fridriha II prema Volteru?
        odgovori:
          - {tekst: "I posle njihovog razlaza Fridrih je veoma cenio Voltera", tacan: true}
          - {tekst: "Fridrih se obradovao Volterovoj smrti", tacan: false, zasto: "Zapis kaže suprotno — teši ga što je živeo u Volterovo doba, to je pohvala."}
          - {tekst: "Fridrih nikada nije upoznao Voltera", tacan: false, zasto: "Volter je nekoliko godina boravio na Fridrihovom dvoru."}
          - {tekst: "Fridrih je otkupio Volterovu biblioteku", tacan: false, zasto: "Biblioteku je otkupila Katarina II; danas je u Ermitažu."}
        pomoc:
          - "Da li je reč „teši” pohvala ili kritika?"
          - "Seti se: Volter i Fridrih su se razišli, ali zapis dolazi posle toga."
          - "Iz lekcije: Volter je boravio kod Fridriha, razišli su se, a Fridrih je po vesti o smrti zapisao da ga teši što je živeo u Volterovo doba."
        objasnjenje: "Zapis je veliko priznanje: i posle razočaranja i razlaza Fridrih je Voltera smatrao velikanom svog doba."
        iz_udzbenika:
          strana: 36
          odeljak: Znatiželja — Volter i vladari
          tekst: Fridrih Veliki je po vesti o Volterovoj smrti zapisao da ga teši to što je živeo u Volterovo doba.
          slika: 04-doba-prosvetiteljstva/06-fridrih-ii-veliki.jpg
        osa: {naziv: Fridrih II Veliki, od: 1740, do: 1786, traka: vladari}

      - id: apso-uporedi-apsolutizam
        vrsta: uporedi
        tezina: tesko
        pojmovi: [apsolutizam, prosveceni-apsolutizam, volter]
        a: Apsolutizam
        b: Prosvećeni apsolutizam
        pitanje: Na šta se odnosi tvrdnja — apsolutizam, prosvećeni apsolutizam, oba ili nijedno?
        tvrdnje:
          - {tekst: "Vladar ima neograničenu vlast.", odgovor: oba, zasto: "I prosvećeni apsolutista zadržava apsolutna ovlašćenja — razlika je kako ih koristi."}
          - {tekst: "Vladar prihvata ideje prosvetitelja i uvodi mere na dobrobit društva.", odgovor: b, zasto: "To je ono „prosvećeno” u prosvećenom apsolutizmu."}
          - {tekst: "Prosvetitelji su ga kritikovali kod francuskih kraljeva.", odgovor: a, zasto: "Monteskje i drugi kritikovali su apsolutizam francuskih kraljeva."}
          - {tekst: "Narod bira vlast na određeno vreme.", odgovor: nijedan, zasto: "To je republika; u oba apsolutizma vlast se nasleđuje."}
          - {tekst: "Volter ga je smatrao najboljim uređenjem.", odgovor: b, zasto: "Volterov „savez filozofa i kraljeva” je prosvećeni apsolutizam."}
        pomoc:
          - "Šta je zajedničko — šta znači reč apsolutizam?"
          - "Šta dodaje reč „prosvećeni”?"
          - "Iz lekcije: prosvećeni vladar koristi apsolutna ovlašćenja za mere po idejama prosvetitelja."
        objasnjenje: Oba uređenja daju vladaru neograničenu vlast; prosvećeni vladar je koristi za reforme po idejama prosvetitelja.
        iz_udzbenika:
          strana: 35
          odeljak: Prosvećeni apsolutizam
          tekst: Prosvećeni apsolutizam je oblik vladavine u kome vladar sa apsolutnim ovlašćenjima uvodi mere prihvatajući ideje prosvetiteljstva.

      - id: apso-povezi-nadimci
        vrsta: povezi
        tezina: tesko
        pojmovi: [enciklopedija, prosveceni-apsolutizam, marija-terezija, katarina-ii-velika]
        pitanje: Poveži nadimak ili opis sa onim na šta se odnosi.
        parovi:
          - ["„Biblija prosvećenih”", "Enciklopedija"]
          - ["„savez filozofa i kraljeva”", "prosvećeni apsolutizam"]
          - ["„majka Monarhije”", "Marija Terezija"]
          - ["„gospa od Peterburga”", "Katarina II"]
        pomoc:
          - "Jedan nadimak je dobila carica sa šesnaestoro dece."
          - "Volter je jednoj carici davao laskava imena."
          - "Iz lekcije: Enciklopedija — Biblija prosvećenih; Volterov ideal — savez filozofa i kraljeva; Marija Terezija — majka Monarhije."
        objasnjenje: Enciklopedija je „Biblija prosvećenih”, prosvećeni apsolutizam „savez filozofa i kraljeva”, Marija Terezija „majka Monarhije”, a Katarinu II Volter je zvao „gospom od Peterburga”.
        iz_udzbenika:
          strana: 36
          odeljak: Prosvetiteljstvo; Znatiželja; Habzburška monarhija
          tekst: Lekcija navodi nadimke Enciklopedije, prosvećenog apsolutizma, Marije Terezije i Katarine II.

      - id: apso-poredjaj-sve
        vrsta: poredjaj
        tezina: tesko
        pojmovi: [petar-i-veliki, marija-terezija, enciklopedija, katarina-ii-velika, josif-ii, patent-o-verskoj-toleranciji]
        pitanje: Poređaj događaje hronološki, od najranijeg do najkasnijeg.
        stavke:
          - {tekst: "Petar I Veliki postaje ruski car", godina: 1682, do: 1725, naziv: Petar I Veliki, traka: vladari}
          - {tekst: "Marija Terezija stupa na habzburški presto", godina: 1740, do: 1780, naziv: Vladavina Marije Terezije, traka: vladari}
          - {tekst: "Počinje da izlazi Enciklopedija", godina: 1751, do: 1772, naziv: Enciklopedija, traka: ideje}
          - {tekst: "Katarina II Velika postaje ruska carica", godina: 1762, do: 1796, naziv: Katarina II Velika, traka: vladari}
          - {tekst: "Josif II nasleđuje majku", godina: 1780, do: 1790, naziv: Josif II, traka: vladari}
          - {tekst: "Donet je Patent o verskoj toleranciji", godina: 1781, naziv: Patent o verskoj toleranciji, traka: dogadjaji}
        pomoc:
          - "Jedini događaj iz XVII veka ide prvi."
          - "Josif II je morao da postane car pre nego što je doneo Patent."
          - "Iz lekcije: 1682, 1740, 1751, 1762, 1780, 1781."
        objasnjenje: Petar I (1682) → Marija Terezija (1740) → Enciklopedija (1751) → Katarina II (1762) → Josif II (1780) → Patent (1781).
        iz_udzbenika:
          strana: 38
          odeljak: Hronologija lekcije
          tekst: Lekcija pokriva vreme od Petra I (od 1682) do Patenta o verskoj toleranciji (1781).

      - id: apso-objasni-definicija
        vrsta: objasni
        tezina: lako
        pojmovi: [prosveceni-apsolutizam, apsolutizam, prosvetiteljstvo]
        pitanje: Objasni svojim rečima šta je prosvećeni apsolutizam.
        uzor: To je vladavina u kojoj vladar zadržava neograničenu vlast, ali je koristi da uvodi mere na dobrobit društva i države, prihvatajući ideje prosvetitelja. Jačale su se uprava, vojska i privreda. Takvi vladari bili su Marija Terezija, Josif II, Fridrih II i Katarina II.
        ideje:
          - "Vladar ima neograničenu (apsolutnu) vlast."
          - "Prihvata ideje prosvetitelja."
          - "Uvodi mere na dobrobit društva i države."
          - "Primer: Josif II, Fridrih II ili Katarina II."
        objasnjenje: Prosvećeni apsolutizam = stara, neograničena vlast + nove, prosvetiteljske ideje.
        iz_udzbenika:
          strana: 35
          odeljak: Prosvećeni apsolutizam
          tekst: Pojedini vladari prihvatili su ideje prosvetiteljstva i, koristeći apsolutna ovlašćenja, uvodili mere na dobrobit društva i države.

      - id: apso-objasni-volter
        vrsta: objasni
        tezina: lako
        pojmovi: [volter, bastilja, francuska]
        pitanje: Zašto je Volter, veoma popularan u Evropi, imao nemiran život u svojoj Francuskoj? Objasni svojim rečima.
        uzor: Volter je u svojim delima kritikovao rimokatoličku crkvu i sveštenstvo, versku netrpeljivost i surove, nepravedne zakone. Francuskim vlastima to je smetalo, pa je dva puta bio zatvoren u Bastilji i morao je u izgnanstvo u Englesku. Francuski dvor mu je zabranio povratak u Pariz.
        ideje:
          - "Kritikovao je crkvu, versku netrpeljivost i nepravedne zakone."
          - "Dva puta je bio zatvoren u Bastilji."
          - "Morao je u izgnanstvo u Englesku i nije smeo da se vrati u Pariz."
        objasnjenje: Kritika crkve i vlasti donela je Volteru slavu u Evropi, a progon u Francuskoj.
        iz_udzbenika:
          strana: 36
          odeljak: Znatiželja — Volter i vladari
          tekst: Zbog svojih dela Volter je dva puta bio u Bastilji, živeo je u izgnanstvu u Engleskoj, a dvor mu je zabranio povratak u Pariz.
          slika: 04-doba-prosvetiteljstva/03-volter.jpg

      - id: apso-objasni-narod
        vrsta: objasni
        tezina: tesko
        pojmovi: [volter, ruso, republika, prosveceni-apsolutizam]
        pitanje: Kako Volter, a kako Ruso gledaju na ulogu naroda u državi? Objasni razliku i šta iz nje sledi.
        uzor: Volter smatra da je narod retko dostojan da vlada sam i da velike stvari stvaraju pojedinci, pa veruje prosvećenom vladaru — prosvećenom apsolutizmu. Ruso misli da se narod u izboru vara ređe od vladara i da zakone mora da odobri narod, pa je za njega najbolja republika. Različit pogled na narod vodi ih do suprotnih uređenja.
        ideje:
          - "Volter: narod je retko dostojan da vlada sam."
          - "Volter zato bira prosvećeni apsolutizam."
          - "Ruso: narod bira bolje od vladara i odobrava zakone."
          - "Ruso zato bira republiku."
        objasnjenje: Odnos prema narodu odlučuje koje uređenje prosvetitelj bira.
        iz_udzbenika:
          strana: 36
          odeljak: Svedočanstvo
          tekst: Udžbenik pita kako Volter i Ruso posmatraju ulogu naroda.

