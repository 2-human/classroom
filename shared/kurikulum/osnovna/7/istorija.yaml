# Istorija — 7. razred osnovne škole: poglavlja i lekcije po udžbeniku (period 1780–1918).
# Alati se vezuju za lekcije poljem `lekcije: [broj, ...]` u svom spec.yaml.
# Brojevi su redosled lekcija; oznaka iz knjige (1.1, 2.1 …) je u naslovu. Snimljene su str. 10–38
# (bez 15, 20–27, 33): ako na str. 20–27 postoji lekcija 1.3, lekcije posle nje se prenumerišu.
nivo: osnovna
razred: 7
predmet: istorija
poglavlja:
  - naslov: I — Osnovi proučavanja prošlosti
    lekcije:
      - {broj: 1, naslov: "1.1. Osnovne odlike perioda 1780–1918."}
      - {broj: 2, naslov: "1.2. Istorijski izvori za izučavanje perioda 1780–1918."}
  - naslov: II — Doba revolucija
    lekcije:
      - {broj: 3, naslov: "2.1. Industrijska revolucija"}
      - {broj: 4, naslov: "2.2. Doba prosvetiteljstva"}
