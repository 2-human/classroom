<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Južna Evropa — kviz</title>
<style>

 :root{--hub-bg:#faf8f2;--hub-card:#fff;--hub-ink:#2b2b2b;--hub-head:#3a3528;--hub-mute:#6b6456;--hub-line:#e6e0d2;--hub-soft:#f3ecd8;--hub-accent:#b1271f;--hub-ok:#1f7a3a;--hub-nav-w:280px;--hub-drawer-w:440px}
 html:has(.app-body){overflow:hidden}
 .app-body{margin:0;height:100vh;height:100dvh;overflow:hidden;display:flex;flex-direction:column;max-width:100vw;background:var(--hub-bg);color:var(--hub-ink);font-family:system-ui,Segoe UI,Roboto,Arial,sans-serif}
 .app-bar{flex:0 0 auto;display:flex;align-items:center;gap:14px;padding:8px 16px;background:var(--hub-card);border-bottom:1px solid var(--hub-line);min-width:0;position:relative;z-index:50}
 .app-bar .app-menu{display:none;padding:0;width:36px;height:34px;font-size:18px;line-height:1;border:1px solid var(--hub-line);background:var(--hub-card);color:var(--hub-head);border-radius:7px;cursor:pointer}
 .app-bar .app-menu:hover{background:var(--hub-soft);color:var(--hub-head)}
 .brand{font-weight:700;font-size:15px;color:var(--hub-head);text-decoration:none;white-space:nowrap}
 .brand:hover{color:var(--hub-accent)}
 .app-crumbs{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--hub-mute);min-width:0;overflow:hidden;white-space:nowrap}
 .app-crumbs a{color:var(--hub-mute);text-decoration:none}
 .app-crumbs a:hover{color:var(--hub-accent)}
 .app-crumbs .sep{color:#b9b2a0}
 .app-crumbs .cur{color:var(--hub-head);font-weight:600;overflow:hidden;text-overflow:ellipsis}
 .bar-right{margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end;min-width:0}
 .app-grid{flex:1 1 auto;display:grid;grid-template-columns:var(--hub-nav-w) minmax(0,1fr);min-height:0}
 .app-nav{background:var(--hub-card);border-right:1px solid var(--hub-line);overflow:auto;padding:10px 10px 40px;min-height:0}
 .app-filter{width:100%;font:inherit;font-size:13px;padding:7px 9px;border:1px solid var(--hub-line);border-radius:6px;margin:0 0 4px;background:#fff;color:var(--hub-ink)}
 .app-filter:focus{outline:none;border-color:var(--hub-mute)}
 .app-nav .sec{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--hub-mute);padding:12px 6px 4px}
 .app-nav .cnt{font-size:11px;color:var(--hub-mute);font-variant-numeric:tabular-nums;letter-spacing:0;text-transform:none}
 .f-hide{display:none!important}
 .app-main{position:relative;overflow:auto;min-width:0;min-height:0;transition:margin-right .18s ease}
 .app-drawer{position:fixed;top:var(--htop,50px);right:0;bottom:0;width:var(--hub-drawer-w);max-width:100vw;background:var(--hub-card);border-left:1px solid var(--hub-line);box-shadow:-8px 0 24px rgba(58,53,40,.10);transform:translateX(105%);transition:transform .18s ease;z-index:60;display:flex;flex-direction:column}
 .app-drawer.open{transform:none}
 .drawer-head{display:flex;align-items:flex-start;gap:10px;padding:14px 16px 10px;border-bottom:1px solid var(--hub-line)}
 .drawer-head h2{margin:0;font-size:16px;color:var(--hub-head);flex:1 1 auto;overflow-wrap:anywhere}
 .app-drawer .drawer-close{border:0;background:none;padding:0 4px;font-size:24px;line-height:1;cursor:pointer;color:var(--hub-mute)}
 .app-drawer .drawer-close:hover{background:none;color:var(--hub-accent)}
 .drawer-body{flex:1 1 auto;overflow:auto;padding:12px 16px 24px;font-size:13px;line-height:1.55}
 .drawer-foot{flex:0 0 auto;border-top:1px solid var(--hub-line);padding:10px 16px;font-size:12px;color:var(--hub-mute)}
 .mtabs{display:flex;gap:2px;border-bottom:1px solid var(--hub-line);flex-wrap:wrap;background:var(--hub-card);padding:0 12px}
 .mtabs a{text-decoration:none;color:var(--hub-mute);font-size:13px;padding:9px 12px 8px;border-bottom:2px solid transparent}
 .mtabs a[aria-current="page"]{color:var(--hub-head);border-bottom-color:var(--hub-accent);font-weight:600}
 .bar-menu-wrap{position:relative}
 .bar-menu{display:none;position:absolute;right:0;top:calc(100% + 8px);z-index:70;background:var(--hub-card);border:1px solid var(--hub-line);border-radius:10px;box-shadow:0 6px 20px rgba(0,0,0,.16);padding:8px;min-width:240px}
 .bar-menu.open{display:flex;flex-direction:column;align-items:stretch;gap:6px}
 .tbl{width:100%;border-collapse:collapse;background:var(--hub-card);border:1px solid var(--hub-line);border-radius:6px;font-size:13px}
 .tbl th{text-align:left;font-weight:600;font-size:11.5px;color:var(--hub-mute);padding:8px 10px;border-bottom:1px solid var(--hub-line);background:#fcfaf4;white-space:nowrap}
 .tbl td{padding:7px 10px;border-bottom:1px solid #f0ebe0;vertical-align:top}
 .tbl td.num,.tbl th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
 .tbl tr.clk{cursor:pointer} .tbl tr.clk:hover td{background:#fbf7ec}
 @media (min-width:1200px){ .app-body:has(.app-drawer.open) .app-main{margin-right:var(--hub-drawer-w)} }
 @media (max-width:760px){
   .app-bar{gap:10px;padding:8px 12px}
   .app-bar .app-menu{display:inline-block}
   .app-crumbs{display:none}
   .app-grid{grid-template-columns:minmax(0,1fr)}
   .app-nav{position:fixed;top:var(--htop,50px);left:0;bottom:0;width:300px;max-width:88vw;z-index:55;transform:translateX(-105%);transition:transform .18s ease;box-shadow:8px 0 24px rgba(58,53,40,.10)}
   .app-nav.open{transform:none}
   .app-drawer{width:100vw}
 }
 @media print{
   html:has(.app-body){overflow:visible}
   .app-body{height:auto;overflow:visible;display:block}
   .app-grid{display:block}
   .app-main,.app-nav{overflow:visible}
   .app-drawer,.app-filter,.app-menu,.bar-menu-wrap,.mtabs{display:none!important}
 }

 :root{--ink:#2b2b2b;--muted:#6b6456;--edge:#b1271f;--accent:#1f7a3a;--border:#e6e0d2;--soft:#fefcf7;--warn:#c98a2c;
       --sea:#cfe6f2;--land:#efeae0;--land-se:#f3ecd8;--bord:#8a8170}
 *{box-sizing:border-box}
 button{font:inherit;padding:7px 14px;border:1px solid var(--edge);background:#fff;color:var(--edge);border-radius:8px;cursor:pointer}
 button:hover{background:var(--edge);color:#fff}
 button.ok{border-color:var(--accent);color:var(--accent)} button.ok:hover{background:var(--accent);color:#fff}
 button:disabled{opacity:.45;cursor:default;background:#fff;color:inherit}
 .opt:disabled,.tn button:disabled,.mcell:disabled,.blank:disabled{opacity:1;cursor:default}
 .opt:disabled:not(.right):not(.wrong){opacity:.6}
 .bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-size:14px}
 .bar-menu-btn{padding:5px 12px;font-size:16px;line-height:1;border-color:var(--muted);color:#3a3528}
 .bar-menu-btn:hover{background:#f3ecd8;color:#3a3528}
 .bar-menu button{width:100%;text-align:left}
 .mode-switch{display:inline-flex}
 .ms-btn{padding:5px 12px;border-color:#6b6456;color:#3a3528;min-width:5.5em}
 .ms-btn:first-child{border-radius:8px 0 0 8px} .ms-btn:last-child{border-radius:0 8px 8px 0;border-left:none}
 .ms-btn:hover{background:#f3ecd8;color:#3a3528}
 .ms-btn.active{background:#3a3528;color:#fff;border-color:#3a3528}
 .stat{background:#f3ecd8;border:1px solid #e1d8c2;border-radius:8px;padding:4px 10px;white-space:nowrap}
 .stat b{font-size:15px;color:var(--accent)}
 .intro p{font-size:14px;color:#4a4434;line-height:1.6;margin:0 0 10px}
 .intro ul{margin:0 0 10px;padding-left:18px;font-size:13.5px;line-height:1.55}
 /* navigation: items */
 .it-row{display:flex;align-items:center;gap:8px;width:100%;border:0;border-radius:5px;background:none;color:var(--ink);font:inherit;font-size:13px;text-align:left;padding:5px 6px;cursor:pointer}
 .it-row:hover{background:#f6f1e4;color:var(--ink)}
 .it-row.sel{background:#efe7d2;font-weight:600}
 .it-row.off{opacity:.4}
 .it-row .st{flex:0 0 16px;text-align:center;color:#b9b2a0}
 .it-row.ok .st{color:var(--accent)} .it-row.rev .st,.it-row.fail .st{color:var(--edge)} .it-row.part .st{color:var(--warn)}
 .it-row .lbl{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
 .it-row .pt{flex:0 0 auto;font-size:11px;color:var(--muted);font-weight:400;font-variant-numeric:tabular-nums}
 .tz{flex:0 0 auto;display:inline-block;min-width:1.5em;text-align:center;font-size:10px;font-weight:700;border-radius:8px;padding:1px 5px;letter-spacing:.02em}
 .tz-lako{background:#e3f2e8;color:#1f6b3a} .tz-srednje{background:#fbefd5;color:#8a5a14} .tz-tesko{background:#f8dcd8;color:#8a2a22}
 .tz-legend{display:flex;gap:8px;flex-wrap:wrap;font-size:11px;color:var(--muted);padding:2px 6px 0}
 /* main: item */
 .item{padding:20px 24px 40px;max-width:1100px}
 .ihead{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-bottom:8px}
 .vchip{font-size:11px;text-transform:uppercase;letter-spacing:.05em;border:1px solid var(--border);border-radius:9px;padding:1px 8px;background:#fff}
 .item h2.q{font-size:18px;line-height:1.4;color:#3a3528;margin:0 0 14px}
 .opts{display:flex;flex-direction:column;gap:8px;max-width:640px}
 .opt{display:flex;gap:10px;align-items:flex-start;text-align:left;border:1px solid var(--border);background:#fff;color:var(--ink);border-radius:8px;padding:10px 12px;font-size:14.5px;line-height:1.4}
 .opt:hover{background:#fbf7ec;color:var(--ink)}
 .opt.picked{border-color:#3a3528;background:#f6f1e4}
 .opt.wrong{border-color:#e6b0b0;background:#fdecec;color:#8a2a22;text-decoration:line-through}
 .opt.right{border-color:#9fd5b6;background:#e8f5ec;color:#13602c;font-weight:600}
 .opt .box{flex:0 0 18px;height:18px;border:1.5px solid #6b6456;border-radius:4px;margin-top:1px}
 .opt.picked .box{background:#3a3528;box-shadow:inset 0 0 0 3px #fff}
 .opt.round .box{border-radius:50%}
 .tn{display:flex;gap:12px;margin:4px 0 14px}
 .tn button{min-width:8em;padding:10px 18px;font-size:15px}
 .tn button.right{background:var(--accent);border-color:var(--accent);color:#fff}
 .tn button.wrong{background:#fdecec;border-color:#e6b0b0;color:#8a2a22}
 .stmt{font-size:16px;line-height:1.5;border-left:3px solid #e1d8c2;padding:6px 12px;margin:0 0 14px;background:#fff}
 .sub-q{font-weight:600;color:#3a3528;margin:16px 0 8px}
 .cloze{font-size:16px;line-height:2.3;max-width:720px}
 .blank{display:inline-block;min-width:5.5em;border:0;border-bottom:2px solid #6b6456;background:#fff;text-align:center;font:inherit;font-weight:600;color:#3a3528;padding:0 6px;margin:0 3px;border-radius:4px 4px 0 0;cursor:pointer}
 input.blank{cursor:text;width:7em}
 .blank:hover{background:#fbf7ec;color:#3a3528}
 .blank.cur{border-bottom-color:var(--edge);background:#fff7f3}
 .blank.lock{border-bottom-color:var(--accent);background:#e8f5ec;color:#13602c;cursor:default}
 .blank.bad{border-bottom-color:var(--edge);background:#fdecec;color:#8a2a22}
 .blank.rev{border-bottom-color:var(--warn);background:#fdf3e2;color:#8a5a14}
 .bank{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 0}
 .bank button{padding:5px 12px;border-color:#6b6456;color:#3a3528;border-radius:16px}
 .bank button:hover{background:#f3ecd8;color:#3a3528}
 .bank button.used{opacity:.3;pointer-events:none}
 .match{display:grid;grid-template-columns:1fr 1fr;gap:10px 28px;max-width:720px}
 .match .col{display:flex;flex-direction:column;gap:8px}
 .mcell{text-align:left;border:1px solid var(--border);background:#fff;color:var(--ink);border-radius:8px;padding:9px 12px;font-size:14px}
 .mcell:hover{background:#fbf7ec;color:var(--ink)}
 .mcell.cur{border-color:#3a3528;box-shadow:0 0 0 2px rgba(58,53,40,.15)}
 .mcell.done{border-color:#9fd5b6;background:#e8f5ec;color:#13602c;cursor:default}
 .mcell.rev{border-color:#ecc98a;background:#fdf3e2;color:#8a5a14;cursor:default}
 .mcell.bad{animation:shake .3s;border-color:#e6b0b0;background:#fdecec}
 .mcell .n{display:inline-block;min-width:1.4em;font-weight:700;margin-right:6px;color:var(--muted)}
 @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
 .iactions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:18px}
 .fb{font-size:14px;font-weight:600;min-height:1.4em}
 .fb.ok{color:var(--accent)} .fb.bad{color:var(--edge)} .fb.info{color:var(--muted);font-weight:400}
 .expl{margin-top:14px;padding:10px 14px;border-radius:8px;background:#e8f5ec;border:1px solid #bfe0c8;color:#13602c;font-size:14px;line-height:1.5;max-width:720px}
 .expl.rev{background:#fdf3e2;border-color:#f0d878;color:#6b4a10}
 .help-inline{display:none}
 /* map */
 .mapwrap{position:relative;margin-top:6px;border:1px solid var(--border);border-radius:8px;overflow:hidden;background:var(--sea);aspect-ratio:1000/430;max-height:70vh;touch-action:none}
 .mapwrap svg{width:100%;height:100%;display:block;cursor:crosshair}
 .mapwrap svg.drag{cursor:grabbing}
 .mapwrap .c{fill:var(--land);stroke:var(--bord);stroke-width:.6;vector-effect:non-scaling-stroke}
 .mapwrap .c.se{fill:var(--land-se)}
 .mapwrap .c.se:hover{fill:#e9dcb8}
 .mapwrap .c.hit{fill:#bfe0c8} .mapwrap .c.miss{fill:#f3c9c4} .mapwrap .c.revc{fill:#f6dca6}
 .mapwrap .mk{pointer-events:none}
 .mapwrap .mk circle{stroke:#fff;vector-effect:non-scaling-stroke}
 .mapwrap .mk text{font-size:13px;font-weight:700;paint-order:stroke;stroke:#fff;stroke-width:3px;vector-effect:non-scaling-stroke}
 .zbar{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px}
 .zbar button{width:36px;height:36px;padding:0;font-size:18px;font-weight:700;background:#fff;border-color:#6b6456;color:#3a3528;box-shadow:0 1px 3px rgba(0,0,0,.2)}
 .zbar button:hover{background:#f3ecd8;color:#3a3528}
 .zhint{position:absolute;left:10px;bottom:8px;font-size:11.5px;color:var(--muted);background:rgba(255,255,255,.85);border-radius:6px;padding:3px 8px;pointer-events:none}
 .clues{list-style:none;margin:0 0 6px;padding:0;max-width:720px}
 .clues li{padding:7px 10px;margin:0 0 6px;border-left:3px solid #e1d8c2;background:#fff;font-size:14.5px;line-height:1.45}
 .clues li:last-child{border-left-color:var(--edge)}
 .clues .k{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-right:6px}
 /* drawer content */
 .hl h3{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:14px 0 6px}
 .hl ol{margin:0;padding-left:20px} .hl li{margin:0 0 10px;line-height:1.5}
 .hl li.new{animation:flash 1.2s}
 @keyframes flash{0%{background:#fff3c4}100%{background:transparent}}
 .hl .placeholder{color:#9b9387;font-style:italic}
 .hl .chips{display:flex;flex-wrap:wrap;gap:6px}
 .hl .pchip{font-size:12px;border:1px solid var(--border);border-radius:10px;padding:1px 9px;background:#fefcf7}
 .hl a{color:var(--edge);text-decoration:none}
 .hl ul{margin:0;padding-left:18px} .hl ul li{margin:3px 0}
 .hl .ref{font-size:12px;color:var(--muted);margin:0 0 6px}
 .hl figure{margin:6px 0 10px} .hl figure img{display:block;max-width:100%;border-radius:6px;border:1px solid var(--border)}
 .hl figcaption{font-size:11.5px;color:var(--muted);margin-top:4px}
 .hl .book{border-left:3px solid #e1d8c2;padding:2px 0 2px 12px;margin:6px 0 4px}
 /* summary */
 .sum{padding:22px 26px 40px;max-width:860px}
 .sum h1{font-size:22px;margin:0 0 6px;color:#3a3528}
 .sum .big{font-size:30px;font-weight:700;color:var(--accent)}
 .sum .tbl{margin:14px 0}
 .sum .sub{color:var(--muted);margin:0 0 6px} .sum .lead{color:var(--muted);max-width:640px;line-height:1.5}
 .rv{border:1px solid var(--border);border-radius:8px;background:#fff;padding:10px 14px;margin:12px 0}
 .rv .rq{margin:4px 0 8px;font-weight:600;color:#3a3528} .rv .rl{margin:0;font-size:12px;color:var(--muted)}
 .rlog{margin:2px 0 8px;padding-left:18px;font-size:13.5px} .rlog .ok{color:var(--accent)} .rlog .bad{color:var(--edge)}
 .rv .rc{margin:0;font-size:13.5px}
 #msg{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--edge);color:#fff;padding:9px 18px;border-radius:24px;font-size:14px;font-weight:600;opacity:0;transition:opacity .25s;pointer-events:none;z-index:99}
 #msg.show{opacity:1}
 @media (max-width:760px){
   .brand{display:none}
   .bar{flex-wrap:nowrap;gap:6px} .stat{padding:3px 7px;font-size:12px} .stat b{font-size:13px}
   .ms-btn{min-width:auto;padding:4px 8px;font-size:13px} .bar-menu-btn{padding:4px 9px}
   .item{padding:14px 14px 40px} .item h2.q{font-size:16.5px}
   .match{grid-template-columns:1fr 1fr;gap:8px 10px} .mcell{font-size:13px;padding:8px}
   .help-inline{display:block;margin-top:14px}
   .help-inline:empty{display:none}
   .help-inline .hl{border:1px solid #f0d878;background:#fffbe6;border-radius:8px;padding:2px 12px 4px}
   .mapwrap{aspect-ratio:auto;height:52vh}
 }
</style>
</head>

<script>
(function () {
  const root = document.documentElement;
  const bar = document.querySelector('.app-bar');
  function setTop() { if (bar) root.style.setProperty('--htop', bar.offsetHeight + 'px'); }
  window.addEventListener('resize', setTop);
  setTop();

  // ☰ navigation (only shown at ≤760px)
  const nav = document.getElementById('app-nav');
  const navBtn = document.getElementById('app-menu');
  const navOverlay = () => window.matchMedia && window.matchMedia('(max-width:760px)').matches;
  function setNav(open) {
    if (!nav) return;
    nav.classList.toggle('open', !!open);
    if (navBtn) navBtn.setAttribute('aria-expanded', String(!!open));
  }
  if (navBtn) navBtn.addEventListener('click', e => { e.stopPropagation(); setNav(!nav.classList.contains('open')); });

  // navigation filter: case- and diacritic-insensitive (š, č, ć, ž, đ)
  const filter = document.getElementById('app-filter');
  const norm = s => String(s || '').toLowerCase().replace(/đ/g, 'd').normalize('NFD').replace(/[̀-ͯ]/g, '');
  function applyFilter() {
    const q = norm(filter.value.trim());
    document.querySelectorAll('#app-nav [data-filter]').forEach(el =>
      el.classList.toggle('f-hide', !!q && !norm(el.dataset.filter).includes(q)));
    document.querySelectorAll('#app-nav [data-filter-group]').forEach(g =>
      g.classList.toggle('f-hide', !!q && !g.querySelector('[data-filter]:not(.f-hide)')));
  }
  if (filter) filter.addEventListener('input', applyFilter);

  // ⋯ menus: a button with data-menu="<id>" toggles .bar-menu#<id>; a button inside closes it
  function setMenu(m, open) {
    m.classList.toggle('open', !!open);
    const b = document.querySelector('[data-menu="' + m.id + '"]');
    if (b) b.setAttribute('aria-expanded', String(!!open));
  }
  document.querySelectorAll('[data-menu]').forEach(btn => {
    const m = document.getElementById(btn.dataset.menu);
    if (!m) return;
    btn.addEventListener('click', e => { e.stopPropagation(); setMenu(m, !m.classList.contains('open')); });
    m.addEventListener('click', e => { e.stopPropagation(); if (e.target.closest('button')) setMenu(m, false); });
  });
  document.addEventListener('click', e => {
    // composedPath: the clicked node may already be re-rendered away (e.g. a step's "next" button)
    if (!e.composedPath().some(n => n.dataset && n.dataset.keepMenus)) document.querySelectorAll('.bar-menu.open').forEach(m => setMenu(m, false));
    if (nav && nav.classList.contains('open') && navOverlay() && !nav.contains(e.target)) setNav(false);
  });
  document.addEventListener('keydown', e => {
    if (e.key !== 'Escape') return;
    document.querySelectorAll('.bar-menu.open').forEach(m => setMenu(m, false));
    const x = document.querySelector('.app-drawer.open .drawer-close');
    if (x && x.offsetParent !== null) x.click();
  });

  window.HubShell = { setNav, setMenu, applyFilter, navOverlay };
})();
</script>

opi je malo veći od desetine; stanovnika ima između 150 i 160 miliona.", "Iz lekcije: 1,4 miliona km² — 14% Evrope; oko 159 miliona stanovnika."], "objasnjenje": "Oko 1,4 miliona km² (14% Evrope) i oko 159 miliona stanovnika.", "iz_udzbenika": {"strana": 14, "odeljak": "Položaj i granice regije", "tekst": "Regija zauzima oko 1,4 miliona km², što je 14% površine Evrope. U njoj živi oko 159 miliona stanovnika, pretežno naroda indoevropske porodice.", "slika": "02-juzna-evropa/10-politicka-karta-juzne-evrope.jpg"}}, {"id": "polozaj-izbor-povrsina", "vrsta": "izbor", "tezina": "srednje", "pojmovi": ["juzna-evropa"], "pitanje": "Kolika je približno površina Južne Evrope?", "odgovori": [{"tekst": "oko 1,4 miliona km²", "tacan": true}, {"tekst": "oko 14 miliona km²", "tacan": false}, {"tekst": "oko 140 hiljada km²", "tacan": false}, {"tekst": "oko 4,1 milion km²", "tacan": false}], "pomoc": ["Cela Evropa ima oko 10 miliona km², a Južna Evropa je samo njen manji deo.", "Broj je nešto veći od jednog miliona.", "Iz lekcije: regija zauzima oko 1,4 miliona km²."], "objasnjenje": "Južna Evropa ima oko 1,4 miliona km² — to je oko 14% površine Evrope. Broj 14 miliona bio bi veći od cele Evrope.", "iz_udzbenika": {"strana": 14, "odeljak": "Položaj i granice regije", "tekst": "Površina regije je oko 1,4 miliona km², odnosno 14% površine Evrope."}}, {"id": "polozaj-tn-udeo", "vrsta": "tacno_netacno", "tezina": "srednje", "pojmovi": ["juzna-evropa"], "tvrdnja": "Južna Evropa zauzima oko 41% površine Evrope.", "tacno": false, "ispravke": [{"tekst": "Zauzima oko 14% površine Evrope.", "tacan": true}, {"tekst": "Zauzima oko 4% površine Evrope.", "tacan": false}, {"tekst": "Zauzima tačno polovinu Evrope.", "tacan": false}], "pomoc": ["Tri poluostrva su samo manji deo kontinenta — razmisli da li bi to moglo biti skoro pola Evrope.", "Cifre su ispremeštane; pravi udeo je malo veći od desetine.", "Iz lekcije: 1,4 miliona km² — 14% Evrope."], "objasnjenje": "Netačno — Južna Evropa zauzima oko 14% površine Evrope (oko 1,4 miliona km²).", "iz_udzbenika": {"strana": 14, "odeljak": "Položaj i granice regije", "tekst": "Regija zauzima oko 1,4 miliona km², što je 14% površine Evrope."}}, {"id": "polozaj-tn-juzna-granica", "vrsta": "tacno_netacno", "tezina": "lako", "pojmovi": ["sredozemno-more"], "tvrdnja": "Na jugu Južnu Evropu ograničava Sredozemno more.", "tacno": true, "pomoc": ["Pogledaj šta se nalazi južno od sva tri poluostrva.", "Južno od regije nije kopno, već more između Evrope i Afrike.", "Iz lekcije: na jugu je granica Sredozemno more."], "objasnjenje": "Tačno — južna granica regije je Sredozemno more, koje je odvaja od Afrike.", "iz_udzbenika": {"strana": 14, "odeljak": "Položaj i granice regije", "tekst": "Na jugu regiju ograničava Sredozemno more, a na severu planine i reke.", "slika": "02-juzna-evropa/01-fizicka-karta-juzne-evrope.jpg"}}, {"id": "polozaj-tn-granica", "vrsta": "tacno_netacno", "tezina": "srednje", "pojmovi": ["pirineji", "alpi", "sava", "dunav"], "tvrdnja": "Severnu granicu Južne Evrope čine Pirineji, Alpi, reka Sava i donji tok Dunava.", "tacno": true, "pomoc": ["Zamisli liniju od Atlantika do Crnog mora koja odvaja poluostrva od ostatka Evrope.", "Na zapadu je granica planinska, a na istoku je čine reke.", "Iz lekcije: granica ide preko Pirineja i Alpa, pa rekom Savom i donjim tokom Dunava."], "objasnjenje": "Tačno — na severu regiju ograničavaju Pirineji, Alpi, Sava i donji tok Dunava; na jugu Sredozemno more.", "iz_udzbenika": {"strana": 14, "odeljak": "Položaj i granice regije", "tekst": "Na jugu je granica Sredozemno more. Na severu granicu čine Pirineji, Alpi, reka Sava i donji tok Dunava — zapadni deo granice je planinski, a istočni rečni.", "slika": "02-juzna-evropa/01-fizicka-karta-juzne-evrope.jpg"}}, {"id": "polozaj-tn-dunav", "vrsta": "tacno_netacno", "tezina": "srednje", "pojmovi": ["dunav", "sava"], "tvrdnja": "Ceo tok Dunava, od izvora do ušća, čini deo severne granice Južne Evrope.", "tacno": false, "ispravke": [{"tekst": "Granicu čini samo donji tok Dunava (uz reku Savu).", "tacan": true}, {"tekst": "Granicu čini samo gornji tok Dunava.", "tacan": false}, {"tekst": "Dunav uopšte nije deo granice regije.", "tacan": false}], "pomoc": ["Dunav izvire u Nemačkoj — da li je i taj deo granica Južne Evrope?", "Granica prati samo deo toka koji je bliži Crnom moru.", "Iz lekcije: na severu granicu čine Pirineji, Alpi, Sava i donji tok Dunava."], "objasnjenje": "Netačno — granica je samo donji tok Dunava (od ušća Save do Crnog mora), a ne cela reka.", "iz_udzbenika": {"strana": 14, "odeljak": "Položaj i granice regije", "tekst": "Istočni deo severne granice je rečni — reka Sava i donji tok Dunava, koji teče ka Crnom moru.", "slika": "02-juzna-evropa/01-fizicka-karta-juzne-evrope.jpg"}}, {"id": "polozaj-izbor-alpi", "vrsta": "izbor", "tezina": "lako", "pojmovi": ["alpi", "apeninsko-poluostrvo"], "pitanje": "Koje planine se nalaze severno od Apeninskog poluostrva i čine deo granice Južne Evrope?", "odgovori": [{"tekst": "Alpi", "tacan": true}, {"tekst": "Andi", "tacan": false}, {"tekst": "Himalaji", "tacan": false}, {"tekst": "Ural", "tacan": false}], "pomoc": ["Traži planine koje su u Evropi.", "Ostale ponuđene planine su u Južnoj Americi, Aziji i na granici Evrope i Azije.", "Iz lekcije: severnu granicu regije čine Pirineji, Alpi, Sava i donji tok Dunava."], "objasnjenje": "Alpi su luk visokih planina severno od Apeninskog poluostrva i deo su severne granice regije.", "iz_udzbenika": {"strana": 14, "odeljak": "Položaj i granice regije", "tekst": "Na fizičkoj karti Alpi se vide kao smeđi luk iznad Apeninskog poluostrva; zajedno sa Pirinejima čine planinski deo severne granice.", "slika": "02-juzna-evropa/01-fizicka-karta-juzne-evrope.jpg"}}, {"id": "polozaj-izbor-granica", "vrsta": "izbor", "tezina": "tesko", "pojmovi": ["pirineji", "alpi", "sava", "dunav"], "pitanje": "Šta od navedenog čini severnu granicu Južne Evrope? (Više tačnih.)", "odgovori": [{"tekst": "Pirineji", "tacan": true}, {"tekst": "Alpi", "tacan": true}, {"tekst": "reka Sava", "tacan": true}, {"tekst": "donji tok Dunava", "tacan": true}, {"tekst": "gornji tok Dunava", "tacan": false}, {"tekst": "reka Drava", "tacan": false}, {"tekst": "Apenini", "tacan": false}], "pomoc": ["Granica odvaja poluostrva od ostatka Evrope — planine koje su UNUTAR nekog poluostrva nisu granica.", "Tačna su četiri odgovora; od Dunava samo jedan deo toka, a od dve reke u Hrvatskoj samo jedna.", "Iz lekcije: Pirineji, Alpi, reka Sava i donji tok Dunava."], "objasnjenje": "Granicu čine Pirineji, Alpi, Sava i donji tok Dunava. Apenini su unutar Apeninskog poluostrva, Drava nije granica, a gornji tok Dunava je u Srednjoj Evropi.", "iz_udzbenika": {"strana": 14, "odeljak": "Položaj i granice regije", "tekst": "Severnu granicu čine Pirineji, Alpi, reka Sava i donji tok Dunava. Apenini se pružaju duž Apeninskog poluostrva, pa nisu granica regije.", "slika": "02-juzna-evropa/01-fizicka-karta-juzne-evrope.jpg"}}, {"id": "polozaj-dopuni-granica", "vrsta": "dopuni", "tezina": "tesko", "pojmovi": ["pirineji", "alpi", "sava", "dunav"], "pitanje": "Dopuni rečenicu (bez ponuđenih reči).", "tekst": "Na severu granicu Južne Evrope čine planine {{Pirineji}} i {{Alpi}}, zatim reka {{Sava}} i donji tok reke {{Dunav|Dunava}}.", "pomoc": ["Granica počinje planinama između Španije i Francuske, nastavlja se planinama iznad Italije.", "Na istoku se granica nastavlja rekama — prva protiče kroz Zagreb, a uliva se u drugu u Beogradu.", "Iz lekcije: Pirineji, Alpi, reka Sava i donji tok Dunava."], "objasnjenje": "Pirineji i Alpi čine planinski, a Sava i donji tok Dunava rečni deo severne granice.", "iz_udzbenika": {"strana": 14, "odeljak": "Položaj i granice regije", "tekst": "Na severu granicu čine Pirineji, Alpi, reka Sava i donji tok Dunava; na jugu je Sredozemno more.", "slika": "02-juzna-evropa/01-fizicka-karta-juzne-evrope.jpg"}}, {"id": "polozaj-povezi-planine", "vrsta": "povezi", "tezina": "srednje", "pojmovi": ["pirineji", "alpi", "apenini", "balkanske-planine"], "pitanje": "Poveži planinski lanac sa mestom gde se nalazi.", "parovi": [["Pirineji", "između Španije i Francuske"], ["Alpi", "severno od Apeninskog poluostrva"], ["Apenini", "duž celog Apeninskog poluostrva"], ["Balkanske planine", "u Bugarskoj i na istoku Srbije"]], "pomoc": ["Naziv planina često odgovara nazivu poluostrva.", "Jedan lanac je „kičma” Italije, a drugi je severno od nje, kao luk.", "Iz lekcije: na nemoj karti označavaju se Pirineji, Apenini i Balkanske planine; Alpi su deo granice."], "objasnjenje": "Pirineji — Španija/Francuska; Alpi — severno od Italije; Apenini — duž Apeninskog poluostrva; Balkanske (Stara) planine — Bugarska i istok Srbije.", "iz_udzbenika": {"strana": 14, "odeljak": "Zadatak — nema fizička karta", "tekst": "Na nemoj fizičkoj karti brojevima se označavaju tri poluostrva i tri planinska lanca — Pirineji, Apenini i Balkanske planine — a imenuju se i objekti koji čine granicu regije.", "slika": "02-juzna-evropa/01-fizicka-karta-juzne-evrope.jpg"}}, {"id": "polozaj-tn-mora", "vrsta": "tacno_netacno", "tezina": "lako", "pojmovi": ["sredozemno-more", "crno-more", "atlantski-okean"], "tvrdnja": "Južna Evropa izlazi samo na Sredozemno more.", "tacno": false, "ispravke": [{"tekst": "Izlazi na Sredozemno more, Crno more i Atlantski okean.", "tacan": true}, {"tekst": "Izlazi samo na Atlantski okean.", "tacan": false}, {"tekst": "Izlazi na Sredozemno more i Severno more.", "tacan": false}], "pomoc": ["Pogledaj obe krajnje tačke regije — Portugaliju na zapadu i Bugarsku na istoku.", "Na zapadu je okean, a na istoku jedno more koje nije deo Sredozemlja.", "Iz lekcije: regija izlazi na tri vodene celine."], "objasnjenje": "Netačno — Južna Evropa izlazi na Sredozemno more, Crno more (Bugarska) i Atlantski okean (Portugalija, Španija).", "iz_udzbenika": {"strana": 14, "odeljak": "Položaj i granice regije", "tekst": "Regija izlazi na tri vodene celine: Sredozemno more, Crno more i Atlantski okean. Zbog toga su ovde razvijeni ribolov, brodogradnja i pomorski saobraćaj.", "slika": "02-juzna-evropa/01-fizicka-karta-juzne-evrope.jpg"}}, {"id": "polozaj-izbor-vodene-celine", "vrsta": "izbor", "tezina": "lako", "pojmovi": ["sredozemno-more", "crno-more", "atlantski-okean"], "pitanje": "Na koje vodene celine izlazi Južna Evropa? (Više tačnih.)", "odgovori": [{"tekst": "Sredozemno more", "tacan": true}, {"tekst": "Crno more", "tacan": true}, {"tekst": "Atlantski okean", "tacan": true}, {"tekst": "Baltičko more", "tacan": false}, {"tekst": "Tihi okean", "tacan": false}], "pomoc": ["Traži mora i okean koji okružuju jug Evrope — ne sever.", "Tačne su tri vodene celine; jedna je okean na zapadu.", "Iz lekcije: regija izlazi na Sredozemno more, Crno more i Atlantski okean."], "objasnjenje": "Sredozemno more, Crno more i Atlantski okean. Baltičko more je na severu Evrope, a Tihi okean je daleko od Evrope.", "iz_udzbenika": {"strana": 14, "odeljak": "Položaj i granice regije", "tekst": "Regija izlazi na tri vodene celine — Sredozemno more, Crno more i Atlantski okean.", "slika": "02-juzna-evropa/01-fizicka-karta-juzne-evrope.jpg"}}, {"id": "polozaj-zakljuci-ime", "vrsta": "zakljuci", "tezina": "lako", "pojmovi": ["juzna-evropa", "sredozemno-more"], "pitanje": "Zašto se ova regija zove baš „Južna Evropa”?", "odgovori": [{"tekst": "Zauzima južni deo kontinenta, uz Sredozemno more.", "tacan": true}, {"tekst": "Zato što su u njoj sve reke okrenute ka jugu.", "tacan": false}, {"tekst": "Zato što je u njoj uvek leto.", "tacan": false}, {"tekst": "Zato što je najmanja regija Evrope.", "tacan": false}], "pomoc": ["Korak 1: Pogledaj na karti Evrope gde se nalaze tri poluostrva — na severu ili na jugu kontinenta?", "Korak 2: Šta je južno od njih — kopno ili more?", "Iz lekcije: regiju čine tri južna poluostrva, a na jugu je ograničava Sredozemno more."], "objasnjenje": "Regija zauzima južni deo Evrope — tri poluostrva koja zalaze u Sredozemno more.", "iz_udzbenika": {"strana": 14, "odeljak": "Položaj i granice regije", "tekst": "Tri poluostrva regije zalaze u Sredozemno more, koje je južna granica Južne Evrope.", "slika": "02-juzna-evropa/01-fizicka-karta-juzne-evrope.jpg"}}, {"id": "polozaj-zakljuci-dunav", "vrsta": "zakljuci", "tezina": "srednje", "pojmovi": ["dunav", "bugarska", "crno-more"], "pitanje": "Na nemoj karti tražiš granicu Južne Evrope između Beograda i Crnog mora. Šta treba da pratiš?", "odgovori": [{"tekst": "Donji tok Dunava, koji teče ka Crnom moru.", "tacan": true}, {"tekst": "Greben Alpa.", "tacan": false}, {"tekst": "Obalu Jadranskog mora.", "tacan": false}, {"tekst": "Greben Pirineja.", "tacan": false}], "pomoc": ["Korak 1: Koje su planine na zapadu granice, a šta je na njenom istoku — planine ili reke?", "Korak 2: Koja reka protiče kroz Beograd i uliva se u Crno more?", "Iz lekcije: istočni deo severne granice čine Sava i donji tok Dunava."], "objasnjenje": "Istočno od Beograda granica prati donji tok Dunava sve do Crnog mora; Alpi i Pirineji su na zapadu, a Jadran je na jugu.", "iz_udzbenika": {"strana": 14, "odeljak": "Položaj i granice regije", "tekst": "Zapadni deo severne granice je planinski (Pirineji, Alpi), a istočni rečni — Sava i donji tok Dunava, koji se uliva u Crno more.", "slika": "02-juzna-evropa/01-fizicka-karta-juzne-evrope.jpg"}}, {"id": "polozaj-klik-najveca", "vrsta": "karta_klik", "tezina": "lako", "pojmovi": ["spanija"], "pitanje": "Klikni na kartu — najveća država Južne Evrope po površini.", "cilj": {"drzava": "ESP"}, "pomoc": ["Najveća je država na najzapadnijem poluostrvu regije.", "Deli to poluostrvo sa jednom manjom državom na obali Atlantika.", "Iz lekcije: najveća je Španija, a najmanja Vatikan."], "objasnjenje": "Španija je najveća država Južne Evrope; zauzima najveći deo Pirinejskog poluostrva.", "iz_udzbenika": {"strana": 16, "odeljak": "Politička podela", "tekst": "Južnu Evropu politički čini 17 država. Najveća po površini je Španija, a najmanja Vatikan. Pet država su minijaturne: Andora, Vatikan, Monako, Malta i San Marino.", "slika": "02-juzna-evropa/10-politicka-karta-juzne-evrope.jpg"}}, {"id": "polozaj-klik-italija", "vrsta": "karta_klik", "tezina": "lako", "pojmovi": ["italija", "apeninsko-poluostrvo"], "pitanje": "Klikni na državu koja zauzima skoro celo Apeninsko poluostrvo.", "cilj": {"drzava": "ITA"}, "pomoc": ["Apeninsko poluostrvo je u sredini Sredozemnog mora.", "Poluostrvo ima oblik čizme.", "Klikni na „čizmu” — Italiju."], "objasnjenje": "Italija zauzima skoro celo Apeninsko poluostrvo; na njemu su još samo Vatikan i San Marino.", "iz_udzbenika": {"strana": 17, "odeljak": "Zadatak — tabela i nema karta", "tekst": "Na Apeninskom poluostrvu je Italija, a unutar nje dve minijaturne države — Vatikan i San Marino.", "slika": "10-italija/05-fizicka-karta-italije.jpg"}}, {"id": "polozaj-klik-grcka", "vrsta": "karta_klik", "tezina": "lako", "pojmovi": ["grcka", "balkansko-poluostrvo"], "pitanje": "Klikni na državu na krajnjem jugu Balkanskog poluostrva.", "cilj": {"drzava": "GRC"}, "pomoc": ["Balkansko poluostrvo je na istoku regije.", "Traži državu sa mnogo ostrva u Egejskom i Jonskom moru.", "Klikni na Grčku — najjužniju državu Balkana."], "objasnjenje": "Grčka je na krajnjem jugu Balkanskog poluostrva, sa mnogo ostrva; glavni grad je Atina.", "iz_udzbenika": {"strana": 14, "odeljak": "Kulturna obeležja — istorija", "tekst": "Grčka je na jugu Balkanskog poluostrva; tu je bila kolevka antičke grčke civilizacije, a simbol joj je Partenon u Atini.", "slika": "02-juzna-evropa/02-partenon.jpg"}}, {"id": "polozaj-klik-pirineji", "vrsta": "karta_klik", "tezina": "srednje", "pojmovi": ["pirineji", "pirinejsko-poluostrvo"], "pitanje": "Klikni na planinski lanac koji odvaja Pirinejsko poluostrvo od ostatka Evrope.", "cilj": {"mesto": "pirineji"}, "pomoc": ["Ove planine su na severu Pirinejskog poluostrva.", "Pružaju se od Atlantskog okeana do Sredozemnog mora, na granici Španije i Francuske.", "Klikni na granicu Španije i Francuske — tu su Pirineji (i mala Andora)."], "objasnjenje": "Pirineji se pružaju između Španije i Francuske i čine zapadni deo severne granice regije.", "iz_udzbenika": {"strana": 14, "odeljak": "Položaj i granice regije", "tekst": "Pirineji su planine na granici Španije i Francuske; čine deo severne granice Južne Evrope, a u njima je minijaturna Andora.", "slika": "11-spanija/02-fizicka-karta-spanije.jpg"}}, {"id": "polozaj-gde-spanija", "vrsta": "gde_sam", "tezina": "lako", "pojmovi": ["spanija", "pirinejsko-poluostrvo"], "pitanje": "Gde sam? Pročitaj trag i klikni državu na karti.", "cilj": {"drzava": "ESP"}, "tragovi": ["Moja dva najveća grada su glavni grad u sredini zemlje i Barselona na sredozemnoj obali.", "Na mom severu žive Baski.", "Izlazim i na Atlantski okean i na Sredozemno more.", "Ja sam najveća država Južne Evrope i zauzimam najveći deo Pirinejskog poluostrva."], "objasnjenje": "Španija — najveća država regije, na Pirinejskom poluostrvu; glavni grad je Madrid.", "iz_udzbenika": {"strana": 16, "odeljak": "Politička podela", "tekst": "Španija je najveća država Južne Evrope. Leži na Pirinejskom poluostrvu, a među najvećim gradovima regije su njen glavni grad Madrid i Barselona.", "slika": "02-juzna-evropa/04-madrid.jpg"}}]}, {"naslov": "Istorija i kultura", "zadaci": [{"id": "istorija-civilizacije", "vrsta": "izbor", "tezina": "lako", "pojmovi": ["anticka-grcka", "anticki-grci", "rimljani", "vizantinci"], "pitanje": "Koje su civilizacije imale najveći uticaj na Južnu Evropu? (Više tačnih.)", "odgovori": [{"tekst": "antički Grci", "tacan": true}, {"tekst": "Rimljani", "tacan": true}, {"tekst": "Vizantinci", "tacan": true}, {"tekst": "Vikinzi", "tacan": false}, {"tekst": "Asteci", "tacan": false}], "pomoc": ["Traži civilizacije koje su nastale oko Sredozemnog mora.", "Jedna od ponuđenih je sa severa Evrope, a jedna iz Amerike.", "Iz lekcije: oni su podigli neke od današnjih najvećih gradova regije — Rim i Atinu."], "objasnjenje": "Najveći uticaj imali su antički Grci, Rimljani i Vizantinci.", "iz_udzbenika": {"strana": 15, "odeljak": "Kulturna obeležja — istorija", "tekst": "Zbog povoljnog položaja Južna Evropa je od praistorije kolevka mnogih kultura. Najveći trag ostavili su antički Grci, Rimljani i Vizantinci; oni su podigli neke od najvećih današnjih gradova regije — Rim i Atinu.", "slika": "02-juzna-evropa/02-partenon.jpg"}}, {"id": "istorija-tn-kolevka", "vrsta": "tacno_netacno", "tezina": "lako", "pojmovi": ["juzna-evropa"], "tvrdnja": "Zbog povoljnog položaja Južna Evropa je još od praistorije kolevka mnogih kultura i civilizacija.", "tacno": true, "pomoc": ["Setimo se koliko je starih civilizacija nastalo oko Sredozemnog mora.", "Grci, Rimljani i Vizantinci su samo najpoznatiji primeri.", "Iz lekcije: povoljan fizičko-geografski položaj učinio je regiju kolevkom mnogih kultura."], "objasnjenje": "Tačno — povoljan položaj (more, blaga klima, veza tri kontinenta) učinio je Južnu Evropu kolevkom mnogih kultura još od praistorije.", "iz_udzbenika": {"strana": 15, "odeljak": "Kulturna obeležja — istorija", "tekst": "Zahvaljujući povoljnom fizičko-geografskom položaju, Južna Evropa je od praistorije kolevka mnogih kultura i civilizacija."}}, {"id": "istorija-izbor-gradovi", "vrsta": "izbor", "tezina": "lako", "pojmovi": ["rim", "atina", "rimljani", "anticki-grci"], "pitanje": "Koja dva današnja velika grada Južne Evrope su podigle antičke civilizacije?", "odgovori": [{"tekst": "Rim i Atina", "tacan": true}, {"tekst": "Pariz i London", "tacan": false}, {"tekst": "Berlin i Beč", "tacan": false}, {"tekst": "Moskva i Kijev", "tacan": false}], "pomoc": ["Traži gradove koji su u Južnoj Evropi.", "Jedan grad je glavni grad Italije, a drugi glavni grad Grčke.", "Iz lekcije: Grci, Rimljani i Vizantinci podigli su neke od najvećih gradova regije."], "objasnjenje": "Rim i Atina — oba su danas glavni gradovi (Italije i Grčke). Ostali ponuđeni gradovi nisu u Južnoj Evropi.", "iz_udzbenika": {"strana": 15, "odeljak": "Kulturna obeležja — istorija", "tekst": "Antički Grci, Rimljani i Vizantinci podigli su neke od današnjih najvećih gradova regije, među njima Rim i Atinu.", "slika": "02-juzna-evropa/02-partenon.jpg"}}, {"id": "istorija-izbor-partenon", "vrsta": "izbor", "tezina": "lako", "pojmovi": ["partenon", "atina", "anticka-grcka"], "pitanje": "Partenon na fotografiji u udžbeniku je antički hram. Kome je bio posvećen?", "odgovori": [{"tekst": "boginji Atini, zaštitnici grada Atine", "tacan": true}, {"tekst": "jednom rimskom caru", "tacan": false}, {"tekst": "egipatskom faraonu", "tacan": false}, {"tekst": "vizantijskom caru", "tacan": false}], "pomoc": ["Hram se nalazi u gradu koji nosi ime iste boginje.", "To je grčka boginja, a ne vladar.", "Iz lekcije: Partenon je hram boginje Atine, zaštitnice grada."], "objasnjenje": "Partenon je hram boginje Atine, zaštitnice grada Atine — simbol antičke grčke civilizacije.", "iz_udzbenika": {"strana": 14, "odeljak": "Zanimljivosti", "tekst": "Partenon je antički hram na atinskom Akropolju, posvećen boginji Atini, zaštitnici grada. Simbol je antičke grčke civilizacije.", "slika": "02-juzna-evropa/02-partenon.jpg"}}, {"id": "istorija-zakljuci-partenon", "vrsta": "zakljuci", "tezina": "lako", "pojmovi": ["partenon", "kraljica-turizma"], "pitanje": "Zašto Partenon svake godine poseti veliki broj turista?", "odgovori": [{"tekst": "Zato što je deo bogatog kulturno-istorijskog nasleđa antičke Grčke.", "tacan": true}, {"tekst": "Zato što je to najnovija zgrada u Atini.", "tacan": false}, {"tekst": "Zato što se tamo nalazi plaža.", "tacan": false}, {"tekst": "Zato što je to najveći tržni centar u Grčkoj.", "tacan": false}], "pomoc": ["Korak 1: Koliko je star Partenon i kojoj civilizaciji pripada?", "Korak 2: Koji od tri razloga za razvoj turizma (klima, more, nasleđe) se odnosi na stare građevine?", "Iz lekcije: turizam se razvio i zbog kulturno-istorijskog nasleđa."], "objasnjenje": "Partenon je spomenik antičke Grčke; kulturno-istorijsko nasleđe je jedan od glavnih razloga razvoja turizma u regiji.", "iz_udzbenika": {"strana": 16, "odeljak": "Privreda — turizam", "tekst": "Pored klime i mora, turiste privlači i kulturno-istorijsko nasleđe — spomenici poput Partenona u Atini.", "slika": "02-juzna-evropa/02-partenon.jpg"}}, {"id": "istorija-tn-stari-svet", "vrsta": "tacno_netacno", "tezina": "lako", "pojmovi": ["velika-geografska-otkrica"], "tvrdnja": "Sve do velikih geografskih otkrića Južna Evropa je imala vodeću privrednu i kulturnu ulogu u Starom svetu.", "tacno": true, "pomoc": ["Setimo se gde su bile najrazvijenije države pre plovidbe u Ameriku.", "Sredozemlje je dugo bilo središte trgovine i kulture.", "Iz lekcije: do velikih otkrića region, naročito sredozemni deo, bio je vodeći u Starom svetu."], "objasnjenje": "Tačno — do velikih geografskih otkrića sredozemni deo Evrope vodio je privredu i kulturu Starog sveta.", "iz_udzbenika": {"strana": 15, "odeljak": "Kulturna obeležja — istorija", "tekst": "Sve do velikih geografskih otkrića Južna Evropa, naročito njen sredozemni deo, imala je vodeću privrednu i kulturnu ulogu u Starom svetu."}}, {"id": "istorija-tn-grcka", "vrsta": "tacno_netacno", "tezina": "srednje", "pojmovi": ["anticka-grcka", "mikenska-civilizacija"], "tvrdnja": "Antička grčka civilizacija trajala je od VIII veka p. n. e. do 146. godine p. n. e., kada ju je osvojila Rimska republika.", "tacno": true, "pomoc": ["Setimo se ko je posle Grka zavladao Sredozemljem.", "Grčku je osvojila država sa Apeninskog poluostrva.", "Iz lekcije: posle mikenske civilizacije razvila se antička Grčka, koju je 146. p. n. e. osvojila Rimska republika."], "objasnjenje": "Tačno — antička Grčka (VIII v. p. n. e. – 146. p. n. e.) završava se rimskim osvajanjem.", "iz_udzbenika": {"strana": 15, "odeljak": "Zanimljivosti", "tekst": "Posle propasti mikenske civilizacije na jugu Balkana, antička grčka civilizacija razvila se i u Maloj Aziji i na obalama Crnog mora. Trajala je od VIII veka p. n. e. do 146. p. n. e., kada ju je osvojila Rimska republika. Partenon je hram boginje Atine, zaštitnice grada.", "slika": "02-juzna-evropa/02-partenon.jpg"}}, {"id": "istorija-tn-mikenska", "vrsta": "tacno_netacno", "tezina": "srednje", "pojmovi": ["mikenska-civilizacija", "anticka-grcka"], "tvrdnja": "Mikenska civilizacija razvila se tek posle propasti antičke grčke civilizacije.", "tacno": false, "ispravke": [{"tekst": "Obrnuto — antička grčka civilizacija razvila se posle propasti mikenske.", "tacan": true}, {"tekst": "Mikenska civilizacija nastala je u Americi.", "tacan": false}, {"tekst": "Mikensku civilizaciju su osnovali Vizantinci.", "tacan": false}], "pomoc": ["Pazi na redosled — koja je civilizacija starija?", "Antička Grčka počinje u VIII veku p. n. e.; mikenska je bila pre toga.", "Iz lekcije: posle propasti mikenske civilizacije razvila se antička grčka."], "objasnjenje": "Netačno — mikenska civilizacija na jugu Balkana bila je starija; posle njene propasti razvila se antička grčka civilizacija.", "iz_udzbenika": {"strana": 15, "odeljak": "Zanimljivosti", "tekst": "Posle propasti mikenske civilizacije na jugu Balkanskog poluostrva razvila se antička grčka civilizacija."}}, {"id": "istorija-izbor-mala-azija", "vrsta": "izbor", "tezina": "srednje", "pojmovi": ["anticka-grcka", "mala-azija", "crno-more"], "pitanje": "Gde se, osim na jugu Balkana, širila antička grčka civilizacija? (Više tačnih.)", "odgovori": [{"tekst": "u Maloj Aziji", "tacan": true}, {"tekst": "na obalama Crnog mora", "tacan": true}, {"tekst": "na Skandinavskom poluostrvu", "tacan": false}, {"tekst": "u Južnoj Americi", "tacan": false}], "pomoc": ["Grci su bili moreplovci — traži obale blizu Egejskog mora.", "Jedno je poluostrvo istočno od Egejskog mora (današnja Turska), a drugo more severoistočno od Grčke.", "Iz lekcije: antička grčka civilizacija razvila se u Maloj Aziji i na obalama Crnog mora."], "objasnjenje": "U Maloj Aziji (azijski deo Turske) i na obalama Crnog mora. Južna Amerika tada još nije bila poznata Evropljanima.", "iz_udzbenika": {"strana": 15, "odeljak": "Zanimljivosti", "tekst": "Antička grčka civilizacija razvila se na jugu Balkana, ali i u Maloj Aziji i na obalama Crnog mora."}}, {"id": "istorija-dopuni-grcka", "vrsta": "dopuni", "tezina": "tesko", "pojmovi": ["anticka-grcka", "rimljani"], "pitanje": "Dopuni rečenicu (bez ponuđenih reči).", "tekst": "Antička grčka civilizacija trajala je od {{VIII|8}}. veka p. n. e. do {{146}}. godine p. n. e., kada ju je osvojila {{Rimska republika|Rimska Republika|Rim|rimska republika}}.", "pomoc": ["Početak je u veku označenom rimskim brojem između VII i IX.", "Kraj je sredinom II veka p. n. e.; osvajač je država sa Apeninskog poluostrva.", "Iz lekcije: od VIII veka p. n. e. do 146. p. n. e., kada ju je osvojila Rimska republika."], "objasnjenje": "Antička Grčka — od VIII veka p. n. e. do 146. godine p. n. e.; tada ju je osvojila Rimska republika.", "iz_udzbenika": {"strana": 15, "odeljak": "Zanimljivosti", "tekst": "Antička grčka civilizacija trajala je od VIII veka p. n. e. do 146. godine p. n. e., kada ju je osvojila Rimska republika.", "slika": "02-juzna-evropa/02-partenon.jpg"}}, {"id": "istorija-zakljuci-amerika", "vrsta": "zakljuci", "tezina": "srednje", "pojmovi": ["velika-geografska-otkrica", "novi-svet", "atlantski-okean"], "pitanje": "Posle otkrića Amerike značaj Južne Evrope u trgovini je opao. Zašto?", "odgovori": [{"tekst": "Pomorstvo i trgovina preselili su se sa Sredozemnog mora na Atlantski okean.", "tacan": true}, {"tekst": "Sredozemno more se tada zaledilo i postalo neplovno.", "tacan": false}, {"tekst": "Stanovnici Južne Evrope prestali su da se bave pomorstvom zbog verskih razloga.", "tacan": false}, {"tekst": "Gradovi Južne Evrope su tada napušteni.", "tacan": false}], "pomoc": ["Korak 1: Gde se nalazi Amerika u odnosu na Evropu — preko kog mora ili okeana se do nje stiže?", "Korak 2: Ako se brodovi upute preko okeana, koje luke postaju najvažnije — sredozemne ili one na okeanu?", "Iz lekcije: radi istraživanja i osvajanja novih kontinenata, pomorstvo se premešta na Atlantik."], "objasnjenje": "Novi putevi su vodili preko Atlantskog okeana, pa su vodeću ulogu preuzele zemlje i luke na okeanu, a Sredozemlje je postalo sporedni put.", "iz_udzbenika": {"strana": 15, "odeljak": "Kulturna obeležja — istorija", "tekst": "Sve do velikih geografskih otkrića sredozemni deo Evrope vodio je privredu i kulturu Starog sveta. Kada je otkriveno američko kopno, pomorstvo se premestilo sa Sredozemnog mora na Atlantski okean, pa je značaj regije u saobraćaju i privredi opao."}}, {"id": "istorija-izbor-novi-svet", "vrsta": "izbor", "tezina": "srednje", "pojmovi": ["novi-svet", "velika-geografska-otkrica"], "pitanje": "Koji kontinenti spadaju u Novi svet? (Više tačnih.)", "odgovori": [{"tekst": "Severna Amerika", "tacan": true}, {"tekst": "Južna Amerika", "tacan": true}, {"tekst": "Australija", "tacan": true}, {"tekst": "Antarktik", "tacan": true}, {"tekst": "Afrika", "tacan": false}, {"tekst": "Azija", "tacan": false}], "pomoc": ["Novi svet su kontinenti za koje Evropljani nisu znali pre velikih geografskih otkrića.", "Tačna su četiri kontinenta; Afrika i Azija su bile poznate još u antičko doba.", "Iz lekcije: Novi svet čine Severna i Južna Amerika, Australija i Antarktik."], "objasnjenje": "Novi svet — Severna i Južna Amerika, Australija i Antarktik. Evropa, Azija i Afrika čine Stari svet.", "iz_udzbenika": {"strana": 15, "odeljak": "Kulturna obeležja — istorija", "tekst": "Novi svet je zajednički naziv za kontinente otkrivene u doba velikih geografskih otkrića — Severnu i Južnu Ameriku, Australiju i Antarktik."}}, {"id": "istorija-tn-novi-svet", "vrsta": "tacno_netacno", "tezina": "tesko", "pojmovi": ["novi-svet", "velika-geografska-otkrica"], "tvrdnja": "Afrika spada u Novi svet, jer su Evropljani u doba velikih geografskih otkrića oplovili njene obale.", "tacno": false, "ispravke": [{"tekst": "Afrika je deo Starog sveta; Novi svet čine Severna i Južna Amerika, Australija i Antarktik.", "tacan": true}, {"tekst": "Afrika i Azija zajedno čine Novi svet.", "tacan": false}, {"tekst": "Novi svet je samo Severna Amerika.", "tacan": false}], "pomoc": ["Novi svet su kontinenti za koje Evropljani ranije uopšte nisu znali — a ne oni čije su obale samo bolje upoznali.", "Afrika je preko Sredozemnog mora vekovima bila u vezi sa Južnom Evropom.", "Iz lekcije: Novi svet su kontinenti otkriveni u doba velikih geografskih otkrića."], "objasnjenje": "Netačno — Afriku su Evropljani poznavali od antike (Stari svet). Novi svet su Severna i Južna Amerika, Australija i Antarktik.", "iz_udzbenika": {"strana": 15, "odeljak": "Kulturna obeležja — istorija", "tekst": "Novi svet je naziv za kontinente otkrivene u doba velikih geografskih otkrića — Severnu i Južnu Ameriku, Australiju i Antarktik; Evropa, Azija i Afrika čine Stari svet."}}, {"id": "istorija-izbor-suec-okean", "vrsta": "izbor", "tezina": "lako", "pojmovi": ["suecki-kanal"], "pitanje": "Izgradnjom Sueckog kanala Evropa je dobila izlaz na koji okean?", "odgovori": [{"tekst": "Indijski okean", "tacan": true}, {"tekst": "Tihi okean", "tacan": false}, {"tekst": "Severni ledeni okean", "tacan": false}], "pomoc": ["Kanal je otvorio put ka Indiji i Dalekom istoku.", "Okean nosi ime po zemlji ka kojoj su brodovi plovili.", "Iz lekcije: kanalom Evropa dobija izlaz na Indijski okean."], "objasnjenje": "Suecki kanal je Evropi otvorio kraći put na Indijski okean — do Indije i Dalekog istoka.", "iz_udzbenika": {"strana": 15, "odeljak": "Kulturna obeležja — istorija", "tekst": "Izgradnjom Sueckog kanala Evropa je dobila izlaz na Indijski okean i vezu sa Indijom i Dalekim istokom."}}, {"id": "istorija-dopuni-suec", "vrsta": "dopuni", "tezina": "srednje", "pojmovi": ["suecki-kanal", "sredozemno-more"], "pitanje": "Dopuni rečenicu (rad sa atlasom).", "tekst": "Suecki kanal, u Egiptu, spaja {{Sredozemno}} more i {{Crveno}} more.", "ponudjene": ["Sredozemno", "Crveno", "Crno", "Kaspijsko", "Jadransko"], "pomoc": ["Kanal je u Egiptu, između Afrike i Azije.", "Jedno more je na severu kanala i oplakuje Južnu Evropu, a drugo nosi ime po boji i vodi ka Indijskom okeanu.", "Iz lekcije: u atlasu se vidi da kanal spaja Sredozemno i Crveno more."], "objasnjenje": "Suecki kanal spaja Sredozemno i Crveno more, a preko Crvenog mora brodovi stižu u Indijski okean.", "iz_udzbenika": {"strana": 15, "odeljak": "Kulturna obeležja — istorija", "tekst": "U tekstu se uz pomoć atlasa proverava koja mora povezuje Suecki kanal — to su Sredozemno i Crveno more."}}, {"id": "istorija-zakljuci-suec", "vrsta": "zakljuci", "tezina": "tesko", "pojmovi": ["suecki-kanal", "sredozemno-more"], "pitanje": "Izgradnja Sueckog kanala ponovo je povećala značaj Južne Evrope. Kako?", "odgovori": [{"tekst": "Brodovi iz Evrope ka Indiji i Dalekom istoku sada idu kroz Sredozemno more, pa sredozemne luke ponovo leže na glavnom putu.", "tacan": true}, {"tekst": "Kanal je spojio Sredozemno more sa Atlantskim okeanom.", "tacan": false}, {"tekst": "Kanalom je Južna Evropa dobila vezu sa Amerikom.", "tacan": false}, {"tekst": "Kanal je skratio put između Španije i Grčke.", "tacan": false}], "pomoc": ["Korak 1: Koja dva mora povezuje Suecki kanal? (Pogledaj u atlasu — Egipat.)", "Korak 2: Kojim putem su brodovi išli u Indiju pre kanala — i koliko je on bio duži?", "Iz lekcije: kanalom Evropa dobija izlaz na Indijski okean i vezu sa Indijom i Dalekim istokom."], "objasnjenje": "Kanal spaja Sredozemno i Crveno more; put ka Indiji više ne ide oko Afrike, već kroz Sredozemlje — pored luka Južne Evrope.", "iz_udzbenika": {"strana": 15, "odeljak": "Kulturna obeležja — istorija", "tekst": "Izgradnjom Sueckog kanala Evropa je dobila izlaz na Indijski okean i vezu sa Indijom i Dalekim istokom kroz Sredozemno more, pa je privredni značaj regije ponovo porastao. Kanal spaja Sredozemno i Crveno more (proveri u atlasu)."}}, {"id": "istorija-povezi-pojmovi", "vrsta": "povezi", "tezina": "lako", "pojmovi": ["partenon", "suecki-kanal", "novi-svet"], "pitanje": "Poveži pojam sa njegovim objašnjenjem.", "parovi": [["Partenon", "hram boginje Atine u Atini"], ["Suecki kanal", "veza Sredozemnog i Crvenog mora"], ["Novi svet", "kontinenti otkriveni u doba velikih otkrića"]], "pomoc": ["Jedan pojam je građevina, jedan je plovni put, a jedan je naziv za grupu kontinenata.", "Kanal je delo ljudi i spaja dva mora.", "Iz lekcije: Partenon — hram u Atini; Suecki kanal — Sredozemno i Crveno more; Novi svet — Amerike, Australija, Antarktik."], "objasnjenje": "Partenon — hram boginje Atine; Suecki kanal — spaja Sredozemno i Crveno more; Novi svet — kontinenti otkriveni u doba velikih geografskih otkrića.", "iz_udzbenika": {"strana": 15, "odeljak": "Kulturna obeležja — istorija", "tekst": "U lekciji se pominju Partenon (hram boginje Atine), Suecki kanal (spaja Sredozemno i Crveno more) i Novi svet (kontinenti otkriveni u doba velikih geografskih otkrića).", "slika": "02-juzna-evropa/02-partenon.jpg"}}, {"id": "istorija-povezi-dogadjaji", "vrsta": "povezi", "tezina": "srednje", "pojmovi": ["mikenska-civilizacija", "anticka-grcka", "velika-geografska-otkrica", "suecki-kanal"], "pitanje": "Poveži događaj sa njegovom posledicom.", "parovi": [["propast mikenske civilizacije", "razvoj antičke grčke civilizacije"], ["146. godina p. n. e.", "Rimska republika osvaja Grčku"], ["otkriće Amerike", "pomorstvo se seli na Atlantski okean"], ["izgradnja Sueckog kanala", "Evropa dobija vezu sa Indijom i Dalekim istokom"]], "pomoc": ["Poređaj događaje po vremenu — od najstarijeg do najnovijeg.", "Godina pre nove ere vezana je za kraj antičke Grčke; kanal je vezan za Indiju.", "Iz lekcije: posle mikenske — antička Grčka; 146. p. n. e. — Rim; Amerika — Atlantik; Suec — Indija."], "objasnjenje": "Mikenska → antička Grčka; 146. p. n. e. → rimsko osvajanje; otkriće Amerike → pomorstvo na Atlantiku; Suecki kanal → veza sa Indijom i Dalekim istokom.", "iz_udzbenika": {"strana": 15, "odeljak": "Kulturna obeležja — istorija", "tekst": "Značaj regije menjao se kroz istoriju — rastao je u antici, opao posle otkrića Amerike, kada se pomorstvo preselilo na Atlantik, i ponovo porastao izgradnjom Sueckog kanala."}}, {"id": "istorija-zakljuci-portugalija", "vrsta": "zakljuci", "tezina": "tesko", "pojmovi": ["velika-geografska-otkrica", "atlantski-okean", "portugalija"], "pitanje": "Posle otkrića Amerike, koja od ovih država Južne Evrope je imala najbolji položaj za plovidbu ka Novom svetu?", "odgovori": [{"tekst": "Portugalija, jer izlazi direktno na Atlantski okean.", "tacan": true}, {"tekst": "Grčka, jer ima najviše ostrva.", "tacan": false}, {"tekst": "Bugarska, jer izlazi na Crno more.", "tacan": false}, {"tekst": "Srbija, jer je na ušću Save u Dunav.", "tacan": false}], "pomoc": ["Korak 1: Preko kog okeana se iz Evrope stiže do Amerike?", "Korak 2: Koja od ponuđenih država izlazi baš na taj okean — a koje izlaze samo na unutrašnja mora ili nemaju more?", "Iz lekcije: posle otkrića Amerike pomorstvo se premešta sa Sredozemnog mora na Atlantski okean."], "objasnjenje": "Portugalija leži na obali Atlantika, pa je bila u najboljem položaju; Grčka i Bugarska su na unutrašnjim morima, a Srbija nema izlaz na more.", "iz_udzbenika": {"strana": 15, "odeljak": "Kulturna obeležja — istorija", "tekst": "Posle saznanja za američko kopno pomorstvo se premestilo sa Sredozemnog mora na Atlantski okean; prednost su dobile zemlje sa izlazom na okean."}}, {"id": "istorija-klik-rim", "vrsta": "karta_klik", "tezina": "srednje", "pojmovi": ["rim", "rimljani", "italija"], "pitanje": "Klikni na grad koji su podigli Rimljani i koji je danas glavni grad Italije.", "cilj": {"mesto": "rim"}, "pomoc": ["Grad je na Apeninskom poluostrvu, u njegovom srednjem delu.", "Leži blizu zapadne obale Italije, na reci Tibru.", "Klikni na Rim — u sredini zapadne strane „čizme”; u njemu je i Vatikan."], "objasnjenje": "Rim, na Tibru u srednjoj Italiji — glavni grad Italije; unutar njega je Vatikan.", "iz_udzbenika": {"strana": 15, "odeljak": "Kulturna obeležja — istorija", "tekst": "Rim su podigli Rimljani; danas je glavni grad Italije i jedan od najvećih gradova Južne Evrope.", "slika": "10-italija/05-fizicka-karta-italije.jpg"}}, {"id": "istorija-gde-atina", "vrsta": "gde_sam", "tezina": "srednje", "pojmovi": ["atina", "partenon", "grcka"], "pitanje": "Gde sam? Pročitaj trag i klikni mesto na karti.", "cilj": {"mesto": "atina"}, "tragovi": ["Moje ime nosi boginja zaštitnica grada.", "Iznad mene se uzdiže antički hram sa dorskim stubovima — Partenon.", "Podigli su me antički Grci, a danas sam glavni grad države na jugu Balkana.", "Ja sam glavni grad Grčke."], "objasnjenje": "Atina — glavni grad Grčke, sa Partenonom, hramom boginje Atine.", "iz_udzbenika": {"strana": 14, "odeljak": "Zanimljivosti", "tekst": "Atinu su podigli antički Grci; iznad grada je Partenon, hram boginje Atine, zaštitnice grada.", "slika": "02-juzna-evropa/02-partenon.jpg"}}]}, {"naslov": "Stanovništvo i vere", "zadaci": [{"id": "stanovnistvo-izbor-broj", "vrsta": "izbor", "tezina": "lako", "pojmovi": ["juzna-evropa"], "pitanje": "Koliko otprilike stanovnika živi u Južnoj Evropi?", "odgovori": [{"tekst": "oko 159 miliona", "tacan": true}, {"tekst": "oko 15 hiljada", "tacan": false}, {"tekst": "oko 1,5 milijardi", "tacan": false}, {"tekst": "oko 1 milion", "tacan": false}], "pomoc": ["Regija ima 17 država, među njima velike kao Italija i Španija — to je mnogo ljudi, ali manje od cele Evrope.", "Broj je između 150 i 160 miliona.", "Iz lekcije: u Južnoj Evropi živi oko 159 miliona stanovnika."], "objasnjenje": "U Južnoj Evropi živi oko 159 miliona ljudi; 1,5 milijardi je više od cele Evrope, a hiljade i jedan milion su premalo.", "iz_udzbenika": {"strana": 15, "odeljak": "Stanovništvo", "tekst": "Južna Evropa ima oko 159 miliona stanovnika, pretežno naroda indoevropske porodice."}}, {"id": "stanovnistvo-izbor-porodica", "vrsta": "izbor", "tezina": "lako", "pojmovi": ["indoevropska-porodica"], "pitanje": "Kojoj porodici naroda pripada većina stanovnika Južne Evrope?", "odgovori": [{"tekst": "indoevropskoj", "tacan": true}, {"tekst": "uralskoj", "tacan": false}, {"tekst": "kinesko-tibetskoj", "tacan": false}, {"tekst": "indijanskoj", "tacan": false}], "pomoc": ["Ova porodica obuhvata i Slovene i romanske narode.", "U nazivu su dva dela sveta — Indija i Evropa.", "Iz lekcije: stanovništvo pretežno pripada indoevropskoj porodici naroda."], "objasnjenje": "Većina pripada indoevropskoj porodici — i Južni Sloveni i romanski narodi su indoevropski.", "iz_udzbenika": {"strana": 15, "odeljak": "Stanovništvo", "tekst": "Oko 159 miliona stanovnika regije pretežno pripada narodima indoevropske porodice."}}, {"id": "stanovnistvo-tn-juzni-sloveni", "vrsta": "tacno_netacno", "tezina": "lako", "pojmovi": ["juzni-sloveni", "balkansko-poluostrvo"], "tvrdnja": "Na Balkanskom poluostrvu najbrojniji su Južni Sloveni.", "tacno": true, "pomoc": ["Setimo se ko živi u Srbiji, Hrvatskoj, Bugarskoj i Sloveniji.", "Ti narodi govore srodnim slovenskim jezicima.", "Iz lekcije: na Balkanskom poluostrvu najbrojniji su Južni Sloveni."], "objasnjenje": "Tačno — na Balkanu su najbrojniji Južni Sloveni (Srbi, Hrvati, Bugari, Slovenci, Makedonci i dr.).", "iz_udzbenika": {"strana": 15, "odeljak": "Stanovništvo", "tekst": "Na Balkanskom poluostrvu najbrojniji su Južni Sloveni, a na Apeninskom i Pirinejskom romanski narodi."}}, {"id": "stanovnistvo-tn-romani", "vrsta": "tacno_netacno", "tezina": "srednje", "pojmovi": ["romani", "apeninsko-poluostrvo", "pirinejsko-poluostrvo"], "tvrdnja": "Romanskih naroda najviše ima na Apeninskom i Balkanskom poluostrvu.", "tacno": false, "ispravke": [{"tekst": "Najviše ih ima na Apeninskom i Pirinejskom poluostrvu.", "tacan": true}, {"tekst": "Najviše ih ima samo na Balkanskom poluostrvu.", "tacan": false}, {"tekst": "U Južnoj Evropi nema romanskih naroda.", "tacan": false}], "pomoc": ["Romanski narodi govore jezicima nastalim iz latinskog — Italijani, Španci, Portugalci.", "Jedno poluostrvo je pogrešno — na njemu su najbrojniji Južni Sloveni.", "Iz lekcije: na Apeninskom i Pirinejskom poluostrvu najviše je romanskih naroda."], "objasnjenje": "Netačno — romanski narodi preovlađuju na Apeninskom i Pirinejskom poluostrvu; na Balkanu su najbrojniji Južni Sloveni.", "iz_udzbenika": {"strana": 15, "odeljak": "Stanovništvo", "tekst": "Na Apeninskom i Pirinejskom poluostrvu najviše je romanskih naroda, a na Balkanskom Južnih Slovena."}}, {"id": "stanovnistvo-povezi-narodi", "vrsta": "povezi", "tezina": "srednje", "pojmovi": ["juzni-sloveni", "romani", "baski", "semitski-narodi"], "pitanje": "Poveži deo Južne Evrope sa narodom ili grupom naroda koja tamo preovlađuje.", "parovi": [["Balkansko poluostrvo", "Južni Sloveni"], ["Apeninsko i Pirinejsko poluostrvo", "romanski narodi"], ["sever Španije", "Baski"], ["Malta", "semitski narod srodan Arapima"]], "pomoc": ["Italijani, Španci i Portugalci govore jezicima nastalim iz latinskog.", "Baski su izolovana grupa uz Biskajski zaliv; Maltežani nisu ni Sloveni ni Romani.", "Iz lekcije: na Balkanu su najbrojniji Južni Sloveni, na druga dva poluostrva romanski narodi."], "objasnjenje": "Balkan — Južni Sloveni; Apeninsko i Pirinejsko — romanski narodi; sever Španije — Baski; Malta — semitski narod (malteški jezik, afroazijska porodica).", "iz_udzbenika": {"strana": 15, "odeljak": "Stanovništvo", "tekst": "Na Balkanskom poluostrvu najbrojniji su Južni Sloveni, a na Apeninskom i Pirinejskom romanski narodi. Izolovane grupe su Albanci, Grci i Baski (sever Španije). Maltežani su semitski narod srodan Arapima; malteški jezik pripada afroazijskoj porodici."}}, {"id": "stanovnistvo-izbor-izolovani", "vrsta": "izbor", "tezina": "srednje", "pojmovi": ["albanci", "grci", "baski"], "pitanje": "Koje grupe naroda lekcija navodi kao izolovane? (Više tačnih.)", "odgovori": [{"tekst": "Albanci", "tacan": true}, {"tekst": "Grci", "tacan": true}, {"tekst": "Baski", "tacan": true}, {"tekst": "Srbi", "tacan": false}, {"tekst": "Italijani", "tacan": false}, {"tekst": "Španci", "tacan": false}], "pomoc": ["Izolovani narodi nisu ni Južni Sloveni ni romanski narodi.", "Tačna su tri — dva sa Balkana i jedan sa severa Španije.", "Iz lekcije: izolovane grupe naroda su Albanci, Grci i Baski."], "objasnjenje": "Albanci, Grci i Baski su izolovane grupe; Srbi su Južni Sloveni, a Italijani i Španci romanski narodi.", "iz_udzbenika": {"strana": 15, "odeljak": "Stanovništvo", "tekst": "Osim Južnih Slovena i romanskih naroda, u regiji žive i izolovane grupe naroda — Albanci, Grci i Baski."}}, {"id": "stanovnistvo-izbor-baski", "vrsta": "izbor", "tezina": "srednje", "pojmovi": ["baski", "spanija"], "pitanje": "Gde žive Baski?", "odgovori": [{"tekst": "na severu Španije", "tacan": true}, {"tekst": "na jugu Italije", "tacan": false}, {"tekst": "na ostrvu Malti", "tacan": false}, {"tekst": "u Albaniji", "tacan": false}], "pomoc": ["Baski žive na Pirinejskom poluostrvu.", "Njihova oblast je uz Biskajski zaliv, blizu Pirineja.", "Iz lekcije: Baski žive na severu Španije."], "objasnjenje": "Baski su izolovana grupa naroda na severu Španije, uz Biskajski zaliv.", "iz_udzbenika": {"strana": 15, "odeljak": "Stanovništvo", "tekst": "Baski su jedna od izolovanih grupa naroda; žive na severu Španije."}}, {"id": "stanovnistvo-klik-baski", "vrsta": "karta_klik", "tezina": "tesko", "pojmovi": ["baski", "spanija"], "pitanje": "Klikni na oblast u kojoj žive Baski.", "cilj": {"mesto": "zemlja-baska"}, "pomoc": ["Oblast je u Španiji, ali ne na jugu ni u centru.", "Traži sever Španije, uz Atlantik (Biskajski zaliv), blizu zapadnog kraja Pirineja.", "Klikni na sever Španije, uz obalu, blizu granice sa Francuskom."], "objasnjenje": "Zemlja Baska je na severu Španije, uz Biskajski zaliv, blizu zapadnih Pirineja.", "iz_udzbenika": {"strana": 15, "odeljak": "Stanovništvo", "tekst": "Baski su izolovana grupa naroda koja živi na severu Španije.", "slika": "11-spanija/02-fizicka-karta-spanije.jpg"}}, {"id": "stanovnistvo-tn-malta", "vrsta": "tacno_netacno", "tezina": "srednje", "pojmovi": ["malta", "semitski-narodi"], "tvrdnja": "Maltežani su romanski narod, srodan Italijanima.", "tacno": false, "ispravke": [{"tekst": "Maltežani su semitski narod, srodan Arapima.", "tacan": true}, {"tekst": "Maltežani su Južni Sloveni.", "tacan": false}, {"tekst": "Maltežani su izolovani narod srodan Baskima.", "tacan": false}], "pomoc": ["Malta je blizu Italije, ali i blizu severne Afrike.", "Maltežani nisu ni Sloveni ni Romani.", "Iz lekcije: Maltežani su semitski narod srodan Arapima."], "objasnjenje": "Netačno — Maltežani su semitski narod srodan Arapima; govore malteškim jezikom.", "iz_udzbenika": {"strana": 15, "odeljak": "Stanovništvo", "tekst": "Stanovnici Malte su semitski narod srodan Arapima; govore malteškim jezikom iz semitske grupe afroazijske porodice."}}, {"id": "stanovnistvo-izbor-malteski", "vrsta": "izbor", "tezina": "tesko", "pojmovi": ["malteski-jezik", "semitski-narodi"], "pitanje": "Gde spada malteški jezik?", "odgovori": [{"tekst": "u semitsku grupu afroazijske porodice", "tacan": true}, {"tekst": "u semitsku grupu indoevropske porodice", "tacan": false}, {"tekst": "u romansku grupu indoevropske porodice", "tacan": false}, {"tekst": "u slovensku grupu indoevropske porodice", "tacan": false}], "pomoc": ["Maltežani nisu indoevropski narod kao većina u regiji.", "Grupa je ista kao kod arapskog jezika; porodica nosi ime po dva kontinenta.", "Iz lekcije: malteški jezik pripada semitskoj grupi afroazijske porodice."], "objasnjenje": "Malteški jezik je u semitskoj grupi afroazijske porodice — kao i arapski. Semitska grupa ne pripada indoevropskoj porodici.", "iz_udzbenika": {"strana": 15, "odeljak": "Zanimljivosti", "tekst": "Maltežani nisu ni Sloveni ni Romani — oni su semitski narod srodan Arapima, a njihov jezik pripada semitskoj grupi afroazijske porodice jezika."}}, {"id": "stanovnistvo-vere-balkan", "vrsta": "izbor", "tezina": "lako", "pojmovi": ["pravoslavlje", "katolicanstvo", "islam"], "pitanje": "Koje vere su zastupljene na Balkanskom poluostrvu? (Više tačnih.)", "odgovori": [{"tekst": "pravoslavlje", "tacan": true}, {"tekst": "katoličanstvo", "tacan": true}, {"tekst": "islam", "tacan": true}, {"tekst": "protestantizam (kao vera većine)", "tacan": false}], "pomoc": ["Setimo se Srbije, Hrvatske i Bosne i Hercegovine — koje su vere tamo?", "Tačne su tri vere.", "Iz lekcije: na Pirinejskom i Apeninskom većina su katolici, a na Balkanu ima više vera."], "objasnjenje": "Na Balkanu su zastupljeni pravoslavlje, katoličanstvo i islam.", "iz_udzbenika": {"strana": 16, "odeljak": "Stanovništvo — vere", "tekst": "Na Pirinejskom i Apeninskom poluostrvu većina stanovnika su katolici. Na Balkanskom poluostrvu zastupljeni su pravoslavlje, katoličanstvo i islam. U zadatku se uz pomoć atlasa za Sloveniju, Grčku, Srbiju, Bugarsku i BiH upisuju vere."}}, {"id": "stanovnistvo-izbor-katolicanstvo", "vrsta": "izbor", "tezina": "lako", "pojmovi": ["katolicanstvo", "pirinejsko-poluostrvo", "apeninsko-poluostrvo"], "pitanje": "Koja vera preovlađuje na Pirinejskom i Apeninskom poluostrvu?", "odgovori": [{"tekst": "katoličanstvo", "tacan": true}, {"tekst": "budizam", "tacan": false}, {"tekst": "hinduizam", "tacan": false}], "pomoc": ["U Rimu se nalazi Vatikan, središte jedne hrišćanske crkve.", "Budizam i hinduizam su vere Azije.", "Iz lekcije: na Pirinejskom i Apeninskom poluostrvu većina su katolici."], "objasnjenje": "Na Pirinejskom i Apeninskom poluostrvu većina stanovnika su katolici.", "iz_udzbenika": {"strana": 16, "odeljak": "Stanovništvo — vere", "tekst": "Stanovnici Pirinejskog i Apeninskog poluostrva većinom su katolici."}}, {"id": "stanovnistvo-povezi-vere", "vrsta": "povezi", "tezina": "tesko", "pojmovi": ["pravoslavlje", "katolicanstvo", "islam", "slovenija", "grcka", "srbija", "bugarska", "bosna-i-hercegovina"], "pitanje": "Poveži državu sa verama koje su u njoj zastupljene (zadatak sa atlasom).", "parovi": [["Slovenija", "katoličanstvo"], ["Grčka", "pravoslavlje"], ["Srbija", "pravoslavlje, uz katoličku i islamsku manjinu"], ["Bugarska", "pravoslavlje, uz islam"], ["Bosna i Hercegovina", "islam, pravoslavlje i katoličanstvo"]], "pomoc": ["Slovenija je na severozapadu Balkana, blizu Italije i Austrije — kao i one, pretežno je katolička.", "Grčka je skoro sasvim pravoslavna; Bugarska ima i islam (Turci), a u BiH su tri vere skoro podjednako važne.", "Iz lekcije: na Balkanu su pravoslavlje, katoličanstvo i islam — u različitoj meri po državama."], "objasnjenje": "Slovenija — katoličanstvo; Grčka — pravoslavlje; Srbija — pravoslavlje uz katoličku i islamsku manjinu; Bugarska — pravoslavlje uz islam; BiH — islam, pravoslavlje i katoličanstvo.", "iz_udzbenika": {"strana": 16, "odeljak": "Zadatak 2 — vere", "tekst": "U zadatku se uz pomoć atlasa uz Sloveniju, Grčku, Srbiju, Bugarsku i Bosnu i Hercegovinu upisuju vere koje su u njima zastupljene.", "slika": "02-juzna-evropa/06-sofija.jpg"}}, {"id": "stanovnistvo-zakljuci-vere", "vrsta": "zakljuci", "tezina": "tesko", "pojmovi": ["pravoslavlje", "katolicanstvo", "islam", "balkansko-poluostrvo"], "pitanje": "Zašto se na Balkanskom poluostrvu sreće više vera nego na Apeninskom i Pirinejskom?", "odgovori": [{"tekst": "Balkan je vekovima bio granica velikih carstava i crkava — Vizantije, Rima i Osmanskog carstva.", "tacan": true}, {"tekst": "Na Balkanu je hladnija klima, pa su se ljudi češće selili.", "tacan": false}, {"tekst": "Na Balkan nikada nisu dolazili osvajači.", "tacan": false}, {"tekst": "Balkan je najveće poluostrvo, pa ima i najviše vera.", "tacan": false}], "pomoc": ["Korak 1: Koje su države (carstva) vladale Balkanom kroz istoriju?", "Korak 2: Koju je veru širila svaka od njih — Vizantija, Rim, Osmansko carstvo?", "Iz lekcije: Pirinejsko i Apeninsko su pretežno katolička, a Balkan je mešovit."], "objasnjenje": "Vizantija je širila pravoslavlje, Rim katoličanstvo, a Osmansko carstvo islam — na Balkanu su se sva tri uticaja susrela.", "iz_udzbenika": {"strana": 16, "odeljak": "Stanovništvo — vere", "tekst": "Dok su Pirinejsko i Apeninsko poluostrvo pretežno katolička, Balkan je versko raskršće: tu su pravoslavlje, katoličanstvo i islam. Veze: lekcije o državama bivše SFRJ pokazuju kako je to izmešano po državama."}}, {"id": "stanovnistvo-povezi-pojmovi", "vrsta": "povezi", "tezina": "lako", "pojmovi": ["emigracija", "imigracija", "urbanizacija"], "pitanje": "Poveži pojam sa njegovim značenjem.", "parovi": [["emigracija", "iseljavanje iz zemlje"], ["imigracija", "doseljavanje u zemlju"], ["urbanizacija", "širenje gradova i prelazak ljudi u gradove"]], "pomoc": ["„Urbs” na latinskom znači grad.", "Emigrant odlazi iz svoje zemlje, a imigrant dolazi u novu zemlju.", "Iz lekcije: regija je bila imigraciona, pa emigraciona; slabo je urbanizovana."], "objasnjenje": "Emigracija — iseljavanje; imigracija — doseljavanje; urbanizacija — rast gradova i prelazak stanovništva u gradove.", "iz_udzbenika": {"strana": 15, "odeljak": "Stanovništvo — migracije i naselja", "tekst": "Lekcija opisuje kako je regija iz imigracione (doseljeničke) postala emigraciona (iseljenička) i kako je slabo urbanizovana."}}, {"id": "stanovnistvo-tn-imigraciono", "vrsta": "tacno_netacno", "tezina": "srednje", "pojmovi": ["imigracija", "emigracija", "velika-geografska-otkrica"], "tvrdnja": "Do velikih geografskih otkrića Južna Evropa je bila područje iz kog su se ljudi iseljavali.", "tacno": false, "ispravke": [{"tekst": "Do velikih otkrića bila je imigraciono područje — ljudi su se doseljavali.", "tacan": true}, {"tekst": "Do velikih otkrića u regiji uopšte nije bilo stanovnika.", "tacan": false}, {"tekst": "Iseljavanje je počelo tek ulaskom u Evropsku uniju.", "tacan": false}], "pomoc": ["Setimo se da je regija tada bila najrazvijeniji deo Starog sveta — da li se iz takvog mesta odlazi ili se u njega dolazi?", "Iseljavanje (emigracija) počinje tek posle otkrića Novog sveta.", "Iz lekcije: do velikih otkrića područje je bilo imigraciono."], "objasnjenje": "Netačno — do velikih otkrića ljudi su se doseljavali (imigracija); iseljavanje počinje posle otkrića Novog sveta.", "iz_udzbenika": {"strana": 15, "odeljak": "Stanovništvo — migracije", "tekst": "Do velikih geografskih otkrića Južna Evropa je bila imigraciono područje, a posle otkrića Novog sveta postaje emigraciona.", "slika": "02-juzna-evropa/03-migraciona-kretanja.jpg"}}, {"id": "stanovnistvo-dopuni-migracije", "vrsta": "dopuni", "tezina": "srednje", "pojmovi": ["imigracija", "emigracija", "novi-svet"], "pitanje": "Dopuni rečenicu rečima iz banke.", "tekst": "Do velikih geografskih otkrića Južna Evropa je bila {{imigraciono}} područje, a posle otkrića Novog sveta počinje {{emigracija}} ka Americi i Australiji.", "ponudjene": ["imigraciono", "emigraciono", "emigracija", "imigracija", "urbanizacija"], "pomoc": ["Prvo je regija primala ljude, a zatim su ljudi iz nje odlazili.", "„Im-” znači ulazak (doseljavanje), „e-” znači izlazak (iseljavanje).", "Iz lekcije: imigraciono područje do otkrića, zatim emigracija ka Novom svetu."], "objasnjenje": "Do otkrića — imigraciono područje (doseljavanje); posle otkrića Novog sveta — emigracija (iseljavanje) ka Americi i Australiji.", "iz_udzbenika": {"strana": 15, "odeljak": "Stanovništvo — migracije", "tekst": "Do velikih geografskih otkrića regija je bila imigraciona, a posle otkrića Novog sveta ljudi su se iseljavali u Severnu i Južnu Ameriku i Australiju."}}, {"id": "stanovnistvo-izbor-emigracija", "vrsta": "izbor", "tezina": "tesko", "pojmovi": ["emigracija", "novi-svet"], "pitanje": "Kuda su se stanovnici Južne Evrope iseljavali posle otkrića Novog sveta? (Više tačnih.)", "odgovori": [{"tekst": "u Severnu Ameriku", "tacan": true}, {"tekst": "u Južnu Ameriku", "tacan": true}, {"tekst": "u Australiju", "tacan": true}, {"tekst": "u razvijene zemlje Zapadne i Srednje Evrope", "tacan": true}, {"tekst": "na Antarktik", "tacan": false}, {"tekst": "u Afriku i Aziju", "tacan": false}], "pomoc": ["Ljudi se iseljavaju tamo gde mogu da žive i rade — ne svaki kontinent Novog sveta je pogodan za naseljavanje.", "Tačna su četiri odgovora; kontinenti iz kojih danas DOLAZE imigranti nisu tačni.", "Iz lekcije: emigracija ka Severnoj i Južnoj Americi, Australiji i razvijenim zemljama Zapadne i Srednje Evrope."], "objasnjenje": "Iseljavali su se u Severnu i Južnu Ameriku, Australiju i razvijene zemlje Zapadne i Srednje Evrope. Antarktik je deo Novog sveta, ali nenaseljen; iz Afrike i Azije danas ljudi dolaze u regiju.", "iz_udzbenika": {"strana": 15, "odeljak": "Stanovništvo — migracije", "tekst": "Posle otkrića Novog sveta ljudi su se iseljavali ka Severnoj i Južnoj Americi i Australiji, kao i ka razvijenim zemljama Zapadne i Srednje Evrope.", "slika": "02-juzna-evropa/03-migraciona-kretanja.jpg"}}, {"id": "stanovnistvo-izbor-eu", "vrsta": "izbor", "tezina": "srednje", "pojmovi": ["emigracija", "italija", "spanija", "portugalija"], "pitanje": "Iz kojih država je iseljavanje delimično zaustavljeno kada su ušle u Evropsku uniju?", "odgovori": [{"tekst": "Portugalija, Španija i Italija", "tacan": true}, {"tekst": "Srbija, Albanija i Severna Makedonija", "tacan": false}, {"tekst": "Andora, Monako i San Marino", "tacan": false}, {"tekst": "Bosna i Hercegovina, Crna Gora i Srbija", "tacan": false}], "pomoc": ["Traži tri veće države sa Pirinejskog i Apeninskog poluostrva.", "Sa Balkanskog poluostrva iseljavanje se nastavlja.", "Iz lekcije: iseljavanje je delimično zaustavljeno ulaskom Portugalije, Španije i Italije u EU."], "objasnjenje": "Portugalija, Španija i Italija — ulaskom u EU iseljavanje se delimično zaustavilo; sa Balkana se nastavlja.", "iz_udzbenika": {"strana": 15, "odeljak": "Stanovništvo — migracije", "tekst": "Iseljavanje je delimično zaustavljeno kada su Portugalija, Španija i Italija ušle u Evropsku uniju; na Balkanskom poluostrvu se nastavlja."}}, {"id": "stanovnistvo-tn-balkan", "vrsta": "tacno_netacno", "tezina": "lako", "pojmovi": ["emigracija", "balkansko-poluostrvo"], "tvrdnja": "Sa Balkanskog poluostrva iseljavanje se nastavlja i danas.", "tacno": true, "pomoc": ["Pogledaj kartu migracija — kuda vode strelice sa Balkana?", "Strelice idu ka zapadnoj i srednjoj Evropi.", "Iz lekcije: iseljavanje je zaustavljeno u Italiji, Španiji i Portugaliji, ali se na Balkanu nastavlja."], "objasnjenje": "Tačno — sa Balkana ljudi i dalje odlaze, najviše ka razvijenim zemljama Zapadne i Srednje Evrope.", "iz_udzbenika": {"strana": 15, "odeljak": "Stanovništvo — migracije", "tekst": "Dok je iz Italije, Španije i Portugalije iseljavanje delimično zaustavljeno, sa Balkanskog poluostrva se nastavlja.", "slika": "02-juzna-evropa/03-migraciona-kretanja.jpg"}}, {"id": "stanovnistvo-zakljuci-eu", "vrsta": "zakljuci", "tezina": "tesko", "pojmovi": ["emigracija"], "pitanje": "Iseljavanje iz Italije, Španije i Portugalije je usporilo, a sa Balkana se nastavlja. Šta je najbolje objašnjenje?", "odgovori": [{"tekst": "Ulaskom u Evropsku uniju te tri države su dobile razvoj i posao kod kuće, a balkanske zemlje su siromašnije.", "tacan": true}, {"tekst": "Na Balkanu je toplija klima nego u Italiji.", "tacan": false}, {"tekst": "U Italiji, Španiji i Portugaliji je zabranjeno iseljavanje.", "tacan": false}, {"tekst": "Balkanske zemlje imaju više stanovnika od Italije.", "tacan": false}], "pomoc": ["Korak 1: Zašto se ljudi uopšte iseljavaju — šta traže?", "Korak 2: Šta je donelo članstvo u Evropskoj uniji Italiji, Španiji i Portugaliji?", "Iz lekcije: iseljavanje je delimično zaustavljeno ulaskom te tri države u EU."], "objasnjenje": "Ljudi odlaze zbog posla i boljeg života; razvoj posle ulaska u EU smanjio je potrebu za odlaskom, dok su balkanske zemlje i dalje siromašnije.", "iz_udzbenika": {"strana": 15, "odeljak": "Stanovništvo — migracije", "tekst": "Iseljavanje je delimično zaustavljeno kada su Portugalija, Španija i Italija ušle u Evropsku uniju, dok se sa Balkanskog poluostrva nastavlja.", "slika": "02-juzna-evropa/03-migraciona-kretanja.jpg"}}, {"id": "stanovnistvo-izbor-imigranti", "vrsta": "izbor", "tezina": "lako", "pojmovi": ["imigra
