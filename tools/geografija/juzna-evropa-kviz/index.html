cija"], "pitanje": "Pogledaj kartu migracija u 21. veku. Sa kojih kontinenata danas dolaze imigranti u Južnu Evropu? (Više tačnih.)", "odgovori": [{"tekst": "iz Afrike", "tacan": true}, {"tekst": "iz Azije", "tacan": true}, {"tekst": "sa Antarktika", "tacan": false}, {"tekst": "iz Australije", "tacan": false}], "pomoc": ["Traži kontinente koji su najbliži Sredozemnom moru.", "Jedan je južno od Sredozemnog mora, a drugi istočno, preko Male Azije.", "Iz lekcije: imigranti danas dolaze iz Afrike i Azije."], "objasnjenje": "Iz Afrike (preko Sredozemnog mora) i iz Azije (preko Male Azije i Egejskog mora).", "iz_udzbenika": {"strana": 15, "odeljak": "Stanovništvo — migracije", "tekst": "Na karti migracija u 21. veku strelice ka Južnoj Evropi dolaze iz severne Afrike i iz Azije — odatle danas stižu imigranti.", "slika": "02-juzna-evropa/03-migraciona-kretanja.jpg"}}, {"id": "stanovnistvo-tn-imigranti", "vrsta": "tacno_netacno", "tezina": "lako", "pojmovi": ["imigracija"], "tvrdnja": "Danas se u Južnu Evropu najviše doseljavaju ljudi iz Severne Amerike.", "tacno": false, "ispravke": [{"tekst": "Danas se doseljavaju najviše iz Afrike i Azije.", "tacan": true}, {"tekst": "Danas se niko ne doseljava u Južnu Evropu.", "tacan": false}, {"tekst": "Danas se doseljavaju najviše iz Australije.", "tacan": false}], "pomoc": ["Pogledaj koji kontinenti su najbliži Sredozemnom moru.", "Doseljenici stižu preko Sredozemnog mora i sa istoka.", "Iz lekcije: karta migracija u 21. veku pokazuje kretanja iz Afrike i Azije."], "objasnjenje": "Netačno — danas imigranti dolaze uglavnom iz Afrike i Azije; ranije su ljudi iz Južne Evrope odlazili u Ameriku.", "iz_udzbenika": {"strana": 15, "odeljak": "Stanovništvo — migracije", "tekst": "Do velikih otkrića region je bio imigracioni, a posle otkrića Novog sveta ljudi su se iseljavali u Ameriku, Australiju i razvijene zemlje Zapadne i Srednje Evrope. Karta migracija u 21. veku pokazuje da danas u Južnu Evropu stižu doseljenici iz Afrike i Azije.", "slika": "02-juzna-evropa/03-migraciona-kretanja.jpg"}}, {"id": "stanovnistvo-zakljuci-karta", "vrsta": "zakljuci", "tezina": "srednje", "pojmovi": ["imigracija", "emigracija"], "pitanje": "Na karti migracija u 21. veku strelice sa Balkana vode ka zapadnoj i srednjoj Evropi, a strelice iz Afrike i Azije ka jugu Evrope. Šta zaključuješ?", "odgovori": [{"tekst": "Južna Evropa je danas i polazište i cilj migracija.", "tacan": true}, {"tekst": "Iz Južne Evrope se danas niko ne iseljava.", "tacan": false}, {"tekst": "U Južnu Evropu se danas niko ne doseljava.", "tacan": false}, {"tekst": "Ljudi se danas sele samo unutar Afrike.", "tacan": false}], "pomoc": ["Korak 1: Šta pokazuju strelice koje IZLAZE iz regije?", "Korak 2: Šta pokazuju strelice koje ULAZE u regiju — da li se jedno isključuje sa drugim?", "Iz lekcije: sa Balkana se iseljavanje nastavlja, a iz Afrike i Azije stižu imigranti."], "objasnjenje": "Regija je istovremeno polazište (iseljavanje sa Balkana) i cilj (doseljenici iz Afrike i Azije).", "iz_udzbenika": {"strana": 15, "odeljak": "Stanovništvo — migracije", "tekst": "Karta migracija u 21. veku pokazuje strelice od Balkana i Apeninskog poluostrva ka razvijenijim delovima Evrope i strelice iz Afrike i Azije ka Južnoj Evropi.", "slika": "02-juzna-evropa/03-migraciona-kretanja.jpg"}}, {"id": "stanovnistvo-tn-urbanizacija", "vrsta": "tacno_netacno", "tezina": "lako", "pojmovi": ["urbanizacija"], "tvrdnja": "Države Južne Evrope su veoma urbanizovane — skoro svi stanovnici žive u gradovima.", "tacno": false, "ispravke": [{"tekst": "Države su slabo urbanizovane — mnogo ljudi i dalje živi na selu.", "tacan": true}, {"tekst": "U Južnoj Evropi uopšte nema gradova.", "tacan": false}, {"tekst": "Svi stanovnici žive na selu.", "tacan": false}], "pomoc": ["Razmisli o selima u Srbiji, Grčkoj ili Bugarskoj.", "Urbanizacijom su zahvaćeni samo manji delovi oko velikih gradova.", "Iz lekcije: države regije su slabo urbanizovane."], "objasnjenje": "Netačno — države su slabo urbanizovane; mnogo ljudi živi na selu, a gradski razvoj zahvata manje delove oko većih centara.", "iz_udzbenika": {"strana": 15, "odeljak": "Naselja", "tekst": "Države Južne Evrope su slabo urbanizovane — mnogo stanovnika i dalje živi na selu, a urbanizacija je zahvatila manje delove sa većim gradskim centrima."}}, {"id": "stanovnistvo-izbor-urbanizacija", "vrsta": "izbor", "tezina": "srednje", "pojmovi": ["urbanizacija"], "pitanje": "Šta znači da su države Južne Evrope slabo urbanizovane?", "odgovori": [{"tekst": "Mnogo ljudi i dalje živi na selu, a gradski razvoj zahvata samo manje delove oko većih centara.", "tacan": true}, {"tekst": "Gradovi su veliki, ali u njima niko ne radi.", "tacan": false}, {"tekst": "Svi gradovi su na obali mora.", "tacan": false}, {"tekst": "Glavni gradovi su manji od sela.", "tacan": false}], "pomoc": ["Urbanizacija je prelazak ljudi iz sela u gradove i širenje gradova.", "Slaba urbanizacija znači da je taj prelazak još „nedovršen”.", "Iz lekcije: mnogo ljudi i dalje živi na selu; urbanizacijom su zahvaćeni manji delovi sa većim gradskim centrima."], "objasnjenje": "Slabo urbanizovano — veliki deo stanovništva živi na selu, a gradovi su rasli samo u pojedinim oblastima.", "iz_udzbenika": {"strana": 15, "odeljak": "Naselja", "tekst": "Mnogo stanovnika regije i dalje živi na selu; urbanizacija je zahvatila samo manje delove sa većim gradskim centrima."}}, {"id": "stanovnistvo-zakljuci-selo", "vrsta": "zakljuci", "tezina": "lako", "pojmovi": ["urbanizacija"], "pitanje": "U jednoj državi Južne Evrope skoro polovina stanovnika živi na selu. Šta to pokazuje?", "odgovori": [{"tekst": "Da je država slabo urbanizovana.", "tacan": true}, {"tekst": "Da u državi nema poljoprivrede.", "tacan": false}, {"tekst": "Da je to minijaturna država.", "tacan": false}, {"tekst": "Da u državi nema glavnog grada.", "tacan": false}], "pomoc": ["Korak 1: Šta je urbanizacija — kretanje ljudi ka selu ili ka gradu?", "Korak 2: Ako mnogo ljudi i dalje živi na selu, da li je urbanizacija jaka ili slaba?", "Iz lekcije: države regije su slabo urbanizovane."], "objasnjenje": "Veliki udeo seoskog stanovništva znači slabu urbanizaciju — takve su države Južne Evrope.", "iz_udzbenika": {"strana": 15, "odeljak": "Naselja", "tekst": "Države Južne Evrope su slabo urbanizovane jer mnogo stanovnika i dalje živi na selu."}}, {"id": "stanovnistvo-izbor-veliki-grad", "vrsta": "izbor", "tezina": "lako", "pojmovi": ["rim"], "pitanje": "Koji od ovih gradova se po broju stanovnika ističe među najvećim gradovima Južne Evrope?", "odgovori": [{"tekst": "Rim", "tacan": true}, {"tekst": "San Marino", "tacan": false}, {"tekst": "Vatikan", "tacan": false}, {"tekst": "Monako", "tacan": false}], "pomoc": ["Tri ponuđena grada su ujedno i minijaturne države.", "Traži glavni grad velike države na Apeninskom poluostrvu.", "Iz lekcije: po broju stanovnika ističu se Rim, Barselona, Madrid, Lisabon, Beograd, Napulj, Milano i Sofija."], "objasnjenje": "Rim je jedan od najvećih gradova regije; San Marino, Vatikan i Monako su sićušne države-gradovi.", "iz_udzbenika": {"strana": 15, "odeljak": "Naselja", "tekst": "Po broju stanovnika ističu se Rim, Barselona, Madrid, Lisabon, Beograd, Napulj, Milano i Sofija."}}, {"id": "stanovnistvo-gradovi", "vrsta": "izbor", "tezina": "srednje", "pojmovi": ["barselona", "napulj", "milano", "urbanizacija"], "pitanje": "Koji od ovih velikih gradova Južne Evrope NISU glavni gradovi svojih država? (Više tačnih.)", "odgovori": [{"tekst": "Barselona", "tacan": true}, {"tekst": "Napulj", "tacan": true}, {"tekst": "Milano", "tacan": true}, {"tekst": "Sofija", "tacan": false}, {"tekst": "Lisabon", "tacan": false}], "pomoc": ["Setimo se glavnih gradova Španije, Italije, Bugarske i Portugalije.", "Dva grada su u Italiji, a jedan u Španiji.", "Iz lekcije: najveći gradovi su najčešće glavni gradovi — ali ne svi."], "objasnjenje": "Barselona (Španija), Napulj i Milano (Italija) su veliki gradovi, ali glavni gradovi su Madrid i Rim.", "iz_udzbenika": {"strana": 15, "odeljak": "Naselja", "tekst": "Države regije su slabo urbanizovane — mnogo ljudi i dalje živi na selu. Najveći gradovi su najčešće glavni gradovi: Rim, Madrid, Lisabon, Beograd, Sofija; ali i Barselona, Napulj i Milano, koji nisu glavni gradovi.", "slika": "02-juzna-evropa/04-madrid.jpg"}}, {"id": "stanovnistvo-povezi-gradovi", "vrsta": "povezi", "tezina": "srednje", "pojmovi": ["barselona", "napulj", "beograd", "sofija", "lisabon"], "pitanje": "Poveži veliki grad sa državom u kojoj se nalazi.", "parovi": [["Barselona", "Španija"], ["Napulj", "Italija"], ["Beograd", "Srbija"], ["Sofija", "Bugarska"], ["Lisabon", "Portugalija"]], "pomoc": ["Tri grada su glavni gradovi, a dva nisu.", "Barselona je na sredozemnoj obali Pirinejskog poluostrva, a Napulj na jugu „čizme”.", "Iz lekcije: najveći gradovi regije su Rim, Barselona, Madrid, Lisabon, Beograd, Napulj, Milano i Sofija."], "objasnjenje": "Barselona — Španija; Napulj — Italija; Beograd — Srbija; Sofija — Bugarska; Lisabon — Portugalija.", "iz_udzbenika": {"strana": 15, "odeljak": "Naselja", "tekst": "Među najvećim gradovima regije su Barselona i Madrid (Španija), Rim, Napulj i Milano (Italija), Lisabon, Beograd i Sofija."}}, {"id": "stanovnistvo-dopuni-gradovi", "vrsta": "dopuni", "tezina": "tesko", "pojmovi": ["barselona", "milano", "napulj"], "pitanje": "Dopuni rečenicu (bez ponuđenih reči) imenima velikih gradova koji nisu glavni gradovi.", "tekst": "U Španiji je, pored Madrida, veoma veliki grad {{Barselona}} na sredozemnoj obali, a u Italiji, pored Rima, na severu {{Milano}}, a na jugu {{Napulj}}.", "pomoc": ["Lekcija navodi tri velika grada koji nisu glavni gradovi — jedan je u Španiji, dva u Italiji.", "Italijanski grad na severu je u Padskoj niziji; onaj na jugu je kod Vezuva, na zapadnoj obali.", "Iz lekcije: glavni gradovi nisu Barselona, Napulj i Milano."], "objasnjenje": "Barselona (Španija), Milano (sever Italije) i Napulj (jug Italije) su veliki gradovi koji nisu glavni gradovi.", "iz_udzbenika": {"strana": 15, "odeljak": "Naselja", "tekst": "Najveći gradovi su najčešće glavni gradovi, ali Barselona, Napulj i Milano to nisu."}}, {"id": "stanovnistvo-klik-barselona", "vrsta": "karta_klik", "tezina": "srednje", "pojmovi": ["barselona", "spanija"], "pitanje": "Klikni na najveći grad Španije koji nije njen glavni grad.", "cilj": {"mesto": "barselona"}, "pomoc": ["Grad je na Pirinejskom poluostrvu, ali nije u njegovom centru.", "Leži na sredozemnoj obali, na severoistoku Španije.", "Klikni na obalu Sredozemnog mora na severoistoku Španije, južno od Pirineja."], "objasnjenje": "Barselona, na sredozemnoj obali severoistočne Španije — veliki grad koji nije glavni grad.", "iz_udzbenika": {"strana": 15, "odeljak": "Naselja", "tekst": "Barselona je jedan od najvećih gradova Južne Evrope, ali glavni grad Španije je Madrid.", "slika": "11-spanija/02-fizicka-karta-spanije.jpg"}}, {"id": "stanovnistvo-klik-napulj", "vrsta": "karta_klik", "tezina": "srednje", "pojmovi": ["napulj", "italija"], "pitanje": "Klikni na veliki grad na zapadnoj obali južne Italije koji nije glavni grad.", "cilj": {"mesto": "napulj"}, "pomoc": ["Grad je na Apeninskom poluostrvu, južnije od Rima.", "Leži na zapadnoj (Tirenskoj) obali, kod vulkana Vezuva.", "Klikni na zapadnu obalu Italije, oko 200 km jugoistočno od Rima."], "objasnjenje": "Napulj, na zapadnoj obali južne Italije — veliki grad, ali nije glavni grad.", "iz_udzbenika": {"strana": 15, "odeljak": "Naselja", "tekst": "Napulj je jedan od najvećih gradova regije; zajedno sa Milanom i Barselonom spada u velike gradove koji nisu glavni gradovi.", "slika": "10-italija/05-fizicka-karta-italije.jpg"}}]}, {"naslov": "Privreda", "zadaci": [{"id": "privreda-tn-najrazvijenija", "vrsta": "tacno_netacno", "tezina": "lako", "pojmovi": ["kraljica-turizma"], "tvrdnja": "Južna Evropa je turistički najrazvijenija regija na svetu.", "tacno": true, "pomoc": ["Setimo se nadimka koji je regija dobila zbog turizma.", "Godišnje je poseti više turista nego što ima stanovnika.", "Iz lekcije: Južna Evropa je turistički najrazvijenija regija sveta — „kraljica turizma”."], "objasnjenje": "Tačno — zbog klime, mora i nasleđa Južna Evropa je turistički najrazvijenija regija na svetu.", "iz_udzbenika": {"strana": 16, "odeljak": "Privreda — turizam", "tekst": "Zahvaljujući povoljnoj klimi, Sredozemnom moru i kulturno-istorijskom nasleđu, Južna Evropa je turistički najrazvijenija regija sveta.", "slika": "02-juzna-evropa/08-santorini.jpg"}}, {"id": "privreda-izbor-kraljica", "vrsta": "izbor", "tezina": "lako", "pojmovi": ["kraljica-turizma"], "pitanje": "Kakav nadimak je Južna Evropa dobila zbog razvijenog turizma?", "odgovori": [{"tekst": "„kraljica turizma”", "tacan": true}, {"tekst": "„žitnica sveta”", "tacan": false}, {"tekst": "„krov sveta”", "tacan": false}, {"tekst": "„fabrika Evrope”", "tacan": false}], "pomoc": ["Nadimak je vezan za turizam, a ne za poljoprivredu ili industriju.", "U nadimku je kraljevska titula.", "Iz lekcije: preko 200 miliona turista godišnje — „kraljica turizma”."], "objasnjenje": "Južnu Evropu zovu „kraljica turizma” jer je turistički najrazvijenija regija sveta.", "iz_udzbenika": {"strana": 16, "odeljak": "Privreda — turizam", "tekst": "Zbog velikog broja turista Južnu Evropu zovu „kraljica turizma”."}}, {"id": "privreda-dopuni-turizam", "vrsta": "dopuni", "tezina": "lako", "pojmovi": ["kraljica-turizma"], "pitanje": "Dopuni rečenicu.", "tekst": "Evropsko Sredozemlje godišnje poseti više od {{200}} miliona turista, pa Južnu Evropu nazivaju „{{kraljica turizma|kraljicom turizma}}”.", "ponudjene": ["200", "20", "kraljica turizma", "kolevka turizma", "2000"], "pomoc": ["Broj turista je veći od stanovništva cele regije.", "Nadimak je kraljevska titula.", "Iz lekcije: preko 200 miliona turista godišnje — „kraljica turizma”."], "objasnjenje": "Više od 200 miliona turista godišnje — Južna Evropa je „kraljica turizma”.", "iz_udzbenika": {"strana": 16, "odeljak": "Privreda — turizam", "tekst": "Zbog povoljne klime, Sredozemnog mora i kulturno-istorijskog nasleđa Južna Evropa je turistički najrazvijenija regija sveta: evropsko Sredozemlje godišnje poseti preko 200 miliona turista, pa je zovu „kraljica turizma”. Najposećenije su Španija, Italija, Portugalija, Grčka, Hrvatska i Slovenija.", "slika": "02-juzna-evropa/07-cinkve-tere.jpg"}}, {"id": "privreda-tn-broj-turista", "vrsta": "tacno_netacno", "tezina": "srednje", "pojmovi": ["kraljica-turizma"], "tvrdnja": "Evropsko Sredozemlje godišnje poseti oko 20 miliona turista.", "tacno": false, "ispravke": [{"tekst": "Godišnje ga poseti više od 200 miliona turista.", "tacan": true}, {"tekst": "Godišnje ga poseti oko 2 miliona turista.", "tacan": false}, {"tekst": "Godišnje ga poseti oko 159 miliona turista.", "tacan": false}], "pomoc": ["Broj turista je veći čak i od broja stanovnika regije (159 miliona).", "Fali jedna nula.", "Iz lekcije: preko 200 miliona turista godišnje."], "objasnjenje": "Netačno — evropsko Sredozemlje godišnje poseti preko 200 miliona turista; 159 miliona je broj stanovnika regije.", "iz_udzbenika": {"strana": 16, "odeljak": "Privreda — turizam", "tekst": "Evropsko Sredozemlje godišnje poseti preko 200 miliona turista — više nego što regija ima stanovnika."}}, {"id": "privreda-izbor-razlozi", "vrsta": "izbor", "tezina": "lako", "pojmovi": ["kraljica-turizma", "sredozemno-more"], "pitanje": "Šta je omogućilo razvoj turizma u Južnoj Evropi? (Više tačnih.)", "odgovori": [{"tekst": "povoljna klima", "tacan": true}, {"tekst": "Sredozemno more", "tacan": true}, {"tekst": "kulturno-istorijsko nasleđe", "tacan": true}, {"tekst": "velike ledene pustinje", "tacan": false}, {"tekst": "tropske prašume", "tacan": false}], "pomoc": ["Razmisli šta turisti traže leti — i šta vole da obiđu.", "Tačna su tri odgovora; ledene pustinje i prašume nisu odlike ove regije.", "Iz lekcije: turizam se razvio zbog povoljne klime, Sredozemnog mora i kulturno-istorijskog nasleđa."], "objasnjenje": "Povoljna klima, Sredozemno more i kulturno-istorijsko nasleđe.", "iz_udzbenika": {"strana": 16, "odeljak": "Privreda — turizam", "tekst": "Turizam se razvio zahvaljujući povoljnoj klimi, Sredozemnom moru i kulturno-istorijskom nasleđu.", "slika": "02-juzna-evropa/07-cinkve-tere.jpg"}}, {"id": "privreda-zakljuci-turizam", "vrsta": "zakljuci", "tezina": "srednje", "pojmovi": ["kraljica-turizma", "sredozemno-more"], "pitanje": "Zašto je baš Južna Evropa turistički najrazvijenija regija sveta?", "odgovori": [{"tekst": "Spaja toplu klimu i more sa bogatim kulturno-istorijskim nasleđem, a blizu je bogatih zemalja Evrope.", "tacan": true}, {"tekst": "Ima najviše snega u Evropi.", "tacan": false}, {"tekst": "U njoj nema gradova, pa je priroda netaknuta.", "tacan": false}, {"tekst": "Ima najjeftinije letove na svetu.", "tacan": false}], "pomoc": ["Korak 1: Šta turisti najčešće traže leti?", "Korak 2: Koje su civilizacije ostavile spomenike u ovoj regiji?", "Iz lekcije: turizam se razvio zbog klime, Sredozemnog mora i kulturno-istorijskog nasleđa."], "objasnjenje": "Klima, more i obale + nasleđe antičke Grčke, Rima i Vizantije, a sve to blizu bogate Zapadne i Srednje Evrope.", "iz_udzbenika": {"strana": 16, "odeljak": "Privreda — turizam", "tekst": "Turizam počiva na klimi, moru i nasleđu antičkih civilizacija. Primeri sa fotografija: nacionalni park Činkve Tere (Italija), ostrvo Santorini (Grčka) i Sintra (Portugalija).", "slika": "02-juzna-evropa/09-sintra.jpg"}}, {"id": "privreda-izbor-najposecenije", "vrsta": "izbor", "tezina": "srednje", "pojmovi": ["spanija", "italija", "grcka", "hrvatska"], "pitanje": "Koje države lekcija navodi među turistički najposećenijima? (Više tačnih.)", "odgovori": [{"tekst": "Španija", "tacan": true}, {"tekst": "Italija", "tacan": true}, {"tekst": "Grčka", "tacan": true}, {"tekst": "Hrvatska", "tacan": true}, {"tekst": "Srbija", "tacan": false}, {"tekst": "Severna Makedonija", "tacan": false}], "pomoc": ["Najposećenije države imaju izlaz na more.", "Tačna su četiri odgovora; dve ponuđene države nemaju morsku obalu.", "Iz lekcije: najposećenije su Španija, Italija, Portugalija, Grčka, Hrvatska i Slovenija."], "objasnjenje": "Španija, Italija, Grčka i Hrvatska (uz Portugaliju i Sloveniju). Srbija i Severna Makedonija nemaju izlaz na more.", "iz_udzbenika": {"strana": 16, "odeljak": "Privreda — turizam", "tekst": "Turistički najposećenije države regije su Španija, Italija, Portugalija, Grčka, Hrvatska i Slovenija."}}, {"id": "privreda-dopuni-najposecenije", "vrsta": "dopuni", "tezina": "tesko", "pojmovi": ["italija", "grcka", "slovenija"], "pitanje": "Dopuni spisak turistički najposećenijih država (bez ponuđenih reči).", "tekst": "Najposećenije su Španija, {{Italija}} (na Apeninskom poluostrvu), Portugalija, {{Grčka}} (na jugu Balkana), Hrvatska i {{Slovenija}} (na severozapadu Balkana, uz Alpe).", "pomoc": ["Svaka nedostajuća država opisana je položajem u zagradi.", "Prva je „čizma”, druga je zemlja Partenona i Santorinija, treća je mala država sa kratkom obalom Jadrana.", "Iz lekcije: najposećenije su Španija, Italija, Portugalija, Grčka, Hrvatska i Slovenija."], "objasnjenje": "Španija, Italija, Portugalija, Grčka, Hrvatska i Slovenija.", "iz_udzbenika": {"strana": 16, "odeljak": "Privreda — turizam", "tekst": "Najposećenije države su Španija, Italija, Portugalija, Grčka, Hrvatska i Slovenija."}}, {"id": "privreda-povezi-fotografije", "vrsta": "povezi", "tezina": "lako", "pojmovi": ["cinkve-tere", "santorini", "sintra"], "pitanje": "Poveži turističku destinaciju sa fotografija u udžbeniku sa državom.", "parovi": [["Činkve Tere", "Italija"], ["Santorini", "Grčka"], ["Sintra", "Portugalija"]], "pomoc": ["Pod svakom fotografijom u udžbeniku je u zagradi napisana država.", "Santorini je ostrvo u Egejskom moru; Sintra je blizu Lisabona.", "Iz lekcije: Činkve Tere (Italija), Santorini (Grčka), Sintra (Portugalija)."], "objasnjenje": "Činkve Tere — Italija; Santorini — Grčka; Sintra — Portugalija.", "iz_udzbenika": {"strana": 16, "odeljak": "Privreda — turizam", "tekst": "Fotografije prikazuju deo nacionalnog parka Činkve Tere (Italija), ostrvo Santorini (Grčka) i deo nacionalnog parka Sintra (Portugalija).", "slika": "02-juzna-evropa/07-cinkve-tere.jpg"}}, {"id": "privreda-povezi-destinacije", "vrsta": "povezi", "tezina": "srednje", "pojmovi": ["cinkve-tere", "santorini", "sintra", "partenon"], "pitanje": "Poveži destinaciju sa onim što se vidi na njenoj fotografiji u udžbeniku.", "parovi": [["Santorini", "bele kuće i plave kupole na litici iznad mora"], ["Činkve Tere", "šarene kuće na strmim stenama ligurske obale"], ["Sintra", "bela palata sa dva kupasta dimnjaka usred zelenila"], ["Partenon", "ruševine antičkog hrama sa stubovima"]], "pomoc": ["Dve destinacije su primorske, jedna je palata, a jedna antički hram.", "Santorini je grčko ostrvo; Činkve Tere je na obali severozapadne Italije.", "Iz lekcije: fotografije prikazuju Partenon, Činkve Tere, Santorini i Sintru."], "objasnjenje": "Santorini — bele kuće i plave kupole; Činkve Tere — šarene kuće na stenama; Sintra — palata u zelenilu; Partenon — antički hram.", "iz_udzbenika": {"strana": 16, "odeljak": "Privreda — turizam", "tekst": "Fotografije u lekciji pokazuju i primorski (Santorini, Činkve Tere) i kulturni turizam (Sintra, Partenon).", "slika": "02-juzna-evropa/09-sintra.jpg"}}, {"id": "privreda-gde-cinkve-tere", "vrsta": "gde_sam", "tezina": "tesko", "pojmovi": ["cinkve-tere", "italija"], "pitanje": "Gde sam? Pročitaj trag i klikni mesto na karti.", "cilj": {"mesto": "cinkve-tere"}, "tragovi": ["Moje šarene kuće naslagane su na strmim stenama iznad mora.", "Ja sam nacionalni park na obali Ligurskog mora.", "Nalazim se na severozapadu Apeninskog poluostrva, između Đenove i Pize.", "Ja sam nacionalni park Činkve Tere u Italiji."], "objasnjenje": "Činkve Tere — nacionalni park na ligurskoj obali severozapadne Italije.", "iz_udzbenika": {"strana": 16, "odeljak": "Privreda — turizam", "tekst": "Činkve Tere je nacionalni park na ligurskoj obali Italije, sa šarenim kućama na stenama iznad mora — primer spoja mora, pejzaža i nasleđa.", "slika": "02-juzna-evropa/07-cinkve-tere.jpg"}}, {"id": "gde-santorini", "vrsta": "gde_sam", "tezina": "tesko", "pojmovi": ["santorini", "grcka"], "pitanje": "Gde sam? Pročitaj trag i klikni mesto na karti.", "cilj": {"mesto": "santorini"}, "tragovi": ["Ja sam ostrvo poznato po belim kućama i plavim kupolama — česta turistička razglednica.", "Pripadam državi na jugu Balkanskog poluostrva.", "Nalazim se u Egejskom moru.", "Ležim u južnom delu Egejskog mora, severno od Krita."], "objasnjenje": "Santorini, grčko ostrvo u južnom delu Egejskog mora.", "iz_udzbenika": {"strana": 16, "odeljak": "Privreda — turizam", "tekst": "Santorini je grčko ostrvo u Egejskom moru, poznato po belim kućama i plavim kupolama na litici iznad mora — primer ostrvskog turizma „kraljice turizma”.", "slika": "02-juzna-evropa/08-santorini.jpg"}}, {"id": "privreda-gde-grcka", "vrsta": "gde_sam", "tezina": "lako", "pojmovi": ["grcka", "partenon", "santorini"], "pitanje": "Gde sam? Pročitaj trag i klikni državu na karti.", "cilj": {"drzava": "GRC"}, "tragovi": ["Među najposećenijim sam državama „kraljice turizma”.", "Imam ostrvo Santorini sa belim kućama i plavim kupolama.", "U mom glavnom gradu je Partenon, hram boginje Atine.", "Ja sam država na krajnjem jugu Balkanskog poluostrva."], "objasnjenje": "Grčka — na jugu Balkana, sa Atinom (Partenon) i ostrvom Santorini.", "iz_udzbenika": {"strana": 16, "odeljak": "Privreda — turizam", "tekst": "Grčka je među turistički najposećenijim državama — privlače je i antički spomenici kao Partenon i ostrva kao Santorini.", "slika": "02-juzna-evropa/08-santorini.jpg"}}, {"id": "privreda-gde-hrvatska", "vrsta": "gde_sam", "tezina": "srednje", "pojmovi": ["hrvatska", "kraljica-turizma"], "pitanje": "Gde sam? Pročitaj trag i klikni državu na karti.", "cilj": {"drzava": "HRV"}, "tragovi": ["Zajedno sa Slovenijom, ja sam jedina država sa Balkana bivše Jugoslavije na spisku turistički najposećenijih.", "Imam dugu i razuđenu obalu Jadranskog mora, sa mnogo ostrva.", "Reka Sava protiče kroz moj glavni grad.", "Moj glavni grad je Zagreb."], "objasnjenje": "Hrvatska — duga jadranska obala, glavni grad Zagreb na Savi; među najposećenijim državama regije.", "iz_udzbenika": {"strana": 16, "odeljak": "Privreda — turizam", "tekst": "Hrvatska je, uz Sloveniju, balkanska država među turistički najposećenijima u Južnoj Evropi."}}, {"id": "privreda-klik-hrvatska", "vrsta": "karta_klik", "tezina": "srednje", "pojmovi": ["hrvatska", "kraljica-turizma"], "pitanje": "Klikni na balkansku državu sa dugom obalom Jadranskog mora koja je među turistički najposećenijima.", "cilj": {"drzava": "HRV"}, "pomoc": ["Traži državu na zapadu Balkanskog poluostrva, preko puta Italije.", "Ima oblik „potkovice” i dugu obalu sa mnogo ostrva.", "Klikni na Hrvatsku — između Slovenije, BiH i Jadranskog mora."], "objasnjenje": "Hrvatska ima dugu, razuđenu obalu Jadranskog mora i jedna je od najposećenijih država regije.", "iz_udzbenika": {"strana": 16, "odeljak": "Privreda — turizam", "tekst": "Među najposećenijim državama regije su i dve sa Balkana — Hrvatska i Slovenija.", "slika": "02-juzna-evropa/10-politicka-karta-juzne-evrope.jpg"}}, {"id": "privreda-kulture", "vrsta": "izbor", "tezina": "lako", "pojmovi": ["mediteranska-poljoprivreda"], "pitanje": "Koje kulture su tipične za mediteransku poljoprivredu Južne Evrope? (Više tačnih.)", "odgovori": [{"tekst": "masline", "tacan": true}, {"tekst": "vinova loza", "tacan": true}, {"tekst": "agrumi (limun, pomorandža)", "tacan": true}, {"tekst": "kafa", "tacan": false}, {"tekst": "kakao", "tacan": false}], "pomoc": ["Traži biljke kojima prija toplo i suvo leto i blaga zima.", "Dve ponuđene uspevaju samo u tropima.", "Iz lekcije: zbog povoljne klime gaje se mediteranske kulture."], "objasnjenje": "Masline, vinova loza i agrumi; kafa i kakao traže tropsku klimu.", "iz_udzbenika": {"strana": 16, "odeljak": "Privreda — poljoprivreda", "tekst": "Zbog tople sredozemne klime gaje se mediteranske kulture: masline, vinova loza i agrumi."}}, {"id": "privreda-tn-kafa", "vrsta": "tacno_netacno", "tezina": "lako", "pojmovi": ["mediteranska-poljoprivreda"], "tvrdnja": "Zbog tople klime u Južnoj Evropi se najviše gaje kafa i kakao.", "tacno": false, "ispravke": [{"tekst": "Gaje se mediteranske kulture — masline, vinova loza i agrumi.", "tacan": true}, {"tekst": "Gaje se samo pirinač i čaj.", "tacan": false}, {"tekst": "U Južnoj Evropi nema poljoprivrede.", "tacan": false}], "pomoc": ["Kafa i kakao uspevaju u tropima, gde je toplo i vlažno cele godine.", "Južna Evropa ima sredozemnu klimu — topla, suva leta i blage zime.", "Iz lekcije: gaje se masline, vinova loza, agrumi i dr."], "objasnjenje": "Netačno — gaje se mediteranske kulture — masline, vinova loza i agrumi. Kafa i kakao traže tropsku klimu.", "iz_udzbenika": {"strana": 16, "odeljak": "Privreda — poljoprivreda", "tekst": "Zbog povoljne klime u Južnoj Evropi se gaje mediteranske kulture — masline, vinova loza, agrumi i druge."}}, {"id": "privreda-dopuni-kulture", "vrsta": "dopuni", "tezina": "srednje", "pojmovi": ["mediteranska-poljoprivreda"], "pitanje": "Dopuni rečenicu rečima iz banke.", "tekst": "Od plodova {{maslina|masline}} pravi se ulje, od grožđa sa {{vinove loze|vinova loza}} pravi se vino, a limun i pomorandža spadaju u {{agrume|agrumi}}.", "ponudjene": ["masline", "vinove loze", "agrume", "kafe", "pirinča"], "pomoc": ["Sve tri biljke su mediteranske kulture.", "Kafa i pirinač ne uspevaju u sredozemnoj klimi Južne Evrope.", "Iz lekcije: gaje se masline, vinova loza i agrumi."], "objasnjenje": "Masline (ulje), vinova loza (grožđe, vino) i agrumi (limun, pomorandža) su mediteranske kulture.", "iz_udzbenika": {"strana": 16, "odeljak": "Privreda — poljoprivreda", "tekst": "Mediteranska poljoprivreda Južne Evrope zasniva se na maslinama, vinovoj lozi i agrumima."}}, {"id": "privreda-zakljuci-masline", "vrsta": "zakljuci", "tezina": "srednje", "pojmovi": ["mediteranska-poljoprivreda", "alpi"], "pitanje": "Zašto se masline gaje na obali Grčke, a ne visoko u Alpima?", "odgovori": [{"tekst": "Maslini treba topla sredozemna klima sa blagom zimom, a u Alpima je hladno.", "tacan": true}, {"tekst": "U Alpima je zakonom zabranjeno gajenje maslina.", "tacan": false}, {"tekst": "Masline rastu samo na ostrvima.", "tacan": false}, {"tekst": "U Grčkoj ima više snega nego u Alpima.", "tacan": false}], "pomoc": ["Korak 1: Zašto lekcija kaže da se gaje mediteranske kulture — šta je uzrok?", "Korak 2: Kakva je klima visoko u planinama u poređenju sa obalom mora?", "Iz lekcije: zbog povoljne klime gaje se masline, vinova loza i agrumi."], "objasnjenje": "Mediteranske kulture traže toplu klimu bez oštrih zima; obale Sredozemlja to imaju, a visoke planine nemaju.", "iz_udzbenika": {"strana": 16, "odeljak": "Privreda — poljoprivreda", "tekst": "Mediteranske kulture — masline, vinova loza i agrumi — gaje se zbog povoljne, tople klime."}}, {"id": "privreda-dopuni-ribolov", "vrsta": "dopuni", "tezina": "lako", "pojmovi": ["ribolov", "brodogradnja"], "pitanje": "Dopuni rečenicu rečima iz banke.", "tekst": "Zbog izlaska na mora i okean u Južnoj Evropi su razvijeni {{ribolov}} i {{brodogradnja}}.", "ponudjene": ["ribolov", "brodogradnja", "stočarstvo"], "pomoc": ["Obe delatnosti su vezane za more.", "Jedna je lov na ribu, a druga je izgradnja brodova.", "Iz lekcije: zbog izlaska na mora i okean razvijeni su ribolov i brodogradnja."], "objasnjenje": "Ribolov i brodogradnja — razvijeni zbog izlaska na Sredozemno more, Crno more i Atlantski okean.", "iz_udzbenika": {"strana": 16, "odeljak": "Privreda", "tekst": "Pošto regija izlazi na Sredozemno more, Crno more i Atlantski okean, razvijeni su ribolov i brodogradnja."}}, {"id": "privreda-zakljuci-ribolov", "vrsta": "zakljuci", "tezina": "lako", "pojmovi": ["ribolov", "brodogradnja"], "pitanje": "Zašto su ribolov i brodogradnja važni u Južnoj Evropi?", "odgovori": [{"tekst": "Regija izlazi na Sredozemno more, Crno more i Atlantski okean i ima dugu obalu sa lukama.", "tacan": true}, {"tekst": "U regiji ima mnogo velikih jezera, a malo mora.", "tacan": false}, {"tekst": "Zato što je to najhladnija regija Evrope.", "tacan": false}, {"tekst": "Zato što u regiji nema puteva, pa se sve prevozi brodom.", "tacan": false}], "pomoc": ["Korak 1: Na koliko mora i okeana izlazi regija?", "Korak 2: Šta je potrebno da bi se razvio ribolov i gradili brodovi?", "Iz lekcije: ribolov i brodogradnja su razvijeni zbog izlaska na mora i okean."], "objasnjenje": "Okružena je morima i okeanom, sa dugom obalom i pomorskom tradicijom.", "iz_udzbenika": {"strana": 16, "odeljak": "Privreda", "tekst": "Pošto regija izlazi na Sredozemno more, Crno more i Atlantski okean, razvijeni su ribolov i brodogradnja; pored njih važni su industrija, rudarstvo i trgovina."}}, {"id": "privreda-tn-ribolov-srbija", "vrsta": "tacno_netacno", "tezina": "tesko", "pojmovi": ["ribolov", "brodogradnja", "srbija", "severna-makedonija"], "tvrdnja": "Srbija i Severna Makedonija su dobri primeri država u kojima su morski ribolov i brodogradnja glavne privredne grane.", "tacno": false, "ispravke": [{"tekst": "Te države nemaju izlaz na more; morski ribolov i brodogradnja razvijeni su u primorskim državama, npr. Grčkoj, Italiji i Hrvatskoj.", "tacan": true}, {"tekst": "Ribolov i brodogradnja nisu razvijeni nigde u Južnoj Evropi.", "tacan": false}, {"tekst": "Brodogradnja je razvijena samo u državama bez mora.", "tacan": false}], "pomoc": ["Ribolov i brodogradnja su u lekciji objašnjeni izlaskom na mora i okean.", "Proveri na karti da li Srbija i Severna Makedonija imaju morsku obalu.", "Iz lekcije: zbog izlaska na Sredozemno, Crno more i Atlantik razvijeni su ribolov i brodogradnja."], "objasnjenje": "Netačno — Srbija i Severna Makedonija nemaju izlaz na more; morski ribolov i brodogradnja vezani su za primorske države.", "iz_udzbenika": {"strana": 16, "odeljak": "Privreda", "tekst": "Ribolov i brodogradnja razvijeni su zato što regija izlazi na Sredozemno more, Crno more i Atlantski okean — dakle u primorskim državama."}}, {"id": "privreda-izbor-delatnosti", "vrsta": "izbor", "tezina": "srednje", "pojmovi": ["ribolov", "brodogradnja"], "pitanje": "Koje još privredne delatnosti lekcija navodi u Južnoj Evropi, pored turizma i poljoprivrede? (Više tačnih.)", "odgovori": [{"tekst": "ribolov", "tacan": true}, {"tekst": "brodogradnja", "tacan": true}, {"tekst": "industrija", "tacan": true}, {"tekst": "rudarstvo", "tacan": true}, {"tekst": "trgovina", "tacan": true}, {"tekst": "uzgoj irvasa", "tacan": false}, {"tekst": "plantaže kakaoa", "tacan": false}], "pomoc": ["Dve delatnosti su vezane za more, a tri su uobičajene u svakoj razvijenijoj regiji.", "Pogrešna su samo dva odgovora — jedan je tipičan za daleki sever, a drugi za tropske krajeve.", "Iz lekcije: ribolov, brodogradnja, industrija, rudarstvo, trgovina i dr."], "objasnjenje": "Ribolov, brodogradnja, industrija, rudarstvo i trgovina. Irvasi se gaje na dalekom severu, a kakao u tropima.", "iz_udzbenika": {"strana": 16, "odeljak": "Privreda", "tekst": "Pored turizma i mediteranske poljoprivrede, u regiji su razvijeni ribolov i brodogradnja, a takođe industrija, rudarstvo i trgovina."}}, {"id": "privreda-izbor-tvrdnje", "vrsta": "izbor", "tezina": "tesko", "pojmovi": ["kraljica-turizma", "mediteranska-poljoprivreda", "ribolov"], "pitanje": "Koje tvrdnje o privredi Južne Evrope su tačne? (Više tačnih.)", "odgovori": [{"tekst": "Evropsko Sredozemlje godišnje poseti više od 200 miliona turista.", "tacan": true}, {"tekst": "Agrumi su deo mediteranske poljoprivrede.", "tacan": true}, {"tekst": "Ribolov je razvijen zbog izlaska na tri vodene celine.", "tacan": true}, {"tekst": "Godišnje dolazi oko 159 miliona turista.", "tacan": false}, {"tekst": "Najposećenije države su Španija, Italija, Grčka i Bugarska.", "tacan": false}, {"tekst": "Brodogradnja je razvijena samo uz Atlantski okean.", "tacan": false}], "pomoc": ["Pazi na brojeve — jedan od njih je broj stanovnika, a ne turista.", "Na spisku najposećenijih nema države sa obale Crnog mora; brodogradnja nije vezana samo za jedan okean.", "Iz lekcije: >200 miliona turista; masline, loza, agrumi; ribolov i brodogradnja zbog Sredozemnog, Crnog mora i Atlantika."], "objasnjenje": "Tačne su prve tri. 159 miliona je broj stanovnika; Bugarska nije na spisku najposećenijih; brodogradnja je vezana za sva tri mora/okeana.", "iz_udzbenika": {"strana": 16, "odeljak": "Privreda", "tekst": "Privredu predvode turizam (preko 200 miliona turista godišnje), mediteranska poljoprivreda (masline, vinova loza, agrumi), ribolov i brodogradnja."}}, {"id": "privreda-povezi-uzroci", "vrsta": "povezi", "tezina": "tesko", "pojmovi": ["kraljica-turizma", "mediteranska-poljoprivreda", "ribolov", "suecki-kanal", "emigracija"], "pitanje": "Poveži uzrok sa posledicom.", "parovi": [["povoljna klima", "gajenje maslina i agruma"], ["izlaz na mora i okean", "ribolov i brodogradnja"], ["klima, more i nasleđe zajedno", "više od 200 miliona turista godišnje"], ["izgradnja Sueckog kanala", "ponovni rast privrednog značaja regije"], ["ulazak Italije u Evropsku uniju", "delimično zaustavljeno iseljavanje"]], "pomoc": ["Svaki uzrok ima samo jednu posledicu — kreni od para koji ti je najjasniji.", "Klima sama objašnjava poljoprivredu; klima zajedno sa morem i nasleđem objašnjava turizam.", "Iz lekcije: klima → mediteranske kulture; mora → ribolov; Suec → rast značaja; EU → manje iseljavanja."], "objasnjenje": "Klima → masline i agrumi; mora i okean → ribolov i brodogradnja; klima + more + nasleđe → turizam; Suecki kanal → rast značaja; EU → manje iseljavanja.", "iz_udzbenika": {"strana": 16, "odeljak": "Privreda", "tekst": "Lekcija za svaku privrednu granu navodi uzrok — klima za mediteransku poljoprivredu, izlaz na mora za ribolov i brodogradnju, a klima, more i nasleđe za turizam."}}]}, {"naslov": "Države i karta", "zadaci": [{"id": "drzave-izbor-broj", "vrsta": "izbor", "tezina": "lako", "pojmovi": ["juzna-evropa"], "pitanje": "Koliko država politički čini Južnu Evropu?", "odgovori": [{"tekst": "17", "tacan": true}, {"tekst": "3", "tacan": false}, {"tekst": "50", "tacan": false}, {"tekst": "100", "tacan": false}], "pomoc": ["Država je više od broja poluostrva, ali manje od broja država cele Evrope.", "Broj je između 15 i 20; tabela na str. 17 ima toliko redova.", "Iz lekcije: Južnu Evropu čini 17 država."], "objasnjenje": "Južnu Evropu politički čini 17 država, od kojih je pet minijaturnih.", "iz_udzbenika": {"strana": 16, "odeljak": "Politička podela", "tekst": "Južnu Evropu politički čini 17 država; pet od njih su minijaturne.", "slika": "02-juzna-evropa/10-politicka-karta-juzne-evrope.jpg"}}, {"id": "drzave-tn-17", "vrsta": "tacno_netacno", "tezina": "lako", "pojmovi": ["juzna-evropa", "minijaturne-drzave"], "tvrdnja": "Južnu Evropu čini 17 država, a pet od njih su minijaturne.", "tacno": true, "pomoc": ["Prebroj redove u tabeli na str. 17.", "Minijaturne su Andora, Vatikan, Monako, Malta i San Marino.", "Iz lekcije: 17 država; minijaturne su Andora, Vatikan, Monako, Malta i San Marino."], "objasnjenje": "Tačno — 17 država, od toga pet minijaturnih (Andora, Vatikan, Monako, Malta, San Marino).", "iz_udzbenika": {"strana": 16, "odeljak": "Politička podela", "tekst": "Regiju čini 17 država; minijaturne su Andora, Vatikan, Monako, Malta i San Marino.", "slika": "02-juzna-evropa/10-politicka-karta-juzne-evrope.jpg"}}, {"id": "drzave-izbor-najmanja", "vrsta": "izbor", "tezina": "lako", "pojmovi": ["vatikan"], "pitanje": "Koja je najmanja država Južne Evrope?", "odgovori": [{"tekst": "Vatikan", "tacan": true}, {"tekst": "Španija", "tacan": false}, {"tekst": "Italija", "tacan": false}, {"tekst": "Grčka", "tacan": false}], "pomoc": ["Najmanja država je toliko mala da se nalazi unutar jednog grada.", "Taj grad je Rim.", "Iz lekcije: najveća je Španija, a najmanja Vatikan."], "objasnjenje": "Vatikan je najmanja država Južne Evrope (i sveta) — nalazi se unutar Rima.", "iz_udzbenika": {"strana": 16, "odeljak": "Politička podela", "tekst": "Najmanja država regije je Vatikan, a najveća Španija."}}, {"id": "drzave-dopuni-najveca", "vrsta": "dopuni", "tezina": "lako", "pojmovi": ["spanija", "vatikan"], "pitanje": "Dopuni rečenicu rečima iz banke.", "tekst": "Najveća država Južne Evrope po površini je {{Španija}}, a najmanja je {{Vatikan}}.", "ponudjene": ["Španija", "Vatikan", "Italija", "Malta"], "pomoc": ["Najveća država zauzima najveći deo Pirinejskog poluostrva.", "Najmanja država se nalazi unutar Rima.", "Iz lekcije: najveća je Španija, najmanja Vatikan."], "objasnjenje": "Najveća je Španija, a najmanja Vatikan.", "iz_udzbenika": {"strana": 16, "odeljak": "Politička podela", "tekst": "Po površini je najveća Španija, a najmanji Vatikan.", "slika": "02-juzna-evropa/10-politicka-karta-juzne-evrope.jpg"}}, {"id": "drzave-tn-najveca", "vrsta": "tacno_netacno", "tezina": "srednje", "pojmovi": ["spanija", "italija"], "tvrdnja": "Najveća država Južne Evrope po površini je Italija.", "tacno": false, "ispravke": [{"tekst": "Najveća je Španija.", "tacan": true}, {"tekst": "Najveća je Grčka.", "tacan": false}, {"tekst": "Najveća je Portugalija.", "tacan": false}], "pomoc": ["Uporedi Pirinejsko i Apeninsko poluostrvo na karti — koje je šire?", "Najveća država je na zapadu regije.", "Iz lekcije: najveća je Španija."], "objasnjenje": "Netačno — najveća je Španija; Italija je druga po veličini.", "iz_udzbenika": {"strana": 16, "odeljak": "Politička podela", "tekst": "Najveća država Južne Evrope po površini je Španija, a najmanja Vatikan.", "slika": "02-juzna-evropa/10-politicka-karta-juzne-evrope.jpg"}}, {"id": "drzave-minijaturne", "vrsta": "izbor", "tezina": "srednje", "pojmovi": ["minijaturne-drzave"], "pitanje": "Koje su minijaturne države Južne Evrope? (Više tačnih.)", "odgovori": [{"tekst": "Vatikan", "tacan": true}, {"tekst": "San Marino", "tacan": true}, {"tekst": "Andora", "tacan": true}, {"tekst": "Monako", "tacan": true}, {"tekst": "Malta", "tacan": true}, {"tekst": "Albanija", "tacan": false}, {"tekst": "Slovenija", "tacan": false}], "pomoc": ["Tačnih je pet; dve ponuđene su obične, „velike” države Balkana.", "Dve minijaturne su unutar Italije, jedna u Pirinejima, jedna na obali uz Francusku, jedna je ostrvo.", "Iz lekcije: minijaturne države su Andora, Vatikan, Monako, Malta i San Marino."], "objasnjenje": "Andora, Vatikan, Monako, Malta i San Marino.", "iz_udzbenika": {"strana": 16, "odeljak": "Politička podela", "tekst": "Od 17 država regije pet su minijaturne: Andora (Pirineji), Vatikan i San Marino (unutar Italije), Monako (obala uz Francusku) i Malta (ostrvo južno od Sicilije).", "slika": "02-juzna-evropa/10-politicka-karta-juzne-evrope.jpg"}}, {"id": "drzave-tn-monako", "vrsta": "tacno_netacno", "tezina": "srednje", "pojmovi": ["monako", "minijaturne-drzave"], "tvrdnja": "Monako je minijaturna država na obali Sredozemnog mora, uz Francusku.", "tacno": true, "pomoc": ["Monako je jedna od pet minijaturnih država regije.", "Nije ni u Pirinejima ni u Italiji — leži na obali, uz francusku Azurnu obalu.", "Iz lekcije: minijaturne države su Andora, Vatikan, Monako, Malta i San Marino."], "objasnjenje": "Tačno — Monako je minijaturna država na sredozemnoj obali, okružena Francuskom.", "iz_udzbenika": {"strana": 16, "odeljak": "Politička podela", "tekst": "Monako je jedna od minijaturnih država Južne Evrope; leži na obali Sredozemnog mora, uz Francusku."}}, {"id": "drzave-zakljuci-vatikan", "vrsta": "zakljuci", "tezina": "lako", "pojmovi": ["vatikan", "rim"], "pitanje": "Vatikan se nalazi unutar grada Rima. Šta iz toga sledi?", "odgovori": [{"tekst": "Vatikan nema izlaz na more.", "tacan": true}, {"tekst": "Vatikan je veći od Italije.", "tacan": false}, {"tekst": "Vatikan je ostrvo.", "tacan": false}, {"tekst": "Vatikan je na Balkanskom poluostrvu.", "tacan": false}], "pomoc": ["Korak 1: Ako je država sa svih strana okružena jednim gradom, šta je oko nje?", "Korak 2: Da li Rim, unutar koga je, okružuje Vatikan i sa strane mora?", "Iz lekcije: Vatikan je najmanja država regije; nalazi se u Rimu."], "objasnjenje": "Vatikan je sa svih strana okružen Rimom, pa nema izlaz na more; to je najmanja država regije.", "iz_udzbenika": {"strana": 16, "odeljak": "Politička podela", "tekst": "Vatikan, najmanja država regije, nalazi se unutar Rima, glavnog grada Italije."}}, {"id": "drzave-zakljuci-karta", "vrsta": "zakljuci", "tezina": "srednje", "pojmovi": ["minijaturne-drzave"], "pitanje": "Učenik na nemoj političkoj karti ne može da nađe pet država iz tabele. Šta je najverovatniji razlog?", "odgovori": [{"tekst": "To su minijaturne države, premale da se jasno vide na karti.", "tacan": true}, {"tekst": "Te države su u Africi.", "tacan": false}, {"tekst": "Te države su nestale u 20. veku.", "tacan": false}, {"tekst": "To su najveće države, pa ne staju na kartu.", "tacan": false}], "pomoc": ["Korak 1: Koliko je država u regiji minijaturno?", "Korak 2: Kako izgleda država veličine jednog grada na karti cele Južne Evrope?", "Iz lekcije: minijaturne su Andora, Vatikan, Monako, Malta i San Marino."], "objasnjenje": "Pet minijaturnih država (Andora, Vatikan, Monako, Malta, San Marino) toliko su male da su na karti samo tačke ili se ne vide.", "iz_udzbenika": {"strana": 17, "odeljak": "Zadatak — tabela i nema karta", "tekst": "Na nemoj političkoj karti države se označavaju rednim brojevima iz tabele; Malta se vidi samo kao sitna tačka južno od Sicilije.", "slika": "02-juzna-evropa/10-politicka-karta-juzne-evrope.jpg"}}, {"id": "drzave-povezi-fotografije", "vrsta": "povezi", "tezina": "lako", "pojmovi": ["madrid", "lisabon", "sofija"], "pitanje": "Poveži glavni grad sa fotografije u udžbeniku sa državom.", "parovi": [["Madrid", "Španija"], ["Lisabon", "Portugalija"], ["Sofija", "Bugarska"]], "pomoc": ["Dva grada su na Pirinejskom poluostrvu, a jedan na Balkanskom.", "Lisabon je na obali Atlantika; Sofija je na istoku Balkana.", "Iz lekcije: Madrid — Španija, Lisabon — Portugalija, Sofija — Bugarska."], "objasnjenje": "Madrid — Španija; Lisabon — Portugalija; Sofija — Bugarska.", "iz_udzbenika": {"strana": 16, "odeljak": "Zadatak 3 — glavni gradovi", "tekst": "Ispod fotografija Madrida, Lisabona i Sofije upisuje se država čiji je to glavni grad.", "slika": "02-juzna-evropa/04-madrid.jpg"}}, {"id": "drzave-izbor-sofija", "vrsta": "izbor", "tezina": "lako", "pojmovi": ["sofija", "bugarska"], "pitanje": "Na fotografiji u udžbeniku je Sofija, sa katedralom zlatnih kupola. Čiji je ona glavni grad?", "odgovori": [{"tekst": "Bugarske", "tacan": true}, {"tekst": "Španije", "tacan": false}, {"tekst": "Portugalije", "tacan": false}, {"tekst": "Italije", "tacan": false}], "pomoc": ["Sofija je na Balkanskom poluostrvu.", "Država izlazi na Crno more.", "Iz lekcije: Sofija je glavni grad Bugarske."], "objasnjenje": "Sofija je glavni grad Bugarske; ostale ponuđene države nisu na Balkanu.", "iz_udzbenika": {"strana": 16, "odeljak": "Zadatak 3 — glavni gradovi", "tekst": "Na fotografiji je Sofija, glavni grad Bugarske, sa pravoslavnom katedralom zlatnih kupola.", "slika": "02-juzna-evropa/06-sofija.jpg"}}, {"id": "drzave-povezi-gradovi", "vrsta": "povezi", "tezina": "srednje", "pojmovi": ["portugalija", "bugarska", "albanija", "malta", "grcka"], "pitanje": "Poveži državu sa njenim glavnim gradom.", "parovi": [["Portugalija", "Lisabon"], ["Bugarska", "Sofija"], ["Albanija", "Tirana"], ["Malta", "Valeta"], ["Grčka", "Atina"]], "pomoc": ["Kreni od gradova koje znaš iz Zadatka sa fotografijama — Lisabon i Sofija.", "Valeta je na ostrvu, a Tirana je na Balkanu, zapadno od Severne Makedonije.", "Iz lekcije: tabela 17 država i njihovih glavnih gradova."], "objasnjenje": "Portugalija – Lisabon, Bugarska – Sofija, Albanija – Tirana, Malta – Valeta, Grčka – Atina.", "iz_udzbenika": {"strana": 16, "odeljak": "Zadatak — glavni gradovi", "tekst": "U zadatku sa fotografijama uz ime grada upisuje se država čiji je to glavni grad: Madrid — Španija, Lisabon — Portugalija, Sofija — Bugarska. Tabela na str. 17 traži glavni grad i poluostrvo za svih 17 država.", "slika": "02-juzna-evropa/05-lisabon.jpg"}}, {"id": "drzave-tn-tirana", "vrsta": "tacno_netacno", "tezina": "srednje", "pojmovi": ["albanija", "severna-makedonija"], "tvrdnja": "Tirana je glavni grad Severne Makedonije.", "tacno": false, "ispravke": [{"tekst": "Tirana je glavni grad Albanije; glavni grad Severne Makedonije je Skoplje.", "tacan": true}, {"tekst": "Tirana je glavni grad Crne Gore.", "tacan": false}, {"tekst": "Tirana je glavni grad Bugarske.", "tacan": false}], "pomoc": ["Tirana je na Balkanu, blizu Jadranskog mora.", "Severna Makedonija nema izlaz na more, a država čiji je Tirana glavni grad ima.", "Iz lekcije (tabela): Albanija — Tirana; Severna Makedonija — Skoplje."], "objasnjenje": "Netačno — Tirana je glavni grad Albanije, a Skoplje je glavni grad Severne Makedonije.", "iz_udzbenika": {"strana": 17, "odeljak": "Zadatak — tabela i nema karta", "tekst": "U tabeli se uz pomoć atlasa za svaku državu upisuje glavni grad — npr. Albanija — Tirana, Severna Makedonija — Skoplje."}}, {"id": "drzave-dopuni-glavni", "vrsta": "dopuni", "tezina": "srednje", "pojmovi": ["crna-gora", "severna-makedonija", "bosna-i-hercegovina"], "pitanje": "Dopuni rečenicu rečima iz banke (rad sa atlasom).", "tekst": "Glavni grad Crne Gore je {{Podgorica}}, Severne Makedonije {{Skoplje}}, a Bosne i Hercegovine {{Sarajevo}}.", "ponudjene": ["Podgorica", "Skoplje", "Sarajevo", "Tirana", "Zagreb"], "pomoc": ["Sve tri države su na Balkanskom poluostrvu; Tirana i Zagreb su glavni gradovi drugih država.", "Skoplje je na Vardaru; Sarajevo je u središtu BiH; Podgorica je blizu Skadarskog jezera.", "Iz lekcije (tabela): Crna Gora — Podgorica, Severna Makedonija — Skoplje, BiH — Sarajevo."], "objasnjenje": "Crna Gora — Podgorica; Severna Makedonija — Skoplje; Bosna i Hercegovina — Sarajevo.", "iz_udzbenika": {"strana": 17, "odeljak": "Zadatak — tabela i nema karta", "tekst": "U tabeli 17 država upisuju se glavni gradovi — za balkanske države to su, između ostalih, Podgorica, Skoplje i Sarajevo."}}, {"id": "drzave-povezi-balkan", "vrsta": "povezi", "tezina": "tesko", "pojmovi": ["slovenija", "hrvatska", "bosna-i-hercegovina", "crna-gora", "severna-makedonija", "srbija"], "pitanje": "Poveži balkansku državu sa njenim glavnim gradom.", "parovi": [["Slovenija", "Ljubljana"], ["Hrvatska", "Zagreb"], ["Bosna i Hercegovina", "Sarajevo"], ["Crna Gora", "Podgorica"], ["Severna Makedonija", "Skoplje"], ["Srbija", "Beograd"]], "pomoc": ["Kreni od Beograda, pa idi ka severozapadu (Zagreb, Ljubljana) i ka jugu.", "Ljubljana je najbliža Alpima; Skoplje je najjužnije od ovih šest gradova.", "Iz lekcije (tabela): Ljubljana, Zagreb, Sarajevo, Podgorica, Skoplje, Beograd."], "objasnjenje": "Slovenija — Ljubljana; Hrvatska — Zagreb; BiH — Sarajevo; Crna Gora — Podgorica; Severna Makedonija — Skoplje; Srbija — Beograd.", "iz_udzbenika": {"strana": 17, "odeljak": "Zadatak — tabela i nema karta", "tekst": "U tabeli se za svih 17 država uz pomoć atlasa upisuju glavni gradovi; šest balkanskih država obrađuje se i u narednim lekcijama.", "slika": "02-juzna-evropa/10-politicka-karta-juzne-evrope.jpg"}}, {"id": "drzave-povezi-poluostrva", "vrsta": "povezi", "tezina": "srednje", "pojmovi": ["portugalija", "italija", "bugarska", "malta"], "pitanje": "Poveži državu sa poluostrvom na kome se nalazi (kao u tabeli na str. 17).", "parovi": [["Portugalija", "Pirinejsko poluostrvo"], ["Italija", "Apeninsko poluostrvo"], ["Bugarska", "Balkansko poluostrvo"], ["Malta", "nije na poluostrvu — ostrvo je"]], "pomoc": ["Pirinejsko je na zapadu, Apeninsko u sredini, Balkansko na istoku.", "Jedna država je ostrvo južno od Sicilije.", "Iz lekcije: u tabeli se za svaku državu upisuje poluostrvo — osim za dve koje nisu na poluostrvima."], "objasnjenje": "Portugalija — Pirinejsko; Italija — Apeninsko; Bugarska — Balkansko; Malta je ostrvo, pa nije ni na jednom poluostrvu.", "iz_udzbenika": {"strana": 17, "odeljak": "Zadatak — tabela i nema karta", "tekst": "U tabeli se uz svaku državu upisuje i poluostrvo na kome leži; dve države nisu ni na jednom od tri poluostrva.", "slika": "02-juzna-evropa/10-politicka-karta-juzne-evrope.jpg"}}, {"id": "drzave-izbor-apeninsko", "vrsta": "izbor", "tezina": "srednje", "pojmovi": ["apeninsko-poluostrvo", "italija", "vatikan", "san-marino"], "pitanje": "Koje države se nalaze na Apeninskom poluostrvu? (Više tačnih.)", "odgovori": [{"tekst": "Italija", "tacan": true}, {"tekst": "Vatikan", "tacan": true}, {"tekst": "San Marino", "tacan": true}, {"tekst": "Malta", "tacan": false}, {"tekst": "Monako", "tacan": false}, {"tekst": "Slovenija", "tacan": false}], "pomoc": ["Pored Italije, na poluostrvu su dve minijaturne države koje Italija okružuje sa svih strana.", "Malta je ostrvo, a Monako je uz Francusku.", "Iz lekcije: Vatikan i San Marino su minijaturne države unutar Italije."], "objasnjenje": "Italija, Vatikan i San Marino. Malta je ostrvo južno od Sicilije, Monako je uz Francusku, a Slovenija na Balkanu.", "iz_udzbenika": {"strana": 17, "odeljak": "Zadatak — tabela i nema karta", "tekst": "Na Apeninskom poluostrvu su Italija i dve minijaturne države unutar nje — Vatikan i San Marino.", "slika": "10-italija/05-fizicka-karta-italije.jpg"}}, {"id": "drzave-zakljuci-poluostrvo", "vrsta": "zakljuci", "tezina": "tesko", "pojmovi": ["malta", "monako", "minijaturne-drzave"], "pitanje": "U tabeli na str. 17 za dve države se ne upisuje poluostrvo. Koji par je najverovatniji?", "odgovori": [{"tekst": "Malta i Monako", "tacan": true}, {"tekst": "Andora i San Marino", "tacan": false}, {"tekst": "Vatikan i San Marino", "tacan": false}, {"tekst": "Srbija i Severna Makedonija", "tacan": false}], "pomoc": ["Korak 1: Nemati izlaz na more nije isto što i ne biti na poluostrvu — Andora je u Pirinejima, Vatikan i San Marino su u Italiji.", "Korak 2: Koja država je ostrvo, a koja leži na obali kopna Evrope, van tri poluostrva (uz Francusku)?", "Iz lekcije: dve države nisu ni na jednom od tri poluostrva."], "objasnjenje": "Malta je ostrvo, a Monako je na kopnu Evrope uz Francusku — ni jedna nije na Pirinejskom, Apeninskom ili Balkanskom poluostrvu. Andora, Vatikan i San Marino jesu na poluostrvima, iako nemaju more.", "iz_udzbenika": {"strana": 17, "odeljak": "Zadatak — tabela i nema karta", "tekst": "U tabeli se poluostrvo upisuje za sve države osim za dve koje nisu na poluostrvima — to su Malta (ostrvo) i Monako (na obali uz Francusku).", "slika": "02-juzna-evropa/10-politicka-karta-juzne-evrope.jpg"}}, {"id": "karta-portugalija", "vrsta": "karta_klik", "tezina": "lako", "pojmovi": ["portugalija"], "pitanje": "Klikni na Portugaliju.", "cilj": {"drzava": "PRT"}, "pomoc": ["Ona je najzapadnija država Južne Evrope.", "Leži na Pirinejskom poluostrvu, uz Atlantski okean.", "Uska je država na zapadnoj obali Pirinejskog poluostrva, zapadno od Španije."], "objasnjenje": "Portugalija je na zapadu Pirinejskog poluostrva, na obali Atlantskog okeana.", "iz_udzbenika": {"strana": 17, "odeljak": "Zadatak — tabela i nema karta", "tekst": "Portugalija sa Španijom deli Pirinejsko poluostrvo; leži na njegovom zapadu, na obali Atlantskog okeana. Glavni grad je Lisabon, na ušću reke Težo.", "slika": "02-juzna-evropa/05-lisabon.jpg"}}, {"id": "karta-bugarska", "vrsta": "karta_klik", "tezina": "srednje", "pojmovi": ["bugarska", "crno-more"], "pitanje": "Klikni na državu Južne Evrope koja izlazi na Crno more.", "cilj": {"drzava": "BGR"}, "pomoc": ["Crno more je na krajnjem istoku karte.", "Država je na istoku Balkanskog poluostrva, južno od Dunava.", "Graniči se sa Srbijom na zapadu, a Dunav je odvaja od Rumunije na severu."], "objasnjenje": "Bugarska — jedina država regije na obali Crnog mora.", "iz_udzbenika": {"strana": 16, "odeljak": "Zadatak — glavni gradovi", "tekst": "Bugarska je na istoku Balkanskog poluostrva i jedina država regije na obali Crnog mora; Dunav je deo njene severne granice. Glavni grad je Sofija.", "slika": "02-juzna-evropa/06-sofija.jpg"}}, {"id": "karta-srbija", "vrsta": "karta_klik", "tezina": "srednje", "pojmovi": ["srbija", "sava", "dunav", "beograd"], "pitanje": "Klikni na državu u kojoj se Sava uliva u Dunav.", "cilj": {"drzava": "SRB"}, "pomoc": ["Sava je deo severne granice Južne Evrope; prati je od Slovenije ka istoku.", "Ušće je u glavnom gradu te države.", "Na ušću Save u Dunav je Beograd."], "objasnjenje": "Sava se uliva u Dunav u Beogradu — Srbija.", "iz_udzbenika": {"strana": 18, "odeljak": "Republika Srbija (lekcija 4)", "tekst": "Srbija je kontinentalna, balkanska, podunavska i panonska zemlja. Sava, koja je deo severne granice Južne Evrope, uliva se u Dunav u Beogradu — glavnom gradu Srbije.", "slika": "04-srbija/06-fizicka-karta-srbije.jpg"}}, {"id": "drzave-klik-albanija", "vrsta": "karta_klik", "tezina": "srednje", "pojmovi": ["albanija", "albanci"], "pitanje": "Klikni na Albaniju — državu izolovanog naroda Albanaca.", "cilj": {"drzava": "ALB"}, "pomoc": ["Albanija je na zapadu Balkanskog poluostrva.", "Izlazi na Jadransko i Jonsko more, preko puta „pete” Italije.", "Klikni između Crne Gore (sever) i Grčke (jug), na obali."], "objasnjenje": "Albanija je na zapadnoj obali Balkana, između Crne Gore i Grčke; glavni grad je Tirana.", "iz_udzbenika": {"strana": 15, "odeljak": "Stanovništvo", "tekst": "Albanci su, uz Grke i Baske, izolovana grupa naroda; žive na zapadu Balkanskog poluostrva.", "slika": "02-juzna-evropa/10-politicka-karta-juzne-evrope.jpg"}}, {"id": "drzave-klik-madrid", "vrsta": "karta_klik", "tezina": "srednje", "pojmovi": ["madrid", "spanija"], "pitanje": "Klikni na Madrid, glavni grad Španije.", "cilj": {"mesto": "madrid"}, "pomoc": ["Madrid je na Pirinejskom poluostrvu.", "Nalazi se skoro tačno u centru Španije, daleko od mora.", "Klikni na sredinu Pirinejskog poluostrva."], "objasnjenje": "Madrid je u središtu Pirinejskog poluostrva — glavni grad Španije.", "iz_udzbenika": {"strana": 16, "odeljak": "Zadatak 3 — glavni gradovi", "tekst": "Madrid, glavni grad Španije, jedan je od najvećih gradova Južne Evrope; na fotografiji je njegov centralni trg.", "slika": "02-juzna-evropa/04-madrid.jpg"}}, {"id": "drzave-klik-lisabon", "vrsta": "karta_klik", "tezina": "srednje", "pojmovi": ["lisabon", "portugalija", "atlantski-okean"], "pitanje": "Klikni na Lisabon, glavni grad Portugalije.", "cilj": {"mesto": "lisabon"}, "pomoc": ["Lisabon je na zapadnoj obali Pirinejskog poluostrva.", "Leži na ušću reke Težo u Atlantski okean.", "Klikni na obalu Atlantika u južnom delu Portugalije."], "objasnjenje": "Lisabon je na ušću reke Težo u Atlantski okean — glavni grad Portugalije.", "iz_udzbenika": {"strana": 16, "odeljak": "Zadatak 3 — glavni gradovi", "tekst": "Na fotografiji je Lisabon sa šarenim krovovima i visećim mostom preko ušća reke Težo; glavni je grad Portugalije.", "slika": "02-juzna-evropa/05-lisabon.jpg"}}, {"id": "drzave-gde-sofija", "vrsta": "gde_sam", "tezina": "srednje", "pojmovi": ["sofija", "bugarska"], "pitanje": "Gde sam? Pročitaj trag i klikni mesto na karti.", "cilj": {"mesto": "sofija"}, "tragovi": ["U meni se ističe katedrala sa zlatnim kupolama.", "Ja sam jedan od najvećih gradova Južne Evrope i glavni grad.", "Moja država je na istoku Balkanskog poluostrva i izlazi na Crno more.", "Ja sam glavni grad Bugarske."], "objasnjenje": "Sofija — glavni grad Bugarske, na zapadu te države, blizu granice sa Srbijom.", "iz_udzbenika": {"strana": 16, "odeljak": "Zadatak 3 — glavni gradovi", "tekst": "Sofija je glavni grad Bugarske i jedan od najvećih gradova regije; na fotografiji je katedrala zlatnih kupola.", "slika": "02-juzna-evropa/06-sofija.jpg"}}, {"id": "drzave-gde-italija", "vrsta": "gde_sam", "tezina": "lako", "pojmovi": ["italija", "rim", "apeninsko-poluostrvo"], "pitanje": "Gde sam? Pročitaj trag i klikni državu na karti.", "cilj": {"drzava": "ITA"}, "tragovi": ["Unutar mene se nalaze dve minijaturne države.", "Moji veliki gradovi su Rim, Milano i Napulj.", "Duž mene se pružaju Apenini, a na severu su Alpi.", "Imam oblik čizme i zauzimam Apeninsko poluostrvo."], "objasnjenje": "Italija — „čizma” na Apeninskom poluostrvu, sa Rimom, Milanom i Napuljem; u njoj su Vatikan i San Marino.", "iz_udzbenika": {"strana": 17, "odeljak": "Zadatak — tabela i nema karta", "tekst": "Italija zauzima Apeninsko poluostrvo; unutar nje su Vatikan i San Marino, a među najvećim gradovima regije su Rim, Milano i Napulj.", "slika": "10-italija/05-fizicka-karta-italije.jpg"}}, {"id": "drzave-klik-slovenija", "vrsta": "karta_klik", "tezina": "tesko", "pojmovi": ["slovenija", "alpi"], "pitanje": "Klikni na Sloveniju — najseverniju balkansku državu regije, koja je među turistički najposećenijima.", "cilj": {"drzava": "SVN"}, "pomoc": ["Država je na severozapadu Balkanskog poluostrva, uz Alpe.", "Graniči se sa Italijom, a ima samo kratku obalu Jadranskog mora.", "Klikni severno od Hrvatske, a istočno od Italije."], "objasnjenje": "Slovenija je na severozapadu Balkana, uz Alpe i Italiju; ima kratku obalu Jadrana; glavni grad je Ljubljana.", "iz_udzbenika": {"strana": 16, "odeljak": "Privreda — turizam", "tekst": "Slovenija je, uz Hrvatsku, balkanska država među turistički najposećenijima u regiji.", "slika": "02-juzna-evropa/10-politicka-karta-juzne-evrope.jpg"}}, {"id": "drzave-klik-crna-gora", "vrsta": "karta_klik", "tezina": "tesko", "pojmovi": ["crna-gora"], "pitanje": "Klikni na Crnu Goru.", "cilj": {"drzava": "MNE"}, "pomoc": ["Crna Gora je mala država na obali Jadranskog mora.", "Nalazi se između Hrvatske (sever-zapad) i Albanije (jug).", "Klikni na obalu Jadrana južno od Bosne i Hercegovine, a severno od Albanije."], "objasnjenje": "Crna Gora je na jugu jadranske obale Balkana, između Hrvatske, BiH, Srbije i Albanije; glavni grad je Podgorica.", "iz_udzbenika": {"strana": 17, "odeljak": "Zadatak — tabela i nema karta", "tekst": "Crna Gora je jedna od država Balkanskog poluostrva iz tabele 17 država; njen glavni grad je Podgorica.", "slika": "02-juzna-evropa/10-politicka-karta-juzne-evrope.jpg"}}, {"id": "drzave-klik-severna-makedonija", "vrsta": "karta_klik", "tezina": "tesko", "pojmovi": ["severna-makedonija"], "pitanje": "Klikni na Severnu Makedoniju.", "cilj": {"drzava": "MKD"}, "pomoc": ["Država je na jugu Balkanskog poluostrva i nema izlaz na more.", "Graniči se sa Srbijom na severu i Grčkom na jugu.", "Klikni između Albanije (zapad) i Bugarske (istok), severno od Grčke."], "objasnjenje": "Severna Makedonija je kontinentalna država južno od Srbije i severno od Grčke; glavni grad je Skoplje.", "iz_udzbenika": {"strana": 17, "odeljak": "Zadatak — tabela i nema karta", "tekst": "Severna Makedonija je balkanska država bez izlaza na more; u tabeli se upisuje njen glavni grad Skoplje i Balkansko poluostrvo.", "slika": "02-juzna-evropa/10-politicka-karta-juzne-evrope.jpg"}}, {"id": "drzave-klik-bih", "vrsta": "karta_klik", "tezina": "tesko", "pojmovi": ["bosna-i-hercegovina", "sava"], "pitanje": "Klikni na Bosnu i Hercegovinu — državu u kojoj su zastupljeni islam, pravoslavlje i katoličanstvo.", "cilj": {"drzava": "BIH"}, "pomoc": ["Država je na zapadu Balkana; Sava je njena severna granica.", "Skoro sa svih strana je okružena Hrvatskom, Srbijom i Crnom Gorom.", "Klikni unutar „potkovice” Hrvatske, zapadno od Srbije."], "objasnjenje": "Bosna i Hercegovina je između Hrvatske, Srbije i Crne Gore; Sava čini njenu severnu granicu; glavni grad je Sarajevo.", "iz_udzbenika": {"strana": 17, "odeljak": "Zadatak — tabela i nema karta", "tekst": "Bosna i Hercegovina je u tabeli pod rednim brojem 11; glavni grad je Sarajevo, a država je na Balkanskom poluostrvu.", "slika": "02-juzna-evropa/10-politicka-karta-juzne-evrope.jpg"}}, {"id": "drzave-klik-san-marino", "vrsta": "karta_klik", "tezina": "tesko", "pojmovi": ["san-marino", "italija", "minijaturne-drzave"], "pitanje": "Klikni na San Marino.", "cilj": {"mesto": "san-marino"}, "pomoc": ["San Marino je minijaturna država na Apeninskom poluostrvu, sa svih strana okružen function blankState() { return { v: STATE_VERSION, mode: 'ucenje', cur: '_sum', ucenje: null, tests: [], active: null, ime: '' }; }
function loadState() { try { const o = JSON.parse(localStorage.getItem(STATE_KEY)); return o && o.v === STATE_VERSION ? o : null; } catch (e) { return null; } }
let state = loadState() || blankState();
function save() { try { localStorage.setItem(STATE_KEY, JSON.stringify(state)); } catch (e) {} }
const att = () => state.tests.find(t => t.id === state.active) || null;
const helpOn = () => state.mode === 'ucenje' || (att() && att().phase === 'ispravka');
function curItems() { if (state.mode === 'ucenje') return state.ucenje.items; const a = att(); return a ? a.items : []; }
function byId(id) { return curItems().find(z => z.id === id) || null; }
function bucket() { if (state.mode === 'ucenje') return state.ucenje.b; const a = att(); return a.phase === 'ispravka' ? a.fix : a.b; }
function st(id) { const b = bucket(); return b[id] || (b[id] = { miss: 0, status: 'open', pts: null, ui: {}, log: [] }); }
function listIds() {   // the items of the current mode / test phase
  const items = curItems().map(z => z.id);
  const a = state.mode === 'test' && att();
  if (!a || a.phase !== 'ispravka') return items;
  return items.filter(id => { const t = a.b[id]; return t && t.pts < 3; });
}
function sections() { const a = state.mode === 'ucenje' ? state.ucenje : att(); return a ? a.sections : []; }
const deoNaslov = z => z.deoNaslov || SPEC.delovi[z.deo].naslov;
const numOf = z => curItems().findIndex(x => x.id === z.id) + 1;
const isDone = s => s.status !== 'open';
function steps(z) { return z.vrsta === 'gde_sam' ? z.tragovi.length - 1 : (z.pomoc || []).length; }   // help steps before the reveal
const ptsFor = miss => miss === 0 ? 3 : miss === 1 ? 2 : 1;
function registerPlaces(items) { for (const z of items) if (z.cilj && z.cilj._mesto) MAPI.mesta[z.cilj.mesto] = z.cilj._mesto; }
state.tests.forEach(t => registerPlaces(t.items));
if (state.ucenje) registerPlaces(state.ucenje.items);

function generate(kind, k, r, used) {
  const B = (SPEC.baza || {}).drzave || [], book = (SPEC.sastav || {}).iz_udzbenika || null;
  const free = B.filter(d => !used.has(d.iso));
  const big = free.filter(d => !d.mini);
  const take = list => { const d = pickN(list, 1, r)[0]; if (d) used.add(d.iso); return d; };
  const base = { generisan: true, pojmovi: [], iz_udzbenika: book };
  const up = t => TEZ[Math.min(2, TEZ.indexOf(t) + 1)];   // one level harder (capped)
  const hardest = ds => TEZ[Math.max(...ds.map(d => TEZ.indexOf(d.tezina)))];
  if (kind === 'glavni_gradovi') {
    const ds = pickN(big.filter(d => d.grad !== d.naziv), 4, r); ds.forEach(d => used.add(d.iso));
    if (ds.length < 3) return null;
    return Object.assign({}, base, { id: 'g-gradovi-' + k, vrsta: 'povezi', tezina: hardest(ds), pitanje: 'Poveži državu sa njenim glavnim gradom.',
      parovi: ds.map(d => [d.naziv, d.grad]),
      pomoc: ['Kreni od države koju najbolje znaš, pa isključuj.', 'Poluostrva: ' + ds.map(d => d.naziv + ' — ' + (d.poluostrvo || 'van poluostrva')).join(', ') + '.', 'Iz lekcije: tabela 17 država i njihovih glavnih gradova (str. 17).'],
      objasnjenje: ds.map(d => d.naziv + ' — ' + d.grad).join(', ') + '.' });
  }
  if (kind === 'karta_drzava') {
    const d = take(big); if (!d) return null;
    return Object.assign({}, base, { id: 'g-karta-' + d.iso, vrsta: 'karta_klik', tezina: d.tezina, pitanje: 'Klikni na državu: ' + d.naziv + '.', cilj: { drzava: d.iso },
      pomoc: [polFraza(d), 'Ova država ' + d.more + '.', 'Glavni grad joj je ' + d.grad + '.'],
      objasnjenje: d.naziv + ': ' + polFraza(d).toLowerCase().replace(/\.$/, '') + '; ' + d.more + '; glavni grad ' + d.grad + '.' });
  }
  if (kind === 'poluostrvo') {
    const d = take(free); if (!d) return null;
    const opts = ['Pirinejsko', 'Apeninsko', 'Balkansko'].map(p => ({ tekst: p + ' poluostrvo', tacan: d.poluostrvo === p }))
      .concat([{ tekst: 'Ni na jednom od tri poluostrva', tacan: !d.poluostrvo }]);
    return Object.assign({}, base, { id: 'g-pol-' + d.iso, vrsta: 'izbor', tezina: d.tezina, pitanje: 'Na kom poluostrvu se nalazi ' + d.naziv + '?', odgovori: opts,
      pomoc: ['Glavni grad joj je ' + d.grad + '.', 'Ova država ' + d.more + '.'], objasnjenje: d.naziv + ' — ' + polFraza(d).toLowerCase() });
  }
  if (kind === 'gde_glavni_grad') {
    const d = take(big); if (!d) return null;
    const slug = 'g-grad-' + d.iso, def = { naziv: d.grad, lat: d.lat, lon: d.lon, radius_km: 90 };
    return Object.assign({}, base, { id: 'g-grad-' + d.iso, vrsta: 'gde_sam', tezina: up(d.tezina), pitanje: 'Gde sam? Pročitaj trag i klikni glavni grad na karti.',
      cilj: { mesto: slug, _mesto: def },
      tragovi: ['Ja sam glavni grad države koja ' + d.more + '.', 'Moja država ' + (d.poluostrvo ? 'leži na ' + LOK[d.poluostrvo] + ' poluostrvu.' : 'ne leži ni na jednom od tri poluostrva.'), 'Ja sam glavni grad države ' + d.naziv + '.'],
      objasnjenje: d.grad + ', glavni grad države ' + d.naziv + '.' });
  }
  return null;
}
// A session (Učenje) or an attempt (Test): n items from the bank in the ratio sastav.odnos, spread over
// sections and item types (round-robin), ordered by section and, inside a section, by difficulty.
function drawSession(n, seed) {
  const r = seeded(String(seed)), S = SPEC.sastav || {}, used = new Set();
  const bank = ITEMS.map(z => JSON.parse(JSON.stringify(z)));
  const gdeo = { deoNaslov: 'Iz baze: države', deo: SPEC.delovi.length };
  Object.entries(S.generisano || {}).forEach(([kind, cnt]) => { for (let k = 0; k < cnt; k++) { const z = generate(kind, k, r, used); if (z) bank.push(Object.assign(z, gdeo)); } });
  n = Math.min(n, bank.length);
  const odnos = S.odnos || [40, 40, 20];
  const want = { lako: Math.round(n * odnos[0] / 100), tesko: Math.round(n * odnos[2] / 100) };
  want.srednje = n - want.lako - want.tesko;
  const rr = (list, key) => {   // shuffle, group by key, then take one from each group in turn
    const groups = {};
    for (const z of pickN(list, list.length, r)) (groups[key(z)] = groups[key(z)] || []).push(z);
    const keys = pickN(Object.keys(groups), Object.keys(groups).length, r), out = [];
    while (out.length < list.length) for (const k of keys) if (groups[k].length) out.push(groups[k].shift());
    return out;
  };
  const spread = list => {   // even over sections first, then over item types inside each section
    const bySec = {};
    for (const z of list) (bySec[z.deo] = bySec[z.deo] || []).push(z);
    const secs = Object.fromEntries(Object.entries(bySec).map(([d, zs]) => [d, rr(zs, z => z.vrsta)]));
    const keys = pickN(Object.keys(secs), Object.keys(secs).length, r), out = [];
    while (out.length < list.length) for (const k of keys) if (secs[k].length) out.push(secs[k].shift());
    return out;
  };
  const byLevel = Object.fromEntries(TEZ.map(t => [t, spread(bank.filter(z => z.tezina === t))]));
  const picked = [];
  for (const t of TEZ) picked.push(...byLevel[t].splice(0, want[t]));
  for (const t of ['srednje', 'lako', 'tesko']) while (picked.length < n && byLevel[t].length) picked.push(byLevel[t].shift());   // a level ran short
  picked.sort((a, b) => a.deo - b.deo || TEZ.indexOf(a.tezina) - TEZ.indexOf(b.tezina));
  const secs = [];
  for (const z of picked) { const name = deoNaslov(z); let sec = secs.find(x => x.naslov === name); if (!sec) secs.push(sec = { naslov: name, ids: [] }); sec.ids.push(z.id); }
  registerPlaces(picked);
  return { items: picked, sections: secs };
}
function newLearning() {
  const seed = Date.now(), d = drawSession((SPEC.sastav || {}).ucenje || 20, seed);
  state.ucenje = { id: 'u' + seed, items: d.items, sections: d.sections, b: {} };
  state.cur = d.items[0].id;
}
function startTest(ime) {
  const seed = Date.now(), d = drawSession((SPEC.sastav || {}).test || 15, seed);
  const a = { id: 't' + seed, seed, start: new Date(seed).toISOString(), end: null, ime: ime || '', items: d.items, sections: d.sections, b: {}, fix: {}, phase: 'test' };
  state.tests.push(a); state.active = a.id; state.ime = ime || state.ime;
  state.cur = d.items[0].id; save();
}
function testScore(a, which) { const b = a[which || 'b']; return a.items.reduce((n, z) => n + ((b[z.id] || {}).pts || 0), 0); }
function finishCheck() {   // a test attempt ends when all its items are answered
  const a = state.mode === 'test' && att();
  if (a && a.phase === 'test' && !a.end && a.items.every(z => isDone(a.b[z.id] || { status: 'open' }))) { a.end = new Date().toISOString(); a.score = testScore(a); a.max = a.items.length * 3; save(); }
}

// ---------- score + navigation ----------
function refreshScore() {
  const ids = listIds();
  let n = 0;
  for (const id of ids) { const s = bucket && (state.mode === 'ucenje' || att()) ? bucket()[id] : null; if (s && s.pts) n += s.pts; }
  document.getElementById('scoreN').textContent = state.mode === 'test' && !att() ? '—' : n;
  document.getElementById('scoreMax').textContent = state.mode === 'test' && !att() ? '—' : ids.length * 3;
  document.querySelectorAll('.ms-btn').forEach(b => b.classList.toggle('active', b.dataset.mode === state.mode));
  const rep = state.ucenje ? state.ucenje.items.filter(z => (state.ucenje.b[z.id] || {}).status === 'revealed').length : 0;
  const mr = document.getElementById('mRepeat');
  mr.textContent = 'Ponovi otkrivene (' + rep + ')'; mr.disabled = state.mode !== 'ucenje' || !rep;
  document.getElementById('mReset').textContent = state.mode === 'ucenje' ? 'Počni učenje ispočetka' : 'Odustani od ovog testa';
  document.getElementById('mReset').disabled = state.mode === 'test' && !(att() && !att().end);
}
function rowLabel(z) {

  return z.pitanje && !/^Dopuni rečenicu/.test(z.pitanje) ? z.pitanje : (z.tvrdnja || (z.tekst || '').replace(/\{\{(.+?)\}\}/g, '…'));
}
const fmtDate = iso => { const d = new Date(iso); return d.toLocaleDateString('sr-Latn') + ' ' + d.toLocaleTimeString('sr-Latn', { hour: '2-digit', minute: '2-digit' }); };
function renderNav() {

  }
  document.getElementById('navList').innerHTML = h;
  if (document.getElementById('app-filter').value) HubShell.applyFilter();
}

// ---------- outcome ----------
function fail(z, text, given) {
  const s = st(z.id);
  s.miss++;
  (s.log = s.log || []).push({ v: given || '', ok: false });
  const ended = s.miss > steps(z);
  if (ended) { s.status = helpOn() ? 'revealed' : 'failed'; s.pts = 0; toast(helpOn() ? 'Evo odgovora' : 'Netačno', false); }
  else toast(text || 'Netačno — pokušaj ponovo', false);
  finishCheck(); save(); renderItem(true); renderNav(); refreshScore();
  if (ended ? s.status === 'revealed' : helpOn() && !mobile()) openDrawer();
}
function succeed(z, given) {
  const s = st(z.id);
  s.status = 'ok'; s.pts = ptsFor(s.miss);
  (s.log = s.log || []).push({ v: given || '', ok: true });
  toast('Tačno! +' + s.pts, true);
  finishCheck(); save(); renderItem(false); renderNav(); refreshScore();
  openDrawer();
}

}

function renderChoice(z, s) {   // izbor + zakljuci (+ the correction step of tacno_netacno)
  const opts = shuffled(z.odgovori, z.id);
  const multi = z.odgovori.filter(o => o.tacan).length > 1;
  const ui = s.ui; ui.wrong = ui.wrong || []; ui.pick = ui.pick || [];
  const done = isDone(s), showRight = s.status === 'ok' || s.status === 'revealed';
  main.innerHTML = frame(z, s, '<h2 class="q">' + fmt(z.pitanje) + '</h2><div class="opts">' + opts.map(([o, i]) =>
    '<button type="button" class="opt' + (multi ? '' : ' round') + (ui.wrong.includes(i) ? ' wrong' : '') + (showRight && o.tacan ? ' right' : '') +
    (!done && ui.pick.includes(i) ? ' picked' : '') + '" data-i="' + i + '"' + (done || ui.wrong.includes(i) ? ' disabled' : '') + '><span class="box"></span><span>' + fmt(o.tekst) + '</span></button>').join('') + '</div>');

function parseCloze(t) {   // → [text, {answers}, text, …]

const P = MAPI.proj;
const toLonLat = (x, y) => [P.lon0 + x / P.sx, P.lat1 - y / P.sy];

  const h = Math.sin(dLa / 2) ** 2 + Math.cos(a[1] * r) * Math.cos(b[1] * r) * Math.sin(dLo / 2) ** 2; return 12742 * Math.asin(Math.sqrt(h)); }

  return null;
}
function mountMap(z, s, onClick) {
  const wrap = document.getElementById('mapwrap');
  wrap.innerHTML = document.getElementById('mapTpl').innerHTML + '<div class="zbar"><button type="button" data-z="1.5">+</button><button type="button" data-z="0.667">−</button><button type="button" data-z="0">⟳</button></div><div class="zhint">Točkić / +− za zum · prevuci za pomeranje</div>';
  const svg = wrap.querySelector('svg'), marks = svg.querySelector('.marks');
  let vb = s.ui.vb || [0, 0, P.w, P.h];
  const setVB = () => { svg.setAttribute('viewBox', vb.join(' ')); s.ui.vb = vb; };
  setVB();
  function zoom(f, cx, cy) {
    if (!f) { vb = [0, 0, P.w, P.h]; setVB(); return; }
    const nw = Math.min(P.w, Math.max(P.w / 14, vb[2] / f)), nh = nw * P.h / P.w;
    cx = cx == null ? vb[0] + vb[2] / 2 : cx; cy = cy == null ? vb[1] + vb[3] / 2 : cy;
    const rx = (cx - vb[0]) / vb[2], ry = (cy - vb[1]) / vb[3];

  wrap.querySelectorAll('.zbar button').forEach(b => b.addEventListener('click', () => zoom(+b.dataset.z)));
  svg.addEventListener('wheel', e => { e.preventDefault(); const p = svgPt(e); zoom(e.deltaY < 0 ? 1.25 : 0.8, p.x, p.y); }, { passive: false });
  let down = null;
  svg.addEventListener('pointerdown', e => { down = { x: e.clientX, y: e.clientY, vb: vb.slice(), moved: false, target: e.target }; svg.setPointerCapture(e.pointerId); });

  });

    mark(x, y, color, label) { const r = vb[2] / 150; marks.insertAdjacentHTML('beforeend', '<g class="mk"><circle cx="' + x + '" cy="' + y + '" r="' + r + '" fill="' + color + '"/>' + (label ? '<text x="' + (x + r * 1.4) + '" y="' + (y + r * .5) + '" fill="' + color + '" style="font-size:' + (vb[2] / 70) + 'px">' + esc(label) + '</text>' : '') + '</g>'); },
    country(iso, cls) { svg.querySelectorAll('path[data-iso="' + iso + '"]').forEach(p => p.classList.add(cls)); } };

function renderMapItem(z, s) {

  main.innerHTML = frame(z, s, '<h2 class="q">' + fmt(z.pitanje) + '</h2>' +
    (gs ? '<ul class="clues">' + z.tragovi.slice(0, nClues).map((t, i) => '<li><span class="k">Trag ' + (i + 1) + '</span>' + fmt(t) + '</li>').join('') + '</ul>' : '') +

}
