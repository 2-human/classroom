# Sastav: svaka instanca kviza se izvlači nanovo iz banke (napisani zadaci + generisani iz baze) u odnosu `odnos`.
sastav:
  pitanja: 25
  odnos: [40, 40, 20]
  generisano: {glavni_gradovi: 2, karta_drzava: 6, poluostrvo: 4, gde_glavni_grad: 4}
  iz_udzbenika:
    strana: 17
    odeljak: Zadatak — tabela 17 država
    tekst: U tabeli se za svaku od 17 država Južne Evrope upisuju glavni grad i poluostrvo na kome leži, a države se rednim brojevima označavaju na nemoj političkoj karti. Dve države nisu ni na jednom od tri poluostrva.
    slika: 02-juzna-evropa/10-politicka-karta-juzne-evrope.jpg
