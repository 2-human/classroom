    - {iso: MLT, naziv: Malta, grad: Valeta, lat: 35.90, lon: 14.51, poluostrvo: null, more: je ostrvo u Sredozemnom moru, mini: true, tezina: tesko}
    - {iso: SVN, naziv: Slovenija, grad: Ljubljana, lat: 46.06, lon: 14.51, poluostrvo: Balkansko, more: izlazi na Jadransko more kratkom obalom, tezina: tesko}
    - {iso: HRV, naziv: Hrvatska, grad: Zagreb, lat: 45.81, lon: 15.98, poluostrvo: Balkansko, more: ima dugu i razuđenu obalu Jadranskog mora, tezina: srednje}
    - {iso: BIH, naziv: Bosna i Hercegovina, grad: Sarajevo, lat: 43.86, lon: 18.41, poluostrvo: Balkansko, more: izlazi na Jadransko more samo kod Neuma, tezina: tesko}
    - {iso: SRB, naziv: Srbija, grad: Beograd, lat: 44.82, lon: 20.46, poluostrvo: Balkansko, more: nema izlaz na more, tezina: srednje}
    - {iso: MNE, naziv: Crna Gora, grad: Podgorica, lat: 42.44, lon: 19.26, poluostrvo: Balkansko, more: izlazi na Jadransko more, tezina: tesko}
    - {iso: MKD, naziv: Severna Makedonija, grad: Skoplje, lat: 42.00, lon: 21.43, poluostrvo: Balkansko, more: nema izlaz na more, tezina: tesko}
    - {iso: ALB, naziv: Albanija, grad: Tirana, lat: 41.33, lon: 19.82, poluostrvo: Balkansko, more: izlazi na Jadransko i Jonsko more, tezina: srednje}
    - {iso: GRC, naziv: Grčka, grad: Atina, lat: 37.98, lon: 23.73, poluostrvo: Balkansko, more: izlazi na Egejsko, Jonsko i Sredozemno more, tezina: lako}
