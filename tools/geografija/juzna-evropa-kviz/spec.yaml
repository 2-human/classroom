# Južna Evropa — kviz po lekciji (tip: lesson-quiz; vidi templates/lesson-quiz/README.md).
# Pitanja su napisana sopstvenim rečima na osnovu lekcije „Južna Evropa” (7. razred, str. 14–17).
# `iz_udzbenika` (posle odgovora, u fioci): strana, odeljak, sažetak sopstvenim rečima i slika iz
# privatnog tools/geografija/_source/slike-7/ (prikazuje se samo kad taj folder postoji — van git-a).
title: Južna Evropa — kviz
title_short: Južna Evropa
locale: sr
nivo: osnovna
razred: 7
banka_lekcije: [2]
description: >-
  Kviz za lekciju Južna Evropa: činjenice, tačno/netačno sa ispravkom, dopunjavanje, povezivanje,
  zaključivanje i karta (klikni državu, „Gde sam?”). Posle svake greške u fioci desno stiže sledeći
  stepenik pomoći.

karta:
  extent: {lon: [-10.5, 30.5], lat: [34.3, 47.6]}
  mid_lat_for_aspect: 41
  geo_data: ../../../shared/data/countries.geojson
  # Države Južne Evrope (klikabilne). KOS se crta i broji kao deo Srbije (stav udžbenika).
  drzave:
    PRT: Portugalija
    ESP: Španija
    AND: Andora
    ITA: Italija
    VAT: Vatikan
    SMR: San Marino
    MCO: Monako
    MLT: Malta
    SVN: Slovenija
    HRV: Hrvatska
    BIH: Bosna i Hercegovina
    SRB: Srbija
    MNE: Crna Gora
    MKD: Severna Makedonija
    ALB: Albanija
    GRC: Grčka
    BGR: Bugarska
  spoji: {KOS: SRB}
  # Tačke za zadatke kojima je cilj mesto (premale ili nisu država). Ne crtaju se dok se ne pogode.
  mesta:
    vatikan: {naziv: Vatikan, lat: 41.903, lon: 12.453, radius_km: 60}
    andora: {naziv: Andora, lat: 42.55, lon: 1.58, radius_km: 60}
    malta: {naziv: Malta, lat: 35.90, lon: 14.45, radius_km: 70}
    san-marino: {naziv: San Marino, lat: 43.94, lon: 12.45, radius_km: 60}
    lisabon: {naziv: Lisabon, lat: 38.72, lon: -9.14, radius_km: 90}
    atina: {naziv: Atina, lat: 37.98, lon: 23.73, radius_km: 90}
    santorini: {naziv: Santorini, lat: 36.40, lon: 25.43, radius_km: 80}
    beograd: {naziv: Beograd, lat: 44.82, lon: 20.46, radius_km: 80}
    barselona: {naziv: Barselona, lat: 41.39, lon: 2.17, radius_km: 90}

# Baza znanja za test: činjenice iz lekcije (tabela 17 država, str. 17). Iz nje se svaki test
# generišu novi zadaci (glavni gradovi, klikni državu, poluostrvo, „Gde sam?” za glavni grad).
# `more` je nastavak rečenice „Ova država …”. `mini: true` = premala za klik na karti.
# `tezina` = koliko je država poznata / laka za pronalaženje (određuje težinu generisanih zadataka).
baza:
  drzave:
    - {iso: PRT, naziv: Portugalija, grad: Lisabon, lat: 38.72, lon: -9.14, poluostrvo: Pirinejsko, more: izlazi na Atlantski okean, tezina: lako}
    - {iso: ESP, naziv: Španija, grad: Madrid, lat: 40.42, lon: -3.70, poluostrvo: Pirinejsko, more: izlazi i na Atlantski okean i na Sredozemno more, tezina: lako}
    - {iso: AND, naziv: Andora, grad: Andora la Velja, lat: 42.51, lon: 1.52, poluostrvo: Pirinejsko, more: nema izlaz na more — u planinama je, mini: true, tezina: tesko}
    - {iso: ITA, naziv: Italija, grad: Rim, lat: 41.90, lon: 12.50, poluostrvo: Apeninsko, more: sa tri strane izlazi na Sredozemno more, tezina: lako}
    - {iso: VAT, naziv: Vatikan, grad: Vatikan, lat: 41.90, lon: 12.45, poluostrvo: Apeninsko, more: nema izlaz na more — nalazi se u jednom gradu, mini: true, tezina: tesko}
    - {iso: SMR, naziv: San Marino, grad: San Marino, lat: 43.94, lon: 12.45, poluostrvo: Apeninsko, more: nema izlaz na more, mini: true, tezina: tesko}
