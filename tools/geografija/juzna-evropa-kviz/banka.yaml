# Banka zadataka — Južna Evropa (7. razred, str. 14–17). Spaja se u spec.yaml: `delovi` zamenjuje
# spec-ove delove, `mesta` se dodaju u karta.mesta. Svaki zadatak ima `tezina` (lako | srednje | tesko).
# Pitanja su napisana sopstvenim rečima na osnovu beleške lekcije.

mesta:
  pirineji: {naziv: Pirineji, lat: 42.70, lon: 0.50, radius_km: 160}
  rim: {naziv: Rim, lat: 41.90, lon: 12.50, radius_km: 80}
  madrid: {naziv: Madrid, lat: 40.42, lon: -3.70, radius_km: 90}
  sofija: {naziv: Sofija, lat: 42.70, lon: 23.32, radius_km: 80}
  napulj: {naziv: Napulj, lat: 40.85, lon: 14.27, radius_km: 80}
  zemlja-baska: {naziv: Zemlja Baska, lat: 43.00, lon: -2.60, radius_km: 120}
  cinkve-tere: {naziv: Činkve Tere, lat: 44.13, lon: 9.71, radius_km: 70}
  monako: {naziv: Monako, lat: 43.74, lon: 7.42, radius_km: 60}

delovi:
  - naslov: Položaj i granice
    zadaci:
      - id: polozaj-poluostrva
        vrsta: izbor
        tezina: lako
        pojmovi: [balkansko-poluostrvo, apeninsko-poluostrvo, pirinejsko-poluostrvo]
        pitanje: Koja poluostrva čine Južnu Evropu? (Više tačnih.)
        odgovori:
          - {tekst: Pirinejsko, tacan: true}
          - {tekst: Apeninsko, tacan: true}
          - {tekst: Balkansko, tacan: true}
          - {tekst: Skandinavsko, tacan: false}
          - {tekst: Krimsko, tacan: false}
        pomoc:
          - Regija je „južna” — traži poluostrva koja zalaze u Sredozemno more.
          - Tačna su tri poluostrva; jedno od ponuđenih je na severu Evrope, a jedno uz Crno more na istoku.
          - "Iz lekcije: regiju čine tri velika poluostrva — od Atlantika na zapadu do Crnog mora na istoku."
        objasnjenje: Južnu Evropu čine Pirinejsko, Apeninsko i Balkansko poluostrvo. Skandinavsko je na severu, a Krim pripada istočnoj Evropi.
        iz_udzbenika:
          strana: 14
          odeljak: Položaj i granice regije
          tekst: Južna Evropa obuhvata tri velika poluostrva — Pirinejsko, Apeninsko i Balkansko — koja zalaze u Sredozemno more. Na fizičkoj karti se vidi kako ih na severu od ostatka Evrope odvajaju planine (Pirineji, Alpi) i reke (Sava, Dunav).
          slika: 02-juzna-evropa/01-fizicka-karta-juzne-evrope.jpg

      - id: polozaj-dopuni-poluostrva
        vrsta: dopuni
        tezina: lako
        pojmovi: [pirinejsko-poluostrvo, balkansko-poluostrvo]
        pitanje: Dopuni rečenicu rečima iz banke.
        tekst: Na zapadu Južne Evrope je {{Pirinejsko}} poluostrvo, a na njenom istoku {{Balkansko}} poluostrvo.
        ponudjene: [Pirinejsko, Balkansko, Skandinavsko]
        pomoc:
          - Zapadno poluostrvo izlazi na Atlantski okean, a istočno dopire do Crnog mora.
          - Skandinavsko poluostrvo je na severu Evrope, pa ne pripada ovoj regiji.
          - "Iz lekcije: od zapada ka istoku nižu se Pirinejsko, Apeninsko i Balkansko poluostrvo."
        objasnjenje: Pirinejsko poluostrvo je na zapadu (Španija, Portugalija), a Balkansko na istoku regije; između njih je Apeninsko.
        iz_udzbenika:
          strana: 14
          odeljak: Položaj i granice regije
          tekst: Regija se pruža preko tri poluostrva — Pirinejskog na zapadu, Apeninskog u sredini i Balkanskog na istoku.
          slika: 02-juzna-evropa/01-fizicka-karta-juzne-evrope.jpg

      - id: polozaj-povezi-poluostrva
        vrsta: povezi
        tezina: lako
        pojmovi: [pirinejsko-poluostrvo, apeninsko-poluostrvo, balkansko-poluostrvo]
        pitanje: Poveži poluostrvo sa opisom njegovog položaja.
        parovi:
          - [Pirinejsko poluostrvo, "krajnji jugozapad Evrope, između Atlantika i Sredozemlja"]
          - [Apeninsko poluostrvo, "„čizma” u sredini Sredozemnog mora"]
          - [Balkansko poluostrvo, "jugoistok Evrope, sve do Crnog mora"]
        pomoc:
          - Poređaj poluostrva od zapada ka istoku.
          - Poluostrvo u obliku čizme je Italija.
          - "Iz lekcije: Pirinejsko je na zapadu, Apeninsko u sredini, Balkansko na istoku regije."
        objasnjenje: Pirinejsko — jugozapad uz Atlantik; Apeninsko — „čizma” u sredini Sredozemlja; Balkansko — jugoistok do Crnog mora.
        iz_udzbenika:
          strana: 14
          odeljak: Položaj i granice regije
          tekst: Tri poluostrva regije nižu se od zapada ka istoku — Pirinejsko uz Atlantski okean, Apeninsko u sredini Sredozemnog mora i Balkansko do Crnog mora.
          slika: 02-juzna-evropa/01-fizicka-karta-juzne-evrope.jpg

      - id: polozaj-dopuni-povrsina
        vrsta: dopuni
        tezina: srednje
        pojmovi: [juzna-evropa]
        pitanje: Dopuni rečenicu.
        tekst: Južna Evropa zauzima oko {{1,4|1.4}} miliona km², što je oko {{14}} % površine Evrope; u njoj živi oko {{159}} miliona ljudi.
        ponudjene: ["1,4", "14", "159", "4,1", "41", "59"]
        pomoc:
          - Površina je nešto veća od jednog miliona km².
          - Udeo u Evropi je malo veći od desetine; stanovnika ima između 150 i 160 miliona.
          - "Iz lekcije: 1,4 miliona km² — 14% Evrope; oko 159 miliona stanovnika."
        objasnjenje: Oko 1,4 miliona km² (14% Evrope) i oko 159 miliona stanovnika.
        iz_udzbenika:
          strana: 14
          odeljak: Položaj i granice regije
          tekst: Regija zauzima oko 1,4 miliona km², što je 14% površine Evrope. U njoj živi oko 159 miliona stanovnika, pretežno naroda indoevropske porodice.
          slika: 02-juzna-evropa/10-politicka-karta-juzne-evrope.jpg

      - id: polozaj-izbor-povrsina
        vrsta: izbor
        tezina: srednje
        pojmovi: [juzna-evropa]
        pitanje: Kolika je približno površina Južne Evrope?
        odgovori:
          - {tekst: "oko 1,4 miliona km²", tacan: true}
          - {tekst: "oko 14 miliona km²", tacan: false}
          - {tekst: "oko 140 hiljada km²", tacan: false}
          - {tekst: "oko 4,1 milion km²", tacan: false}
        pomoc:
          - Cela Evropa ima oko 10 miliona km², a Južna Evropa je samo njen manji deo.
          - Broj je nešto veći od jednog miliona.
          - "Iz lekcije: regija zauzima oko 1,4 miliona km²."
        objasnjenje: Južna Evropa ima oko 1,4 miliona km² — to je oko 14% površine Evrope. Broj 14 miliona bio bi veći od cele Evrope.
        iz_udzbenika:
          strana: 14
          odeljak: Položaj i granice regije
          tekst: Površina regije je oko 1,4 miliona km², odnosno 14% površine Evrope.

      - id: polozaj-tn-udeo
        vrsta: tacno_netacno
        tezina: srednje
        pojmovi: [juzna-evropa]
        tvrdnja: Južna Evropa zauzima oko 41% površine Evrope.
        tacno: false
        ispravke:
          - {tekst: "Zauzima oko 14% površine Evrope.", tacan: true}
          - {tekst: "Zauzima oko 4% površine Evrope.", tacan: false}
          - {tekst: "Zauzima tačno polovinu Evrope.", tacan: false}
        pomoc:
          - Tri poluostrva su samo manji deo kontinenta — razmisli da li bi to moglo biti skoro pola Evrope.
          - Cifre su ispremeštane; pravi udeo je malo veći od desetine.
          - "Iz lekcije: 1,4 miliona km² — 14% Evrope."
        objasnjenje: Netačno — Južna Evropa zauzima oko 14% površine Evrope (oko 1,4 miliona km²).
        iz_udzbenika:
          strana: 14
          odeljak: Položaj i granice regije
          tekst: Regija zauzima oko 1,4 miliona km², što je 14% površine Evrope.

      - id: polozaj-tn-juzna-granica
        vrsta: tacno_netacno
        tezina: lako
        pojmovi: [sredozemno-more]
        tvrdnja: Na jugu Južnu Evropu ograničava Sredozemno more.
        tacno: true
        pomoc:
          - Pogledaj šta se nalazi južno od sva tri poluostrva.
          - Južno od regije nije kopno, već more između Evrope i Afrike.
          - "Iz lekcije: na jugu je granica Sredozemno more."
        objasnjenje: Tačno — južna granica regije je Sredozemno more, koje je odvaja od Afrike.
        iz_udzbenika:
          strana: 14
          odeljak: Položaj i granice regije
          tekst: Na jugu regiju ograničava Sredozemno more, a na severu planine i reke.
          slika: 02-juzna-evropa/01-fizicka-karta-juzne-evrope.jpg

      - id: polozaj-tn-granica
        vrsta: tacno_netacno
        tezina: srednje
        pojmovi: [pirineji, alpi, sava, dunav]
        tvrdnja: Severnu granicu Južne Evrope čine Pirineji, Alpi, reka Sava i donji tok Dunava.
        tacno: true
        pomoc:
          - Zamisli liniju od Atlantika do Crnog mora koja odvaja poluostrva od ostatka Evrope.
          - Na zapadu je granica planinska, a na istoku je čine reke.
          - "Iz lekcije: granica ide preko Pirineja i Alpa, pa rekom Savom i donjim tokom Dunava."
        objasnjenje: Tačno — na severu regiju ograničavaju Pirineji, Alpi, Sava i donji tok Dunava; na jugu Sredozemno more.
        iz_udzbenika:
          strana: 14
          odeljak: Položaj i granice regije
          tekst: Na jugu je granica Sredozemno more. Na severu granicu čine Pirineji, Alpi, reka Sava i donji tok Dunava — zapadni deo granice je planinski, a istočni rečni.
          slika: 02-juzna-evropa/01-fizicka-karta-juzne-evrope.jpg

      - id: polozaj-tn-dunav
        vrsta: tacno_netacno
        tezina: srednje
        pojmovi: [dunav, sava]
        tvrdnja: Ceo tok Dunava, od izvora do ušća, čini deo severne granice Južne Evrope.
        tacno: false
        ispravke:
          - {tekst: "Granicu čini samo donji tok Dunava (uz reku Savu).", tacan: true}
          - {tekst: "Granicu čini samo gornji tok Dunava.", tacan: false}
          - {tekst: "Dunav uopšte nije deo granice regije.", tacan: false}
        pomoc:
          - Dunav izvire u Nemačkoj — da li je i taj deo granica Južne Evrope?
          - Granica prati samo deo toka koji je bliži Crnom moru.
          - "Iz lekcije: na severu granicu čine Pirineji, Alpi, Sava i donji tok Dunava."
        objasnjenje: Netačno — granica je samo donji tok Dunava (od ušća Save do Crnog mora), a ne cela reka.
        iz_udzbenika:
          strana: 14
          odeljak: Položaj i granice regije
          tekst: Istočni deo severne granice je rečni — reka Sava i donji tok Dunava, koji teče ka Crnom moru.
          slika: 02-juzna-evropa/01-fizicka-karta-juzne-evrope.jpg

      - id: polozaj-izbor-alpi
        vrsta: izbor
        tezina: lako
        pojmovi: [alpi, apeninsko-poluostrvo]
        pitanje: Koje planine se nalaze severno od Apeninskog poluostrva i čine deo granice Južne Evrope?
        odgovori:
          - {tekst: Alpi, tacan: true}
          - {tekst: Andi, tacan: false}
          - {tekst: Himalaji, tacan: false}
          - {tekst: Ural, tacan: false}
        pomoc:
          - Traži planine koje su u Evropi.
          - Ostale ponuđene planine su u Južnoj Americi, Aziji i na granici Evrope i Azije.
          - "Iz lekcije: severnu granicu regije čine Pirineji, Alpi, Sava i donji tok Dunava."
        objasnjenje: Alpi su luk visokih planina severno od Apeninskog poluostrva i deo su severne granice regije.
        iz_udzbenika:
          strana: 14
          odeljak: Položaj i granice regije
          tekst: Na fizičkoj karti Alpi se vide kao smeđi luk iznad Apeninskog poluostrva; zajedno sa Pirinejima čine planinski deo severne granice.
          slika: 02-juzna-evropa/01-fizicka-karta-juzne-evrope.jpg

      - id: polozaj-izbor-granica
        vrsta: izbor
        tezina: tesko
        pojmovi: [pirineji, alpi, sava, dunav]
        pitanje: Šta od navedenog čini severnu granicu Južne Evrope? (Više tačnih.)
        odgovori:
          - {tekst: Pirineji, tacan: true}
          - {tekst: Alpi, tacan: true}
          - {tekst: reka Sava, tacan: true}
          - {tekst: donji tok Dunava, tacan: true}
          - {tekst: gornji tok Dunava, tacan: false}
          - {tekst: reka Drava, tacan: false}
          - {tekst: Apenini, tacan: false}
        pomoc:
          - Granica odvaja poluostrva od ostatka Evrope — planine koje su UNUTAR nekog poluostrva nisu granica.
          - Tačna su četiri odgovora; od Dunava samo jedan deo toka, a od dve reke u Hrvatskoj samo jedna.
          - "Iz lekcije: Pirineji, Alpi, reka Sava i donji tok Dunava."
        objasnjenje: Granicu čine Pirineji, Alpi, Sava i donji tok Dunava. Apenini su unutar Apeninskog poluostrva, Drava nije granica, a gornji tok Dunava je u Srednjoj Evropi.
        iz_udzbenika:
          strana: 14
          odeljak: Položaj i granice regije
          tekst: Severnu granicu čine Pirineji, Alpi, reka Sava i donji tok Dunava. Apenini se pružaju duž Apeninskog poluostrva, pa nisu granica regije.
          slika: 02-juzna-evropa/01-fizicka-karta-juzne-evrope.jpg

      - id: polozaj-dopuni-granica
        vrsta: dopuni
        tezina: tesko
        pojmovi: [pirineji, alpi, sava, dunav]
        pitanje: Dopuni rečenicu (bez ponuđenih reči).
        tekst: Na severu granicu Južne Evrope čine planine {{Pirineji}} i {{Alpi}}, zatim reka {{Sava}} i donji tok reke {{Dunav|Dunava}}.
        pomoc:
          - Granica počinje planinama između Španije i Francuske, nastavlja se planinama iznad Italije.
          - Na istoku se granica nastavlja rekama — prva protiče kroz Zagreb, a uliva se u drugu u Beogradu.
          - "Iz lekcije: Pirineji, Alpi, reka Sava i donji tok Dunava."
        objasnjenje: Pirineji i Alpi čine planinski, a Sava i donji tok Dunava rečni deo severne granice.
        iz_udzbenika:
          strana: 14
          odeljak: Položaj i granice regije
          tekst: Na severu granicu čine Pirineji, Alpi, reka Sava i donji tok Dunava; na jugu je Sredozemno more.
          slika: 02-juzna-evropa/01-fizicka-karta-juzne-evrope.jpg

      - id: polozaj-povezi-planine
        vrsta: povezi
        tezina: srednje
        pojmovi: [pirineji, alpi, apenini, balkanske-planine]
        pitanje: Poveži planinski lanac sa mestom gde se nalazi.
        parovi:
          - [Pirineji, između Španije i Francuske]
          - [Alpi, severno od Apeninskog poluostrva]
          - [Apenini, duž celog Apeninskog poluostrva]
          - [Balkanske planine, u Bugarskoj i na istoku Srbije]
        pomoc:
          - Naziv planina često odgovara nazivu poluostrva.
          - Jedan lanac je „kičma” Italije, a drugi je severno od nje, kao luk.
          - "Iz lekcije: na nemoj karti označavaju se Pirineji, Apenini i Balkanske planine; Alpi su deo granice."
        objasnjenje: Pirineji — Španija/Francuska; Alpi — severno od Italije; Apenini — duž Apeninskog poluostrva; Balkanske (Stara) planine — Bugarska i istok Srbije.
        iz_udzbenika:
          strana: 14
          odeljak: Zadatak — nema fizička karta
          tekst: Na nemoj fizičkoj karti brojevima se označavaju tri poluostrva i tri planinska lanca — Pirineji, Apenini i Balkanske planine — a imenuju se i objekti koji čine granicu regije.
          slika: 02-juzna-evropa/01-fizicka-karta-juzne-evrope.jpg

      - id: polozaj-tn-mora
        vrsta: tacno_netacno
        tezina: lako
        pojmovi: [sredozemno-more, crno-more, atlantski-okean]
        tvrdnja: Južna Evropa izlazi samo na Sredozemno more.
        tacno: false
        ispravke:
          - {tekst: "Izlazi na Sredozemno more, Crno more i Atlantski okean.", tacan: true}
          - {tekst: "Izlazi samo na Atlantski okean.", tacan: false}
          - {tekst: "Izlazi na Sredozemno more i Severno more.", tacan: false}
        pomoc:
          - Pogledaj obe krajnje tačke regije — Portugaliju na zapadu i Bugarsku na istoku.
          - Na zapadu je okean, a na istoku jedno more koje nije deo Sredozemlja.
          - "Iz lekcije: regija izlazi na tri vodene celine."
        objasnjenje: Netačno — Južna Evropa izlazi na Sredozemno more, Crno more (Bugarska) i Atlantski okean (Portugalija, Španija).
        iz_udzbenika:
          strana: 14
          odeljak: Položaj i granice regije
          tekst: 'Regija izlazi na tri vodene celine: Sredozemno more, Crno more i Atlantski okean. Zbog toga su ovde razvijeni ribolov, brodogradnja i pomorski saobraćaj.'
          slika: 02-juzna-evropa/01-fizicka-karta-juzne-evrope.jpg

      - id: polozaj-izbor-vodene-celine
        vrsta: izbor
        tezina: lako
        pojmovi: [sredozemno-more, crno-more, atlantski-okean]
        pitanje: Na koje vodene celine izlazi Južna Evropa? (Više tačnih.)
        odgovori:
          - {tekst: Sredozemno more, tacan: true}
          - {tekst: Crno more, tacan: true}
          - {tekst: Atlantski okean, tacan: true}
          - {tekst: Baltičko more, tacan: false}
          - {tekst: Tihi okean, tacan: false}
        pomoc:
          - Traži mora i okean koji okružuju jug Evrope — ne sever.
          - Tačne su tri vodene celine; jedna je okean na zapadu.
          - "Iz lekcije: regija izlazi na Sredozemno more, Crno more i Atlantski okean."
        objasnjenje: Sredozemno more, Crno more i Atlantski okean. Baltičko more je na severu Evrope, a Tihi okean je daleko od Evrope.
        iz_udzbenika:
          strana: 14
          odeljak: Položaj i granice regije
          tekst: Regija izlazi na tri vodene celine — Sredozemno more, Crno more i Atlantski okean.
          slika: 02-juzna-evropa/01-fizicka-karta-juzne-evrope.jpg

      - id: polozaj-zakljuci-ime
        vrsta: zakljuci
        tezina: lako
        pojmovi: [juzna-evropa, sredozemno-more]
        pitanje: Zašto se ova regija zove baš „Južna Evropa”?
        odgovori:
          - {tekst: "Zauzima južni deo kontinenta, uz Sredozemno more.", tacan: true}
          - {tekst: "Zato što su u njoj sve reke okrenute ka jugu.", tacan: false}
          - {tekst: "Zato što je u njoj uvek leto.", tacan: false}
          - {tekst: "Zato što je najmanja regija Evrope.", tacan: false}
        pomoc:
          - "Korak 1: Pogledaj na karti Evrope gde se nalaze tri poluostrva — na severu ili na jugu kontinenta?"
          - "Korak 2: Šta je južno od njih — kopno ili more?"
          - "Iz lekcije: regiju čine tri južna poluostrva, a na jugu je ograničava Sredozemno more."
        objasnjenje: Regija zauzima južni deo Evrope — tri poluostrva koja zalaze u Sredozemno more.
        iz_udzbenika:
          strana: 14
          odeljak: Položaj i granice regije
          tekst: Tri poluostrva regije zalaze u Sredozemno more, koje je južna granica Južne Evrope.
          slika: 02-juzna-evropa/01-fizicka-karta-juzne-evrope.jpg

      - id: polozaj-zakljuci-dunav
        vrsta: zakljuci
        tezina: srednje
        pojmovi: [dunav, bugarska, crno-more]
        pitanje: Na nemoj karti tražiš granicu Južne Evrope između Beograda i Crnog mora. Šta treba da pratiš?
        odgovori:
          - {tekst: "Donji tok Dunava, koji teče ka Crnom moru.", tacan: true}
          - {tekst: "Greben Alpa.", tacan: false}
          - {tekst: "Obalu Jadranskog mora.", tacan: false}
          - {tekst: "Greben Pirineja.", tacan: false}
        pomoc:
          - "Korak 1: Koje su planine na zapadu granice, a šta je na njenom istoku — planine ili reke?"
          - "Korak 2: Koja reka protiče kroz Beograd i uliva se u Crno more?"
          - "Iz lekcije: istočni deo severne granice čine Sava i donji tok Dunava."
        objasnjenje: Istočno od Beograda granica prati donji tok Dunava sve do Crnog mora; Alpi i Pirineji su na zapadu, a Jadran je na jugu.
        iz_udzbenika:
          strana: 14
          odeljak: Položaj i granice regije
