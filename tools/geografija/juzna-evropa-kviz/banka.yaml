          - Kanal je otvorio put ka Indiji i Dalekom istoku.
          - Okean nosi ime po zemlji ka kojoj su brodovi plovili.
          - "Iz lekcije: kanalom Evropa dobija izlaz na Indijski okean."
        objasnjenje: Suecki kanal je Evropi otvorio kraći put na Indijski okean — do Indije i Dalekog istoka.
        iz_udzbenika:
          strana: 15
          odeljak: Kulturna obeležja — istorija
          tekst: Izgradnjom Sueckog kanala Evropa je dobila izlaz na Indijski okean i vezu sa Indijom i Dalekim istokom.

      - id: istorija-dopuni-suec
        vrsta: dopuni
        tezina: srednje
        pojmovi: [suecki-kanal, sredozemno-more]
        pitanje: Dopuni rečenicu (rad sa atlasom).
        tekst: Suecki kanal, u Egiptu, spaja {{Sredozemno}} more i {{Crveno}} more.
        ponudjene: [Sredozemno, Crveno, Crno, Kaspijsko, Jadransko]
        pomoc:
          - Kanal je u Egiptu, između Afrike i Azije.
          - Jedno more je na severu kanala i oplakuje Južnu Evropu, a drugo nosi ime po boji i vodi ka Indijskom okeanu.
          - "Iz lekcije: u atlasu se vidi da kanal spaja Sredozemno i Crveno more."
        objasnjenje: Suecki kanal spaja Sredozemno i Crveno more, a preko Crvenog mora brodovi stižu u Indijski okean.
        iz_udzbenika:
          strana: 15
          odeljak: Kulturna obeležja — istorija
          tekst: U tekstu se uz pomoć atlasa proverava koja mora povezuje Suecki kanal — to su Sredozemno i Crveno more.

      - id: istorija-zakljuci-suec
        vrsta: zakljuci
        tezina: tesko
        pojmovi: [suecki-kanal, sredozemno-more]
        pitanje: Izgradnja Sueckog kanala ponovo je povećala značaj Južne Evrope. Kako?
        odgovori:
          - {tekst: "Brodovi iz Evrope ka Indiji i Dalekom istoku sada idu kroz Sredozemno more, pa sredozemne luke ponovo leže na glavnom putu.", tacan: true}
          - {tekst: "Kanal je spojio Sredozemno more sa Atlantskim okeanom.", tacan: false}
          - {tekst: "Kanalom je Južna Evropa dobila vezu sa Amerikom.", tacan: false}
          - {tekst: "Kanal je skratio put između Španije i Grčke.", tacan: false}
        pomoc:
          - "Korak 1: Koja dva mora povezuje Suecki kanal? (Pogledaj u atlasu — Egipat.)"
          - "Korak 2: Kojim putem su brodovi išli u Indiju pre kanala — i koliko je on bio duži?"
          - "Iz lekcije: kanalom Evropa dobija izlaz na Indijski okean i vezu sa Indijom i Dalekim istokom."
        objasnjenje: Kanal spaja Sredozemno i Crveno more; put ka Indiji više ne ide oko Afrike, već kroz Sredozemlje — pored luka Južne Evrope.
        iz_udzbenika:
          strana: 15
          odeljak: Kulturna obeležja — istorija
          tekst: Izgradnjom Sueckog kanala Evropa je dobila izlaz na Indijski okean i vezu sa Indijom i Dalekim istokom kroz Sredozemno more, pa je privredni značaj regije ponovo porastao. Kanal spaja Sredozemno i Crveno more (proveri u atlasu).

      - id: istorija-povezi-pojmovi
        vrsta: povezi
        tezina: lako
        pojmovi: [partenon, suecki-kanal, novi-svet]
        pitanje: Poveži pojam sa njegovim objašnjenjem.
        parovi:
          - [Partenon, hram boginje Atine u Atini]
          - [Suecki kanal, veza Sredozemnog i Crvenog mora]
          - [Novi svet, kontinenti otkriveni u doba velikih otkrića]
        pomoc:
          - Jedan pojam je građevina, jedan je plovni put, a jedan je naziv za grupu kontinenata.
          - Kanal je delo ljudi i spaja dva mora.
          - "Iz lekcije: Partenon — hram u Atini; Suecki kanal — Sredozemno i Crveno more; Novi svet — Amerike, Australija, Antarktik."
        objasnjenje: Partenon — hram boginje Atine; Suecki kanal — spaja Sredozemno i Crveno more; Novi svet — kontinenti otkriveni u doba velikih geografskih otkrića.
        iz_udzbenika:
          strana: 15
          odeljak: Kulturna obeležja — istorija
          tekst: U lekciji se pominju Partenon (hram boginje Atine), Suecki kanal (spaja Sredozemno i Crveno more) i Novi svet (kontinenti otkriveni u doba velikih geografskih otkrića).
          slika: 02-juzna-evropa/02-partenon.jpg

      - id: istorija-povezi-dogadjaji
        vrsta: povezi
        tezina: srednje
        pojmovi: [mikenska-civilizacija, anticka-grcka, velika-geografska-otkrica, suecki-kanal]
        pitanje: Poveži događaj sa njegovom posledicom.
        parovi:
          - [propast mikenske civilizacije, razvoj antičke grčke civilizacije]
          - [146. godina p. n. e., Rimska republika osvaja Grčku]
          - [otkriće Amerike, pomorstvo se seli na Atlantski okean]
          - [izgradnja Sueckog kanala, Evropa dobija vezu sa Indijom i Dalekim istokom]
        pomoc:
          - Poređaj događaje po vremenu — od najstarijeg do najnovijeg.
          - Godina pre nove ere vezana je za kraj antičke Grčke; kanal je vezan za Indiju.
          - "Iz lekcije: posle mikenske — antička Grčka; 146. p. n. e. — Rim; Amerika — Atlantik; Suec — Indija."
        objasnjenje: Mikenska → antička Grčka; 146. p. n. e. → rimsko osvajanje; otkriće Amerike → pomorstvo na Atlantiku; Suecki kanal → veza sa Indijom i Dalekim istokom.
        iz_udzbenika:
          strana: 15
          odeljak: Kulturna obeležja — istorija
          tekst: Značaj regije menjao se kroz istoriju — rastao je u antici, opao posle otkrića Amerike, kada se pomorstvo preselilo na Atlantik, i ponovo porastao izgradnjom Sueckog kanala.

      - id: istorija-zakljuci-portugalija
        vrsta: zakljuci
        tezina: tesko
        pojmovi: [velika-geografska-otkrica, atlantski-okean, portugalija]
        pitanje: Posle otkrića Amerike, koja od ovih država Južne Evrope je imala najbolji položaj za plovidbu ka Novom svetu?
        odgovori:
          - {tekst: "Portugalija, jer izlazi direktno na Atlantski okean.", tacan: true}
          - {tekst: "Grčka, jer ima najviše ostrva.", tacan: false}
          - {tekst: "Bugarska, jer izlazi na Crno more.", tacan: false}
          - {tekst: "Srbija, jer je na ušću Save u Dunav.", tacan: false}
        pomoc:
          - "Korak 1: Preko kog okeana se iz Evrope stiže do Amerike?"
          - "Korak 2: Koja od ponuđenih država izlazi baš na taj okean — a koje izlaze samo na unutrašnja mora ili nemaju more?"
          - "Iz lekcije: posle otkrića Amerike pomorstvo se premešta sa Sredozemnog mora na Atlantski okean."
        objasnjenje: Portugalija leži na obali Atlantika, pa je bila u najboljem položaju; Grčka i Bugarska su na unutrašnjim morima, a Srbija nema izlaz na more.
        iz_udzbenika:
          strana: 15
          odeljak: Kulturna obeležja — istorija
          tekst: Posle saznanja za američko kopno pomorstvo se premestilo sa Sredozemnog mora na Atlantski okean; prednost su dobile zemlje sa izlazom na okean.

      - id: istorija-klik-rim
        vrsta: karta_klik
        tezina: srednje
        pojmovi: [rim, rimljani, italija]
        pitanje: Klikni na grad koji su podigli Rimljani i koji je danas glavni grad Italije.
        cilj: {mesto: rim}
        pomoc:
          - Grad je na Apeninskom poluostrvu, u njegovom srednjem delu.
          - Leži blizu zapadne obale Italije, na reci Tibru.
          - Klikni na Rim — u sredini zapadne strane „čizme”; u njemu je i Vatikan.
        objasnjenje: Rim, na Tibru u srednjoj Italiji — glavni grad Italije; unutar njega je Vatikan.
        iz_udzbenika:
          strana: 15
          odeljak: Kulturna obeležja — istorija
          tekst: Rim su podigli Rimljani; danas je glavni grad Italije i jedan od najvećih gradova Južne Evrope.
          slika: 10-italija/05-fizicka-karta-italije.jpg

      - id: istorija-gde-atina
        vrsta: gde_sam
        tezina: srednje
        pojmovi: [atina, partenon, grcka]
        pitanje: Gde sam? Pročitaj trag i klikni mesto na karti.
        cilj: {mesto: atina}
        tragovi:
          - Moje ime nosi boginja zaštitnica grada.
          - Iznad mene se uzdiže antički hram sa dorskim stubovima — Partenon.
          - Podigli su me antički Grci, a danas sam glavni grad države na jugu Balkana.
          - Ja sam glavni grad Grčke.
        objasnjenje: Atina — glavni grad Grčke, sa Partenonom, hramom boginje Atine.
        iz_udzbenika:
          strana: 14
          odeljak: Zanimljivosti
          tekst: Atinu su podigli antički Grci; iznad grada je Partenon, hram boginje Atine, zaštitnice grada.
          slika: 02-juzna-evropa/02-partenon.jpg

  - naslov: Stanovništvo i vere
    zadaci:
      - id: stanovnistvo-izbor-broj
        vrsta: izbor
        tezina: lako
        pojmovi: [juzna-evropa]
        pitanje: Koliko otprilike stanovnika živi u Južnoj Evropi?
        odgovori:
          - {tekst: oko 159 miliona, tacan: true}
          - {tekst: oko 15 hiljada, tacan: false}
          - {tekst: "oko 1,5 milijardi", tacan: false}
          - {tekst: oko 1 milion, tacan: false}
        pomoc:
          - Regija ima 17 država, među njima velike kao Italija i Španija — to je mnogo ljudi, ali manje od cele Evrope.
          - Broj je između 150 i 160 miliona.
          - "Iz lekcije: u Južnoj Evropi živi oko 159 miliona stanovnika."
        objasnjenje: U Južnoj Evropi živi oko 159 miliona ljudi; 1,5 milijardi je više od cele Evrope, a hiljade i jedan milion su premalo.
        iz_udzbenika:
          strana: 15
          odeljak: Stanovništvo
          tekst: Južna Evropa ima oko 159 miliona stanovnika, pretežno naroda indoevropske porodice.

      - id: stanovnistvo-izbor-porodica
        vrsta: izbor
        tezina: lako
        pojmovi: [indoevropska-porodica]
        pitanje: Kojoj porodici naroda pripada većina stanovnika Južne Evrope?
        odgovori:
          - {tekst: indoevropskoj, tacan: true}
          - {tekst: uralskoj, tacan: false}
          - {tekst: kinesko-tibetskoj, tacan: false}
          - {tekst: indijanskoj, tacan: false}
        pomoc:
          - Ova porodica obuhvata i Slovene i romanske narode.
          - U nazivu su dva dela sveta — Indija i Evropa.
          - "Iz lekcije: stanovništvo pretežno pripada indoevropskoj porodici naroda."
        objasnjenje: Većina pripada indoevropskoj porodici — i Južni Sloveni i romanski narodi su indoevropski.
        iz_udzbenika:
          strana: 15
          odeljak: Stanovništvo
          tekst: Oko 159 miliona stanovnika regije pretežno pripada narodima indoevropske porodice.

      - id: stanovnistvo-tn-juzni-sloveni
        vrsta: tacno_netacno
        tezina: lako
        pojmovi: [juzni-sloveni, balkansko-poluostrvo]
        tvrdnja: Na Balkanskom poluostrvu najbrojniji su Južni Sloveni.
        tacno: true
        pomoc:
          - Setimo se ko živi u Srbiji, Hrvatskoj, Bugarskoj i Sloveniji.
          - Ti narodi govore srodnim slovenskim jezicima.
          - "Iz lekcije: na Balkanskom poluostrvu najbrojniji su Južni Sloveni."
        objasnjenje: Tačno — na Balkanu su najbrojniji Južni Sloveni (Srbi, Hrvati, Bugari, Slovenci, Makedonci i dr.).
        iz_udzbenika:
          strana: 15
          odeljak: Stanovništvo
          tekst: Na Balkanskom poluostrvu najbrojniji su Južni Sloveni, a na Apeninskom i Pirinejskom romanski narodi.

      - id: stanovnistvo-tn-romani
        vrsta: tacno_netacno
        tezina: srednje
        pojmovi: [romani, apeninsko-poluostrvo, pirinejsko-poluostrvo]
        tvrdnja: Romanskih naroda najviše ima na Apeninskom i Balkanskom poluostrvu.
        tacno: false
        ispravke:
          - {tekst: "Najviše ih ima na Apeninskom i Pirinejskom poluostrvu.", tacan: true}
          - {tekst: "Najviše ih ima samo na Balkanskom poluostrvu.", tacan: false}
          - {tekst: "U Južnoj Evropi nema romanskih naroda.", tacan: false}
        pomoc:
          - Romanski narodi govore jezicima nastalim iz latinskog — Italijani, Španci, Portugalci.
          - Jedno poluostrvo je pogrešno — na njemu su najbrojniji Južni Sloveni.
          - "Iz lekcije: na Apeninskom i Pirinejskom poluostrvu najviše je romanskih naroda."
        objasnjenje: Netačno — romanski narodi preovlađuju na Apeninskom i Pirinejskom poluostrvu; na Balkanu su najbrojniji Južni Sloveni.
        iz_udzbenika:
          strana: 15
          odeljak: Stanovništvo
          tekst: Na Apeninskom i Pirinejskom poluostrvu najviše je romanskih naroda, a na Balkanskom Južnih Slovena.

      - id: stanovnistvo-povezi-narodi
        vrsta: povezi
        tezina: srednje
        pojmovi: [juzni-sloveni, romani, baski, semitski-narodi]
        pitanje: Poveži deo Južne Evrope sa narodom ili grupom naroda koja tamo preovlađuje.
        parovi:
          - [Balkansko poluostrvo, Južni Sloveni]
          - [Apeninsko i Pirinejsko poluostrvo, romanski narodi]
          - [sever Španije, Baski]
          - [Malta, semitski narod srodan Arapima]
        pomoc:
          - Italijani, Španci i Portugalci govore jezicima nastalim iz latinskog.
          - Baski su izolovana grupa uz Biskajski zaliv; Maltežani nisu ni Sloveni ni Romani.
          - "Iz lekcije: na Balkanu su najbrojniji Južni Sloveni, na druga dva poluostrva romanski narodi."
        objasnjenje: Balkan — Južni Sloveni; Apeninsko i Pirinejsko — romanski narodi; sever Španije — Baski; Malta — semitski narod (malteški jezik, afroazijska porodica).
        iz_udzbenika:
          strana: 15
          odeljak: Stanovništvo
          tekst: Na Balkanskom poluostrvu najbrojniji su Južni Sloveni, a na Apeninskom i Pirinejskom romanski narodi. Izolovane grupe su Albanci, Grci i Baski (sever Španije). Maltežani su semitski narod srodan Arapima; malteški jezik pripada afroazijskoj porodici.

      - id: stanovnistvo-izbor-izolovani
        vrsta: izbor
        tezina: srednje
        pojmovi: [albanci, grci, baski]
        pitanje: Koje grupe naroda lekcija navodi kao izolovane? (Više tačnih.)
        odgovori:
          - {tekst: Albanci, tacan: true}
          - {tekst: Grci, tacan: true}
          - {tekst: Baski, tacan: true}
          - {tekst: Srbi, tacan: false}
          - {tekst: Italijani, tacan: false}
          - {tekst: Španci, tacan: false}
        pomoc:
          - Izolovani narodi nisu ni Južni Sloveni ni romanski narodi.
          - Tačna su tri — dva sa Balkana i jedan sa severa Španije.
          - "Iz lekcije: izolovane grupe naroda su Albanci, Grci i Baski."
        objasnjenje: Albanci, Grci i Baski su izolovane grupe; Srbi su Južni Sloveni, a Italijani i Španci romanski narodi.
        iz_udzbenika:
          strana: 15
          odeljak: Stanovništvo
          tekst: Osim Južnih Slovena i romanskih naroda, u regiji žive i izolovane grupe naroda — Albanci, Grci i Baski.

      - id: stanovnistvo-izbor-baski
        vrsta: izbor
        tezina: srednje
        pojmovi: [baski, spanija]
        pitanje: Gde žive Baski?
        odgovori:
          - {tekst: na severu Španije, tacan: true}
          - {tekst: na jugu Italije, tacan: false}
          - {tekst: na ostrvu Malti, tacan: false}
          - {tekst: u Albaniji, tacan: false}
        pomoc:
          - Baski žive na Pirinejskom poluostrvu.
          - Njihova oblast je uz Biskajski zaliv, blizu Pirineja.
          - "Iz lekcije: Baski žive na severu Španije."
        objasnjenje: Baski su izolovana grupa naroda na severu Španije, uz Biskajski zaliv.
        iz_udzbenika:
          strana: 15
          odeljak: Stanovništvo
          tekst: Baski su jedna od izolovanih grupa naroda; žive na severu Španije.

      - id: stanovnistvo-klik-baski
        vrsta: karta_klik
        tezina: tesko
        pojmovi: [baski, spanija]
        pitanje: Klikni na oblast u kojoj žive Baski.
        cilj: {mesto: zemlja-baska}
        pomoc:
          - Oblast je u Španiji, ali ne na jugu ni u centru.
          - Traži sever Španije, uz Atlantik (Biskajski zaliv), blizu zapadnog kraja Pirineja.
          - Klikni na sever Španije, uz obalu, blizu granice sa Francuskom.
        objasnjenje: Zemlja Baska je na severu Španije, uz Biskajski zaliv, blizu zapadnih Pirineja.
        iz_udzbenika:
          strana: 15
          odeljak: Stanovništvo
          tekst: Baski su izolovana grupa naroda koja živi na severu Španije.
          slika: 11-spanija/02-fizicka-karta-spanije.jpg

      - id: stanovnistvo-tn-malta
        vrsta: tacno_netacno
        tezina: srednje
        pojmovi: [malta, semitski-narodi]
        tvrdnja: Maltežani su romanski narod, srodan Italijanima.
        tacno: false
        ispravke:
          - {tekst: "Maltežani su semitski narod, srodan Arapima.", tacan: true}
          - {tekst: "Maltežani su Južni Sloveni.", tacan: false}
          - {tekst: "Maltežani su izolovani narod srodan Baskima.", tacan: false}
        pomoc:
          - Malta je blizu Italije, ali i blizu severne Afrike.
          - Maltežani nisu ni Sloveni ni Romani.
          - "Iz lekcije: Maltežani su semitski narod srodan Arapima."
        objasnjenje: Netačno — Maltežani su semitski narod srodan Arapima; govore malteškim jezikom.
        iz_udzbenika:
          strana: 15
          odeljak: Stanovništvo
          tekst: Stanovnici Malte su semitski narod srodan Arapima; govore malteškim jezikom iz semitske grupe afroazijske porodice.

      - id: stanovnistvo-izbor-malteski
        vrsta: izbor
        tezina: tesko
        pojmovi: [malteski-jezik, semitski-narodi]
        pitanje: Gde spada malteški jezik?
        odgovori:
          - {tekst: u semitsku grupu afroazijske porodice, tacan: true}
          - {tekst: u semitsku grupu indoevropske porodice, tacan: false}
          - {tekst: u romansku grupu indoevropske porodice, tacan: false}
          - {tekst: u slovensku grupu indoevropske porodice, tacan: false}
        pomoc:
          - Maltežani nisu indoevropski narod kao većina u regiji.
          - Grupa je ista kao kod arapskog jezika; porodica nosi ime po dva kontinenta.
          - "Iz lekcije: malteški jezik pripada semitskoj grupi afroazijske porodice."
        objasnjenje: Malteški jezik je u semitskoj grupi afroazijske porodice — kao i arapski. Semitska grupa ne pripada indoevropskoj porodici.
        iz_udzbenika:
          strana: 15
          odeljak: Zanimljivosti
          tekst: Maltežani nisu ni Sloveni ni Romani — oni su semitski narod srodan Arapima, a njihov jezik pripada semitskoj grupi afroazijske porodice jezika.

      - id: stanovnistvo-vere-balkan
        vrsta: izbor
        tezina: lako
        pojmovi: [pravoslavlje, katolicanstvo, islam]
        pitanje: Koje vere su zastupljene na Balkanskom poluostrvu? (Više tačnih.)
        odgovori:
          - {tekst: pravoslavlje, tacan: true}
          - {tekst: katoličanstvo, tacan: true}
          - {tekst: islam, tacan: true}
          - {tekst: protestantizam (kao vera većine), tacan: false}
        pomoc:
          - Setimo se Srbije, Hrvatske i Bosne i Hercegovine — koje su vere tamo?
          - Tačne su tri vere.
          - "Iz lekcije: na Pirinejskom i Apeninskom većina su katolici, a na Balkanu ima više vera."
        objasnjenje: Na Balkanu su zastupljeni pravoslavlje, katoličanstvo i islam.
        iz_udzbenika:
          strana: 16
          odeljak: Stanovništvo — vere
          tekst: Na Pirinejskom i Apeninskom poluostrvu većina stanovnika su katolici. Na Balkanskom poluostrvu zastupljeni su pravoslavlje, katoličanstvo i islam. U zadatku se uz pomoć atlasa za Sloveniju, Grčku, Srbiju, Bugarsku i BiH upisuju vere.

      - id: stanovnistvo-izbor-katolicanstvo
        vrsta: izbor
        tezina: lako
        pojmovi: [katolicanstvo, pirinejsko-poluostrvo, apeninsko-poluostrvo]
        pitanje: Koja vera preovlađuje na Pirinejskom i Apeninskom poluostrvu?
        odgovori:
          - {tekst: katoličanstvo, tacan: true}
          - {tekst: budizam, tacan: false}
          - {tekst: hinduizam, tacan: false}
        pomoc:
          - U Rimu se nalazi Vatikan, središte jedne hrišćanske crkve.
