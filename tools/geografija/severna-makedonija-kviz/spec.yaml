# Republika Severna Makedonija — kviz po lekciji (tip: lesson-quiz; vidi templates/lesson-quiz/README.md).
# Pitanja su napisana sopstvenim rečima na osnovu lekcije „Republika Severna Makedonija” (7. razred, str. 29–30).
# `iz_udzbenika` (posle odgovora, u fioci): strana, odeljak, sažetak sopstvenim rečima i slika iz
# privatnog tools/geografija/_source/slike-7/ (prikazuje se samo kad taj folder postoji — van git-a).
title: Republika Severna Makedonija — kviz
title_short: Severna Makedonija
locale: sr
nivo: osnovna
razred: 7
lekcije: [9]
description: >-
  Kviz za lekciju Republika Severna Makedonija: položaj, reljef, klima i vode, stanovništvo, gradovi i
  privreda, uz kartu (klikni državu ili mesto, „Gde sam?”) i ponavljanje zastava bivših republika SFRJ.

karta:
  extent: {lon: [18.3, 25.3], lat: [39.9, 43.2]}
  mid_lat_for_aspect: 41.5
  geo_data: ../../../shared/data/countries.geojson
  # Severna Makedonija i susedi (klikabilni). KOS se crta i broji kao deo Srbije (stav udžbenika).
  drzave:
    MKD: Severna Makedonija
    SRB: Srbija
    BGR: Bugarska
    GRC: Grčka
    ALB: Albanija
  spoji: {KOS: SRB}
  # Tačke za zadatke kojima je cilj mesto. Ne crtaju se dok se ne pogode.
  mesta:
    skoplje: {naziv: Skoplje, lat: 42.00, lon: 21.43, radius_km: 35}
    bitolj: {naziv: Bitolj, lat: 41.03, lon: 21.33, radius_km: 30}
