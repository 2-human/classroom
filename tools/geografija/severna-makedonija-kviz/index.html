<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Republika Severna Makedonija — kviz</title>
<style>

 :root{--hub-bg:#faf8f2;--hub-card:#fff;--hub-ink:#2b2b2b;--hub-head:#3a3528;--hub-mute:#6b6456;--hub-line:#e6e0d2;--hub-soft:#f3ecd8;--hub-accent:#b1271f;--hub-ok:#1f7a3a;--hub-nav-w:280px;--hub-drawer-w:440px}
 html:has(.app-body){overflow:hidden}
 .app-body{margin:0;height:100vh;height:100dvh;overflow:hidden;display:flex;flex-direction:column;max-width:100vw;background:var(--hub-bg);color:var(--hub-ink);font-family:system-ui,Segoe UI,Roboto,Arial,sans-serif}
 .app-bar{flex:0 0 auto;display:flex;align-items:center;gap:14px;padding:8px 16px;background:var(--hub-card);border-bottom:1px solid var(--hub-line);min-width:0;position:relative;z-index:50}
 .app-bar .app-menu{display:none;padding:0;width:36px;height:34px;font-size:18px;line-height:1;border:1px solid var(--hub-line);background:var(--hub-card);color:var(--hub-head);border-radius:7px;cursor:pointer}
 .app-bar .app-menu:hover{background:var(--hub-soft);color:var(--hub-head)}
 .brand{font-weight:700;font-size:15px;color:var(--hub-head);text-decoration:none;white-space:nowrap}
 .brand:hover{color:var(--hub-accent)}
 .app-crumbs{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--hub-mute);min-width:0;overflow:hidden;white-space:nowrap}
 .app-crumbs a{color:var(--hub-mute);text-decoration:none}
 .app-crumbs a:hover{color:var(--hub-accent)}
 .app-crumbs .sep{color:#b9b2a0}
 .app-crumbs .cur{color:var(--hub-head);font-weight:600;overflow:hidden;text-overflow:ellipsis}
 .bar-right{margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end;min-width:0}
 .app-grid{flex:1 1 auto;display:grid;grid-template-columns:var(--hub-nav-w) minmax(0,1fr);min-height:0}
 .app-nav{background:var(--hub-card);border-right:1px solid var(--hub-line);overflow:auto;padding:10px 10px 40px;min-height:0}
 .app-filter{width:100%;font:inherit;font-size:13px;padding:7px 9px;border:1px solid var(--hub-line);border-radius:6px;margin:0 0 4px;background:#fff;color:var(--hub-ink)}
 .app-filter:focus{outline:none;border-color:var(--hub-mute)}
 .app-nav .sec{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--hub-mute);padding:12px 6px 4px}
 .app-nav .cnt{font-size:11px;color:var(--hub-mute);font-variant-numeric:tabular-nums;letter-spacing:0;text-transform:none}
 .f-hide{display:none!important}
 .app-main{position:relative;overflow:auto;min-width:0;min-height:0;transition:margin-right .18s ease}
 .app-drawer{position:fixed;top:var(--htop,50px);right:0;bottom:0;width:var(--hub-drawer-w);max-width:100vw;background:var(--hub-card);border-left:1px solid var(--hub-line);box-shadow:-8px 0 24px rgba(58,53,40,.10);transform:translateX(105%);transition:transform .18s ease;z-index:60;display:flex;flex-direction:column}
 .app-drawer.open{transform:none}
 .drawer-head{display:flex;align-items:flex-start;gap:10px;padding:14px 16px 10px;border-bottom:1px solid var(--hub-line)}
 .drawer-head h2{margin:0;font-size:16px;color:var(--hub-head);flex:1 1 auto;overflow-wrap:anywhere}
 .app-drawer .drawer-close{border:0;background:none;padding:0 4px;font-size:24px;line-height:1;cursor:pointer;color:var(--hub-mute)}
 .app-drawer .drawer-close:hover{background:none;color:var(--hub-accent)}
 .drawer-body{flex:1 1 auto;overflow:auto;padding:12px 16px 24px;font-size:13px;line-height:1.55}
 .drawer-foot{flex:0 0 auto;border-top:1px solid var(--hub-line);padding:10px 16px;font-size:12px;color:var(--hub-mute)}
 .mtabs{display:flex;gap:2px;border-bottom:1px solid var(--hub-line);flex-wrap:wrap;background:var(--hub-card);padding:0 12px}
 .mtabs a{text-decoration:none;color:var(--hub-mute);font-size:13px;padding:9px 12px 8px;border-bottom:2px solid transparent}
 .mtabs a[aria-current="page"]{color:var(--hub-head);border-bottom-color:var(--hub-accent);font-weight:600}
 .bar-menu-wrap{position:relative}
 .bar-menu{display:none;position:absolute;right:0;top:calc(100% + 8px);z-index:70;background:var(--hub-card);border:1px solid var(--hub-line);border-radius:10px;box-shadow:0 6px 20px rgba(0,0,0,.16);padding:8px;min-width:240px}
 .bar-menu.open{display:flex;flex-direction:column;align-items:stretch;gap:6px}
 .tbl{width:100%;border-collapse:collapse;background:var(--hub-card);border:1px solid var(--hub-line);border-radius:6px;font-size:13px}
 .tbl th{text-align:left;font-weight:600;font-size:11.5px;color:var(--hub-mute);padding:8px 10px;border-bottom:1px solid var(--hub-line);background:#fcfaf4;white-space:nowrap}
 .tbl td{padding:7px 10px;border-bottom:1px solid #f0ebe0;vertical-align:top}
 .tbl td.num,.tbl th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
 .tbl tr.clk{cursor:pointer} .tbl tr.clk:hover td{background:#fbf7ec}
 @media (min-width:1200px){ .app-body:has(.app-drawer.open) .app-main{margin-right:var(--hub-drawer-w)} }
 @media (max-width:760px){
   .app-bar{gap:10px;padding:8px 12px}
   .app-bar .app-menu{display:inline-block}
   .app-crumbs{display:none}
   .app-grid{grid-template-columns:minmax(0,1fr)}
   .app-nav{position:fixed;top:var(--htop,50px);left:0;bottom:0;width:300px;max-width:88vw;z-index:55;transform:translateX(-105%);transition:transform .18s ease;box-shadow:8px 0 24px rgba(58,53,40,.10)}
   .app-nav.open{transform:none}
   .app-drawer{width:100vw}
 }
 @media print{
   html:has(.app-body){overflow:visible}
   .app-body{height:auto;overflow:visible;display:block}
   .app-grid{display:block}
   .app-main,.app-nav{overflow:visible}
   .app-drawer,.app-filter,.app-menu,.bar-menu-wrap,.mtabs{display:none!important}
 }

 .les{max-width:860px;padding:22px 28px 80px;line-height:1.6;color:#2b2b2b}
 .les h1{font-size:25px;margin:0 0 4px;color:#3a3528}
 .les .meta{color:#6b6456;font-size:13.5px;margin:0 0 6px}
 .les .meta a{color:#b1271f;text-decoration:none}
 .les section{margin:22px 0;scroll-margin-top:12px}
 .les h2{font-size:18px;color:#3a3528;margin:0 0 8px;padding-bottom:5px;border-bottom:1px solid #e6e0d2}
 .les h3{font-size:15.5px;color:#3a3528;margin:0 0 6px}
 .les section.l3{margin-left:14px;padding-left:12px;border-left:3px solid #f3ecd8}
 .les .str{font-size:12px;font-weight:400;color:#6b6456;margin-left:6px;white-space:nowrap}
 .les ul,.les ol{padding-left:22px;margin:6px 0} .les li{margin:3px 0}
 .les p{margin:6px 0}
 .les a{color:#b1271f}
 .les .pojam{border-bottom:1px dotted #b9b2a0}
 .les blockquote{margin:8px 0;padding:6px 14px;border-left:3px solid #c98a2c;background:#fefcf7}
 .les .tbl{overflow-x:auto} .les table{border-collapse:collapse;font-size:14px;margin:8px 0}
 .les th,.les td{border:1px solid #e6e0d2;padding:4px 8px;text-align:left;vertical-align:top} .les th{background:#f3ecd8}
 .strana{margin:26px 0 14px;scroll-margin-top:12px;background:#fff;border:1px solid #e6e0d2;border-radius:10px;overflow:hidden}
 .strana .pg{display:flex;justify-content:space-between;align-items:center;padding:7px 12px;font-size:12.5px;color:#6b6456;background:#fbf7ec;border-bottom:1px solid #e6e0d2}
 .strana .pg b{color:#3a3528}
 .strana .pg button{font:inherit;font-size:12px;border:1px solid #e6e0d2;background:#fff;border-radius:6px;padding:2px 9px;cursor:pointer;color:#3a3528}
 .strana img{display:block;width:100%;height:auto;cursor:zoom-in}
 .strana.zoom{overflow-x:auto} .strana.zoom img{width:auto;max-width:none;cursor:zoom-out}
 .strana.nema{padding:12px;color:#9b9387;font-size:13.5px;background:#fefcf7}
 .notes-lbl{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:#1f7a3a;margin:0 0 -12px}
 .gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin-top:8px}
 .gal figure{margin:0;background:#fff;border:1px solid #e6e0d2;border-radius:8px;overflow:hidden;scroll-margin-top:12px}
 .gal img{display:block;width:100%;height:auto} .gal figcaption{font-size:12.5px;color:#6b6456;padding:6px 9px}
 .hit{animation:hit 2.4s ease-out} @keyframes hit{0%{box-shadow:0 0 0 4px rgba(201,138,44,.55)}100%{box-shadow:0 0 0 4px rgba(201,138,44,0)}}

 :root{--ink:#2b2b2b;--muted:#6b6456;--edge:#b1271f;--accent:#1f7a3a;--border:#e6e0d2;--soft:#fefcf7;--warn:#c98a2c;
       --sea:#cfe6f2;--land:#efeae0;--land-se:#f3ecd8;--bord:#8a8170}
 *{box-sizing:border-box}
 button{font:inherit;padding:7px 14px;border:1px solid var(--edge);background:#fff;color:var(--edge);border-radius:8px;cursor:pointer}
 button:hover{background:var(--edge);color:#fff}
 button.ok{border-color:var(--accent);color:var(--accent)} button.ok:hover{background:var(--accent);color:#fff}
 button:disabled{opacity:.45;cursor:default;background:#fff;color:inherit}
 .opt:disabled,.tn button:disabled,.mcell:disabled,.blank:disabled{opacity:1;cursor:default}
 .opt:disabled:not(.right):not(.wrong){opacity:.6}
 .bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-size:14px}
 .bar-menu-btn{padding:5px 12px;font-size:16px;line-height:1;border-color:var(--muted);color:#3a3528}
 .bar-menu-btn:hover{background:#f3ecd8;color:#3a3528}
 .bar-menu button{width:100%;text-align:left}
 .bar-menu .menu-link{display:block;font-size:13px;color:var(--edge);text-decoration:none;padding:7px 14px;border:1px dashed #e6b0b0;border-radius:8px}
 .stat{background:#f3ecd8;border:1px solid #e1d8c2;border-radius:8px;padding:4px 10px;white-space:nowrap}
 .stat b{font-size:15px;color:var(--accent)}
 .intro p{font-size:14px;color:#4a4434;line-height:1.6;margin:0 0 10px}
 .intro ul{margin:0 0 10px;padding-left:18px;font-size:13.5px;line-height:1.55}
 /* navigation: items */
 .it-row{display:flex;align-items:center;gap:8px;width:100%;border:0;border-radius:5px;background:none;color:var(--ink);font:inherit;font-size:13px;text-align:left;padding:5px 6px;cursor:pointer}
 a.it-row{text-decoration:none;box-sizing:border-box}
 .it-row:hover{background:#f6f1e4;color:var(--ink)}
 .it-row.sel{background:#efe7d2;font-weight:600}
 .it-row.off{opacity:.4}
 .it-row .st{flex:0 0 16px;text-align:center;color:#b9b2a0}
 .it-row.ok .st{color:var(--accent)} .it-row.rev .st,.it-row.fail .st{color:var(--edge)} .it-row.part .st{color:var(--warn)}
 .it-row .lbl{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
 .it-row .pt{flex:0 0 auto;font-size:11px;color:var(--muted);font-weight:400;font-variant-numeric:tabular-nums}
 .tz{flex:0 0 auto;display:inline-block;min-width:1.5em;text-align:center;font-size:10px;font-weight:700;border-radius:8px;padding:1px 5px;letter-spacing:.02em}
 .tz-lako{background:#e3f2e8;color:#1f6b3a} .tz-srednje{background:#fbefd5;color:#8a5a14} .tz-tesko{background:#f8dcd8;color:#8a2a22}
 .tz-legend{display:flex;gap:8px;flex-wrap:wrap;font-size:11px;color:var(--muted);padding:2px 6px 0}
 /* main: item */
 .item{padding:20px 24px 40px;max-width:1100px}
 .ihead{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-bottom:8px}
 .vchip{font-size:11px;text-transform:uppercase;letter-spacing:.05em;border:1px solid var(--border);border-radius:9px;padding:1px 8px;background:#fff}
 .item h2.q{font-size:18px;line-height:1.4;color:#3a3528;margin:0 0 14px}
 .opts{display:flex;flex-direction:column;gap:8px;max-width:640px}
 .opt{display:flex;gap:10px;align-items:flex-start;text-align:left;border:1px solid var(--border);background:#fff;color:var(--ink);border-radius:8px;padding:10px 12px;font-size:14.5px;line-height:1.4}
 .opt:hover{background:#fbf7ec;color:var(--ink)}
 .opt.picked{border-color:#3a3528;background:#f6f1e4}
 .opt.wrong{border-color:#e6b0b0;background:#fdecec;color:#8a2a22} .opt.wrong .ot{text-decoration:line-through}
 .opt.right{border-color:#9fd5b6;background:#e8f5ec;color:#13602c;font-weight:600}
 .opt .box{flex:0 0 18px;height:18px;border:1.5px solid #6b6456;border-radius:4px;margin-top:1px}
 .opt.picked .box{background:#3a3528;box-shadow:inset 0 0 0 3px #fff}
 .opt.round .box{border-radius:50%}
 .tn{display:flex;gap:12px;margin:4px 0 14px}
 .tn button{min-width:8em;padding:10px 18px;font-size:15px}
 .tn button.right{background:var(--accent);border-color:var(--accent);color:#fff}
 .tn button.wrong{background:#fdecec;border-color:#e6b0b0;color:#8a2a22}
 .stmt{font-size:16px;line-height:1.5;border-left:3px solid #e1d8c2;padding:6px 12px;margin:0 0 14px;background:#fff}
 .sub-q{font-weight:600;color:#3a3528;margin:16px 0 8px}
 .cloze{font-size:16px;line-height:2.3;max-width:720px}
 .blank{display:inline-block;min-width:5.5em;border:0;border-bottom:2px solid #6b6456;background:#fff;text-align:center;font:inherit;font-weight:600;color:#3a3528;padding:0 6px;margin:0 3px;border-radius:4px 4px 0 0;cursor:pointer}
 input.blank{cursor:text;width:7em}
 .blank:hover{background:#fbf7ec;color:#3a3528}
 .blank.cur{border-bottom-color:var(--edge);background:#fff7f3}
 .blank.lock{border-bottom-color:var(--accent);background:#e8f5ec;color:#13602c;cursor:default}
 .blank.bad{border-bottom-color:var(--edge);background:#fdecec;color:#8a2a22}
 .blank.rev{border-bottom-color:var(--warn);background:#fdf3e2;color:#8a5a14}
 .bank{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 0}
 .bank button{padding:5px 12px;border-color:#6b6456;color:#3a3528;border-radius:16px}
 .bank button:hover{background:#f3ecd8;color:#3a3528}
 .bank button.used{opacity:.3;pointer-events:none}
 .match{display:grid;grid-template-columns:1fr 1fr;gap:10px 28px;max-width:720px}
 .match .col{display:flex;flex-direction:column;gap:8px}
 .mcell{text-align:left;border:1px solid var(--border);background:#fff;color:var(--ink);border-radius:8px;padding:9px 12px;font-size:14px}
 .mcell:hover{background:#fbf7ec;color:var(--ink)}
 .mcell.cur{border-color:#3a3528;box-shadow:0 0 0 2px rgba(58,53,40,.15)}
 .mcell.done{border-color:#9fd5b6;background:#e8f5ec;color:#13602c;cursor:default}
 .mcell.rev{border-color:#ecc98a;background:#fdf3e2;color:#8a5a14;cursor:default}
 .mcell.bad{animation:shake .3s;border-color:#e6b0b0;background:#fdecec}
 .mcell .n{display:inline-block;min-width:1.4em;font-weight:700;margin-right:6px;color:var(--muted)}
 @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
 .iactions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:18px}
 .fb{font-size:14px;font-weight:600;min-height:1.4em}
 .fb.ok{color:var(--accent)} .fb.bad{color:var(--edge)} .fb.info{color:var(--muted);font-weight:400}
 .expl{margin-top:14px;padding:10px 14px;border-radius:8px;background:#e8f5ec;border:1px solid #bfe0c8;color:#13602c;font-size:14px;line-height:1.5;max-width:720px}
 .expl.rev{background:#fdf3e2;border-color:#f0d878;color:#6b4a10}
 .help-inline{display:none}
 /* map */
 .mapwrap{position:relative;margin-top:6px;border:1px solid var(--border);border-radius:8px;overflow:hidden;background:var(--sea);aspect-ratio:1000/629;max-height:70vh;touch-action:none}
 .mapwrap svg{width:100%;height:100%;display:block;cursor:crosshair}
 .mapwrap svg.drag{cursor:grabbing}
 .mapwrap .c{fill:var(--land);stroke:var(--bord);stroke-width:.6;vector-effect:non-scaling-stroke}
 .mapwrap .c.se{fill:var(--land-se)}
 .mapwrap .c.se:hover{fill:#e9dcb8}
 .mapwrap .c.hit{fill:#bfe0c8} .mapwrap .c.miss{fill:#f3c9c4} .mapwrap .c.revc{fill:#f6dca6}
 .mapwrap .mk{pointer-events:none}
 .mapwrap .mk circle{stroke:#fff;vector-effect:non-scaling-stroke}
 .mapwrap .mk text{font-size:13px;font-weight:700;paint-order:stroke;stroke:#fff;stroke-width:3px;vector-effect:non-scaling-stroke}
 .zbar{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px}
 .zbar button{width:36px;height:36px;padding:0;font-size:18px;font-weight:700;background:#fff;border-color:#6b6456;color:#3a3528;box-shadow:0 1px 3px rgba(0,0,0,.2)}
 .zbar button:hover{background:#f3ecd8;color:#3a3528}
 .zhint{position:absolute;left:10px;bottom:8px;font-size:11.5px;color:var(--muted);background:rgba(255,255,255,.85);border-radius:6px;padding:3px 8px;pointer-events:none}
 .clues{list-style:none;margin:0 0 6px;padding:0;max-width:720px}
 .clues li{padding:7px 10px;margin:0 0 6px;border-left:3px solid #e1d8c2;background:#fff;font-size:14.5px;line-height:1.45}
 .clues li:last-child{border-left-color:var(--edge)}
 .clues .k{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-right:6px}
 /* drawer content */
 .hl h3{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:14px 0 6px}
 .hl ol{margin:0;padding-left:20px} .hl li{margin:0 0 10px;line-height:1.5}
 .hl li.new{animation:flash 1.2s}
 @keyframes flash{0%{background:#fff3c4}100%{background:transparent}}
 .hl .placeholder{color:#9b9387;font-style:italic}
 .hl .chips{display:flex;flex-wrap:wrap;gap:6px}
 .hl .pchip{font-size:12px;border:1px solid var(--border);border-radius:10px;padding:1px 9px;background:#fefcf7}
 .hl a{color:var(--edge);text-decoration:none}
 .hl ul{margin:0;padding-left:18px} .hl ul li{margin:3px 0}
 .hl .ref{font-size:12px;color:var(--muted);margin:0 0 6px}
 .hl figure{margin:6px 0 10px} .hl figure img{display:block;max-width:100%;border-radius:6px;border:1px solid var(--border)}
 .qfig{margin:16px 0 0;max-width:720px} .qfig img{display:block;max-width:100%;max-height:62vh;border-radius:8px;border:1px solid var(--border);cursor:zoom-in}
 .qfig.zoom{max-width:none;overflow-x:auto} .qfig.zoom img{max-width:none;max-height:none;cursor:zoom-out}
 .qfig figcaption{font-size:12.5px;color:var(--muted);margin-top:5px}
 .hl figcaption{font-size:11.5px;color:var(--muted);margin-top:4px}
 .hl .book{border-left:3px solid #e1d8c2;padding:2px 0 2px 12px;margin:6px 0 4px}
 .hl .odeljak{margin:10px 0 4px;padding:8px 12px;background:#fefcf7;border:1px solid #e6e0d2;border-radius:8px;font-size:14px;line-height:1.5}
 .hl .odeljak summary{cursor:pointer;font-weight:600;color:#3a3528;font-size:13px}
 .hl .odeljak ul,.hl .odeljak ol{padding-left:20px;margin:6px 0} .hl .odeljak li{margin:3px 0} .hl .odeljak p{margin:6px 0}
 .hl .odeljak table{border-collapse:collapse;font-size:13px} .hl .odeljak th,.hl .odeljak td{border:1px solid #e6e0d2;padding:3px 6px}
 .hl .tekst-links{display:flex;flex-wrap:wrap;gap:6px 14px;margin:8px 0 4px;font-size:13.5px}
 .hl .tekst-links a{color:var(--edge);font-weight:600;text-decoration:none}
 /* the lesson (protected copy): main column via the nav, or one part of it in the wide drawer */
 .app-drawer.wide{width:min(820px,100vw)}
 .app-drawer .les{padding:0;max-width:none}
 .app-drawer .les section,.app-drawer .les .strana{margin:0 0 16px}
 .lekbar{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}
 .lekbar button{font-size:13px;padding:6px 12px}
 /* summary */
 .sum{padding:22px 26px 40px;max-width:860px}
 .sum h1{font-size:22px;margin:0 0 6px;color:#3a3528}
 .sum .big{font-size:30px;font-weight:700;color:var(--accent)}
 .sum .tbl{margin:14px 0}
 .sum .sub{color:var(--muted);margin:0 0 6px} .sum .lead{color:var(--muted);max-width:640px;line-height:1.5}
 .rv{border:1px solid var(--border);border-radius:8px;background:#fff;padding:10px 14px;margin:12px 0}
 .rv .rq{margin:4px 0 8px;font-weight:600;color:#3a3528} .rv .rl{margin:0;font-size:12px;color:var(--muted)}
 .rlog{margin:2px 0 8px;padding-left:18px;font-size:13.5px} .rlog .ok{color:var(--accent)} .rlog .bad{color:var(--edge)}
 .rv .rc{margin:0;font-size:13.5px}
 /* why a wrong option is wrong */
 .opt .why{display:block;font-size:12.5px;font-weight:400;color:#6b4a10;text-decoration:none;margin-top:4px;line-height:1.4}
 .opt.wrong{flex-wrap:wrap} .opt.wrong > span:last-child{flex:1 1 0}
 .why-box{border-left:3px solid var(--warn);background:#fdf3e2;padding:6px 10px;margin:0 0 10px;font-size:13.5px;line-height:1.45}
 /* datum */
 .dt{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:4px 0 6px}
 .dt input{font:inherit;font-size:18px;font-weight:600;width:6.5em;text-align:center;padding:8px;border:1.5px solid #6b6456;border-radius:8px}
 .dt select{font:inherit;font-size:14px;padding:7px 6px;border:1.5px solid #6b6456;border-radius:8px;background:#fff}
 .dt input.bad{border-color:var(--edge);background:#fdecec} .dt input:disabled{background:#e8f5ec;border-color:#9fd5b6;color:#13602c}
 .dt .ev{font-size:16px;border-left:3px solid #e1d8c2;padding:6px 12px;background:#fff;margin:0 0 14px}
 /* poredjaj */
 .ord{display:grid;grid-template-columns:1fr 1fr;gap:18px;max-width:900px}
 .ord h4{margin:0 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
 .ord .col{display:flex;flex-direction:column;gap:8px}
 .slot{display:flex;gap:8px;align-items:center;min-height:42px;text-align:left;border:1px dashed #cfc6b0;background:#fff;color:var(--ink);border-radius:8px;padding:8px 10px;font-size:14px}
 .slot .n{flex:0 0 1.6em;font-weight:700;color:var(--muted)}
 .slot.fill{border-style:solid;border-color:#3a3528} .slot.lock{border-style:solid;border-color:#9fd5b6;background:#e8f5ec;color:#13602c;cursor:default}
 .slot.rev{border-style:solid;border-color:#ecc98a;background:#fdf3e2;color:#8a5a14} .slot .yr{margin-left:auto;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
 .pool button{text-align:left}
 /* lanac */
 .chain{display:flex;flex-wrap:wrap;align-items:stretch;gap:6px;margin:0 0 16px;max-width:980px}
 .chain .lk{flex:1 1 150px;border:1px solid var(--border);background:#fff;border-radius:8px;padding:9px 11px;font-size:14px;line-height:1.4}
 .chain .lk.q{border:2px dashed var(--edge);background:#fff7f3;color:var(--edge);font-weight:700;text-align:center;display:flex;align-items:center;justify-content:center}
 .chain .lk.q.ok{border:1px solid #9fd5b6;background:#e8f5ec;color:#13602c;font-weight:600}
 .chain .ar{align-self:center;color:var(--muted);font-size:18px}
 /* izvor */
 .src{max-width:760px;margin:0 0 16px;border:1px solid #e1d8c2;border-radius:8px;background:#fffdf6;padding:12px 16px}
 .src .who{font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
 .src blockquote{margin:0;font-family:Georgia,serif;font-size:15.5px;line-height:1.55;color:#3a3528}
 .src .nt{font-size:12px;color:var(--muted);margin:8px 0 0}
 /* uporedi */
 .cmp{border-collapse:collapse;max-width:900px;width:100%}
 .cmp td{border-top:1px solid var(--border);padding:8px 6px;vertical-align:top;font-size:14px;line-height:1.4}
 .cmp td.bt{white-space:nowrap;text-align:right}
 .cmp .cb{padding:4px 9px;margin:2px;font-size:12.5px;border-color:#6b6456;color:#3a3528}
 .cmp-key{font-size:14px;line-height:1.6;margin:0 0 8px;padding:6px 10px;background:#fff;border-left:3px solid #e1d8c2;max-width:900px}
 .cmp .cb:hover{background:#f3ecd8;color:#3a3528} .cmp .cb.on{background:#3a3528;color:#fff}
 .cmp .cb.right{background:var(--accent);border-color:var(--accent);color:#fff} .cmp .cb.wrong{background:#fdecec;border-color:#e6b0b0;color:#8a2a22}
 .cmp tr.lock td:first-child{color:#13602c} .cmp tr.bad td:first-child{color:#8a2a22}
 .cmp .why{display:block;font-size:12.5px;color:#6b4a10;margin-top:3px}
 /* objasni */
 .exp textarea{width:100%;max-width:760px;min-height:110px;font:inherit;font-size:15px;line-height:1.5;padding:10px 12px;border:1.5px solid #6b6456;border-radius:8px}
 .exp .mine{max-width:760px;white-space:pre-wrap;border-left:3px solid #6b6456;background:#fff;padding:8px 12px;font-size:14.5px;line-height:1.5}
 .exp .uzor{max-width:760px;border-left:3px solid var(--accent);background:#e8f5ec;padding:8px 12px;font-size:14.5px;line-height:1.5;color:#13602c}
 .exp label{display:flex;gap:10px;align-items:flex-start;max-width:760px;padding:7px 10px;border:1px solid var(--border);border-radius:8px;background:#fff;margin:0 0 6px;font-size:14px;cursor:pointer}
 .exp label input{margin-top:3px}
 /* vremenska osa */
 .osa{position:relative;margin:16px 0 8px;max-width:1100px}
 .osa .lane{position:relative;border-top:1px solid var(--border);padding:6px 0 4px 110px;min-height:36px}
 .osa .lane .ll{position:absolute;left:0;top:8px;width:102px;font-size:12px;font-weight:700}
 .osa .row{position:relative;height:26px}
 .osa .ev{position:absolute;top:6px;height:14px;min-width:12px;border-radius:7px}
 .osa .ev span{position:absolute;left:calc(100% + 5px);top:-3px;font-size:11.5px;line-height:20px;white-space:nowrap;color:#3a3528}
 .osa .ev.lft span{left:auto;right:calc(100% + 5px)}   /* label to the left when it would run past the end of the axis */
 .osa .ev span small{color:var(--muted)}
 .osa .ev.rv{opacity:.45} .osa .ev.rv span{font-style:italic}
 .osa .ev.vague{background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.55) 0 4px,transparent 4px 8px)}   /* dated by the book only as part of a century */
 .osa .ticks{position:relative;height:22px;margin-left:110px;border-top:2px solid #3a3528}
 .osa .ticks span{position:absolute;top:3px;font-size:11px;color:var(--muted);transform:translateX(-50%)}
 .osa .ticks span::before{content:'';position:absolute;left:50%;top:-6px;height:5px;border-left:1px solid #3a3528}
 .osa-wrap{overflow-x:auto} .osa-wrap .osa{min-width:720px}
 /* moje znanje */
 .box5{display:inline-flex;gap:3px;vertical-align:middle} .box5 i{width:11px;height:11px;border-radius:3px;background:#e6e0d2;display:inline-block}
 .box5 i.on{background:var(--accent)}
 .zn-due{color:var(--edge);font-weight:600}
 .placed{font-size:12.5px;color:var(--accent);margin:8px 0 0}
 #msg{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--edge);color:#fff;padding:9px 18px;border-radius:24px;font-size:14px;font-weight:600;opacity:0;transition:opacity .25s;pointer-events:none;z-index:99}
 #msg.show{opacity:1}
 @media (max-width:760px){
   .brand{display:none}
   .bar{flex-wrap:nowrap;gap:6px} .stat{padding:3px 7px;font-size:12px} .stat b{font-size:13px}
   .bar-menu-btn{padding:4px 9px}
   .item{padding:14px 14px 40px} .item h2.q{font-size:16.5px}
   .match{grid-template-columns:1fr 1fr;gap:8px 10px} .mcell{font-size:13px;padding:8px}
   .help-inline{display:block;margin-top:14px}
   .help-inline:empty{display:none}
   .help-inline .hl{border:1px solid #f0d878;background:#fffbe6;border-radius:8px;padding:2px 12px 4px}
   .mapwrap{aspect-ratio:auto;height:52vh}
   .ord{grid-template-columns:1fr} .cmp td.bt{white-space:normal} .cmp tr{display:block;border-top:1px solid var(--border)} .cmp td{display:block;border:0;text-align:left!important}
   .chain .ar{transform:rotate(90deg);width:100%;text-align:center} .chain .lk{flex-basis:100%}
 }
</style>

<script>
(function () {
  const root = document.documentElement;
  const bar = document.querySelector('.app-bar');
  function setTop() { if (bar) root.style.setProperty('--htop', bar.offsetHeight + 'px'); }
  window.addEventListener('resize', setTop);
  setTop();

  // ☰ navigation (only shown at ≤760px)
  const nav = document.getElementById('app-nav');
  const navBtn = document.getElementById('app-menu');
  const navOverlay = () => window.matchMedia && window.matchMedia('(max-width:760px)').matches;
  function setNav(open) {
    if (!nav) return;
    nav.classList.toggle('open', !!open);
    if (navBtn) navBtn.setAttribute('aria-expanded', String(!!open));
  }
  if (navBtn) navBtn.addEventListener('click', e => { e.stopPropagation(); setNav(!nav.classList.contains('open')); });

  // navigation filter: case- and diacritic-insensitive (š, č, ć, ž, đ)
  const filter = document.getElementById('app-filter');
  const norm = s => String(s || '').toLowerCase().replace(/đ/g, 'd').normalize('NFD').replace(/[̀-ͯ]/g, '');
  function applyFilter() {
    const q = norm(filter.value.trim());
    document.querySelectorAll('#app-nav [data-filter]').forEach(el =>
      el.classList.toggle('f-hide', !!q && !norm(el.dataset.filter).includes(q)));
    document.querySelectorAll('#app-nav [data-filter-group]').forEach(g =>
      g.classList.toggle('f-hide', !!q && !g.querySelector('[data-filter]:not(.f-hide)')));
  }
  if (filter) filter.addEventListener('input', applyFilter);

  // ⋯ menus: a button with data-menu="<id>" toggles .bar-menu#<id>; a button inside closes it
  function setMenu(m, open) {
    m.classList.toggle('open', !!open);
    const b = document.querySelector('[data-menu="' + m.id + '"]');
    if (b) b.setAttribute('aria-expanded', String(!!open));
  }
  document.querySelectorAll('[data-menu]').forEach(btn => {
    const m = document.getElementById(btn.dataset.menu);
    if (!m) return;
    btn.addEventListener('click', e => { e.stopPropagation(); setMenu(m, !m.classList.contains('open')); });
    m.addEventListener('click', e => { e.stopPropagation(); if (e.target.closest('button')) setMenu(m, false); });
  });
  document.addEventListener('click', e => {
    // composedPath: the clicked node may already be re-rendered away (e.g. a step's "next" button)
    if (!e.composedPath().some(n => n.dataset && n.dataset.keepMenus)) document.querySelectorAll('.bar-menu.open').forEach(m => setMenu(m, false));
    if (nav && nav.classList.contains('open') && navOverlay() && !nav.contains(e.target)) setNav(false);
  });
  document.addEventListener('keydown', e => {
    if (e.key !== 'Escape') return;
    document.querySelectorAll('.bar-menu.open').forEach(m => setMenu(m, false));
    const x = document.querySelector('.app-drawer.open .drawer-close');
    if (x && x.offsetParent !== null) x.click();
  });

  window.HubShell = { setNav, setMenu, applyFilter, navOverlay };
})();
</script>
<script>
function bindLesson(root) {
  root.querySelectorAll('.strana button, .strana img').forEach(el => el.addEventListener('click', () => {
    const f = el.closest('.strana'); f.classList.toggle('zoom');
    const b = f.querySelector('button'); if (b) b.textContent = f.classList.contains('zoom') ? 'Umanji' : 'Uvećaj';
  }));
}

ija", "severna-makedonija"], "pitanje": "Klikni na severnog suseda Severne Makedonije, iz kog se nastavljaju Šar-planina i Srpsko-makedonska masa.", "cilj": {"drzava": "SRB"}, "pomoc": ["Traži državu severno od Severne Makedonije.", "Ime planinske mase sadrži ime ove države.", "Klikni na Srbiju."], "objasnjenje": "Srbija je severni sused; iz nje se nastavljaju Šar-planina i Srpsko-makedonska masa, a dolina Morave se nastavlja na dolinu Vardara.", "iz_udzbenika": {"strana": 29, "odeljak": "Fizičko-geografske odlike — reljef", "tekst": "Na istoku zemlje nastavlja se Srpsko-makedonska masa iz Srbije, a na severozapadu su Šarske planine."}, "lekcija": 9}, {"id": "l09-polozaj-klik-grcka", "vrsta": "karta_klik", "tezina": "lako", "pojmovi": ["grcka", "saobracajno-geografski-polozaj"], "pitanje": "Klikni na državu koju Severna Makedonija svojim položajem povezuje sa ostatkom Evrope.", "cilj": {"drzava": "GRC"}, "pomoc": ["Ta država je južno od Severne Makedonije.", "Ima izlaz na Egejsko more i mnogo ostrva.", "Klikni na Grčku."], "objasnjenje": "Severna Makedonija povezuje Grčku sa ostalim državama Evrope — glavni put ide dolinom Vardara.", "iz_udzbenika": {"strana": 29, "odeljak": "Položaj", "tekst": "Zemlja ima povoljan saobraćajno-geografski položaj, jer preko nje Grčka ima vezu sa ostalim državama Evrope."}, "lekcija": 9}, {"id": "l09-polozaj-klik-bugarska", "vrsta": "karta_klik", "tezina": "srednje", "pojmovi": ["bugarska", "strumica"], "pitanje": "Klikni na istočnog suseda Severne Makedonije — državu ka kojoj teče reka Strumica.", "cilj": {"drzava": "BGR"}, "pomoc": ["Strumica je na jugoistoku zemlje i teče ka istoku.", "Ova država izlazi na Crno more; glavni grad joj je Sofija.", "Klikni na Bugarsku."], "objasnjenje": "Bugarska je istočni sused; reka Strumica teče ka Bugarskoj i uliva se u Strumu.", "iz_udzbenika": {"strana": 29, "odeljak": "Fizičko-geografske odlike — vode", "tekst": "Veće reke su Vardar i Strumica; obe pripadaju Egejskom slivu."}, "lekcija": 9}, {"id": "l09-polozaj-dopuni-podaci", "vrsta": "dopuni", "tezina": "srednje", "pojmovi": ["severna-makedonija"], "pitanje": "Dopuni osnovne podatke.", "tekst": "Severna Makedonija ima oko {{1,8|1.8}} miliona stanovnika i površinu od {{25.713|25713|25 713}} km²; službeni jezik je {{makedonski}}.", "ponudjene": ["1,8", "2,1", "25.713", "52.137", "makedonski", "bugarski"], "pomoc": ["Broj stanovnika je manji od dva miliona.", "Površina je nešto veća od 25 hiljada km²; jezik nosi ime naroda koji čini većinu.", "Iz lekcije: 1,8 miliona stanovnika, 25.713 km², jezik makedonski."], "objasnjenje": "Oko 1,8 miliona stanovnika, 25.713 km², službeni jezik makedonski. (2,1 milion ima Slovenija.)", "iz_udzbenika": {"strana": 29, "odeljak": "Osnovni podaci", "tekst": "Infografika — 1,8 miliona stanovnika, površina 25.713 km², glavni grad Skoplje, službeni jezik makedonski.", "slika": "09-severna-makedonija/01-osnovni-podaci.jpg"}, "lekcija": 9}, {"id": "l09-polozaj-izbor-dolina", "vrsta": "izbor", "tezina": "srednje", "pojmovi": ["vardar", "saobracajno-geografski-polozaj"], "pitanje": "Dolinom koje reke idu najvažniji saobraćajni putevi kroz Severnu Makedoniju?", "odgovori": [{"tekst": "Vardar", "tacan": true}, {"tekst": "Drina", "tacan": false}, {"tekst": "Sava", "tacan": false}, {"tekst": "Dunav", "tacan": false}], "pomoc": ["Traži reku koja teče kroz samu Severnu Makedoniju, od severa ka Grčkoj.", "Drina, Sava i Dunav ne teku kroz ovu zemlju.", "Iz lekcije: glavni saobraćajni pravac ide dolinom Vardara."], "objasnjenje": "Dolinom Vardara ide glavni saobraćajni pravac; na severu se nastavlja na dolinu Morave u Srbiji.", "iz_udzbenika": {"strana": 29, "odeljak": "Položaj", "tekst": "Udžbenik traži da se u atlasu pronađu rečne doline kojima idu važni putevi — to je pre svega dolina Vardara, koja se nastavlja na dolinu Morave.", "slika": "09-severna-makedonija/03-reka-vardar.jpg"}, "lekcija": 9}, {"id": "l09-polozaj-zakljuci-saobracaj", "vrsta": "zakljuci", "tezina": "srednje", "pojmovi": ["saobracajno-geografski-polozaj", "vardar", "kontinentalna-zemlja"], "pitanje": "Zašto je saobraćajni položaj Severne Makedonije povoljan iako zemlja nema more?", "odgovori": [{"tekst": "Dolina Vardara je prirodan prolaz kroz planine od Grčke ka Srbiji i srednjoj Evropi.", "tacan": true}, {"tekst": "Zato što je cela zemlja ravnica bez planina.", "tacan": false}, {"tekst": "Zato što ima najveću luku na Balkanu.", "tacan": false}, {"tekst": "Zato što je najveća država Balkana.", "tacan": false}], "pomoc": ["Korak 1: Zemlja je planinsko-kotlinska — gde je najlakše provesti put kroz planine?", "Korak 2: Kuda teče Vardar i šta se nastavlja na njegovu dolinu na severu?", "Iz lekcije: dolinom Vardara idu važni putevi koji povezuju Grčku sa ostatkom Evrope."], "objasnjenje": "Dolina Vardara je prirodan prolaz kroz planine; povezuje Grčku (i luku Solun) sa Srbijom i srednjom Evropom.", "iz_udzbenika": {"strana": 29, "odeljak": "Položaj", "tekst": "Iako nema more, zemlja ima povoljan saobraćajni položaj — preko nje Grčka ima vezu sa ostalim državama Evrope.", "slika": "09-severna-makedonija/03-reka-vardar.jpg"}, "lekcija": 9}, {"id": "l09-polozaj-dopuni-koridor", "vrsta": "dopuni", "tezina": "tesko", "pojmovi": ["vardar", "srbija", "saobracajno-geografski-polozaj"], "pitanje": "Dopuni rečenicu (bez ponuđenih reči).", "tekst": "Dolina Vardara se na severu nastavlja na dolinu reke {{Morave|Južne Morave|Velike Morave|Morava}} u Srbiji, a na jugu vodi ka {{Grčkoj|Grčka}}.", "pomoc": ["Ista saobraćajna linija vodi od Beograda preko Niša do Skoplja.", "Ta srpska reka ima Južnu i Zapadnu granu koje grade Veliku; Vardar teče ka južnom susedu.", "Iz lekcije: moravsko-vardarski pravac povezuje Grčku sa ostatkom Evrope."], "objasnjenje": "Dolina Vardara se nastavlja na dolinu Morave (Južne i Velike) — to je moravsko-vardarski pravac od Grčke ka srednjoj Evropi.", "iz_udzbenika": {"strana": 29, "odeljak": "Položaj", "tekst": "Važni putevi prate dolinu Vardara, koja se na severu na st": "Severna Makedonija je kontinentalna i privredno slabije razvijena zemlja, sa 1,8 miliona stanovnika."}, "lekcija": 9}]}, {"naslov": "Reljef", "zadaci": [{"id": "l09-reljef-izbor-tip", "vrsta": "izbor", "tezina": "lako", "pojmovi": ["planinsko-kotlinska-zemlja"], "pitanje": "Kakva je Severna Makedonija po reljefu?", "odgovori": [{"tekst": "planinsko-kotlinska zemlja", "tacan": true}, {"tekst": "nizijska zemlja", "tacan": false}, {"tekst": "primorska ravnica", "tacan": false}, {"tekst": "pustinjska visoravan", "tacan": false}], "pomoc": ["Na slikama iz lekcije vidiš visoke planine i ravne kotline između njih.", "Zemlja nema more, pa ne može biti primorska.", "Iz lekcije: Severna Makedonija je planinsko-kotlinska zemlja."], "objasnjenje": "Severna Makedonija je planinsko-kotlinska zemlja — planine se smenjuju sa kotlinama i dolinom Vardara.", "iz_udzbenika": {"strana": 29, "odeljak": "Fizičko-geografske odlike — reljef", "tekst": "Zemlja je planinsko-kotlinska; reka Vardar je deli na zapadni i istočni deo.", "slika": "09-severna-makedonija/02-sar-planina.jpg"}, "lekcija": 9}, {"id": "l09-reljef-tn-vardar-deli", "vrsta": "tacno_netacno", "tezina": "lako", "pojmovi": ["vardar"], "tvrdnja": "Reka Vardar deli Severnu Makedoniju na zapadni i istočni deo.", "tacno": true, "pomoc": ["Vardar teče od severozapada ka jugoistoku, kroz sredinu zemlje.", "Zapadno od njega su Šarske planine, a istočno Srpsko-makedonska masa.", "Iz lekcije: Vardar deli zemlju na zapadni i istočni deo."], "objasnjenje": "Tačno — Vardar deli zemlju na zapadni deo (Šarske planine) i istočni deo (Srpsko-makedonska masa).", "iz_udzbenika": {"strana": 29, "odeljak": "Fizičko-geografske odlike — reljef", "tekst": "Reka Vardar deli teritoriju na zapadni deo sa Šarskim planinama i istočni deo sa Srpsko-makedonskom masom.", "slika": "09-severna-makedonija/03-reka-vardar.jpg"}, "lekcija": 9}, {"id": "l09-reljef-dopuni-planine", "vrsta": "dopuni", "tezina": "lako", "pojmovi": ["sar-planina", "srpsko-makedonska-masa"], "pitanje": "Dopuni rečenicu rečima iz banke.", "tekst": "Zapadno od Vardara su {{Šarske planine|Šar-planina}}, a istočno {{Srpsko-makedonska masa}}.", "ponudjene": ["Šarske planine", "Srpsko-makedonska masa", "Alpi"], "pomoc": ["Alpi su daleko, u srednjoj Evropi.", "Masa koja se nastavlja iz Srbije nosi ime i Srbije i Makedonije.", "Iz lekcije: na zapadu Šarske planine, na istoku Srpsko-makedonska masa."], "objasnjenje": "Na zapadu su Šarske planine (Šar-planina), a na istoku Srpsko-makedonska masa.", "iz_udzbenika": {"strana": 29, "odeljak": "Fizičko-geografske odlike — reljef", "tekst": "Zapadni deo zemlje zauzimaju Šarske planine, a na istoku se nastavlja Srpsko-makedonska masa iz Srbije."}, "lekcija": 9}, {"id": "l09-reljef-zakljuci-slika", "vrsta": "zakljuci", "slika_u_pitanju": true, "tezina": "lako", "pojmovi": ["sar-planina", "nabrane-planine"], "pitanje": "Na fotografiji Šar-planine vidiš visoke, oštre i stenovite vrhove sa snegom. Kakva je to planina po postanku?", "odgovori": [{"tekst": "mlada nabrana planina", "tacan": true}, {"tekst": "stara gromadna planina", "tacan": false}, {"tekst": "peščana dina", "tacan": false}, {"tekst": "rečna ravnica", "tacan": false}], "pomoc": ["Korak 1: Setimo se — mlade planine su visoke i oštre, a stare niže i zaobljene.", "Korak 2: Kakvi su vrhovi na fotografiji?", "Iz lekcije: Šarske planine su po postanku nabrane."], "objasnjenje": "Visoki, oštri vrhovi odaju mladu nabranu planinu — Šarske planine su nabrane.", "iz_udzbenika": {"strana": 29, "odeljak": "Fizičko-geografske odlike — reljef", "tekst": "Fotografija Šar-planine pokazuje visoke, oštre vrhove tipične za mlade nabrane planine.", "slika": "09-severna-makedonija/02-sar-planina.jpg"}, "lekcija": 9}, {"id": "l09-reljef-izbor-sar-postanak", "vrsta": "izbor", "tezina": "srednje", "pojmovi": ["sar-planina", "nabrane-planine"], "pitanje": "Kakve su Šarske planine po načinu postanka?", "odgovori": [{"tekst": "nabrane", "tacan": true}, {"tekst": "gromadne", "tacan": false}, {"tekst": "vulkanske", "tacan": false}, {"tekst": "ledničke", "tacan": false}], "pomoc": ["Šarske planine su visoke i imaju oštre vrhove.", "Gromadna je planinska masa na istoku zemlje, ne na zapadu.", "Iz lekcije: Šarske planine su nabrane."], "objasnjenje": "Šarske planine su nabrane — mlade, visoke, oštrih vrhova. Gromadna je Srpsko-makedonska masa.", "iz_udzbenika": {"strana": 29, "odeljak": "Fizičko-geografske odlike — reljef", "tekst": "Udžbenik pita kakve su planine po postanku — Šarske planine na zapadu su nabrane.", "slika": "09-severna-makedonija/02-sar-planina.jpg"}, "lekcija": 9}, {"id": "l09-reljef-izbor-masa-postanak", "vrsta": "izbor", "tezina": "srednje", "pojmovi": ["srpsko-makedonska-masa", "gromadne-planine"], "pitanje": "Kakva je Srpsko-makedonska masa po načinu postanka?", "odgovori": [{"tekst": "gromadna (stara)", "tacan": true}, {"tekst": "nabrana (mlada)", "tacan": false}, {"tekst": "vulkanska", "tacan": false}, {"tekst": "nastala nanošenjem reke", "tacan": false}], "pomoc": ["Već sam ime „masa” govori o starim, razlomljenim planinama.", "Njeni vrhovi su niži i zaobljeni.", "Iz lekcije: Srpsko-makedonska masa je gromadna."], "objasnjenje": "Srpsko-makedonska masa je stara gromadna masa — niža, zaobljenih vrhova. Nastavlja se iz Srbije na istok Severne Makedonije.", "iz_udzbenika": {"strana": 29, "odeljak": "Fizičko-geografske odlike — reljef", "tekst": "Na istoku se iz Srbije nastavlja Srpsko-makedonska masa, koja je po postanku gromadna."}, "lekcija": 9}, {"id": "l09-reljef-tn-masa", "vrsta": "tacno_netacno", "tezina": "srednje", "pojmovi": ["srpsko-makedonska-masa", "nabrane-planine", "gromadne-planine"], "tvrdnja": "Srpsko-makedonska masa je mlada nabrana planina na zapadu zemlje.", "tacno": false, "ispravke": [{"tekst": "To je stara gromadna masa na istoku zemlje.", "tacan": true}, {"tekst": "To je mlada nabrana planina na istoku zemlje.", "tacan": false}, {"tekst": "To je stara gromadna masa na zapadu zemlje.", "tacan": false}], "pomoc": ["U tvrdnji su pogrešna dva podatka — i postanak i strana sveta.", "Na zapadu su Šarske planine; masa se nastavlja iz Srbije s druge strane Vardara.", "Iz lekcije: istok — Srpsko-makedonska masa, gromadna."], "objasnjenje": "Netačno — Srpsko-makedonska masa je stara gromadna masa na istoku; nabrane Šarske planine su na zapadu.", "iz_udzbenika": {"strana": 29, "odeljak": "Fizičko-geografske odlike — reljef", "tekst": "Vardar deli zemlju — na zapadu su nabrane Šarske planine, a na istoku gromadna Srpsko-makedonska masa."}, "lekcija": 9}, {"id": "l09-reljef-povezi-postanak", "vrsta": "povezi", "tezina": "srednje", "pojmovi": ["sar-planina", "srpsko-makedonska-masa", "vardar", "nabrane-planine", "gromadne-planine"], "pitanje": "Poveži oblik reljefa sa opisom.", "parovi": [["Šarske planine", "nabrane, mlade, oštrih vrhova — na zapadu"], ["Srpsko-makedonska masa", "gromadna, stara, zaobljena — na istoku"], ["Vardar", "deli zemlju na zapadni i istočni deo"], ["kotline", "niži i ravniji delovi između planina"]], "pomoc": ["Jedan pojam je reka, a ne planina.", "Mlade planine su na zapadu, stare na istoku.", "Iz lekcije: planinsko-kotlinska zemlja; Vardar deli Šarske planine od Srpsko-makedonske mase."], "objasnjenje": "Šarske planine — nabrane, zapad; Srpsko-makedonska masa — gromadna, istok; Vardar ih razdvaja; kotline su niži delovi između planina.", "iz_udzbenika": {"strana": 29, "odeljak": "Fizičko-geografske odlike — reljef", "tekst": "Zemlja je planinsko-kotlinska; Vardar razdvaja nabrane Šarske planine na zapadu od gromadne Srpsko-makedonske mase na istoku."}, "lekcija": 9}, {"id": "l09-reljef-klik-sar", "vrsta": "karta_klik", "tezina": "srednje", "pojmovi": ["sar-planina"], "pitanje": "Klikni na kartu — Šar-planina.", "cilj": {"mesto": "sar-planina"}, "pomoc": ["Šarske planine su na zapadu, zapadno od Vardara.", "Traži severozapadni kut zemlje, na granici sa Srbijom (Kosovo i Metohija).", "Klikni severozapad Severne Makedonije, iznad Tetova."], "objasnjenje": "Šar-planina je na severozapadu, na granici sa Srbijom; podno nje je Tetovo.", "iz_udzbenika": {"strana": 29, "odeljak": "Fizičko-geografske odlike — reljef", "tekst": "Šarske planine zauzimaju zapad i severozapad zemlje; na njihovim padinama razvijeno je stočarstvo.", "slika": "09-severna-makedonija/02-sar-planina.jpg"}, "lekcija": 9}, {"id": "l09-reljef-klik-masa", "vrsta": "karta_klik", "tezina": "srednje", "pojmovi": ["srpsko-makedonska-masa"], "pitanje": "Klikni na kartu — Srpsko-makedonska masa u Severnoj Makedoniji.", "cilj": {"mesto": "srpsko-makedonska-masa"}, "pomoc": ["Masa je s one strane Vardara gde nisu Šarske planine.", "Traži istočni deo zemlje, prema Bugarskoj.", "Klikni istočni deo Severne Makedonije, između Vardara i bugarske granice."], "objasnjenje": "Srpsko-makedonska masa zauzima istočni deo zemlje, istočno od Vardara.", "iz_udzbenika": {"strana": 29, "odeljak": "Fizičko-geografske odlike — reljef", "tekst": "Na istoku zemlje nastavlja se Srpsko-makedonska masa iz Srbije."}, "lekcija": 9}, {"id": "l09-reljef-gde-sar", "vrsta": "gde_sam", "tezina": "srednje", "pojmovi": ["sar-planina", "stocarstvo", "nabrane-planine"], "pitanje": "Gde sam? Pročitaj trag i klikni mesto na karti.", "cilj": {"mesto": "sar-planina"}, "tragovi": ["Nastavljam se iz Srbije, sa Kosova i Metohije.", "Na mojim padinama pasu stada — tu je razvijeno stočarstvo.", "Imam visoke, oštre vrhove, jer sam mlada nabrana planina.", "Uzdižem se iznad Tetova, na severozapadu Severne Makedonije."], "objasnjenje": "Šar-planina — nabrana planina na severozapadu, iznad Tetova, sa stočarstvom na padinama.", "iz_udzbenika": {"strana": 29, "odeljak": "Fizičko-geografske odlike — reljef", "tekst": "Šar-planina ima visoke stenovite vrhove; na njenim padinama razvijeno je stočarstvo.", "slika": "09-severna-makedonija/02-sar-planina.jpg"}, "lekcija": 9}]}, {"naslov": "Klima i vode", "zadaci": [{"id": "l09-klima-izbor-srediste", "vrsta": "izbor", "tezina": "lako", "pojmovi": ["izmenjenosredozemna-klima"], "pitanje": "Koja klima vlada u središnjem delu Severne Makedonije?", "odgovori": [{"tekst": "izmenjenosredozemna", "tacan": true}, {"tekst": "polarna", "tacan": false}, {"tekst": "pustinjska", "tacan": false}, {"tekst": "okeanska", "tacan": false}], "pomoc": ["Polarna i pustinjska klima ne postoje na Balkanu.", "Topli uticaj dolazi sa obližnjeg mora na jugu.", "Iz lekcije: u središnjem delu je izmenjenosredozemna klima."], "objasnjenje": "U središnjem delu, u dolini Vardara, vlada izmenjenosredozemna klima, jer tuda prodire uticaj Egejskog mora.", "iz_udzbenika": {"strana": 29, "odeljak": "Fizičko-geografske odlike — klima", "tekst": "Dolinom Vardara prodire uticaj Egejskog mora, pa središte zemlje ima izmenjenosredozemnu klimu."}, "lekcija": 9}, {"id": "l09-klima-tn-planinska", "vrsta": "tacno_netacno", "tezina": "lako", "pojmovi": ["planinska-klima", "sar-planina"], "tvrdnja": "Na visokim planinama na severozapadu zemlje vlada pretežno planinska klima.", "tacno": true, "pomoc": ["Na severozapadu su visoke Šarske planine.", "Što je teren viši, to je hladnije.", "Iz lekcije: na visokim planinama severozapada — planinska klima."], "objasnjenje": "Tačno — na visokim planinama severozapada (Šar-planina) vlada planinska klima.", "iz_udzbenika": {"strana": 29, "odeljak": "Fizičko-geografske odlike — klima", "tekst": "Visoke planine na severozapadu imaju pretežno planinsku klimu.", "slika": "09-severna-makedonija/02-sar-planina.jpg"}, "lekcija": 9}, {"id": "l09-klima-povezi", "vrsta": "povezi", "tezina": "lako", "pojmovi": ["izmenjenosredozemna-klima", "planinska-klima", "egejsko-more"], "pitanje": "Poveži deo zemlje sa klimom ili uticajem.", "parovi": [["središte zemlje, dolina Vardara", "izmenjenosredozemna klima"], ["visoke planine na severozapadu", "planinska klima"], ["Egejsko more", "izvor toplog uticaja koji dopire dolinom"]], "pomoc": ["Visoko u planinama je hladno.", "Topao vazduh dolazi sa juga, sa mora.", "Iz lekcije: dolina Vardara — izmenjenosredozemna; severozapadne planine — planinska."], "objasnjenje": "Središte (dolina Vardara) — izmenjenosredozemna; visoke planine — planinska; Egejsko more je izvor toplog uticaja.", "iz_udzbenika": {"strana": 29, "odeljak": "Fizičko-geografske odlike — klima", "tekst": "Uticaj Egejskog mora dopire dolinom Vardara do središta zemlje; na visokim planinama severozapada klima je planinska."}, "lekcija": 9}, {"id": "l09-klima-dopuni-egejsko", "vrsta": "dopuni", "tezina": "srednje", "pojmovi": ["vardar", "egejsko-more", "izmenjenosredozemna-klima"], "pitanje": "Dopuni rečenicu rečima iz banke.", "tekst": "Dolinom {{Vardara}} prodire uticaj {{Egejskog}} mora, pa u središtu zemlje vlada {{izmenjenosredozemna}} klima.", "ponudjene": ["Vardara", "Strumice", "Egejskog", "Jadranskog", "izmenjenosredozemna", "kontinentalna"], "pomoc": ["Reka kroz koju dopire uticaj teče kroz sredinu zemlje ka jugu.", "More je južno od zemlje, u Grčkoj — ne Jadransko.", "Iz lekcije: dolinom Vardara dopire uticaj Egejskog mora → izmenjenosredozemna klima."], "objasnjenje": "Dolinom Vardara prodire uticaj Egejskog mora, pa je u središtu izmenjenosredozemna klima.", "iz_udzbenika": {"strana": 29, "odeljak": "Fizičko-geografske odlike — klima", "tekst": "Kroz dolinu Vardara dopire uticaj Egejskog mora, pa središnji deo zemlje ima izmenjenosredozemnu klimu.", "slika": "09-severna-makedonija/03-reka-vardar.jpg"}, "lekcija": 9}, {"id": "l09-klima-zakljuci-bez-mora", "vrsta": "zakljuci", "tezina": "srednje", "pojmovi": ["izmenjenosredozemna-klima", "vardar", "egejsko-more", "kontinentalna-zemlja"], "pitanje": "Kako zemlja bez mora može da ima izmenjenosredozemnu klimu?", "odgovori": [{"tekst": "Dolina Vardara je otvorena ka jugu, pa topao vazduh sa Egejskog mora prodire u unutrašnjost.", "tacan": true}, {"tekst": "Zato što je Severna Makedonija na samom ekvatoru.", "tacan": false}, {"tekst": "Zato što Šar-planina zadržava hladan vazduh sa juga.", "tacan": false}, {"tekst": "Zato što u njoj ima mnogo jezera koja greju vazduh.", "tacan": false}], "pomoc": ["Korak 1: Odakle dolazi sredozemni uticaj — koje more je najbliže, i na kojoj strani?", "Korak 2: Kojim putem kroz planine taj vazduh može da prođe?", "Iz lekcije: dolinom Vardara prodire uticaj Egejskog mora."], "objasnjenje": "Dolina Vardara je otvorena ka Egejskom moru, pa topli vazduh prodire duboko u unutrašnjost.", "iz_udzbenika": {"strana": 29, "odeljak": "Fizičko-geografske odlike — klima", "tekst": "Uticaj Egejskog mora prodire dolinom Vardara, pa središnji deo zemlje ima izmenjenosredozemnu klimu.", "slika": "09-severna-makedonija/03-reka-vardar.jpg"}, "lekcija": 9}, {"id": "l09-klima-tn-jadransko", "vrsta": "tacno_netacno", "tezina": "srednje", "pojmovi": ["egejsko-more", "vardar", "izmenjenosredozemna-klima"], "tvrdnja": "Sredozemni uticaj u Severnu Makedoniju dopire sa Jadranskog mora, preko Šar-planine.", "tacno": false, "ispravke": [{"tekst": "Dopire sa Egejskog mora, dolinom Vardara.", "tacan": true}, {"tekst": "Dopire sa Jadranskog mora, dolinom Vardara.", "tacan": false}, {"tekst": "Dopire sa Crnog mora, dolinom Strumice.", "tacan": false}], "pomoc": ["Visoke planine zaustavljaju topao vazduh — on mora da prođe kroz dolinu.", "Vardar teče ka jugu, u more koje je u Grčkoj.", "Iz lekcije: dolinom Vardara dopire uticaj Egejskog mora."], "objasnjenje": "Netačno — uticaj dolazi sa Egejskog mora i prodire dolinom Vardara; visoka Šar-planina ima planinsku klimu.", "iz_udzbenika": {"strana": 29, "odeljak": "Fizičko-geografske odlike — klima", "tekst": "Dolinom Vardara prodire uticaj Egejskog mora; na planinama severozapada klima je planinska."}, "lekcija": 9}, {"id": "l09-klima-klik-egejsko", "vrsta": "karta_klik", "tezina": "srednje", "pojmovi": ["egejsko-more", "vardar"], "pitanje": "Klikni na more čiji uticaj dolinom Vardara dopire u Severnu Makedoniju.", "cilj": {"mesto": "egejsko-more"}, "pomoc": ["Prati Vardar od Skoplja ka jugoistoku.", "Reka se uliva u more u Grčkoj, kod Soluna.", "Klikni na zaliv Egejskog mora na jugu karte, kod Soluna."], "objasnjenje": "Vardar se kod Soluna uliva u Egejsko more; odatle topao uticaj dopire uz dolinu na sever.", "iz_udzbenika": {"strana": 29, "odeljak": "Fizičko-geografske odlike — klima", "tekst": "Uticaj Egejskog mora dopire dolinom Vardara u središte zemlje."}, "lekcija": 9}, {"id": "l09-vode-izbor-reke", "vrsta": "izbor", "tezina": "lako", "pojmovi": ["vardar", "strumica"], "pitanje": "Koje su veće reke Severne Makedonije? (Više tačnih.)", "odgovori": [{"tekst": "Vardar", "tacan": true}, {"tekst": "Strumica", "tacan": true}, {"tekst": "Tisa", "tacan": false}, {"tekst": "Neretva", "tacan": false}], "pomoc": ["Tisa teče kroz Vojvodinu, a Neretva kroz Hercegovinu.", "Jedna reka teče kroz Skoplje, a druga na jugoistoku zemlje.", "Iz lekcije: veće reke su Vardar i Strumica."], "objasnjenje": "Veće reke su Vardar i Strumica; obe pripadaju Egejskom slivu.", "iz_udzbenika": {"strana": 29, "odeljak": "Fizičko-geografske odlike — vode", "tekst": "Veće reke su Vardar i Strumica, i obe pripadaju Egejskom slivu.", "slika": "09-severna-makedonija/03-reka-vardar.jpg"}, "lekcija": 9}, {"id": "l09-vode-izbor-sliv", "vrsta": "izbor", "tezina": "srednje", "pojmovi": ["egejski-sliv", "vardar", "strumica"], "pitanje": "Kom slivu pripadaju Vardar i Strumica?", "odgovori": [{"tekst": "Egejskom slivu", "tacan": true}, {"tekst": "Jadranskom slivu", "tacan": false}, {"tekst": "Crnomorskom slivu", "tacan": false}, {"tekst": "Baltičkom slivu", "tacan": false}], "pomoc": ["Pogledaj kuda teku — ka severu ili ka jugu?", "Obe reke na kraju stižu u more u Grčkoj.", "Iz lekcije: Vardar i Strumica pripadaju Egejskom slivu."], "objasnjenje": "Obe reke pripadaju Egejskom slivu — njihova voda stiže u Egejsko more.", "iz_udzbenika": {"strana": 29, "odeljak": "Fizičko-geografske odlike — vode", "tekst": "Vardar i Strumica su veće reke Egejskog sliva.", "slika": "09-severna-makedonija/03-reka-vardar.jpg"}, "lekcija": 9}, {"id": "l09-vode-klik-vardar", "vrsta": "karta_klik", "tezina": "srednje", "pojmovi": ["vardar"], "pitanje": "Klikni na kartu — reka Vardar u središtu Severne Makedonije.", "cilj": {"mesto": "vardar"}, "pomoc": ["Vardar teče od severozapada ka jugoistoku, kroz Skoplje.", "Deli zemlju na zapad i istok — traži sredinu zemlje.", "Klikni sredinu Severne Makedonije, jugoistočno od Skoplja."], "objasnjenje": "Vardar teče kroz sredinu zemlje, od Skoplja ka Grčkoj i Egejskom moru.", "iz_udzbenika": {"strana": 29, "odeljak": "Fizičko-geografske odlike — vode", "tekst": "Vardar teče kroz Skoplje i sredinu zemlje ka jugu, u Egejski sliv.", "slika": "09-severna-makedonija/03-reka-vardar.jpg"}, "lekcija": 9}, {"id": "l09-vode-klik-strumica", "vrsta": "karta_klik", "tezina": "tesko", "pojmovi": ["strumica"], "pitanje": "Klikni na kartu — reka Strumica.", "cilj": {"mesto": "strumica"}, "pomoc": ["Strumica je na jugoistoku zemlje.", "Teče ka istoku, prema Bugarskoj, severno od Dojranskog jezera.", "Klikni jugoistok Severne Makedonije, blizu bugarske granice."], "objasnjenje": "Strumica teče na jugoistoku zemlje ka Bugarskoj, gde se uliva u Strumu.", "iz_udzbenika": {"strana": 29, "odeljak": "Fizičko-geografske odlike — vode", "tekst": "Druga veća reka je Strumica; i ona pripada Egejskom slivu."}, "lekcija": 9}, {"id": "l09-vode-izbor-jezera", "vrsta": "izbor", "tezina": "tesko", "pojmovi": ["ohridsko-jezero", "dojransko-jezero", "prespansko-jezero"], "pitanje": "Koja su tri najvažnija jezera Severne Makedonije? (Više tačnih.)", "odgovori": [{"tekst": "Ohridsko", "tacan": true}, {"tekst": "Prespansko", "tacan": true}, {"tekst": "Dojransko", "tacan": true}, {"tekst": "Skadarsko", "tacan": false}, {"tekst": "Tikveško", "tacan": false}], "pomoc": ["Najvažnija su prirodna jezera koja delom čine granicu sa susedima.", "Skadarsko je između Crne Gore i Albanije; Tikveško je veštačko jezero.", "Iz lekcije: Ohridsko, Dojransko i Prespansko jezero."], "objasnjenje": "Najvažnija su Ohridsko, Prespansko i Dojransko jezero. Tikveško je veštačko, a Skadarsko nije u Severnoj Makedoniji.", "iz_udzbenika": {"strana": 30, "odeljak": "Fizičko-geografske odlike — vode", "tekst": "Najvažnija jezera su Ohridsko, Dojransko i Prespansko; delimično su prirodna granica sa susednim državama.", "slika": "09-severna-makedonija/04-ohridsko-jezero.jpg"}, "lekcija": 9}, {"id": "l09-vode-povezi-jezera", "vrsta": "povezi", "tezina": "tesko", "pojmovi": ["ohridsko-jezero", "dojransko-jezero", "prespansko-jezero", "albanija", "grcka"], "pitanje": "Poveži jezero sa državama sa kojima ga Severna Makedonija deli.", "parovi": [["Ohridsko jezero", "Albanija"], ["Dojransko jezero", "Grčka"], ["Prespansko jezero", "Albanija i Grčka"]], "pomoc": ["Ohridsko jezero je na jugozapadu, a Dojransko na jugoistoku.", "Jedno jezero je na tromeđi tri države.", "Iz lekcije: Ohridsko — Albanija; Dojransko — Grčka; Prespansko — Albanija i Grčka."], "objasnjenje": "Ohridsko deli sa Albanijom, Dojransko sa Grčkom, a Prespansko je na tromeđi sa Albanijom i Grčkom.", "iz_udzbenika": {"strana": 30, "odeljak": "Zadatak — rad sa atlasom", "tekst": "U zadatku se upisuje na teritoriji kojih država su Dojransko i Prespansko jezero; jezera delom čine prirodnu granicu sa susedima.", "slika": "09-severna-makedonija/04-ohridsko-jezero.jpg"}, "lekcija": 9}, {"id": "l09-vode-dopuni-jezera", "vrsta": "dopuni", "tezina": "tesko", "pojmovi": ["ohridsko-jezero", "dojransko-jezero", "albanija", "grcka"], "pitanje": "Dopuni rečenicu (bez ponuđenih reči).", "tekst": "Ohridsko jezero Severna Makedonija deli sa {{Albanijom|Albanija}}, a Dojransko sa {{Grčkom|Grčka}}.", "pomoc": ["Ohridsko jezero je na zapadnoj granici, Dojransko na južnoj.", "Zapadni sused izlazi na Jadransko more, a južni na Egejsko.", "Iz lekcije: Ohridsko — granica sa Albanijom; Dojransko — granica sa Grčkom."], "objasnjenje": "Ohridsko jezero je na granici sa Albanijom, a Dojransko na granici sa Grčkom.", "iz_udzbenika": {"strana": 30, "odeljak": "Fizičko-geografske odlike — vode", "tekst": "Jezera delom čine prirodnu granicu — Ohridsko i Prespansko sa Albanijom, Prespansko i Dojransko sa Grčkom."}, "lekcija": 9}, {"id": "l09-vode-klik-ohrid", "vrsta": "karta_klik", "tezina": "srednje", "pojmovi": ["ohridsko-jezero"], "pitanje": "Klikni na kartu — Ohridsko jezero.", "cilj": {"mesto": "ohridsko-jezero"}, "pomoc": ["Ohridsko jezero je na jugozapadu zemlje.", "Leži na granici sa Albanijom.", "Klikni jugozapadni kut Severne Makedonije, na albanskoj granici."], "objasnjenje": "Ohridsko jezero je na jugozapadu, na granici sa Albanijom; istočno od njega je manje Prespansko jezero.", "iz_udzbenika": {"strana": 30, "odeljak": "Fizičko-geografske odlike — vode", "tekst": "Ohridsko jezero je delom prirodna granica sa Albanijom i jedan od glavnih turističkih centara.", "slika": "09-severna-makedonija/04-ohridsko-jezero.jpg"}, "lekcija": 9}, {"id": "l09-vode-klik-albanija", "vrsta": "karta_klik", "tezina": "srednje", "pojmovi": ["albanija", "ohridsko-jezero"], "pitanje": "Klikni na državu sa kojom Severna Makedonija deli Ohridsko jezero.", "cilj": {"drzava": "ALB"}, "pomoc": ["Ohridsko jezero je na zapadnoj granici zemlje.", "Ta država izlazi na Jadransko i Jonsko more.", "Klikni na Albaniju."], "objasnjenje": "Ohridsko jezero Severna Makedonija deli sa Albanijom, zapadnim susedom.", "iz_udzbenika": {"strana": 30, "odeljak": "Fizičko-geografske odlike — vode", "tekst": "Ohridsko i Prespansko jezero delom čine granicu sa Albanijom.", "slika": "09-severna-makedonija/04-ohridsko-jezero.jpg"}, "lekcija": 9}, {"id": "l09-vode-klik-dojran", "vrsta": "karta_klik", "tezina": "tesko", "pojmovi": ["dojransko-jezero"], "pitanje": "Klikni na kartu — Dojransko jezero.", "cilj": {"mesto": "dojransko-jezero"}, "pomoc": ["Dojransko jezero je na suprotnoj strani zemlje od Ohridskog.", "Leži na jugoistoku, na granici sa Grčkom.", "Klikni na jugoistočnu granicu Severne Makedonije sa Grčkom, istočno od Vardara."], "objasnjenje": "Dojransko jezero je na jugoistoku, na granici sa ."}, "lekcija": 9}, {"id": "l09-vode-gde-ohrid", "vrsta": "gde_sam", "tezina": "tesko", "pojmovi": ["ohridsko-jezero", "turizam"], "pitanje": "Gde sam? Pročitaj trag i klikni mesto na karti.", "cilj": {"mesto": "ohridsko-jezero"}, "tragovi": ["Duboko sam oko 288 metara i staro više miliona godina.", "Na steni iznad moje obale stoji crkva Sveti Jovan Kaneo.", "Grad na mojoj obali i ja smo pod zaštitom UNESCO-a.", "Ja sam jezero koje Severna Makedonija deli sa Albanijom, na jugozapadu."], "objasnjenje": "Ohridsko jezero — jedno od najstarijih i najdubljih u Evropi, na granici sa Albanijom, važan turistički centar.", "iz_udzbenika": {"strana": 30, "odeljak": "Fizičko-geografske odlike — vode", "tekst": "Ohridsko jezero je delom granica sa Albanijom i jedan od glavnih turističkih centara; na fotografiji je stara crkva iznad jezera.", "slika": "09-severna-makedonija/04-ohridsko-jezero.jpg"}, "lekcija": 9}]}, {"naslov": "Stanovništvo i gradovi", "zadaci": [{"id": "l09-stan-izbor-vera", "vrsta": "izbor", "tezina": "lako", "pojmovi": ["makedonci", "pravoslavlje"], "pitanje": "Koje su vere većinom Makedonci?", "odgovori": [{"tekst": "pravoslavci", "tacan": true}, {"tekst": "katolici", "tacan": false}, {"tekst": "protestanti", "tacan": false}, {"tekst": "budisti", "tacan": false}], "pomoc": ["Ista je vera kao kod većine Srba.", "Katolička je većina u Sloveniji i Hrvatskoj.", "Iz lekcije: Makedonci su pravoslavci."], "objasnjenje": "Makedonci su pravoslavci; albansko stanovništvo na zapadu je pretežno islamske vere.", "iz_udzbenika": {"strana": 30, "odeljak": "Društveno-geografske odlike — stanovništvo", "tekst": "Većinu čine Makedonci, koji su pravoslavci; na zapadu zemlje većina je albansko stanovništvo, pretežno islamske vere."}, "lekcija": 9}, {"id": "l09-stan-tn-albanci", "vrsta": "tacno_netacno", "tezina": "lako", "pojmovi": ["albanci", "islam"], "tvrdnja": "Na zapadu zemlje većinu čini albansko stanovništvo, pretežno islamske vere.", "tacno": true, "pomoc": ["Zapadni su jak": "Društveno-geografske odlike — stanovništvo", "tekst": "Većina su pravoslavni Makedonci; na zapadu je većinsko albansko stanovništvo islamske vere. Službeni jezik je makedonski."}, "lekcija": 9}, {"id": "l09-stan-dopuni-naseljenost", "vrsta": "dopuni", "tezina": "srednje", "pojmovi": ["vardar"], "pitanje": "Dopuni rečenicu rečima iz banke.", "tekst": "Naseljenost je {{neravnomerna}}; najviše ljudi živi u dolini {{Vardara}} i u {{kotlinama}}.", "ponudjene": ["neravnomerna", "ravnomerna", "Vardara", "Strumice", "kotlinama", "planinama"], "pomoc": ["Ako ljudi negde žive gusto, a negde retko, naseljenost nije ravnomerna.", "Ljudi biraju niža, toplija i ravnija mesta uz glavnu reku.", "Iz lekcije: najviše ljudi živi u dolini Vardara i kotlinama."], "objasnjenje": "Naseljenost je neravnomerna — najgušće su naseljene dolina Vardara i kotline, a planine retko.", "iz_udzbenika": {"strana": 30, "odeljak": "Društveno-geografske odlike — stanovništvo", "tekst": "Stanovništvo je neravnomerno raspoređeno; najviše ljudi živi u dolini Vardara i u kotlinama."}, "lekcija": 9}, {"id": "l09-stan-zakljuci-gustina", "vrsta": "zakljuci", "tezina": "srednje", "pojmovi": ["vardar", "planinsko-kotlinska-zemlja"], "pitanje": "Zašto u kotlinama i dolini Vardara živi najviše ljudi?", "odgovori": [{"tekst": "Niže su, toplije i ravnije, sa plodnim zemljištem, vodom i putevima.", "tacan": true}, {"tekst": "Zato što su tu najviši vrhovi sa snegom.", "tacan": false}, {"tekst": "Zato što je tu jedini izlaz na more.", "tacan": false}, {"tekst": "Zato što u planinama nema nijedne reke.", "tacan": false}], "pomoc": ["Korak 1: Uporedi planinu i kotlinu — gde je lakše graditi kuće i obrađivati zemlju?", "Korak 2: Kuda prolaze putevi i gde je toplije?", "Iz lekcije: najviše ljudi živi u dolini Vardara i u kotlinama."], "objasnjenje": "Kotline i dolina Vardara su niže, toplije i ravnije, imaju plodno zemljište, vodu i puteve; planine su hladne i nepristupačne.", "iz_udzbenika": {"strana": 30, "odeljak": "Društveno-geografske odlike — stanovništvo", "tekst": "Naseljenost je neravnomerna — najgušće su naseljene dolina Vardara i kotline.", "slika": "09-severna-makedonija/05-kotlina-tikves.jpg"}, "lekcija": 9}, {"id": "l09-stan-izbor-gradovi", "vrsta": "izbor", "tezina": "srednje", "pojmovi": ["skoplje", "bitolj", "kumanovo", "prilep", "tetovo"], "pitanje": "Koji su od ovih gradova veći gradovi Severne Makedonije? (Više tačnih.)", "odgovori": [{"tekst": "Skoplje", "tacan": true}, {"tekst": "Bitolj", "tacan": true}, {"tekst": "Kumanovo", "tacan": true}, {"tekst": "Prilep", "tacan": true}, {"tekst": "Tetovo", "tacan": true}, {"tekst": "Solun", "tacan": false}, {"tekst": "Niš", "tacan": false}], "pomoc": ["Dva grada su u susednim državama.", "Solun je grčka luka, a Niš je u Srbiji.", "Iz lekcije: Skoplje, Bitolj, Kumanovo, Prilep i Tetovo."], "objasnjenje": "Veći gradovi su Skoplje, Bitolj, Kumanovo, Prilep i Tetovo. Solun je u Grčkoj, a Niš u Srbiji.", "iz_udzbenika": {"strana": 30, "odeljak": "Društveno-geografske odlike — gradovi", "tekst": "Veći gradovi su Skoplje, Bitolj, Kumanovo, Prilep i Tetovo; udžbenik traži da se pronađu u atlasu."}, "lekcija": 9}, {"id": "l09-grad-klik-skoplje", "vrsta": "karta_klik", "tezina": "lako", "pojmovi": ["skoplje", "vardar"], "pitanje": "Klikni na kartu — Skoplje, glavni grad Severne Makedonije.", "cilj": {"mesto": "skoplje"}, "pomoc": ["Skoplje je na severu zemlje.", "Leži na Vardaru, nedaleko od granice sa Srbijom.", "Klikni sever Severne Makedonije, na Vardaru."], "objasnjenje": "Skoplje je na severu zemlje, na reci Vardar.", "iz_udzbenika": {"strana": 30, "odeljak": "Društveno-geografske odlike — gradovi", "tekst": "Skoplje je glavni i najveći grad, na Vardaru, i jedan od turističkih centara.", "slika": "09-severna-makedonija/03-reka-vardar.jpg"}, "lekcija": 9}, {"id": "l09-grad-klik-bitolj", "vrsta": "karta_klik", "tezina": "srednje", "pojmovi": ["bitolj"], "pitanje": "Klikni na kartu — Bitolj.", "cilj": {"mesto": "bitolj"}, eko od granice sa Srbijom.", "Ja sam glavni grad Severne Makedonije."], "objasnjenje": "Skoplje — glavni grad, na Vardaru, na severu zemlje.", "iz_udzbenika": {"strana": 29, "odeljak": "Fizičko-geografske odlike — vode", "tekst": "Fotografija prikazuje Vardar kako u uređenom koritu teče kroz Skoplje.", "slika": "09-severna-makedonija/03-reka-vardar.jpg"}, "lekcija": 9}, {"id": "l09-grad-povezi-gradovi", "vrsta": "povezi", "tezina": "tesko", "pojmovi": ["skoplje", "bitolj", "kumanovo", "prilep", "tetovo"], "pitanje": "Poveži grad sa njegovim položajem.", "parovi": [["Skoplje", "na Vardaru, glavni grad na severu"], ["Bitolj", "na jugu, blizu granice sa Grčkom"], ["Kumanovo", "severoistočno od Skoplja, blizu Srbije"], ["Tetovo", "severozapad, podno Šar-planine"], ["Prilep", "u Pelagoniji, severno od Bitolja"]], "pomoc": ["Tri grada su na severu, a dva na jugu zemlje.", "Šar-planina je na severozapadu; Prilep i Bitolj su u istoj ravnici.", "Iz lekcije: veći gradovi su Skoplje, Bitolj, Kumanovo, Prilep i Tetovo (pronađi ih u atlasu)."], "objasnjenje": "Skoplje — na Vardaru; Kumanovo — SI od Skoplja; Tetovo — podno Šar-planine; Prilep i Bitolj — na jugu, u Pelagoniji.", "iz_udzbenika": {"strana": 30, "odeljak": "Društveno-geografske odlike — gradovi", "tekst": "Veći gradovi su Skoplje, Bitolj, Kumanovo, Prilep i Tetovo; udžbenik traži da se pronađu u atlasu."}, "lekcija": 9}, {"id": "l09-stan-zakljuci-tetovo", "vrsta": "zakljuci", "tezina": "tesko", "pojmovi": ["tetovo", "albanci", "islam"], "pitanje": "U kom od ova dva grada je verovatnije da većina stanovnika pripada islamu: Tetovo ili Strumica?", "odgovori": [{"tekst": "U Tetovu, jer je na zapadu zemlje, gde većinu čine Albanci.", "tacan": true}, {"tekst": "U Strumici, jer je blizu Grčke.", "tacan": false}, {"tekst": "U Tetovu, jer je na istoku zemlje.", "tacan": false}, {"tekst": "Nema razlike — cela zemlja je muslimanska.", "tacan": false}], "pomoc": ["Korak 1: Gde žive Albanci, pretežno islamske vere — na zapadu ili istoku?", "Korak 2: Tetovo je podno Šar-planine, a Strumica na jugoistoku.", "Iz lekcije: na zapadu zemlje većinu čini albansko stanovništvo islamske vere."], "objasnjenje": "Tetovo je na zapadu (severozapadu), gde većinu čine Albanci, pretežno muslimani; Strumica je na jugoistoku.", "iz_udzbenika": {"strana": 30, "odeljak": "Društveno-geografske odlike — stanovništvo", "tekst": "Na zapadu zemlje većinu čini albansko stanovništvo, pretežno islamske vere."}, "lekcija": 9}]}, {"naslov": "Privreda i turizam", "zadaci": [{"id": "l09-priv-izbor-razvijenost", "vrsta": "izbor", "tezina": "lako", "pojmovi": ["severna-makedonija"], "pitanje": "Kakva je Severna Makedonija privredno?", "odgovori": [{"tekst": "slabije razvijena zemlja", "tacan": true}, {"tekst": "najrazvijenija zemlja Balkana", "tacan": false}, {"tekst": "zemlja razvijenog pomorstva i brodogradnje", "tacan": false}, {"tekst": "bogata naftom kao glavnim izvozom", "tacan": false}], "pomoc": ["Zemlja nema more, pa nema ni pomorstvo.", "Najrazvijenija bivša republika SFRJ je Slovenija.", "Iz lekcije: Severna Makedonija je privredno slabije razvijena."], "objasnjenje": "Severna Makedonija je privredno slabije razvijena; ističu se voćarstvo, vinogradarstvo, stočarstvo i turizam.", "iz_udzbenika": {"strana": 30, "odeljak": "Društveno-geografske odlike — privreda", "tekst": "Zemlja je privredno slabije razvijena; važni su voćarstvo, vinogradarstvo, stočarstvo i turizam."}, "lekcija": 9}, {"id": "l09-priv-tn-tikves", "vrsta": "tacno_netacno", "tezina": "lako", "pojmovi": ["tikveska-kotlina", "vinogradarstvo"], "tvrdnja": "U Tikveškoj kotlini razvijeno je vinogradarstvo.", "tacno": true, "pomoc": ["Na fotografiji kotline Tikveš vide se redovi biljaka u ravnici.", "To su redovi vinove loze.", "Iz lekcije: vinogradarstvo — Tikveška kotlina."], "objasnjenje": "Tačno — Tikveška kotlina je najpoznatiji vinogradarski kraj zemlje.", "iz_udzbenika": {"strana": 30, "odeljak": "Društveno-geografske odlike — privreda", "tekst": "Zbog sredozemnog uticaja u Tikveškoj kotlini je razvijeno vinogradarstvo.", "slika": "09-severna-makedonija/05-kotlina-tikves.jpg"}, "lekcija": 9}, {"id": "l09-priv-dopuni-grane", "vrsta": "dopuni", "tezina": "lako", "pojmovi": ["vocarstvo", "vinogradarstvo", "ohridska-kotlina", "prespanska-kotlina", "tikveska-kotlina"], "pitanje": "Dopuni rečenicu rečima iz banke.", "tekst": "U Ohridskoj i Prespanskoj kotlini razvijeno je {{voćarstvo}}, a u Tikveškoj kotlini {{vinogradarstvo}}.", "ponudjene": ["voćarstvo", "vinogradarstvo", "ribarstvo"], "pomoc": ["Tikveš je poznat po vinovoj lozi.", "Ribarstvo se ne pominje kao grana koju razvija sredozemna klima.", "Iz lekcije: voćarstvo — Ohridska i Prespanska kotlina; vinogradarstvo — Tikveška."], "objasnjenje": "Voćarstvo je razvijeno u Ohridskoj i Prespanskoj kotlini, a vinogradarstvo u Tikveškoj.", "iz_udzbenika": {"strana": 30, "odeljak": "Društveno-geografske odlike — privreda", "tekst": "Zahvaljujući sredozemnom uticaju, voćarstvo je razvijeno u Ohridskoj i Prespanskoj, a vinogradarstvo u Tikveškoj kotlini.", "slika": "09-severna-makedonija/05-kotlina-tikves.jpg"}, "lekcija": 9}, {"id": "l09-priv-zakljuci-klima", "vrsta": "zakljuci", "tezina": "lako", "pojmovi": ["vocarstvo", "vinogradarstvo", "izmenjenosredozemna-klima"], "pitanje": "Šta je omogućilo razvoj voćarstva i vinogradarstva u Severnoj Makedoniji?", "odgovori": [{"tekst": "uticaj sredozemne klime", "tacan": true}, {"tekst": "izlaz na more", "tacan": false}, {"tekst": "polarna hladnoća", "tacan": false}, {"tekst": "velike pustinje", "tacan": false}], "pomoc": ["Korak 1: Vinova loza i voće traže toplo vreme.", "Korak 2: Odakle dolazi toplota u kotline — zemlja nema more, ali ima dolinu otvorenu ka jugu.", "Iz lekcije: zahvaljujući uticaju sredozemne klime razvijeni su voćarstvo i vinogradarstvo."], "objasnjenje": "Topli sredozemni uticaj, koji dopire dolinom Vardara, omogućio je voćarstvo i vinogradarstvo.", "iz_udzbenika": {"strana": 30, "odeljak": "Društveno-geografske odlike — privreda", "tekst": "Zahvaljujući uticaju sredozemne klime razvijeni su voćarstvo i vinogradarstvo."}, "lekcija": 9}, {"id": "l09-priv-povezi-kotline", "vrsta": "povezi", "tezina": "srednje", "pojmovi": ["ohridska-kotlina", "prespanska-kotlina", "tikveska-kotlina", "sar-planina", "vocarstvo", "vinogradarstvo", "stocarstvo", "turizam"], "pitanje": "Poveži kraj sa privrednom granom koja je u njemu razvijena.", "parovi": [["Ohridska i Prespanska kotlina", "voćarstvo"], ["Tikveška kotlina", "vinogradarstvo"], ["padine Šar-planine", "stočarstvo"], ["Skoplje, Ohridsko i Prespansko jezero", "turizam"]], "pomoc": ["Na planinskim pašnjacima se gaje stada.", "Tikveš je poznat po vinu, a jezera privlače posetioce.", "Iz lekcije: voćarstvo — Ohrid i Prespa; vinogradarstvo — Tikveš; stočarstvo — Šar-planina; turizam — Skoplje i jezera."], "objasnjenje": "Ohridska i Prespanska kotlina — voće; Tikveš — vinova loza; Šar-planina — stočarstvo; Skoplje i jezera — turizam.", "iz_udzbenika": {"strana": 30, "odeljak": "Društveno-geografske odlike — privreda", "tekst": "Voćarstvo je u Ohridskoj i Prespanskoj kotlini, vinogradarstvo u Tikveškoj, stočarstvo na Šar-planini, a turistički centri su Skoplje i jezera."}, "lekcija": 9}, {"id": "l09-priv-dopuni-turizam", "vrsta": "dopuni", "tezina": "srednje", "pojmovi": ["turizam", "skoplje", "prespansko-jezero"], "pitanje": "Dopuni rečenicu rečima iz banke.", "tekst": "Turistički centri Severne Makedonije su glavni grad {{Skoplje}} i dva jezera na jugozapadu — Ohridsko i {{Prespansko}}.", "ponudjene": ["Skoplje", "Bitolj", "Prespansko", "Dojransko"], "pomoc": ["Glavni grad je na Vardaru.", "Dojransko jezero je na jugoistoku, a traži se jezero na jugozapadu, pored Ohridskog.", "Iz lekcije: turistički centri su Skoplje, Ohridsko i Prespansko jezero."], "objasnjenje": "Turistički centri su Skoplje, Ohridsko i Prespansko jezero.", "iz_udzbenika": {"strana": 30, "odeljak": "Društveno-geografske odlike — privreda", "tekst": "Turistički   const fin = state.inst.filter(t => t.end).slice().reverse();

  document.getElementById('navList').innerHTML = h;

// ---------- outcome ----------
function fail(z, text, given) {
  const s = st(z.id);
  s.miss++;
  record(z, s, false, given);
  const ended = s.miss > steps(z);
  if (ended) { s.status = 'revealed'; s.pts = 0; learnFrom(z, 0); place(z, false); toast('Evo odgovora', false); }
  else toast(text || 'Netačno — pokušaj ponovo', false);
  finishCheck(); save(); renderItem(true); renderNav(); refreshScore();
  if (ended || !mobile()) openDrawer();
}
function succeed(z, given, pts) {   // pts: set only by self-graded `objasni`
  const s = st(z.id), first = s.first == null;
  s.status = 'ok'; s.pts = pts != null ? pts : ptsFor(s.miss);
  record(z, s, true, given);
  learnFrom(z, s.pts);
  s.placed = place(z, true);
  toast((first ? 'Tačno!' : 'Tačno, ali u rezultat ide prvi odgovor') + (s.placed ? ' · na vremenskoj osi' : ''), true);
  finishCheck(); save(); renderItem(false); renderNav(); refreshScore();
  openDrawer();
}

// ---------- item renderers ----------
const main = document.getElementById('main');
function frame(z, s, inner) {

}
function questionFig(z, s) {   // `slika_u_pitanju`: the question asks to look at the picture, so it stands under the answers (caption only once answered)
  const b = z.iz_udzbenika; if (!z.slika_u_pitanju || !b || !b.slika) return '';

    (INFO.zasticeno ? 'this.parentNode.outerHTML=\'<p class=&quot;ref&quot;>Slika uz ovo pitanje je u <a href=&quot;' + esc(INFO.zasticeno) + '&quot;>verziji sa slikama iz udžbenika (lozinka)</a>.</p>\'' : 'this.parentNode.remove()') +

function nextButton(z) {   // done: Sledeći + reopen the drawer; in progress with help used: reopen the help

function prelude(z, s) {   // what stands above the options: a source, a cause→effect chain, the clues so far
  const done = isDone(s), right = z.odgovori && z.odgovori.find(o => o.tacan);
  if (z.vrsta === 'izvor') { const iz = z.izvor;
    return '<div class="src">' + (iz.autor || iz.naslov ? '<p class="who">' + esc([iz.autor, iz.naslov].filter(Boolean).join(' — ')) + '</p>' : '') +
      '<blockquote>' + fmt(iz.tekst) + '</blockquote>' + (iz.napomena ? '<p class="nt">' + fmt(iz.napomena) + '</p>' : '') + '</div>'; }
  if (z.vrsta === 'lanac') return '<div class="chain">' + z.karike.map((k, i) => (i ? '<span class="ar">→</span>' : '') +
    (i === z.praznina ? '<div class="lk q' + (done ? ' ok' : '') + '">' + (done ? fmt(right.tekst) : '?') + '</div>' : '<div class="lk">' + fmt(k) + '</div>')).join('') + '</div>';
  if (z.vrsta === 'ko_sam') { const n = Math.min(z.tragovi.length, done ? z.tragovi.length : s.miss + 1);
    return '<ul class="clues">' + z.tragovi.slice(0, n).map((t, i) => '<li><span class="k">Trag ' + (i + 1) + '</span>' + fmt(t) + '</li>').join('') + '</ul>'; }
  return '';
}
function renderChoice(z, s) {   // izbor, zakljuci, lanac, izvor, ko_sam (+ the correction step of tacno_netacno)
  const opts = shuffled(z.odgovori, z.id);
  const multi = z.odgovori.filter(o => o.tacan).length > 1;
  const ui = s.ui; ui.wrong = ui.wrong || []; ui.pick = ui.pick || [];
  const done = isDone(s), showRight = s.status === 'ok' || s.status === 'revealed';
  const why = o => o.zasto ? '<span class="why">' + fmt(o.zasto) + '</span>' : '';
  main.innerHTML = frame(z, s, prelude(z, s) + '<h2 class="q">' + fmt(z.pitanje || (z.vrsta === 'ko_sam' ? 'Ko sam ja?' : 'Koja karika nedostaje?')) + '</h2><div class="opts">' + opts.map(([o, i]) =>
    '<button type="button" class="opt' + (multi ? '' : ' round') + (ui.wrong.includes(i) ? ' wrong' : '') + (showRight && o.tacan ? ' right' : '') +
    (!done && ui.pick.includes(i) ? ' picked' : '') + '" data-i="' + i + '"' + (done || ui.wrong.includes(i) ? ' disabled' : '') + '><span class="box"></span><span><span class="ot">' + fmt(o.tekst) + '</span>' +
    (ui.wrong.includes(i) ? why(o) : '') + '</span></button>').join('') + '</div>');
  if (!done && multi) actions([['btnCheck', 'Proveri', 'ok']]);
  if (!done && z.vrsta === 'ko_sam' && s.miss < steps(z)) { actions([['btnClue', 'Još jedan trag']]); document.getElementById('btnClue').addEventListener('click', () => { ui.why = null; fail(z, 'Novi trag', 'zatražen novi trag'); }); }
  main.querySelectorAll('.opt').forEach(b => b.addEventListener('click', () => {
    const i = +b.dataset.i;
    if (!multi) { if (z.odgovori[i].tacan) succeed(z, z.odgovori[i].tekst); else { ui.wrong.push(i); ui.why = z.odgovori[i].zasto || null; fail(z, undefined, z.odgovori[i].tekst); } return; }
    ui.pick = ui.pick.includes(i) ? ui.pick.filter(x => x !== i) : ui.pick.concat(i);
    b.classList.toggle('picked'); save();
  }));
  const chk = document.getElementById('btnCheck');
  if (chk) chk.addEventListener('click', () => {
    if (!ui.pick.length) { toast('Označi bar jedan odgovor', false); return; }
    const right = z.odgovori.map((o, i) => o.tacan ? i : -1).filter(i => i >= 0);
    const wrongPicked = ui.pick.filter(i => !z.odgovori[i].tacan);

    (done ? ' disabled' : '') + (ui.bad && ui.bad.includes(k) ? ' class="bad"' : '') + '>' +
    (bce ? '<select data-era="' + k + '" aria-label="Era"' + (done ? ' disabled' : '') + '><option value="pre"' + (eraOf(k) === 'pre' ? ' selected' : '') + '>pre n. e.</option><option value="ne"' + (eraOf(k) === 'ne' ? ' selected' : '') + '>n. e.</option></select>' : '');
  const val = k => bce && (ui.era[k] || 'pre') === 'pre' ? -ui.v[k] : +ui.v[k];
  main.innerHTML = frame(z, s, '<h2 class="q">' + fmt(z.pitanje || 'Kada?') + '</h2><p class="ev">' + fmt(z.dogadjaj) + '</p>' +
