          slika: 09-severna-makedonija/05-kotlina-tikves.jpg

      - id: priv-tn-sar
        vrsta: tacno_netacno
        tezina: tesko
        pojmovi: [sar-planina, stocarstvo, planinska-klima]
        tvrdnja: Na padinama Šar-planine razvijeno je vinogradarstvo, jer tamo dopire sredozemni uticaj.
        tacno: false
        ispravke:
          - {tekst: "Tamo je razvijeno stočarstvo — ima pašnjaka, a klima je hladna, planinska.", tacan: true}
          - {tekst: "Tamo je razvijeno voćarstvo, jer je klima izmenjenosredozemna.", tacan: false}
          - {tekst: "Tamo je razvijeno vinogradarstvo, ali samo zimi.", tacan: false}
        pomoc:
          - Kakva je klima na visokim planinama severozapada?
          - Vinova loza ne uspeva na hladnim planinama, ali trava za stoku uspeva.
          - "Iz lekcije: na padinama Šar-planine razvijeno je stočarstvo; tu je planinska klima."
        objasnjenje: Netačno — na Šar-planini je planinska klima, pa je razvijeno stočarstvo; vinogradarstvo je u toplom Tikvešu.
        iz_udzbenika:
          strana: 30
          odeljak: Društveno-geografske odlike — privreda
          tekst: Na padinama Šar-planine razvijeno je stočarstvo, a vinogradarstvo u toploj Tikveškoj kotlini.
          slika: 09-severna-makedonija/02-sar-planina.jpg

      - id: priv-izbor-tvrdnje
        vrsta: izbor
        tezina: tesko
        pojmovi: [stocarstvo, vinogradarstvo, vocarstvo, tikveska-kotlina, ohridska-kotlina]
        pitanje: Koje tvrdnje o privredi Severne Makedonije su tačne? (Više tačnih.)
        odgovori:
          - {tekst: "Zemlja je privredno slabije razvijena.", tacan: true}
          - {tekst: "Stočarstvo je razvijeno na padinama Šar-planine.", tacan: true}
          - {tekst: "Vinogradarstvo je najpoznatije u Ohridskoj kotlini.", tacan: false}
          - {tekst: "Voćarstvo je razvijeno zahvaljujući planinskoj klimi.", tacan: false}
        pomoc:
          - Dve tvrdnje su skoro tačne, ali je jedan podatak zamenjen.
          - Ohridska kotlina je poznata po voću, a toplina za voće dolazi sa mora.
          - "Iz lekcije: slabije razvijena; stočarstvo — Šar-planina; vinogradarstvo — Tikveš; voćarstvo zbog sredozemne klime."
        objasnjenje: Tačno je da je zemlja slabije razvijena i da je stočarstvo na Šar-planini. Vinogradarstvo je u Tikvešu, a voćarstvo se razvilo zbog sredozemne klime.
        iz_udzbenika:
          strana: 30
          odeljak: Društveno-geografske odlike — privreda
          tekst: Slabije razvijena privreda oslanja se na voćarstvo (Ohridska i Prespanska kotlina), vinogradarstvo (Tikveš), stočarstvo (Šar-planina) i turizam.

