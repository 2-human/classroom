      - id: priv-zakljuci-tikves
        vrsta: zakljuci
        slika_u_pitanju: true
        tezina: srednje
        pojmovi: [tikveska-kotlina, vinogradarstvo, izmenjenosredozemna-klima]
        pitanje: "Na fotografiji Tikveša vidiš duge redove vinove loze u ravnoj kotlini. Šta to govori o klimi tog kraja?"
        odgovori:
          - {tekst: "Topla je, pod sredozemnim uticajem.", tacan: true}
          - {tekst: "Hladna je, planinska.", tacan: false}
          - {tekst: "Polarna, sa večitim snegom.", tacan: false}
