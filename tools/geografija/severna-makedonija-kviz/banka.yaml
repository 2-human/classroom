          - [Tikveška kotlina, vinogradarstvo]
          - [padine Šar-planine, stočarstvo]
          - ["Skoplje, Ohridsko i Prespansko jezero", turizam]
        pomoc:
          - Na planinskim pašnjacima se gaje stada.
          - Tikveš je poznat po vinu, a jezera privlače posetioce.
          - "Iz lekcije: voćarstvo — Ohrid i Prespa; vinogradarstvo — Tikveš; stočarstvo — Šar-planina; turizam — Skoplje i jezera."
        objasnjenje: Ohridska i Prespanska kotlina — voće; Tikveš — vinova loza; Šar-planina — stočarstvo; Skoplje i jezera — turizam.
        iz_udzbenika:
          strana: 30
          odeljak: Društveno-geografske odlike — privreda
          tekst: Voćarstvo je u Ohridskoj i Prespanskoj kotlini, vinogradarstvo u Tikveškoj, stočarstvo na Šar-planini, a turistički centri su Skoplje i jezera.

