        cilj: {mesto: tikveska-kotlina}
        pomoc:
          - Tikveš je u središnjem delu zemlje.
          - Leži na Vardaru, tamo gde dopire sredozemni uticaj.
          - Klikni na sredinu Severne Makedonije, na Vardaru, između Skoplja i grčke granice.
        objasnjenje: Tikveška kotlina je u središtu zemlje, na Vardaru, oko Kavadarca i Negotina.
        iz_udzbenika:
          strana: 30
          odeljak: Društveno-geografske odlike — privreda
          tekst: Tikveška kotlina je glavni vinogradarski kraj zemlje.
          slika: 09-severna-makedonija/05-kotlina-tikves.jpg

      - id: priv-gde-tikves
        vrsta: gde_sam
        tezina: tesko
        pojmovi: [tikveska-kotlina, vinogradarstvo]
        pitanje: Gde sam? Pročitaj trag i klikni mesto na karti.
        cilj: {mesto: tikveska-kotlina}
        tragovi:
