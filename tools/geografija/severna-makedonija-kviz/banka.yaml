          - Ležim oko Kavadarca i Negotina, na Vardaru.
          - Ja sam najpoznatiji vinogradarski kraj zemlje.
          - Ja sam kotlina u središtu Severne Makedonije puna redova vinove loze.
        objasnjenje: Tikveška kotlina — vinogradarski kraj u središtu zemlje, na Vardaru.
        iz_udzbenika:
          strana: 30
          odeljak: Društveno-geografske odlike — privreda
          tekst: Kotlina Tikveš je najvažniji vinogradarski kraj zbog toplog sredozemnog uticaja.
          slika: 09-severna-makedonija/05-kotlina-tikves.jpg

