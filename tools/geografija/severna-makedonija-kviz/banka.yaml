# Banka zadataka — Republika Severna Makedonija (7. razred, str. 29–30). Spaja se u spec.yaml: `delovi`
# zamenjuje spec-ove delove, `mesta` se dodaju u karta.mesta. Svaki zadatak ima `tezina` (lako | srednje | tesko).
# Pitanja su napisana sopstvenim rečima na osnovu beleške lekcije.

mesta: {}

delovi:
  - naslov: Položaj i osnovni podaci
    zadaci:
      - id: polozaj-izbor-glavni-grad
        vrsta: izbor
        tezina: lako
        pojmovi: [severna-makedonija, skoplje]
        pitanje: Koji je glavni grad Severne Makedonije?
        odgovori:
          - {tekst: Skoplje, tacan: true}
          - {tekst: Sofija, tacan: false}
          - {tekst: Tirana, tacan: false}
          - {tekst: Podgorica, tacan: false}
        pomoc:
          - Sofija, Tirana i Podgorica su glavni gradovi suseda i drugih balkanskih država.
          - Traži grad kroz koji teče reka Vardar.
          - "Iz lekcije: glavni grad Severne Makedonije je Skoplje."
        objasnjenje: Glavni grad je Skoplje, na reci Vardar. Sofija je glavni grad Bugarske, Tirana Albanije, a Podgorica Crne Gore.
        iz_udzbenika:
          strana: 29
          odeljak: Osnovni podaci
          tekst: Infografika daje osnovne podatke o zemlji — oko 1,8 miliona stanovnika, 25.713 km², glavni grad Skoplje i makedonski kao službeni jezik.
          slika: 09-severna-makedonija/01-osnovni-podaci.jpg

      - id: polozaj-tn-more
        vrsta: tacno_netacno
        tezina: lako
        pojmovi: [kontinentalna-zemlja, egejsko-more]
        tvrdnja: Severna Makedonija izlazi na Egejsko more.
        tacno: false
        ispravke:
          - {tekst: "Nema izlaz na more — kontinentalna je zemlja.", tacan: true}
          - {tekst: "Izlazi na Jadransko more.", tacan: false}
          - {tekst: "Izlazi na Crno more.", tacan: false}
        pomoc:
          - Pogledaj na karti da li granice zemlje igde dodiruju obalu.
          - Egejsko more je južnije, u Grčkoj.
          - "Iz lekcije: Severna Makedonija je kontinentalna zemlja — nema izlaz na more."
        objasnjenje: Netačno — Severna Makedonija je kontinentalna zemlja bez izlaza na more. Egejsko more je u Grčkoj, ali njegov uticaj dopire dolinom Vardara.
        iz_udzbenika:
          strana: 29
          odeljak: Položaj
          tekst: Severna Makedonija leži u središtu Balkanskog poluostrva i nema izlaz na more, pa je kontinentalna zemlja.
          slika: 09-severna-makedonija/01-osnovni-podaci.jpg

      - id: polozaj-dopuni-kontinentalna
        vrsta: dopuni
        tezina: lako
        pojmovi: [kontinentalna-zemlja, balkansko-poluostrvo]
        pitanje: Dopuni rečenicu rečima iz banke.
        tekst: Severna Makedonija nema izlaz na more, pa je {{kontinentalna}} zemlja; nalazi se u središnjem delu {{Balkanskog}} poluostrva.
        ponudjene: [kontinentalna, primorska, Balkanskog, Apeninskog]
        pomoc:
          - Zemlja bez mora ne može biti primorska.
          - Apeninsko poluostrvo je Italija; Severna Makedonija je na istoku Južne Evrope.
          - "Iz lekcije: kontinentalna zemlja u središtu Balkanskog poluostrva."
        objasnjenje: Severna Makedonija je kontinentalna zemlja u središnjem delu Balkanskog poluostrva.
        iz_udzbenika:
          strana: 29
          odeljak: Položaj
          tekst: Zemlja se nalazi u središnjem delu Balkanskog poluostrva i nema izlaz na more.
          slika: 09-severna-makedonija/01-osnovni-podaci.jpg

      - id: polozaj-klik-mkd
        vrsta: karta_klik
        tezina: lako
        pojmovi: [severna-makedonija, balkansko-poluostrvo]
        pitanje: Klikni na kartu — Severna Makedonija.
        cilj: {drzava: MKD}
        pomoc:
          - Traži zemlju u sredini karte koja nigde ne dodiruje more.
          - Na severu joj je Srbija, a na jugu Grčka.
          - Klikni na zemlju između Srbije, Bugarske, Grčke i Albanije.
        objasnjenje: Severna Makedonija je u središtu Balkana, okružena Srbijom, Bugarskom, Grčkom i Albanijom.
        iz_udzbenika:
          strana: 29
          odeljak: Položaj
          tekst: Na karti uz infografiku zemlja je obojena u središtu Balkana, bez izlaza na more.
          slika: 09-severna-makedonija/01-osnovni-podaci.jpg

      - id: polozaj-klik-srbija
        vrsta: karta_klik
        tezina: lako
        pojmovi: [srbija, severna-makedonija]
        pitanje: Klikni na severnog suseda Severne Makedonije, iz kog se nastavljaju Šar-planina i Srpsko-makedonska masa.
        cilj: {drzava: SRB}
        pomoc:
          - Traži državu severno od Severne Makedonije.
          - Ime planinske mase sadrži ime ove države.
          - Klikni na Srbiju.
        objasnjenje: Srbija je severni sused; iz nje se nastavljaju Šar-planina i Srpsko-makedonska masa, a dolina Morave se nastavlja na dolinu Vardara.
        iz_udzbenika:
          strana: 29
          odeljak: Fizičko-geografske odlike — reljef
          tekst: Na istoku zemlje nastavlja se Srpsko-makedonska masa iz Srbije, a na severozapadu su Šarske planine.

      - id: polozaj-klik-grcka
        vrsta: karta_klik
        tezina: lako
        pojmovi: [grcka, saobracajno-geografski-polozaj]
        pitanje: Klikni na državu koju Severna Makedonija svojim položajem povezuje sa ostatkom Evrope.
        cilj: {drzava: GRC}
        pomoc:
          - Ta država je južno od Severne Makedonije.
          - Ima izlaz na Egejsko more i mnogo ostrva.
          - Klikni na Grčku.
        objasnjenje: Severna Makedonija povezuje Grčku sa ostalim državama Evrope — glavni put ide dolinom Vardara.
        iz_udzbenika:
          strana: 29
          odeljak: Položaj
          tekst: Zemlja ima povoljan saobraćajno-geografski položaj, jer preko nje Grčka ima vezu sa ostalim državama Evrope.

      - id: polozaj-klik-bugarska
        vrsta: karta_klik
        tezina: srednje
        pojmovi: [bugarska, strumica]
        pitanje: Klikni na istočnog suseda Severne Makedonije — državu ka kojoj teče reka Strumica.
        cilj: {drzava: BGR}
        pomoc:
          - Strumica je na jugoistoku zemlje i teče ka istoku.
          - Ova država izlazi na Crno more; glavni grad joj je Sofija.
          - Klikni na Bugarsku.
        objasnjenje: Bugarska je istočni sused; reka Strumica teče ka Bugarskoj i uliva se u Strumu.
        iz_udzbenika:
          strana: 29
          odeljak: Fizičko-geografske odlike — vode
          tekst: Veće reke su Vardar i Strumica; obe pripadaju Egejskom slivu.

      - id: polozaj-dopuni-podaci
        vrsta: dopuni
        tezina: srednje
        pojmovi: [severna-makedonija]
        pitanje: Dopuni osnovne podatke.
        tekst: Severna Makedonija ima oko {{1,8|1.8}} miliona stanovnika i površinu od {{25.713|25713|25 713}} km²; službeni jezik je {{makedonski}}.
        ponudjene: ["1,8", "2,1", "25.713", "52.137", makedonski, bugarski]
        pomoc:
          - Broj stanovnika je manji od dva miliona.
          - Površina je nešto veća od 25 hiljada km²; jezik nosi ime naroda koji čini većinu.
          - "Iz lekcije: 1,8 miliona stanovnika, 25.713 km², jezik makedonski."
        objasnjenje: Oko 1,8 miliona stanovnika, 25.713 km², službeni jezik makedonski. (2,1 milion ima Slovenija.)
        iz_udzbenika:
          strana: 29
          odeljak: Osnovni podaci
          tekst: Infografika — 1,8 miliona stanovnika, površina 25.713 km², glavni grad Skoplje, službeni jezik makedonski.
          slika: 09-severna-makedonija/01-osnovni-podaci.jpg

      - id: polozaj-izbor-dolina
        vrsta: izbor
        tezina: srednje
        pojmovi: [vardar, saobracajno-geografski-polozaj]
        pitanje: Dolinom koje reke idu najvažniji saobraćajni putevi kroz Severnu Makedoniju?
        odgovori:
          - {tekst: Vardar, tacan: true}
          - {tekst: Drina, tacan: false}
          - {tekst: Sava, tacan: false}
          - {tekst: Dunav, tacan: false}
        pomoc:
          - Traži reku koja teče kroz samu Severnu Makedoniju, od severa ka Grčkoj.
          - Drina, Sava i Dunav ne teku kroz ovu zemlju.
          - "Iz lekcije: glavni saobraćajni pravac ide dolinom Vardara."
        objasnjenje: Dolinom Vardara ide glavni saobraćajni pravac; na severu se nastavlja na dolinu Morave u Srbiji.
        iz_udzbenika:
          strana: 29
          odeljak: Položaj
          tekst: Udžbenik traži da se u atlasu pronađu rečne doline kojima idu važni putevi — to je pre svega dolina Vardara, koja se nastavlja na dolinu Morave.
          slika: 09-severna-makedonija/03-reka-vardar.jpg

      - id: polozaj-zakljuci-saobracaj
        vrsta: zakljuci
        tezina: srednje
        pojmovi: [saobracajno-geografski-polozaj, vardar, kontinentalna-zemlja]
        pitanje: Zašto je saobraćajni položaj Severne Makedonije povoljan iako zemlja nema more?
        odgovori:
          - {tekst: "Dolina Vardara je prirodan prolaz kroz planine od Grčke ka Srbiji i srednjoj Evropi.", tacan: true}
          - {tekst: "Zato što je cela zemlja ravnica bez planina.", tacan: false}
          - {tekst: "Zato što ima najveću luku na Balkanu.", tacan: false}
          - {tekst: "Zato što je najveća država Balkana.", tacan: false}
        pomoc:
          - "Korak 1: Zemlja je planinsko-kotlinska — gde je najlakše provesti put kroz planine?"
          - "Korak 2: Kuda teče Vardar i šta se nastavlja na njegovu dolinu na severu?"
          - "Iz lekcije: dolinom Vardara idu važni putevi koji povezuju Grčku sa ostatkom Evrope."
        objasnjenje: Dolina Vardara je prirodan prolaz kroz planine; povezuje Grčku (i luku Solun) sa Srbijom i srednjom Evropom.
        iz_udzbenika:
          strana: 29
          odeljak: Položaj
          tekst: Iako nema more, zemlja ima povoljan saobraćajni položaj — preko nje Grčka ima vezu sa ostalim državama Evrope.
          slika: 09-severna-makedonija/03-reka-vardar.jpg

      - id: polozaj-dopuni-koridor
        vrsta: dopuni
        tezina: tesko
        pojmovi: [vardar, srbija, saobracajno-geografski-polozaj]
        pitanje: Dopuni rečenicu (bez ponuđenih reči).
        tekst: Dolina Vardara se na severu nastavlja na dolinu reke {{Morave|Južne Morave|Velike Morave|Morava}} u Srbiji, a na jugu vodi ka {{Grčkoj|Grčka}}.
        pomoc:
          - Ista saobraćajna linija vodi od Beograda preko Niša do Skoplja.
          - Ta srpska reka ima Južnu i Zapadnu granu koje grade Veliku; Vardar teče ka južnom susedu.
          - "Iz lekcije: moravsko-vardarski pravac povezuje Grčku sa ostatkom Evrope."
        objasnjenje: Dolina Vardara se nastavlja na dolinu Morave (Južne i Velike) — to je moravsko-vardarski pravac od Grčke ka srednjoj Evropi.
        iz_udzbenika:
          strana: 29
          odeljak: Položaj
          tekst: Važni putevi prate dolinu Vardara, koja se na severu nadovezuje na dolinu Morave u Srbiji.
          slika: 09-severna-makedonija/03-reka-vardar.jpg

      - id: polozaj-gde-mkd
        vrsta: gde_sam
        tezina: srednje
        pojmovi: [severna-makedonija, vardar, skoplje]
        pitanje: Gde sam? Pročitaj trag i klikni državu na karti.
        cilj: {drzava: MKD}
        tragovi:
          - Na mojoj zastavi je žuto sunce sa osam zraka na crvenoj podlozi.
          - Kroz mene teče Vardar i deli me na zapadni i istočni deo.
          - Moj službeni jezik je makedonski.
          - Nemam more, u središtu sam Balkana, a glavni grad mi je Skoplje.
        objasnjenje: Severna Makedonija — kontinentalna zemlja u središtu Balkana, glavni grad Skoplje.
        iz_udzbenika:
          strana: 29
          odeljak: Osnovni podaci
          tekst: Zastava je crvena sa žutim suncem; zemlja je u središtu Balkana, bez mora, sa glavnim gradom Skopljem.
          slika: 09-severna-makedonija/01-osnovni-podaci.jpg

      - id: polozaj-zakljuci-slovenija
        vrsta: zakljuci
        tezina: tesko
        pojmovi: [severna-makedonija, slovenija, sfrj, kontinentalna-zemlja]
        pitanje: Uporedi Severnu Makedoniju i Sloveniju, dve bivše republike SFRJ. Koja tvrdnja je tačna?
        odgovori:
          - {tekst: "Imaju sličan broj stanovnika, ali Slovenija ima izlaz na more, a Severna Makedonija nema.", tacan: true}
          - {tekst: "Obe su kontinentalne zemlje bez izlaza na more.", tacan: false}
          - {tekst: "Severna Makedonija je privredno razvijenija od Slovenije.", tacan: false}
          - {tekst: "U obe zemlje većina stanovnika je pravoslavna.", tacan: false}
        pomoc:
          - "Korak 1: Uporedi brojeve stanovnika — 1,8 i 2,1 milion."
          - "Korak 2: Koja od njih izlazi na Jadransko more i koja je razvijenija?"
          - "Iz lekcije: Severna Makedonija je kontinentalna i slabije razvijena, sa pravoslavnom većinom."
        objasnjenje: Brojem stanovnika su slične (1,8 i 2,1 milion), ali Slovenija izlazi na more, razvijenija je i pretežno katolička.
        iz_udzbenika:
          strana: 29
          odeljak: Položaj i privreda
          tekst: Severna Makedonija je kontinentalna i privredno slabije razvijena zemlja, sa 1,8 miliona stanovnika.

  - naslov: Reljef
    zadaci:
      - id: reljef-izbor-tip
        vrsta: izbor
        tezina: lako
        pojmovi: [planinsko-kotlinska-zemlja]
        pitanje: Kakva je Severna Makedonija po reljefu?
        odgovori:
          - {tekst: planinsko-kotlinska zemlja, tacan: true}
          - {tekst: nizijska zemlja, tacan: false}
          - {tekst: primorska ravnica, tacan: false}
          - {tekst: pustinjska visoravan, tacan: false}
        pomoc:
          - Na slikama iz lekcije vidiš visoke planine i ravne kotline između njih.
          - Zemlja nema more, pa ne može biti primorska.
          - "Iz lekcije: Severna Makedonija je planinsko-kotlinska zemlja."
        objasnjenje: Severna Makedonija je planinsko-kotlinska zemlja — planine se smenjuju sa kotlinama i dolinom Vardara.
        iz_udzbenika:
          strana: 29
          odeljak: Fizičko-geografske odlike — reljef
          tekst: Zemlja je planinsko-kotlinska; reka Vardar je deli na zapadni i istočni deo.
          slika: 09-severna-makedonija/02-sar-planina.jpg

      - id: reljef-tn-vardar-deli
        vrsta: tacno_netacno
        tezina: lako
        pojmovi: [vardar]
        tvrdnja: Reka Vardar deli Severnu Makedoniju na zapadni i istočni deo.
        tacno: true
        pomoc:
          - Vardar teče od severozapada ka jugoistoku, kroz sredinu zemlje.
          - Zapadno od njega su Šarske planine, a istočno Srpsko-makedonska masa.
          - "Iz lekcije: Vardar deli zemlju na zapadni i istočni deo."
        objasnjenje: Tačno — Vardar deli zemlju na zapadni deo (Šarske planine) i istočni deo (Srpsko-makedonska masa).
        iz_udzbenika:
          strana: 29
          odeljak: Fizičko-geografske odlike — reljef
          tekst: Reka Vardar deli teritoriju na zapadni deo sa Šarskim planinama i istočni deo sa Srpsko-makedonskom masom.
          slika: 09-severna-makedonija/03-reka-vardar.jpg

      - id: reljef-dopuni-planine
        vrsta: dopuni
        tezina: lako
        pojmovi: [sar-planina, srpsko-makedonska-masa]
        pitanje: Dopuni rečenicu rečima iz banke.
        tekst: Zapadno od Vardara su {{Šarske planine|Šar-planina}}, a istočno {{Srpsko-makedonska masa}}.
        ponudjene: [Šarske planine, Srpsko-makedonska masa, Alpi]
        pomoc:
          - Alpi su daleko, u srednjoj Evropi.
          - Masa koja se nastavlja iz Srbije nosi ime i Srbije i Makedonije.
          - "Iz lekcije: na zapadu Šarske planine, na istoku Srpsko-makedonska masa."
        objasnjenje: Na zapadu su Šarske planine (Šar-planina), a na istoku Srpsko-makedonska masa.
        iz_udzbenika:
          strana: 29
          odeljak: Fizičko-geografske odlike — reljef
          tekst: Zapadni deo zemlje zauzimaju Šarske planine, a na istoku se nastavlja Srpsko-makedonska masa iz Srbije.

      - id: reljef-zakljuci-slika
        vrsta: zakljuci
        slika_u_pitanju: true
        tezina: lako
        pojmovi: [sar-planina, nabrane-planine]
        pitanje: "Na fotografiji Šar-planine vidiš visoke, oštre i stenovite vrhove sa snegom. Kakva je to planina po postanku?"
        odgovori:
          - {tekst: "mlada nabrana planina", tacan: true}
          - {tekst: "stara gromadna planina", tacan: false}
          - {tekst: "peščana dina", tacan: false}
          - {tekst: "rečna ravnica", tacan: false}
        pomoc:
          - "Korak 1: Setimo se — mlade planine su visoke i oštre, a stare niže i zaobljene."
          - "Korak 2: Kakvi su vrhovi na fotografiji?"
          - "Iz lekcije: Šarske planine su po postanku nabrane."
        objasnjenje: Visoki, oštri vrhovi odaju mladu nabranu planinu — Šarske planine su nabrane.
        iz_udzbenika:
          strana: 29
          odeljak: Fizičko-geografske odlike — reljef
          tekst: Fotografija Šar-planine pokazuje visoke, oštre vrhove tipične za mlade nabrane planine.
          slika: 09-severna-makedonija/02-sar-planina.jpg

      - id: reljef-izbor-sar-postanak
        vrsta: izbor
        tezina: srednje
        pojmovi: [sar-planina, nabrane-planine]
        pitanje: Kakve su Šarske planine po načinu postanka?
        odgovori:
          - {tekst: nabrane, tacan: true}
          - {tekst: gromadne, tacan: false}
          - {tekst: vulkanske, tacan: false}
          - {tekst: ledničke, tacan: false}
        pomoc:
          - Šarske planine su visoke i imaju oštre vrhove.
          - Gromadna je planinska masa na istoku zemlje, ne na zapadu.
          - "Iz lekcije: Šarske planine su nabrane."
        objasnjenje: Šarske planine su nabrane — mlade, visoke, oštrih vrhova. Gromadna je Srpsko-makedonska masa.
        iz_udzbenika:
          strana: 29
          odeljak: Fizičko-geografske odlike — reljef
          tekst: Udžbenik pita kakve su planine po postanku — Šarske planine na zapadu su nabrane.
          slika: 09-severna-makedonija/02-sar-planina.jpg

      - id: reljef-izbor-masa-postanak
        vrsta: izbor
        tezina: srednje
        pojmovi: [srpsko-makedonska-masa, gromadne-planine]
        pitanje: Kakva je Srpsko-makedonska masa po načinu postanka?
        odgovori:
          - {tekst: "gromadna (stara)", tacan: true}
          - {tekst: "nabrana (mlada)", tacan: false}
          - {tekst: vulkanska, tacan: false}
          - {tekst: "nastala nanošenjem reke", tacan: false}
        pomoc:
          - Već sam ime „masa” govori o starim, razlomljenim planinama.
          - Njeni vrhovi su niži i zaobljeni.
          - "Iz lekcije: Srpsko-makedonska masa je gromadna."
        objasnjenje: Srpsko-makedonska masa je stara gromadna masa — niža, zaobljenih vrhova. Nastavlja se iz Srbije na istok Severne Makedonije.
        iz_udzbenika:
          strana: 29
          odeljak: Fizičko-geografske odlike — reljef
          tekst: Na istoku se iz Srbije nastavlja Srpsko-makedonska masa, koja je po postanku gromadna.

      - id: reljef-tn-masa
        vrsta: tacno_netacno
        tezina: srednje
        pojmovi: [srpsko-makedonska-masa, nabrane-planine, gromadne-planine]
        tvrdnja: Srpsko-makedonska masa je mlada nabrana planina na zapadu zemlje.
        tacno: false
        ispravke:
          - {tekst: "To je stara gromadna masa na istoku zemlje.", tacan: true}
          - {tekst: "To je mlada nabrana planina na istoku zemlje.", tacan: false}
          - {tekst: "To je stara gromadna masa na zapadu zemlje.", tacan: false}
        pomoc:
          - U tvrdnji su pogrešna dva podatka — i postanak i strana sveta.
