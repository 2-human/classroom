# Banka zadataka — Države bivše SFRJ (7. razred, str. 18; okvir „Ponovi” sa zastavama, str. 30).
# Spaja se u spec.yaml: `delovi` zamenjuje spec-ove delove, `mesta` se dodaju u karta.mesta.
# Svaki zadatak ima `tezina` (lako | srednje | tesko). Pitanja su napisana sopstvenim rečima na
# osnovu beleške lekcije.

mesta: {}

delovi:
  - naslov: Šta je bila SFRJ
    zadaci:
      - id: sfrj-izbor-republike
        vrsta: izbor
        tezina: lako
        pojmovi: [sfrj, slovenija, hrvatska, srbija, crna-gora]
        pitanje: Koje su od ponuđenih zemalja bile republike SFRJ? (Više tačnih.)
        odgovori:
          - {tekst: Slovenija, tacan: true}
          - {tekst: Hrvatska, tacan: true}
          - {tekst: Srbija, tacan: true}
          - {tekst: Crna Gora, tacan: true}
          - {tekst: Grčka, tacan: false}
          - {tekst: Austrija, tacan: false}
        pomoc:
          - SFRJ je bila država Južnih Slovena na Balkanskom poluostrvu.
          - Dve ponuđene zemlje nikada nisu bile deo SFRJ — jedna je na jugu Balkana, a druga u Alpima severno od Slovenije.
          - "Iz lekcije: SFRJ su činile Slovenija, Hrvatska, Bosna i Hercegovina, Srbija, Crna Gora i Severna Makedonija."
        objasnjenje: Slovenija, Hrvatska, Srbija i Crna Gora bile su republike SFRJ (uz Bosnu i Hercegovinu i Severnu Makedoniju). Grčka i Austrija su susedne države koje nisu pripadale SFRJ.
        iz_udzbenika:
          strana: 18
          odeljak: SFRJ i njen raspad
          tekst: SFRJ je bila savezna država na Balkanskom poluostrvu sastavljena od šest republika — Slovenije, Hrvatske, Bosne i Hercegovine, Srbije, Crne Gore i Severne Makedonije.
          slika: 03-drzave-bivse-sfrj/01-karta-sfrj.jpg

      - id: sfrj-dopuni-broj
        vrsta: dopuni
        tezina: lako
        pojmovi: [sfrj, beograd]
        pitanje: Dopuni rečenicu rečima iz banke.
        tekst: SFRJ je činilo {{šest|6}} republika, a njen glavni grad bio je {{Beograd}}.
        ponudjene: [šest, četiri, Beograd, Zagreb]
        pomoc:
          - Prebroj bivše republike koje danas imaju svoje lekcije u udžbeniku (Srbija, Crna Gora, BiH…).
          - Glavni grad SFRJ je i danas glavni grad jedne od bivših republika — one na Dunavu.
          - "Iz lekcije: šest republika, glavni grad Beograd."
        objasnjenje: SFRJ je imala šest republika, a glavni grad bio je Beograd.
        iz_udzbenika:
          strana: 18
          odeljak: SFRJ i njen raspad
          tekst: SFRJ je bila savezna država od šest republika, sa glavnim gradom u Beogradu.
          slika: 03-drzave-bivse-sfrj/01-karta-sfrj.jpg

      - id: sfrj-tn-glavni-grad
        vrsta: tacno_netacno
        tezina: lako
        pojmovi: [sfrj, beograd]
        tvrdnja: Glavni grad SFRJ bio je Zagreb.
        tacno: false
        ispravke:
          - {tekst: "Glavni grad SFRJ bio je Beograd.", tacan: true}
          - {tekst: "Glavni grad SFRJ bilo je Sarajevo.", tacan: false}
          - {tekst: "Glavni grad SFRJ bila je Ljubljana.", tacan: false}
        pomoc:
          - Zagreb je danas glavni grad Hrvatske — da li je bio i glavni grad cele SFRJ?
          - Glavni grad SFRJ leži na ušću Save u Dunav.
          - "Iz lekcije: glavni grad SFRJ bio je Beograd."
        objasnjenje: Netačno — glavni grad SFRJ bio je Beograd, koji je danas glavni grad Srbije.
        iz_udzbenika:
          strana: 18
          odeljak: SFRJ i njen raspad
          tekst: Na karti SFRJ infokutija navodi da je glavni grad bio Beograd.
          slika: 03-drzave-bivse-sfrj/01-karta-sfrj.jpg

      - id: sfrj-tn-polozaj
        vrsta: tacno_netacno
        tezina: lako
        pojmovi: [sfrj, balkansko-poluostrvo, juzna-evropa]
        tvrdnja: SFRJ se nalazila na Balkanskom poluostrvu, u Južnoj Evropi.
        tacno: true
        pomoc:
          - Seti se na kom su poluostrvu danas Srbija, Crna Gora i Bosna i Hercegovina.
          - Balkansko poluostrvo je istočno od tri poluostrva Južne Evrope.
          - "Iz lekcije: SFRJ je bila savezna država na Balkanskom poluostrvu, u Južnoj Evropi."
        objasnjenje: Tačno — SFRJ je bila na Balkanskom poluostrvu, pa sve njene bivše republike danas pripadaju Južnoj Evropi.
        iz_udzbenika:
          strana: 18
          odeljak: SFRJ i njen raspad
          tekst: SFRJ je ležala na Balkanskom poluostrvu, delu Južne Evrope; zato se države nastale njenim raspadom uče u okviru Južne Evrope.
          slika: 03-drzave-bivse-sfrj/01-karta-sfrj.jpg

      - id: sfrj-izbor-naziv
        vrsta: izbor
        tezina: srednje
        pojmovi: [sfrj]
        pitanje: Šta znači skraćenica SFRJ?
        odgovori:
          - {tekst: Socijalistička Federativna Republika Jugoslavija, tacan: true}
          - {tekst: Srpska Federativna Republika Jugoslavija, tacan: false}
          - {tekst: Savezna Federacija Republika Jugoslavije, tacan: false}
          - {tekst: Slobodna Federacija Južnoslovenskih Republika, tacan: false}
        pomoc:
          - Prvo slovo opisuje uređenje države (socijalizam), a ne narod.
          - Slovo „F” znači da je to savezna (federativna) država, a „R” da je republika.
          - "Iz lekcije: puni naziv je Socijalistička Federativna Republika Jugoslavija."
        objasnjenje: SFRJ = Socijalistička Federativna Republika Jugoslavija. „Federativna” znači da je bila savezna država sastavljena od republika.
        iz_udzbenika:
          strana: 18
          odeljak: SFRJ i njen raspad
          tekst: Puni naziv države bio je Socijalistička Federativna Republika Jugoslavija (SFRJ).

      - id: sfrj-tn-stanovnistvo
        vrsta: tacno_netacno
        tezina: srednje
        pojmovi: [sfrj]
        tvrdnja: SFRJ je imala oko 237 miliona stanovnika.
        tacno: false
        ispravke:
          - {tekst: "SFRJ je imala oko 23,7 miliona stanovnika.", tacan: true}
          - {tekst: "SFRJ je imala oko 2,37 miliona stanovnika.", tacan: false}
          - {tekst: "SFRJ je imala oko 7,3 miliona stanovnika.", tacan: false}
        pomoc:
          - Cela Južna Evropa ima oko 159 miliona ljudi — da li bi jedna njena država mogla imati više?
          - Zarez je pomeren; pravi broj je između 20 i 25 miliona.
          - "Iz lekcije: SFRJ je imala 23,7 miliona stanovnika."
        objasnjenje: Netačno — SFRJ je imala oko 23,7 miliona stanovnika.
        iz_udzbenika:
          strana: 18
          odeljak: Karta „Teritorija SFRJ”
          tekst: Prema infokutiji na karti, u SFRJ je živelo 23,7 miliona stanovnika.
          slika: 03-drzave-bivse-sfrj/01-karta-sfrj.jpg

      - id: sfrj-povezi-pojmovi
        vrsta: povezi
        tezina: lako
        pojmovi: [sfrj, referendum, beograd, balkansko-poluostrvo]
        pitanje: Poveži pojam sa njegovim objašnjenjem.
        parovi:
          - [SFRJ, savezna država od šest republika]
          - [Beograd, glavni grad SFRJ]
          - [referendum, glasanje građana o važnom pitanju]
          - [Balkansko poluostrvo, poluostrvo na kome je bila SFRJ]
        pomoc:
          - Kreni od pojma koji je grad.
          - Referendum je u vezi sa glasanjem.
          - "Iz lekcije: SFRJ — šest republika, glavni grad Beograd, na Balkanskom poluostrvu."
        objasnjenje: SFRJ — savezna država šest republika; Beograd — njen glavni grad; referendum — glasanje građana; Balkansko poluostrvo — mesto gde je bila SFRJ.
        iz_udzbenika:
          strana: 18
          odeljak: Ključni pojmovi
          tekst: Na početku celine izdvojeni su ključni pojmovi za sve lekcije o bivšim republikama — među njima SFRJ, referendum i nazivi šest država.

      - id: sfrj-povezi-podaci
        vrsta: povezi
        tezina: srednje
        pojmovi: [sfrj, beograd]
        pitanje: Poveži podatak o SFRJ sa njegovom vrednošću.
        parovi:
          - [glavni grad, Beograd]
          - [površina, "255.804 km²"]
          - [broj stanovnika, "23,7 miliona"]
          - [broj republika, šest]
          - [početak raspada, "1991."]
        pomoc:
          - Jedini ponuđeni naziv grada ide uz glavni grad, a godina uz raspad.
          - Kvadratni kilometri (km²) idu uz površinu, a milioni uz stanovnike.
          - "Iz lekcije: Beograd; 255.804 km²; 23,7 miliona; šest republika; raspad od 1991."
        objasnjenje: Glavni grad — Beograd; površina — 255.804 km²; stanovnici — 23,7 miliona; republika — šest; raspad počinje 1991.
        iz_udzbenika:
          strana: 18
          odeljak: Karta „Teritorija SFRJ”
          tekst: Infokutija uz kartu daje osnovne podatke o SFRJ — glavni grad Beograd, 255.804 km² i 23,7 miliona stanovnika.
          slika: 03-drzave-bivse-sfrj/01-karta-sfrj.jpg

      - id: sfrj-dopuni-podaci
        vrsta: dopuni
        tezina: tesko
        pojmovi: [sfrj]
        pitanje: Dopuni rečenicu brojevima (bez ponuđenih reči).
        tekst: SFRJ je imala površinu od {{255.804|255804|255 804|255.804 km²}} km² i oko {{23,7|23.7}} miliona stanovnika.
        pomoc:
          - Površina je nešto veća od četvrt miliona km².
          - Stanovnika je bilo između 23 i 24 miliona — upiši broj sa jednom decimalom.
          - "Iz lekcije: 255.804 km² i 23,7 miliona stanovnika."
        objasnjenje: SFRJ je imala 255.804 km² i 23,7 miliona stanovnika.
        iz_udzbenika:
          strana: 18
          odeljak: Karta „Teritorija SFRJ”
          tekst: Infokutija na karti SFRJ navodi površinu od 255.804 km² i 23,7 miliona stanovnika.
          slika: 03-drzave-bivse-sfrj/01-karta-sfrj.jpg

      - id: sfrj-zakljuci-savezna
        vrsta: zakljuci
        tezina: srednje
        pojmovi: [sfrj]
        pitanje: Zašto se za SFRJ kaže da je bila „federativna”, odnosno savezna država?
        odgovori:
          - {tekst: "Zato što se u njoj udružilo šest republika.", tacan: true}
          - {tekst: "Zato što je imala izlaz na više mora.", tacan: false}
          - {tekst: "Zato što su sve republike imale isti broj stanovnika.", tacan: false}
          - {tekst: "Zato što je glavni grad bio na ušću dve reke.", tacan: false}
        pomoc:
          - "Korak 1: Reč „savez” znači udruživanje više delova u jednu celinu."
          - "Korak 2: Od kojih se delova sastojala SFRJ?"
          - "Iz lekcije: SFRJ je bila savezna država sastavljena od šest republika."
        objasnjenje: Savezna (federativna) država nastaje udruživanjem više jedinica — SFRJ je činilo šest republika.
        iz_udzbenika:
          strana: 18
          odeljak: SFRJ i njen raspad
          tekst: SFRJ je bila savezna država koju je činilo šest republika.

      - id: sfrj-zakljuci-srbija-deo
        vrsta: zakljuci
        tezina: tesko
        pojmovi: [sfrj, srbija]
        pitanje: Srbija ima površinu od 88.499 km², a SFRJ je imala 255.804 km². Koliki je otprilike deo SFRJ bila teritorija Srbije?
        odgovori:
          - {tekst: oko trećine, tacan: true}
          - {tekst: oko polovine, tacan: false}
          - {tekst: oko desetine, tacan: false}
          - {tekst: skoro cela SFRJ, tacan: false}
        pomoc:
          - "Korak 1: Zaokruži brojeve — Srbija oko 90 hiljada, SFRJ oko 255 hiljada km²."
          - "Korak 2: Koliko puta 90 hiljada staje u 255 hiljada? (Oko tri puta.)"
          - "Iz lekcije: 88.499 / 255.804 ≈ 0,35 — oko trećine."
        objasnjenje: 88.499 / 255.804 ≈ 0,35, pa je Srbija bila oko trećine SFRJ — zato je na karti bila najveća republika.
        iz_udzbenika:
          strana: 18
          odeljak: Karta „Teritorija SFRJ”
          tekst: Na karti SFRJ vidi se da je Srbija bila najveća republika; površina cele SFRJ bila je 255.804 km².
          slika: 03-drzave-bivse-sfrj/01-karta-sfrj.jpg

  - naslov: Raspad SFRJ
    zadaci:
      - id: raspad-izbor-1991
        vrsta: izbor
        tezina: lako
        pojmovi: [slovenija, hrvatska, severna-makedonija]
        pitanje: Koje su republike prve istupile iz SFRJ, 1991. godine? (Više tačnih.)
        odgovori:
          - {tekst: Slovenija, tacan: true}
          - {tekst: Hrvatska, tacan: true}
          - {tekst: Severna Makedonija, tacan: true}
          - {tekst: Crna Gora, tacan: false}
          - {tekst: Bosna i Hercegovina, tacan: false}
        pomoc:
          - Tačne su tri republike — dve na severozapadu i jedna na krajnjem jugu bivše SFRJ.
          - Crna Gora je poslednja postala nezavisna, a BiH godinu dana posle ove grupe.
          - "Iz lekcije: 1991. istupaju Slovenija, Hrvatska i Severna Makedonija."
        objasnjenje: Godine 1991. iz SFRJ su istupile Slovenija, Hrvatska i Severna Makedonija. BiH je nezavisna od 1992, a Crna Gora od 2006.
        iz_udzbenika:
          strana: 18
          odeljak: SFRJ i njen raspad
          tekst: Raspad SFRJ počeo je 1991. godine, kada su iz federacije istupile Slovenija, Hrvatska i Severna Makedonija.
          slika: 03-drzave-bivse-sfrj/01-karta-sfrj.jpg

      - id: raspad-povezi-godine
        vrsta: povezi
        tezina: lako
        pojmovi: [sfrj, bosna-i-hercegovina, crna-gora]
        pitanje: Poveži godinu sa događajem iz raspada SFRJ.
        parovi:
          - ["1991.", "istupaju Slovenija, Hrvatska i Severna Makedonija"]
          - ["1992.", nezavisna postaje Bosna i Hercegovina]
          - ["2006.", Crna Gora postaje nezavisna posle referenduma]
        pomoc:
          - Najranija godina ide uz prvu, najveću grupu republika.
          - Najkasnija godina ide uz referendum.
          - "Iz lekcije: 1991 — tri republike; 1992 — BiH; 2006 — Crna Gora."
        objasnjenje: 1991 — Slovenija, Hrvatska, Severna Makedonija; 1992 — Bosna i Hercegovina; 2006 — Crna Gora (referendum).
        iz_udzbenika:
          strana: 18
          odeljak: SFRJ i njen raspad
          tekst: Raspad je tekao u koracima — 1991. tri republike, 1992. BiH, a 2006. Crna Gora, posle referenduma.

      - id: raspad-zakljuci-karta
        vrsta: zakljuci
        tezina: lako
        pojmovi: [sfrj, juzna-evropa]
        pitanje: Zašto se kaže da se politička karta Južne Evrope promenila početkom 1990-ih?
        odgovori:
          - {tekst: "Umesto jedne velike države postepeno je nastalo šest nezavisnih država.", tacan: true}
          - {tekst: "More je poplavilo veliki deo obale.", tacan: false}
          - {tekst: "Nastale su nove planine na Balkanu.", tacan: false}
          - {tekst: "Sve države Južne Evrope spojile su se u jednu.", tacan: false}
        pomoc:
          - "Korak 1: Politička karta prikazuje države i granice, a ne reljef."
          - "Korak 2: Šta se tada dogodilo sa SFRJ?"
          - "Iz lekcije: raspadom SFRJ nastalo je šest država sa novim granicama."
        objasnjenje: Raspadom SFRJ umesto jedne države nastalo je šest nezavisnih, pa su na karti nove granice i novi glavni gradovi.
        iz_udzbenika:
          strana: 18
          odeljak: SFRJ i njen raspad
          tekst: Početkom 1990-ih politička karta Južne Evrope se promenila jer se raspala SFRJ; od njenih republika postepeno je nastalo šest država.
          slika: 03-drzave-bivse-sfrj/01-karta-sfrj.jpg

      - id: raspad-tn-postepeno
        vrsta: tacno_netacno
        tezina: srednje
        pojmovi: [sfrj]
        tvrdnja: SFRJ se raspala odjednom, za samo jednu godinu.
        tacno: false
        ispravke:
          - {tekst: "Raspad je tekao postepeno, od 1991. do 2006. godine.", tacan: true}
          - {tekst: "Raspad je tekao od 1945. do 1991. godine.", tacan: false}
          - {tekst: "Raspad je počeo 2006. i još traje.", tacan: false}
        pomoc:
          - Da li su sve republike postale nezavisne iste godine?
          - Prve su istupile 1991, a poslednja je postala nezavisna mnogo kasnije.
          - "Iz lekcije: raspad je tekao postepeno, od 1991. do 2006."
        objasnjenje: Netačno — raspad je tekao postepeno, od 1991. do 2006. godine.
        iz_udzbenika:
          strana: 18
          odeljak: SFRJ i njen raspad
          tekst: Raspad SFRJ nije se desio odjednom — tekao je od 1991. do 2006. godine.

      - id: raspad-izbor-zajedno
        vrsta: izbor
        tezina: srednje
        pojmovi: [srbija, crna-gora]
        pitanje: Koje su dve bivše republike najduže ostale u zajedničkoj državi?
        odgovori:
          - {tekst: Srbija i Crna Gora, tacan: true}
          - {tekst: Slovenija i Hrvatska, tacan: false}
          - {tekst: Hrvatska i Bosna i Hercegovina, tacan: false}
          - {tekst: Srbija i Severna Makedonija, tacan: false}
        pomoc:
          - Slovenija, Hrvatska i Severna Makedonija istupile su prve, 1991.
          - Jedna od ove dve republike je poslednja postala nezavisna, posle referenduma.
          - "Iz lekcije: Srbija i Crna Gora ostale su zajedno sve do 2006."
        objasnjenje: Srbija i Crna Gora bile su zajedno sve do 2006, kada je Crna Gora na referendumu izabrala nezavisnost.
        iz_udzbenika:
          strana: 18
          odeljak: SFRJ i njen raspad
          tekst: Srbija i Crna Gora bile su poslednja zajednica bivših republika; razdvojile su se 2006. godine.

      - id: raspad-dopuni-trajanje
        vrsta: dopuni
        tezina: tesko
        pojmovi: [sfrj, crna-gora]
        pitanje: Dopuni rečenicu brojevima (bez ponuđenih reči).
        tekst: Raspad SFRJ počeo je {{1991}}. godine, završio se {{2006}}. godine, pa je ukupno trajao {{15|petnaest}} godina.
        pomoc:
          - Prva godina je početak 1990-ih, kada istupaju tri republike.
          - Poslednja godina je godina referenduma u Crnoj Gori; razliku izračunaj oduzimanjem.
          - "Iz lekcije: 1991–2006, ukupno 15 godina."
        objasnjenje: Raspad je trajao od 1991. do 2006, dakle 15 godina.
        iz_udzbenika:
          strana: 18
          odeljak: SFRJ i njen raspad
          tekst: Raspad je počeo 1991, a završio se 2006. referendumom u Crnoj Gori — ukupno 15 godina.

      - id: raspad-tn-makedonija
        vrsta: tacno_netacno
        tezina: tesko
        pojmovi: [severna-makedonija, bosna-i-hercegovina]
        tvrdnja: Severna Makedonija je stekla nezavisnost tek posle Bosne i Hercegovine.
        tacno: false
        ispravke:
          - {tekst: "Severna Makedonija je istupila 1991, godinu dana pre BiH.", tacan: true}
          - {tekst: "Severna Makedonija je postala nezavisna 2006, zajedno sa Crnom Gorom.", tacan: false}
          - {tekst: "Severna Makedonija nikada nije bila deo SFRJ.", tacan: false}
        pomoc:
          - Severna Makedonija je bila u istoj grupi kao Slovenija i Hrvatska.
          - Uporedi godine — 1991 i 1992.
          - "Iz lekcije: 1991. istupaju Slovenija, Hrvatska i Severna Makedonija; BiH 1992."
        objasnjenje: Netačno — Severna Makedonija je istupila 1991, a Bosna i Hercegovina je nezavisna od 1992.
        iz_udzbenika:
          strana: 18
          odeljak: SFRJ i njen raspad
          tekst: Severna Makedonija je bila među tri republike koje su istupile 1991; BiH je nezavisnost stekla 1992.

      - id: raspad-izbor-krajem-1991
        vrsta: izbor
        tezina: tesko
        pojmovi: [bosna-i-hercegovina, srbija, crna-gora]
        pitanje: Koje republike krajem 1991. godine još NISU bile istupile iz zajedničke države? (Više tačnih.)
        odgovori:
          - {tekst: Bosna i Hercegovina, tacan: true}
          - {tekst: Srbija, tacan: true}
          - {tekst: Crna Gora, tacan: true}
          - {tekst: Slovenija, tacan: false}
          - {tekst: Hrvatska, tacan: false}
          - {tekst: Severna Makedonija, tacan: false}
        pomoc:
          - Prvo izdvoji tri republike koje su istupile 1991.
          - Ostale tri su tada još bile zajedno — jedna je otišla 1992, a dve su ostale zajedno do 2006.
          - "Iz lekcije: 1991 — Slovenija, Hrvatska, S. Makedonija; 1992 — BiH; 2006 — Crna Gora."
