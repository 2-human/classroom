        objasnjenje: U Crnoj Gori pretežno žive Crnogorci, Srbi, Bošnjaci i Albanci — stanovništvo je etnički heterogeno.
        iz_udzbenika:
          strana: 23
          odeljak: Društveno-geografske odlike
          tekst: Stanovništvo Crne Gore je etnički raznoliko; pretežno ga čine Crnogorci, Srbi, Bošnjaci i Albanci.

