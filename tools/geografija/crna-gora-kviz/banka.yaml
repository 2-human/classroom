# Banka zadataka — Republika Crna Gora (7. razred, str. 21–23). Spaja se u spec.yaml: `delovi`
# zamenjuje spec-ove delove, `mesta` se dodaju u karta.mesta. Svaki zadatak ima `tezina`
# (lako | srednje | tesko). Pitanja su napisana sopstvenim rečima na osnovu beleške lekcije.
# Namerno izostavljeno: pitanje o najvišoj planini (udžbenik i stvarnost se ne slažu) i zadatak
# povezivanja sa str. 23 (odsečen na skenu).

mesta: {}

delovi:
  - naslov: Položaj i nastanak države
    zadaci:
      - id: polozaj-izbor-glavni-grad
        vrsta: izbor
        tezina: lako
        pojmovi: [podgorica, crna-gora]
        pitanje: Koji je glavni grad Crne Gore?
        odgovori:
          - {tekst: "Podgorica", tacan: true}
          - {tekst: "Kotor", tacan: false}
          - {tekst: "Budva", tacan: false}
          - {tekst: "Sarajevo", tacan: false}
        pomoc:
          - Glavni grad nije na moru, već u unutrašnjosti, u najvećoj niziji zemlje.
          - Kotor i Budva su primorski gradovi, a Sarajevo je glavni grad druge države.
          - "Iz lekcije: glavni grad Crne Gore je Podgorica."
        objasnjenje: Glavni grad je Podgorica, u Zetskoj niziji na reci Morači. Kotor i Budva su primorski gradovi, a Sarajevo je glavni grad Bosne i Hercegovine.
        iz_udzbenika:
          strana: 21
          odeljak: Uvod — osnovni podaci
          tekst: U infokutiji lekcije stoji da je glavni grad Crne Gore Podgorica, a službeni jezik crnogorski.
          slika: 05-crna-gora/01-crna-gora-infografika.jpg

      - id: polozaj-izbor-nezavisnost
        vrsta: izbor
        tezina: lako
        pojmovi: [crna-gora, referendum]
        pitanje: Koje godine je Crna Gora postala nezavisna država?
        odgovori:
          - {tekst: "2006.", tacan: true}
          - {tekst: "1991.", tacan: false}
          - {tekst: "1945.", tacan: false}
          - {tekst: "2016.", tacan: false}
        pomoc:
          - Crna Gora je posle raspada SFRJ još neko vreme ostala u zajednici sa Srbijom.
          - Nezavisnost je stigla početkom 21. veka.
          - "Iz lekcije: nezavisna je od 2006, kada je izašla iz zajednice sa Srbijom."
        objasnjenje: Crna Gora je nezavisna od 2006. godine, kada je na referendumu odlučila da izađe iz zajednice sa Srbijom.
        iz_udzbenika:
          strana: 21
          odeljak: Uvod — položaj i nastanak države
          tekst: Crna Gora je bila u zajednici sa Srbijom sve do 2006. godine, kada je na referendumu izglasana nezavisnost.
          slika: 05-crna-gora/01-crna-gora-infografika.jpg

      - id: polozaj-tn-referendum
        vrsta: tacno_netacno
        tezina: lako
        pojmovi: [referendum, crna-gora]
        tvrdnja: Nezavisnost Crne Gore izglasana je na referendumu 2006. godine.
        tacno: true
        pomoc:
          - Referendum je glasanje svih građana o jednom važnom pitanju.
          - Setite se iz koje zajednice je Crna Gora izašla i kada.
          - "Iz lekcije: 2006. je na referendumu izglasana nezavisnost — izlazak iz zajednice sa Srbijom."
        objasnjenje: Tačno — građani su na referendumu 2006. glasali za nezavisnost, pa je Crna Gora izašla iz zajednice sa Srbijom.
        iz_udzbenika:
          strana: 21
          odeljak: Uvod — položaj i nastanak države
          tekst: Crna Gora je nezavisna od 2006. godine; odluka je doneta na referendumu, glasanjem građana.

      - id: polozaj-dopuni-referendum
        vrsta: dopuni
        tezina: tesko
        pojmovi: [referendum, crna-gora]
        pitanje: Dopuni rečenicu (bez ponuđenih reči).
        tekst: Crna Gora je postala nezavisna {{2006}}. godine, kada je na {{referendumu|referendum}} odlučeno da izađe iz zajednice sa {{Srbijom|Srbija}}.
        pomoc:
          - Traže se godina, naziv glasanja svih građana i ime države sa kojom je Crna Gora bila u zajednici.
          - Godina je u prvoj deceniji 21. veka; država je njen severoistočni sused.
          - "Iz lekcije: 2006. je na referendumu izglasan izlazak iz zajednice sa Srbijom."
        objasnjenje: 2006. godine, na referendumu, Crna Gora je izašla iz zajednice sa Srbijom.
        iz_udzbenika:
          strana: 21
          odeljak: Uvod — položaj i nastanak države
          tekst: Do 2006. Crna Gora je bila u zajednici sa Srbijom; te godine je na referendumu izglasana nezavisnost.

      - id: polozaj-povezi-infokutija
        vrsta: povezi
        tezina: lako
        pojmovi: [crna-gora, podgorica]
        pitanje: Poveži podatak iz infokutije sa njegovom vrednošću.
        parovi:
          - [broj stanovnika, "626.250"]
          - [površina, "13.812 km²"]
          - [glavni grad, Podgorica]
          - [službeni jezik, crnogorski]
        pomoc:
          - Broj ljudi je veći broj, a površina je izražena u km².
          - Jezik nosi isto ime kao država.
          - "Iz lekcije: 626.250 stanovnika, 13.812 km², Podgorica, crnogorski jezik."
        objasnjenje: Crna Gora ima 626.250 stanovnika i 13.812 km²; glavni grad je Podgorica, a službeni jezik crnogorski.
        iz_udzbenika:
          strana: 21
          odeljak: Uvod — osnovni podaci
          tekst: Infokutija lekcije navodi broj stanovnika (626.250), površinu (13.812 km²), glavni grad (Podgorica) i službeni jezik (crnogorski).
          slika: 05-crna-gora/01-crna-gora-infografika.jpg

      - id: polozaj-dopuni-infokutija
        vrsta: dopuni
        tezina: srednje
        pojmovi: [crna-gora]
        pitanje: Dopuni rečenicu brojevima iz banke.
        tekst: Crna Gora ima {{626.250|626250|626 250}} stanovnika, a njena površina je {{13.812|13812|13 812}} km².
        ponudjene: ["626.250", "13.812", "6.262.500", "138.120"]
        pomoc:
          - Stanovnika ima nešto više od pola miliona.
          - Površina je oko četrnaest hiljada km² — mnogo manje od Srbije.
          - "Iz lekcije: 626.250 stanovnika i 13.812 km²."
        objasnjenje: U Crnoj Gori živi 626.250 ljudi na 13.812 km².
        iz_udzbenika:
          strana: 21
          odeljak: Uvod — osnovni podaci
          tekst: Prema infokutiji, Crna Gora ima 626.250 stanovnika i površinu od 13.812 km².
          slika: 05-crna-gora/01-crna-gora-infografika.jpg

      - id: polozaj-dopuni-jezik
        vrsta: dopuni
        tezina: lako
        pojmovi: [crna-gora, podgorica]
        pitanje: Dopuni rečenicu rečima iz banke.
        tekst: Službeni jezik Crne Gore je {{crnogorski}}, a glavni grad je {{Podgorica}}.
        ponudjene: [crnogorski, Podgorica, albanski, Kotor]
        pomoc:
          - Jezik nosi isto ime kao država.
          - Glavni grad nije na moru.
          - "Iz lekcije: službeni jezik je crnogorski, a glavni grad Podgorica."
        objasnjenje: Službeni jezik je crnogorski, a glavni grad Podgorica.
        iz_udzbenika:
          strana: 21
          odeljak: Uvod — osnovni podaci
          tekst: U infokutiji stoji da je službeni jezik crnogorski, a glavni grad Podgorica.
          slika: 05-crna-gora/01-crna-gora-infografika.jpg

      - id: polozaj-izbor-susedi
        vrsta: izbor
        tezina: srednje
        pojmovi: [crna-gora, balkansko-poluostrvo]
        pitanje: Sa kojim državama se Crna Gora graniči? (Više tačnih.)
        odgovori:
          - {tekst: "Hrvatska", tacan: true}
          - {tekst: "Bosna i Hercegovina", tacan: true}
          - {tekst: "Srbija", tacan: true}
          - {tekst: "Albanija", tacan: true}
          - {tekst: "Severna Makedonija", tacan: false}
          - {tekst: "Italija", tacan: false}
        pomoc:
          - Pogledaj kartu — oko Crne Gore su četiri države, a sa jedne strane je more.
          - Država preko Jadranskog mora nije sused, a ni država koja je samo blizu jugoistoka.
          - "Iz lekcije: susedi su Hrvatska, Bosna i Hercegovina, Srbija i Albanija."
        objasnjenje: Crna Gora se graniči sa Hrvatskom, Bosnom i Hercegovinom, Srbijom i Albanijom. Italija je preko Jadranskog mora, a Severna Makedonija se ne dodiruje sa njom.
        iz_udzbenika:
          strana: 21
          odeljak: Uvod — položaj i nastanak države
          tekst: Udžbenik pita sa kojim državama se Crna Gora graniči — to su Hrvatska, Bosna i Hercegovina, Srbija i Albanija.
          slika: 05-crna-gora/01-crna-gora-infografika.jpg

      - id: polozaj-tn-makedonija
        vrsta: tacno_netacno
        tezina: tesko
        pojmovi: [crna-gora]
        tvrdnja: Crna Gora se na jugoistoku graniči sa Severnom Makedonijom.
        tacno: false
        ispravke:
          - {tekst: "Ne graniči se — njeni susedi su Hrvatska, BiH, Srbija i Albanija.", tacan: true}
          - {tekst: "Ne graniči se — njeni susedi su samo Srbija i Albanija.", tacan: false}
          - {tekst: "Ne graniči se — njeni susedi su samo Hrvatska i BiH.", tacan: false}
        pomoc:
          - Severna Makedonija je blizu, ali između nje i Crne Gore su druge države.
          - Na jugoistoku Crne Gore su Albanija i deo Srbije (Kosovo i Metohija).
          - "Iz lekcije: susedi Crne Gore su Hrvatska, Bosna i Hercegovina, Srbija i Albanija."
        objasnjenje: Netačno — Crna Gora ima četiri suseda (Hrvatska, BiH, Srbija, Albanija); Severna Makedonija nije među njima.
        iz_udzbenika:
          strana: 21
          odeljak: Uvod — položaj i nastanak države
          tekst: Crna Gora se graniči sa četiri države — Hrvatskom, Bosnom i Hercegovinom, Srbijom i Albanijom.
          slika: 05-crna-gora/01-crna-gora-infografika.jpg

      - id: polozaj-tn-kontinentalna
        vrsta: tacno_netacno
        tezina: lako
        pojmovi: [crna-gora, jadransko-more]
        tvrdnja: Crna Gora je kontinentalna zemlja, bez izlaza na more.
        tacno: false
        ispravke:
          - {tekst: "Crna Gora je primorska zemlja — izlazi na Jadransko more.", tacan: true}
          - {tekst: "Crna Gora je primorska zemlja — izlazi na Crno more.", tacan: false}
          - {tekst: "Crna Gora nema more, ali ima veliko jezero.", tacan: false}
        pomoc:
          - Setite se Budve, Kotora i Svetog Stefana — gde se oni nalaze?
          - Crna Gora ima obalu dugu oko 293 km.
          - "Iz lekcije: Crna Gora je balkanska, planinska i primorska zemlja."
        objasnjenje: Netačno — Crna Gora je primorska zemlja; izlazi na Jadransko more obalom od oko 293 km.
        iz_udzbenika:
          strana: 23
          odeljak: Zadatak 1 — tačno ili netačno
          tekst: U zadatku na kraju lekcije tvrdnja da je Crna Gora kontinentalna zemlja je netačna, jer je Crna Gora primorska zemlja na Jadranu.

      - id: polozaj-tn-najmanja
        vrsta: tacno_netacno
        tezina: srednje
        pojmovi: [crna-gora, balkansko-poluostrvo]
        tvrdnja: Prema udžbeniku, Crna Gora je najmanja država Balkanskog poluostrva i po površini i po broju stanovnika.
        tacno: true
        pomoc:
          - Uporedi 13.812 km² i oko 626 hiljada ljudi sa drugim državama Balkana.
          - Udžbenik je opisuje kao „malu” državu u oba smisla.
          - "Iz lekcije: najmanja je država Balkanskog poluostrva po površini i po broju stanovnika."
        objasnjenje: Tačno — udžbenik navodi da je Crna Gora najmanja država Balkanskog poluostrva i po površini i po broju stanovnika.
        iz_udzbenika:
          strana: 21
          odeljak: Uvod — položaj i nastanak države
          tekst: Crna Gora je mala balkanska država; prema udžbeniku najmanja je na Balkanskom poluostrvu i po površini i po broju stanovnika.
          slika: 05-crna-gora/01-crna-gora-infografika.jpg

      - id: polozaj-zakljuci-primorska
        vrsta: zakljuci
        tezina: lako
        pojmovi: [crna-gora, jadransko-more]
        pitanje: Udžbenik opisuje Crnu Goru kao „balkansku, planinsku i primorsku” zemlju. Koji podatak opravdava reč „primorska”?
        odgovori:
          - {tekst: "Izlazi na Jadransko more, obalom dugom oko 293 km.", tacan: true}
          - {tekst: "Leži na Balkanskom poluostrvu.", tacan: false}
          - {tekst: "U njoj preovlađuje planinski reljef.", tacan: false}
          - {tekst: "Ima najdublji kanjon u Evropi.", tacan: false}
        pomoc:
          - "Korak 1: Reč „primorska” dolazi od reči „more”."
          - "Korak 2: Koji od ponuđenih podataka govori o moru?"
          - "Iz lekcije: obala na Jadranskom moru duga je oko 293 km."
        objasnjenje: „Primorska” znači da zemlja izlazi na more — Crna Gora ima obalu na Jadranu od oko 293 km. Ostali podaci objašnjavaju reči „balkanska” i „planinska”.
        iz_udzbenika:
          strana: 21
          odeljak: Uvod — položaj i nastanak države
          tekst: Crna Gora je balkanska (leži na Balkanskom poluostrvu), planinska (preovlađuju planine) i primorska zemlja (izlazi na Jadransko more).

      - id: polozaj-zakljuci-gustina
        vrsta: zakljuci
        tezina: tesko
        pojmovi: [crna-gora]
        pitanje: Crna Gora ima 626.250 stanovnika na 13.812 km². Kolika je približno gustina naseljenosti?
        odgovori:
          - {tekst: "oko 45 stanovnika na km²", tacan: true}
          - {tekst: "oko 4,5 stanovnika na km²", tacan: false}
          - {tekst: "oko 450 stanovnika na km²", tacan: false}
          - {tekst: "oko 4.500 stanovnika na km²", tacan: false}
        pomoc:
          - "Korak 1: Gustina = broj stanovnika podeljen sa površinom."
          - "Korak 2: Zaokruži: 626.000 : 14.000 — koliko je to otprilike?"
          - "Iz lekcije: 626.250 stanovnika i 13.812 km² daju oko 45 st/km²."
        objasnjenje: "626.250 podeljeno sa 13.812 je oko 45 — na svakom kvadratnom kilometru živi u proseku oko 45 ljudi."
        iz_udzbenika:
          strana: 21
          odeljak: Uvod — osnovni podaci
          tekst: Iz podataka infokutije (626.250 stanovnika, 13.812 km²) može se izračunati gustina naseljenosti — oko 45 stanovnika na km².
          slika: 05-crna-gora/01-crna-gora-infografika.jpg

      - id: polozaj-klik-crna-gora
        vrsta: karta_klik
        tezina: lako
        pojmovi: [crna-gora]
        pitanje: Klikni na kartu — Crna Gora.
        cilj: {drzava: MNE}
        pomoc:
          - Crna Gora je mala država na obali Jadranskog mora.
          - Nalazi se između Hrvatske (na severozapadu) i Albanije (na jugoistoku).
          - Klikni na malu primorsku državu u sredini karte.
        objasnjenje: Crna Gora leži na obali Jadrana, između Hrvatske, Bosne i Hercegovine, Srbije i Albanije.
        iz_udzbenika:
          strana: 21
          odeljak: Uvod — položaj i nastanak države
          tekst: Na maloj karti u infokutiji Crna Gora je istaknuta crvenom bojom na obali Jadranskog mora.
          slika: 05-crna-gora/01-crna-gora-infografika.jpg

      - id: polozaj-klik-srbija
        vrsta: karta_klik
        tezina: lako
        pojmovi: [crna-gora, referendum]
        pitanje: Klikni na državu sa kojom je Crna Gora bila u zajednici do 2006. godine.
        cilj: {drzava: SRB}
        pomoc:
          - Ta država je severoistočno od Crne Gore i nema izlaz na more.
          - Njen glavni grad je Beograd.
          - "Iz lekcije: 2006. je Crna Gora izašla iz zajednice sa Srbijom."
        objasnjenje: Do 2006. Crna Gora je bila u zajednici sa Srbijom, svojim severoistočnim susedom.
        iz_udzbenika:
          strana: 21
          odeljak: Uvod — položaj i nastanak države
          tekst: Crna Gora je do 2006. bila u zajednici sa Srbijom, a tada je na referendumu izglasala nezavisnost.

      - id: polozaj-klik-albanija
        vrsta: karta_klik
        tezina: srednje
        pojmovi: [albanci, skadarsko-jezero]
        pitanje: Klikni na suseda na jugoistoku, sa kojim Crna Gora deli Skadarsko jezero i reku Bojanu.
        cilj: {drzava: ALB}
        pomoc:
          - Ta država je južno od Crne Gore i takođe izlazi na Jadransko more.
          - Njen glavni grad je Tirana.
          - Klikni na Albaniju.
        objasnjenje: Albanija je sused na jugoistoku; granica sa njom prolazi preko Skadarskog jezera i rekom Bojanom.
        iz_udzbenika:
          strana: 22
          odeljak: Vode
          tekst: Skadarsko jezero je na jugu, uz granicu sa Albanijom, a iz njega ka moru teče Bojana.
          slika: 05-crna-gora/04-skadarsko-jezero.jpg

      - id: polozaj-klik-bih
        vrsta: karta_klik
        tezina: srednje
        pojmovi: [crna-gora]
        pitanje: Klikni na suseda koji se sa Crnom Gorom graniči na severu i severozapadu, preko planina.
        cilj: {drzava: BIH}
        pomoc:
          - Taj sused ima samo vrlo kratak izlaz na more, ali ne pored Crne Gore.
          - Njen glavni grad je Sarajevo.
          - Klikni na Bosnu i Hercegovinu.
        objasnjenje: Bosna i Hercegovina je sused na severu i severozapadu; tamo se Tara spaja sa Pivom u Drinu.
        iz_udzbenika:
          strana: 21
          odeljak: Uvod — položaj i nastanak države
          tekst: Među četiri suseda Crne Gore je i Bosna i Hercegovina, na njenom severu i severozapadu.

      - id: polozaj-klik-hrvatska
        vrsta: karta_klik
        tezina: srednje
        pojmovi: [crna-gora, bokokotorski-zaliv]
        pitanje: Klikni na suseda sa kojim Crna Gora ima samo kratku granicu, na krajnjem severozapadu obale, kod ulaza u Boku Kotorsku.
        cilj: {drzava: HRV}
        pomoc:
          - Ta država nastavlja jadransku obalu ka severozapadu.
          - Ona ima dugu i razuđenu obalu sa mnogo ostrva.
          - Klikni na Hrvatsku.
        objasnjenje: Hrvatska je sused na krajnjem severozapadu; granica je kratka i dolazi do mora kod ulaza u Boku Kotorsku.
        iz_udzbenika:
          strana: 21
          odeljak: Uvod — položaj i nastanak države
          tekst: Susedi Crne Gore su Hrvatska, Bosna i Hercegovina, Srbija i Albanija; Hrvatska je uz more, severozapadno od Boke Kotorske.

      - id: polozaj-gde-sam-crna-gora
        vrsta: gde_sam
        tezina: srednje
        pojmovi: [crna-gora, kanjon-tare, podgorica]
        pitanje: Gde sam? Pročitaj trag i klikni državu na karti.
        cilj: {drzava: MNE}
        tragovi:
          - Moj službeni jezik nosi isto ime kao i ja.
          - Kroz moje planine teče Tara i gradi najdublji kanjon u Evropi.
          - Nezavisna sam od 2006, kada sam izašla iz zajednice sa Srbijom.
          - Moj glavni grad je Podgorica.
        objasnjenje: Crna Gora — nezavisna od 2006, glavni grad Podgorica, jezik crnogorski, a na severu je kanjon Tare.
        iz_udzbenika:
          strana: 21
          odeljak: Uvod — osnovni podaci
          tekst: Crna Gora je mala balkanska, planinska i primorska država; glavni grad je Podgorica, a nezavisna je od 2006.
          slika: 05-crna-gora/01-crna-gora-infografika.jpg

      - id: polozaj-gde-sam-podgorica
        vrsta: gde_sam
        tezina: lako
        pojmovi: [podgorica, zetska-nizija, moraca]
        pitanje: Gde sam? Pročitaj trag i klikni mesto na karti.
        cilj: {mesto: podgorica}
        tragovi:
          - Ležim u najvećoj niziji svoje zemlje, severno od velikog jezera.
          - Kroz mene teče reka Morača.
          - Ja sam glavni grad Crne Gore.
        objasnjenje: Podgorica — glavni grad Crne Gore, na Morači, u Zetskoj niziji severno od Skadarskog jezera.
        iz_udzbenika:
          strana: 21
          odeljak: Uvod — osnovni podaci
          tekst: Glavni grad Crne Gore je Podgorica; leži u Zetskoj niziji, kroz koju teče Morača.
          slika: 05-crna-gora/03-zetska-nizija.jpg

  - naslov: Obala
    zadaci:
      - id: obala-izbor-more
        vrsta: izbor
        tezina: lako
        pojmovi: [jadransko-more]
        pitanje: Na koje more izlazi Crna Gora?
        odgovori:
