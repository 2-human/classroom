<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Republika Crna Gora — kviz</title>
<style>

 :root{--hub-bg:#faf8f2;--hub-card:#fff;--hub-ink:#2b2b2b;--hub-head:#3a3528;--hub-mute:#6b6456;--hub-line:#e6e0d2;--hub-soft:#f3ecd8;--hub-accent:#b1271f;--hub-ok:#1f7a3a;--hub-nav-w:280px;--hub-drawer-w:440px}
 html:has(.app-body){overflow:hidden}
 .app-body{margin:0;height:100vh;height:100dvh;overflow:hidden;display:flex;flex-direction:column;max-width:100vw;background:var(--hub-bg);color:var(--hub-ink);font-family:system-ui,Segoe UI,Roboto,Arial,sans-serif}
 .app-bar{flex:0 0 auto;display:flex;align-items:center;gap:14px;padding:8px 16px;background:var(--hub-card);border-bottom:1px solid var(--hub-line);min-width:0;position:relative;z-index:50}
 .app-bar .app-menu{display:none;padding:0;width:36px;height:34px;font-size:18px;line-height:1;border:1px solid var(--hub-line);background:var(--hub-card);color:var(--hub-head);border-radius:7px;cursor:pointer}
 .app-bar .app-menu:hover{background:var(--hub-soft);color:var(--hub-head)}
 .brand{font-weight:700;font-size:15px;color:var(--hub-head);text-decoration:none;white-space:nowrap}
 .brand:hover{color:var(--hub-accent)}
 .app-crumbs{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--hub-mute);min-width:0;overflow:hidden;white-space:nowrap}
 .app-crumbs a{color:var(--hub-mute);text-decoration:none}
 .app-crumbs a:hover{color:var(--hub-accent)}
 .app-crumbs .sep{color:#b9b2a0}
 .app-crumbs .cur{color:var(--hub-head);font-weight:600;overflow:hidden;text-overflow:ellipsis}
 .bar-right{margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end;min-width:0}
 .app-grid{flex:1 1 auto;display:grid;grid-template-columns:var(--hub-nav-w) minmax(0,1fr);min-height:0}
 .app-nav{background:var(--hub-card);border-right:1px solid var(--hub-line);overflow:auto;padding:10px 10px 40px;min-height:0}
 .app-filter{width:100%;font:inherit;font-size:13px;padding:7px 9px;border:1px solid var(--hub-line);border-radius:6px;margin:0 0 4px;background:#fff;color:var(--hub-ink)}
 .app-filter:focus{outline:none;border-color:var(--hub-mute)}
 .app-nav .sec{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--hub-mute);padding:12px 6px 4px}
 .app-nav .cnt{font-size:11px;color:var(--hub-mute);font-variant-numeric:tabular-nums;letter-spacing:0;text-transform:none}
 .f-hide{display:none!important}
 .app-main{position:relative;overflow:auto;min-width:0;min-height:0;transition:margin-right .18s ease}
 .app-drawer{position:fixed;top:var(--htop,50px);right:0;bottom:0;width:var(--hub-drawer-w);max-width:100vw;background:var(--hub-card);border-left:1px solid var(--hub-line);box-shadow:-8px 0 24px rgba(58,53,40,.10);transform:translateX(105%);transition:transform .18s ease;z-index:60;display:flex;flex-direction:column}
 .app-drawer.open{transform:none}
 .drawer-head{display:flex;align-items:flex-start;gap:10px;padding:14px 16px 10px;border-bottom:1px solid var(--hub-line)}
 .drawer-head h2{margin:0;font-size:16px;color:var(--hub-head);flex:1 1 auto;overflow-wrap:anywhere}
 .app-drawer .drawer-close{border:0;background:none;padding:0 4px;font-size:24px;line-height:1;cursor:pointer;color:var(--hub-mute)}
 .app-drawer .drawer-close:hover{background:none;color:var(--hub-accent)}
 .drawer-body{flex:1 1 auto;overflow:auto;padding:12px 16px 24px;font-size:13px;line-height:1.55}
 .drawer-foot{flex:0 0 auto;border-top:1px solid var(--hub-line);padding:10px 16px;font-size:12px;color:var(--hub-mute)}
 .mtabs{display:flex;gap:2px;border-bottom:1px solid var(--hub-line);flex-wrap:wrap;background:var(--hub-card);padding:0 12px}
 .mtabs a{text-decoration:none;color:var(--hub-mute);font-size:13px;padding:9px 12px 8px;border-bottom:2px solid transparent}
 .mtabs a[aria-current="page"]{color:var(--hub-head);border-bottom-color:var(--hub-accent);font-weight:600}
 .bar-menu-wrap{position:relative}
 .bar-menu{display:none;position:absolute;right:0;top:calc(100% + 8px);z-index:70;background:var(--hub-card);border:1px solid var(--hub-line);border-radius:10px;box-shadow:0 6px 20px rgba(0,0,0,.16);padding:8px;min-width:240px}
 .bar-menu.open{display:flex;flex-direction:column;align-items:stretch;gap:6px}
 .tbl{width:100%;border-collapse:collapse;background:var(--hub-card);border:1px solid var(--hub-line);border-radius:6px;font-size:13px}
 .tbl th{text-align:left;font-weight:600;font-size:11.5px;color:var(--hub-mute);padding:8px 10px;border-bottom:1px solid var(--hub-line);background:#fcfaf4;white-space:nowrap}
 .tbl td{padding:7px 10px;border-bottom:1px solid #f0ebe0;vertical-align:top}
 .tbl td.num,.tbl th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
 .tbl tr.clk{cursor:pointer} .tbl tr.clk:hover td{background:#fbf7ec}
 @media (min-width:1200px){ .app-body:has(.app-drawer.open) .app-main{margin-right:var(--hub-drawer-w)} }
 @media (max-width:760px){
   .app-bar{gap:10px;padding:8px 12px}
   .app-bar .app-menu{display:inline-block}
   .app-crumbs{display:none}
   .app-grid{grid-template-columns:minmax(0,1fr)}
   .app-nav{position:fixed;top:var(--htop,50px);left:0;bottom:0;width:300px;max-width:88vw;z-index:55;transform:translateX(-105%);transition:transform .18s ease;box-shadow:8px 0 24px rgba(58,53,40,.10)}
   .app-nav.open{transform:none}
   .app-drawer{width:100vw}
 }
 @media print{
   html:has(.app-body){overflow:visible}
   .app-body{height:auto;overflow:visible;display:block}
   .app-grid{display:block}
   .app-main,.app-nav{overflow:visible}
   .app-drawer,.app-filter,.app-menu,.bar-menu-wrap,.mtabs{display:none!important}
 }

 .les{max-width:860px;padding:22px 28px 80px;line-height:1.6;color:#2b2b2b}
 .les h1{font-size:25px;margin:0 0 4px;color:#3a3528}
 .les .meta{color:#6b6456;font-size:13.5px;margin:0 0 6px}
 .les .meta a{color:#b1271f;text-decoration:none}
 .les section{margin:22px 0;scroll-margin-top:12px}
 .les h2{font-size:18px;color:#3a3528;margin:0 0 8px;padding-bottom:5px;border-bottom:1px solid #e6e0d2}
 .les h3{font-size:15.5px;color:#3a3528;margin:0 0 6px}
 .les section.l3{margin-left:14px;padding-left:12px;border-left:3px solid #f3ecd8}
 .les .str{font-size:12px;font-weight:400;color:#6b6456;margin-left:6px;white-space:nowrap}
 .les ul,.les ol{padding-left:22px;margin:6px 0} .les li{margin:3px 0}
 .les p{margin:6px 0}
 .les a{color:#b1271f}
 .les .pojam{border-bottom:1px dotted #b9b2a0}
 .les blockquote{margin:8px 0;padding:6px 14px;border-left:3px solid #c98a2c;background:#fefcf7}
 .les .tbl{overflow-x:auto} .les table{border-collapse:collapse;font-size:14px;margin:8px 0}
 .les th,.les td{border:1px solid #e6e0d2;padding:4px 8px;text-align:left;vertical-align:top} .les th{background:#f3ecd8}
 .strana{margin:26px 0 14px;scroll-margin-top:12px;background:#fff;border:1px solid #e6e0d2;border-radius:10px;overflow:hidden}
 .strana .pg{display:flex;justify-content:space-between;align-items:center;padding:7px 12px;font-size:12.5px;color:#6b6456;background:#fbf7ec;border-bottom:1px solid #e6e0d2}
 .strana .pg b{color:#3a3528}
 .strana .pg button{font:inherit;font-size:12px;border:1px solid #e6e0d2;background:#fff;border-radius:6px;padding:2px 9px;cursor:pointer;color:#3a3528}
 .strana img{display:block;width:100%;height:auto;cursor:zoom-in}
 .strana.zoom{overflow-x:auto} .strana.zoom img{width:auto;max-width:none;cursor:zoom-out}
 .strana.nema{padding:12px;color:#9b9387;font-size:13.5px;background:#fefcf7}
 .notes-lbl{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:#1f7a3a;margin:0 0 -12px}
 .gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin-top:8px}
 .gal figure{margin:0;background:#fff;border:1px solid #e6e0d2;border-radius:8px;overflow:hidden;scroll-margin-top:12px}
 .gal img{display:block;width:100%;height:auto} .gal figcaption{font-size:12.5px;color:#6b6456;padding:6px 9px}
 .hit{animation:hit 2.4s ease-out} @keyframes hit{0%{box-shadow:0 0 0 4px rgba(201,138,44,.55)}100%{box-shadow:0 0 0 4px rgba(201,138,44,0)}}

 :root{--ink:#2b2b2b;--muted:#6b6456;--edge:#b1271f;--accent:#1f7a3a;--border:#e6e0d2;--soft:#fefcf7;--warn:#c98a2c;
       --sea:#cfe6f2;--land:#efeae0;--land-se:#f3ecd8;--bord:#8a8170}
 *{box-sizing:border-box}
 button{font:inherit;padding:7px 14px;border:1px solid var(--edge);background:#fff;color:var(--edge);border-radius:8px;cursor:pointer}
 button:hover{background:var(--edge);color:#fff}
 button.ok{border-color:var(--accent);color:var(--accent)} button.ok:hover{background:var(--accent);color:#fff}
 button:disabled{opacity:.45;cursor:default;background:#fff;color:inherit}
 .opt:disabled,.tn button:disabled,.mcell:disabled,.blank:disabled{opacity:1;cursor:default}
 .opt:disabled:not(.right):not(.wrong){opacity:.6}
 .bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-size:14px}
 .bar-menu-btn{padding:5px 12px;font-size:16px;line-height:1;border-color:var(--muted);color:#3a3528}
 .bar-menu-btn:hover{background:#f3ecd8;color:#3a3528}
 .bar-menu button{width:100%;text-align:left}
 .bar-menu .menu-link{display:block;font-size:13px;color:var(--edge);text-decoration:none;padding:7px 14px;border:1px dashed #e6b0b0;border-radius:8px}
 .stat{background:#f3ecd8;border:1px solid #e1d8c2;border-radius:8px;padding:4px 10px;white-space:nowrap}
 .stat b{font-size:15px;color:var(--accent)}
 .intro p{font-size:14px;color:#4a4434;line-height:1.6;margin:0 0 10px}
 .intro ul{margin:0 0 10px;padding-left:18px;font-size:13.5px;line-height:1.55}
 /* navigation: items */
 .it-row{display:flex;align-items:center;gap:8px;width:100%;border:0;border-radius:5px;background:none;color:var(--ink);font:inherit;font-size:13px;text-align:left;padding:5px 6px;cursor:pointer}
 a.it-row{text-decoration:none;box-sizing:border-box}
 .it-row:hover{background:#f6f1e4;color:var(--ink)}
 .it-row.sel{background:#efe7d2;font-weight:600}
 .it-row.off{opacity:.4}
 .it-row .st{flex:0 0 16px;text-align:center;color:#b9b2a0}
 .it-row.ok .st{color:var(--accent)} .it-row.rev .st,.it-row.fail .st{color:var(--edge)} .it-row.part .st{color:var(--warn)}
 .it-row .lbl{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
 .it-row .pt{flex:0 0 auto;font-size:11px;color:var(--muted);font-weight:400;font-variant-numeric:tabular-nums}
 .tz{flex:0 0 auto;display:inline-block;min-width:1.5em;text-align:center;font-size:10px;font-weight:700;border-radius:8px;padding:1px 5px;letter-spacing:.02em}
 .tz-lako{background:#e3f2e8;color:#1f6b3a} .tz-srednje{background:#fbefd5;color:#8a5a14} .tz-tesko{background:#f8dcd8;color:#8a2a22}
 .tz-legend{display:flex;gap:8px;flex-wrap:wrap;font-size:11px;color:var(--muted);padding:2px 6px 0}
 /* main: item */
 .item{padding:20px 24px 40px;max-width:1100px}
 .ihead{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-bottom:8px}
 .vchip{font-size:11px;text-transform:uppercase;letter-spacing:.05em;border:1px solid var(--border);border-radius:9px;padding:1px 8px;background:#fff}
 .item h2.q{font-size:18px;line-height:1.4;color:#3a3528;margin:0 0 14px}
 .opts{display:flex;flex-direction:column;gap:8px;max-width:640px}
 .opt{display:flex;gap:10px;align-items:flex-start;text-align:left;border:1px solid var(--border);background:#fff;color:var(--ink);border-radius:8px;padding:10px 12px;font-size:14.5px;line-height:1.4}
 .opt:hover{background:#fbf7ec;color:var(--ink)}
 .opt.picked{border-color:#3a3528;background:#f6f1e4}
 .opt.wrong{border-color:#e6b0b0;background:#fdecec;color:#8a2a22} .opt.wrong .ot{text-decoration:line-through}
 .opt.right{border-color:#9fd5b6;background:#e8f5ec;color:#13602c;font-weight:600}
 .opt .box{flex:0 0 18px;height:18px;border:1.5px solid #6b6456;border-radius:4px;margin-top:1px}
 .opt.picked .box{background:#3a3528;box-shadow:inset 0 0 0 3px #fff}
 .opt.round .box{border-radius:50%}
 .tn{display:flex;gap:12px;margin:4px 0 14px}
 .tn button{min-width:8em;padding:10px 18px;font-size:15px}
 .tn button.right{background:var(--accent);border-color:var(--accent);color:#fff}
 .tn button.wrong{background:#fdecec;border-color:#e6b0b0;color:#8a2a22}
 .stmt{font-size:16px;line-height:1.5;border-left:3px solid #e1d8c2;padding:6px 12px;margin:0 0 14px;background:#fff}
 .sub-q{font-weight:600;color:#3a3528;margin:16px 0 8px}
 .cloze{font-size:16px;line-height:2.3;max-width:720px}
 .blank{display:inline-block;min-width:5.5em;border:0;border-bottom:2px solid #6b6456;background:#fff;text-align:center;font:inherit;font-weight:600;color:#3a3528;padding:0 6px;margin:0 3px;border-radius:4px 4px 0 0;cursor:pointer}
 input.blank{cursor:text;width:7em}
 .blank:hover{background:#fbf7ec;color:#3a3528}
 .blank.cur{border-bottom-color:var(--edge);background:#fff7f3}
 .blank.lock{border-bottom-color:var(--accent);background:#e8f5ec;color:#13602c;cursor:default}
 .blank.bad{border-bottom-color:var(--edge);background:#fdecec;color:#8a2a22}
 .blank.rev{border-bottom-color:var(--warn);background:#fdf3e2;color:#8a5a14}
 .bank{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 0}
 .bank button{padding:5px 12px;border-color:#6b6456;color:#3a3528;border-radius:16px}
 .bank button:hover{background:#f3ecd8;color:#3a3528}
 .bank button.used{opacity:.3;pointer-events:none}
 .match{display:grid;grid-template-columns:1fr 1fr;gap:10px 28px;max-width:720px}
 .match .col{display:flex;flex-direction:column;gap:8px}
 .mcell{text-align:left;border:1px solid var(--border);background:#fff;color:var(--ink);border-radius:8px;padding:9px 12px;font-size:14px}
 .mcell:hover{background:#fbf7ec;color:var(--ink)}
 .mcell.cur{border-color:#3a3528;box-shadow:0 0 0 2px rgba(58,53,40,.15)}
 .mcell.done{border-color:#9fd5b6;background:#e8f5ec;color:#13602c;cursor:default}
 .mcell.rev{border-color:#ecc98a;background:#fdf3e2;color:#8a5a14;cursor:default}
 .mcell.bad{animation:shake .3s;border-color:#e6b0b0;background:#fdecec}
 .mcell .n{display:inline-block;min-width:1.4em;font-weight:700;margin-right:6px;color:var(--muted)}
 @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
 .iactions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:18px}
 .fb{font-size:14px;font-weight:600;min-height:1.4em}
 .fb.ok{color:var(--accent)} .fb.bad{color:var(--edge)} .fb.info{color:var(--muted);font-weight:400}
 .expl{margin-top:14px;padding:10px 14px;border-radius:8px;background:#e8f5ec;border:1px solid #bfe0c8;color:#13602c;font-size:14px;line-height:1.5;max-width:720px}
 .expl.rev{background:#fdf3e2;border-color:#f0d878;color:#6b4a10}
 .help-inline{display:none}
 /* map */
 .mapwrap{position:relative;margin-top:6px;border:1px solid var(--border);border-radius:8px;overflow:hidden;background:var(--sea);aspect-ratio:1000/660;max-height:70vh;touch-action:none}
 .mapwrap svg{width:100%;height:100%;display:block;cursor:crosshair}
 .mapwrap svg.drag{cursor:grabbing}
 .mapwrap .c{fill:var(--land);stroke:var(--bord);stroke-width:.6;vector-effect:non-scaling-stroke}
 .mapwrap .c.se{fill:var(--land-se)}
 .mapwrap .c.se:hover{fill:#e9dcb8}
 .mapwrap .c.hit{fill:#bfe0c8} .mapwrap .c.miss{fill:#f3c9c4} .mapwrap .c.revc{fill:#f6dca6}
 .mapwrap .mk{pointer-events:none}
 .mapwrap .mk circle{stroke:#fff;vector-effect:non-scaling-stroke}
 .mapwrap .mk text{font-size:13px;font-weight:700;paint-order:stroke;stroke:#fff;stroke-width:3px;vector-effect:non-scaling-stroke}
 .zbar{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px}
 .zbar button{width:36px;height:36px;padding:0;font-size:18px;font-weight:700;background:#fff;border-color:#6b6456;color:#3a3528;box-shadow:0 1px 3px rgba(0,0,0,.2)}
 .zbar button:hover{background:#f3ecd8;color:#3a3528}
 .zhint{position:absolute;left:10px;bottom:8px;font-size:11.5px;color:var(--muted);background:rgba(255,255,255,.85);border-radius:6px;padding:3px 8px;pointer-events:none}
 .clues{list-style:none;margin:0 0 6px;padding:0;max-width:720px}
 .clues li{padding:7px 10px;margin:0 0 6px;border-left:3px solid #e1d8c2;background:#fff;font-size:14.5px;line-height:1.45}
 .clues li:last-child{border-left-color:var(--edge)}
 .clues .k{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-right:6px}
 /* drawer content */
 .hl h3{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:14px 0 6px}
 .hl ol{margin:0;padding-left:20px} .hl li{margin:0 0 10px;line-height:1.5}
 .hl li.new{animation:flash 1.2s}
 @keyframes flash{0%{background:#fff3c4}100%{background:transparent}}
 .hl .placeholder{color:#9b9387;font-style:italic}
 .hl .chips{display:flex;flex-wrap:wrap;gap:6px}
 .hl .pchip{font-size:12px;border:1px solid var(--border);border-radius:10px;padding:1px 9px;background:#fefcf7}
 .hl a{color:var(--edge);text-decoration:none}
 .hl ul{margin:0;padding-left:18px} .hl ul li{margin:3px 0}
 .hl .ref{font-size:12px;color:var(--muted);margin:0 0 6px}
 .hl figure{margin:6px 0 10px} .hl figure img{display:block;max-width:100%;border-radius:6px;border:1px solid var(--border)}
 .qfig{margin:16px 0 0;max-width:720px} .qfig img{display:block;max-width:100%;max-height:62vh;border-radius:8px;border:1px solid var(--border);cursor:zoom-in}
 .qfig.zoom{max-width:none;overflow-x:auto} .qfig.zoom img{max-width:none;max-height:none;cursor:zoom-out}
 .qfig figcaption{font-size:12.5px;color:var(--muted);margin-top:5px}
 .hl figcaption{font-size:11.5px;color:var(--muted);margin-top:4px}
 .hl .book{border-left:3px solid #e1d8c2;padding:2px 0 2px 12px;margin:6px 0 4px}
 .hl .odeljak{margin:10px 0 4px;padding:8px 12px;background:#fefcf7;border:1px solid #e6e0d2;border-radius:8px;font-size:14px;line-height:1.5}
 .hl .odeljak summary{cursor:pointer;font-weight:600;color:#3a3528;font-size:13px}
 .hl .odeljak ul,.hl .odeljak ol{padding-left:20px;margin:6px 0} .hl .odeljak li{margin:3px 0} .hl .odeljak p{margin:6px 0}
 .hl .odeljak table{border-collapse:collapse;font-size:13px} .hl .odeljak th,.hl .odeljak td{border:1px solid #e6e0d2;padding:3px 6px}
 .hl .tekst-links{display:flex;flex-wrap:wrap;gap:6px 14px;margin:8px 0 4px;font-size:13.5px}
 .hl .tekst-links a{color:var(--edge);font-weight:600;text-decoration:none}
 /* the lesson (protected copy): main column via the nav, or one part of it in the wide drawer */
 .app-drawer.wide{width:min(820px,100vw)}
 .app-drawer .les{padding:0;max-width:none}
 .app-drawer .les section,.app-drawer .les .strana{margin:0 0 16px}
 .lekbar{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}
 .lekbar button{font-size:13px;padding:6px 12px}
 /* summary */
 .sum{padding:22px 26px 40px;max-width:860px}
 .sum h1{font-size:22px;margin:0 0 6px;color:#3a3528}
 .sum .big{font-size:30px;font-weight:700;color:var(--accent)}
 .sum .tbl{margin:14px 0}
 .sum .sub{color:var(--muted);margin:0 0 6px} .sum .lead{color:var(--muted);max-width:640px;line-height:1.5}
 .rv{border:1px solid var(--border);border-radius:8px;background:#fff;padding:10px 14px;margin:12px 0}
 .rv .rq{margin:4px 0 8px;font-weight:600;color:#3a3528} .rv .rl{margin:0;font-size:12px;color:var(--muted)}
 .rlog{margin:2px 0 8px;padding-left:18px;font-size:13.5px} .rlog .ok{color:var(--accent)} .rlog .bad{color:var(--edge)}
 .rv .rc{margin:0;font-size:13.5px}
 /* why a wrong option is wrong */
 .opt .why{display:block;font-size:12.5px;font-weight:400;color:#6b4a10;text-decoration:none;margin-top:4px;line-height:1.4}
 .opt.wrong{flex-wrap:wrap} .opt.wrong > span:last-child{flex:1 1 0}
 .why-box{border-left:3px solid var(--warn);background:#fdf3e2;padding:6px 10px;margin:0 0 10px;font-size:13.5px;line-height:1.45}
 /* datum */
 .dt{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:4px 0 6px}
 .dt input{font:inherit;font-size:18px;font-weight:600;width:6.5em;text-align:center;padding:8px;border:1.5px solid #6b6456;border-radius:8px}
 .dt select{font:inherit;font-size:14px;padding:7px 6px;border:1.5px solid #6b6456;border-radius:8px;background:#fff}
 .dt input.bad{border-color:var(--edge);background:#fdecec} .dt input:disabled{background:#e8f5ec;border-color:#9fd5b6;color:#13602c}
 .dt .ev{font-size:16px;border-left:3px solid #e1d8c2;padding:6px 12px;background:#fff;margin:0 0 14px}
 /* poredjaj */
 .ord{display:grid;grid-template-columns:1fr 1fr;gap:18px;max-width:900px}
 .ord h4{margin:0 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
 .ord .col{display:flex;flex-direction:column;gap:8px}
 .slot{display:flex;gap:8px;align-items:center;min-height:42px;text-align:left;border:1px dashed #cfc6b0;background:#fff;color:var(--ink);border-radius:8px;padding:8px 10px;font-size:14px}
 .slot .n{flex:0 0 1.6em;font-weight:700;color:var(--muted)}
 .slot.fill{border-style:solid;border-color:#3a3528} .slot.lock{border-style:solid;border-color:#9fd5b6;background:#e8f5ec;color:#13602c;cursor:default}
 .slot.rev{border-style:solid;border-color:#ecc98a;background:#fdf3e2;color:#8a5a14} .slot .yr{margin-left:auto;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
 .pool button{text-align:left}
 /* lanac */
 .chain{display:flex;flex-wrap:wrap;align-items:stretch;gap:6px;margin:0 0 16px;max-width:980px}
 .chain .lk{flex:1 1 150px;border:1px solid var(--border);background:#fff;border-radius:8px;padding:9px 11px;font-size:14px;line-height:1.4}
 .chain .lk.q{border:2px dashed var(--edge);background:#fff7f3;color:var(--edge);font-weight:700;text-align:center;display:flex;align-items:center;justify-content:center}
 .chain .lk.q.ok{border:1px solid #9fd5b6;background:#e8f5ec;color:#13602c;font-weight:600}
 .chain .ar{align-self:center;color:var(--muted);font-size:18px}
 /* izvor */
 .src{max-width:760px;margin:0 0 16px;border:1px solid #e1d8c2;border-radius:8px;background:#fffdf6;padding:12px 16px}
 .src .who{font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
 .src blockquote{margin:0;font-family:Georgia,serif;font-size:15.5px;line-height:1.55;color:#3a3528}
 .src .nt{font-size:12px;color:var(--muted);margin:8px 0 0}
 /* uporedi */
 .cmp{border-collapse:collapse;max-width:900px;width:100%}
 .cmp td{border-top:1px solid var(--border);padding:8px 6px;vertical-align:top;font-size:14px;line-height:1.4}
 .cmp td.bt{white-space:nowrap;text-align:right}
 .cmp .cb{padding:4px 9px;margin:2px;font-size:12.5px;border-color:#6b6456;color:#3a3528}
 .cmp-key{font-size:14px;line-height:1.6;margin:0 0 8px;padding:6px 10px;background:#fff;border-left:3px solid #e1d8c2;max-width:900px}
 .cmp .cb:hover{background:#f3ecd8;color:#3a3528} .cmp .cb.on{background:#3a3528;color:#fff}
 .cmp .cb.right{background:var(--accent);border-color:var(--accent);color:#fff} .cmp .cb.wrong{background:#fdecec;border-color:#e6b0b0;color:#8a2a22}
 .cmp tr.lock td:first-child{color:#13602c} .cmp tr.bad td:first-child{color:#8a2a22}
 .cmp .why{display:block;font-size:12.5px;color:#6b4a10;margin-top:3px}
 /* objasni */
 .exp textarea{width:100%;max-width:760px;min-height:110px;font:inherit;font-size:15px;line-height:1.5;padding:10px 12px;border:1.5px solid #6b6456;border-radius:8px}
 .exp .mine{max-width:760px;white-space:pre-wrap;border-left:3px solid #6b6456;background:#fff;padding:8px 12px;font-size:14.5px;line-height:1.5}
 .exp .uzor{max-width:760px;border-left:3px solid var(--accent);background:#e8f5ec;padding:8px 12px;font-size:14.5px;line-height:1.5;color:#13602c}
 .exp label{display:flex;gap:10px;align-items:flex-start;max-width:760px;padding:7px 10px;border:1px solid var(--border);border-radius:8px;background:#fff;margin:0 0 6px;font-size:14px;cursor:pointer}
 .exp label input{margin-top:3px}
 /* vremenska osa */
 .osa{position:relative;margin:16px 0 8px;max-width:1100px}
 .osa .lane{position:relative;border-top:1px solid var(--border);padding:6px 0 4px 110px;min-height:36px}
 .osa .lane .ll{position:absolute;left:0;top:8px;width:102px;font-size:12px;font-weight:700}
 .osa .row{position:relative;height:26px}
 .osa .ev{position:absolute;top:6px;height:14px;min-width:12px;border-radius:7px}
 .osa .ev span{position:absolute;left:calc(100% + 5px);top:-3px;font-size:11.5px;line-height:20px;white-space:nowrap;color:#3a3528}
 .osa .ev.lft span{left:auto;right:calc(100% + 5px)}   /* label to the left when it would run past the end of the axis */
 .osa .ev span small{color:var(--muted)}
 .osa .ev.rv{opacity:.45} .osa .ev.rv span{font-style:italic}
 .osa .ev.vague{background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.55) 0 4px,transparent 4px 8px)}   /* dated by the book only as part of a century */
 .osa .ticks{position:relative;height:22px;margin-left:110px;border-top:2px solid #3a3528}
 .osa .ticks span{position:absolute;top:3px;font-size:11px;color:var(--muted);transform:translateX(-50%)}
 .osa .ticks span::before{content:'';position:absolute;left:50%;top:-6px;height:5px;border-left:1px solid #3a3528}
 .osa-wrap{overflow-x:auto} .osa-wrap .osa{min-width:720px}
 /* moje znanje */
 .box5{display:inline-flex;gap:3px;vertical-align:middle} .box5 i{width:11px;height:11px;border-radius:3px;background:#e6e0d2;display:inline-block}
 .box5 i.on{background:var(--accent)}
 .zn-due{color:var(--edge);font-weight:600}
 .placed{font-size:12.5px;color:var(--accent);margin:8px 0 0}
 #msg{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--edge);color:#fff;padding:9px 18px;border-radius:24px;font-size:14px;font-weight:600;opacity:0;transition:opacity .25s;pointer-events:none;z-index:99}
 #msg.show{opacity:1}
 @media (max-width:760px){
   .brand{display:none}
   .bar{flex-wrap:nowrap;gap:6px} .stat{padding:3px 7px;font-size:12px} .stat b{font-size:13px}
   .bar-menu-btn{padding:4px 9px}
   .item{padding:14px 14px 40px} .item h2.q{font-size:16.5px}
   .match{grid-template-columns:1fr 1fr;gap:8px 10px} .mcell{font-size:13px;padding:8px}
   .help-inline{display:block;margin-top:14px}
   .help-inline:empty{display:none}
   .help-inline .hl{border:1px solid #f0d878;background:#fffbe6;border-radius:8px;padding:2px 12px 4px}
   .mapwrap{aspect-ratio:auto;height:52vh}
   .ord{grid-template-columns:1fr} .cmp td.bt{white-space:normal} .cmp tr{display:block;border-top:1px solid var(--border)} .cmp td{display:block;border:0;text-align:left!important}
   .chain .ar{transform:rotate(90deg);width:100%;text-align:center} .chain .lk{flex-basis:100%}
 }
</style>

  // ☰ navigation (only shown at ≤760px)
  const nav = document.getElementById('app-nav');
  const navBtn = document.getElementById('app-menu');
  const navOverlay = () => window.matchMedia && window.matchMedia('(max-width:760px)').matches;
  function setNav(open) {
    if (!nav) return;
    nav.classList.toggle('open', !!open);
    if (navBtn) navBtn.setAttribute('aria-expanded', String(!!open));
  }
  if (navBtn) navBtn.addEventListener('click', e => { e.stopPropagation(); setNav(!nav.classList.contains('open')); });

  // navigation filter: case- and diacritic-insensitive (š, č, ć, ž, đ)
  const filter = document.getElementById('app-filter');
  const norm = s => String(s || '').toLowerCase().replace(/đ/g, 'd').normalize('NFD').replace(/[̀-ͯ]/g, '');
  function applyFilter() {
    const q = norm(filter.value.trim());
    document.querySelectorAll('#app-nav [data-filter]').forEach(el =>
      el.classList.toggle('f-hide', !!q && !norm(el.dataset.filter).includes(q)));
    document.querySelectorAll('#app-nav [data-filter-group]').forEach(g =>
      g.classList.toggle('f-hide', !!q && !g.querySelector('[data-filter]:not(.f-hide)')));
  }
  if (filter) filter.addEventListener('input', applyFilter);

  // ⋯ menus: a button with data-menu="<id>" toggles .bar-menu#<id>; a button inside closes it
  function setMenu(m, open) {
    m.classList.toggle('open', !!open);
    const b = document.querySelector('[data-menu="' + m.id + '"]');
    if (b) b.setAttribute('aria-expanded', String(!!open));
  }
  document.querySelectorAll('[data-menu]').forEach(btn => {
    const m = document.getElementById(btn.dataset.menu);
    if (!m) return;
    btn.addEventListener('click', e => { e.stopPropagation(); setMenu(m, !m.classList.contains('open')); });
    m.addEventListener('click', e => { e.stopPropagation(); if (e.target.closest('button')) setMenu(m, false); });
  });
  document.addEventListener('click', e => {
    // composedPath: the clicked node may already be re-rendered away (e.g. a step's "next" button)
    if (!e.composedPath().some(n => n.dataset && n.dataset.keepMenus)) document.querySelectorAll('.bar-menu.open').forEach(m => setMenu(m, false));
    if (nav && nav.classList.contains('open') && navOverlay() && !nav.contains(e.target)) setNav(false);
  });
  document.addEventListener('keydown', e => {
    if (e.key !== 'Escape') return;
    document.querySelectorAll('.bar-menu.open').forEach(m => setMenu(m, false));
    const x = document.querySelector('.app-drawer.open .drawer-close');
    if (x && x.offsetParent !== null) x.click();
  });

  window.HubShell = { setNav, setMenu, applyFilter, navOverlay };
})();
</script>

n": false}, {"tekst": "oko 4.500 stanovnika na km²", "tacan": false}], "pomoc": ["Korak 1: Gustina = broj stanovnika podeljen sa površinom.", "Korak 2: Zaokruži: 626.000 : 14.000 — koliko je to otprilike?", "Iz lekcije: 626.250 stanovnika i 13.812 km² daju oko 45 st/km²."], "objasnjenje": "626.250 podeljeno sa 13.812 je oko 45 — na svakom kvadratnom kilometru živi u proseku oko 45 ljudi.", "iz_udzbenika": {"strana": 21, "odeljak": "Uvod — osnovni podaci", "tekst": "Iz podataka infokutije (626.250 stanovnika, 13.812 km²) može se izračunati gustina naseljenosti — oko 45 stanovnika na km².", "slika": "05-crna-gora/01-crna-gora-infografika.jpg"}, "lekcija": 5}, {"id": "l05-polozaj-klik-crna-gora", "vrsta": "karta_klik", "tezina": "lako", "pojmovi": ["crna-gora"], "pitanje": "Klikni na kartu — Crna Gora.", "cilj": {"drzava": "MNE"}, "pomoc": ["Crna Gora je mala država na obali Jadranskog mora.", "Nalazi se između Hrvatske (na severozapadu) i Albanije (na jugoistoku).", "Klikni na malu primorsku državu u sredini karte."], "objasnjenje": "Crna Gora leži na obali Jadrana, između Hrvatske, Bosne i Hercegovine, Srbije i Albanije.", "iz_udzbenika": {"strana": 21, "odeljak": "Uvod — položaj i nastanak države", "tekst": "Na maloj karti u infokutiji Crna Gora je istaknuta crvenom bojom na obali Jadranskog mora.", "slika": "05-crna-gora/01-crna-gora-infografika.jpg"}, "lekcija": 5}, {"id": "l05-polozaj-klik-srbija", "vrsta": "karta_klik", "tezina": "lako", "pojmovi": ["crna-gora", "referendum"], "pitanje": "Klikni na državu sa kojom je Crna Gora bila u zajednici do 2006. godine.", "cilj": {"drzava": "SRB"}, "pomoc": ["Ta država je severoistočno od Crne Gore i nema izlaz na more.", "Njen glavni grad je Beograd.", "Iz lekcije: 2006. je Crna Gora izašla iz zajednice sa Srbijom."], "objasnjenje": "Do 2006. Crna Gora je bila u zajednici sa Srbijom, svojim severoistočnim susedom.", "iz_udzbenika": {"strana": 21, "odeljak": "Uvod — položaj i nastanak države", "tekst": "Crna Gora je do 2006. bila u zajednici sa Srbijom, a tada je na referendumu izglasala nezavisnost."}, "lekcija": 5}, {"id": "l05-polozaj-klik-albanija", "vrsta": "karta_klik", "tezina": "srednje", "pojmovi": ["albanci", "skadarsko-jezero"], "pitanje": "Klikni na suseda na jugoistoku, sa kojim Crna Gora deli Skadarsko jezero i reku Bojanu.", "cilj": {"drzava": "ALB"}, "pomoc": ["Ta država je južno od Crne Gore i takođe izlazi na Jadransko more.", "Njen glavni grad je Tirana.", "Klikni na Albaniju."], "objasnjenje": "Albanija je sused na jugoistoku; granica sa njom prolazi preko Skadarskog jezera i rekom Bojanom.", "iz_udzbenika": {"strana": 22, "odeljak": "Vode", "tekst": "Skadarsko jezero je na jugu, uz granicu sa Albanijom, a iz njega ka moru teče Bojana.", "slika": "05-crna-gora/04-skadarsko-jezero.jpg"}, "lekcija": 5}, {"id": "l05-polozaj-klik-bih", "vrsta": "karta_klik", "tezina": "srednje", "pojmovi": ["crna-gora"], "pitanje": "Klikni na suseda koji se sa Crnom Gorom graniči na severu i severozapadu, preko planina.", "cilj": {"drzava": "BIH"}, "pomoc": ["Taj sused ima samo vrlo kratak izlaz na more, ali ne pored Crne Gore.", "Njen glavni grad je Sarajevo.", "Klikni na Bosnu i Hercegovinu."], "objasnjenje": "Bosna i Hercegovina je sused na severu i severozapadu; tamo se Tara spaja sa Pivom u Drinu.", "iz_udzbenika": {"strana": 21, "odeljak": "Uvod — položaj i nastanak države", "tekst": "Među četiri suseda Crne Gore je i Bosna i Hercegovina, na njenom severu i severozapadu."}, "lekcija": 5}, {"id": "l05-polozaj-klik-hrvatska", "vrsta": "karta_klik", "tezina": "srednje", "pojmovi": ["crna-gora", "bokokotorski-zaliv"], "pitanje": "Klikni na suseda sa kojim Crna Gora ima samo kratku granicu, na krajnjem severozapadu obale, kod ulaza u Boku Kotorsku.", "cilj": {"drzava": "HRV"}, "pomoc": ["Ta država nastavlja jadransku obalu ka severozapadu.", "Ona ima dugu i razuđenu obalu sa mnogo ostrva.", "Klikni na Hrvatsku."], "objasnjenje": "Hrvatska je sused na krajnjem severozapadu; granica je kratka i dolazi do mora kod ulaza u Boku Kotorsku.", "iz_udzbenika": {"strana": 21, "odeljak": "Uvod — položaj i nastanak države", "tekst": "Susedi Crne Gore su Hrvatska, Bosna i Hercegovina, Srbija i Albanija; Hrvatska je uz more, severozapadno od Boke Kotorske."}, "lekcija": 5}, {"id": "l05-polozaj-gde-sam-crna-gora", "vrsta": "gde_sam", "tezina": "srednje", "pojmovi": ["crna-gora", "kanjon-tare", "podgorica"], "pitanje": "Gde sam? Pročitaj trag i klikni državu na karti.", "cilj": {"drzava": "MNE"}, "tragovi": ["Moj službeni jezik nosi isto ime kao i ja.", "Kroz moje planine teče Tara i gradi najdublji kanjon u Evropi.", "Nezavisna sam od 2006, kada sam izašla iz zajednice sa Srbijom.", "Moj glavni grad je Podgorica."], "objasnjenje": "Crna Gora — nezavisna od 2006, glavni grad Podgorica, jezik crnogorski, a na severu je kanjon Tare.", "iz_udzbenika": {"strana": 21, "odeljak": "Uvod — osnovni podaci", "tekst": "Crna Gora je mala balkanska, planinska i primorska država; glavni grad je Podgorica, a nezavisna je od 2006.", "slika": "05-crna-gora/01-crna-gora-infografika.jpg"}, "lekcija": 5}, {"id": "l05-polozaj-gde-sam-podgorica", "vrsta": "gde_sam", "tezina": "lako", "pojmovi": ["podgorica", "zetska-nizija", "moraca"], "pitanje": "Gde sam? Pročitaj trag i klikni mesto na karti.", "cilj": {"mesto": "podgorica"}, "tragovi": ["Ležim u najvećoj niziji svoje zemlje, severno od velikog jezera.", "Kroz mene teče reka Morača.", "Ja sam glavni grad Crne Gore."], "objasnjenje": "Podgorica — glavni grad Crne Gore, na Morači, u Zetskoj niziji severno od Skadarskog jezera.", "iz_udzbenika": {"strana": 21, "odeljak": "Uvod — osnovni podaci", "tekst": "Glavni grad Crne Gore je Podgorica; leži u Zetskoj niziji, kroz koju teče Morača.", "slika": "05-crna-gora/03-zetska-nizija.jpg"}, "lekcija": 5}]}, {"naslov": "Obala", "zadaci": [{"id": "l05-obala-izbor-more", "vrsta": "izbor", "tezina": "lako", "pojmovi": ["jadransko-more"], "pitanje": "Na koje more izlazi Crna Gora?", "odgovori": [{"tekst": "Jadransko more", "tacan": true}, {"tekst": "Crno more", "tacan": false}, {"tekst": "Egejsko more", "tacan": false}, {"tekst": "Baltičko more", "tacan": false}], "pomoc": ["To je more između Balkanskog i Apeninskog poluostrva.", "Na isto more izlaze i Hrvatska i Albanija.", "Iz lekcije: obala Crne Gore je na Jadranskom moru."], "objasnjenje": "Crna Gora izlazi na Jadransko more, između Hrvatske i Albanije.", "iz_udzbenika": {"strana": 21, "odeljak": "Fizičko-geografske odlike — obala", "tekst": "Crnogorska obala je na Jadranskom moru; duga je oko 293 km."}, "lekcija": 5}, {"id": "l05-obala-tn-razudjena", "vrsta": "tacno_netacno", "tezina": "lako", "pojmovi": ["jadransko-more"], "tvrdnja": "Obala Crne Gore je duga i veoma razuđena, sa mnogo ostrva.", "tacno": false, "ispravke": [{"tekst": "Obala je kratka (oko 293 km) i slabo razuđena.", "tacan": true}, {"tekst": "Obala je kratka, ali veoma razuđena.", "tacan": false}, {"tekst": "Crna Gora uopšte nema obalu.", "tacan": false}], "pomoc": ["Crna Gora je mala država — može li imati veoma dugu obalu?", "Razuđena obala ima mnogo zaliva, poluostrva i ostrva; crnogorska ih ima malo.", "Iz lekcije: obala je duga oko 293 km i slabo razuđena."], "objasnjenje": "Netačno — crnogorska obala je kratka (oko 293 km) i slabo razuđena; ima samo nekoliko poluostrva i malo ostrva.", "iz_udzbenika": {"strana": 21, "odeljak": "Fizičko-geografske odlike — obala", "tekst": "Obala Crne Gore duga je oko 293 km i slabo je razuđena."}, "lekcija": 5}, {"id": "l05-obala-dopuni-duzina", "vrsta": "dopuni", "tezina": "srednje", "pojmovi": ["jadransko-more"], "pitanje": "Dopuni rečenicu rečima iz banke.", "tekst": "Obala Crne Gore duga je oko {{293}} km i {{slabo}} je razuđena.", "ponudjene": ["293", "2.930", "slabo", "veoma"], "pomoc": ["Obala male države ne može biti duga hiljadama kilometara.", "Crnogorska obala ima malo zaliva i ostrva.", "Iz lekcije: oko 293 km, slabo razuđena."], "objasnjenje": "Obala je duga oko 293 km i slabo je razuđena.", "iz_udzbenika": {"strana": 21, "odeljak": "Fizičko-geografske odlike — obala", "tekst": "Crnogorska obala na Jadranu duga je oko 293 km; malo je razuđena."}, "lekcija": 5}, {"id": "l05-obala-izbor-zaliv", "vrsta": "izbor", "tezina": "lako", "pojmovi": ["bokokotorski-zaliv"], "pitanje": "Koji je najveći zaliv crnogorske obale?", "odgovori": [{"tekst": "Bokokotorski zaliv", "tacan": true}, {"tekst": "Kvarnerski zaliv", "tacan": false}, {"tekst": "Solunski zaliv", "tacan": false}, {"tekst": "Tršćanski zaliv", "tacan": false}], "pomoc": ["Zaliv nosi ime grada koji leži na njegovom dnu.", "Taj grad je Kotor.", "Iz lekcije: najveći zaliv je Bokokotorski."], "objasnjenje": "Najveći zaliv je Bokokotorski (Boka Kotorska); ostali ponuđeni zalivi su u Hrvatskoj, Grčkoj i Italiji.", "iz_udzbenika": {"strana": 21, "odeljak": "Fizičko-geografske odlike — obala", "tekst": "Najveći zaliv Crne Gore je Bokokotorski; čine ga četiri manja zaliva.", "slika": "05-crna-gora/02-kotorski-zaliv.jpg"}, "lekcija": 5}, {"id": "l05-obala-dopuni-boka", "vrsta": "dopuni", "tezina": "srednje", "pojmovi": ["bokokotorski-zaliv"], "pitanje": "Dopuni rečenicu rečju iz banke.", "tekst": "Bokokotorski zaliv sastoji se od {{četiri|4|cetiri}} manja zaliva.", "ponudjene": ["dva", "četiri", "sedam"], "pomoc": ["Boka nije jedan zaliv, već niz manjih zaliva povezanih jedan sa drugim.", "Broj je veći od dva, a manji od pet.", "Iz lekcije: Bokokotorski zaliv se sastoji od četiri manja zaliva."], "objasnjenje": "Boka Kotorska se sastoji od četiri manja zaliva; jedan od njih je Risanski zaliv.", "iz_udzbenika": {"strana": 21, "odeljak": "Fizičko-geografske odlike — obala", "tekst": "Bokokotorski zaliv, najveći na crnogorskoj obali, sastoji se od četiri manja zaliva.", "slika": "05-crna-gora/02-kotorski-zaliv.jpg"}, "lekcija": 5}, {"id": "l05-obala-izbor-lovcen-pogled", "vrsta": "izbor", "tezina": "srednje", "pojmovi": ["lovcen", "bokokotorski-zaliv"], "pitanje": "Fotografija Kotorskog zaliva u udžbeniku snimljena je sa planine koja se diže iznad Kotora. Koja je to planina?", "odgovori": [{"tekst": "Lovćen", "tacan": true}, {"tekst": "Durmitor", "tacan": false}, {"tekst": "Prokletije", "tacan": false}, {"tekst": "Bjelasica", "tacan": false}], "pomoc": ["Tražiš planinu uz samo more, a ne na severu ili istoku zemlje.", "Ona je jedna od tri planine koje odvajaju primorje od unutrašnjosti.", "Iz lekcije: pogled na Kotorski zaliv sa planine Lovćen."], "objasnjenje": "Kotor leži ispod Lovćena; Durmitor je na severu, Prokletije na jugoistoku, a Bjelasica na severoistoku.", "iz_udzbenika": {"strana": 22, "odeljak": "Slika — Kotorski zaliv", "tekst": "Fotografija prikazuje uzan, dubok zaliv okružen strmim planinama, snimljen sa Lovćena; planine se spuštaju pravo u more.", "slika": "05-crna-gora/02-kotorski-zaliv.jpg"}, "lekcija": 5}, {"id": "l05-obala-tn-lustica", "vrsta": "tacno_netacno", "tezina": "srednje", "pojmovi": ["lustica"], "tvrdnja": "Luštica je najveće ostrvo Crne Gore.", "tacno": false, "ispravke": [{"tekst": "Luštica je najveće poluostrvo Crne Gore.", "tacan": true}, {"tekst": "Luštica je najveći zaliv Crne Gore.", "tacan": false}, {"tekst": "Luštica je planina iznad Boke Kotorske.", "tacan": false}], "pomoc": ["Luštica je sa tri strane okružena morem, a sa četvrte je vezana za kopno.", "Najpoznatije crnogorsko ostrvo je Sveti Stefan.", "Iz lekcije: najveće poluostrvo je Luštica."], "objasnjenje": "Netačno — Luštica je poluostrvo (najveće u Crnoj Gori), a ne ostrvo.", "iz_udzbenika": {"strana": 21, "odeljak": "Fizičko-geografske odlike — obala", "tekst": "Najveće poluostrvo crnogorske obale je Luštica, a najpoznatije ostrvo Sveti Stefan."}, "lekcija": 5}, {"id": "l05-obala-izbor-ostrvo", "vrsta": "izbor", "tezina": "lako", "pojmovi": ["sveti-stefan"], "pitanje": "Koje je najpoznatije ostrvo Crne Gore?", "odgovori": [{"tekst": "Sveti Stefan", "tacan": true}, {"tekst": "Krf", "tacan": false}, {"tekst": "Hvar", "tacan": false}, {"tekst": "Malta", "tacan": false}], "pomoc": ["Ostrvo je malo i nalazi se blizu Budve.", "Krf je grčko, Hvar hrvatsko, a Malta je posebna država.", "Iz lekcije: najpoznatije ostrvo je Sveti Stefan."], "objasnjenje": "Najpoznatije crnogorsko ostrvo je Sveti Stefan, kod Budve.", "iz_udzbenika": {"strana": 21, "odeljak": "Fizičko-geografske odlike — obala", "tekst": "Najpoznatije ostrvo Crne Gore je Sveti Stefan, koje je sa kopnom spojeno peščanim sprudom.", "slika": "05-crna-gora/09-sveti-stefan.jpg"}, "lekcija": 5}, {"id": "l05-obala-tn-sveti-stefan", "vrsta": "tacno_netacno", "tezina": "srednje", "pojmovi": ["sveti-stefan", "tombolo"], "tvrdnja": "Sveti Stefan je sa kopnom spojen mostom.", "tacno": false, "ispravke": [{"tekst": "Spojen je peščanim sprudom — tombolom (prevlakom).", "tacan": true}, {"tekst": "Nije spojen — do njega se stiže samo brodom.", "tacan": false}, {"tekst": "Spojen je jezerouzinom.", "tacan": false}], "pomoc": ["Veza je prirodna, nastala od peska.", "Jezerouzina se odnosi na jezera, a ne na more.", "Iz lekcije: Sveti Stefan je sa kopnom spojen peščanim sprudom — tombolom (prevlakom)."], "objasnjenje": "Netačno — Sveti Stefan za kopno vezuje peščani sprud, koji se zove tombolo ili prevlaka.", "iz_udzbenika": {"strana": 21, "odeljak": "Fizičko-geografske odlike — obala", "tekst": "Sveti Stefan je sa kopnom povezan peščanim sprudom; takav sprud se naziva tombolo ili prevlaka.", "slika": "05-crna-gora/09-sveti-stefan.jpg"}, "lekcija": 5}, {"id": "l05-obala-dopuni-tombolo", "vrsta": "dopuni", "tezina": "tesko", "pojmovi": ["tombolo", "sveti-stefan"], "pitanje": "Dopuni rečenicu (bez ponuđenih reči).", "tekst": "Peščani sprud koji ostrvo Sveti Stefan vezuje za kopno zove se {{tombolo}} ili {{prevlaka}}.", "pomoc": ["Traže se dva naziva za isti oblik — jedan strani, jedan naš.", "Naš naziv dolazi od toga što sprud „prevlači” put od kopna do ostrva.", "Iz lekcije: takav sprud se zove tombolo ili prevlaka."], "objasnjenje": "Sprud koji vezuje ostrvo za kopno je tombolo, odnosno prevlaka; Sveti Stefan je najpoznatiji primer u Crnoj Gori.", "iz_udzbenika": {"strana": 21, "odeljak": "Fizičko-geografske odlike — obala", "tekst": "Peščani sprud koji ostrvo vezuje za kopno naziva se tombolo ili prevlaka; takav je Sveti Stefan.", "slika": "05-crna-gora/09-sveti-stefan.jpg"}, "lekcija": 5}, {"id": "l05-obala-zakljuci-tombolo-novi", "vrsta": "zakljuci", "slika_u_pitanju": true, "tezina": "srednje", "pojmovi": ["tombolo"], "pitanje": "Na fotografiji nekog drugog primorja vidiš malo ostrvo koje je sa obalom spojeno uzanim peščanim sprudom. Kako se zove taj sprud?", "odgovori": [{"tekst": "tombolo (prevlaka)", "tacan": true}, {"tekst": "ada", "tacan": false}, {"tekst": "jezerouzina", "tacan": false}, {"tekst": "kanjon", "tacan": false}], "pomoc": ["Korak 1: Setite se Svetog Stefana — kako je on vezan za kopno?", "Korak 2: Ada je rečno ostrvo, a jezerouzina deo jezera — nijedno ne vezuje ostrvo za obalu.", "Iz lekcije: sprud koji ostrvo vezuje za kopno zove se tombolo ili prevlaka."], "objasnjenje": "Bilo gde da se nalazi, peščani sprud koji spaja ostrvo i kopno je tombolo (prevlaka) — kao kod Svetog Stefana.", "iz_udzbenika": {"strana": 21, "odeljak": "Fizičko-geografske odlike — obala", "tekst": "Tombolo ili prevlaka je peščani sprud koji ostrvo vezuje za kopno; primer u Crnoj Gori je Sveti Stefan.", "slika": "05-crna-gora/09-sveti-stefan.jpg"}, "lekcija": 5}, {"id": "l05-obala-zakljuci-dva-ostrva", "vrsta": "zakljuci", "tezina": "tesko", "pojmovi": ["sveti-stefan", "ada-bojana", "tombolo", "ada"], "pitanje": "Šta je tačno poređenje Svetog Stefana i Ade Bojane?", "odgovori": [{"tekst": "Oba su ostrva, ali je Sveti Stefan morsko ostrvo vezano tombolom, a Ada Bojana rečno ostrvo na ušću reke.", "tacan": true}, {"tekst": "Oba su rečna ostrva na ušću Bojane.", "tacan": false}, {"tekst": "Oba su morska ostrva vezana za kopno peščanim sprudom.", "tacan": false}, {"tekst": "Sveti Stefan je rečno ostrvo, a Ada Bojana morsko ostrvo kod Budve.", "tacan": false}], "pomoc": ["Korak 1: Gde se nalazi Sveti Stefan, a gde Ada Bojana — kod Budve ili na ušću reke?", "Korak 2: Šta znači reč „ada”, a šta „tombolo”?", "Iz lekcije: Sveti Stefan je spojen sa kopnom tombolom; Ada Bojana je ada — rečno ostrvo na ušću Bojane."], "objasnjenje": "Oba su ostrva, ali različitog porekla — Sveti Stefan je u moru kod Budve i za kopno ga vezuje tombolo, a Ada Bojana je rečno ostrvo između dva rukavca Bojane na njenom ušću.", "iz_udzbenika": {"strana": 23, "odeljak": "Slike — Sveti Stefan i Ada Bojana", "tekst": "Sveti Stefan je morsko ostrvo koje peščani sprud (tombolo) vezuje za kopno. Ada Bojana je trouglasto rečno ostrvo između dva rukavca Bojane, na njenom ušću u more.", "slika": "05-crna-gora/07-ada-bojana.jpg"}, "lekcija": 5}, {"id": "l05-obala-zakljuci-risan", "vrsta": "zakljuci", "tezina": "srednje", "pojmovi": ["risan", "bokokotorski-zaliv"], "pitanje": "Udžbenik traži da u atlasu pronađeš u kom zalivu je naselje Risan. Šta ćeš odgovoriti?", "odgovori": [{"tekst": "U Bokokotorskom zalivu — u njegovom delu, Risanskom zalivu.", "tacan": true}, {"tekst": "Na obali Skadarskog jezera.", "tacan": false}, {"tekst": "Na ušću Bojane, kod Ade Bojane.", "tacan": false}, {"tekst": "U Zetskoj niziji, na Morači.", "tacan": false}], "pomoc": ["Korak 1: Na fotografiji iza Risana su visoke gole planine, a ispred mirna morska voda.", "Korak 2: Koji se veliki zaliv sastoji od četiri manja, od kojih jedan nosi ime Risna?", "Iz lekcije: Risan je u Risanskom zalivu, delu Boke Kotorske."], "objasnjenje": "Risan je u Risanskom zalivu, jednom od četiri manja zaliva koji čine Boku Kotorsku.", "iz_udzbenika": {"strana": 23, "odeljak": "Slika — Risan", "tekst": "Uz fotografiju Risana stoji zadatak da se u atlasu pronađe zaliv u kom je naselje — to je Bokokotorski zaliv, odnosno njegov Risanski zaliv.", "slika": "05-crna-gora/08-risan.jpg"}, "lekcija": 5}, {"id": "l05-obala-povezi-oblici", "vrsta": "povezi", "tezina": "srednje", "pojmovi": ["bokokotorski-zaliv", "lustica", "sveti-stefan", "ada-bojana", "risan"], "pitanje": "Poveži naziv sa opisom.", "parovi": [["Bokokotorski zaliv", "najveći zaliv, od četiri manja zaliva"], ["Luštica", "najveće poluostrvo"], ["Sveti Stefan", "ostrvo vezano za kopno tombolom"], ["Ada Bojana", "rečno ostrvo na ušću Bojane"], ["Risan", "naselje u delu Boke Kotorske"]], "pomoc": ["Prvo izdvoji dva ostrva i odluči koje je morsko, a koje rečno.", "Ostaju zaliv, poluostrvo i naselje.", "Iz lekcije: Boka — najveći zaliv; Luštica — najveće poluostrvo; Sveti Stefan — tombolo; Ada Bojana — ada; Risan — u Risanskom zalivu."], "objasnjenje": "Bokokotorski zaliv je najveći (četiri manja zaliva), Luštica najveće poluostrvo, Sveti Stefan ostrvo sa tombolom, Ada Bojana rečno ostrvo, a Risan naselje u Boki.", "iz_udzbenika": {"strana": 21, "odeljak": "Fizičko-geografske odlike — obala", "tekst": "Obala je slabo razuđena; najveći zaliv je Bokokotorski, najveće poluostrvo Luštica, a najpoznatije ostrvo Sveti Stefan."}, "lekcija": 5}, {"id": "l05-obala-klik-boka", "vrsta": "karta_klik", "tezina": "lako", "pojmovi": ["bokokotorski-zaliv"], "pitanje": "Klikni na kartu — Bokokotorski zaliv.", "cilj": {"mesto": "bokokotorski-zaliv"}, "pomoc": ["Zaliv je na krajnjem severozapadu crnogorske obale.", "Nalazi se blizu granice sa Hrvatskom.", "Iz lekcije: Boka Kotorska je na severozapadu obale, a na njenom dnu je Kotor."], "objasnjenje": "Bokokotorski zaliv je na krajnjem severozapadu crnogorske obale, uz granicu sa Hrvatskom.", "iz_udzbenika": {"strana": 21, "odeljak": "Fizičko-geografske odlike — obala", "tekst": "Bokokotorski zaliv je najveći zaliv Crne Gore, na severozapadu njene obale.", "slika": "05-crna-gora/02-kotorski-zaliv.jpg"}, "lekcija": 5}, {"id": "l05-obala-klik-budva", "vrsta": "karta_klik", "tezina": "srednje", "pojmovi": ["sveti-stefan", "turizam"], "pitanje": "Ostrvo Sveti Stefan je blizu jednog poznatog primorskog grada. Klikni na taj grad — Budvu.", "cilj": {"mesto": "budva"}, "pomoc": ["Budva je na moru, jugoistočno od Boke Kotorske.", "Nalazi se na sredini crnogorske obale, između Boke i Skadarskog jezera.", "Iz lekcije: Sveti Stefan je kod Budve, na Budvanskoj rivijeri."], "objasnjenje": "Budva je primorski grad na sredini crnogorske obale; jugoistočno od nje je Sveti Stefan.", "iz_udzbenika": {"strana": 23, "odeljak": "Slika — Sveti Stefan", "tekst": "Uz fotografiju Svetog Stefana stoji pitanje blizu kojih naselja je ostrvo — to su Budva, Pržno i Petrovac.", "slika": "05-crna-gora/09-sveti-stefan.jpg"}, "lekcija": 5}, {"id": "l05-obala-klik-sveti-stefan", "vrsta": "karta_klik", "tezina": "tesko", "pojmovi": ["sveti-stefan", "tombolo"], "pitanje": "Klikni na kartu — ostrvo Sveti Stefan.", "cilj": {"mesto": "sveti-stefan"}, "pomoc": ["Ostrvo je na Budvanskoj rivijeri, na sredini crnogorske obale.", "Nalazi se malo jugoistočno od Budve.", "Iz lekcije: Sveti Stefan je kod Budve."], "objasnjenje": "Sveti Stefan je malo jugoistočno od Budve, uz samu obalu.", "iz_udzbenika": {"strana": 23, "odeljak": "Slika — Sveti Stefan", "tekst": "Sveti Stefan je malo ostrvo kod Budve, spojeno sa kopnom peščanim sprudom.", "slika": "05-crna-gora/09-sveti-stefan.jpg"}, "lekcija": 5}, {"id": "l05-obala-klik-lustica", "vrsta": "karta_klik", "tezina": "tesko", "pojmovi": ["lustica", "bokokotorski-zaliv"], "pitanje": "Klikni na kartu — poluostrvo Luštica.", "cilj": {"mesto": "lustica"}, "pomoc": ["Luštica je na krajnjem severozapadu crnogorske obale.", "Nalazi se na samom ulazu u Boku Kotorsku, sa njene južne strane.", "Iz lekcije: Luštica je najveće poluostrvo; leži na ulazu u Boku Kotorsku."], "objasnjenje": "Luštica je na ulazu u Bokokotorski zaliv, sa njegove južne strane.", "iz_udzbenika": {"strana": 21, "odeljak": "Fizičko-geografske odlike — obala", "tekst": "Najveće poluostrvo crnogorske obale je Luštica, na ulazu u Boku Kotorsku."}, "lekcija": 5}, {"id": "l05-obala-gde-sam-sveti-stefan", "vrsta": "gde_sam", "tezina": "srednje", "pojmovi": ["sveti-stefan", "tombolo", "turizam"], "pitanje": "Gde sam? Pročitaj trag i klikni mesto na karti.", "cilj": {"mesto": "sveti-stefan"}, "tragovi": ["Gusto sam pokriven kamenim kućama sa crvenim krovovima, a oko mene su plaže pune kupača.", "Nalazim se na Budvanskoj rivijeri.", "Sa kopnom me vezuje uzani peščani sprud — tombolo.", "Ja sam najpoznatije ostrvo Crne Gore."], "objasnjenje": "Sveti Stefan — najpoznatije crnogorsko ostrvo, kod Budve, vezano za kopno tombolom.", "iz_udzbenika": {"strana": 23, "odeljak": "Slika — Sveti Stefan", "tekst": "Fotografija prikazuje malo ostrvo sa kamenim kućama, spojeno sa kopnom uskim peščanim sprudom, uz plažu punu kupača.", "slika": "05-crna-gora/09-sveti-stefan.jpg"}, "lekcija": 5}, {"id": "l05-obala-gde-sam-risan", "vrsta": "gde_sam", "tezina": "tesko", "pojmovi": ["risan", "bokokotorski-zaliv"], "pitanje": "Gde sam? Pročitaj trag i klikni mesto na karti.", "cilj": {"mesto": "risan"}, "tragovi": ["Moje kamene kuće i zvonik ogledaju se u mirnoj vodi, a iza mene se dižu visoke gole planine.", "Nalazim se duboko u unutrašnjosti najvećeg crnogorskog zaliva.", "Jedan od četiri manja zaliva Boke Kotorske nosi moje ime.", "Ja sam naselje Risan."], "objasnjenje": "Risan je u Risanskom zalivu, u unutrašnjem delu Boke Kotorske.", "iz_udzbenika": {"strana": 23, "odeljak": "Slika — Risan", "tekst": "Risan je malo primorsko naselje uz mirnu vodu zaliva, ispod visokih golih planina; nalazi se u Risanskom zalivu, delu Boke Kotorske.", "slika": "05-crna-gora/08-risan.jpg"}, "lekcija": 5}]}, {"naslov": "Reljef", "zadaci": [{"id": "l05-reljef-izbor-tip", "vrsta": "izbor", "tezina": "lako", "pojmovi": ["crna-gora", "dinarske-planine"], "pitanje": "Koji reljef preovlađuje u Crnoj Gori?", "odgovori": [{"tekst": "planinski", "tacan": true}, {"tekst": "nizijski", "tacan": false}, {"tekst": "pustinjski", "tacan": false}, {"tekst": "močvarni", "tacan": false}], "pomoc": ["Pogledaj ime države.", "Udžbenik je opisuje kao „planinsku” zemlju.", "Iz lekcije: preovlađuje planinski reljef."], "objasnjenje": "U Crnoj Gori preovlađuje planinski reljef; ravnice su samo u dolinama Zete i Morače.", "iz_udzbenika": {"strana": 22, "odeljak": "Fizičko-geografske odlike — reljef", "tekst": "U reljefu Crne Gore preovlađuju planine; ravnice su male i nalaze se u rečnim dolinama."}, "lekcija": 5}, {"id": "l05-reljef-zakljuci-atlas", "vrsta": "zakljuci", "tezina": "lako", "pojmovi": ["crna-gora"], "pitanje": "Otvaraš fizičku kartu Crne Gore u atlasu. Kojom bojom će biti obojen najveći deo zemlje?", "odgovori": [{"tekst": "smeđom, jer preovlađuju planine", "tacan": true}, {"tekst": "zelenom, jer preovlađuju nizije", "tacan": false}, {"tekst": "plavom, jer je veći deo zemlje pod vodom", "tacan": false}, {"tekst": "belom, jer je cela zemlja pod ledom", "tacan": false}], "pomoc": ["Korak 1: Na fizičkoj karti nizije su zelene, a planine smeđe.", "Korak 2: Koji reljef preovlađuje u Crnoj Gori?", "Iz lekcije: u Crnoj Gori preovlađuje planinski reljef."], "objasnjenje": "Pošto preovlađuje planinski reljef, najveći deo Crne Gore na fizičkoj karti je smeđ; zelene su samo male ravnice oko Zete i Morače.", "iz_udzbenika": {"strana": 22, "odeljak": "Fizičko-geografske odlike — reljef", "tekst": "Udžbenik traži da se svi pojmovi reljefa pronađu u atlasu; preovlađuju planine, a ravnice su samo u dolinama Zete i Morače."}, "lekcija": 5}, {"id": "l05-reljef-izbor-planine", "vrsta": "izbor", "tezina": "tesko", "pojmovi": ["durmitor", "prokletije", "sinjajevina", "bjelasica"], "pitanje": "Koje su planine, prema udžbeniku, među najvišim planinama Crne Gore? (Više tačnih.)", "odgovori": [{"tekst": "Durmitor", "tacan": true}, {"tekst": "Prokletije", "tacan": true}, {"tekst": "Sinjajevina", "tacan": true}, {"tekst": "Bjelasica", "tacan": true}, {"tekst": "Kopaonik", "tacan": false}, {"tekst": "Fruška gora", "tacan": false}, {"tekst": "Rumija", "tacan": false}], "pomoc": ["Kopaonik i Fruška gora su planine u Srbiji.", "Rumija je primorska planina koja odvaja more od unutrašnjosti, ali nije među najvišima koje udžbenik navodi.", "Iz lekcije: najviše planine su Durmitor, Prokletije, Sinjajevina i Bjelasica."], "objasnjenje": "Među najvišim planinama udžbenik navodi Durmitor, Prokletije, Sinjajevinu i Bjelasicu. Rumija spada u planine uz primorje (Orjen, Lovćen, Rumija), a Kopaonik i Fruška gora su u Srbiji.", "iz_udzbenika": {"strana": 22, "odeljak": "Fizičko-geografske odlike — reljef", "tekst": "Najviše planine Crne Gore su Durmitor, Prokletije, Sinjajevina i Bjelasica; Orjen, Lovćen i Rumija odvajaju primorje od unutrašnjosti."}, "lekcija": 5}, {"id": "l05-reljef-izbor-tri-planine", "vrsta": "izbor", "tezina": "srednje", "pojmovi": ["orjen", "lovcen", "rumija"], "pitanje": "Koje planine odvajaju planinski deo Crne Gore od primorskog?", "odgovori": [{"tekst": "Orjen, Lovćen i Rumija", "tacan": true}, {"tekst": "Durmitor, Sinjajevina i Bjelasica", "tacan": false}, {"tekst": "Prokletije, Durmitor i Orjen", "tacan": false}, {"tekst": "Lovćen, Kopaonik i Rumija", "tacan": false}], "pomoc": ["Tražiš planine koje su blizu mora, a ne na severu zemlje.", "Jedna od njih je iznad Kotora, a jedna između Skadarskog jezera i mora.", "Iz lekcije: Orjen, Lovćen i Rumija odvajaju planinski deo od primorskog."], "objasnjenje": "Orjen, Lovćen i Rumija su planine uz primorje; one odvajaju obalu od planinske unutrašnjosti.", "iz_udzbenika": {"strana": 22, "odeljak": "Fizičko-geografske odlike — reljef", "tekst": "Planine Orjen, Lovćen i Rumija čine granicu između planinskog dela Crne Gore i primorja."}, "lekcija": 5}, {"id": "l05-reljef-tn-tri-planine", "vrsta": "tacno_netacno", "tezina": "lako", "pojmovi": ["orjen", "lovcen", "rumija"], "tvrdnja": "Planine Orjen, Lovćen i Rumija odvajaju planinski deo Crne Gore od primorskog.", "tacno": true, "pomoc": ["Pogledaj gde su ove tri planine — blizu mora ili na severu?", "Sve tri se dižu odmah iznad obale.", "Iz lekcije: Orjen, Lovćen i Rumija odvajaju planinski deo od primorskog."], "objasnjenje": "Tačno — Orjen, Lovćen i Rumija lopavlićka ravnica.", "iz_udzbenika": {"strana": 22, "odeljak": "Fizičko-geografske odlike — reljef", "tekst": "U dolini reke Zete je Bjelopavlićka ravnica, a u dolini Morače Zetska nizija.", "slika": "05-crna-gora/03-zetska-nizija.jpg"}, "lekcija": 5}, {"id": "l05-reljef-povezi-vrste", "vrsta": "povezi", "tezina": "lako", "pojmovi": ["durmitor", "zetska-nizija", "skadarsko-jezero", "bokokotorski-zaliv"], "pitanje": "Poveži naziv sa vrstom oblika.", "parovi": [["Durmitor", "planina"], ["Zetska nizija", "ravnica u dolini reke"], ["Skadarsko jezero", "jezero"], ["Bokokotorski zaliv", "zaliv"]], "pomoc": ["Svaki naziv već otkriva šta je — osim jednog.", "Durmitor je nacionalni park sa ledničkim jezerima, visoko na severu.", "Iz lekcije: Durmitor je planina, Zetska nizija ravnica, Skadarsko jezero jezero, a Boka zaliv."], "objasnjenje": "Durmitor je planina, Zetska nizija ravnica u dolini Morače, Skadarsko jezero najveće jezero Balkana, a Bokokotorski zaliv najveći zaliv Crne Gore.", "iz_udzbenika": {"strana": 22, "odeljak": "Fizičko-geografske odlike — reljef", "tekst": "Udžbenik traži da se svi pojmovi reljefa i voda — planine, ravnice, zalivi i jezera — pronađu u atlasu."}, "lekcija": 5}, {"id": "l05-reljef-povezi-reke-ravnice", "vrsta": "povezi", "tezina": "srednje", "pojmovi": ["bjelopavlicka-ravnica", "zetska-nizija", "kanjon-tare", "ada-bojana"], "pitanje": "Poveži oblik reljefa sa rekom uz koju se nalazi.", "parovi": [["Bjelopavlićka ravnica", "Zeta"], ["Zetska nizija", "Morača"], ["najdublji kanjon Evrope", "Tara"], ["Ada Bojana", "Bojana"]], "pomoc": ["Ime Zetske nizije zavarava — ona nije u dolini Zete.", "Kanjon je na severu, ispod Durmitora.", "Iz lekcije: Zeta — Bjelopavlićka ravnica; Morača — Zetska nizija; Tara — kanjon; Bojana — Ada Bojana."], "objasnjenje": "Bjelopavlićka ravnica je uz Zetu, Zetska nizija uz Moraču, kanjon Tare uz Taru, a Ada Bojana na ušću Bojane.", "iz_udzbenika": {"strana": 22, "odeljak": "Fizičko-geografske odlike — reljef i vode",
