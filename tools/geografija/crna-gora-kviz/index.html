a; deli ga Crna Gora sa Albanijom.", "iz_udzbenika": {"strana": 22, "odeljak": "Fizičko-geografske odlike — vode", "tekst": "Skadarsko jezero je najveće jezero na Balkanskom poluostrvu i nacionalni park.", "slika": "05-crna-gora/04-skadarsko-jezero.jpg"}, "lekcija": 5}, {"id": "l05-vode-tn-skadarsko-np", "vrsta": "tacno_netacno", "tezina": "lako", "pojmovi": ["skadarsko-jezero", "nacionalni-park"], "tvrdnja": "Skadarsko jezero je proglašeno nacionalnim parkom zbog posebne flore i faune.", "tacno": true, "pomoc": ["Nacionalni park se proglašava da bi se zaštitila priroda.", "Razmisli šta je u jezeru i oko njega posebno vredno.", "Iz lekcije: zbog posebne flore i faune Skadarsko jezero je nacionalni park."], "objasnjenje": "Tačno — Skadarsko jezero je nacionalni park zbog posebnog biljnog (flora) i životinjskog (fauna) sveta.", "iz_udzbenika": {"strana": 22, "odeljak": "Fizičko-geografske odlike — vode", "tekst": "Zbog posebne flore i faune Skadarsko jezero je proglašeno nacionalnim parkom.", "slika": "05-crna-gora/04-skadarsko-jezero.jpg"}, "lekcija": 5}, {"id": "l05-vode-izbor-bojana", "vrsta": "izbor", "tezina": "srednje", "pojmovi": ["bojana", "skadarsko-jezero"], "pitanje": "Koja reka ističe iz Skadarskog jezera?", "odgovori": [{"tekst": "Bojana", "tacan": true}, {"tekst": "Morača", "tacan": false}, {"tekst": "Tara", "tacan": false}, {"tekst": "Zeta", "tacan": false}], "pomoc": ["Pazi — jedna od ponuđenih reka se uliva u jezero, a ne ističe iz njega.", "Tražena reka teče ka moru i na ušću pravi rečno ostrvo.", "Iz lekcije: Bojana je otoka Skadarskog jezera."], "objasnjenje": "Iz Skadarskog jezera ističe Bojana i teče do mora. Morača se uliva u jezero, Zeta u Moraču, a Tara teče na severu.", "iz_udzbenika": {"strana": 22, "odeljak": "Fizičko-geografske odlike — vode", "tekst": "Bojana je otoka Skadarskog jezera — reka koja iz njega ističe i teče do Jadranskog mora."}, "lekcija": 5}, {"id": "l05-vode-tn-otoka", "vrsta": "tacno_netacno", "tezina": "tesko", "pojmovi": ["moraca", "bojana", "skadarsko-jezero"], "tvrdnja": "Morača je otoka Skadarskog jezera.", "tacno": false, "ispravke": [{"tekst": "Otoka jezera je Bojana; Morača se u jezero uliva.", "tacan": true}, {"tekst": "Otoka jezera je Tara.", "tacan": false}, {"tekst": "Skadarsko jezero nema otoku.", "tacan": false}], "pomoc": ["Otoka je reka koja iz jezera ističe, a ne ona koja u njega utiče.", "Morača teče kroz Podgoricu ka jezeru; druga reka iz jezera teče ka moru.", "Iz lekcije: Bojana je otoka Skadarskog jezera."], "objasnjenje": "Netačno — Morača se uliva u Skadarsko jezero, a iz jezera ističe Bojana (otoka).", "iz_udzbenika": {"strana": 22, "odeljak": "Fizičko-geografske odlike — vode", "tekst": "Morača teče kroz Podgoricu i uliva se u Skadarsko jezero, a iz jezera ističe Bojana."}, "lekcija": 5}, {"id": "l05-vode-dopuni-bojana", "vrsta": "dopuni", "tezina": "tesko", "pojmovi": ["bojana", "ada-bojana", "skadarsko-jezero"], "pitanje": "Dopuni rečenicu (bez ponuđenih reči).", "tekst": "Reka {{Bojana}} ističe iz {{Skadarskog|Skadarsko}} jezera, a na njenom ušću u more nalazi se rečno ostrvo {{Ada Bojana|Ada}}.", "pomoc": ["Reka i rečno ostrvo nose isto ime.", "Jezero je najveće na Balkanskom poluostrvu.", "Iz lekcije: Bojana je otoka Skadarskog jezera; na ušću je Ada Bojana."], "objasnjenje": "Bojana ističe iz Skadarskog jezera i na ušću u Jadransko more pravi Adu Bojanu.", "iz_udzbenika": {"strana": 22, "odeljak": "Fizičko-geografske odlike — vode", "tekst": "Iz Skadarskog jezera ističe Bojana, koja na ušću u more pravi trouglasto rečno ostrvo — Adu Bojanu.", "slika": "05-crna-gora/07-ada-bojana.jpg"}, "lekcija": 5}, {"id": "l05-vode-izbor-ada", "vrsta": "izbor", "tezina": "srednje", "pojmovi": ["ada", "ada-bojana"], "pitanje": "Šta znači pojam „ada”?", "odgovori": [{"tekst": "rečno ostrvo", "tacan": true}, {"tekst": "morsko ostrvo vezano za kopno sprudom", "tacan": false}, {"tekst": "uski deo jezera koji spaja dva jezera", "tacan": false}, {"tekst": "duboka i uska rečna dolina", "tacan": false}], "pomoc": ["Ada Bojana je na ušću reke, između njenih rukavaca.", "Sprud koji vezuje morsko ostrvo zove se tombolo, a uski deo jezera jezerouzina.", "Iz lekcije: ada je rečno ostrvo."], "objasnjenje": "Ada je rečno ostrvo — kao Ada Bojana, između dva rukavca Bojane i mora.", "iz_udzbenika": {"strana": 23, "odeljak": "Slika — Ada Bojana", "tekst": "Uz fotografiju Ade Bojane stoji zadatak da se na slici označi ada i objasni pojam — ada je rečno ostrvo.", "slika": "05-crna-gora/07-ada-bojana.jpg"}, "lekcija": 5}, {"id": "l05-vode-povezi-pojmovi", "vrsta": "povezi", "tezina": "srednje", "pojmovi": ["ada", "tombolo", "jezerouzina", "bojana"], "pitanje": "Poveži pojam sa njegovim značenjem.", "parovi": [["ada", "rečno ostrvo"], ["tombolo", "peščani sprud koji vezuje ostrvo za kopno"], ["jezerouzina", "uski deo koji spaja dva dela jezera"], ["otoka", "reka koja ističe iz jezera"]], "pomoc": ["Svaki pojam iz lekcije ima svoj primer — Ada Bojana, Sveti Stefan, Crno jezero, Bojana.", "Otoka „otiče” iz jezera; jezerouzina je „uzan” deo jezera.", "Iz lekcije: ada — rečno ostrvo; tombolo — sprud; jezerouzina — spojni deo Crnog jezera; Bojana — otoka Skadarskog jezera."], "objasnjenje": "Ada je rečno ostrvo, tombolo sprud do ostrva, jezerouzina uski spojni deo jezera, a otoka reka koja ističe iz jezera.", "iz_udzbenika": {"strana": 22, "odeljak": "Fizičko-geografske odlike — vode", "tekst": "Lekcija uvodi nekoliko pojmova — tombolo (Sveti Stefan), jezerouzina (Crno jezero), otoka (Bojana) i ada (Ada Bojana)."}, "lekcija": 5}, {"id": "l05-vode-povezi-reke", "vrsta": "povezi", "tezina": "lako", "pojmovi": ["zeta", "moraca", "tara", "bojana"], "pitanje": "Poveži reku sa opisom.", "parovi": [["Zeta", "teče kroz Bjelopavlićku ravnicu"], ["Morača", "teče kroz Podgoricu do Skadarskog jezera"], ["Tara", "gradi najdublji kanjon Evrope"], ["Bojana", "ističe iz Skadarskog jezera"]], "pomoc": ["Tara je na severu, a Bojana na krajnjem jugu.", "Kroz glavni grad teče Morača.", "Iz lekcije: Zeta — Bjelopavlićka ravnica; Morača — Zetska nizija i Podgorica; Tara — kanjon; Bojana — otoka Skadarskog jezera."], "objasnjenje": "Zeta teče kroz Bjelopavlićku ravnicu, Morača kroz Podgoricu do jezera, Tara gradi najdublji kanjon Evrope, a Bojana ističe iz Skadarskog jezera.", "iz_udzbenika": {"strana": 22, "odeljak": "Fizičko-geografske odlike — vode", "tekst": "Važne reke Crne Gore su Zeta, Morača, Tara i Bojana, otoka Skadarskog jezera."}, "lekcija": 5}, {"id": "l05-vode-dopuni-durmitor", "vrsta": "dopuni", "tezina": "lako", "pojmovi": ["durmitor", "lednicka-jezera", "crno-jezero"], "pitanje": "Dopuni rečenicu rečima iz banke.", "tekst": "Na Durmitoru ima {{16}} ledničkih jezera, a najlepše među njima je {{Crno}} jezero.", "ponudjene": ["16", "160", "Crno", "Skadarsko"], "pomoc": ["Skadarsko jezero je na jugu, a ne na Durmitoru.", "Jezera na Durmitoru ima više od deset, ali ne stotinu.", "Iz lekcije: Durmitor ima 16 ledničkih jezera; najlepše je Crno jezero."], "objasnjenje": "Durmitor ima 16 ledničkih jezera; najlepše je Crno jezero.", "iz_udzbenika": {"strana": 22, "odeljak": "Zanimljivost — Durmitor", "tekst": "Na Durmitoru, nacionalnom parku, nalazi se 16 ledničkih jezera; najlepše je Crno jezero.", "slika": "05-crna-gora/05-crno-jezero-durmitor.jpg"}, "lekcija": 5}, {"id": "l05-vode-izbor-crno-jezero-oblik", "vrsta": "izbor", "tezina": "lako", "pojmovi": ["crno-jezero"], "pitanje": "Na šta liči oblik Crnog jezera na Durmitoru?", "odgovori": [{"tekst": "na broj osam", "tacan": true}, {"tekst": "na krug", "tacan": false}, {"tekst": "na trougao", "tacan": false}, {"tekst": "na slovo T", "tacan": false}], "pomoc": ["Crno jezero se sastoji od dva dela.", "Dva kruga spojena uskim delom liče na jednu cifru.", "Iz lekcije: Crno jezero ima oblik broja osam."], "objasnjenje": "Crno jezero liči na broj 8 — dva jezera (Malo i Veliko) spojena su uskim delom.", "iz_udzbenika": {"strana": 22, "odeljak": "Zanimljivost — Durmitor", "tekst": "Crno jezero je oblika broja osam, jer ga čine Malo i Veliko Crno jezero.", "slika": "05-crna-gora/05-crno-jezero-durmitor.jpg"}, "lekcija": 5}, {"id": "l05-vode-zakljuci-osmica", "vrsta": "zakljuci", "tezina": "srednje", "pojmovi": ["crno-jezero", "jezerouzina"], "pitanje": "Zašto Crno jezero ima oblik broja osam?", "odgovori": [{"tekst": "Čine ga Malo i Veliko Crno jezero, spojeni jezerouzinom.", "tacan": true}, {"tekst": "Preko sredine jezera izgrađen je most.", "tacan": false}, {"tekst": "U sredini jezera je veliko ostrvo.", "tacan": false}, {"tekst": "U jezero se sa dve strane ulivaju dve reke.", "tacan": false}], "pomoc": ["Korak 1: Broj osam izgleda kao dva kruga spojena u sredini.", "Korak 2: Kako se zove uski deo jezera koji spaja dva veća dela?", "Iz lekcije: Crno jezero čine Malo i Veliko Crno jezero, povezani jezerouzinom."], "objasnjenje": "Dva jezera — Malo i Veliko Crno jezero — spojena su jezerouzinom, uskim delom jezera, pa celina liči na broj 8.", "iz_udzbenika": {"strana": 22, "odeljak": "Zanimljivost — Durmitor", "tekst": "Crno jezero čine Malo i Veliko Crno jezero, koje povezuje jezerouzina, uski deo jezera; zato liči na broj osam.", "slika": "05-crna-gora/05-crno-jezero-durmitor.jpg"}, "lekcija": 5}, {"id": "l05-vode-izbor-kanjon", "vrsta": "izbor", "tezina": "lako", "pojmovi": ["kanjon-tare", "tara"], "pitanje": "Koji je kanjon najdublji u Evropi?", "odgovori": [{"tekst": "kanjon Tare", "tacan": true}, {"tekst": "kanjon Morače", "tacan": false}, {"tekst": "Đerdapska klisura", "tacan": false}, {"tekst": "Veliki kanjon Kolorada", "tacan": false}], "pomoc": ["Kanjon je na severu Crne Gore, ispod Durmitora.", "Veliki kanjon Kolorada nije u Evropi, već u Severnoj Americi.", "Iz lekcije: kanjon Tare je najdublji u Evropi."], "objasnjenje": "Najdublji kanjon u Evropi je kanjon Tare, na severu Crne Gore.", "iz_udzbenika": {"strana": 22, "odeljak": "Zanimljivost — kanjon Tare", "tekst": "Kanjon reke Tare je najdublji kanjon u Evropi.", "slika": "05-crna-gora/06-most-djurdjevica-tara.jpg"}, "lekcija": 5}, {"id": "l05-vode-dopuni-kanjon", "vrsta": "dopuni", "tezina": "srednje", "pojmovi": ["kanjon-tare"], "pitanje": "Dopuni rečenicu brojevima iz banke.", "tekst": "Kanjon Tare dug je {{60}} km, prosečno je dubok {{1.073|1073|1 073}} m, a na najdubljem mestu čak {{1.333|1333|1 333}} m.", "ponudjene": ["60", "1.073", "1.333", "600", "3.331"], "pomoc": ["Dužina je izražena u kilometrima i manja je od stotinu.", "Najveća dubina je, naravno, veća od prosečne.", "Iz lekcije: 60 km dug, prosečno 1.073 m, najviše 1.333 m dubok."], "objasnjenje": "Kanjon Tare je dug 60 km, prosečno dubok 1.073 m, a najdublji 1.333 m.", "iz_udzbenika": {"strana": 22, "odeljak": "Zanimljivost — kanjon Tare", "tekst": "Kanjon Tare dug je 60 km i prosečno dubok 1.073 m; na jednom mestu dubina dostiže 1.333 m.", "slika": "05-crna-gora/06-most-djurdjevica-tara.jpg"}, "lekcija": 5}, {"id": "l05-vode-izbor-kanjon-dubina", "vrsta": "izbor", "tezina": "tesko", "pojmovi": ["kanjon-tare"], "pitanje": "Koliko je dubok kanjon Tare na svom najdubljem mestu?", "odgovori": [{"tekst": "1.333 m", "tacan": true}, {"tekst": "1.073 m", "tacan": false}, {"tekst": "333 m", "tacan": false}, {"tekst": "60 m", "tacan": false}], "pomoc": ["Pazi — jedan od ponuđenih brojeva je prosečna dubina, a ne najveća.", "Najveća dubina je veća od prosečne; broj 60 je dužina kanjona u km.", "Iz lekcije: prosečno 1.073 m, a najdublje 1.333 m."], "objasnjenje": "Na najdubljem mestu kanjon Tare je dubok 1.333 m; 1.073 m je prosečna dubina, a 60 km dužina kanjona.", "iz_udzbenika": {"strana": 22, "odeljak": "Zanimljivost — kanjon Tare", "tekst": "Prosečna dubina kanjona Tare je 1.073 m, a najveća 1.333 m.", "slika": "05-crna-gora/06-most-djurdjevica-tara.jpg"}, "lekcija": 5}, {"id": "l05-vode-tn-most", "vrsta": "tacno_netacno", "tezina": "lako", "pojmovi": ["most-na-djurdjevica-tari", "kanjon-tare"], "tvrdnja": "Preko kanjona Tare izgrađen je most na Đurđevića Tari.", "tacno": true, "pomoc": ["Pogledaj fotografiju uz zanimljivost o kanjonu.", "Lučni most se pruža visoko iznad reke.", "Iz lekcije: preko kanjona Tare je most na Đurđevića Tari."], "objasnjenje": "Tačno — most na Đurđevića Tari premošćuje kanjon reke Tare.", "iz_udzbenika": {"strana": 22, "odeljak": "Zanimljivost — kanjon Tare", "tekst": "Preko kanjona Tare izgrađen je visoki lučni most na Đurđevića Tari.", "slika": "05-crna-gora/06-most-djurdjevica-tara.jpg"}, "lekcija": 5}, {"id": "l05-vode-klik-skadarsko", "vrsta": "karta_klik", "tezina": "lako", "pojmovi": ["skadarsko-jezero"], "pitanje": "Klikni na kartu — Skadarsko jezero.", "cilj": {"mesto": "skadarsko-jezero"}, "pomoc": ["Jezero je na jugu Crne Gore.", "Leži na granici sa Albanijom, južno od Podgorice.", "Iz lekcije: Skadarsko jezero je na jugu, uz granicu sa Albanijom."], "objasnjenje": "Skadarsko jezero je na jugu Crne Gore, južno od Podgorice, na granici sa Albanijom.", "iz_udzbenika": {"strana": 22, "odeljak": "Fizičko-geografske odlike — vode", "tekst": "Skadarsko jezero, najveće na Balkanu, nalazi se na jugu, a deli ga Crna Gora sa Albanijom.", "slika": "05-crna-gora/04-skadarsko-jezero.jpg"}, "lekcija": 5}, {"id": "l05-vode-klik-kanjon-tare", "vrsta": "karta_klik", "tezina": "srednje", "pojmovi": ["kanjon-tare", "tara"], "pitanje": "Klikni na kartu — kanjon Tare.", "cilj": {"mesto": "kanjon-tare"}, "pomoc": ["Kanjon je na severu Crne Gore.", "Nalazi se odmah istočno od Durmitora.", "Iz lekcije: kanjon Tare je na severu, ispod Durmitora."], "objasnjenje": "Kanjon Tare je na severu Crne Gore, istočno od Durmitora.", "iz_udzbenika": {"strana": 22, "odeljak": "Zanimljivost — kanjon Tare", "tekst": "Kanjon Tare je na severu Crne Gore, a preko njega je most na Đurđevića Tari.", "slika": "05-crna-gora/06-most-djurdjevica-tara.jpg"}, "lekcija": 5}, {"id": "l05-vode-klik-crno-jezero", "vrsta": "karta_klik", "tezina": "tesko", "pojmovi": ["crno-jezero", "durmitor"], "pitanje": "Klikni na kartu — Crno jezero.", "cilj": {"mesto": "crno-jezero"}, "pomoc": ["Crno jezero je na severu Crne Gore, na jednoj planini.", "Nalazi se podno Durmitora, kod Žabljaka.", "Iz lekcije: Crno jezero je najlepše od 16 ledničkih jezera Durmitora."], "objasnjenje": "Crno jezero je na Durmitoru, kod Žabljaka, na severu Crne Gore.", "iz_udzbenika": {"strana": 22, "odeljak": "Zanimljivost — Durmitor", "tekst": "Crno jezero se nalazi na Durmitoru i najlepše je od njegovih 16 ledničkih jezera.", "slika": "05-crna-gora/05-crno-jezero-durmitor.jpg"}, "lekcija": 5}, {"id": "l05-vode-klik-ada-bojana", "vrsta": "karta_klik", "tezina": "tesko", "pojmovi": ["ada-bojana", "bojana"], "pitanje": "Klikni na kartu — Ada Bojana.", "cilj": {"mesto": "ada-bojana"}, "pomoc": ["Ada Bojana je na krajnjem jugu Crne Gore.", "Nalazi se na ušću Bojane u more, na granici sa Albanijom.", "Iz lekcije: Ada Bojana je rečno ostrvo na ušću Bojane."], "objasnjenje": "Ada Bojana je na krajnjem jugu, na ušću Bojane u Jadransko more, uz granicu sa Albanijom.", "iz_udzbenika": {"strana": 23, "odeljak": "Slika — Ada Bojana", "tekst": "Ada Bojana je trouglasto rečno ostrvo između dva rukavca Bojane, na njenom ušću u Jadransko more.", "slika": "05-crna-gora/07-ada-bojana.jpg"}, "lekcija": 5}, {"id": "l05-vode-gde-sam-skadarsko", "vrsta": "gde_sam", "tezina": "lako", "pojmovi": ["skadarsko-jezero", "bojana", "nacionalni-park"], "pitanje": "Gde sam? Pročitaj trag i klikni mesto na karti.", "cilj": {"mesto": "skadarsko-jezero"}, "tragovi": ["Moji vijugavi rukavci provlače se kroz zelene, delimično poplavljene livade.", "Iz mene ističe reka Bojana.", "Delim se između Crne Gore i Albanije.", "Ja sam najveće jezero Balkanskog poluostrva."], "objasnjenje": "Skadarsko jezero — najveće na Balkanu, nacionalni park na granici sa Albanijom; iz njega ističe Bojana.", "iz_udzbenika": {"strana": 22, "odeljak": "Slika — Skadarsko jezero", "tekst": "Fotografija prikazuje vijugave rukavce jezera među livadama i brdima; Skadarsko jezero je najveće na Balkanu i iz njega ističe Bojana.", "slika": "05-crna-gora/04-skadarsko-jezero.jpg"}, "lekcija": 5}, {"id": "l05-vode-gde-sam-kanjon", "vrsta": "gde_sam", "tezina": "srednje", "pojmovi": ["kanjon-tare", "most-na-djurdjevica-tari"], "pitanje": "Gde sam? Pročitaj trag i klikni mesto na karti.", "cilj": {"mesto": "kanjon-tare"}, "tragovi": ["Visoko iznad mene pruža se lučni betonski most.", "Dug sam 60 km.", "Na jednom mestu sam dubok čak 1.333 m.", "Ja sam najdublji kanjon u Evropi."], "objasnjenje": "Kanjon Tare — najdublji u Evropi (60 km, do 1.333 m), preko njega je most na Đurđevića Tari.", "iz_udzbenika": {"strana": 22, "odeljak": "Zanimljivost — kanjon Tare", "tekst": "Kanjon Tare je najdublji u Evropi, dug 60 km; preko njega je izgrađen most na Đurđevića Tari.", "slika": "05-crna-gora/06-most-djurdjevica-tara.jpg"}, "lekcija": 5}, {"id": "l05-vode-gde-sam-ada", "vrsta": "gde_sam", "tezina": "tesko", "pojmovi": ["ada-bojana", "ada", "bojana"], "pitanje": "Gde sam? Pročitaj trag i klikni mesto na karti.", "cilj": {"mesto": "ada-bojana"}, "tragovi": ["Trouglastog sam oblika i obrasla sam šumom.", "Sa dve strane me obilaze rukavci reke, a sa treće more.", "Nalazim se na krajnjem jugu Crne Gore, uz granicu sa Albanijom.", "Ja sam rečno ostrvo na ušću Bojane."], "objasnjenje": "Ada Bojana — trouglasto rečno ostrvo (ada) na ušću Bojane, na krajnjem jugu Crne Gore.", "iz_udzbenika": {"strana": 23, "odeljak": "Slika — Ada Bojana", "tekst": "Ada Bojana je šumovito trouglasto ostrvo između dva rukavca Bojane, na samom ušću u Jadransko more.", "slika": "05-crna-gora/07-ada-bojana.jpg"}, "lekcija": 5}]}, {"naslov": "Stanovništvo i privreda", "zadaci": [{"id": "l05-drustvo-izbor-narodi", "vrsta": "izbor", "tezina": "lako", "pojmovi": ["crnogorci", "bosnjaci", "albanci"], "pitanje": "Koji narodi pretežno žive u Crnoj Gori? (Više tačnih.)", "odgovori": [{"tekst": "Crnogorci", "tacan": true}, {"tekst": "Srbi", "tacan": true}, {"tekst": "Bošnjaci", "tacan": true}, {"tekst": "Albanci", "tacan": true}, {"tekst": "Mađari", "tacan": false}, {"tekst": "Grci", "tacan": false}], "pomoc": ["Tačna su četiri naroda — jedan nosi ime države, a ostali su narodi iz susednih zemalja.", "Mađari i Grci ne žive u većem broju u Crnoj Gori.", "Iz lekcije: pretežno žive Crnogorci, Srbi, Bošnjaci i Albanci."], "objasnjenje": "U Crnoj Gori pretežno žive Crnogorci, Srbi, Bošnjaci i Albanci — stanovništvo je etnički heterogeno.", "iz_udzbenika": {"strana": 23, "odeljak": "Društveno-geografske odlike", "tekst": "Stanovništvo Crne Gore je etnički raznoliko; pretežno ga čine Crnogorci, Srbi, Bošnjaci i Albanci."}, "lekcija": 5}, {"id": "l05-drustvo-dopuni-heterogeno", "vrsta": "dopuni", "tezina": "srednje", "pojmovi": ["crnogorci", "bosnjaci", "albanci"], "pitanje": "Dopuni rečenicu rečima iz banke.", "tekst": "Stanovništvo Crne Gore je etnički {{heterogeno}}, odnosno {{raznoliko}} — čine ga pretežno Crnogorci, Srbi, Bošnjaci i Albanci.", "ponudjene": ["heterogeno", "homogeno", "raznoliko", "jednolično"], "pomoc": ["U Crnoj Gori živi više naroda — to nije jednolično stanovništvo.", "Strana reč za „raznoliko” počinje sa „hetero-”.", "Iz lekcije: stanovništvo je etnički heterogeno (raznoliko)."], "objasnjenje": "Heterogeno znači raznoliko — u Crnoj Gori pretežno žive četiri naroda.", "iz_udzbenika": {"strana": 23, "odeljak": "Društveno-geografske odlike", "tekst": "Stanovništvo je etnički heterogeno, to jest raznoliko — Crnogorci, Srbi, Bošnjaci i Albanci."}, "lekcija": 5}, {"id": "l05-drustvo-tn-juzni-sloveni", "vrsta": "tacno_netacno", "tezina": "lako", "pojmovi": ["crnogorci"], "tvrdnja": "Srbi i Crnogorci pripadaju Južnim Slovenima.", "tacno": true, "pomoc": ["Južni Sloveni su narodi Balkana koji govore slovenskim jezicima.", "Srpski i crnogorski su bliski slovenski jezici.", "Iz lekcije (zadatak 1): tvrdnja da Srbi i Crnogorci pripadaju Južnim Slovenima je tačna."], "objasnjenje": "Tačno — i Srbi i Crnogorci su južnoslovenski narodi.", "iz_udzbenika": {"strana": 23, "odeljak": "Zadatak 1 — tačno ili netačno", "tekst": "U zadatku na kraju lekcije tvrdnja da Srbi i Crnogorci pripadaju Južnim Slovenima označava se kao tačna."}, "lekcija": 5}, {"id": "l05-drustvo-tn-ravnomerno", "vrsta": "tacno_netacno", "tezina": "lako", "pojmovi": ["crna-gora", "zeta", "moraca"], "tvrdnja": "Stanovništvo Crne Gore je ravnomerno raspoređeno po celoj zemlji.", "tacno": false, "ispravke": [{"tekst": "Raspored je neravnomeran — najviše ljudi živi u dolinama Zete i Morače i na primorju.", "tacan": true}, {"tekst": "Raspored je neravnomeran — najviše ljudi živi visoko u planinama na severu.", "tacan": false}, {"tekst": "Raspored je neravnomeran — najviše ljudi živi oko kanjona Tare.", "tacan": false}], "pomoc": ["Razmisli gde je lakše živeti — u ravnici ili na strmoj planini?", "Ljudi se najviše skupljaju u dolinama dve reke i uz more.", "Iz lekcije: gustina nije ravnomerna — najviše ljudi živi u dolinama Zete i Morače i na primorju."], "objasnjenje": "Netačno — najviše ljudi živi u dolinama Zete i Morače i na primorju, a planinski krajevi su retko naseljeni.", "iz_udzbenika": {"strana": 23, "odeljak": "Društveno-geografske odlike", "tekst": "Gustina naseljenosti nije ravnomerna — najviše stanovnika je u dolinama Zete i Morače i na primorju."}, "lekcija": 5}, {"id": "l05-drustvo-zakljuci-gde-zive", "vrsta": "zakljuci", "tezina": "srednje", "pojmovi": ["zeta", "moraca", "zetska-nizija"], "pitanje": "Zašto ljudi u Crnoj Gori najviše žive u dolinama Zete i Morače i na primorju?", "odgovori": [{"tekst": "Tu je ravno zemljište za poljoprivredu, blaža klima i lakši saobraćaj.", "tacan": true}, {"tekst": "Tu su najviše planine, pa je vazduh najčistiji.", "tacan": false}, {"tekst": "Tu je razvijena teška industrija koja zapošljava većinu ljudi.", "tacan": false}, {"tekst": "Tu je najhladnije, pa je lakše čuvati hranu.", "tacan": false}], "pomoc": ["Korak 1: Kakav je reljef u dolinama i na primorju, a kakav u ostatku zemlje?", "Korak 2: Gde je lakše obrađivati zemlju i graditi puteve?", "Iz lekcije: najviše ljudi živi u dolinama Zete i Morače i na primorju; industrija je slabo razvijena."], "objasnjenje": "U dolinama i na primorju je ravnije zemljište, blaža klima i lakši saobraćaj; planine su strme i teško prohodne, a industrija je slabo razvijena.", "iz_udzbenika": {"strana": 23, "odeljak": "Društveno-geografske odlike", "tekst": "Stanovništvo je najgušće u dolinama Zete i Morače i na primorju, a planinski krajevi su retko naseljeni.", "slika": "05-crna-gora/03-zetska-nizija.jpg"}, "lekcija": 5}, {"id": "l05-privreda-izbor-razvijenost", "vrsta": "izbor", "tezina": "lako", "pojmovi": ["crna-gora"], "pitanje": "Kako je, prema udžbeniku, razvijena privreda Crne Gore?", "odgovori": [{"tekst": "slabo", "tacan": true}, {"tekst": "najbolje u Evropi", "tacan": false}, {"tekst": "jako, zahvaljujući teškoj industriji", "tacan": false}, {"tekst": "jako, zahvaljujući rudnicima nafte", "tacan": false}], "pomoc": ["Industrija u Crnoj Gori je slabo razvijena.", "Crna Gora je mala i planinska zemlja.", "Iz lekcije: Crna Gora je slabo razvijena u privrednom pogledu."], "objasnjenje": "Privreda Crne Gore je slabo razvijena; ipak, turizam je dosta razvijen.", "iz_udzbenika": {"strana": 23, "odeljak": "Privreda", "tekst": "U privrednom pogledu Crna Gora je slabo razvijena; industrija je slaba, a turizam dosta razvijen."}, "lekcija": 5}, {"id": "l05-privreda-tn-industrija", "vrsta": "tacno_netacno", "tezina": "lako", "pojmovi": ["turizam"], "tvrdnja": "U Crnoj Gori najrazvijenija privredna delatnost je industrija.", "tacno": false, "ispravke": [{"tekst": "Industrija je slabo razvijena, a dosta je razvijen turizam.", "tacan": true}, {"tekst": "Najrazvijenije je rudarstvo nafte.", "tacan": false}, {"tekst": "Najrazvijenija je brodogradnja.", "tacan": false}], "pomoc": ["Šta privlači ljude u Crnu Goru — fabrike ili more i planine?", "Udžbenik kaže da je industrija slabo razvijena.", "Iz lekcije: industrija je slabo razvijena, a turizam je dosta razvijen."], "objasnjenje": "Netačno — industrija je slabo razvijena; dosta je razvijen turizam.", "iz_udzbenika": {"strana": 23, "odeljak": "Zadatak 1 — tačno ili netačno", "tekst": "U zadatku na kraju lekcije tvrdnja da je industrija najrazvijenija delatnost Crne Gore je netačna — razvijen je turizam."}, "lekcija": 5}, {"id": "l05-privreda-tn-turizam", "vrsta": "tacno_netacno", "tezina": "lako", "pojmovi": ["turizam", "nacionalni-park"], "tvrdnja": "Turizam je u Crnoj Gori dosta razvijen.", "tacno": true, "pomoc": ["Setite se Boke Kotorske, Budve i Svetog Stefana.", "Crna Gora ima i more i planine sa nacionalnim parkovima.", "Iz lekcije: turizam je dosta razvijen."], "objasnjenje": "Tačno — turizam je dosta razvijen zahvaljujući moru, nacionalnim parkovima i kulturno-istorijskom nasleđu.", "iz_udzbenika": {"strana": 23, "odeljak": "Privreda", "tekst": "Turizam je dosta razvijen zahvaljujući prirodnim i antropogenim vrednostima Crne Gore."}, "lekcija": 5}, {"id": "l05-privreda-izbor-turizam", "vrsta": "izbor", "tezina": "lako", "pojmovi": ["turizam", "bokokotorski-zaliv", "nacionalni-park"], "pitanje": "Zahvaljujući čemu je turizam u Crnoj Gori dosta razvijen? (Više tačnih.)", "odgovori": [{"tekst": "primorju sa Bokom Kotorskom", "tacan": true}, {"tekst": "nacionalnim parkovima", "tacan": true}, {"tekst": "kulturno-istorijskom nasleđu", "tacan": true}, {"tekst": "razvijenoj teškoj industriji", "tacan": false}, {"tekst": "velikim pustinjama", "tacan": false}], "pomoc": ["Turizam se oslanja na prirodne i antropogene (ljudske) vrednosti.", "Industrija je slabo razvijena, a pustinja u Crnoj Gori nema.", "Iz lekcije: turizam se razvija zahvaljujući primorju sa Bokom Kotorskom, nacionalnim parkovima i kulturno-istorijskom nasleđu."], "objasnjenje": "Turiste privlače primorje sa Bokom Kotorskom, nacionalni parkovi i kulturno-istorijsko nasleđe.", "iz_udzbenika": {"strana": 23, "odeljak": "Privreda", "tekst": "Turizam je razvijen zahvaljujući primorju sa Bokom Kotorskom, nacionalnim parkovima i kulturno-istorijskom nasleđu.", "slika": "05-crna-gora/02-kotorski-zaliv.jpg"}, "lekcija": 5}, {"id": "l05-privreda-zakljuci-turizam", "vrsta": "zakljuci", "tezina": "srednje", "pojmovi": ["turizam", "nacionalni-park"], "pitanje": "Crna Gora je mala i privredno slabo razvijena, a ipak ima razvijen turizam. Šta to najbolje objašnjava?", "odgovori": [{"tekst": "Na malom prostoru ima i more, i visoke planine sa nacionalnim parkovima, i staro kulturno nasleđe.", "tacan": true}, {"tekst": "Ima najdužu i najrazuđeniju obalu na Jadranu.", "tacan": false}, {"tekst": "Ima razvijenu industriju, pa dolazi mnogo poslovnih ljudi.", "tacan": false}, {"tekst": "Najveća je država Balkanskog poluostrva.", "tacan": false}], "pomoc": ["Korak 1: Obala je kratka i slabo razuđena, a industrija slaba — to nisu razlozi.", "Korak 2: Šta sve turista može da vidi u Crnoj Gori za samo nekoliko sati vožnje?", "Iz lekcije: turizam se razvija zahvaljujući primorju, nacionalnim parkovima i kulturno-istorijskom nasleđu."], "objasnjenje": "Na malom prostoru Crna Gora nudi more i plaže (Boka, Budva), planine i nacionalne parkove (Durmitor, Lovćen, Skadarsko jezero) i staro kulturno nasleđe (Kotor).", "iz_udzbenika": {"strana": 23, "odeljak": "Privreda", "tekst": "Iako je privreda slabo razvijena, turizam je razvijen zahvaljujući moru, nacionalnim parkovima i kulturno-istorijskom nasleđu."}, "lekcija": 5}, {"id": "l05-privreda-izbor-primorje", "vrsta": "izbor", "tezina": "srednje", "pojmovi": ["duvan", "masline", "vinova-loza", "agrumi"], "pitanje": "Šta se gaji na crnogorskom primorju? (Više tačnih.)", "odgovori": [{"tekst": "duvan", "tacan": true}, {"tekst": "masline", "tacan": true}, {"tekst": "vinova loza", "tacan": true}, {"tekst": "agrumi", "tacan": true}, {"tekst": "pirinač", "tacan": false}, {"tekst": "šećerna repa", "tacan": false}], "pomoc": ["Na primorju je blaga, sredozemna klima.", "Tačne su četiri biljke — među njima i limun i pomorandža (agrumi).", "Iz lekcije: na primorju se gaje duvan function helpHTML(z, s, fresh) {

if (INFO.zasticeno) { const l = document.getElementById('mProt'); l.href = INFO.zasticeno; l.hidden = false; }   // public copy → the one with images

// ---------- outcome ----------
function fail(z, text, given) {
  const s = st(z.id);
  s.miss++;
  record(z, s, false, given);
  const ended = s.miss > steps(z);
  if (ended) { s.status = 'revealed'; s.pts = 0; learnFrom(z, 0); place(z, false); toast('Evo odgovora', false); }
  else toast(text || 'Netačno — pokušaj ponovo', false);
  finishCheck(); save(); renderItem(true); renderNav(); refreshScore();
  if (ended || !mobile()) openDrawer();
}
function succeed(z, given, pts) {   // pts: set only by self-graded `objasni`
  const s = st(z.id), first = s.first == null;
  s.status = 'ok'; s.pts = pts != null ? pts : ptsFor(s.miss);
  record(z, s, true, given);
  learnFrom(z, s.pts);
  s.placed = place(z, true);
  toast((first ? 'Tačno!' : 'Tačno, ali u rezultat ide prvi odgovor') + (s.placed ? ' · na vremenskoj osi' : ''), true);
  finishCheck(); save(); renderItem(false); renderNav(); refreshScore();
  openDrawer();
}

// ---------- item renderers ----------
const main = document.getElementById('main');
function frame(z, s, inner) {
  const n = numOf(z);
  const pts = s.first === true ? '✓ tačno' : s.first === false ? '✗ netačno u prvom pokušaju' : '';
  return '<div class="item"><div class="ihead"><span class="vchip">' + VRSTA_LBL[z.vrsta] + '</span>' + tzBadge(z) + ' ' + TEZ_LBL[z.tezina] + '<span>' + esc(deoNaslov(z)) + ' · zadatak ' + n + ' / ' + curItems().length + '</span><span>' + pts + '</span></div>' +
    inner + '<div class="help-inline" id="helpInline"></div><div class="iactions" id="actions"></div>' +
    (isDone(s) ? '<div class="expl' + (s.status === 'ok' ? '' : ' rev') + '">' + fmt(z.objasnjenje || '') + '</div>' : '') + questionFig(z, s) + '</div>';
}
function questionFig(z, s) {   // `slika_u_pitanju`: the question asks to look at the picture, so it stands under the answers (caption only once answered)
  const b = z.iz_udzbenika; if (!z.slika_u_pitanju || !b || !b.slika) return '';
  const cap = isDone(s) ? INFO.slikeNaslovi[b.slika] || '' : '';
  return '<figure class="qfig"><img src="' + esc(INFO.slikeData[b.slika] || INFO.slike + b.slika) + '" alt="Slika uz pitanje" onclick="this.parentNode.classList.toggle(\'zoom\')" onerror="' +
    (INFO.zasticeno ? 'this.parentNode.outerHTML=\'<p class=&quot;ref&quot;>Slika uz ovo pitanje je u <a href=&quot;' + esc(INFO.zasticeno) + '&quot;>verziji sa slikama iz udžbenika (lozinka)</a>.</p>\'' : 'this.parentNode.remove()') +
    '">' + (cap ? '<figcaption>' + esc(cap) + '</figcaption>' : '') + '</figure>';
}
function actions(btns) {
  const a = document.getElementById('actions');
  a.innerHTML = btns.map(b => '<button type="button" id="' + b[0] + '"' + (b[2] ? ' class="' + b[2] + '"' : '') + '>' + b[1] + '</button>').join('');
}
function nextButton(z) {   // done: Sledeći + reopen the drawer; in progress with help used: reopen the help
  const s = st(z.id), a = document.getElementById('actions');
  if (!isDone(s)) {
    if (s.miss && !CLUES[z.vrsta] && !mobile()) {

    }

  }

  document.getElementById('btnNext').addEventListener('click', goNext);
  const m = document.getElementById('btnMore'); if (m) m.addEventListener('click', openDrawer);
}

function prelude(z, s) {   // what stands above the options: a source, a cause→effect chain, the clues so far
  const done = isDone(s), right = z.odgovori && z.odgovori.find(o => o.tacan);
  if (z.vrsta === 'izvor') { const iz = z.izvor;
    return '<div class="src">' + (iz.autor || iz.naslov ? '<p class="who">' + esc([iz.autor, iz.naslov].filter(Boolean).join(' — ')) + '</p>' : '') +
      '<blockquote>' + fmt(iz.tekst) + '</blockquote>' + (iz.napomena ? '<p class="nt">' + fmt(iz.napomena) + '</p>' : '') + '</div>'; }
  if (z.vrsta === 'lanac') return '<div class="chain">' + z.karike.map((k, i) => (i ? '<span class="ar">→</span>' : '') +
    (i === z.praznina ? '<div class="lk q' + (done ? ' ok' : '') + '">' + (done ? fmt(right.tekst) : '?') + '</div>' : '<div class="lk">' + fmt(k) + '</div>')).join('') + '</div>';
  if (z.vrsta === 'ko_sam') { const n = Math.min(z.tragovi.length, done ? z.tragovi.length : s.miss + 1);
    return '<ul class="clues">' + z.tragovi.slice(0, n).map((t, i) => '<li><span class="k">Trag ' + (i + 1) + '</span>' + fmt(t) + '</li>').join('') + '</ul>'; }
  return '';
}
function renderChoice(z, s) {   // izbor, zakljuci, lanac, izvor, ko_sam (+ the correction step of tacno_netacno)
  const opts = shuffled(z.odgovori, z.id);
  const multi = z.odgovori.filter(o => o.tacan).length > 1;
  const ui = s.ui; ui.wrong = ui.wrong || []; ui.pick = ui.pick || [];
  const done = isDone(s), showRight = s.status === 'ok' || s.status === 'revealed';
  const why = o => o.zasto ? '<span class="why">' + fmt(o.zasto) + '</span>' : '';
  main.innerHTML = frame(z, s, prelude(z, s) + '<h2 class="q">' + fmt(z.pitanje || (z.vrsta === 'ko_sam' ? 'Ko sam ja?' : 'Koja karika nedostaje?')) + '</h2><div class="opts">' + opts.map(([o, i]) =>
    '<button type="button" class="opt' + (multi ? '' : ' round') + (ui.wrong.includes(i) ? ' wrong' : '') + (showRight && o.tacan ? ' right' : '') +
    (!done && ui.pick.includes(i) ? ' picked' : '') + '" data-i="' + i + '"' + (done || ui.wrong.includes(i) ? ' disabled' : '') + '><span class="box"></span><span><span class="ot">' + fmt(o.tekst) + '</span>' +
    (ui.wrong.includes(i) ? why(o) : '') + '</span></button>').join('') + '</div>');
  if (!done && multi) actions([['btnCheck', 'Proveri', 'ok']]);
  if (!done && z.vrsta === 'ko_sam' && s.miss < steps(z)) { actions([['btnClue', 'Još jedan trag']]); document.getElementById('btnClue').addEventListener('click', () => { ui.why = null; fail(z, 'Novi trag', 'zatražen novi trag'); }); }
  main.querySelectorAll('.opt').forEach(b => b.addEventListener('click', () => {
    const i = +b.dataset.i;
    if (!multi) { if (z.odgovori[i].tacan) succeed(z, z.odgovori[i].tekst); else { ui.wrong.push(i); ui.why = z.odgovori[i].zasto || null; fail(z, undefined, z.odgovori[i].tekst); } return; }
    ui.pick = ui.pick.includes(i) ? ui.pick.filter(x => x !== i) : ui.pick.concat(i);
    b.classList.toggle('picked'); save();
  }));
  const chk = document.getElementById('btnCheck');
  if (chk) chk.addEventListener('click', () => {
    if (!ui.pick.length) { toast('Označi bar jedan odgovor', false); return; }
    const right = z.odgovori.map((o, i) => o.tacan ? i : -1).filter(i => i >= 0);
    const wrongPicked = ui.pick.filter(i => !z.odgovori[i].tacan);
    const given = ui.pick.map(i => z.odgovori[i].tekst).join('; ');
    if (!wrongPicked.length && right.every(i => ui.pick.includes(i))) { succeed(z, given); return; }
    ui.wrong = ui.wrong.concat(wrongPicked); ui.pick = ui.pick.filter(i => z.odgovori[i].tacan);
    ui.why = wrongPicked.map(i => z.odgovori[i].zasto).filter(Boolean).join(' ') || null;
    fail(z, wrongPicked.length ? 'Neki od označenih nisu tačni' : 'Nedostaje još tačnih odgovora', given);
  });
  nextButton(z);
}

function renderTN(z, s) {
  const ui = s.ui, done = isDone(s), showAns = s.status === 'ok' || s.status === 'revealed';
  let inner = '<h2 class="q">Tačno ili netačno?</h2><p class="stmt">' + fmt(z.tvrdnja) + '</p><div class="tn">' +
    [[true, 'Tačno'], [false, 'Netačno']].map(([v, t]) => '<button type="button" data-v="' + v + '" class="' +
      ((showAns || ui.phase === 'fix') && v === z.tacno ? 'right' : (ui.tnWrong === v ? 'wrong' : '')) + '"' + (done || ui.phase === 'fix' || ui.tnWrong === v ? ' disabled' : '') + '>' + t + '</button>').join('') + '</div>';
  if (!z.tacno && (ui.phase === 'fix' || showAns)) {
    ui.wrong = ui.wrong || [];
    inner += '<p class="sub-q">Kako glasi tačno?</p><div class="opts">' + shuffled(z.ispravke, z.id + 'fix').map(([o, i]) =>
      '<button type="button" class="opt round fix' + (ui.wrong.includes(i) ? ' wrong' : '') + (showAns && o.tacan ? ' right' : '') + '" data-i="' + i + '"' +
      (done || ui.wrong.includes(i) ? ' disabled' : '') + '><span class="box"></span><span><span class="ot">' + fmt(o.tekst) + '</span>' + (ui.wrong.includes(i) && o.zasto ? '<span class="why">' + fmt(o.zasto) + '</span>' : '') + '</span></button>').join('') + '</div>';
  }
  main.innerHTML = frame(z, s, inner);
  main.querySelectorAll('.tn button').forEach(b => b.addEventListener('click', () => {
    const v = b.dataset.v === 'true';
    if (v !== z.tacno) {   // a binary guess: a wrong one on a true statement leaves nothing to find → revealed;
      ui.tnWrong = v;       // on a false one the pupil still has to find the correction
      if (z.tacno) st(z.id).miss = steps(z); else ui.phase = 'fix';
      fail(z, undefined, v ? 'Tačno' : 'Netačno'); return;
    }
    if (z.tacno) { succeed(z, 'Tačno'); return; }
    st(z.id).log.push({ v: 'Netačno', ok: true });
    ui.phase = 'fix'; save(); renderItem(false); toast('Tačno — sad je ispravi', true);
  }));
  main.querySelectorAll('.opt.fix').forEach(b => b.addEventListener('click', () => {
    const i = +b.dataset.i;
    if (z.ispravke[i].tacan) succeed(z, 'ispravka: ' + z.ispravke[i].tekst); else { ui.wrong.push(i); ui.why = z.ispravke[i].zasto || null; fail(z, undefined, 'ispravka: ' + z.ispravke[i].tekst); }
  }));
  nextButton(z);
}

function parseCloze(t) {   // → [text, {answers}, text, …]
  const parts = []; let last = 0;
  t.replace(/\{\{(.+?)\}\}/g, (m, inner, at) => { parts.push(t.slice(last, at)); parts.push({ answers: inner.split('|') }); last = at + m.length; return m; });
  parts.push(t.slice(last));
  return parts;
}
function renderCloze(z, s) {
  const ui = s.ui; ui.val = ui.val || {}; ui.lock = ui.lock || {};
  const parts = parseCloze(z.tekst), blanks = parts.filter(p => typeof p === 'object');
  const done = isDone(s), bank = z.ponudjene && z.ponudjene.length;
  if (ui.cur == null || ui.lock[ui.cur]) ui.cur = blanks.findIndex((_, i) => !ui.lock[i]);
  let bi = -1;
  const html = parts.map(p => {
    if (typeof p === 'string') return fmt(p);
    bi++;
    const val = done && !ui.lock[bi] ? p.answers[0] : (ui.val[bi] || '');

const P = MAPI.proj;

    const nw = Math.min(P.w, Math.max(P.w / 14, vb[2] / f)), nh = nw * P.h / P.w;
    cx = cx == null ? vb[0] + vb[2] / 2 : cx; cy = cy == null ? vb[1] + vb[3] / 2 : cy;
    const rx = (cx - vb[0]) / vb[2], ry = (cy - vb[1]) / vb[3];

  wrap.querySelectorAll('.zbar button').forEach(b => b.addEventListener('click', () => zoom(+b.dataset.z)));
  svg.addEventListener('wheel', e => { e.preventDefault(); const p = svgPt(e); zoom(e.deltaY < 0 ? 1.25 : 0.8, p.x, p.y); }, { passive: false });
  let down = null;
  svg.addEventListener('pointerdown', e => { down = { x: e.clientX, y: e.clientY, vb: vb.slice(), moved: false, target: e.target }; svg.setPointerCapture(e.pointerId); });
  svg.addEventListener('pointermove', e => {

    mark(x, y, color, label) { const r = vb[2] / 150; marks.insertAdjacentHTML('beforeend', '<g class="mk"><circle cx="' + x + '" cy="' + y + '" r="' + r + '" fill="' + color + '"/>' + (label ? '<text x="' + (x + r * 1.4) + '" y="' + (y + r * .5) + '" fill="' + color + '" style="font-size:' + (vb[2] / 70) + 'px">' + esc(label) + '</text>' : '') + '</g>'); },

    else { const [x, y] = toXY(MAPI.mesta[tgt.mesto].lon, MAPI.mesta[tgt.mesto].lat); m.mark(x, y, s.status === 'ok' ? '#1f7a3a' : '#c98a2c', MAPI.mesta[tgt.mesto].naziv); }
  }
  if (gs && !done) { actions([['btnClue', 'Još jedan trag']]); document.getElementById('btnClue').addEventListener('click', () => fail(z, 'Novi trag', 'zatražen novi trag')); }
  nextButton(z);
}

// ---------- main view ----------
function renderItem(fresh) {
  const z = byId(state.cur);
  if (!z) {
    if (lekRoute()) renderLesson(lekRoute());
    else if (state.cur === '_osa' && SPEC.osa) renderOsa();
    else if (state.cur === '_znanje') renderZnanje();
    else if (String(state.cur).startsWith('r:')) renderReview(state.inst.find(t => 'r:' + t.id === state.cur));
    else renderSummary();
    closeDrawer(); return;
  }
  const s = st(z.id);
  ({ izbor: renderChoice, zakljuci: renderChoice, lanac: renderChoice, izvor: renderChoice, ko_sam: renderChoice, tacno_netacno: renderTN, dopuni: renderCloze,
     povezi: renderMatch, karta_klik: renderMapItem, gde_sam: renderMapItem, datum: renderDate, poredjaj: renderOrder, uporedi: renderCompare, objasni: renderExplain })[z.vrsta](z, s);
  renderDrawer(fresh);
}
function renderSummary() {
  const ids = listIds(), a = att();
  let rows = '';
  sections().forEach(d => {
    const zs = d.ids.filter(id => ids.includes(id)); if (!zs.length) return;
    rows += '<tr><td>' + esc(d.naslov) + '</td><td class="num">' + zs.filter(id => st(id).first != null).length + ' / ' + zs.length + '</td><td class="num">' + zs.filter(id => st(id).first === true).length + '</td></tr>';
  });
  const left = ids.filter(id => st(id).first == null).length, fin = state.inst.filter(t => t.end);
  main.innerHTML = '<div class="sum"><h1>Rezultat — kviz ' + a.n + '</h1><p class="sub">' + fmtDate(a.start) + '</p>' +
    '<p><span class="big">' + tacnih(a) + '</span> / ' + a.max + ' tačno' + (left ? ' · bez odgovora još ' + left : '') + '</p>' +
    '<table class="tbl"><thead><tr><th>Deo</th><th class="num">Odgovoreno</th><th class="num">Tačno</th></tr></thead><tbody>' + rows + '</tbody></table>' +
    (fin.length > 1 ? '<h2 style="margin-top:24px">Arhiva rezultata</h2><table class="tbl"><thead><tr><th>Kviz</th><th>Datum</th><th class="num">Tačno</th><th></th></tr></thead><tbody>' +
      fin.slice().reverse().map(t => '<tr><td>' + t.n + '</td><td>' + fmtDate(t.start) + '</td><td class="num">' + t.score + ' / ' + t.max + '</td><td><button type="button" data-r="' + t.id + '">Pregled</button></td></tr>').join('') + '</tbody></table>' : '') +
    '<div class="iactions">' + (a.end ? '<button type="button" class="ok" id="btnNew">Novi kviz</button><button type="button" id="btnReview">Pregled rada</button>' : '') +
    (fin.length ? '<button type="button" id="btnCsv">Preuzmi arhivu (CSV)</button>' : '') + '</div></div>';
  const on = (id, f) => { const e = document.getElementById(id); if (e) e.addEventListener('click', f); };
  on('btnReview', () => go('r:' + a.id));
  on('btnCsv', () => downloadCsv(fin));
  on('btnNew', () => { newInstance(); go(state.cur); });
  main.querySelectorAll('[data-r]').forEach(b => b.addEventListener('click', () => go('r:' + b.dataset.r)));
}
function renderLesson(r) {   // a whole lesson in the main column (protected copy), scrolled to a section
  const l = lekOf(r.broj);
  main.innerHTML = '<article class="les"><h1>' + esc(l.naslov) + '</h1><p class="meta">Iz udžbenika' + (l.od ? ', str. ' + l.od + '–' + l.do : '') +
    ' · strane knjige redom, ispod svake beleške za taj deo</p>' + l.html + '</article>';
  bindLesson(main);
  const el = r.id && document.getElementById(r.id);
  if (el) requestAnimationFrame(() => { el.scrollIntoView({ block: 'start' }); el.classList.add('hit'); });
}
function renderOsa() {   // every placed event, by lane; a range is a bar, one year a dot; labels stack in rows
  const O = SPEC.osa, y0 = O.od, y1 = O.do, span = y1 - y0, pct = y => Math.max(0, Math.min(100, (y - y0) / span * 100));
  const trake = O.trake && O.trake.length ? O.trake : [{ id: '_', label: '', color: '#3a6ba5' }];
  const placed = Object.values(state.osa || {}).map(e => Object.assign({}, e)), total = Object.keys(OSA_ALL).length;
  const step = span <= 60 ? 5 : span <= 150 ? 10 : span <= 300 ? 25 : 50;
  let ticks = ''; for (let y = Math.ceil(y0 / step) * step; y <= y1; y += step) ticks += '<span style="left:' + pct(y) + '%">' + y + '</span>';
  const lanes = trake.map(t => {
    const evs = placed.filter(e => (e.traka || trake[0].id) === t.id).sort((a, b) => a.od - b.od), rows = [];
    for (const e of evs) {
      const x = pct(e.od), w = e.do != null ? pct(e.do) - x : 0, lab = 1.5 + (String(e.naziv).length + yrs(e).length) * 0.62;
      e._lft = x + w + lab > 100;   // label would run past the axis end → draw it left of the bar
      const start = e._lft ? x - lab : x, end = e._lft ? x + w : x + w + lab;
      let r = rows.findIndex(last => last < start); if (r < 0) { r = rows.length; rows.push(-Infinity); }
      rows[r] = end; e._r = r; e._x = x; e._w = w;
    }
    const rowHtml = rows.map((_, r) => '<div class="row">' + evs.filter(e => e._r === r).map(e =>
      '<div class="ev' + (e.ok ? '' : ' rv') + (e._lft ? ' lft' : '') + (e.oznaka ? ' vague' : '') + '" title="' + esc(e.naziv + ' · ' + yrs(e)) + '" style="left:' + e._x + '%;' + (e._w ? 'width:' + e._w + '%;' : 'width:12px;margin-left:-6px;') + 'background:' + (t.color || '#3a6ba5') + '"><span>' + esc(e.naziv) + ' <small>' + yrs(e) + '</small></span></div>').join('') + '</div>').join('');
    return '<div class="lane"><div class="ll" style="color:' + (t.color || '#3a3528') + '">' + esc(t.label) + '</div>' + (rowHtml || '<div class="row"></div>') + '</div>';
  }).join('');
  main.innerHTML = '<div class="sum" style="max-width:1200px"><h1>Moja vremenska osa</h1><p class="lead">Svaki tačno rešen zadatak sa datumom stavlja svoj događaj na osu (bledo = otkriven odgovor). Na osi: <b>' + placed.length + '</b> od ' + total + ' događaja iz lekcije.</p>' +
    '<div class="osa-wrap"><div class="osa">' + lanes + '<div class="ticks">' + ticks + '</div></div></div>' +
    (placed.length ? '' : '<p class="placeholder">Osa je još prazna — reši zadatke „Kada?” i „Poređaj” u Učenju.</p>') + '</div>';
}
function renderZnanje() {   // mastery per concept: due now / not practised / learning / mastered
  const Z = state.znanje || {}, now = Date.now(), all = [...new Set(ITEMS.flatMap(z => z.pojmovi || []))];
  const name = p => INFO.pojmovi[p] || p.replace(/-/g, ' ');
  const g = { due: [], nov: [], uci: [], sav: [] };
  for (const p of all) { const k = Z[p]; (!k ? g.nov : k.due <= now ? g.due : k.box >= 4 ? g.sav : g.uci).push(p); }
  const box = k => '<span class="box5">' + [0, 1, 2, 3].map(i => '<i' + (k && k.box > i ? ' class="on"' : '') + '></i>').join('') + '</span>';
  const when = k => k.due <= now ? '<span class="zn-due">na redu</span>' : 'za ' + Math.max(1, Math.round((k.due - now) / DAY)) + ' d';
  const table = (title, ps, lead) => ps.length ? '<h2 style="margin-top:22px">' + title + ' <small style="color:var(--muted);font-weight:400">' + ps.length + '</small></h2>' + (lead ? '<p class="sub">' + lead + '</p>' : '') +
    '<table class="tbl"><tbody>' + ps.sort((a, b) => name(a).localeCompare(name(b), 'sr')).map(p => '<tr><td>' + esc(name(p)) + '</td><td>' + box(Z[p]) + '</td><td class="num">' + (Z[p] ? when(Z[p]) : '—') + '</td></tr>').join('') + '</tbody></table>' : '';
  main.innerHTML = '<div class="sum"><h1>Moje znanje</h1><p class="lead">Svaki pojam iz lekcije ima nivo (0–4 kvadratića). Tačno iz prve podiže nivo i pojam se vraća sve kasnije (posle 1, 3, 7, 14 dana); greška ga vraća na početak, pa ga vežbaš već u sledećoj sesiji — i to kroz drugu vrstu zadatka.</p>' +
    '<p><b>' + g.sav.length + '</b> savladano · <b>' + g.uci.length + '</b> u učenju · <b class="zn-due">' + g.due.length + '</b> na redu · ' + g.nov.length + ' još nisi vežbao</p>' +
    table('Na redu za ponavljanje', g.due, 'Nova sesija učenja počinje ovim pojmovima.') + table('U učenju', g.uci) + table('Savladano', g.sav) + table('Još nisi vežbao', g.nov) + '</div>';
}
function sastavText(n) {
  const o = (SPEC.sastav || {}).odnos || [40, 40, 20];
  return n + ' pitanja (' + o[0] + '% lakih, ' + o[1] + '% srednjih, ' + o[2] + '% teških) iz banke od ' + ITEMS.length + ' pitanja' + (BAZA ? ' i zadataka iz baze država' : '');
}
function questionText(z) {
  if (z.vrsta === 'tacno_netacno') return z.tvrdnja;
  if (z.vrsta === 'dopuni') return z.tekst.replace(/\{\{(.+?)\}\}/g, '____');
  if (CLUES[z.vrsta]) return (z.vrsta === 'gde_sam' ? 'Gde sam? ' : 'Ko sam? ') + z.tragovi.join(' · ');
  if (z.vrsta === 'datum') return 'Kada: ' + z.dogadjaj;
  if (z.vrsta === 'lanac') return z.karike.map((k, i) => i === z.praznina ? '?' : k).join(' → ');
  if (z.vrsta === 'izvor') return (z.izvor.autor ? z.izvor.autor + ': ' : '') + '„' + z.izvor.tekst + '” — ' + z.pitanje;
  if (z.vrsta === 'uporedi') return rowLabel(z) + ' — ' + z.tvrdnje.map(t => t.tekst).join(' / ');
  return z.pitanje || rowLabel(z);
}
function correctText(z) {
  if (['izbor', 'zakljuci', 'lanac', 'izvor', 'ko_sam'].includes(z.vrsta)) return z.odgovori.filter(o => o.tacan).map(o => o.tekst).join('; ');
  if (z.vrsta === 'datum') return yrs(z);
  if (z.vrsta === 'poredjaj') return z.stavke.map(s => s.tekst + (s.godina != null ? ' (' + (s.oznaka || fmtY(s.godina)) + ')' : '')).join(' → ');
  if (z.vrsta === 'uporedi') { const L = { a: z.a, b: z.b, oba: 'oba', nijedan: 'nijedan' }; return z.tvrdnje.map((t, i) => (i + 1) + ': ' + L[t.odgovor]).join('; '); }
  if (z.vrsta === 'objasni') return z.uzor;
  if (z.vrsta === 'tacno_netacno') return z.tacno ? 'Tačno' : 'Netačno — ' + z.ispravke.find(o => o.tacan).tekst;
  if (z.vrsta === 'dopuni') return z.tekst.replace(/\{\{(.+?)\}\}/g, (m, x) => x.split('|')[0]);
  if (z.vrsta === 'povezi') return z.parovi.map(p => p[0] + ' → ' + p[1]).join('; ');
  return z.cilj.drzava ? MAPI.drzave[z.cilj.drzava] : (MAPI.mesta[z.cilj.mesto] || {}).naziv || z.cilj.mesto;
}
const outcome = s => !s || s.first == null ? 'bez odgovora' : s.first ? 'tačno' : 'netačno';
function renderReview(t) {
  if (!t) { go('_sum'); return; }
  const rows = t.items.map((z, i) => {
    const s = t.b[z.id];
    const log = (s && s.log || []).map(l => '<li class="' + (l.ok ? 'ok' : 'bad') + '">' + (l.ok ? '✓ ' : '✗ ') + esc(l.v || '—') + '</li>').join('');
    return '<div class="rv"><div class="ihead"><span class="vchip">' + VRSTA_LBL[z.vrsta] + '</span>' + tzBadge(z) + '<span>' + (i + 1) + '. ' + (z.ponovo ? '↻ ' : '') + esc(deoNaslov(z)) + '</span><span>' + outcome(s) + '</span></div>' +
      '<p class="rq">' + fmt(questionText(z)) + '</p><p class="rl">Odgovori učenika:</p><ul class="rlog">' + (log || '<li>—</li>') + '</ul>' +
      '<p class="rc"><b>Tačan odgovor:</b> ' + fmt(correctText(z)) + '</p></div>';
  }).join('');
  main.innerHTML = '<div class="sum"><h1>Kviz ' + t.n + ' — pregled rada</h1><p class="sub">' + fmtDate(t.start) + ' · <b>' + t.score + ' / ' + t.max + '</b> tačno</p>' +
    '<div class="iactions"><button type="button" id="btnCsv">Preuzmi (CSV)</button><button type="button" id="btnBack">Nazad</button></div>' + rows + '</div>';
  document.getElementById('btnCsv').addEventListener('click', () => downloadCsv([t]));
  document.getElementById('btnBack').addEventListener('click', () => go('_sum'));
}
function downloadCsv(list) {   // one row per item of each instance: for the teacher (opens in Excel / Sheets)
  const q = v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
  const head = ['kviz', 'datum', 'br', 'deo', 'vrsta', 'tezina', 'pitanje', 'prvi_odgovor', 'svi_odgovori', 'tacan_odgovor'];
  const lines = [head.join(',')];
  for (const t of list) t.items.forEach((z, i) => {
    const s = t.b[z.id] || {};
    lines.push([t.n, fmtDate(t.start), i + 1, deoNaslov(z), VRSTA_LBL[z.vrsta], TEZ_LBL[z.tezina], questionText(z), outcome(s),
      (s.log || []).map(l => (l.ok ? '✓ ' : '✗ ') + l.v).join(' | '), correctText(z)].map(q).join(','));
  });
  const blob = new Blob(['\ufeff' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'kviz-' + (SPEC.slug || 'kviz') + '-' + (list.length === 1 ? list[0].n : 'arhiva') + '.csv';
  document.body.appendChild(a); a.click(); a.remove();
}
function go(id) { state.cur = id; save(); HubShell.setNav(false); if (!drawer.dataset.intro) closeDrawer(); refresh(); main.scrollTop = 0; }
function goNext() {
  const ids = listIds(), i = ids.indexOf(state.cur);
  const next = ids.slice(i + 1).concat(ids.slice(0, i)).find(id => !isDone(st(id)));
  go(next || '_sum');
}
function refresh() { renderNav(); refreshScore(); renderItem(false); }

// ---------- bar ----------
document.getElementById('mReset').addEventListener('click', () => {
  const a = att();
  if (a && !a.end) {
    if (!confirm('Odustati od ovog kviza? Neće biti zabeležen u arhivi.')) return;
    state.inst = state.inst.filter(t => t.id !== a.id);
  }
  newInstance(); closeDrawer(); refresh(); main.scrollTop = 0;
});

// ---------- init ----------
if (!att()) newInstance();
if (location.hash.startsWith('#r:') && state.inst.some(t => 'r:' + t.id === location.hash.slice(1))) state.cur = location.hash.slice(1);
if (!byId(state.cur) && !['_sum', '_znanje', '_osa'].includes(state.cur) && !String(state.cur).startsWith('r:') && !lekRoute()) state.cur = att().end ? '_sum' : curItems()[0].id;
refresh();
let introSeen = false; try { introSeen = localStorage.getItem(STATE_KEY + ':intro') === '1'; } catch (e) {}
if (!introSeen) showIntro();
</script>
