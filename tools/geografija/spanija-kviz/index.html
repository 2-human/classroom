<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kraljevina Španija — kviz</title>
<style>

 :root{--hub-bg:#faf8f2;--hub-card:#fff;--hub-ink:#2b2b2b;--hub-head:#3a3528;--hub-mute:#6b6456;--hub-line:#e6e0d2;--hub-soft:#f3ecd8;--hub-accent:#b1271f;--hub-ok:#1f7a3a;--hub-nav-w:280px;--hub-drawer-w:440px}
 html:has(.app-body){overflow:hidden}
 .app-body{margin:0;height:100vh;height:100dvh;overflow:hidden;display:flex;flex-direction:column;max-width:100vw;background:var(--hub-bg);color:var(--hub-ink);font-family:system-ui,Segoe UI,Roboto,Arial,sans-serif}
 .app-bar{flex:0 0 auto;display:flex;align-items:center;gap:14px;padding:8px 16px;background:var(--hub-card);border-bottom:1px solid var(--hub-line);min-width:0;position:relative;z-index:50}
 .app-bar .app-menu{display:none;padding:0;width:36px;height:34px;font-size:18px;line-height:1;border:1px solid var(--hub-line);background:var(--hub-card);color:var(--hub-head);border-radius:7px;cursor:pointer}
 .app-bar .app-menu:hover{background:var(--hub-soft);color:var(--hub-head)}
 .brand{font-weight:700;font-size:15px;color:var(--hub-head);text-decoration:none;white-space:nowrap}
 .brand:hover{color:var(--hub-accent)}
 .app-crumbs{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--hub-mute);min-width:0;overflow:hidden;white-space:nowrap}
 .app-crumbs a{color:var(--hub-mute);text-decoration:none}
 .app-crumbs a:hover{color:var(--hub-accent)}
 .app-crumbs .sep{color:#b9b2a0}
 .app-crumbs .cur{color:var(--hub-head);font-weight:600;overflow:hidden;text-overflow:ellipsis}
 .bar-right{margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end;min-width:0}
 .app-grid{flex:1 1 auto;display:grid;grid-template-columns:var(--hub-nav-w) minmax(0,1fr);min-height:0}
 .app-nav{background:var(--hub-card);border-right:1px solid var(--hub-line);overflow:auto;padding:10px 10px 40px;min-height:0}
 .app-filter{width:100%;font:inherit;font-size:13px;padding:7px 9px;border:1px solid var(--hub-line);border-radius:6px;margin:0 0 4px;background:#fff;color:var(--hub-ink)}
 .app-filter:focus{outline:none;border-color:var(--hub-mute)}
 .app-nav .sec{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--hub-mute);padding:12px 6px 4px}
 .app-nav .cnt{font-size:11px;color:var(--hub-mute);font-variant-numeric:tabular-nums;letter-spacing:0;text-transform:none}
 .f-hide{display:none!important}
 .app-main{position:relative;overflow:auto;min-width:0;min-height:0;transition:margin-right .18s ease}
 .app-drawer{position:fixed;top:var(--htop,50px);right:0;bottom:0;width:var(--hub-drawer-w);max-width:100vw;background:var(--hub-card);border-left:1px solid var(--hub-line);box-shadow:-8px 0 24px rgba(58,53,40,.10);transform:translateX(105%);transition:transform .18s ease;z-index:60;display:flex;flex-direction:column}
 .app-drawer.open{transform:none}
 .drawer-head{display:flex;align-items:flex-start;gap:10px;padding:14px 16px 10px;border-bottom:1px solid var(--hub-line)}
 .drawer-head h2{margin:0;font-size:16px;color:var(--hub-head);flex:1 1 auto;overflow-wrap:anywhere}
 .app-drawer .drawer-close{border:0;background:none;padding:0 4px;font-size:24px;line-height:1;cursor:pointer;color:var(--hub-mute)}
 .app-drawer .drawer-close:hover{background:none;color:var(--hub-accent)}
 .drawer-body{flex:1 1 auto;overflow:auto;padding:12px 16px 24px;font-size:13px;line-height:1.55}
 .drawer-foot{flex:0 0 auto;border-top:1px solid var(--hub-line);padding:10px 16px;font-size:12px;color:var(--hub-mute)}
 .mtabs{display:flex;gap:2px;border-bottom:1px solid var(--hub-line);flex-wrap:wrap;background:var(--hub-card);padding:0 12px}
 .mtabs a{text-decoration:none;color:var(--hub-mute);font-size:13px;padding:9px 12px 8px;border-bottom:2px solid transparent}
 .mtabs a[aria-current="page"]{color:var(--hub-head);border-bottom-color:var(--hub-accent);font-weight:600}
 .bar-menu-wrap{position:relative}
 .bar-menu{display:none;position:absolute;right:0;top:calc(100% + 8px);z-index:70;background:var(--hub-card);border:1px solid var(--hub-line);border-radius:10px;box-shadow:0 6px 20px rgba(0,0,0,.16);padding:8px;min-width:240px}
 .bar-menu.open{display:flex;flex-direction:column;align-items:stretch;gap:6px}
 .tbl{width:100%;border-collapse:collapse;background:var(--hub-card);border:1px solid var(--hub-line);border-radius:6px;font-size:13px}
 .tbl th{text-align:left;font-weight:600;font-size:11.5px;color:var(--hub-mute);padding:8px 10px;border-bottom:1px solid var(--hub-line);background:#fcfaf4;white-space:nowrap}
 .tbl td{padding:7px 10px;border-bottom:1px solid #f0ebe0;vertical-align:top}
 .tbl td.num,.tbl th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
 .tbl tr.clk{cursor:pointer} .tbl tr.clk:hover td{background:#fbf7ec}
 @media (min-width:1200px){ .app-body:has(.app-drawer.open) .app-main{margin-right:var(--hub-drawer-w)} }
 @media (max-width:760px){
   .app-bar{gap:10px;padding:8px 12px}
   .app-bar .app-menu{display:inline-block}
   .app-crumbs{display:none}
   .app-grid{grid-template-columns:minmax(0,1fr)}
   .app-nav{position:fixed;top:var(--htop,50px);left:0;bottom:0;width:300px;max-width:88vw;z-index:55;transform:translateX(-105%);transition:transform .18s ease;box-shadow:8px 0 24px rgba(58,53,40,.10)}
   .app-nav.open{transform:none}
   .app-drawer{width:100vw}
 }
 @media print{
   html:has(.app-body){overflow:visible}
   .app-body{height:auto;overflow:visible;display:block}
   .app-grid{display:block}
   .app-main,.app-nav{overflow:visible}
   .app-drawer,.app-filter,.app-menu,.bar-menu-wrap,.mtabs{display:none!important}
 }

 .les{max-width:860px;padding:22px 28px 80px;line-height:1.6;color:#2b2b2b}
 .les h1{font-size:25px;margin:0 0 4px;color:#3a3528}
 .les .meta{color:#6b6456;font-size:13.5px;margin:0 0 6px}
 .les .meta a{color:#b1271f;text-decoration:none}
 .les section{margin:22px 0;scroll-margin-top:12px}
 .les h2{font-size:18px;color:#3a3528;margin:0 0 8px;padding-bottom:5px;border-bottom:1px solid #e6e0d2}
 .les h3{font-size:15.5px;color:#3a3528;margin:0 0 6px}
 .les section.l3{margin-left:14px;padding-left:12px;border-left:3px solid #f3ecd8}
 .les .str{font-size:12px;font-weight:400;color:#6b6456;margin-left:6px;white-space:nowrap}
 .les ul,.les ol{padding-left:22px;margin:6px 0} .les li{margin:3px 0}
 .les p{margin:6px 0}
 .les a{color:#b1271f}
 .les .pojam{border-bottom:1px dotted #b9b2a0}
 .les blockquote{margin:8px 0;padding:6px 14px;border-left:3px solid #c98a2c;background:#fefcf7}
 .les .tbl{overflow-x:auto} .les table{border-collapse:collapse;font-size:14px;margin:8px 0}
 .les th,.les td{border:1px solid #e6e0d2;padding:4px 8px;text-align:left;vertical-align:top} .les th{background:#f3ecd8}
 .strana{margin:26px 0 14px;scroll-margin-top:12px;background:#fff;border:1px solid #e6e0d2;border-radius:10px;overflow:hidden}
 .strana .pg{display:flex;justify-content:space-between;align-items:center;padding:7px 12px;font-size:12.5px;color:#6b6456;background:#fbf7ec;border-bottom:1px solid #e6e0d2}
 .strana .pg b{color:#3a3528}
 .strana .pg button{font:inherit;font-size:12px;border:1px solid #e6e0d2;background:#fff;border-radius:6px;padding:2px 9px;cursor:pointer;color:#3a3528}
 .strana img{display:block;width:100%;height:auto;cursor:zoom-in}
 .strana.zoom{overflow-x:auto} .strana.zoom img{width:auto;max-width:none;cursor:zoom-out}
 .strana.nema{padding:12px;color:#9b9387;font-size:13.5px;background:#fefcf7}
 .notes-lbl{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:#1f7a3a;margin:0 0 -12px}
 .gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin-top:8px}
 .gal figure{margin:0;background:#fff;border:1px solid #e6e0d2;border-radius:8px;overflow:hidden;scroll-margin-top:12px}
 .gal img{display:block;width:100%;height:auto} .gal figcaption{font-size:12.5px;color:#6b6456;padding:6px 9px}
 .hit{animation:hit 2.4s ease-out} @keyframes hit{0%{box-shadow:0 0 0 4px rgba(201,138,44,.55)}100%{box-shadow:0 0 0 4px rgba(201,138,44,0)}}

 :root{--ink:#2b2b2b;--muted:#6b6456;--edge:#b1271f;--accent:#1f7a3a;--border:#e6e0d2;--soft:#fefcf7;--warn:#c98a2c;
       --sea:#cfe6f2;--land:#efeae0;--land-se:#f3ecd8;--bord:#8a8170}
 *{box-sizing:border-box}
 button{font:inherit;padding:7px 14px;border:1px solid var(--edge);background:#fff;color:var(--edge);border-radius:8px;cursor:pointer}
 button:hover{background:var(--edge);color:#fff}
 button.ok{border-color:var(--accent);color:var(--accent)} button.ok:hover{background:var(--accent);color:#fff}
 button:disabled{opacity:.45;cursor:default;background:#fff;color:inherit}
 .opt:disabled,.tn button:disabled,.mcell:disabled,.blank:disabled{opacity:1;cursor:default}
 .opt:disabled:not(.right):not(.wrong){opacity:.6}
 .bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-size:14px}
 .bar-menu-btn{padding:5px 12px;font-size:16px;line-height:1;border-color:var(--muted);color:#3a3528}
 .bar-menu-btn:hover{background:#f3ecd8;color:#3a3528}
 .bar-menu button{width:100%;text-align:left}
 .bar-menu .menu-link{display:block;font-size:13px;color:var(--edge);text-decoration:none;padding:7px 14px;border:1px dashed #e6b0b0;border-radius:8px}
 .stat{background:#f3ecd8;border:1px solid #e1d8c2;border-radius:8px;padding:4px 10px;white-space:nowrap}
 .stat b{font-size:15px;color:var(--accent)}
 .intro p{font-size:14px;color:#4a4434;line-height:1.6;margin:0 0 10px}
 .intro ul{margin:0 0 10px;padding-left:18px;font-size:13.5px;line-height:1.55}
 /* navigation: items */
 .it-row{display:flex;align-items:center;gap:8px;width:100%;border:0;border-radius:5px;background:none;color:var(--ink);font:inherit;font-size:13px;text-align:left;padding:5px 6px;cursor:pointer}
 a.it-row{text-decoration:none;box-sizing:border-box}
 .it-row:hover{background:#f6f1e4;color:var(--ink)}
 .it-row.sel{background:#efe7d2;font-weight:600}
 .it-row.off{opacity:.4}
 .it-row .st{flex:0 0 16px;text-align:center;color:#b9b2a0}
 .it-row.ok .st{color:var(--accent)} .it-row.rev .st,.it-row.fail .st{color:var(--edge)} .it-row.part .st{color:var(--warn)}
 .it-row .lbl{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
 .it-row .pt{flex:0 0 auto;font-size:11px;color:var(--muted);font-weight:400;font-variant-numeric:tabular-nums}
 .tz{flex:0 0 auto;display:inline-block;min-width:1.5em;text-align:center;font-size:10px;font-weight:700;border-radius:8px;padding:1px 5px;letter-spacing:.02em}
 .tz-lako{background:#e3f2e8;color:#1f6b3a} .tz-srednje{background:#fbefd5;color:#8a5a14} .tz-tesko{background:#f8dcd8;color:#8a2a22}
 .tz-legend{display:flex;gap:8px;flex-wrap:wrap;font-size:11px;color:var(--muted);padding:2px 6px 0}
 /* main: item */
 .item{padding:20px 24px 40px;max-width:1100px}
 .ihead{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-bottom:8px}
 .vchip{font-size:11px;text-transform:uppercase;letter-spacing:.05em;border:1px solid var(--border);border-radius:9px;padding:1px 8px;background:#fff}
 .item h2.q{font-size:18px;line-height:1.4;color:#3a3528;margin:0 0 14px}
 .opts{display:flex;flex-direction:column;gap:8px;max-width:640px}
 .opt{display:flex;gap:10px;align-items:flex-start;text-align:left;border:1px solid var(--border);background:#fff;color:var(--ink);border-radius:8px;padding:10px 12px;font-size:14.5px;line-height:1.4}
 .opt:hover{background:#fbf7ec;color:var(--ink)}
 .opt.picked{border-color:#3a3528;background:#f6f1e4}
 .opt.wrong{border-color:#e6b0b0;background:#fdecec;color:#8a2a22} .opt.wrong .ot{text-decoration:line-through}
 .opt.right{border-color:#9fd5b6;background:#e8f5ec;color:#13602c;font-weight:600}
 .opt .box{flex:0 0 18px;height:18px;border:1.5px solid #6b6456;border-radius:4px;margin-top:1px}
 .opt.picked .box{background:#3a3528;box-shadow:inset 0 0 0 3px #fff}
 .opt.round .box{border-radius:50%}
 .tn{display:flex;gap:12px;margin:4px 0 14px}
 .tn button{min-width:8em;padding:10px 18px;font-size:15px}
 .tn button.right{background:var(--accent);border-color:var(--accent);color:#fff}
 .tn button.wrong{background:#fdecec;border-color:#e6b0b0;color:#8a2a22}
 .stmt{font-size:16px;line-height:1.5;border-left:3px solid #e1d8c2;padding:6px 12px;margin:0 0 14px;background:#fff}
 .sub-q{font-weight:600;color:#3a3528;margin:16px 0 8px}
 .cloze{font-size:16px;line-height:2.3;max-width:720px}
 .blank{display:inline-block;min-width:5.5em;border:0;border-bottom:2px solid #6b6456;background:#fff;text-align:center;font:inherit;font-weight:600;color:#3a3528;padding:0 6px;margin:0 3px;border-radius:4px 4px 0 0;cursor:pointer}
 input.blank{cursor:text;width:7em}
 .blank:hover{background:#fbf7ec;color:#3a3528}
 .blank.cur{border-bottom-color:var(--edge);background:#fff7f3}
 .blank.lock{border-bottom-color:var(--accent);background:#e8f5ec;color:#13602c;cursor:default}
 .blank.bad{border-bottom-color:var(--edge);background:#fdecec;color:#8a2a22}
 .blank.rev{border-bottom-color:var(--warn);background:#fdf3e2;color:#8a5a14}
 .bank{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 0}
 .bank button{padding:5px 12px;border-color:#6b6456;color:#3a3528;border-radius:16px}
 .bank button:hover{background:#f3ecd8;color:#3a3528}
 .bank button.used{opacity:.3;pointer-events:none}
 .match{display:grid;grid-template-columns:1fr 1fr;gap:10px 28px;max-width:720px}
 .match .col{display:flex;flex-direction:column;gap:8px}
 .mcell{text-align:left;border:1px solid var(--border);background:#fff;color:var(--ink);border-radius:8px;padding:9px 12px;font-size:14px}
 .mcell:hover{background:#fbf7ec;color:var(--ink)}
 .mcell.cur{border-color:#3a3528;box-shadow:0 0 0 2px rgba(58,53,40,.15)}
 .mcell.done{border-color:#9fd5b6;background:#e8f5ec;color:#13602c;cursor:default}
 .mcell.rev{border-color:#ecc98a;background:#fdf3e2;color:#8a5a14;cursor:default}
 .mcell.bad{animation:shake .3s;border-color:#e6b0b0;background:#fdecec}
 .mcell .n{display:inline-block;min-width:1.4em;font-weight:700;margin-right:6px;color:var(--muted)}
 @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
 .iactions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:18px}
 .fb{font-size:14px;font-weight:600;min-height:1.4em}
 .fb.ok{color:var(--accent)} .fb.bad{color:var(--edge)} .fb.info{color:var(--muted);font-weight:400}
 .expl{margin-top:14px;padding:10px 14px;border-radius:8px;background:#e8f5ec;border:1px solid #bfe0c8;color:#13602c;font-size:14px;line-height:1.5;max-width:720px}
 .expl.rev{background:#fdf3e2;border-color:#f0d878;color:#6b4a10}
 .help-inline{display:none}
 /* map */
 .mapwrap{position:relative;margin-top:6px;border:1px solid var(--border);border-radius:8px;overflow:hidden;background:var(--sea);aspect-ratio:1000/715;max-height:70vh;touch-action:none}
 .mapwrap svg{width:100%;height:100%;display:block;cursor:crosshair}
 .mapwrap svg.drag{cursor:grabbing}
 .mapwrap .c{fill:var(--land);stroke:var(--bord);stroke-width:.6;vector-effect:non-scaling-stroke}
 .mapwrap .c.se{fill:var(--land-se)}
 .mapwrap .c.se:hover{fill:#e9dcb8}
 .mapwrap .c.hit{fill:#bfe0c8} .mapwrap .c.miss{fill:#f3c9c4} .mapwrap .c.revc{fill:#f6dca6}
 .mapwrap .mk{pointer-events:none}
 .mapwrap .mk circle{stroke:#fff;vector-effect:non-scaling-stroke}
 .mapwrap .mk text{font-size:13px;font-weight:700;paint-order:stroke;stroke:#fff;stroke-width:3px;vector-effect:non-scaling-stroke}
 .zbar{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px}
 .zbar button{width:36px;height:36px;padding:0;font-size:18px;font-weight:700;background:#fff;border-color:#6b6456;color:#3a3528;box-shadow:0 1px 3px rgba(0,0,0,.2)}
 .zbar button:hover{background:#f3ecd8;color:#3a3528}
 .zhint{position:absolute;left:10px;bottom:8px;font-size:11.5px;color:var(--muted);background:rgba(255,255,255,.85);border-radius:6px;padding:3px 8px;pointer-events:none}
 .clues{list-style:none;margin:0 0 6px;padding:0;max-width:720px}
 .clues li{padding:7px 10px;margin:0 0 6px;border-left:3px solid #e1d8c2;background:#fff;font-size:14.5px;line-height:1.45}
 .clues li:last-child{border-left-color:var(--edge)}
 .clues .k{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-right:6px}
 /* drawer content */
 .hl h3{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:14px 0 6px}
 .hl ol{margin:0;padding-left:20px} .hl li{margin:0 0 10px;line-height:1.5}
 .hl li.new{animation:flash 1.2s}
 @keyframes flash{0%{background:#fff3c4}100%{background:transparent}}
 .hl .placeholder{color:#9b9387;font-style:italic}
 .hl .chips{display:flex;flex-wrap:wrap;gap:6px}
 .hl .pchip{font-size:12px;border:1px solid var(--border);border-radius:10px;padding:1px 9px;background:#fefcf7}
 .hl a{color:var(--edge);text-decoration:none}
 .hl ul{margin:0;padding-left:18px} .hl ul li{margin:3px 0}
 .hl .ref{font-size:12px;color:var(--muted);margin:0 0 6px}
 .hl figure{margin:6px 0 10px} .hl figure img{display:block;max-width:100%;border-radius:6px;border:1px solid var(--border)}
 .qfig{margin:16px 0 0;max-width:720px} .qfig img{display:block;max-width:100%;max-height:62vh;border-radius:8px;border:1px solid var(--border);cursor:zoom-in}
 .qfig.zoom{max-width:none;overflow-x:auto} .qfig.zoom img{max-width:none;max-height:none;cursor:zoom-out}
 .qfig figcaption{font-size:12.5px;color:var(--muted);margin-top:5px}
 .hl figcaption{font-size:11.5px;color:var(--muted);margin-top:4px}
 .hl .book{border-left:3px solid #e1d8c2;padding:2px 0 2px 12px;margin:6px 0 4px}
 .hl .odeljak{margin:10px 0 4px;padding:8px 12px;background:#fefcf7;border:1px solid #e6e0d2;border-radius:8px;font-size:14px;line-height:1.5}
 .hl .odeljak summary{cursor:pointer;font-weight:600;color:#3a3528;font-size:13px}
 .hl .odeljak ul,.hl .odeljak ol{padding-left:20px;margin:6px 0} .hl .odeljak li{margin:3px 0} .hl .odeljak p{margin:6px 0}
 .hl .odeljak table{border-collapse:collapse;font-size:13px} .hl .odeljak th,.hl .odeljak td{border:1px solid #e6e0d2;padding:3px 6px}
 .hl .tekst-links{display:flex;flex-wrap:wrap;gap:6px 14px;margin:8px 0 4px;font-size:13.5px}
 .hl .tekst-links a{color:var(--edge);font-weight:600;text-decoration:none}
 /* the lesson (protected copy): main column via the nav, or one part of it in the wide drawer */
 .app-drawer.wide{width:min(820px,100vw)}
 .app-drawer .les{padding:0;max-width:none}
 .app-drawer .les section,.app-drawer .les .strana{margin:0 0 16px}
 .lekbar{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}
 .lekbar button{font-size:13px;padding:6px 12px}
 /* summary */
 .sum{padding:22px 26px 40px;max-width:860px}
 .sum h1{font-size:22px;margin:0 0 6px;color:#3a3528}
 .sum .big{font-size:30px;font-weight:700;color:var(--accent)}
 .sum .tbl{margin:14px 0}
 .sum .sub{color:var(--muted);margin:0 0 6px} .sum .lead{color:var(--muted);max-width:640px;line-height:1.5}
 .rv{border:1px solid var(--border);border-radius:8px;background:#fff;padding:10px 14px;margin:12px 0}
 .rv .rq{margin:4px 0 8px;font-weight:600;color:#3a3528} .rv .rl{margin:0;font-size:12px;color:var(--muted)}
 .rlog{margin:2px 0 8px;padding-left:18px;font-size:13.5px} .rlog .ok{color:var(--accent)} .rlog .bad{color:var(--edge)}
 .rv .rc{margin:0;font-size:13.5px}
 /* why a wrong option is wrong */
 .opt .why{display:block;font-size:12.5px;font-weight:400;color:#6b4a10;text-decoration:none;margin-top:4px;line-height:1.4}
 .opt.wrong{flex-wrap:wrap} .opt.wrong > span:last-child{flex:1 1 0}
 .why-box{border-left:3px solid var(--warn);background:#fdf3e2;padding:6px 10px;margin:0 0 10px;font-size:13.5px;line-height:1.45}
 /* datum */
 .dt{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:4px 0 6px}
 .dt input{font:inherit;font-size:18px;font-weight:600;width:6.5em;text-align:center;padding:8px;border:1.5px solid #6b6456;border-radius:8px}
 .dt select{font:inherit;font-size:14px;padding:7px 6px;border:1.5px solid #6b6456;border-radius:8px;background:#fff}
 .dt input.bad{border-color:var(--edge);background:#fdecec} .dt input:disabled{background:#e8f5ec;border-color:#9fd5b6;color:#13602c}
 .dt .ev{font-size:16px;border-left:3px solid #e1d8c2;padding:6px 12px;background:#fff;margin:0 0 14px}
 /* poredjaj */
 .ord{display:grid;grid-template-columns:1fr 1fr;gap:18px;max-width:900px}
 .ord h4{margin:0 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
 .ord .col{display:flex;flex-direction:column;gap:8px}
 .slot{display:flex;gap:8px;align-items:center;min-height:42px;text-align:left;border:1px dashed #cfc6b0;background:#fff;color:var(--ink);border-radius:8px;padding:8px 10px;font-size:14px}
 .slot .n{flex:0 0 1.6em;font-weight:700;color:var(--muted)}
 .slot.fill{border-style:solid;border-color:#3a3528} .slot.lock{border-style:solid;border-color:#9fd5b6;background:#e8f5ec;color:#13602c;cursor:default}
 .slot.rev{border-style:solid;border-color:#ecc98a;background:#fdf3e2;color:#8a5a14} .slot .yr{margin-left:auto;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
 .pool button{text-align:left}
 /* lanac */
 .chain{display:flex;flex-wrap:wrap;align-items:stretch;gap:6px;margin:0 0 16px;max-width:980px}
 .chain .lk{flex:1 1 150px;border:1px solid var(--border);background:#fff;border-radius:8px;padding:9px 11px;font-size:14px;line-height:1.4}
 .chain .lk.q{border:2px dashed var(--edge);background:#fff7f3;color:var(--edge);font-weight:700;text-align:center;display:flex;align-items:center;justify-content:center}
 .chain .lk.q.ok{border:1px solid #9fd5b6;background:#e8f5ec;color:#13602c;font-weight:600}
 .chain .ar{align-self:center;color:var(--muted);font-size:18px}
 /* izvor */
 .src{max-width:760px;margin:0 0 16px;border:1px solid #e1d8c2;border-radius:8px;background:#fffdf6;padding:12px 16px}
 .src .who{font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
 .src blockquote{margin:0;font-family:Georgia,serif;font-size:15.5px;line-height:1.55;color:#3a3528}
 .src .nt{font-size:12px;color:var(--muted);margin:8px 0 0}
 /* uporedi */
 .cmp{border-collapse:collapse;max-width:900px;width:100%}
 .cmp td{border-top:1px solid var(--border);padding:8px 6px;vertical-align:top;font-size:14px;line-height:1.4}
 .cmp td.bt{white-space:nowrap;text-align:right}
 .cmp .cb{padding:4px 9px;margin:2px;font-size:12.5px;border-color:#6b6456;color:#3a3528}
 .cmp-key{font-size:14px;line-height:1.6;margin:0 0 8px;padding:6px 10px;background:#fff;border-left:3px solid #e1d8c2;max-width:900px}
 .cmp .cb:hover{background:#f3ecd8;color:#3a3528} .cmp .cb.on{background:#3a3528;color:#fff}
 .cmp .cb.right{background:var(--accent);border-color:var(--accent);color:#fff} .cmp .cb.wrong{background:#fdecec;border-color:#e6b0b0;color:#8a2a22}
 .cmp tr.lock td:first-child{color:#13602c} .cmp tr.bad td:first-child{color:#8a2a22}
 .cmp .why{display:block;font-size:12.5px;color:#6b4a10;margin-top:3px}
 /* objasni */
 .exp textarea{width:100%;max-width:760px;min-height:110px;font:inherit;font-size:15px;line-height:1.5;padding:10px 12px;border:1.5px solid #6b6456;border-radius:8px}
 .exp .mine{max-width:760px;white-space:pre-wrap;border-left:3px solid #6b6456;background:#fff;padding:8px 12px;font-size:14.5px;line-height:1.5}
 .exp .uzor{max-width:760px;border-left:3px solid var(--accent);background:#e8f5ec;padding:8px 12px;font-size:14.5px;line-height:1.5;color:#13602c}
 .exp label{display:flex;gap:10px;align-items:flex-start;max-width:760px;padding:7px 10px;border:1px solid var(--border);border-radius:8px;background:#fff;margin:0 0 6px;font-size:14px;cursor:pointer}
 .exp label input{margin-top:3px}
 /* vremenska osa */
 .osa{position:relative;margin:16px 0 8px;max-width:1100px}
 .osa .lane{position:relative;border-top:1px solid var(--border);padding:6px 0 4px 110px;min-height:36px}
 .osa .lane .ll{position:absolute;left:0;top:8px;width:102px;font-size:12px;font-weight:700}
 .osa .row{position:relative;height:26px}
 .osa .ev{position:absolute;top:6px;height:14px;min-width:12px;border-radius:7px}
 .osa .ev span{position:absolute;left:calc(100% + 5px);top:-3px;font-size:11.5px;line-height:20px;white-space:nowrap;color:#3a3528}
 .osa .ev.lft span{left:auto;right:calc(100% + 5px)}   /* label to the left when it would run past the end of the axis */
 .osa .ev span small{color:var(--muted)}
 .osa .ev.rv{opacity:.45} .osa .ev.rv span{font-style:italic}
 .osa .ev.vague{background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.55) 0 4px,transparent 4px 8px)}   /* dated by the book only as part of a century */
 .osa .ticks{position:relative;height:22px;margin-left:110px;border-top:2px solid #3a3528}
 .osa .ticks span{position:absolute;top:3px;font-size:11px;color:var(--muted);transform:translateX(-50%)}
 .osa .ticks span::before{content:'';position:absolute;left:50%;top:-6px;height:5px;border-left:1px solid #3a3528}
 .osa-wrap{overflow-x:auto} .osa-wrap .osa{min-width:720px}
 /* moje znanje */
 .box5{display:inline-flex;gap:3px;vertical-align:middle} .box5 i{width:11px;height:11px;border-radius:3px;background:#e6e0d2;display:inline-block}
 .box5 i.on{background:var(--accent)}
 .zn-due{color:var(--edge);font-weight:600}
 .placed{font-size:12.5px;color:var(--accent);margin:8px 0 0}
 #msg{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--edge);color:#fff;padding:9px 18px;border-radius:24px;font-size:14px;font-weight:600;opacity:0;transition:opacity .25s;pointer-events:none;z-index:99}
 #msg.show{opacity:1}
 @media (max-width:760px){
   .brand{display:none}
   .bar{flex-wrap:nowrap;gap:6px} .stat{padding:3px 7px;font-size:12px} .stat b{font-size:13px}
   .bar-menu-btn{padding:4px 9px}
   .item{padding:14px 14px 40px} .item h2.q{font-size:16.5px}
   .match{grid-template-columns:1fr 1fr;gap:8px 10px} .mcell{font-size:13px;padding:8px}
   .help-inline{display:block;margin-top:14px}
   .help-inline:empty{display:none}
   .help-inline .hl{border:1px solid #f0d878;background:#fffbe6;border-radius:8px;padding:2px 12px 4px}
   .mapwrap{aspect-ratio:auto;height:52vh}
   .ord{grid-template-columns:1fr} .cmp td.bt{white-space:normal} .cmp tr{display:block;border-top:1px solid var(--border)} .cmp td{display:block;border:0;text-align:left!important}
   .chain .ar{transform:rotate(90deg);width:100%;text-align:center} .chain .lk{flex-basis:100%}
 }
</style>

<script>
(function () {
  const root = document.documentElement;
  const bar = document.querySelector('.app-bar');
  function setTop() { if (bar) root.style.setProperty('--htop', bar.offsetHeight + 'px'); }
  window.addEventListener('resize', setTop);
  setTop();

  // ☰ navigation (only shown at ≤760px)
  const nav = document.getElementById('app-nav');
  const navBtn = document.getElementById('app-menu');
  const navOverlay = () => window.matchMedia && window.matchMedia('(max-width:760px)').matches;
  function setNav(open) {
    if (!nav) return;
    nav.classList.toggle('open', !!open);
    if (navBtn) navBtn.setAttribute('aria-expanded', String(!!open));
  }
  if (navBtn) navBtn.addEventListener('click', e => { e.stopPropagation(); setNav(!nav.classList.contains('open')); });

  // navigation filter: case- and diacritic-insensitive (š, č, ć, ž, đ)
  const filter = document.getElementById('app-filter');
  const norm = s => String(s || '').toLowerCase().replace(/đ/g, 'd').normalize('NFD').replace(/[̀-ͯ]/g, '');
  function applyFilter() {
    const q = norm(filter.value.trim());
    document.querySelectorAll('#app-nav [data-filter]').forEach(el =>
      el.classList.toggle('f-hide', !!q && !norm(el.dataset.filter).includes(q)));
    document.querySelectorAll('#app-nav [data-filter-group]').forEach(g =>
      g.classList.toggle('f-hide', !!q && !g.querySelector('[data-filter]:not(.f-hide)')));
  }
  if (filter) filter.addEventListener('input', applyFilter);

  // ⋯ menus: a button with data-menu="<id>" toggles .bar-menu#<id>; a button inside closes it
  function setMenu(m, open) {
    m.classList.toggle('open', !!open);
    const b = document.querySelector('[data-menu="' + m.id + '"]');
    if (b) b.setAttribute('aria-expanded', String(!!open));
  }
  document.querySelectorAll('[data-menu]').forEach(btn => {
    const m = document.getElementById(btn.dataset.menu);
    if (!m) return;
    btn.addEventListener('click', e => { e.stopPropagation(); setMenu(m, !m.classList.contains('open')); });
    m.addEventListener('click', e => { e.stopPropagation(); if (e.target.closest('button')) setMenu(m, false); });
  });
  document.addEventListener('click', e => {
    // composedPath: the clicked node may already be re-rendered away (e.g. a step's "next" button)
    if (!e.composedPath().some(n => n.dataset && n.dataset.keepMenus)) document.querySelectorAll('.bar-menu.open').forEach(m => setMenu(m, false));
    if (nav && nav.classList.contains('open') && navOverlay() && !nav.contains(e.target)) setNav(false);
  });
  document.addEventListener('keydown', e => {
    if (e.key !== 'Escape') return;
    document.querySelectorAll('.bar-menu.open').forEach(m => setMenu(m, false));
    const x = document.querySelector('.app-drawer.open .drawer-close');
    if (x && x.offsetParent !== null) x.click();
  });

  window.HubShell = { setNav, setMenu, applyFilter, navOverlay };
})();
</script>
<script>

o-more"], "pitanje": "Zašto se kaže da Španija ima povoljan geografski položaj?", "odgovori": [{"tekst": "Izlazi i na Atlantski okean i na Sredozemno more.", "tacan": true}, {"tekst": "Nema izlaz na more, pa je zaštićena.", "tacan": false}, {"tekst": "Nalazi se na severu Evrope.", "tacan": false}, {"tekst": "Sa svih strana je okružena planinama.", "tacan": false}], "pomoc": ["Korak 1: Pogledaj koliko vodenih površina dodiruje obala Španije.", "Korak 2: Izlaz na dva mora olakšava trgovinu i saobraćaj.", "Iz lekcije: položaj je povoljan jer izlazi na Atlantik i na Sredozemlje."], "objasnjenje": "Španija izlazi na okean i na more, pa ima vezu i sa Atlantikom i sa Sredozemljem.", "iz_udzbenika": {"strana": 35, "odeljak": "Položaj", "tekst": "Španija ima povoljan položaj — izlazi i na Atlantski okean i na Sredozemno more."}, "lekcija": 11}, {"id": "l11-polozaj-klik-madrid", "vrsta": "karta_klik", "tezina": "lako", "pojmovi": ["madrid", "mezeta"], "pitanje": "Klikni na glavni grad Španije.", "cilj": {"mesto": "madrid"}, "pomoc": ["Glavni grad je u samom središtu zemlje.", "Leži na visoravni Mezeti.", "Klikni tačno u sredinu Španije."], "objasnjenje": "Madrid je u središtu Španije, na visoravni Mezeti.", "iz_udzbenika": {"strana": 35, "odeljak": "Reljef", "tekst": "Na visoravni Mezeti, u središtu Španije, nalazi se glavni grad Madrid."}, "lekcija": 11}, {"id": "l11-polozaj-gde-spanija", "vrsta": "gde_sam", "tezina": "lako", "pojmovi": ["spanija", "pirinejsko-poluostrvo"], "pitanje": "Gde sam? Pročitaj trag i klikni državu na karti.", "cilj": {"drzava": "ESP"}, "tragovi": ["U meni žive katolici romanskog porekla, a nacionalni ples mi je flamenko.", "Pripadaju mi Balearska i Kanarska ostrva.", "Izlazim i na Atlantski okean i na Sredozemno more.", "Ja sam najveća država Pirinejskog poluostrva, a glavni grad mi je Madrid."], "objasnjenje": "Španija — najveća država Pirinejskog poluostrva, sa glavnim gradom Madridom.", "iz_udzbenika": {"strana": 35, "odeljak": "Položaj", "tekst": "Španija je najveća država Pirinejskog poluostrva i izlazi i na Atlantski okean i na Sredozemno more.", "slika": "11-spanija/01-spanija-infookvir.jpg"}, "lekcija": 11}, {"id": "l11-polozaj-izbor-stanovnici", "vrsta": "izbor", "tezina": "srednje", "pojmovi": ["spanija"], "pitanje": "Koliko otprilike stanovnika ima Španija?", "odgovori": [{"tekst": "oko 47,8 miliona", "tacan": true}, {"tekst": "oko 7,8 miliona", "tacan": false}, {"tekst": "oko 478 miliona", "tacan": false}, {"tekst": "oko 87,4 miliona", "tacan": false}], "pomoc": ["Srbija ima oko 7 miliona stanovnika — Španija ih ima mnogo više.", "Broj je malo manji od 50 miliona.", "Iz lekcije (infookvir): 47,8 miliona stanovnika."], "objasnjenje": "Španija ima oko 47,8 miliona stanovnika.", "iz_udzbenika": {"strana": 35, "odeljak": "Osnovni podaci", "tekst": "Prema infookviru, Španija ima 47,8 miliona stanovnika i površinu od 505.370 km².", "slika": "11-spanija/01-spanija-infookvir.jpg"}, "lekcija": 11}, {"id": "l11-polozaj-dopuni-povrsina", "vrsta": "dopuni", "tezina": "srednje", "pojmovi": ["spanija"], "pitanje": "Dopuni rečenicu brojevima iz banke.", "tekst": "Španija ima površinu od {{505.370|505370|505 370}} km² i oko {{47,8|47.8}} miliona stanovnika.", "ponudjene": ["505.370", "47,8", "50.537", "4,78"], "pomoc": ["Površina je veća od pola miliona km².", "Stanovnika ima skoro 50 miliona.", "Iz lekcije (infookvir): 505.370 km² i 47,8 miliona stanovnika."], "objasnjenje": "Površina Španije je 505.370 km², a broj stanovnika oko 47,8 miliona.", "iz_udzbenika": {"strana": 35, "odeljak": "Osnovni podaci", "tekst": "Infookvir daje površinu od 505.370 km² i 47,8 miliona stanovnika.", "slika": "11-spanija/01-spanija-infookvir.jpg"}, "lekcija": 11}, {"id": "l11-polozaj-tn-najveca", "vrsta": "tacno_netacno", "tezina": "srednje", "pojmovi": ["portugalija", "pirinejsko-poluostrvo"], "tvrdnja": "Portugalija je najveća država Pirinejskog poluostrva.", "tacno": false, "ispravke": [{"tekst": "Najveća država Pirinejskog poluostrva je Španija.", "tacan": true}, {"tekst": "Najveća država Pirinejskog poluostrva je Andora.", "tacan": false}, {"tekst": "Najveća država Pirinejskog poluostrva je Francuska.", "tacan": false}], "pomoc": ["Uporedi na karti veličinu Portugalije i njenog istočnog suseda.", "Francuska je severno od Pirineja, a Andora je minijaturna država.", "Iz lekcije: Španija je najveća država Pirinejskog poluostrva."], "objasnjenje": "Netačno — najveća je Španija; Portugalija je manja država na zapadu poluostrva.", "iz_udzbenika": {"strana": 35, "odeljak": "Položaj", "tekst": "Španija je najveća država Pirinejskog poluostrva."}, "lekcija": 11}, {"id": "l11-polozaj-klik-maroko", "vrsta": "karta_klik", "tezina": "srednje", "pojmovi": ["maroko", "seuta", "melilja"], "pitanje": "Klikni na afričku državu na čijoj obali su španski gradovi Seuta i Melilja.", "cilj": {"drzava": "MAR"}, "pomoc": ["Traži državu u Africi, preko puta južne obale Španije.", "Od Španije je deli uski Gibraltarski moreuz.", "Klikni na Maroko, južno od Gibraltara."], "objasnjenje": "Seuta i Melilja su španski gradovi (eksklave) na obali Maroka.", "iz_udzbenika": {"strana": 35, "odeljak": "Položaj", "tekst": "Španiji pripadaju i dva grada na teritoriji afričke države Maroko — eksklave Seuta i Melilja."}, "lekcija": 11}, {"id": "l11-polozaj-povezi-pojmovi", "vrsta": "povezi", "tezina": "srednje", "pojmovi": ["transkontinentalna-zemlja", "eksklava", "kanarska-ostrva", "seuta", "melilja"], "pitanje": "Poveži pojam sa objašnjenjem.", "parovi": [["transkontinentalna zemlja", "država čija se teritorija prostire na dva kontinenta"], ["eksklava", "deo teritorije jedne države okružen tuđom teritorijom"], ["Kanarska ostrva", "ostrva u Atlantiku koja prirodno pripadaju Africi"], ["Seuta i Melilja", "španski gradovi na teritoriji Maroka"]], "pomoc": ["„Trans-” znači „preko” — preko granice kontinenta.", "Gradovi su na kopnu, a ostrva u okeanu.", "Iz lekcije: Španija je transkontinentalna zbog Kanarskih ostrva; Seuta i Melilja su eksklave u Maroku."], "objasnjenje": "Kanarska ostrva i eksklave Seuta i Melilja su delovi Španije u Africi — zato je ona transkontinentalna zemlja.", "iz_udzbenika": {"strana": 35, "odeljak": "Položaj", "tekst": "Kanarska ostrva fizičko-geografski pripadaju Africi, pa je Španija transkontinentalna zemlja. U Maroku ima i dva grada — eksklave Seutu i Melilju."}, "lekcija": 11}, {"id": "l11-polozaj-zakljuci-transkontinentalna", "vrsta": "zakljuci", "tezina": "srednje", "pojmovi": ["transkontinentalna-zemlja", "kanarska-ostrva"], "pitanje": "Zašto se Španija naziva transkontinentalnom zemljom?", "odgovori": [{"tekst": "Pored evropskog dela ima i teritorije koje pripadaju Africi.", "tacan": true}, {"tekst": "Izlazi na dva mora.", "tacan": false}, {"tekst": "Imala je kolonije u Americi.", "tacan": false}, {"tekst": "Graniči se sa Francuskom i Portugalijom.", "tacan": false}], "pomoc": ["Korak 1: Kontinent je velika celina kopna — koji kontinent je južno od Španije?", "Korak 2: Koji španski delovi se nalaze na tom kontinentu ili uz njega?", "Iz lekcije: Kanarska ostrva fizički spadaju u Afriku, a Seuta i Melilja su na afričkom tlu."], "objasnjenje": "Španija ima Kanarska ostrva (Afrika) i gradove Seutu i Melilju na afričkom tlu, pa joj se teritorija prostire na dva kontinenta.", "iz_udzbenika": {"strana": 35, "odeljak": "Položaj", "tekst": "Kanarska ostrva fizičko-geografski spadaju u Afriku, a Seuta i Melilja su u Maroku — zato je Španija transkontinentalna zemlja."}, "lekcija": 11}, {"id": "l11-polozaj-tn-kanarska", "vrsta": "tacno_netacno", "tezina": "srednje", "pojmovi": ["kanarska-ostrva", "balearska-ostrva"], "tvrdnja": "Kanarska ostrva nalaze se u Sredozemnom moru, istočno od Valensije.", "tacno": false, "ispravke": [{"tekst": "Kanarska ostrva su u Atlantskom okeanu, uz obalu Afrike.", "tacan": true}, {"tekst": "Kanarska ostrva su u Biskajskom zalivu.", "tacan": false}, {"tekst": "Kanarska ostrva su u Jadranskom moru.", "tacan": false}], "pomoc": ["Ostrva istočno od Valensije imaju drugo ime — Balearska.", "Kanarska ostrva su daleko na jugozapadu, kod Afrike.", "Iz lekcije: Balearska ostrva su u Sredozemnom moru, a Kanarska u Atlantiku i pripadaju Africi."], "objasnjenje": "Netačno — u Sredozemlju su Balearska ostrva; Kanarska su u Atlantskom okeanu, uz obalu Afrike.", "iz_udzbenika": {"strana": 35, "odeljak": "Ostrva", "tekst": "Najveća ostrva u Sredozemnom moru su Balearska; Kanarska ostrva su u Atlantiku i fizički pripadaju Africi."}, "lekcija": 11}, {"id": "l11-polozaj-izbor-afrika", "vrsta": "izbor", "tezina": "tesko", "pojmovi": ["kanarska-ostrva", "seuta", "melilja", "transkontinentalna-zemlja"], "pitanje": "Koji delovi Španije su na afričkom tlu ili prirodno pripadaju Africi? (Više tačnih.)", "odgovori": [{"tekst": "Kanarska ostrva", "tacan": true}, {"tekst": "Seuta", "tacan": true}, {"tekst": "Melilja", "tacan": true}, {"tekst": "Balearska ostrva", "tacan": false}, {"tekst": "Malaga", "tacan": false}, {"tekst": "Andaluzija", "tacan": false}], "pomoc": ["Malaga i Andaluzija su na jugu Španije, ali još uvek na evropskom kopnu.", "Tačna su tri odgovora — jedna ostrvska grupa u Atlantiku i dva grada u Maroku.", "Iz lekcije: Kanarska ostrva spadaju u Afriku; Seuta i Melilja su eksklave u Maroku."], "objasnjenje": "U Africi su Kanarska ostrva, Seuta i Melilja. Balearska ostrva su u Sredozemlju uz Evropu, a Malaga i Andaluzija na jugu Pirinejskog poluostrva.", "iz_udzbenika": {"strana": 35, "odeljak": "Položaj", "tekst": "Španiji pripadaju Kanarska ostrva, koja fizički spadaju u Afriku, i dva grada u Maroku — Seuta i Melilja."}, "lekcija": 11}, {"id": "l11-polozaj-klik-seuta", "vrsta": "karta_klik", "tezina": "tesko", "pojmovi": ["seuta", "eksklava", "gibraltarski-moreuz"], "pitanje": "Klikni na Seutu — španski grad na afričkoj obali Gibraltarskog moreuza.", "cilj": {"mesto": "seuta"}, "pomoc": ["Traži najuži deo mora između Evrope i Afrike.", "Seuta je na afričkoj (južnoj) strani tog moreuza, u Maroku.", "Klikni na obalu Maroka tačno preko puta Gibraltara."], "objasnjenje": "Seuta je španska eksklava na severnoj obali Maroka, uz Gibraltarski moreuz.", "iz_udzbenika": {"strana": 35, "odeljak": "Položaj", "tekst": "Zadatak u tekstu traži da se u atlasu pronađu Kanarska ostrva, Seuta i Melilja — španske teritorije u Africi."}, "lekcija": 11}, {"id": "l11-polozaj-klik-melilja", "vrsta": "karta_klik", "tezina": "tesko", "pojmovi": ["melilja", "eksklava", "maroko"], "pitanje": "Klikni na Melilju — španski grad na sredozemnoj obali Maroka.", "cilj": {"mesto": "melilja"}, "pomoc": ["Melilja je u Africi, na obali Sredozemnog mora.", "Nalazi se istočnije od Gibraltara, otprilike južno od Malage i Almerije.", "Klikni na obalu Maroka, blizu granice sa Alžirom."], "objasnjenje": "Melilja je španska eksklava na sredozemnoj obali Maroka, istočno od Seute.", "iz_udzbenika": {"strana": 35, "odeljak": "Položaj", "tekst": "Seuta i Melilja su dva grada Španije na teritoriji afričke države Maroko — eksklave."}, "lekcija": 11}, {"id": "l11-polozaj-dopuni-eksklave", "vrsta": "dopuni", "tezina": "tesko", "pojmovi": ["seuta", "melilja", "eksklava", "maroko"], "pitanje": "Dopuni rečenicu (bez ponuđenih reči).", "tekst": "Gradovi {{Seuta|Melilja}} i {{Melilja|Seuta}} su španske {{eksklave|eksklava}} na teritoriji afričke države {{Maroko|Maroka}}.", "pomoc": ["Oba grada su na obali Afrike, preko puta juga Španije.", "Deo države okružen tuđom teritorijom zove se eksklava.", "Iz lekcije: Seuta i Melilja su eksklave u Maroku."], "objasnjenje": "Seuta i Melilja su španske eksklave u Maroku.", "iz_udzbenika": {"strana": 35, "odeljak": "Položaj", "tekst": "Španija poseduje dva grada na teritoriji Maroka — eksklave Seutu i Melilju."}, "lekcija": 11}, {"id": "l11-polozaj-zakljuci-italija", "vrsta": "zakljuci", "tezina": "tesko", "pojmovi": ["spanija", "mezeta", "atlantski-okean"], "pitanje": "Po čemu se prirodni položaj Španije razlikuje od položaja Italije?", "odgovori": [{"tekst": "Španija izlazi i na Atlantik, ima veliku visoravan u središtu i slabo razuđenu obalu.", "tacan": true}, {"tekst": "Španija nema izlaz na more, a Italija ima.", "tacan": false}, {"tekst": "Španija je sva u Sredozemlju i ima mnogo vulkana.", "tacan": false}, {"tekst": "Španija ima veoma razuđenu obalu, a Italija ravnu.", "tacan": false}], "pomoc": ["Korak 1: Na koje vode izlazi Španija, a na koje Italija (seti se prošle lekcije)?", "Korak 2: Šta je u središtu Španije, i kakva joj je obala?", "Iz lekcije: Španija izlazi i na Atlantik, u središtu ima Mezetu, a obala joj je slabo razuđena."], "objasnjenje": "Italija je cela u Sredozemlju i ima vulkane; Španija izlazi i na Atlantik, ima Mezetu i slabo razuđenu obalu.", "iz_udzbenika": {"strana": 35, "odeljak": "Položaj i reljef", "tekst": "Španija izlazi na Atlantski okean i na Sredozemno more, u središtu ima visoravan Mezetu, a obala joj je slabo razuđena."}, "lekcija": 11}]}, {"naslov": "Reljef, obala i ostrva", "zadaci": [{"id": "l11-reljef-izbor-planinska", "vrsta": "izbor", "tezina": "lako", "pojmovi": ["spanija"], "pitanje": "Kakav je reljef Španije pretežno?", "odgovori": [{"tekst": "planinski", "tacan": true}, {"tekst": "potpuno ravničarski", "tacan": false}, {"tekst": "pustinjski sa dinama", "tacan": false}, {"tekst": "pod lednicima", "tacan": false}], "pomoc": ["Na fizičkoj karti Španije preovlađuju smeđe i narandžaste boje.", "Nizije su samo uske, u priobalju i dolinama reka.", "Iz lekcije: Španija je pretežno planinska zemlja."], "objasnjenje": "Španija je pretežno planinska; nizije su samo u priobalju i dolinama reka.", "iz_udzbenika": {"strana": 35, "odeljak": "Reljef", "tekst": "Španija je pretežno planinska zemlja, a u središtu ima veliku visoravan.", "slika": "11-spanija/02-fizicka-karta-spanije.jpg"}, "lekcija": 11}, {"id": "l11-reljef-izbor-najvise", "vrsta": "izbor", "tezina": "lako", "pojmovi": ["pirineji"], "pitanje": "Koje su najviše planine Španije?", "odgovori": [{"tekst": "Pirineji", "tacan": true}, {"tekst": "Alpi", "tacan": false}, {"tekst": "Karpati", "tacan": false}, {"tekst": "Apenini", "tacan": false}], "pomoc": ["Traži planine koje se nalaze u Španiji ili na njenoj granici.", "Alpi, Karpati i Apenini su u drugim delovima Evrope.", "Iz lekcije: najviše planine su Pirineji, na severoistoku."], "objasnjenje": "Pirineji su najviše planine Španije, na granici sa Francuskom.", "iz_udzbenika": {"strana": 35, "odeljak": "Reljef", "tekst": "Najviše planine Španije su Pirineji, na severoistoku zemlje, na granici sa Francuskom.", "slika": "11-spanija/04-pirineji.jpg"}, "lekcija": 11}, {"id": "l11-reljef-klik-pirineji", "vrsta": "karta_klik", "tezina": "lako", "pojmovi": ["pirineji"], "pitanje": "Klikni na Pirineje.", "cilj": {"mesto": "pirineji"}, "pomoc": ["Pirineji su na severoistoku Španije.", "Pružaju se duž granice sa Francuskom, od Biskajskog zaliva do Sredozemnog mora.", "Klikni na kopnenu granicu Španije i Francuske."], "objasnjenje": "Pirineji se pružaju duž granice Španije i Francuske, na severoistoku.", "iz_udzbenika": {"strana": 35, "odeljak": "Reljef", "tekst": "Pirineji su na severoistoku, na granici sa Francuskom. Na fotografiji se vide strmi snežni vrhovi i četinari.", "slika": "11-spanija/04-pirineji.jpg"}, "lekcija": 11}, {"id": "l11-reljef-tn-mezeta", "vrsta": "tacno_netacno", "tezina": "lako", "pojmovi": ["mezeta", "madrid"], "tvrdnja": "U središtu Španije je visoravan Mezeta, na kojoj se nalazi Madrid.", "tacno": true, "pomoc": ["Na fizičkoj karti središte Španije je žuto-narandžasto — povišeno, ali zaravnjeno.", "Glavni grad je baš u sredini zemlje.", "Iz lekcije: na visoravni Mezeti je glavni grad Madrid."], "objasnjenje": "Tačno — Mezeta je visoravan u središtu Španije, a na njoj je Madrid.", "iz_udzbenika": {"strana": 35, "odeljak": "Reljef", "tekst": "U središtu Španije uzdiže se visoravan Mezeta, na kojoj je glavni grad Madrid.", "slika": "11-spanija/02-fizicka-karta-spanije.jpg"}, "lekcija": 11}, {"id": "l11-reljef-dopuni-mezeta", "vrsta": "dopuni", "tezina": "lako", "pojmovi": ["mezeta", "madrid"], "pitanje": "Dopuni rečenicu rečima iz banke.", "tekst": "U središtu Španije je visoravan {{Mezeta}}, a na njoj glavni grad {{Madrid}}.", "ponudjene": ["Mezeta", "Madrid", "Andaluzija", "Sevilja"], "pomoc": ["Andaluzija je nizija na jugu, a Sevilja grad u njoj.", "Visoravan se zove kratko, sa šest slova.", "Iz lekcije: Mezeta — Madrid."], "objasnjenje": "Visoravan Mezeta je u središtu, a na njoj je Madrid. Andaluzija i Sevilja su na jugu.", "iz_udzbenika": {"strana": 35, "odeljak": "Reljef", "tekst": "Između Kastiljskih planina i Sijera Morene je visoravan Mezeta; na njoj je glavni grad."}, "lekcija": 11}, {"id": "l11-reljef-klik-mezeta", "vrsta": "karta_klik", "tezina": "lako", "pojmovi": ["mezeta"], "pitanje": "Klikni na visoravan Mezetu.", "cilj": {"mesto": "mezeta"}, "pomoc": ["Mezeta zauzima središnji deo Španije.", "Na njoj je glavni grad.", "Klikni u sredinu Španije, oko Madrida."], "objasnjenje": "Mezeta je velika visoravan u središtu Španije, oko Madrida.", "iz_udzbenika": {"strana": 36, "odeljak": "Zadatak — nema karta", "tekst": "Na nemoj karti Mezeta je pod brojem 7 — velika žuto-narandžasta površina u središtu Španije.", "slika": "11-spanija/02-fizicka-karta-spanije.jpg"}, "lekcija": 11}, {"id": "l11-reljef-izbor-zaliv", "vrsta": "izbor", "tezina": "lako", "pojmovi": ["biskajski-zaliv"], "pitanje": "Koji je najveći zaliv uz obalu Španije?", "odgovori": [{"tekst": "Biskajski zaliv", "tacan": true}, {"tekst": "Venecijanski zaliv", "tacan": false}, {"tekst": "Kotorski zaliv", "tacan": false}, {"tekst": "Persijski zaliv", "tacan": false}], "pomoc": ["Zaliv je na severu Španije, u Atlantskom okeanu.", "Ostali zalivi su u Italiji, Crnoj Gori i Aziji.", "Iz lekcije: obala je slabo razuđena, a najveći zaliv je Biskajski."], "objasnjenje": "Biskajski zaliv je na severu, između Španije i Francuske; obala Španije je inače slabo razuđena.", "iz_udzbenika": {"strana": 35, "odeljak": "Obala", "tekst": "Obala Španije je slabo razuđena; najveći zaliv je Biskajski."}, "lekcija": 11}, {"id": "l11-reljef-izbor-balearska", "vrsta": "izbor", "tezina": "lako", "pojmovi": ["balearska-ostrva", "sredozemno-more"], "pitanje": "Koja su najveća španska ostrva u Sredozemnom moru?", "odgovori": [{"tekst": "Balearska ostrva", "tacan": true}, {"tekst": "Kanarska ostrva", "tacan": false}, {"tekst": "Britanska ostrva", "tacan": false}, {"tekst": "Jonska ostrva", "tacan": false}], "pomoc": ["Kanarska ostrva su španska, ali u Atlantiku.", "Britanska i Jonska ostrva ne pripadaju Španiji.", "Iz lekcije: najveća su Balearska ostrva u Sredozemnom moru."], "objasnjenje": "Balearska ostrva (Majorka, Menorka, Ibica) su u Sredozemnom moru; Kanarska su u Atlantiku.", "iz_udzbenika": {"strana": 35, "odeljak": "Ostrva", "tekst": "Najveća ostrva Španije u Sredozemnom moru su Balearska — Ibica, Majorka i Menorka."}, "lekcija": 11}, {"id": "l11-reljef-izbor-balearska-grupa", "vrsta": "izbor", "tezina": "lako", "pojmovi": ["balearska-ostrva", "majorka", "menorka", "ibica"], "pitanje": "Koja ostrva čine Balearsku grupu? (Više tačnih.)", "odgovori": [{"tekst": "Majorka", "tacan": true}, {"tekst": "Menorka", "tacan": true}, {"tekst": "Ibica", "tacan": true}, {"tekst": "Sicilija", "tacan": false}, {"tekst": "Kipar", "tacan": false}], "pomoc": ["Sicilija pripada Italiji, a Kipar je ostrvska država na istoku Sredozemlja.", "Tačna su tri ostrva, a dva imaju skoro isto ime.", "Iz lekcije: grupu čine Ibica, Majorka i Menorka."], "objasnjenje": "Balearska ostrva su Majorka (najveće), Menorka i Ibica.", "iz_udzbenika": {"strana": 35, "odeljak": "Ostrva", "tekst": "Balearska ostrva u Sredozemnom moru čine Ibica, Majorka i Menorka."}, "lekcija": 11}, {"id": "l11-reljef-klik-balearska", "vrsta": "karta_klik", "tezina": "lako", "pojmovi": ["balearska-ostrva"], "pitanje": "Klikni na Balearska ostrva.", "cilj": {"mesto": "balearska-ostrva"}, "pomoc": ["Ostrva su u Sredozemnom moru.", "Nalaze se istočno od Valensije.", "Klikni na grupu ostrva d c": ["Kantabrijske planine su na severozapadu Španije.", "Pružaju se uz obalu Biskajskog zaliva.", "Klikni na sever Španije, zapadno od Pirineja, uz samu obalu."], "objasnjenje": "Kantabrijske planine su na severozapadu, uz Biskajski zaliv.", "iz_udzbenika": {"strana": 36, "odeljak": "Zadatak — nema karta", "tekst": "Na nemoj karti Kantabrijske planine su pod brojem 9, na severozapadu, uz Biskajski zaliv.", "slika": "11-spanija/02-fizicka-karta-spanije.jpg"}, "lekcija": 11}, {"id": "l11-reljef-klik-betijske", "vrsta": "karta_klik", "tezina": "srednje", "pojmovi": ["betijske-planine"], "pitanje": "Klikni na Betijske planine.", "cilj": {"mesto": "betijske-planine"}, "pomoc": ["Betijske planine su na jugu i jugoistoku Španije.", "Pružaju se uz sredozemnu obalu, iznad Malage.", "Klikni na jug Španije, između Malage i istočne obale."], "objasnjenje": "Betijske planine su na jugu/jugoistoku, uz Sredozemno more; na njima vlada planinska klima.", "iz_udzbenika": {"strana": 36, "odeljak": "Zadatak — nema karta", "tekst": "Na nemoj karti Betijske planine su pod brojem 8, na jugoistoku Španije.", "slika": "11-spanija/02-fizicka-karta-spanije.jpg"}, "lekcija": 11}, {"id": "l11-reljef-klik-iberijske", "vrsta": "karta_klik", "tezina": "srednje", "pojmovi": ["iberijske-planine", "ebro"], "pitanje": "Klikni na Iberijske planine.", "cilj": {"mesto": "iberijske-planine"}, "pomoc": ["Iberijske planine su u središnjem delu Španije, ali istočnije od Madrida.", "Nalaze se jugozapadno od doline Ebra.", "Klikni između Madrida i Saragose."], "objasnjenje": "Iberijske planine su u središnjem-istočnom delu Španije, iznad doline Ebra.", "iz_udzbenika": {"strana": 36, "odeljak": "Zadatak — nema karta", "tekst": "Na nemoj karti Iberijske planine su pod brojem 10, u središnjem delu Španije.", "slika": "11-spanija/02-fizicka-karta-spanije.jpg"}, "lekcija": 11}, {"id": "l11-reljef-tn-obala", "vrsta": "tacno_netacno", "tezina": "srednje", "pojmovi": ["biskajski-zaliv"], "tvrdnja": "Obala Španije je veoma razuđena, sa mnogo zaliva i ostrva uz kopno.", "tacno": false, "ispravke": [{"tekst": "Obala je slabo razuđena; najveći zaliv je Biskajski.", "tacan": true}, {"tekst": "Obala je razuđena samo na Atlantiku, gde je najveći zaliv Venecijanski.", "tacan": false}, {"tekst": "Španija nema nijedan zaliv.", "tacan": false}], "pomoc": ["Na karti je obala Španije uglavnom glatka, bez mnogo uvala.", "Postoji jedan veliki zaliv na severu.", "Iz lekcije: obala je slabo razuđena, najveći zaliv je Biskajski."], "objasnjenje": "Netačno — obala Španije je slabo razuđena; najveći zaliv je Biskajski na severu.", "iz_udzbenika": {"strana": 35, "odeljak": "Obala", "tekst": "Obala Španije je slabo razuđena, a najveći zaliv je Biskajski."}, "lekcija": 11}, {"id": "l11-reljef-klik-biskajski", "vrsta": "karta_klik", "tezina": "srednje", "pojmovi": ["biskajski-zaliv", "atlantski-okean"], "pitanje": "Klikni na Biskajski zaliv.", "cilj": {"mesto": "biskajski-zaliv"}, "pomoc": ["Zaliv je deo Atlantskog okeana.", "Nalazi se severno od Španije, a istočno od njega je obala Francuske.", "Klikni na more između severne obale Španije i zapadne obale Francuske."], "objasnjenje": "Biskajski zaliv je u Atlantiku, između severne obale Španije i Francuske.", "iz_udzbenika": {"strana": 36, "odeljak": "Zadatak — nema karta", "tekst": "Na nemoj karti Biskajski zaliv je pod brojem 14, severno od Kantabrijskih planina.", "slika": "11-spanija/02-fizicka-karta-spanije.jpg"}, "lekcija": 11}, {"id": "l11-reljef-izbor-nizije", "vrsta": "izbor", "tezina": "srednje", "pojmovi": ["andaluzija", "aragonija"], "pitanje": "Koje se nizije Španije po površini najviše ističu? (Više tačnih.)", "odgovori": [{"tekst": "Andaluzija", "tacan": true}, {"tekst": "Aragonija", "tacan": true}, {"tekst": "Mezeta", "tacan": false}, {"tekst": "Panonska nizija", "tacan": false}, {"tekst": "Padska nizija", "tacan": false}], "pomoc": ["Mezeta je povišena — to je visoravan, a ne nizija.", "Panonska i Padska nizija nisu u Španiji.", "Iz lekcije: ističu se Andaluzija (Gvadalkivir) i Aragonija (Ebro)."], "objasnjenje": "Najveće nizije su Andaluzija u dolini Gvadalkivira i Aragonija u dolini Ebra. Mezeta je visoravan.", "iz_udzbenika": {"strana": 35, "odeljak": "Nizije", "tekst": "Nizije su samo u priobalju; po površini se ističu Andaluzija u dolini Gvadalkivira i Aragonija u dolini Ebra.", "slika": "11-spanija/03-andaluzija.jpg"}, "lekcija": 11}, {"id": "l11-reljef-povezi-nizije", "vrsta": "povezi", "tezina": "srednje", "pojmovi": ["andaluzija", "aragonija", "mezeta", "gvadalkivir", "ebro"], "pitanje": "Poveži oblik reljefa sa opisom.", "parovi": [["Andaluzija", "nizija u dolini Gvadalkivira"], ["Aragonija", "nizija u dolini Ebra"], ["Mezeta", "visoravan u središtu Španije"], ["Kantabrijske planine", "planine na severozapadu, uz Biskajski zaliv"]], "pomoc": ["Andaluzija je na jugu, a Aragonija na severoistoku.", "Ebro teče na severoistoku, a Gvadalkivir na jugu.", "Iz lekcije: Andaluzija — Gvadalkivir; Aragonija — Ebro; Mezeta — središte."], "objasnjenje": "Andaluzija — Gvadalkivir; Aragonija — Ebro; Mezeta — središnja visoravan; Kantabrijske planine — severozapad.", "iz_udzbenika": {"strana": 35, "odeljak": "Reljef i nizije", "tekst": "U središtu je Mezeta, a nizije su Andaluzija u dolini Gvadalkivira i Aragonija u dolini Ebra.", "slika": "11-spanija/05-ebro-aragonija.jpg"}, "lekcija": 11}, {"id": "l11-reljef-klik-aragonija", "vrsta": "karta_klik", "tezina": "srednje", "pojmovi": ["aragonija", "ebro"], "pitanje": "Klikni na niziju Aragoniju.", "cilj": {"mesto": "aragonija"}, "pomoc": ["Aragonija je na severoistoku Španije.", "Leži u dolini reke Ebro, oko Saragose, južno od Pirineja.", "Klikni između Pirineja i Iberijskih planina."], "objasnjenje": "Aragonija je nizija u dolini Ebra, oko Saragose.", "iz_udzbenika": {"strana": 36, "odeljak": "Zadatak — nema karta", "tekst": "Na nemoj karti Aragonija je pod brojem 12 — zelena nizija uz Ebro na severoistoku.", "slika": "11-spanija/05-ebro-aragonija.jpg"}, "lekcija": 11}, {"id": "l11-reljef-klik-majorka", "vrsta": "karta_klik", "tezina": "srednje", "pojmovi": ["majorka", "balearska-ostrva"], "pitanje": "Klikni na ostrvo Majorku.", "cilj": {"mesto": "majorka"}, "pomoc": ["Majorka je deo Balearskih ostrva.", "To je najveće ostrvo te grupe, u njenoj sredini.", "Klikni na najveće ostrvo istočno od Valensije."], "objasnjenje": "Majorka je najveće Balearsko ostrvo; Menorka je severoistočno, a Ibica jugozapadno od nje.", "iz_udzbenika": {"strana": 35, "odeljak": "Ostrva", "tekst": "Balearsku grupu čine Ibica, Majorka i Menorka, u Sredozemnom moru."}, "lekcija": 11}, {"id": "l11-reljef-klik-menorka", "vrsta": "karta_klik", "tezina": "tesko", "pojmovi": ["menorka", "balearska-ostrva"], "pitanje": "Klikni na ostrvo Menorku.", "cilj": {"mesto": "menorka"}, "pomoc": ["Menorka je jedno od tri Balearska ostrva.", "Ona je najistočnija i leži severoistočno od Majorke.", "Klikni na manje ostrvo desno od Majorke."], "objasnjenje": "Menorka je najistočnije Balearsko ostrvo, severoistočno od Majorke.", "iz_udzbenika": {"strana": 35, "odeljak": "Ostrva", "tekst": "Balearsku grupu u Sredozemnom moru čine Ibica, Majorka i Menorka."}, "lekcija": 11}, {"id": "l11-reljef-klik-gibraltar", "vrsta": "karta_klik", "tezina": "srednje", "pojmovi": ["gibraltarski-moreuz"], "pitanje": "Klikni na Gibraltarski moreuz.", "cilj": {"mesto": "gibraltarski-moreuz"}, "pomoc": ["Moreuz je na krajnjem jugu Španije.", "On spaja Atlantski okean i Sredozemno more i odvaja Evropu od Afrike.", "Klikni na najuži deo mora između Španije i Maroka."], "objasnjenje": "Gibraltarski moreuz je na jugu, između Španije i Maroka; spaja Atlantik i Sredozemlje.", "iz_udzbenika": {"strana": 36, "odeljak": "Zadatak — nema karta", "tekst": "Na nemoj karti Gibraltarski moreuz je pod brojem 16, na najjužnijem delu poluostrva, prema Africi.", "slika": "11-spanija/02-fizicka-karta-spanije.jpg"}, "lekcija": 11}, {"id": "l11-reljef-gde-pirineji", "vrsta": "gde_sam", "tezina": "srednje", "pojmovi": ["pirineji", "planinska-klima"], "pitanje": "Gde sam? Pročitaj trag i klikni mesto na karti.", "cilj": {"mesto": "pirineji"}, "tragovi": ["Na mojim visinama vlada planinska klima, a u dolinama su jezera i četinari.", "U ukrštenici „Ponovi” moje ime ima osam slova.", "Pružam se od Biskajskog zaliva do Sredozemnog mora.", "Ja sam najviša planina Španije, na granici sa Francuskom."], "objasnjenje": "Pirineji — najviše planine Španije, na severoistoku, na granici sa Francuskom.", "iz_udzbenika": {"strana": 35, "odeljak": "Reljef", "tekst": "Pirineji su najviše planine Španije, na severoistoku; na fotografiji su strmi snežni vrhovi i jezero u dolini.", "slika": "11-spanija/04-pirineji.jpg"}, "lekcija": 11}, {"id": "l11-reljef-zakljuci-nizije", "vrsta": "zakljuci", "slika_u_pitanju": true, "tezina": "srednje", "pojmovi": ["andaluzija", "aragonija", "mezeta"], "pitanje": "Tražiš na karti Španije zelene površine (nizije). Gde ćeš ih naći?", "odgovori": [{"tekst": "Samo u priobalju i u dolinama većih reka, kao što su Gvadalkivir i Ebro.", "tacan": true}, {"tekst": "U samom središtu zemlje, oko Madrida.", "tacan": false}, {"tekst": "Na vrhovima Pirineja.", "tacan": false}, {"tekst": "Svuda podjednako, jer je Španija ravna zemlja.", "tacan": false}], "pomoc": ["Korak 1: Središte Španije je visoravan — da li je to nizija?", "Korak 2: Španija je pretežno planinska, pa nizije moraju biti uz more ili uz reke.", "Iz lekcije: nizije su samo u priobalju; ističu se Andaluzija i Aragonija."], "objasnjenje": "Španija je pretežno planinska; nizije su uz obalu i u dolinama Gvadalkivira (Andaluzija) i Ebra (Aragonija).", "iz_udzbenika": {"strana": 35, "odeljak": "Nizije", "tekst": "Nizije su samo u priobalju; najveće su Andaluzija i Aragonija. Na karti su zelene, uz Gvadalkivir na jugu i Ebro na severoistoku.", "slika": "11-spanija/02-fizicka-karta-spanije.jpg"}, "lekcija": 11}, {"id": "l11-reljef-klik-sijera-morena", "vrsta": "karta_klik", "tezina": "tesko", "pojmovi": ["sijera-morena", "mezeta", "gvadalkivir"], "pitanje": "Klikni na planinu Sijera Morenu.", "cilj": {"mesto": "sijera-morena"}, "pomoc": ["Sijera Morena je južni rub Mezete.", "Nalazi se severno od doline Gvadalkivira, a severozapadno od Betijskih planina.", "Klikni između Madrida i Sevilje, bliže Sevilji."], "objasnjenje": "Sijera Morena je na južnom rubu Mezete, iznad doline Gvadalkivira.", "iz_udzbenika": {"strana": 36, "odeljak": "Zadatak — nema karta", "tekst": "Na nemoj karti Sijera Morena je pod brojem 11; između nje i Kastiljskih planina je Mezeta.", "slika": "11-spanija/02-fizicka-karta-spanije.jpg"}, "lekcija": 11}, {"id": "l11-reljef-klik-kastiljske", "vrsta": "karta_klik", "tezina": "tesko", "pojmovi": ["kastiljske-planine", "mezeta"], "pitanje": "Klikni na Kastiljske planine.", "cilj": {"mesto": "kastiljske-planine"}, "pomoc": ["Kastiljske planine su u središnjem delu Španije.", "Nalaze se malo severozapadno od Madrida i čine severni rub Mezete.", "Klikni tik iznad (severozapadno od) Madrida."], "objasnjenje": "Kastiljske planine su u središtu Španije, severozapadno od Madrida; Mezeta je između njih i Sijera Morene.", "iz_udzbenika": {"strana": 35, "odeljak": "Reljef", "tekst": "Iberijske i Kastiljske planine su u središnjem delu Španije; između Kastiljskih planina i Sijera Morene je Mezeta."}, "lekcija": 11}, {"id": "l11-reljef-klik-ibica", "vrsta": "karta_klik", "tezina": "tesko", "pojmovi": ["ibica", "balearska-ostrva"], "pitanje": "Klikni na ostrvo Ibicu.", "cilj": {"mesto": "ibica"}, "pomoc": ["Ibica pripada Balearskim ostrvima.", "To je ostrvo najbliže obali Španije, jugozapadno od Majorke.", "Klikni na manje ostrvo između Valensije i Majorke."], "objasnjenje": "Ibica je Balearsko ostrvo najbliže kopnu, jugozapadno od Majorke.", "iz_udzbenika": {"strana": 36, "odeljak": "Zadatak — nema karta", "tekst": "Na nemoj karti Ibica je pod brojem 15 — jedno od Balearskih ostrva.", "slika": "11-spanija/02-fizicka-karta-spanije.jpg"}, "lekcija": 11}, {"id": "l11-reljef-tn-mezeta-granice", "vrsta": "tacno_netacno", "tezina": "tesko", "pojmovi": ["mezeta", "kastiljske-planine", "sijera-morena"], "tvrdnja": "Visoravan Mezeta se uzdiže između Kantabrijskih i Betijskih planina.", "tacno": false, "ispravke": [{"tekst": "Mezeta je između Kastiljskih planina i Sijera Morene.", "tacan": true}, {"tekst": "Mezeta je između Pirineja i Iberijskih planina.", "tacan": false}, {"tekst": "Mezeta je između Betijskih planina i Sredozemnog mora.", "tacan": false}], "pomoc": ["Kantabrijske planine su na severozapadu, a Betijske na jugoistoku — to su krajevi zemlje, ne središte.", "Traži dve planine koje su bliže Madridu — jednu severno, drugu južno od njega.", "Iz lekcije: između Kastiljskih planina i Sijera Morene uzdiže se Mezeta."], "objasnjenje": "Netačno — Mezeta je između Kastiljskih planina (sever) i Sijera Morene (jug).", "iz_udzbenika": {"strana": 35, "odeljak": "Reljef", "tekst": "Između Kastiljskih planina i Sijera Morene uzdiže se visoravan Mezeta, na kojoj je Madrid."}, "lekcija": 11}, {"id": "l11-reljef-dopuni-planine", "vrsta": "dopuni", "tezina": "tesko", "pojmovi": ["kantabrijske-planine", "betijske-planine", "sijera-morena"], "pitanje": "Dopuni rečenicu (bez ponuđenih reči).", "tekst": "Na severozapadu Španije su {{Kantabrijske}} planine, a na jugu i jugoistoku {{Betijske}} planine i {{Sijera Morena|Sijera-Morena|Sijera Moreni}}.", "pomoc": ["Planine na severozapadu nose ime oblasti uz Biskajski zaliv (Kantabrija).", "Na jugu su dve planine — jedna je „planina“, a druga ima špansko ime koje počinje sa „Sijera“.", "Iz lekcije: Kantabrijske (SZ); Sijera Morena i Betijske (JI)."], "objasnjenje": "Kantabrijske planine su na severozapadu, a Betijske planine i Sijera Morena na jugu i jugoistoku.", "iz_udzbenika": {"strana": 35, "odeljak": "Reljef", "tekst": "Kantabrijske planine su na severozapadu, a Sijera Morena i Betijske planine na jugoistoku Španije."}, "lekcija": 11}, {"id": "l11-reljef-gde-mezeta", "vrsta": "gde_sam", "tezina": "tesko", "pojmovi": ["mezeta", "stepa", "kontinentalna-klima"], "pitanje": "Gde sam? Pročitaj trag i klikni mesto na karti.", "cilj": {"mesto": "mezeta"}, "tragovi": ["Nagnuta sam ka zapadu, pa većina velikih reka sa mene teče ka Atlantiku.", "Planine mi zadržavaju vlagu sa okeana, pa su na meni stepe i kontinentalna klima.", "Uzdižem se između Kastiljskih planina i Sijera Morene.", "Ja sam visoravan u središtu Španije, a na meni je Madrid."], "objasnjenje": "Mezeta — visoravan u središtu Španije, sa kontinentalnom klimom i stepama.", "iz_udzbenika": {"strana": 35, "odeljak": "Reljef i klima", "tekst": "Mezeta je visoravan između Kastiljskih planina i Sijera Morene; zbog malo vlage ima kontinentalnu klimu i stepe."}, "lekcija": 11}]}, {"naslov": "Klima, vegetacija i reke", "zadaci": [{"id": "l11-klima-izbor-tipovi", "vrsta": "izbor", "tezina": "lako", "pojmovi": ["atlantska-klima", "kontinentalna-klima", "sredozemna-klima", "planinska-klima"], "pitanje": "Koji tipovi klime postoje u Španiji? (Više tačnih.)", "odgovori": [{"tekst": "atlantska (okeanska)", "tacan": true}, {"tekst": "kontinentalna", "tacan": true}, {"tekst": "sredozemna", "tacan": true}, {"tekst": "planinska", "tacan": true}, {"tekst": "tropska", "tacan": false}, {"tekst": "polarna", "tacan": false}], "pomoc": ["Španija je u umerenom pojasu — nema ni prašuma ni leda.", "Tačna su četiri odgovora — okean, unutrašnjost, more i visoke planine daju svaka po jedan tip.", "Iz lekcije: atlantska, kontinentalna, sredozemna i planinska klima."], "objasnjenje": "U Španiji su atlantska (SZ), kontinentalna (Mezeta), sredozemna (istočno primorje) i planinska klima (Pirineji, Betijske planine).", "iz_udzbenika": {"strana": 35, "odeljak": "Već smo učili — klima", "tekst": "Zbog položaja između Atlantika i Sredozemlja i visoravni u unutrašnjosti, u Španiji su atlantska, sredozemna, kontinentalna i planinska klima."}, "lekcija": 11}, {"id": "l11-klima-dopuni-zelena", "vrsta": "dopuni", "tezina": "lako", "pojmovi": ["atlantska-klima", "zelena-spanija"], "pitanje": "Dopuni rečenicu rečima iz banke.", "tekst": "Na severozapadu vlada {{atlantska|okeanska}} klima sa bujnom listopadnom vegetacijom, pa se taj deo zove „{{zelena}} Španija”.", "ponudjene": ["atlantska", "zelena", "sredozemna", "žuta"], "pomoc": ["Severozapad je okrenut ka okeanu.", "Mnogo kiše znači bujno zelenilo.", "Iz lekcije: atlantska klima — „zelena Španija”."], "objasnjenje": "Atlantik donosi mnogo kiše na severozapad, pa tamo raste bujna vegetacija — „zelena Španija”.", "iz_udzbenika": {"strana": 35, "odeljak": "Klima i vegetacija", "tekst": "Severozapad ima atlantsku klimu sa mnogo padavina i bujnom listopadnom vegetacijom; zato se zove „zelena Španija”."}, "lekcija": 11}, {"id": "l11-klima-tn-stepa", "vrsta": "tacno_netacno", "tezina": "lako", "pojmovi": ["mezeta", "stepa", "kontinentalna-klima"], "tvrdnja": "Na Mezeti vlada kontinentalna klima, a prirodna vegetacija su stepe.", "tacno": true, "pomoc": ["Mezeta je u unutrašnjosti, daleko od mora.", "Kad nema dovoljno vlage, umesto šuma raste trava.", "Iz lekcije: unutrašnjost ima kontinentalnu klimu i stepe."], "objasnjenje": "Tačno — Mezeta nema dovoljno vlage, pa ima kontinentalnu klimu i stepe.", "iz_udzbenika": {"strana": 35, "odeljak": "Klima i vegetacija", "tekst": "Unutrašnjost Španije (Mezeta) nema dovoljno vlage, pa ima kontinentalnu klimu; prirodna vegetacija su stepe."}, "lekcija": 11}, {"id": "l11-klima-zakljuci-valensija", "vrsta": "zakljuci", "tezina": "lako", "pojmovi": ["sredozemna-klima", "valensija"], "pitanje": "Valensija leži na istočnoj obali Španije, uz Sredozemno more. Koji tip klime tu vlada?", "odgovori": [{"tekst": "sredozemna", "tacan": true}, {"tekst": "polarna", "tacan": false}, {"tekst": "planinska", "tacan": false}, {"tekst": "tropska", "tacan": false}], "pomoc": ["Korak 1: Koje more je uz istočnu obalu Španije?", "Korak 2: Klima obično nosi ime po moru koje na nju utiče.", "Iz lekcije: istočni primorski delovi su pod uticajem Sredozemnog mora — sredozemna klima."], "objasnjenje": "Istočno primorje (sa Valensijom) ima sredozemnu klimu i sredozemnu vegetaciju.", "iz_udzbenika": {"strana": 35, "odeljak": "Klima i vegetacija", "tekst": "Istočni, primorski delovi Španije su pod uticajem Sredozemnog mora, pa imaju sredozemnu klimu i vegetaciju."}, "lekcija": 11}, {"id": "l11-klima-zakljuci-zelena", "vrsta": "zakljuci", "tezina": "lako", "pojmovi": ["zelena-spanija", "atlantska-klima"], "pitanje": "Zašto je severozapad Španije toliko zelen?", "odgovori": [{"tekst": "Sa Atlantika stižu vlažne vazdušne mase i donose mnogo kiše.", "tacan": true}, {"tekst": "Tamo je najtoplije u celoj Španiji.", "tacan": false}, {"tekst": "Tamo vlada sredozemna klima sa sušnim letima.", "tacan": false}, {"tekst": "Tamo su najviše planine sa lednicima.", "tacan": false}], "pomoc": ["Korak 1: Šta je biljkama potrebno da bujno rastu?", "Korak 2: Odakle severozapad dobija tu vlagu?", "Iz lekcije: Atlantik donosi mnogo padavina, pa raste bujna listopadna vegetacija."], "objasnjenje": "Severozapad prima mnogo kiše sa Atlantika, pa tu rastu listopadne šume — „zelena Španija”.", "iz_udzbenika": {"strana": 35, "odeljak": "Klima i vegetacija", "tekst": "Atlantski okean donosi severozapadu mnogo padavina, pa je vegetacija bujna i listopadna."}, "lekcija": 11}, {"id": "l11-reke-izbor-ebro", "vrsta": "izbor", "tezina": "lako", "pojmovi": ["ebro", "sredozemno-more"], "pitanje": "Koja je najveća reka Španije u slivu Sredozemnog mora?", "odgovori": [{"tekst": "Ebro", "tacan": true}, {"tekst": "Taho", "tacan": false}, {"tekst": "Duero", "tacan": false}, {"tekst": "Dunav", "tacan": false}], "pomoc": ["Ova reka teče na severoistoku, kroz Aragoniju.", "Taho i Duero teku ka Atlantiku, a Dunav nije u Španiji.", "Iz lekcije: najveća reka sliva Sredozemnog mora je Ebro."], "objasnjenje": "Ebro teče kroz Aragoniju i Saragosu i uliva se u Sredozemno more.", "iz_udzbenika": {"strana": 36, "odeljak": "Reke", "tekst": "Najveća reka Španije u slivu o more.", "iz_udzbenika": {"strana": 36, "odeljak": "Zadatak — nema karta", "tekst": "Na nemoj karti Ebro je pod brojem 5 — reka na severoistoku koja teče ka Sredozemnom moru.", "slika": "11-spanija/02-fizicka-karta-spanije.jpg"}, "lekcija": 11}, {"id": "l11-klima-povezi-tipovi", "vrsta": "povezi", "tezina": "srednje", "pojmovi": ["atlantska-klima", "kontinentalna-klima", "sredozemna-klima", "planinska-klima"], "pitanje": "Poveži deo Španije sa tipom klime.", "parovi": [["severozapad („zelena Španija”)", "atlantska klima"], ["Mezeta", "kontinentalna klima"], ["istočno primorje", "sredozemna klima"], ["Pirineji i Betijske planine", "planinska klima"]], "pomoc": ["Klima uz obalu dobija ime po vodi koja je oblikuje.", "Unutrašnjost je daleko od mora, a visoki vrhovi imaju svoju klimu.", "Iz lekcije: SZ atlantska, Mezeta kontinentalna, istok sredozemna, visoke planine planinska."], "objasnjenje": "Severozapad — atlantska; Mezeta — kontinentalna; istočno primorje — sredozemna; Pirineji i Betijske planine — planinska klima.", "iz_udzbenika": {"strana": 35, "odeljak": "Klima i vegetacija", "tekst": "Severozapad ima atlantsku, Mezeta kontinentalnu, istočno primorje sredozemnu, a Pirineji i Betijske planine planinsku klimu."}, "lekcija": 11}, {"id": "l11-klima-tn-sredozemna", "vrsta": "tacno_netacno", "tezina": "srednje", "pojmovi": ["sredozemna-klima", "atlantska-klima"], "tvrdnja": "Sredozemna klima vlada na severozapadu Španije, uz Biskajski zaliv.", "tacno": false, "ispravke": [{"tekst": "Sredozemna klima je u istočnim primorskim delovima; severozapad ima atlantsku klimu.", "tacan": true}, {"tekst": "Sredozemna klima vlada na Mezeti.", "tacan": false}, {"tekst": "Sredozemne klime u Španiji uopšte nema.", "tacan": false}], "pomoc": ["Biskajski zaliv je deo Atlantskog okeana, a ne Sredozemnog mora.", "Sredozemno more je uz istočnu obalu.", "Iz lekcije: severozapad — atlantska; istočno primorje — sredozemna klima."], "objasnjenje": "Netačno — severozapad ima atlantsku klimu
