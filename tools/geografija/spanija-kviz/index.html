Gvadalkivir teče kroz Andaluziju i Sevilju i uliva se u Atlantik.", "iz_udzbenika": {"strana": 36, "odeljak": "Zadatak — nema karta", "tekst": "Na nemoj karti Gvadalkivir je pod brojem 1 — reka na jugu koja teče kroz zelenu niziju Andaluziju.", "slika": "11-spanija/02-fizicka-karta-spanije.jpg"}, "lekcija": 11}, {"id": "l11-reke-klik-duero", "vrsta": "karta_klik", "tezina": "srednje", "pojmovi": ["duero"], "pitanje": "Klikni na reku Duero.", "cilj": {"mesto": "duero"}, "pomoc": ["Duero je najsevernija od velikih reka koje teku ka Atlantiku.", "Teče severnim delom Mezete, pa kroz Portugaliju.", "Klikni na severni deo Mezete, južno od Kantabrijskih planina."], "objasnjenje": "Duero teče preko severnog dela Mezete i kroz Portugaliju u Atlantik.", "iz_udzbenika": {"strana": 36, "odeljak": "Zadatak — nema karta", "tekst": "Na nemoj karti Duero je pod brojem 4 — jedna od četiri velike reke atlantskog sliva.", "slika": "11-spanija/02-fizicka-karta-spanije.jpg"}, "lekcija": 11}, {"id": "l11-reke-klik-taho", "vrsta": "karta_klik", "tezina": "srednje", "pojmovi": ["taho"], "pitanje": "Klikni na reku Taho.", "cilj": {"mesto": "taho"}, "pomoc": ["Taho teče kroz središnji deo Španije, južno od Madrida.", "Teče ka zapadu, kroz Portugaliju (gde se zove Težo) do Atlantika.", "Klikni jugozapadno od Madrida, između Duera i Gvadijane."], "objasnjenje": "Taho teče središtem Mezete ka zapadu i u Portugaliji (kao Težo) se uliva u Atlantik.", "iz_udzbenika": {"strana": 36, "odeljak": "Zadatak — nema karta", "tekst": "Na nemoj karti Taho je pod brojem 3 — reka u središtu zemlje koja teče ka Portugaliji.", "slika": "11-spanija/02-fizicka-karta-spanije.jpg"}, "lekcija": 11}, {"id": "l11-reke-gde-ebro", "vrsta": "gde_sam", "tezina": "srednje", "pojmovi": ["ebro", "aragonija", "saragosa"], "pitanje": "Gde sam? Pročitaj trag i klikni mesto na karti.", "cilj": {"mesto": "ebro"}, "tragovi": ["Pravim brojne vijuge kroz suv, smeđkast predeo.", "Protičem kroz Saragosu.", "U mojoj dolini je nizija Aragonija.", "Ja sam najveća reka Španije koja se uliva u Sredozemno more."], "objasnjenje": "Ebro — teče kroz Aragoniju i Saragosu i uliva se u Sredozemno more.", "iz_udzbenika": {"strana": 36, "odeljak": "Reke", "tekst": "Ebro vijuga kroz suvu Aragoniju i najveća je reka sliva Sredozemnog mora.", "slika": "11-spanija/05-ebro-aragonija.jpg"}, "lekcija": 11}, {"id": "l11-klima-zakljuci-kantabrijske", "vrsta": "zakljuci", "tezina": "tesko", "pojmovi": ["kantabrijske-planine", "mezeta", "kontinentalna-klima", "stepa"], "pitanje": "Severozapad Španije je „zelen”, a Mezeta, koja nije daleko, pokrivena je stepama. Šta je glavni uzrok te razlike?", "odgovori": [{"tekst": "Kantabrijske planine zaustavljaju vlažne vazdušne mase sa Atlantika, pa unutrašnjost ostaje suva.", "tacan": true}, {"tekst": "Mezeta je pod uticajem Sredozemnog mora, koje donosi sušu.", "tacan": false}, {"tekst": "Na Mezeti je tlo previše slano za drveće.", "tacan": false}, {"tekst": "Mezeta je mnogo južnije, u tropskom pojasu.", "tacan": false}], "pomoc": ["Korak 1: Odakle severozapad dobija vlagu?", "Korak 2: Šta se nalazi između obale i unutrašnjosti i može da „uhvati” oblake?", "Iz lekcije: Kantabrijske planine zaustavljaju vlažan vazduh, pa Mezeta ima kontinentalnu klimu i stepe."], "objasnjenje": "Kantabrijske planine zadržavaju vlažne mase sa okeana; zato je severozapad kišovit, a Mezeta suva, sa stepama.", "iz_udzbenika": {"strana": 35, "odeljak": "Klima i vegetacija", "tekst": "Kantabrijske planine sprečavaju prodor vlažnih vazdušnih masa sa okeana ka unutrašnjosti, pa Mezeta ima kontinentalnu klimu i stepe."}, "lekcija": 11}, {"id": "l11-klima-dopuni-kantabrijske", "vrsta": "dopuni", "tezina": "tesko", "pojmovi": ["kantabrijske-planine", "kontinentalna-klima", "stepa"], "pitanje": "Dopuni rečenicu (bez ponuđenih reči).", "tekst": "{{Kantabrijske}} planine zaustavljaju vlažan vazduh sa Atlantika, pa na Mezeti vlada {{kontinentalna}} klima, a prirodna vegetacija su {{stepe|stepa}}.", "pomoc": ["Planine koje zadržavaju vlagu su na severozapadu, uz Biskajski zaliv.", "Klima unutrašnjosti je ista kao u Vojvodini; vegetacija je travnata.", "Iz lekcije: Kantabrijske planine — kontinentalna klima — stepe."], "objasnjenje": "Kantabrijske planine zadržavaju vlagu, pa Mezeta ima kontinentalnu klimu i stepe.", "iz_udzbenika": {"strana": 35, "odeljak": "Klima i vegetacija", "tekst": "Bez dovoljno vlage unutrašnjost ima kontinentalnu klimu, a prirodna vegetacija su stepe."}, "lekcija": 11}, {"id": "l11-reke-izbor-atlantski", "vrsta": "izbor", "tezina": "tesko", "pojmovi": ["gvadalkivir", "gvadijana", "taho", "duero", "ebro", "atlantski-okean"], "pitanje": "Koje reke Španije pripadaju slivu Atlantskog okeana? (Više tačnih.)", "odgovori": [{"tekst": "Gvadalkivir", "tacan": true}, {"tekst": "Gvadijana", "tacan": true}, {"tekst": "Taho", "tacan": true}, {"tekst": "Duero", "tacan": true}, {"tekst": "Ebro", "tacan": false}], "pomoc": ["Pogledaj kuda teku reke — ka zapadu (okean) ili ka istoku (more).", "Samo jedna od ponuđenih teče ka istoku, kroz Aragoniju.", "Iz lekcije: Gvadalkivir, Gvadijana, Taho i Duero → Atlantik; Ebro → Sredozemno more."], "objasnjenje": "Gvadalkivir, Gvadijana, Taho i Duero teku u Atlantik; Ebro je jedini veliki tok sredozemnog sliva.", "iz_udzbenika": {"strana": 36, "odeljak": "Reke", "tekst": "Najveći tokovi sliva Atlantskog okeana su Gvadalkivir, Gvadijana, Taho i Duero; u slivu Sredozemnog mora najveći je Ebro."}, "lekcija": 11}, {"id": "l11-reke-klik-gvadijana", "vrsta": "karta_klik", "tezina": "tesko", "pojmovi": ["gvadijana", "portugalija"], "pitanje": "Klikni na reku Gvadijanu.", "cilj": {"mesto": "gvadijana"}, "pomoc": ["Gvadijana teče ka Atlantiku, između Taha i Gvadalkivira.", "U donjem toku čini deo granice sa Portugalijom, na jugozapadu.", "Klikni na jugozapad Španije, blizu granice sa Portugalijom, severno od Sevilje."], "objasnjenje": "Gvadijana teče jugozapadom Španije, delom duž granice sa Portugalijom, i uliva se u Atlantik.", "iz_udzbenika": {"strana": 36, "odeljak": "Zadatak — nema karta", "tekst": "Na nemoj karti Gvadijana je pod brojem 2 — reka atlantskog sliva između Taha i Gvadalkivira.", "slika": "11-spanija/02-fizicka-karta-spanije.jpg"}, "lekcija": 11}, {"id": "l11-reke-zakljuci-gusca", "vrsta": "zakljuci", "tezina": "tesko", "pojmovi": ["mezeta", "atlantski-okean"], "pitanje": "Zašto je rečna mreža Španije gušća na zapadu nego na istoku?", "odgovori": [{"tekst": "Zapad prima više padavina sa Atlantika, a Mezeta je nagnuta ka zapadu, pa većina reka teče ka okeanu.", "tacan": true}, {"tekst": "Na istoku su najviše planine, pa reke ne mogu da teku.", "tacan": false}, {"tekst": "Sredozemno more je slano, pa reke izbegavaju istok.", "tacan": false}, {"tekst": "Na istoku vlada polarna klima i reke su zamrznute.", "tacan": false}], "pomoc": ["Korak 1: Odakle dolazi najviše kiše u Španiji?", "Korak 2: Na koju stranu je nagnuta velika središnja visoravan?", "Iz lekcije: više padavina sa Atlantika i nagib Mezete ka zapadu."], "objasnjenje": "Zapad dobija više kiše sa Atlantika, a Mezeta se spušta ka zapadu, pa četiri velike reke teku u Atlantik.", "iz_udzbenika": {"strana": 36, "odeljak": "Reke", "tekst": "Pitanje u tekstu traži objašnjenje guste rečne mreže na zapadu — tamo pada više kiše sa Atlantika, a visoravan je nagnuta ka zapadu."}, "lekcija": 11}, {"id": "l11-reke-gde-gvadalkivir", "vrsta": "gde_sam", "tezina": "tesko", "pojmovi": ["gvadalkivir", "andaluzija", "sevilja"], "pitanje": "Gde sam? Pročitaj trag i klikni mesto na karti.", "cilj": {"mesto": "gvadalkivir"}, "tragovi": ["Uz mene na fotografiji iz udžbenika rastu maslinjaci.", "Na mojim obalama se igra flamenko — protičem kroz Sevilju.", "Moja dolina je nizija Andaluzija, a tečem ispod Sijera Morene.", "Ja sam reka na jugu Španije koja se uliva u Atlantski okean."], "objasnjenje": "Gvadalkivir — reka Andaluzije i Sevilje, atlantskog sliva.", "iz_udzbenika": {"strana": 35, "odeljak": "Nizije i reke", "tekst": "Andaluzija je nizija u dolini Gvadalkivira, na jugu Španije, sa maslinjacima i njivama.", "slika": "11-spanija/03-andaluzija.jpg"}, "lekcija": 11}]}, {"naslov": "Stanovništvo i gradovi", "zadaci": [{"id": "l11-stanovnistvo-izbor-narod", "vrsta": "izbor", "tezina": "lako", "pojmovi": ["romani"], "pitanje": "Kojoj grupi naroda pripadaju Španci?", "odgovori": [{"tekst": "romanskim narodima", "tacan": true}, {"tekst": "slovenskim narodima", "tacan": false}, {"tekst": "germanskim narodima", "tacan": false}, {"tekst": "ugro-finskim narodima", "tacan": false}], "pomoc": ["Španski jezik potiče od latinskog, kao i italijanski.", "Slovenski su npr. Srbi, a germanski Nemci.", "Iz lekcije: Španci su romanski narod."], "objasnjenje": "Španci su romanski narod, kao Italijani i Portugalci.", "iz_udzbenika": {"strana": 36, "odeljak": "Već smo učili — narodi", "tekst": "Podsetnik iz lekcije o Južnoj Evropi — Španci pripadaju romanskim narodima."}, "lekcija": 11}, {"id": "l11-stanovnistvo-izbor-vera", "vrsta": "izbor", "tezina": "lako", "pojmovi": ["katolicanstvo"], "pitanje": "Koja vera preovlađuje u Španiji?", "odgovori": [{"tekst": "katoličanstvo", "tacan": true}, {"tekst": "pravoslavlje", "tacan": false}, {"tekst": "islam", "tacan": false}, {"tekst": "budizam", "tacan": false}], "pomoc": ["Kao i u Italiji, preovlađuje zapadna hrišćanska crkva.", "Pravoslavlje preovlađuje na istoku Evrope.", "Iz lekcije: preovlađuje katoličanstvo."], "objasnjenje": "U Španiji preovlađuje katoličanstvo.", "iz_udzbenika": {"strana": 36, "odeljak": "Već smo učili — vera", "tekst": "Podsetnik — u Španiji preovlađuje katolička vera."}, "lekcija": 11}, {"id": "l11-stanovnistvo-tn-romani", "vrsta": "tacno_netacno", "tezina": "lako", "pojmovi": ["romani"], "tvrdnja": "Španci su slovenski narod.", "tacno": false, "ispravke": [{"tekst": "Španci su romanski narod.", "tacan": true}, {"tekst": "Španci su germanski narod.", "tacan": false}, {"tekst": "Španci su semitski narod.", "tacan": false}], "pomoc": ["Slovenski narodi su npr. Srbi, Poljaci i Rusi.", "Španski je srodan italijanskom.", "Iz lekcije: Španci su romanski narod."], "objasnjenje": "Netačno — Španci su romanski narod.", "iz_udzbenika": {"strana": 36, "odeljak": "Već smo učili — narodi", "tekst": "Španci pripadaju romanskim narodima, a preovlađuje katolička vera."}, "lekcija": 11}, {"id": "l11-stanovnistvo-zakljuci-spanski", "vrsta": "zakljuci", "tezina": "lako", "pojmovi": ["imigracija"], "pitanje": "Zašto se španski jezik danas govori u mnogim zemljama Amerike?", "odgovori": [{"tekst": "Zbog kolonijalnih osvajanja Španije u prošlosti.", "tacan": true}, {"tekst": "Zato što je to najlakši jezik na svetu.", "tacan": false}, {"tekst": "Zato što su Amerikanci osnovali Španiju.", "tacan": false}, {"tekst": "Zato što se uči samo u školama.", "tacan": false}], "pomoc": ["Korak 1: Ko je posle velikih geografskih otkrića zauzeo velike delove Amerike?", "Korak 2: Kolonisti su sa sobom doneli svoj jezik.", "Iz lekcije: španski je raširen kolonijalnim osvajanjima."], "objasnjenje": "Španija je osvojila velike delove Amerike, pa se tamo i danas govori španski.", "iz_udzbenika": {"strana": 36, "odeljak": "Zanimljivosti", "tekst": "Španski jezik se kolonijalnim osvajanjima proširio po svetu i danas ga govori preko 485 miliona ljudi."}, "lekcija": 11}, {"id": "l11-stanovnistvo-izbor-grad", "vrsta": "izbor", "tezina": "lako", "pojmovi": ["valensija"], "pitanje": "Koji od ovih gradova je jedan od najvećih gradova Španije?", "odgovori": [{"tekst": "Valensija", "tacan": true}, {"tekst": "Lisabon", "tacan": false}, {"tekst": "Marsej", "tacan": false}, {"tekst": "Napulj", "tacan": false}], "pomoc": ["Lisabon je glavni grad Portugalije.", "Marsej je u Francuskoj, a Napulj u Italiji.", "Iz lekcije: najveći gradovi su Madrid, Barselona, Valensija, Sevilja, Saragosa i Malaga."], "objasnjenje": "Valensija je jedan od najvećih gradova Španije, na istočnoj obali.", "iz_udzbenika": {"strana": 36, "odeljak": "Gradovi", "tekst": "Najveći gradovi Španije su Madrid, Barselona, Valensija, Sevilja, Saragosa i Malaga."}, "lekcija": 11}, {"id": "l11-stanovnistvo-klik-barselona", "vrsta": "karta_klik", "tezina": "lako", "pojmovi": ["barselona"], "pitanje": "Klikni na Barselonu.", "cilj": {"mesto": "barselona"}, "pomoc": ["Barselona je na obali Sredozemnog mora.", "Nalazi se na severoistoku, nedaleko od Pirineja i granice sa Francuskom.", "Klikni na severoistočnu obalu Španije."], "objasnjenje": "Barselona je na severoistočnoj sredozemnoj obali Španije.", "iz_udzbenika": {"strana": 37, "odeljak": "Gradovi i turizam", "tekst": "Barselona je drugi veliki grad Španije i turistički centar, sa Sagradom familijom i Parkom Gvelj.", "slika": "11-spanija/07-sagrada-familija.jpg"}, "lekcija": 11}, {"id": "l11-stanovnistvo-klik-valensija", "vrsta": "karta_klik", "tezina": "lako", "pojmovi": ["valensija"], "pitanje": "Klikni na Valensiju.", "cilj": {"mesto": "valensija"}, "pomoc": ["Valensija je na istočnoj obali Španije.", "Nalazi se otprilike na istoj geografskoj širini kao Madrid, ali na moru.", "Klikni na istočnu obalu, zapadno od Balearskih ostrva."], "objasnjenje": "Valensija je na istočnoj, sredozemnoj obali Španije.", "iz_udzbenika": {"strana": 36, "odeljak": "Gradovi", "tekst": "Zadatak u tekstu traži da se u atlasu pronađu Madrid, Barselona, Valensija, Sevilja, Saragosa i Malaga."}, "lekcija": 11}, {"id": "l11-stanovnistvo-gde-madrid", "vrsta": "gde_sam", "tezina": "lako", "pojmovi": ["madrid", "mezeta"], "pitanje": "Gde sam? Pročitaj trag i klikni mesto na karti.", "cilj": {"mesto": "madrid"}, "tragovi": ["Oko mene je jedan od najgušće naseljenih delova zemlje.", "Turisti me često posećuju, a ležim daleko od mora.", "Nalazim se na visoravni Mezeti.", "Ja sam glavni grad Španije."], "objasnjenje": "Madrid — glavni grad Španije, na Mezeti, u njenom središtu.", "iz_udzbenika": {"strana": 36, "odeljak": "Stanovništvo", "tekst": "Najgušće su naseljeni sredozemno primorje i središnji deo zemlje oko glavnog grada Madrida."}, "lekcija": 11}, {"id": "l11-stanovnistvo-tn-imigranti", "vrsta": "tacno_netacno", "tezina": "srednje", "pojmovi": ["imigracija"], "tvrdnja": "Oko 10% stanovnika Španije su imigranti, uglavnom iz Latinske Amerike i sa severa Afrike.", "tacno": true, "pomoc": ["Seti se kolonijalne prošlosti Španije i njenog položaja preko puta Afrike.", "Imigranata ima otprilike svaki deseti stanovnik.", "Iz lekcije: oko 10% su imigranti — iz Latinske Amerike i sa severa Afrike."], "objasnjenje": "Tačno — imigranti čine oko 10% stanovništva, najviše iz Latinske Amerike i severne Afrike.", "iz_udzbenika": {"strana": 36, "odeljak": "Stanovništvo", "tekst": "Zbog kolonijalne prošlosti Španija ima veliku imigraciju — oko 10% stanovnika, uglavnom iz Latinske Amerike i sa severa Afrike."}, "lekcija": 11}, {"id": "l11-stanovnistvo-zakljuci-imigracija", "vrsta": "zakljuci", "tezina": "srednje", "pojmovi": ["imigracija"], "pitanje": "Zašto se u Španiju doseljava mnogo ljudi baš iz Latinske Amerike?", "odgovori": [{"tekst": "Zbog kolonijalne prošlosti — tamo se govori španski i postoje stare veze sa Španijom.", "tacan": true}, {"tekst": "Zato što je Latinska Amerika deo Evropske unije.", "tacan": false}, {"tekst": "Zato što u Latinskoj Americi vlada polarna klima.", "tacan": false}, {"tekst": "Zato što je Latinska Amerika odmah do Španije.", "tacan": false}], "pomoc": ["Korak 1: Koji jezik se govori u većini zemalja Latinske Amerike?", "Korak 2: Kako se taj jezik tamo proširio?", "Iz lekcije: velika imigracija je posledica kolonijalne prošlosti."], "objasnjenje": "Latinska Amerika je nekada bila španska kolonija; zajednički jezik i veze olakšavaju doseljavanje.", "iz_udzbenika": {"strana": 36, "odeljak": "Stanovništvo", "tekst": "Zbog kolonijalne prošlosti Španija ima veliku imigraciju i etnički je raznorodna."}, "lekcija": 11}, {"id": "l11-stanovnistvo-dopuni-procenti", "vrsta": "dopuni", "tezina": "srednje", "pojmovi": ["imigracija"], "pitanje": "Dopuni rečenicu brojevima iz banke.", "tekst": "U gradovima živi oko {{70}} % stanovnika Španije, a imigranti čine oko {{10}} % stanovništva.", "ponudjene": ["70", "10", "30", "50"], "pomoc": ["Većina ljudi živi u gradovima — više od dve trećine.", "Imigrant je otprilike svaki deseti stanovnik.", "Iz lekcije: oko 70% gradskog stanovništva i oko 10% imigranata."], "objasnjenje": "Oko 70% stanovnika živi u gradovima, a oko 10% su imigranti.", "iz_udzbenika": {"strana": 36, "odeljak": "Stanovništvo", "tekst": "Oko 70% stanovnika živi u gradovima; imigranti čine oko 10% stanovništva."}, "lekcija": 11}, {"id": "l11-stanovnistvo-tn-starost", "vrsta": "tacno_netacno", "tezina": "srednje", "pojmovi": ["spanija"], "tvrdnja": "U Španiji preovlađuje mlado stanovništvo, a prirodni priraštaj je visok.", "tacno": false, "ispravke": [{"tekst": "Preovlađuje zrelo stanovništvo; priraštaj je nizak, pa stanovništvo stari.", "tacan": true}, {"tekst": "Preovlađuje mlado stanovništvo, ali je priraštaj nizak.", "tacan": false}, {"tekst": "Preovlađuju deca mlađa od deset godina.", "tacan": false}], "pomoc": ["Kao i u većini evropskih zemalja, rađa se malo dece.", "Ako se rađa malo dece, prosečna starost raste.", "Iz lekcije: zrelo stanovništvo, nizak prirodni priraštaj — stanovništvo stari."], "objasnjenje": "Netačno — preovlađuje zrelo stanovništvo, priraštaj je nizak i stanovništvo nastavlja da stari.", "iz_udzbenika": {"strana": 36, "odeljak": "Stanovništvo", "tekst": "U starosnoj strukturi preovlađuje zrelo stanovništvo; zbog niskog prirodnog priraštaja ono nastavlja da stari."}, "lekcija": 11}, {"id": "l11-stanovnistvo-izbor-jezici", "vrsta": "izbor", "tezina": "srednje", "pojmovi": ["katalonski-jezik", "galicijski-jezik", "baskijski-jezik"], "pitanje": "Koji jezici se u Španiji koriste pored španskog? (Više tačnih.)", "odgovori": [{"tekst": "katalonski", "tacan": true}, {"tekst": "galicijski", "tacan": true}, {"tekst": "baskijski", "tacan": true}, {"tekst": "portugalski", "tacan": false}, {"tekst": "italijanski", "tacan": false}], "pomoc": ["Ti jezici nose imena oblasti i naroda unutar Španije.", "Tačna su tri odgovora; portugalski i italijanski su jezici drugih država.", "Iz lekcije: katalonski (17%), galicijski (7%) i baskijski (2%)."], "objasnjenje": "Pored španskog koriste se katalonski, galicijski i baskijski jezik.", "iz_udzbenika": {"strana": 36, "odeljak": "Zanimljivosti", "tekst": "U Španiji se pored španskog koriste katalonski (17%), galicijski (7%) i baskijski jezik (2%)."}, "lekcija": 11}, {"id": "l11-stanovnistvo-klik-sevilja", "vrsta": "karta_klik", "tezina": "srednje", "pojmovi": ["sevilja", "andaluzija"], "pitanje": "Klikni na Sevilju.", "cilj": {"mesto": "sevilja"}, "pomoc": ["Sevilja je na jugu Španije, u Andaluziji.", "Leži na reci Gvadalkivir, nedaleko od Atlantika.", "Klikni na jugozapad Španije, severozapadno od Gibraltara."], "objasnjenje": "Sevilja je u Andaluziji, na Gvadalkiviru — grad flamenka.", "iz_udzbenika": {"strana": 37, "odeljak": "Kultura", "tekst": "Fotografija prikazuje flamenko, nacionalni ples, na ulicama Sevilje.", "slika": "11-spanija/10-flamenko-sevilja.jpg"}, "lekcija": 11}, {"id": "l11-stanovnistvo-klik-saragosa", "vrsta": "karta_klik", "tezina": "srednje", "pojmovi": ["saragosa", "aragonija", "ebro"], "pitanje": "Klikni na Saragosu.", "cilj": {"mesto": "saragosa"}, "pomoc": ["Saragosa je u Aragoniji, na severoistoku Španije.", "Leži na reci Ebro, otprilike na pola puta između Madrida i Barselone.", "Klikni na dolinu Ebra, južno od Pirineja."], "objasnjenje": "Saragosa je u Aragoniji, na reci Ebro.", "iz_udzbenika": {"strana": 36, "odeljak": "Gradovi", "tekst": "Među najvećim gradovima Španije je i Saragosa, u dolini Ebra."}, "lekcija": 11}, {"id": "l11-stanovnistvo-povezi-gradovi", "vrsta": "povezi", "tezina": "srednje", "pojmovi": ["madrid", "sevilja", "saragosa", "barselona", "malaga"], "pitanje": "Poveži grad sa opisom njegovog položaja.", "parovi": [["Madrid", "na Mezeti, u središtu zemlje"], ["Sevilja", "na Gvadalkiviru, u Andaluziji"], ["Saragosa", "na Ebru, u Aragoniji"], ["Barselona", "na severoistočnoj sredozemnoj obali"], ["Malaga", "na južnoj sredozemnoj obali"]], "pomoc": ["Samo jedan grad je u središtu, daleko od mora.", "Dva grada su na rekama — jedan na jugu, drugi na severoistoku; dva su na obali.", "Iz lekcije: Madrid — Mezeta; Sevilja — Gvadalkivir; Saragosa — Ebro."], "objasnjenje": "Madrid — Mezeta; Sevilja — Gvadalkivir; Saragosa — Ebro; Barselona — severoistočna obala; Malaga — južna obala.", "iz_udzbenika": {"strana": 36, "odeljak": "Gradovi", "tekst": "Najveći gradovi su Madrid, Barselona, Valensija, Sevilja, Saragosa i Malaga; pronalaze se u atlasu."}, "lekcija": 11}, {"id": "l11-stanovnistvo-gde-sevilja", "vrsta": "gde_sam", "tezina": "srednje", "pojmovi": ["sevilja", "flamenko", "gvadalkivir"], "pitanje": "Gde sam? Pročitaj trag i klikni mesto na karti.", "cilj": {"mesto": "sevilja"}, "tragovi": ["Na mojim trgovima plesačice u haljinama sa volanima igraju nacionalni ples.", "Ja sam jedan od najvećih gradova Španije, u niziji na jugu.", "Kroz mene protiče Gvadalkivir.", "Ja sam najveći grad Andaluzije, poznat po flamenku."], "objasnjenje": "Sevilja — grad u Andaluziji, na Gvadalkiviru, poznat po flamenku.", "iz_udzbenika": {"strana": 37, "odeljak": "Kultura", "tekst": "Flamenko, nacionalni ples Španije, igra se na ulicama Sevilje.", "slika": "11-spanija/10-flamenko-sevilja.jpg"}, "lekcija": 11}, {"id": "l11-stanovnistvo-izbor-gustina", "vrsta": "izbor", "tezina": "tesko", "pojmovi": ["madrid", "sredozemno-more"], "pitanje": "Koji delovi Španije su najgušće naseljeni? (Više tačnih.)", "odgovori": [{"tekst": "sredozemno primorje", "tacan": true}, {"tekst": "središnji deo oko glavnog grada", "tacan": true}, {"tekst": "visoki Pirineji", "tacan": false}, {"tekst": "Betijske planine", "tacan": false}, {"tekst": "Kanarska ostrva", "tacan": false}], "pomoc": ["Ljudi retko žive gusto na velikim visinama.", "Tačna su dva odgovora — jedno područje je uz more, drugo oko najvećeg grada.", "Iz lekcije: najgušće su naseljeni sredozemno primorje i središnji deo oko glavnog grada."], "objasnjenje": "Najgušće su naseljeni sredozemno primorje i okolina Madrida; planine su retko naseljene.", "iz_udzbenika": {"strana": 36, "odeljak": "Stanovništvo", "tekst": "Najgušće su naseljeni sredozemno primorje i središnji deo zemlje oko glavnog grada."}, "lekcija": 11}, {"id": "l11-stanovnistvo-povezi-jezici", "vrsta": "povezi", "tezina": "tesko", "pojmovi": ["katalonski-jezik", "galicijski-jezik", "baskijski-jezik"], "pitanje": "Poveži jezik sa podatkom iz lekcije.", "parovi": [["katalonski", "koristi ga 17% stanovnika Španije"], ["galicijski", "koristi ga 7% stanovnika Španije"], ["baskijski", "koristi ga 2% stanovnika Španije"], ["španski", "u svetu ga govori preko 485 miliona ljudi"]], "pomoc": ["Najrašireniji jezik govori se i van Španije, u celom svetu.", "Od tri manja jezika najviše govornika ima jezik Barselone (Katalonija), a najmanje baskijski.", "Iz lekcije: katalonski 17%, galicijski 7%, baskijski 2%; španski 485+ miliona u svetu."], "objasnjenje": "Katalonski 17%, galicijski 7%, baskijski 2%; španskim u svetu govori preko 485 miliona ljudi.", "iz_udzbenika": {"strana": 36, "odeljak": "Zanimljivosti", "tekst": "Španski govori preko 485 miliona ljudi u svetu; u Španiji se još koriste katalonski (17%), galicijski (7%) i baskijski (2%)."}, "lekcija": 11}, {"id": "l11-stanovnistvo-dopuni-spanski", "vrsta": "dopuni", "tezina": "tesko", "pojmovi": ["spanija"], "pitanje": "Dopuni rečenicu (bez ponuđenih reči).", "tekst": "Španskim jezikom u svetu govori preko {{485}} miliona ljudi, pa je po rasprostranjenosti {{drugi|2.|2}} jezik na svetu.", "pomoc": ["Broj je skoro pola milijarde.", "Po rasprostranjenosti je odmah iza jednog jezika — nije prvi.", "Iz lekcije: preko 485 miliona govornika; drugi jezik po rasprostranjenosti."], "objasnjenje": "Španski govori preko 485 miliona ljudi; to je drugi jezik u svetu po rasprostranjenosti.", "iz_udzbenika": {"strana": 36, "odeljak": "Zanimljivosti", "tekst": "Španski jezik govori preko 485 miliona ljudi i drugi je u svetu po rasprostranjenosti — posledica kolonijalnih osvajanja."}, "lekcija": 11}, {"id": "l11-stanovnistvo-klik-malaga", "vrsta": "karta_klik", "tezina": "tesko", "pojmovi": ["malaga", "betijske-planine"], "pitanje": "Klikni na Malagu.", "cilj": {"mesto": "malaga"}, "pomoc": ["Malaga je na južnoj, sredozemnoj obali.", "Nalazi se ispod Betijskih planina, istočno od Gibraltara.", "Klikni na južnu obalu Španije, malo istočno od Gibraltarskog moreuza."], "objasnjenje": "Malaga je na južnoj sredozemnoj obali, istočno od Gibraltara; važan je turistički centar.", "iz_udzbenika": {"strana": 37, "odeljak": "Turizam", "tekst": "Među najposećenijim mestima Španije je i Malaga, na južnoj obali."}, "lekcija": 11}, {"id": "l11-stanovnistvo-gde-barselona", "vrsta": "gde_sam", "tezina": "tesko", "pojmovi": ["barselona", "sagrada-familija", "park-gvelj"], "pitanje": "Gde sam? Pročitaj trag i klikni mesto na karti.", "cilj": {"mesto": "barselona"}, "tragovi": ["U meni je park sa šarenim klupama od mozaika i neobičnim zgradama.", "Iznad mene se dižu šiljati tornjevi velike crkve.", "U mom kraju se pored španskog govori katalonski.", "Ja sam veliki grad na severoistočnoj sredozemnoj obali, sa Sagradom familijom."], "objasnjenje": "Barselona — grad Sagrade familije i Parka Gvelj, na severoistočnoj obali.", "iz_udzbenika": {"strana": 37, "odeljak": "Turizam", "tekst": "Barselona je među najposećenijim mestima; njene znamenitosti su Sagrada familija i Park Gvelj.", "slika": "11-spanija/09-park-gvelj.jpg"}, "lekcija": 11}]}, {"naslov": "Privreda i kultura", "zadaci": [{"id": "l11-privreda-izbor-razvijenost", "vrsta": "izbor", "tezina": "lako", "pojmovi": ["spanija"], "pitanje": "Kako se po razvijenosti svrstava Španija?", "odgovori": [{"tekst": "srednje razvijena zemlja", "tacan": true}, {"tekst": "najrazvijenija zemlja sveta", "tacan": false}, {"tekst": "nerazvijena zemlja bez industrije", "tacan": false}, {"tekst": "zemlja bez poljoprivrede", "tacan": false}], "pomoc": ["Odgovor je „u sredini” — ni najrazvijenija ni nerazvijena.", "Španija ima i industriju i poljoprivredu.", "Iz lekcije: Španija je srednje razvijena zemlja."], "objasnjenje": "Španija je srednje razvijena zemlja; najviše ljudi radi u uslugama.", "iz_udzbenika": {"strana": 37, "odeljak": "Privreda", "tekst": "Španija je srednje razvijena zemlja; najviše zaposlenih je u tercijarnom sektoru."}, "lekcija": 11}, {"id": "l11-privreda-izbor-plutnjak", "vrsta": "izbor", "tezina": "lako", "pojmovi": ["hrast-plutnjak"], "pitanje": "Šta se dobija od hrasta plutnjaka?", "odgovori": [{"tekst": "pluta", "tacan": true}, {"tekst": "maslinovo ulje", "tacan": false}, {"tekst": "pamuk", "tacan": false}, {"tekst": "vino", "tacan": false}], "pomoc": ["Ime drveta krije odgovor.", "Dobija se iz kore drveta, pa je stablo posle skidanja crvenkasto.", "Iz lekcije: od hrasta plutnjaka dobija se pluta."], "objasnjenje": "Od kore hrasta plutnjaka dobija se pluta; plantaže su posebnost Pirinejskog poluostrva.", "iz_udzbenika": {"strana": 37, "odeljak": "Poljoprivreda", "tekst": "Plantaže hrasta plutnjaka, od kog se dobija pluta, posebnost su država Pirinejskog poluostrva.", "slika": "11-spanija/06-hrast-plutnjak.jpg"}, "lekcija": 11}, {"id": "l11-privreda-izbor-seat", "vrsta": "izbor", "tezina": "lako", "pojmovi": ["seat"], "pitanje": "Koja marka automobila se proizvodi u Španiji?", "odgovori": [{"tekst": "Seat", "tacan": true}, {"tekst": "Fiat", "tacan": false}, {"tekst": "Škoda", "tacan": false}, {"tekst": "Volvo", "tacan": false}], "pomoc": ["Fiat je italijanska marka, Škoda češka, a Volvo švedska.", "Ime marke ima četiri slova.", "Iz lekcije: u Španiji se proizvode automobili marke Seat."], "objasnjenje": "Seat je španska marka automobila; Španija je jedan od najvećih proizvođača automobila u Evropi.", "iz_udzbenika": {"strana": 37, "odeljak": "Industrija", "tekst": "Automobilska industrija je veoma važna — Španija je jedan od najvećih proizvođača automobila u Evropi (Seat).", "slika": "11-spanija/08-seat-fabrika.jpg"}, "lekcija": 11}, {"id": "l11-privreda-povezi-kultura", "vrsta": "povezi", "tezina": "lako", "pojmovi": ["flamenko", "korida", "sagrada-familija", "seat"], "pitanje": "Poveži pojam sa objašnjenjem.", "parovi": [["flamenko", "nacionalni ples Španije"], ["korida", "borba sa bikovima"], ["Sagrada familija", "velika crkva u Barseloni"], ["Seat", "marka automobila"]], "pomoc": ["Ples se igra u haljinama sa volanima, a u areni je bik.", "Crkva ima šiljate tornjeve, a marka je na fabrici.", "Iz lekcije: flamenko — ples; korida — borba sa bikovima; Sagrada familija — Barselona; Seat — automobili."], "objasnjenje": "Flamenko je ples, korida borba sa bikovima, Sagrada familija crkva u Barseloni, a Seat marka automobila.", "iz_udzbenika": {"strana": 37, "odeljak": "Kultura i privreda", "tekst": "Fotografije prikazuju flamenko u Sevilji, koridu, Sagradu familiju u Barseloni i fabriku Seat.", "slika": "11-spanija/11-korida.jpg"}, "lekcija": 11}, {"id": "l11-privreda-tn-flamenko", "vrsta": "tacno_netacno", "tezina": "lako", "pojmovi": ["flamenko", "sevilja"], "tvrdnja": "Flamenko je nacionalni ples Španije; u udžbeniku je prikazan na ulicama Sevilje.", "tacno": true, "pomoc": ["Pogledaj fotografiju plesačica u crvenim haljinama sa volanima.", "Ples se igra na trgu ispred ukrašenih zgrada jednog grada na jugu.", "Iz lekcije: flamenko, nacionalni ples, na ulicama Sevilje."], "objasnjenje": "Tačno — flamenko je nacionalni (tradicionalni) ples Španije.", "iz_udzbenika": {"strana": 37, "odeljak": "Kultura", "tekst": "Na fotografiji plesačice igraju flamenko, nacionalni ples Španije, na ulicama Sevilje.", "slika": "11-spanija/10-flamenko-sevilja.jpg"}, "lekcija": 11}, {"id": "l11-privreda-tn-auto", "vrsta": "tacno_netacno", "tezina": "lako", "pojmovi": ["seat"], "tvrdnja": "Španija je danas jedan od najvećih proizvođača automobila u Evropi.", "tacno": true, "pomoc": ["Seti se fabrike sa fotografije.", "Marka Seat je španska.", "Iz lekcije: Španija je jedan od najvećih proizvođača automobila u Evropi."], "objasnjenje": "Tačno — automobilska industrija (Seat) je veoma važna grana privrede Španije.", "iz_udzbenika": {"strana": 37, "odeljak": "Industrija", "tekst": "Španija je danas jedan od najvećih proizvođača automobila u Evropi.", "slika": "11-spanija/08-seat-fabrika.jpg"}, "lekcija": 11}, {"id": "l11-privreda-zakljuci-pluta", "vrsta": "zakljuci", "tezina": "lako", "pojmovi": ["hrast-plutnjak", "pirinejsko-poluostrvo"], "pitanje": "Na flaši je čep od prirodne plute. Odakle najverovatnije potiče?", "odgovori": [{"tekst": "Od kore hrasta plutnjaka sa Pirinejskog poluostrva.", "tacan": true}, {"tekst": "Iz rudnika na Pirinejima.", "tacan": false}, {"tekst": "Od pamuka iz Andaluzije.", "tacan": false}, {"tekst": "Iz fabrike automobila.", "tacan": false}], "pomoc": ["Korak 1: Pluta je biljnog porekla — od kog drveta se dobija?", "Korak 2: Gde su plantaže tog drveta posebnost?", "Iz lekcije: hrast plutnjak daje plutu i posebnost je Pirinejskog poluostrva."], "objasnjenje": "Prirodna pluta je kora hrasta plutnjaka, čije su plantaže posebnost Španije i Portugalije.", "iz_udzbenika": {"strana": 37, "odeljak": "Poljoprivreda", "tekst": "Plantaže hrasta plutnjaka uz Sredozemno more daju plutu i posebnost su država Pirinejskog poluostrva.", "slika": "11-spanija/06-hrast-plutnjak.jpg"}, "lekcija": 11}, {"id": "l11-privreda-dopuni-korida", "vrsta": "dopuni", "tezina": "lako", "pojmovi": ["seat", "korida"], "pitanje": "Dopuni rečenicu rečima iz banke.", "tekst": "U Španiji se proizvode automobili marke {{Seat}}, a tradicionalna borba sa bikovima zove se {{korida}}.", "ponudjene": ["Seat", "korida", "Fiat", "flamenko"], "pomoc": ["Fiat je italijanska marka.", "Flamenko je ples, a ne borba.", "Iz lekcije: Seat — automobili; korida — borba sa bikovima."], "objasnjenje": "Seat je španska marka automobila, a korida je borba sa bikovima.", "iz_udzbenika": {"strana": 37, "odeljak": "Kultura i privreda", "tekst": "Na fotografijama su fabrika automobila Seat i korida — toreador sa crvenim plaštom pred bikom.", "slika": "11-spanija/11-korida.jpg"}, "lekcija": 11}, {"id": "l11-privreda-tn-sektor", "vrsta": "tacno_netacno", "tezina": "srednje", "pojmovi": ["spanija"], "tvrdnja": "U Španiji najviše ljudi radi u primarnom sektoru (poljoprivreda, ribolov).", "tacno": false, "ispravke": [{"tekst": "Najviše ljudi radi u tercijarnom (uslužnom) sektoru, a najmanje u primarnom.", "tacan": true}, {"tekst": "Najviše ljudi radi u sekundarnom sektoru, a najmanje u tercijarnom.", "tacan": false}, {"tekst": "U svim sektorima radi isti broj ljudi.", "tacan": false}], "pomoc": ["Turizam je veoma važan — kom sektoru pripada?", "Primarni sektor ima najmanje zaposlenih.", "Iz lekcije: najviše zaposlenih u tercijarnom, najmanje u primarnom sektoru."], "objasnjenje": "Netačno — najviše ljudi radi u uslugama (tercijarni sektor), a najmanje u primarnom.", "iz_udzbenika": {"strana": 37, "odeljak": "Privreda", "tekst": "Najviše zaposlenih je u tercijarnom, uslužnom sektoru, a najmanje u primarnom."}, "lekcija": 11}, {"id": "l11-privreda-izbor-kulture", "vrsta": "izbor", "tezina": "srednje", "pojmovi": ["spanija", "sredozemna-klima"], "pitanje": "Koje kulture se, prema lekciji, gaje u Španiji zahvaljujući klimi? (Više tačnih.)", "odgovori": [{"tekst": "agrumi", "tacan": true}, {"tekst": "vinova loza", "tacan": true}, {"tekst": "masline", "tacan": true}, {"tekst": "pamuk", "tacan": true}, {"tekst": "duvan", "tacan": true}, {"tekst": "kafa", "tacan": false}, {"tekst": "kakao", "tacan": false}], "pomoc": ["Kafa i kakao traže tropsku klimu.", "Sve ostale ponuđene kulture lekcija navodi.", "Iz lekcije: agrumi, vinova loza, masline, povrće, pamuk, duvan."], "objasnjenje": "Gaje se agrumi, vinova loza, masline, povrće, pamuk i duvan; kafa i kakao su tropske kulture.", "iz_udzbenika": {"strana": 37, "odeljak": "Poljoprivreda", "tekst": "Zahvaljujući klimi gaje se agrumi, vinova loza, masline, povrće, pamuk i duvan."}, "lekcija": 11}, {"id": "l11-privreda-dopuni-plutnjak", "vrsta": "dopuni", "tezina": "srednje", "pojmovi": ["hrast-plutnjak", "pirinejsko-poluostrvo"], "pitanje": "Dopuni rečenicu rečima iz banke.", "tekst": "Plantaže {{hrasta plutnjaka}}, od kog se dobija {{pluta}}, posebnost su država {{Pirinejskog}} poluostrva.", "ponudjene": ["hrasta plutnjaka", "pluta", "Pirinejskog", "masline", "Balkanskog"], "pomoc": ["Drvo i proizvod imaju slično ime.", "Te plantaže su tipične za Španiju i Portugaliju.", "Iz lekcije: hrast plutnjak — pluta — Pirinejsko poluostrvo."], "objasnjenje": "Hrast plutnjak daje plutu; plantaže su posebnost Pirinejskog poluostrva.", "iz_udzbenika": {"strana": 37, "odeljak": "Zanimljivosti", "tekst": "Plantaže hrasta plutnjaka, od čije se kore dobija pluta, posebnost su država Pirinejskog poluostrva.", "slika": "11-spanija/06-hrast-plutnjak.jpg"}, "lekcija": 11}, {"id": "l11-privreda-povezi-delatnosti", "vrsta": "povezi", "tezina": "srednje", "pojmovi": ["hrast-plutnjak", "seat", "atlantski-okean"], "pitanje": "Poveži delatnost sa mestom ili primerom iz lekcije.", "parovi": [["stočarstvo", "viši predeli"], ["ribolov", "atlantska obala"], ["plantaže hrasta plutnjaka", "uz Sredozemno more"], ["automobilska industrija", "marka Seat"], ["turizam", "Balearska ostrva i Barselona"]], "pomoc": ["Ribe se love uz okean, a stoka pase u planinama.", "Turisti idu na ostrva i u velike gradove.", "Iz lekcije: stočarstvo u višim predelima, ribolov uz Atlantik, plutnjak uz Sredozemlje, Seat, turizam."], "objasnjenje": "Stočarstvo — viši predeli; ribolov — atlantska obala; plutnjak — uz Sredozemlje; Seat — automobili; turizam — Baleari, Barselona.", "iz_udzbenika": {"strana": 37, "odeljak": "Privreda", "tekst": "Stočarstvo je razvijeno u višim predelima, ribolov uz atlantsku obalu, a uz Sredozemlje su plantaže hrasta plutnjaka."}, "lekcija": 11}, {"id": "l11-privreda-izbor-turizam", "vrsta": "izbor", "tezina": "srednje", "pojmovi": ["balearska-ostrva", "barselona", "madrid", "kanarska-ostrva", "malaga"], "pitanje": "Koja mesta lekcija navodi kao najposećenija u Španiji? (Više tačnih.)", "odgovori": [{"tekst": "Balearska ostrva", "tacan": true}, {"tekst": "Barselona", "tacan": true}, {"tekst": "Kanarska ostrva", "tacan": true}, {"tekst": "Malaga", "tacan": true}, {"tekst": "Saragosa", "tacan": false}, {"tekst": "Seuta", "tacan": false}], "pomoc": ["Turisti najčešće idu na more, ostrva i u najveće gradove.", "Tačna su četiri odgovora; dva netačna su grad u unutrašnjosti Aragonije i eksklava u Africi.", "Iz lekcije: Balearska ostrva, Barselona, Madrid, Kanarska ostrva i Malaga."], "objasnjenje": "Najposećeniji su Balearska ostrva, Barselona, Madrid, Kanarska ostrva i Malaga.", "iz_udzbenika": {"strana": 37, "odeljak": "Turizam", "tekst": "Turizam je veoma važan; najposećeniji su Balearska ostrva, Barselona, Madrid, Kanarska ostrva i Malaga.", "slika": "11-spanija/07-sagrada-familija.jpg"}, "lekcija": 11}, {"id": "l11-privreda-zakljuci-ostrva", "vrsta": "zakljuci", "tezina": "srednje", "pojmovi": ["balearska-ostrva", "kanarska-ostrva"], "pitanje": "Zašto su Balearska i Kanarska ostrva veliki turistički centri?", "odgovori": [{"tekst": "Veći deo godine je toplo i sunčano, a tu su more i plaže.", "tacan": true}, {"tekst": "Na njima su najviše planine Španije sa skijalištima.", "tacan": false}, {"tekst": "Na njima su najveće fabrike automobila.", "tacan": false}, {"tekst": "Tamo vlada kontinentalna klima sa hladnim zimama.", "tacan": false}], "pomoc": ["Korak 1: Šta turisti traže na ostrvima?", "Korak 2: Kakvo je vreme na jugu Evrope i uz obalu Afrike?", "Iz lekcije: ta ostrva su među najposećenijim delovima Španije."], "objasnjenje": "Toplo, sunčano vreme veći deo godine, more i plaže privlače turiste na ostrva.", "iz_udzbenika": {"strana": 37, "odeljak": "Turizam", "tekst": "Balearska i Kanarska ostrva su među najposećenijim mestima Španije."}, "lekcija": 11}, {"id": "l11-privreda-gde-malaga", "vrsta": "gde_sam", "tezina": "srednje", "pojmovi": ["malaga", "betijske-planine"], "pitanje": "Gde sam? Pročitaj trag i klikni mesto na karti.", "cilj": {"mesto": "malaga"}, "tragovi": ["Iza mene se dižu Betijske planine.", "Ja sam jedan od najvećih gradova Španije i jedno od najposećenijih turističkih mesta.", "Ležim na južnoj obali Sredozemnog mora.", "Nalazim se nedaleko istočno od Gibraltara, u Andaluziji."], "objasnjenje": "Malaga — grad i turistički centar na južnoj sredozemnoj obali.", "iz_udzbenika": {"strana": 37, "odeljak": "Turizam", "tekst": "Malaga je među najvećim gradovima i najposećenijim mestima Španije."}, "lekcija": 11}, {"id": "l11-privreda-zakljuci-razvijenost", "vrsta": "zakljuci", "tezina": "tesko", "pojmovi": ["spanija"], "pitanje": "Zašto se Španija smatra srednje razvijenom, a ne visoko razvijenom zemljom?", "odgovori": [{"tekst": "Industrijalizacija je počela kasno, posle Drugog svetskog rata, pa industrija nije potpuno razvijena.", "tacan": true}, {"tekst": "Nema nimalo industrije, već samo poljoprivredu.", "tacan": false}, {"tekst": "Nema izlaz na more, pa ne može da trguje.", "tacan": false}, {"tekst": "Ima previše stanovnika u selima.", "tacan": false}], "pomoc": ["Korak 1: Kada je u Španiji počela industrijalizacija?", "Korak 2: Šta znači kad industrija kasno počne da se razvija?", "Iz lekcije: industrijalizacija je počela tek posle Drugog svetskog rata, pa industrija nije potpuno razvijena."], "objasnjenje": "Kasna industrijalizacija (posle Drugog svetskog rata) je razlog zašto industrija nije potpuno razvijena; privreda se mnogo oslanja na usluge i turizam.", "iz_udzbenika": {"strana": 37, "odeljak": "Industrija", "tekst": "Industrijalizacija je počela tek posle Drugog svetskog rata, pa industrija nije potpuno razvijena."}, "lekcija": 11}, {"id": "l11-privreda-tn-industrijalizacija", "vrsta": "tacno_netacno", "tezina": "tesko", "pojmovi": ["spanija"], "tvrdnja": "Industrijalizacija Španije počela je još pre Prvog svetskog rata, pa je njena industrija potpuno razvijena.", "tacno": false, "ispravke": [{"tekst": "Industrijalizacija je počela tek posle Drugog svetskog rata i industrija nije potpuno razvijena.", "tacan": true}, {"tekst": "Industrijalizacija je počela posle Prvog svetskog rata i industrija je potpuno razvijena.", "tacan": false}, {"tekst": "Industrijalizacija u Španiji još nije počela.", "tacan": false}], "pomoc": ["Da je industrija potpuno razvijena, Španija bi bila visoko razvijena zemlja.", "Početak je bio kasno — u drugoj polovini 20. veka.", "Iz lekcije: tek posle Drugog svetskog rata."], "objasnjenje": "Netačno — industrijalizacija je počela tek posle Drugog svetskog rata, pa industrija nije potpuno razvijena.", "iz_udzbenika": {"strana": 37, "odeljak": "Industrija", "tekst": "Industrijalizacija je počela tek posle Drugog svetskog rata, pa industrija nije potpuno razvijena, iako je automobilska industrija danas jaka."}, "lekcija": 11}, {"id": "l11-privreda-izbor-industrija", "vrsta": "izbor", "tezina": "tesko", "pojmovi": ["seat"], "pitanje": "Koje grane industrije lekcija navodi za Španiju? (Više tačnih.)", "odgovori": [{"tekst": "automobilska", "tacan": true}, {"tekst": "prehrambena", "tacan": true}, {"tekst": "tekstilna", "tacan": true}, {"tekst": "hemijska", "tacan": true}, {"tekst": "svemirska", "tacan": false}, {"tekst": "industrija pamuka u rudnicima", "tacan": false}], "pomoc": ["Pamuk se gaji, a ne kopa — jedan odgovor je besmislen.", "Tačna su četiri odgovora; jedna od njih je „veoma važna” i ima marku Seat.", "Iz lekcije: prehrambena, tekstilna, hemijska i — veoma važna — automobilska industrija."], "objasnjenje": "Lekcija navodi prehrambenu, tekstilnu, hemijsku i automobilsku industriju (Seat).", "iz_udzbenika": {"strana": 37, "odeljak": "Industrija", "tekst": "Pored prehrambene, tekstilne i hemijske industrije, veoma je važna automobilska industrija."}, "lekcija": 11}, {"id": "l11-privreda-dopuni-delatnosti", "vrsta": "dopuni", "tezina": "tesko", "pojmovi": ["atlantski-okean"], "pitanje": "Dopuni rečenicu (bez ponuđenih reči).", "tekst": "Ribolov je razvijen uz {{atlantsku}} obalu, a stočarstvo u {{višim|planinskim}} predelima Španije.", "pomoc": ["Ribolov je razvijen uz obalu okeana, ne mora.", "Stoka se gaji tamo gde je teren viši i manje pogodan za njive.", "Iz lekcije: ribolov uz atlantsku obalu, stočarstvo u višim predelima."], "objasnjenje": "Ribolov je razvijen uz atlantsku obalu, a stočarstvo u višim predelima.", "iz_udzbenika": {"strana": 37, "odeljak": "Privreda", "tekst": "Stočarstvo je razvijeno u višim predelima, a ribolov uz atlantsku obalu."}, "lekcija": 11}]}, {"naslov": "Ponovi — ukrštenica", "zadaci": [{"id": "l11-ukrstenica-povezi-kultura", "vrsta": "povezi", "tezina": "lako", "pojmovi": ["flamenko", "korida", "seat", "romani"], "pitanje": "Ukrštenica „Ponovi” — poveži pitanje sa odgovorom.", "parovi": [["Tradicionalni ples Španije", "FLAMENKO"], ["Naziv borbe sa bikovima", "KORIDA"], ["Marka automobila iz Španije", "SEAT"], ["Grupa naroda kojoj pripadaju Španci", "ROMANI"]], "pomoc": ["Ples i borba su sa fotografija na strani 37.", "Marka ima četiri slova, a narod je srodan Italijanima.", "Iz lekcije: flamenko, korida, Seat, romanski narodi."], "objasnjenje": "Ples — flamenko; borba sa bikovima — korida; automobili — Seat; narodi — romani.", "iz_udzbenika": {"strana": 37, "odeljak": "Ponovi — ukrštenica", "tekst": "Ukrštenica ima devet pitanja o Španiji; odgovori se upisuju vodoravno, a u osenčenoj koloni čita se ime grada.", "slika": "11-spanija/12-ukrstenica.jpg"}, "lekcija": 11}, {"id": "l11-ukrstenica-dopuni-mezeta", "vrsta": "dopuni", "tezina": "lako", "pojmovi": ["mezeta", "aragonija"], "pitanje": "Ukrštenica „Ponovi” — dopuni odgovore rečima iz banke.", "tekst": "Visoravan u središnjem delu Španije je {{Mezeta}}, a nizija u dolini reke Ebro je {{Aragonija}}.", "ponudjene": ["Mezeta", "Aragonija", "Andaluzija", "Pirineji"], "pomoc": ["Andaluzija je u dolini Gvadalkivira, a Pirineji su planine.", "Visoravan je oko Madrida.", "Iz lekcije: Mezeta — središnja visoravan; Aragonija — dolina Ebra."], "objasnjenje": "Mezeta je visoravan u središtu, a Aragonija nizija u dolini Ebra.", "iz_udzbenika": {"strana": 37, "odeljak": "Ponovi — ukrštenica", "tekst": "Pitanja z) i ž) traže visoravan u središtu Španije i niziju u dolini Ebra.", "slika": "11-spanija/12-ukrstenica.jpg"}, "lekcija": 11}, {"id": "l11-ukrstenica-povezi-priroda", "vrsta": "povezi", "tezina": "srednje", "pojmovi": ["gvadijana", "balearska-ostrva", "pirineji", "aragonija", "mezeta"], "pitanje": "Ukrštenica „Ponovi” — poveži pitanje sa odgovorom.", "parovi": [["Veći rečni tok iz sliva Atlantskog okeana (9 slova)", "GVADIJANA"], ["Ostrva u Sredozemnom moru", "BALEARSKA"], ["Planina na severoistoku Španije", "PIRINEJI"], ["Nizija u dolini reke Ebro", "ARAGONIJA"], ["Visoravan u središnjem delu Španije", "MEZETA"]], "pomoc": ["Planina na severoistoku je na granici sa Francuskom.", "Reka atlantskog sliva sa 9 slova počinje sa G, ali nije Gvadalkivir.", "Iz lekcije: Gvadijana, Balearska, Pirineji, Aragonija, Mezeta."], "objasnjenje": "Gvadijana, Balearska ostrva, Pirineji, Aragonija i Mezeta.", "iz_udzbenika": {"strana": 37, "odeljak": "Ponovi — ukrštenica", "tekst": "Odgovori iz prirodne geografije u ukrštenici su reka atlantskog sliva, ostrva u Sredozemlju, planina na severoistoku, nizija uz Ebro i središnja visoravan.", "slika": "11-spanija/12-ukrstenica.jpg"}, "lekcija": 11}, {"id": "l11-ukrstenica-izbor-resenje", "vrsta": "izbor", "tezina": "srednje", "pojmovi": ["valensija"], "pitanje": "Kad tačno rešiš ukrštenicu „Ponovi”, u osenčenoj koloni pročitaš ime većeg grada na istočnoj obali Španije. Koji je to grad?", "odgovori": [{"tekst": "Valensija", "tacan": true}, {"tekst": "Barselona", "tacan": false}, {"tekst": "Saragosa", "tacan": false}, {"tekst": "Sevilja", "tacan": false}], "pomoc": ["Saragosa i Sevilja nisu na istočnoj obali.", "Prvo slovo daje GVADIJANA (drugo slovo — V), drugo BALEARSKA (drug       }

    });
    const allDone = !!a.end;
    h += '<div class="sec"><span>Kraj</span></div><button type="button" class="it-row' + (state.cur === '_sum' ? ' sel' : '') + (allDone ? ' ok' : '') + '" data-id="_sum"><span class="st">' + (allDone ? '★' : '·') + '</span><span class="lbl">Rezultat</span></button>';

    (SPEC.osa ? '<button type="button" class="it-row' + (state.cur === '_osa' ? ' sel' : '') + '" data-id="_osa"><span class="st">⟷</span><span class="lbl">Vremenska osa</span><span class="pt">' + Object.keys(state.osa || {}).length + ' / ' + Object.keys(OSA_ALL).length + '</span></button>' : '');
  if (LEKS.some(l => l.html)) {   // the material: one row per lesson, its sections under the open one
    const cur = lekRoute(), one = LEKS.length === 1;

  const fin = state.inst.filter(t => t.end).slice().reverse();
  if (fin.length) h += '<div class="sec"><span>Arhiva rezultata</span><span class="cnt">' + fin.length + '</span></div>' + fin.map(t => '<button type="button" class="it-row' + (state.cur === 'r:' + t.id ? ' sel' : '') + '" data-id="r:' + t.id + '"><span class="st">▤</span><span class="lbl">Kviz ' + t.n + ' · ' + fmtDate(t.start) + '</span><span class="pt">' + t.score + '/' + t.max + '</span></button>').join('');
  document.getElementById('navList').innerHTML = h;
  if (document.getElementById('app-filter').value) HubShell.applyFilter();
}

function lekOf(broj) { return LEKS.find(l => l.broj === broj) || null; }

}

function lessonHTML(z) {   // more from the lesson: the section's notes (protected copy) + its full text and book page

  const other = {};

function helpHTML(z, s, fresh) {
  if (isDone(s)) {
    const rez = s.first === false ? (s.status === 'ok' ? 'Tačno posle pomoći · u rezultatu netačno' : 'Odgovor · u rezultatu netačno') : 'Tačno';
    return '<div class="hl"><h3>' + rez + '</h3><p>' + fmt(z.objasnjenje || '') + '</p>' + whyListHTML(z, s) +
      (osaEvents(z).length ? '<p class="placed">⟶ Na vremenskoj osi: ' + osaEvents(z).map(e => esc(e.naziv)).join(', ') + '</p>' : '') + moreHTML(z) + '</div>';
  }
  const why = s.ui.why ? '<div class="why-box"><b>Zašto to nije tačno:</b> ' + fmt(s.ui.why) + '</div>' : '';
  if (CLUES[z.vrsta]) return '<div class="hl"><h3>Tragovi</h3>' + why + '<p class="placeholder">Tragovi se otkrivaju u zadatku. U rezultat ide tvoj prvi odgovor.</p></div>';
  if (!s.miss) return '<div class="hl"><h3>Kako se radi</h3><p class="placeholder">' + esc(UPUTSTVO[z.vrsta]) + '</p><p class="placeholder">U rezultat ide tvoj prvi odgovor. Posle greške ovde stiže pomoć, da nađeš tačan odgovor.</p></div>';
  const shown = (z.pomoc || []).slice(0, s.miss);
  return '<div class="hl">' + why + '<h3>Pomoć (' + shown.length + ' / ' + (z.pomoc || []).length + ')</h3><ol>' +
    shown.map((p, i) => '<li' + (fresh && i === shown.length - 1 ? ' class="new"' : '') + '>' +   // a step that names itself ("Korak 1:", "Iz lekcije:") keeps its own label
      (/^[^:]{1,20}:/.test(p) ? fmt(p).replace(/^([^:]{1,20}):/, '<b>$1:</b>') : '<b>' + HELP_LBL[Math.min(i, 3)] + ':</b> ' + fmt(p)) + '</li>').join('') + '</ol>' +
    '<p class="placeholder">U rezultat ide prvi odgovor; ovo je da naučiš. Greška posle poslednje pomoći otkriva odgovor.</p></div>';
}
function whyListHTML(z, s) {   // after the answer: why each option the pupil picked (or every wrong one) is wrong
  const opts = z.odgovori || [], w = (s.ui.wrong || []).filter(i => opts[i] && opts[i].zasto);
  const list = (w.length ? w : opts.map((o, i) => i).filter(i => !opts[i].tacan && opts[i].zasto)).map(i => opts[i]);
  return list.length ? '<h3>' + (w.length ? 'Zašto nisu tačni tvoji izbori' : 'Zašto su ostali odgovori pogrešni') + '</h3><ul>' + list.map(o => '<li><b>' + fmt(o.tekst) + '</b> — ' + fmt(o.zasto) + '</li>').join('') + '</ul>' : '';
}
function renderDrawer(fresh) {
  if (drawer.dataset.intro) return;

function showIntro() {

  drawerBody.innerHTML = '<div class="intro"><p>' + esc(SPEC.description || '') + '</p><ul>' +
    '<li><b>Kviz</b> — ' + esc(sastavText((SPEC.sastav || {}).pitanja || 25)) + '. U rezultat ide tvoj prvi odgovor na svako pitanje.</li>' +
    '<li><b>Pomoć</b> — posle greške u ovoj fioci stiže pomoć: <i>usmeri</i> → <i>suzi</i> → <i>iz lekcije</i>. Tako nađeš tačan odgovor, ali se rezultat ne menja.</li>' +

    (ITEMS.some(z => z.odgovori && z.odgovori.some(o => o.zasto)) ? '<li><b>Svaka greška nešto kaže</b> — kad izabereš pogrešan odgovor, vidiš <i>zašto</i> nije tačan.</li>' : '') +

if (INFO.zasticeno) { const l = document.getElementById('mProt'); l.href = INFO.zasticeno; l.hidden = false; }   // public copy → the one with images

// ---------- outcome ----------
function fail(z, text, given) {
  const s = st(z.id);
  s.miss++;
  record(z, s, false, given);
  const ended = s.miss > steps(z);
  if (ended) { s.status = 'revealed'; s.pts = 0; learnFrom(z, 0); place(z, false); toast('Evo odgovora', false); }
  else toast(text || 'Netačno — pokušaj ponovo', false);
  finishCheck(); save(); renderItem(true); renderNav(); refreshScore();
  if (ended || !mobile()) openDrawer();
}
function succeed(z, given, pts) {   // pts: set only by self-graded `objasni`
  const s = st(z.id), first = s.first == null;
  s.status = 'ok'; s.pts = pts != null ? pts : ptsFor(s.miss);
  record(z, s, true, given);
  learnFrom(z, s.pts);
  s.placed = place(z, true);
  toast((first ? 'Tačno!' : 'Tačno, ali u rezultat ide prvi odgovor') + (s.placed ? ' · na vremenskoj osi' : ''), true);
  finishCheck(); save(); renderItem(false); renderNav(); refreshScore();
  openDrawer();
}

// ---------- item renderers ----------
const main = document.getElementById('main');
function frame(z, s, inner) {
  const n = numOf(z);
  const pts = s.first === true ? '✓ tačno' : s.first === false ? '✗ netačno u prvom pokušaju' : '';

    inner + '<div class="help-inline" id="helpInline"></div><div class="iactions" id="actions"></div>' +
    (isDone(s) ? '<div class="expl' + (s.status === 'ok' ? '' : ' rev') + '">' + fmt(z.objasnjenje || '') + '</div>' : '') + questionFig(z, s) + '</div>';
}
function questionFig(z, s) {   // `slika_u_pitanju`: the question asks to look at the picture, so it stands under the answers (caption only once answered)
  const b = z.iz_udzbenika; if (!z.slika_u_pitanju || !b || !b.slika) return '';
  const cap = isDone(s) ? INFO.slikeNaslovi[b.slika] || '' : '';
  return '<figure class="qfig"><img src="' + esc(INFO.slikeData[b.slika] || INFO.slike + b.slika) + '" alt="Slika uz pitanje" onclick="this.parentNode.classList.toggle(\'zoom\')" onerror="' +
    (INFO.zasticeno ? 'this.parentNode.outerHTML=\'<p class=&quot;ref&quot;>Slika uz ovo pitanje je u <a href=&quot;' + esc(INFO.zasticeno) + '&quot;>verziji sa slikama iz udžbenika (lozinka)</a>.</p>\'' : 'this.parentNode.remove()') +
    '">' + (cap ? '<figcaption>' + esc(cap) + '</figcaption>' : '') + '</figure>';

function actions(btns) {
  const a = document.getElementById('actions');

}
function nextButton(z) {   // done: Sledeći + reopen the drawer; in progress with help used: reopen the help
  const s = st(z.id), a = document.getElementById('actions');
  if (!isDone(s)) {
    if (s.miss && !CLUES[z.vrsta] && !mobile()) {

  const m = document.getElementById('btnMore'); if (m) m.addEventListener('click', openDrawer);

function prelude(z, s) {   // what stands above the options: a source, a cause→effect chain, the clues so far
  const done = isDone(s), right = z.odgovori && z.odgovori.find(o => o.tacan);
  if (z.vrsta === 'izvor') { const iz = z.izvor;
    return '<div class="src">' + (iz.autor || iz.naslov ? '<p class="who">' + esc([iz.autor, iz.naslov].filter(Boolean).join(' — ')) + '</p>' : '') +
      '<blockquote>' + fmt(iz.tekst) + '</blockquote>' + (iz.napomena ? '<p class="nt">' + fmt(iz.napomena) + '</p>' : '') + '</div>'; }
  if (z.vrsta === 'lanac') return '<div class="chain">' + z.karike.map((k, i) => (i ? '<span class="ar">→</span>' : '') +
    (i === z.praznina ? '<div class="lk q' + (done ? ' ok' : '') + '">' + (done ? fmt(right.tekst) : '?') + '</div>' : '<div class="lk">' + fmt(k) + '</div>')).join('') + '</div>';
  if (z.vrsta === 'ko_sam') { const n = Math.min(z.tragovi.length, done ? z.tragovi.length : s.miss + 1);
    return '<ul class="clues">' + z.tragovi.slice(0, n).map((t, i) => '<li><span class="k">Trag ' + (i + 1) + '</span>' + fmt(t) + '</li>').join('') + '</ul>'; }
  return '';
}
function renderChoice(z, s) {   // izbor, zakljuci, lanac, izvor, ko_sam (+ the correction step of tacno_netacno)
  const opts = shuffled(z.odgovori, z.id);
  const multi = z.odgovori.filter(o => o.tacan).length > 1;
  const ui = s.ui; ui.wrong = ui.wrong || []; ui.pick = ui.pick || [];
  const done = isDone(s), showRight = s.status === 'ok' || s.status === 'revealed';
  const why = o => o.zasto ? '<span class="why">' + fmt(o.zasto) + '</span>' : '';
  main.innerHTML = frame(z, s, prelude(z, s) + '<h2 class="q">' + fmt(z.pitanje || (z.vrsta === 'ko_sam' ? 'Ko sam ja?' : 'Koja karika nedostaje?')) + '</h2><div class="opts">' + opts.map(([o, i]) =>
    '<button type="button" class="opt' + (multi ? '' : ' round') + (ui.wrong.includes(i) ? ' wrong' : '') + (showRight && o.tacan ? ' right' : '') +
    (!done && ui.pick.includes(i) ? ' picked' : '') + '" data-i="' + i + '"' + (done || ui.wrong.includes(i) ? ' disabled' : '') + '><span class="box"></span><span><span class="ot">' + fmt(o.tekst) + '</span>' +
    (ui.wrong.includes(i) ? why(o) : '') + '</span></button>').join('') + '</div>');
  if (!done && multi) actions([['btnCheck', 'Proveri', 'ok']]);
  if (!done && z.vrsta === 'ko_sam' && s.miss < steps(z)) { actions([['btnClue', 'Još jedan trag']]); document.getElementById('btnClue').addEventListener('click', () => { ui.why = null; fail(z, 'Novi trag', 'zatražen novi trag'); }); }
  main.querySelectorAll('.opt').forEach(b => b.addEventListener('click', () => {

const P = MAPI.proj;

function mountMap(z, s, onClick) {

  const setVB = () => { svg.setAttribute('viewBox', vb.join(' ')); s.ui.vb = vb; };
  setVB();

    if (!f) { vb = [0, 0, P.w, P.h]; setVB(); return; }
    const nw = Math.min(P.w, Math.max(P.w / 14, vb[2] / f)), nh = nw * P.h / P.w;
    cx = cx == null ? vb[0] + vb[2] / 2 : cx; cy = cy == null ? vb[1] + vb[3] / 2 : cy;

  let down = null;
  svg.addEventListener('pointerdown', e => { down = { x: e.clientX, y: e.clientY, vb: vb.slice(), moved: false, target: e.target }; svg.setPointerCapture(e.pointerId); });
