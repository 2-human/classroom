          strana: 35
          odeljak: Položaj
          tekst: Španiji pripadaju i dva grada na teritoriji afričke države Maroko — eksklave Seuta i Melilja.

      - id: polozaj-povezi-pojmovi
        vrsta: povezi
        tezina: srednje
        pojmovi: [transkontinentalna-zemlja, eksklava, kanarska-ostrva, seuta, melilja]
        pitanje: Poveži pojam sa objašnjenjem.
        parovi:
          - [transkontinentalna zemlja, "država čija se teritorija prostire na dva kontinenta"]
          - [eksklava, "deo teritorije jedne države okružen tuđom teritorijom"]
          - [Kanarska ostrva, "ostrva u Atlantiku koja prirodno pripadaju Africi"]
          - [Seuta i Melilja, "španski gradovi na teritoriji Maroka"]
        pomoc:
          - „Trans-” znači „preko” — preko granice kontinenta.
          - Gradovi su na kopnu, a ostrva u okeanu.
          - "Iz lekcije: Španija je transkontinentalna zbog Kanarskih ostrva; Seuta i Melilja su eksklave u Maroku."
        objasnjenje: Kanarska ostrva i eksklave Seuta i Melilja su delovi Španije u Africi — zato je ona transkontinentalna zemlja.
        iz_udzbenika:
          strana: 35
          odeljak: Položaj
          tekst: Kanarska ostrva fizičko-geografski pripadaju Africi, pa je Španija transkontinentalna zemlja. U Maroku ima i dva grada — eksklave Seutu i Melilju.

