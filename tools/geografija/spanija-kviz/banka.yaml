        objasnjenje: Netačno — u Sredozemlju su Balearska ostrva; Kanarska su u Atlantskom okeanu, uz obalu Afrike.
        iz_udzbenika:
          strana: 35
          odeljak: Ostrva
          tekst: Najveća ostrva u Sredozemnom moru su Balearska; Kanarska ostrva su u Atlantiku i fizički pripadaju Africi.

