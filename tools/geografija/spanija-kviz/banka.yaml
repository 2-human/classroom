# Banka zadataka — Kraljevina Španija (7. razred, str. 35–37). Spaja se u spec.yaml: `delovi` zamenjuje
# spec-ove delove, `mesta` se dodaju u karta.mesta. Svaki zadatak ima `tezina` (lako | srednje | tesko).
# Pitanja su napisana sopstvenim rečima na osnovu beleške lekcije.

mesta: {}

delovi:
  - naslov: Položaj i osnovni podaci
    zadaci:
      - id: polozaj-izbor-poluostrvo
        vrsta: izbor
        tezina: lako
        pojmovi: [spanija, pirinejsko-poluostrvo]
        pitanje: Na kom poluostrvu se nalazi najveći deo Španije?
        odgovori:
          - {tekst: Pirinejsko, tacan: true}
          - {tekst: Apeninsko, tacan: false}
          - {tekst: Balkansko, tacan: false}
          - {tekst: Skandinavsko, tacan: false}
        pomoc:
          - Traži najzapadnije poluostrvo Južne Evrope.
          - Apeninsko je „čizma” Italije, a Balkansko je na istoku — to nisu tačni odgovori.
          - "Iz lekcije: Španija je najveća država Pirinejskog poluostrva."
        objasnjenje: Španija zauzima najveći deo Pirinejskog poluostrva; na njemu su još Portugalija i Andora.
        iz_udzbenika:
          strana: 35
          odeljak: Položaj
          tekst: Španija je najveća država Pirinejskog poluostrva, na jugozapadu Evrope.
          slika: 11-spanija/01-spanija-infookvir.jpg

      - id: polozaj-klik-spanija
        vrsta: karta_klik
        tezina: lako
        pojmovi: [spanija]
        pitanje: Klikni na kartu — Kraljevina Španija.
        cilj: {drzava: ESP}
        pomoc:
          - Španija zauzima najveći deo poluostrva na sredini karte.
          - Na zapadu ima manjeg suseda uz Atlantik, a na severoistoku je planinama odvojena od Francuske.
          - Klikni na najveću državu Pirinejskog poluostrva.
        objasnjenje: Španija zauzima veći deo Pirinejskog poluostrva; Portugalija je uska država na njegovom zapadu.
        iz_udzbenika:
          strana: 35
          odeljak: Položaj
          tekst: Na karti uz infookvir Španija je obojena crveno — zauzima veći deo Pirinejskog poluostrva, zajedno sa Balearskim ostrvima.
          slika: 11-spanija/01-spanija-infookvir.jpg

      - id: polozaj-tn-mora
        vrsta: tacno_netacno
        tezina: lako
        pojmovi: [atlantski-okean, sredozemno-more]
        tvrdnja: Španija izlazi i na Atlantski okean i na Sredozemno more.
        tacno: true
        pomoc:
          - Pogledaj obale Španije na severu i zapadu, pa na istoku i jugu.
          - Sa jedne strane je okean, sa druge more između Evrope i Afrike.
          - "Iz lekcije: Španija ima povoljan položaj jer izlazi na Atlantik i na Sredozemno more."
        objasnjenje: Tačno — na severu i zapadu je Atlantski okean, a na istoku i jugu Sredozemno more.
        iz_udzbenika:
          strana: 35
          odeljak: Položaj
          tekst: Položaj Španije je povoljan jer izlazi i na Atlantski okean i na Sredozemno more.

      - id: polozaj-dopuni-podaci
        vrsta: dopuni
        tezina: lako
        pojmovi: [madrid, spanija]
        pitanje: Dopuni rečenicu rečima iz banke.
        tekst: Glavni grad Španije je {{Madrid}}, a službeni jezik je {{španski}}.
        ponudjene: [Madrid, španski, Barselona, portugalski]
        pomoc:
          - Glavni grad je u središtu zemlje, na visoravni.
          - Jezik nosi ime same države.
          - "Iz lekcije (infookvir): glavni grad Madrid, službeni jezik španski."
        objasnjenje: Glavni grad je Madrid, a službeni jezik španski. Barselona je drugi veliki grad, na obali.
        iz_udzbenika:
          strana: 35
          odeljak: Osnovni podaci
          tekst: Infookvir navodi broj stanovnika, površinu, glavni grad Madrid i službeni jezik — španski.
          slika: 11-spanija/01-spanija-infookvir.jpg

      - id: polozaj-izbor-zastava
        vrsta: izbor
        tezina: lako
        pojmovi: [spanija]
        pitanje: Kako izgleda zastava Španije?
        odgovori:
          - {tekst: "crveno–žuto–crvena vodoravna polja, sa grbom", tacan: true}
          - {tekst: "plavo–belo–crvena uspravna polja", tacan: false}
          - {tekst: "zeleno–belo–crvena uspravna polja", tacan: false}
          - {tekst: "bela zastava sa crvenim krstom", tacan: false}
        pomoc:
          - Zastava ima samo dve boje (pored grba).
          - Polja su vodoravna, a srednje je široko i žuto.
          - "Iz lekcije: u infookviru je zastava sa crvenim i žutim vodoravnim poljima i grbom."
        objasnjenje: Zastava Španije ima crveno–žuto–crvena vodoravna polja i grb. Zeleno–belo–crvena je zastava Italije.
        iz_udzbenika:
          strana: 35
          odeljak: Osnovni podaci
          tekst: Iznad karte u infookviru je zastava Španije — crveno, žuto i crveno vodoravno polje, sa grbom.
          slika: 11-spanija/01-spanija-infookvir.jpg

      - id: polozaj-klik-portugalija
        vrsta: karta_klik
        tezina: lako
        pojmovi: [portugalija, pirinejsko-poluostrvo]
        pitanje: Klikni na državu sa kojom Španija deli Pirinejsko poluostrvo, na njegovom zapadu.
        cilj: {drzava: PRT}
        pomoc:
          - Traži usku državu uz Atlantski okean.
          - Kroz nju teku donji tokovi reka Taho (Težo) i Duero.
          - Klikni na Portugaliju, zapadno od Španije.
        objasnjenje: Portugalija je zapadni sused Španije na Pirinejskom poluostrvu; kroz nju se reke Taho i Duero ulivaju u Atlantik.
        iz_udzbenika:
          strana: 35
          odeljak: Fizička karta
          tekst: Na nemoj fizičkoj karti Portugalija je obojena sivo, a Španija bojama visina; obe dele Pirinejsko poluostrvo.
          slika: 11-spanija/02-fizicka-karta-spanije.jpg

      - id: polozaj-klik-francuska
        vrsta: karta_klik
        tezina: lako
        pojmovi: [pirineji]
        pitanje: Klikni na državu od koje Španiju na severoistoku odvajaju Pirineji.
        cilj: {drzava: FRA}
        pomoc:
          - Pirineji su na severoistoku Španije.
          - Traži veliku državu severno od tih planina.
          - Klikni na Francusku.
        objasnjenje: Pirineji su granica Španije i Francuske; između njih je i minijaturna Andora.
        iz_udzbenika:
          strana: 35
          odeljak: Reljef
          tekst: Najviše planine Španije su Pirineji, na severoistoku, na granici sa Francuskom.
          slika: 11-spanija/04-pirineji.jpg

      - id: polozaj-zakljuci-povoljan
        vrsta: zakljuci
        tezina: lako
        pojmovi: [atlantski-okean, sredozemno-more]
        pitanje: Zašto se kaže da Španija ima povoljan geografski položaj?
        odgovori:
          - {tekst: "Izlazi i na Atlantski okean i na Sredozemno more.", tacan: true}
          - {tekst: "Nema izlaz na more, pa je zaštićena.", tacan: false}
          - {tekst: "Nalazi se na severu Evrope.", tacan: false}
          - {tekst: "Sa svih strana je okružena planinama.", tacan: false}
        pomoc:
          - "Korak 1: Pogledaj koliko vodenih površina dodiruje obala Španije."
          - "Korak 2: Izlaz na dva mora olakšava trgovinu i saobraćaj."
          - "Iz lekcije: položaj je povoljan jer izlazi na Atlantik i na Sredozemlje."
        objasnjenje: Španija izlazi na okean i na more, pa ima vezu i sa Atlantikom i sa Sredozemljem.
        iz_udzbenika:
          strana: 35
          odeljak: Položaj
          tekst: Španija ima povoljan položaj — izlazi i na Atlantski okean i na Sredozemno more.

      - id: polozaj-klik-madrid
        vrsta: karta_klik
        tezina: lako
        pojmovi: [madrid, mezeta]
        pitanje: Klikni na glavni grad Španije.
        cilj: {mesto: madrid}
        pomoc:
          - Glavni grad je u samom središtu zemlje.
          - Leži na visoravni Mezeti.
          - Klikni tačno u sredinu Španije.
        objasnjenje: Madrid je u središtu Španije, na visoravni Mezeti.
        iz_udzbenika:
          strana: 35
          odeljak: Reljef
          tekst: Na visoravni Mezeti, u središtu Španije, nalazi se glavni grad Madrid.

      - id: polozaj-gde-spanija
        vrsta: gde_sam
        tezina: lako
        pojmovi: [spanija, pirinejsko-poluostrvo]
        pitanje: Gde sam? Pročitaj trag i klikni državu na karti.
        cilj: {drzava: ESP}
        tragovi:
          - U meni žive katolici romanskog porekla, a nacionalni ples mi je flamenko.
          - Pripadaju mi Balearska i Kanarska ostrva.
          - Izlazim i na Atlantski okean i na Sredozemno more.
          - Ja sam najveća država Pirinejskog poluostrva, a glavni grad mi je Madrid.
        objasnjenje: Španija — najveća država Pirinejskog poluostrva, sa glavnim gradom Madridom.
        iz_udzbenika:
          strana: 35
          odeljak: Položaj
          tekst: Španija je najveća država Pirinejskog poluostrva i izlazi i na Atlantski okean i na Sredozemno more.
          slika: 11-spanija/01-spanija-infookvir.jpg

      - id: polozaj-izbor-stanovnici
        vrsta: izbor
        tezina: srednje
        pojmovi: [spanija]
        pitanje: Koliko otprilike stanovnika ima Španija?
