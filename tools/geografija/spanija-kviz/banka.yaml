        pomoc:
          - Površina je veća od pola miliona km².
          - Stanovnika ima skoro 50 miliona.
          - "Iz lekcije (infookvir): 505.370 km² i 47,8 miliona stanovnika."
        objasnjenje: Površina Španije je 505.370 km², a broj stanovnika oko 47,8 miliona.
