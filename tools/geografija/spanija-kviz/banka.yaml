      - id: polozaj-tn-najveca
        vrsta: tacno_netacno
        tezina: srednje
        pojmovi: [portugalija, pirinejsko-poluostrvo]
        tvrdnja: Portugalija je najveća država Pirinejskog poluostrva.
        tacno: false
        ispravke:
          - {tekst: "Najveća država Pirinejskog poluostrva je Španija.", tacan: true}
          - {tekst: "Najveća država Pirinejskog poluostrva je Andora.", tacan: false}
          - {tekst: "Najveća država Pirinejskog poluostrva je Francuska.", tacan: false}
        pomoc:
          - Uporedi na karti veličinu Portugalije i njenog istočnog suseda.
          - Francuska je severno od Pirineja, a Andora je minijaturna država.
          - "Iz lekcije: Španija je najveća država Pirinejskog poluostrva."
        objasnjenje: Netačno — najveća je Španija; Portugalija je manja država na zapadu poluostrva.
        iz_udzbenika:
          strana: 35
          odeljak: Položaj
          tekst: Španija je najveća država Pirinejskog poluostrva.

      - id: polozaj-klik-maroko
        vrsta: karta_klik
        tezina: srednje
        pojmovi: [maroko, seuta, melilja]
        pitanje: Klikni na afričku državu na čijoj obali su španski gradovi Seuta i Melilja.
        cilj: {drzava: MAR}
        pomoc:
          - Traži državu u Africi, preko puta južne obale Španije.
