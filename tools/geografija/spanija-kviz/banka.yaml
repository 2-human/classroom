          - "Korak 2: Koji španski delovi se nalaze na tom kontinentu ili uz njega?"
          - "Iz lekcije: Kanarska ostrva fizički spadaju u Afriku, a Seuta i Melilja su na afričkom tlu."
        objasnjenje: Španija ima Kanarska ostrva (Afrika) i gradove Seutu i Melilju na afričkom tlu, pa joj se teritorija prostire na dva kontinenta.
        iz_udzbenika:
          strana: 35
          odeljak: Položaj
          tekst: Kanarska ostrva fizičko-geografski spadaju u Afriku, a Seuta i Melilja su u Maroku — zato je Španija transkontinentalna zemlja.

