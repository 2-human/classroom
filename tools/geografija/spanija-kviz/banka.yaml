          - {tekst: "oko 7,8 miliona", tacan: false}
          - {tekst: "oko 478 miliona", tacan: false}
          - {tekst: "oko 87,4 miliona", tacan: false}
        pomoc:
          - Srbija ima oko 7 miliona stanovnika — Španija ih ima mnogo više.
          - Broj je malo manji od 50 miliona.
          - "Iz lekcije (infookvir): 47,8 miliona stanovnika."
        objasnjenje: Španija ima oko 47,8 miliona stanovnika.
        iz_udzbenika:
          strana: 35
          odeljak: Osnovni podaci
          tekst: Prema infookviru, Španija ima 47,8 miliona stanovnika i površinu od 505.370 km².
          slika: 11-spanija/01-spanija-infookvir.jpg

