# Republika Hrvatska — kviz po lekciji (tip: lesson-quiz; vidi templates/lesson-quiz/README.md).
# Pitanja su napisana sopstvenim rečima na osnovu lekcije „Republika Hrvatska” (7. razred, str. 25–27).
# `iz_udzbenika` (posle odgovora, u fioci): strana, odeljak, sažetak sopstvenim rečima i slika iz
# privatnog tools/geografija/_source/slike-7/ (prikazuje se samo kad taj folder postoji — van git-a).
title: Republika Hrvatska — kviz
title_short: Hrvatska
locale: sr
nivo: osnovna
razred: 7
lekcije: [7]
description: >-
  Kviz za lekciju Republika Hrvatska: položaj i oblik „potkovice”, tri reljefne celine, reke i klima,
  stanovništvo, privreda i turizam — uz snalaženje na karti (planine, ostrva, reke, gradovi).

karta:
  extent: {lon: [11.6, 21.4], lat: [41.9, 46.9]}
  mid_lat_for_aspect: 44.4
  geo_data: ../../../shared/data/countries.geojson
  # Hrvatska i susedi (klikabilne). KOS se crta i broji kao deo Srbije (stav udžbenika).
  drzave:
    HRV: Hrvatska
    SVN: Slovenija
    HUN: Mađarska
    SRB: Srbija
    BIH: Bosna i Hercegovina
    MNE: Crna Gora
    ITA: Italija
  spoji: {KOS: SRB}
  # Tačke za zadatke kojima je cilj mesto. Ne crtaju se dok se ne pogode.
  mesta:
    zagreb: {naziv: Zagreb, lat: 45.81, lon: 15.98, radius_km: 30}
    slavonija: {naziv: Panonska nizija (Slavonija), lat: 45.50, lon: 17.50, radius_km: 90}
