# Banka zadataka — Republika Hrvatska (7. razred, str. 25–27). Spaja se u spec.yaml: `delovi` zamenjuje
# spec-ove delove, `mesta` se dodaju u karta.mesta. Svaki zadatak ima `tezina` (lako | srednje | tesko).
# Pitanja su napisana sopstvenim rečima na osnovu beleške lekcije.

mesta: {}

delovi:
  - naslov: Položaj i opšti podaci
    zadaci:
      - id: polozaj-izbor-poluostrvo
        vrsta: izbor
        tezina: lako
        pojmovi: [hrvatska, balkansko-poluostrvo]
        pitanje: Na kom poluostrvu se nalazi Hrvatska?
        odgovori:
          - {tekst: Balkanskom, tacan: true}
          - {tekst: Apeninskom, tacan: false}
          - {tekst: Pirinejskom, tacan: false}
          - {tekst: Skandinavskom, tacan: false}
        pomoc:
          - Hrvatska je bivša republika SFRJ, kao i Srbija.
          - Apeninsko poluostrvo je Italija, a Pirinejsko Španija i Portugalija.
          - "Iz lekcije: Hrvatska leži u zapadnom delu Balkanskog poluostrva."
        objasnjenje: Hrvatska se nalazi u zapadnom delu Balkanskog poluostrva i izlazi na Jadransko more.
        iz_udzbenika:
          strana: 25
          odeljak: Republika Hrvatska — uvod
          tekst: Hrvatska zauzima zapadni deo Balkanskog poluostrva i ima izlaz na Jadransko more.
          slika: 07-hrvatska/01-zastava-i-polozaj-hrvatske.jpg

      - id: polozaj-klik-hrvatska
        vrsta: karta_klik
        tezina: lako
        pojmovi: [hrvatska, potkovica]
        pitanje: Klikni na kartu — Republika Hrvatska.
        cilj: {drzava: HRV}
        pomoc:
          - Traži državu koja izlazi na Jadransko more, preko puta Italije.
          - Teritorija joj je savijena kao potkovica oko jedne susedne države.
          - "Iz lekcije: Hrvatska je u zapadnom delu Balkanskog poluostrva i ima oblik potkovice."
        objasnjenje: Hrvatska se pruža lukom od Panonske nizije na severoistoku do Dalmacije na jugu, duž Jadranskog mora.
        iz_udzbenika:
          strana: 25
          odeljak: Republika Hrvatska — uvod
          tekst: Na maloj karti uz infookvir Hrvatska je obojena crveno; jasno se vidi njen oblik potkovice — panonski deo na severu i dugi primorski pojas duž Jadrana.
          slika: 07-hrvatska/01-zastava-i-polozaj-hrvatske.jpg

      - id: polozaj-dopuni-oblik
        vrsta: dopuni
        tezina: lako
        pojmovi: [potkovica, jadransko-more]
        pitanje: Dopuni rečenicu rečima iz banke.
        tekst: Teritorija Hrvatske liči na {{potkovicu}}, a država izlazi na {{Jadransko}} more.
        ponudjene: [potkovicu, Jadransko, čizmu, Crno]
        pomoc:
          - Oblik čizme ima Italija; Hrvatska je savijena u luk.
          - More uz Hrvatsku je između Balkanskog i Apeninskog poluostrva.
          - "Iz lekcije: teritorija je u obliku potkovice, a država izlazi na Jadransko more."
        objasnjenje: Hrvatska ima oblik potkovice i izlazi na Jadransko more.
        iz_udzbenika:
          strana: 25
          odeljak: Republika Hrvatska — uvod
          tekst: Hrvatska je neobična po obliku teritorije, koji podseća na potkovicu; ima izlaz na Jadransko more.
          slika: 07-hrvatska/01-zastava-i-polozaj-hrvatske.jpg

      - id: polozaj-tn-zagreb
        vrsta: tacno_netacno
        tezina: lako
        pojmovi: [zagreb, hrvatska]
        tvrdnja: Glavni grad Hrvatske je Zagreb.
        tacno: true
        pomoc:
          - Pogledaj infookvir sa opštim podacima o državi.
          - Glavni grad leži na severozapadu zemlje, na reci Savi.
          - "Iz lekcije: glavni grad je Zagreb."
        objasnjenje: Tačno — Zagreb je glavni grad Hrvatske.
        iz_udzbenika:
          strana: 25
          odeljak: Opšti podaci
          tekst: U infookviru stoji da je glavni grad Hrvatske Zagreb, a službeni jezik hrvatski.

      - id: polozaj-tn-zastava
        vrsta: tacno_netacno
        tezina: lako
        pojmovi: [hrvatska]
        tvrdnja: Na zastavi Hrvatske je grb sa crveno-belim kvadratićima („šahovnica”).
        tacno: true
        pomoc:
          - Zastava je crveno-belo-plava trobojka sa grbom u sredini.
          - Grb liči na tablu za šah.
          - "Iz lekcije: na zastavi je grb sa crveno-belim poljima — šahovnica."
        objasnjenje: Tačno — zastava Hrvatske je crveno-belo-plava trobojka sa grbom „šahovnicom”.
        iz_udzbenika:
          strana: 25
          odeljak: Opšti podaci
          tekst: Uz infookvir je zastava Hrvatske — crvena, bela i plava vodoravna polja i grb sa crveno-belim kvadratićima.
          slika: 07-hrvatska/01-zastava-i-polozaj-hrvatske.jpg

      - id: polozaj-povezi-podaci
        vrsta: povezi
        tezina: lako
        pojmovi: [hrvatska, zagreb]
        pitanje: Poveži podatak o Hrvatskoj sa njegovom vrednošću.
        parovi:
          - [Broj stanovnika, "3,9 miliona"]
          - [Površina, "56.594 km²"]
          - [Glavni grad, Zagreb]
          - [Službeni jezik, hrvatski]
        pomoc:
          - Kreni od para koji je najlakši — glavni grad.
          - Površina se meri u km², a broj stanovnika u milionima.
          - "Iz lekcije: 3,9 miliona stanovnika, 56.594 km², Zagreb, hrvatski jezik."
        objasnjenje: Hrvatska ima 3,9 miliona stanovnika i površinu 56.594 km²; glavni grad je Zagreb, a službeni jezik hrvatski.
        iz_udzbenika:
          strana: 25
          odeljak: Opšti podaci
          tekst: Infookvir daje četiri podatka — 3,9 miliona stanovnika, površinu 56.594 km², glavni grad Zagreb i službeni jezik hrvatski.

      - id: polozaj-dopuni-podaci
        vrsta: dopuni
        tezina: srednje
        pojmovi: [hrvatska]
        pitanje: Dopuni podatke o Hrvatskoj rečima iz banke.
        tekst: Hrvatska ima površinu {{56.594|56594|56 594}} km² i oko {{3,9|3.9}} miliona stanovnika; službeni jezik je {{hrvatski}}.
        ponudjene: ["56.594", "3,9", hrvatski, "88.499", "9,3", srpski]
        pomoc:
          - Površina je veća od 50.000 km², ali manja od površine Srbije.
          - Stanovnika ima manje od četiri miliona; jezik nosi ime naroda.
          - "Iz lekcije: 56.594 km², 3,9 miliona stanovnika, hrvatski jezik."
        objasnjenje: Površina Hrvatske je 56.594 km², ima oko 3,9 miliona stanovnika, a službeni jezik je hrvatski.
        iz_udzbenika:
          strana: 25
          odeljak: Opšti podaci
          tekst: Infookvir — 56.594 km² površine, 3,9 miliona stanovnika, glavni grad Zagreb, službeni jezik hrvatski.

      - id: polozaj-tn-istocni
        vrsta: tacno_netacno
        tezina: srednje
        pojmovi: [hrvatska, balkansko-poluostrvo]
        tvrdnja: Hrvatska leži u istočnom delu Balkanskog poluostrva, uz Crno more.
        tacno: false
        ispravke:
          - {tekst: "Leži u zapadnom delu Balkanskog poluostrva i izlazi na Jadransko more.", tacan: true}
          - {tekst: "Leži na Apeninskom poluostrvu, uz Jadransko more.", tacan: false}
          - {tekst: "Leži u južnom delu poluostrva, uz Egejsko more.", tacan: false}
        pomoc:
          - Na karti pogledaj na koju stranu Balkana izlazi Hrvatska.
          - Crno more je uz Bugarsku i Rumuniju; Hrvatska je na suprotnoj strani poluostrva.
          - "Iz lekcije: zapadni deo Balkanskog poluostrva, izlaz na Jadransko more."
        objasnjenje: Netačno — Hrvatska je u zapadnom delu Balkanskog poluostrva i izlazi na Jadransko more.
        iz_udzbenika:
          strana: 25
          odeljak: Republika Hrvatska — uvod
          tekst: Hrvatska zauzima zapadni deo Balkanskog poluostrva i ima izlaz na Jadransko more.
          slika: 07-hrvatska/01-zastava-i-polozaj-hrvatske.jpg

      - id: polozaj-zakljuci-more
        vrsta: zakljuci
        tezina: lako
        pojmovi: [hrvatska, jadransko-more]
        pitanje: Hrvatska ima izlaz na Jadransko more. Šta iz toga sledi?
        odgovori:
          - {tekst: "Ima dugu obalu, pa su joj važni more, luke i turizam.", tacan: true}
          - {tekst: "Nema nijednu luku.", tacan: false}
          - {tekst: "U njoj nema reka.", tacan: false}
          - {tekst: "Graniči se sa Afrikom.", tacan: false}
        pomoc:
          - "Korak 1: Šta jedna država dobija kad izlazi na more?"
          - "Korak 2: Koja od ponuđenih tvrdnji je u skladu sa obalom, a koje su besmislene?"
          - "Iz lekcije: Hrvatska izlazi na Jadran; turizam na obali ima veliki značaj za privredu."
        objasnjenje: Izlaz na more daje Hrvatskoj obalu, luke (npr. Rijeka) i razvijen turizam.
        iz_udzbenika:
          strana: 25
          odeljak: Republika Hrvatska — uvod
          tekst: Hrvatska ima izlaz na Jadransko more, uz koje se pruža cela njena primorska oblast.

      - id: polozaj-gde-sam-hrvatska
        vrsta: gde_sam
        tezina: lako
        pojmovi: [hrvatska, potkovica]
        pitanje: Gde sam? Pročitaj trag i klikni državu na karti.
        cilj: {drzava: HRV}
        tragovi:
          - Na mojoj zastavi je grb sa crveno-belim kvadratićima.
          - Moja najveća ostrva su Krk, Cres, Brač, Hvar, Pag i Korčula.
          - Glavni grad mi je Zagreb.
          - Imam oblik potkovice i dugu obalu Jadranskog mora.
        objasnjenje: Hrvatska — država u obliku potkovice na zapadu Balkana, sa glavnim gradom Zagrebom.
        iz_udzbenika:
          strana: 25
          odeljak: Republika Hrvatska — uvod
          tekst: Hrvatska leži na zapadu Balkanskog poluostrva, izlazi na Jadran i ima teritoriju u obliku potkovice.
          slika: 07-hrvatska/01-zastava-i-polozaj-hrvatske.jpg

      - id: polozaj-klik-zagreb
        vrsta: karta_klik
        tezina: lako
        pojmovi: [zagreb, sava]
        pitanje: Klikni na kartu — glavni grad Hrvatske.
        cilj: {mesto: zagreb}
        pomoc:
          - Glavni grad nije na moru, već u unutrašnjosti, na severu zemlje.
          - Leži na reci Savi, blizu granice sa Slovenijom.
          - "Iz lekcije: glavni grad je Zagreb (severozapad, na Savi)."
        objasnjenje: Zagreb je na severozapadu Hrvatske, na reci Savi.
        iz_udzbenika:
          strana: 25
          odeljak: Opšti podaci
          tekst: Glavni grad Hrvatske je Zagreb, koji je ujedno i jedno od najposećenijih turističkih mesta.

      - id: polozaj-klik-bih
        vrsta: karta_klik
        tezina: srednje
        pojmovi: [potkovica, hrvatska]
        pitanje: Klikni državu koju Hrvatska, poput potkovice, obuhvata sa severa i sa zapada.
        cilj: {drzava: BIH}
        pomoc:
          - Pronađi Hrvatsku i pogledaj šta se nalazi „u udubljenju” njene potkovice.
          - Ta država ima samo vrlo kratku obalu, kod Neuma.
          - "Iz lekcije: Hrvatska ima oblik potkovice — luk od Panonije do Dalmacije."
        objasnjenje: Bosna i Hercegovina se nalazi unutar luka koji čini teritorija Hrvatske.
        iz_udzbenika:
          strana: 25
          odeljak: Republika Hrvatska — uvod
          tekst: Teritorija Hrvatske je u obliku potkovice — luk se pruža od Panonske nizije preko Like do Dalmacije.
          slika: 07-hrvatska/01-zastava-i-polozaj-hrvatske.jpg

      - id: polozaj-klik-srbija
        vrsta: karta_klik
        tezina: srednje
        pojmovi: [dunav, hrvatska]
        pitanje: Klikni susednu državu od koje Hrvatsku na krajnjem istoku odvaja reka Dunav.
        cilj: {drzava: SRB}
        pomoc:
          - Dunav teče na krajnjem istoku Hrvatske, blizu Vukovara.
          - Ta država se na tom delu prostire Panonskom nizijom (Vojvodina).
          - "Iz lekcije: Dunav je na krajnjem istoku Hrvatske, na granici sa Srbijom."
        objasnjenje: Na istoku Dunav čini granicu između Hrvatske i Srbije.
        iz_udzbenika:
          strana: 26
          odeljak: Fizičko-geografske odlike — reke
          tekst: Među najvećim rekama Hrvatske je i Dunav, koji teče njenim krajnjim istokom, uz granicu sa Srbijom.
          slika: 07-hrvatska/05-fizicka-karta-hrvatske.jpg

      - id: polozaj-zakljuci-potkovica
        vrsta: zakljuci
        tezina: tesko
        pojmovi: [potkovica, dubrovnik]
        pitanje: Kako oblik potkovice utiče na povezanost delova Hrvatske?
        odgovori:
          - {tekst: "Sever i jug su spojeni samo uskim pojasom, pa su putevi dugi, a Dubrovnik je od ostatka zemlje odvojen kratkim pojasom BiH.", tacan: true}
          - {tekst: "Svi delovi su podjednako blizu Zagreba, pa je putovanje vrlo kratko.", tacan: false}
          - {tekst: "Oblik nema nikakav uticaj na saobraćaj.", tacan: false}
          - {tekst: "Zbog oblika Hrvatska nema izlaz na more.", tacan: false}
        pomoc:
          - "Korak 1: Na karti prati luk od Slavonije do Dubrovnika — koliko je dug i koliko je na nekim mestima uzan?"
          - "Korak 2: Šta se dešava sa putevima kad je država izdužena i uska? Pogledaj i obalu kod Neuma."
          - "Iz lekcije: teritorija je u obliku potkovice — od Panonije preko Like do Dalmacije."
        objasnjenje: Zbog izduženog i uskog oblika veze između severa i juga su duge, a Dubrovnik je od ostatka Hrvatske odvojen obalnim pojasom BiH kod Neuma.
        iz_udzbenika:
          strana: 25
          odeljak: Republika Hrvatska — uvod
          tekst: Teritorija Hrvatske ima neobičan oblik potkovice — luk koji ide od Panonske nizije preko Like do Dalmacije.
          slika: 07-hrvatska/01-zastava-i-polozaj-hrvatske.jpg

  - naslov: Reljef
    zadaci:
      - id: reljef-izbor-celine
        vrsta: izbor
        tezina: lako
        pojmovi: [panonska-nizija, dinarske-planine, primorska-oblast]
        pitanje: Koje reljefne celine se izdvajaju u Hrvatskoj? (Više tačnih.)
        odgovori:
          - {tekst: panonska, tacan: true}
          - {tekst: planinska, tacan: true}
          - {tekst: primorska, tacan: true}
          - {tekst: pustinjska, tacan: false}
          - {tekst: vulkanska, tacan: false}
        pomoc:
          - Tačne su tri celine — ravnica, planine i obala.
          - U Hrvatskoj nema pustinja ni vulkana.
          - "Iz lekcije: u reljefu se izdvajaju panonska, planinska i primorska celina."
        objasnjenje: Reljef Hrvatske čine tri celine — panonska na severoistoku, planinska u unutrašnjosti i primorska uz Jadran.
        iz_udzbenika:
          strana: 25
          odeljak: Fizičko-geografske odlike — reljef
          tekst: U reljefu Hrvatske razlikuju se tri celine — panonska, planinska i primorska.
          slika: 07-hrvatska/05-fizicka-karta-hrvatske.jpg

      - id: reljef-povezi-celine
        vrsta: povezi
        tezina: lako
        pojmovi: [panonska-nizija, dinarske-planine, primorska-oblast]
        pitanje: Poveži reljefnu celinu sa njenim opisom.
        parovi:
          - [panonska celina, "ravnica na severoistoku, deo Panonske nizije"]
          - [planinska celina, "unutrašnjost, Dinarske planine"]
          - [primorska celina, "uska obala Jadrana sa mnogo ostrva"]
        pomoc:
          - Ime svake celine već govori šta je u njoj.
          - Panonska nizija je ravnica, a primorje je uz more.
          - "Iz lekcije: panonska — ravnica na severoistoku; planinska — Dinaridi; primorska — uz Jadran."
        objasnjenje: Panonska celina je ravnica na severoistoku, planinska su Dinaridi u unutrašnjosti, a primorska je uska obala sa ostrvima.
        iz_udzbenika:
          strana: 25
          odeljak: Fizičko-geografske odlike — reljef
          tekst: Na severoistoku je prostrana ravnica (deo Panonske nizije), u unutrašnjosti su Dinarske planine, a uz Jadransko more je uska primorska oblast.
          slika: 07-hrvatska/05-fizicka-karta-hrvatske.jpg

      - id: reljef-izbor-razudjena
        vrsta: izbor
        tezina: lako
        pojmovi: [razudjena-obala, primorska-oblast]
        pitanje: Kakva je obala Hrvatske prema razuđenosti?
        odgovori:
          - {tekst: "razuđena — ima mnogo ostrva, poluostrva i zaliva", tacan: true}
          - {tekst: "nerazuđena — ravna, bez ostrva i zaliva", tacan: false}
          - {tekst: "peskovita i bez ostrva", tacan: false}
          - {tekst: "Hrvatska nema obalu", tacan: false}
        pomoc:
          - Razuđena obala je „izrezana” — ima mnogo ostrva, zaliva i poluostrva.
          - Pogledaj na karti koliko ostrva leži uz hrvatsku obalu.
          - "Iz lekcije: primorska oblast ima veliki broj ostrva, poluostrva i zaliva."
        objasnjenje: Hrvatska obala je razuđena — ima mnogo ostrva, poluostrva i zaliva.
        iz_udzbenika:
          strana: 26
          odeljak: Fizičko-geografske odlike — reljef
          tekst: Primorska oblast se sastoji od velikog broja ostrva, poluostrva i zaliva, pa je obala razuđena.
          slika: 07-hrvatska/05-fizicka-karta-hrvatske.jpg

      - id: reljef-tn-obala-siroka
        vrsta: tacno_netacno
        tezina: lako
        pojmovi: [primorska-oblast, dinarske-planine]
        tvrdnja: Primorska oblast Hrvatske je široka ravnica.
        tacno: false
        ispravke:
          - {tekst: "Obala je uska, jer se planine strmo dižu iznad mora.", tacan: true}
          - {tekst: "Obala je široka, jer je na njoj Panonska nizija.", tacan: false}
          - {tekst: "Obala je uska, jer je prekrivena ledom.", tacan: false}
        pomoc:
          - Pogledaj fotografiju Velebita — šta se diže odmah iznad mora?
          - Panonska nizija je na severoistoku, daleko od mora.
          - "Iz lekcije: obala je uska jer se iznad mora strmo izdižu visoke planine."
        objasnjenje: Netačno — primorska oblast je uska, jer se Dinarske planine strmo uzdižu iznad mora.
        iz_udzbenika:
          strana: 25
          odeljak: Fizičko-geografske odlike — reljef
          tekst: Treća, primorska oblast nalazi se uz samu obalu Jadrana; obala je uska jer se visoke planine strmo dižu iznad mora.
          slika: 07-hrvatska/03-velebit.jpg

      - id: reljef-klik-slavonija
        vrsta: karta_klik
        tezina: lako
        pojmovi: [panonska-nizija]
        pitanje: Klikni na kartu — hrvatski deo Panonske nizije (Slavonija).
        cilj: {mesto: slavonija}
        pomoc:
          - Ravnica je u onom delu Hrvatske koji je najdalje od mora.
          - Traži severoistok zemlje, između Drave i Save.
          - "Iz lekcije: panonska celina je na severoistoku Hrvatske."
        objasnjenje: Hrvatski deo Panonske nizije (Slavonija) je na severoistoku, između Drave i Save.
        iz_udzbenika:
          strana: 26
          odeljak: Fizičko-geografske odlike — reljef
          tekst: Na fizičkoj karti zelena ravnica na severoistoku je Panonska nizija; fotografija pokazuje njena ravna, obrađena polja.
          slika: 07-hrvatska/02-panonska-nizija.jpg

      - id: reljef-klik-istra
        vrsta: karta_klik
        tezina: lako
        pojmovi: [istra]
        pitanje: Klikni na kartu — najveće poluostrvo Hrvatske.
        cilj: {mesto: istra}
        pomoc:
          - Poluostrvo je na krajnjem severozapadu Hrvatske.
          - Ima oblik trougla i okrenuto je prema Italiji.
          - "Iz lekcije: najveće poluostrvo je Istra."
        objasnjenje: Istra je najveće poluostrvo Hrvatske, na krajnjem severozapadu, prema Italiji.
        iz_udzbenika:
          strana: 26
          odeljak: Fizičko-geografske odlike — reljef
          tekst: Najveće poluostrvo hrvatske obale je Istra, na severozapadu zemlje.
          slika: 07-hrvatska/05-fizicka-karta-hrvatske.jpg

      - id: reljef-gde-sam-istra
        vrsta: gde_sam
        tezina: lako
        pojmovi: [istra, pula]
