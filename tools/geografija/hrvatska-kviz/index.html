naslov": "Reljef", "zadaci": [{"id": "reljef-izbor-celine", "vrsta": "izbor", "tezina": "lako", "pojmovi": ["panonska-nizija", "dinarske-planine", "primorska-oblast"], "pitanje": "Koje reljefne celine se izdvajaju u Hrvatskoj? (Više tačnih.)", "odgovori": [{"tekst": "panonska", "tacan": true}, {"tekst": "planinska", "tacan": true}, {"tekst": "primorska", "tacan": true}, {"tekst": "pustinjska", "tacan": false}, {"tekst": "vulkanska", "tacan": false}], "pomoc": ["Tačne su tri celine — ravnica, planine i obala.", "U Hrvatskoj nema pustinja ni vulkana.", "Iz lekcije: u reljefu se izdvajaju panonska, planinska i primorska celina."], "objasnjenje": "Reljef Hrvatske čine tri celine — panonska na severoistoku, planinska u unutrašnjosti i primorska uz Jadran.", "iz_udzbenika": {"strana": 25, "odeljak": "Fizičko-geografske odlike — reljef", "tekst": "U reljefu Hrvatske razlikuju se tri celine — panonska, planinska i primorska.", "slika": "07-hrvatska/05-fizicka-karta-hrvatske.jpg"}}, {"id": "reljef-povezi-celine", "vrsta": "povezi", "tezina": "lako", "pojmovi": ["panonska-nizija", "dinarske-planine", "primorska-oblast"], "pitanje": "Poveži reljefnu celinu sa njenim opisom.", "parovi": [["panonska celina", "ravnica na severoistoku, deo Panonske nizije"], ["planinska celina", "unutrašnjost, Dinarske planine"], ["primorska celina", "uska obala Jadrana sa mnogo ostrva"]], "pomoc": ["Ime svake celine već govori šta je u njoj.", "Panonska nizija je ravnica, a primorje je uz more.", "Iz lekcije: panonska — ravnica na severoistoku; planinska — Dinaridi; primorska — uz Jadran."], "objasnjenje": "Panonska celina je ravnica na severoistoku, planinska su Dinaridi u unutrašnjosti, a primorska je uska obala sa ostrvima.", "iz_udzbenika": {"strana": 25, "odeljak": "Fizičko-geografske odlike — reljef", "tekst": "Na severoistoku je prostrana ravnica (deo Panonske nizije), u unutrašnjosti su Dinarske planine, a uz Jadransko more je uska primorska oblast.", "slika": "07-hrvatska/05-fizicka-karta-hrvatske.jpg"}}, {"id": "reljef-izbor-razudjena", "vrsta": "izbor", "tezina": "lako", "pojmovi": ["razudjena-obala", "primorska-oblast"], "pitanje": "Kakva je obala Hrvatske prema razuđenosti?", "odgovori": [{"tekst": "razuđena — ima mnogo ostrva, poluostrva i zaliva", "tacan": true}, {"tekst": "nerazuđena — ravna, bez ostrva i zaliva", "tacan": false}, {"tekst": "peskovita i bez ostrva", "tacan": false}, {"tekst": "Hrvatska nema obalu", "tacan": false}], "pomoc": ["Razuđena obala je „izrezana” — ima mnogo ostrva, zaliva i poluostrva.", "Pogledaj na karti koliko ostrva leži uz hrvatsku obalu.", "Iz lekcije: primorska oblast ima veliki broj ostrva, poluostrva i zaliva."], "objasnjenje": "Hrvatska obala je razuđena — ima mnogo ostrva, poluostrva i zaliva.", "iz_udzbenika": {"strana": 26, "odeljak": "Fizičko-geografske odlike — reljef", "tekst": "Primorska oblast se sastoji od velikog broja ostrva, poluostrva i zaliva, pa je obala razuđena.", "slika": "07-hrvatska/05-fizicka-karta-hrvatske.jpg"}}, {"id": "reljef-tn-obala-siroka", "vrsta": "tacno_netacno", "tezina": "lako", "pojmovi": ["primorska-oblast", "dinarske-planine"], "tvrdnja": "Primorska oblast Hrvatske je široka ravnica.", "tacno": false, "ispravke": [{"tekst": "Obala je uska, jer se planine strmo dižu iznad mora.", "tacan": true}, {"tekst": "Obala je široka, jer je na njoj Panonska nizija.", "tacan": false}, {"tekst": "Obala je uska, jer je prekrivena ledom.", "tacan": false}], "pomoc": ["Pogledaj fotografiju Velebita — šta se diže odmah iznad mora?", "Panonska nizija je na severoistoku, daleko od mora.", "Iz lekcije: obala je uska jer se iznad mora strmo izdižu visoke planine."], "objasnjenje": "Netačno — primorska oblast je uska, jer se Dinarske planine strmo uzdižu iznad mora.", "iz_udzbenika": {"strana": 25, "odeljak": "Fizičko-geografske odlike — reljef", "tekst": "Treća, primorska oblast nalazi se uz samu obalu Jadrana; obala je uska jer se visoke planine strmo dižu iznad mora.", "slika": "07-hrvatska/03-velebit.jpg"}}, {"id": "reljef-klik-slavonija", "vrsta": "karta_klik", "tezina": "lako", "pojmovi": ["panonska-nizija"], "pitanje": "Klikni na kartu — hrvatski deo Panonske nizije (Slavonija).", "cilj": {"mesto": "slavonija"}, "pomoc": ["Ravnica je u onom delu Hrvatske koji je najdalje od mora.", "Traži severoistok zemlje, između Drave i Save.", "Iz lekcije: panonska celina je na severoistoku Hrvatske."], "objasnjenje": "Hrvatski deo Panonske nizije (Slavonija) je na severoistoku, između Drave i Save.", "iz_udzbenika": {"strana": 26, "odeljak": "Fizičko-geografske odlike — reljef", "tekst": "Na fizičkoj karti zelena ravnica na severoistoku je Panonska nizija; fotografija pokazuje njena ravna, obrađena polja.", "slika": "07-hrvatska/02-panonska-nizija.jpg"}}, {"id": "reljef-klik-istra", "vrsta": "karta_klik", "tezina": "lako", "pojmovi": ["istra"], "pitanje": "Klikni na kartu — najveće poluostrvo Hrvatske.", "cilj": {"mesto": "istra"}, "pomoc": ["Poluostrvo je na krajnjem severozapadu Hrvatske.", "Ima oblik trougla i okrenuto je prema Italiji.", "Iz lekcije: najveće poluostrvo je Istra."], "objasnjenje": "Istra je najveće poluostrvo Hrvatske, na krajnjem severozapadu, prema Italiji.", "iz_udzbenika": {"strana": 26, "odeljak": "Fizičko-geografske odlike — reljef", "tekst": "Najveće poluostrvo hrvatske obale je Istra, na severozapadu zemlje.", "slika": "07-hrvatska/05-fizicka-karta-hrvatske.jpg"}}, {"id": "reljef-gde-sam-istra", "vrsta": "gde_sam", "tezina": "lako", "pojmovi": ["istra", "pula"], "pitanje": "Gde sam? Pročitaj trag i klikni mesto na karti.", "cilj": {"mesto": "istra"}, "tragovi": ["Na mom jugu je grad Pula, jedno od najposećenijih turističkih mesta.", "Okrenuta sam prema Italiji, preko puta Venecije.", "Nalazim se na krajnjem severozapadu Hrvatske i imam oblik trougla.", "Ja sam najveće poluostrvo Hrvatske."], "objasnjenje": "Istra — najveće poluostrvo Hrvatske, na severozapadu; na njenom jugu je Pula.", "iz_udzbenika": {"strana": 26, "odeljak": "Fizičko-geografske odlike — reljef", "tekst": "Najveće poluostrvo Hrvatske je Istra; na njegovom jugu je Pula, jedno od najposećenijih turističkih mesta.", "slika": "07-hrvatska/05-fizicka-karta-hrvatske.jpg"}}, {"id": "reljef-izbor-dinaridi", "vrsta": "izbor", "tezina": "srednje", "pojmovi": ["dinarske-planine", "velebit", "dinara", "biokovo"], "pitanje": "Koje se planine Dinarida po veličini ističu u Hrvatskoj? (Više tačnih.)", "odgovori": [{"tekst": "Velebit", "tacan": true}, {"tekst": "Dinara", "tacan": true}, {"tekst": "Biokovo", "tacan": true}, {"tekst": "Psunj", "tacan": false}, {"tekst": "Alpi", "tacan": false}], "pomoc": ["Traži planine u unutrašnjosti i uz obalu, a ne u ravnici.", "Psunj je ostrvska planina u Panonskoj niziji, a Alpi nisu u Hrvatskoj.", "Iz lekcije: među Dinarskim planinama izdvajaju se Velebit, Dinara i Biokovo."], "objasnjenje": "Velebit, Dinara i Biokovo su najveće dinarske planine Hrvatske. Psunj je ostrvska planina u panonskoj celini.", "iz_udzbenika": {"strana": 25, "odeljak": "Fizičko-geografske odlike — reljef", "tekst": "U unutrašnjosti je planinski predeo Dinarskih planina, među kojima se veličinom ističu Velebit, Dinara i Biokovo.", "slika": "07-hrvatska/05-fizicka-karta-hrvatske.jpg"}}, {"id": "reljef-dopuni-psunj", "vrsta": "dopuni", "tezina": "srednje", "pojmovi": ["ostrvske-planine", "psunj", "panonska-nizija"], "pitanje": "Dopuni rečenicu rečima iz banke.", "tekst": "Iz ravnice na severoistoku Hrvatske izdižu se {{ostrvske}} planine, među kojima se ističe {{Psunj}}.", "ponudjene": ["ostrvske", "Psunj", "vulkanske", "Velebit"], "pomoc": ["Ove planine stoje usamljeno iz ravnice, kao ostrva iz mora.", "Velebit je dinarska planina uz more, a ne u Panonskoj niziji.", "Iz lekcije: iz Panonske nizije izdižu se ostrvske planine, među kojima je Psunj."], "objasnjenje": "Iz hrvatskog dela Panonske nizije izdižu se ostrvske planine; najistaknutija je Psunj.", "iz_udzbenika": {"strana": 25, "odeljak": "Fizičko-geografske odlike — reljef", "tekst": "Na severoistoku je prostrana ravnica, deo Panonske nizije, iz koje se dižu ostrvske planine — među njima se izdvaja Psunj.", "slika": "07-hrvatska/02-panonska-nizija.jpg"}}, {"id": "reljef-tn-istra", "vrsta": "tacno_netacno", "tezina": "srednje", "pojmovi": ["istra", "krk"], "tvrdnja": "Najveće poluostrvo Hrvatske je Krk.", "tacno": false, "ispravke": [{"tekst": "Najveće poluostrvo Hrvatske je Istra; Krk je ostrvo.", "tacan": true}, {"tekst": "Najveće poluostrvo Hrvatske je Hvar.", "tacan": false}, {"tekst": "Hrvatska nema nijedno poluostrvo.", "tacan": false}], "pomoc": ["Poluostrvo je kopnom vezano za ostatak države, a ostrvo je okruženo morem.", "Krk, Hvar i Brač su ostrva; traži veliko poluostrvo na severozapadu.", "Iz lekcije: najveće poluostrvo je Istra."], "objasnjenje": "Netačno — najveće poluostrvo je Istra. Krk je ostrvo u Kvarnerskom zalivu.", "iz_udzbenika": {"strana": 26, "odeljak": "Fizičko-geografske odlike — reljef", "tekst": "Među ostrvima se ističu Krk, Cres, Brač, Hvar, Pag i Korčula, a najveće poluostrvo je Istra.", "slika": "07-hrvatska/05-fizicka-karta-hrvatske.jpg"}}, {"id": "reljef-povezi-oblici", "vrsta": "povezi", "tezina": "srednje", "pojmovi": ["ostrvske-planine", "psunj", "velebit", "hvar", "istra", "panonska-nizija"], "pitanje": "Poveži oblik reljefa sa primerom iz Hrvatske.", "parovi": [["ostrvska planina", "Psunj"], ["dinarska planina uz obalu", "Velebit"], ["ostrvo", "Hvar"], ["poluostrvo", "Istra"], ["nizija", "Panonska nizija"]], "pomoc": ["Kreni od nizije i poluostrva — to su najlakši parovi.", "Psunj stoji usamljen u ravnici, a Velebit se diže iznad mora.", "Iz lekcije: Psunj — ostrvska planina; Velebit — Dinaridi; Hvar — ostrvo; Istra — najveće poluostrvo."], "objasnjenje": "Psunj je ostrvska planina, Velebit dinarska planina uz obalu, Hvar ostrvo, Istra poluostrvo, a Panonska nizija ravnica na severoistoku.", "iz_udzbenika": {"strana": 25, "odeljak": "Fizičko-geografske odlike — reljef", "tekst": "U panonskoj celini su ravnica i ostrvske planine (Psunj), u planinskoj Dinaridi (Velebit, Dinara, Biokovo), a u primorskoj ostrva i poluostrvo Istra.", "slika": "07-hrvatska/05-fizicka-karta-hrvatske.jpg"}}, {"id": "reljef-zakljuci-uska", "vrsta": "zakljuci", "tezina": "srednje", "pojmovi": ["primorska-oblast", "velebit", "biokovo"], "pitanje": "Zašto je primorska oblast Hrvatske tako uska?", "odgovori": [{"tekst": "Dinarske planine se strmo uzdižu odmah iznad mora, pa ravnog pojasa uz obalu skoro nema.", "tacan": true}, {"tekst": "More je potopilo celu ravnicu pre nekoliko godina.", "tacan": false}, {"tekst": "Panonska nizija se pruža sve do mora.", "tacan": false}, {"tekst": "Obala je uska jer na njoj nema naselja.", "tacan": false}], "pomoc": ["Korak 1: Pogledaj fotografiju Velebita — šta se nalazi odmah iza obale?", "Korak 2: Ako se planina diže pravo iz mora, koliko mesta ostaje za ravnu obalu?", "Iz lekcije: obala je uska jer se iznad mora strmo izdižu visoke planine."], "objasnjenje": "Planine (npr. Velebit i Biokovo) dižu se strmo odmah iznad mora, pa je obalni pojas uzan.", "iz_udzbenika": {"strana": 26, "odeljak": "Fizičko-geografske odlike — reljef", "tekst": "Fotografija Velebita pokazuje golo kamenito bilo koje se strmo spušta do mora, a uz obalu ostaje samo uzan pojas naselja.", "slika": "07-hrvatska/03-velebit.jpg"}}, {"id": "reljef-klik-velebit", "vrsta": "karta_klik", "tezina": "srednje", "pojmovi": ["velebit", "dinarske-planine"], "pitanje": "Klikni na kartu — planina Velebit.", "cilj": {"mesto": "velebit"}, "pomoc": ["Velebit je dinarska planina koja se pruža duž same obale.", "Nalazi se iznad Kvarnera i Zadra, nasuprot ostrvu Pagu.", "Iz lekcije: Velebit je jedna od najvećih planina Dinarida; diže se strmo iznad mora."], "objasnjenje": "Velebit se pruža duž obale, iznad Kvarnera i Zadra.", "iz_udzbenika": {"strana": 26, "odeljak": "Fizičko-geografske odlike — reljef", "tekst": "Na fizičkoj karti tačka za Velebit je iznad Kvarnera i Zadra, gde se planina strmo spušta ka moru.", "slika": "07-hrvatska/03-velebit.jpg"}}, {"id": "reljef-gde-sam-velebit", "vrsta": "gde_sam", "tezina": "srednje", "pojmovi": ["velebit", "dinarske-planine", "pag"], "pitanje": "Gde sam? Pročitaj trag i klikni mesto na karti.", "cilj": {"mesto": "velebit"}, "tragovi": ["Moje golo, kamenito bilo vidi se sa ostrva Pag.", "Zbog mene je obala ispod mene vrlo uska.", "Pružam se duž obale, iznad Kvarnera i Zadra.", "Ja sam jedna od tri najveće dinarske planine Hrvatske i strmo se dižem iznad mora."], "objasnjenje": "Velebit — dinarska planina duž obale, iznad Kvarnera i Zadra.", "iz_udzbenika": {"strana": 26, "odeljak": "Fizičko-geografske odlike — reljef", "tekst": "Velebit je kamenita dinarska planina koja se strmo spušta do mora, pa uz obalu ostaje samo uzan pojas.", "slika": "07-hrvatska/03-velebit.jpg"}}, {"id": "reljef-klik-dinara", "vrsta": "karta_klik", "tezina": "srednje", "pojmovi": ["dinara", "dinarske-planine"], "pitanje": "Klikni na kartu — planina Dinara.", "cilj": {"mesto": "dinara"}, "pomoc": ["Dinara je u unutrašnjosti Dalmacije, a ne na samoj obali.", "Nalazi se na granici sa BiH, iznad grada Knina, istočno od Zadra i Šibenika.", "Iz lekcije: Dinara je jedna od najvećih dinarskih planina Hrvatske."], "objasnjenje": "Dinara je na granici Hrvatske i BiH, iznad Knina.", "iz_udzbenika": {"strana": 25, "odeljak": "Fizičko-geografske odlike — reljef", "tekst": "Dinara je, uz Velebit i Biokovo, među najvećim planinama Dinarskog planinskog predela u unutrašnjosti Hrvatske.", "slika": "07-hrvatska/05-fizicka-karta-hrvatske.jpg"}}, {"id": "reljef-klik-krk", "vrsta": "karta_klik", "tezina": "srednje", "pojmovi": ["krk"], "pitanje": "Klikni na kartu — ostrvo Krk.", "cilj": {"mesto": "krk"}, "pomoc": ["Krk je na severu Jadrana, u Kvarnerskom zalivu.", "Nalazi se odmah uz kopno, kod grada Rijeke, istočno od Istre.", "Iz lekcije: Krk je jedno od najvećih ostrva Hrvatske."], "objasnjenje": "Krk je u Kvarnerskom zalivu, kod Rijeke.", "iz_udzbenika": {"strana": 26, "odeljak": "Fizičko-geografske odlike — reljef", "tekst": "Među hrvatskim ostrvima ističu se Krk, Cres, Brač, Hvar, Pag i Korčula.", "slika": "07-hrvatska/05-fizicka-karta-hrvatske.jpg"}}, {"id": "reljef-izbor-ostrva", "vrsta": "izbor", "tezina": "tesko", "pojmovi": ["krk", "brac", "hvar", "korcula", "istra"], "pitanje": "Koja su od navedenih mesta hrvatska OSTRVA istaknuta u lekciji? (Više tačnih.)", "odgovori": [{"tekst": "Krk", "tacan": true}, {"tekst": "Brač", "tacan": true}, {"tekst": "Hvar", "tacan": true}, {"tekst": "Korčula", "tacan": true}, {"tekst": "Istra", "tacan": false}, {"tekst": "Biokovo", "tacan": false}, {"tekst": "Sicilija", "tacan": false}], "pomoc": ["Pazi — traže se samo ostrva, ne poluostrva i ne planine.", "Istra je poluostrvo, Biokovo planina, a Sicilija ostrvo druge države.", "Iz lekcije: ostrva Krk, Cres, Brač, Hvar, Pag i Korčula; najveće poluostrvo je Istra."], "objasnjenje": "Krk, Brač, Hvar i Korčula su hrvatska ostrva. Istra je poluostrvo, Biokovo planina, a Sicilija pripada Italiji.", "iz_udzbenika": {"strana": 26, "odeljak": "Fizičko-geografske odlike — reljef", "tekst": "Među ostrvima se ističu Krk, Cres, Brač, Hvar, Pag i Korčula, dok je najveće poluostrvo Istra.", "slika": "07-hrvatska/05-fizicka-karta-hrvatske.jpg"}}, {"id": "reljef-dopuni-dinaridi", "vrsta": "dopuni", "tezina": "tesko", "pojmovi": ["dinarske-planine", "panonska-nizija", "velebit"], "pitanje": "Dopuni rečenicu (bez banke reči).", "tekst": "Velebit, Dinara i Biokovo pripadaju {{Dinarskim|Dinaridima|Dinarske|dinarskim}} planinama, a ravnica na severoistoku Hrvatske deo je {{Panonske|panonske}} nizije.", "pomoc": ["Planine su dobile ime po jednoj od njih — po Dinari.", "Ravnica na severoistoku se nastavlja na Vojvodinu u Srbiji i Mađarsku.", "Iz lekcije: Dinarske planine (Velebit, Dinara, Biokovo) i Panonska nizija na severoistoku."], "objasnjenje": "Velebit, Dinara i Biokovo su Dinarske planine, a severoistok Hrvatske je deo Panonske nizije.", "iz_udzbenika": {"strana": 25, "odeljak": "Fizičko-geografske odlike — reljef", "tekst": "Severoistok je deo Panonske nizije, a unutrašnjost zauzimaju Dinarske planine sa Velebitom, Dinarom i Biokovom.", "slika": "07-hrvatska/05-fizicka-karta-hrvatske.jpg"}}, {"id": "reljef-tn-velebit", "vrsta": "tacno_netacno", "tezina": "tesko", "pojmovi": ["velebit", "psunj", "ostrvske-planine"], "tvrdnja": "Velebit je ostrvska planina u Panonskoj niziji.", "tacno": false, "ispravke": [{"tekst": "Velebit je dinarska planina koja se diže iznad obale; ostrvska planina u Panoniji je Psunj.", "tacan": true}, {"tekst": "Velebit je ostrvo u Kvarnerskom zalivu.", "tacan": false}, {"tekst": "Velebit je ostrvska planina, ali u Istri.", "tacan": false}], "pomoc": ["Seti se fotografije Velebita — da li je oko njega ravnica ili more?", "Ostrvske planine se dižu iz ravnice; Velebit pripada Dinaridima.", "Iz lekcije: Velebit, Dinara i Biokovo su dinarske planine; ostrvska planina u Panoniji je Psunj."], "objasnjenje": "Netačno — Velebit je dinarska planina uz obalu Jadrana. Ostrvska planina u Panonskoj niziji je Psunj.", "iz_udzbenika": {"strana": 25, "odeljak": "Fizičko-geografske odlike — reljef", "tekst": "Iz Panonske nizije dižu se ostrvske planine (npr. Psunj), dok Velebit, Dinara i Biokovo pripadaju Dinarskim planinama.", "slika": "07-hrvatska/03-velebit.jpg"}}, {"id": "reljef-klik-psunj", "vrsta": "karta_klik", "tezina": "tesko", "pojmovi": ["psunj", "ostrvske-planine"], "pitanje": "Klikni na kartu — ostrvska planina Psunj.", "cilj": {"mesto": "psunj"}, "pomoc": ["Psunj nije uz more — traži ga u panonskom delu Hrvatske.", "Nalazi se u Slavoniji, severno od Save (granice sa BiH).", "Iz lekcije: Psunj je istaknuta ostrvska planina u Panonskoj niziji."], "objasnjenje": "Psunj je u zapadnoj Slavoniji, severno od reke Save.", "iz_udzbenika": {"strana": 25, "odeljak": "Fizičko-geografske odlike — reljef", "tekst": "Iz panonske ravnice izdižu se ostrvske planine; među njima je Psunj.", "slika": "07-hrvatska/05-fizicka-karta-hrvatske.jpg"}}, {"id": "reljef-klik-biokovo", "vrsta": "karta_klik", "tezina": "tesko", "pojmovi": ["biokovo", "dinarske-planine"], "pitanje": "Klikni na kartu — planina Biokovo.", "cilj": {"mesto": "biokovo"}, "pomoc": ["Biokovo je u srednjoj Dalmaciji, strmo iznad mora.", "Nalazi se jugoistočno od Splita, iznad Makarske, nasuprot ostrvima Brač i Hvar.", "Iz lekcije: Biokovo je jedna od najvećih dinarskih planina Hrvatske."], "objasnjenje": "Biokovo se diže iznad Makarske, u srednjoj Dalmaciji.", "iz_udzbenika": {"strana": 25, "odeljak": "Fizičko-geografske odlike — reljef", "tekst": "Biokovo je, uz Velebit i Dinaru, među najvećim dinarskim planinama Hrvatske.", "slika": "07-hrvatska/05-fizicka-karta-hrvatske.jpg"}}, {"id": "reljef-klik-hvar", "vrsta": "karta_klik", "tezina": "tesko", "pojmovi": ["hvar", "brac"], "pitanje": "Klikni na kartu — ostrvo Hvar.", "cilj": {"mesto": "hvar"}, "pomoc": ["Hvar je u srednjoj Dalmaciji, južno od Splita.", "Leži odmah južno od Brača — pazi da ne klikneš Brač.", "Iz lekcije: Hvar je među najvećim ostrvima Hrvatske."], "objasnjenje": "Hvar je dugo ostrvo južno od Brača, u srednjoj Dalmaciji.", "iz_udzbenika": {"strana": 26, "odeljak": "Fizičko-geografske odlike — reljef", "tekst": "Među hrvatskim ostrvima ističu se Krk, Cres, Brač, Hvar, Pag i Korčula.", "slika": "07-hrvatska/05-fizicka-karta-hrvatske.jpg"}}, {"id": "reljef-klik-korcula", "vrsta": "karta_klik", "tezina": "tesko", "pojmovi": ["korcula"], "pitanje": "Klikni na kartu — ostrvo Korčula.", "cilj": {"mesto": "korcula"}, "pomoc": ["Korčula je na jugu Dalmacije, na putu prema Dubrovniku.", "Leži južno od Hvara, uz poluostrvo Pelješac.", "Iz lekcije: Korčula je među najvećim ostrvima Hrvatske."], "objasnjenje": "Korčula je u južnoj Dalmaciji, uz Pelješac, između Hvara i Dubrovnika.", "iz_udzbenika": {"strana": 26, "odeljak": "Fizičko-geografske odlike — reljef", "tekst": "Među hrvatskim ostrvima ističu se Krk, Cres, Brač, Hvar, Pag i Korčula.", "slika": "07-hrvatska/05-fizicka-karta-hrvatske.jpg"}}, {"id": "reljef-klik-jadran", "vrsta": "karta_klik", "tezina": "lako", "pojmovi": ["jadransko-more"], "pitanje": "Klikni na kartu — more na koje izlazi Hrvatska.", "cilj": {"mesto": "jadransko-more"}, "pomoc": ["More je između Hrvatske i Italije.", "Klikni na otvoreno more jugozapadno od hrvatske obale.", "Iz lekcije: Hrvatska izlazi na Jadransko more."], "objasnjenje": "Jadransko more je između Balkanskog i Apeninskog poluostrva, jugozapadno od Hrvatske.", "iz_udzbenika": {"strana": 25, "odeljak": "Republika Hrvatska — uvod", "tekst": "Hrvatska ima izlaz na Jadransko more, uz koje se pruža primorska oblast.", "slika": "07-hrvatska/05-fizicka-karta-hrvatske.jpg"}}]}, {"naslov": "Reke i klima", "zadaci": [{"id": "vode-izbor-reke", "vrsta": "izbor", "tezina": "lako", "pojmovi": ["drava", "sava", "dunav"], "pitanje": "Koje su od navedenih reka među najvećim rekama Hrvatske? (Više tačnih.)", "odgovori": [{"tekst": "Drava", "tacan": true}, {"tekst": "Sava", "tacan": true}, {"tekst": "Dunav", "tacan": true}, {"tekst": "Vardar", "tacan": false}, {"tekst": "Tibar", "tacan": false}], "pomoc": ["Tačne reke teku kroz panonski deo Hrvatske.", "Vardar je u Severnoj Makedoniji, a Tibar u Italiji.", "Iz lekcije: najveće reke su Drava, Sava, Kupa, Cetina i Dunav."], "objasnjenje": "Najveći rečni tokovi Hrvatske su Drava, Sava, Kupa, Cetina i Dunav.", "iz_udzbenika": {"strana": 26, "odeljak": "Fizičko-geografske odlike — reke", "tekst": "Najveće reke Hrvatske su Drava, Sava, Kupa, Cetina i Dunav.", "slika": "07-hrvatska/05-fizicka-karta-hrvatske.jpg"}}, {"id": "vode-tn-crnomorski", "vrsta": "tacno_netacno", "tezina": "lako", "pojmovi": ["drava", "sava", "kupa", "crnomorski-sliv"], "tvrdnja": "Drava, Sava i Kupa pripadaju crnomorskom slivu.", "tacno": true, "pomoc": ["Ove reke teku kroz unutrašnjost i ulivaju se u Dunav (Kupa preko Save).", "Dunav se uliva u Crno more.", "Iz lekcije: Drava, Sava, Kupa i Dunav otiču u Crno more — crnomorski sliv."], "objasnjenje": "Tačno — Drava, Sava i Kupa preko Dunava otiču u Crno more.", "iz_udzbenika": {"strana": 26, "odeljak": "Fizičko-geografske odlike — reke", "tekst": "Drava, Sava, Kupa i Dunav pripadaju crnomorskom slivu, a samo Cetina od navedenih reka otiče u Jadransko more."}}, {"id": "vode-povezi-klima", "vrsta": "povezi", "tezina": "lako", "pojmovi": ["umerenokontinentalna-klima", "planinska-klima", "sredozemna-klima"], "pitanje": "Poveži deo Hrvatske sa klimom koja u njemu vlada.", "parovi": [["Panonska nizija", "umerenokontinentalna klima"], ["Dinarske planine", "planinska klima"], ["primorje i ostrva", "sredozemna klima"]], "pomoc": ["Svaka reljefna celina ima svoj tip klime.", "Uz more je klima topla i suva leti, a na planinama je hladnije.", "Iz lekcije: Panonija — umerenokontinentalna, Dinaridi — planinska, primorje — sredozemna."], "objasnjenje": "U Panonskoj niziji vlada umerenokontinentalna, na Dinaridima planinska, a na primorju i ostrvima sredozemna klima.", "iz_udzbenika": {"strana": 26, "odeljak": "Zadatak — klima Hrvatske", "tekst": "Na osnovu položaja i reljefa zaključuje se da Hrvatska ima tri tipa klime — umerenokontinentalnu u Panoniji, planinsku na Dinaridima i sredozemnu na primorju.", "slika": "07-hrvatska/05-fizicka-karta-hrvatske.jpg"}}, {"id": "vode-klik-dunav", "vrsta": "karta_klik", "tezina": "lako", "pojmovi": ["dunav"], "pitanje": "Klikni na kartu — reka Dunav u Hrvatskoj.", "cilj": {"mesto": "dunav"}, "pomoc": ["Dunav je najveća reka ovog dela Evrope; u Hrvatskoj teče samo krajnjim istokom.", "Traži granicu Hrvatske i Srbije, kod Vukovara.", "Iz lekcije: Dunav je na krajnjem istoku Hrvatske, na granici sa Srbijom."], "objasnjenje": "Dunav teče krajnjim istokom Hrvatske, na granici sa Srbijom (kod Vukovara).", "iz_udzbenika": {"strana": 26, "odeljak": "Fizičko-geografske odlike — reke", "tekst": "Dunav je jedna od najvećih reka Hrvatske; protiče njenim krajnjim istokom.", "slika": "07-hrvatska/05-fizicka-karta-hrvatske.jpg"}}, {"id": "vode-gde-sam-dunav", "vrsta": "gde_sam", "tezina": "lako", "pojmovi": ["dunav", "crnomorski-sliv"], "pitanje": "Gde sam? Pročitaj trag i klikni mesto na karti.", "cilj": {"mesto": "dunav"}, "tragovi": ["U mene se preko Drave i Save sliva voda iz velikog dela Hrvatske.", "Proticem pored Vukovara.", "Ja sam granica između Hrvatske i Srbije, na krajnjem istoku.", "Ja sam najveća reka koja teče kroz Beograd i Novi Sad."], "objasnjenje": "Dunav — reka na krajnjem istoku Hrvatske, na granici sa Srbijom; odvodi vodu u Crno more.", "iz_udzbenika": {"strana": 26, "odeljak": "Fizičko-geografske odlike — reke", "tekst": "Dunav, zajedno sa Dravom, Savom i Kupom, pripada crnomorskom slivu.", "slika": "07-hrvatska/05-fizicka-karta-hrvatske.jpg"}}, {"id": "vode-zakljuci-hvar", "vrsta": "zakljuci", "tezina": "lako", "pojmovi": ["hvar", "sredozemna-klima"], "pitanje": "Koja klima vlada na ostrvu Hvaru?", "odgovori": [{"tekst": "sredozemna — ostrvo je na jugu, usred toplog mora", "tacan": true}, {"tekst": "planinska — ostrvo je visoka planina", "tacan": false}, {"tekst": "umerenokontinentalna — kao u Panonskoj niziji", "tacan": false}, {"tekst": "polarna — zime su veoma duge", "tacan": false}], "pomoc": ["Korak 1: Gde je Hvar — u unutrašnjosti ili u moru, na severu ili na jugu?", "Korak 2: Koja klima vlada na primorju i ostrvima?", "Iz lekcije: na primorju i ostrvima vlada sredozemna klima."], "objasnjenje": "Hvar je ostrvo u srednjoj Dalmaciji — tamo vlada sredozemna klima sa toplim, suvim letima i blagim zimama.", "iz_udzbenika": {"strana": 26, "odeljak": "Zadatak — klima Hrvatske", "tekst": "Na primorju i ostrvima Hrvatske vlada sredozemna (izmenjenosredozemna) klima."}}, {"id": "vode-povezi-reke", "vrsta": "povezi", "tezina": "srednje", "pojmovi": ["drava", "dunav", "cetina", "kupa", "sava"], "pitanje": "Poveži reku sa njenim položajem.", "parovi": [["Drava", "severna granica prema Mađarskoj"], ["Dunav", "krajnji istok, granica sa Srbijom"], ["Cetina", "Dalmacija, uliva se u Jadransko more"], ["Kupa", "zapad, uliva se u Savu kod Siska"], ["Sava", "teče kroz Zagreb"]], "pomoc": ["Kreni od Dunava i Save — te reke već poznaješ iz Srbije.", "Jedina reka koja ide u more je u Dalmaciji; Drava je na severu.", "Iz lekcije: najveće reke su Drava, Sava, Kupa, Cetina i Dunav."], "objasnjenje": "Drava je na severu (prema Mađarskoj), Dunav na istoku (prema Srbiji), Cetina u Dalmaciji, Kupa se uliva u Savu, a Sava teče kroz Zagreb.", "iz_udzbenika": {"strana": 26, "odeljak": "Fizičko-geografske odlike — reke", "tekst": "Najveće reke Hrvatske su Drava, Sava, Kupa, Cetina i Dunav; na fizičkoj karti se vidi da sve osim Cetine teku kroz unutrašnjost.", "slika": "07-hrvatska/05-fizicka-karta-hrvatske.jpg"}}, {"id": "vode-tn-cetina", "vrsta": "tacno_netacno", "tezina": "srednje", "pojmovi": ["cetina", "jadranski-sliv", "crnomorski-sliv"], "tvrdnja": "Reka Cetina pripada crnomorskom slivu.", "tacno": false, "ispravke": [{"tekst": "Cetina pripada jadranskom slivu — uliva se u Jadransko more.", "tacan": true}, {"tekst": "Cetina pripada egejskom slivu.", "tacan": false}, {"tekst": "Cetina se uliva u Dunav.", "tacan": false}], "pomoc": ["Cetina teče kroz Dalmaciju, blizu obale.", "Uliva se u more kod Omiša — koje je to more?", "Iz lekcije: Drava, Sava, Kupa i Dunav su crnomorski sliv, a Cetina jadranski."], "objasnjenje": "Netačno — Cetina se uliva u Jadransko more, pa pripada jadranskom slivu.", "iz_udzbenika": {"strana": 26, "odeljak": "Fizičko-geografske odlike — reke", "tekst": "Od najvećih hrvatskih reka samo Cetina pripada jadranskom slivu; ostale otiču ka Crnom moru."}}, {"id": "vode-dopuni-slivovi", "vrsta": "dopuni", "tezina": "srednje", "pojmovi": ["cetina", "crnomorski-sliv", "jadranski-sliv"], "pitanje": "Dopuni rečenicu rečima iz banke.", "tekst": "Reka {{Cetina}} otiče u Jadransko more, a Drava, Sava, Kupa i Dunav pripadaju {{crnomorskom}} slivu.", "ponudjene": ["Cetina", "crnomorskom", "Sava", "jadranskom"], "pomoc": ["Samo jedna od velikih reka teče kroz Dalmaciju.", "Dunav se uliva u Crno more, a ostale tri reke dolaze do njega.", "Iz lekcije: Cetina — jadranski sliv; Drava, Sava, Kupa, Dunav — crnomorski sliv."], "objasnjenje": "Cetina pripada jadranskom slivu, a Drava, Sava, Kupa i Dunav crnomorskom.", "iz_udzbenika": {"strana": 26, "odeljak": "Fizičko-geografske odlike — reke", "tekst": "Drava, Sava, Kupa i Dunav pripadaju crnomorskom, a Cetina jadranskom slivu."}}, {"id": "vode-izbor-klima", "vrsta": "izbor", "tezina": "srednje", "pojmovi": ["umerenokontinentalna-klima", "planinska-klima", "sredozemna-klima"], "pitanje": "Koji tipovi klime postoje u Hrvatskoj? (Više tačnih.)", "odgovori": [{"tekst": "umerenokontinentalna", "tacan": true}, {"tekst": "planinska", "tacan": true}, {"tekst": "sredozemna", "tacan": true}, {"tekst": "pustinjska", "tacan": false}, {"tekst": "polarna", "tacan": false}], "pomoc": ["Hrvatska ima ravnicu, planine i more — svaka celina ima svoju klimu.", "Pustinjska i polarna klima nisu u Evropi na ovoj širini.", "Iz lekcije: umerenokontinentalna, planinska i sredozemna klima."], "objasnjenje": "U Hrvatskoj su umerenokontinentalna (Panonija), planinska (Dinaridi) i sredozemna klima (primorje).", "iz_udzbenika": {"strana": 26, "odeljak": "Zadatak — klima Hrvatske", "tekst": "Zadatak traži da se iz položaja i reljefa zaključi koji klimatski tipovi postoje u Hrvatskoj — umerenokontinentalni, planinski i sredozemni."}}, {"id": "vode-klik-drava", "vrsta": "karta_klik", "tezina": "srednje", "pojmovi": ["drava"], "pitanje": "Klikni na kartu — reka Drava.", "cilj": {"mesto": "drava"}, "pomoc": ["Drava teče severom Hrvatske, kroz panonski deo.", "Velikim delom čini granicu prema Mađarskoj, a na njoj je Osijek.", "Iz lekcije: Drava je jedna od najvećih reka Hrvatske (crnomorski sliv)."], "objasnjenje": "Drava teče severom Hrvatske, uz granicu sa Mađarskom.", "iz_udzbenika": {"strana": 26, "odeljak": "Fizičko-geografske odlike — reke", "tekst": "Drava je jedna od najvećih reka Hrvatske; na fizičkoj karti se vidi njena dolina na severu.", "slika": "07-hrvatska/05-fizicka-karta-hrvatske.jpg"}}, {"id": "vode-klik-sava", "vrsta": "karta_klik", "tezina": "srednje", "pojmovi": ["sava"], "pitanje": "Klikni na kartu — reka Sava, nizvodno od Zagreba.", "cilj": {"mesto": "sava"}, "pomoc": ["Sava protiče kroz Zagreb i teče ka istoku.", "Južnije od Slavonije čini granicu prema BiH.", "Iz lekcije: Sava je jedna od najvećih reka Hrvatske (crnomorski sliv)."], "objasnjenje": "Sava teče od Zagreba ka istoku i dalje čini granicu Hrvatske i BiH.", "iz_udzbenika": {"strana": 26, "odeljak": "Fizičko-geografske odlike — reke", "tekst": "Sava je jedna od najvećih reka Hrvatske; na karti se vidi njena dolina u severnom delu zemlje.", "slika": "07-hrvatska/05-fizicka-karta-hrvatske.jpg"}}, {"id": "vode-zakljuci-sliv", "vrsta": "zakljuci", "tezina": "tesko", "pojmovi": ["drava", "sava", "kupa", "crnomorski-sliv", "dunav"], "pitanje": "Drava, Sava i Kupa ne teku do Crnog mora, a ipak pripadaju crnomorskom slivu. Zašto?", "odgovori": [{"tekst": "Ulivaju se (direktno ili preko Save) u Dunav, a Dunav se uliva u Crno more.", "tacan": true}, {"tekst": "Izviru blizu Crnog mora.", "tacan": false}, {"tekst": "Teku podzemno do Crnog mora.", "tacan": false}, {"tekst": "Zato što su sve u panonskom delu.", "tacan": false}], "pomoc": ["Korak 1: Sliv obuhvata sve reke čija voda na kraju stigne u isto more.", "Korak 2: Prati tok — Kupa u Savu, Sava i Drava u Dunav. Gde se uliva Dunav?", "Iz lekcije: Drava, Sava, Kupa i Dunav pripadaju crnomorskom slivu."], "objasnjenje": "Kupa se uliva u Savu, Sava i Drava u Dunav, a Dunav u Crno more — zato sve pripadaju crnomorskom slivu.", "iz_udzbenika": {"strana": 26, "odeljak": "Fizičko-geografske odlike — reke", "tekst": "Drava, Sava, Kupa i Dunav pripadaju crnomorskom slivu, a Cetina jadranskom."}}, {"id": "vode-dopuni-klima", "vrsta": "dopuni", "tezina": "tesko", "pojmovi": ["umerenokontinentalna-klima", "planinska-klima", "sredozemna-klima"], "pitanje": "Dopuni rečenicu (bez banke reči).", "tekst": "U Panonskoj niziji vlada {{umerenokontinentalna|umereno-kontinentalna|umereno kontinentalna}} klima, na Dinaridima {{planinska}}, a na primorju i ostrvima {{sredozemna|izmenjenosredozemna|mediteranska}} klima.", "pomoc": ["Ravnica u unutrašnjosti kontinenta ima tople leti i hladne zime.", "Na visokim planinama je hladnije, a uz Sredozemlje toplo i suvo leto.", "Iz lekcije: umerenokontinentalna — Panonija; planinska — Dinaridi; sredozemna — primorje."], "objasnjenje": "Panonija — umerenokontinentalna, Dinaridi — planinska, primorje i ostrva — sredozemna klima.", "iz_udzbenika": {"strana": 26, "odeljak": "Zadatak — klima Hrvatske", "tekst": "Iz položaja i oblika reljefa zaključuje se da Hrvatska ima umerenokontinentalnu, planinsku i sredozemnu klimu."}}, {"id": "vode-klik-kupa", "vrsta": "karta_klik", "tezina": "tesko", "pojmovi": ["kupa"], "pitanje": "Klikni na kartu — reka Kupa.", "cilj": {"mesto": "kupa"}, "pomoc": ["Kupa teče u zapadnom delu unutrašnjosti, jugozapadno od Zagreba.", "Delom je granica sa Slovenijom, a uliva se u Savu kod Siska.", "Iz lekcije: Kupa je jedna od najvećih reka Hrvatske (crnomorski sliv)."], "objasnjenje": "Kupa teče zapadnim delom Hrvatske, uz granicu sa Slovenijom, i uliva se u Savu.", "iz_udzbenika": {"strana": 26, "odeljak": "Fizičko-geografske odlike — reke", "tekst": "Kupa je jedna od pet najvećih reka Hrvatske i pripada crnomorskom slivu.", "slika": "07-hrvatska/05-fizicka-karta-hrvatske.jpg"}}, {"id": "vode-klik-cetina", "vrsta": "karta_klik", "tezina": "tesko", "pojmovi": ["cetina", "jadranski-sliv"], "pitanje": "Klikni na kartu — reka Cetina (jedina velika reka jadranskog sliva).", "cilj": {"mesto": "cetina"}, "pomoc": ["Cetina teče kroz Dalmaciju i uliva se u Jadransko more.", "Ušće je kod Omiša, jugoistočno od Splita.", "Iz lekcije: Cetina pripada jadranskom slivu."], "objasnjenje": "Cetina teče kroz srednju Dalmaciju i kod Omiša se uliva u Jadransko more.", "iz_udzbenika": {"strana": 26, "odeljak": "Fizičko-geografske odlike — reke", "tekst": "Cetina je jedina od najvećih reka Hrvatske koja pripada jadranskom slivu.", "slika": "07-hrvatska/05-fizicka-karta-hrvatske.jpg"}}, {"id": "vode-gde-sam-cetina", "vrsta": "gde_sam", "tezina": "tesko", "pojmovi": ["cetina", "jadranski-sliv"], "pitanje": "Gde sam? Pročitaj trag i klikni mesto na karti.", "cilj": {"mesto": "cetina"}, "tragovi": ["Moje ušće je kod Omiša, nedaleko od Splita.", "Tečem kroz Dalmaciju, između Dinare i mora.", "Od pet najvećih reka Hrvatske jedina ne idem ka Crnom moru.", "Ja sam jedina od najvećih hrvatskih reka koja pripada jadranskom slivu."], "objasnjenje": "Cetina — reka u Dalmaciji, jedina velika reka jadranskog sliva; uliva se kod Omiša.", "iz_udzbenika": {"strana": 26, "odeljak": "Fizičko-geografske odlike — reke", "tekst": "Od reka Drave, Save, Kupe, Cetine i Dunava samo Cetina otiče u Jadransko more.", "slika": "07-hrvatska/05-fizicka-karta-hrvatske.jpg"}}]}, {"naslov": "Stanovništvo", "zadaci": [{"id": "stan-izbor-narod", "vrsta": "izbor", "tezina": "lako", "pojmovi": ["hrvati"], "pitanje": "Koji narod preovlađuje u Hrvatskoj?", "odgovori": [{"tekst": "Hrvati", "tacan": true}, {"tekst": "Mađari", "tacan": false}, {"tekst": "Italijani", "tacan": false}, {"tekst": "Slovenci", "tacan": false}], "pomoc": ["Država nosi ime naroda koji u njoj čini većinu.", "Ostali ponuđeni narodi su većina u susednim državama.", "Iz lekcije: u etničkoj strukturi dominiraju Hrvati."], "objasnjenje": "U Hrvatskoj preovlađuju Hrvati, koji govore hrvatskim jezikom.", "iz_udzbenika": {"strana": 26, "odeljak": "Društveno-geografske odlike", "tekst": "Većinu stanovništva čine Hrvati, koji govore hrvatskim jezikom."}}, {"id": "stan-izbor-vera", "vrsta": "izbor", "tezina": "lako", "pojmovi": ["katolicanstvo"], "pitanje": "Koje je vere većina stanovnika Hrvatske?", "odgovori": [{"tekst": "katoličke", "tacan": true}, {"tekst": "pravoslavne", "tacan": false}, {"tekst": "islamske", "tacan": false}, {"tekst": "protestantske", "tacan": false}], "pomoc": ["Hrvatska je u tom pogledu slična Sloveniji i Italiji.", "Ta crkva ima središte u Vatikanu.", "Iz lekcije: većina stanovnika ispoveda katoličanstvo."], "objasnjenje": "Većina stanovnika Hrvatske su katolici.", "iz_udzbenika": {"strana": 26, "odeljak": "Društveno-geografske odlike", "tekst": "Najveći broj stanovnika Hrvatske je katoličke vere."}}, {"id": "stan-dopuni-jezik", "vrsta": "dopuni", "tezina": "lako", "pojmovi": ["hrvati", "katolicanstvo"], "pitanje": "Dopuni rečenicu rečima iz banke.", "tekst": "Hrvati govore {{hrvatskim}} jezikom, a većina stanovnika je {{katoličke}} vere.", "ponudjene": ["hrvatskim", "katoličke", "mađarskim", "pravoslavne"], "pomoc": ["Jezik nosi isto ime kao narod.", "Verska zajednica većine ima središte u Vatikanu.", "Iz lekcije: Hrvati govore hrvatskim jezikom; većina je katoličke vere."], "objasnjenje": "Hrvati govore hrvatskim jezikom, a većina stanovnika su katolici.", "iz_udzbenika": {"strana": 26, "odeljak": "Društveno-geografske odlike", "tekst": "Dominantno je hrvatsko stanovništvo, koje govori hrvatskim jezikom; najviše stanovnika je katoličke vere."}}, {"id": "stan-izbor-grupa", "vrsta": "izbor", "tezina": "srednje", "pojmovi": ["hrvati", "juzni-sloveni"], "pitanje": "Kojoj grupi naroda pripadaju Hrvati?", "odgovori": [{"tekst": "Južnim Slovenima", "tacan": true}, {"tekst": "Zapadnim Slovenima", "tacan": false}, {"tekst": "romanskim narodima", "tacan": false}, {"tekst": "germanskim narodima", "tacan": false}], "pomoc": ["Hrvati su slovenski narod — razmisli u kom delu Evrope žive.", "U istu grupu spadaju i Srbi, Slovenci i Bošnjaci.", "Iz lekcije: Hrvati pripadaju Južnim Slovenima."], "objasnjenje": "Hrvati su Južni Sloveni, kao i Srbi, Crnogorci, Bošnjaci, Slovenci i Makedonci.", "iz_udzbenika": {"strana": 26, "odeljak": "Društveno-geografske odlike", "tekst": "Udžbenik pita kojoj grupi naroda pripadaju Hrvati — odgovor je Južni Sloveni."}}, {"id": "stan-tn-pravoslavlje", "vrsta": "tacno_netacno", "tezina": "srednje", "pojmovi": ["katolicanstvo", "hrvati"], "tvrdnja": "Većina stanovnika Hrvatske je pravoslavne vere.", "tacno": false, "ispravke": [{"tekst": "Većina stanovnika Hrvatske je katoličke vere.", "tacan": true}, {"tekst": "Većina stanovnika Hrvatske je islamske vere.", "tacan": false}, {"tekst": "U Hrvatskoj nijedna vera nema većinu.", "tacan": false}], "pomoc": ["Pravoslavlje preovlađuje u Srbiji i Crnoj Gori — da li je tako i u Hrvatskoj?", "Hrvatska je po veri bliža Sloveniji i Italiji.", "Iz lekcije: najveći broj stanovnika ispoveda katoličanstvo."], "objasnjenje": "Netačno — većina stanovnika Hrvatske su katolici.", "iz_udzbenika": {"strana": 26, "odeljak": "Društveno-geografske odlike", "tekst": "Najveći broj stanovnika Hrvatske ispoveda katoličanstvo."}}, {"id": "stan-zakljuci-bih", "vrsta": "zakljuci", "tezina": "srednje", "pojmovi": ["katolicanstvo", "hrvati"], "pitanje": "Po čemu se Hrvatska razlikuje od susedne Bosne i Hercegovine u pogledu vere stanovnika?", "odgovori": [{"tekst": "Hrvatska je pretežno katolička, a u BiH postoje tri velike verske zajednice.", "tacan": true}, {"tekst": "U Hrvatskoj su tri velike verske zajednice, a BiH je pretežno katolička.", "tacan": false}, {"tekst": "Nema razlike — obe su pretežno pravoslavne.", "tacan": false}, {"tekst": "U Hrvatskoj većina nema nikakvu veru.", "tacan": false}], "pomoc": ["Korak 1: Koje je vere većina u Hrvatskoj?", "Korak 2: Seti se prethodne lekcije — koliko velikih naroda i vera ima u BiH?", "Iz lekcije: većina stanovnika Hrvatske ispoveda katoličanstvo."], "objasnjenje": "Hrvatska je versko homogenija — većina su katolici, dok BiH ima tri velike verske zajednice (islamsku, pravoslavnu i katoličku).", "iz_udzbenika": {"strana": 26, "odeljak": "Društveno-geografske odlike", "tekst": "U Hrvatskoj preovlađuju Hrvati, a najveći broj stanovnika je katoličke vere."}}, {"id": "stan-dopuni-grupa", "vrsta": "dopuni", "tezina": "tesko", "pojmovi": ["hrvati", "juzni-sloveni", "katolicanstvo"], "pitanje": "Dopuni rečenicu (bez banke reči).", "tekst": "Hrvati pripadaju grupi {{Južnih Slovena|Južni Sloveni|južnih Slovena|Južnih slovena}}, a većina njih ispoveda {{katoličanstvo|katolicizam|katoličku veru}}.", "pomoc": ["Hrvati su slovenski narod sa juga Evrope.", "Njihova crkva ima središte u Vatikanu.", "Iz lekcije: Hrvati su Južni Sloveni; većina ispoveda katoličanstvo."], "objasnjenje": "Hrvati su Južni Sloveni, a većina je katoličke vere.", "iz_udzbenika": {"strana": 26, "odeljak": "Društveno-geografske odlike", "tekst": "Hrvati, koji čine većinu stanovništva, pripadaju Južnim Slovenima i uglavnom su katolici."}}]}, {"naslov": "Privreda, turizam i gradovi", "zadaci": [{"id": "privreda-izbor-sektori", "vrsta": "izbor", "tezina": "lako", "pojmovi": ["primarni-sektor", "sekundarni-sektor", "tercijarni-sektor"], "pitanje": "Na kojim sektorima se zasniva privreda Hrvatske?", "odgovori": [{"tekst": "na sva tri — primarnom, sekundarnom i tercijarnom", "tacan": true}, {"tekst": "samo na primarnom", "tacan": false}, {"tekst": "samo na sekundarnom", "tacan": false}, {"tekst": "samo na tercijarnom (turizmu)", "tacan": false}], "pomoc": ["Hrvatska ima i poljoprivredu i rudarstvo, i industriju, i turizam.", "Ta delatnost pripada različitim sektorima.", "Iz lekcije: privreda se zasniva na primarnom, sekundarnom i tercijarnom sektoru."], "objasnjenje": "Privreda Hrvatske se zasniva na sva tri sektora — od poljoprivrede i rudarstva, preko industrije, do turizma.", "iz_udzbenika": {"strana": 26, "odeljak": "Društveno-geografske odlike — privreda", "tekst": "Hrvatska privreda se oslanja na primarni, sekundarni i tercijarni sektor."}}, {"id": "privreda-izbor-turizam", "vrsta": "izbor", "tezina": "lako", "pojmovi": ["turizam", "dubrovnik", "pula", "plitvicka-jezera"], "pitanje": "Koja su od navedenih mesta među najposećenijim u Hrvatskoj? (Više tačnih.)", "odgovori": [{"tekst": "Dubrovnik", "tacan": true}, {"tekst": "Pula", "tacan": true}, {"tekst": "Plitvička jezera", "tacan": true}, {"tekst": "Sarajevo", "tacan": false}, {"tekst": "Budimpešta", "tacan": false}], "pomoc": ["Traži mesta koja su u Hrvatskoj.", "Sarajevo je u BiH, a Budimpešta u Mađarskoj.", "Iz lekcije: najposećenija mesta su Dubrovnik, Pula, Plitvička jezera i Zagreb."], "objasnjenje": "Najposećenija mesta u Hrvatskoj su Dubrovnik, Pula, Plitvička jezera i Zagreb.", "iz_udzbenika": {"strana": 27, "odeljak": "Društveno-geografske odlike — turizam", "tekst": "Turizam ima veliki značaj za hrvatsku privredu; najposećeniji su Dubrovnik, Pula, Plitvička jezera i Zagreb."}}, {"id": "privreda-tn-industrija", "vrsta": "tacno_netacno", "tezina": "lako", "pojmovi": ["prehrambena-industrija", "tekstilna-industrija", "hemijska-industrija"], "tvrdnja": "Industrija Hrvatske smeštena je uglavnom u većim gradovima.", "tacno": true, "pomoc": ["Fabrikama trebaju radnici, putevi i luke.", "Gde ima najviše ljudi i saobraćaja — na selu ili u gradu?", "Iz lekcije: industrija je razvijena u većim gradovima."], "objasnjenje": "Tačno — industrija je razvijena u većim gradovima; najzastupljenije su prehrambena, tekstilna i hemijska.", "iz_udzbenika": {"strana": 27, "odeljak": "Društveno-geografske odlike — privreda", "tekst": "Industrija je razvijena u većim gradovima, a najzastupljenije grane su prehrambena, tekstilna i hemijska."}}, {"id": "privreda-povezi-resursi", "vrsta": "povezi", "tezina": "lako", "pojmovi": ["mermer", "brac", "nafta", "masline", "plitvicka-jezera"], "pitanje": "Poveži bogatstvo Hrvatske sa mestom gde se nalazi.", "parovi": [["mermer", "ostrvo Brač"], ["nafta i zemni gas", "Panonska nizija"], ["masline i agrumi", "primorska oblast"], ["16 jezera i vodopadi", "NP Plitvička jezera"]], "pomoc": ["Masline traže toplu, primorsku klimu.", "Nafta se vadi u ravnici, a mermer na jednom ostrvu.", "Iz lekcije: mermer — Brač; nafta i gas — Panonska nizija; masline — primorje; 16 jezera — Plitvice."], "objasnjenje": "Mermer je sa Brača, nafta i gas iz Panonske nizije, masline i agrumi sa primorja, a 16 jezera su u NP Plitvička jezera.", "iz_udzbenika": {"strana": 27, "odeljak": "Društveno-geografske odlike — privreda", "tekst": "Nafta i gas se vade u Panonskoj niziji, masline i agrumi uspevaju na primorju, Brač je poznat po mermeru, a Plitvice po jezerima."}}, {"id": "privreda-klik-dubrovnik", "vrsta": "karta_klik", "tezina": "lako", "pojmovi": ["dubrovnik", "turizam"], "pitanje": "Klikni na kartu — Dubrovnik, najpoznatije turističko mesto Hrvatske.", "cilj": {"mesto": "dubrovnik"}, "pomoc": ["Dubrovnik je na moru, na samom jugu Hrvatske.", "Traži krajnji jug Dalmacije, blizu granice sa Crnom Gorom.", "Iz lekcije: Dubrovnik je među najposećenijim turističkim mestima."], "objasnjenje": "Dubrovnik je na krajnjem jugu Dalmacije, blizu Crne Gore.", "iz_udzbenika": {"strana": 27, "odeljak": "Društveno-geografske odlike — turizam", "tekst": "Dubrovnik je jedno od najposećenijih turističkih mesta Hrvatske."}}, {"id": "privreda-dopuni-poljoprivreda", "vrsta": "dopuni", "tezina": "srednje", "pojmovi": ["zitarice", "industrijsko-bilje", "vinova-loza", "agrumi", "masline"], "pitanje": "Dopuni rečenicu rečima iz banke.", "tekst": "U Panonskoj oblasti gaje se {{žitarice}} i industrijsko bilje, a u primorskoj oblasti uspevaju vinova loza, {{agrumi}} i {{masline}}.", "ponudjene": ["žitarice", "agrumi", "masline", "banane", "pirinač"], "pomoc": ["U ravnici se gaje pšenica i kukuruz; na toplom primorju limun i pomorandža.", "Banane i pirinač traže toplije i vlažnije krajeve.", "Iz lekcije: Panonija — žitarice i industrijsko bilje; primorje — vinova loza, agrumi, masline."], "objasnjenje": "U Panoniji se gaje žitarice i industrijsko bilje, a na primorju vinova loza, agrumi i masline.", "iz_udzbenika": {"strana": 26, "odeljak": "Društveno-geografske odlike — privreda", "tekst": "U Panonskoj oblasti uzgajaju se žitarice i industrijsko bilje, a u primorskoj vinova loza, agrumi i masline.", "slika": "07-hrvatska/02-panonska-nizija.jpg"}}, {"id": "privreda-izbor-primorje", "vrsta": "izbor", "tezina": "srednje", "pojmovi": ["vinova-loza", "agrumi", "masline", "primorska-oblast"], "pitanje": "Šta uspeva u primorskoj oblasti Hrvatske? (Više tačnih.)", "odgovori": [{"tekst": "vinova loza", "tacan": true}, {"tekst": "agrumi", "tacan": true}, {"tekst": "masline", "tacan": true}, {"tekst": "žitarice", "tacan": false}, {"tekst": "industrijsko bilje", "tacan": false}], "pomoc": ["Primorje ima toplo, suvo leto i blagu zimu.", "Žitarice i industrijsko bilje gaje se u ravnici na severoistoku.", "Iz lekcije: na primorju — vinova loza, agrumi i masline."], "objasnjenje": "Na primorju uspevaju vinova loza, agrumi i masline; žitarice i industrijsko bilje su u Panoniji.", "iz_udzbenika": {"strana": 26, "odeljak": "Društveno-geografske odlike — privreda", "tekst": "U primorskoj oblasti uspevaju vinova loza, agrumi i masline."}}, {"id": "privreda-tn-nafta", "vrsta": "tacno_netacno", "tezina": "srednje", "pojmovi": ["nafta", "zemni-gas", "panonska-nizija"], "tvrdnja": "Nafta i zemni gas u Hrvatskoj eksploatišu se u primorskoj oblasti.", "tacno": false, "ispravke": [{"tekst": "Nafta i zemni gas eksploatišu se u Panonskoj niziji.", "tacan": true}, {"tekst": "Nafta i zemni gas eksploatišu se na Velebitu.", "tacan": false}, {"tekst": "Hrvatska uopšte nema nafte ni gasa.", "tacan": false}], "pomoc": ["Isto kao u Vojvodini u Srbiji.", "Ležišta su u ravnici na severoistoku.", "Iz lekcije: energetika se zasniva na nafti i zemnom gasu iz Panonske nizije."], "objasnjenje": "Netačno — nafta i zemni gas eksploatišu se u Panonskoj niziji.", "iz_udzbenika": {"strana": 26, "odeljak": "Društveno-geografske odlike — privreda", "tekst": "Energetika Hrvatske se zasniva na eksploataciji nafte i zemnog gasa u Panonskoj niziji."}}, {"id": "privreda-izbor-rude", "vrsta": "izbor", "tezina": "lako", "pojmovi": ["boksit", "bakar", "ruda-gvozdja"], "pitanje": "Koje se rude najviše eksploatišu u Hrvatskoj? (Više tačnih.)", "odgovori": [{"tekst": "boksit", "tacan": true}, {"tekst": "bakar", "tacan": true}, {"tekst": "ruda gvožđa", "tacan": true}, {"tekst": "zlato", "tacan": false}, {"tekst": "uranijum", "tacan": false}], "pomoc": ["Tačne su tri rude.", "Jedna od njih je sirovina za aluminijum, druga za žice, treća za čelik.", "Iz lekcije: najviše se eksploatišu boksit, bakar i ruda gvožđa."], "objasnjenje": "U Hrvatskoj se najviše vade boksit, bakar i ruda gvožđa.", "iz_udzbenika": {"strana": 27, "odeljak": "Društveno-geografske odlike — privreda", "tekst": "Od ruda se najviše eksploatišu boksit, bakar i ruda gvožđa."}}, {"id": "privreda-dopuni-mermer", "vrsta": "dopuni", "tezina": "srednje", "pojmovi": ["brac", "mermer"], "pitanje": "Dopuni rečenicu rečima iz banke.", "tekst": "Ostrvo {{Brač}} poznato je po kvalitetnom belom kamenu — {{mermeru}}.", "ponudjene": ["Brač", "mermeru", "Krk", "uglju"], "pomoc": ["Ostrvo je južno od Splita.", "Beli kamen se koristi za spomenike i skulpture.", "Iz lekcije: Brač je poznat po kvalitetnom mermeru."], "objasnjenje": "Brač je poznat po kvalitetnom belom mermeru.", "iz_udzbenika": {"strana": 27, "odeljak": "Društveno-geografske odlike — privreda", "tekst": "Ostrvo Brač je poznato po mermeru visokog kvaliteta."}}, {"id": "privreda-izbor-industrija", "vrsta": "izbor", "tezina": "lako", "pojmovi": ["prehrambena-industrija", "tekstilna-industrija", "hemijska-industrija"], "pitanje": "Koje su grane industrije najzastupljenije u Hrvatskoj? (Više tačnih.)", "odgovori": [{"tekst": "prehrambena", "tacan": true}, {"tekst": "tekstilna", "tacan": true}, {"tekst": "hemijska", "tacan": true}, {"tekst": "svemirska", "tacan": false}, {"tekst": "nuklearna", "tacan": false}], "pomoc": ["Tačne su tri grane.", "Jedna prerađuje hranu, druga pravi tkanine, treća hemikalije.", "Iz lekcije: najzastupljenije su prehrambena, tekstilna i hemijska industrija."], "objasnjenje": "Najzastupljenije su prehrambena, tekstilna i hemijska industrija, u većim gradovima.", "iz_udzbenika": {"strana": 27, "odeljak": "Društveno-geografske odlike — privreda", "tekst": "U većim gradovima najzastupljenije su prehrambena, tekstilna i hemijska industrija."}}, {"id": "privreda-zakljuci-masline", "vrsta": "zakljuci", "tezina": "srednje", "pojmovi": ["zitarice", "masline", "agrumi", "sredozemna-klima", "umerenokontinentalna-klima"], "pitanje": "Zašto se u Panonskoj oblasti gaje žitarice, a na primorju masline i agrumi?", "odgovori": [{"tekst": "Panonija je ravna i plodna, sa umerenokontinentalnom klimom; primorje ima blage zime i topla, suva leta.", "tacan": true}, {"tekst": "Na primorju je zemljište ravnije nego u Panoniji.", "tacan": false}, {"tekst": "U Panoniji je zima toplija nego na moru.", "tacan": false}, {"tekst": "Masline mogu da rastu samo na ostrvima.", "tacan": false}], "pomoc": ["Korak 1: Uporedi reljef — gde je ravnica, a gde strme planine?", "Korak 2: Uporedi klimu — gde su zime blage, a leta topla i suva?", "Iz lekcije: Panonija — žitarice i industrijsko bilje; primorje — vinova loza, agrumi, masline."], "objasnjenje": "Ravna i plodna Panonija sa umerenokontinentalnom klimom pogoduje žitaricama, a sredozemna klima primorja maslinama i agrumima.", "iz_udzbenika": {"strana": 26, "odeljak": "Društveno-geografske odlike — privreda", "tekst": "U Panonskoj oblasti se uzgajaju žitarice i industrijsko bilje, a u primorskoj vinova loza, agrumi i masline.", "slika": "07-hrvatska/02-panonska-nizija.jpg"}}, {"id": "privreda-zakljuci-turizam", "vrsta": "zakljuci", "tezina": "srednje", "pojmovi": ["turizam", "razudjena-obala", "dubrovnik", "plitvicka-jezera"], "pitanje": "Zašto je turizam toliko važan za Hrvatsku?", "odgovori": [{"tekst": "Ima dugu razuđenu obalu, toplo more, ostrva, istorijske gradove i prirodne lepote poput Plitvica.", "tacan": true}, {"tekst": "Zato što nema nijednu drugu privrednu granu.", "tacan": false}, {"tekst": "Zato što je u njoj zima najduža u Evropi.", "tacan": false}, {"tekst": "Zato što nema izlaz na more.", "tacan": false}], "pomoc": ["Korak 1: Šta privlači turiste na more?", "Korak 2: Seti se najposećenijih mesta — šta nude Dubrovnik, Pula i Plitvice?", "Iz lekcije: turizam ima veliki značaj; najposećeniji su Dubrovnik, Pula, Plitvice i Zagreb."], "objasnjenje": "Razuđena obala, toplo more, ostrva, stari gradovi (Dubrovnik, Pula) i nacionalni parkovi (Plitvice) privlače mnogo turista.", "iz_udzbenika": {"strana": 27, "odeljak": "Društveno-geografske odlike — turizam", "tekst": "Turizam je veoma važan za privredu Hrvatske; najposećenija mesta su Dubrovnik, Pula, Plitvička jezera i Zagreb."}}, {"id": "privreda-klik-plitvice", "vrsta": "karta_klik", "tezina": "srednje", "pojmovi": ["plitvicka-jezera", "nacionalni-park"], "pitanje": "Klikni na kartu — Nacionalni park Plitvička jezera.", "cilj": {"mesto": "plitvice"}, "pomoc": ["Park nije na moru, već u planinskoj unutrašnjosti (Lika).", "Nalazi se otprilike na pola puta između Zagreba i Zadra, blizu granice sa BiH.", "Iz lekcije: NP Plitvička jezera je jedna od najvažnijih turističkih atrakcija."], "objasnjenje": "Plitvička jezera su u Lici, između Zagreba i Zadra.", "iz_udzbenika": {"strana": 26, "odeljak": "Fizičko-geografske odlike — karta", "tekst": "Na fizičkoj karti tačka za NP Plitvička jezera je u planinskoj unutrašnjosti, u Lici.", "slika": "07-hrvatska/04-np-plitvicka-jezera.jpg"}}, {"id": "privreda-klik-pula", "vrsta": "karta_klik", "tezina": "srednje", "pojmovi": ["pula", "istra", "turizam"], "pitanje": "Klikni na kartu — Pula.", "cilj": {"mesto": "pula"}, "pomoc": ["Pula je na poluostrvu Istri.", "Leži na samom jugu Istre.", "Iz lekcije: Pula je među najposećenijim turističkim mestima Hrvatske."], "objasnjenje": "Pula je na jugu Istre.", "iz_udzbenika": {"strana": 27, "odeljak": "Društveno-geografske odlike — turizam", "tekst": "Pula je, uz Dubrovnik, Plitvice i Zagreb, među najposećenijim mestima Hrvatske."}}, {"id": "privreda-klik-split", "vrsta": "karta_klik", "tezina": "lako", "pojmovi": ["split"], "pitanje": "Klikni na kartu — Split, najveći grad na hrvatskoj obali.", "cilj": {"mesto": "split"}, "pomoc": ["Split je u srednjoj Dalmaciji.", "Nalazi se na kopnu, severno od ostrva Brač.", "Iz lekcije (rad sa atlasom): veći gradovi su Zagreb, Split, Rijeka, Osijek i Zadar."], "objasnjenje": "Split je u srednjoj Dalmaciji, severno od Brača.", "iz_udzbenika": {"strana": 27, "odeljak": "Zadatak — rad sa atlasom", "tekst": "Uz pomoć atlasa treba napisati pet većih gradova Hrvatske — npr. Zagreb, Split, Rijeka, Osijek i Zadar."}}, {"id": "privreda-klik-rijeka", "vrsta": "karta_klik", "tezina": "srednje", "pojmovi": ["rijeka"], "pitanje": "Klikni na kartu — Rijeka, najveća hrvatska luka.", "cilj": {"mesto": "rijeka"}, "pomoc": ["Rijeka je na severu Jadrana, u Kvarnerskom zalivu.", "Nalazi se na kopnu, istočno od Istre, kod ostrva Krk.", "Iz lekcije (rad sa atlasom): veći gradovi su Zagreb, Split, Rijeka, Osijek i Zadar."], "objasnjenje": "Rijeka je u Kvarnerskom zalivu, istočno od Istre.", "iz_udzbenika": {"strana": 27, "odeljak": "Zadatak — rad sa atlasom", "tekst": "Uz pomoć atlasa treba napisati pet većih gradova Hrvatske — npr. Zagreb, Split, Rijeka, Osijek i Zadar."}}, {"id": "privreda-gde-sam-dubrovnik", "vrsta": "gde_sam", "tezina": "srednje", "pojmovi": ["dubrovnik", "turizam"], "pitanje": "Gde sam? Pročitaj trag i klikni mesto na karti.", "cilj": {"mesto": "dubrovnik"}, "tragovi": ["Od ostatka Hrvatske odvaja me kratka obala BiH kod Neuma.", "Nalazim se na samom jugu Dalmacije, blizu Crne Gore.", "Moje stare zidine privlače turiste iz celog sveta.", "Ja sam jedno od najposećenijih turističkih mesta Hrvatske, na krajnjem jugu obale."], "objasnjenje": "Dubrovnik — istorijski grad na krajnjem jugu Hrvatske, jedno od najposećenijih turističkih mesta.", "iz_udzbenika": {"strana": 27, "odeljak": "Društveno-geografske odlike — turizam", "tekst": "Dubrovnik je među najposećenijim turističkim mestima Hrvatske."}}, {"id": "privreda-gde-sam-brac", "vrsta": "gde_sam", "tezina": "srednje", "pojmovi": ["brac", "mermer"], "pitanje": "Gde sam? Pročitaj trag i klikni mesto na karti.", "cilj": {"mesto": "brac"}, "tragovi": ["Južno od mene je ostrvo Hvar.", "Nalazim se odmah južno od Splita.", "Ja sam jedno od najvećih ostrva srednje Dalmacije.", "Poznat sam po belom kamenu — kvalitetnom mermeru."], "objasnjenje": "Brač — ostrvo južno od Splita, poznato po mermeru.", "iz_udzbenika": {"strana": 27, "odeljak": "Društveno-geografske odlike — privreda", "tekst": "Ostrvo Brač je poznato po kvalitetnom mermeru."}}, {"id": "privreda-povezi-gradovi", "vrsta": "povezi", "tezina": "srednje", "pojmovi": ["split", "rijeka", "osijek", "pula", "dubrovnik"], "pitanje": "Poveži grad sa njegovim položajem.", "parovi": [["Split", "srednja Dalmacija, najveći grad na obali"], ["Rijeka", "Kvarnerski zaliv, najveća luka"], ["Osijek", "Slavonija, na Dravi"], ["Pula", "jug Istre"], ["Dubrovnik", "krajnji jug Dalmacije"]], "pomoc": ["Jedini grad koji nije na moru je u panonskom delu.", "Pula je na poluostrvu, a Dubrovnik najjužnije.", "Iz lekcije (rad sa atlasom): veći gradovi su Zagreb, Split, Rijeka, Osijek i Zadar; turistička mesta Dubrovnik i Pula."], "objasnjenje": "Split — srednja Dalmacija; Rijeka — Kvarner; Osijek — Slavonija na Dravi; Pula — jug Istre; Dubrovnik — krajnji jug.", "iz_udzbenika": {"strana": 27, "odeljak": "Zadatak — rad sa atlasom", "tekst": "Zadatak traži da se uz pomoć atlasa napišu imena pet većih gradova Hrvatske."}}, {"id": "privreda-izbor-gradovi", "vrsta": "izbor", "tezina": "tesko", "pojmovi": ["split", "rijeka", "osijek", "zadar"], "pitanje": "Koji su od navedenih gradova veći gradovi HRVATSKE? (Više tačnih.)", "odgovori": [{"tekst": "Split", "tacan": true}, {"tekst": "Rijeka", "tacan": true}, {"tekst": "Osijek", "tacan": true}, {"tekst": "Zadar", "tacan": true}, {"tekst": "Mostar", "tacan": false}, {"tekst": "Kopar", "tacan": false}, {"tekst": "Subotica", "tacan": false}], "pomoc": ["Pazi — neki gradovi su blizu Hrvatske, ali u susednim državama.", "Mostar je u BiH, Kopar u Sloveniji, a Subotica u Srbiji.", "Iz lekcije (rad sa atlasom): Zagreb, Split, Rijeka, Osijek, Zadar."], "objasnjenje": "Split, Rijeka, Osijek i Zadar su veći gradovi Hrvatske. Mostar je u BiH, Kopar u Sloveniji, Subotica u Srbiji.", "iz_udzbenika": {"strana": 27, "odeljak": "Zadatak — rad sa atlasom", "tekst": "Uz pomoć atlasa treba napisati pet većih gradova Hrvatske — npr. Zagreb, Split, Rijeka, Osijek i Zadar."}}, {"id": "privreda-izbor-mermer-stena", "vrsta": "izbor", "tezina": "tesko", "pojmovi": ["mermer", "krecnjak"], "pitanje": "Kojoj vrsti stena pripada mermer sa Brača?", "odgovori": [{"tekst": "metamorfnim — nastaje preobražajem krečnjaka", "tacan": true}, {"tekst": "magmatskim — nastaje hlađenjem lave", "tacan": false}, {"tekst": "taložnim — nastaje taloženjem peska", "tacan": false}, {"tekst": "to nije stena nego ruda metala", "tacan": false}], "pomoc": ["Seti se tri vrste stena — magmatske, taložne i metamorfne.", "Mermer nastaje kada se krečnjak promeni pod velikim pritiskom i toplotom.", "Iz lekcije: mermer je metamorfna stena (nastaje preobražajem krečnjaka)."], "objasnjenje": "Mermer je metamorfna stena — nastaje preobražajem krečnjaka pod pritiskom i toplotom.", "iz_udzbenika": {"strana": 27, "odeljak": "Društveno-geografske odlike — privreda", "tekst": "Udžbenik traži da se setimo kojoj vrsti stena pripada mermer — to je metamorfna stena nastala od krečnjaka."}}, {"id": "privreda-zakljuci-nafta", "vrsta": "zakljuci", "tezina": "tesko", "pojmovi": ["nafta", "zemni-gas", "panonska-nizija"], "pitanje": "Zašto se nafta i gas u Hrvatskoj vade baš u Panonskoj niziji?", "odgovori": [{"tekst": "Tu je nekada bilo Panonsko more, u kome su se taložili organski ostaci od kojih su nastala ležišta.", "tacan": true}, {"tekst": "Nafta nastaje na visokim planinama, a odatle je reke donose u nizinu.", "tacan": false}, {"tekst": "Zato što je tu najtoplija klima u Hrvatskoj.", "tacan": false}, {"tekst": "Nafta se stvara samo ispod gradova.", "tacan": false}], "pomoc": ["Korak 1: Seti se kako je nastala Panonska nizija — šta je tu bilo pre ravnice?", "Korak 2: Od čega nastaju nafta i gas i gde se to gradivo nakuplja?", "Iz lekcije: energetika se zasniva na nafti i zemnom gasu iz Panonske nizije."], "objasnjenje": "Na dnu nekadašnjeg Panonskog mora taložili su se ostaci živih bića, iz kojih su nastala ležišta nafte i gasa — isto kao u Vojvodini.", "iz_udzbenika": {"strana": 26, "odeljak": "Društveno-geografske odlike — privreda", "tekst": "Energetika Hrvatske se zasniva na eksploataciji nafte i zemnog gasa u Panonskoj niziji."}}, {"id": "privreda-dopuni-plitvice", "vrsta": "dopuni", "tezina": "tesko", "pojmovi": ["plitvicka-jezera", "korana", "nacionalni-park"], "pitanje": "Dopuni rečenicu (bez banke reči).", "tekst": "Nacionalni park Plitvička jezera osnovan je {{1949}}. godine; na reci {{Korani|Korana}} nastalo je {{16|šesnaest}} jezera.", "pomoc": ["Park je osnovan nekoliko godina posle Drugog svetskog rata.", "Reka počinje slovom K (nije Kupa); jezera ima više od petnaest.", "Iz lekcije: park je osnovan 1949; na Korani je 16 jezera."], "objasnjenje": "NP Plitvička jezera osnovan je 1949. godine; na reci Korani nastalo je 16 jezera.", "iz_udzbenika": {"strana": 27, "odeljak": "Zanimljivost — Plitvička jezera", "tekst": "NP Plitvička jezera osnovan je 1949. i jedna je od najvažnijih atrakcija Hrvatske; na Korani je nastalo 16 jezera povezanih slapovima.", "slika": "07-hrvatska/04-np-plitvicka-jezera.jpg"}}, {"id": "privreda-tn-plitvice-vulkan", "vrsta": "tacno_netacno", "tezina": "tesko", "pojmovi": ["plitvicka-jezera", "krecnjak"], "tvrdnja": "Slapovi i vodopadi Plitvičkih jezera nastali su delovanjem vulkana.", "tacno": false, "ispravke": [{"tekst": "Nastali su taloženjem krečnjaka iz vode reke Korane.", "tacan": true}, {"tekst": "Nastali su kada je more poplavilo Liku.", "tacan": false}, {"tekst": "Nastali su kopanjem rudnika boksita.", "tacan": false}], "pomoc": ["U Hrvatskoj nema vulkana.", "Voda nosi rastvoren kamen i ostavlja ga na stenama — tako rastu „pregrade”.", "Iz lekcije: slapovi su nastali taloženjem krečnjaka."], "objasnjenje": "Netačno — slapovi i jezerske pregrade nastali su taloženjem krečnjaka (sedre) iz vode Korane.", "iz_udzbenika": {"strana": 27, "odeljak": "Zanimljivost — Plitvička jezera", "tekst": "Jezera na Korani povezuju brojni slapovi i vodopadi, nastali taloženjem krečnjaka.", "slika": "07-hrvatska/04-np-plitvicka-jezera.jpg"}}, {"id": "privreda-povezi-uzroci", "vrsta": "povezi", "tezina": "tesko", "pojmovi": ["primorska-oblast", "krecnjak", "nafta", "masline", "turizam"], "pitanje": "Poveži uzrok sa posledicom.", "parovi": [["planine se strmo dižu iznad mora", "uska primorska oblast"], ["taloženje krečnjaka na Korani", "slapovi Plitvičkih jezera"], ["ostaci u nekadašnjem Panonskom moru", "ležišta nafte i gasa"], ["blage zime i topla suva leta", "gajenje maslina i agruma"], ["razuđena obala, toplo more i stari gradovi", "razvijen turizam"]], "pomoc": ["Za svaki uzrok pitaj se „šta se zbog ovoga desilo?”.", "Klima utiče na biljke, a reljef na širinu obale.", "Iz lekcije: strme planine → uska obala; krečnjak → slapovi; Panonsko more → nafta; sredozemna klima → masline; obala → turizam."], "objasnjenje": "Strme planine sužavaju obalu, krečnjak gradi slapove, Panonsko more je ostavilo naftu i gas, sredozemna klima pogoduje maslinama, a lepa obala turizmu.", "iz_udzbenika": {"strana": 27, "odeljak": "Društveno-geografske odlike — privreda", "tekst": "Reljef, klima i nekadašnje Panonsko more objašnjavaju gde je u Hrvatskoj koja privredna grana — od nafte u Panoniji do maslina i turizma na primorju."}}, {"id": "privreda-klik-zadar", "vrsta": "karta_klik", "tezina": "srednje", "pojmovi": ["zadar"], "pitanje": "Klikni na kartu — Zadar.", "cilj": {"mesto": "zadar"}, "pomoc": ["Zadar je na obali severne Dalmacije.", "Leži južno od ostrva Pag i podnožja Velebita.", "Iz lekcije (rad sa atlasom): veći gradovi su Zagreb, Split, Rijeka, Osijek i Zadar."], "obj // ---------- outcome ----------
function fail(z, text, given) {
  const s = st(z.id);
  s.miss++;
  (s.log = s.log || []).push({ v: given || '', ok: false });
  const ended = s.miss > steps(z);
  if (ended) { s.status = helpOn() ? 'revealed' : 'failed'; s.pts = 0; firstTry() && learnFrom(z, 0); if (helpOn()) place(z, false); toast(helpOn() ? 'Evo odgovora' : 'Netačno', false); }
  else toast(text || 'Netačno — pokušaj ponovo', false);
  finishCheck(); save(); renderItem(true); renderNav(); refreshScore();
  if (ended ? s.status === 'revealed' : helpOn() && !mobile()) openDrawer();
}
function succeed(z, given, pts) {   // pts: set only by self-graded `objasni`
  const s = st(z.id);
  s.status = 'ok'; s.pts = pts != null ? pts : ptsFor(s.miss);
  (s.log = s.log || []).push({ v: given || '', ok: true });
  if (firstTry()) learnFrom(z, s.pts);
  s.placed = place(z, true);
  toast('Tačno! +' + s.pts + (s.placed ? ' · na vremenskoj osi' : ''), true);
  finishCheck(); save(); renderItem(false); renderNav(); refreshScore();
  openDrawer();
}
const firstTry = () => !(state.mode === 'test' && att() && att().phase === 'ispravka');   // Ispravka does not change mastery

// ---------- item renderers ----------
const main = document.getElementById('main');
function frame(z, s, inner) {

    inner + '<div class="help-inline" id="helpInline"></div><div class="iactions" id="actions"></div>' +
    (isDone(s) ? '<div class="expl' + (s.status === 'ok' ? '' : ' rev') + '">' + (s.status === 'failed' ? 'Netačno. Odgovor ćeš videti u Ispravci.' : fmt(z.objasnjenje || '')) + '</div>' : '') + questionFig(z, s) + '</div>';
}

  const b = z.iz_udzbenika; if (!z.slika_u_pitanju || !b || !b.slika) return '';

    (INFO.zasticeno ? 'this.parentNode.outerHTML=\'<p class=&quot;ref&quot;>Slika uz ovo pitanje je u <a href=&quot;' + esc(INFO.zasticeno) + '&quot;>verziji sa slikama iz udžbenika (lozinka)</a>.</p>\'' : 'this.parentNode.remove()') +

function prelude(z, s) {   // what stands above the options: a source, a cause→effect chain, the clues so far
  const done = isDone(s), right = z.odgovori && z.odgovori.find(o => o.tacan);
  if (z.vrsta === 'izvor') { const iz = z.izvor;
    return '<div class="src">' + (iz.autor || iz.naslov ? '<p class="who">' + esc([iz.autor, iz.naslov].filter(Boolean).join(' — ')) + '</p>' : '') +
      '<blockquote>' + fmt(iz.tekst) + '</blockquote>' + (iz.napomena ? '<p class="nt">' + fmt(iz.napomena) + '</p>' : '') + '</div>'; }
  if (z.vrsta === 'lanac') return '<div class="chain">' + z.karike.map((k, i) => (i ? '<span class="ar">→</span>' : '') +
    (i === z.praznina ? '<div class="lk q' + (done && s.status !== 'failed' ? ' ok' : '') + '">' + (done && s.status !== 'failed' ? fmt(right.tekst) : '?') + '</div>' : '<div class="lk">' + fmt(k) + '</div>')).join('') + '</div>';
  if (z.vrsta === 'ko_sam') { const n = Math.min(z.tragovi.length, done ? z.tragovi.length : s.miss + 1);
    return '<ul class="clues">' + z.tragovi.slice(0, n).map((t, i) => '<li><span class="k">Trag ' + (i + 1) + '</span>' + fmt(t) + '</li>').join('') + '</ul>'; }
  return '';
}
function renderChoice(z, s) {   // izbor, zakljuci, lanac, izvor, ko_sam (+ the correction step of tacno_netacno)
  const opts = shuffled(z.odgovori, z.id);
  const multi = z.odgovori.filter(o => o.tacan).length > 1;
  const ui = s.ui; ui.wrong = ui.wrong || []; ui.pick = ui.pick || [];
  const done = isDone(s), showRight = s.status === 'ok' || s.status === 'revealed';
  const why = o => o.zasto && (helpOn() || (done && s.status !== 'failed')) ? '<span class="why">' + fmt(o.zasto) + '</span>' : '';
  main.innerHTML = frame(z, s, prelude(z, s) + '<h2 class="q">' + fmt(z.pitanje || (z.vrsta === 'ko_sam' ? 'Ko sam ja?' : 'Koja karika nedostaje?')) + '</h2><div class="opts">' + opts.map(([o, i]) =>
    '<button type="button" class="opt' + (multi ? '' : ' round') + (ui.wrong.includes(i) ? ' wrong' : '') + (showRight && o.tacan ? ' right' : '') +
    (!done && ui.pick.includes(i) ? ' picked' : '') + '" data-i="' + i + '"' + (done || ui.wrong.includes(i) ? ' disabled' : '') + '><span class="box"></span><span><span class="ot">' + fmt(o.tekst) + '</span>' +
    (ui.wrong.includes(i) ? why(o) : '') + '</span></button>').join('') + '</div>');
  if (!done && multi) actions([['btnCheck', 'Proveri', 'ok']]);
  if (!done && z.vrsta === 'ko_sam' && s.miss < steps(z)) { actions([['btnClue', 'Još jedan trag']]); document.getElementById('btnClue').addEventListener('click', () => { ui.why = null; fail(z, 'Novi trag', 'zatražen novi trag'); }); }
  main.querySelectorAll('.opt').forEach(b => b.addEventListener('click', () => {
    const i = +b.dataset.i;
    if (!multi) { if (z.odgovori[i].tacan) succeed(z, z.odgovori[i].tekst); else { ui.wrong.push(i); ui.why = z.odgovori[i].zasto || null; fail(z, undefined, z.odgovori[i].tekst); } return; }
    ui.pick = ui.pick.includes(i) ? ui.pick.filter(x => x !== i) : ui.pick.concat(i);
    b.classList.toggle('picked'); save();
  }));
  const chk = document.getElementById('btnCheck');
  if (chk) chk.addEventListener('click', () => {
    if (!ui.pick.length) { toast('Označi bar jedan odgovor', false); return; }
    const right = z.odgovori.map((o, i) => o.tacan ? i : -1).filter(i => i >= 0);
    const wrongPicked = ui.pick.filter(i => !z.odgovori[i].tacan);
    const given = ui.pick.map(i => z.odgovori[i].tekst).join('; ');

const P = MAPI.proj;

function mountMap(z, s, onClick) {

    const rx = (cx - vb[0]) / vb[2], ry = (cy - vb[1]) / vb[3];

function questionText(z) {

  save(); refresh();
});
document.getElementById('mRepeat').addEventListener('click', () => {
  const rev = state.ucenje.items.filter(z => (state.ucenje.b[z.id] || {}).status === 'revealed').map(z => z.id);
  rev.forEach(id => { delete state.ucenje.b[id]; });
  if (rev.length) { state.cur = rev[0]; save(); refresh(); }
});

// ---------- init ----------
if (!state.ucenje) newLearning();
if (!byId(state.cur) && !['_sum', '_start', '_znanje', '_osa'].includes(state.cur) && !String(state.cur).startsWith('r:') && !lekRoute()) state.cur = state.mode === 'test' ? '_start' : state.ucenje.items[0].id;
refresh();
let introSeen = false; try { introSeen = localStorage.getItem(STATE_KEY + ':intro') === '1'; } catch (e) {}
if (!introSeen) showIntro();
</script>
</body>
</html>
