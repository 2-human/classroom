# Bosna i Hercegovina — kviz po lekciji (tip: lesson-quiz; vidi templates/lesson-quiz/README.md).
# Pitanja su napisana sopstvenim rečima na osnovu lekcije „Bosna i Hercegovina” (7. razred, str. 24–25).
# `iz_udzbenika` (posle odgovora, u fioci): strana, odeljak, sažetak sopstvenim rečima i slika iz
# privatnog tools/geografija/_source/slike-7/ (prikazuje se samo kad taj folder postoji — van git-a).
