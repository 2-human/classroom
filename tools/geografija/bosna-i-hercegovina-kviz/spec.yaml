locale: sr
nivo: osnovna
razred: 7
lekcije: [6]
description: >-
  Kviz za lekciju Bosna i Hercegovina: položaj, reljef i reke, entiteti i narodi, privreda i gradovi —
  činjenice, tačno/netačno sa ispravkom, dopunjavanje, povezivanje, zaključivanje i karta (klikni, „Gde sam?”).

