<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bosna i Hercegovina — kviz</title>
<style>

 :root{--hub-bg:#faf8f2;--hub-card:#fff;--hub-ink:#2b2b2b;--hub-head:#3a3528;--hub-mute:#6b6456;--hub-line:#e6e0d2;--hub-soft:#f3ecd8;--hub-accent:#b1271f;--hub-ok:#1f7a3a;--hub-nav-w:280px;--hub-drawer-w:440px}
 html:has(.app-body){overflow:hidden}
 .app-body{margin:0;height:100vh;height:100dvh;overflow:hidden;display:flex;flex-direction:column;max-width:100vw;background:var(--hub-bg);color:var(--hub-ink);font-family:system-ui,Segoe UI,Roboto,Arial,sans-serif}
 .app-bar{flex:0 0 auto;display:flex;align-items:center;gap:14px;padding:8px 16px;background:var(--hub-card);border-bottom:1px solid var(--hub-line);min-width:0;position:relative;z-index:50}
 .app-bar .app-menu{display:none;padding:0;width:36px;height:34px;font-size:18px;line-height:1;border:1px solid var(--hub-line);background:var(--hub-card);color:var(--hub-head);border-radius:7px;cursor:pointer}
 .app-bar .app-menu:hover{background:var(--hub-soft);color:var(--hub-head)}
 .brand{font-weight:700;font-size:15px;color:var(--hub-head);text-decoration:none;white-space:nowrap}
 .brand:hover{color:var(--hub-accent)}
 .app-crumbs{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--hub-mute);min-width:0;overflow:hidden;white-space:nowrap}
 .app-crumbs a{color:var(--hub-mute);text-decoration:none}
 .app-crumbs a:hover{color:var(--hub-accent)}
 .app-crumbs .sep{color:#b9b2a0}
 .app-crumbs .cur{color:var(--hub-head);font-weight:600;overflow:hidden;text-overflow:ellipsis}
 .bar-right{margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end;min-width:0}
 .app-grid{flex:1 1 auto;display:grid;grid-template-columns:var(--hub-nav-w) minmax(0,1fr);min-height:0}
 .app-nav{background:var(--hub-card);border-right:1px solid var(--hub-line);overflow:auto;padding:10px 10px 40px;min-height:0}
 .app-filter{width:100%;font:inherit;font-size:13px;padding:7px 9px;border:1px solid var(--hub-line);border-radius:6px;margin:0 0 4px;background:#fff;color:var(--hub-ink)}
 .app-filter:focus{outline:none;border-color:var(--hub-mute)}
 .app-nav .sec{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--hub-mute);padding:12px 6px 4px}
 .app-nav .cnt{font-size:11px;color:var(--hub-mute);font-variant-numeric:tabular-nums;letter-spacing:0;text-transform:none}
 .f-hide{display:none!important}
 .app-main{position:relative;overflow:auto;min-width:0;min-height:0;transition:margin-right .18s ease}
 .app-drawer{position:fixed;top:var(--htop,50px);right:0;bottom:0;width:var(--hub-drawer-w);max-width:100vw;background:var(--hub-card);border-left:1px solid var(--hub-line);box-shadow:-8px 0 24px rgba(58,53,40,.10);transform:translateX(105%);transition:transform .18s ease;z-index:60;display:flex;flex-direction:column}
 .app-drawer.open{transform:none}
 .drawer-head{display:flex;align-items:flex-start;gap:10px;padding:14px 16px 10px;border-bottom:1px solid var(--hub-line)}
 .drawer-head h2{margin:0;font-size:16px;color:var(--hub-head);flex:1 1 auto;overflow-wrap:anywhere}
 .app-drawer .drawer-close{border:0;background:none;padding:0 4px;font-size:24px;line-height:1;cursor:pointer;color:var(--hub-mute)}
 .app-drawer .drawer-close:hover{background:none;color:var(--hub-accent)}
 .drawer-body{flex:1 1 auto;overflow:auto;padding:12px 16px 24px;font-size:13px;line-height:1.55}
 .drawer-foot{flex:0 0 auto;border-top:1px solid var(--hub-line);padding:10px 16px;font-size:12px;color:var(--hub-mute)}
 .mtabs{display:flex;gap:2px;border-bottom:1px solid var(--hub-line);flex-wrap:wrap;background:var(--hub-card);padding:0 12px}
 .mtabs a{text-decoration:none;color:var(--hub-mute);font-size:13px;padding:9px 12px 8px;border-bottom:2px solid transparent}
 .mtabs a[aria-current="page"]{color:var(--hub-head);border-bottom-color:var(--hub-accent);font-weight:600}
 .bar-menu-wrap{position:relative}
 .bar-menu{display:none;position:absolute;right:0;top:calc(100% + 8px);z-index:70;background:var(--hub-card);border:1px solid var(--hub-line);border-radius:10px;box-shadow:0 6px 20px rgba(0,0,0,.16);padding:8px;min-width:240px}
 .bar-menu.open{display:flex;flex-direction:column;align-items:stretch;gap:6px}
 .tbl{width:100%;border-collapse:collapse;background:var(--hub-card);border:1px solid var(--hub-line);border-radius:6px;font-size:13px}
 .tbl th{text-align:left;font-weight:600;font-size:11.5px;color:var(--hub-mute);padding:8px 10px;border-bottom:1px solid var(--hub-line);background:#fcfaf4;white-space:nowrap}
 .tbl td{padding:7px 10px;border-bottom:1px solid #f0ebe0;vertical-align:top}
 .tbl td.num,.tbl th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
 .tbl tr.clk{cursor:pointer} .tbl tr.clk:hover td{background:#fbf7ec}
 @media (min-width:1200px){ .app-body:has(.app-drawer.open) .app-main{margin-right:var(--hub-drawer-w)} }
 @media (max-width:760px){
   .app-bar{gap:10px;padding:8px 12px}
   .app-bar .app-menu{display:inline-block}
   .app-crumbs{display:none}
   .app-grid{grid-template-columns:minmax(0,1fr)}
   .app-nav{position:fixed;top:var(--htop,50px);left:0;bottom:0;width:300px;max-width:88vw;z-index:55;transform:translateX(-105%);transition:transform .18s ease;box-shadow:8px 0 24px rgba(58,53,40,.10)}
   .app-nav.open{transform:none}
   .app-drawer{width:100vw}
 }
 @media print{
   html:has(.app-body){overflow:visible}
   .app-body{height:auto;overflow:visible;display:block}
   .app-grid{display:block}
   .app-main,.app-nav{overflow:visible}
   .app-drawer,.app-filter,.app-menu,.bar-menu-wrap,.mtabs{display:none!important}
 }

 :root{--ink:#2b2b2b;--muted:#6b6456;--edge:#b1271f;--accent:#1f7a3a;--border:#e6e0d2;--soft:#fefcf7;--warn:#c98a2c;
       --sea:#cfe6f2;--land:#efeae0;--land-se:#f3ecd8;--bord:#8a8170}
 *{box-sizing:border-box}
 button{font:inherit;padding:7px 14px;border:1px solid var(--edge);background:#fff;color:var(--edge);border-radius:8px;cursor:pointer}
 button:hover{background:var(--edge);color:#fff}
 button.ok{border-color:var(--accent);color:var(--accent)} button.ok:hover{background:var(--accent);color:#fff}
 button:disabled{opacity:.45;cursor:default;background:#fff;color:inherit}
 .opt:disabled,.tn button:disabled,.mcell:disabled,.blank:disabled{opacity:1;cursor:default}
 .opt:disabled:not(.right):not(.wrong){opacity:.6}
 .bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-size:14px}
 .bar-menu-btn{padding:5px 12px;font-size:16px;line-height:1;border-color:var(--muted);color:#3a3528}
 .bar-menu-btn:hover{background:#f3ecd8;color:#3a3528}
 .bar-menu button{width:100%;text-align:left}
 .bar-menu .menu-link{display:block;font-size:13px;color:var(--edge);text-decoration:none;padding:7px 14px;border:1px dashed #e6b0b0;border-radius:8px}
 .mode-switch{display:inline-flex}
 .ms-btn{padding:5px 12px;border-color:#6b6456;color:#3a3528;min-width:5.5em}
 .ms-btn:first-child{border-radius:8px 0 0 8px} .ms-btn:last-child{border-radius:0 8px 8px 0;border-left:none}
 .ms-btn:hover{background:#f3ecd8;color:#3a3528}
 .ms-btn.active{background:#3a3528;color:#fff;border-color:#3a3528}
 .stat{background:#f3ecd8;border:1px solid #e1d8c2;border-radius:8px;padding:4px 10px;white-space:nowrap}
 .stat b{font-size:15px;color:var(--accent)}
 .intro p{font-size:14px;color:#4a4434;line-height:1.6;margin:0 0 10px}
 .intro ul{margin:0 0 10px;padding-left:18px;font-size:13.5px;line-height:1.55}
 /* navigation: items */
 .it-row{display:flex;align-items:center;gap:8px;width:100%;border:0;border-radius:5px;background:none;color:var(--ink);font:inherit;font-size:13px;text-align:left;padding:5px 6px;cursor:pointer}
 .it-row:hover{background:#f6f1e4;color:var(--ink)}
 .it-row.sel{background:#efe7d2;font-weight:600}
 .it-row.off{opacity:.4}
 .it-row .st{flex:0 0 16px;text-align:center;color:#b9b2a0}
 .it-row.ok .st{color:var(--accent)} .it-row.rev .st,.it-row.fail .st{color:var(--edge)} .it-row.part .st{color:var(--warn)}
 .it-row .lbl{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
 .it-row .pt{flex:0 0 auto;font-size:11px;color:var(--muted);font-weight:400;font-variant-numeric:tabular-nums}
 .tz{flex:0 0 auto;display:inline-block;min-width:1.5em;text-align:center;font-size:10px;font-weight:700;border-radius:8px;padding:1px 5px;letter-spacing:.02em}
 .tz-lako{background:#e3f2e8;color:#1f6b3a} .tz-srednje{background:#fbefd5;color:#8a5a14} .tz-tesko{background:#f8dcd8;color:#8a2a22}
 .tz-legend{display:flex;gap:8px;flex-wrap:wrap;font-size:11px;color:var(--muted);padding:2px 6px 0}
 /* main: item */
 .item{padding:20px 24px 40px;max-width:1100px}
 .ihead{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-bottom:8px}
 .vchip{font-size:11px;text-transform:uppercase;letter-spacing:.05em;border:1px solid var(--border);border-radius:9px;padding:1px 8px;background:#fff}
 .item h2.q{font-size:18px;line-height:1.4;color:#3a3528;margin:0 0 14px}
 .opts{display:flex;flex-direction:column;gap:8px;max-width:640px}
 .opt{display:flex;gap:10px;align-items:flex-start;text-align:left;border:1px solid var(--border);background:#fff;color:var(--ink);border-radius:8px;padding:10px 12px;font-size:14.5px;line-height:1.4}
 .opt:hover{background:#fbf7ec;color:var(--ink)}
 .opt.picked{border-color:#3a3528;background:#f6f1e4}
 .opt.wrong{border-color:#e6b0b0;background:#fdecec;color:#8a2a22;text-decoration:line-through}
 .opt.right{border-color:#9fd5b6;background:#e8f5ec;color:#13602c;font-weight:600}
 .opt .box{flex:0 0 18px;height:18px;border:1.5px solid #6b6456;border-radius:4px;margin-top:1px}
 .opt.picked .box{background:#3a3528;box-shadow:inset 0 0 0 3px #fff}
 .opt.round .box{border-radius:50%}
 .tn{display:flex;gap:12px;margin:4px 0 14px}
 .tn button{min-width:8em;padding:10px 18px;font-size:15px}
 .tn button.right{background:var(--accent);border-color:var(--accent);color:#fff}
 .tn button.wrong{background:#fdecec;border-color:#e6b0b0;color:#8a2a22}
 .stmt{font-size:16px;line-height:1.5;border-left:3px solid #e1d8c2;padding:6px 12px;margin:0 0 14px;background:#fff}
 .sub-q{font-weight:600;color:#3a3528;margin:16px 0 8px}
 .cloze{font-size:16px;line-height:2.3;max-width:720px}
 .blank{display:inline-block;min-width:5.5em;border:0;border-bottom:2px solid #6b6456;background:#fff;text-align:center;font:inherit;font-weight:600;color:#3a3528;padding:0 6px;margin:0 3px;border-radius:4px 4px 0 0;cursor:pointer}
 input.blank{cursor:text;width:7em}
 .blank:hover{background:#fbf7ec;color:#3a3528}
 .blank.cur{border-bottom-color:var(--edge);background:#fff7f3}
 .blank.lock{border-bottom-color:var(--accent);background:#e8f5ec;color:#13602c;cursor:default}
 .blank.bad{border-bottom-color:var(--edge);background:#fdecec;color:#8a2a22}
 .blank.rev{border-bottom-color:var(--warn);background:#fdf3e2;color:#8a5a14}
 .bank{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 0}
 .bank button{padding:5px 12px;border-color:#6b6456;color:#3a3528;border-radius:16px}
 .bank button:hover{background:#f3ecd8;color:#3a3528}
 .bank button.used{opacity:.3;pointer-events:none}
 .match{display:grid;grid-template-columns:1fr 1fr;gap:10px 28px;max-width:720px}
 .match .col{display:flex;flex-direction:column;gap:8px}
 .mcell{text-align:left;border:1px solid var(--border);background:#fff;color:var(--ink);border-radius:8px;padding:9px 12px;font-size:14px}
 .mcell:hover{background:#fbf7ec;color:var(--ink)}
 .mcell.cur{border-color:#3a3528;box-shadow:0 0 0 2px rgba(58,53,40,.15)}
 .mcell.done{border-color:#9fd5b6;background:#e8f5ec;color:#13602c;cursor:default}
 .mcell.rev{border-color:#ecc98a;background:#fdf3e2;color:#8a5a14;cursor:default}
 .mcell.bad{animation:shake .3s;border-color:#e6b0b0;background:#fdecec}
 .mcell .n{display:inline-block;min-width:1.4em;font-weight:700;margin-right:6px;color:var(--muted)}
 @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
 .iactions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:18px}
 .fb{font-size:14px;font-weight:600;min-height:1.4em}
 .fb.ok{color:var(--accent)} .fb.bad{color:var(--edge)} .fb.info{color:var(--muted);font-weight:400}
 .expl{margin-top:14px;padding:10px 14px;border-radius:8px;background:#e8f5ec;border:1px solid #bfe0c8;color:#13602c;font-size:14px;line-height:1.5;max-width:720px}
 .expl.rev{background:#fdf3e2;border-color:#f0d878;color:#6b4a10}
 .help-inline{display:none}
 /* map */
 .mapwrap{position:relative;margin-top:6px;border:1px solid var(--border);border-radius:8px;overflow:hidden;background:var(--sea);aspect-ratio:1000/625;max-height:70vh;touch-action:none}
 .mapwrap svg{width:100%;height:100%;display:block;cursor:crosshair}
 .mapwrap svg.drag{cursor:grabbing}
 .mapwrap .c{fill:var(--land);stroke:var(--bord);stroke-width:.6;vector-effect:non-scaling-stroke}
 .mapwrap .c.se{fill:var(--land-se)}
 .mapwrap .c.se:hover{fill:#e9dcb8}
 .mapwrap .c.hit{fill:#bfe0c8} .mapwrap .c.miss{fill:#f3c9c4} .mapwrap .c.revc{fill:#f6dca6}
 .mapwrap .mk{pointer-events:none}
 .mapwrap .mk circle{stroke:#fff;vector-effect:non-scaling-stroke}
 .mapwrap .mk text{font-size:13px;font-weight:700;paint-order:stroke;stroke:#fff;stroke-width:3px;vector-effect:non-scaling-stroke}
 .zbar{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px}
 .zbar button{width:36px;height:36px;padding:0;font-size:18px;font-weight:700;background:#fff;border-color:#6b6456;color:#3a3528;box-shadow:0 1px 3px rgba(0,0,0,.2)}
 .zbar button:hover{background:#f3ecd8;color:#3a3528}
 .zhint{position:absolute;left:10px;bottom:8px;font-size:11.5px;color:var(--muted);background:rgba(255,255,255,.85);border-radius:6px;padding:3px 8px;pointer-events:none}
 .clues{list-style:none;margin:0 0 6px;padding:0;max-width:720px}
 .clues li{padding:7px 10px;margin:0 0 6px;border-left:3px solid #e1d8c2;background:#fff;font-size:14.5px;line-height:1.45}
 .clues li:last-child{border-left-color:var(--edge)}
 .clues .k{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-right:6px}
 /* drawer content */
 .hl h3{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:14px 0 6px}
 .hl ol{margin:0;padding-left:20px} .hl li{margin:0 0 10px;line-height:1.5}
 .hl li.new{animation:flash 1.2s}
 @keyframes flash{0%{background:#fff3c4}100%{background:transparent}}
 .hl .placeholder{color:#9b9387;font-style:italic}
 .hl .chips{display:flex;flex-wrap:wrap;gap:6px}
 .hl .pchip{font-size:12px;border:1px solid var(--border);border-radius:10px;padding:1px 9px;background:#fefcf7}
 .hl a{color:var(--edge);text-decoration:none}
 .hl ul{margin:0;padding-left:18px} .hl ul li{margin:3px 0}
 .hl .ref{font-size:12px;color:var(--muted);margin:0 0 6px}
 .hl figure{margin:6px 0 10px} .hl figure img{display:block;max-width:100%;border-radius:6px;border:1px solid var(--border)}
 .hl figcaption{font-size:11.5px;color:var(--muted);margin-top:4px}
 .hl .book{border-left:3px solid #e1d8c2;padding:2px 0 2px 12px;margin:6px 0 4px}
 /* summary */
 .sum{padding:22px 26px 40px;max-width:860px}
 .sum h1{font-size:22px;margin:0 0 6px;color:#3a3528}
 .sum .big{font-size:30px;font-weight:700;color:var(--accent)}
 .sum .tbl{margin:14px 0}
 .sum .sub{color:var(--muted);margin:0 0 6px} .sum .lead{color:var(--muted);max-width:640px;line-height:1.5}
 .rv{border:1px solid var(--border);border-radius:8px;background:#fff;padding:10px 14px;margin:12px 0}
 .rv .rq{margin:4px 0 8px;font-weight:600;color:#3a3528} .rv .rl{margin:0;font-size:12px;color:var(--muted)}
 .rlog{margin:2px 0 8px;padding-left:18px;font-size:13.5px} .rlog .ok{color:var(--accent)} .rlog .bad{color:var(--edge)}
 .rv .rc{margin:0;font-size:13.5px}
 #msg{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--edge);color:#fff;padding:9px 18px;border-radius:24px;font-size:14px;font-weight:600;opacity:0;transition:opacity .25s;pointer-events:none;z-index:99}
 #msg.show{opacity:1}
 @media (max-width:760px){
   .brand{display:none}
   .bar{flex-wrap:nowrap;gap:6px} .stat{padding:3px 7px;font-size:12px} .stat b{font-size:13px}
   .ms-btn{min-width:auto;padding:4px 8px;font-size:13px} .bar-menu-btn{padding:4px 9px}
   .item{padding:14px 14px 40px} .item h2.q{font-size:16.5px}
   .match{grid-template-columns:1fr 1fr;gap:8px 10px} .mcell{font-size:13px;padding:8px}
   .help-inline{display:block;margin-top:14px}
   .help-inline:empty{display:none}
   .help-inline .hl{border:1px solid #f0d878;background:#fffbe6;border-radius:8px;padding:2px 12px 4px}
   .mapwrap{aspect-ratio:auto;height:52vh}
 }
</style>
</head>

<script>
(function () {
  const root = document.documentElement;
  const bar = document.querySelector('.app-bar');
  function setTop() { if (bar) root.style.setProperty('--htop', bar.offsetHeight + 'px'); }
  window.addEventListener('resize', setTop);
  setTop();

  // ☰ navigation (only shown at ≤760px)
  const nav = document.getElementById('app-nav');
  const navBtn = document.getElementById('app-menu');
  const navOverlay = () => window.matchMedia && window.matchMedia('(max-width:760px)').matches;
  function setNav(open) {
    if (!nav) return;
    nav.classList.toggle('open', !!open);
    if (navBtn) navBtn.setAttribute('aria-expanded', String(!!open));
  }
  if (navBtn) navBtn.addEventListener('click', e => { e.stopPropagation(); setNav(!nav.classList.contains('open')); });

  // navigation filter: case- and diacritic-insensitive (š, č, ć, ž, đ)
  const filter = document.getElementById('app-filter');
  const norm = s => String(s || '').toLowerCase().replace(/đ/g, 'd').normalize('NFD').replace(/[̀-ͯ]/g, '');
  function applyFilter() {
    const q = norm(filter.value.trim());
    document.querySelectorAll('#app-nav [data-filter]').forEach(el =>
      el.classList.toggle('f-hide', !!q && !norm(el.dataset.filter).includes(q)));
    document.querySelectorAll('#app-nav [data-filter-group]').forEach(g =>
      g.classList.toggle('f-hide', !!q && !g.querySelector('[data-filter]:not(.f-hide)')));
  }
  if (filter) filter.addEventListener('input', applyFilter);

  // ⋯ menus: a button with data-menu="<id>" toggles .bar-menu#<id>; a button inside closes it
  function setMenu(m, open) {
    m.classList.toggle('open', !!open);
    const b = document.querySelector('[data-menu="' + m.id + '"]');
    if (b) b.setAttribute('aria-expanded', String(!!open));
  }
  document.querySelectorAll('[data-menu]').forEach(btn => {
    const m = document.getElementById(btn.dataset.menu);
    if (!m) return;
    btn.addEventListener('click', e => { e.stopPropagation(); setMenu(m, !m.classList.contains('open')); });
    m.addEventListener('click', e => { e.stopPropagation(); if (e.target.closest('button')) setMenu(m, false); });
  });
  document.addEventListener('click', e => {
    // composedPath: the clicked node may already be re-rendered away (e.g. a step's "next" button)
    if (!e.composedPath().some(n => n.dataset && n.dataset.keepMenus)) document.querySelectorAll('.bar-menu.open').forEach(m => setMenu(m, false));
    if (nav && nav.classList.contains('open') && navOverlay() && !nav.contains(e.target)) setNav(false);
  });
  document.addEventListener('keydown', e => {
    if (e.key !== 'Escape') return;
    document.querySelectorAll('.bar-menu.open').forEach(m => setMenu(m, false));
    const x = document.querySelector('.app-drawer.open .drawer-close');
    if (x && x.offsetParent !== null) x.click();
  });

  window.HubShell = { setNav, setMenu, applyFilter, navOverlay };
})();
</script>

.jpg"}}, {"id": "polozaj-tn-kontinentalna", "vrsta": "tacno_netacno", "tezina": "tesko", "pojmovi": ["kontinentalna-zemlja", "neum"], "tvrdnja": "Bosna i Hercegovina je potpuno kontinentalna zemlja, bez ikakvog izlaza na more.", "tacno": false, "ispravke": [{"tekst": "Većim delom je kontinentalna, ali kod Neuma izlazi na Jadransko more.", "tacan": true}, {"tekst": "Ima dugu, razuđenu obalu na Jadranskom moru.", "tacan": false}, {"tekst": "Izlazi na Crno more kod ušća Save.", "tacan": false}], "pomoc": ["Razmisli o razlici između „potpuno” i „većim delom” kontinentalne zemlje.", "Postoji jedno malo primorsko mesto u BiH.", "Iz lekcije: BiH je većim delom kontinentalna; na Jadran izlazi samo kod Neuma."], "objasnjenje": "Netačno — BiH je većim delom kontinentalna, ali ima kratak izlaz na Jadransko more kod Neuma (21 km).", "iz_udzbenika": {"strana": 24, "odeljak": "Položaj", "tekst": "BiH je većim delom kontinentalna zemlja; na Jadransko more izlazi samo kod Neuma."}}, {"id": "polozaj-dopuni-neum", "vrsta": "dopuni", "tezina": "lako", "pojmovi": ["neum", "jadransko-more"], "pitanje": "Dopuni rečenicu rečima iz banke.", "tekst": "Bosna i Hercegovina izlazi na {{Jadransko}} more samo kod grada {{Neuma|Neum}}.", "ponudjene": ["Jadransko", "Neuma", "Crno", "Mostara"], "pomoc": ["More je ono isto koje zapljuskuje obalu Hrvatske i Crne Gore.", "Mostar je na reci, a ne na moru.", "Iz lekcije: jedini izlaz na Jadransko more je kod Neuma."], "objasnjenje": "BiH izlazi na Jadransko more samo kod Neuma.", "iz_udzbenika": {"strana": 25, "odeljak": "Zadatak — dopuni rečenice", "tekst": "U zadatku se traži ime jedinog naselja BiH na obali Jadranskog mora — to je Neum."}}, {"id": "polozaj-dopuni-brojevi", "vrsta": "dopuni", "tezina": "srednje", "pojmovi": ["bosna-i-hercegovina"], "pitanje": "Dopuni rečenicu.", "tekst": "Bosna i Hercegovina ima površinu od {{51.129|51129|51 129}} km² i oko {{3,2|3.2}} miliona stanovnika, a obala joj je duga svega {{21}} km.", "ponudjene": ["51.129",  preko 51.000 km².", "Iz lekcije: BiH izlazi na Jadran samo kod Neuma, na dužini od 21 km."], "objasnjenje": "BiH ima izlaz na more, ali je on toliko kratak (21 km) da je skoro cela država u unutrašnjosti kopna.", "iz_udzbenika": {"strana": 24, "odeljak": "Položaj", "tekst": "BiH je većim delom kontinentalna zemlja — na more izlazi samo kod Neuma, obalom od 21 km."}}, {"id": "polozaj-zakljuci-split-dubrovnik", "vrsta": "zakljuci", "tezina": "tesko", "pojmovi": ["neum", "jadransko-more"], "pitanje": "Put duž obale od Splita do Dubrovnika (oba grada su u Hrvatskoj) kratko prolazi kroz BiH. Zašto?", "odgovori": [{"tekst": "Kod Neuma obala BiH prekida hrvatsku obalu na dva dela.", "tacan": true}, {"tekst": "Dubrovnik se nalazi u BiH.", "tacan": false}, {"tekst": "Put mora da obiđe Neretvu kroz Sarajevo.", "tacan": false}, {"tekst": "Hrvatska nema puteve uz more.", "tacan": false}], "pomoc": ["Korak 1: Pronađi na karti Neum — gde je u odnosu na Split i Dubrovnik?", "Korak 2: Šta se dešava sa hrvatskom obalom tamo gde BiH izlazi na more?", "Iz lekcije: Neum je jedini izlaz BiH na Jadran, između dva dela hrvatske obale."], "objasnjenje": "Kratka obala BiH kod Neuma prekida kontinuitet hrvatske obale, pa obalni put od Splita do Dubrovnika prolazi kroz BiH.", "iz_udzbenika": {"strana": 24, "odeljak": "Položaj", "tekst": "Neum leži između dva dela hrvatske obale, pa 21 km obale BiH prekida hrvatsko primorje."}}, {"id": "polozaj-klik-bih", "vrsta": "karta_klik", "tezina": "lako", "pojmovi": ["bosna-i-hercegovina"], "pitanje": "Klikni na Bosnu i Hercegovinu.", "cilj": {"drzava": "BIH"}, "pomoc": ["BiH je u sredini karte, između tri države.", "Ima oblik nalik srcu ili trouglu, a skoro je odsečena od mora.", "Klikni na državu između Hrvatske (sever i zapad), Srbije (istok) i Crne Gore (jugoistok)."], "objasnjenje": "Bosna i Hercegovina je između Hrvatske, Srbije i Crne Gore; na more izlazi samo kod Neuma.", "iz_udzbenika": {"strana": 24, "odeljak": "Položaj", "tekst": "BiH leži na zapadu Balkanskog poluostrva, okružena Hrvatskom, Srbijom i Crnom Gorom.", "slika": "06-bosna-i-hercegovina/01-zastava-i-polozaj-bih.jpg"}}, {"id": "polozaj-klik-neum", "vrsta": "karta_klik", "tezina": "srednje", "pojmovi": ["neum", "jadransko-more"], "pitanje": "Klikni na Neum — jedini izlaz BiH na more.", "cilj": {"mesto": "neum"}, "pomoc": ["Neum je na jugu BiH, na obali Jadranskog mora.", "Traži mesto gde BiH „dodiruje” more, između dva dela hrvatske obale.", "Klikni na obalu jugozapadno od Mostara, severozapadno od Dubrovnika."], "objasnjenje": "Neum je na jugu BiH, na Jadranskom moru — tu BiH ima svoja 21 km obale.", "iz_udzbenika": {"strana": 24, "odeljak": "Položaj", "tekst": "Neum je jedino primorsko mesto BiH i leži između dva dela hrvatske obale."}}, {"id": "polozaj-klik-crna-gora", "vrsta": "karta_klik", "tezina": "srednje", "pojmovi": ["bosna-i-hercegovina", "maglic", "volujak"], "pitanje": "Klikni na susednu državu sa kojom BiH deli planine Maglić i Volujak.", "cilj": {"drzava": "MNE"}, "pomoc": ["Maglić i Volujak su na jugoistoku BiH.", "Taj sused je na jugoistoku i izlazi na Jadransko more.", "Klikni na Crnu Goru."], "objasnjenje": "Maglić i Volujak leže na granici BiH i Crne Gore, na jugoistoku BiH.", "iz_udzbenika": {"strana": 24, "odeljak": "Fizičko-geografske odlike", "tekst": "Najviše planine BiH, Maglić i Volujak, nalaze se na jugoistoku, uz granicu sa Crnom Gorom."}}, {"id": "polozaj-gde-bih", "vrsta": "gde_sam", "tezina": "lako", "pojmovi": ["bosna-i-hercegovina", "neum", "sarajevo"], "pitanje": "Gde sam? Pročitaj trag i klikni državu na karti.", "cilj": {"drzava": "BIH"}, "tragovi": ["Imam tri službena jezika i dva entiteta.", "Na more izlazim samo na 21 km, kod Neuma.", "Preko mene se pružaju Dinaridi, a na istoku me od Srbije deli Drina.", "Moj glavni grad je Sarajevo."], "objasnjenje": "Bosna i Hercegovina — glavni grad Sarajevo, dva entiteta, izlaz na more samo kod Neuma.", "iz_udzbenika": {"strana": 24, "odeljak": "Položaj", "tekst": an": true}, {"tekst": "Una", "tacan": true}, {"tekst": "Morava", "tacan": false}, {"tekst": "Tisa", "tacan": false}], "pomoc": ["Jedna od ovih reka dala je ime državi, ali nije ponuđena.", "Morava i Tisa teku kroz Srbiju, ne kroz BiH.", "Iz lekcije: najduže reke su Sava, Drina, Una, Vrbas, Bosna i Neretva."], "objasnjenje": "Najduže reke BiH su Sava, Drina, Una, Vrbas, Bosna i Neretva. Morava i Tisa su reke Srbije.", "iz_udzbenika": {"strana": 24, "odeljak": "Fizičko-geografske odlike", "tekst": "Najduže reke BiH su Sava, Drina, Una, Vrbas, Bosna i Neretva.", "slika": "06-bosna-i-hercegovina/02-karta-entiteta-bih.jpg"}}, {"id": "reljef-tn-dinaridi", "vrsta": "tacno_netacno", "tezina": "lako", "pojmovi": ["dinarske-planine"], "tvrdnja": "Preko teritorije Bosne i Hercegovine pružaju se Dinarske planine (Dinaridi).", "tacno": true, "pomoc": ["Planinski sistem se pruža uz Jadransko more, kroz Hrvatsku, BiH i Crnu Goru.", "BiH je pretežno planinska upravo zbog tog sistema.", "Iz lekcije: preko cele BiH pružaju se Dinaridi."], "objasnjenje": "Tačno — Dinaridi prekrivaju gotovo celu BiH, pa je reljef izrazito planinski.", "iz_udzbenika": {"strana": 24, "odeljak": "Fizičko-geografske odlike", "tekst": "Dinarske planine se pružaju preko cele teritorije BiH."}}, {"id": "reljef-tn-jahorina", "vrsta": "tacno_netacno", "tezina": "srednje", "pojmovi": ["jahorina", "maglic", "volujak"], "tvrdnja": "Jahorina je najviša planina Bosne i Hercegovine.", "tacno": false, "ispravke": [{"tekst": "Jahorina je turistički najpoznatija planina; najviše su Maglić i Volujak.", "tacan": true}, {"tekst": "Jahorina je najniža planina BiH.", "tacan": false}, {"tekst": "Jahorina je planina u Srbiji.", "tacan": false}], "pomoc": ["Po čemu je Jahorina poznata — po visini ili po skijanju?", "Najviše planine su uz granicu sa Crnom Gorom.", "Iz lekcije: najviše planine su Maglić i Volujak, a turistički najpoznatija je Jahorina."], "objasnjenje": "Netačno — Jahorina je turistički najpoznatija planina BiH (kod Sarajeva), a najviše su Maglić i Volujak.", "iz_udzbenika": {"strana": 24, "odeljak": "Fizičko-geografske odlike", "tekst": "Najviše planine BiH su Maglić i Volujak, a po turizmu je najpoznatija Jahorina."}}, {"id": "reljef-dopuni-dinaridi", "vrsta": "dopuni", "tezina": "lako", "pojmovi": ["dinarske-planine"], "pitanje": "Dopuni rečenicu rečima iz banke.", "tekst": "Reljef BiH je planinski jer se preko nje pružaju {{Dinaridi|Dinarske planine}}, a nizije postoje samo uz {{reke|rečne tokove}}.", "ponudjene": ["Dinaridi", "reke", "Alpi", "more"], "pomoc": ["Planine BiH nose isto ime kao planine u Crnoj Gori i Hrvatskoj.", "Alpi su severnije, u Sloveniji; nizije su tamo gde teče voda.", "Iz lekcije: preko BiH se pružaju Dinaridi; nizije su samo uz reke."], "objasnjenje": "Dinaridi prekrivaju BiH, a nizije su samo uz reke.", "iz_udzbenika": {"strana": 24, "odeljak": "Fizičko-geografske odlike", "tekst": "Reljef BiH je planinski zbog Dinarida; ravnog zemljišta ima samo uz reke."}}, {"id": "reljef-dopuni-planine", "vrsta": "dopuni", "tezina": "srednje", "pojmovi": ["maglic", "volujak", "jahorina"], "pitanje": "Dopuni rečenicu rečima iz banke.", "tekst": "Najviše planine BiH su {{Maglić}} i {{Volujak}}, a turistički najpoznatija planina je {{Jahorina}}.", "ponudjene": ["Maglić", "Volujak", "Jahorina", "Kopaonik", "Durmitor"], "pomoc": ["Kopaonik je u Srbiji, a Durmitor u Crnoj Gori.", "Turistička planina je kod Sarajeva; dve najviše su uz granicu sa Crnom Gorom.", "Iz lekcije: najviše su Maglić i Volujak; najpoznatija turistička je Jahorina."], "objasnjenje": "Maglić i Volujak su najviše planine BiH, a Jahorina je najpoznatija po turizmu.", "iz_udzbenika": {"strana": 25, "odeljak": "Zadatak — dopuni rečenice", "tekst": "Jedna od rečenica u zadatku traži planinu poznatu po turizmu — to je Jahorina. Najviše planine su Maglić i Volujak."}}, {"id": "reljef-povezi-uloga-reka", "vrsta": "povezi", "tezina": "srednje", "pojmovi": ["sava", "drina", "una", "neretva", "bosna-reka"], "pitanje": "Poveži reku sa njenim opisom.", "parovi": [["Sava", "granica prema Hrvatskoj na severu"], ["Drina", "granica prema Srbiji na istoku"], ["Una", "delom granica prema Hrvatskoj na severozapadu"], ["Neretva", "teče kroz Hercegovinu ka Jadranskom moru"], ["Bosna", "teče kroz središnji deo zemlje, kroz Zenicu i Doboj"]], "pomoc": ["Tri reke su granične, a dve teku kroz unutrašnjost.", "Reka koja ide ka moru je na jugu; reka po kojoj je država dobila ime je u sredini.", "Iz lekcije: Sava i Una — granica s Hrvatskom, Drina — sa Srbijom; Neretva teče ka Jadranu, Bosna kroz središnju BiH."], "objasnjenje": "Sava (sever) i Una (severozapad) su granica s Hrvatskom, Drina sa Srbijom; Neretva teče kroz Mostar ka Jadranu, a Bosna kroz Zenicu i Doboj ka Savi.", "iz_udzbenika": {"strana": 24, "odeljak": "Fizičko-geografske odlike", "tekst": "Sava, Drina i Una delom čine granice BiH, dok Bosna i Vrbas teku kroz unutrašnjost ka Savi, a Neretva ka Jadranu.", "slika": "06-bosna-i-hercegovina/02-karta-entiteta-bih.jpg"}}, {"id": "reljef-povezi-reka-grad", "vrsta": "povezi", "tezina": "tesko", "pojmovi": ["vrbas", "bosna-reka", "una", "drina", "neretva", "banja-luka", "doboj", "bihac", "zvornik", "mostar"], "pitanje": "Poveži reku sa gradom koji leži na njoj.", "parovi": [["Vrbas", "Banja Luka"], ["Bosna", "Doboj"], ["Una", "Bihać"], ["Drina", "Zvornik"], ["Neretva", "Mostar"]], "pomoc": ["Kreni od poznatog para — Mostar i reka sa fotografije u udžbeniku.", "Bihać je na krajnjem severozapadu, a Zvornik na istoku uz granicu sa Srbijom.", "Iz lekcije: Banja Luka — Vrbas, Doboj — Bosna, Bihać — Una, Zvornik — Drina, Mostar — Neretva."], "objasnjenje": "Banja Luka je na Vrbasu, Doboj na Bosni, Bihać na Uni, Zvornik na Drini, a Mostar na Neretvi.", "iz_udzbenika": {"strana": 24, "odeljak": "Zadatak — karta entiteta", "tekst": "Na karti BiH ucrtani su gradovi i reke, pa se vidi da većina većih gradova leži uz reke.", "slika": "06-bosna-i-hercegovina/02-karta-entiteta-bih.jpg"}}, {"id": "reljef-zakljuci-nizije", "vrsta": "zakljuci", "tezina": "lako", "pojmovi": ["dinarske-planine", "poljoprivreda"], "pitanje": "Zašto su nizije u BiH gusto naseljene, iako zauzimaju mali deo zemlje?", "odgovori": [{"tekst": "Jer je ostatak zemlje planinski, a samo uz reke ima ravnog i plodnog zemljišta.", "tacan": true}, {"tekst": "Jer je u nizijama hladnije nego u planinama.", "tacan": false}, {"tekst": "Jer su nizije na obali mora.", "tacan": false}, {"tekst": "Jer u planinama nema vode.", "tacan": false}], "pomoc": ["Korak 1: Kakav je reljef najvećeg dela BiH?", "Korak 2: Gde je lakše obrađivati zemlju, graditi puteve i gradove?", "Iz lekcije: nizije su samo uz reke; gusto su naseljene i tu je poljoprivreda."], "objasnjenje": "Većina BiH je pod Dinaridima, pa se ljudi, gradovi i poljoprivreda skupljaju u retkim ravnim dolinama uz reke.", "iz_udzbenika": {"strana": 24, "odeljak": "Fizičko-geografske odlike", "tekst": "Ravno zemljište postoji samo uz rečne tokove; tu su naselja gusta i razvijena je poljoprivreda."}}, {"id": "reljef-zakljuci-granice", "vrsta": "zakljuci", "tezina": "srednje", "pojmovi": ["sava", "drina", "una"], "pitanje": "Koje reke čine prirodnu granicu BiH prema susednim državama?", "odgovori": [{"tekst": "Sava, Drina i Una", "tacan": true}, {"tekst": "Vrbas, Bosna i Neretva", "tacan": false}, {"tekst": "Neretva, Drina i Bosna", "tacan": false}, {"tekst": "Sava, Vrbas i Una", "tacan": false}], "pomoc": ["Korak 1: Pogledaj kartu — koje reke teku uz ivicu BiH, a koje kroz njenu sredinu?", "Korak 2: Granica na severu, na istoku i na severozapadu.", "Iz lekcije: Sava — prema Hrvatskoj, Drina — prema Srbiji, Una — delom prema Hrvatskoj."], "objasnjenje": "Sava (sever) i Una (severozapad) su granica prema Hrvatskoj, a Drina (istok) prema Srbiji. Vrbas, Bosna i Neretva teku kroz unutrašnjost.", "iz_udzbenika": {"strana": 24, "odeljak": "Fizičko-geografske odlike", "tekst": "Prirodnu granicu BiH čine Sava i Una prema Hrvatskoj i Drina prema Srbiji.", "slika": "06-bosna-i-hercegovina/02-karta-entiteta-bih.jpg"}}, {"id": "reljef-klik-sava", "vrsta": "karta_klik", "tezina": "lako", "pojmovi": ["sava"], "pitanje": "Klikni na reku Savu — granicu BiH prema Hrvatskoj na severu.", "cilj": {"mesto": "sava"}, "pomoc": ["Sava teče duž cele severne ivice BiH.", "Traži severnu granicu BiH, između BiH i Hrvatske.", "Klikni na severnu granicu BiH, severno od Banje Luke i Doboja."], "objasnjenje": "Sava teče duž severne granice BiH, prema Hrvatskoj.", "iz_udzbenika": {"strana": 24, "odeljak": "Fizičko-geografske odlike", "tekst": "Sava je najduža reka koja čini severnu granicu BiH prema Hrvatskoj."}}, {"id": "reljef-klik-drina", "vrsta": "karta_klik", "tezina": "srednje", "pojmovi": ["drina", "srbija"], "pitanje": "Klikni na reku Drinu — granicu BiH prema Srbiji.", "cilj": {"mesto": "drina"}, "pomoc": ["Drina je na istoku BiH.", "Prati istočnu granicu BiH prema Srbiji, između Višegrada i Zvornika.", "Klikni na istočnu granicu BiH, istočno od Sarajeva i Tuzle."], "objasnjenje": "Drina teče duž istočne granice BiH prema Srbiji, kroz Višegrad i Zvornik.", "iz_udzbenika": {"strana": 24, "odeljak": "Fizičko-geografske odlike", "tekst": "Drina čini istočnu granicu BiH prema Srbiji."}}, {"id": "reljef-klik-bosna", "vrsta": "karta_klik", "tezina": "srednje", "pojmovi": ["bosna-reka", "zenica", "doboj"], "pitanje": "Klikni na reku Bosnu, po kojoj je država dobila ime.", "cilj": {"mesto": "bosna-reka"}, "pomoc": ["Reka Bosna teče kroz središnji deo zemlje, ka severu.", "Na njoj su Zenica i Doboj.", "Klikni u sredinu BiH, između Zenice i Doboja."], "objasnjenje": "Reka Bosna teče kroz središnju BiH, kroz Zenicu i Doboj, i uliva se u Savu.", "iz_udzbenika": {"strana": 24, "odeljak": "Fizičko-geografske odlike", "tekst": "Bosna je jedna od najdužih reka; teče kroz središnji deo zemlje ka Savi."}}, {"id": "reljef-klik-una", "vrsta": "karta_klik", "tezina": "tesko", "pojmovi": ["una", "bihac"], "pitanje": "Klikni na reku Unu.", "cilj": {"mesto": "una"}, "pomoc": ["Una je na krajnjem severozapadu BiH.", "Delom čini granicu prema Hrvatskoj; na njoj je Bihać.", "Klikni na severozapadnu granicu BiH, severno od Bihaća."], "objasnjenje": "Una teče na severozapadu BiH, kroz Bihać, i delom čini granicu prema Hrvatskoj.", "iz_udzbenika": {"strana": 24, "odeljak": "Fizičko-geografske odlike", "tekst": "Una delom čini granicu BiH prema Hrvatskoj na severozapadu."}}, {"id": "reljef-klik-maglic", "vrsta": "karta_klik", "tezina": "tesko", "pojmovi": ["maglic"], "pitanje": "Klikni na planinu Maglić.", "cilj": {"mesto": "maglic"}, "pomoc": ["Maglić je na jugoistoku BiH.", "Leži na samoj granici sa Crnom Gorom.", "Klikni na granicu sa Crnom Gorom, jugoistočno od Sarajeva."], "objasnjenje": "Maglić je na jugoistoku BiH, na granici sa Crnom Gorom — tu su najviši vrhovi zemlje.", "iz_udzbenika": {"strana": 24, "odeljak": "Fizičko-geografske odlike", "tekst": "Maglić, uz Volujak najviša planina BiH, nalazi se na jugoistoku, na granici sa Crnom Gorom."}}, {"id": "reljef-gde-neretva", "vrsta": "gde_sam", "tezina": "srednje", "pojmovi": ["neretva", "mostar", "izmenjenosredozemna-klima"], "pitanje": "Gde sam? Pročitaj trag i klikni mesto na karti.", "cilj": {"mesto": "neretva"}, "tragovi": ["Kroz moju dolinu u unutrašnjost prodire topao uticaj mora.", "U mojoj dolini uspevaju vinova loza, duvan i agrumi.", "Ja sam reka koja teče kroz Hercegovinu ka Jadranu.", "Preko mene je Stari most u Mostaru."], "objasnjenje": "Neretva — teče kroz Mostar ka Jadranu; u njenoj dolini je izmenjenosredozemna klima.", "iz_udzbenika": {"strana": 25, "odeljak": "Privreda", "tekst": "Dolinom Neretve sredozemni uticaj prodire u unutrašnjost, pa tu uspevaju vinova loza, duvan i agrumi.", "slika": "06-bosna-i-hercegovina/03-mostar.jpg"}}, {"id": "reljef-gde-volujak", "vrsta": "gde_sam", "tezina": "tesko", "pojmovi": ["volujak", "maglic", "dinarske-planine"], "pitanje": "Gde sam? Pročitaj trag i klikni mesto na karti.", "cilj": {"mesto": "volujak"}, umom utvrđeno da se BiH sastoji od dva entiteta."}}, {"id": "drustvo-izbor-narodi", "vrsta": "izbor", "tezina": "srednje", "pojmovi": ["bosnjaci", "srbi", "hrvati", "gradjanski-rat"], "pitanje": "Koji narodi su učestvovali u građanskom ratu u BiH (1992–1995)? (Više tačnih.)", "odgovori": [{"tekst": "Bošnjaci", "tacan": true}, {"tekst": "Srbi", "tacan": true}, {"tekst": "Hrvati", "tacan": true}, {"tekst": "Slovenci", "tacan": false}, {"tekst": "Albanci", "tacan": false}], "pomoc": ["To su tri naroda koja žive u BiH.", "Njihovi jezici su službeni jezici BiH.", "Iz lekcije: u ratu su učestvovali Bošnjaci, Srbi i Hrvati."], "objasnjenje": "U građanskom ratu učestvovali su Bošnjaci, Srbi i Hrvati — tri naroda BiH.", "iz_udzbenika": {"strana": 24, "odeljak": "Društveno-geografske odlike", "tekst": "Posle izlaska iz SFRJ vođen je građanski rat u kome su učestvovali Bošnjaci, Srbi i Hrvati."}}, {"id": "drustvo-tn-entiteti", "vrsta": "tacno_netacno", "tezina": "lako", "pojmovi": ["entitet", "federacija-bih", "republika-srpska"], "tvrdnja": "Prema Dejtonskom sporazumu, BiH se sastoji od dva entiteta — Federacije BiH i Republike Srpske.", "tacno": true, "pomoc": ["Entitet je veća unutrašnja celina države.", "Na karti udžbenika entiteti su obojeni zeleno i narandžasto.", "Iz lekcije: BiH čine dva entiteta, Federacija BiH i Republika Srpska."], "objasnjenje": "Tačno — BiH čine Federacija BiH i Republika Srpska, a postoji i Brčko distrikt.", "iz_udzbenika": {"strana": 24, "odeljak": "Društveno-geografske odlike", "tekst": "Dejtonskim sporazumom BiH je podeljena na dve celine — Federaciju BiH i Republiku Srpsku.", "slika": "06-bosna-i-hercegovina/02-karta-entiteta-bih.jpg"}}, {"id": "drustvo-tn-fbih-udeo", "vrsta": "tacno_netacno", "tezina": "srednje", "pojmovi": ["federacija-bih"], "tvrdnja": "Federacija BiH zauzima 49% teritorije Bosne i Hercegovine.", "tacno": false, "ispravke": [{"tekst": "Federacija BiH zauzima 51% teritorije.", "tacan": true}, {"tekst": "Federacija BiH zauzima 75% teritorije.", "tacan": false}, {"tekst": "Federacija BiH zauzima tačno polovinu teritorije.", "tacan": false}], "pomoc": ["Brojevi dva entiteta su zamenjeni.", "Federacija je malo veća od Republike Srpske.", "Iz lekcije: Federacija BiH 51%, Republika Srpska 49%."], "objasnjenje": "Netačno — Federacija BiH zauzima 51%, a Republika Srpska 49% teritorije.", "iz_udzbenika": {"strana": 24, "odeljak": "Društveno-geografske odlike", "tekst": "Federacija BiH zauzima 51% teritorije i pretežno je naseljavaju Bošnjaci."}}, {"id": "drustvo-tn-brcko", "vrsta": "tacno_netacno", "tezina": "srednje", "pojmovi": ["brcko-distrikt"], "tvrdnja": "Brčko distrikt pripada samo Republici Srpskoj.", "tacno": false, "ispravke": [{"tekst": "Brčkom distriktu zajednički upravljaju oba entiteta.", "tacan": true}, {"tekst": "Brčko distrikt pripada samo Federaciji BiH.", "tacan": false}, {"tekst": "Brčko distrikt pripada Hrvatskoj.", "tacan": false}], "pomoc": ["Brčko distrikt je posebna oblast — nije deo samo jednog entiteta.", "Ključna reč je „zajednička” uprava.", "Iz lekcije: Brčko distrikt je pod zajedničkom upravom oba entiteta."], "objasnjenje": "Netačno — Brčko distrikt je teritorija kojom zajednički upravljaju oba entiteta.", "iz_udzbenika": {"strana": 24, "odeljak": "Društveno-geografske odlike", "tekst": "Brčko distrikt je područje pod zajedničkom upravom Federacije BiH i Republike Srpske.", "slika": "06-bosna-i-hercegovina/02-karta-entiteta-bih.jpg"}}, {"id": "drustvo-tn-homogena", "vrsta": "tacno_netacno", "tezina": "tesko", "pojmovi": ["bosnjaci", "srbi", "hrvati", "islam", "pravoslavlje"], "tvrdnja": "Bosna i Hercegovina je etnički i religijski homogena zemlja.", "tacno": false, "ispravke": [{"tekst": "BiH je heterogena — u njoj žive tri naroda različitih vera.", "tacan": true}, {"tekst": "BiH je homogena — svi stanovnici su iste vere, a razlikuju se samo po jeziku.", "tacan": false}, {"tekst": "BiH je homogena — u njoj živi samo jedan narod.", "tacan": false}], "pomoc": ["„H , a u Republici Srpskoj Srbi (pravoslavni).", "iz_udzbenika": {"strana": 24, "odeljak": "Društveno-geografske odlike", "tekst": "Federaciju BiH pretežno naseljavaju Bošnjaci islamske vere, a Republiku Srpsku Srbi pravoslavne vere."}}, {"id": "drustvo-povezi-vere", "vrsta": "povezi", "tezina": "lako", "pojmovi": ["bosnjaci", "srbi", "hrvati", "islam", "pravoslavlje"], "pitanje": "Poveži narod BiH sa verom kojoj pretežno pripada.", "parovi": [["Bošnjaci", "islam"], ["Srbi", "pravoslavlje"], ["Hrvati", "katoličanstvo"]], "pomoc": ["Na fotografiji Baščaršije vidi se džamija.", "Srbi u Srbiji i BiH su iste vere.", "Iz lekcije: Bošnjaci — islam, Srbi — pravoslavlje, Hrvati — katoličanstvo."], "objasnjenje": "Bošnjaci su muslimani, Srbi pravoslavni, a Hrvati katolici.", "iz_udzbenika": {"strana": 24, "odeljak": "Društveno-geografske odlike", "tekst": "BiH je heterogena zemlja — Bošnjaci su islamske, Srbi pravoslavne, a Hrvati katoličke vere."}}, {"id": "drustvo-zakljuci-jezici", "vrsta": "zakljuci", "tezina": "lako", "pojmovi": ["bosnjaci", "srbi", "hrvati"], "pitanje": "Zašto BiH ima čak tri službena jezika?", "odgovori": [{"tekst": "Jer je naseljavaju tri naroda, pa je jezik svakog od njih službeni.", "tacan": true}, {"tekst": "Jer se graniči sa tri države.", "tacan": false}, {"tekst": "Jer ima tri glavna grada.", "tacan": false}, {"tekst": "Jer je nekad bila deo tri različite države.", "tacan": false}], "pomoc": ["Korak 1: Koliko naroda živi u BiH?", "Korak 2: Kako se zovu jezici — po čemu su dobili ime?", "Iz lekcije: službeni jezici su bosanski, srpski i hrvatski; narodi su Bošnjaci, Srbi i Hrvati."], "objasnjenje": "U BiH žive tri naroda — Bošnjaci, Srbi i Hrvati — pa su bosanski, srpski i hrvatski svi službeni.", "iz_udzbenika": {"strana": 24, "odeljak": "Opšti podaci", "tekst": "BiH ima tri službena jezika, po jedan za svaki od tri naroda koji je naseljavaju."}}, {"id": "drustvo-zakljuci-dzamija", "vrsta": "zakljuci", "tezina": "srednje", "pojmovi": ["bascarsija", omoc": ["BiH ima šume, planine, reke i plodne doline.", "Obala je kratka, pa pomorstvo ne može biti osnova.", "Iz lekcije: razvoj se zasniva na prirodnim bogatstvima."], "objasnjenje": "Privreda BiH oslanja se na prirodna bogatstva — plodne doline, šume, pašnjake i reke.", "iz_udzbenika": {"strana": 25, "odeljak": "Privreda", "tekst": "Privredni razvoj BiH zasniva se na njenim prirodnim bogatstvima."}}, {"id": "privreda-izbor-neretva-kulture", "vrsta": "izbor", "tezina": "srednje", "pojmovi": ["vinova-loza", "duvan", "agrumi", "neretva"], "pitanje": "Šta uspeva u dolini Neretve zbog uticaja sredozemne klime? (Više tačnih.)", "odgovori": [{"tekst": "vinova loza", "tacan": true}, {"tekst": "duvan", "tacan": true}, {"tekst": "agrumi", "tacan": true}, {"tekst": "kafa", "tacan": false}, {"tekst": "banane", "tacan": false}], "pomoc": ["Traži biljke koje vole toplo, ali ne tropsko podneblje.", "Kafa i banane traže tropsku klimu.", "Iz lekcije: u dolini Neretve uspevaju vinova loza, duvan i agrumi."], "objasnjenje": "U dolini Neretve uspevaju vinova loza, duvan i agrumi, jer tuda prodire sredozemni uticaj.", "iz_udzbenika": {"strana": 25, "odeljak": "Privreda", "tekst": "Sredozemna klima prodire dolinom Neretve, pa se tu gaje vinova loza, duvan i agrumi."}}, {"id": "privreda-izbor-doline", "vrsta": "izbor", "tezina": "tesko", "pojmovi": ["poljoprivreda", "sava", "neretva"], "pitanje": "U dolinama kojih reka je poljoprivreda najrazvijenija?", "odgovori": [{"tekst": "Save i Neretve", "tacan": true}, {"tekst": "Drine i Une", "tacan": false}, {"tekst": "Vrbasa i Bosne", "tacan": false}, {"tekst": "samo Save", "tacan": false}], "pomoc": ["Jedna reka je na severu, druga na jugu zemlje.", "Južna reka donosi sredozemni uticaj, a severna je široka granična reka.", "Iz lekcije: poljoprivreda je razvijena u dolinama Save i Neretve."], "objasnjenje": "Poljoprivreda je najrazvijenija u dolinama Save (sever) i Neretve (jug).", "iz_udzbenika": {"strana": 25, "odeljak": "Privreda", "tekst" const VRSTA_LBL = {izbor:'Izbor', tacno_netacno:'Tačno / netačno', dopuni:'Dopuni', povezi:'Poveži', zakljuci:'Zaključi', karta_klik:'Na karti', gde_sam:'Gde sam?'};
const UPUTSTVO = {

  zakljuci: 'Razmisli i izaberi najbolje objašnjenje. Posle greške pomoć vodi korak po korak kroz rasuđivanje.',
  tacno_netacno: 'Odluči da li je tvrdnja tačna. Ako je netačna, izaberi kako glasi tačno.',
  dopuni: 'Popuni praznine — klikni prazninu pa reč ispod (ili upiši), pa Proveri.',
  povezi: 'Klikni pojam levo, pa njegov par desno.',

};
const HELP_LBL = ['Usmeri', 'Suzi', 'Iz lekcije', 'Još'];
const TEZ = ['lako', 'srednje', 'tesko'], TEZ_LBL = { lako: 'lako', srednje: 'srednje', tesko: 'teško' }, TEZ_KR = { lako: 'L', srednje: 'S', tesko: 'T' };
const tzBadge = z => '<span class="tz tz-' + z.tezina + '" title="' + TEZ_LBL[z.tezina] + '">' + TEZ_KR[z.tezina] + '</span>';
const ITEMS = SPEC.delovi.flatMap((d, di) => d.zadaci.map(z => Object.assign({ deo: di }, z)));

const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
const norm = s => String(s || '').toLowerCase().replace(/đ/g, 'dj').normalize('NFD').replace(/[̀-ͯ]/g, '')
  .replace(/[„”“"'%]/g, '').replace(/,/g, '.').replace(/\s+/g, ' ').trim();
function seeded(str) { let h = 2166136261; for (const c of str) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return () => ((h = Math.imul(h ^ (h >>> 15), 2246822507) ^ Math.imul(h ^ (h >>> 13), 3266489909)) >>> 0) / 4294967296; }

let msgT = null;
function toast(t, ok) { const m = document.getElementById('msg'); m.textContent = t; m.style.background = ok ? '#1f7a3a' : '#b1271f'; m.classList.add('show'); clearTimeout(msgT); msgT = setTimeout(() => m.classList.remove('show'), 1300); }

// ---------- state ----------
// Učenje: one drawn session at a time (state.ucenje: items, sections, answers). Test: every attempt is
// recorded in state.tests with its own drawn items, the pupil's answers per item (log) and points; its
// Ispravka lives in the same record. Both are drawn by drawSession() from the bank (ITEMS + generated).
function blankState() { return { v: STATE_VERSION, mode: 'ucenje', cur: '_sum', ucenje: null, tests: [], active: null, ime: '' }; }
function loadState() { try { const o = JSON.parse(localStorage.getItem(STATE_KEY)); return o && o.v === STATE_VERSION ? o : null; } catch (e) { return null; } }
let state = loadState() || blankState();
function save() { try { localStorage.setItem(STATE_KEY, JSON.stringify(state)); } catch (e) {} }
const att = () => state.tests.find(t => t.id === state.active) || null;
const helpOn = () => state.mode === 'ucenje' || (att() && att().phase === 'ispravka');
function curItems() { if (state.mode === 'ucenje') return state.ucenje.items; const a = att(); return a ? a.items : []; }
function byId(id) { return curItems().find(z => z.id === id) || null; }
function bucket() { if (state.mode === 'ucenje') return state.ucenje.b; const a = att(); return a.phase === 'ispravka' ? a.fix : a.b; }
function st(id) { const b = bucket(); return b[id] || (b[id] = { miss: 0, status: 'open', pts: null, ui: {}, log: [] }); }
function listIds() {   // the items of the current mode / test phase
  const items = curItems().map(z => z.id);
  const a = state.mode === 'test' && att();
  if (!a || a.phase !== 'ispravka') return items;
  return items.filter(id => { const t = a.b[id]; return t && t.pts < 3; });
}
function sections() { const a = state.mode === 'ucenje' ? state.ucenje : att(); return a ? a.sections : []; }
const deoNaslov = z => z.deoNaslov || SPEC.delovi[z.deo].naslov;
const numOf = z => curItems().findIndex(x => x.id === z.id) + 1;
const isDone = s => s.status !== 'open';
function steps(z) { return z.vrsta === 'gde_sam' ? z.tragovi.length - 1 : (z.pomoc || []).length; }   // help steps before the reveal
const ptsFor = miss => miss === 0 ? 3 : miss === 1 ? 2 : 1;
function registerPlaces(items) { for (const z of items) if (z.cilj && z.cilj._mesto) MAPI.mesta[z.cilj.mesto] = z.cilj._mesto; }
state.tests.forEach(t => registerPlaces(t.items));
if (state.ucenje) registerPlaces(state.ucenje.items);

// ---------- a new test: authored items drawn per section + items generated from SPEC.baza ----------
const LOK = { Pirinejsko: 'Pirinejskom', Apeninsko: 'Apeninskom', Balkansko: 'Balkanskom' };
const polFraza = d => d.poluostrvo ? 'Leži na ' + LOK[d.poluostrvo] + ' poluostrvu.' : 'Ne leži ni na jednom od tri poluostrva.';
function pickN(arr, n, r) { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a.slice(0, n); }
function generate(kind, k, r, used) {
  const B = (SPEC.baza || {}).drzave || [], book = (SPEC.sastav || {}).iz_udzbenika || null;
  const free = B.filter(d => !used.has(d.iso));
  const big = free.filter(d => !d.mini);
  const take = list => { const d = pickN(list, 1, r)[0]; if (d) used.add(d.iso); return d; };
  const base = { generisan: true, pojmovi: [], iz_udzbenika: book };
  const up = t => TEZ[Math.min(2, TEZ.indexOf(t) + 1)];   // one level harder (capped)
  const hardest = ds => TEZ[Math.max(...ds.map(d => TEZ.indexOf(d.tezina)))];
  if (kind === 'glavni_gradovi') {
    const ds = pickN(big.filter(d => d.grad !== d.naziv), 4, r); ds.forEach(d => used.add(d.iso));
    if (ds.length < 3) return null;
    return Object.assign({}, base, { id: 'g-gradovi-' + k, vrsta: 'povezi', tezina: hardest(ds), pitanje: 'Poveži državu sa njenim glavnim gradom.',
      parovi: ds.map(d => [d.naziv, d.grad]),
      pomoc: ['Kreni od države koju najbolje znaš, pa isključuj.', 'Poluostrva: ' + ds.map(d => d.naziv + ' — ' + (d.poluostrvo || 'van poluostrva')).join(', ') + '.', 'Iz lekcije: tabela 17 država i njihovih glavnih gradova (str. 17).'],
      objasnjenje: ds.map(d => d.naziv + ' — ' + d.grad).join(', ') + '.' });
  }
  if (kind === 'karta_drzava') {
    const d = take(big); if (!d) return null;
    return Object.assign({}, base, { id: 'g-karta-' + d.iso, vrsta: 'karta_klik', tezina: d.tezina, pitanje: 'Klikni na državu: ' + d.naziv + '.', cilj: { drzava: d.iso },
      pomoc: [polFraza(d), 'Ova država ' + d.more + '.', 'Glavni grad joj je ' + d.grad + '.'],
      objasnjenje: d.naziv + ': ' + polFraza(d).toLowerCase().replace(/\.$/, '') + '; ' + d.more + '; glavni grad ' + d.grad + '.' });
  }
  if (kind === 'poluostrvo') {
    const d = take(free); if (!d) return null;
    const opts = ['Pirinejsko', 'Apeninsko', 'Balkansko'].map(p => ({ tekst: p + ' poluostrvo', tacan: d.poluostrvo === p }))
      .concat([{ tekst: 'Ni na jednom od tri poluostrva', tacan: !d.poluostrvo }]);
    return Object.assign({}, base, { id: 'g-pol-' + d.iso, vrsta: 'izbor', tezina: d.tezina, pitanje: 'Na kom poluostrvu se nalazi ' + d.naziv + '?', odgovori: opts,
      pomoc: ['Glavni grad joj je ' + d.grad + '.', 'Ova država ' + d.more + '.'], objasnjenje: d.naziv + ' — ' + polFraza(d).toLowerCase() });
  }
  if (kind === 'gde_glavni_grad') {
    const d = take(big); if (!d) return null;
    const slug = 'g-grad-' + d.iso, def = { naziv: d.grad, lat: d.lat, lon: d.lon, radius_km: 90 };
    return Object.assign({}, base, { id: 'g-grad-' + d.iso, vrsta: 'gde_sam', tezina: up(d.tezina), pitanje: 'Gde sam? Pročitaj trag i klikni glavni grad na karti.',
      cilj: { mesto: slug, _mesto: def },
      tragovi: ['Ja sam glavni grad države koja ' + d.more + '.', 'Moja država ' + (d.poluostrvo ? 'leži na ' + LOK[d.poluostrvo] + ' poluostrvu.' : 'ne leži ni na jednom od tri poluostrva.'), 'Ja sam glavni grad države ' + d.naziv + '.'],
      objasnjenje: d.grad + ', glavni grad države ' + d.naziv + '.' });
  }
  return null;
}
// A session (Učenje) or an attempt (Test): n items from the bank in the ratio sastav.odnos, spread over
// sections and item types (round-robin), ordered by section and, inside a section, by difficulty.
function drawSession(n, seed) {
  const r = seeded(String(seed)), S = SPEC.sastav || {}, used = new Set();
  const bank = ITEMS.map(z => JSON.parse(JSON.stringify(z)));
  const gdeo = { deoNaslov: 'Iz baze: države', deo: SPEC.delovi.length };
  Object.entries(S.generisano || {}).forEach(([kind, cnt]) => { for (let k = 0; k < cnt; k++) { const z = generate(kind, k, r, used); if (z) bank.push(Object.assign(z, gdeo)); } });
  n = Math.min(n, bank.length);
  const odnos = S.odnos || [40, 40, 20];
  const want = { lako: Math.round(n * odnos[0] / 100), tesko: Math.round(n * odnos[2] / 100) };
  want.srednje = n - want.lako - want.tesko;
  const rr = (list, key) => {   // shuffle, group by key, then take one from each group in turn
    const groups = {};
    for (const z of pickN(list, list.length, r)) (groups[key(z)] = groups[key(z)] || []).push(z);
    const keys = pickN(Object.keys(groups), Object.keys(groups).length, r), out = [];
    while (out.length < list.length) for (const k of keys) if (groups[k].length) out.push(groups[k].shift());
    return out;
  };
  // Per level, take items one at a time from the section that is furthest below its share of the
  // whole bank (shares count across all levels, with a little randomness so draws differ); inside a
  // section the items alternate by type (rr). A level that runs short is filled from the others.
  const size = {}, taken = {};
  for (const z of bank) size[z.deo] = (size[z.deo] || 0) + 1;
  const pools = Object.fromEntries(TEZ.map(t => {
    const bySec = {};
    for (const z of bank.filter(x => x.tezina === t)) (bySec[z.deo] = bySec[z.deo] || []).push(z);
    return [t, Object.fromEntries(Object.entries(bySec).map(([d, zs]) => [d, rr(zs, x => x.vrsta)]))];
  }));
  const takeOne = t => {
    const ks = Object.keys(pools[t]).filter(k => pools[t][k].length);
    if (!ks.length) return null;
    const k = ks.reduce((a, x) => ((taken[x] || 0) + r()) / size[x] < ((taken[a] || 0) + r()) / size[a] ? x : a);
    taken[k] = (taken[k] || 0) + 1;
    return pools[t][k].shift();
  };
  const picked = [];
  for (const t of TEZ) for (let i = 0; i < want[t]; i++) { const z = takeOne(t); if (z) picked.push(z); }
  for (const t of ['srednje', 'lako', 'tesko']) { let z; while (picked.length < n && (z = takeOne(t))) picked.push(z); }   // a level ran short
  picked.sort((a, b) => a.deo - b.deo || TEZ.indexOf(a.tezina) - TEZ.indexOf(b.tezina));
  const secs = [];
  for (const z of picked) { const name = deoNaslov(z); let sec = secs.find(x => x.naslov === name); if (!sec) secs.push(sec = { naslov: name, ids: [] }); sec.ids.push(z.id); }
  registerPlaces(picked);
  return { items: picked, sections: secs };
}
function newLearning() {
  const seed = Date.now(), d = drawSession((SPEC.sastav || {}).ucenje || 20, seed);
  state.ucenje = { id: 'u' + seed, items: d.items, sections: d.sections, b: {} };
  state.cur = d.items[0].id;
}
function startTest(ime) {
  const seed = Date.now(), d = drawSession((SPEC.sastav || {}).test || 15, seed);
  const a = { id: 't' + seed, seed, start: new Date(seed).toISOString(), end: null, ime: ime || '', items: d.items, sections: d.sections, b: {}, fix: {}, phase: 'test' };
  state.tests.push(a); state.active = a.id; state.ime = ime || state.ime;
  state.cur = d.items[0].id; save();
}
function testScore(a, which) { const b = a[which || 'b']; return a.items.reduce((n, z) => n + ((b[z.id] || {}).pts || 0), 0); }
function finishCheck() {   // a test attempt ends when all its items are answered
  const a = state.mode === 'test' && att();
  if (a && a.phase === 'test' && !a.end && a.items.every(z => isDone(a.b[z.id] || { status: 'open' }))) { a.end = new Date().toISOString(); a.score = testScore(a); a.max = a.items.length * 3; save(); }
}

// ---------- score + navigation ----------
function refreshScore() {
  const ids = listIds();
  let n = 0;
  for (const id of ids) { const s = bucket && (state.mode === 'ucenje' || att()) ? bucket()[id] : null; if (s && s.pts) n += s.pts; }
  document.getElementById('scoreN').textContent = state.mode === 'test' && !att() ? '—' : n;
  document.getElementById('scoreMax').textContent = state.mode === 'test' && !att() ? '—' : ids.length * 3;
  document.querySelectorAll('.ms-btn').forEach(b => b.classList.toggle('active', b.dataset.mode === state.mode));
  const rep = state.ucenje ? state.ucenje.items.filter(z => (state.ucenje.b[z.id] || {}).status === 'revealed').length : 0;
  const mr = document.getElementById('mRepeat');
  mr.textContent = 'Ponovi otkrivene (' + rep + ')'; mr.disabled = state.mode !== 'ucenje' || !rep;
  document.getElementById('mReset').textContent = state.mode === 'ucenje' ? 'Počni učenje ispočetka' : 'Odustani od ovog testa';
  document.getElementById('mReset').disabled = state.mode === 'test' && !(att() && !att().end);
}
function rowLabel(z) {
  if (z.vrsta === 'gde_sam') return 'Gde sam? ' + z.tragovi[0];
  return z.pitanje && !/^Dopuni rečenicu/.test(z.pitanje) ? z.pitanje : (z.tvrdnja || (z.tekst || '').replace(/\{\{(.+?)\}\}/g, '…'));
}
const fmtDate = iso => { const d = new Date(iso); return d.toLocaleDateString('sr-Latn') + ' ' + d.toLocaleTimeString('sr-Latn', { hour: '2-digit', minute: '2-digit' }); };
function renderNav() {
  const ids = new Set(listIds());
  let h = '';
  const a = state.mode === 'test' && att();
  if (state.mode === 'ucenje' || a) {
    const cnt = TEZ.map(t => curItems().filter(z => z.tezina === t).length);
    h += '<div class="tz-legend">' + TEZ.map((t, i) => '<span>' + tzBadge({ tezina: t }) + ' ' + TEZ_LBL[t] + ' ' + cnt[i] + '</span>').join('') + '</div>';
    sections().forEach(d => {
      const zs = d.ids.filter(id => ids.has(id)).map(byId);
      if (!zs.length) return;
      const done = zs.filter(z => isDone(st(z.id))).length;
      h += '<div data-filter-group><div class="sec"><span>' + esc(d.naslov) + '</span><span class="cnt">' + done + ' / ' + zs.length + '</span></div>';
      for (const z of zs) {
        const s = st(z.id);
        const cls = s.status === 'ok' ? (s.pts === 3 ? 'ok' : 'part') : s.status === 'revealed' ? 'rev' : s.status === 'failed' ? 'fail' : '';
        const icon = s.status === 'ok' ? '✓' : s.status === 'open' ? (s.miss ? '◐' : '○') : '✗';
        h += '<button type="button" class="it-row ' + cls + (z.id === state.cur ? ' sel' : '') + '" data-id="' + z.id + '" data-filter="' + esc(rowLabel(z) + ' ' + VRSTA_LBL[z.vrsta] + ' ' + TEZ_LBL[z.tezina]) + '">' +
             '<span class="st">' + icon + '</span>' + tzBadge(z) + '<span class="lbl">' + numOf(z) + '. ' + esc(rowLabel(z)) + '</span><span class="pt">' + (s.pts != null ? s.pts + ' b' : '') + '</span></button>';
      }
      h += '</div>';
    });
    const allDone = listIds().every(id => isDone(st(id)));
    h += '<div class="sec"><span>Kraj</span></div><button type="button" class="it-row' + (state.cur === '_sum' ? ' sel' : '') + (allDone ? ' ok' : '') + '" data-id="_sum"><span class="st">' + (allDone ? '★' : '·') + '</span><span class="lbl">Rezultat</span></button>';
  }
  if (state.mode === 'test') {
    const fin = state.tests.filter(t => t.end).slice().reverse();
    h += '<div class="sec"><span>Moji testovi</span><span class="cnt">' + fin.length + '</span></div>';
    if (!a) h += '<button type="button" class="it-row' + (state.cur === '_start' ? ' sel' : '') + '" data-id="_start"><span class="st">+</span><span class="lbl">Novi test</span></button>';
    for (const t of fin) h += '<button type="button" class="it-row' + (state.cur === 'r:' + t.id ? ' sel' : '') + '" data-id="r:' + t.id + '"><span class="st">▤</span><span class="lbl">' + fmtDate(t.start) + (t.ime ? ' · ' + esc(t.ime) : '') + '</span><span class="pt">' + t.score + '/' + t.max + '</span></button>';
  }
  document.getElementById('navList').innerHTML = h;
  if (document.getElementById('app-filter').value) HubShell.applyFilter();
}
document.getElementById('navList').addEventListener('click', e => { const r = e.target.closest('.it-row'); if (r) go(r.dataset.id); });

const drawerBody = document.getElementById('drawerBody');

function bookHTML(z) {   // "Iz udžbenika": page, section, summary; the crop loads only where the private folder exists

    (b.slika ? '<figure><img src="' + esc(INFO.slikeData[b.slika] || INFO.slike + b.slika) + '" alt="' + esc(cap) + '" onerror="' +
      (INFO.zasticeno ? 'this.parentNode.outerHTML=\'<p class=&quot;ref&quot;>Slika: <a href=&quot;' + esc(INFO.zasticeno) + '&quot;>verzija sa slikama iz udžbenika (lozinka)</a></p>\'' : 'this.parentNode.remove()') +
      '">' + (cap ? '<figcaption>' + esc(cap) + '</figcaption>' : '') + '</figure>' : '') +

function helpHTML(z, s, fresh) {

      (s.status === 'failed' ? '<p class="placeholder">U testu se odgovor ne otkriva — vežbaćeš ga u Ispravci.</p>' : '<p>' + fmt(z.objasnjenje || '') + '</p>') + moreHTML(z) + '</div>';

}

// ---------- outcome ----------
function fail(z, text, given) {
  const s = st(z.id);
  s.miss++;
  (s.log = s.log || []).push({ v: given || '', ok: false });
  const ended = s.miss > steps(z);
  if (ended) { s.status = helpOn() ? 'revealed' : 'failed'; s.pts = 0; toast(helpOn() ? 'Evo odgovora' : 'Netačno', false); }
  else toast(text || 'Netačno — pokušaj ponovo', false);
  finishCheck(); save(); renderItem(true); renderNav(); refreshScore();
  if (ended ? s.status === 'revealed' : helpOn() && !mobile()) openDrawer();
}
function succeed(z, given) {
  const s = st(z.id);
  s.status = 'ok'; s.pts = ptsFor(s.miss);
  (s.log = s.log || []).push({ v: given || '', ok: true });
  toast('Tačno! +' + s.pts, true);
  finishCheck(); save(); renderItem(false); renderNav(); refreshScore();
  openDrawer();
}

// ---------- item renderers ----------

  return '<div class="item"><div class="ihead"><span class="vchip">' + VRSTA_LBL[z.vrsta] + '</span>' + tzBadge(z) + ' ' + TEZ_LBL[z.tezina] + '<span>' + esc(deoNaslov(z)) + ' · zadatak ' + n + ' / ' + curItems().length + '</span><span>' + pts + '</span></div>' +
    inner + '<div class="help-inline" id="helpInline"></div><div class="iactions" id="actions"></div>' +

}
function actions(btns) {

function nextButton(z) {   // done: Sledeći + reopen the drawer; in progress with help used: reopen the help

function renderChoice(z, s) {   // izbor + zakljuci (+ the correction step of tacno_netacno)
  const opts = shuffled(z.odgovori, z.id);
  const multi = z.odgovori.filter(o => o.tacan).length > 1;
  const ui = s.ui; ui.wrong = ui.wrong || []; ui.pick = ui.pick || [];
  const done = isDone(s), showRight = s.status === 'ok' || s.status === 'revealed';
  main.innerHTML = frame(z, s, '<h2 class="q">' + fmt(z.pitanje) + '</h2><div class="opts">' + opts.map(([o, i]) =>
    '<button type="button" class="opt' + (multi ? '' : ' round') + (ui.wrong.includes(i) ? ' wrong' : '') + (showRight && o.tacan ? ' right' : '') +
    (!done && ui.pick.includes(i) ? ' picked' : '') + '" data-i="' + i + '"' + (done || ui.wrong.includes(i) ? ' disabled' : '') + '><span class="box"></span><span>' + fmt(o.tekst) + '</span></button>').join('') + '</div>');
  if (!done && multi) actions([['btnCheck', 'Proveri', 'ok']]);

    const i = +b.dataset.i;

    ui.pick = ui.pick.includes(i) ? ui.pick.filter(x => x !== i) : ui.pick.concat(i);
    b.classList.toggle('picked'); save();
  }));
