acan": true}, {"tekst": "Ima oko 21 milion stanovnika.", "tacan": false}, {"tekst": "Ima oko 210 hiljada stanovnika.", "tacan": false}], "pomoc": ["Slovenija je jedna od najmanjih država bivše SFRJ — razmisli da li je to mnogo ili malo ljudi.", "Broj je malo veći od dva miliona.", "Iz lekcije: Slovenija ima 2,1 milion stanovnika."], "objasnjenje": "Netačno — Slovenija ima oko 2,1 milion stanovnika.", "iz_udzbenika": {"strana": 27, "odeljak": "Osnovni podaci", "tekst": "Infografika navodi da u Sloveniji živi oko 2,1 milion stanovnika.", "slika": "08-slovenija/01-osnovni-podaci.jpg"}}, {"id": "polozaj-tn-zastava", "vrsta": "tacno_netacno", "tezina": "srednje", "pojmovi": ["triglav", "slovenija"], "tvrdnja": "Na grbu, pa i na zastavi Slovenije, prikazan je vrh Triglav.", "tacno": true, "pomoc": ["Na grbu je beli vrh sa tri šiljka iznad talasastih linija.", "Koji vrh je najpoznatiji simbol Slovenije?", "Iz lekcije: Triglav je prikazan na grbu, pa i na zastavi Slovenije."], "objasnjenje": "Tačno — na grbu na belo-plavo-crvenoj zastavi je stilizovani Triglav sa tri šiljka.", "iz_udzbenika": {"strana": 27, "odeljak": "Osnovni podaci", "tekst": "Iznad karte je zastava Slovenije — belo-plavo-crvena, sa grbom na kome je Triglav.", "slika": "08-slovenija/01-osnovni-podaci.jpg"}}, {"id": "polozaj-izbor-cetiri-zemlje", "vrsta": "izbor", "tezina": "lako", "pojmovi": ["balkansko-poluostrvo", "panonska-nizija", "alpi", "jadransko-more"], "pitanje": "Po položaju je Slovenija istovremeno … zemlja. (Više tačnih.)", "odgovori": [{"tekst": "balkanska", "tacan": true}, {"tekst": "panonska", "tacan": true}, {"tekst": "alpska", "tacan": true}, {"tekst": "primorska", "tacan": true}, {"tekst": "pirinejska", "tacan": false}, {"tekst": "karpatska", "tacan": false}], "pomoc": ["Pogledaj šta je u Sloveniji na severozapadu, na istoku, na zapadu i na jugozapadu.", "Tačne su četiri osobine; Pirineji su u Španiji, a Karpati daleko na istoku.", "Iz lekcije: Slovenija je balkanska, panonska, alpska i primorska zemlja."], "objasnjenje": "Slovenija je balkanska (Dinaridi), panonska (istok u Panonskoj niziji), alpska (Julijski Alpi) i primorska (izlaz na Jadran).", "iz_udzbenika": {"strana": 27, "odeljak": "Položaj", "tekst": "Udžbenik ističe da je Slovenija po položaju istovremeno balkanska, panonska, alpska i primorska zemlja i traži da se objasni zašto."}}, {"id": "polozaj-povezi-cetiri", "vrsta": "povezi", "tezina": "srednje", "pojmovi": ["balkansko-poluostrvo", "panonska-nizija", "alpi", "jadransko-more"], "pitanje": "Poveži osobinu Slovenije sa delom njene teritorije koji je objašnjava.", "parovi": [["alpska zemlja", "severozapad je u Alpima (Julijski Alpi)"], ["panonska zemlja", "istočni deo pripada Panonskoj niziji"], ["primorska zemlja", "na jugozapadu izlazi na Jadransko more"], ["balkanska zemlja", "zapadni deo zauzimaju Dinaridi, na Balkanskom poluostrvu"]], "pomoc": ["Svaka osobina dolazi od jedne velike celine — planina, nizije ili mora.", "Panonska nizija je na istoku, Alpi na severozapadu.", "Iz lekcije: Alpi na severozapadu, Dinaridi na zapadu, Panonska nizija na istoku, Jadran na jugozapadu."], "objasnjenje": "Alpska — Julijski Alpi; panonska — istok u Panonskoj niziji; primorska — jadranska obala; balkanska — Dinaridi, deo Balkanskog poluostrva.", "iz_udzbenika": {"strana": 27, "odeljak": "Položaj", "tekst": "Deo Slovenije je na Balkanskom poluostrvu (Dinaridi), istok pripada Panonskoj niziji, severozapad zauzimaju Alpi, a na jugozapadu izlazi na Jadransko more."}}, {"id": "polozaj-zakljuci-panonska", "vrsta": "zakljuci", "tezina": "srednje", "pojmovi": ["panonska-nizija", "slovenija"], "pitanje": "Učenik kaže da je Slovenija i „panonska zemlja”. Koji podatak to potvrđuje?", "odgovori": [{"tekst": "Njen istočni deo je ravnica koja pripada Panonskoj niziji.", "tacan": true}, {"tekst": "Na severozapadu se uzdižu Julijski Alpi.", "tacan": false}, {"tekst": "Na jugozapadu izlazi na Jadransko more.", "tacan": false}, {"tekst": "U Postojnskoj jami živi čovečja ribica.", "tacan": false}], "pomoc": ["Korak 1: Panonska nizija je velika ravnica — u kom delu Slovenije je teren najniži?", "Korak 2: Ostali odgovori su tačni podaci, ali objašnjavaju druge osobine (alpska, primorska).", "Iz lekcije: idući ka istoku teren se spušta u ravnicu — deo Panonske nizije."], "objasnjenje": "Slovenija je panonska zemlja jer njen istočni, ravničarski deo pripada Panonskoj niziji.", "iz_udzbenika": {"strana": 27, "odeljak": "Položaj", "tekst": "Istočni deo Slovenije pripada Panonskoj niziji, pa je ona i panonska zemlja."}}, {"id": "polozaj-zakljuci-primorska", "vrsta": "zakljuci", "tezina": "srednje", "pojmovi": ["jadransko-more", "slovenija"], "pitanje": "Slovenija ima samo oko 47 km morske obale. Zašto je ipak nazivamo i primorskom zemljom?", "odgovori": [{"tekst": "Zato što na krajnjem jugozapadu izlazi na Jadransko more, makar kratkom obalom.", "tacan": true}, {"tekst": "Zato što sve njene reke teku ka Jadranskom moru.", "tacan": false}, {"tekst": "Zato što u celoj zemlji vlada sredozemna klima.", "tacan": false}, {"tekst": "Zato što ima mnogo velikih ostrva.", "tacan": false}], "pomoc": ["Korak 1: Šta je potrebno da bi država bila primorska — duga obala ili bilo kakav izlaz na more?", "Korak 2: Proveri ostale tvrdnje — Sava i Drava teku ka Crnom moru, a sredozemna klima je samo na obali.", "Iz lekcije: krajnji jugozapad Slovenije izlazi na Jadransko more."], "objasnjenje": "Za primorsku zemlju dovoljan je izlaz na more — Slovenija ga ima na jugozapadu, kod Kopra i Pirana.", "iz_udzbenika": {"strana": 27, "odeljak": "Položaj", "tekst": "Na krajnjem jugozapadu Slovenija izlazi na Jadransko more. Obala je kratka (oko 47 km), ali na njoj je važna luka Koper."}}, {"id": "polozaj-dopuni-jezik", "vrsta": "dopuni", "tezina": "tesko", "pojmovi": ["slovenija", "balkansko-poluostrvo"], "pitanje": "Dopuni rečenicu (bez ponuđenih reči).", "tekst": "Slovenija je {{najsevernija}} država Balkanskog poluostrva; ima površinu od {{20.273|20273}} km², a službeni jezik je {{slovenački|slovenacki}}.", "pomoc": ["Ova država leži na samom vrhu poluostrva, uz Alpe.", "Površina je nešto veća od dvadeset hiljada km²; jezik nosi ime po narodu.", "Iz lekcije: najsevernija država Balkana, 20.273 km², službeni jezik slovenački."], "objasnjenje": "Slovenija je najsevernija država Balkanskog poluostrva, ima 20.273 km² i službeni jezik slovenački.", "iz_udzbenika": {"strana": 27, "odeljak": "Položaj i osnovni podaci", "tekst": "Slovenija je najsevernija balkanska država, površine 20.273 km², sa slovenačkim kao službenim jezikom.", "slika": "08-slovenija/01-osnovni-podaci.jpg"}}, {"id": "polozaj-klik-slovenija", "vrsta": "karta_klik", "tezina": "lako", "pojmovi": ["slovenija"], "pitanje": "Klikni na kartu — Slovenija.", "cilj": {"drzava": "SVN"}, "pomoc": ["Slovenija je u sredini ove karte.", "Graniči se sa Italijom na zapadu, Austrijom na severu, Mađarskom na istoku i Hrvatskom na jugu.", "Iz lekcije: Slovenija je najsevernija država Balkana, sa kratkim izlazom na Jadran."], "objasnjenje": "Slovenija je između Italije, Austrije, Mađarske i Hrvatske, sa kratkom obalom Jadrana na jugozapadu.", "iz_udzbenika": {"strana": 27, "odeljak": "Položaj", "tekst": "Na isečku karte Evrope Slovenija je obojena crveno — na severozapadu Balkana, između Alpa, Italije i Panonske nizije.", "slika": "08-slovenija/01-osnovni-podaci.jpg"}}, {"id": "polozaj-klik-madjarska", "vrsta": "karta_klik", "tezina": "srednje", "pojmovi": ["panonska-nizija", "madjarska"], "pitanje": "Slovenački deo Panonske nizije nastavlja se u susednu državu na istoku. Klikni je.", "cilj": {"drzava": "HUN"}, "pomoc": ["Traži suseda Slovenije na istoku, a ne na severu ili jugu.", "Na severu je Austrija (Alpi), na jugu Hrvatska; istočni sused je ravničarska zemlja.", "Iz lekcije: Slovenija se graniči sa Italijom, Austrijom, Mađarskom i Hrvatskom; istok je panonski."], "objasnjenje": "Istočni sused Slovenije je Mađarska — panonska ravnica se iz Slovenije nastavlja u nju.", "iz_udzbenika": {"strana": 27, "odeljak": "Položaj", "tekst": "Istočni deo Slovenije je deo Panonske nizije, koja se nastavlja ka susednoj Mađarskoj."}}, {"id": "polozaj-klik-jadran", "vrsta": "karta_klik", "tezina": "srednje", "pojmovi": ["jadransko-more", "slovenija"], "pitanje": "Klikni na kartu — mesto gde Slovenija izlazi na Jadransko more.", "cilj": {"mesto": "jadranska-obala"}, "pomoc": ["Obala je na krajnjem jugozapadu Slovenije.", "Traži mali zaliv između Italije i hrvatske Istre.", "Iz lekcije: krajnji jugozapad Slovenije izlazi na Jadransko more (Tršćanski zaliv)."], "objasnjenje": "Slovenija izlazi na Jadran na krajnjem jugozapadu, u Tršćanskom zalivu — tu su Koper i Piran.", "iz_udzbenika": {"strana": 27, "odeljak": "Reljef", "tekst": "Krajnji jugozapad Slovenije izlazi na Jadransko more; obala je kratka, oko 47 km."}}, {"id": "polozaj-gde-slovenija", "vrsta": "gde_sam", "tezina": "lako", "pojmovi": ["slovenija"], "pitanje": "Gde sam? Pročitaj trag i klikni državu na karti.", "cilj": {"drzava": "SVN"}, "tragovi": ["Na mojoj zastavi je planinski vrh sa tri šiljka.", "Moj glavni grad je Ljubljana.", "Imam Alpe na severozapadu, ravnicu na istoku i kratku obalu Jadrana.", "Ja sam najsevernija država Balkanskog poluostrva."], "objasnjenje": "Slovenija — najsevernija država Balkana, sa Ljubljanom kao glavnim gradom i Triglavom na zastavi.", "iz_udzbenika": {"strana": 27, "odeljak": "Položaj", "tekst": "Slovenija je najsevernija država Balkanskog poluostrva i istovremeno balkanska, panonska, alpska i primorska zemlja.", "slika": "08-slovenija/01-osnovni-podaci.jpg"}}]}, {"naslov": "Reljef i kras", "zadaci": [{"id": "reljef-izbor-triglav", "vrsta": "izbor", "tezina": "lako", "pojmovi": ["triglav", "julijski-alpi"], "pitanje": "Koji je najviši vrh Slovenije?", "odgovori": [{"tekst": "Triglav", "tacan": true}, {"tekst": "Mont Blan", "tacan": false}, {"tekst": "Midžor", "tacan": false}, {"tekst": "Bobotov kuk", "tacan": false}], "pomoc": ["Vrh je u Julijskim Alpima i nalazi se i na zastavi Slovenije.", "Ime mu govori da ima „tri glave” (tri šiljka).", "Iz lekcije: najviši vrh Slovenije je Triglav (2.864 m)."], "objasnjenje": "Triglav (2.864 m) u Julijskim Alpima je najviši vrh Slovenije. Mont Blan je u Alpima Francuske i Italije, Midžor u Srbiji, a Bobotov kuk u Crnoj Gori.", "iz_udzbenika": {"strana": 28, "odeljak": "Reljef", "tekst": "Severozapad Slovenije zauzimaju Julijski Alpi; na njima je najviši vrh države, Triglav, visok 2.864 m.", "slika": "08-slovenija/03-julijski-alpi-bohinjsko-jezero.jpg"}}, {"id": "reljef-dopuni-triglav", "vrsta": "dopuni", "tezina": "lako", "pojmovi": ["triglav", "julijski-alpi"], "pitanje": "Dopuni rečenicu rečima iz banke.", "tekst": "Najviši vrh Slovenije je {{Triglav}}, a nalazi se u {{Julijskim Alpima|Julijski Alpi}}.", "ponudjene": ["Triglav", "Julijskim Alpima", "Dinaridima", "Midžor"], "pomoc": ["Vrh ima „tri glave” i nalazi se na zastavi.", "Najviše planine Slovenije su na severozapadu i pripadaju Alpima.", "Iz lekcije: Triglav (2.864 m) je u Julijskim Alpima."], "objasnjenje": "Triglav je najviši vrh Slovenije i nalazi se u Julijskim Alpima, na severozapadu države.", "iz_udzbenika": {"strana": 28, "odeljak": "Reljef", "tekst": "Julijski Alpi su na severozapadu Slovenije, a na njima je Triglav, najviši vrh države.", "slika": "08-slovenija/03-julijski-alpi-bohinjsko-jezero.jpg"}}, {"id": "reljef-tn-visina", "vrsta": "tacno_netacno", "tezina": "srednje", "pojmovi": ["triglav"], "tvrdnja": "Triglav je visok 2.864 m.", "tacno": true, "pomoc": ["Triglav je visok alpski vrh — viši od svih vrhova Srbije.", "Visina je između 2.800 i 2.900 m.", "Iz lekcije: Triglav je visok 2.864 m."], "objasnjenje": "Tačno — Triglav, najviši vrh Slovenije, visok je 2.864 m.", "iz_udzbenika": {"strana": 28, "odeljak": "Reljef", "tekst": "Na fotografiji Bohinjskog jezera u pozadini su Julijski Alpi; natpis navodi Triglav, visok 2.864 m, kao najviši vrh Slovenije.", "slika": "08-slovenija/03-julijski-alpi-bohinjsko-jezero.jpg"}}, {"id": "reljef-povezi-delovi", "vrsta": "povezi", "tezina": "lako", "pojmovi": ["julijski-alpi", "dinarske-planine", "panonska-nizija", "jadransko-more"], "pitanje": "Poveži deo Slovenije sa onim što se tamo nalazi.", "parovi": [["severozapad", "Julijski Alpi"], ["zapad", "Dinaridi"], ["istok", "deo Panonske nizije"], ["krajnji jugozapad", "Jadransko more"]], "pomoc": ["Najviše planine su uz granicu sa Italijom i Austrijom, a ravnica uz Mađarsku.", "More je u jugozapadnom uglu države.", "Iz lekcije: severozapad — Julijski Alpi; zapad — Dinaridi; istok — Panonska nizija; jugozapad — Jadran."], "objasnjenje": "Julijski Alpi su na severozapadu, Dinaridi na zapadu, Panonska nizija na istoku, a Jadransko more na krajnjem jugozapadu.", "iz_udzbenika": {"strana": 27, "odeljak": "Reljef", "tekst": "Reljef Slovenije je veoma raznovrstan — Julijski Alpi na severozapadu, Dinaridi na zapadu, ravnica Panonske nizije na istoku i izlaz na Jadran na jugozapadu."}}, {"id": "reljef-zakljuci-istok", "vrsta": "zakljuci", "tezina": "srednje", "pojmovi": ["julijski-alpi", "panonska-nizija"], "pitanje": "Putuješ kroz Sloveniju od Julijskih Alpa ka istoku, prema Mariboru i granici sa Mađarskom. Kako se menja teren?", "odgovori": [{"tekst": "Visina opada i teren prelazi u ravnicu Panonske nizije.", "tacan": true}, {"tekst": "Teren je sve viši, a na istoku je najviši vrh Triglav.", "tacan": false}, {"tekst": "Teren je sve vreme isti — visoravan.", "tacan": false}, {"tekst": "Na istoku se izlazi na Jadransko more.", "tacan": false}], "pomoc": ["Korak 1: Gde su najviše planine Slovenije — na severozapadu ili na istoku?", "Korak 2: Koja velika ravnica dodiruje Sloveniju na istoku?", "Iz lekcije: što se ide dalje na istok, visina terena opada i javlja se ravnica — deo Panonske nizije."], "objasnjenje": "Od Alpa ka istoku teren se spušta, pa je istok Slovenije ravnica koja pripada Panonskoj niziji.", "iz_udzbenika": {"strana": 27, "odeljak": "Reljef", "tekst": "Idući ka istoku visina terena opada, pa se tamo javlja ravnica koja je deo Panonske nizije."}}, {"id": "reljef-klik-julijski", "vrsta": "karta_klik", "tezina": "lako", "pojmovi": ["julijski-alpi"], "pitanje": "Klikni na kartu — Julijski Alpi.", "cilj": {"mesto": "julijski-alpi"}, "pomoc": ["Najviše planine Slovenije su na njenom severozapadu.", "Traži ih uz granicu sa Italijom i Austrijom.", "Iz lekcije: Julijski Alpi zauzimaju severozapad Slovenije."], "objasnjenje": "Julijski Alpi su na severozapadu Slovenije, uz granicu sa Italijom; u njima je Triglav.", "iz_udzbenika": {"strana": 27, "odeljak": "Reljef", "tekst": "Severozapad Slovenije zauzimaju Julijski Alpi, deo velikog planinskog venca Alpa.", "slika": "08-slovenija/03-julijski-alpi-bohinjsko-jezero.jpg"}}, {"id": "reljef-klik-panonski", "vrsta": "karta_klik", "tezina": "lako", "pojmovi": ["panonska-nizija"], "pitanje": "Klikni na kartu — deo Slovenije koji pripada Panonskoj niziji.", "cilj": {"mesto": "panonski-deo"}, "pomoc": ["Ravnica je tamo gde je Slovenija najudaljenija od Alpa i mora.", "Traži krajnji istok, uz granicu sa Mađarskom.", "Iz lekcije: na istoku se teren spušta u Panonsku niziju."], "objasnjenje": "Panonski deo Slovenije je na krajnjem istoku, uz Mađarsku i Hrvatsku, oko reka Mure i Drave.", "iz_udzbenika": {"strana": 27, "odeljak": "Reljef", "tekst": "Na istoku Slovenije je ravnica koja pripada Panonskoj niziji."}}, {"id": "reljef-gde-triglav", "vrsta": "gde_sam", "tezina": "tesko", "pojmovi": ["triglav", "julijski-alpi", "bohinjsko-jezero"], "pitanje": "Gde sam? Pročitaj trag i klikni mesto na karti.", "cilj": {"mesto": "triglav"}, "tragovi": ["Ispod mene leži jezero iz koga izlazi jedan izvorni krak Save.", "Visok sam 2.864 metra.", "Nalazim se na grbu i zastavi svoje države.", "Ja sam najviši vrh Slovenije, u Julijskim Alpima."], "objasnjenje": "Triglav — najviši vrh Slovenije (2.864 m), u Julijskim Alpima, iznad Bohinjskog jezera.", "iz_udzbenika": {"strana": 28, "odeljak": "Reljef", "tekst": "Triglav (2.864 m) je najviši vrh Slovenije, u Julijskim Alpima; ispod njega je Bohinjsko jezero.", "slika": "08-slovenija/03-julijski-alpi-bohinjsko-jezero.jpg"}}, {"id": "kras-izbor-postojnska", "vrsta": "izbor", "tezina": "lako", "pojmovi": ["postojnska-jama", "kras"], "pitanje": "Koja je najveća pećina u Sloveniji?", "odgovori": [{"tekst": "Postojnska jama", "tacan": true}, {"tekst": "Resavska pećina", "tacan": false}, {"tekst": "Bledsko jezero", "tacan": false}, {"tekst": "Plitvička jezera", "tacan": false}], "pomoc": ["Traži kraški oblik — pećinu, a ne jezero.", "Resavska pećina je u Srbiji, a Plitvička jezera u Hrvatskoj.", "Iz lekcije: najveća pećina Slovenije je Postojnska jama."], "objasnjenje": "Postojnska jama je najveća pećina u Sloveniji, poznata i po čovečjoj ribici.", "iz_udzbenika": {"strana": 28, "odeljak": "Kraški reljef", "tekst": "U Sloveniji ima kraških oblika reljefa. Najveća pećina je Postojnska jama, poznata i po čovečjoj ribici."}}, {"id": "kras-tn-ribica", "vrsta": "tacno_netacno", "tezina": "lako", "pojmovi": ["covecja-ribica", "postojnska-jama"], "tvrdnja": "Čovečja ribica je riba koja živi u Jadranskom moru.", "tacno": false, "ispravke": [{"tekst": "To je repati vodozemac koji živi u podzemnim vodama, npr. u Postojnskoj jami.", "tacan": true}, {"tekst": "To je ptica koja gnezdi na Triglavu.", "tacan": false}, {"tekst": "To je riba iz Bledskog jezera.", "tacan": false}], "pomoc": ["Ime zavarava — to uopšte nije riba.", "Živi u mraku, pod zemljom, u kraškom predelu.", "Iz lekcije: čovečja ribica je repati vodozemac iz Postojnske jame."], "objasnjenje": "Netačno — čovečja ribica je repati vodozemac koji živi u podzemnim vodama Dinarida, npr. u Postojnskoj jami.", "iz_udzbenika": {"strana": 28, "odeljak": "Kraški reljef", "tekst": "Postojnska jama je poznata po repatom vodozemcu — čovečjoj ribici."}}, {"id": "kras-zakljuci-ime", "vrsta": "zakljuci", "tezina": "lako", "pojmovi": ["covecja-ribica"], "pitanje": "Zašto ova životinja iz Postojnske jame nosi ime „čovečja ribica”?", "odgovori": [{"tekst": "Njena bledoružičasta koža podseća na ljudsku kožu.", "tacan": true}, {"tekst": "Zato što ima ruke kao čovek.", "tacan": false}, {"tekst": "Zato što živi samo u blizini ljudi.", "tacan": false}, {"tekst": "Zato što je velika kao čovek.", "tacan": false}], "pomoc": ["Korak 1: Ona živi u potpunom mraku — kakva joj je boja kože?", "Korak 2: Na šta te podseća bledoružičasta boja?", "Iz lekcije: koža čovečje ribice je bledoružičasta i podseća na ljudsku."], "objasnjenje": "Čovečja ribica je slepi vodozemac bledoružičaste kože, koja podseća na ljudsku — odatle ime.", "iz_udzbenika": {"strana": 28, "odeljak": "Kraški reljef", "tekst": "Čovečja ribica je slepi vodozemac bledoružičaste kože, nalik ljudskoj; može da živi mnogo decenija i dugo izdrži bez hrane."}}, {"id": "kras-dopuni-endemit", "vrsta": "dopuni", "tezina": "srednje", "pojmovi": ["covecja-ribica", "dinarski-endemit", "postojnska-jama"], "pitanje": "Dopuni rečenicu rečima iz banke.", "tekst": "Čovečja ribica je repati {{vodozemac}} iz {{Postojnske jame|Postojnska jama}}; zato što živi samo na prostoru Dinarida, naziva se {{dinarski}} endemit.", "ponudjene": ["vodozemac", "Postojnske jame", "dinarski", "gmizavac", "alpski", "Bledskog jezera"], "pomoc": ["Ova životinja ima rep i živi u vodi, ali nije riba ni gmizavac.", "Endemit nosi ime po planinama na kojima jedino živi — to nisu Alpi.", "Iz lekcije: repati vodozemac iz Postojnske jame, dinarski endemit."], "objasnjenje": "Čovečja ribica je repati vodozemac iz Postojnske jame; dinarski je endemit jer živi samo na prostoru Dinarida.", "iz_udzbenika": {"strana": 28, "odeljak": "Kraški reljef", "tekst": "Čovečja ribica, repati vodozemac iz Postojnske jame, naziva se dinarskim endemitom jer živi samo na prostoru Dinarida uz Jadransko more."}}, {"id": "kras-zakljuci-endemit", "vrsta": "zakljuci", "tezina": "srednje", "pojmovi": ["dinarski-endemit", "covecja-ribica", "dinarske-planine"], "pitanje": "Zašto se čovečja ribica naziva baš „dinarski endemit”?", "odgovori": [{"tekst": "Zato što živi samo na ograničenom prostoru — u podzemnim vodama Dinarida uz Jadran.", "tacan": true}, {"tekst": "Zato što se može naći u svim pećinama Evrope.", "tacan": false}, {"tekst": "Zato što je otkrivena na vrhu Triglava.", "tacan": false}, {"tekst": "Zato što živi i u Dinaridima i u Alpima.", "tacan": false}], "pomoc": ["Korak 1: Endemit je vrsta koja živi samo na jednom ograničenom prostoru.", "Korak 2: Prvi deo imena kaže koji je to prostor — koje planine?", "Iz lekcije: čovečja ribica živi samo na prostoru Dinarida uz Jadransko more."], "objasnjenje": "Endemit živi samo na jednom ograničenom prostoru; čovečja ribica živi samo u podzemnim vodama Dinarida uz Jadran, pa je dinarski endemit.", "iz_udzbenika": {"strana": 28, "odeljak": "Kraški reljef", "tekst": "Čovečja ribica živi samo na prostoru Dinarida uz Jadransko more, pa je dinarski endemit."}}, {"id": "kras-tn-skocjan", "vrsta": "tacno_netacno", "tezina": "srednje", "pojmovi": ["skocjanske-jame", "kras"], "tvrdnja": "Škocjanske jame su pod zaštitom UNESCO-a, a kroz njih teče podzemna reka Reka.", "tacno": true, "pomoc": ["Škocjanske jame su, kao i Postojnska jama, kraški oblik na jugozapadu Slovenije.", "Reka koja teče kroz njih ima neobično ime — baš „Reka”.", "Iz lekcije: Škocjanske jame su pod zaštitom UNESCO-a; kroz njih teče podzemna reka Reka."], "objasnjenje": "Tačno — Škocjanske jame su na UNESCO-ovom spisku zaštićenih prirodnih vrednosti, a kroz njih teče podzemna reka Reka.", "iz_udzbenika": {"strana": 28, "odeljak": "Turizam", "tekst": "Škocjanske jame, jedno od turističkih mesta Slovenije, zaštićene su od strane UNESCO-a; kroz njih protiče podzemna reka Reka."}}, {"id": "kras-klik-postojna", "vrsta": "karta_klik", "tezina": "srednje", "pojmovi": ["postojnska-jama", "kras"], "pitanje": "Klikni na kartu — Postojnska jama.", "cilj": {"mesto": "postojnska-jama"}, "pomoc": ["Kraški predeli Slovenije su na jugozapadu, u Dinaridima.", "Pećina je jugozapadno od Ljubljane, na pola puta ka moru.", "Iz lekcije: Postojnska jama je najveća pećina, kod mesta Postojna."], "objasnjenje": "Postojnska jama je jugozapadno od Ljubljane, kod Postojne, na putu ka jadranskoj obali.", "iz_udzbenika": {"strana": 28, "odeljak": "Kraški reljef", "tekst": "Najveća slovenačka pećina, Postojnska jama, nalazi se u kraškom predelu jugozapadno od Ljubljane."}}, {"id": "kras-klik-skocjan", "vrsta": "karta_klik", "tezina": "tesko", "pojmovi": ["skocjanske-jame", "kras"], "pitanje": "Klikni na kartu što tačnije — Škocjanske jame.", "cilj": {"mesto": "skocjanske-jame"}, "pomoc": ["I ove pećine su na kraškom jugozapadu Slovenije.", "Bliže su moru od Postojnske jame — između Postojne i Kopra.", "Iz lekcije: Škocjanske jame su na Krasu, na jugozapadu."], "objasnjenje": "Škocjanske jame su na Krasu, jugozapadno od Postojne, blizu granice sa Italijom i nedaleko od mora.", "iz_udzbenika": {"strana": 28, "odeljak": "Turizam", "tekst": "Škocjanske jame su turističko mesto na kraškom jugozapadu Slovenije."}}, {"id": "kras-gde-postojna", "vrsta": "gde_sam", "tezina": "srednje", "pojmovi": ["postojnska-jama", "covecja-ribica"], "pitanje": "Gde sam? Pročitaj trag i klikni mesto na karti.", "cilj": {"mesto": "postojnska-jama"}, "tragovi": ["Nalazim se u kraškom predelu, jugozapadno od glavnog grada.", "Posetioci dolaze iz celog sveta da me vide — ja sam turističko mesto.", "U mojim podzemnim vodama živi čovečja ribica.", "Ja sam najveća pećina u Sloveniji."], "objasnjenje": "Postojnska jama — najveća pećina Slovenije, dom čovečje ribice, jugozapadno od Ljubljane.", "iz_udzbenika": {"strana": 28, "odeljak": "Kraški reljef", "tekst": "Postojnska jama je najveća pećina u Sloveniji i važno turističko mesto, poznato po čovečjoj ribici."}}]}, {"naslov": "Klima i vode", "zadaci": [{"id": "klima-povezi-tipovi", "vrsta": "povezi", "tezina": "lako", "pojmovi": ["planinska-klima", "izmenjenosredozemna-klima", "umerenokontinentalna-klima"], "pitanje": "Poveži deo Slovenije sa klimom koja tamo vlada.", "parovi": [["Alpi i Dinaridi", "planinska klima"], ["obala Jadranskog mora", "izmenjenosredozemna klima"], ["najveći deo države", "umerenokontinentalna klima"]], "pomoc": ["Planine imaju svoju, hladniju klimu.", "More ublažava klimu na obali; ostatak zemlje ima klimu kao i veći deo Srbije.", "Iz lekcije: planinska na Alpima i Dinaridima, izmenjenosredozemna na obali, umerenokontinentalna u najvećem delu."], "objasnjenje": "Na Alpima i Dinaridima je planinska klima, na obali izmenjenosredozemna, a u najvećem delu Slovenije umerenokontinentalna.", "iz_udzbenika": {"strana": 28, "odeljak": "Klima", "tekst": "Slovenija ima tri tipa klime — planinsku na Alpima i Dinaridima, izmenjenosredozemnu na obali Jadrana i umerenokontinentalnu u najvećem delu države."}}, {"id": "klima-tn-najveci", "vrsta": "tacno_netacno", "tezina": "lako", "pojmovi": ["umerenokontinentalna-klima", "planinska-klima"], "tvrdnja": "U najvećem delu Slovenije vlada planinska klima.", "tacno": false, "ispravke": [{"tekst": "U najvećem delu vlada umerenokontinentalna klima.", "tacan": true}, {"tekst": "U najvećem delu vlada izmenjenosredozemna klima.", "tacan": false}, {"tekst": "U najvećem delu vlada stepska klima.", "tacan": false}], "pomoc": ["Planinska klima je samo na visokim planinama, a one ne zauzimaju celu državu.", "Sredozemna klima je samo na kratkoj obali.", "Iz lekcije: najveći deo Slovenije ima umerenokontinentalnu klimu."], "objasnjenje": "Netačno — planinska klima je samo na Alpima i Dinaridima; u najvećem delu Slovenije vlada umerenokontinentalna klima.", "iz_udzbenika": {"strana": 28, "odeljak": "Klima", "tekst": "U najvećem delu Slovenije je umerenokontinentalna klima, a planinska je samo na Alpima i Dinaridima."}}, {"id": "klima-dopuni-tipovi", "vrsta": "dopuni", "tezina": "tesko", "pojmovi": ["planinska-klima", "izmenjenosredozemna-klima", "umerenokontinentalna-klima"], "pitanje": "Dopuni rečenicu nazivima tipova klime (bez ponuđenih reči).", "tekst": "Na Alpima i Dinaridima vlada {{planinska}} klima, na obali Jadrana {{izmenjenosredozemna|izmenjeno sredozemna|izmenjeno-sredozemna}} klima, a u najvećem delu Slovenije {{umerenokontinentalna|umereno kontinentalna|umereno-kontinentalna}} klima.", "pomoc": ["Svaki tip klime nosi ime po predelu — planine, Sredozemlje, kontinent.", "Obala ima „izmenjenu” sredozemnu klimu, a unutrašnjost „umerenu” kontinentalnu.", "Iz lekcije: planinska, izmenjenosredozemna i umerenokontinentalna klima."], "objasnjenje": "Planinska klima je na Alpima i Dinaridima, izmenjenosredozemna na obali, a umerenokontinentalna u najvećem delu države.", "iz_udzbenika": {"strana": 28, "odeljak": "Klima", "tekst": "Tri tipa klime Slovenije su planinska (Alpi, Dinaridi), izmenjenosredozemna (obala) i umerenokontinentalna (najveći deo)."}}, {"id": "klima-zakljuci-piran", "vrsta": "zakljuci", "tezina": "srednje", "pojmovi": ["izmenjenosredozemna-klima", "piran"], "pitanje": "U kom od ovih mesta u Sloveniji će zima najverovatnije biti najblaža?", "odgovori": [{"tekst": "U Piranu, na obali Jadrana.", "tacan": true}, {"tekst": "Na Triglavu.", "tacan": false}, {"tekst": "U Mariboru, na istoku.", "tacan": false}, {"tekst": "Na Bledu, podno Alpa.", "tacan": false}], "pomoc": ["Korak 1: Koja klima ima najblaže zime — planinska, kontinentalna ili sredozemna?", "Korak 2: Koje je od ponuđenih mesta na moru?", "Iz lekcije: na obali Jadranskog mora vlada izmenjenosredozemna klima."], "objasnjenje": "Piran je na obali, gde vlada izmenjenosredozemna klima sa blagim zimama; Triglav i Bled imaju planinsku, a Maribor umerenokontinentalnu klimu.", "iz_udzbenika": {"strana": 28, "odeljak": "Klima", "tekst": "Na obali Jadranskog mora Slovenija ima izmenjenosredozemnu klimu, a na planinama planinsku."}}, {"id": "klima-zakljuci-tri", "vrsta": "zakljuci", "tezina": "tesko", "pojmovi": ["planinska-klima", "izmenjenosredozemna-klima", "umerenokontinentalna-klima"], "pitanje": "Slovenija je mala država, a ipak ima tri tipa klime. Šta je najbolje objašnjenje?", "odgovori": [{"tekst": "Ima vrlo raznovrstan reljef i položaj — visoke planine, more na jugozapadu i ravnicu na istoku.", "tacan": true}, {"tekst": "Zato što je najsevernija država Balkana.", "tacan": false}, {"tekst": "Zato što kroz nju teče mnogo reka.", "tacan": false}, {"tekst": "Zato što je velika i pruža se od severa do juga Evrope.", "tacan": false}], "pomoc": ["Korak 1: Na kartu postavi tri tipa klime — gde je koji?", "Korak 2: Šta je zajedničko tim mestima — da li ih određuju reke, veličina ili reljef i more?", "Iz lekcije: planine daju planinsku klimu, more izmenjenosredozemnu, unutrašnjost umerenokontinentalnu."], "objasnjenje": "Raznovrsnost klime dolazi od raznovrsnog reljefa i položaja — Alpi i Dinaridi, Jadran i panonska ravnica su blizu jedni drugih.", "iz_udzbenika": {"strana": 28, "odeljak": "Klima", "tekst": "Zbog raznovrsnog reljefa i izlaza na more, u Sloveniji se smenjuju planinska, izmenjenosredozemna i umerenokontinentalna klima."}}, {"id": "vode-izbor-slivovi", "vrsta": "izbor", "tezina": "srednje", "pojmovi": ["crnomorski-sliv", "jadranski-sliv"], "pitanje": "Kojim slivovima pripadaju reke Slovenije? (Više tačnih.)", "odgovori": [{"tekst": "Crnomorskom slivu", "tacan": true}, {"tekst": "Jadranskom slivu", "tacan": true}, {"tekst": "Egejskom slivu", "tacan": false}, {"tekst": "Baltičkom slivu", "tacan": false}], "pomoc": ["Sava i Drava odlaze ka Dunavu, a Dunav se uliva u jedno more na istoku.", "Neke reke na zapadu teku pravo u more uz koje leži Slovenija.", "Iz lekcije: reke Slovenije pripadaju Crnomorskom i Jadranskom slivu."], "objasnjenje": "Reke Slovenije pripadaju dvama slivovima — Crnomorskom (Sava, Drava) i Jadranskom (npr. Soča).", "iz_udzbenika": {"strana": 28, "odeljak": "Vode", "tekst": "Reke Slovenije pripadaju dvama slivovima — Crnomorskom i Jadranskom."}}, {"id": "vode-dopuni-sava", "vrsta": "dopuni", "tezina": "lako", "pojmovi": ["sava", "sava-bohinjka", "sava-dolinka"], "pitanje": "Dopuni rečenicu rečima iz banke.", "tekst": "Reka Sava nastaje spajanjem {{Save Bohinjke|Sava Bohinjka}} i {{Save Dolinke|Sava Dolinka}} u Julijskim Alpima.", "ponudjene": ["Save Bohinjke", "Save Dolinke", "Drave", "Soče"], "pomoc": ["Oba izvorna kraka nose ime Sava.", "Jedan izlazi iz Bohinjskog jezera, a drugi teče dolinom na severozapadu.", "Iz lekcije: Sava nastaje od Save Bohinjke i Save Dolinke."], "objasnjenje": "Sava nastaje spajanjem Save Bohinjke i Save Dolinke u Julijskim Alpima.", "iz_udzbenika": {"strana": 28, "odeljak": "Vode", "tekst": "Sava nastaje kada se u Julijskim Alpima spoje Sava Bohinjka i Sava Dolinka.", "slika": "08-slovenija/02-sava-dolinka.jpg"}}, {"id": "vode-tn-sava-kraj", "vrsta": "tacno_netacno", "tezina": "lako", "pojmovi": ["sava", "beograd", "dunav"], "tvrdnja": "Sava završava svoj tok u Beogradu, gde se uliva u Dunav.", "tacno": true, "pomoc": ["Sava teče iz Slovenije ka jugoistoku, kroz Hrvatsku, sve do Srbije.", "U našem glavnom gradu se sastaju dve velike reke.", "Iz lekcije: Sava završava tok u Srbiji, u Beogradu."], "objasnjenje": "Tačno — Sava nastaje u Sloveniji, a u Beogradu se uliva u Dunav.", "iz_udzbenika": {"strana": 28, "odeljak": "Vode", "tekst": "Od izvorišta u Julijskim Alpima Sava teče ka Srbiji i završava tok u Beogradu, ulivanjem u Dunav.", "slika": "08-slovenija/02-sava-dolinka.jpg"}}, {"id": "vode-izbor-reke", "vrsta": "izbor", "tezina": "tesko", "pojmovi": ["drava", "krka", "soca", "kupa", "ljubljanica"], "pitanje": "Koje od ovih reka udžbenik navodi kao veće reke Slovenije? (Više tačnih.)", "odgovori": [{"tekst": "Drava", "tacan": true}, {"tekst": "Soča", "tacan": true}, {"tekst": "Kupa", "tacan": true}, {"tekst": "Ljubljanica", "tacan": true}, {"tekst": "Neretva", "tacan": false}, {"tekst": "Una", "tacan": false}], "pomoc": ["Dve od ponuđenih reka teku kroz Bosnu i Hercegovinu, ne kroz Sloveniju.", "Jedna teče kroz glavni grad, jedna ka Jadranu, jedna kroz Maribor, a jedna je granica sa Hrvatskom.", "Iz lekcije: pored Save, veće reke su Drava, Krka, Soča, Kupa i Ljubljanica."], "objasnjenje": "Veće reke Slovenije su Sava, Drava, Krka, Soča, Kupa i Ljubljanica. Neretva i Una teku kroz BiH.", "iz_udzbenika": {"strana": 28, "odeljak": "Vode", "tekst": "Pored Save, veće reke Slovenije su Drava, Krka, Soča, Kupa i Ljubljanica."}}, {"id": "vode-povezi-reke", "vrsta": "povezi", "tezina": "tesko", "pojmovi": ["soca", "drava", "kupa", "ljubljanica", "krka"], "pitanje": "Poveži reku sa njenim opisom.", "parovi": [["Soča", "teče na zapadu, ka Jadranskom moru"], ["Drava", "teče kroz Maribor, na severoistoku"], ["Kupa", "granična reka prema Hrvatskoj na jugu"], ["Ljubljanica", "teče kroz glavni grad"], ["Krka", "teče na jugoistoku i uliva se u Savu"]], "pomoc": ["Jedna reka nosi ime glavnog grada — počni od nje.", "Jedina reka koja ide ka Jadranu teče blizu granice sa Italijom; Drava prolazi kroz drugi najveći grad.", "Iz lekcije: Sava, Drava, Krka, Soča, Kupa i Ljubljanica su veće reke Slovenije."], "objasnjenje": "Soča — zapad, ka Jadranu; Drava — Maribor; Kupa — granica sa Hrvatskom; Ljubljanica — Ljubljana; Krka — jugoistok, pritoka Save.", "iz_udzbenika": {"strana": 28, "odeljak": "Vode", "tekst": "Veće reke Slovenije su Sava, Drava, Krka, Soča, Kupa i Ljubljanica; Ljubljanica protiče kroz glavni grad.", "slika": "08-slovenija/05-reka-ljubljanica.jpg"}}, {"id": "vode-zakljuci-soca", "vrsta": "zakljuci", "tezina": "tesko", "pojmovi": ["soca", "sava", "jadranski-sliv", "crnomorski-sliv"], "pitanje": "Soča teče ka Jadranskom moru, a Sava ka Dunavu. Šta iz toga zaključuješ?", "odgovori": [{"tekst": "Soča pripada Jadranskom slivu, a Sava Crnomorskom.", "tacan": true}, {"tekst": "Obe reke pripadaju Jadranskom slivu.", "tacan": false}, {"tekst": "Obe reke pripadaju Crnomorskom slivu.", "tacan": false}, {"tekst": "Soča pripada Crnomorskom slivu, a Sava Jadranskom.", "tacan": false}], "pomoc": ["Korak 1: Sliv nosi ime po moru u koje se voda na kraju uliva.", "Korak 2: U koje more se uliva Dunav, a u koje Soča?", "Iz lekcije: reke Slovenije pripadaju Crnomorskom i Jadranskom slivu."], "objasnjenje": "Soča se uliva u Jadransko more (Jadranski sliv), a Sava preko Dunava odlazi u Crno more (Crnomorski sliv).", "iz_udzbenika": {"strana": 28, "odeljak": "Vode", "tekst": "Reke Slovenije dele se na dva sliva — Crnomorski (Sava preko Dunava) i Jadranski."}}, {"id": "vode-zakljuci-srbija", "vrsta": "zakljuci", "tezina": "lako", "pojmovi": ["sava", "srbija", "slovenija"], "pitanje": "Šta povezuje Sloveniju i Srbiju preko reka?", "odgovori": [{"tekst": "Sava nastaje u Sloveniji, a tok završava u Srbiji, u Beogradu.", "tacan": true}, {"tekst": "Drava izvire u Srbiji i uliva se u Jadran kod Kopra.", "tacan": false}, {"tekst": "Ljubljanica teče kroz Beograd.", "tacan": false}, {"tekst": "Soča povezuje Bled i Beograd.", "tacan": false}], "pomoc": ["Korak 1: Koja reka iz Slovenije teče ka jugoistoku, kroz Hrvatsku?", "Korak 2: Gde se ta reka završava?", "Iz lekcije: Sava nastaje u Julijskim Alpima i završava tok u Beogradu."], "objasnjenje": "Sava povezuje dve države — izvorišni deo je u Sloveniji, a ušće u Dunav u Beogradu.", "iz_udzbenika": {"strana": 28, "odeljak": "Vode", "tekst": "Sava nastaje u Sloveniji od Save Bohinjke i Save Dolinke i teče sve do Beograda.", "slika": "08-slovenija/02-sava-dolinka.jpg"}}, {"id": "vode-tn-ljubljanica", "vrsta": "tacno_netacno", "tezina": "tesko", "pojmovi": ["ljubljanica", "ljubljana", "maribor"], "tvrdnja": "Reka Ljubljanica teče kroz Maribor.", "tacno": false, "ispravke": [{"tekst": "Ljubljanica teče kroz Ljubljanu, a kroz Maribor teče Drava.", "tacan": true}, {"tekst": "Ljubljanica teče kroz Koper, a kroz Maribor teče Soča.", "tacan": false}, {"tekst": "Ljubljanica teče kroz Celje, a kroz Maribor teče Kupa.", "tacan": false}], "pomoc": ["Ime reke otkriva grad kroz koji teče.", "Maribor je na severoistoku, na velikoj reci koja ide ka Hrvatskoj i Dunavu.", "Iz lekcije: Ljubljanica protiče kroz Ljubljanu; Maribor je na Dravi."], "objasnjenje": "Netačno — Ljubljanica teče kroz glavni grad Ljubljanu, a Maribor leži na Dravi.", "iz_udzbenika": {"strana": 28, "odeljak": "Vode", "tekst": "Na fotografiji Ljubljanica protiče kroz središte Ljubljane, ispod kamenog mosta, pored starih zgrada.", "slika": "08-slovenija/05-reka-ljubljanica.jpg"}}, {"id": "vode-izbor-bled", "vrsta": "izbor", "tezina": "srednje", "pojmovi": ["bledsko-jezero", "bohinjsko-jezero", "bled"], "pitanje": "Na fotografiji je planinsko jezero sa malim ostrvom na kome je crkva, a na litici iznad je zamak. Koje je to jezero?", "odgovori": [{"tekst": "Bledsko jezero", "tacan": true}, {"tekst": "Bohinjsko jezero", "tacan": false}, {"tekst": "Skadarsko jezero", "tacan": false}, {"tekst": "Plitvička jezera", "tacan": false}], "pomoc": ["Ostrvo sa crkvom je zaštitni znak jednog od najpoznatijih turističkih mesta Slovenije.", "Bohinjsko jezero je takođe u Julijskim Alpima, ali iz njega izlazi Sava Bohinjka i nema ostrvo sa crkvom.", "Iz lekcije: Bledsko jezero, kod turističkog mesta Bled."], "objasnjenje": "To je Bledsko jezero, sa ostrvom i crkvom i Bledskim zamkom na litici — kod turističkog mesta Bled.", "iz_udzbenika": {"strana": 28, "odeljak": "Vode", "tekst": "Fotografija prikazuje Bledsko jezero sa ostrvom i crkvom, a u pozadini su snežni vrhovi Alpa; Bled je jedno od najpoznatijih turističkih mesta.", "slika": "08-slovenija/04-bledsko-jezero.jpg"}}, {"id": "vode-klik-dolinka", "vrsta": "karta_klik", "tezina": "tesko", "pojmovi": ["sava-dolinka", "sava"], "pitanje": "Klikni na kartu što tačnije — dolina Save Dolinke.", "cilj": {"mesto": "sava-dolinka"}, "pomoc": ["Izvorni kraci Save su u Julijskim Alpima, na severozapadu.", "Sava Dolinka teče dolinom severno od Triglava, blizu granice sa Austrijom i Italijom.", "Iz lekcije: Sava Dolinka je jedan od dva izvorna kraka Save, u Julijskim Alpima."], "objasnjenje": "Sava Dolinka teče dolinom na krajnjem severozapadu, severno od Triglava, pa se kod Bleda spaja sa Savom Bohinjkom.", "iz_udzbenika": {"strana": 28, "odeljak": "Vode", "tekst": "Na fotografiji je Sava Dolinka — brza, bistra planinska reka, jedan od dva izvorna kraka Save u Julijskim Alpima.", "slika": "08-slovenija/02-sava-dolinka.jpg"}}, {"id": "vode-klik-bohinjsko", "vrsta": "karta_klik", "tezina": "tesko", "pojmovi": ["bohinjsko-jezero", "sava-bohinjka"], "pitanje": "Klikni na kartu što tačnije — Bohinjsko jezero.", "cilj": {"mesto": "bohinjsko-jezero"}, "pomoc": ["Jezero je u Julijskim Alpima, ispod Triglava.", "Zapadnije je od Bleda; iz njega izlazi Sava Bohinjka.", "Iz lekcije: Bohinjsko jezero je podno Triglava."], "objasnjenje": "Bohinjsko jezero je u Julijskim Alpima, južno od Triglava i zapadno od Bleda; iz njega izlazi Sava Bohinjka.", "iz_udzbenika": {"strana": 28, "odeljak": "Vode", "tekst": "Bohinjsko jezero je ledničko jezero ispod Triglava, u Julijskim Alpima; iz njega izlazi Sava Bohinjka.", "slika": "08-slovenija/03-julijski-alpi-bohinjsko-jezero.jpg"}}, {"id": "vode-klik-drava", "vrsta": "karta_klik", "tezina": "srednje", "pojmovi": ["drava"], "pitanje": "Klikni na kartu — reka Drava (u Sloveniji).", "cilj": {"mesto": "drava"}, "pomoc": ["Drava teče kroz severoistok Slovenije.", "Prolazi kroz drugi najveći grad Slovenije, pa ka Hrvatskoj.", "Iz lekcije: Drava je jedna od većih reka; teče kroz Maribor."], "objasnjenje": "Drava teče kroz severoistok Slovenije — kroz Maribor, pa dalje ka Hrvatskoj i Dunavu (Crnomorski sliv).", "iz_udzbenika": {"strana": 28, "odeljak": "Vode", "tekst": "Drava je jedna od većih reka Slovenije; teče kroz njen severoistočni, panonski deo."}}, {"id": "vode-klik-soca", "vrsta": "karta_klik", "tezina": "srednje", "pojmovi": ["soca", "jadranski-sliv"], "pitanje": "Klikni na kartu — reka Soča.", "cilj": {"mesto": "soca"}, "pomoc": ["Soča je jedina od većih reka koja teče ka Jadranu.", "Traži je na zapadu, uz granicu sa Italijom.", "Iz lekcije: Soča je jedna od većih reka Slovenije."], "objasnjenje": "Soča teče na zapadu Slovenije, uz granicu sa Italijom, i uliva se u Jadransko more.", "iz_udzbenika": {"strana": 28, "odeljak": "Vode", "tekst": "Soča je jedna od većih reka Slovenije; teče na zapadu, ka Jadranskom moru."}}, {"id": "vode-klik-kupa", "vrsta": "karta_klik", "tezina": "srednje", "pojmovi": ["kupa", "hrvatska"], "pitanje": "Klikni na kartu — reka Kupa.", "cilj": {"mesto": "kupa"}, "pomoc": ["Kupa je granična reka.", "Teče na jugu Slovenije, prema Hrvatskoj.", "Iz lekcije: Kupa je jedna od većih reka Slovenije."], "objasnjenje": "Kupa čini deo južne granice Slovenije sa Hrvatskom.", "iz_udzbenika": {"strana": 28, "odeljak": "Vode", "tekst": "Kupa je jedna od većih reka Slovenije; teče uz granicu sa Hrvatskom na jugu."}}]}, {"naslov": "Stanovništvo, privreda i gradovi", "zadaci": [{"id": "drustvo-izbor-narod", "vrsta": "izbor", "tezina": "lako", "pojmovi": ["slovenci"], "pitanje": "Koji narod čini većinu stanovništva Slovenije?", "odgovori": [{"tekst": "Slovenci", "tacan": true}, {"tekst": "Hrvati", "tacan": false}, {"tekst": "Italijani", "tacan": false}, {"tekst": "Mađari", "tacan": false}], "pomoc": ["Država je etnički homogena — gotovo svi pripadaju jednom narodu.", "Država nosi ime po tom narodu.", "Iz lekcije: većinu čine Slovenci."], "objasnjenje": "Većinu stanovništva čine Slovenci — Slovenija je etnički homogena država.", "iz_udzbenika": {"strana": 28, "odeljak": "Stanovništvo", "tekst": "Slovenija je etnički homogena država — većinu stanovništva čine Slovenci."}}, {"id": "drustvo-izbor-vera", "vrsta": "izbor", "tezina": "lako", "pojmovi": ["katolicanstvo", "slovenci"], "pitanje": "Koja je vera najzastupljenija u Sloveniji?", "odgovori": [{"tekst": "katoličanstvo", "tacan": true}, {"tekst": "pravoslavlje", "tacan": false}, {"tekst": "islam", "tacan": false}, {"tekst": "protestantizam", "tacan": false}], "pomoc": ["Ista vera preovlađuje i u susednoj Hrvatskoj i Italiji.", "Središte te crkve je u Vatikanu.", "Iz lekcije: najzastupljenija vera je katoličanstvo."], "objasnjenje": "U Sloveniji je najzastupljenije katoličanstvo, kao i u susednoj Hrvatskoj i Italiji.", "iz_udzbenika": {"strana": 28, "odeljak": "Stanovništvo", "tekst": "Najzastupljenija vera u Sloveniji je katoličanstvo."}}, {"id": "drustvo-tn-homogena", "vrsta": "tacno_netacno", "tezina": "lako", "pojmovi": ["slovenci", "slovenija"], "tvrdnja": "Slovenija je etnički homogena država.", "tacno": true, "pomoc": ["„Etnički homogena” znači da u državi pretežno živi jedan narod.", "Da li u Sloveniji živi mnogo različitih naroda ili pretežno jedan?", "Iz lekcije: Slovenija je etnički homogena — većinu čine Slovenci."], "objasnjenje": "Tačno — veliku većinu stanovnika Slovenije čine Slovenci, pa je ona etnički homogena država.", "iz_udzbenika": {"strana": 28, "odeljak": "Stanovništvo", "tekst": "Država je etnički homogena, jer su gotovo svi stanovnici Slovenci."}}, {"id": "drustvo-izbor-sloveni", "vrsta": "izbor", "tezina": "srednje", "pojmovi": ["slovenci", "juzni-sloveni"], "pitanje": "Kojoj grupi naroda pripadaju Slovenci?", "odgovori": [{"tekst": "južnim Slovenima", "tacan": true}, {"tekst": "zapadnim Slovenima", "tacan": false}, {"tekst": "istočnim Slovenima", "tacan": false}, {"tekst": "romanskim narodima", "tacan": false}], "pomoc": ["Slovenci su slovenski narod, kao i Srbi i Hrvati.", "Žive na Balkanskom poluostrvu, na jugu slovenskog sveta.", "Iz lekcije: Slovenci pripadaju južnim Slovenima."], "objasnjenje": "Slovenci su južnoslovenski narod, kao Srbi, Hrvati, Crnogorci, Bošnjaci, Makedonci i Bugari.", "iz_udzbenika": {"strana": 28, "odeljak": "Stanovništvo", "tekst": "Udžbenik pita kojoj grupi naroda pripadaju Slovenci — oni su južni Sloveni."}}, {"id": "drustvo-tn-naseljenost", "vrsta": "tacno_netacno", "tezina": "srednje", "pojmovi": ["slovenija", "alpi", "panonska-nizija"], "tvrdnja": "Najgušće su naseljeni Julijski Alpi na severozapadu Slovenije.", "tacno": false, "ispravke": [{"tekst": "Najgušće je naseljen deo Panonske nizije i okolina glavnog grada.", "tacan": true}, {"tekst": "Najgušće su naseljeni Dinaridi na zapadu.", "tacan": false}, {"tekst": "Slovenija je svuda podjednako naseljena.", "tacan": false}], "pomoc": ["Razmisli gde je lakše živeti — u visokim planinama ili u ravnici i kotlini.", "Naseljenost je neravnomerna; najviše ljudi je u ravnici na istoku i oko Ljubljane.", "Iz lekcije: najgušće je naseljen deo Panonske nizije i okolina glavnog grada."], "objasnjenje": "Netačno — naseljenost je neravnomerna; najgušće je u panonskom delu i oko Ljubljane, a planine su retko naseljene.", "iz_udzbenika": {"strana": 28, "odeljak": "Stanovništvo", "tekst": "Naseljenost Slovenije je neravnomerna — najgušća je u delu Panonske nizije i oko glavnog grada."}}, {"id": "drustvo-zakljuci-naseljenost", "vrsta": "zakljuci", "tezina": "tesko", "pojmovi": ["panonska-nizija", "ljubljana", "alpi"], "pitanje": "Zašto je istok Slovenije i okolina Ljubljane gušće naseljena od Alpa?", "odgovori": [{"tekst": "Ravnica i kotlina su pogodne za poljoprivredu, gradove, saobraćaj i industriju, a planine su hladne i teško prohodne.", "tacan": true}, {"tekst": "Zato što u Alpima vlada izmenjenosredozemna klima.", "tacan": false}, {"tekst": "Zato što je u Alpima zabranjeno graditi kuće.", "tacan": false}, {"tekst": "Zato što su Alpi na obali mora.", "tacan": false}], "pomoc": ["Korak 1: Uporedi uslove za život — ravnica i kotlina naspram visokih planina.", "Korak 2: Gde je lakše obrađivati zemlju, graditi puteve i fabrike?", "Iz lekcije: najgušće je naseljen deo Panonske nizije i okolina glavnog grada."], "objasnjenje": "Ravničarski panonski deo i kotlina oko Ljubljane pogodni su za poljoprivredu, gradove i saobraćaj, dok su Alpi hladni i teško prohodni.", "iz_udzbenika": {"strana": 28, "odeljak": "Stanovništvo", "tekst": "Najgušće su naseljeni panonski deo i okolina glavnog grada, a ređe planinski predeli."}}, {"id": "drustvo-izbor-razvijena", "vrsta": "izbor", "tezina": "lako", "pojmovi": ["sfrj", "slovenija"], "pitanje": "Koja je država ekonomski najrazvijenija od svih bivših republika SFRJ?", "odgovori": [{"tekst": "Slovenija", "tacan": true}, {"tekst": "Severna Makedonija", "tacan": false}, {"tekst": "Crna Gora", "tacan": false}, {"tekst": "Bosna i Hercegovina", "tacan": false}], "pomoc": ["To je najsevernija od bivših jugoslovenskih republika.", "Ova lekcija govori upravo o njoj.", "Iz lekcije: Slovenija je najrazvijenija država bivše SFRJ."], "objasnjenje": "Slovenija je ekonomski najrazvijenija od bivših republika SFRJ.", "iz_udzbenika": {"strana": 28, "odeljak": "Privreda", "tekst": "Od svih država nastalih iz bivše SFRJ, Slovenija je najrazvijenija."}}, {"id": "drustvo-dopuni-sume", "vrsta": "dopuni", "tezina": "srednje", "pojmovi": ["sumarstvo", "drvna-industrija", "papirna-industrija"], "pitanje": "Dopuni rečenicu rečima iz banke.", "tekst": "Veliki deo Slovenije je pod {{šumom|sumom|šumama}}, pa je važna grana {{šumarstvo|sumarstvo}}; na njemu su se razvile {{drvna}} i papirna industrija.", "ponudjene": ["šumom", "šumarstvo", "drvna", "stepom", "ribolov", "naftna"], "pomoc": ["Pogledaj fotografije iz lekcije — šta pokriva planine i doline?", "Privredna grana koja se bavi šumama zove se po njima; drvo je sirovina za jednu industriju.", "Iz lekcije: šume → šumarstvo → drvna i papirna industrija."], "objasnjenje": "Slovenija je bogata šumama, pa je razvijeno šumarstvo, a na njemu drvna i papirna industrija.", "iz_udzbenika": {"strana": 28, "odeljak": "Privreda", "tekst": "Veliki deo Slovenije je pod šumom; zato je šumarstvo važna grana, a na njemu su se razvile drvna i papirna industrija.", "slika": "08-slovenija/02-sava-dolinka.jpg"}}, {"id": "drustvo-zakljuci-sume", "vrsta": "zakljuci", "tezina": "lako", "pojmovi": ["sumarstvo", "drvna-industrija", "papirna-industrija"], "pitanje": "Kako je bogatstvo šumama povezano sa industrijom Slovenije?", "odgovori": [{"tekst": "Drvo iz šuma je sirovina za drvnu i papirnu industriju.", "tacan": true}, {"tekst": "Šume daju sirovinu za elektroindustriju.", "tacan": false}, {"tekst": "Zbog šuma u Sloveniji nema industrije.", "tacan": false}, {"tekst": "Šume služe samo kao prepreka saobraćaju.", "tacan": false}], "pomoc": ["Korak 1: Šta se dobija iz šume?", "Korak 2: Koje industrije koriste drvo — za nameštaj i za papir?", "Iz lekcije: na šumarstvu su se razvile drvna i papirna industrija."], "objasnjenje": "Velike šume omogućavaju šumarstvo, a drvo je sirovina za drvnu i papirnu industriju.", "iz_udzbenika": {"strana": 28, "odeljak": "Privreda", "tekst": "Na bogatstvu šumama zasnovani su šumarstvo i drvna i papirna industrija."}}, {"id": "drustvo-izbor-industrija", "vrsta": "izbor", "tezina": "tesko", "pojmovi": ["prehrambena-industrija", "elektroindustrija", "drvna-industrija", "papirna-industrija"], "pitanje": "Koje grane industrije udžbenik ističe u Sloveniji? (Više tačnih.)", "odgovori": [{"tekst": "prehrambena industrija", "tacan": true}, {"tekst": "elektroindustrija", "tacan": true}, {"tekst": "drvna industrija", "tacan": true}, {"tekst": "papirna industrija", "tacan": true}, {"tekst": "brodogradnja", "tacan": false}, {"tekst": "naftna industrija", "tacan": false}], "pomoc": ["Dve grane su vezane za šume, a dve su opisane kao napredne.", "Slovenija ima vrlo kratku obalu i nema velikih nalazišta nafte.", "Iz lekcije: drvna i papirna (na šumarstvu), prehrambena i elektroindustrija."], "objasnjenje": "Udžbenik ističe drvnu i papirnu industriju (na osnovu šuma), kao i naprednu prehrambenu i elektroindustriju.", "iz_udzbenika": {"strana": 28, "odeljak": "Privreda", "tekst": "Pored drvne i papirne, napredne su prehrambena industrija i elektroindustrija."}}, {"id": "drustvo-tn-turizam", "vrsta": "tacno_netacno", "tezina": "lako", "pojmovi": ["turizam"], "tvrdnja": "Turizam u Sloveniji je slabo razvijen.", "tacno": false, "ispravke": [{"tekst": "Turizam je vrlo razvijen, zahvaljujući prirodnim i antropogenim vrednostima.", "tacan": true}, {"tekst": "Turizam postoji samo na moru.", "tacan": false}, {"tekst": "Turizam postoji samo u glavnom gradu.", "tacan": false}], "pomoc": ["Seti se Bleda, Postojnske jame i Pirana.", "Turisti dolaze i zbog prirode i zbog onoga što je stvorio čovek.", "Iz lekcije: turizam je vrlo razvijen."], "objasnjenje": "Netačno — turizam je vrlo razvijen, zahvaljujući prirodnim i antropogenim vrednostima (Bled, pećine, Piran, Ljubljana…).", "iz_udzbenika": {"strana": 28, "odeljak": "Privreda", "tekst": "Turizam je u Sloveniji vrlo razvijen zahvaljujući prirodnim i antropogenim vrednostima.", "slika": "08-slovenija/04-bledsko-jezero.jpg"}}, {"id": "drustvo-dopuni-antropogene", "vrsta": "dopuni", "tezina": "tesko", "pojmovi": ["turizam"], "pitanje": "Dopuni rečenicu (bez ponuđenih reči).", "tekst": "Turizam u Sloveniji se zasniva na prirodnim i {{antropogenim}} vrednostima — onima koje je stvorio čovek.", "pomoc": ["Traži stručnu reč za ono što je delo čoveka.", "Reč počinje grčkim „antropos” (čovek).", "Iz lekcije: prirodne i antropogene vrednosti."], "objasnjenje": "Antropogene vrednosti su one koje je stvorio čovek (gradovi, crkve, zamkovi), za razliku od prirodnih (jezera, pećine, planine).", "iz_udzbenika": {"strana": 28, "odeljak": "Privreda", "tekst": "Razvijen turizam Slovenije počiva na prirodnim i antropogenim (stvorenim od čoveka) vrednostima."}}, {"id": "drustvo-povezi-turizam", "vrsta": "povezi", "tezina": "srednje", "pojmovi": ["bled", "postojnska-jama", "piran", "koper", "ljubljana", "turizam"], "pitanje": "Poveži turističko mesto sa opisom.", "parovi": [["Bled", "jezero sa ostrvom i crkvom podno Alpa"], ["Postojnska jama", "najveća pećina, dom čovečje ribice"], ["Piran", "grad na vrhu malog poluostrva na obali"], ["Koper", "važna luka na kratkoj jadranskoj obali"], ["Ljubljana", "glavni grad na reci Ljubljanici"]], "pomoc": ["Dva mesta su na moru — jedno je luka, a drugo na vrhu malog poluostrva.", "Jedno mesto je pod zemljom, a jedno na jezeru u Alpima.", "Iz lekcije: turistička mesta su Ljubljana, Bled, Postojnska jama, Škocjanske jame, Koper, Piran."], "objasnjenje": "Bled — jezero sa ostrvom; Postojnska jama — pećina sa čovečjom ribicom; Piran — na poluostrvu; Koper — luka; Ljubljana — glavni grad na Ljubljanici.", "iz_udzbenika": {"strana": 28, "odeljak": "Privreda", "tekst": "Turistička mesta Slovenije su Ljubljana, Bled, Postojnska jama, Škocjanske jame, Koper, Piran i druga.", "slika": "08-slovenija/04-bledsko-jezero.jpg"}}, {"id": "drustvo-izbor-gradovi", "vrsta": "izbor", "tezina": "srednje", "pojmovi": ["ljubljana", "maribor", "celje", "kranj"], "pitanje": "Koji su najveći gradovi Slovenije? (Više tačnih.)", "odgovori": [{"tekst": "Ljubljana", "tacan": true}, {"tekst": "Maribor", "tacan": true}, {"tekst": "Celje", "tacan": true}, {"tekst": "Kranj", "tacan": true}, {"tekst": "Zagreb", "tacan": false}, {"tekst": "Trst", "tacan": false}], "pomoc": ["Dva ponuđena grada su odmah preko granice, ali nisu u Sloveniji.", "Zagreb je glavni grad Hrvatske, a Trst je italijanska luka.", "Iz lekcije: najveći gradovi su Ljubljana, Maribor, Celje i Kranj."], "objasnjenje": "Najveći gradovi Slovenije su Ljubljana, Maribor, Celje i Kranj. Zagreb je u Hrvatskoj, a Trst u Italiji.", "iz_udzbenika": {"strana": 28, "odeljak": "Gradovi", "tekst": "Najveći gradovi Slovenije su Ljubljana, Maribor, Celje i Kranj; udžbenik traži da se pronađu u atlasu."}}, {"id": "drustvo-povezi-gradovi", "vrsta": "povezi", "tezina": "tesko", "pojmovi": ["maribor", "celje", "kranj", "koper"], "pitanje": "Poveži grad sa njegovim položajem.", "parovi": [["Maribor", "na severoistoku, na Dravi"], ["Celje", "istočno od Ljubljane, na Savinji"], ["Kranj", "severozapadno od Ljubljane, na Savi"], ["Koper", "luka na jadranskoj obali"]], "pomoc": ["Jedan grad je na moru, a jedan je drugi najveći grad, na istoku zemlje.", "Kranj je bliže Alpima, a Celje je na putu od Ljubljane ka Mariboru.", "Iz lekcije: najveći gradovi su Ljubljana, Maribor, Celje i Kranj; Koper je luka."], "objasnjenje": "Maribor — severoistok, na Dravi; Celje — istočno od Ljubljane; Kranj — severozapadno od Ljubljane, na Savi; Koper — luka na Jadranu.", "iz_udzbenika": {"strana": 28, "odeljak": "Gradovi", "tekst": "U atlasu se pronalaze najveći gradovi — Ljubljana u središtu, Maribor na severoistoku, Celje istočno i Kranj severozapadno od Ljubljane."}}, {"id": "drustvo-zakljuci-koper", "vrsta": "zakljuci", "tezina": "srednje", "pojmovi": ["koper", "jadransko-more"], "pitanje": "Slovenija ima samo oko 47 km morske obale. Zašto je za nju Koper ipak veoma važan?", "odgovori": [{"tekst": "Zato što je to važna luka — izlaz slovenačke privrede na more.", "tacan": true}, {"tekst": "Zato što je to glavni grad Slovenije.", "tacan": false}, {"tekst": "Zato što je u njemu najveća pećina.", "tacan": false}, {"tekst": "Zato što leži na Dravi.", "tacan": false}], "pomoc": ["Korak 1: Šta jednoj državi koja ima kratku obalu najviše treba na moru?", "Korak 2: Glavni grad je Ljubljana, a pećine su na Krasu — šta onda ostaje?", "Iz lekcije: iako je obala kratka, Koper je važna luka."], "objasnjenje": "Kratka obala znači da je jedna dobra luka veoma važna — preko Kopra Slovenija trguje morem.", "iz_udzbenika": {"strana": 28, "odeljak": "Privreda", "tekst": "Slovenija ima samo oko 47 km obale, ali je Koper njena važna luka i turističko mesto."}}, {"id": "drustvo-klik-ljubljana", "vrsta": "karta_klik", "tezina": "lako", "pojmovi": ["ljubljana"], "pitanje": "Klikni na kartu — Ljubljana.", "cilj": {"mesto": "ljubljana"}, "pomoc": ["Glavni grad je u središtu države.", "Leži na reci Ljubljanici, između Alpa i Dinarida.", "Iz lekcije: Ljubljana je glavni grad Slovenije."], "objasnjenje": "Ljubljana je u središtu Slovenije, na reci Ljubljanici.", "iz_udzbenika": {"strana": 28, "odeljak": "Gradovi", "tekst": "Ljubljana, glavni grad Slovenije, leži u središtu države, na Ljubljanici.", "slika": "08-slovenija/05-reka-ljubljanica.jpg"}}, {"id": "drustvo-klik-maribor", "vrsta": "karta_klik", "tezina": "srednje", "pojmovi": ["maribor", "drava"], "pitanje": "Klikni na kartu — Maribor." // First answer to an item updates every concept it tests: 3 b → one box up, 2 b → stays (at least
// box 1), less → box 0. A concept is due again after INTERVAL[box] days; box 0 = the very next session.
const INTERVAL = [0, 1, 3, 7, 14], DAY = 864e5;
function learnFrom(z, pts) {
  if (z.generisan) return;
  state.znanje = state.znanje || {};
  for (const p of z.pojmovi || []) {
    const k = state.znanje[p] || { box: 0, n: 0 };
    k.box = pts === 3 ? Math.min(4, (k.n ? k.box : 0) + 1) : pts === 2 ? Math.max(1, k.box) : 0;
    k.n++; k.last = z.vrsta; k.due = Date.now() + INTERVAL[k.box] * DAY;
    state.znanje[p] = k;
  }
}

// ---------- outcome ----------
function fail(z, text, given) {
  const s = st(z.id);
  s.miss++;
  (s.log = s.log || []).push({ v: given || '', ok: false });
  const ended = s.miss > steps(z);
  if (ended) { s.status = helpOn() ? 'revealed' : 'failed'; s.pts = 0; firstTry() && learnFrom(z, 0); if (helpOn()) place(z, false); toast(helpOn() ? 'Evo odgovora' : 'Netačno', false); }
  else toast(text || 'Netačno — pokušaj ponovo', false);
  finishCheck(); save(); renderItem(true); renderNav(); refreshScore();
  if (ended ? s.status === 'revealed' : helpOn() && !mobile()) openDrawer();
}
function succeed(z, given, pts) {   // pts: set only by self-graded `objasni`
  const s = st(z.id);
  s.status = 'ok'; s.pts = pts != null ? pts : ptsFor(s.miss);
  (s.log = s.log || []).push({ v: given || '', ok: true });
  if (firstTry()) learnFrom(z, s.pts);
  s.placed = place(z, true);
  toast('Tačno! +' + s.pts + (s.placed ? ' · na vremenskoj osi' : ''), true);
  finishCheck(); save(); renderItem(false); renderNav(); refreshScore();
  openDrawer();
}
const firstTry = () => !(state.mode === 'test' && att() && att().phase === 'ispravka');   // Ispravka does not change mastery

// ---------- item renderers ----------
const main = document.getElementById('main');
function frame(z, s, inner) {
  const n = numOf(z);
  const pts = isDone(s) ? (s.status === 'ok' ? '✓ ' + s.pts + ' b' : s.status === 'failed' ? '✗ 0 b' : 'otkriveno · 0 b') : (s.miss ? 'sada ' + ptsFor(s.miss) + ' b' : 'do 3 b');
  return '<div class="item"><div class="ihead"><span class="vchip">' + VRSTA_LBL[z.vrsta] + '</span>' + tzBadge(z) + ' ' + TEZ_LBL[z.tezina] + '<span>' + esc(deoNaslov(z)) + ' · zadatak ' + n + ' / ' + curItems().length + '</span><span>' + pts + '</span></div>' +
    inner + '<div class="help-inline" id="helpInline"></div><div class="iactions" id="actions"></div>' +
    (isDone(s) ? '<div class="expl' + (s.status === 'ok' ? '' : ' rev') + '">' + (s.status === 'failed' ? 'Netačno. Odgovor ćeš videti u Ispravci.' : fmt(z.objasnjenje || '')) + '</div>' : '') + '</div>';
}
function actions(btns) {
  const a = document.getElementById('actions');
  a.innerHTML = btns.map(b => '<button type="button" id="' + b[0] + '"' + (b[2] ? ' class="' + b[2] + '"' : '') + '>' + b[1] + '</button>').join('');
}
function nextButton(z) {   // done: Sledeći + reopen the drawer; in progress with help used: reopen the help
  const s = st(z.id), a = document.getElementById('actions');
  if (!isDone(s)) {
    if (s.miss && helpOn() && !CLUES[z.vrsta] && !mobile()) {
      a.insertAdjacentHTML('beforeend', '<button type="button" id="btnHelp">Pomoć</button>');
      document.getElementById('btnHelp').addEventListener('click', openDrawer);
    }
    return;
  }
  a.insertAdjacentHTML('beforeend', '<button type="button" class="ok" id="btnNext">Sledeći ›</button>' +
    (s.status !== 'failed' ? '<button type="button" id="btnMore">' + (z.iz_udzbenika ? 'Iz udžbenika' : 'Saznaj više') + '</button>' : ''));
  document.getElementById('btnNext').addEventListener('click', goNext);
  const m = document.getElementById('btnMore'); if (m) m.addEventListener('click', openDrawer);
}

function prelude(z, s) {   // what stands above the options: a source, a cause→effect chain, the clues so far
  const done = isDone(s), right = z.odgovori && z.odgovori.find(o => o.tacan);
  if (z.vrsta === 'izvor') { const iz = z.izvor;
    return '<div class="src">' + (iz.autor || iz.naslov ? '<p class="who">' + esc([iz.autor, iz.naslov].filter(Boolean).join(' — ')) + '</p>' : '') +
      '<blockquote>' + fmt(iz.tekst) + '</blockquote>' + (iz.napomena ? '<p class="nt">' + fmt(iz.napomena) + '</p>' : '') + '</div>'; }
  if (z.vrsta === 'lanac') return '<div class="chain">' + z.karike.map((k, i) => (i ? '<span class="ar">→</span>' : '') +
    (i === z.praznina ? '<div class="lk q' + (done && s.status !== 'failed' ? ' ok' : '') + '">' + (done && s.status !== 'failed' ? fmt(right.tekst) : '?') + '</div>' : '<div class="lk">' + fmt(k) + '</div>')).join('') + '</div>';
  if (z.vrsta === 'ko_sam') { const n = Math.min(z.tragovi.length, done ? z.tragovi.length : s.miss + 1);
    return '<ul class="clues">' + z.tragovi.slice(0, n).map((t, i) => '<li><span class="k">Trag ' + (i + 1) + '</span>' + fmt(t) + '</li>').join('') + '</ul>'; }
  return '';
}
function renderChoice(z, s) {   // izbor, zakljuci, lanac, izvor, ko_sam (+ the correction step of tacno_netacno)
  const opts = shuffled(z.odgovori, z.id);
  const multi = z.odgovori.filter(o => o.tacan).length > 1;
  const ui = s.ui; ui.wrong = ui.wrong || []; ui.pick = ui.pick || [];
  const done = isDone(s), showRight = s.status === 'ok' || s.status === 'revealed';
  const why = o => o.zasto && (helpOn() || (done && s.status !== 'failed')) ? '<span class="why">' + fmt(o.zasto) + '</span>' : '';
  main.innerHTML = frame(z, s, prelude(z, s) + '<h2 class="q">' + fmt(z.pitanje || (z.vrsta === 'ko_sam' ? 'Ko sam ja?' : 'Koja karika nedostaje?')) + '</h2><div class="opts">' + opts.map(([o, i]) =>
    '<button type="button" class="opt' + (multi ? '' : ' round') + (ui.wrong.includes(i) ? ' wrong' : '') + (showRight && o.tacan ? ' right' : '') +
    (!done && ui.pick.includes(i) ? ' picked' : '') + '" data-i="' + i + '"' + (done || ui.wrong.includes(i) ? ' disabled' : '') + '><span class="box"></span><span><span class="ot">' + fmt(o.tekst) + '</span>' +
    (ui.wrong.includes(i) ? why(o) : '') + '</span></button>').join('') + '</div>');
  if (!done && multi) actions([['btnCheck', 'Proveri', 'ok']]);
  if (!done && z.vrsta === 'ko_sam' && s.miss < steps(z)) { actions([['btnClue', 'Još jedan trag']]); document.getElementById('btnClue').addEventListener('click', () => { ui.why = null; fail(z, 'Novi trag', 'zatražen novi trag'); }); }
  main.querySelectorAll('.opt').forEach(b => b.addEventListener('click', () => {
    const i = +b.dataset.i;
    if (!multi) { if (z.odgovori[i].tacan) succeed(z, z.odgovori[i].tekst); else { ui.wrong.push(i); ui.why = z.odgovori[i].zasto || null; fail(z, undefined, z.odgovori[i].tekst); } return; }
    ui.pick = ui.pick.includes(i) ? ui.pick.filter(x => x !== i) : ui.pick.concat(i);
    b.classList.toggle('picked'); save();
  }));
  const chk = document.getElementById('btnCheck');
  if (chk) chk.addEventListener('click', () => {
    if (!ui.pick.length) { toast('Označi bar jedan odgovor', false); return; }
    const right = z.odgovori.map((o, i) => o.tacan ? i : -1).filter(i => i >= 0);
    const wrongPicked = ui.pick.filter(i => !z.odgovori[i].tacan);
    const given = ui.pick.map(i => z.odgovori[i].tekst).join('; ');
    if (!wrongPicked.length && right.every(i => ui.pick.includes(i))) { succeed(z, given); return; }
    ui.wrong = ui.wrong.concat(wrongPicked); ui.pick = ui.pick.filter(i => z.odgovori[i].tacan);
    ui.why = wrongPicked.map(i => z.odgovori[i].zasto).filter(Boolean).join(' ') || null;
    fail(z, wrongPicked.length ? 'Neki od označenih nisu tačni' : 'Nedostaje još tačnih odgovora', given);
  });
  nextButton(z);
}

function renderTN(z, s) {
  const ui = s.ui, done = isDone(s), showAns = s.status === 'ok' || s.status === 'revealed';
  let inner = '<h2 class="q">Tačno ili netačno?</h2><p class="stmt">' + fmt(z.tvrdnja) + '</p><div class="tn">' +
    [[true, 'Tačno'], [false, 'Netačno']].map(([v, t]) => '<button type="button" data-v="' + v + '" class="' +
      ((showAns || ui.phase === 'fix') && v === z.tacno ? 'right' : (ui.tnWrong === v ? 'wrong' : '')) + '"' + (done || ui.phase === 'fix' || ui.tnWrong === v ? ' disabled' : '') + '>' + t + '</button>').join('') + '</div>';
  if (!z.tacno && (ui.phase === 'fix' || showAns)) {
    ui.wrong = ui.wrong || [];
    inner += '<p class="sub-q">Kako glasi tačno?</p><div class="opts">' + shuffled(z.ispravke, z.id + 'fix').map(([o, i]) =>
      '<button type="button" class="opt round fix' + (ui.wrong.includes(i) ? ' wrong' : '') + (showAns && o.tacan ? ' right' : '') + '" data-i="' + i + '"' +
      (done || ui.wrong.includes(i) ? ' disabled' : '') + '><span class="box"></span><span><span class="ot">' + fmt(o.tekst) + '</span>' + (ui.wrong.includes(i) && o.zasto && (helpOn() || done) ? '<span class="why">' + fmt(o.zasto) + '</span>' : '') + '</span></button>').join('') + '</div>';
  }
  main.innerHTML = frame(z, s, inner);
  main.querySelectorAll('.tn button').forEach(b => b.addEventListener('click', () => {
    const v = b.dataset.v === 'true';
    if (v !== z.tacno) {   // a binary guess: a wrong one on a true statement leaves nothing to find → revealed;
      ui.tnWrong = v;       // on a false one the pupil still has to find the correction
      if (z.tacno) st(z.id).miss = steps(z); else ui.phase = 'fix';
      fail(z, undefined, v ? 'Tačno' : 'Netačno'); return;
    }
    if (z.tacno) { succeed(z, 'Tačno'); return; }
    st(z.id).log.push({ v: 'Netačno', ok: true });
    ui.phase = 'fix'; save(); renderItem(false); toast('Tačno — sad je ispravi', true);
  }));
  main.querySelectorAll('.opt.fix').forEach(b => b.addEventListener('click', () => {
    const i = +b.dataset.i;
    if (z.ispravke[i].tacan) succeed(z, 'ispravka: ' + z.ispravke[i].tekst); else { ui.wrong.push(i); ui.why = z.ispravke[i].zasto || null; fail(z, undefined, 'ispravka: ' + z.ispravke[i].tekst); }
  }));
  nextButton(z);
}

function parseCloze(t) {   // → [text, {answers}, text, …]
  const parts = []; let last = 0;
  t.replace(/\{\{(.+?)\}\}/g, (m, inner, at) => { parts.push(t.slice(last, at)); parts.push({ answers: inner.split('|') }); last = at + m.length; return m; });
  parts.push(t.slice(last));
  return parts;
}
function renderCloze(z, s) {
  const ui = s.ui; ui.val = ui.val || {}; ui.lock = ui.lock || {};
  const parts = parseCloze(z.tekst), blanks = parts.filter(p => typeof p === 'object');
  const done = isDone(s), bank = z.ponudjene && z.ponudjene.length;
  if (ui.cur == null || ui.lock[ui.cur]) ui.cur = blanks.findIndex((_, i) => !ui.lock[i]);
  let bi = -1;
  const html = parts.map(p => {
    if (typeof p === 'string') return fmt(p);
    bi++;
    const val = done && !ui.lock[bi] ? p.answers[0] : (ui.val[bi] || '');
    const cls = 'blank' + (ui.lock[bi] ? ' lock' : '') + (done && !ui.lock[bi] ? ' rev' : '') + (!done && ui.bad && ui.bad.includes(bi) ? ' bad' : '') + (!done && !bank && false ? '' : '') + (!done && bi === ui.cur && bank ? ' cur' : '');
    return bank || done || ui.lock[bi] ? '<button type="button" class="' + cls + '" data-b="' + bi + '"' + (done || ui.lock[bi] ? ' disabled' : '') + '>' + (esc(val) || '&nbsp;') + '</button>'
      : '<input class="' + cls + '" data-b="' + bi + '" value="' + esc(val) + '" autocomplete="off" spellcheck="false">';
  }).join('');
  const used = Object.values(ui.val);
  main.innerHTML = frame(z, s, '<h2 class="q">' + fmt(z.pitanje || 'Dopuni rečenicu.') + '</h2><div class="cloze">' + html + '</div>' +
    (bank && !done ? '<div class="bank">' + z.ponudjene.map(w => '<button type="button"' + (used.includes(w) ? ' class="used"' : '') + ' data-w="' + esc(w) + '">' + esc(w) + '</button>').join('') + '</div>' : ''));
  if (!done) actions([['btnCheck', 'Proveri', 'ok']]);
  main.querySelectorAll('button.blank').forEach(b => b.addEventListener('click', () => { const i = +b.dataset.b; if (ui.val[i]) delete ui.val[i]; ui.cur = i; ui.bad = []; save(); renderItem(false); }));
  main.querySelectorAll('input.blank').forEach(inp => {
    inp.addEventListener('input', () => { ui.val[+inp.dataset.b] = inp.value; save(); });
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('btnCheck').click(); });
  });
  main.querySelectorAll('.bank button').forEach(b => b.addEventListener('click', () => {
    let i = ui.cur; if (i == null || i < 0 || ui.lock[i] || ui.val[i]) i = blanks.findIndex((_, k) => !ui.lock[k] && !ui.val[k]);
    if (i < 0) return;
    ui.val[i] = b.dataset.w; ui.bad = [];
    ui.cur = blanks.findIndex((_, k) => !ui.lock[k] && !ui.val[k]);
    save(); renderItem(false);
  }));
  const chk = document.getElementById('btnCheck');
  if (chk) chk.addEventListener('click', () => {
    const open = blanks.map((_, i) => i).filter(i => !ui.lock[i]);
    if (open.some(i => !norm(ui.val[i]))) { toast('Popuni sve praznine', false); return; }
    ui.bad = [];
    const given = open.map(i => ui.val[i]).join(' / ');
    for (const i of open) { if (blanks[i].answers.map(norm).includes(norm(ui.val[i]))) ui.lock[i] = true; else { ui.bad.push(i); delete ui.val[i]; } }
    if (!ui.bad.length) succeed(z, given); else fail(z, ui.bad.length === 1 ? 'Jedna praznina nije tačna' : 'Neke praznine nisu tačne', given);
  });
  nextButton(z);
}

function renderMatch(z, s) {
  const ui = s.ui; ui.done = ui.done || [];
  const done = isDone(s), right = shuffled(z.parovi.map(p => p[1]), z.id);
  const num = i => ui.done.indexOf(i) + 1;
  main.innerHTML = frame(z, s, '<h2 class="q">' + fmt(z.pitanje) + '</h2><div class="match"><div class="col">' +
    z.parovi.map((p, i) => { const m = ui.done.includes(i), rv = done && !m;
      return '<button type="button" class="mcell L' + (m ? ' done' : rv ? ' rev' : '') + (ui.left === i && !done ? ' cur' : '') + '" data-i="' + i + '"' + (m || done ? ' disabled' : '') + '>' +
        (m || rv ? '<span class="n">' + (m ? num(i) : '→') + '</span>' : '') + fmt(p[0]) + '</button>'; }).join('') +
    '</div><div class="col">' + right.map(([t, i]) => { const m = ui.done.includes(i), rv = done && !m;
      return '<button type="button" class="mcell R' + (m ? ' done' : rv ? ' rev' : '') + '" data-i="' + i + '"' + (m || done ? ' disabled' : '') + '>' +
        (m ? '<span class="n">' + num(i) + '</span>' : rv ? '<span class="n">←</span>' : '') + fmt(t) + (rv ? ' <small>(' + esc(z.parovi[i][0]) + ')</small>' : '') + '</button>'; }).join('') + '</div></div>');
  main.querySelectorAll('.mcell.L').forEach(b => b.addEventListener('click', () => { ui.left = +b.dataset.i; save(); renderItem(false); }));
  main.querySelectorAll('.mcell.R').forEach(b => b.addEventListener('click', () => {
    if (ui.left == null) { toast('Prvo klikni pojam levo', false); return; }
    const i = +b.dataset.i, pair = z.parovi[ui.left][0] + ' → ' + z.parovi[i][1];
    if (i === ui.left) { ui.done.push(i); ui.left = null; if (ui.done.length === z.parovi.length) succeed(z, pair); else { st(z.id).log.push({ v: pair, ok: true }); save(); renderItem(false); } }
    else { b.classList.add('bad'); ui.left = null; setTimeout(() => fail(z, 'Nisu par', pair), 280); }
  }));
  nextButton(z);
}

// ---------- history: datum, poredjaj, uporedi, objasni ----------
// `oznaka` = how the book dates an event it gives no years for ("kraj XVIII veka"): shown instead of the
// (approximate) years, which only place it on the axis.
const fmtY = y => y < 0 ? -y + ' pre n. e.' : String(y);   // years before the common era are negative in the data
const yrSpan = (a, b) => b == null ? fmtY(a) : a < 0 && b < 0 ? -a + '–' + fmtY(b) : fmtY(a) + '–' + fmtY(b);
const yrs = z => z.oznaka ? z.oznaka : z.godina != null ? fmtY(z.godina) : yrSpan(z.od, z.do);
function renderDate(z, s) {   // one year (`godina`) or a range (`od`, `do`), ± `tolerancija` years
  const ui = s.ui, done = isDone(s), range = z.godina == null && z.do != null, tol = z.tolerancija || 0;
  ui.v = ui.v || {};
  const want = range ? { od: z.od, do: z.do } : { od: z.godina != null ? z.godina : z.od };
  const bce = Object.values(want).some(y => y < 0);   // the era is then part of the answer: chosen per field
  ui.era = ui.era || {};
  const eraOf = k => done && s.status !== 'failed' ? (want[k] < 0 ? 'pre' : 'ne') : (ui.era[k] || 'pre');
  const field = (k, ph) => '<input inputmode="numeric" data-k="' + k + '" placeholder="' + ph + '" value="' + esc(done && s.status !== 'failed' ? Math.abs(want[k]) : (ui.v[k] || '')) + '"' +
    (done ? ' disabled' : '') + (ui.bad && ui.bad.includes(k) ? ' class="bad"' : '') + '>' +
    (bce ? '<select data-era="' + k + '" aria-label="Era"' + (done ? ' disabled' : '') + '><option value="pre"' + (eraOf(k) === 'pre' ? ' selected' : '') + '>pre n. e.</option><option value="ne"' + (eraOf(k) === 'ne' ? ' selected' : '') + '>n. e.</option></select>' : '');
  const val = k => bce && (ui.era[k] || 'pre') === 'pre' ? -ui.v[k] : +ui.v[k];
  main.innerHTML = frame(z, s, '<h2 class="q">' + fmt(z.pitanje || 'Kada?') + '</h2><p class="ev">' + fmt(z.dogadjaj) + '</p>' +
    '<div class="dt">' + (range ? field('od', 'od') + '<span>–</span>' + field('do', 'do') : field('od', 'godina')) + '</div>');
  if (!done) actions([['btnCheck', 'Proveri', 'ok']]);
  main.querySelectorAll('.dt select').forEach(sel => sel.addEventListener('change', () => { ui.era[sel.dataset.era] = sel.value; save(); }));
  main.querySelectorAll('.dt input').forEach(inp => {
    inp.addEventListener('input', () => { ui.v[inp.dataset.k] = inp.value.replace(/[^0-9]/g, ''); save(); });
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('btnCheck').click(); });
  });
  const chk = document.getElementById('btnCheck');
  if (chk) chk.addEventListener('click', () => {
    const ks = Object.keys(want);
    if (ks.some(k => !ui.v[k])) { toast('Upiši godinu', false); return; }
    const given = ks.map(k => fmtY(val(k))).join('–');
    ui.bad = ks.filter(k => Math.abs(val(k) - want[k]) > tol);
    if (!ui.bad.length) { succeed(z, given); return; }
    const k = ui.bad[0], d = val(k) - want[k];
    let msg = 'Netačno';
    if (helpOn()) msg = (range ? (k === 'od' ? 'Početak: ' : 'Kraj: ') : '') + (d < 0 ? 'kasnije' : 'ranije') + (Math.abs(d) <= 10 ? ' — blizu si (do 10 godina)' : Math.abs(d) <= 50 ? ' (manje od 50 godina)' : ' — pogrešan vek?');
    ui.why = helpOn() ? 'Tvoj odgovor ' + given + ': ' + msg + '.' : null;
    fail(z, msg, given);
  });
  nextButton(z);
}
function renderOrder(z, s) {   // stavke are authored in the right order; the pupil fills slots 1…n
  const ui = s.ui, n = z.stavke.length, done = isDone(s);
  ui.seq = ui.seq || Array(n).fill(null); ui.lock = ui.lock || {};
  const pool = shuffled(z.stavke, z.id).filter(([, i]) => !ui.seq.includes(i));
