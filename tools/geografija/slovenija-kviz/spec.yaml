# Republika Slovenija — kviz po lekciji (tip: lesson-quiz; vidi templates/lesson-quiz/README.md).
# Pitanja su napisana sopstvenim rečima na osnovu lekcije „Republika Slovenija” (7. razred, str. 27–29).
# `iz_udzbenika` (posle odgovora, u fioci): strana, odeljak, sažetak sopstvenim rečima i slika iz
# privatnog tools/geografija/_source/slike-7/ (prikazuje se samo kad taj folder postoji — van git-a).
title: Republika Slovenija — kviz
title_short: Slovenija
locale: sr
nivo: osnovna
razred: 7
lekcije: [8]
description: >-
  Kviz za lekciju Republika Slovenija: položaj, reljef i kras, klima i reke, stanovništvo, privreda i
  gradovi, uz mnogo zadataka na karti (klikni mesto, „Gde sam?”). Posle svake greške u fioci desno
  stiže sledeći stepenik pomoći.

karta:
  # Slovenija je mala, pa je okvir tesan: Slovenija sa delovima Italije, Austrije, Mađarske i Hrvatske.
  extent: {lon: [12.5, 17.5], lat: [44.8, 47.2]}
  mid_lat_for_aspect: 46
  geo_data: ../../../shared/data/countries.geojson
  drzave:
    SVN: Slovenija
    ITA: Italija
    AUT: Austrija
    HUN: Mađarska
    HRV: Hrvatska
  # Tačke za zadatke kojima je cilj mesto. Ne crtaju se dok se ne pogode. Poluprečnici su manji
  # nego na karti regije, jer je cela Slovenija široka samo oko 250 km.
  mesta:
    ljubljana: {naziv: Ljubljana, lat: 46.06, lon: 14.51, radius_km: 25}
    maribor: {naziv: Maribor, lat: 46.56, lon: 15.65, radius_km: 20}
    celje: {naziv: Celje, lat: 46.23, lon: 15.26, radius_km: 15}
    kranj: {naziv: Kranj, lat: 46.24, lon: 14.36, radius_km: 12}
    koper: {naziv: Koper, lat: 45.55, lon: 13.73, radius_km: 12}
    piran: {naziv: Piran, lat: 45.53, lon: 13.57, radius_km: 8}
    bled: {naziv: Bled i Bledsko jezero, lat: 46.365, lon: 14.10, radius_km: 10}
    julijski-alpi: {naziv: Julijski Alpi, lat: 46.35, lon: 13.85, radius_km: 35}
    triglav: {naziv: Triglav, lat: 46.38, lon: 13.84, radius_km: 10}
    panonski-deo: {naziv: Panonska nizija (slovenački deo), lat: 46.60, lon: 16.10, radius_km: 35}
    jadranska-obala: {naziv: Jadranska obala Slovenije (Tršćanski zaliv), lat: 45.55, lon: 13.65, radius_km: 18}
