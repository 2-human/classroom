# Banka zadataka — Republika Slovenija (7. razred, str. 27–29). Spaja se u spec.yaml: `delovi` zamenjuje
# spec-ove delove, `mesta` se dodaju u karta.mesta. Svaki zadatak ima `tezina` (lako | srednje | tesko).
# Pitanja su napisana sopstvenim rečima na osnovu beleške lekcije. Sva mesta su u spec.yaml.

mesta: {}

delovi:
  - naslov: Položaj i osnovni podaci
    zadaci:
      - id: polozaj-izbor-najseverija
        vrsta: izbor
        tezina: lako
        pojmovi: [slovenija, balkansko-poluostrvo]
        pitanje: Koja je najsevernija država Balkanskog poluostrva?
        odgovori:
          - {tekst: Slovenija, tacan: true}
          - {tekst: Grčka, tacan: false}
          - {tekst: Albanija, tacan: false}
          - {tekst: Severna Makedonija, tacan: false}
        pomoc:
          - Traži državu na samom severozapadu Balkana, uz Alpe.
          - Grčka je na krajnjem jugu poluostrva, a Albanija i Severna Makedonija su takođe na jugu.
          - "Iz lekcije: Slovenija je najsevernija država Balkanskog poluostrva."
        objasnjenje: Slovenija je najsevernija država Balkanskog poluostrva — leži uz Alpe, na njegovom severozapadu.
        iz_udzbenika:
          strana: 27
          odeljak: Položaj
          tekst: Slovenija zauzima najseverniji deo Balkanskog poluostrva. Na karti je obojena između Alpa, Italije i Panonske nizije, uz sam Jadran.
          slika: 08-slovenija/01-osnovni-podaci.jpg

      - id: polozaj-tn-glavni-grad
        vrsta: tacno_netacno
        tezina: lako
        pojmovi: [ljubljana, slovenija]
        tvrdnja: Glavni grad Slovenije je Ljubljana.
        tacno: true
        pomoc:
          - Glavni grad nosi ime po reci koja kroz njega teče.
          - Taj grad je u središtu države.
          - "Iz lekcije: glavni grad Slovenije je Ljubljana."
        objasnjenje: Tačno — Ljubljana je glavni grad Slovenije; leži u središtu države, na reci Ljubljanici.
        iz_udzbenika:
          strana: 27
          odeljak: Osnovni podaci
          tekst: U infografici su četiri podatka o Sloveniji — oko 2,1 milion stanovnika, površina 20.273 km², glavni grad Ljubljana i službeni jezik slovenački.
          slika: 08-slovenija/01-osnovni-podaci.jpg

      - id: polozaj-dopuni-podaci
        vrsta: dopuni
        tezina: lako
        pojmovi: [slovenija, ljubljana]
        pitanje: Dopuni rečenicu rečima iz banke.
        tekst: "Slovenija ima oko {{2,1|2.1}} miliona stanovnika, glavni grad joj je {{Ljubljana}}, a službeni jezik je {{slovenački|slovenacki}}."
        ponudjene: ["2,1", Ljubljana, slovenački, "7", Zagreb, hrvatski]
        pomoc:
          - Slovenija je mala država — stanovnika ima samo nešto više od dva miliona.
          - Zagreb i hrvatski jezik pripadaju susednoj Hrvatskoj.
          - "Iz lekcije: 2,1 milion stanovnika, glavni grad Ljubljana, jezik slovenački."
        objasnjenje: Slovenija ima oko 2,1 milion stanovnika, glavni grad je Ljubljana, a službeni jezik slovenački.
        iz_udzbenika:
          strana: 27
          odeljak: Osnovni podaci
          tekst: Infografika daje osnovne podatke — 2,1 milion stanovnika, 20.273 km², glavni grad Ljubljana, službeni jezik slovenački.
          slika: 08-slovenija/01-osnovni-podaci.jpg

      - id: polozaj-izbor-povrsina
        vrsta: izbor
        tezina: srednje
        pojmovi: [slovenija]
        pitanje: Kolika je površina Slovenije?
        odgovori:
          - {tekst: "20.273 km²", tacan: true}
          - {tekst: "2.027 km²", tacan: false}
          - {tekst: "202.730 km²", tacan: false}
          - {tekst: "56.594 km²", tacan: false}
        pomoc:
          - Slovenija je mala država — znatno manja od Srbije i Hrvatske.
          - Broj je nešto veći od dvadeset hiljada.
          - "Iz lekcije: površina Slovenije je 20.273 km²."
        objasnjenje: Slovenija ima 20.273 km² — oko dvadeset hiljada kvadratnih kilometara, što je čini malom državom.
        iz_udzbenika:
          strana: 27
          odeljak: Osnovni podaci
          tekst: Po infografici, Slovenija ima površinu od 20.273 km² i oko 2,1 milion stanovnika.
          slika: 08-slovenija/01-osnovni-podaci.jpg

      - id: polozaj-tn-stanovnici
        vrsta: tacno_netacno
        tezina: srednje
        pojmovi: [slovenija]
        tvrdnja: Slovenija ima oko 7 miliona stanovnika.
        tacno: false
        ispravke:
          - {tekst: "Ima oko 2,1 milion stanovnika.", tacan: true}
          - {tekst: "Ima oko 21 milion stanovnika.", tacan: false}
          - {tekst: "Ima oko 210 hiljada stanovnika.", tacan: false}
        pomoc:
          - Slovenija je jedna od najmanjih država bivše SFRJ — razmisli da li je to mnogo ili malo ljudi.
          - Broj je malo veći od dva miliona.
          - "Iz lekcije: Slovenija ima 2,1 milion stanovnika."
        objasnjenje: Netačno — Slovenija ima oko 2,1 milion stanovnika.
        iz_udzbenika:
          strana: 27
          odeljak: Osnovni podaci
          tekst: Infografika navodi da u Sloveniji živi oko 2,1 milion stanovnika.
          slika: 08-slovenija/01-osnovni-podaci.jpg

      - id: polozaj-tn-zastava
        vrsta: tacno_netacno
        tezina: srednje
        pojmovi: [triglav, slovenija]
        tvrdnja: Na grbu, pa i na zastavi Slovenije, prikazan je vrh Triglav.
        tacno: true
        pomoc:
          - Na grbu je beli vrh sa tri šiljka iznad talasastih linija.
          - Koji vrh je najpoznatiji simbol Slovenije?
          - "Iz lekcije: Triglav je prikazan na grbu, pa i na zastavi Slovenije."
        objasnjenje: Tačno — na grbu na belo-plavo-crvenoj zastavi je stilizovani Triglav sa tri šiljka.
        iz_udzbenika:
          strana: 27
          odeljak: Osnovni podaci
          tekst: Iznad karte je zastava Slovenije — belo-plavo-crvena, sa grbom na kome je Triglav.
          slika: 08-slovenija/01-osnovni-podaci.jpg

      - id: polozaj-izbor-cetiri-zemlje
        vrsta: izbor
        tezina: lako
        pojmovi: [balkansko-poluostrvo, panonska-nizija, alpi, jadransko-more]
        pitanje: Po položaju je Slovenija istovremeno … zemlja. (Više tačnih.)
        odgovori:
          - {tekst: balkanska, tacan: true}
          - {tekst: panonska, tacan: true}
          - {tekst: alpska, tacan: true}
          - {tekst: primorska, tacan: true}
          - {tekst: pirinejska, tacan: false}
          - {tekst: karpatska, tacan: false}
        pomoc:
          - Pogledaj šta je u Sloveniji na severozapadu, na istoku, na zapadu i na jugozapadu.
          - Tačne su četiri osobine; Pirineji su u Španiji, a Karpati daleko na istoku.
          - "Iz lekcije: Slovenija je balkanska, panonska, alpska i primorska zemlja."
        objasnjenje: Slovenija je balkanska (Dinaridi), panonska (istok u Panonskoj niziji), alpska (Julijski Alpi) i primorska (izlaz na Jadran).
        iz_udzbenika:
          strana: 27
          odeljak: Položaj
          tekst: Udžbenik ističe da je Slovenija po položaju istovremeno balkanska, panonska, alpska i primorska zemlja i traži da se objasni zašto.

      - id: polozaj-povezi-cetiri
        vrsta: povezi
        tezina: srednje
        pojmovi: [balkansko-poluostrvo, panonska-nizija, alpi, jadransko-more]
        pitanje: Poveži osobinu Slovenije sa delom njene teritorije koji je objašnjava.
        parovi:
          - [alpska zemlja, "severozapad je u Alpima (Julijski Alpi)"]
          - [panonska zemlja, istočni deo pripada Panonskoj niziji]
          - [primorska zemlja, na jugozapadu izlazi na Jadransko more]
          - [balkanska zemlja, "zapadni deo zauzimaju Dinaridi, na Balkanskom poluostrvu"]
        pomoc:
          - Svaka osobina dolazi od jedne velike celine — planina, nizije ili mora.
          - Panonska nizija je na istoku, Alpi na severozapadu.
          - "Iz lekcije: Alpi na severozapadu, Dinaridi na zapadu, Panonska nizija na istoku, Jadran na jugozapadu."
        objasnjenje: Alpska — Julijski Alpi; panonska — istok u Panonskoj niziji; primorska — jadranska obala; balkanska — Dinaridi, deo Balkanskog poluostrva.
        iz_udzbenika:
          strana: 27
          odeljak: Položaj
          tekst: Deo Slovenije je na Balkanskom poluostrvu (Dinaridi), istok pripada Panonskoj niziji, severozapad zauzimaju Alpi, a na jugozapadu izlazi na Jadransko more.

      - id: polozaj-zakljuci-panonska
        vrsta: zakljuci
        tezina: srednje
        pojmovi: [panonska-nizija, slovenija]
        pitanje: Učenik kaže da je Slovenija i „panonska zemlja”. Koji podatak to potvrđuje?
        odgovori:
          - {tekst: "Njen istočni deo je ravnica koja pripada Panonskoj niziji.", tacan: true}
          - {tekst: "Na severozapadu se uzdižu Julijski Alpi.", tacan: false}
          - {tekst: "Na jugozapadu izlazi na Jadransko more.", tacan: false}
          - {tekst: "U Postojnskoj jami živi čovečja ribica.", tacan: false}
        pomoc:
          - "Korak 1: Panonska nizija je velika ravnica — u kom delu Slovenije je teren najniži?"
          - "Korak 2: Ostali odgovori su tačni podaci, ali objašnjavaju druge osobine (alpska, primorska)."
          - "Iz lekcije: idući ka istoku teren se spušta u ravnicu — deo Panonske nizije."
        objasnjenje: Slovenija je panonska zemlja jer njen istočni, ravničarski deo pripada Panonskoj niziji.
        iz_udzbenika:
          strana: 27
          odeljak: Položaj
          tekst: Istočni deo Slovenije pripada Panonskoj niziji, pa je ona i panonska zemlja.

      - id: polozaj-zakljuci-primorska
        vrsta: zakljuci
        tezina: srednje
        pojmovi: [jadransko-more, slovenija]
        pitanje: Slovenija ima samo oko 47 km morske obale. Zašto je ipak nazivamo i primorskom zemljom?
        odgovori:
          - {tekst: "Zato što na krajnjem jugozapadu izlazi na Jadransko more, makar kratkom obalom.", tacan: true}
          - {tekst: "Zato što sve njene reke teku ka Jadranskom moru.", tacan: false}
          - {tekst: "Zato što u celoj zemlji vlada sredozemna klima.", tacan: false}
          - {tekst: "Zato što ima mnogo velikih ostrva.", tacan: false}
        pomoc:
          - "Korak 1: Šta je potrebno da bi država bila primorska — duga obala ili bilo kakav izlaz na more?"
          - "Korak 2: Proveri ostale tvrdnje — Sava i Drava teku ka Crnom moru, a sredozemna klima je samo na obali."
          - "Iz lekcije: krajnji jugozapad Slovenije izlazi na Jadransko more."
        objasnjenje: Za primorsku zemlju dovoljan je izlaz na more — Slovenija ga ima na jugozapadu, kod Kopra i Pirana.
        iz_udzbenika:
          strana: 27
          odeljak: Položaj
          tekst: Na krajnjem jugozapadu Slovenija izlazi na Jadransko more. Obala je kratka (oko 47 km), ali na njoj je važna luka Koper.

      - id: polozaj-dopuni-jezik
        vrsta: dopuni
        tezina: tesko
        pojmovi: [slovenija, balkansko-poluostrvo]
        pitanje: Dopuni rečenicu (bez ponuđenih reči).
        tekst: "Slovenija je {{najsevernija}} država Balkanskog poluostrva; ima površinu od {{20.273|20273}} km², a službeni jezik je {{slovenački|slovenacki}}."
        pomoc:
          - Ova država leži na samom vrhu poluostrva, uz Alpe.
          - Površina je nešto veća od dvadeset hiljada km²; jezik nosi ime po narodu.
          - "Iz lekcije: najsevernija država Balkana, 20.273 km², službeni jezik slovenački."
        objasnjenje: Slovenija je najsevernija država Balkanskog poluostrva, ima 20.273 km² i službeni jezik slovenački.
        iz_udzbenika:
          strana: 27
          odeljak: Položaj i osnovni podaci
          tekst: Slovenija je najsevernija balkanska država, površine 20.273 km², sa slovenačkim kao službenim jezikom.
          slika: 08-slovenija/01-osnovni-podaci.jpg

      - id: polozaj-klik-slovenija
        vrsta: karta_klik
        tezina: lako
        pojmovi: [slovenija]
        pitanje: Klikni na kartu — Slovenija.
        cilj: {drzava: SVN}
        pomoc:
          - Slovenija je u sredini ove karte.
          - Graniči se sa Italijom na zapadu, Austrijom na severu, Mađarskom na istoku i Hrvatskom na jugu.
          - "Iz lekcije: Slovenija je najsevernija država Balkana, sa kratkim izlazom na Jadran."
        objasnjenje: Slovenija je između Italije, Austrije, Mađarske i Hrvatske, sa kratkom obalom Jadrana na jugozapadu.
        iz_udzbenika:
          strana: 27
          odeljak: Položaj
          tekst: Na isečku karte Evrope Slovenija je obojena crveno — na severozapadu Balkana, između Alpa, Italije i Panonske nizije.
          slika: 08-slovenija/01-osnovni-podaci.jpg

      - id: polozaj-klik-madjarska
        vrsta: karta_klik
        tezina: srednje
        pojmovi: [panonska-nizija, madjarska]
        pitanje: Slovenački deo Panonske nizije nastavlja se u susednu državu na istoku. Klikni je.
        cilj: {drzava: HUN}
        pomoc:
          - Traži suseda Slovenije na istoku, a ne na severu ili jugu.
          - Na severu je Austrija (Alpi), na jugu Hrvatska; istočni sused je ravničarska zemlja.
          - "Iz lekcije: Slovenija se graniči sa Italijom, Austrijom, Mađarskom i Hrvatskom; istok je panonski."
        objasnjenje: Istočni sused Slovenije je Mađarska — panonska ravnica se iz Slovenije nastavlja u nju.
        iz_udzbenika:
          strana: 27
          odeljak: Položaj
          tekst: Istočni deo Slovenije je deo Panonske nizije, koja se nastavlja ka susednoj Mađarskoj.

      - id: polozaj-klik-jadran
        vrsta: karta_klik
        tezina: srednje
        pojmovi: [jadransko-more, slovenija]
        pitanje: Klikni na kartu — mesto gde Slovenija izlazi na Jadransko more.
        cilj: {mesto: jadranska-obala}
        pomoc:
          - Obala je na krajnjem jugozapadu Slovenije.
          - Traži mali zaliv između Italije i hrvatske Istre.
          - "Iz lekcije: krajnji jugozapad Slovenije izlazi na Jadransko more (Tršćanski zaliv)."
        objasnjenje: Slovenija izlazi na Jadran na krajnjem jugozapadu, u Tršćanskom zalivu — tu su Koper i Piran.
        iz_udzbenika:
          strana: 27
          odeljak: Reljef
          tekst: Krajnji jugozapad Slovenije izlazi na Jadransko more; obala je kratka, oko 47 km.

      - id: polozaj-gde-slovenija
        vrsta: gde_sam
        tezina: lako
        pojmovi: [slovenija]
        pitanje: Gde sam? Pročitaj trag i klikni državu na karti.
        cilj: {drzava: SVN}
        tragovi:
          - Na mojoj zastavi je planinski vrh sa tri šiljka.
          - Moj glavni grad je Ljubljana.
          - Imam Alpe na severozapadu, ravnicu na istoku i kratku obalu Jadrana.
          - Ja sam najsevernija država Balkanskog poluostrva.
        objasnjenje: Slovenija — najsevernija država Balkana, sa Ljubljanom kao glavnim gradom i Triglavom na zastavi.
        iz_udzbenika:
          strana: 27
          odeljak: Položaj
          tekst: Slovenija je najsevernija država Balkanskog poluostrva i istovremeno balkanska, panonska, alpska i primorska zemlja.
          slika: 08-slovenija/01-osnovni-podaci.jpg

  - naslov: Reljef i kras
    zadaci:
      - id: reljef-izbor-triglav
        vrsta: izbor
        tezina: lako
        pojmovi: [triglav, julijski-alpi]
        pitanje: Koji je najviši vrh Slovenije?
        odgovori:
          - {tekst: Triglav, tacan: true}
          - {tekst: Mont Blan, tacan: false}
          - {tekst: Midžor, tacan: false}
          - {tekst: Bobotov kuk, tacan: false}
        pomoc:
          - Vrh je u Julijskim Alpima i nalazi se i na zastavi Slovenije.
          - Ime mu govori da ima „tri glave” (tri šiljka).
          - "Iz lekcije: najviši vrh Slovenije je Triglav (2.864 m)."
        objasnjenje: Triglav (2.864 m) u Julijskim Alpima je najviši vrh Slovenije. Mont Blan je u Alpima Francuske i Italije, Midžor u Srbiji, a Bobotov kuk u Crnoj Gori.
        iz_udzbenika:
          strana: 28
          odeljak: Reljef
          tekst: Severozapad Slovenije zauzimaju Julijski Alpi; na njima je najviši vrh države, Triglav, visok 2.864 m.
          slika: 08-slovenija/03-julijski-alpi-bohinjsko-jezero.jpg

      - id: reljef-dopuni-triglav
        vrsta: dopuni
        tezina: lako
        pojmovi: [triglav, julijski-alpi]
        pitanje: Dopuni rečenicu rečima iz banke.
        tekst: "Najviši vrh Slovenije je {{Triglav}}, a nalazi se u {{Julijskim Alpima|Julijski Alpi}}."
        ponudjene: [Triglav, Julijskim Alpima, Dinaridima, Midžor]
        pomoc:
          - Vrh ima „tri glave” i nalazi se na zastavi.
          - Najviše planine Slovenije su na severozapadu i pripadaju Alpima.
          - "Iz lekcije: Triglav (2.864 m) je u Julijskim Alpima."
        objasnjenje: Triglav je najviši vrh Slovenije i nalazi se u Julijskim Alpima, na severozapadu države.
        iz_udzbenika:
          strana: 28
          odeljak: Reljef
          tekst: Julijski Alpi su na severozapadu Slovenije, a na njima je Triglav, najviši vrh države.
          slika: 08-slovenija/03-julijski-alpi-bohinjsko-jezero.jpg

      - id: reljef-tn-visina
        vrsta: tacno_netacno
        tezina: srednje
        pojmovi: [triglav]
        tvrdnja: Triglav je visok 2.864 m.
        tacno: true
        pomoc:
          - Triglav je visok alpski vrh — viši od svih vrhova Srbije.
          - Visina je između 2.800 i 2.900 m.
          - "Iz lekcije: Triglav je visok 2.864 m."
        objasnjenje: Tačno — Triglav, najviši vrh Slovenije, visok je 2.864 m.
        iz_udzbenika:
          strana: 28
          odeljak: Reljef
          tekst: Na fotografiji Bohinjskog jezera u pozadini su Julijski Alpi; natpis navodi Triglav, visok 2.864 m, kao najviši vrh Slovenije.
          slika: 08-slovenija/03-julijski-alpi-bohinjsko-jezero.jpg

      - id: reljef-povezi-delovi
        vrsta: povezi
        tezina: lako
        pojmovi: [julijski-alpi, dinarske-planine, panonska-nizija, jadransko-more]
        pitanje: Poveži deo Slovenije sa onim što se tamo nalazi.
        parovi:
          - [severozapad, Julijski Alpi]
          - [zapad, Dinaridi]
          - [istok, deo Panonske nizije]
          - [krajnji jugozapad, Jadransko more]
        pomoc:
          - Najviše planine su uz granicu sa Italijom i Austrijom, a ravnica uz Mađarsku.
          - More je u jugozapadnom uglu države.
          - "Iz lekcije: severozapad — Julijski Alpi; zapad — Dinaridi; istok — Panonska nizija; jugozapad — Jadran."
        objasnjenje: Julijski Alpi su na severozapadu, Dinaridi na zapadu, Panonska nizija na istoku, a Jadransko more na krajnjem jugozapadu.
        iz_udzbenika:
          strana: 27
          odeljak: Reljef
          tekst: Reljef Slovenije je veoma raznovrstan — Julijski Alpi na severozapadu, Dinaridi na zapadu, ravnica Panonske nizije na istoku i izlaz na Jadran na jugozapadu.

      - id: reljef-zakljuci-istok
        vrsta: zakljuci
        tezina: srednje
        pojmovi: [julijski-alpi, panonska-nizija]
        pitanje: Putuješ kroz Sloveniju od Julijskih Alpa ka istoku, prema Mariboru i granici sa Mađarskom. Kako se menja teren?
        odgovori:
          - {tekst: "Visina opada i teren prelazi u ravnicu Panonske nizije.", tacan: true}
          - {tekst: "Teren je sve viši, a na istoku je najviši vrh Triglav.", tacan: false}
          - {tekst: "Teren je sve vreme isti — visoravan.", tacan: false}
          - {tekst: "Na istoku se izlazi na Jadransko more.", tacan: false}
        pomoc:
          - "Korak 1: Gde su najviše planine Slovenije — na severozapadu ili na istoku?"
          - "Korak 2: Koja velika ravnica dodiruje Sloveniju na istoku?"
          - "Iz lekcije: što se ide dalje na istok, visina terena opada i javlja se ravnica — deo Panonske nizije."
        objasnjenje: Od Alpa ka istoku teren se spušta, pa je istok Slovenije ravnica koja pripada Panonskoj niziji.
        iz_udzbenika:
          strana: 27
          odeljak: Reljef
