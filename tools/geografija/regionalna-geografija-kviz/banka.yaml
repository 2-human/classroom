# Banka zadataka — Regionalna geografija (7. razred, str. 8–9). Spaja se u spec.yaml: `delovi` zamenjuje
# spec-ove delove, `mesta` se dodaju u karta.mesta (ovde su sva mesta već u spec.yaml).
# Svaki zadatak ima `tezina` (lako | srednje | tesko). Pitanja su sopstvenim rečima na osnovu beleške lekcije.

mesta: {}

delovi:
  - naslov: Šta je regionalna geografija
    zadaci:
      - id: pojam-izbor-definicija
        vrsta: izbor
        tezina: lako
        pojmovi: [regionalna-geografija]
        pitanje: Šta proučava regionalna geografija?
        odgovori:
          - {tekst: "Geografske odlike pojedinih oblasti – regija.", tacan: true}
          - {tekst: "Samo stene i minerale u Zemljinoj kori.", tacan: false}
          - {tekst: "Istoriju ratova između država.", tacan: false}
          - {tekst: "Kretanje planeta oko Sunca.", tacan: false}
        pomoc:
          - Pogledaj drugi deo naziva — reč „regionalna” dolazi od reči regija.
          - Traži odgovor koji govori o oblastima na Zemlji i njihovim odlikama.
          - "Iz lekcije: regionalna geografija izučava geografske odlike pojedinih oblasti – regija."
        objasnjenje: Regionalna geografija je grana geografije koja proučava odlike pojedinih oblasti, koje nazivamo regije.
        iz_udzbenika:
          strana: 8
          odeljak: Šta je regionalna geografija
          tekst: Regionalna geografija je deo geografije koji se bavi odlikama pojedinih oblasti na Zemlji – regija.

      - id: pojam-dopuni-koraci
        vrsta: dopuni
        tezina: lako
        pojmovi: [regionalna-geografija, geografska-regija]
        pitanje: Dopuni rečenicu rečima iz banke — tri koraka posla regionalne geografije.
        tekst: Regionalna geografija regiju najpre {{izdvaja}}, zatim je {{izučava}}, a na kraju je {{prikazuje}} na geografskoj karti.
        ponudjene: [izdvaja, izučava, prikazuje, naseljava, prodaje]
        pomoc:
          - Prvo moraš da odlučiš koju oblast posmatraš, pa tek onda da je proučavaš.
          - Poslednji korak ima veze sa kartom — regiju treba nacrtati i pokazati.
          - "Iz lekcije: izdvojiti → izučiti → prikazati regiju na karti."
        objasnjenje: Zadatak regionalne geografije ima tri koraka — izdvojiti regiju, izučiti je i prikazati je na karti.
        iz_udzbenika:
          strana: 8
          odeljak: Šta je regionalna geografija
          tekst: Osnovni zadatak regionalne geografije je da regiju izdvoji, zatim prouči i na kraju prikaže na geografskoj karti.

      - id: pojam-tn-redosled
        vrsta: tacno_netacno
        tezina: srednje
        pojmovi: [regionalna-geografija]
        tvrdnja: Regionalna geografija prvo prikazuje regiju na karti, a tek posle toga je izdvaja.
        tacno: false
        ispravke:
          - {tekst: "Regija se prvo izdvaja, zatim izučava, a na kraju prikazuje na karti.", tacan: true}
          - {tekst: "Regija se prvo izučava, a izdvajanje se uopšte ne radi.", tacan: false}
          - {tekst: "Regija se samo prikazuje na karti, bez izučavanja.", tacan: false}
        pomoc:
          - Možeš li da nacrtaš regiju na karti ako još nisi odlučio koja je to oblast?
          - Karta je poslednji, a ne prvi korak.
          - "Iz lekcije: izdvojiti → izučiti → prikazati."
        objasnjenje: Netačno — redosled je izdvojiti, izučiti, pa tek onda prikazati regiju na geografskoj karti.
        iz_udzbenika:
          strana: 8
          odeljak: Šta je regionalna geografija
          tekst: Posao regionalne geografije ide u tri koraka – izdvajanje regije, njeno izučavanje i prikazivanje na karti.

      - id: pojam-izbor-regija
        vrsta: izbor
        tezina: lako
        pojmovi: [geografska-regija]
        pitanje: Šta je geografska regija?
        odgovori:
          - {tekst: "Oblast koja je izdvojena zato što ima slične odlike.", tacan: true}
          - {tekst: "Svaki grad koji ima više od milion stanovnika.", tacan: false}
          - {tekst: "Bilo koja linija na karti.", tacan: false}
          - {tekst: "Samo jedna planina.", tacan: false}
        pomoc:
          - Regija je oblast — može biti manja ili veća.
          - Ključna reč je „slične” — šta povezuje sva mesta u jednoj regiji?
          - "Iz lekcije: regija je oblast izdvojena po sličnim odlikama."
        objasnjenje: Geografska regija je manja ili veća oblast koja je izdvojena jer ima slične odlike; ona je predmet proučavanja regionalne geografije.
        iz_udzbenika:
          strana: 8
          odeljak: Šta je regionalna geografija
          tekst: Regionalna geografija proučava geografske regije – manje ili veće oblasti koje se izdvajaju jer imaju slične odlike.

      - id: pojam-tn-homogeno
        vrsta: tacno_netacno
        tezina: lako
        pojmovi: [homogen, heterogen]
        tvrdnja: Kopno Zemlje je svuda isto, odnosno homogeno.
        tacno: false
        ispravke:
          - {tekst: "Kopno je heterogeno – razlikuje se po prirodnim i društvenim odlikama.", tacan: true}
          - {tekst: "Kopno je homogeno samo u Evropi.", tacan: false}
          - {tekst: "Kopno je svuda isto osim na planinama.", tacan: false}
        pomoc:
          - Uporedi pustinju, planinu i veliki grad — da li izgledaju isto?
          - „Homogeno” znači jednorodno, a „heterogeno” raznorodno.
          - "Iz lekcije: kopno nije homogeno, već heterogeno."
        objasnjenje: Netačno — kopno nije svuda isto; razlikuje se po fizičko-geografskim i društveno-geografskim elementima, pa je heterogeno (raznorodno).
        iz_udzbenika:
          strana: 8
          odeljak: Šta je regionalna geografija
          tekst: Kopno Zemlje nije jednorodno (homogeno); po prirodi i po društvu se razlikuje od mesta do mesta, pa je raznorodno (heterogeno).

      - id: pojam-povezi-pojmovi
        vrsta: povezi
        tezina: lako
        pojmovi: [homogen, heterogen, geografska-regija]
        pitanje: Poveži pojam sa njegovim značenjem.
        parovi:
          - [homogeno, jednorodno – svuda isto]
          - [heterogeno, raznorodno – različito od mesta do mesta]
          - [kontinent, najveća izdvojena regija]
        pomoc:
          - „Homo-” znači isto, a „hetero-” različito.
          - Ostaje pojam koji označava najveće regije na Zemlji.
          - "Iz lekcije: kopno je heterogeno, a kontinenti su najveće izdvojene regije."
        objasnjenje: Homogeno = jednorodno, heterogeno = raznorodno; kontinent je najveća izdvojena regija.
        iz_udzbenika:
          strana: 8
          odeljak: Šta je regionalna geografija
          tekst: Kopno je raznorodno (heterogeno), a ne jednorodno (homogeno). Kontinenti su najveće izdvojene regije.

      - id: pojam-dopuni-heterogeno
        vrsta: dopuni
        tezina: tesko
        pojmovi: [homogen, heterogen]
        pitanje: Dopuni rečenicu (bez ponuđenih reči).
        tekst: Pošto se kopno razlikuje po fizičko-geografskim i društveno-geografskim elementima, kažemo da je {{heterogeno|raznorodno}}, a ne {{homogeno|jednorodno}}.
        pomoc:
          - Prva reč znači „raznorodno”, druga „jednorodno”.
          - Obe reči su strane i razlikuju se samo po početku (hetero- / homo-).
          - "Iz lekcije: kopno nije homogeno, već heterogeno."
        objasnjenje: Kopno je heterogeno (raznorodno), jer se smenjuju različiti prirodni i društveni elementi; nije homogeno (jednorodno).
        iz_udzbenika:
          strana: 8
          odeljak: Šta je regionalna geografija
          tekst: Kopno se razlikuje po fizičko-geografskim i društveno-geografskim elementima, pa je raznorodno (heterogeno), a ne jednorodno (homogeno).

      - id: pojam-zakljuci-kontinenti
        vrsta: zakljuci
        tezina: srednje
        pojmovi: [heterogen, geografska-regija]
        pitanje: Zašto se svaki kontinent deli na više manjih regija?
        odgovori:
          - {tekst: "Jer je kontinent heterogen – u njemu se smenjuju reljef, klima, vegetacija i društvene odlike, pa se zajedno mogu opisati samo manje, sličnije celine.", tacan: true}
          - {tekst: "Jer su kontinenti premali da bi se proučavali kao celina.", tacan: false}
          - {tekst: "Jer svaka država mora da bude posebna regija.", tacan: false}
          - {tekst: "Jer su na celom kontinentu iste odlike, pa je svejedno.", tacan: false}
        pomoc:
          - "Korak 1: Da li je kontinent svuda isti? Seti se planina, nizija, pustinja i šuma u Evropi."
          - "Korak 2: Ako su delovi kontinenta različiti, kako ih je najlakše opisati?"
          - "Iz lekcije: unutar kontinenta postoje razni oblici reljefa, klime, vegetacije i društvene razlike, pa se deli na manje regije."
        objasnjenje: Kontinent je raznorodan, pa se deli na manje regije čije su odlike slične i koje se mogu zajedno opisati.
        iz_udzbenika:
          strana: 8
          odeljak: Šta je regionalna geografija
          tekst: Zbog raznih oblika reljefa, klimatskih tipova, vegetacionih pojaseva i društvenih razlika svaki kontinent se deli na više manjih regija.

      - id: pojam-izbor-nacionalna
        vrsta: izbor
        tezina: srednje
        pojmovi: [nacionalna-regionalna-geografija, regionalna-geografija-sveta]
        pitanje: Kako se zove regionalna geografija koja proučava jednu državu?
        odgovori:
          - {tekst: Nacionalna regionalna geografija, tacan: true}
          - {tekst: Regionalna geografija sveta, tacan: false}
          - {tekst: Fizička geografija, tacan: false}
          - {tekst: Kartografija, tacan: false}
        pomoc:
          - Država i narod — koja reč u ponuđenim odgovorima je u vezi sa tim?
          - Regionalna geografija sveta obuhvata ceo svet, ne jednu državu.
          - "Iz lekcije: jednu državu proučava nacionalna regionalna geografija."
        objasnjenje: Jednu državu proučava nacionalna regionalna geografija, a ceo svet po regijama — regionalna geografija sveta.
        iz_udzbenika:
          strana: 8
          odeljak: Ključni pojmovi
          tekst: Regionalna geografija može da proučava jednu državu (nacionalna regionalna geografija) ili ceo svet po regijama (regionalna geografija sveta).

      - id: pojam-zakljuci-svet
        vrsta: zakljuci
        tezina: lako
        pojmovi: [regionalna-geografija-sveta, nacionalna-regionalna-geografija]
        pitanje: Knjiga opisuje sve kontinente, jedan po jedan, podeljene na regije. Kojoj vrsti regionalne geografije pripada?
        odgovori:
          - {tekst: Regionalnoj geografiji sveta, tacan: true}
          - {tekst: Nacionalnoj regionalnoj geografiji, tacan: false}
          - {tekst: "Nijednoj – to nije geografija.", tacan: false}
        pomoc:
          - "Korak 1: Da li knjiga opisuje jednu državu ili ceo svet?"
          - "Korak 2: Koji naziv sadrži reč „sveta”?"
          - "Iz lekcije: ceo svet po regijama proučava regionalna geografija sveta."
        objasnjenje: Kad se po regijama proučava ceo svet (svi kontinenti), to je regionalna geografija sveta.
        iz_udzbenika:
          strana: 8
          odeljak: Ključni pojmovi
          tekst: Regionalna geografija sveta proučava ceo svet po regijama, a nacionalna samo jednu državu.

      - id: pojam-izbor-6-razred
        vrsta: izbor
        tezina: srednje
        pojmovi: [geografska-regija, princip-regionalizacije]
        pitanje: Na osnovu čega je Evropa u 6. razredu podeljena na regije? (Više tačnih.)
        odgovori:
          - {tekst: Po stranama sveta, tacan: true}
          - {tekst: Po sličnosti prirodnih i društvenih odlika, tacan: true}
          - {tekst: Po abecednom redu imena država, tacan: false}
          - {tekst: Po broju fudbalskih klubova, tacan: false}
        pomoc:
          - Imena regija Evrope (Južna, Severna…) već otkrivaju jedan odgovor.
          - Tačna su dva odgovora; drugi govori o sličnim odlikama.
          - "Iz lekcije: podela je urađena po stranama sveta i po sličnosti prirodnih i društvenih odlika."
        objasnjenje: Regije Evrope dobile su imena po stranama sveta, a izdvojene su po sličnim prirodnim i društvenim odlikama.
        iz_udzbenika:
          strana: 8
          odeljak: Već smo učili
          tekst: Lekcija podseća na podelu Evrope na regije iz 6. razreda, napravljenu po stranama sveta i po sličnosti prirodnih i društvenih odlika.

  - naslov: Princip regionalizacije i vrste regija
    zadaci:
      - id: princip-izbor-definicija
        vrsta: izbor
        tezina: lako
        pojmovi: [princip-regionalizacije]
        pitanje: Šta je princip regionalizacije?
        odgovori:
          - {tekst: "Pravilo po kome se izdvajaju geografske regije.", tacan: true}
          - {tekst: "Zakon koji određuje glavni grad države.", tacan: false}
          - {tekst: "Način merenja visine planina.", tacan: false}
          - {tekst: "Spisak svih reka jedne regije.", tacan: false}
        pomoc:
          - „Princip” znači pravilo.
          - Regionalizacija = izdvajanje regija.
          - "Iz lekcije: princip regionalizacije je pravilo po kome se izdvajaju regije."
        objasnjenje: Princip regionalizacije je pravilo po kome se regije izdvajaju — npr. po izgledu prirode ili po funkciji.
        iz_udzbenika:
          strana: 8
          odeljak: Princip regionalizacije
          tekst: Regije se ne izdvajaju nasumično, već po pravilu koje se zove princip regionalizacije.

      - id: princip-povezi-vrste
        vrsta: povezi
        tezina: lako
        pojmovi: [princip-regionalizacije, fizionomske-regije, funkcionalne-regije]
        pitanje: Poveži pojam sa objašnjenjem.
        parovi:
          - [fizionomska regija, izdvojena po sličnom izgledu prirode]
          - [funkcionalna regija, "izdvojena po funkciji (npr. industrija)"]
          - [princip regionalizacije, pravilo po kome se izdvajaju regije]
        pomoc:
          - „Fizionomija” znači izgled.
          - Funkcija je ono čemu nešto služi — čime se ljudi u oblasti bave.
          - "Iz lekcije: fizionomske regije – po izgledu prirode; funkcionalne – po funkciji."
        objasnjenje: Fizionomske regije izdvajaju se po izgledu prirode, funkcionalne po funkciji, a pravilo izdvajanja je princip regionalizacije.
        iz_udzbenika:
          strana: 8
          odeljak: Princip regionalizacije
          tekst: Po fizičko-geografskom principu izdvajaju se fizionomske regije, a po društveno-geografskom funkcionalne regije.

      - id: princip-izbor-elementi
        vrsta: izbor
        tezina: srednje
        pojmovi: [fizionomske-regije]
        pitanje: Po kojim elementima se izdvajaju fizionomske regije? (Više tačnih.)
        odgovori:
          - {tekst: Reljef, tacan: true}
          - {tekst: Vode (hidrološke odlike), tacan: true}
          - {tekst: Klima, tacan: true}
          - {tekst: Biljni i životinjski svet, tacan: true}
          - {tekst: Broj fabrika, tacan: false}
          - {tekst: Broj turista, tacan: false}
        pomoc:
          - Fizionomske regije se izdvajaju po prirodi, a ne po onome što su ljudi izgradili.
          - Tačna su četiri odgovora; dva govore o privredi.
          - "Iz lekcije: reljef, vode, klima, biljni i životinjski svet."
        objasnjenje: Fizionomske regije izdvajaju se po prirodnim elementima — reljefu, vodama, klimi, biljnom i životinjskom svetu. Fabrike i turisti su društveni elementi.
        iz_udzbenika:
          strana: 8
          odeljak: Fizionomske regije
          tekst: Fizionomske regije se izdvajaju po sličnom izgledu – po reljefu, vodama, klimi, biljnom i životinjskom svetu.

      - id: princip-izbor-funkcije
        vrsta: izbor
        tezina: srednje
        pojmovi: [funkcionalne-regije]
        pitanje: Koje funkcije mogu imati funkcionalne regije? (Više tačnih.)
        odgovori:
          - {tekst: Rudarsku, tacan: true}
          - {tekst: Industrijsku, tacan: true}
          - {tekst: Saobraćajnu, tacan: true}
          - {tekst: Turističku, tacan: true}
          - {tekst: Planinsku, tacan: false}
          - {tekst: Klimatsku, tacan: false}
        pomoc:
          - Funkcija je ono čime se ljudi u oblasti bave.
          - Planina i klima su delovi prirode, a ne ljudska delatnost.
          - "Iz lekcije: rudarska, industrijska, saobraćajna, turistička i dr."
        objasnjenje: Funkcionalne regije imaju jednu ili više funkcija — rudarsku, industrijsku, saobraćajnu, turističku i druge.
        iz_udzbenika:
          strana: 8
          odeljak: Funkcionalne regije
          tekst: Funkcionalne regije imaju jasno određenu jednu ili više funkcija – rudarsku, industrijsku, saobraćajnu, turističku i druge.

      - id: princip-tn-fizionomske
        vrsta: tacno_netacno
        tezina: lako
        pojmovi: [fizionomske-regije]
        tvrdnja: Fizionomske regije izdvajaju se po fizičko-geografskom principu.
        tacno: true
        pomoc:
          - Fizionomija = izgled; o čijem izgledu je reč — prirode ili društva?
          - Fizičko-geografski elementi su reljef, vode, klima, živi svet.
          - "Iz lekcije: fizionomske regije izdvajaju se po fizičko-geografskom principu."
        objasnjenje: Tačno — fizionomske regije izdvajaju se po izgledu prirode, tj. po fizičko-geografskom principu.
        iz_udzbenika:
          strana: 8
          odeljak: Fizionomske regije
          tekst: Fizionomske regije su izdvojene po fizičko-geografskom principu, tj. po sličnom izgledu prirode.

      - id: princip-tn-funkcionalne
        vrsta: tacno_netacno
        tezina: srednje
        pojmovi: [funkcionalne-regije]
        tvrdnja: Funkcionalne regije izdvajaju se po sličnoj klimi i vegetaciji.
        tacno: false
        ispravke:
          - {tekst: "Izdvajaju se po društveno-geografskom principu – po funkciji (rudarstvo, industrija, saobraćaj, turizam).", tacan: true}
          - {tekst: "Izdvajaju se po reljefu i rekama.", tacan: false}
          - {tekst: "Izdvajaju se samo po broju stanovnika.", tacan: false}
        pomoc:
          - Klima i vegetacija su prirodni elementi — kojoj vrsti regija oni pripadaju?
          - Funkcionalne regije su povezane sa onim čime se ljudi bave.
          - "Iz lekcije: funkcionalne regije – društveno-geografski princip, po funkciji."
        objasnjenje: Netačno — po klimi i vegetaciji se izdvajaju fizionomske regije; funkcionalne se izdvajaju po društvenoj funkciji.
        iz_udzbenika:
          strana: 8
          odeljak: Funkcionalne regije
          tekst: Funkcionalne regije izdvajaju se po društveno-geografskom principu, prema funkciji koju imaju.

      - id: princip-dopuni-principi
        vrsta: dopuni
        tezina: tesko
        pojmovi: [fizionomske-regije, funkcionalne-regije, princip-regionalizacije]
        pitanje: Dopuni rečenicu (bez ponuđenih reči).
        tekst: Fizionomske regije izdvajaju se po {{fizičko-geografskom|fizicko-geografskom|prirodnom}} principu, a funkcionalne po {{društveno-geografskom|drustveno-geografskom|društvenom}} principu.
        pomoc:
          - Jedan princip se oslanja na prirodu, drugi na društvo.
          - Oba naziva su složenice sa „-geografskom”.
          - "Iz lekcije: fizionomske – fizičko-geografski, funkcionalne – društveno-geografski princip."
        objasnjenje: Fizionomske regije se izdvajaju po fizičko-geografskom, a funkcionalne po društveno-geografskom principu.
        iz_udzbenika:
          strana: 8
          odeljak: Princip regionalizacije
          tekst: Fizičko-geografski princip daje fizionomske regije, a društveno-geografski funkcionalne regije.

      - id: princip-zakljuci-turizam
        vrsta: zakljuci
        tezina: srednje
        pojmovi: [funkcionalne-regije]
        pitanje: Neka oblast je izdvojena zato što u njoj ima mnogo hotela i posetilaca. Kakva je to regija?
        odgovori:
          - {tekst: "Funkcionalna (turistička) – izdvojena po društvenoj funkciji.", tacan: true}
          - {tekst: "Fizionomska – izdvojena po reljefu.", tacan: false}
          - {tekst: "Fizionomska – izdvojena po klimi.", tacan: false}
          - {tekst: "To uopšte nije regija.", tacan: false}
        pomoc:
          - "Korak 1: Da li su hoteli i posetioci deo prirode ili ljudske delatnosti?"
          - "Korak 2: Kako se zovu regije izdvojene po delatnosti ljudi?"
          - "Iz lekcije: turistička funkcija je jedna od funkcija funkcionalnih regija."
        objasnjenje: Hoteli i posetioci su znak turističke delatnosti, pa je to funkcionalna (turistička) regija.
        iz_udzbenika:
          strana: 8
          odeljak: Funkcionalne regije
          tekst: Funkcionalne regije imaju jasno određenu funkciju – među njima su i turističke.

      - id: princip-zakljuci-suma
