# Regionalna geografija — kviz po lekciji (tip: lesson-quiz; vidi templates/lesson-quiz/README.md).
# Pitanja su napisana sopstvenim rečima na osnovu lekcije „Regionalna geografija” (7. razred, str. 8–9;
# strane 10–13 nedostaju u skenovima, pa se kviz oslanja samo na str. 8–9).
# `iz_udzbenika` (posle odgovora, u fioci): strana, odeljak, sažetak sopstvenim rečima i slika iz
# privatnog tools/geografija/_source/slike-7/ (prikazuje se samo kad taj folder postoji — van git-a).
title: "Regionalna geografija — kviz"
title_short: Regionalna geografija
locale: sr
nivo: osnovna
razred: 7
banka_lekcije: [1]
description: >-
  Kviz za uvodnu lekciju Regionalna geografija: šta je regija, princip regionalizacije, fizionomske i
  funkcionalne regije (Alpska, Padska, Panonska, Rur) i regionalna podela Azije i Jugozapadne Azije —
  sa kartom Evrope i Jugozapadne Azije.

karta:
