, "tezina": "tesko", "pojmovi": ["jastrebac", "rasedne-planine"], "pitanje": "Klikni na Jastrebac, rasednu planinu Srpsko-makedonske mase.", "cilj": {"mesto": "jastrebac"}, "pomoc": ["Jastrebac je u središnjem delu Srbije, zapadno od Južne Morave.", "Nalazi se između Kruševca i Niša.", "Klikni zapadno od Niša, severozapadno od Leskovca."], "objasnjenje": "Jastrebac je zapadno od Južne Morave, između Kruševca i Niša.", "iz_udzbenika": {"strana": 19, "odeljak": "Fizičko-geografske odlike — reljef", "tekst": "Jastrebac je primer rasedne planine Srpsko-makedonske mase u središnjem delu Srbije."}}, {"id": "reljef-klik-leskovacka", "vrsta": "karta_klik", "tezina": "srednje", "pojmovi": ["leskovacka-kotlina", "juzna-morava"], "pitanje": "Klikni na Leskovačku kotlinu.", "cilj": {"mesto": "leskovacka-kotlina"}, "pomoc": ["Kotlina je na jugu Srbije, na Južnoj Moravi.", "Leži između Niške (severno) i Vranjske kotline (južno).", "Klikni malo južno od Niša, u dolini Južne Morave."], "objasnjenje": "Leskovačka kotlina je na Južnoj Moravi, između Niške i Vranjske kotline.", "iz_udzbenika": {"strana": 19, "odeljak": "Fizičko-geografske odlike — reljef", "tekst": "Na fizičkoj karti strelica pokazuje na Leskovačku kotlinu u dolini Južne Morave, na jugu Srbije.", "slika": "04-srbija/04-leskovacka-kotlina.jpg"}}, {"id": "reljef-klik-niska", "vrsta": "karta_klik", "tezina": "lako", "pojmovi": ["niska-kotlina", "nis"], "pitanje": "Klikni na Nišku kotlinu.", "cilj": {"mesto": "niska-kotlina"}, "pomoc": ["Kotlina nosi ime najvećeg grada juga Srbije.", "Nalazi se na reci Nišavi, blizu ušća u Južnu Moravu.", "Klikni oko Niša, u jugoistočnom delu Srbije."], "objasnjenje": "Niška kotlina je oko Niša, na Nišavi; najsevernija je od tri velike kotline na Južnoj Moravi.", "iz_udzbenika": {"strana": 19, "odeljak": "Fizičko-geografske odlike — reljef", "tekst": "Najveće kotline juga Srbije su Niška, Leskovačka i Vranjska."}}, {"id": "reljef-gde-vojvodina", "vrsta": "gde_sam", "tezina": "lako", "pojmovi": ["vojvodina", "panonska-nizija"], "pitanje": "Gde sam? Pročitaj trag i klikni na kartu.", "cilj": {"mesto": "vojvodina"}, "tragovi": ["Reke me dele na tri dela — Srem, Bačku i Banat.", "Veći deo mene leži ispod 100 m nadmorske visine.", "Ja sam ravnica severno od Save i Dunava, deo Panonske nizije.", "Ja sam AP Vojvodina — klikni na sever Srbije."], "objasnjenje": "AP Vojvodina — ravnica na severu Srbije, deo Panonske nizije, podeljena na Srem, Bačku i Banat.", "iz_udzbenika": {"strana": 19, "odeljak": "Fizičko-geografske odlike — reljef", "tekst": "Vojvodina je ravničarski sever Srbije, deo Panonske nizije; Sava, Tisa i Dunav je dele na Srem, Bačku i Banat.", "slika": "04-srbija/03-vojvodina.jpg"}}, {"id": "reljef-gde-fruska-gora", "vrsta": "gde_sam", "tezina": "srednje", "pojmovi": ["fruska-gora", "srem"], "pitanje": "Gde sam? Pročitaj trag i klikni na kartu.", "cilj": {"mesto": "fruska-gora"}, "tragovi": ["Na mojim brežuljcima su poznati vinogradi, a posećuju me i turisti.", "Nekada sam bila ostrvo u Panonskom moru.", "Pripadam Sremu i pružam se uz desnu obalu Dunava.", "Ja sam Fruška gora — preko puta Novog Sada."], "objasnjenje": "Fruška gora — planina u Sremu uz Dunav, nekadašnje ostrvo Panonskog mora, poznata po vinogradima i turizmu.", "iz_udzbenika": {"strana": 19, "odeljak": "Fizičko-geografske odlike — reljef", "tekst": "Fruška gora se pruža uz desnu obalu Dunava, pripada Sremu i bila je ostrvo Panonskog mora."}}, {"id": "reljef-gde-prokletije", "vrsta": "gde_sam", "tezina": "tesko", "pojmovi": ["prokletije", "planinska-klima", "nabrane-planine"], "pitanje": "Gde sam? Pročitaj trag i klikni na kartu.", "cilj": {"mesto": "prokletije"}, "tragovi": ["Moji vrhovi su strmi i stenoviti, bez šume pri vrhu, a vlada na meni planinska klima.", "Ja sam visoka nabrana planina.", "Sa mene se vide tri države — Srbija, Crna Gora i Albanija.", "Ja sam Prokletije — na jugozapadu AP Kosova i Metohije."], "objasnjenje": "Prokletije — visoke nabrane planine na jugozapadu Srbije, na granici sa Crnom Gorom i Albanijom.", "iz_udzbenika": {"strana": 19, "odeljak": "Fizičko-geografske odlike — reljef", "tekst": "Prokletije su visoke, stenovite nabrane planine na jugozapadu Srbije, sa planinskom klimom.", "slika": "04-srbija/05-prokletije.jpg"}}]}, {"naslov": "Klima i vode", "zadaci": [{"id": "klima-povezi-tipovi", "vrsta": "povezi", "tezina": "lako", "pojmovi": ["kontinentalna-klima", "umerenokontinentalna-klima", "planinska-klima"], "pitanje": "Poveži deo Srbije sa tipom klime.", "parovi": [["Vojvodina (Panonska nizija)", "kontinentalna klima"], ["planinski deo na manjim visinama", "umerenokontinentalna klima"], ["visoke planine na jugu", "planinska klima"]], "pomoc": ["Što je mesto više, klima je hladnija.", "Najviše planine imaju klimu koja nosi ime po njima.", "Iz lekcije: nizija — kontinentalna; niže planine — umerenokontinentalna; visoke planine — planinska."], "objasnjenje": "Vojvodina ima kontinentalnu, niži planinski deo umerenokontinentalnu, a visoke planine na jugu planinsku klimu.", "iz_udzbenika": {"strana": 20, "odeljak": "Fizičko-geografske odlike — klima", "tekst": "U Panonskoj niziji klima je kontinentalna, u planinskom delu na manjim visinama umerenokontinentalna, a na visokim planinama juga planinska.", "slika": "04-srbija/07-recna-mreza-srbije.jpg"}}, {"id": "klima-izbor-vojvodina", "vrsta": "izbor", "tezina": "lako", "pojmovi": ["kontinentalna-klima", "vojvodina"], "pitanje": "Koji tip klime ima Vojvodina?", "odgovori": [{"tekst": "kontinentalnu", "tacan": true}, {"tekst": "planinsku", "tacan": false}, {"tekst": "sredozemnu", "tacan": false}, {"tekst": "okeansku", "tacan": false}], "pomoc": ["Vojvodina je ravnica daleko od mora.", "Planinska klima je na visokim planinama, a sredozemna uz more.", "Iz lekcije: u Panonskoj niziji vlada kontinentalna klima."], "objasnjenje": "Vojvodina, kao deo Panonske nizije daleko od mora, ima kontinentalnu klimu.", "iz_udzbenika": {"strana": 20, "odeljak": "Fizičko-geografske odlike — klima", "tekst": "Panonska nizija, odnosno Vojvodina, ima kontinentalnu klimu."}}, {"id": "klima-tn-planinska", "vrsta": "tacno_netacno", "tezina": "lako", "pojmovi": ["planinska-klima", "umerenokontinentalna-klima"], "tvrdnja": "Na visokim planinama na jugu Srbije vlada umerenokontinentalna klima.", "tacno": false, "ispravke": [{"tekst": "Na visokim planinama vlada planinska klima.", "tacan": true}, {"tekst": "Na visokim planinama vlada sredozemna klima.", "tacan": false}, {"tekst": "Na visokim planinama vlada kontinentalna klima.", "tacan": false}], "pomoc": ["Umerenokontinentalna klima je u planinskom delu na manjim visinama.", "Visoke planine imaju klimu koja se zove kao i one same.", "Iz lekcije: visoke planine na jugu imaju planinsku klimu i vegetaciju."], "objasnjenje": "Netačno — na visokim planinama juga je planinska klima; umerenokontinentalna je na manjim visinama.", "iz_udzbenika": {"strana": 20, "odeljak": "Fizičko-geografske odlike — klima", "tekst": "Visoke planine na jugu Srbije imaju planinsku klimu i planinsku vegetaciju."}}, {"id": "klima-zakljuci-prokletije", "vrsta": "zakljuci", "tezina": "srednje", "pojmovi": ["planinska-klima", "prokletije"], "pitanje": "Na fotografiji Prokletija vrhovi su strmi i stenoviti, bez šume pri vrhu. Šta to govori o klimi tamo?", "odgovori": [{"tekst": "Tamo vlada planinska klima — hladno je i drveće ne raste visoko.", "tacan": true}, {"tekst": "Tamo je sredozemna klima sa toplim letima.", "tacan": false}, {"tekst": "Tamo je kontinentalna klima kao u Vojvodini.", "tacan": false}, {"tekst": "Tamo nema nikakve klime jer je visoko.", "tacan": false}], "pomoc": ["Korak 1: Da li su Prokletije niska ili visoka planina?", "Korak 2: Kakva je klima na visokim planinama juga Srbije?", "Iz lekcije: visoke planine na jugu imaju planinsku klimu i vegetaciju."], "objasnjenje": "Prokletije su visoke planine sa planinskom klimom; zbog hladnoće šuma prestaje ispod vrhova.", "iz_udzbenika": {"strana": 20, "odeljak": "Fizičko-geografske odlike — klima", "tekst": "Na visokim planinama juga vlada planinska klima; fotografija Prokletija prikazuje gole, stenovite vrhove.", "slika": "04-srbija/05-prokletije.jpg"}}, {"id": "klima-zakljuci-redosled", "vrsta": "zakljuci", "tezina": "tesko", "pojmovi": ["kontinentalna-klima", "umerenokontinentalna-klima", "planinska-klima", "kopaonik"], "pitanje": "Putuješ iz Novog Sada preko Kraljeva do vrha Kopaonika. Kojim redom se smenjuju tipovi klime?", "odgovori": [{"tekst": "kontinentalna → umerenokontinentalna → planinska", "tacan": true}, {"tekst": "planinska → umerenokontinentalna → kontinentalna", "tacan": false}, {"tekst": "umerenokontinentalna → kontinentalna → planinska", "tacan": false}, {"tekst": "sve vreme ista, kontinentalna", "tacan": false}], "pomoc": ["Korak 1: Novi Sad je u Vojvodini — koja je tu klima?", "Korak 2: Kako se klima menja kad ideš u niže planine, pa na visoke vrhove?", "Iz lekcije: nizija — kontinentalna; manje visine — umerenokontinentalna; visoke planine — planinska."], "objasnjenje": "Iz Vojvodine (kontinentalna) kroz niži planinski deo (umerenokontinentalna) do visokog Kopaonika (planinska).", "iz_udzbenika": {"strana": 20, "odeljak": "Fizičko-geografske odlike — klima", "tekst": "Tip klime u Srbiji zavisi od visine — od kontinentalne u niziji, preko umerenokontinentalne, do planinske na visokim planinama."}}, {"id": "vode-izbor-sliv", "vrsta": "izbor", "tezina": "lako", "pojmovi": ["crno-more"], "pitanje": "Ka kom moru teče najviše reka Srbije?", "odgovori": [{"tekst": "ka Crnom moru", "tacan": true}, {"tekst": "ka Jadranskom moru", "tacan": false}, {"tekst": "ka Egejskom moru", "tacan": false}, {"tekst": "ka Baltičkom moru", "tacan": false}], "pomoc": ["Najveća reka Srbije, Dunav, uliva se u to more.", "Ka Jadranu i Egejskom moru teče samo manji broj reka.", "Iz lekcije: najviše reka teče ka Crnom moru."], "objasnjenje": "Najviše reka Srbije pripada slivu Crnog mora (preko Dunava); manji broj teče ka Jadranskom i Egejskom moru.", "iz_udzbenika": {"strana": 20, "odeljak": "Fizičko-geografske odlike — vode", "tekst": "Srbija ima razvijenu rečnu mrežu; najviše reka otiče ka Crnom moru, a manje ka Jadranskom i Egejskom.", "slika": "04-srbija/07-recna-mreza-srbije.jpg"}}, {"id": "vode-tn-jadran", "vrsta": "tacno_netacno", "tezina": "lako", "pojmovi": ["jadransko-more", "crno-more"], "tvrdnja": "Najviše reka Srbije teče ka Jadranskom moru.", "tacno": false, "ispravke": [{"tekst": "Najviše reka Srbije teče ka Crnom moru.", "tacan": true}, {"tekst": "Najviše reka Srbije teče ka Egejskom moru.", "tacan": false}, {"tekst": "Reke Srbije ne teku ni ka jednom moru.", "tacan": false}], "pomoc": ["U koje more se uliva Dunav?", "Gotovo sve veće reke Srbije ulivaju se u Dunav.", "Iz lekcije: najviše reka teče ka Crnom moru."], "objasnjenje": "Netačno — najviše reka teče ka Crnom moru, jer se ulivaju u Dunav.", "iz_udzbenika": {"strana": 20, "odeljak": "Fizičko-geografske odlike — vode", "tekst": "Najveći deo reka Srbije pripada slivu Crnog mora; ka Jadranskom i Egejskom moru otiče manji broj reka."}}, {"id": "vode-izbor-mora", "vrsta": "izbor", "tezina": "lako", "pojmovi": ["jadransko-more", "egejsko-more"], "pitanje": "Osim ka Crnom moru, ka kojim još morima teku reke Srbije? (Više tačnih.)", "odgovori": [{"tekst": "ka Jadranskom moru", "tacan": true}, {"tekst": "ka Egejskom moru", "tacan": true}, {"tekst": "ka Baltičkom moru", "tacan": false}, {"tekst": "ka Kaspijskom jezeru", "tacan": false}], "pomoc": ["Traži mora koja su blizu Balkana — jedno na zapadu, drugo na jugu.", "Baltičko more je na severu Evrope, a Kaspijsko jezero u Aziji.", "Iz lekcije: manji broj reka teče ka Jadranskom i Egejskom moru."], "objasnjenje": "Pored Crnog, reke Srbije teku i ka Jadranskom i Egejskom moru — tako Srbija pripada slivovima tri mora.", "iz_udzbenika": {"strana": 20, "odeljak": "Fizičko-geografske odlike — vode", "tekst": "Pored sliva Crnog mora, manji broj reka Srbije otiče ka Jadranskom i Egejskom moru."}}, {"id": "vode-izbor-najvece", "vrsta": "izbor", "tezina": "srednje", "pojmovi": ["dunav", "sava", "tisa", "drina", "ibar"], "pitanje": "Koje reke lekcija navodi kao najveće reke Srbije? (Više tačnih.)", "odgovori": [{"tekst": "Dunav", "tacan": true}, {"tekst": "Sava", "tacan": true}, {"tekst": "Tisa", "tacan": true}, {"tekst": "Drina", "tacan": true}, {"tekst": "Ibar", "tacan": true}, {"tekst": "Vardar", "tacan": false}, {"tekst": "Neretva", "tacan": false}], "pomoc": ["Dve ponuđene reke ne teku kroz Srbiju — jedna je u Severnoj Makedoniji, druga u Hercegovini.", "Tačno je pet reka.", "Iz lekcije: najveće reke su Dunav, Sava, Tisa, Drina i Ibar."], "objasnjenje": "Najveće reke su Dunav, Sava, Tisa, Drina i Ibar. Vardar teče kroz Severnu Makedoniju, a Neretva kroz BiH.", "iz_udzbenika": {"strana": 20, "odeljak": "Fizičko-geografske odlike — vode", "tekst": "Najveće reke Srbije su Dunav, Sava, Tisa, Drina i Ibar.", "slika": "04-srbija/07-recna-mreza-srbije.jpg"}}, {"id": "vode-izbor-nacionalna", "vrsta": "izbor", "tezina": "lako", "pojmovi": ["velika-morava"], "pitanje": "Koja je najduža nacionalna reka Srbije (cela teče kroz Srbiju)?", "odgovori": [{"tekst": "Velika Morava", "tacan": true}, {"tekst": "Dunav", "tacan": false}, {"tekst": "Sava", "tacan": false}, {"tekst": "Tisa", "tacan": false}], "pomoc": ["Ostale ponuđene reke ulaze u Srbiju iz drugih država.", "Ova reka nastaje u sredini Srbije spajanjem dve reke istog imena.", "Iz lekcije: najduža nacionalna reka je Velika Morava."], "objasnjenje": "Velika Morava je najduža reka koja cela teče kroz Srbiju; Dunav, Sava i Tisa dolaze iz drugih zemalja.", "iz_udzbenika": {"strana": 20, "odeljak": "Fizičko-geografske odlike — vode", "tekst": "Najduža nacionalna reka Srbije je Velika Morava, koja nastaje spajanjem Južne i Zapadne Morave."}}, {"id": "vode-dopuni-morava", "vrsta": "dopuni", "tezina": "lako", "pojmovi": ["velika-morava", "juzna-morava", "zapadna-morava"], "pitanje": "Dopuni rečenicu rečima iz banke.", "tekst": "Velika Morava nastaje spajanjem {{Južne}} i {{Zapadne}} Morave.", "ponudjene": ["Južne", "Zapadne", "Severne", "Istočne"], "pomoc": ["Jedna Morava teče sa juga (kroz Niš), druga sa zapada (kroz Čačak).", "Nema ni Severne ni Istočne Morave koja čini Veliku Moravu.", "Iz lekcije: Velika Morava = Južna + Zapadna Morava."], "objasnjenje": "Velika Morava nastaje spajanjem Južne i Zapadne Morave.", "iz_udzbenika": {"strana": 20, "odeljak": "Fizičko-geografske odlike — vode", "tekst": "Južna i Zapadna Morava spajaju se i daju Veliku Moravu, najdužu nacionalnu reku Srbije."}}, {"id": "vode-zakljuci-nacionalna", "vrsta": "zakljuci", "tezina": "tesko", "pojmovi": ["dunav", "velika-morava"], "pitanje": "Dunav je mnogo veća reka od Velike Morave. Zašto je ipak Velika Morava „najduža nacionalna reka” Srbije?", "odgovori": [{"tekst": "Zato što ona cela teče kroz Srbiju, a Dunav teče kroz više država.", "tacan": true}, {"tekst": "Zato što je Velika Morava duža od Dunava.", "tacan": false}, {"tekst": "Zato što Velika Morava teče ka Jadranskom moru.", "tacan": false}, {"tekst": "Zato što Dunav ne protiče kroz Srbiju.", "tacan": false}], "pomoc": ["Korak 1: Šta znači da je reka „nacionalna”?", "Korak 2: Gde izvire i gde se uliva Velika Morava, a gde Dunav?", "Iz lekcije: Velika Morava je najduža reka koja cela teče kroz Srbiju."], "objasnjenje": "Velika Morava nastaje i uliva se u Srbiji (u Dunav), pa cela pripada Srbiji. Dunav je duži, ali teče kroz mnoge države.", "iz_udzbenika": {"strana": 20, "odeljak": "Fizičko-geografske odlike — vode", "tekst": "Velika Morava je najduža nacionalna reka — nastaje spajanjem Južne i Zapadne Morave i cela teče kroz Srbiju."}}, {"id": "vode-povezi-reke", "vrsta": "povezi", "tezina": "tesko", "pojmovi": ["drina", "tisa", "sava", "ibar", "juzna-morava", "velika-morava"], "pitanje": "Poveži reku sa njenim opisom.", "parovi": [["Drina", "granica prema BiH na zapadu"], ["Tisa", "deli Bačku od Banata"], ["Sava", "uliva se u Dunav kod Beograda"], ["Ibar", "teče iz KiM ka Kraljevu"], ["Južna Morava", "teče kroz Vranjsku, Leskovačku i Nišku kotlinu"], ["Velika Morava", "nastaje spajanjem dve Morave"]], "pomoc": ["Kreni od lakših — reka na granici sa BiH i reka koja se uliva u Dunav u glavnom gradu.", "Tisa dolazi iz Mađarske; Ibar dolazi sa juga, sa Kosova i Metohije.", "Iz lekcije: zadatak na str. 20 traži da se na nemoj karti označi osam reka: Dunav, Sava, Tisa, Drina, Ibar i tri Morave."], "objasnjenje": "Drina — granica sa BiH; Tisa — između Bačke i Banata; Sava — ušće u Dunav u Beogradu; Ibar — iz KiM ka Kraljevu; Južna Morava — kroz tri kotline; Velika Morava — spoj Južne i Zapadne.", "iz_udzbenika": {"strana": 20, "odeljak": "Zadatak — nema karta rečne mreže", "tekst": "Na nemoj karti učenik brojevima označava Dunav, Savu, Tisu, Drinu, Ibar, Veliku, Južnu i Zapadnu Moravu.", "slika": "04-srbija/07-recna-mreza-srbije.jpg"}}, {"id": "vode-klik-drina", "vrsta": "karta_klik", "tezina": "lako", "pojmovi": ["drina", "bosna-i-hercegovina"], "pitanje": "Klikni na reku Drinu.", "cilj": {"mesto": "drina"}, "pomoc": ["Drina je na zapadu Srbije.", "Ona je granica između Srbije i Bosne i Hercegovine.", "Klikni na zapadnu granicu Srbije prema BiH."], "objasnjenje": "Drina čini veliki deo granice Srbije prema Bosni i Hercegovini, na zapadu.", "iz_udzbenika": {"strana": 20, "odeljak": "Zadatak — nema karta rečne mreže", "tekst": "Drina je na nemoj karti reka broj 4, na zapadnoj granici Srbije.", "slika": "04-srbija/07-recna-mreza-srbije.jpg"}}, {"id": "vode-klik-dunav", "vrsta": "karta_klik", "tezina": "srednje", "pojmovi": ["dunav"], "pitanje": "Klikni na Dunav na delu toka istočno od Beograda, pre Đerdapa.", "cilj": {"mesto": "dunav"}, "pomoc": ["Od Beograda Dunav teče ka istoku.", "Uskoro postaje granica prema Rumuniji i ulazi u Đerdapsku klisuru.", "Klikni istočno od Beograda, na severoistoku centralne Srbije, uz rumunsku granicu."], "objasnjenje": "Istočno od Beograda Dunav teče ka granici sa Rumunijom i Đerdapu.", "iz_udzbenika": {"strana": 20, "odeljak": "Zadatak — nema karta rečne mreže", "tekst": "Dunav je na nemoj karti reka broj 1 — teče iz Mađarske kroz Vojvodinu i Beograd do Đerdapa.", "slika": "04-srbija/07-recna-mreza-srbije.jpg"}}, {"id": "vode-klik-sava", "vrsta": "karta_klik", "tezina": "srednje", "pojmovi": ["sava", "srem"], "pitanje": "Klikni na reku Savu, na delu toka gde je južna granica Srema.", "cilj": {"mesto": "sava"}, "pomoc": ["Sava dolazi iz Hrvatske i teče ka Beogradu.", "Ona odvaja Srem od Mačve i Posavine na jugu.", "Klikni zapadno od Beograda, na južnoj ivici Srema."], "objasnjenje": "Sava teče južnom ivicom Srema i uliva se u Dunav u Beogradu.", "iz_udzbenika": {"strana": 20, "odeljak": "Zadatak — nema karta rečne mreže", "tekst": "Sava je na nemoj karti reka broj 2; ograničava Srem sa juga i uliva se u Dunav kod Beograda.", "slika": "04-srbija/07-recna-mreza-srbije.jpg"}}, {"id": "vode-klik-tisa", "vrsta": "karta_klik", "tezina": "srednje", "pojmovi": ["tisa", "backa", "banat"], "pitanje": "Klikni na reku Tisu.", "cilj": {"mesto": "tisa"}, "pomoc": ["Tisa teče kroz Vojvodinu, od severa ka jugu.", "Ona deli Bačku od Banata.", "Klikni u sredinu Vojvodine, na granicu Bačke i Banata."], "objasnjenje": "Tisa dolazi iz Mađarske i teče kroz sredinu Vojvodine, između Bačke i Banata.", "iz_udzbenika": {"strana": 20, "odeljak": "Zadatak — nema karta rečne mreže", "tekst": "Tisa je na nemoj karti reka broj 3 — iz Mađarske teče kroz Vojvodinu i deli Bačku od Banata.", "slika": "04-srbija/07-recna-mreza-srbije.jpg"}}, {"id": "vode-klik-velika-morava", "vrsta": "karta_klik", "tezina": "srednje", "pojmovi": ["velika-morava"], "pitanje": "Klikni na Veliku Moravu.", "cilj": {"mesto": "velika-morava"}, "pomoc": ["Velika Morava teče kroz središnju Srbiju, od juga ka severu.", "Uliva se u Dunav istočno od Beograda.", "Klikni u sredinu Srbije, jugoistočno od Beograda (kod Jagodine)."], "objasnjenje": "Velika Morava teče kroz središnju Srbiju, od spoja Južne i Zapadne Morave do Dunava.", "iz_udzbenika": {"strana": 20, "odeljak": "Zadatak — nema karta rečne mreže", "tekst": "Velika Morava je na nemoj karti reka broj 6; teče kroz središnju Srbiju ka Dunavu.", "slika": "04-srbija/07-recna-mreza-srbije.jpg"}}, {"id": "vode-klik-ibar", "vrsta": "karta_klik", "tezina": "tesko", "pojmovi": ["ibar"], "pitanje": "Klikni na reku Ibar, na delu toka pre ušća u Zapadnu Moravu.", "cilj": {"mesto": "ibar"}, "pomoc": ["Ibar dolazi sa juga, iz AP Kosova i Metohije, i teče ka severu.", "Teče zapadno od Kopaonika i uliva se u Zapadnu Moravu kod Kraljeva.", "Klikni malo jugozapadno od Kraljeva, između Kopaonika i Zlatibora."], "objasnjenje": "Ibar teče od KiM ka severu, zapadno od Kopaonika, i kod Kraljeva se uliva u Zapadnu Moravu.", "iz_udzbenika": {"strana": 20, "odeljak": "Zadatak — nema karta rečne mreže", "tekst": "Ibar je na nemoj karti reka broj 5; jedna je od najvećih reka Srbije.", "slika": "04-srbija/07-recna-mreza-srbije.jpg"}}, {"id": "vode-klik-zapadna-morava", "vrsta": "karta_klik", "tezina": "tesko", "pojmovi": ["zapadna-morava"], "pitanje": "Klikni na Zapadnu Moravu.", "cilj": {"mesto": "zapadna-morava"}, "pomoc": ["Zapadna Morava teče kroz zapadnu i središnju Srbiju, od zapada ka istoku.", "Protiče pored Čačka i Kraljeva.", "Klikni između Čačka i Kraljeva, južno od Šumadije."], "objasnjenje": "Zapadna Morava teče kroz Čačak i Kraljevo, a sa Južnom Moravom gradi Veliku Moravu.", "iz_udzbenika": {"strana": 20, "odeljak": "Zadatak — nema karta rečne mreže", "tekst": "Zapadna Morava je na nemoj karti reka broj 8; ima hidroenergetski potencijal.", "slika": "04-srbija/07-recna-mreza-srbije.jpg"}}, {"id": "vode-gde-drina", "vrsta": "gde_sam", "tezina": "srednje", "pojmovi": ["drina", "hidroelektrana", "tara"], "pitanje": "Gde sam? Pročitaj trag i klikni na kartu.", "cilj": {"mesto": "drina"}, "tragovi": ["Na meni su izgrađene hidroelektrane.", "Iznad mene se uzdiže planina Tara.", "Ja sam jedna od najvećih reka Srbije i granica sam prema Bosni i Hercegovini.", "Ja sam Drina — klikni na zapadnu granicu Srbije."], "objasnjenje": "Drina — velika planinska reka na zapadu, granica sa BiH; ima hidroelektrane.", "iz_udzbenika": {"strana": 20, "odeljak": "Fizičko-geografske odlike — vode", "tekst": "Drina je među najvećim rekama Srbije; kao planinska reka ima hidroenergetski potencijal."}}, {"id": "vode-gde-juzna-morava", "vrsta": "gde_sam", "tezina": "tesko", "pojmovi": ["juzna-morava", "niska-kotlina", "leskovacka-kotlina", "vranjska-kotlina"], "pitanje": "Gde sam? Pročitaj trag i klikni na kartu.", "cilj": {"mesto": "juzna-morava"}, "tragovi": ["Oko mene su rasedne planine Srpsko-makedonske mase.", "Tečem kroz Vranjsku i Leskovačku kotlinu, pa pored Niške.", "Spajam se sa Zapadnom Moravom i tako nastaje Velika Morava.", "Ja sam Južna Morava — klikni severno od Niša, kod Aleksinca."], "objasnjenje": "Južna Morava teče sa juga kroz Vranjsku, Leskovačku i Nišku kotlinu i sa Zapadnom Moravom gradi Veliku Moravu.", "iz_udzbenika": {"strana": 20, "odeljak": "Fizičko-geografske odlike — vode", "tekst": "Južna Morava protiče kroz kotline juga Srbije, a sa Zapadnom Moravom gradi Veliku Moravu.", "slika": "04-srbija/07-recna-mreza-srbije.jpg"}}]}, {"naslov": "Stanovništvo", "zadaci": [{"id": "stan-tn-opada", "vrsta": "tacno_netacno", "tezina": "lako", "pojmovi": ["srbija"], "tvrdnja": "Broj stanovnika Srbije u poslednjih 20 godina stalno raste.", "tacno": false, "ispravke": [{"tekst": "Broj stanovnika u poslednjih 20 godina opada.", "tacan": true}, {"tekst": "Broj stanovnika se ne menja.", "tacan": false}, {"tekst": "Broj stanovnika se udvostručio.", "tacan": false}], "pomoc": ["Setimo se šta lekcija kaže o iseljavanju i rađanju.", "Rađa se malo dece, a mnogi odlaze iz zemlje.", "Iz lekcije: u poslednjih 20 godina broj stanovnika opada."], "objasnjenje": "Netačno — broj stanovnika opada zbog niskog prirodnog priraštaja i iseljavanja.", "iz_udzbenika": {"strana": 20, "odeljak": "Društveno-geografske odlike", "tekst": "U poslednjih dvadesetak godina broj stanovnika Srbije opada, jer je prirodni priraštaj nizak, a iseljavanje veliko."}}, {"id": "stan-izbor-uzroci", "vrsta": "izbor", "tezina": "srednje", "pojmovi": ["prirodni-prirastaj", "emigracija"], "pitanje": "Zašto opada broj stanovnika Srbije? (Više tačnih.)", "odgovori": [{"tekst": "nizak prirodni priraštaj", "tacan": true}, {"tekst": "visoka stopa emigracije (iseljavanja)", "tacan": true}, {"tekst": "visok prirodni priraštaj", "tacan": false}, {"tekst": "veliko doseljavanje iz zapadne Evrope", "tacan": false}], "pomoc": ["Broj stanovnika opada kad se malo ljudi rađa ili kad mnogo ljudi odlazi.", "Tačna su dva odgovora; oba „smanjuju” stanovništvo.", "Iz lekcije: uzroci su nizak prirodni priraštaj i visoka stopa emigracije."], "objasnjenje": "Broj stanovnika opada zbog niskog prirodnog priraštaja i velikog iseljavanja. Visok priraštaj i doseljavanje bi ga povećavali.", "iz_udzbenika": {"strana": 20, "odeljak": "Društveno-geografske odlike", "tekst": "Pad broja stanovnika ima dva uzroka — nizak prirodni priraštaj i visoku stopu emigracije."}}, {"id": "stan-zakljuci-starenje", "vrsta": "zakljuci", "tezina": "tesko", "pojmovi": ["prirodni-prirastaj", "emigracija"], "pitanje": "Šta se dešava sa stanovništvom kad se rađa malo dece, a mnogo mladih i obrazovanih odlazi u inostranstvo?", "odgovori": [{"tekst": "Ukupan broj stanovnika opada, a stanovništvo stari.", "tacan": true}, {"tekst": "Broj stanovnika raste, jer ostaju stariji ljudi.", "tacan": false}, {"tekst": "Stanovništvo se podmlađuje.", "tacan": false}, {"tekst": "Ništa se ne menja, jer se to dvoje poništava.", "tacan": false}], "pomoc": ["Korak 1: Oba procesa — da li dodaju ili oduzimaju ljude?", "Korak 2: Ko najčešće odlazi, a ko ostaje? Šta to znači za prosečnu starost?", "Iz lekcije: nizak prirodni priraštaj i visoka emigracija zajedno smanjuju broj stanovnika."], "objasnjenje": "Oba procesa smanjuju broj stanovnika; pošto odlaze uglavnom mladi, stanovništvo i stari.", "iz_udzbenika": {"strana": 20, "odeljak": "Društveno-geografske odlike", "tekst": "Nizak prirodni priraštaj i iseljavanje zajedno dovode do pada broja stanovnika Srbije."}}, {"id": "stan-izbor-odlaze", "vrsta": "izbor", "tezina": "lako", "pojmovi": ["emigracija"], "pitanje": "U koje delove sveta se najčešće iseljavaju ljudi iz Srbije? (Više tačnih.)", "odgovori": [{"tekst": "Zapadna Evropa", "tacan": true}, {"tekst": "Severna Amerika", "tacan": true}, {"tekst": "Australija", "tacan": true}, {"tekst": "Centralna Afrika", "tacan": false}, {"tekst": "Antarktik", "tacan": false}], "pomoc": ["Ljudi se sele u razvijene države, tražeći bolje plate i posao.", "Tačna su tri odgovora — jedan je u Evropi, jedan preko Atlantika, jedan na drugom kontinentu na jugu.", "Iz lekcije: odlaze u Zapadnu Evropu, Severnu Ameriku i Australiju."], "objasnjenje": "Iseljavaju se u razvijene države Zapadne Evrope, Severne Amerike i Australije.", "iz_udzbenika": {"strana": 20, "odeljak": "Društveno-geografske odlike", "tekst": "Tražeći bolje ekonomske uslove, ljudi odlaze u razvijene zemlje Zapadne Evrope, Severne Amerike i Australije."}}, {"id": "stan-dopuni-odliv", "vrsta": "dopuni", "tezina": "lako", "pojmovi": ["odliv-mozgova"], "pitanje": "Dopuni rečenicu rečima iz banke.", "tekst": "Iseljavanje velikog broja visokoobrazovanih ljudi naziva se „{{odliv mozgova}}”.", "ponudjene": ["odliv mozgova", "urbanizacija", "prirodni priraštaj"], "pomoc": ["Pojam slikovito kaže da zemlja gubi pametne, školovane ljude.", "U nazivu se pominje „mozak”.", "Iz lekcije: to je „odliv mozgova”."], "objasnjenje": "Odliv mozgova je iseljavanje visokoobrazovanih ljudi koji posao traže u inostranstvu.", "iz_udzbenika": {"strana": 20, "odeljak": "Zanimljivost — odliv mozgova", "tekst": "Od početka novog veka Srbija ima problem da je napušta veliki broj visokoobrazovanih ljudi — to se zove „odliv mozgova”."}}, {"id": "stan-zakljuci-odliv", "vrsta": "zakljuci", "tezina": "srednje", "pojmovi": ["odliv-mozgova"], "pitanje": "Zašto je „odliv mozgova” poseban problem za Srbiju?", "odgovori": [{"tekst": "Zemlja gubi stručnjake u čije je školovanje ulagala.", "tacan": true}, {"tekst": "Zato što u zemlju dolazi previše stručnjaka.", "tacan": false}, {"tekst": "Zato što posle toga ima previše lekara i inženjera.", "tacan": false}, {"tekst": "To nije problem — ništa se ne gubi.", "tacan": false}], "pomoc": ["Korak 1: Ko odlazi — školovani ili neškolovani ljudi?", "Korak 2: Ko je platio njihove škole i fakultete, a ko sada ima koristi od njihovog rada?", "Iz lekcije: odliv mozgova je poseban demografski problem od početka novog veka."], "objasnjenje": "Srbija školuje stručnjake, a njihovo znanje i rad potom koriste druge zemlje.", "iz_udzbenika": {"strana": 20, "odeljak": "Zanimljivost — odliv mozgova", "tekst": "Iseljavanje visokoobrazovanih je poseban demografski problem, jer zemlja ostaje bez stručnjaka."}}, {"id": "stan-tn-gustina", "vrsta": "tacno_netacno", "tezina": "lako", "pojmovi": ["gustina-naseljenosti"], "tvrdnja": "Stanovništvo je ravnomerno raspoređeno po celoj Srbiji.", "tacno": false, "ispravke": [{"tekst": "Gustina naseljenosti je neravnomerna — ljudi su skupljeni oko velikih gradova.", "tacan": true}, {"tekst": "Najviše ljudi živi na vrhovima planina.", "tacan": false}, {"tekst": "Srbija je svuda podjednako retko naseljena.", "tacan": false}], "pomoc": ["Da li isto ljudi živi u Beogradu i na Prokletijama?", "Ljudi se okupljaju tamo gde ima posla.", "Iz lekcije: gustina naseljenosti je neravnomerna, a stanovništvo je oko velikih gradova."], "objasnjenje": "Netačno — gustina naseljenosti je neravnomerna; najviše ljudi živi oko velikih gradova.", "iz_udzbenika": {"strana": 20, "odeljak": "Društveno-geografske odlike", "tekst": "Stanovništvo Srbije je neravnomerno raspoređeno i skuplja se oko velikih gradova."}}, {"id": "stan-izbor-srbi", "vrsta": "izbor", "tezina": "lako", "pojmovi": ["srbija"], "pitanje": "Koliki deo stanovnika Srbije čine Srbi?", "odgovori": [{"tekst": "oko 81%", "tacan": true}, {"tekst": "oko 18%", "tacan": false}, {"tekst": "oko 50%", "tacan": false}, {"tekst": "100%", "tacan": false}], "pomoc": ["Srbi su ubedljivo najbrojniji narod u zemlji.", "Udeo je veći od tri četvrtine, ali u Srbiji žive i drugi narodi.", "Iz lekcije: Srbi čine oko 81% stanovnika."], "objasnjenje": "Srbi čine oko 81% stanovništva; ostatak čine drugi narodi.", "iz_udzbenika": {"strana": 20, "odeljak": "Društveno-geografske odlike", "tekst": "U nacionalnom sastavu dominiraju Srbi, sa oko 81% stanovnika."}}, {"id": "stan-izbor-sloveni", "vrsta": "izbor", "tezina": "lako", "pojmovi": ["srbija"], "pitanje": "Kojoj grupi naroda pripadaju Srbi?", "odgovori": [{"tekst": "Južnim Slovenima", "tacan": true}, {"tekst": "Zapadnim Slovenima", "tacan": false}, {"tekst": "romanskim narodima", "tacan": false}, {"tekst": "germanskim narodima", "tacan": false}], "pomoc": ["Srbi su slovenski narod.", "Zapadni Sloveni su npr. Česi i Poljaci; Srbi žive na Balkanu, na jugu.", "Iz lekcije: Srbi pripadaju Južnim Slovenima."], "objasnjenje": "Srbi pripadaju Južnim Slovenima, kao i Hrvati, Slovenci, Bugari i Makedonci.", "iz_udzbenika": {"strana": 20, "odeljak": "Društveno-geografske odlike", "tekst": "Udžbenik pita kojoj grupi naroda pripadaju Srbi — odgovor je Južni Sloveni."}}, {"id": "stan-dopuni-srbi", "vrsta": "dopuni", "tezina": "tesko", "pojmovi": ["srbija", "pravoslavlje"], "pitanje": "Dopuni rečenicu (bez ponuđenih reči).", "tekst": "Srbi čine oko {{81}} % stanovnika Srbije, pripadaju {{Južnim Slovenima|južnim Slovenima|Južni Sloveni}}, a najzastupljenija vera je {{pravoslavlje}}.", "pomoc": ["Udeo Srba je između 80 i 82 procenta.", "Srbi su slovenski narod sa juga Evrope; vera je hrišćanska, ali nije katolička.", "Iz lekcije: Srbi oko 81%, Južni Sloveni; najzastupljenije je pravoslavlje."], "objasnjenje": "Srbi čine oko 81% stanovnika, pripadaju Južnim Slovenima, a najzastupljenija vera je pravoslavlje.", "iz_udzbenika": {"strana": 20, "odeljak": "Društveno-geografske odlike", "tekst": "Srbi čine oko 81% stanovnika i pripadaju Južnim Slovenima; najzastupljenija veroispovest je pravoslavlje."}}, {"id": "stan-povezi-vere", "vrsta": "povezi", "tezina": "lako", "pojmovi": ["pravoslavlje", "islam", "katolicanstvo"], "pitanje": "Poveži veroispovest sa tim gde je najzastupljenija u Srbiji.", "parovi": [["pravoslavlje", "najzastupljenija vera u celoj zemlji"], ["islam", "jug i jugozapad"], ["katoličanstvo", "sever"]], "pomoc": ["Najveći broj stanovnika su pravoslavni Srbi.", "Katolika ima najviše u Vojvodini.", "Iz lekcije: pravoslavlje, zatim islam (jug, jugozapad) i katoličanstvo (sever)."], "objasnjenje": "Najzastupljenije je pravoslavlje; islam je na jugu i jugozapadu, a katoličanstvo na severu.", "iz_udzbenika": {"strana": 20, "odeljak": "Društveno-geografske odlike", "tekst": "U verskom sastavu prednjači pravoslavlje, zatim islam na jugu i jugozapadu i katoličanstvo na severu."}}, {"id": "stan-izbor-vera", "vrsta": "izbor", "tezina": "lako", "pojmovi": ["pravoslavlje"], "pitanje": "Koja je veroispovest najzastupljenija u Srbiji?", "odgovori": [{"tekst": "pravoslavlje", "tacan": true}, {"tekst": "islam", "tacan": false}, {"tekst": "katoličanstvo", "tacan": false}, {"tekst": "protestantizam", "tacan": false}], "pomoc": ["Većina stanovnika su Srbi.", "Islam i katoličanstvo su zastupljeni samo u nekim krajevima.", "Iz lekcije: najzastupljenije je pravoslavlje."], "objasnjenje": "Najzastupljenije je pravoslavlje; islam je na jugu i jugozapadu, a katoličanstvo na severu.", "iz_udzbenika": {"strana": 20, "odeljak": "Društveno-geografske odlike", "tekst": "Pravoslavlje je najzastupljenija vera u Srbiji."}}, {"id": "stan-tn-islam", "vrsta": "tacno_netacno", "tezina": "srednje", "pojmovi": ["islam", "katolicanstvo"], "tvrdnja": "Islam je najzastupljeniji na severu Srbije, u Vojvodini.", "tacno": false, "ispravke": [{"tekst": "Islam je zastupljen na jugu i jugozapadu, a na severu katoličanstvo.", "tacan": true}, {"tekst": "Islam je najzastupljenija vera u celoj Srbiji.", "tacan": false}, {"tekst": "U Srbiji uopšte nema muslimana.", "tacan": false}], "pomoc": ["Na severu, u Vojvodini, pored pravoslavnih ima najviše katolika.", "Islam je zastupljen na suprotnoj strani zemlje.", "Iz lekcije: islam — jug i jugozapad; katoličanstvo — sever."], "objasnjenje": "Netačno — islam je zastupljen na jugu i jugozapadu, a na severu je, posle pravoslavlja, katoličanstvo.", "iz_udzbenika": {"strana": 20, "odeljak": "Društveno-geografske odlike", "tekst": "Posle pravoslavlja, islam je zastupljen na jugu i jugozapadu, a katoličanstvo na severu Srbije."}}, {"id": "stan-klik-nis", "vrsta": "karta_klik", "tezina": "srednje", "pojmovi": ["nis", "niska-kotlina"], "pitanje": "Stanovništvo je skupljeno oko velikih gradova. Klikni na najveći grad juga Srbije, u Niškoj kotlini.", "cilj": {"mesto": "nis"}, "pomoc": ["Grad je na jugoistoku Srbije, na reci Nišavi.", "Nalazi se blizu mesta gde se Nišava uliva u Južnu Moravu.", "Klikni na Niš, jugoistočno od centra Srbije."], "objasnjenje": "Niš je u Niškoj kotlini, na Nišavi, blizu Južne Morave.", "iz_udzbenika": {"strana": 20, "odeljak": "Društveno-geografske odlike", "tekst": "Stanovništvo je skupljeno oko velikih gradova; Niš je središte Niške kotline."}}, {"id": "stan-gde-beograd", "vrsta": "gde_sam", "tezina": "lako", "pojmovi": ["beograd"], "pitanje": "Gde sam? Pročitaj trag i klikni na kartu.", "cilj": {"mesto": "beograd"}, "tragovi": ["Ja sam grad koji turisti najviše posećuju, zajedno sa Novim Sadom.", "U meni se Sava uliva u Dunav.", "Ja sam najveći grad Srbije.", "Ja sam Beograd, glavni grad Srbije."], "objasnjenje": "Beograd — glavni grad Srbije, na ušću Save u Dunav, najposećeniji gradski centar.", "iz_udzbenika": {"strana": 18, "odeljak": "Uvod — infokutija", "tekst": "Glavni grad Srbije je Beograd; zajedno sa Novim Sadom, on je i najposećeniji turistički grad.", "slika": "04-srbija/01-srbija-infografika.jpg"}}, {"id": "stan-gde-vranje", "vrsta": "gde_sam", "tezina": "tesko", "pojmovi": ["vranje", "vranjska-kotlina"], "pitanje": "Gde sam? Pročitaj trag i klikni na kartu.", "cilj": {"mesto": "vranje"}, "tragovi": ["Moja kotlina je jedna od tri najveće na Južnoj Moravi.", "Ja sam najjužnija od te tri kotline, blizu granice sa Severnom Makedonijom.", "Južno od Leskovca sam, a istočno od Kosova i Metohije.", "Ja sam Vranje — klikni na krajnji jug Srbije, u dolini Južne Morave."], "objasnjenje": "Vranje je u Vranjskoj kotlini, na krajnjem jugu Srbije, uz Južnu Moravu.", "iz_udzbenika": {"strana": 19, "odeljak": "Fizičko-geografske odlike — reljef", "tekst": "Najveće kotline na Južnoj Moravi su Niška, Leskovačka i Vranjska; Vranjska je najjužnija."}}]}, {"naslov": "Privreda", "zadaci": [{"id": "privreda-tn-razvoj", "vrsta": "tacno_netacno", "tezina": "lako", "pojmovi": ["zemlja-u-razvoju"], "tvrdnja": "Srbija je zemlja u razvoju.", "tacno": true, "pomoc": ["Setimo se zašto se mnogi iseljavaju — traže bolje ekonomske uslove.", "Srbija još nije među najrazvijenijim zemljama Evrope.", "Iz lekcije: Srbija je zemlja u razvoju."], "objasnjenje": "Tačno — Srbija je zemlja u razvoju.", "iz_udzbenika": {"strana": 21, "odeljak": "Privreda", "tekst": "Lekcija o privredi počinje time da je Srbija zemlja u razvoju."}}, {"id": "privreda-izbor-zemljoradnja", "vrsta": "izbor", "tezina": "lako", "pojmovi": ["zemljoradnja", "panonska-nizija"], "pitanje": "Koja grana poljoprivrede je najrazvijenija u Panonskoj niziji zahvaljujući plodnom zemljištu?", "odgovori": [{"tekst": "zemljoradnja", "tacan": true}, {"tekst": "ribolov na moru", "tacan": false}, {"tekst": "ovčarstvo na planinskim pašnjacima", "tacan": false}, {"tekst": "gajenje maslina", "tacan": false}], "pomoc": ["Panonska nizija je ravna i ima plodno zemljište.", "Na takvom tlu se ore i seje.", "Iz lekcije: plodno zemljište Panonske nizije omogućava razvijenu zemljoradnju."], "objasnjenje": "U Panonskoj niziji je razvijena zemljoradnja — gaje se žitarice i industrijsko bilje.", "iz_udzbenika": {"strana": 21, "odeljak": "Privreda — poljoprivreda", "tekst": "Panonska nizija ima plodno zemljište, pa je tu razvijena zemljoradnja — najviše žitarice i industrijsko bilje.", "slika": "04-srbija/03-vojvodina.jpg"}}, {"id": "privreda-izbor-industrijsko", "vrsta": "izbor", "tezina": "srednje", "pojmovi": ["industrijsko-bilje"], "pitanje": "Koje industrijsko bilje se gaji u Vojvodini? (Više tačnih.)", "odgovori": [{"tekst": "suncokret", "tacan": true}, {"tekst": "šećerna repa", "tacan": true}, {"tekst": "soja", "tacan": true}, {"tekst": "maslina", "tacan": false}, {"tekst": "čaj", "tacan": false}], "pomoc": ["Industrijsko bilje se prerađuje u fabrikama — u ulje, šećer i slično.", "Maslina traži sredozemnu klimu, a čaj toplu i vlažnu.", "Iz lekcije: suncokret, šećerna repa, soja i drugo."], "objasnjenje": "U Vojvodini se od industrijskog bilja gaje suncokret, šećerna repa i soja. Maslina i čaj ne uspevaju u kontinentalnoj klimi.", "iz_udzbenika": {"strana": 21, "odeljak": "Privreda — poljoprivreda", "tekst": "U Panonskoj niziji se, pored žitarica, gaji industrijsko bilje — suncokret, šećerna repa, soja i druge kulture."}}, {"id": "privreda-zakljuci-zitnica", "vrsta": "zakljuci", "tezina": "srednje", "pojmovi": ["vojvodina", "zemljoradnja", "kontinentalna-klima"], "pitanje": "Zašto se za Vojvodinu kaže da je „žitnica” Srbije?", "odgovori": [{"tekst": "Ravna je, niska, ima plodno zemljište i kontinentalnu klimu.", "tacan": true}, {"tekst": "Ima najviše planina i šuma u Srbiji.", "tacan": false}, {"tekst": "Ima izlaz na more pa lako izvozi žito.", "tacan": false}, {"tekst": "U njoj su najveći rudnici bakra.", "tacan": false}], "pomoc": ["Korak 1: Kakav je reljef Vojvodine i koliko je visoka?", "Korak 2: Kakvo je tamo zemljište i šta na njemu najbolje uspeva?", "Iz lekcije: plodna Panonska nizija ispod 100 m — razvijena zemljoradnja, žitarice i industrijsko bilje."], "objasnjenje": "Vojvodina je ravna i niska, sa plodnim zemljištem i kontinentalnom klimom — idealna za žitarice.", "iz_udzbenika": {"strana": 21, "odeljak": "Privreda — poljoprivreda", "tekst": "Zbog plodnog zemljišta Panonske nizije, Vojvodina je najvažnija oblast zemljoradnje u Srbiji.", "slika": "04-srbija/03-vojvodina.jpg"}}, {"id": "privreda-dopuni-jug", "vrsta": "dopuni", "tezina": "lako", "pojmovi": ["zemljoradnja"], "pitanje": "Dopuni rečenicu rečima iz banke.", "tekst": "Južno od Save i Dunava gaje se {{voće}} i povrće.", "ponudjene": ["voće", "masline", "pirinač"], "pomoc": ["Južno od Save i Dunava su brda i kotline sa voćnjacima.", "Masline i pirinač traže drugačiju klimu.", "Iz lekcije: južno od Save i Dunava gaje se voće i povrće."], "objasnjenje": "Južno od Save i Dunava gaje se voće i povrće.", "iz_udzbenika": {"strana": 21, "odeljak": "Privreda — poljoprivreda", "tekst": "U delu Srbije južno od Save i Dunava razvijeno je gajenje voća i povrća."}}, {"id": "privreda-izbor-vinogradi", "vrsta": "izbor", "tezina": "tesko", "pojmovi": ["vinogradarstvo", "fruska-gora", "vrsacke-planine", "metohijska-kotlina"], "pitanje": "Koji su krajevi Srbije poznati po vinogradima? (Više tačnih.)", "odgovori": [{"tekst": "Fruška gora", "tacan": true}, {"tekst": "Vršačke planine", "tacan": true}, {"tekst": "Metohijska kotlina", "tacan": true}, {"tekst": "Kosovska kotlina", "tacan": false}, {"tekst": "Deliblatska peščara", "tacan": false}], "pomoc": ["Vinova loza voli brežuljkaste, sunčane terene.", "Dve kotline u KiM su različite — u jednoj se vadi ugalj, u drugoj su vinogradi.", "Iz lekcije: vinogradarski krajevi su Fruška gora, Vršačke planine i Metohijska kotlina."], "objasnjenje": "Vinogradi su na brežuljcima Fruške gore, Vršačkih planina i u Metohijskoj kotlini. Kosovska kotlina je poznata po uglju.", "iz_udzbenika": {"strana": 21, "odeljak": "Privreda — poljoprivreda", "tekst": "Brežuljkasti predeli Fruške gore, Vršačkih planina i Metohijske kotline poznati su vinogradarski krajevi."}}, {"id": "privreda-povezi-poljoprivreda", "vrsta": "povezi", "tezina": "srednje", "pojmovi": ["zemljoradnja", "vinogradarstvo", "stocarstvo"], "pitanje": "Poveži kraj Srbije sa onim što se tu najviše gaji.", "parovi": [["Panonska nizija", "žitarice i industrijsko bilje"], ["južno od Save i Dunava", "voće i povrće"], ["Fruška gora i Vršačke planine", "vinova loza"], ["planinski predeli", "ovce i goveda"], ["niži predeli", "svinje i živina"]], "pomoc": ["U ravnici se gaje biljke na velikim njivama, a na planinskim pašnjacima stoka koja pase.", "Brežuljci u Vojvodini su poznati po vinu.", "Iz lekcije: ovčarstvo i govedarstvo u planinama, svinjarstvo i živinarstvo u nižim predelima."], "objasnjenje": "Nizija — žitarice i industrijsko bilje; jug — voće i povrće; Fruška gora i Vršačke planine — vinogradi; planine — ovce i goveda; niži predeli — svinje i živina.", "iz_udzbenika": {"strana": 21, "odeljak": "Privreda — poljoprivreda", "tekst": "Poljoprivreda se razlikuje po krajevima — od žitarica u niziji, preko voća na jugu i vinograda na brežuljcima, do stočarstva u planinama."}}, {"id": "privreda-tn-stocarstvo", "vrsta": "tacno_netacno", "tezina": "srednje", "pojmovi": ["stocarstvo"], "tvrdnja": "U planinskim predelima Srbije najviše se gaje svinje i živina.", "tacno": false, "ispravke": [{"tekst": "U planinskim predelima razvijeni su ovčarstvo i govedarstvo.", "tacan": true}, {"tekst": "U planinskim predelima se gaje samo pčele.", "tacan": false}, {"tekst": "U planinama nema stočarstva.", "tacan": false}], "pomoc": ["Koja stoka pase travu na planinskim pašnjacima?", "Svinje i živina se gaje u nižim predelima.", "Iz lekcije: u planinama ovčarstvo i govedarstvo, u nižim predelima svinjarstvo i živinarstvo."], "objasnjenje": "Netačno — u planinama su ovčarstvo i govedarstvo, a svinjarstvo i živinarstvo u nižim predelima.", "iz_udzbenika": {"strana": 21, "odeljak": "Privreda — poljoprivreda", "tekst": "U planinskim predelima gaje se ovce i goveda, a u nižim svinje i živina."}}, {"id": "privreda-tn-nafta", "vrsta": "tacno_netacno", "tezina": "lako", "pojmovi": ["nafta", "zemni-gas"], "tvrdnja": "Srbija ima velike zalihe nafte i gasa, pa ih izvozi.", "tacno": false, "ispravke": [{"tekst": "Zalihe nafte i gasa u Vojvodini su male, pa se većina uvozi.", "tacan": true}, {"tekst": "Srbija uopšte nema nafte ni gasa.", "tacan": false}, {"tekst": "Nafta se vadi na vrhu Kopaonika.", "tacan": false}], "pomoc": ["Lekcija kaže da se ovi energenti većinom kupuju iz drugih zemalja.", "Malo nafte i gasa ima u Vojvodini.", "Iz lekcije: u Vojvodini su male zalihe nafte i zemnog gasa, pa se većina uvozi."], "objasnjenje": "Netačno — Vojvodina ima male zalihe nafte i zemnog gasa, pa se većina uvozi.", "iz_udzbenika": {"strana": 21, "odeljak": "Privreda — energija i rude", "tekst": "U Vojvodini postoje male zalihe nafte i zemnog gasa; veći deo ovih energenata Srbija uvozi."}}, {"id": "privreda-zakljuci-uvoz", "vrsta": "zakljuci", "tezina": "srednje", "pojmovi": ["nafta", "zemni-gas"], "pitanje": "Srbija ima nafte i gasa u Vojvodini, a ipak ih uvozi. Zašto?", "odgovori": [{"tekst": "Zalihe su male i ne mogu da podmire potrebe zemlje.", "tacan": true}, {"tekst": "Zato što je zabranjeno vaditi naftu u Vojvodini.", "tacan": false}, {"tekst": "Zato što Srbija ne koristi naftu.", "tacan": false}, {"tekst": "Zato što je uvozna nafta uvek besplatna.", "tacan": false}], "pomoc": ["Korak 1: Kolike su zalihe nafte i gasa u Vojvodini?", "Korak 2: Ako domaće nafte nema dovoljno, odakle dolazi ostatak?", "Iz lekcije: zalihe su male, pa se većina uvozi."], "objasnjenje": "Domaće zalihe su male i nisu dovoljne, pa se ostatak mora uvoziti.", "iz_udzbenika": {"strana": 21, "odeljak": "Privreda — energija i rude", "tekst": "Zbog malih zaliha u Vojvodini, Srbija većinu nafte i zemnog gasa uvozi."}}, {"id": "privreda-izbor-ugalj", "vrsta": "izbor", "tezina": "srednje", "pojmovi": ["ugalj", "kosovska-kotlina"], "pitanje": "Gde se u Srbiji vadi ugalj? (Više tačnih.)", "odgovori": [{"tekst": "na južnom obodu Panonske nizije", "tacan": true}, {"tekst": "u Kosovskoj kotlini", "tacan": true}, {"tekst": "na vrhovima Prokletija", "tacan": false}, {"tekst": "u Deliblatskoj peščari", "tacan": false}], "pomoc": ["Ugalj se vadi na rubu ravnice i u jednoj kotlini u AP Kosovu i Metohiji.", "Tačna su dva odgovora.", "Iz lekcije: ugalj se vadi na južnom obodu Panonske nizije i u Kosovskoj kotlini."], "objasnjenje": "Ugalj se vadi na južnom obodu Panonske nizije i u Kosovskoj kotlini.", "iz_udzbenika": {"strana": 21, "odeljak": "Privreda — energija i rude", "tekst": "Ugalj se eksploatiše na južnom obodu Panonske nizije i u Kosovskoj kotlini."}}, {"id": "privreda-izbor-hidro", "vrsta": "izbor", "tezina": "srednje", "pojmovi": ["hidroelektrana", "lim"], "pitanje": "Na kojoj od ovih reka su izgrađene hidroelektrane?", "odgovori": [{"tekst": "Lim", "tacan": true}, {"tekst": "Tisa", "tacan": false}, {"tekst": "Begej", "tacan": false}, {"tekst": "Tamiš", "tacan": false}], "pomoc": ["Hidroelektrane se grade na brzim, planinskim rekama.", "Tisa, Begej i Tamiš su spore reke u ravnici Vojvodine.", "Iz lekcije: hidroelektrane su na Drini, Limu, Uvcu i Zapadnoj Moravi."], "objasnjenje": "Lim je planinska reka sa hidroelektranama; Tisa, Begej i Tamiš su ravničarske reke Vojvodine.", "iz_udzbenika": {"strana": 21, "odeljak": "Privreda — energija i rude", "tekst": "Planinske reke Drina, Lim, Uvac i Zapadna Morava imaju hidroenergetski potencijal i na njima je izgrađeno više hidroelektrana."}}, {"id": "privreda-dopuni-hidro", "vrsta": "dopuni", "tezina": "tesko", "pojmovi": ["hidroelektrana", "drina", "lim", "uvac", "zapadna-morava"], "pitanje": "Dopuni rečenicu (bez ponuđenih reči).", "tekst": "Hidroelektrane su izgrađene na planinskim rekama — Drini, {{Limu|Uvcu|Lim|Uvac}}, {{Uvcu|Limu|Uvac|Lim}} i {{Zapadnoj Moravi|Zapadna Morava}}.", "pomoc": ["Dve reke su na jugozapadu (kod Prijepolja i kod Sjenice), a treća je Morava koja teče kroz Čačak.", "Prva ima tri slova, druga četiri, a treća je „… Morava”.", "Iz lekcije: Drina, Lim, Uvac i Zapadna Morava."], "objasnjenje": "Hidroelektrane su na Drini, Limu, Uvcu i Zapadnoj Moravi.", "iz_udzbenika": {"strana": 21, "odeljak": "Privreda — energija i rude", "tekst": "Na planinskim rekama Drini, Limu, Uvcu i Zapadnoj Moravi izgrađeno je više hidroelektrana."}}, {"id": "privreda-zakljuci-hidro", "vrsta": "zakljuci", "tezina": "tesko", "pojmovi": ["hidroelektrana", "vojvodina"], "pitanje": "Zašto se hidroelektrane grade na Drini, Limu i Uvcu, a ne na malim rekama Vojvodine?", "odgovori": [{"tekst": "Planinske reke imaju veliki pad i brzinu, a reke u ravnici teku sporo.", "tacan": true}, {"tekst": "Reke u Vojvodini nemaju vode.", "tacan": false}, {"tekst": "U Vojvodini nije potrebna struja.", "tacan": false}, {"tekst": "Planinske reke su toplije.", "tacan": false}], "pomoc": ["Korak 1: Hidroelektrana dobija struju od vode koja brzo pada ili teče — gde voda teče brže?", "Korak 2: Kakav je reljef oko Drine, Lima i Uvca, a kakav u Vojvodini?", "Iz lekcije: planinske reke imaju hidroenergetski potencijal."], "objasnjenje": "Planinske reke imaju veliki pad i brzu vodu; ravničarske reke teku sporo, pa nemaju takav potencijal.", "iz_udzbenika": {"strana": 21, "odeljak": "Privreda — energija i rude", "tekst": "Hidroenergetski potencijal imaju planinske reke Drina, Lim, Uvac i Zapadna Morava."}}, {"id": "privreda-izbor-bor", "vrsta": "izbor", "tezina": "lako", "pojmovi": ["bor", "bakar"], "pitanje": "Po kojoj rudi je poznat Bor u istočnoj Srbiji?", "odgovori": [{"tekst": "bakar", "tacan": true}, {"tekst": "nafta", "tacan": false}, {"tekst": "so", "tacan": false}, {"tekst": "ugalj iz Kosovske kotline", "tacan": false}], "pomoc": ["Na fotografiji iz udžbenika je ogroman površinski rudnik u Boru.", "Ova ruda je crvenkasti metal od kog se prave žice i cevi.", "Iz lekcije: istočna Srbija je poznata po bakru; slika prikazuje rudnik bakra u Boru."], "objasnjenje": "Bor je poznat po površinskom rudniku bakra; istočna Srbija ima i srebro i zlato.", "iz_udzbenika": {"strana": 21, "odeljak": "Privreda — energija i rude", "tekst": "Fotografija prikazuje površinski rudnik bakra u Boru; istočna Srbija je poznata po bakru i plemenitim metalima.", "slika": "04-srbija/08-rudnik-bakra-bor.jpg"}}, {"id": "privreda-tn-istok", "vrsta": "tacno_netacno", "tezina": "tesko", "pojmovi": ["bakar", "plemeniti-metali"], "tvrdnja": "Istočna Srbija je poznata po ležištima nafte i zemnog gasa.", "tacno": false, "ispravke": [{"tekst": "Istočna Srbija je poznata po ležištima bakra i plemenitih metala (srebra i zlata).", "tacan": true}, {"tekst": "Istočna Srbija je poznata po ležištima uglja u Kosovskoj kotlini.", "tacan": false}, {"tekst": "Istočna Srbija nema nikakvih ruda.", "tacan": false}], "pomoc": ["Nafta i gas su u Vojvodini, a Kosovska kotlina nije na istoku.", "Seti se rudnika u Boru.", "Iz lekcije: istočna Srbija — bakar, srebro i zlato."], "objasnjenje": "Netačno — istočna Srbija je poznata po bakru i plemenitim metalima; nafta i gas su (u malim količinama) u Vojvodini.", "iz_udzbenika": {"strana": 21, "odeljak": "Privreda — energija i rude", "tekst": "Istočna Srbija je poznata po ležištima bakra i plemenitih metala — srebra i zlata.", "slika": "04-srbija/08-rudnik-bakra-bor.jpg"}}, {"id": "privreda-povezi-resursi", "vrsta": "povezi", "tezina": "srednje", "pojmovi": ["bakar", "ugalj", "nafta", "hidroelektrana"], "pitanje": "Poveži prirodno bogatstvo sa krajem u kom ga ima.", "parovi": [["bakar, srebro i zlato", "istočna Srbija (Bor)"], ["ugalj", "Kosovska kotlina"], ["nafta i zemni gas", "Vojvodina"], ["hidroenergija", "Drina, Lim i Uvac"]], "pomoc": ["Rudnik iz udžbenika je u Boru; nafta je u ravnici.", "Hidroenergiju daju brze planinske reke.", "Iz lekcije: bakar i plemeniti metali — istok; ugalj — Kosovska kotlina; nafta i gas — Vojvodina."], "objasnjenje": "Bakar, srebro i zlato — istočna Srbija; ugalj — Kosovska kotlina (i južni obod Panonske nizije); nafta i gas — Vojvodina; hidroenergija — planinske reke.", "iz_udzbenika": {"strana": 21, "odeljak": "Privreda — energija i rude", "tekst": "Svaki kraj Srbije ima svoja bogatstva — Vojvodina malo nafte i gasa, Kosovska kotlina ugalj, istok bakar i plemenite metale, a planinske reke hidroenergiju."}}, {"id": "privreda-zakljuci-kop", "vrsta": "zakljuci", "tezina": "lako", "pojmovi": ["bakar", "bor"], "pitanje": "Na fotografiji vidiš ogroman stepenasti kop bez biljaka, sa mašinama na dnu, u istočnoj Srbiji. Šta je to?", "odgovori": [{"tekst": "Površinski rudnik bakra u Boru.", "tacan": true}, {"tekst": "Hidroelektrana na Drini.", "tacan": false}, {"tekst": "Vinograd na Fruškoj gori.", "tacan": false}, {"tekst": "Kanjon reke Uvac.", "tacan": false}], "pomoc": ["Korak 1: Mašine i ogoljene stepenaste padine — da li je to delo prirode ili rudara?", "Korak 2: Po kojoj rudi je poznata istočna Srbija?", "Iz lekcije: slika prikazuje površinski rudnik bakra u Boru."], "objasnjenje": "To je površinski kop bakra u Boru — vađenje rude potpuno menja izgled predela.", "iz_udzbenika": {"strana": 21, "odeljak": "Privreda — energija i rude", "tekst": "Na fotografiji je površinski rudnik bakra u Boru, sa stepenastim, ogoljenim padinama.", "slika": "04-srbija/08-rudnik-bakra-bor.jpg"}}, {"id": "privreda-tn-tercijarni", "vrsta": "tacno_netacno", "tezina": "lako", "pojmovi": ["tercijarni-sektor"], "tvrdnja": "Industrija i tercijarni sektor (usluge) zapošljavaju najveći broj stanovnika Srbije.", "tacno": true, "pomoc": ["Razmisli gde danas radi većina ljudi — u fabrikama, prodavnicama, školama, bolnicama…", "Tercijarni sektor su usluge.", "Iz lekcije: industrija i tercijarni sektor su prilično razvijeni i zapošljavaju najviše ljudi."], "objasnjenje": "Tačno — industrija i usluge su prilično razvijene i zapošljavaju najviše stanovnika.", "iz_udzbenika": {"strana": 21, "odeljak": "Privreda", "tekst": "Industrija i tercijarni sektor u Srbiji su prilično razvijeni i u njima radi najveći broj stanovnika."}}, {"id": "privreda-klik-bor", "vrsta": "karta_klik", "tezina": "srednje", "pojmovi": ["bor", "bakar"], "pitanje": "Klikni na Bor, grad poznat po rudniku bakra.", "cilj": {"mesto": "bor"}, "pomoc": ["Bor je u istočnoj Srbiji.", "Nalazi se blizu granice sa Rumunijom i Bugarskom, južno od Đerdapa.", "Klikni na istok Srbije, severno od Stare planine."], "objasnjenje": "Bor je u istočnoj Srbiji, poznatoj po bakru, srebru i zlatu.", "iz_udzbenika": {"strana": 21, "odeljak": "Privreda — energija i rude", "tekst": "Istočna Srbija, sa rudnikom u Boru, poznata je po bakru i plemenitim metalima.", "slika": "04-srbija/08-rudnik-bakra-bor.jpg"}}, {"id": "privreda-klik-kosovska", "vrsta": "karta_klik", "tezina": "tesko", "pojmovi": ["kosovska-kotlina", "ugalj"], "pitanje": "Klikni na Kosovsku kotlinu, u kojoj se vadi ugalj.", "cilj": {"mesto": "kosovska-kotlina"}, "pomoc": ["Kotlina je u AP Kosovu i Metohiji.", "Nalazi se u istočnom delu pokrajine, oko Prištine.", "Klikni u istočni deo KiM, južno od Kopaonika."], "objasnjenje": "Kosovska kotlina je istočni deo AP Kosova i Metohije, oko Prištine; tu se vadi ugalj.", "iz_udzbenika": {"strana": 21, "odeljak": "Privreda — energija i rude", "tekst": "Pored južnog oboda Panonske nizije, ugalj se vadi i u Kosovskoj kotlini."}}, {"id": "privreda-klik-lim", "vrsta": "karta_klik", "tezina": "tesko", "pojmovi": ["lim", "hidroelektrana"], "pitanje": "Klikni na reku Lim, na kojoj su izgrađene hidroelektrane.", "cilj": {"mesto": "lim"}, "pomoc": ["Lim je planinska reka na jugozapadu Srbije.", "Teče iz Crne Gore pored Prijepolja i Priboja ka Drini.", "Klikni na jugozapad Srbije, južno od Zlatibora, blizu granice sa Crnom Gorom."], "objasnjenje": "Lim teče kroz jugozapadnu Srbiju (Prijepolje, Priboj); kao planinska reka ima hidroelektrane.", "iz_udzbenika": {"strana": 21, "odeljak": "Privreda — energija i rude", "tekst": "Lim je jedna od planinskih reka sa hidroenergetskim potencijalom."}}, {"id": "privreda-gde-bor", "vrsta": "gde_sam", "tezina": "srednje", "pojmovi": ["bor", "bakar", "plemeniti-metali"], "pitanje": "Gde sam? Pročitaj trag i klikni na kartu.", "cilj": {"mesto": "bor"}, "tragovi": ["U mojoj okolini ima srebra i zlata.", "Pored mene je ogroman površinski kop sa stepenastim padinama.", "Ja sam grad u istočnoj Srbiji poznat po bakru.", "Ja sam Bor — klikni na istok Srbije, severno od Stare planine."], "objasnjenje": "Bor — grad u istočnoj Srbiji, sa površinskim rudnikom bakra.", "iz_udzbenika": {"strana": 21, "odeljak": "Privreda — energija i rude", "tekst": "Istočna Srbija, sa Borom, poznata je po ležištima bakra, srebra i zlata.", "slika": "04-srbija/08-rudnik-bakra-bor.jpg"}}, {"id": "privreda-gde-metohija", "vrsta": "gde_sam", "tezina": "tesko", "pojmovi": ["metohijska-kotlina", "vinogradarstvo"], "pitanje": "Gde sam? Pročitaj trag i klikni na kartu.", "cilj": {"mesto": "metohijska-kotlina"}, "tragovi": ["Po meni su poznati vinogradi, kao i po Fruškoj gori i Vršačkim planinama.", "Ja sam kotlina u AP Kosovu i Metohiji.", "Sa zapada me zatvaraju Prokletije.", "Ja sam Metohijska kotlina — zapadni deo KiM."], "objasnjenje": "Metohijska kotlina — zapadni deo AP Kosova i Metohije, ispod Prokletija, poznata po vinogradima.", "iz_udzbenika": {"strana": 21, "odeljak": "Privreda — poljoprivreda", "tekst": "Metohijska kotlina je, uz Frušku goru i Vršačke planine, poznat vinogradarski kraj."}}]}, {"naslov": "Turizam", "zadaci": [{"id": "turizam-izbor-od-kada", "vrsta": "izbor", "tezina": "srednje", "pojmovi": ["turizam"], "pitanje": "Od kada se turizam u Srbiji intenzivno razvija?", "odgovori": [{"tekst": "od početka XXI veka", "tacan": true}, {"tekst": "od početka XIX veka", "tacan": false}, {"tekst": "od srednjeg veka", "tacan": false}, {"tekst": "tek od prošle godine", "tacan": false}], "pomoc": ["To je novija pojava, iz vremena kad su rođeni tvoji roditelji ili malo kasnije.", "Počelo je sa novim vekom — 21. vekom.", "Iz lekcije: turizam se intenzivno razvija od početka XXI veka."], "objasnjenje": "Turizam se u Srbiji intenzivno razvija od početka XXI veka.", "iz_udzbenika": {"strana": 21, "odeljak": "Privreda — turizam", "tekst": "Od početka XXI veka turizam u Srbiji beleži snažan razvoj."}}, {"id": "turizam-izbor-gradovi", "vrsta": "izbor", "tezina": "lako", "pojmovi": ["beograd", "novi-sad", "turizam"], "pitanje": "Koji gradski centri u Srbiji imaju najviše turista? (Više tačnih.)", "odgovori": [{"tekst": "Beograd", "tacan": true}, {"tekst": "Novi Sad", "tacan": true}, {"tekst": "Bor", "tacan": false}, {"tekst": "Vranje", "tacan": false}], "pomoc": ["To su dva najveća grada Srbije.", "Oba leže na Dunavu.", "Iz lekcije: najviše posetilaca imaju Beograd i Novi Sad."], "objasnjenje": "Najposećeniji gradski centri su Beograd i Novi Sad.", "iz_udzbenika": {"strana": 21, "odeljak": "Privreda — turizam", "tekst": "Među gradskim centrima najviše turista privlače Beograd i Novi Sad."}}, {"id": "turizam-povezi-mesta", "vrsta": "povezi", "tezina": "lako", "pojmovi": ["obedska-bara", "deliblatska-pescara", "meandri-uvca"], "pitanje": "Poveži prirodnu vrednost sa njenim opisom.", "parovi": [["Obedska bara", "bara uz Savu u Sremu"], ["Deliblatska peščara", "peščara u južnom Banatu"], ["Meandri Uvca", "zavijuci reke u dubokom kanjonu"]], "pomoc": ["Ime svake vrednosti već govori šta je — bara, pesak ili reka.", "„Meandri” su zavijuci reke.", "Iz lekcije: među prirodnim vrednostima su Obedska bara, Deliblatska peščara i meandri Uvca."], "objasnjenje": "Obedska bara je bara uz Savu, Deliblatska peščara je peščara u Banatu, a meandri Uvca su zavijuci reke u kanjonu.", "iz_udzbenika": {"strana": 21, "odeljak": "Privreda — turizam", "tekst": "Prirodne turističke vrednosti Srbije su, između ostalih, Đavolja varoš, meandri Uvca, Deliblatska peščara i Obedska bara.", "slika": "04-srbija/09-meandri-uvca.jpg"}}, {"id": "turizam-povezi-vrste", "vrsta": "povezi", "tezina": "lako", "pojmovi": ["turizam", "vrnjacka-banja", "kopaonik", "djavolja-varos", "beograd"], "pitanje": "Poveži mesto sa vrstom turizma koju nudi.", "parovi": [["Beograd", "gradski turizam"], ["Vrnjačka banja", "banjski turizam"], ["Kopaonik", "planinski turizam"], ["Đavolja varoš", "obilazak prirodne vrednosti"]], "pomoc": ["Jedno mesto je glavni grad, jedno banja, jedno visoka planina.", "Đavolja varoš je neobičan prirodni oblik na jugu Srbije.", "Iz lekcije: gradski centri, banjska i planinska mesta i prirodne vrednosti."], "objasnjenje": "Beograd — gradski; Vrnjačka banja — banjski; Kopaonik — planinski turizam; Đavolja varoš — prirodna vrednost.", "iz_udzbenika": {"strana": 21, "odeljak": "Privreda — turizam", "tekst": "Turiste privlače gradski centri, banjska i planinska mesta (Vrnjačka banja, Kopaonik, Zlatibor, Fruška gora) i prirodne vrednosti."}}, {"id": "turizam-tn-djavolja", "vrsta": "tacno_netacno", "tezina": "srednje", "pojmovi": ["djavolja-varos"], "tvrdnja": "Đavolja varoš je antropogena turistička vrednost (stvorio ju je čovek).", "tacno": false, "ispravke": [{"tekst": "Đavolja varoš je prirodna turistička vrednost.", "tacan": true}, {"tekst": "Đavolja varoš je srednjovekovna tvrđava.", "tacan": false}, {"tekst": "Đavolja varoš je hidroelektrana.", "tacan": false}], "pomoc": ["Antropogeno znači „stvoreno ljudskom rukom”.", "Lekcija Đavolju varoš navodi među prirodnim vrednostima, uz Uvac i Obedsku baru.", "Iz lekcije: prirodne vrednosti su Đavolja varoš, meandri Uvca, Deliblatska peščara, Obedska bara."], "objasnjenje": "Netačno — Đavolja varoš je prirodna vrednost, nastala delovanjem prirode, a ne čoveka.", "iz_udzbenika": {"strana": 21, "odeljak": "Privreda — turizam", "tekst": "Đavolja varoš je u udžbeniku navedena među prirodnim turističkim vrednostima Srbije."}}, {"id": "turizam-zakljuci-antropogena", "vrsta": "zakljuci", "tezina": "srednje", "pojmovi": ["turizam"], "pitanje": "Koja od ovih turističkih vrednosti je antropogena (stvorena ljudskom rukom)?", "odgovori": [{"tekst": "Petrovaradinska tvrđava", "tacan": true}, {"tekst": "meandri Uvca", "tacan": false}, {"tekst": "Obedska bara", "tacan": false}, {"tekst": "Deliblatska peščara", "tacan": false}], "pomoc": ["Korak 1: Šta znači „antropogeno” — delo prirode ili delo čoveka?", "Korak 2: Koju od ponuđenih vrednosti su izgradili ljudi?", "Iz lekcije: zadatak na str. 21 traži da se za svako mesto odredi da li je prirodna ili antropogena vrednost."], "objasnjenje": "Petrovaradinsku tvrđavu sagradili su ljudi, pa je antropogena; Uvac, Obedska bara i peščara su prirodne vrednosti.", "iz_udzbenika": {"strana": 21, "odeljak": "Zadatak — turistički lokaliteti", "tekst": "Učenik navodi pet turističkih mesta koja je posetio i za svako piše da li je prirodna ili antropogena (stvorena ljudskom rukom) vrednost."}}, {"id": "turizam-dopuni-banja", "vrsta": "dopuni", "tezina": "lako", "pojmovi": ["vrnjacka-banja", "zlatibor"], "pitanje": "Dopuni rečenicu rečima iz banke.", "tekst": "Poznata banja u Srbiji je {{Vrnjačka}} banja, a poznata planinska turistička mesta su Kopaonik i {{Zlatibor}}.", "ponudjene": ["Vrnjačka", "Obedska", "Zlatibor", "Bor"], "pomoc": ["Obedska je bara, a Bor je rudarski grad.", "Banja je u centralnoj Srbiji, kod Kraljeva; planina je na zapadu Srbije.", "Iz lekcije: banjska i planinska mesta — Vrnjačka banja, Kopaonik, Zlatibor, Fruška gora."], "objasnjenje": "Vrnjačka banja je poznata banja, a Kopaonik i Zlatibor su planinska turistička mesta.", "iz_udzbenika": {"strana": 21, "odeljak": "Privreda — turizam", "tekst": "Banjska i planinska mesta koja privlače turiste su Vrnjačka banja, Kopaonik, Zlatibor i Fruška gora."}}, {"id": "turizam-dopuni-prirodne", "vrsta": "dopuni", "tezina": "tesko", "pojmovi": ["djavolja-varos", "obedska-bara", "deliblatska-pescara"], "pitanje": "Dopuni rečenicu (bez ponuđenih reči).", "tekst": "Prirodne vrednosti Srbije su, između ostalih, {{Đavolja|Djavolja}} varoš na jugu, Deliblatska {{peščara|pescara}} u Banatu i Obedska {{bara}} u Sremu.", "pomoc": ["Prvo ime podseća na „đavola”; drugo mesto je puno peska; treće je močvarno jezerce uz Savu.", "Reči su — „Đavolja”, „peščara”, „bara”.", "Iz lekcije: Đavolja varoš, meandri Uvca, Deliblatska peščara, Obedska bara."], "objasnjenje": "Đavolja varoš, Deliblatska peščara i Obedska bara su prirodne turističke vrednosti Srbije.", "iz_udzbenika": {"strana": 21, "odeljak": "Privreda — turizam", "tekst": "Među prirodnim vrednostima su Đavolja varoš, meandri Uvca, Deliblatska peščara i Obedska bara."}}, {"id": "turizam-izbor-meandri", "vrsta": "izbor", "tezina": "srednje", "pojmovi": ["meandri-uvca", "uvac"], "pitanje": "Šta su meandri, po kojima je poznata reka Uvac?", "odgovori": [{"tekst": "zavijuci (krivine) rečnog toka", "tacan": true}, {"tekst": "vodopadi", "tacan": false}, {"tekst": "peščane dine", "tacan": false}, {"tekst": "podzemne pećine", "tacan": false}], "pomoc": ["Na fotografiji reka pravi velike krivine u kanjonu.", "Reka ne teče pravo, već vijuga.", "Iz lekcije: Uvac pravi slikovite meandre (zavijutke) u dubokom kanjonu."], "objasnjenje": "Meandri su zavijuci rečnog toka; Uvac ih pravi duboko u kanjonu.", "iz_udzbenika": {"strana": 21, "odeljak": "Privreda — turizam", "tekst": "Fotografija prikazuje meandre Uvca — velike zavijutke reke usečene u kanjon okružen šumom.", "slika": "04-srbija/09-meandri-uvca.jpg"}}, {"id": "turizam-tn-fruska", "vrsta": "tacno_netacno", "tezina": "lako", "pojmovi": ["fruska-gora", "turizam"], "tvrdnja": "Fruška gora je jedno od turističkih mesta Srbije.", "tacno": true, "pomoc": ["Pored vinograda, Fruška gora privlači i posetioce.", "Lekcija je navodi uz Vrnjačku banju, Kopaonik i Zlatibor.", "Iz lekcije: banjska i planinska mesta — Vrnjačka banja, Kopaonik, Zlatibor, Fruška gora."], "objasnjenje": "Tačno — Fruška gora je, uz Kopaonik, Zlatibor i Vrnjačku banju, poznato turističko mesto.", "iz_udzbenika": {"strana": 21, "odeljak": "Privreda — turizam", "tekst": "Fruška gora je navedena među planinskim turističkim mestima Srbije."}}, {"id": "turizam-zakljuci-sektor", "vrsta": "zakljuci", "tezina": "srednje", "pojmovi": ["turizam", "tercijarni-sektor"], "pitanje": "Recepcionar u hotelu na Zlatiboru radi u kom sektoru privrede?", "odgovori": [{"tekst": "U tercijarnom sektoru — turizam je usluga.", "tacan": true}, {"tekst": "U poljoprivredi, jer je hotel na planini.", "tacan": false}, {"tekst": "U rudarstvu, jer Zlatibor ima rude.", "tacan": false}, {"tekst": "Ni u jednom — turizam nije deo privrede.", "tacan": false}], "pomoc": ["Korak 1: Da li recepcionar nešto proizvodi, vadi iz zemlje ili pruža uslugu gostima?", "Korak 2: Kako se zove sektor u koji spadaju usluge?", "Iz lekcije: tercijarni sektor (usluge) je prilično razvijen i zapošljava mnogo ljudi; turizam jača od početka XXI veka."], "objasnjenje": "Turizam je usluga, pa recepcionar radi u tercijarnom sektoru.", "iz_udzbenika": {"strana": 21, "odeljak": "Privreda — turizam", "tekst": "Industrija i tercijarni sektor (usluge) zapošljavaju najviše ljudi, a turizam se snažno razvija od početka XXI veka."}}, {"id": "turizam-klik-beograd", "vrsta": "karta_klik", "tezina": "lako", "pojmovi": ["beograd"], "pitanje": "Klikni na Beograd.", "cilj": {"mesto": "beograd"}, "pomoc": ["Beograd je na severu centralne Srbije, odmah južno od Vojvodine.", "Leži na ušću Save u Dunav.", "Klikni na mesto gde se sastaju Sava i Dunav."], "objasnjenje": "Beograd je na ušću Save u Dunav, na granici Vojvodine i centralne Srbije.", "iz_udzbenika": {"strana": 21, "odeljak": "Privreda — turizam", "tekst": "Beograd je, uz Novi Sad, gradski centar sa najviše turista."}}, {"id": "turizam-klik-novi-sad", "vrsta": "karta_klik", "tezina": "lako", "pojmovi": ["novi-sad", "backa"], "pitanje": "Klikni na Novi Sad.", "cilj": {"mesto": "novi-sad"}, "pomoc": ["Novi Sad je u Vojvodini, na Dunavu.", "Leži u Bačkoj, preko puta Fruške gore.", "Klikni severozapadno od Beograda, na Dunavu."], "objasnjenje": "Novi Sad je na Dunavu, u južnoj Bačkoj, preko puta Fruške gore.", "iz_udzbenika": {"strana": 21, "odeljak": "Privreda — turizam", "tekst": "Novi Sad je, posle Beograda, gradski centar koji privlači najviše turista."}}, {"id": "turizam-klik- function bookHTML(z) {   // "Iz udžbenika": page, section, summary; the crop loads only where the private folder exists

function helpHTML(z, s, fresh) {
  if (isDone(s)) {
    const rev = s.status !== 'ok';

    '<p class="placeholder">Sada nosi ' + ptsFor(s.miss) + ' b. Još jedna greška posle poslednje pomoći otkriva odgovor.</p></div>';

  const list = (w.length ? w : opts.map((o, i) => i).filter(i => !opts[i].tacan && opts[i].zasto)).map(i => opts[i]);

    (ITEMS.some(z => z.odgovori && z.odgovori.some(o => o.zasto)) ? '<li><b>Svaka greška nešto kaže</b> — kad izabereš pogrešan odgovor, vidiš <i>zašto</i> nije tačan.</li>' : '') +
