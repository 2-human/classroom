<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Republika Srbija — kviz</title>
<style>

 :root{--hub-bg:#faf8f2;--hub-card:#fff;--hub-ink:#2b2b2b;--hub-head:#3a3528;--hub-mute:#6b6456;--hub-line:#e6e0d2;--hub-soft:#f3ecd8;--hub-accent:#b1271f;--hub-ok:#1f7a3a;--hub-nav-w:280px;--hub-drawer-w:440px}
 html:has(.app-body){overflow:hidden}
 .app-body{margin:0;height:100vh;height:100dvh;overflow:hidden;display:flex;flex-direction:column;max-width:100vw;background:var(--hub-bg);color:var(--hub-ink);font-family:system-ui,Segoe UI,Roboto,Arial,sans-serif}
 .app-bar{flex:0 0 auto;display:flex;align-items:center;gap:14px;padding:8px 16px;background:var(--hub-card);border-bottom:1px solid var(--hub-line);min-width:0;position:relative;z-index:50}
 .app-bar .app-menu{display:none;padding:0;width:36px;height:34px;font-size:18px;line-height:1;border:1px solid var(--hub-line);background:var(--hub-card);color:var(--hub-head);border-radius:7px;cursor:pointer}
 .app-bar .app-menu:hover{background:var(--hub-soft);color:var(--hub-head)}
 .brand{font-weight:700;font-size:15px;color:var(--hub-head);text-decoration:none;white-space:nowrap}
 .brand:hover{color:var(--hub-accent)}
 .app-crumbs{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--hub-mute);min-width:0;overflow:hidden;white-space:nowrap}
 .app-crumbs a{color:var(--hub-mute);text-decoration:none}
 .app-crumbs a:hover{color:var(--hub-accent)}
 .app-crumbs .sep{color:#b9b2a0}
 .app-crumbs .cur{color:var(--hub-head);font-weight:600;overflow:hidden;text-overflow:ellipsis}
 .bar-right{margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end;min-width:0}
 .app-grid{flex:1 1 auto;display:grid;grid-template-columns:var(--hub-nav-w) minmax(0,1fr);min-height:0}
 .app-nav{background:var(--hub-card);border-right:1px solid var(--hub-line);overflow:auto;padding:10px 10px 40px;min-height:0}
 .app-filter{width:100%;font:inherit;font-size:13px;padding:7px 9px;border:1px solid var(--hub-line);border-radius:6px;margin:0 0 4px;background:#fff;color:var(--hub-ink)}
 .app-filter:focus{outline:none;border-color:var(--hub-mute)}
 .app-nav .sec{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--hub-mute);padding:12px 6px 4px}
 .app-nav .cnt{font-size:11px;color:var(--hub-mute);font-variant-numeric:tabular-nums;letter-spacing:0;text-transform:none}
 .f-hide{display:none!important}
 .app-main{position:relative;overflow:auto;min-width:0;min-height:0;transition:margin-right .18s ease}
 .app-drawer{position:fixed;top:var(--htop,50px);right:0;bottom:0;width:var(--hub-drawer-w);max-width:100vw;background:var(--hub-card);border-left:1px solid var(--hub-line);box-shadow:-8px 0 24px rgba(58,53,40,.10);transform:translateX(105%);transition:transform .18s ease;z-index:60;display:flex;flex-direction:column}
 .app-drawer.open{transform:none}
 .drawer-head{display:flex;align-items:flex-start;gap:10px;padding:14px 16px 10px;border-bottom:1px solid var(--hub-line)}
 .drawer-head h2{margin:0;font-size:16px;color:var(--hub-head);flex:1 1 auto;overflow-wrap:anywhere}
 .app-drawer .drawer-close{border:0;background:none;padding:0 4px;font-size:24px;line-height:1;cursor:pointer;color:var(--hub-mute)}
 .app-drawer .drawer-close:hover{background:none;color:var(--hub-accent)}
 .drawer-body{flex:1 1 auto;overflow:auto;padding:12px 16px 24px;font-size:13px;line-height:1.55}
 .drawer-foot{flex:0 0 auto;border-top:1px solid var(--hub-line);padding:10px 16px;font-size:12px;color:var(--hub-mute)}
 .mtabs{display:flex;gap:2px;border-bottom:1px solid var(--hub-line);flex-wrap:wrap;background:var(--hub-card);padding:0 12px}
 .mtabs a{text-decoration:none;color:var(--hub-mute);font-size:13px;padding:9px 12px 8px;border-bottom:2px solid transparent}
 .mtabs a[aria-current="page"]{color:var(--hub-head);border-bottom-color:var(--hub-accent);font-weight:600}
 .bar-menu-wrap{position:relative}
 .bar-menu{display:none;position:absolute;right:0;top:calc(100% + 8px);z-index:70;background:var(--hub-card);border:1px solid var(--hub-line);border-radius:10px;box-shadow:0 6px 20px rgba(0,0,0,.16);padding:8px;min-width:240px}
 .bar-menu.open{display:flex;flex-direction:column;align-items:stretch;gap:6px}
 .tbl{width:100%;border-collapse:collapse;background:var(--hub-card);border:1px solid var(--hub-line);border-radius:6px;font-size:13px}
 .tbl th{text-align:left;font-weight:600;font-size:11.5px;color:var(--hub-mute);padding:8px 10px;border-bottom:1px solid var(--hub-line);background:#fcfaf4;white-space:nowrap}
 .tbl td{padding:7px 10px;border-bottom:1px solid #f0ebe0;vertical-align:top}
 .tbl td.num,.tbl th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
 .tbl tr.clk{cursor:pointer} .tbl tr.clk:hover td{background:#fbf7ec}
 @media (min-width:1200px){ .app-body:has(.app-drawer.open) .app-main{margin-right:var(--hub-drawer-w)} }
 @media (max-width:760px){
   .app-bar{gap:10px;padding:8px 12px}
   .app-bar .app-menu{display:inline-block}
   .app-crumbs{display:none}
   .app-grid{grid-template-columns:minmax(0,1fr)}
   .app-nav{position:fixed;top:var(--htop,50px);left:0;bottom:0;width:300px;max-width:88vw;z-index:55;transform:translateX(-105%);transition:transform .18s ease;box-shadow:8px 0 24px rgba(58,53,40,.10)}
   .app-nav.open{transform:none}
   .app-drawer{width:100vw}
 }
 @media print{
   html:has(.app-body){overflow:visible}
   .app-body{height:auto;overflow:visible;display:block}
   .app-grid{display:block}
   .app-main,.app-nav{overflow:visible}
   .app-drawer,.app-filter,.app-menu,.bar-menu-wrap,.mtabs{display:none!important}
 }

 :root{--ink:#2b2b2b;--muted:#6b6456;--edge:#b1271f;--accent:#1f7a3a;--border:#e6e0d2;--soft:#fefcf7;--warn:#c98a2c;
       --sea:#cfe6f2;--land:#efeae0;--land-se:#f3ecd8;--bord:#8a8170}
 *{box-sizing:border-box}
 button{font:inherit;padding:7px 14px;border:1px solid var(--edge);background:#fff;color:var(--edge);border-radius:8px;cursor:pointer}
 button:hover{background:var(--edge);color:#fff}
 button.ok{border-color:var(--accent);color:var(--accent)} button.ok:hover{background:var(--accent);color:#fff}
 button:disabled{opacity:.45;cursor:default;background:#fff;color:inherit}
 .opt:disabled,.tn button:disabled,.mcell:disabled,.blank:disabled{opacity:1;cursor:default}
 .opt:disabled:not(.right):not(.wrong){opacity:.6}
 .bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-size:14px}
 .bar-menu-btn{padding:5px 12px;font-size:16px;line-height:1;border-color:var(--muted);color:#3a3528}
 .bar-menu-btn:hover{background:#f3ecd8;color:#3a3528}
 .bar-menu button{width:100%;text-align:left}
 .bar-menu .menu-link{display:block;font-size:13px;color:var(--edge);text-decoration:none;padding:7px 14px;border:1px dashed #e6b0b0;border-radius:8px}
 .mode-switch{display:inline-flex}
 .ms-btn{padding:5px 12px;border-color:#6b6456;color:#3a3528;min-width:5.5em}
 .ms-btn:first-child{border-radius:8px 0 0 8px} .ms-btn:last-child{border-radius:0 8px 8px 0;border-left:none}
 .ms-btn:hover{background:#f3ecd8;color:#3a3528}
 .ms-btn.active{background:#3a3528;color:#fff;border-color:#3a3528}
 .stat{background:#f3ecd8;border:1px solid #e1d8c2;border-radius:8px;padding:4px 10px;white-space:nowrap}
 .stat b{font-size:15px;color:var(--accent)}
 .intro p{font-size:14px;color:#4a4434;line-height:1.6;margin:0 0 10px}
 .intro ul{margin:0 0 10px;padding-left:18px;font-size:13.5px;line-height:1.55}
 /* navigation: items */
 .it-row{display:flex;align-items:center;gap:8px;width:100%;border:0;border-radius:5px;background:none;color:var(--ink);font:inherit;font-size:13px;text-align:left;padding:5px 6px;cursor:pointer}
 .it-row:hover{background:#f6f1e4;color:var(--ink)}
 .it-row.sel{background:#efe7d2;font-weight:600}
 .it-row.off{opacity:.4}
 .it-row .st{flex:0 0 16px;text-align:center;color:#b9b2a0}
 .it-row.ok .st{color:var(--accent)} .it-row.rev .st,.it-row.fail .st{color:var(--edge)} .it-row.part .st{color:var(--warn)}
 .it-row .lbl{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
 .it-row .pt{flex:0 0 auto;font-size:11px;color:var(--muted);font-weight:400;font-variant-numeric:tabular-nums}
 .tz{flex:0 0 auto;display:inline-block;min-width:1.5em;text-align:center;font-size:10px;font-weight:700;border-radius:8px;padding:1px 5px;letter-spacing:.02em}
 .tz-lako{background:#e3f2e8;color:#1f6b3a} .tz-srednje{background:#fbefd5;color:#8a5a14} .tz-tesko{background:#f8dcd8;color:#8a2a22}
 .tz-legend{display:flex;gap:8px;flex-wrap:wrap;font-size:11px;color:var(--muted);padding:2px 6px 0}
 /* main: item */
 .item{padding:20px 24px 40px;max-width:1100px}
 .ihead{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-bottom:8px}
 .vchip{font-size:11px;text-transform:uppercase;letter-spacing:.05em;border:1px solid var(--border);border-radius:9px;padding:1px 8px;background:#fff}
 .item h2.q{font-size:18px;line-height:1.4;color:#3a3528;margin:0 0 14px}
 .opts{display:flex;flex-direction:column;gap:8px;max-width:640px}
 .opt{display:flex;gap:10px;align-items:flex-start;text-align:left;border:1px solid var(--border);background:#fff;color:var(--ink);border-radius:8px;padding:10px 12px;font-size:14.5px;line-height:1.4}
 .opt:hover{background:#fbf7ec;color:var(--ink)}
 .opt.picked{border-color:#3a3528;background:#f6f1e4}
 .opt.wrong{border-color:#e6b0b0;background:#fdecec;color:#8a2a22} .opt.wrong .ot{text-decoration:line-through}
 .opt.right{border-color:#9fd5b6;background:#e8f5ec;color:#13602c;font-weight:600}
 .opt .box{flex:0 0 18px;height:18px;border:1.5px solid #6b6456;border-radius:4px;margin-top:1px}
 .opt.picked .box{background:#3a3528;box-shadow:inset 0 0 0 3px #fff}
 .opt.round .box{border-radius:50%}
 .tn{display:flex;gap:12px;margin:4px 0 14px}
 .tn button{min-width:8em;padding:10px 18px;font-size:15px}
 .tn button.right{background:var(--accent);border-color:var(--accent);color:#fff}
 .tn button.wrong{background:#fdecec;border-color:#e6b0b0;color:#8a2a22}
 .stmt{font-size:16px;line-height:1.5;border-left:3px solid #e1d8c2;padding:6px 12px;margin:0 0 14px;background:#fff}
 .sub-q{font-weight:600;color:#3a3528;margin:16px 0 8px}
 .cloze{font-size:16px;line-height:2.3;max-width:720px}
 .blank{display:inline-block;min-width:5.5em;border:0;border-bottom:2px solid #6b6456;background:#fff;text-align:center;font:inherit;font-weight:600;color:#3a3528;padding:0 6px;margin:0 3px;border-radius:4px 4px 0 0;cursor:pointer}
 input.blank{cursor:text;width:7em}
 .blank:hover{background:#fbf7ec;color:#3a3528}
 .blank.cur{border-bottom-color:var(--edge);background:#fff7f3}
 .blank.lock{border-bottom-color:var(--accent);background:#e8f5ec;color:#13602c;cursor:default}
 .blank.bad{border-bottom-color:var(--edge);background:#fdecec;color:#8a2a22}
 .blank.rev{border-bottom-color:var(--warn);background:#fdf3e2;color:#8a5a14}
 .bank{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 0}
 .bank button{padding:5px 12px;border-color:#6b6456;color:#3a3528;border-radius:16px}
 .bank button:hover{background:#f3ecd8;color:#3a3528}
 .bank button.used{opacity:.3;pointer-events:none}
 .match{display:grid;grid-template-columns:1fr 1fr;gap:10px 28px;max-width:720px}
 .match .col{display:flex;flex-direction:column;gap:8px}
 .mcell{text-align:left;border:1px solid var(--border);background:#fff;color:var(--ink);border-radius:8px;padding:9px 12px;font-size:14px}
 .mcell:hover{background:#fbf7ec;color:var(--ink)}
 .mcell.cur{border-color:#3a3528;box-shadow:0 0 0 2px rgba(58,53,40,.15)}
 .mcell.done{border-color:#9fd5b6;background:#e8f5ec;color:#13602c;cursor:default}
 .mcell.rev{border-color:#ecc98a;background:#fdf3e2;color:#8a5a14;cursor:default}
 .mcell.bad{animation:shake .3s;border-color:#e6b0b0;background:#fdecec}
 .mcell .n{display:inline-block;min-width:1.4em;font-weight:700;margin-right:6px;color:var(--muted)}
 @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
 .iactions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:18px}
 .fb{font-size:14px;font-weight:600;min-height:1.4em}
 .fb.ok{color:var(--accent)} .fb.bad{color:var(--edge)} .fb.info{color:var(--muted);font-weight:400}
 .expl{margin-top:14px;padding:10px 14px;border-radius:8px;background:#e8f5ec;border:1px solid #bfe0c8;color:#13602c;font-size:14px;line-height:1.5;max-width:720px}
 .expl.rev{background:#fdf3e2;border-color:#f0d878;color:#6b4a10}
 .help-inline{display:none}
 /* map */
 .mapwrap{position:relative;margin-top:6px;border:1px solid var(--border);border-radius:8px;overflow:hidden;background:var(--sea);aspect-ratio:1000/669;max-height:70vh;touch-action:none}
 .mapwrap svg{width:100%;height:100%;display:block;cursor:crosshair}
 .mapwrap svg.drag{cursor:grabbing}
 .mapwrap .c{fill:var(--land);stroke:var(--bord);stroke-width:.6;vector-effect:non-scaling-stroke}
 .mapwrap .c.se{fill:var(--land-se)}
 .mapwrap .c.se:hover{fill:#e9dcb8}
 .mapwrap .c.hit{fill:#bfe0c8} .mapwrap .c.miss{fill:#f3c9c4} .mapwrap .c.revc{fill:#f6dca6}
 .mapwrap .mk{pointer-events:none}
 .mapwrap .mk circle{stroke:#fff;vector-effect:non-scaling-stroke}
 .mapwrap .mk text{font-size:13px;font-weight:700;paint-order:stroke;stroke:#fff;stroke-width:3px;vector-effect:non-scaling-stroke}
 .zbar{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px}
 .zbar button{width:36px;height:36px;padding:0;font-size:18px;font-weight:700;background:#fff;border-color:#6b6456;color:#3a3528;box-shadow:0 1px 3px rgba(0,0,0,.2)}
 .zbar button:hover{background:#f3ecd8;color:#3a3528}
 .zhint{position:absolute;left:10px;bottom:8px;font-size:11.5px;color:var(--muted);background:rgba(255,255,255,.85);border-radius:6px;padding:3px 8px;pointer-events:none}
 .clues{list-style:none;margin:0 0 6px;padding:0;max-width:720px}
 .clues li{padding:7px 10px;margin:0 0 6px;border-left:3px solid #e1d8c2;background:#fff;font-size:14.5px;line-height:1.45}
 .clues li:last-child{border-left-color:var(--edge)}
 .clues .k{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-right:6px}
 /* drawer content */
 .hl h3{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:14px 0 6px}
 .hl ol{margin:0;padding-left:20px} .hl li{margin:0 0 10px;line-height:1.5}
 .hl li.new{animation:flash 1.2s}
 @keyframes flash{0%{background:#fff3c4}100%{background:transparent}}
 .hl .placeholder{color:#9b9387;font-style:italic}
 .hl .chips{display:flex;flex-wrap:wrap;gap:6px}
 .hl .pchip{font-size:12px;border:1px solid var(--border);border-radius:10px;padding:1px 9px;background:#fefcf7}
 .hl a{color:var(--edge);text-decoration:none}
 .hl ul{margin:0;padding-left:18px} .hl ul li{margin:3px 0}
 .hl .ref{font-size:12px;color:var(--muted);margin:0 0 6px}
 .hl figure{margin:6px 0 10px} .hl figure img{display:block;max-width:100%;border-radius:6px;border:1px solid var(--border)}
 .hl figcaption{font-size:11.5px;color:var(--muted);margin-top:4px}
 .hl .book{border-left:3px solid #e1d8c2;padding:2px 0 2px 12px;margin:6px 0 4px}
 /* summary */
 .sum{padding:22px 26px 40px;max-width:860px}
 .sum h1{font-size:22px;margin:0 0 6px;color:#3a3528}
 .sum .big{font-size:30px;font-weight:700;color:var(--accent)}
 .sum .tbl{margin:14px 0}
 .sum .sub{color:var(--muted);margin:0 0 6px} .sum .lead{color:var(--muted);max-width:640px;line-height:1.5}
 .rv{border:1px solid var(--border);border-radius:8px;background:#fff;padding:10px 14px;margin:12px 0}
 .rv .rq{margin:4px 0 8px;font-weight:600;color:#3a3528} .rv .rl{margin:0;font-size:12px;color:var(--muted)}
 .rlog{margin:2px 0 8px;padding-left:18px;font-size:13.5px} .rlog .ok{color:var(--accent)} .rlog .bad{color:var(--edge)}
 .rv .rc{margin:0;font-size:13.5px}
 /* why a wrong option is wrong */
 .opt .why{display:block;font-size:12.5px;font-weight:400;color:#6b4a10;text-decoration:none;margin-top:4px;line-height:1.4}
 .opt.wrong{flex-wrap:wrap} .opt.wrong > span:last-child{flex:1 1 0}
 .why-box{border-left:3px solid var(--warn);background:#fdf3e2;padding:6px 10px;margin:0 0 10px;font-size:13.5px;line-height:1.45}
 /* datum */
 .dt{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:4px 0 6px}
 .dt input{font:inherit;font-size:18px;font-weight:600;width:6.5em;text-align:center;padding:8px;border:1.5px solid #6b6456;border-radius:8px}
 .dt input.bad{border-color:var(--edge);background:#fdecec} .dt input:disabled{background:#e8f5ec;border-color:#9fd5b6;color:#13602c}
 .dt .ev{font-size:16px;border-left:3px solid #e1d8c2;padding:6px 12px;background:#fff;margin:0 0 14px}
 /* poredjaj */
 .ord{display:grid;grid-template-columns:1fr 1fr;gap:18px;max-width:900px}
 .ord h4{margin:0 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
 .ord .col{display:flex;flex-direction:column;gap:8px}
 .slot{display:flex;gap:8px;align-items:center;min-height:42px;text-align:left;border:1px dashed #cfc6b0;background:#fff;color:var(--ink);border-radius:8px;padding:8px 10px;font-size:14px}
 .slot .n{flex:0 0 1.6em;font-weight:700;color:var(--muted)}
 .slot.fill{border-style:solid;border-color:#3a3528} .slot.lock{border-style:solid;border-color:#9fd5b6;background:#e8f5ec;color:#13602c;cursor:default}
 .slot.rev{border-style:solid;border-color:#ecc98a;background:#fdf3e2;color:#8a5a14} .slot .yr{margin-left:auto;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
 .pool button{text-align:left}
 /* lanac */
 .chain{display:flex;flex-wrap:wrap;align-items:stretch;gap:6px;margin:0 0 16px;max-width:980px}
 .chain .lk{flex:1 1 150px;border:1px solid var(--border);background:#fff;border-radius:8px;padding:9px 11px;font-size:14px;line-height:1.4}
 .chain .lk.q{border:2px dashed var(--edge);background:#fff7f3;color:var(--edge);font-weight:700;text-align:center;display:flex;align-items:center;justify-content:center}
 .chain .lk.q.ok{border:1px solid #9fd5b6;background:#e8f5ec;color:#13602c;font-weight:600}
 .chain .ar{align-self:center;color:var(--muted);font-size:18px}
 /* izvor */
 .src{max-width:760px;margin:0 0 16px;border:1px solid #e1d8c2;border-radius:8px;background:#fffdf6;padding:12px 16px}
 .src .who{font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
 .src blockquote{margin:0;font-family:Georgia,serif;font-size:15.5px;line-height:1.55;color:#3a3528}
 .src .nt{font-size:12px;color:var(--muted);margin:8px 0 0}
 /* uporedi */
 .cmp{border-collapse:collapse;max-width:900px;width:100%}
 .cmp td{border-top:1px solid var(--border);padding:8px 6px;vertical-align:top;font-size:14px;line-height:1.4}
 .cmp td.bt{white-space:nowrap;text-align:right}
 .cmp .cb{padding:4px 9px;margin:2px;font-size:12.5px;border-color:#6b6456;color:#3a3528}
 .cmp .cb:hover{background:#f3ecd8;color:#3a3528} .cmp .cb.on{background:#3a3528;color:#fff}
 .cmp .cb.right{background:var(--accent);border-color:var(--accent);color:#fff} .cmp .cb.wrong{background:#fdecec;border-color:#e6b0b0;color:#8a2a22}
 .cmp tr.lock td:first-child{color:#13602c} .cmp tr.bad td:first-child{color:#8a2a22}
 .cmp .why{display:block;font-size:12.5px;color:#6b4a10;margin-top:3px}

<script>
(function () {
  const root = document.documentElement;
  const bar = document.querySelector('.app-bar');
  function setTop() { if (bar) root.style.setProperty('--htop', bar.offsetHeight + 'px'); }
  window.addEventListener('resize', setTop);
  setTop();

  // ☰ navigation (only shown at ≤760px)
  const nav = document.getElementById('app-nav');
  const navBtn = document.getElementById('app-menu');
  const navOverlay = () => window.matchMedia && window.matchMedia('(max-width:760px)').matches;
  function setNav(open) {
    if (!nav) return;
    nav.classList.toggle('open', !!open);
    if (navBtn) navBtn.setAttribute('aria-expanded', String(!!open));
  }
  if (navBtn) navBtn.addEventListener('click', e => { e.stopPropagation(); setNav(!nav.classList.contains('open')); });

  // navigation filter: case- and diacritic-insensitive (š, č, ć, ž, đ)
  const filter = document.getElementById('app-filter');
  const norm = s => String(s || '').toLowerCase().replace(/đ/g, 'd').normalize('NFD').replace(/[̀-ͯ]/g, '');
  function applyFilter() {
    const q = norm(filter.value.trim());
    document.querySelectorAll('#app-nav [data-filter]').forEach(el =>
      el.classList.toggle('f-hide', !!q && !norm(el.dataset.filter).includes(q)));
    document.querySelectorAll('#app-nav [data-filter-group]').forEach(g =>
      g.classList.toggle('f-hide', !!q && !g.querySelector('[data-filter]:not(.f-hide)')));
  }
  if (filter) filter.addEventListener('input', applyFilter);

  // ⋯ menus: a button with data-menu="<id>" toggles .bar-menu#<id>; a button inside closes it
  function setMenu(m, open) {
    m.classList.toggle('open', !!open);
    const b = document.querySelector('[data-menu="' + m.id + '"]');
    if (b) b.setAttribute('aria-expanded', String(!!open));
  }
  document.querySelectorAll('[data-menu]').forEach(btn => {
    const m = document.getElementById(btn.dataset.menu);
    if (!m) return;
    btn.addEventListener('click', e => { e.stopPropagation(); setMenu(m, !m.classList.contains('open')); });
    m.addEventListener('click', e => { e.stopPropagation(); if (e.target.closest('button')) setMenu(m, false); });
  });
  document.addEventListener('click', e => {
    // composedPath: the clicked node may already be re-rendered away (e.g. a step's "next" button)
    if (!e.composedPath().some(n => n.dataset && n.dataset.keepMenus)) document.querySelectorAll('.bar-menu.open').forEach(m => setMenu(m, false));
    if (nav && nav.classList.contains('open') && navOverlay() && !nav.contains(e.target)) setNav(false);
  });
  document.addEventListener('keydown', e => {
    if (e.key !== 'Escape') return;
    document.querySelectorAll('.bar-menu.open').forEach(m => setMenu(m, false));
    const x = document.querySelector('.app-drawer.open .drawer-close');
    if (x && x.offsetParent !== null) x.click();
  });

  window.HubShell = { setNav, setMenu, applyFilter, navOverlay };
})();
</script>

"}}, {"id": "polozaj-izbor-povrsina", "vrsta": "izbor", "tezina": "srednje", "pojmovi": ["srbija"], "pitanje": "Kolika je površina Srbije prema udžbeniku?", "odgovori": [{"tekst": "88.499 km²", "tacan": true}, {"tekst": "8.849 km²", "tacan": false}, {"tekst": "884.990 km²", "tacan": false}, {"tekst": "48.899 km²", "tacan": false}], "pomoc": ["Srbija je srednje velika evropska država — nije ni sasvim mala ni ogromna.", "Broj ima pet cifara i počinje dvema osmicama.", "Iz lekcije: površina Srbije je 88.499 km²."], "objasnjenje": "Srbija ima 88.499 km². Ponuđeni brojevi sa jednom cifrom više ili manje su deset puta veći ili manji.", "iz_udzbenika": {"strana": 18, "odeljak": "Uvod — infokutija", "tekst": "Prema infokutiji, površina Srbije je 88.499 km², a u njoj živi oko 8,3 miliona ljudi.", "slika": "04-srbija/01-srbija-infografika.jpg"}}, {"id": "polozaj-dopuni-povrsina", "vrsta": "dopuni", "tezina": "tesko", "pojmovi": ["srbija"], "pitanje": "Dopuni rečenicu (bez ponuđenih reči).", "tekst": "Površina Srbije je {{88.499|88499|88 499}} km², a službeni jezik je {{srpski}}.", "pomoc": ["Površina ima pet cifara i počinje sa 88.", "Posle 88 dolazi broj od tri cifre koji počinje četvorkom i završava se dvema devetkama.", "Iz lekcije: 88.499 km²; službeni jezik je srpski."], "objasnjenje": "Površina Srbije je 88.499 km², a službeni jezik je srpski.", "iz_udzbenika": {"strana": 18, "odeljak": "Uvod — infokutija", "tekst": "Osnovni podaci o Srbiji — 8,3 miliona stanovnika, 88.499 km², glavni grad Beograd, službeni jezik srpski.", "slika": "04-srbija/01-srbija-infografika.jpg"}}, {"id": "polozaj-tn-more", "vrsta": "tacno_netacno", "tezina": "lako", "pojmovi": ["srbija", "jadransko-more"], "tvrdnja": "Srbija ima izlaz na Jadransko more.", "tacno": false, "ispravke": [{"tekst": "Srbija nema izlaz na more — ona je kontinentalna zemlja.", "tacan": true}, {"tekst": "Srbija izlazi na Crno more.", "tacan": false}, {"tekst": "Srbija izlazi na Egejsko more.", "tacan": false}], "pomoc": ["Pogledaj na karti da li Srbija ima obalu.", "Između Srbije i Jadrana nalaze se druge države.", "Iz lekcije: Srbija je kontinentalna zemlja — nema izlaz na more."], "objasnjenje": "Netačno — Srbija je kontinentalna zemlja, bez izlaza na more.", "iz_udzbenika": {"strana": 18, "odeljak": "Uvod — položaj", "tekst": "Srbija nema more, pa je kontinentalna zemlja; najvećim delom leži na Balkanskom poluostrvu.", "slika": "04-srbija/01-srbija-infografika.jpg"}}, {"id": "polozaj-izbor-cetiri", "vrsta": "izbor", "tezina": "srednje", "pojmovi": ["srbija", "balkansko-poluostrvo", "panonska-nizija", "dunav"], "pitanje": "Kako udžbenik opisuje Srbiju prema njenom položaju? (Više tačnih.)", "odgovori": [{"tekst": "balkanska", "tacan": true}, {"tekst": "podunavska", "tacan": true}, {"tekst": "panonska", "tacan": true}, {"tekst": "planinska", "tacan": true}, {"tekst": "primorska", "tacan": false}, {"tekst": "alpska", "tacan": false}], "pomoc": ["Razmisli na kom poluostrvu leži, koja velika reka kroz nju teče i kakav joj je reljef na severu i jugu.", "Tačna su četiri odgovora; Srbija nema more, a Alpi su daleko na zapadu.", "Iz lekcije: Srbija je balkanska, podunavska, panonska i planinska država."], "objasnjenje": "Srbija je balkanska (leži na Balkanu), podunavska (kroz nju teče Dunav), panonska (sever je u Panonskoj niziji) i planinska (jug je planinski). Primorska nije jer nema more.", "iz_udzbenika": {"strana": 18, "odeljak": "Uvod — položaj", "tekst": "Srbija se opisuje kao balkanska, podunavska, panonska i planinska država — leži na Balkanu, uz Dunav, delom u Panonskoj niziji, a jug joj je planinski."}}, {"id": "polozaj-povezi-opis", "vrsta": "povezi", "tezina": "srednje", "pojmovi": ["srbija", "balkansko-poluostrvo", "panonska-nizija", "dunav"], "pitanje": "Poveži opis Srbije sa razlogom zbog kog se tako zove.", "parovi": [["balkanska", "najvećim delom leži na Balkanskom poluostrvu"], ["podunavska", "kroz nju teče Dunav"], ["panonska", "sever joj je deo Panonske nizije"], ["planinska", "jug joj je pretežno planinski"], ["kontinentalna", "nema izlaz na more"]], "pomoc": ["Svaka reč kaže nešto o poluostrvu, reci, nizini, planinama ili moru.", "„Podunavska” dolazi od imena reke, a „panonska” od imena nizije.", "Iz lekcije: balkanska, podunavska, panonska i planinska — i kontinentalna, jer nema more."], "objasnjenje": "Balkanska — Balkansko poluostrvo; podunavska — Dunav; panonska — Panonska nizija na severu; planinska — planinski jug; kontinentalna — bez mora.", "iz_udzbenika": {"strana": 18, "odeljak": "Uvod — položaj", "tekst": "Srbija je kontinentalna zemlja koja najvećim delom leži na Balkanskom poluostrvu; ujedno je podunavska, panonska i planinska."}}, {"id": "polozaj-zakljuci-podunavska", "vrsta": "zakljuci", "tezina": "lako", "pojmovi": ["srbija", "dunav"], "pitanje": "Zašto se za Srbiju kaže da je „podunavska” zemlja?", "odgovori": [{"tekst": "Zato što kroz nju protiče reka Dunav.", "tacan": true}, {"tekst": "Zato što leži na obali Crnog mora.", "tacan": false}, {"tekst": "Zato što je cela ravničarska.", "tacan": false}, {"tekst": "Zato što u njoj izvire Dunav.", "tacan": false}], "pomoc": ["Korak 1: Koje ime reke se krije u reči „podunavska”?", "Korak 2: Da li Dunav izvire u Srbiji ili samo protiče kroz nju (pored Novog Sada i Beograda)?", "Iz lekcije: Srbija je podunavska država — leži uz Dunav."], "objasnjenje": "Kroz Srbiju protiče Dunav (pored Novog Sada i Beograda), pa je ona podunavska zemlja. Dunav ne izvire u Srbiji, a Srbija nema more.", "iz_udzbenika": {"strana": 18, "odeljak": "Uvod — položaj", "tekst": "Srbija leži uz Dunav, pa se ubraja u podunavske zemlje; uz to je balkanska, panonska i planinska."}}, {"id": "polozaj-zakljuci-saobracaj", "vrsta": "zakljuci", "tezina": "srednje", "pojmovi": ["saobracajno-geografski-polozaj", "srbija"], "pitanje": "Srbija nema more, a ipak ima povoljan saobraćajno-geografski položaj. Zašto?", "odgovori": [{"tekst": "Preko nje idu putevi koji spajaju srednju i zapadnu Evropu sa jugom Balkana i Malom Azijom.", "tacan": true}, {"tekst": "Zato što ima velike morske luke na Dunavu.", "tacan": false}, {"tekst": "Zato što je cela Srbija ravnica, pa je lako graditi puteve.", "tacan": false}, {"tekst": "Zato što se graniči sa više od deset država.", "tacan": false}], "pomoc": ["Korak 1: Pogledaj kartu — šta se nalazi severozapadno od Srbije, a šta jugoistočno (Grčka, Turska)?", "Korak 2: Ko putuje kopnom iz Nemačke u Grčku ili Tursku, preko koje zemlje najkraće ide?", "Iz lekcije: kroz Srbiju prolaze saobraćajnice od zapadne i srednje Evrope ka jugu Balkana i zapadu Male Azije."], "objasnjenje": "Preko Srbije (dolinama Morave i Dunava) idu najkraći kopneni putevi između srednje i zapadne Evrope i juga Balkana, Grčke i Male Azije. Srbija nema morske luke, a jug joj je planinski.", "iz_udzbenika": {"strana": 18, "odeljak": "Uvod — položaj", "tekst": "Saobraćajno-geografski položaj Srbije je povoljan, jer kroz nju prolaze putevi koji povezuju zapadnu i srednju Evropu sa južnim delom Balkana i zapadnim delom Male Azije."}}, {"id": "polozaj-izbor-pokrajine", "vrsta": "izbor", "tezina": "lako", "pojmovi": ["ap-vojvodina", "ap-kosovo-i-metohija"], "pitanje": "Koje su autonomne pokrajine u sastavu Srbije? (Više tačnih.)", "odgovori": [{"tekst": "AP Vojvodina", "tacan": true}, {"tekst": "AP Kosovo i Metohija", "tacan": true}, {"tekst": "Šumadija", "tacan": false}, {"tekst": "Srem", "tacan": false}], "pomoc": ["Jedna pokrajina je na severu, a jedna na jugu Srbije.", "Srem je samo deo jedne od pokrajina, a Šumadija nije pokrajina.", "Iz lekcije: u sastavu Srbije su AP Vojvodina i AP Kosovo i Metohija."], "objasnjenje": "Srbija ima dve autonomne pokrajine — Vojvodinu na severu i Kosovo i Metohiju na jugu. Srem je deo Vojvodine.", "iz_udzbenika": {"strana": 18, "odeljak": "Uvod — sastav", "tekst": "U sastavu Republike Srbije nalaze se dve autonomne pokrajine — AP Vojvodina i AP Kosovo i Metohija."}}, {"id": "polozaj-tn-pokrajine", "vrsta": "tacno_netacno", "tezina": "lako", "pojmovi": ["ap-vojvodina", "ap-kosovo-i-metohija"], "tvrdnja": "U sastavu Srbije nalaze se dve autonomne pokrajine.", "tacno": true, "pomoc": ["Jedna pokrajina je ravničarska na severu, druga planinska na jugu.", "Imena su im Vojvodina i Kosovo i Metohija.", "Iz lekcije: AP Vojvodina i AP Kosovo i Metohija."], "objasnjenje": "Tačno — to su AP Vojvodina i AP Kosovo i Metohija.", "iz_udzbenika": {"strana": 18, "odeljak": "Uvod — sastav", "tekst": "Srbija u svom sastavu ima dve autonomne pokrajine — Vojvodinu i Kosovo i Metohiju."}}, {"id": "polozaj-klik-srbija", "vrsta": "karta_klik", "tezina": "lako", "pojmovi": ["srbija"], "pitanje": "Klikni na kartu — Republika Srbija.", "cilj": {"drzava": "SRB"}, "pomoc": ["Srbija je u sredini ove karte i nema obalu mora.", "Na severu joj je Mađarska, a na istoku Rumunija i Bugarska.", "Klikni na veliku državu u sredini karte (sa Vojvodinom na severu i Kosovom i Metohijom na jugu)."], "objasnjenje": "Srbija je u središtu Balkana; na ovoj karti AP Kosovo i Metohija je deo Srbije, kao u udžbeniku.", "iz_udzbenika": {"strana": 18, "odeljak": "Uvod — položaj", "tekst": "Na maloj karti u infokutiji Srbija je istaknuta crvenom bojom usred Balkanskog poluostrva, bez izlaza na more.", "slika": "04-srbija/01-srbija-infografika.jpg"}}, {"id": "polozaj-izbor-susedi-broj", "vrsta": "izbor", "tezina": "srednje", "pojmovi": ["srbija"], "pitanje": "Sa koliko se država Srbija graniči?", "odgovori": [{"tekst": "8", "tacan": true}, {"tekst": "5", "tacan": false}, {"tekst": "6", "tacan": false}, {"tekst": "11", "tacan": false}], "pomoc": ["Prebroj susede na karti, krećući se od Mađarske na severu u krug.", "Na nemoj karti u udžbeniku susedi su obeleženi brojevima — poslednji broj je osam.", "Iz lekcije: Mađarska, Hrvatska, BiH, Crna Gora, Albanija, Severna Makedonija, Bugarska, Rumunija."], "objasnjenje": "Srbija ima 8 suseda — Mađarsku, Rumuniju, Bugarsku, Severnu Makedoniju, Albaniju, Crnu Goru, Bosnu i Hercegovinu i Hrvatsku.", "iz_udzbenika": {"strana": 19, "odeljak": "Zadatak — susedne države", "tekst": "Na nemoj karti susedi Srbije označeni su brojevima od 1 do 8, a učenik uz pomoć atlasa upisuje njihova imena.", "slika": "04-srbija/02-granice-srbije-karta.jpg"}}, {"id": "polozaj-klik-madjarska", "vrsta": "karta_klik", "tezina": "lako", "pojmovi": ["madjarska", "vojvodina"], "pitanje": "Klikni na susednu državu Srbije koja je na severu, iznad Vojvodine.", "cilj": {"drzava": "HUN"}, "pomoc": ["Traži državu odmah severno od Srbije.", "Kroz nju Dunav i Tisa teku pre nego što uđu u Vojvodinu.", "Klikni na Mađarsku."], "objasnjenje": "Na severu se Srbija graniči sa Mađarskom; iz nje u Vojvodinu dolaze Dunav i Tisa.", "iz_udzbenika": {"strana": 19, "odeljak": "Zadatak — susedne države", "tekst": "Na nemoj karti suseda broj 1 je Mađarska, na severu, iznad Vojvodine.", "slika": "04-srbija/02-granice-srbije-karta.jpg"}}, {"id": "polozaj-klik-crna-gora", "vrsta": "karta_klik", "tezina": "srednje", "pojmovi": ["crna-gora", "prokletije"], "pitanje": "Klikni na susednu državu na jugozapadu Srbije, između Bosne i Hercegovine i Albanije.", "cilj": {"drzava": "MNE"}, "pomoc": ["To je mala primorska država na jugozapadu Srbije.", "Sa njom je Srbija do 2006. bila u zajednici; deli sa njom Prokletije.", "Klikni na Crnu Goru."], "objasnjenje": "Na jugozapadu je Crna Gora (sused broj 4 na nemoj karti). Albanija se sa Srbijom graniči preko AP Kosova i Metohije.", "iz_udzbenika": {"strana": 19, "odeljak": "Zadatak — susedne države", "tekst": "Pod brojem 4 na nemoj karti je Crna Gora. Prokletije se nalaze na granici Srbije sa Crnom Gorom i Albanijom.", "slika": "04-srbija/02-granice-srbije-karta.jpg"}}, {"id": "polozaj-klik-rumunija", "vrsta": "karta_klik", "tezina": "srednje", "pojmovi": ["rumunija", "dunav", "banat"], "pitanje": "Klikni na susednu državu na severoistoku, sa kojom Srbija deli Banat i deo toka Dunava.", "cilj": {"drzava": "ROU"}, "pomoc": ["Traži državu istočno od Vojvodine.", "Na jednom delu granicu prema njoj čini Dunav, pre nego što skrene ka Crnom moru.", "Klikni na Rumuniju."], "objasnjenje": "Na severoistoku je Rumunija; deo granice čini Dunav, a Banat se nastavlja i u Rumuniji.", "iz_udzbenika": {"strana": 19, "odeljak": "Zadatak — susedne države", "tekst": "Na nemoj karti suseda broj 8 je Rumunija, na severoistoku Srbije.", "slika": "04-srbija/02-granice-srbije-karta.jpg"}}, {"id": "polozaj-klik-albanija", "vrsta": "karta_klik", "tezina": "srednje", "pojmovi": ["albanija", "ap-kosovo-i-metohija"], "pitanje": "Klikni na susednu državu sa kojom se Srbija graniči samo preko AP Kosova i Metohije.", "cilj": {"drzava": "ALB"}, "pomoc": ["Traži državu na jugozapadu, iza Prokletija.", "Ona izlazi na Jadransko more, južno od Crne Gore.", "Klikni na Albaniju."], "objasnjenje": "Albanija se sa Srbijom graniči preko teritorije AP Kosova i Metohije, na Prokletijama i Šar-planini.", "iz_udzbenika": {"strana": 19, "odeljak": "Zadatak — susedne države", "tekst": "Pod brojem 5 na nemoj karti je Albanija. Granica sa njom prolazi kroz AP Kosovo i Metohiju, koja je u sastavu Srbije.", "slika": "04-srbija/02-granice-srbije-karta.jpg"}}, {"id": "polozaj-zakljuci-sused-4", "vrsta": "zakljuci", "tezina": "tesko", "pojmovi": ["crna-gora", "ap-kosovo-i-metohija"], "pitanje": "Na nemoj karti suseda Srbije, pod brojem 4 (jugozapad, između BiH i Albanije), jedan učenik je upisao „Kosovo”. Šta je tačan odgovor i zašto?", "odgovori": [{"tekst": "Crna Gora — Kosovo i Metohija je pokrajina u sastavu Srbije, a ne sused.", "tacan": true}, {"tekst": "Albanija — ona je jedini sused na jugozapadu.", "tacan": false}, {"tekst": "Bosna i Hercegovina — ona je odmah do Albanije.", "tacan": false}, {"tekst": "Upis je tačan — pod brojem 4 je Kosovo.", "tacan": false}], "pomoc": ["Korak 1: Setimo se — koje su dve autonomne pokrajine u sastavu Srbije?", "Korak 2: Koja primorska država je između BiH (na severozapadu) i Albanije (na jugu)?", "Iz lekcije: susedi su 1 Mađarska, 2 Hrvatska, 3 BiH, 4 Crna Gora, 5 Albanija, 6 S. Makedonija, 7 Bugarska, 8 Rumunija."], "objasnjenje": "Pod brojem 4 je Crna Gora. Kosovo i Metohija je, prema udžbeniku, autonomna pokrajina u sastavu Srbije, pa se ne upisuje kao susedna država.", "iz_udzbenika": {"strana": 19, "odeljak": "Zadatak — susedne države", "tekst": "Rešenje zadatka sa nemom kartom — 1 Mađarska, 2 Hrvatska, 3 Bosna i Hercegovina, 4 Crna Gora, 5 Albanija, 6 Severna Makedonija, 7 Bugarska, 8 Rumunija.", "slika": "04-srbija/02-granice-srbije-karta.jpg"}}, {"id": "polozaj-povezi-susedi", "vrsta": "povezi", "tezina": "tesko", "pojmovi": ["madjarska", "rumunija", "bugarska", "severna-makedonija", "bosna-i-hercegovina", "hrvatska"], "pitanje": "Poveži stranu sveta sa susedom Srbije koji je tu.", "parovi": [["sever", "Mađarska"], ["severoistok", "Rumunija"], ["istok", "Bugarska"], ["jug", "Severna Makedonija"], ["zapad", "Bosna i Hercegovina"], ["severozapad", "Hrvatska"]], "pomoc": ["Kreni od severa (iznad Vojvodine) i idi u smeru kazaljke na satu.", "Drina je granica na zapadu; Stara planina je na granici na istoku; Šar-planina na jugu.", "Iz lekcije: 1 Mađarska, 2 Hrvatska, 3 BiH … 6 S. Makedonija, 7 Bugarska, 8 Rumunija."], "objasnjenje": "Sever — Mađarska; severoistok — Rumunija; istok — Bugarska; jug — Severna Makedonija; zapad — BiH; severozapad — Hrvatska.", "iz_udzbenika": {"strana": 19, "odeljak": "Zadatak — susedne države", "tekst": "Osam suseda Srbije čitaju se na nemoj karti u krug — od Mađarske na severu, preko država na zapadu i jugu, do Bugarske i Rumunije na istoku.", "slika": "04-srbija/02-granice-srbije-karta.jpg"}}, {"id": "polozaj-dopuni-susedi", "vrsta": "dopuni", "tezina": "tesko", "pojmovi": ["crna-gora", "bugarska", "hrvatska"], "pitanje": "Dopuni rečenicu imenima suseda (bez ponuđenih reči).", "tekst": "Na jugozapadu se Srbija graniči sa {{Crnom Gorom|Crna Gora}}, na istoku sa {{Bugarskom|Bugarska}}, a na severozapadu sa {{Hrvatskom|Hrvatska}}.", "pomoc": ["Na jugozapadu je mala primorska država, na istoku država na Crnom moru, a na severozapadu država sa dugom jadranskom obalom.", "Prvi sused deli sa Srbijom Prokletije, drugi Staru planinu, a kroz treći teku Sava i Dunav pre nego što uđu u Srbiju.", "Iz lekcije: među susedima su Crna Gora, Bugarska i Hrvatska."], "objasnjenje": "Jugozapad — Crna Gora; istok — Bugarska; severozapad — Hrvatska.", "iz_udzbenika": {"strana": 19, "odeljak": "Zadatak — susedne države", "tekst": "Na nemoj karti učenik upisuje osam suseda Srbije — među njima Crnu Goru na jugozapadu, Bugarsku na istoku i Hrvatsku na severozapadu.", "slika": "04-srbija/02-granice-srbije-karta.jpg"}}, {"id": "polozaj-klik-kim", "vrsta": "karta_klik", "tezina": "srednje", "pojmovi": ["ap-kosovo-i-metohija"], "pitanje": "Klikni na AP Kosovo i Metohiju.", "cilj": {"mesto": "kosovo-i-metohija"}, "pomoc": ["Ova pokrajina je na jugu Srbije.", "Graniči se sa Albanijom, Crnom Gorom i Severnom Makedonijom.", "Klikni na jug Srbije, severno od Šar-planine."], "objasnjenje": "AP Kosovo i Metohija je na jugu Srbije, uz granice sa Crnom Gorom, Albanijom i Severnom Makedonijom.", "iz_udzbenika": {"strana": 18, "odeljak": "Uvod — sastav", "tekst": "AP Kosovo i Metohija je jedna od dve autonomne pokrajine Srbije; nalazi se na jugu zemlje."}}, {"id": "polozaj-gde-srbija", "vrsta": "gde_sam", "tezina": "lako", "pojmovi": ["srbija"], "pitanje": "Gde sam? Pročitaj trag i klikni državu na karti.", "cilj": {"drzava": "SRB"}, "tragovi": ["Graničim se sa osam država, a nemam izlaz na more.", "Moj sever je ravnica, deo Panonske nizije, a jug mi je planinski.", "U mom glavnom gradu Sava se uliva u Dunav.", "Ja sam Srbija — klikni na državu u sredini karte."], "objasnjenje": "Srbija — kontinentalna država sa osam suseda; glavni grad Beograd je na ušću Save u Dunav.", "iz_udzbenika": {"strana": 18, "odeljak": "Uvod — položaj", "tekst": "Srbija je kontinentalna balkanska, podunavska, panonska i planinska zemlja; glavni grad je Beograd.", "slika": "04-srbija/01-srbija-infografika.jpg"}}, {"id": "polozaj-gde-bugarska", "vrsta": "gde_sam", "tezina": "srednje", "pojmovi": ["bugarska", "stara-planina"], "pitanje": "Gde sam? Pročitaj trag i klikni državu na karti.", "cilj": {"drzava": "BGR"}, "tragovi": ["Na nemoj karti iz udžbenika ja sam sused broj 7.", "Sa Srbijom delim Staru planinu.", "Izlazim na Crno more.", "Ja sam istočni sused Srbije."], "objasnjenje": "Bugarska — istočni sused Srbije; granicom prolazi Stara planina, a Bugarska izlazi na Crno more.", "iz_udzbenika": {"strana": 19, "odeljak": "Zadatak — susedne države", "tekst": "Pod brojem 7 na nemoj karti suseda je Bugarska, istočno od Srbije.", "slika": "04-srbija/02-granice-srbije-karta.jpg"}}]}, {"naslov": "Reljef", "zadaci": [{"id": "reljef-izbor-dve-celine", "vrsta": "izbor", "tezina": "lako", "pojmovi": ["vojvodina", "panonska-nizija"], "pitanje": "Na koje dve velike celine se deli reljef Srbije?", "odgovori": [{"tekst": "ravničarski sever i planinski jug", "tacan": true}, {"tekst": "planinski sever i ravničarski jug", "tacan": false}, {"tekst": "primorski zapad i planinski istok", "tacan": false}, {"tekst": "cela Srbija je jedna velika ravnica", "tacan": false}], "pomoc": ["Pogledaj fizičku kartu — gde je zelena boja (nizija), a gde smeđa (planine)?", "Vojvodina je na severu.", "Iz lekcije: reljef čine ravničarski sever i planinski jug."], "objasnjenje": "Sever Srbije je ravnica (Vojvodina, deo Panonske nizije), a jug je planinski sa kotlinama.", "iz_udzbenika": {"strana": 19, "odeljak": "Fizičko-geografske odlike — reljef", "tekst": "Reljef Srbije ima dve celine — ravničarski sever, koji pripada Panonskoj niziji, i planinski jug sa planinama i kotlinama.", "slika": "04-srbija/06-fizicka-karta-srbije.jpg"}}, {"id": "reljef-izbor-nizija", "vrsta": "izbor", "tezina": "lako", "pojmovi": ["vojvodina", "panonska-nizija"], "pitanje": "Delu koje nizije pripada Vojvodina?", "odgovori": [{"tekst": "Panonske nizije", "tacan": true}, {"tekst": "Vlaške nizije", "tacan": false}, {"tekst": "Padske nizije", "tacan": false}, {"tekst": "Istočnoevropske nizije", "tacan": false}], "pomoc": ["Ista reč stoji u opisu Srbije kao „… država”.", "Ova nizija je nekad bila dno mora istog imena.", "Iz lekcije: Vojvodina je deo Panonske nizije."], "objasnjenje": "Vojvodina je deo Panonske nizije. Vlaška nizija zalazi samo u istočnu Srbiju, uz Dunav.", "iz_udzbenika": {"strana": 19, "odeljak": "Fizičko-geografske odlike — reljef", "tekst": "Ravnica severno od Save i Dunava je Vojvodina; ona pripada Panonskoj niziji.", "slika": "04-srbija/03-vojvodina.jpg"}}, {"id": "reljef-tn-vojvodina", "vrsta": "tacno_netacno", "tezina": "lako", "pojmovi": ["vojvodina", "sava", "dunav"], "tvrdnja": "Ravnica severno od Save i Dunava zove se Vojvodina.", "tacno": true, "pomoc": ["Pogledaj na karti šta je severno od Beograda.", "Ta ravnica je i autonomna pokrajina.", "Iz lekcije: ravnica severno od Save i Dunava je Vojvodina, deo Panonske nizije."], "objasnjenje": "Tačno — severno od Save i Dunava prostire se Vojvodina.", "iz_udzbenika": {"strana": 19, "odeljak": "Fizičko-geografske odlike — reljef", "tekst": "Severno od Save i Dunava je ravnica Vojvodina, deo Panonske nizije.", "slika": "04-srbija/06-fizicka-karta-srbije.jpg"}}, {"id": "reljef-dopuni-visina", "vrsta": "dopuni", "tezina": "srednje", "pojmovi": ["panonska-nizija", "vojvodina"], "pitanje": "Dopuni rečenicu rečima iz banke.", "tekst": "Veći deo Panonske nizije u Srbiji leži na nadmorskoj visini ispod {{100}} metara.", "ponudjene": ["100", "500", "1000"], "pomoc": ["Nizija je nisko i ravno zemljište.", "Uzmi najmanji ponuđeni broj.", "Iz lekcije: veći deo nizije je ispod 100 m."], "objasnjenje": "Veći deo Panonske nizije u Srbiji je ispod 100 m nadmorske visine.", "iz_udzbenika": {"strana": 19, "odeljak": "Fizičko-geografske odlike — reljef", "tekst": "Panonska nizija u Srbiji je veoma niska — veći njen deo nalazi se ispod 100 m nadmorske visine.", "slika": "04-srbija/06-fizicka-karta-srbije.jpg"}}, {"id": "reljef-izbor-fruska-gora", "vrsta": "izbor", "tezina": "lako", "pojmovi": ["fruska-gora", "dunav"], "pitanje": "Koja se planina pruža uz desnu obalu Dunava, od zapada ka istoku, u Vojvodini?", "odgovori": [{"tekst": "Fruška gora", "tacan": true}, {"tekst": "Kopaonik", "tacan": false}, {"tekst": "Šar-planina", "tacan": false}, {"tekst": "Stara planina", "tacan": false}], "pomoc": ["Traži jedinu planinu u Vojvodini koja je preko puta Novog Sada.", "Ostale ponuđene planine su na jugu Srbije.", "Iz lekcije: uz desnu obalu Dunava pruža se Fruška gora."], "objasnjenje": "Fruška gora se pruža uz desnu obalu Dunava, u Sremu. Kopaonik, Šar-planina i Stara planina su na jugu.", "iz_udzbenika": {"strana": 19, "odeljak": "Fizičko-geografske odlike — reljef", "tekst": "U Vojvodini se uz desnu obalu Dunava, od zapada ka istoku, pruža Fruška gora, a na istoku su Vršačke planine."}}, {"id": "reljef-zakljuci-ostrva", "vrsta": "zakljuci", "tezina": "srednje", "pojmovi": ["fruska-gora", "panonsko-more"], "pitanje": "Kako su Fruška gora i Vršačke planine mogle da budu ostrva, kad su danas usred ravnice?", "odgovori": [{"tekst": "Ravnicu je nekad prekrivalo Panonsko more, a one su virile iznad vode.", "tacan": true}, {"tekst": "Dunav se nekad izlivao i plavio samo te dve planine.", "tacan": false}, {"tekst": "Bile su ostrva u Jadranskom moru, pa su se pomerile.", "tacan": false}, {"tekst": "Nikad nisu bile ostrva — to je samo legenda.", "tacan": false}], "pomoc": ["Korak 1: Ostrvo je kopno okruženo vodom — šta je nekad bilo na mestu Vojvodine?", "Korak 2: Kad je voda tu bila, šta je jedino moglo da ostane iznad nje?", "Iz lekcije: u vreme Panonskog mora obe planine bile su ostrva."], "objasnjenje": "Vojvodinu je nekad prekrivalo Panonsko more; više planine iznad njega bile su ostrva. Kad se more povuklo, ostala je ravnica sa tim planinama.", "iz_udzbenika": {"strana": 19, "odeljak": "Fizičko-geografske odlike — reljef", "tekst": "Panonsko more je nekada pokrivalo današnju Vojvodinu; Fruška gora i Vršačke planine izdizale su se iz njega kao ostrva."}}, {"id": "reljef-povezi-regije", "vrsta": "povezi", "tezina": "lako", "pojmovi": ["srem", "backa", "banat"], "pitanje": "Poveži deo Vojvodine sa njegovim položajem.", "parovi": [["Srem", "između Save i Dunava"], ["Bačka", "između Dunava i Tise"], ["Banat", "istočno od Tise"]], "pomoc": ["Tri reke dele Vojvodinu na tri dela.", "Najjužniji deo je između Save i Dunava, a najistočniji je iza Tise.", "Iz lekcije: Srem — Sava/Dunav; Bačka — Dunav/Tisa; Banat — istočno od Tise."], "objasnjenje": "Srem je između Save i Dunava, Bačka između Dunava i Tise, a Banat istočno od Tise.", "iz_udzbenika": {"strana": 19, "odeljak": "Fizičko-geografske odlike — reljef", "tekst": "Sava, Tisa i Dunav dele Vojvodinu na Srem (između Save i Dunava), Bačku (severno od Srema) i Banat (istočno od Tise).", "slika": "04-srbija/07-recna-mreza-srbije.jpg"}}, {"id": "reljef-dopuni-regije", "vrsta": "dopuni", "tezina": "srednje", "pojmovi": ["srem", "backa", "banat"], "pitanje": "Dopuni rečenicu rečima iz banke.", "tekst": "Srem leži između Save i {{Dunava}}, Bačka je {{severno}} od Srema, a Banat je istočno od reke {{Tise}}.", "ponudjene": ["Dunava", "Drine", "severno", "južno", "Tise", "Morave"], "pomoc": ["Srem je na jugu Vojvodine, oivičen dvema rekama koje se spajaju kod Beograda.", "Bačka je iznad Srema; Banat je iza reke koja dolazi iz Mađarske.", "Iz lekcije: Srem — između Save i Dunava; Bačka — severno od Srema; Banat — istočno od Tise."], "objasnjenje": "Srem je između Save i Dunava, Bačka severno od njega, a Banat istočno od Tise.", "iz_udzbenika": {"strana": 19, "odeljak": "Fizičko-geografske odlike — reljef", "tekst": "Reke Sava, Tisa i Dunav dele Vojvodinu na tri manje celine — Srem, Bačku i Banat.", "slika": "04-srbija/07-recna-mreza-srbije.jpg"}}, {"id": "reljef-izbor-fruska-celina", "vrsta": "izbor", "tezina": "srednje", "pojmovi": ["fruska-gora", "srem"], "pitanje": "Kojoj regionalnoj celini Vojvodine pripada Fruška gora?", "odgovori": [{"tekst": "Sremu", "tacan": true}, {"tekst": "Bačkoj", "tacan": false}, {"tekst": "Banatu", "tacan": false}, {"tekst": "Šumadiji", "tacan": false}], "pomoc": ["Fruška gora je na desnoj (južnoj) obali Dunava.", "Koja celina Vojvodine je južno od Dunava, a severno od Save?", "Iz lekcije: Fruška gora pripada Sremu."], "objasnjenje": "Fruška gora je južno od Dunava, a severno od Save — dakle u Sremu. Šumadija nije deo Vojvodine.", "iz_udzbenika": {"strana": 19, "odeljak": "Fizičko-geografske odlike — reljef", "tekst": "Udžbenik pita kojoj celini pripada Fruška gora; pošto leži između Save i Dunava, odgovor je Srem."}}, {"id": "reljef-klik-srem", "vrsta": "karta_klik", "tezina": "srednje", "pojmovi": ["srem"], "pitanje": "Klikni na Srem.", "cilj": {"mesto": "srem"}, "pomoc": ["Srem je najjužniji deo Vojvodine, uz granicu sa Hrvatskom.", "Sa juga ga ograničava Sava, a sa severa Dunav.", "Klikni zapadno od Beograda, između Save i Dunava (oko Fruške gore)."], "objasnjenje": "Srem je između Save i Dunava, zapadno od Beograda; u njemu je Fruška gora.", "iz_udzbenika": {"strana": 20, "odeljak": "Zadatak — nema karta rečne mreže", "tekst": "Na nemoj karti rečne mreže slovom V se označava Srem, celina između Save i Dunava.", "slika": "04-srbija/07-recna-mreza-srbije.jpg"}}, {"id": "reljef-klik-backa", "vrsta": "karta_klik", "tezina": "lako", "pojmovi": ["backa"], "pitanje": "Klikni na Bačku.", "cilj": {"mesto": "backa"}, "pomoc": ["Bačka je severozapadni deo Vojvodine, uz granicu sa Mađarskom.", "Ograničavaju je Dunav (na zapadu i jugu) i Tisa (na istoku).", "Klikni severno od Novog Sada, između Dunava i Tise."], "objasnjenje": "Bačka je između Dunava i Tise, severno od Srema; u njoj je Novi Sad.", "iz_udzbenika": {"strana": 20, "odeljak": "Zadatak — nema karta rečne mreže", "tekst": "Na nemoj karti rečne mreže slovom B se označava Bačka, između Dunava i Tise.", "slika": "04-srbija/07-recna-mreza-srbije.jpg"}}, {"id": "reljef-klik-banat", "vrsta": "karta_klik", "tezina": "lako", "pojmovi": ["banat"], "pitanje": "Klikni na Banat.", "cilj": {"mesto": "banat"}, "pomoc": ["Banat je najistočniji deo Vojvodine.", "Na zapadu ga ograničava Tisa, a na istoku granica sa Rumunijom.", "Klikni istočno od Tise, severoistočno od Beograda."], "objasnjenje": "Banat je istočno od Tise, uz granicu sa Rumunijom; u njemu su Vršačke planine i Deliblatska peščara.", "iz_udzbenika": {"strana": 20, "odeljak": "Zadatak — nema karta rečne mreže", "tekst": "Na nemoj karti rečne mreže slovom A se označava Banat, istočno od Tise.", "slika": "04-srbija/07-recna-mreza-srbije.jpg"}}, {"id": "reljef-klik-fruska-gora", "vrsta": "karta_klik", "tezina": "srednje", "pojmovi": ["fruska-gora"], "pitanje": "Klikni na Frušku goru.", "cilj": {"mesto": "fruska-gora"}, "pomoc": ["Fruška gora je u Sremu.", "Pruža se uz desnu obalu Dunava, preko puta Novog Sada.", "Klikni malo južno od Novog Sada, između Dunava i Save."], "objasnjenje": "Fruška gora je u Sremu, uz desnu obalu Dunava, preko puta Novog Sada.", "iz_udzbenika": {"strana": 19, "odeljak": "Fizičko-geografske odlike — reljef", "tekst": "Fruška gora se pruža od zapada ka istoku uz desnu obalu Dunava; pripada Sremu."}}, {"id": "reljef-klik-vrsacke", "vrsta": "karta_klik", "tezina": "tesko", "pojmovi": ["vrsacke-planine", "banat"], "pitanje": "Klikni na Vršačke planine.", "cilj": {"mesto": "vrsacke-planine"}, "pomoc": ["Ove planine su na istoku Vojvodine.", "Nalaze se u jugoistočnom Banatu, blizu granice sa Rumunijom.", "Klikni kod Vršca, na jugoistoku Banata, uz rumunsku granicu."], "objasnjenje": "Vršačke planine su u jugoistočnom Banatu, kod Vršca, uz granicu sa Rumunijom.", "iz_udzbenika": {"strana": 19, "odeljak": "Fizičko-geografske odlike — reljef", "tekst": "Na istoku Vojvodine izdižu se Vršačke planine, nekadašnje ostrvo Panonskog mora."}}, {"id": "reljef-tn-vlaska", "vrsta": "tacno_netacno", "tezina": "srednje", "pojmovi": ["vlaska-nizija", "dunav"], "tvrdnja": "U istočnoj Srbiji, uz tok Dunava, nalazi se deo Vlaške niz
