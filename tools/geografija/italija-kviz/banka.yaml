# Banka zadataka — Republika Italija (7. razred, str. 31–33). Spaja se u spec.yaml: `delovi`
# zamenjuje spec-ove delove, `mesta` se dodaju u karta.mesta (ovde su sva mesta u spec.yaml).
# Svaki zadatak ima `tezina` (lako | srednje | tesko). Pitanja su sopstvenim rečima, iz beleške lekcije.

mesta: {}

delovi:
  - naslov: Položaj i osnovni podaci
    zadaci:
      - id: polozaj-izbor-poluostrvo
        vrsta: izbor
        tezina: lako
        pojmovi: [italija, apeninsko-poluostrvo]
        pitanje: Na kom poluostrvu leži najveći deo Italije?
        odgovori:
          - {tekst: Apeninsko poluostrvo, tacan: true}
          - {tekst: Skandinavsko poluostrvo, tacan: false}
          - {tekst: Pirinejsko poluostrvo, tacan: false}
          - {tekst: Krimsko poluostrvo, tacan: false}
        pomoc:
          - Italija je u sredini Južne Evrope, između dva druga velika poluostrva.
          - Poluostrvo ima oblik čizme i dobilo je ime po planinama koje se pružaju kroz njega.
          - "Iz lekcije: Italija pokriva najveći deo Apeninskog poluostrva."
        objasnjenje: Italija zauzima najveći deo Apeninskog poluostrva, od Alpa na severu do Kalabrije na jugu. Pirinejsko je zapadnije (Španija), a Skandinavsko i Krimsko su van Južne Evrope.
        iz_udzbenika:
          strana: 31
          odeljak: Položaj
          tekst: Italija pokriva veći deo Apeninskog poluostrva i na severu dopire do Alpa. Na istom poluostrvu su još dve male države.
          slika: 10-italija/01-italija-infookvir.jpg

      - id: polozaj-izbor-glavni-grad
        vrsta: izbor
        tezina: lako
        pojmovi: [italija, rim]
        pitanje: Koji je glavni grad Italije?
        odgovori:
          - {tekst: Rim, tacan: true}
          - {tekst: Milano, tacan: false}
          - {tekst: Venecija, tacan: false}
          - {tekst: Napulj, tacan: false}
        pomoc:
          - Glavni grad leži u srednjoj Italiji, na reci Tibar.
          - Zovu ga „Večni grad” jer postoji više od 2.500 godina.
          - "Iz lekcije: glavni grad Italije je Rim."
        objasnjenje: Glavni grad je Rim, na Tibru u srednjoj Italiji. Milano, Napulj i Venecija su veliki gradovi, ali nisu prestonica.
        iz_udzbenika:
          strana: 31
          odeljak: Osnovni podaci
          tekst: Infookvir na početku lekcije navodi broj stanovnika, površinu, glavni grad Rim i službeni jezik — italijanski.
          slika: 10-italija/01-italija-infookvir.jpg

      - id: polozaj-izbor-mora
        vrsta: izbor
        tezina: srednje
        pojmovi: [ligurijsko-more, tirensko-more, jadransko-more, jonsko-more, sredozemno-more]
        pitanje: Koja mora zapljuskuju obale Italije? (Više tačnih.)
        odgovori:
          - {tekst: Ligurijsko more, tacan: true}
          - {tekst: Tirensko more, tacan: true}
          - {tekst: Jadransko more, tacan: true}
          - {tekst: Jonsko more, tacan: true}
          - {tekst: Egejsko more, tacan: false}
          - {tekst: Crno more, tacan: false}
        pomoc:
          - Sva tačna mora su delovi Sredozemnog mora oko „čizme”.
          - Tačna su četiri mora — dva na zapadnoj i dva na istočnoj obali. Mora oko Grčke i Turske ne dodiruju Italiju.
          - "Iz lekcije: zapadno su Ligurijsko i Tirensko, istočno Jadransko i Jonsko more."
        objasnjenje: Italiju okružuju Ligurijsko i Tirensko more (zapad) i Jadransko i Jonsko more (istok). Egejsko more je uz Grčku, a Crno more je daleko na istoku.
        iz_udzbenika:
          strana: 31
          odeljak: Položaj
          tekst: Zapadna obala Italije izlazi na Ligurijsko i Tirensko more, a istočnu zapljuskuju Jadransko i Jonsko more. Sva četiri su delovi Sredozemnog mora.
          slika: 10-italija/05-fizicka-karta-italije.jpg

      - id: polozaj-izbor-patuljaste
        vrsta: izbor
        tezina: tesko
        pojmovi: [san-marino, vatikan, apeninsko-poluostrvo]
        pitanje: Koje se još države, pored Italije, nalaze na Apeninskom poluostrvu? (Više tačnih.)
        odgovori:
          - {tekst: San Marino, tacan: true}
          - {tekst: Vatikan, tacan: true}
          - {tekst: Monako, tacan: false}
          - {tekst: Malta, tacan: false}
          - {tekst: Andora, tacan: false}
        pomoc:
          - Traži patuljaste države koje su sa svih strana okružene Italijom.
          - Tačne su dve. Jedna od ponuđenih je ostrvo južno od Sicilije, jedna je na obali Francuske, a jedna u Pirinejima.
          - "Iz lekcije: na Apeninskom poluostrvu su još San Marino i Vatikan."
        objasnjenje: San Marino (na istočnim padinama Apenina) i Vatikan (u Rimu) nalaze se na Apeninskom poluostrvu. Malta je ostrvska država, Monako je na francuskoj obali, a Andora u Pirinejima.
        iz_udzbenika:
          strana: 31
          odeljak: Položaj
          tekst: Pored Italije, na Apeninskom poluostrvu su i dve patuljaste države — San Marino i Vatikan.

      - id: polozaj-tn-povrsina
        vrsta: tacno_netacno
        tezina: srednje
        pojmovi: [italija]
        tvrdnja: Italija ima površinu od oko 301.340 km².
        tacno: true
        pomoc:
          - Pogledaj infookvir na početku lekcije.
          - Površina je nešto veća od 300 hiljada km², ali manja od 400 hiljada km².
          - "Iz lekcije: površina Italije je 301.340 km²."
        objasnjenje: Tačno — Italija ima 301.340 km².
        iz_udzbenika:
          strana: 31
          odeljak: Osnovni podaci
          tekst: Prema infookviru, Italija ima 58,8 miliona stanovnika i površinu od 301.340 km².
          slika: 10-italija/01-italija-infookvir.jpg

      - id: polozaj-tn-stanovnici
        vrsta: tacno_netacno
        tezina: lako
        pojmovi: [italija]
        tvrdnja: Italija ima oko 5,8 miliona stanovnika.
        tacno: false
        ispravke:
          - {tekst: "Italija ima oko 58,8 miliona stanovnika.", tacan: true}
          - {tekst: "Italija ima oko 588 miliona stanovnika.", tacan: false}
          - {tekst: "Italija ima oko 580 hiljada stanovnika.", tacan: false}
        pomoc:
          - Italija je jedna od najnaseljenijih država Evrope — da li bi to mogao biti manje od Srbije?
          - Pravi broj je desetak puta veći, ali manji od 100 miliona.
          - "Iz lekcije: Italija ima 58,8 miliona stanovnika."
        objasnjenje: Netačno — Italija ima oko 58,8 miliona stanovnika i spada među najnaseljenije države Evrope.
        iz_udzbenika:
          strana: 31
          odeljak: Osnovni podaci
          tekst: Infookvir navodi da Italija ima 58,8 miliona stanovnika.
          slika: 10-italija/01-italija-infookvir.jpg

      - id: polozaj-tn-jezik
        vrsta: tacno_netacno
        tezina: lako
        pojmovi: [italija]
        tvrdnja: Službeni jezik u Italiji je italijanski.
        tacno: true
        pomoc:
          - Jezik obično nosi ime po narodu koji čini većinu.
          - Većina stanovnika su Italijani.
          - "Iz lekcije: službeni jezik je italijanski."
        objasnjenje: Tačno — službeni jezik je italijanski.
        iz_udzbenika:
          strana: 31
          odeljak: Osnovni podaci
          tekst: U infookviru su glavni grad Rim i službeni jezik — italijanski.
          slika: 10-italija/01-italija-infookvir.jpg

      - id: polozaj-tn-zapadna-obala
        vrsta: tacno_netacno
        tezina: tesko
        pojmovi: [ligurijsko-more, tirensko-more, jadransko-more, jonsko-more]
        tvrdnja: Zapadnu obalu Italije zapljuskuju Jadransko i Jonsko more.
        tacno: false
        ispravke:
          - {tekst: "Zapadnu obalu zapljuskuju Ligurijsko i Tirensko more.", tacan: true}
          - {tekst: "Zapadnu obalu zapljuskuju Egejsko i Crno more.", tacan: false}
          - {tekst: "Zapadnu obalu zapljuskuje samo Atlantski okean.", tacan: false}
        pomoc:
          - Jadran je more između Italije i Balkana — na kojoj je to strani „čizme”?
          - Na zapadu je more uz Đenovu i more između kopna, Sardinije i Sicilije.
          - "Iz lekcije: zapadno su Ligurijsko i Tirensko more, istočno Jadransko i Jonsko."
        objasnjenje: Netačno — Jadransko i Jonsko more su na istoku. Zapadnu obalu zapljuskuju Ligurijsko i Tirensko more.
        iz_udzbenika:
          strana: 31
          odeljak: Položaj
          tekst: Zapadna obala izlazi na Ligurijsko i Tirensko more, a istočna na Jadransko i Jonsko more.
          slika: 10-italija/05-fizicka-karta-italije.jpg

      - id: polozaj-dopuni-infookvir
        vrsta: dopuni
        tezina: lako
        pojmovi: [italija, rim]
        pitanje: Dopuni rečenicu rečima iz banke.
        tekst: Italija ima oko {{58,8|58.8}} miliona stanovnika, glavni grad je {{Rim}}, a službeni jezik je {{italijanski}}.
        ponudjene: ["58,8", Rim, italijanski, "5,8", Milano, latinski]
        pomoc:
          - Italija je među najnaseljenijim državama Evrope — broj stanovnika je veći od 50 miliona.
          - Glavni grad je „Večni grad” na Tibru; jezik nosi ime po narodu.
          - "Iz lekcije: 58,8 miliona stanovnika, glavni grad Rim, jezik italijanski."
        objasnjenje: Italija ima 58,8 miliona stanovnika, glavni grad je Rim, a službeni jezik italijanski.
        iz_udzbenika:
          strana: 31
          odeljak: Osnovni podaci
          tekst: Infookvir navodi 58,8 miliona stanovnika, površinu 301.340 km², glavni grad Rim i italijanski jezik.
          slika: 10-italija/01-italija-infookvir.jpg

      - id: polozaj-dopuni-otrantska
        vrsta: dopuni
        tezina: srednje
        pojmovi: [otrantska-vrata, jadransko-more, jonsko-more]
        pitanje: Dopuni rečenicu rečju iz banke.
        tekst: Jadransko i Jonsko more razdvaja moreuz {{Otrantska vrata}}.
        ponudjene: [Otrantska vrata, Mesinski moreuz, Gibraltarski moreuz, Bosfor]
        pomoc:
          - Moreuz je između „pete” italijanske čizme i obale Albanije.
          - Gibraltar je kod Španije, Bosfor kod Istanbula, a Mesinski moreuz deli Siciliju od Kalabrije.
          - "Iz lekcije: Jadransko i Jonsko more razdvajaju Otrantska vrata."
        objasnjenje: Otrantska vrata su moreuz između jugoistoka Italije i Albanije; spajaju (i razdvajaju) Jadransko i Jonsko more.
        iz_udzbenika:
          strana: 31
          odeljak: Položaj
          tekst: Istočnu obalu zapljuskuju Jadransko i Jonsko more, a između njih je moreuz Otrantska vrata.

      - id: polozaj-dopuni-mora
        vrsta: dopuni
        tezina: tesko
        pojmovi: [ligurijsko-more, tirensko-more, jadransko-more, jonsko-more]
        pitanje: Dopuni rečenicu (bez ponuđenih reči).
        tekst: Severozapadno, uz Đenovu, je {{Ligurijsko}} more, a između kopna, Sardinije i Sicilije {{Tirensko}} more. Istočno, prema Balkanu, je {{Jadransko}} more, a na jugoistoku, prema Grčkoj, {{Jonsko}} more.
        pomoc:
          - Na zapadu su dva mora, a na istoku dva — sva su delovi Sredozemnog mora.
          - Severozapadno more nosi ime po oblasti Ligurija; istočno more uz Balkan zovemo i Jadran.
          - "Iz lekcije: Ligurijsko i Tirensko (zapad), Jadransko i Jonsko more (istok)."
        objasnjenje: Ligurijsko (kod Đenove) i Tirensko more su na zapadu, Jadransko (prema Balkanu) i Jonsko more (prema Grčkoj) na istoku.
        iz_udzbenika:
          strana: 31
          odeljak: Položaj
          tekst: Italiju sa tri strane okružuju četiri mora — Ligurijsko i Tirensko na zapadu, Jadransko i Jonsko na istoku.
          slika: 10-italija/05-fizicka-karta-italije.jpg

      - id: polozaj-povezi-infookvir
        vrsta: povezi
        tezina: lako
        pojmovi: [italija, rim]
        pitanje: Poveži podatak iz infookvira sa njegovom vrednošću.
        parovi:
          - [Glavni grad, Rim]
          - [Službeni jezik, italijanski]
          - [Broj stanovnika, "58,8 miliona"]
          - [Površina, "301.340 km²"]
        pomoc:
          - Kreni od podataka koje najlakše prepoznaješ — grad i jezik.
          - Broj sa „km²” je površina, a broj sa „miliona” je broj stanovnika.
          - "Iz lekcije: Rim, italijanski, 58,8 miliona stanovnika, 301.340 km²."
        objasnjenje: Glavni grad Rim, jezik italijanski, 58,8 miliona stanovnika, površina 301.340 km².
        iz_udzbenika:
          strana: 31
          odeljak: Osnovni podaci
          tekst: Infookvir sa ikonicama daje četiri osnovna podatka o Italiji — stanovništvo, površinu, glavni grad i jezik.
          slika: 10-italija/01-italija-infookvir.jpg

      - id: polozaj-povezi-mora
        vrsta: povezi
        tezina: srednje
        pojmovi: [ligurijsko-more, tirensko-more, jadransko-more, jonsko-more]
        pitanje: Poveži more sa njegovim položajem uz Italiju.
        parovi:
          - [Ligurijsko more, "severozapad, uz Đenovu"]
          - [Tirensko more, "između kopna, Sicilije i Sardinije"]
          - [Jadransko more, "istočno, između Italije i Balkana"]
          - [Jonsko more, "jugoistok, između Italije i Grčke"]
        pomoc:
          - Dva mora su na zapadnoj, a dva na istočnoj obali.
          - Na zapadu je manje more na severu (kod Đenove) i veće južno od njega; na istoku je severnije more uže i duže.
          - "Iz lekcije: Ligurijsko i Tirensko na zapadu, Jadransko i Jonsko na istoku."
        objasnjenje: Ligurijsko — kod Đenove; Tirensko — između kopna i velikih ostrva; Jadransko — prema Balkanu; Jonsko — prema Grčkoj.
        iz_udzbenika:
          strana: 31
          odeljak: Položaj
          tekst: Na fizičkoj karti se vidi da Ligurijsko i Tirensko more zapljuskuju zapadnu, a Jadransko i Jonsko more istočnu obalu Italije.
          slika: 10-italija/05-fizicka-karta-italije.jpg

      - id: polozaj-zakljuci-more
        vrsta: zakljuci
        tezina: lako
        pojmovi: [italija, sredozemno-more]
        pitanje: Italiju sa tri strane okružuje more. Šta to znači za ovu zemlju?
        odgovori:
          - {tekst: "Ima dugu morsku obalu, pa su joj važni luke i primorski turizam.", tacan: true}
          - {tekst: "Nema izlaz na more.", tacan: false}
          - {tekst: "Sve njene granice su na kopnu.", tacan: false}
          - {tekst: "Okružena je pustinjom.", tacan: false}
        pomoc:
          - "Korak 1: Ako je more sa tri strane, koliko je dugačka obala?"
          - "Korak 2: Šta ljudi rade uz more — setite se luke Đenova i turista."
          - "Iz lekcije: Italija izlazi na četiri mora; Đenova je najveća luka, a more privlači turiste."
        objasnjenje: Zbog mora sa tri strane Italija ima dugu obalu — razvijene su luke (Đenova) i primorski turizam.
        iz_udzbenika:
          strana: 31
          odeljak: Položaj
          tekst: Italija sa tri strane izlazi na more — Ligurijsko, Tirensko, Jadransko i Jonsko. Izlazak na more je i jedan od razloga velikog broja turista.

      - id: polozaj-zakljuci-otrant
        vrsta: zakljuci
        tezina: tesko
        pojmovi: [otrantska-vrata, venecija, jadransko-more, jonsko-more]
        pitanje: Brod plovi iz Venecije ka zapadnoj obali Grčke. Kroz koji moreuz mora da prođe?
        odgovori:
          - {tekst: "Kroz Otrantska vrata", tacan: true}
          - {tekst: "Kroz Gibraltarski moreuz", tacan: false}
          - {tekst: "Kroz Bosfor", tacan: false}
          - {tekst: "Ni kroz jedan — Venecija je na Tirenskom moru.", tacan: false}
        pomoc:
          - "Korak 1: Na kom moru je Venecija — na istočnoj ili zapadnoj strani Italije?"
          - "Korak 2: Zapadna obala Grčke je na Jonskom moru. Kako se iz Jadrana stiže u Jonsko more?"
          - "Iz lekcije: Jadransko i Jonsko more razdvajaju Otrantska vrata."
        objasnjenje: Venecija je na severnom Jadranu; da bi stigao do Jonskog mora uz Grčku, brod prolazi kroz Otrantska vrata.
        iz_udzbenika:
          strana: 31
          odeljak: Položaj
          tekst: Istočnu obalu Italije zapljuskuju Jadransko i Jonsko more, koje razdvaja moreuz Otrantska vrata.

      - id: polozaj-klik-italija
        vrsta: karta_klik
        tezina: lako
        pojmovi: [italija, apeninsko-poluostrvo]
        pitanje: Klikni na Italiju.
        cilj: {drzava: ITA}
        pomoc:
          - Italija je u sredini Sredozemnog mora, južno od Alpa.
          - Ima oblik čizme.
          - Klikni na „čizmu”.
        objasnjenje: Italija je „čizma” u središnjem Sredozemlju, od Alpa do Sicilije.
        iz_udzbenika:
          strana: 31
          odeljak: Osnovni podaci
          tekst: Na maloj karti u infookviru Italija je obojena crveno, sa Sicilijom i Sardinijom.
          slika: 10-italija/01-italija-infookvir.jpg

      - id: polozaj-klik-jadransko
        vrsta: karta_klik
        tezina: lako
        pojmovi: [jadransko-more]
        pitanje: Klikni na Jadransko more.
        cilj: {mesto: jadransko-more}
        pomoc:
          - Jadransko more je istočno od Italije.
          - Nalazi se između Italije i Balkanskog poluostrva (Hrvatske, Crne Gore, Albanije).
          - Klikni na izduženo more između „čizme” i Balkana.
        objasnjenje: Jadransko more je između Italije i Balkana; u njega se uliva Po.
        iz_udzbenika:
          strana: 31
          odeljak: Položaj
          tekst: Istočnu obalu Italije zapljuskuju Jadransko i Jonsko more.
          slika: 10-italija/05-fizicka-karta-italije.jpg

      - id: polozaj-klik-tirensko
        vrsta: karta_klik
        tezina: lako
        pojmovi: [tirensko-more]
        pitanje: Klikni na Tirensko more.
        cilj: {mesto: tirensko-more}
        pomoc:
          - Tirensko more je zapadno od Apeninskog poluostrva.
          - Okruženo je kopnom Italije, Sicilijom, Sardinijom i Korzikom.
          - Klikni na more između „čizme” i Sardinije.
        objasnjenje: Tirensko more je između kopna Italije, Sicilije, Sardinije i Korzike.
        iz_udzbenika:
          strana: 31
          odeljak: Položaj
          tekst: Zapadna obala Italije izlazi na Ligurijsko i Tirensko more.
          slika: 10-italija/05-fizicka-karta-italije.jpg

      - id: polozaj-klik-ligurijsko
        vrsta: karta_klik
        tezina: srednje
        pojmovi: [ligurijsko-more]
        pitanje: Klikni na Ligurijsko more.
        cilj: {mesto: ligurijsko-more}
        pomoc:
          - Ligurijsko more je na severozapadu, severno od Tirenskog.
          - Nalazi se uz Đenovu, između italijanske obale i Korzike.
          - Klikni na more severno od Korzike, kod Đenove.
        objasnjenje: Ligurijsko more je na severozapadu Italije; na njemu je luka Đenova.
        iz_udzbenika:
          strana: 31
          odeljak: Položaj
          tekst: Zapadna obala Italije izlazi na Ligurijsko i Tirensko more; Ligurijsko je severnije, uz Đenovu.
          slika: 10-italija/05-fizicka-karta-italije.jpg

      - id: polozaj-klik-jonsko
        vrsta: karta_klik
        tezina: lako
        pojmovi: [jonsko-more]
        pitanje: Klikni na Jonsko more.
        cilj: {mesto: jonsko-more}
        pomoc:
          - Jonsko more je na jugoistoku Italije.
          - Nalazi se između „đona” čizme i Grčke, južno od Otrantskih vrata.
          - Klikni na more između Kalabrije i Grčke.
        objasnjenje: Jonsko more je između jugoistoka Italije i Grčke.
        iz_udzbenika:
          strana: 31
          odeljak: Položaj
          tekst: Istočnu obalu Italije zapljuskuju Jadransko i Jonsko more.
          slika: 10-italija/05-fizicka-karta-italije.jpg

      - id: polozaj-klik-otrantska
        vrsta: karta_klik
        tezina: srednje
        pojmovi: [otrantska-vrata]
        pitanje: Klikni na moreuz Otrantska vrata.
