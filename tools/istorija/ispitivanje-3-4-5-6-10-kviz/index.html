šćanstvo su prvo upoznali preko zatečenih starosedelaca."], "objasnjenje": "Hrišćani su bili zatečeni starosedeoci, pa je prvi dodir sa verom išao preko njih.", "iz_udzbenika": {"strana": 20, "odeljak": "Pokrštavanje Južnih Slovena", "tekst": "Sloveni su hrišćanstvo prvo upoznali preko zatečenih starosedelaca."}, "lekcija": 3}, {"id": "l03-karantanci-tn", "vrsta": "tacno_netacno", "tezina": "lako", "pojmovi": ["pokrstavanje"], "tvrdnja": "Hrišćanstvo se među Južnim Slovenima najpre proširilo kod Karantanskih Slovena, u današnjoj Sloveniji.", "tacno": true, "pomoc": ["To je najzapadnija južnoslovenska oblast, blizu Franačke.", "Iz lekcije: prvo se proširilo kod Karantanskih Slovena."], "objasnjenje": "Tačno. Oni su bili u neposrednom susedstvu moćne hrišćanske Franačke.", "iz_udzbenika": {"strana": 21, "odeljak": "Pokrštavanje Južnih Slovena", "tekst": "Hrišćanstvo se prvo proširilo kod Karantanskih Slovena, u današnjoj Sloveniji."}, "lekcija": 3}, {"id": "l03-pre-pisma-tn", "vrsta": "tacno_netacno", "tezina": "lako", "pojmovi": ["glagoljica", "cirilica"], "tvrdnja": "Pre glagoljice i ćirilice slovenski narodi nisu imali pismo.", "tacno": true, "pomoc": ["Zato su o njima pisali Vizantinci.", "Iz lekcije: pre ova dva pisma slovenski narodi pismo nisu imali."], "objasnjenje": "Tačno. Glagoljica i ćirilica su prva slovenska pisma.", "iz_udzbenika": {"strana": 21, "odeljak": "Pokrštavanje Južnih Slovena", "tekst": "Pre glagoljice i ćirilice slovenski narodi pismo nisu imali."}, "lekcija": 3}, {"id": "l03-najpre-vladari-tn", "vrsta": "tacno_netacno", "tezina": "srednje", "pojmovi": ["hristijanizacija", "pokrstavanje"], "tvrdnja": "Hrišćanstvo je najpre primio prost narod, a tek onda vladarske porodice.", "tacno": false, "ispravke": [{"tekst": "Najpre su ga primali članovi vladarskih porodica, a posle ostali narod.", "tacan": true}, {"tekst": "Svi su ga primili istog dana, po naredbi cara.", "tacan": false, "zasto": "Hristijanizacija je bila postepen proces, a nije bila jednodnevna naredba."}, {"tekst": "Vladari ga nikada nisu primili.", "tacan": false, "zasto": "Upravo su oni prvi ušli u novu veru, što je imalo i politički značaj."}], "pomoc": ["Pokrštavanje je i politički čin.", "Ko je u državi donosio političke odluke?", "Iz lekcije: najpre članovi vladarskih porodica, a posle ostali narod."], "objasnjenje": "Netačno. Širenje vere išlo je odozgo: prvo vladarske porodice, zatim narod.", "iz_udzbenika": {"strana": 22, "odeljak": "Pokrštavanje Južnih Slovena", "tekst": "Hrišćanstvo su najpre primali članovi vladarskih porodica, a posle ostali narod."}, "lekcija": 3}, {"id": "l03-hrvati-gradovi-tn", "vrsta": "tacno_netacno", "tezina": "srednje", "pojmovi": ["pokrstavanje", "starosedeoci"], "tvrdnja": "Hrvatska plemena pokrštena su pod uticajem dalmatinskih gradova sa romanskim hrišćanima.", "tacno": true, "pomoc": ["Hrvati su živeli uz Jadran, blizu tih gradova.", "Iz lekcije: pod uticajem dalmatinskih gradova pokrštena su hrvatska plemena."], "objasnjenje": "Tačno. Romanski hrišćani iz dalmatinskih gradova imali su važnu ulogu u pokrštavanju Hrvata.", "iz_udzbenika": {"strana": 21, "odeljak": "Pokrštavanje Južnih Slovena", "tekst": "Pod uticajem dalmatinskih gradova sa romanskim hrišćanima pokrštena su hrvatska plemena."}, "lekcija": 3}, {"id": "l03-cirilica-tn", "vrsta": "tacno_netacno", "tezina": "tesko", "pojmovi": ["cirilica", "glagoljica", "cirilo-i-metodije", "kliment-i-naum"], "tvrdnja": "Ćirilicu je sastavio sam Ćirilo, pa je zato po njemu i dobila ime.", "tacno": false, "ispravke": [{"tekst": "Ćirilo je sastavio glagoljicu; ćirilica nastaje kasnije, kada misionari usavršavaju slovensko pismo.", "tacan": true}, {"tekst": "Ćirilicu je sastavio Metodije.", "tacan": false, "zasto": "Lekcija Metodiju ne pripisuje sastavljanje nijednog pisma; ćirilicu vezuje za rad misionara posle braće."}, {"tekst": "Ćirilica je starija od glagoljice.", "tacan": false, "zasto": "Prvo pismo je glagoljica, a ćirilica je prostija i lakša, usavršena kasnije."}], "pomoc": ["Ime pisma ne dokazuje ko ga je sastavio.", "Koje je pismo Ćirilo stvarno sastavio?", "Iz lekcije: Ćirilo je sastavio glagoljicu, a misionari su usavršili pismo i stvorili ćirilicu."], "objasnjenje": "Netačno. Glagoljica je Ćirilovo delo, a ćirilica je nastala iz rada misionara koji su pismo usavršili i pojednostavili.", "iz_udzbenika": {"strana": 21, "odeljak": "Pokrštavanje Južnih Slovena", "tekst": "Ćirilo je sastavio glagoljicu, a misionari su kasnije usavršili pismo i stvorili ćirilicu."}, "lekcija": 3}, {"id": "l03-braca-dopuni", "vrsta": "dopuni", "tezina": "lako", "pojmovi": ["cirilo-i-metodije", "glagoljica", "velikomoravska-knezevina"], "pitanje": "Dopuni rečenicu o braći misionarima.", "tekst": "Ćirilo i {{Metodije}}, poreklom iz okoline {{Soluna}}, otišli su u {{Velikomoravsku}} kneževinu, a Ćirilo je sastavio {{glagoljicu}}.", "ponudjene": ["Metodije", "Soluna", "Velikomoravsku", "glagoljicu", "Naum", "Carigrada"], "pomoc": ["Naum je njihov učenik, a ne brat.", "Pismo se ovde zove prvo slovensko pismo.", "Iz lekcije: braća iz okoline Soluna, misija u Velikomoravskoj, glagoljica."], "objasnjenje": "Ćirilo i Metodije iz okoline Soluna radili su u Velikomoravskoj i dali Slovenima prvo pismo.", "iz_udzbenika": {"strana": 21, "odeljak": "Pokrštavanje Južnih Slovena", "tekst": "Braća iz okoline Soluna poslata su u Velikomoravsku; Ćirilo je sastavio glagoljicu.", "slika": "03-doseljavanje-srba-na-balkan/04-cirilo-i-metodije.jpg"}, "lekcija": 3}, {"id": "l03-raskol-dopuni", "vrsta": "dopuni", "tezina": "lako", "pojmovi": ["veliki-raskol"], "pitanje": "Dopuni rečenicu o raskolu.", "tekst": "Veliki raskol {{1054}}. podelio je crkvu: Hrvati i Slovenci pripali su {{katoličkoj}}, a Srbi i Bugari {{pravoslavnoj}}.", "ponudjene": ["1054", "1204", "katoličkoj", "pravoslavnoj"], "pomoc": ["Godina je iz XI veka.", "Zapadni Južni Sloveni su uz Rim, a istočni uz Carigrad.", "Iz lekcije: 1054; Hrvati i Slovenci katoličkoj, Srbi i Bugari pravoslavnoj."], "objasnjenje": "Godine 1054. crkva se deli, a sa njom i Južni Sloveni.", "iz_udzbenika": {"strana": 21, "odeljak": "Pokrštavanje Južnih Slovena", "tekst": "Veliki raskol 1054. podelio je crkvu; Hrvati i Slovenci pripali su katoličkoj, a makedonski Sloveni, Srbi i Bugari pravoslavnoj."}, "osa": {"naziv": "Veliki raskol", "od": 1054, "traka": "crkva-kultura"}, "lekcija": 3}, {"id": "l03-dva-suseda-dopuni", "vrsta": "dopuni", "tezina": "srednje", "pojmovi": ["pokrstavanje", "vizantija"], "pitanje": "Dopuni rečenicu o hrišćanskim susedima.", "tekst": "Južni Sloveni imali su dva moćna hrišćanska suseda: {{Franačku}} na zapadu i {{Vizantiju}} na istoku, a hrišćanstvo se među njima učvršćuje u {{IX}} veku.", "ponudjene": ["Franačku", "Vizantiju", "Bugarsku", "IX", "VI"], "pomoc": ["U VI veku Sloveni tek pljačkaju Balkan.", "Zapadni sused je kraljevina Franaka.", "Iz lekcije: Franačka na zapadu, Vizantija na istoku; hrišćanstvo se učvršćuje u IX veku."], "objasnjenje": "Vera je dolazila sa obe strane, od Franačke i od Vizantije, a učvrstila se u IX veku.", "iz_udzbenika": {"strana": 21, "odeljak": "Pokrštavanje Južnih Slovena", "tekst": "Moćni hrišćanski susedi bili su Franačka i Vizantija; hrišćanstvo se učvršćuje u IX veku."}, "osa": {"naziv": "Učvršćivanje hrišćanstva kod Južnih Slovena", "od": 800, "do": 900, "oznaka": "IX vek", "traka": "crkva-kultura"}, "lekcija": 3}, {"id": "l03-kliment-naum-dopuni", "vrsta": "dopuni", "tezina": "tesko", "pojmovi": ["kliment-i-naum", "cirilica", "glagoljica"], "pitanje": "Dopuni bez ponuđenih reči.", "tekst": "Učenici braće, {{Kliment}} i {{Naum}}, propovedaju među makedonskim Slovenima i Bugarima. Misionari su tada stvorili {{ćirilicu}}, prostiju i lakšu od {{glagoljice}}.", "pomoc": ["Treća praznina je pismo koje i ti poznaješ.", "Četvrta je starije, prvo slovensko pismo.", "Iz lekcije: Kliment i Naum; ćirilica, prostija i lakša od glagoljice."], "objasnjenje": "Kliment i Naum su nastavili rad braće, a usavršavanjem pisma nastala je ćirilica.", "iz_udzbenika": {"strana": 21, "odeljak": "Pokrštavanje Južnih Slovena", "tekst": "Kliment i Naum propovedaju među makedonskim Slovenima i Bugarima; misionari stvaraju ćirilicu, prostiju i lakšu od glagoljice."}, "osa": {"naziv": "Rad Klimenta i Nauma", "od": 885, "do": 915, "oznaka": "kraj IX i početak X veka", "traka": "crkva-kultura"}, "lekcija": 3}, {"id": "l03-licnosti-vere-povezi", "vrsta": "povezi", "tezina": "lako", "pojmovi": ["cirilo-i-metodije", "kliment-i-naum", "rastislav", "glagoljica"], "pitanje": "Poveži ličnost sa onim po čemu je poznata.", "parovi": [["Ćirilo", "Sastavio je glagoljicu"], ["Rastislav", "Pozvao je misionare u Moravsku"], ["Kliment i Naum", "Učenici koji propovedaju na Balkanu"], ["Ćirilo i Metodije", "Preveli su verske knjige na slovenski"]], "pomoc": ["Jedna od ličnosti je vladar.", "Učenici dolaze posle braće.", "Iz lekcije: Ćirilo glagoljica, Rastislav poziv, Kliment i Naum učenici."], "objasnjenje": "Knez poziva, braća stvaraju pismo i prevode, a učenici nastavljaju rad na Balkanu.", "iz_udzbenika": {"strana": 21, "odeljak": "Pokrštavanje Južnih Slovena", "tekst": "Rastislav poziva braću, Ćirilo sastavlja glagoljicu, braća prevode knjige, a Kliment i Naum nastavljaju rad."}, "lekcija": 3}, {"id": "l03-odakle-vera-povezi", "vrsta": "povezi", "tezina": "srednje", "pojmovi": ["pokrstavanje", "hristijanizacija", "veliki-raskol"], "pitanje": "Poveži narod ili grupu sa putem kojim je došlo do hrišćanstva ili sa crkvom kojoj je pripao.", "parovi": [["Karantanski Sloveni", "Prvi među Južnim Slovenima primaju veru"], ["Hrvatska plemena", "Pokršteni uticajem dalmatinskih gradova"], ["Makedonski Sloveni i Bugari", "Rad Klimenta i Nauma"], ["Hrvati i Slovenci posle 1054.", "Katolička crkva"], ["Srbi posle 1054.", "Pravoslavna crkva"]], "pomoc": ["Dva para govore o dobu posle raskola.", "Prati geografiju, od zapada ka istoku.", "Iz lekcije: Karantanci prvi, Hrvati preko dalmatinskih gradova, Kliment i Naum među makedonskim Slovenima i Bugarima."], "objasnjenje": "Različiti putevi do vere pomažu da se razume i kasnija verska podela Južnih Slovena.", "iz_udzbenika": {"strana": 21, "odeljak": "Pokrštavanje Južnih Slovena", "tekst": "Vera se širila kod Karantanskih Slovena, preko dalmatinskih gradova, a Kliment i Naum rade među makedonskim Slovenima i Bugarima."}, "lekcija": 3}, {"id": "l03-vise-od-vere-zakljuci", "vrsta": "zakljuci", "tezina": "srednje", "pojmovi": ["hristijanizacija", "pokrstavanje", "vizantija"], "pitanje": "Lekcija kaže da pokrštavanje nije bilo samo verski čin. Šta je još značilo?", "odgovori": [{"tekst": "Bilo je i politički i kulturni čin: povezivalo je Slovene sa razvijenijim svetom", "tacan": true}, {"tekst": "Bilo je samo vojni pohod", "tacan": false, "zasto": "Misija se vodila propovedanjem i prevođenjem knjiga, a ne vojskom."}, {"tekst": "Bilo je način da se Sloveni vrate u pradomovinu", "tacan": false, "zasto": "Pokrštavanje nema veze sa povratkom; ono je Slovene još čvršće vezalo za Balkan i susede."}, {"tekst": "Bilo je obična promena imena bogova", "tacan": false, "zasto": "Promene su bile veće: sa verom su došli pismenost, knjige i veza sa hrišćanskim državama."}], "pomoc": ["Korak 1: Šta je došlo uz novu veru?", "Korak 2: Sa kojim državama se povezuje narod koji primi hrišćanstvo?", "Iz lekcije: pokrštavanje nije samo verski, već i politički i kulturni čin."], "objasnjenje": "Hrišćanstvo je Slovenima donelo pismo, knjige i put u svet latinske i grčke kulture, a vladarima veze sa hrišćanskim državama.", "iz_udzbenika": {"strana": 21, "odeljak": "Pokrštavanje Južnih Slovena", "tekst": "Pokrštavanje nije samo verski čin, već i politički i kulturni."}, "lekcija": 3}, {"id": "l03-zasto-znali-jezik-zakljuci", "vrsta": "zakljuci", "tezina": "srednje", "pojmovi": ["cirilo-i-metodije", "solun", "misionar"], "pitanje": "Zašto je za uspeh misije bilo presudno što su Ćirilo i Metodije znali slovenski jezik i običaje?", "odgovori": [{"tekst": "Veru su mogli da šire i knjige da prevode na jeziku koji su ljudi razumeli", "tacan": true}, {"tekst": "Zato što je grčki jezik bio zabranjen", "tacan": false, "zasto": "Nije bio zabranjen; problem je što ga Sloveni nisu razumeli."}, {"tekst": "Zato što su morali da vode vojsku", "tacan": false, "zasto": "Bili su propovednici, a ne vojskovođe."}, {"tekst": "Zato što je Rastislav tražio prevodioce za trgovinu", "tacan": false, "zasto": "Tražio je širenje vere; lekcija ih zove misionarima, a ne trgovačkim prevodiocima."}], "pomoc": ["Korak 1: Kako se propoveda ljudima koji ne znaju grčki?", "Korak 2: Na koji jezik su prevedene verske knjige?", "Iz lekcije: znali su slovenski jezik i običaje; preveli su najvažnije verske knjige na slovenski."], "objasnjenje": "Vera je postala razumljiva jer se o njoj govorilo i pisalo na slovenskom.", "iz_udzbenika": {"strana": 21, "odeljak": "Pokrštavanje Južnih Slovena", "tekst": "Braća su znala slovenski jezik i običaje i prevela su najvažnije verske knjige na slovenski."}, "lekcija": 3}, {"id": "l03-geografija-raskola-zakljuci", "vrsta": "zakljuci", "tezina": "tesko", "pojmovi": ["veliki-raskol", "pokrstavanje", "vizantija"], "pitanje": "Kako se pripadnost Južnih Slovena dvema crkvama posle 1054. slaže sa tim od koga su primili veru?", "odgovori": [{"tekst": "Oni bliži Franačkoj i dalmatinskim gradovima (Hrvati, Slovenci) postaju katolici, a oni bliži Vizantiji pravoslavni", "tacan": true}, {"tekst": "Svi su primili veru iz istog izvora, pa je podela bila slučajna", "tacan": false, "zasto": "Vera je dolazila sa dve strane, sa zapada i sa istoka, pa je podela imala osnova."}, {"tekst": "Srbi su postali pravoslavni zato što su živeli najzapadnije", "tacan": false, "zasto": "Najzapadniji su Slovenci, a oni su katolici; Srbi su bliži Vizantiji."}, {"tekst": "Podela je nastala zato što su Hrvati usvojili ćirilicu", "tacan": false, "zasto": "Lekcija navodi da ćirilicu koriste Srbi, Makedonci, Bugari i Rusi; podelu ne objašnjava pismo."}], "pomoc": ["Korak 1: Sa kojih strana je dolazila vera?", "Korak 2: Gde žive Hrvati i Slovenci, a gde Srbi i Bugari?", "Iz lekcije: Franačka na zapadu, Vizantija na istoku; Hrvati i Slovenci katolici, makedonski Sloveni, Srbi i Bugari pravoslavni."], "objasnjenje": "Podela prati stare puteve uticaja: zapad ostaje vezan za Rim, a istok za Vizantiju.", "iz_udzbenika": {"strana": 21, "odeljak": "Pokrštavanje Južnih Slovena", "tekst": "Hrišćanstvo je dolazilo od Franačke i od Vizantije, a raskol je Južne Slovene podelio na katolike i pravoslavne."}, "osa": {"naziv": "Veliki raskol", "od": 1054, "traka": "crkva-kultura"}, "lekcija": 3}, {"id": "l03-sta-bi-bez-ucenika-zakljuci", "vrsta": "zakljuci", "tezina": "tesko", "pojmovi": ["kliment-i-naum", "cirilo-i-metodije", "velikomoravska-knezevina"], "pitanje": "Kako se dogodilo da je neuspeh u Moravskoj postao dobitak za balkanske Slovene?", "odgovori": [{"tekst": "Proterani učenici prešli su među balkanske Slovene i tu uspešno nastavili rad", "tacan": true}, {"tekst": "Velikomoravska je osvojila Balkan i donela pismo", "tacan": false, "zasto": "Velikomoravsku su kasnije pokorili Mađari; rad se preneo sa ljudima, a ne sa osvajanjem."}, {"tekst": "Nemačko sveštenstvo je i samo otišlo na Balkan", "tacan": false, "zasto": "Nemačko sveštenstvo je ostalo u Moravskoj i prevladalo; otišli su proterani učenici."}, {"tekst": "Ćirilo i Metodije su se tada vratili u Solun i osnovali školu", "tacan": false, "zasto": "Do progona dolazi tek posle smrti braće, pa su na Balkan prešli učenici."}], "pomoc": ["Korak 1: Šta se desilo sa učenicima posle smrti braće?", "Korak 2: Kuda su otišli?", "Iz lekcije: nemačko sveštenstvo preovlađuje, učenici su proterani i prelaze među balkanske Slovene."], "objasnjenje": "Progon je rad misionara preneo na Balkan, gde su nastala i učvrstila se slovenska pismenost i vera.", "iz_udzbenika": {"strana": 21, "odeljak": "Pokrštavanje Južnih Slovena", "tekst": "Posle smrti braće učenici su proterani, prelaze među balkanske Slovene i tu uspešno nastavljaju rad."}, "lekcija": 3}, {"id": "l03-raskol-datum", "vrsta": "datum", "tezina": "lako", "pojmovi": ["veliki-raskol"], "dogadjaj": "Veliki raskol", "pitanje": "Koje godine je došlo do Velikog raskola?", "godina": 1054, "traka": "crkva-kultura", "pomoc": ["To je XI vek, njegova sredina.", "Godina se završava sa 54.", "Iz lekcije: Veliki raskol 1054."], "objasnjenje": "Veliki raskol dogodio se 1054.", "iz_udzbenika": {"strana": 21, "odeljak": "Pokrštavanje Južnih Slovena", "tekst": "Veliki raskol 1054. podelio je crkvu na istočnu i zapadnu."}, "lekcija": 3}, {"id": "l03-misija-datum", "vrsta": "datum", "tezina": "srednje", "pojmovi": ["cirilo-i-metodije", "misionar"], "dogadjaj": "Misija Ćirila i Metodija", "pitanje": "U kom periodu je trajala misija Ćirila i Metodija?", "od": 863, "do": 885, "traka": "crkva-kultura", "pomoc": ["Sve je u drugoj polovini IX veka.", "Trajala je dvadeset i dve godine.", "Iz lekcije: 863–885."], "objasnjenje": "Misija braće trajala je 863–885.", "iz_udzbenika": {"strana": 21, "odeljak": "Pokrštavanje Južnih Slovena", "tekst": "Misija Ćirila i Metodija trajala je 863–885.", "slika": "03-doseljavanje-srba-na-balkan/04-cirilo-i-metodije.jpg"}, "lekcija": 3}, {"id": "l03-pismenost-poredjaj", "vrsta": "poredjaj", "tezina": "lako", "pojmovi": ["cirilo-i-metodije", "veliki-raskol", "kliment-i-naum"], "pitanje": "Poređaj događaje hronološki, od najranijeg.", "stavke": [{"tekst": "Misija Ćirila i Metodija", "godina": 863, "do": 885, "naziv": "Misija Ćirila i Metodija", "traka": "crkva-kultura"}, {"tekst": "Rad Klimenta i Nauma", "godina": 885, "do": 915, "oznaka": "kraj IX i početak X veka", "naziv": "Rad Klimenta i Nauma", "traka": "crkva-kultura"}, {"tekst": "Veliki raskol", "godina": 1054, "naziv": "Veliki raskol", "traka": "crkva-kultura"}], "pomoc": ["Učenici dolaze posle učitelja.", "Raskol je tek u XI veku.", "Iz lekcije: 863–885, kraj IX i početak X veka, 1054."], "objasnjenje": "Braća (863–885) → učenici (kraj IX i početak X veka) → raskol (1054).", "iz_udzbenika": {"strana": 17, "odeljak": "Hronologija celog dela II", "tekst": "Lenta dela II navodi rad Ćirila i Metodija, zatim Klimenta i Nauma, a tekst lekcije raskol 1054."}, "lekcija": 3}, {"id": "l03-cela-lekcija-poredjaj", "vrsta": "poredjaj", "tezina": "srednje", "pojmovi": ["huni", "solun", "cirilo-i-metodije", "leh", "veliki-raskol"], "pitanje": "Poređaj događaje iz cele lekcije, od najranijeg.", "stavke": [{"tekst": "Huni prolaze kroz Vrata naroda", "godina": 375, "naziv": "Huni prolaze kroz Vrata naroda", "traka": "dogadjaji"}, {"tekst": "Neuspeli napad na Carigrad", "godina": 626, "naziv": "Avarsko-slovenski napad na Carigrad", "traka": "dogadjaji"}, {"tekst": "Misija Ćirila i Metodija", "godina": 863, "do": 885, "naziv": "Misija Ćirila i Metodija", "traka": "crkva-kultura"}, {"tekst": "Oton I pobeđuje Mađare na Lehu", "godina": 955, "naziv": "Bitka na reci Leh", "traka": "dogadjaji"}, {"tekst": "Veliki raskol", "godina": 1054, "naziv": "Veliki raskol", "traka": "crkva-kultura"}], "pomoc": ["Svaki događaj je iz drugog veka.", "Prvi je još u antičko doba, a poslednji u XI veku.", "Iz lekcije: 375, 626, 863–885, 955, 1054."], "objasnjenje": "Huni (375) → Carigrad (626) → braća (863–885) → Leh (955) → raskol (1054).", "iz_udzbenika": {"strana": 17, "odeljak": "Hronologija celog dela II", "tekst": "Lenta dela II i tekst lekcije navode ove događaje od 375. do 1054."}, "lekcija": 3}, {"id": "l03-put-vere-poredjaj", "vrsta": "poredjaj", "tezina": "tesko", "pojmovi": ["pokrstavanje", "hristijanizacija", "madjari", "cirilo-i-metodije"], "pitanje": "Poređaj korake širenja hrišćanstva, od najranijeg.", "stavke": [{"tekst": "Misija Ćirila i Metodija u Moravskoj počinje", "godina": 863, "do": 885, "naziv": "Misija Ćirila i Metodija", "traka": "crkva-kultura"}, {"tekst": "Kliment i Naum rade među makedonskim Slovenima i Bugarima", "godina": 885, "do": 915, "oznaka": "kraj IX i početak X veka", "naziv": "Rad Klimenta i Nauma", "traka": "crkva-kultura"}, {"tekst": "Mađari primaju hrišćanstvo", "godina": 1000, "do": 1100, "oznaka": "XI vek", "naziv": "Mađari primaju hrišćanstvo", "traka": "crkva-kultura"}], "pomoc": ["Južni Sloveni su bili pre Mađara.", "Mađari su se tek posle poraza 955. okrenuli novoj veri.", "Iz lekcije: 863–885, kraj IX i početak X veka, XI vek."], "objasnjenje": "Prvo braća, zatim njihovi učenici, a tek onda Mađari, u XI veku.", "iz_udzbenika": {"strana": 21, "odeljak": "Pokrštavanje Južnih Slovena", "tekst": "Misija traje 863–885, učenici zatim rade među balkanskim Slovenima, a Mađari primaju hrišćanstvo u XI veku."}, "lekcija": 3}, {"id": "l03-progon-ucenika-lanac", "vrsta": "lanac", "tezina": "lako", "pojmovi": ["kliment-i-naum", "velikomoravska-knezevina"], "karike": ["U Moravskoj prevlađuje nemačko sveštenstvo", "?", "Učenici prelaze među balkanske Slovene"], "praznina": 1, "odgovori": [{"tekst": "Učenici Ćirila i Metodija su proterani", "tacan": true}, {"tekst": "Učenici postaju vladari Moravske", "tacan": false, "zasto": "Oni su izgubili uticaj i morali da odu, a ne da preuzmu vlast."}, {"tekst": "Papa šalje Hune u Moravsku", "tacan": false, "zasto": "Huni nemaju veze sa ovim dobom; radi se o sukobu sveštenstva u IX veku."}], "pomoc": ["Korak 1: Ko je prevladao u Moravskoj?", "Korak 2: Šta je to značilo za učenike braće?", "Iz lekcije: prevlast nemačkog sveštenstva → progon učenika → prelazak na Balkan."], "objasnjenje": "Nemačko sveštenstvo je proteralo učenike, pa su oni došli na Balkan.", "iz_udzbenika": {"strana": 21, "odeljak": "Pokrštavanje Južnih Slovena", "tekst": "Posle smrti braće u Moravskoj prevlađuje nemačko sveštenstvo, a učenici su proterani."}, "lekcija": 3}, {"id": "l03-vera-pismo-lanac", "vrsta": "lanac", "tezina": "srednje", "pojmovi": ["hristijanizacija", "cirilica", "glagoljica"], "karike": ["Širi se hrišćanstvo među Slovenima", "?", "Nastaje ćirilica"], "praznina": 1, "odgovori": [{"tekst": "Širi se i pismenost, jer vera traži knjige na slovenskom", "tacan": true}, {"tekst": "Stari bogovi dobijaju svoje zapise", "tacan": false, "zasto": "Hrišćanstvo potiskuje mnogoboštvo; pismenost služi verskim knjigama."}, {"tekst": "Sloveni prelaze na latinski i prestaju da pišu", "tacan": false, "zasto": "Pisanje se širi, a slovensko pismo se usavršava."}], "pomoc": ["Korak 1: Šta je potrebno za širenje vere?", "Korak 2: Šta se onda radi sa pismom?", "Iz lekcije: širenje vere → širenje pismenosti → ćirilica."], "objasnjenje": "Vera je tražila knjige, knjige pismene ljude, a pismenost jednostavnije pismo.", "iz_udzbenika": {"strana": 21, "odeljak": "Pokrštavanje Južnih Slovena", "tekst": "Širenje vere išlo je uz širenje pismenosti; misionari su usavršili pismo i stvorili ćirilicu."}, "lekcija": 3}, {"id": "l03-susedi-vera-lanac", "vrsta": "lanac", "tezina": "srednje", "pojmovi": ["pokrstavanje", "vizantija", "veliki-raskol"], "karike": ["Južni Sloveni imaju hrišćanske susede Franačku i Vizantiju", "Vera dolazi sa obe strane", "?"], "praznina": 2, "odgovori": [{"tekst": "Raskol 1054. ih deli na katolike i pravoslavne", "tacan": true}, {"tekst": "Svi Južni Sloveni ostaju mnogobošci", "tacan": false, "zasto": "Upravo su prešli u hrišćanstvo; u IX veku ono se učvršćuje."}, {"tekst": "Svi postaju pravoslavni", "tacan": false, "zasto": "Hrvati i Slovenci pripali su katoličkoj crkvi."}], "pomoc": ["Korak 1: Sa koje strane je bio ko od Južnih Slovena?", "Korak 2: Šta se 1054. desilo sa crkvom?", "Iz lekcije: raskol 1054 → verska podela Južnih Slovena."], "objasnjenje": "Dva izvora vere postala su, posle raskola, dve crkve kojima pripadaju različiti Južni Sloveni.", "iz_udzbenika": {"strana": 21, "odeljak": "Pokrštavanje Južnih Slovena", "tekst": "Vera je dolazila od Franačke i Vizantije, a raskol 1054. podelio je Južne Slovene."}, "osa": {"naziv": "Veliki raskol", "od": 1054, "traka": "crkva-kultura"}, "lekcija": 3}, {"id": "l03-kultura-hrista-lanac", "vrsta": "lanac", "tezina": "tesko", "pojmovi": ["hristijanizacija", "glagoljica", "cirilica"], "karike": ["Braća i učenici stvaraju slovensko pismo i prevode knjige", "Sloveni postaju pismeni narodi", "?"], "praznina": 2, "odgovori": [{"tekst": "Otvara im se put u svet razvijenije latinske i grčke kulture", "tacan": true}, {"tekst": "Prekidaju sve veze sa Vizantijom i Rimom", "tacan": false, "zasto": "Pismenost i vera ih upravo povezuju sa Vizantijom i Rimom."}, {"tekst": "Prestaju da budu Sloveni", "tacan": false, "zasto": "Pismo na slovenskom jeziku jača slovensku kulturu, a ne briše je."}], "pomoc": ["Korak 1: Šta pismen čovek može da radi što nepismen ne može?", "Korak 2: Čiju kulturu je mogao da upozna?", "Iz lekcije: hristijanizacija je Slovenima otvorila put u svet razvijenije latinske i grčke kulture."], "objasnjenje": "Pismenost i vera povezale su Slovene sa kulturom hrišćanskog sveta.", "iz_udzbenika": {"strana": 21, "odeljak": "Pokrštavanje Južnih Slovena", "tekst": "Hristijanizacija je Slovenima otvorila put u svet razvijenije latinske i grčke kulture."}, "lekcija": 3}, {"id": "l03-slika-braca-izvor", "vrsta": "izvor", "slika_u_pitanju": true, "tezina": "srednje", "pojmovi": ["cirilo-i-metodije", "glagoljica"], "izvor": {"autor": "Ilustracija iz udžbenika", "naslov": "Ćirilo i Metodije (opis crteža)", "tekst": "Dvojica svetitelja sa oreolima stoje na pozadini ispisanoj slovima. Jedan u tamnoj monaškoj odeći drži krst i otvoren svitak sa pismom, a drugi, duge brade, nosi bogatu svešteničku odoru.", "napomena": "Odlomak je prepričan; udžbenik, str. 21."}, "pitanje": "Zašto su na crtežu pozadina i svitak puni slova?", "odgovori": [{"tekst": "Zato što se njihovo delo vezuje za slovensko pismo i pismenost", "tacan": true}, {"tekst": "Zato što su bili trgovci koji vode knjige", "tacan": false, "zasto": "Bili su misionari, a slova na crtežu upućuju na pismo koje su dali Slovenima."}, {"tekst": "Zato što su pisali zakone za vizantijskog cara", "tacan": false, "zasto": "Lekcija ih pamti po misiji i pismu, a ne po zakonima."}, {"tekst": "Zato što su u Moravskoj bili učitelji latinskog", "tacan": false, "zasto": "Njihov rad bio je na slovenskom: pismo i prevodi verskih knjiga."}], "pomoc": ["Šta su braća, osim propovedanja, dala Slovenima?", "Krst je za veru, a šta su slova?", "Iz lekcije: Ćirilo sastavlja glagoljicu, a braća prevode verske knjige."], "objasnjenje": "Krst simbolizuje veru, a slova pismenost: to su dve strane njihovog dela.", "iz_udzbenika": {"strana": 21, "odeljak": "Pokrštavanje Južnih Slovena", "tekst": "Ćirilo i Metodije su šireći veru Slovenima dali pismo i prevode verskih knjiga.", "slika": "03-doseljavanje-srba-na-balkan/04-cirilo-i-metodije.jpg"}, "lekcija": 3}, {"id": "l03-glagoljica-cirilica-uporedi", "vrsta": "uporedi", "tezina": "lako", "pojmovi": ["glagoljica", "cirilica"], "a": "Glagoljica", "b": "Ćirilica", "pitanje": "Na koje pismo se odnosi tvrdnja?", "tvrdnje": [{"tekst": "Sastavio ju je Ćirilo (Konstantin).", "odgovor": "a", "zasto": "Ćirilo je sastavio glagoljicu; ćirilica je nastala kasnije."}, {"tekst": "Prostija je i lakša.", "odgovor": "b", "zasto": "Usavršavanjem je nastala ćirilica, prostija od glagoljice."}, {"tekst": "Koriste je danas, sa izmenama, Srbi, Makedonci, Bugari i Rusi.", "odgovor": "b", "zasto": "To važi za ćirilicu."}, {"tekst": "To je slovensko pismo.", "odgovor": "oba", "zasto": "Lekcija ih navodi kao prva slovenska pisma."}, {"tekst": "Koristili su ga stari Grci u Herodotovo doba.", "odgovor": "nijedan", "zasto": "Oba pisma nastaju u IX veku i kasnije, za Slovene."}], "pomoc": ["Koje je pismo starije?", "Jedno i danas svako od nas koristi.", "Iz lekcije: glagoljica je prva, a ćirilica prostija i lakša."], "objasnjenje": "Glagoljica je prvo pismo, a ćirilica njegova prostija, lakša naslednica u delu misionara.", "iz_udzbenika": {"strana": 21, "odeljak": "Pokrštavanje Južnih Slovena", "tekst": "Ćirilo je sastavio glagoljicu, a misionari su stvorili ćirilicu, prostiju i lakšu."}, "lekcija": 3}, {"id": "l03-braca-ucenici-uporedi", "vrsta": "uporedi", "tezina": "srednje", "pojmovi": ["cirilo-i-metodije", "kliment-i-naum"], "a": "Ćirilo i Metodije", "b": "Kliment i Naum", "pitanje": "Na koga se odnosi tvrdnja?", "tvrdnje": [{"tekst": "Poslao ih je vizantijski car u Moravsku.", "odgovor": "a", "zasto": "Car je poslao braću; učenici dolaze na Balkan posle progona."}, {"tekst": "Propovedali su među makedonskim Slovenima i Bugarima.", "odgovor": "b", "zasto": "To lekcija kaže za Klimenta i Nauma."}, {"tekst": "Širili su hrišćanstvo među Slovenima.", "odgovor": "oba", "zasto": "I braća i učenici bili su misionari."}, {"tekst": "Sastavljena je glagoljica.", "odgovor": "a", "zasto": "Glagoljica je delo Ćirila."}, {"tekst": "Proterani su iz Moravske posle smrti učitelja.", "odgovor": "b", "zasto": "Proterani su učenici, a braća su tada već bila mrtva."}, {"tekst": "Bili su bugarski kanovi.", "odgovor": "nijedan", "zasto": "Svi su bili verski radnici; kan je bio Asparuh."}], "pomoc": ["Prvo vreme: IX vek u Moravskoj; drugo: na Balkanu.", "Ko je kome učitelj?", "Iz lekcije: braća u Moravskoj, učenici među makedonskim Slovenima i Bugarima."], "objasnjenje": "Braća započinju delo u Moravskoj, a učenici ga nastavljaju na Balkanu.", "iz_udzbenika": {"strana": 21, "odeljak": "Pokrštavanje Južnih Slovena", "tekst": "Braća rade u Moravskoj, a njihovi učenici Kliment i Naum, posle progona, na Balkanu."}, "lekcija": 3}, {"id": "l03-franacka-vizantija-uporedi", "vrsta": "uporedi", "tezina": "tesko", "pojmovi": ["pokrstavanje", "vizantija", "veliki-raskol"], "a": "Franačka", "b": "Vizantija", "pitanje": "Na kog suseda Južnih Slovena se odnosi tvrdnja?", "tvrdnje": [{"tekst": "Bila je moćan hrišćanski sused.", "odgovor": "oba", "zasto": "Lekcija obe navodi kao moćne hrišćanske susede."}, {"tekst": "Nalazila se zapadno od Južnih Slovena.", "odgovor": "a", "zasto": "Franačka je zapadni sused."}, {"tekst": "Njen car je poslao Ćirila i Metodija u Moravsku.", "odgovor": "b", "zasto": "Misionare je poslao vizantijski car."}, {"tekst": "Bila je u blizini Karantanskih Slovena, prvih hrišćana među Južnim Slovenima.", "odgovor": "a", "zasto": "Karantanci su na zapadu, u današnjoj Sloveniji, uz franački prostor."}, {"tekst": "Bila je u blizini Srba i Bugara, koji će pripasti pravoslavnoj crkvi.", "odgovor": "b", "zasto": "Srbi i Bugari su bili uz Vizantiju na istoku."}, {"tekst": "Njena vojska je u IX veku proterala učenike iz Soluna.", "odgovor": "nijedan", "zasto": "Učenici su proterani iz Moravske, i to pod pritiskom nemačkog sveštenstva, a ne vojske."}], "pomoc": ["Prvo odredi gde je koja država.", "Seti se ko je poslao braću.", "Iz lekcije: Franačka na zapadu, Vizantija na istoku; vera je dolazila sa obe strane."], "objasnjenje": "Dva suseda su dve strane hrišćanskog uticaja, a kasnija podela ih samo potvrđuje.", "iz_udzbenika": {"strana": 21, "odeljak": "Pokrštavanje Južnih Slovena", "tekst": "Moćni hrišćanski susedi bili su Franačka na zapadu i Vizantija na istoku, pa je vera dolazila sa obe strane."}, "lekcija": 3}, {"id": "l03-cirilo-ko-sam", "vrsta": "ko_sam", "tezina": "lako", "pojmovi": ["cirilo-i-metodije", "glagoljica"], "tragovi": ["Poticao sam iz okoline Soluna i znao sam slovenski jezik.", "Zovu me i Konstantin.", "Sastavio sam glagoljicu."], "odgovori": [{"tekst": "Ćirilo", "tacan": true}, {"tekst": "Metodije", "tacan": false, "zasto": "Metodije je brat i saradnik, ali glagoljicu je sastavio Ćirilo."}, {"tekst": "Naum", "tacan": false, "zasto": "Naum je učenik koji je kasnije radio među makedonskim Slovenima i Bugarima."}], "objasnjenje": "To je Ćirilo (Konstantin), tvorac prvog slovenskog pisma.", "iz_udzbenika": {"strana": 21, "odeljak": "Pokrštavanje Južnih Slovena", "tekst": "Ćirilo (Konstantin) je sastavio prvo slovensko pismo, glagoljicu.", "slika": "03-doseljavanje-srba-na-balkan/04-cirilo-i-metodije.jpg"}, "osa": {"naziv": "Misija Ćirila i Metodija", "od": 863, "do": 885, "traka": "crkva-kultura"}, "lekcija": 3}, {"id": "l03-kliment-naum-ko-sam", "vrsta": "ko_sam", "tezina": "srednje", "pojmovi": ["kliment-i-naum", "cirilica"], "tragovi": ["Učili smo od dvojice braće iz okoline Soluna.", "Proterani smo iz Moravske.", "Propovedali smo među makedonskim Slovenima i Bugarima."], "odgovori": [{"tekst": "Kliment i Naum", "tacan": true}, {"tekst": "Ćirilo i Metodije", "tacan": false, "zasto": "Oni su učitelji, a ne proterani učenici."}, {"tekst": "Perun i Svetovid", "tacan": false, "zasto": "To su imena slovenskog vrhovnog boga, a ne propovednika hrišćanstva."}], "objasnjenje": "To su Kliment i Naum, najpoznatiji učenici Ćirila i Metodija.", "iz_udzbenika": {"strana": 21, "odeljak": "Pokrštavanje Južnih Slovena", "tekst": "Najpoznatiji učenici su Kliment i Naum, koji propovedaju među makedonskim Slovenima i Bugarima."}, "osa": {"naziv": "Rad Klimenta i Nauma", "od": 885, "do": 915, "oznaka": "kraj IX i početak X veka", "traka": "crkva-kultura"}, "lekcija": 3}, {"id": "l03-hristijanizacija-objasni", "vrsta": "objasni", "tezina": "lako", "pojmovi": ["hristijanizacija", "pokrstavanje"], "pitanje": "Opiši hristijanizaciju Slovena: odakle je vera dolazila i ko ju je prvi primao?", "uzor": "Sloveni su hrišćanstvo prvo upoznali preko starosedelaca, a vera je dolazila i od Franačke, Vizantije i dalmatinskih gradova. U IX veku učvrstili su je Ćirilo, Metodije i njihovi učenici. Najpre su je primali članovi vladarskih porodica, a posle ostali narod.", "ideje": ["Prvo preko starosedelaca.", "Vera dolazi od Franačke, Vizantije i dalmatinskih gradova.", "Učvršćuje se u IX veku, radom braće i učenika.", "Prvo je primaju vladarske porodice, pa narod."], "objasnjenje": "Dobar odgovor navodi puteve, vreme i redosled primanja vere.", "iz_udzbenika": {"strana": 22, "odeljak": "Pitanja za razmišljanje / Zadaci iz udžbenika", "tekst": "Udžbenik traži da opišeš hristijanizaciju Slovena."}, "osa": {"naziv": "Učvršćivanje hrišćanstva kod Južnih Slovena", "od": 800, "do": 900, "oznaka": "IX vek", "traka": "crkva-kultura"}, "lekcija": 3}, {"id": "l03-glagoljica-znacaj-objasni", "vrsta": "objasni", "tezina": "srednje", "pojmovi": ["glagoljica", "cirilica", "cirilo-i-metodije"], "pitanje": "Zašto kažemo da pokrštavanje i opismenjavanje Slovena dugujemo Ćirilu, Metodiju i njihovim učenicima? Objasni.", "uzor": "Pre njih Sloveni nisu imali pismo. Ćirilo je sastavio glagoljicu, braća su prevela najvažnije verske knjige na slovenski, a učenici su, posle progona iz Moravske, rad nastavili na Balkanu i stvorili prostiju ćirilicu. Vera i pismenost širili su se zajedno.", "ideje": ["Pre njih Sloveni nisu imali pismo.", "Glagoljica i prevodi verskih knjiga.", "Učenici nastavljaju rad na Balkanu.", "Ćirilica je prostija i lakša."], "objasnjenje": "Važna je veza: vera traži knjige, a knjige pismo.", "iz_udzbenika": {"strana": 22, "odeljak": "Zapamtite", "tekst": "Pokrštavanje i opismenjavanje dugujemo braći Ćirilu i Metodiju i njihovim učenicima."}, "lekcija": 3}, {"id": "l03-raskol-znacaj-objasni", "vrsta": "objasni", "tezina": "tesko", "pojmovi": ["veliki-raskol", "hristijanizacija"], "pitanje": "Zašto je Veliki raskol važan za dalji razvoj Južnih Slovena, iako se desio među crkvenim vrhovima daleko od njih? Objasni.", "uzor": "Raskol je 1054. podelio crkvu na istočnu i zapadnu. Hrvati i Slovenci pripali su katoličkoj, a makedonski Sloveni, Srbi i Bugari pravoslavnoj crkvi. Tako su se narodi jednog porekla našli u dva različita verska i kulturna kruga, što je mnogo značilo za njihov dalji razvoj.", "ideje": ["Crkva je podeljena na istočnu i zapadnu.", "Hrvati i Slovenci su katolici, a Srbi, Bugari i makedonski Sloveni pravoslavni.", "Sličan narod ulazi u različite kulturne krugove.", "Podela utiče na dalji razvoj tih naroda."], "objasnjenje": "Vera je ovde mnogo više od verovanja: određuje uticaje, kulturu i pripadnost.", "iz_udzbenika": {"strana": 21, "odeljak": "Pokrštavanje Južnih Slovena", "tekst": "Raskol 1054. podelio je Južne Slovene, a ta podela je mnogo značila za dalji razvoj tih naroda."}, "osa": {"naziv": "Veliki raskol", "od": 1054, "traka": "crkva-kultura"}, "lekcija": 3}, {"id": "l03-hristijanizacija-pojam-zakljuci", "vrsta": "zakljuci", "tezina": "lako", "pojmovi": ["hristijanizacija"], "pitanje": "Pleme ostavlja stare bogove i prihvata hrišćanstvo i njegovo učenje. Kako se taj proces zove?", "odgovori": [{"tekst": "Hristijanizacija", "tacan": true}, {"tekst": "Asimilacija", "tacan": false, "zasto": "Asimilacija je stapanje manjine sa većinskim narodom; ovde se menja vera, a ne narod."}, {"tekst": "Raskol", "tacan": false, "zasto": "Raskol je podela već postojeće crkve, kao 1054."}, {"tekst": "Seoba", "tacan": false, "zasto": "Seoba je kretanje naroda sa jednog tla na drugo."}], "pomoc": ["Korak 1: Šta se u primeru menja?", "Korak 2: Od čijeg imena dolazi reč za tu veru?", "Iz lekcije: hristijanizacija je prihvatanje hrišćanstva i njegovog učenja."], "objasnjenje": "Hristijanizacija znači prihvatanje hrišćanstva i njegovog učenja.", "iz_udzbenika": {"strana": 21, "odeljak": "Pokrštavanje Južnih Slovena", "tekst": "Hristijanizacija je prihvatanje hrišćanstva i njegovog učenja."}, "lekcija": 3}, {"id": "l03-knez-i-narod-izbor", "vrsta": "izbor", "tezina": "tesko", "pojmovi": ["hristijanizacija", "perun", "pokrstavanje"], "pitanje": "Zamisli slovenskog kneza koji je primio hrišćanstvo, dok mu seljaci još prinose žrtve Perunu. Šta to pokazuje o pokrštavanju?", "odgovori": [{"tekst": "Bilo je postepen proces: najpre vladarske porodice, a narod kasnije", "tacan": true}, {"tekst": "Knez nije pravi hrišćanin, jer hrišćanstvo nema veze sa politikom", "tacan": false, "zasto": "Pokrštavanje je bilo i politički čin, pa se upravo vladari prvi odlučuju na njega."}, {"tekst": "Seljaci su zapravo Avari", "tacan": false, "zasto": "Perun je vrhovni bog Slovena, pa su to slovenski mnogobošci koji se postepeno odriču stare vere."}, {"tekst": "Takvo stanje je nemoguće, jer svi primaju veru u istom trenutku", "tacan": false, "zasto": "Sloveni su mnogoboštvo ostavljali postepeno, pa je razlika između vladara i naroda očekivana."}], "pomoc": ["Ko je u novoj veri prvi?", "Da li su se Sloveni odjednom odrekli starih bogova?", "Iz lekcije: Sloveni su postepeno ostavljali mnogoboštvo; najpre vladarske porodice, a posle ostali narod."], "objasnjenje": "Vera se širi odozgo nadole i polako, pa stari bogovi i nova vera neko vreme žive jedno pored drugog.", "iz_udzbenika": {"strana": 22, "odeljak": "Pokrštavanje Južnih Slovena", "tekst": "Sloveni su postepeno ostavljali mnogoboštvo; hrišćanstvo su najpre primali članovi vladarskih porodica, a posle narod."}, "lekcija": 3}, {"id": "l03-uzroci-cele-lekcije-povezi", "vrsta": "povezi", "tezina": "tesko", "pojmovi": ["plemenski-savezi", "asimilacija", "leh", "kliment-i-naum", "vizantija"], "pitanje": "Poveži uzrok sa njegovom posledicom iz cele lekcije.", "parovi": [["Ratovi Vizantije na drugim stranama", "Upadi do Trakije, Tesalije i Epira"], ["Ratovi sa Vizantijom i Francima", "Stvaranje plemenskih saveza"], ["Naseljavanje Slovena", "Potiskivanje i asimilacija starosedelaca"], ["Poraz na Lehu", "Kraj mađarskog prodora na zapad"], ["Prevlast nemačkog sveštenstva u Moravskoj", "Prelazak učenika na Balkan"]], "pomoc": ["Prati ko u svakom paru gubi, a ko dobija.", "Dva para počinju ratovima: ko je tu oslabljen, a ko se udružuje?", "Iz lekcije: svaki par je jedan red iz niza uzrok → posledica."], "objasnjenje": "Lekcija je niz uzroka i posledica: slabost carstva, pritisak ratova, naseljavanje, poraz i progon menjaju Balkan.", "iz_udzbenika": {"strana": 22, "odeljak": "Uzrok → posledica", "tekst": "Iz cele lekcije: slabost Vizantije, ratovi, naseljavanje, Leh i progon učenika imaju jasne posledice."}, "lekcija": 3}, {"id": "l03-rastislav-ko-sam", "vrsta": "ko_sam", "tezina": "tesko", "pojmovi": ["rastislav", "velikomoravska-knezevina", "misionar"], "tragovi": ["Bio sam slovenski knez, ali ne na Balkanu.", "Moju kneževinu će početkom X veka pokoriti Mađari.", "Zatražio sam od vizantijskog cara da mi pošalje misionare."], "odgovori": [{"tekst": "Rastislav", "tacan": true}, {"tekst": "Oton I", "tacan": false, "zasto": "Oton I je nemački vladar koji se borio protiv Mađara i nije slovenski knez."}, {"tekst": "Asparuh", "tacan": false, "zasto": "Asparuh je bugarski kan, a ne moravski knez koji poziva misionare."}, {"tekst": "Metodije", "tacan": false, "zasto": "Metodije je misionar kog je knez pozvao, a ne knez."}], "objasnjenje": "To je knez Rastislav, vladar Velikomoravske kneževine, na čiji poziv su došli Ćirilo i Metodije.", "iz_udzbenika": {"strana": 21, "odeljak": "Pokrštavanje Južnih Slovena", "tekst": "Vizantijski car je poslao braću u Velikomoravsku, na poziv kneza Rastislava."}, "lekcija": 3}]}, {"naslov": "4. Prve srpske države", "zadaci": [{"id": "l04-glavni-izvor-izbor", "vrsta": "izbor", "tezina": "lako", "pojmovi": ["konstantin-vii-porfirogenit", "doseljavanje-srba", "spis-o-narodima"], "pitanje": "Ko je ostavio glavni izvor o naseljavanju Srba na Balkanu?", "odgovori": [{"tekst": "Vizantijski car Konstantin VII Porfirogenit", "tacan": true}, {"tekst": "Bugarski car Simeon", "tacan": false, "zasto": "Simeon je vladar koji je ratovao protiv Srba; izvor je napisao vizantijski car."}, {"tekst": "Papa Grgur VII", "tacan": false, "zasto": "Papa Grgur VII vezuje se za krunu kralja Mihaila 1077, a ne za pisanje o doseljavanju."}, {"tekst": "Knez Vlastimir", "tacan": false, "zasto": "Vlastimir je srpski vladar o kome izvor piše, a ne pisac izvora."}], "pomoc": ["Pisac je car iz X veka.", "Delo je napisao za svog naslednika.", "Iz lekcije: glavni izvor dao je car Konstantin VII Porfirogenit."], "objasnjenje": "Glavni izvor o srpskom naseljavanju je delo vizantijskog cara Konstantina VII Porfirogenita, pisano za njegovog naslednika.", "iz_udzbenika": {"strana": 23, "odeljak": "Prve srpske države", "tekst": "Glavni izvor o teritorijama srpskog naseljavanja dao je car Konstantin VII Porfirogenit (913–959), u delu za svog naslednika."}, "osa": {"naziv": "Vladavina Konstantina VII Porfirogenita", "od": 913, "do": 959, "traka": "vladari"}, "lekcija": 4}, {"id": "l04-iraklije-izbor", "vrsta": "izbor", "tezina": "lako", "pojmovi": ["car-iraklije", "doseljavanje-srba"], "pitanje": "Za vreme kog cara su, po Porfirogenitu, Srbi stigli na Balkan?", "odgovori": [{"tekst": "Cara Iraklija", "tacan": true}, {"tekst": "Cara Simeona", "tacan": false, "zasto": "Simeon je bugarski car iz X veka, a Srbi su stigli u VII veku."}, {"tekst": "Konstantina VII Porfirogenita", "tacan": false, "zasto": "On je pisac izvora, koji živi tri veka posle doseljavanja."}, {"tekst": "Cara Samuila", "tacan": false, "zasto": "Samuilo je vladar sa kraja X veka, kome se potčinio Jovan Vladimir."}], "pomoc": ["Traži vizantijskog cara iz VII veka.", "Vladao je 610–641.", "Iz lekcije: Srbi su stigli za vladavine cara Iraklija, sa carevim pristankom."], "objasnjenje": "Po Porfirogenitu, Srbi su stigli za vladavine cara Iraklija (610–641) i sa njegovim pristankom.", "iz_udzbenika": {"strana": 23, "odeljak": "Prve srpske države", "tekst": "Po ovom izvoru Srbi su stigli za vladavine cara Iraklija (610–641), sa carevim pristankom."}, "osa": {"naziv": "Vladavina cara Iraklija", "od": 610, "do": 641, "traka": "vladari"}, "lekcija": 4}, {"id": "l04-prostor-izbor", "vrsta": "izbor", "tezina": "lako", "pojmovi": ["doseljavanje-srba", "avari"], "pitanje": "Koji prostor su Srbi dobili po Porfirogenitovom izvoru?", "odgovori": [{"tekst": "Od Save do Jadranskog mora", "tacan": true}, {"tekst": "Od Dunava do planine Balkan", "tacan": false, "zasto": "Ta zemlja se sredinom VII veka zvala Slovenska; srpski prostor izvor opisuje od Save do Jadrana."}, {"tekst": "Između Odre i Visle", "tacan": false, "zasto": "To je pradomovina Slovena, odakle su Srbi došli."}, {"tekst": "Između Urala i Kaspijskog mora", "tacan": false, "zasto": "To su Vrata naroda, kroz koja su prošli Huni."}], "pomoc": ["Južna međa je more.", "Severna međa je reka koja se kod Beograda uliva u Dunav.", "Iz lekcije: dobili su prostor od Save do Jadranskog mora."], "objasnjenje": "Srbi su dobili prostor od Save do Jadrana, koji su Avari pre toga poharali.", "iz_udzbenika": {"strana": 23, "odeljak": "Prve srpske države", "tekst": "Srbi su dobili prostor od Save do Jadranskog mora, prazan jer su ga poharali Avari."}, "lekcija": 4}, {"id": "l04-viseslav-izbor", "vrsta": "izbor", "tezina": "lako", "pojmovi": ["knez-viseslav", "raska"], "pitanje": "Ko je prvi srpski vladar u Raškoj čije ime znamo?", "odgovori": [{"tekst": "Knez Višeslav", "tacan": true}, {"tekst": "Knez Časlav", "tacan": false, "zasto": "Časlav je oslobodio Srbiju tek 927, mnogo posle prvog poznatog vladara."}, {"tekst": "Kralj Mihailo", "tacan": false, "zasto": "Mihailo je kralj Duklje iz XI veka, a ne prvi raški vladar."}, {"tekst": "Jovan Vladimir", "tacan": false, "zasto": "Jovan Vladimir je dukljanski knez, poznat sa kraja X veka."}], "pomoc": ["Ime mu je povezano sa početkom spiska raških vladara.", "Posle njega dolaze Radoslav i Prosigoj.", "Iz lekcije: knez Višeslav je prvi srpski vladar u Raški čije ime znamo."], "objasnjenje": "Višeslav je najstariji raški vladar čije nam je ime poznato.", "iz_udzbenika": {"strana": 23, "odeljak": "Prve srpske države", "tekst": "Knez Višeslav je prvi srpski vladar u Raški čije ime znamo."}, "lekcija": 4}, {"id": "l04-srpske-oblasti-izbor", "vrsta": "izbor", "tezina": "srednje", "pojmovi": ["paganija", "travunija", "bosna", "raska", "zahumlje", "duklja"], "pitanje": "Koje oblasti se u izvoru izričito navode kao srpske? (više tačnih)", "odgovori": [{"tekst": "Paganija", "tacan": true}, {"tekst": "Travunija", "tacan": true}, {"tekst": "Bosna", "tacan": true}, {"tekst": "Raška", "tacan": true}, {"tekst": "Zahumlje", "tacan": false, "zasto": "Za Zahumlje nema neposrednog podatka da je pripadalo srpskoj državi."}, {"tekst": "Panonija", "tacan": false, "zasto": "Panonija je severno, oblast Avara i kasnije Mađara, a ne srpska sklavinija."}], "pomoc": ["Lekcija navodi četiri izričito srpske oblasti.", "Za dve oblasti (Zahumlje i Duklja) nema neposrednog podatka.", "Iz lekcije: Paganija, Travunija, Bosna i Raška."], "objasnjenje": "Izričito srpske su Paganija, Travunija, Bosna i Raška; za Zahumlje i Duklju neposrednog podatka nema.", "iz_udzbenika": {"strana": 23, "odeljak": "Prve srpske države", "tekst": "Kao srpske se izričito navode Paganija, Travunija, Bosna i Raška.", "slika": "04-srbi-i-okruzenje-u-ranom-srednjem-veku/01-prve-srpske-drzave-karta.jpg"}, "lekcija": 4}, {"id": "l04-najbrojniji-izbor", "vrsta": "izbor", "tezina": "srednje", "pojmovi": ["raska", "plemenska-organizacija"], "pitanje": "Šta je tačno za Rašku u prvoj polovini IX veka?", "odgovori": [{"tekst": "U njoj je bila najbrojnija grupa srpskih plemena, a još je trajalo staro plemensko uređenje", "tacan": true}, {"tekst": "Bila je nezavisna kraljevina sa krunom od pape", "tacan": false, "zasto": "Kruna od pape vezuje se za Duklju 1077; Raška u IX veku još ima plemensko uređenje."}, {"tekst": "Bila je pod potpunom vlašću Avara", "tacan": false, "zasto": "Avari su pre dolaska Srba poharali te krajeve; Raška je Vizantiju priznavala nominalno."}, {"tekst": "Bila je sedište hrvatske države", "tacan": false, "zasto": "Hrvatska država bila je zapadni sused, a ne vlast u Raškoj."}], "pomoc": ["Seti se da prve države nastaju korak po korak.", "Po čemu se Raška izdvajala od ostalih oblasti?", "Iz lekcije: najbrojnija grupa srpskih plemena bila je u Raški, gde je trajalo staro plemensko uređenje."], "objasnjenje": "Raška je imala najviše Srba, ali je u prvoj polovini IX veka i dalje imala plemensko uređenje.", "iz_udzbenika": {"strana": 23, "odeljak": "Prve srpske države", "tekst": "Najbrojnija grupa srpskih plemena bila je u Raški, gde je i u prvoj polovini IX veka trajalo staro plemensko uređenje."}, "osa": {"naziv": "Staro plemensko uređenje u Raški", "od": 800, "do": 850, "oznaka": "prva polovina IX veka", "traka": "dogadjaji"}, "lekcija": 4}, {"id": "l04-zanimanja-izbor", "vrsta": "izbor", "tezina": "srednje", "pojmovi": ["doseljavanje-srba", "vizantija"], "pitanje": "Od čega su, po vizantijskim izvorima, živeli doseljeni Srbi? (više tačnih)", "odgovori": [{"tekst": "Od zemljoradnje", "tacan": true}, {"tekst": "Od stočarstva", "tacan": true}, {"tekst": "Od pčelarstva", "tacan": true}, {"tekst": "Od lova i ribolova", "tacan": true}, {"tekst": "Od rudarstva za izvoz srebra", "tacan": false, "zasto": "Lekcija rudarstvo ovde ne navodi; za doseljene Srbe spominje zemlju, stoku, pčele, lov i ribolov."}, {"tekst": "Od prekomorske trgovine", "tacan": false, "zasto": "Izvori navode zanimanja vezana za zemlju i prirodu, a ne prekomorsku trgovinu."}], "pomoc": ["Svi tačni odgovori su vezani za zemlju i prirodu.", "Lekcija navodi pet zanimanja.", "Iz lekcije: zemljoradnja, stočarstvo, pčelarstvo, lov i ribolov."], "objasnjenje": "Doseljeni Srbi živeli su od zemljoradnje, stočarstva, pčelarstva, lova i ribolova.", "iz_udzbenika": {"strana": 23, "odeljak": "Prve srpske države", "tekst": "Po vizantijskim izvorima doseljeni Srbi živeli su od zemljoradnje, stočarstva, pčelarstva, lova i ribolova."}, "lekcija": 4}, {"id": "l04-susedi-izbor", "vrsta": "izbor", "tezina": "srednje", "pojmovi": ["hrvatska-drzava", "madjari"], "pitanje": "Ko su bili susedi Srba na zapadu i na severu?", "odgovori": [{"tekst": "Na zapadu hrvatska, a na severu mađarska država", "tacan": true}, {"tekst": "Na zapadu mađarska, a na severu hrvatska država", "tacan": false, "zasto": "Strane su zamenjene: Hrvatska je zapadno, a Ugarska severno, što se vidi i na karti."}, {"tekst": "Na zapadu Vizantija, a na severu Bugarska", "tacan": false, "zasto": "Vizantija i Bugarska su istočno i južno; zapadni sused je Hrvatska."}, {"tekst": "Na zapadu Franačka, a na severu Avari", "tacan": false, "zasto": "Lekcija u ovom dobu navodi hrvatsku i mađarsku državu kao susede."}], "pomoc": ["Pogledaj kartu prvih srpskih država.", "Tamnija Ugarska je iznad srpskih oblasti.", "Iz lekcije: na zapadu hrvatska, na severu mađarska država."], "objasnjenje": "Na zapadu je bila hrvatska, a na severu mađarska država.", "iz_udzbenika": {"strana": 23, "odeljak": "Prve srpske države", "tekst": "Susedi su bili hrvatska država na zapadu i mađarska država na severu.", "slika": "04-srbi-i-okruzenje-u-ranom-srednjem-veku/01-prve-srpske-drzave-karta.jpg"}, "lekcija": 4}, {"id": "l04-nominalno-primena-izbor", "vrsta": "izbor", "tezina": "tesko", "pojmovi": ["nominalna-potcinjenost", "vizantija", "raska"], "pitanje": "Koji primer odgovara odnosu Raške prema Vizantiji?", "odgovori": [{"tekst": "Knez priznaje cara kao gospodara, a sam vlada svojom zemljom kako hoće", "tacan": true}, {"tekst": "Car postavlja svoje vojnike u svako selo i naplaćuje porez", "tacan": false, "zasto": "To bi bila stvarna vlast, a Raška je Vizantiju priznavala samo po formi."}, {"tekst": "Knez ne zna da carstvo postoji", "tacan": false, "zasto": "Knez zna i priznaje cara; poenta je da je to priznanje bez stvarne zavisnosti."}, {"tekst": "Knez otvoreno ratuje da sruši cara u Carigradu", "tacan": false, "zasto": "To je otvoren rat, a nominalno priznanje znači da se vlast formalno prihvata."}], "pomoc": ["„Nominalno” znači po imenu, samo na rečima.", "Da li u takvom odnosu car stvarno odlučuje?", "Iz lekcije: vlast se priznaje samo po formi, a stvarne zavisnosti nema."], "objasnjenje": "Nominalna potčinjenost je priznanje vlasti bez stvarne zavisnosti: na rečima car, a u praksi knez.", "iz_udzbenika": {"strana": 23, "odeljak": "Prve srpske države", "tekst": "Nominalna potčinjenost znači da se vlast nekog gospodara priznaje samo po formi, a stvarne zavisnosti nema."}, "lekcija": 4}, {"id": "l04-kako-znamo-izbor", "vrsta": "izbor", "tezina": "tesko", "pojmovi": ["konstantin-vii-porfirogenit", "spis-o-narodima", "doseljavanje-srba", "car-iraklije"], "pitanje": "Šta treba imati na umu kada koristimo Porfirogenitovo svedočanstvo o dolasku Srba?", "odgovori": [{"tekst": "Pisao je u X veku o događajima iz VII veka, dakle tri veka kasnije", "tacan": true}, {"tekst": "Bio je očevidac dolaska Srba", "tacan": false, "zasto": "Nije mogao biti: vladao je 913–959, a Srbi su došli pod Iraklijem (610–641)."}, {"tekst": "Bio je srpski knez koji piše o svom narodu", "tacan": false, "zasto": "Bio je vizantijski car i delo je pisao za svog naslednika."}, {"tekst": "Pisao je pre dolaska Srba, kao predviđanje", "tacan": false, "zasto": "Pisao je posle, u X veku; opisao je događaj star tri veka."}], "pomoc": ["Uporedi godine Porfirogenitove i Iraklijeve vladavine.", "Koliko vekova ih deli?", "Iz lekcije: Konstantin VII (913–959), Iraklije (610–641)."], "objasnjenje": "Glavni izvor je nastao vekovima posle događaja i potiče od vizantijskog cara, pa ga treba čitati sa tom svešću.", "iz_udzbenika": {"strana": 23, "odeljak": "Prve srpske države", "tekst": "Konstantin VII (913–959) piše o dolasku Srba za vladavine Iraklija (610–641)."}, "lekcija": 4}, {"id": "l04-vizantija-vera-tn", "vrsta": "tacno_netacno", "tezina": "lako", "pojmovi": ["hristijanizacija-srba", "vizantija"], "tvrdnja": "Većina srpskih plemena primila je hrišćanstvo preko Vizantije.", "tacno": true, "pomoc": ["Seti se koja je velika hrišćanska sila bila najbliža.", "Iz lekcije: hrišćanstvo je većina srpskih plemena primila preko Vizantije."], "objasnjenje": "Tačno. Većina srpskih plemena primila je hrišćanstvo preko Vizantije.", "iz_udzbenika": {"strana": 23, "odeljak": "Uvod", "tekst": "Hrišćanstvo je većina srpskih plemena primila preko Vizantije."}, "lekcija": 4}, {"id": "l04-plemena-ostaju-tn", "vrsta": "tacno_netacno", "tezina": "lako", "pojmovi": ["plemenska-organizacija", "pradomovina"], "tvrdnja": "Srbi su odmah po dolasku na Balkan ukinuli plemena i osnovali jednu državu.", "tacno": false, "ispravke": [{"tekst": "Ostali su podeljeni na plemena, kao u pradomovini.", "tacan": true}, {"tekst": "Prihvatili su vizantijsku upravu i razišli se po gradovima.", "tacan": false, "zasto": "Nisu menjali način organizovanja; živeli su po plemenima u svojim oblastima."}, {"tekst": "Podelili su se na dve države, Rašku i Duklju, još u pradomovini.", "tacan": false, "zasto": "Raška i Duklja su na Balkanu, a države nastaju kasnije i korak po korak."}], "pomoc": ["Da li se organizacija naroda menja preko noći?", "Traži reč „pradomovina”.", "Iz lekcije: Srbi nisu menjali način organizovanja i ostali su podeljeni na plemena."], "objasnjenje": "Netačno. Plemena su ostala, a savezi i države nastali su postepeno.", "iz_udzbenika": {"strana": 23, "odeljak": "Uvod", "tekst": "Posle naseljavanja Srbi su ostali podeljeni na plemena, kao ranije u pradomovini."}, "lekcija": 4}, {"id": "l04-cetina-tn", "vrsta": "tacno_netacno", "tezina": "lako", "pojmovi": ["reka-cetina"], "tvrdnja": "Reka Cetina bila je zapadna međa srpskih teritorija.", "tacno": true, "pomoc": ["Dodatni podatak je na str. 24.", "Iz lekcije: Cetina je bila zapadna granica Srba."], "objasnjenje": "Tačno. Cetina se navodi kao zapadna međa srpskih teritorija.", "iz_udzbenika": {"strana": 24, "odeljak": "Prve srpske države", "tekst": "Reka Cetina bila je zapadna međa srpskih teritorija."}, "lekcija": 4}, {"id": "l04-duklja-prva-tn", "vrsta": "tacno_netacno", "tezina": "lako", "pojmovi": ["duklja", "raska"], "tvrdnja": "Prva među srpskim oblastima izdvojila se Duklja, a primat je potom prešao na Rašku.", "tacno": true, "pomoc": ["Šta je sa Raškom od XII veka?", "Iz lekcije: prva se izdvojila Duklja, a primat je potom prešao na Rašku."], "objasnjenje": "Tačno. Duklja je prva, a posle nje vodeća snaga postaje Raška.", "iz_udzbenika": {"strana": 23, "odeljak": "Uvod", "tekst": "Prva među srpskim oblastima izdvojila se Duklja; primat je potom prešao na Rašku."}, "lekcija": 4}, {"id": "l04-iraklije-osvajanje-tn", "vrsta": "tacno_netacno", "tezina": "srednje", "pojmovi": ["car-iraklije", "doseljavanje-srba"], "tvrdnja": "Po Porfirogenitu, Srbi su zemlju oteli caru Irakliju u ratu.", "tacno": false, "ispravke": [{"tekst": "Stigli su sa carevim pristankom i dobili krajeve koje su Avari poharali.", "tacan": true}, {"tekst": "Kupili su je od Vizantije za zlato.", "tacan": false, "zasto": "O kupovini nema reči; izvor govori o carevom pristanku."}, {"tekst": "Dobili su je od Avara kao nagradu.", "tacan": false, "zasto": "Avari su te krajeve opustošili, a pristanak je dao car."}], "pomoc": ["Izvor piše vizantijski car, pa pazi kako prikazuje odnos cara i Srba.", "Zašto je zemlja bila prazna?", "Iz lekcije: stigli su sa carevim pristankom; prostor su pre toga poharali Avari."], "objasnjenje": "Netačno. Po izvoru su Srbi došli sa carevim pristankom, na prostor koji su opustošili Avari.", "iz_udzbenika": {"strana": 23, "odeljak": "Prve srpske države", "tekst": "Srbi su stigli sa carevim pristankom i dobili prostor koji su poharali Avari."}, "osa": {"naziv": "Vladavina cara Iraklija", "od": 610, "do": 641, "traka": "vladari"}, "lekcija": 4}, {"id": "l04-duklja-zahumlje-tn", "vrsta": "tacno_netacno", "tezina": "srednje", "pojmovi": ["zahumlje", "duklja"], "tvrdnja": "Za Zahumlje i Duklju nema neposrednog podatka da su pripadale srpskoj državi.", "tacno": true, "pomoc": ["Uporedi sa četiri izričito navedene oblasti.", "Iz lekcije: za Zahumlje i Duklju nema neposrednog podatka."], "objasnjenje": "Tačno. Izričito se kao srpske navode Paganija, Travunija, Bosna i Raška, a za ove dve oblasti neposrednog podatka nema.", "iz_udzbenika": {"strana": 23, "odeljak": "Prve srpske države", "tekst": "Za Zahumlje i Duklju nema neposrednog podatka da su pripadale srpskoj državi."}, "lekcija": 4}, {"id": "l04-caslav-madjari-tn", "vrsta": "tacno_netacno", "tezina": "srednje", "pojmovi": ["knez-caslav", "madjari"], "tvrdnja": "Knez Časlav poginuo je u borbi protiv Bugara 927. godine.", "tacno": false, "ispravke": [{"tekst": "Bugarsku vlast zbacio je 927, a poginuo je nešto kasnije u sukobu sa Mađarima.", "tacan": true}, {"tekst": "Poginuo je u borbi protiv Vizantije kod Carigrada.", "tacan": false, "zasto": "Časlav je poginuo u sukobu sa Mađarima, a ne sa Vizantijom."}, {"tekst": "Umro je u dubokoj starosti kao kralj Duklje.", "tacan": false, "zasto": "Bio je knez u Srbiji, a dukljanski kralj je Mihailo, tek 1077."}], "pomoc": ["Godine 927. Časlav je pobedio, a nije izgubio.", "Ko je bio severni sused?", "Iz lekcije: 927. je zbacio bugarsku vlast; poginuo je kasnije u sukobu sa Mađarima."], "objasnjenje": "Netačno. Časlav je 927. oslobodio Srbiju, a poginuo je kasnije u sukobu sa Mađarima.", "iz_udzbenika": {"strana": 24, "odeljak": "Prve srpske države", "tekst": "Bugarsku vlast zbacio je knez Časlav 927; poginuo je nešto kasnije u sukobu sa Mađarima."}, "osa": {"naziv": "Časlav zbacuje bugarsku vlast", "od": 927, "traka": "dogadjaji"}, "lekcija": 4}, {"id": "l04-bugarske-granice-tn", "vrsta": "tacno_netacno", "tezina": "tesko", "pojmovi": ["ekspanzija", "bugari", "carigrad"], "tvrdnja": "Bugarska ekspanzija bila je opasna samo za Srbe, jer Bugari nikada nisu ugrozili Vizantiju.", "tacno": false, "ispravke": [{"tekst": "Bugari su u svojim napadima dopirali sve do Carigrada, pa su ugrožavali i Vizantiju.", "tacan": true}, {"tekst": "Bugari su ratovali samo protiv Mađara.", "tacan": false, "zasto": "Lekcija navodi njihove ratove sa Srbima i napade do Carigrada."}, {"tekst": "Bugari su se uvek povlačili pred Srbima i nikada ih nisu pokorili.", "tacan": false, "zasto": "Pod Simeonom je Srbija privremeno pala pod bugarsku vlast (924)."}], "pomoc": ["Pronađi dokle su stizali bugarski napadi.", "Carigrad je bio prestonica Vizantije.", "Iz lekcije: Bugari su dopirali sve do Carigrada."], "objasnjenje": "Netačno. Bugarski napadi dopirali su do Carigrada, pa je ekspanzija ugrožavala i carstvo.", "iz_udzbenika": {"strana": 24, "odeljak": "Prve srpske države", "tekst": "U IX veku i prvim decenijama X veka Bugari su bili u ekspanziji i u napadima dopirali do Carigrada."}, "osa": {"naziv": "Bugarska ekspanzija", "od": 800, "do": 930, "oznaka": "IX vek i prve decenije X veka", "traka": "dogadjaji"}, "lekcija": 4}, {"id": "l04-oblasti-dopuni", "vrsta": "dopuni", "tezina": "lako", "pojmovi": ["sklavinije", "raska", "doseljavanje-srba"], "pitanje": "Dopuni rečenicu.", "tekst": "Srbi su, kao i druga južnoslovenska plemena, osnovali plemenske oblasti, koje se zovu {{sklavinije}}, a najbrojnija grupa bila je u {{Raškoj}}.", "ponudjene": ["sklavinije", "Raškoj", "Panoniji", "ekspanzije"], "pomoc": ["Prva reč je vizantijski naziv.", "Panonija nije srpska oblast.", "Iz lekcije: sklavinije; najbrojnija grupa u Raški."], "objasnjenje": "Srpske plemenske oblasti su sklavinije, a najviše Srba bilo je u Raškoj.", "iz_udzbenika": {"strana": 23, "odeljak": "Prve srpske države", "tekst": "Srbi su osnovali sklavinije, a najbrojnija grupa bila je u Raški."}, "lekcija": 4}, {"id": "l04-simeon-caslav-dopuni", "vrsta": "dopuni", "tezina": "lako", "pojmovi": ["car-simeon", "knez-caslav", "bugari"], "pitanje": "Dopuni rečenice.", "tekst": "Bugarski car {{Simeon}} privremeno je pokorio Srbiju 924, a knez {{Časlav}} je zbacio bugarsku vlast {{927}}.", "ponudjene": ["Simeon", "Samuilo", "Časlav", "Vlastimir", "927", "1077"], "pomoc": ["Samuilo i 1077. pripadaju kasnijem dobu.", "Oslobođenje je samo tri godine posle pokoravanja.", "Iz lekcije: Simeon 924; Časlav 927."], "objasnjenje": "Simeonova vlast nad Srbijom trajala je kratko: od 924. do 927.", "iz_udzbenika": {"strana": 24, "odeljak": "Prve srpske države", "tekst": "Pod Simeonom Srbija je došla pod bugarsku vlast 924, a 927. ju je zbacio knez Časlav."}, "lekcija": 4}, {"id": "l04-pojmovi-dopuni", "vrsta": "dopuni", "tezina": "srednje", "pojmovi": ["nominalna-potcinjenost", "ekspanzija"], "pitanje": "Dopuni objašnjenja pojmova.", "tekst": "Nominalna potčinjenost znači da se vlast priznaje samo po {{formi}}, a {{ekspanzija}} znači širenje, povećavanje obima ili teritorije.", "ponudjene": ["formi", "sili", "ekspanzija", "asimilacija"], "pomoc": ["Prva reč je suprotnost stvarnoj zavisnosti.", "Asimilacija je stapanje naroda, a ne širenje.", "Iz lekcije: nominalna potčinjenost je po formi; ekspanzija je širenje."], "objasnjenje": "Nominalno znači samo po formi; ekspanzija je širenje teritorije ili obima.", "iz_udzbenika": {"strana": 23, "odeljak": "Prve srpske države", "tekst": "Nominalna potčinjenost je priznanje vlasti samo po formi, a ekspanzija je širenje."}, "lekcija": 4}, {"id": "l04-avari-dopuni", "vrsta": "dopuni", "tezina": "srednje", "pojmovi": ["car-iraklije", "avari"], "pitanje": "Dopuni rečenicu o dolasku Srba.", "tekst": "Za vladavine cara {{Iraklija}} Srbi dobijaju prostor od {{Save}} do Jadranskog mora, koji su ranije opustošili {{Avari}}.", "ponudjene": ["Iraklija", "Justinijana", "Save", "Dunava", "Avari", "Mađari"], "pomoc": ["Justinijan vlada u VI veku, a Srbi stižu u VII.", "Mađari dolaze tek krajem IX veka.", "Iz lekcije: Iraklije, od Save do Jadrana, Avari."], "objasnjenje": "Srbi dolaze pod Iraklijem na krajeve koje su opustošili Avari.", "iz_udzbenika": {"strana": 23, "odeljak": "Prve srpske države", "tekst": "Srbi su pod Iraklijem dobili prostor od Save do Jadranskog mora, prazan zbog avarskih pustošenja."}, "lekcija": 4}, {"id": "l04-raska-reke-dopuni", "vrsta": "dopuni", "tezina": "tesko", "pojmovi": ["raska", "nominalna-potcinjenost", "vizantija"], "pitanje": "Dopuni bez ponuđenih reči.", "tekst": "Najbrojnija grupa srpskih plemena bila je u {{Raškoj|Raški}}, koja je {{Vizantiju}} priznavala samo {{nominalno|po formi}}, a kroz koju teku reke Piva, Tara i {{Ibar}}.", "pomoc": ["Treća praznina je reč za priznanje samo po formi.", "Četvrta je reka koja se u lekciji navodi uz Pivu i Taru.", "Iz lekcije: Raška, nominalno priznanje Vizantije, reke Piva, Tara, Ibar."], "objasnjenje": "Raška je imala najviše Srba, a carstvo je priznavala samo po formi.", "iz_udzbenika": {"strana": 23, "odeljak": "Prve srpske države", "tekst": "Raška se prostirala među rekama Pivom, Tarom i Ibrom i Vizantiju je priznavala samo nominalno."}, "lekcija": 4}, {"id": "l04-vladari-povezi", "vrsta": "povezi", "tezina": "lako", "pojmovi": ["knez-viseslav", "knez-vlastimir", "car-simeon", "knez-caslav"], "pitanje": "Poveži vladara sa podatkom.", "parovi": [["Višeslav", "Prvi raški vladar čije ime znamo"], ["Vlastimir", "Uspešno je odbijao bugarske napade"], ["Simeon", "Bugarski car koji je pokorio Srbiju"], ["Časlav", "Zbacio je bugarsku vlast 927."]], "pomoc": ["Jedan vladar nije srpski.", "Oslobodilac dolazi posle pokoritelja.", "Iz lekcije: Višeslav prvi poznat, Vlastimir odbija Bugare, Simeon pokorava, Časlav oslobađa."], "objasnjenje": "Prati tok: Višeslav prvi poznat, Vlastimir odbija Bugare, Simeon pokorava Srbiju, a Časlav je oslobađa.", "iz_udzbenika": {"strana": 24, "odeljak": "Prve srpske države", "tekst": "Lekcija opisuje Višeslava, Vlastimira, Simeona i Časlava."}, "lekcija": 4}, {"id": "l04-pojmovi-povezi", "vrsta": "povezi", "tezina": "srednje", "pojmovi": ["nominalna-potcinjenost", "ekspanzija", "sklavinije", "pradomovina", "reka-cetina"], "pitanje": "Poveži pojam sa objašnjenjem.", "parovi": [["Nominalna potčinjenost", "Priznanje vlasti samo po formi"], ["Ekspanzija", "Širenje teritorije ili obima"], ["Sklavinije", "Slovenske plemenske oblasti"], ["Pradomovina", "Zemlja iz koje su Sloveni došli"], ["Cetina", "Zapadna međa srpskih teritorija"]], "pomoc": ["Jedan pojam je reka.", "Nominalno znači samo po imenu.", "Iz lekcije: nominalna potčinjenost, ekspanzija, sklavinije."], "objasnjenje": "Ovi pojmovi su ključ lekcije: kako su Srbi bili organizovani i u kakvom odnosu sa susedima.", "iz_udzbenika": {"strana": 23, "odeljak": "Prve srpske države", "tekst": "Lekcija objašnjava nominalnu potčinjenost i ekspanziju, sklavinije i međe srpskih oblasti."}, "lekcija": 4}, {"id": "l04-uzroci-povezi", "vrsta": "povezi", "tezina": "tesko", "pojmovi": ["avari", "car-simeon", "knez-caslav", "plemenski-savezi"], "pitanje": "Poveži uzrok sa posledicom.", "parovi": [["Avari pustoše krajeve između Save i Jadrana", "Car Iraklije ih prepušta Srbima"], ["Plemenske celine se povezuju", "Nastaju savezi i prve države"], ["Bugarska ekspanzija pod Simeonom", "Srbija pada pod bugarsku vlast"], ["Časlavova akcija 927.", "Kraj bugarske vlasti"]], "pomoc": ["Svaki uzrok je iz drugog veka ili teme.", "Prati jednu nit: Avari, plemena, Bugari.", "Iz lekcije: Avari → prazna zemlja; povezivanje → države; Simeon → 924; Časlav → 927."], "objasnjenje": "Prazna zemlja omogućava naseljavanje, povezivanje plemena stvara države, a bugarski pritisak i otpor određuju X vek.", "iz_udzbenika": {"strana": 24, "odeljak": "Prve srpske države", "tekst": "Lekcija povezuje pustošenje Avara, povezivanje plemena, bugarsku ekspanziju i Časlavovo oslobođenje."}, "lekcija": 4}, {"id": "l04-prazna-zemlja-zakljuci", "vrsta": "zakljuci", "tezina": "lako", "pojmovi": ["avari", "doseljavanje-srba"], "pitanje": "Zašto je prostor od Save do Jadrana bio slobodan za Srbe?", "odgovori": [{"tekst": "Avari su ga pre toga poharali i opustošili", "tacan": true}, {"tekst": "Bio je pod vodom i tek se osušio", "tacan": false, "zasto": "Prostor je bio prazan zbog pustošenja, a ne zbog prirode."}, {"tekst": "Svi tamošnji stanovnici otišli su u Aziju", "tacan": false, "zasto": "Izvor kaže da su ga poharali Avari, a ne da su ljudi otišli u Aziju."}, {"tekst": "Mađari su ga već napustili", "tacan": false, "zasto": "Mađari dolaze tek krajem IX veka, kada su Srbi već odavno tamo."}], "pomoc": ["Korak 1: Ko je tu bio pre Srba i šta je radio?", "Korak 2: Šta ostaje iza pustošenja?", "Iz lekcije: prostor je bio prazan jer su ga pre toga poharali Avari."], "objasnjenje": "Avari su opustošili te krajeve, pa je car mogao da ih prepusti Srbima.", "iz_udzbenika": {"strana": 23, "odeljak": "Prve srpske države", "tekst": "Prostor od Save do Jadrana bio je prazan jer su ga poharali Avari."}, "lekcija": 4}, {"id": "l04-carev-pristanak-zakljuci", "vrsta": "zakljuci", "tezina": "srednje", "pojmovi": ["car-iraklije", "vizantija", "doseljavanje-srba"], "pitanje": "Zašto bi vizantijski car dozvolio Srbima da se nasele na pustoj zemlji?", "odgovori": [{"tekst": "Prazan kraj nije donosio ništa carstvu, a naseljenici koji priznaju cara su bolji od pustoši i Avara", "tacan": true}, {"tekst": "Zato što su Srbi već bili pravoslavni", "tacan": false, "zasto": "Hrišćanstvo Srbi primaju kasnije, preko Vizantije; raskola 1054. još nema."}, {"tekst": "Zato što je Irakliju ta zemlja bila potpuno nepoznata", "tacan": false, "zasto": "Bila je vizantijska, inače car ne bi ni davao pristanak."}, {"tekst": "Zato što je time hteo da osnuje srpsku kraljevinu", "tacan": false, "zasto": "Kraljevina se javlja tek u Duklji 1077; Srbi su živeli u plemenima."}], "pomoc": ["Korak 1: Šta se desi sa zemljom koju su pregazili Avari?", "Korak 2: Šta caru donosi naseljen kraj, makar nominalno pod njim?", "Iz lekcije: car je dao pristanak, a zemlja je bila opustošena; Srbi su Vizantiju priznavali."], "objasnjenje": "Za cara je naseljen kraj sa nominalno potčinjenim stanovništvom bolji od pustoši izložene Avarima.", "iz_udzbenika": {"strana": 23, "odeljak": "Prve srpske države", "tekst": "Sa carevim pristankom Srbi su dobili opustošeni prostor i formalno priznavali Vizantiju."}, "lekcija": 4}, {"id": "l04-malo-znamo-zakljuci", "vrsta": "zakljuci", "tezina": "srednje", "pojmovi": ["knez-viseslav", "knez-vlastimir"], "pitanje": "Zašto o Višeslavu znamo gotovo samo ime, a o Vlastimiru mnogo više?", "odgovori": [{"tekst": "Podaci o srpskoj istoriji postaju bogatiji tek od Vlastimirovog doba", "tacan": true}, {"tekst": "Višeslav je vladao samo jedan dan", "tacan": false, "zasto": "O dužini vladavine lekcija ništa ne kaže; razlika je u izvorima."}, {"tekst": "Višeslav je bio bugarski, a ne srpski vladar", "tacan": false, "zasto": "Lekcija ga izričito zove prvim srpskim vladarom u Raški."}, {"tekst": "Vlastimir je sam napisao svoju biografiju", "tacan": false, "zasto": "Podatke imamo iz stranih izvora, poput Porfirogenitovog."}], "pomoc": ["Korak 1: Od čega zavisi šta znamo o prošlosti?", "Korak 2: Od koga podaci postaju bogatiji?", "Iz lekcije: o tom razdoblju se malo zna; podaci postaju bogatiji tek uz kneza Vlastimira."], "objasnjenje": "Znanje o prošlosti zavisi od izvora: što su kasniji, to su bogatiji.", "iz_udzbenika": {"strana": 23, "odeljak": "Prve srpske države", "tekst": "O tom razdoblju se malo zna; podaci postaju bogatiji tek uz kneza Vlastimira."}, "lekcija": 4}, {"id": "l04-simeon-caslav-godine-zakljuci", "vrsta": "zakljuci", "tezina": "srednje", "pojmovi": ["car-simeon", "knez-caslav"], "pitanje": "Uporedi godine Simeonove vladavine (893–927) i Časlavovog oslobođenja (927). Šta uočavaš?", "odgovori": [{"tekst": "Bugarska vlast je zbačena iste godine kada se završava Simeonova vladavina", "tacan": true}, {"tekst": "Časlav je oslobodio Srbiju dok je Simeon bio dete", "tacan": false, "zasto": "Simeon je 927. završio vladavinu dugu više od tri decenije."}, {"tekst": "Simeon je vladao tek posle Časlava", "tacan": false, "zasto": "Simeon je počeo da vlada 893, davno pre 927."}, {"tekst": "Između ta dva događaja proteklo je sto godina", "tacan": false, "zasto": "Obe godine su iste: 927."}], "pomoc": ["Korak 1: Koja je poslednja godina Simeonove vladavine?", "Korak 2: Uporedi je sa godinom oslobođenja.", "Iz lekcije: Simeon 893–927; Časlav 927."], "objasnjenje": "Obe godine se poklapaju: bugarska vlast nad Srbijom pada iste godine kada Simeonova vladavina prestaje.", "iz_udzbenika": {"strana": 24, "odeljak": "Prve srpske države", "tekst": "Simeon je vladao 893–927, a Časlav je bugarsku vlast zbacio 927."}, "osa": {"naziv": "Časlav zbacuje bugarsku vlast", "od": 927, "traka": "dogadjaji"}, "lekcija": 4}, {"id": "l04-sklavinija-do-drzave-zakljuci", "vrsta": "zakljuci", "tezina": "tesko", "pojmovi": ["plemenska-organizacija", "plemenski-savezi", "sklavinije"], "pitanje": "Zašto lekcija kaže da su savezi i države nastajali „korak po korak”, a ne odjednom?", "odgovori": [{"tekst": "Veza među plemenskim celinama bila je negde čvršća, a negde labavija, pa se povezivanje dešavalo postepeno i nejednako", "tacan": true}, {"tekst": "Zato što je Vizantija propisala tačan datum osnivanja država", "tacan": false, "zasto": "Vizantija je Srbima bila samo nominalni gospodar; nije im propisivala kako da se organizuju."}, {"tekst": "Zato što se plemena nisu poznavala", "tacan": false, "zasto": "Bila su povezana, samo različito snažno."}, {"tekst": "Zato što su Srbi čekali dolazak Ćirila i Metodija", "tacan": false, "zasto": "Lekcija povezivanje plemena ne vezuje za njih."}], "pomoc": ["Korak 1: Kakve su bile veze među plemenima?", "Korak 2: Šta to znači za brzinu nastanka države?", "Iz lekcije: veza je bila negde čvršća, negde labavija; iz toga korak po korak nastaju savezi i države."], "objasnjenje": "Država raste iz veza među plemenima, a one nisu bile jednake, pa ni proces nije bio nagao.", "iz_udzbenika": {"strana": 23, "odeljak": "Uvod", "tekst": "Veza među plemenskim celinama bila je negde čvršća, negde labavija; iz njih su korak po korak nastali savezi i države."}, "lekcija": 4}, {"id": "l04-srbija-kao-bedem-zakljuci", "vrsta": "zakljuci", "tezina": "tesko", "pojmovi": ["bugari", "ekspanzija", "knez-vlastimir", "mutimir", "car-simeon"], "pitanje": "Vlastimir i Mutimir su odbijali Bugare, a pod Simeonom je Srbija ipak pala. Šta je najverovatnije objašnjenje iz lekcije?", "odgovori": [{"tekst": "Pod najsposobnijim vladarem Simeonom bugarska sila je bila na vrhuncu ekspanzije", "tacan": true}, {"tekst": "Srbi su prestali da imaju vojsku", "tacan": false, "zasto": "Nema tog podatka; Časlav je već 927. zbacio bugarsku vlast, pa su imali snage."}, {"tekst": "Vizantija je Srbiju prodala Simeonu", "tacan": false, "zasto": "O prodaji nema reči; lekcija razlog traži u bugarskoj ekspanziji i Simeonovoj sposobnosti."}, {"tekst": "Bugari su došli sa Mađarima", "tacan": false, "zasto": "Lekcija ih ne povezuje; Mađari su sukobljeni sa Časlavom."}], "pomoc": ["Korak 1: Kako lekcija opisuje Simeona?", "Korak 2: U kakvoj fazi je tada bila Bugarska?", "Iz lekcije: Simeon je njihov najsposobniji vladar; Bugari su u ekspanziji."], "objasnjenje": "Isti protivnik postao je jači: sposoban vladar i vrhunac širenja učinili su ono što raniji napadi nisu.", "iz_udzbenika": {"strana": 24, "odeljak": "Prve srpske države", "tekst": "Pod Vlastimirom i Mutimirom napadi su odbijani, a kad je zavladao Simeon, njihov najsposobniji vladar, Srbija je pala pod njegovu vlast."}, "osa": {"naziv": "Raška pada pod bugarsku vlast", "od": 924, "traka": "dogadjaji"}, "lekcija": 4}, {"id": "l04-924-datum", "vrsta": "datum", "tezina": "lako", "pojmovi": ["car-simeon", "raska"], "dogadjaj": "Raška pada pod bugarsku vlast", "pitanje": "Koje godine je Srbija (Raška) došla pod vlast cara Simeona?", "godina": 924, "traka": "dogadjaji", "pomoc": ["To je prva polovina X veka.", "Tri godine kasnije Časlav je oslobađa.", "Iz lekcije: 924."], "objasnjenje": "Godine 924. Simeon je privremeno pokorio Srbiju.", "iz_udzbenika": {"strana": 24, "odeljak": "Prve srpske države", "tekst": "Srbija je privremeno došla pod Simeonovu vlast 924."}, "lekcija": 4}, {"id": "l04-927-datum", "vrsta": "datum", "tezina": "srednje", "pojmovi": ["knez-caslav", "bugari"], "dogadjaj": "Časlav zbacuje bugarsku vlast", "pitanje": "Koje godine je knez Časlav zbacio bugarsku vlast?", "godina": 927, "traka": "dogadjaji", "pomoc": ["Iste godine prestaje Simeonova vladavina.", "Tri godine je posle 924.", "Iz lekcije: 927."], "objasnjenje": "Godine 927. knez Časlav je zbacio bugarsku vlast.", "iz_udzbenika": {"strana": 24, "odeljak": "Prve srpske države", "tekst": "Godine 927. bugarsku vlast zbacio je srpski knez Časlav."}, "lekcija": 4}, {"id": "l04-iraklije-datum", "vrsta": "datum", "tezina": "srednje", "pojmovi": ["car-iraklije", "doseljavanje-srba"], "dogadjaj": "Vladavina cara Iraklija", "pitanje": "U kom periodu je vladao car Iraklije, pod kojim Srbi stižu na Balkan?", "od": 610, "do": 641, "traka": "vladari", "pomoc": ["Vladao je u prvoj polovini VII veka.", "Počeo je tačno deset godina posle 600.", "Iz lekcije: 610–641."], "objasnjenje": "Iraklije je
