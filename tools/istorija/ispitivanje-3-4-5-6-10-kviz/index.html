330.", "Srbija je stekla političku prevlast na Balkanu.", "Dušan se istakao u bici."], "objasnjenje": "Bitka je važna po posledici: prevlasti.", "iz_udzbenika": {"strana": 31, "odeljak": "Širenje srpske države krajem XIII i početkom XIV veka", "tekst": "Pobedom kod Velbužda Dečanski je Srbiji doneo političku prevlast na Balkanu."}, "lekcija": 6}]}, {"naslov": "6. Dalje širenje državne teritorije", "zadaci": [{"id": "l06-izbor-dusan-vrhunac", "vrsta": "izbor", "tezina": "lako", "pojmovi": ["car-dusan"], "pitanje": "Pod kojim vladarem je srednjovekovna Srbija dostigla najveću teritoriju?", "odgovori": [{"tekst": "pod Dušanom Silnim", "tacan": true}, {"tekst": "pod Urošem I", "tacan": false, "zasto": "Pod Urošem I država je prvenstveno privredno jačala."}, {"tekst": "pod Stefanom Prvovenčanim", "tacan": false, "zasto": "On je dobio krunu, a teritorijalni vrhunac dolazi mnogo kasnije."}, {"tekst": "pod Dragutinom", "tacan": false, "zasto": "Dragutin je vladao kratko i ustupio presto Milutinu."}], "pomoc": ["Nadimak mu govori o moći.", "Postao je car.", "Iz lekcije: teritorijalni vrhunac dostignut je pod Stefanom Dušanom Silnim."], "objasnjenje": "Teritorijalni vrhunac dostignut je pod Dušanom Silnim (1331–1355).", "iz_udzbenika": {"strana": 31, "odeljak": "Dalje širenje državne teritorije", "tekst": "Teritorijalni vrhunac dostignut je pod Dušanom Silnim (1331–1355).", "slika": "06-uspon-srbije-xiii-xiv-vek/05-srpsko-carstvo-sredinom-xiv-veka-karta.jpg"}, "osa": {"naziv": "Stefan Dušan", "od": 1331, "do": 1355, "traka": "vladari"}, "lekcija": 6}, {"id": "l06-izbor-dusan-vlast-silom", "vrsta": "izbor", "tezina": "lako", "pojmovi": ["car-dusan", "stefan-decanski", "dinasticki-sukobi"], "pitanje": "Kako je Dušan došao na vlast?", "odgovori": [{"tekst": "Preuzeo ju je od oca silom", "tacan": true}, {"tekst": "Otac mu je mirno predao presto i otišao na Svetu Goru", "tacan": false, "zasto": "Tako je postupio Nemanja; Dušan je vlast od oca preuzeo silom."}, {"tekst": "Izabrali su ga Dubrovčani", "tacan": false, "zasto": "Dubrovčani su trgovci i ne biraju vladara."}, {"tekst": "Postavio ga je vizantijski car", "tacan": false, "zasto": "Dušan je ratovao protiv Vizantije; presto je uzeo od oca."}], "pomoc": ["Seti se sukoba unutar dinastije.", "Njegov otac je Stefan Dečanski.", "Iz lekcije: vlast je od oca preuzeo silom."], "objasnjenje": "Dušan je presto od oca preuzeo silom, što je primer dinastičkih sukoba tog doba.", "iz_udzbenika": {"strana": 31, "odeljak": "Dalje širenje državne teritorije", "tekst": "Vlast je Dušan od oca preuzeo silom."}, "lekcija": 6}, {"id": "l06-izbor-palisada", "vrsta": "izbor", "tezina": "lako", "pojmovi": ["palisada"], "pitanje": "Šta je palisada?", "odgovori": [{"tekst": "ograda napravljena od šiljatih greda", "tacan": true}, {"tekst": "kamena tvrđava sa kulama", "tacan": false, "zasto": "Palisada je drvena ograda, a dvorovi su bili skromni."}, {"tekst": "svilena tkanina na dvoru", "tacan": false, "zasto": "Svilu je na dvor uveo Milutin; palisada je ograda."}, {"tekst": "mesto stalnog boravka vladara", "tacan": false, "zasto": "To je rezidencija."}], "pomoc": ["Vezuje se za drvene dvorove.", "Šiljato drvo.", "Iz lekcije: palisada je ograda napravljena od šiljatih greda."], "objasnjenje": "Palisada je ograda od šiljatih greda, a takvim ogradama bili su okruženi rani dvorovi.", "iz_udzbenika": {"strana": 31, "odeljak": "Dalje širenje državne teritorije", "tekst": "Palisada je ograda napravljena od šiljatih greda."}, "lekcija": 6}, {"id": "l06-izbor-dusan-osvajanja", "vrsta": "izbor", "tezina": "srednje", "pojmovi": ["car-dusan", "albanija", "grcka", "vizantija"], "pitanje": "Koje teritorije je osvojio Dušan? (više tačnih)", "odgovori": [{"tekst": "Albaniju", "tacan": true}, {"tekst": "severnu Grčku", "tacan": true}, {"tekst": "srednju Grčku", "tacan": true}, {"tekst": "Hum", "tacan": false, "zasto": "Hum je izgubio: oteo mu ga je bosanski ban Stjepan II."}, {"tekst": "Erdelj", "tacan": false, "zasto": "Iz Erdelja su došli Sasi; to nije Dušanovo osvajanje."}], "pomoc": ["To su delovi vizantijskih zemalja.", "Tri odgovora su tačna.", "Iz lekcije: Albaniju, severnu i srednju Grčku."], "objasnjenje": "Dušan je osvojio velike delove vizantijskih zemalja: Albaniju, severnu i srednju Grčku.", "iz_udzbenika": {"strana": 31, "odeljak": "Dalje širenje državne teritorije", "tekst": "Zauzeo je velike delove vizantijskih zemalja: Albaniju, severnu i srednju Grčku.", "slika": "06-uspon-srbije-xiii-xiv-vek/05-srpsko-carstvo-sredinom-xiv-veka-karta.jpg"}, "lekcija": 6}, {"id": "l06-izbor-palman", "vrsta": "izbor", "tezina": "srednje", "pojmovi": ["vitez-palman", "najamnici"], "pitanje": "Ko je bio Palman?", "odgovori": [{"tekst": "nemački vitez koji je komandovao stranim najamnicima u Dušanovoj vojsci", "tacan": true}, {"tekst": "bosanski ban", "tacan": false, "zasto": "Bosanski ban je Stjepan II."}, {"tekst": "srpski patrijarh", "tacan": false, "zasto": "Srpski patrijarh je Joanikije."}, {"tekst": "saski rudar iz Erdelja", "tacan": false, "zasto": "Sasi su rudari i došli su ranije, pod Urošem I; Palman je vitez."}], "pomoc": ["Povezuje se sa vojskom.", "Takođe Nemac, ali ne rudar.", "Iz lekcije: vojnici sa tla današnje Nemačke bili su pod komandom nemačkog viteza Palmana."], "objasnjenje": "Palman je nemački vitez, komandant plaćenih vojnika u Dušanovoj vojsci.", "iz_udzbenika": {"strana": 31, "odeljak": "Dalje širenje državne teritorije", "tekst": "Dušan je platio vojnike sa tla današnje Nemačke, pod komandom nemačkog viteza Palmana."}, "lekcija": 6}, {"id": "l06-tn-hum-osvojio", "vrsta": "tacno_netacno", "tezina": "lako", "pojmovi": ["hum", "car-dusan", "bosanski-ban-stjepan-ii"], "tvrdnja": "Dušan je izgubio Hum, koji mu je oteo bosanski ban Stjepan II.", "tacno": true, "pomoc": ["Dok je osvajao jug, nešto je izgubio.", "Iz lekcije: izgubio je Hum, koji mu je oteo bosanski ban Stjepan II."], "objasnjenje": "Tačno. Dok se širio ka jugu, Dušan je izgubio Hum.", "iz_udzbenika": {"strana": 31, "odeljak": "Dalje širenje državne teritorije", "tekst": "Dok se širio ka jugu, izgubio je Hum, koji mu je oteo bosanski ban Stjepan II."}, "lekcija": 6}, {"id": "l06-tn-dvorovi-rani", "vrsta": "tacno_netacno", "tezina": "lako", "pojmovi": ["palisada"], "tvrdnja": "Dvorovi velikih župana u Rasu bili su veliki kameni zamkovi.", "tacno": false, "ispravke": [{"tekst": "Bili su obične drvene kuće sa palisadama ili sličnim drvenim ogradama.", "tacan": true}, {"tekst": "Bili su mermerne palate po uzoru na Carigrad.", "tacan": false, "zasto": "Bili su skromna drvena zdanja."}, {"tekst": "Bili su pećine u stenama.", "tacan": false, "zasto": "Bile su to drvene kuće."}], "pomoc": ["Pomisli na pojam palisada.", "Bili su slični većim seoskim gazdinstvima.", "Iz lekcije: to su bile obične drvene kuće sa palisadama."], "objasnjenje": "Netačno. Dvorovi su bili skromne drvene kuće.", "iz_udzbenika": {"strana": 31, "odeljak": "Dalje širenje državne teritorije", "tekst": "Dvorovi velikih župana u Rasu bili su obične drvene kuće sa palisadama."}, "lekcija": 6}, {"id": "l06-tn-dusan-u-velbuzdu-i-bosni", "vrsta": "tacno_netacno", "tezina": "srednje", "pojmovi": ["car-dusan"], "tvrdnja": "Dušan se u borbama dokazao tek kada je postao vladar.", "tacno": false, "ispravke": [{"tekst": "Dokazao se još pre stupanja na presto, protiv bosanskog vladara i kod Velbužda.", "tacan": true}, {"tekst": "Nikada nije učestvovao u borbama.", "tacan": false, "zasto": "Učestvovao je, a kao vladar je osvojio velike delove vizantijskih zemalja."}, {"tekst": "Dokazao se samo u borbi protiv Turaka.", "tacan": false, "zasto": "Knjiga navodi bosanskog vladara i Velbužd."}], "pomoc": ["Pazi na reč tek.", "Velbužd je 1330, a on vlada od 1331.", "Iz lekcije: još pre stupanja na presto dokazao se u borbama sa bosanskim vladarem i kod Velbužda."], "objasnjenje": "Netačno. Dušan se dokazao još pre stupanja na presto.", "iz_udzbenika": {"strana": 31, "odeljak": "Dalje širenje državne teritorije", "tekst": "Još pre stupanja na presto Dušan se dokazao u borbama sa bosanskim vladarem i kod Velbužda."}, "lekcija": 6}, {"id": "l06-tn-dvor-seljak", "vrsta": "tacno_netacno", "tezina": "tesko", "pojmovi": ["palisada", "nemanjici"], "tvrdnja": "Dvor prvih kraljeva Nemanjića se po izgledu nije mnogo razlikovao od doma vlastele ili većeg seoskog gazdinstva.", "tacno": true, "pomoc": ["Ko je još živeo u sličnim kućama?", "Iz lekcije: bila su to skromna zdanja, slična domovima vlastele ili većim seoskim gazdinstvima."], "objasnjenje": "Tačno. Knjiga ih poredi sa domovima vlastele i većim seoskim gazdinstvima.", "iz_udzbenika": {"strana": 31, "odeljak": "Dalje širenje državne teritorije", "tekst": "Bila su to skromna zdanja, slična domovima vlastele ili većim seoskim gazdinstvima."}, "lekcija": 6}, {"id": "l06-dopuni-dusan-lako", "vrsta": "dopuni", "tezina": "lako", "pojmovi": ["car-dusan", "hum", "bosanski-ban-stjepan-ii"], "pitanje": "Dopuni rečenicu.", "tekst": "Dušan je osvojio {{Albaniju}} i veliki deo Grčke, ali je izgubio {{Hum}}, koji mu je oteo ban {{Stjepan II}}.", "ponudjene": ["Albaniju", "Hum", "Stjepan II", "Erdelj", "Braničevo", "Palman"], "pomoc": ["Hum je gubitak, a ne osvajanje.", "Ban je vladar Bosne.", "Iz lekcije: Albanija i Grčka osvojene; Hum izgubljen od bana Stjepana II."], "objasnjenje": "Dušan osvaja jug, a na zapadu gubi Hum.", "iz_udzbenika": {"strana": 31, "odeljak": "Dalje širenje državne teritorije", "tekst": "Dušan je osvojio Albaniju, severnu i srednju Grčku, a izgubio Hum."}, "lekcija": 6}, {"id": "l06-dopuni-dvor-srednje", "vrsta": "dopuni", "tezina": "srednje", "pojmovi": ["palisada", "kralj-milutin"], "pitanje": "Dopuni rečenicu.", "tekst": "Prvi dvorovi su bile drvene kuće sa {{palisadama}}, a {{Milutin}} je uveo raskoš, pa su unutrašnjost krasili {{duborez}} i svila.", "ponudjene": ["palisadama", "Milutin", "duborez", "Dušan", "mermer", "rudnicima"], "pomoc": ["Ograda od šiljatih greda.", "Kralj je isto veliki ktitor.", "Iz lekcije: palisade, raskoš pod Milutinom, duborez i svila."], "objasnjenje": "Sa jačanjem države Milutin ukrašava drvene dvorove duborezom i svilom.", "iz_udzbenika": {"strana": 31, "odeljak": "Dalje širenje državne teritorije", "tekst": "Milutin uvodi raskoš: drvene građevine se ukrašavaju duborezom i svilom."}, "lekcija": 6}, {"id": "l06-zakljuci-dusan-hum", "vrsta": "zakljuci", "tezina": "srednje", "pojmovi": ["hum", "car-dusan", "bosanski-ban-stjepan-ii"], "pitanje": "Zašto je Dušan izgubio Hum baš dok je osvajao jug?", "odgovori": [{"tekst": "Njegove snage bile su usmerene na jug, pa je sused to iskoristio", "tacan": true}, {"tekst": "Dao je Hum banu kao miraz", "tacan": false, "zasto": "Knjiga kaže da mu ga je ban oteo."}, {"tekst": "Hum se odvojio i pripao Vizantiji", "tacan": false, "zasto": "Hum je oteo bosanski ban."}, {"tekst": "Stanovnici Huma su prešli u Erdelj", "tacan": false, "zasto": "O tome nema reči u lekciji."}], "pomoc": ["Korak 1: Gde je bila Dušanova vojska?", "Korak 2: Ko je mogao da iskoristi to što je on zauzet?", "Iz lekcije: Dušan osvaja jug → gubi Hum, koji zauzima ban Stjepan II."], "objasnjenje": "Osvajanje jednog kraja može da ostavi drugi nezaštićen.", "iz_udzbenika": {"strana": 31, "odeljak": "Uzrok → posledica", "tekst": "Dušan osvaja jug, a gubi Hum, koji zauzima ban Stjepan II."}, "lekcija": 6}, {"id": "l06-zakljuci-raskos", "vrsta": "zakljuci", "tezina": "srednje", "pojmovi": ["kralj-milutin"], "pitanje": "Šta nam raskoš na Milutinovom dvoru govori o državi?", "odgovori": [{"tekst": "Država je ojačala i imala je više bogatstva", "tacan": true}, {"tekst": "Država je bila na ivici propasti", "tacan": false, "zasto": "Raskoš dolazi sa jačanjem države."}, {"tekst": "Vladari su prestali da grade manastire", "tacan": false, "zasto": "Milutin je bio jedan od najvećih ktitora."}, {"tekst": "Dvor se preselio na Svetu Goru", "tacan": false, "zasto": "Sveta gora je mesto gde je Milutin vojskom upadao, a ne njegov dvor."}], "pomoc": ["Korak 1: Kada je raskoš moguća?", "Korak 2: Šta je prethodilo tome?", "Iz lekcije: jačanje države → luksuz na dvoru pod Milutinom."], "objasnjenje": "Raskoš je znak jačanja države i njenih prihoda.", "iz_udzbenika": {"strana": 31, "odeljak": "Uzrok → posledica", "tekst": "Jačanje države dovelo je do luksuza na dvoru pod Milutinom."}, "lekcija": 6}, {"id": "l06-zakljuci-veza-rudarstvo-rat", "vrsta": "zakljuci", "tezina": "tesko", "pojmovi": ["najamnici", "rudarstvo", "stefan-uros-i", "car-dusan"], "pitanje": "Kako je ono što je započeto pod Urošem I pomoglo Dušanu više od pola veka kasnije?", "odgovori": [{"tekst": "Rudarstvo pokrenuto u doba Uroša I davalo je prihode za plaćanje najamnika", "tacan": true}, {"tekst": "Uroš I je ostavio Dušanu krunu cara", "tacan": false, "zasto": "Dušan se sam proglasio za cara 1345."}, {"tekst": "Jelena Anžujska je komandovala Dušanovom vojskom", "tacan": false, "zasto": "Vojskom najamnika komandovao je Palman."}, {"tekst": "Sasi su bili Dušanovi vojnici", "tacan": false, "zasto": "Sasi su rudari; najamnici su bili drugi Nemci, pod Palmanom."}], "pomoc": ["Korak 1: Šta je Uroš I razvio?", "Korak 2: Šta je trebalo Dušanu za najamnike?", "Iz lekcije: prihodi od rudarstva i trgovine omogućili su mu da plati vojnike."], "objasnjenje": "Privreda stvorena ranije finansira vojsku kasnije: bez prihoda nema plaćenih vojnika.", "iz_udzbenika": {"strana": 31, "odeljak": "Dalje širenje državne teritorije", "tekst": "Prihodi od rudarstva i trgovine omogućili su Dušanu da plati najamnike."}, "lekcija": 6}, {"id": "l06-zakljuci-dinastija-dusan", "vrsta": "zakljuci", "tezina": "tesko", "pojmovi": ["dinasticki-sukobi", "car-dusan", "stefan-dragutin"], "pitanje": "Uporedi Dragutina i Dušana: šta pokazuju o načinima na koje je presto menjao vladara?", "odgovori": [{"tekst": "Presto se ponekad ustupao, a ponekad otimao, pa nije bilo jednog mirnog pravila", "tacan": true}, {"tekst": "Presto se uvek birao na izborima", "tacan": false, "zasto": "Dragutin ga ustupa, Dušan ga uzima silom; izbora nema."}, {"tekst": "Presto su uvek dodeljivali Vizantinci", "tacan": false, "zasto": "O tome odlučuju Nemanjići među sobom."}, {"tekst": "Dragutin i Dušan su učinili isto", "tacan": false, "zasto": "Dragutin je ustupio presto, a Dušan ga je uzeo silom."}], "pomoc": ["Korak 1: Kako je Dragutin predao vlast?", "Korak 2: Kako ju je Dušan dobio?", "Iz lekcije: tipična pojava su sukobi unutar dinastije oko nasleđivanja."], "objasnjenje": "Dva primera pokazuju da nasleđivanje nije bilo mirno i jednoobrazno.", "iz_udzbenika": {"strana": 30, "odeljak": "Uvod", "tekst": "Tipična pojava tog doba su sukobi unutar dinastije oko nasleđivanja prestola."}, "lekcija": 6}, {"id": "l06-datum-dusan", "vrsta": "datum", "tezina": "srednje", "pojmovi": ["car-dusan"], "dogadjaj": "Stefan Dušan", "pitanje": "Od koje do koje godine je vladao Dušan Silni?", "od": 1331, "do": 1355, "traka": "vladari", "pomoc": ["Počeo je godinu posle Velbužda.", "Završio je smrću sredinom XIV veka.", "Iz lekcije: Dušan Silni (1331–1355)."], "objasnjenje": "Dušan je vladao 1331–1355.", "iz_udzbenika": {"strana": 31, "odeljak": "Dalje širenje državne teritorije", "tekst": "Teritorijalni vrhunac dostignut je pod Dušanom Silnim (1331–1355)."}, "lekcija": 6}, {"id": "l06-uporedi-dvor-pre-posle", "vrsta": "uporedi", "tezina": "srednje", "pojmovi": ["palisada", "kralj-milutin"], "a": "Rani dvorovi", "b": "Dvor pod Milutinom", "pitanje": "Na šta se tvrdnja odnosi: rane dvorove, dvor pod Milutinom, oba ili nijedno?", "tvrdnje": [{"tekst": "Građevine su drvene.", "odgovor": "oba", "zasto": "I pod Milutinom građevine ostaju drvene."}, {"tekst": "Iznutra se ukrašavaju duborezom i svilom.", "odgovor": "b", "zasto": "To uvodi Milutin."}, {"tekst": "Slični su domovima vlastele ili većim gazdinstvima.", "odgovor": "a", "zasto": "Tako knjiga opisuje rane dvorove."}, {"tekst": "Ograđuju ih palisade ili slične ograde.", "odgovor": "a", "zasto": "To se navodi za rane dvorove u Rasu."}, {"tekst": "Podignuti su od mermera.", "odgovor": "nijedan", "zasto": "U oba slučaja građevine su drvene."}], "pomoc": ["Pod Milutinom se menja unutrašnjost, a ne materijal.", "Drvo je zajedničko.", "Iz lekcije: građevine ostaju drvene, ali su iznutra bogato ukrašene."], "objasnjenje": "Promena je u unutrašnjosti: drvo ostaje, a stiže raskoš.", "iz_udzbenika": {"strana": 31, "odeljak": "Dalje širenje državne teritorije", "tekst": "Dvorovi su bili skromne drvene kuće, a Milutin uvodi raskoš u unutrašnjost."}, "lekcija": 6}, {"id": "l06-objasni-kako-ziveli", "vrsta": "objasni", "tezina": "lako", "pojmovi": ["palisada", "kralj-milutin", "rezidencija"], "pitanje": "Kako su živeli srpski vladari?", "uzor": "U početku su živeli u skromnim drvenim dvorovima sa palisadama. Od Milutina se javlja raskoš u unutrašnjosti, duborez i svila. Vladari su stalno putovali po zemlji, a rezidencije se javljaju tek pod Milutinom.", "ideje": ["Skromni drveni dvorovi sa palisadama.", "Raskoš u unutrašnjosti od Milutina.", "Stalno putovanje po zemlji.", "Rezidencije tek pod Milutinom."], "objasnjenje": "Ovo je pitanje iz udžbenika sa str. 33.", "iz_udzbenika": {"strana": 33, "odeljak": "Pitanja za razmišljanje / Zadaci iz udžbenika", "tekst": "Vladari su živeli u skromnim drvenim dvorovima, a raskoš i rezidencije se javljaju tek pod Milutinom."}, "lekcija": 6}, {"id": "l06-objasni-dusan-osvajanja", "vrsta": "objasni", "tezina": "lako", "pojmovi": ["car-dusan", "albanija", "grcka"], "pitanje": "Koje teritorije je osvojio car Dušan?", "uzor": "Dušan je osvojio velike delove vizantijskih zemalja: Albaniju, severnu i srednju Grčku. Istovremeno je izgubio Hum, koji mu je oteo ban Stjepan II.", "ideje": ["Albanija.", "Severna i srednja Grčka.", "Izgubio je Hum."], "objasnjenje": "Ovo je pitanje iz udžbenika sa str. 33.", "iz_udzbenika": {"strana": 33, "odeljak": "Pitanja za razmišljanje / Zadaci iz udžbenika", "tekst": "Dušan je osvojio Albaniju, severnu i srednju Grčku."}, "lekcija": 6}]}, {"naslov": "6. Proglašenje carstva", "zadaci": [{"id": "l06-izbor-krunisanje-gde", "vrsta": "izbor", "tezina": "lako", "pojmovi": ["car-dusan", "skoplje"], "pitanje": "U kom gradu je Dušan svečano krunisan za cara?", "odgovori": [{"tekst": "u Skoplju", "tacan": true}, {"tekst": "u Seru", "tacan": false, "zasto": "U Seru se 1345. proglasio za cara, ali je krunisan u Skoplju."}, {"tekst": "u Rasu", "tacan": false, "zasto": "Ras je stara prestonica velikih župana."}, {"tekst": "u Trnovu", "tacan": false, "zasto": "U Trnovu je umro Sveti Sava."}], "pomoc": ["Ne mešaj proglašenje i krunisanje.", "Isti grad gde je objavljen Zakonik.", "Iz lekcije: svečano krunisanje bilo je u Skoplju 1346."], "objasnjenje": "Krunisanje je bilo u Skoplju 1346.", "iz_udzbenika": {"strana": 31, "odeljak": "Proglašenje carstva", "tekst": "Svečano krunisanje bilo je u Skoplju 1346.", "slika": "06-uspon-srbije-xiii-xiv-vek/03-car-dusan.jpg"}, "osa": {"naziv": "Krunisanje cara Dušana", "od": 1346, "traka": "dogadjaji"}, "lekcija": 6}, {"id": "l06-izbor-titula", "vrsta": "izbor", "tezina": "lako", "pojmovi": ["car-dusan"], "pitanje": "Koju je titulu Dušan dobio krunisanjem?", "odgovori": [{"tekst": "car Srba i Grka", "tacan": true}, {"tekst": "kralj Srba i Bugara", "tacan": false, "zasto": "Bugari nisu u tituli; titula je car Srba i Grka."}, {"tekst": "veliki župan Raške", "tacan": false, "zasto": "To je stara titula iz Nemanjinog doba."}, {"tekst": "patrijarh Srba", "tacan": false, "zasto": "Patrijarh je Joanikije."}], "pomoc": ["Titula je viša od kraljevske.", "U njoj su dva naroda.", "Iz lekcije: Dušan postaje car Srba i Grka."], "objasnjenje": "Dušan je krunisan za cara Srba i Grka.", "iz_udzbenika": {"strana": 31, "odeljak": "Proglašenje carstva", "tekst": "Dušan postaje car Srba i Grka.", "slika": "06-uspon-srbije-xiii-xiv-vek/03-car-dusan.jpg"}, "lekcija": 6}, {"id": "l06-izbor-joanikije", "vrsta": "izbor", "tezina": "lako", "pojmovi": ["patrijarh-joanikije", "car-dusan"], "pitanje": "Ko je krunisao Dušana za cara?", "odgovori": [{"tekst": "patrijarh Joanikije", "tacan": true}, {"tekst": "rimski papa", "tacan": false, "zasto": "Papa je 1217. poslao krunu Stefanu; Dušana je krunisao srpski patrijarh."}, {"tekst": "vizantijski car", "tacan": false, "zasto": "Dušan je osvajao vizantijske zemlje; krunisao ga je Joanikije."}, {"tekst": "vitez Palman", "tacan": false, "zasto": "Palman je vojni zapovednik."}], "pomoc": ["Krunisao ga je crkveni poglavar.", "Dobio je novi čin iste godine.", "Iz lekcije: patrijarh Joanikije krunisao ga je za cara Srba i Grka."], "objasnjenje": "Dušana je 1346. krunisao srpski patrijarh Joanikije.", "iz_udzbenika": {"strana": 33, "odeljak": "Zapamtite", "tekst": "Patrijarh Joanikije krunisao je Dušana za cara Srba i Grka 1346. u Skoplju."}, "lekcija": 6}, {"id": "l06-izbor-zakonik-kada", "vrsta": "izbor", "tezina": "lako", "pojmovi": ["dusanov-zakonik", "skoplje"], "pitanje": "Gde je 1349. objavljen Dušanov Zakonik?", "odgovori": [{"tekst": "na državnom saboru u Skoplju", "tacan": true}, {"tekst": "u Hilandaru", "tacan": false, "zasto": "Hilandar je manastir; Zakonik je objavljen na saboru u Skoplju."}, {"tekst": "u Dubrovniku", "tacan": false, "zasto": "Dubrovčani su trgovci; Zakonik je donesen u Skoplju."}, {"tekst": "u Seru", "tacan": false, "zasto": "U Seru je dopunjen 1354."}], "pomoc": ["Isti grad kao krunisanje.", "Ser je mesto dopune.", "Iz lekcije: objavljen je na državnom saboru u Skoplju 1349."], "objasnjenje": "Zakonik je objavljen u Skoplju 1349, a dopunjen u Seru 1354.", "iz_udzbenika": {"strana": 32, "odeljak": "Proglašenje carstva", "tekst": "Zakonik je objavljen na državnom saboru u Skoplju 1349.", "slika": "06-uspon-srbije-xiii-xiv-vek/04-zakonik-cara-dusana.jpg"}, "osa": {"naziv": "Objavljivanje Dušanovog zakonika", "od": 1349, "traka": "dogadjaji"}, "lekcija": 6}, {"id": "l06-izbor-carstvo-granice", "vrsta": "izbor", "tezina": "srednje", "pojmovi": ["dunav", "korintski-zaliv"], "pitanje": "Dokle se pružalo Dušanovo carstvo?", "odgovori": [{"tekst": "od Dunava na severu do Korintskog zaliva na jugu", "tacan": true}, {"tekst": "od Tare do Morave", "tacan": false, "zasto": "To je samo unutrašnjost; carstvo je bilo daleko veće."}, {"tekst": "od Save do Svete gore", "tacan": false, "zasto": "Do Svete gore je Milutin upadao; južna granica carstva je Korintski zaliv."}, {"tekst": "od Carigrada do Dubrovnika", "tacan": false, "zasto": "Carigrad nije bio u Dušanovom carstvu."}], "pomoc": ["Severna granica je ista kao kod Milutina.", "Južna je zaliv u Grčkoj.", "Iz lekcije: od Dunava na severu do Korintskog zaliva na jugu."], "objasnjenje": "Carstvo se pružalo od Dunava do Korintskog zaliva.", "iz_udzbenika": {"strana": 32, "odeljak": "Proglašenje carstva", "tekst": "Carstvo se pružalo od Dunava na severu do Korintskog zaliva na jugu.", "slika": "06-uspon-srbije-xiii-xiv-vek/05-srpsko-carstvo-sredinom-xiv-veka-karta.jpg"}, "lekcija": 6}, {"id": "l06-izbor-vizantijski-uticaj", "vrsta": "izbor", "tezina": "srednje", "pojmovi": ["vizantija", "savladarstvo", "dusanov-zakonik"], "pitanje": "Šta je Dušan preuzeo po vizantijskom uzoru? (više tačnih)", "odgovori": [{"tekst": "zvanja i titule", "tacan": true}, {"tekst": "savladarstvo", "tacan": true}, {"tekst": "uticaj prava na Zakonik", "tacan": true}, {"tekst": "palisade oko dvorova", "tacan": false, "zasto": "Palisade su odlika ranih drvenih dvorova, a ne vizantijski uzor."}, {"tekst": "dolazak Sasa", "tacan": false, "zasto": "Sasi su stigli pod Urošem I, iz Erdelja."}], "pomoc": ["Vizantijski uzor je u državnom uređenju.", "Tri odgovora su tačna.", "Iz lekcije: Zakonik pod uticajem vizantijskog prava, titule po vizantijskom modelu i savladarstvo."], "objasnjenje": "Vizantija je bila uzor za pravo, dvorski ceremonijal, titule i savladarstvo.", "iz_udzbenika": {"strana": 32, "odeljak": "Proglašenje carstva", "tekst": "Dušan uvodi zvanja i titule po vizantijskom modelu, a i savladarstvo po vizantijskom uzoru."}, "lekcija": 6}, {"id": "l06-izbor-najvisa-zvanja", "vrsta": "izbor", "tezina": "srednje", "pojmovi": ["car-dusan", "vlastela"], "pitanje": "Kome je Dušan dao najviša zvanja i šta je dobijalo krupno plemstvo?", "odgovori": [{"tekst": "Najviša zvanja rođacima i bliskim saradnicima, a plemstvo velike oblasti na upravu", "tacan": true}, {"tekst": "Najviša zvanja stranim najamnicima, a plemstvo ništa", "tacan": false, "zasto": "Knjiga kaže da je zvanja dao rođacima i saradnicima, a plemstvo je dobilo oblasti."}, {"tekst": "Najviša zvanja Dubrovčanima, a plemstvo rudnike", "tacan": false, "zasto": "Dubrovčani su trgovci, a ne nosioci dvorskih zvanja."}, {"tekst": "Najviša zvanja seljacima, a plemstvo manastire", "tacan": false, "zasto": "Zavisni seljaci nisu dobijali zvanja."}], "pomoc": ["Zvanja dobijaju ljudi bliski vladaru.", "Plemstvo upravlja oblastima.", "Iz lekcije: najviša zvanja dao je rođacima i bliskim saradnicima, a krupno plemstvo dobijalo je velike oblasti."], "objasnjenje": "Dušan se oslanja na rođake i saradnike, a krupno plemstvo dobija oblasti.", "iz_udzbenika": {"strana": 32, "odeljak": "Proglašenje carstva", "tekst": "Najviša zvanja dao je rođacima i bliskim saradnicima, a krupno plemstvo dobijalo je na upravu velike oblasti."}, "lekcija": 6}, {"id": "l06-izbor-zakonik-sadrzaj", "vrsta": "izbor", "tezina": "tesko", "pojmovi": ["dusanov-zakonik"], "pitanje": "Prema rubrici Zapamtite, koje oblasti života uređuje Zakonik?", "odgovori": [{"tekst": "verski, društveni i privatni život", "tacan": true}, {"tekst": "samo ratovanje", "tacan": false, "zasto": "Zakonik uređuje razne životne oblasti."}, {"tekst": "samo rudarstvo", "tacan": false, "zasto": "Rudarstvo je samo jedan privredni deo, a Zakonik je mnogo širi."}, {"tekst": "samo manastirski život", "tacan": false, "zasto": "To je tipik; Zakonik važi u celom Carstvu."}], "pomoc": ["Važio je u celom Carstvu.", "Tri oblasti.", "Iz lekcije: Zakonikom su uređena pitanja verskog, društvenog i privatnog života."], "objasnjenje": "Zakonik uređuje verski, društveni i privatni život.", "iz_udzbenika": {"strana": 33, "odeljak": "Zapamtite", "tekst": "Zakonikom su uređena pitanja verskog, društvenog i privatnog života."}, "lekcija": 6}, {"id": "l06-tn-zakonik-sve", "vrsta": "tacno_netacno", "tezina": "lako", "pojmovi": ["dusanov-zakonik"], "tvrdnja": "Zakonik je važio samo u Skoplju.", "tacno": false, "ispravke": [{"tekst": "Zakonik je važio u celom Carstvu.", "tacan": true}, {"tekst": "Zakonik je važio samo u manastirima.", "tacan": false, "zasto": "Važio je u celom Carstvu i uređivao razne oblasti života."}, {"tekst": "Zakonik je važio samo za strance.", "tacan": false, "zasto": "Knjiga kaže da je važio u celom Carstvu."}], "pomoc": ["Skoplje je samo mesto objavljivanja.", "Bio je to zakon za državu.", "Iz lekcije: važio je u celom Carstvu."], "objasnjenje": "Netačno. Skoplje je mesto objavljivanja, a Zakonik je važio u celom Carstvu.", "iz_udzbenika": {"strana": 32, "odeljak": "Proglašenje carstva", "tekst": "Objavljen je u Skoplju 1349. i važio je u celom Carstvu."}, "lekcija": 6}, {"id": "l06-tn-vizantija-samo-neprijatelj", "vrsta": "tacno_netacno", "tezina": "srednje", "pojmovi": ["vizantija"], "tvrdnja": "Vizantija je srpskim vladarima bila samo neprijatelj, pa od nje ništa nisu preuzimali.", "tacno": false, "ispravke": [{"tekst": "Često su ratovali s njom, ali im je bila i uzor u uređenju države.", "tacan": true}, {"tekst": "Nikada nisu ratovali s njom.", "tacan": false, "zasto": "Ratovali su često, a Dušan je osvojio velike delove njenih zemalja."}, {"tekst": "Srbija je bila vizantijska pokrajina.", "tacan": false, "zasto": "Srbija je bila nezavisna; Vizantija joj je bila uzor."}], "pomoc": ["Pomisli na Zakonik i titule.", "Moguće je i ratovati i ugledati se.", "Iz lekcije: često su ratovali s Vizantijom, ali im je bila i uzor."], "objasnjenje": "Netačno. Vizantija je bila i protivnik i uzor.", "iz_udzbenika": {"strana": 31, "odeljak": "Proglašenje carstva", "tekst": "Srpski vladari su često ratovali s Vizantijom, ali im je ona bila ike delove vizantijskih zemalja", "tacan": true}, {"tekst": "Zato što je bio Grk", "tacan": false, "zasto": "Dušan je Nemanjić, srpski vladar."}, {"tekst": "Zato što ga je krunisao vizantijski car", "tacan": false, "zasto": "Krunisao ga je patrijarh Joanikije."}, {"tekst": "Zato što je Zakonik pisan samo na grčkom", "tacan": false, "zasto": "O tome knjiga ništa ne kaže."}], "pomoc": ["Korak 1: Gde je Dušan ratovao?", "Korak 2: Ko tamo živi?", "Iz lekcije: osvajanje vizantijskih zemalja → proglašenje carstva."], "objasnjenje": "Titula odražava osvojene grčke zemlje.", "iz_udzbenika": {"strana": 31, "odeljak": "Uzrok → posledica", "tekst": "Osvajanje vizantijskih zemalja dovelo je do proglašenja carstva (1345)."}, "lekcija": 6}, {"id": "l06-zakljuci-rat-i-uzor", "vrsta": "zakljuci", "tezina": "srednje", "pojmovi": ["vizantija", "dusanov-zakonik", "savladarstvo"], "pitanje": "Kako su Srbi mogli u isto vreme da ratuju s Vizantijom i da je uzimaju za uzor?", "odgovori": [{"tekst": "Borili su se s njom za teritoriju, a preuzimali njeno uređenje jer je bilo razvijeno", "tacan": true}, {"tekst": "Vizantija im je naredila da je oponašaju", "tacan": false, "zasto": "Knjiga kaže da im je bila uzor, a ne da im je išta naredila."}, {"tekst": "Ratovi su bili samo igra", "tacan": false, "zasto": "Dušan je osvojio velike delove njenih zemalja."}, {"tekst": "Oponašali su je samo u ishrani", "tacan": false, "zasto": "Knjiga navodi pravo, titule, ceremonijal i savladarstvo."}], "pomoc": ["Korak 1: Šta je predmet rata?", "Korak 2: Šta je predmet ugledanja?", "Iz lekcije: često su ratovali s Vizantijom, ali im je bila i uzor."], "objasnjenje": "Protivnik u ratu može biti i učitelj u uređenju države.", "iz_udzbenika": {"strana": 31, "odeljak": "Proglašenje carstva", "tekst": "Srpski vladari su često ratovali s Vizantijom, ali im je ona bila i uzor."}, "lekcija": 6}, {"id": "l06-zakljuci-ser-skoplje", "vrsta": "zakljuci", "tezina": "tesko", "pojmovi": ["ser", "skoplje", "car-dusan"], "pit
