1349."], "objasnjenje": "Oba grada su važna za carstvo i Zakonik.", "iz_udzbenika": {"strana": 32, "odeljak": "Proglašenje carstva", "tekst": "Ser je mesto proglašenja i dopune, a Skoplje krunisanja i objavljivanja Zakonika."}, "lekcija": 6}, {"id": "l06-uporedi-srbija-vizantija", "vrsta": "uporedi", "tezina": "tesko", "pojmovi": ["vizantija", "car-dusan"], "a": "Vizantija kao protivnik", "b": "Vizantija kao uzor", "pitanje": "Razvrstaj tvrdnje: šta pokazuje Vizantiju kao protivnika, šta kao uzora, šta oba ili nijedno?", "tvrdnje": [{"tekst": "Dušan osvaja severnu i srednju Grčku.", "odgovor": "a", "zasto": "To je rat za vizantijske zemlje."}, {"tekst": "Zakonik nastaje pod uticajem njenog prava.", "odgovor": "b", "zasto": "To je ugledanje."}, {"tekst": "Dušan uvodi zvanja i titule po njenom modelu.", "odgovor": "b", "zasto": "To je preuzimanje."}, {"tekst": "Dušan uzima titulu cara Srba i Grka.", "odgovor": "oba", "zasto": "Titula je i posledica osvajanja i preuzimanje vizantijskog carskog modela."}, {"tekst": "Dušan plaća nemačke najamnike.", "odgovor": "nijedan", "zasto": "To je plod prihoda od rudarstva i trgovine, a ne pojava vezana za samu Vizantiju."}], "pomoc": ["Rat za zemlju ili preuzimanje uređenja?", "Jedna tvrdnja spaja oba.", "Iz lekcije: često su ratovali s Vizantijom, ali im je bila i uzor."], "objasnjenje": "Odnos je dvostruk: rat za teritoriju i ugledanje na uređenje.", "iz_udzbenika": {"strana": 31, "odeljak": "Proglašenje carstva", "tekst": "Srpski vladari su često ratovali s Vizantijom, ali im je ona bila i uzor."}, "lekcija": 6}, {"id": "l06-kosam-dusan", "vrsta": "ko_sam", "tezina": "tesko", "pojmovi": ["car-dusan", "dusanov-zakonik"], "tragovi": ["Istakao sam se u borbi sa bosanskim vladarem.", "Presto sam od oca uzeo silom.", "Svoje sudije sam obavezao da ne sude iz straha od mene."], "odgovori": [{"tekst": "Dušan", "tacan": true}, {"tekst": "Milutin", "tacan": false, "zasto": "Milutinu je presto ustupio brat."}, {"tekst": "Stefan Dečanski", "tacan": false, "zasto": "On je Dušanov otac i pobednik kod Velbužda."}, {"tekst": "Uroš Nejaki", "tacan": false, "zasto": "On je Dušanov sin i odmah je proglašen za cara."}], "objasnjenje": "To je Dušan, kralj pa car, tvorac Zakonika.", "iz_udzbenika": {"strana": 33, "odeljak": "Iz istorijskih izvora", "tekst": "Dušanov Zakonik obavezuje sudije da ne sude iz straha od cara.", "slika": "06-uspon-srbije-xiii-xiv-vek/03-car-dusan.jpg"}, "lekcija": 6}, {"id": "l06-objasni-zakonik", "vrsta": "objasni", "tezina": "lako", "pojmovi": ["dusanov-zakonik"], "pitanje": "Šta je Dušanov Zakonik i kada je donet?", "uzor": "To je zakonik koji je Dušan doneo za celo Carstvo, pod uticajem vizantijskog prava. Objavljen je 1349. na saboru u Skoplju, a dopunjen 1354. u Seru. Uređivao je verski, društveni i privatni život.", "ideje": ["Objavljen je 1349. u Skoplju.", "Dopunjen je 1354. u Seru.", "Uticaj vizantijskog prava.", "Uređuje razne oblasti života."], "objasnjenje": "Odgovor spaja datum, mesto, uzor i sadržaj.", "iz_udzbenika": {"strana": 32, "odeljak": "Proglašenje carstva", "tekst": "Zakonik je objavljen 1349. u Skoplju, a dopunjen 1354. u Seru."}, "lekcija": 6}, {"id": "l06-objasni-sudije", "vrsta": "objasni", "tezina": "srednje", "pojmovi": ["dusanov-zakonik"], "pitanje": "Šta je u Dušanovom Zakoniku pisalo o uticaju vladara na sudije?", "uzor": "Ako car iz srdžbe, ljubavi ili milosti napiše pismo koje se kosi sa Zakonikom, sudije mu ne smeju verovati. Sudije moraju da sude po pravdi i po Zakoniku. Ne smeju da sude iz straha od cara.", "ideje": ["Sudije ne veruju pismu koje se kosi sa Zakonikom.", "Sude po pravdi i Zakoniku.", "Ne sude iz straha od cara."], "objasnjenje": "Ovo je pitanje iz udžbenika sa str. 33.", "iz_udzbenika": {"strana": 33, "odeljak": "Iz istorijskih izvora", "tekst": "Sudije sude po pravdi i Zakoniku, a ne iz straha od cara."}, "lekcija": 6}, {"id": "l06-objasni-proglasenje-koraci", "vrsta": "objasni", "tezina": "srednje", "pojmovi": ["car-dusan", "patrijarh-joanikije", "ser", "skoplje"], "pitanje": "Opiši korake kojima je Dušan postao car.", "uzor": "Posle osvajanja u Vizantiji proglasio se 1345. za cara u Seru. Godine 1346. arhiepiskop Joanikije je dobio čin patrijarha. Zatim je u Skoplju krunisan za cara Srba i Grka.", "ideje": ["Osvajanja u Vizantiji.", "Proglašenje u Seru 1345.", "Joanikije postaje patrijarh 1346.", "Krunisanje u Skoplju 1346."], "objasnjenje": "Tri koraka u dve godine.", "iz_udzbenika": {"strana": 31, "odeljak": "Proglašenje carstva", "tekst": "Dušan se proglasio za cara 1345, a krunisan je u Skoplju 1346."}, "lekcija": 6}, {"id": "l06-objasni-vizantija-tesko", "vrsta": "objasni", "tezina": "tesko", "pojmovi": ["vizantija", "dusanov-zakonik", "savladarstvo"], "pitanje": "Objasni na primerima zašto kažemo da je Vizantija Srbima bila i protivnik i uzor.", "uzor": "Srpski vladari su često ratovali s Vizantijom, a Dušan je osvojio velike delove njenih zemalja. Istovremeno je Zakonik nastao pod uticajem vizantijskog prava. Titule, dvorski ceremonijal i savladarstvo takođe su preuzeti po njenom uzoru.", "ideje": ["Ratovi i osvajanje vizantijskih zemalja.", "Zakonik pod uticajem vizantijskog prava.", "Titule, ceremonijal i savladarstvo po uzoru na Vizantiju."], "objasnjenje": "Dobar odgovor ima primer i za rat i za ugledanje.", "iz_udzbenika": {"strana": 31, "odeljak": "Proglašenje carstva", "tekst": "Srpski vladari su često ratovali s Vizantijom, ali im je ona bila i uzor."}, "lekcija": 6}, {"id": "l06-objasni-zakon-iznad-cara", "vrsta": "objasni", "tezina": "tesko", "pojmovi": ["dusanov-zakonik", "car-dusan"], "pitanje": "Zašto je član 167 važan za razumevanje pravde u Dušanovoj državi?", "uzor": "Član kaže da sudije ne smeju slušati carevo pismo koje se kosi sa Zakonikom. Time je Zakonik stavljen iznad trenutne careve volje. Sudije treba da presuđuju po pravdi, a ne iz straha.", "ideje": ["Zakonik je iznad careve trenutne volje.", "Sudije nisu dužne da poslušaju protivzakonito pismo.", "Pravda ne sme zavisiti od straha."], "objasnjenje": "Ideja je da i vladar ima granice koje je sam postavio.", "iz_udzbenika": {"strana": 33, "odeljak": "Iz istorijskih izvora", "tekst": "Sudije sude po pravdi i Zakoniku, a ne iz straha od cara."}, "lekcija": 6}]}, {"naslov": "6. Društveno uređenje srednjovekovne Srbije i njen dalji privredni uspon", "zadaci": [{"id": "l06-izbor-bastina", "vrsta": "izbor", "tezina": "lako", "pojmovi": ["bastina"], "pitanje": "Šta je baština?", "odgovori": [{"tekst": "nasledno imanje koje ostaje u porodici feudalca", "tacan": true}, {"tekst": "imanje koje se ima samo dok traje vojna služba", "tacan": false, "zasto": "To je pronija."}, {"tekst": "mesto na kom vladar boravi", "tacan": false, "zasto": "To je rezidencija."}, {"tekst": "ograda od šiljatih greda", "tacan": false, "zasto": "To je palisada."}], "pomoc": ["Ostaje u porodici.", "Nasleđuje se.", "Iz lekcije: baština je nasledno imanje koje ostaje u porodici feudalca."], "objasnjenje": "Baština je nasledno imanje feudalca.", "iz_udzbenika": {"strana": 32, "odeljak": "Društveno uređenje srednjovekovne Srbije i njen dalji privredni uspon", "tekst": "Baština je nasledno imanje koje ostaje u porodici feudalca."}, "lekcija": 6}, {"id": "l06-izbor-pronija", "vrsta": "izbor", "tezina": "lako", "pojmovi": ["pronija"], "pitanje": "Šta je pronija?", "odgovori": [{"tekst": "uslovno vlasništvo: imanje se koristi dok traje služba u vojsci", "tacan": true}, {"tekst": "nasledno imanje feudalca", "tacan": false, "zasto": "To je baština."}, {"tekst": "zbornik zakona", "tacan": false, "zasto": "To su Zakonik ili krmčija; pronija je vrsta imanja."}, {"tekst": "manastirski pravilnik", "tacan": false, "zasto": "To je tipik."}], "pomoc": ["Povezana je sa vojnom službom.", "Ne nasleđuje se bez uslova.", "Iz lekcije: pronija je uslovno vlasništvo; vlastelin koristi imanje dok služi u vojsci."], "objasnjenje": "Pronija je imanje koje se koristi samo dok traje vojna služba.", "iz_udzbenika": {"strana": 32, "odeljak": "Društveno uređenje srednjovekovne Srbije i njen dalji privredni uspon", "tekst": "Pronija je uslovno vlasništvo: vlastelin imanje koristi samo dok svom gospodaru služi u vojsci."}, "lekcija": 6}, {"id": "l06-izbor-rezidencija", "vrsta": "izbor", "tezina": "lako", "pojmovi": ["rezidencija"], "pitanje": "Šta je rezidencija?", "odgovori": [{"tekst": "mesto na kom vladar boravi", "tacan": true}, {"tekst": "krupno plemstvo", "tacan": false, "zasto": "Krupno plemstvo su vlastela ili velmože."}, {"tekst": "crkveni pravilnik", "tacan": false, "zasto": "Crkveni pravilnik manastira je tipik."}, {"tekst": "vrsta poreza", "tacan": false, "zasto": "Rezidencija je mesto, a ne porez."}], "pomoc": ["Vezuje se za vladara.", "To je mesto.", "Iz lekcije: rezidencija je mesto na kom vladar boravi."], "objasnjenje": "Rezidencija je mesto boravka vladara.", "iz_udzbenika": {"strana": 33, "odeljak": "Društveno uređenje srednjovekovne Srbije i njen dalji privredni uspon", "tekst": "Rezidencija je mesto na kom vladar boravi."}, "lekcija": 6}, {"id": "l06-izbor-vlastela", "vrsta": "izbor", "tezina": "srednje", "pojmovi": ["vlastela", "velmoze", "vlastelicici", "vojnici"], "pitanje": "Kako se zvalo krupno plemstvo u srednjovekovnoj Srbiji? (više tačnih)", "odgovori": [{"tekst": "vlastela", "tacan": true}, {"tekst": "velmože", "tacan": true}, {"tekst": "vlasteličići", "tacan": false, "zasto": "Vlasteličići su srednje i sitno plemstvo, sa malim imanjima."}, {"tekst": "vojnici", "tacan": false, "zasto": "I vojnici spadaju u srednje i sitno plemstvo."}], "pomoc": ["Pazi na umanjenicu vlasteličići.", "Dva naziva su tačna.", "Iz lekcije: krupno se zvalo vlastela ili velmože."], "objasnjenje": "Krupno plemstvo su vlastela ili velmože, a sitnije su vlasteličići i vojnici.", "iz_udzbenika": {"strana": 33, "odeljak": "Društveno uređenje srednjovekovne Srbije i njen dalji privredni uspon", "tekst": "Krupno plemstvo se zvalo vlastela ili velmože, a srednje i sitno vlasteličići i vojnici."}, "lekcija": 6}, {"id": "l06-izbor-ko-veliki-posed", "vrsta": "izbor", "tezina": "srednje", "pojmovi": ["vlastela"], "pitanje": "Ko je, osim krupnog plemstva, imao veliko zemljište? (više tačnih)", "odgovori": [{"tekst": "manastiri", "tacan": true}, {"tekst": "crkveni velikodostojnici", "tacan": true}, {"tekst": "zavisni seljaci", "tacan": false, "zasto": "Oni su radili na tuđim i svojoj zemlji, a nisu imali velike posede."}, {"tekst": "Sasi", "tacan": false, "zasto": "Sasi su rudari; knjiga ih ne navodi kao zemljoposednike."}], "pomoc": ["Pomisli na crkvu.", "Dva odgovora su tačna.", "Iz lekcije: veliko zemljište imali su i manastiri i crkveni velikodostojnici."], "objasnjenje": "Pored vlastele, velike posede imali su manastiri i crkveni velikodostojnici.", "iz_udzbenika": {"strana": 33, "odeljak": "Društveno uređenje srednjovekovne Srbije i njen dalji privredni uspon", "tekst": "Veliko zemljište imali su i manastiri i crkveni velikodostojnici."}, "lekcija": 6}, {"id": "l06-izbor-pretnje", "vrsta": "izbor", "tezina": "srednje", "pojmovi": ["osmanlije"], "pitanje": "Šta je ugrožavalo državu u drugoj polovini XIV veka? (više tačnih)", "odgovori": [{"tekst": "sve moćniji oblasni gospodari", "tacan": true}, {"tekst": "početak osmanlijskih osvajanja Balkana", "tacan": true}, {"tekst": "gašenje rudnika zbog odlaska Sasa", "tacan": false, "zasto": "Knjiga to ne navodi."}, {"tekst": "krstaši iz zapadne Evrope", "tacan": false, "zasto": "Krstaši su pretnja XIII veka i prethodne lekcije."}], "pomoc": ["Jedna pretnja je iznutra, druga spolja.", "Dva odgovora su tačna.", "Iz lekcije: državu ugrožavaju oblasni gospodari i početak osvajanja Balkana od strane Turaka Osmanlija."], "objasnjenje": "Unutrašnja pretnja su oblasni gospodari, a spoljna Osmanlije.", "iz_udzbenika": {"strana": 33, "odeljak": "Društveno uređenje srednjovekovne Srbije i njen dalji privredni uspon", "tekst": "U drugoj polovini XIV veka državu ugrožavaju oblasni gospodari i Turci Osmanlije."}, "osa": {"naziv": "Početak osmanlijskih osvajanja Balkana", "od": 1350, "do": 1400, "traka": "dogadjaji", "oznaka": "druga polovina XIV veka"}, "lekcija": 6}, {"id": "l06-izbor-vladar-putuje", "vrsta": "izbor", "tezina": "tesko", "pojmovi": ["rezidencija"], "pitanje": "Zašto srednjovekovni vladar nije sedeo na jednom mestu?", "odgovori": [{"tekst": "Podanici je trebalo da ga vide, pa je stalno obilazio svoje oblasti", "tacan": true}, {"tekst": "Bežao je od Sasa", "tacan": false, "zasto": "Sasi su rudari, a ne neprijatelji."}, {"tekst": "Nije imao ni jedne kuće", "tacan": false, "zasto": "Imao je dvorove; razlog je što je trebalo da se pokaže podanicima."}, {"tekst": "Bio je monah na hodočašću", "tacan": false, "zasto": "Razlog nije verski, nego upravljanje državom."}], "pomoc": ["Pomisli kako podanici znaju za vladara.", "Pratila ga je kancelarija.", "Iz lekcije: da bi ga podanici videli, stalno je obilazio svoje oblasti."], "objasnjenje": "Vladar se pokazivao podanicima i usput vladao.", "iz_udzbenika": {"strana": 33, "odeljak": "Društveno uređenje srednjovekovne Srbije i njen dalji privredni uspon", "tekst": "Da bi ga podanici videli, vladar je stalno obilazio svoje oblasti."}, "lekcija": 6}, {"id": "l06-tn-kancelarija", "vrsta": "tacno_netacno", "tezina": "lako", "pojmovi": ["rezidencija"], "tvrdnja": "Vladara je na putovanjima pratila dvorska kancelarija, koja je sudila i pregovarala.", "tacno": true, "pomoc": ["Država je putovala sa vladarom.", "Iz lekcije: pratila ga je dvorska kancelarija koja je sudila i pregovarala."], "objasnjenje": "Tačno. Kancelarija je putovala sa vladarom.", "iz_udzbenika": {"strana": 33, "odeljak": "Društveno uređenje srednjovekovne Srbije i njen dalji privredni uspon", "tekst": "Pratila ga je dvorska kancelarija koja je sudila i pregovarala."}, "lekcija": 6}, {"id": "l06-tn-zavisni-svoju", "vrsta": "tacno_netacno", "tezina": "lako", "pojmovi": ["zavisni-seljaci"], "tvrdnja": "Zavisni seljaci su obrađivali samo svoju zemlju.", "tacno": false, "ispravke": [{"tekst": "Obrađivali su svoju zemlju, ali i posede svojih feudalnih gospodara.", "tacan": true}, {"tekst": "Obrađivali su samo manastirsku zemlju.", "tacan": false, "zasto": "Obrađivali su i svoju i gospodarevu zemlju."}, {"tekst": "Nisu obrađivali zemlju, nego kopali srebro.", "tacan": false, "zasto": "Rudnike su otvarali Sasi; seljaci su radili zemlju."}], "pomoc": ["Pazi na reč samo.", "Šta znači reč zavisni?", "Iz lekcije: obrađivali su svoju zemlju, ali i posede svojih gospodara."], "objasnjenje": "Netačno. Radili su i svoju i gospodarevu zemlju.", "iz_udzbenika": {"strana": 33, "odeljak": "Društveno uređenje srednjovekovne Srbije i njen dalji privredni uspon", "tekst": "Zavisni seljaci obrađivali su svoju zemlju, ali i posede svojih feudalnih gospodara.", "slika": "06-uspon-srbije-xiii-xiv-vek/07-poljoprivredni-radovi.jpg"}, "lekcija": 6}, {"id": "l06-tn-rezidencije", "vrsta": "tacno_netacno", "tezina": "srednje", "pojmovi": ["rezidencija", "kralj-milutin"], "tvrdnja": "Stalne rezidencije u Srbiji nastaju tek pod Milutinom.", "tacno": true, "pomoc": ["Isti kralj je uveo raskoš.", "Iz lekcije: stalne rezidencije u Srbiji nastaju tek pod Milutinom."], "objasnjenje": "Tačno. Do tada je vladar stalno putovao.", "iz_udzbenika": {"strana": 33, "odeljak": "Društveno uređenje srednjovekovne Srbije i njen dalji privredni uspon", "tekst": "Stalne rezidencije u Srbiji nastaju tek pod Milutinom."}, "lekcija": 6}, {"id": "l06-tn-pronija-nasledna", "vrsta": "tacno_netacno", "tezina": "srednje", "pojmovi": ["pronija", "bastina"], "tvrdnja": "Pronija se bezuslovno nasleđuje u porodici feudalca.", "tacno": false, "ispravke": [{"tekst": "Bezuslovno se nasleđuje baština, a pronija se ima dok traje vojna služba.", "tacan": true}, {"tekst": "Pronija se daje samo manastirima.", "tacan": false, "zasto": "Proniju koristi vlastelin dok služi u vojsci."}, {"tekst": "Pronija je isto što i baština.", "tacan": false, "zasto": "Baština je nasledna, a pronija uslovna."}], "pomoc": ["Dva pojma lako se mešaju.", "Povezana je sa vojskom.", "Iz lekcije: baština je nasledna, a pronija uslovna."], "objasnjenje": "Netačno. Nasledna je baština, a pronija zavisi od vojne službe.", "iz_udzbenika": {"strana": 32, "odeljak": "Društveno uređenje srednjovekovne Srbije i njen dalji privredni uspon", "tekst": "Baština je nasledno imanje, a pronija uslovno vlasništvo."}, "lekcija": 6}, {"id": "l06-tn-grupe-zavisnih", "vrsta": "tacno_netacno", "tezina": "srednje", "pojmovi": ["zavisni-seljaci"], "tvrdnja": "Zavisno stanovništvo bilo je podeljeno na nekoliko grupa sa tačno utvrđenim dužnostima.", "tacno": true, "pomoc": ["Svaka grupa je imala svoje obaveze.", "Iz lekcije: zavisno stanovništvo bilo je razvrstano u nekoliko grupa sa tačno utvrđenim dužnostima."], "objasnjenje": "Tačno. Dužnosti su bile tačno određene.", "iz_udzbenika": {"strana": 33, "odeljak": "Društveno uređenje srednjovekovne Srbije i njen dalji privredni uspon", "tekst": "Zavisno stanovništvo bilo je razvrstano u nekoliko grupa sa tačno utvrđenim dužnostima."}, "lekcija": 6}, {"id": "l06-tn-plemstvo-posedi", "vrsta": "tacno_netacno", "tezina": "tesko", "pojmovi": ["feudalno-drustvo", "vlastelicici", "vlastela"], "tvrdnja": "Svi plemići u srednjovekovnoj Srbiji imali su jednako velike posede.", "tacno": false, "ispravke": [{"tekst": "Krupno plemstvo imalo je prostrane posede, a srednje i sitno mala imanja.", "tacan": true}, {"tekst": "Plemići nisu imali zemlju.", "tacan": false, "zasto": "Upravo je zemlja osnova njihovog položaja."}, {"tekst": "Veće posede imali su vlasteličići nego vlastela.", "tacan": false, "zasto": "Obrnuto je: vlastela ima prostrane posede."}], "pomoc": ["Plemstvo je bilo podeljeno.", "Pazi na reč svi.", "Iz lekcije: krupno plemstvo imalo je prostrane posede, a srednje i sitno mala imanja."], "objasnjenje": "Netačno. Plemstvo je bilo podeljeno i po veličini poseda.", "iz_udzbenika": {"strana": 33, "odeljak": "Društveno uređenje srednjovekovne Srbije i njen dalji privredni uspon", "tekst": "Krupno plemstvo imalo je prostrane posede, a srednje i sitno mala imanja."}, "lekcija": 6}, {"id": "l06-dopuni-seljaci-tesko", "vrsta": "dopuni", "tezina": "tesko", "pojmovi": ["zavisni-seljaci", "feudalno-drustvo"], "pitanje": "Dopuni rečenicu (bez ponuđenih reči).", "tekst": "Od XII do XIV veka u Srbiji se razvija {{feudalno}} društvo, a na velikim posedima rade {{zavisni}} seljaci.", "pomoc": ["Društvo se zove po feudalcima.", "Seljaci nisu slobodni.", "Iz lekcije: feudalno društvo; zavisni seljaci."], "objasnjenje": "U feudalnom društvu zavisni seljaci rade na posedima.", "iz_udzbenika": {"strana": 32, "odeljak": "Društveno uređenje srednjovekovne Srbije i njen dalji privredni uspon", "tekst": "Razvija se feudalno društvo: nastaju veliki posedi na kojima rade zavisni seljaci."}, "lekcija": 6}, {"id": "l06-povezi-drustvo", "vrsta": "povezi", "tezina": "lako", "pojmovi": ["vlastela", "vlastelicici", "zavisni-seljaci", "bastina"], "pitanje": "Poveži grupu ili pojam sa objašnjenjem.", "parovi": [["vlastela", "krupno plemstvo sa prostranim posedima"], ["vlasteličići", "srednje i sitno plemstvo sa malim imanjima"], ["zavisni seljaci", "obrađivali su i svoju i gospodarevu zemlju"], ["baština", "nasledno imanje"]], "pomoc": ["Vlasteličići su manji od vlastele.", "Baština je imanje, a ne grupa.", "Iz lekcije: vlastela, vlasteličići, zavisni seljaci i baština."], "objasnjenje": "Tako izgleda feudalni poredak od vrha do dna, sa posedom kao osnovom.", "iz_udzbenika": {"strana": 33, "odeljak": "Društveno uređenje srednjovekovne Srbije i njen dalji privredni uspon", "tekst": "Plemstvo je bilo podeljeno, a zavisni seljaci obrađivali su zemlju."}, "lekcija": 6}, {"id": "l06-povezi-tesko-pojam-primer", "vrsta": "povezi", "tezina": "tesko", "pojmovi": ["pronija", "bastina", "rezidencija", "ktitor"], "pitanje": "Poveži primer iz života sa pojmom koji mu odgovara.", "parovi": [["Vlastelin gubi imanje kad prestane da služi u vojsci.", "pronija"], ["Unuk nasleđuje imanje svog dede vlastelina.", "baština"], ["Kralj više ne putuje stalno, nego ima mesto gde boravi.", "rezidencija"], ["Vlastelin podiže manastir i brine o njemu.", "ktitor"]], "pomoc": ["Pitaj se šta je uslov, a šta nasleđe.", "Mesto boravka je rezidencija.", "Iz lekcije: pronija je uslovna, baština nasledna, rezidencija mesto boravka, ktitor podiže manastir."], "objasnjenje": "Primena pojmova na nove primere proverava razumevanje.", "iz_udzbenika": {"strana": 32, "odeljak": "Društveno uređenje srednjovekovne Srbije i njen dalji privredni uspon", "tekst": "Pronija je uslovna, a baština nasledna; rezidencija je mesto boravka vladara."}, "lekcija": 6}, {"id": "l06-zakljuci-pronija-svrha", "vrsta": "zakljuci", "tezina": "lako", "pojmovi": ["pronija"], "pitanje": "Šta je vladar dobijao time što je davao proniju?", "odgovori": [{"tekst": "Vojnu službu vlastelina", "tacan": true}, {"tekst": "Trgovce iz Dubrovnika", "tacan": false, "zasto": "Pronija je vezana za vojnu službu."}, {"tekst": "Nove rudnike", "tacan": false, "zasto": "Rudnike otvaraju Sasi, a pronija je zemljišni posed."}, {"tekst": "Crkvenu samostalnost", "tacan": false, "zasto": "To je 1219. i Sava."}], "pomoc": ["Korak 1: Pod kojim uslovom se koristi pronija?", "Korak 2: Šta time dobija gospodar?", "Iz lekcije: vlastelin imanje koristi dok svom gospodaru služi u vojsci."], "objasnjenje": "Imanje je plata za vojnu službu.", "iz_udzbenika": {"strana": 32, "odeljak": "Društveno uređenje srednjovekovne Srbije i njen dalji privredni uspon", "tekst": "Vlastelin imanje koristi samo dok svom gospodaru služi u vojsci."}, "lekcija": 6}, {"id": "l06-zakljuci-bastina-vs-pronija", "vrsta": "zakljuci", "tezina": "srednje", "pojmovi": ["bastina", "pronija", "vlastela"], "pitanje": "Šta bi vlastelin radije imao, baštinu ili proniju, i zašto?", "odgovori": [{"tekst": "Baštinu, jer ostaje porodici bez uslova vojne službe", "tacan": true}, {"tekst": "Proniju, jer se ona nasleđuje zauvek", "tacan": false, "zasto": "Nasleđuje se baština, a pronija zavisi od službe."}, {"tekst": "Svejedno je, jer su iste", "tacan": false, "zasto": "Razlika je upravo u nasleđivanju."}, {"tekst": "Nijednu, jer plemići nisu imali imanja", "tacan": false, "zasto": "Plemstvo je imalo imanja."}], "pomoc": ["Korak 1: Koje imanje zavisi od uslova?", "Korak 2: Koje je sigurnije za porodicu?", "Iz lekcije: baština ostaje u porodici, a pronija se koristi samo dok traje služba."], "objasnjenje": "Baština je sigurnija, jer ne zavisi od službe.", "iz_udzbenika": {"strana": 32, "odeljak": "Društveno uređenje srednjovekovne Srbije i njen dalji privredni uspon", "tekst": "Baština ostaje u porodici, a pronija se koristi samo dok traje vojna služba."}, "lekcija": 6}, {"id": "l06-zakljuci-oblasni", "vrsta": "zakljuci", "tezina": "tesko", "pojmovi": ["vlastela", "osmanlije"], "pitanje": "Dušan je krupnom plemstvu davao velike oblasti na upravu. Kako je to moglo da doprinese opasnosti u drugoj polovini XIV veka?", "odgovori": [{"tekst": "Plemići sa velikim oblastima mogli su da postanu moćni oblasni gospodari", "tacan": true}, {"tekst": "Time su Osmanlije postali srpski plemići", "tacan": false, "zasto": "Osmanlije su spoljni osvajači."}, {"tekst": "Time je ukinuto plemstvo", "tacan": false, "zasto": "Naprotiv, plemstvo je jačalo."}, {"tekst": "Time su seljaci dobili vlast", "tacan": false, "zasto": "Oni su ostali zavisni."}], "pomoc": ["Korak 1: Ko je dobijao oblasti?", "Korak 2: Ko ugrožava državu posle?", "Iz lekcije: krupno plemstvo dobija velike oblasti; kasnije državu ugrožavaju moćni oblasni gospodari."], "objasnjenje": "Veća vlast plemića u oblastima može da preraste u samostalnu moć.", "iz_udzbenika": {"strana": 33, "odeljak": "Društveno uređenje srednjovekovne Srbije i njen dalji privredni uspon", "tekst": "U drugoj polovini XIV veka državu ugrožavaju sve moćniji oblasni gospodari."}, "lekcija": 6}, {"id": "l06-lanac-vladar-putuje", "vrsta": "lanac", "tezina": "lako", "pojmovi": ["rezidencija"], "karike": ["Vladar mora da se pokaže podanicima", "?", "Rezidencije se javljaju tek pod Milutinom"], "praznina": 1, "odgovori": [{"tekst": "Stalno putuje po svojim oblastima", "tacan": true}, {"tekst": "Stalno sedi u Rasu", "tacan": false, "zasto": "Tada podanici ne bi mogli da ga vide; on je putovao."}, {"tekst": "Šalje najamnike umesto sebe", "tacan": false, "zasto": "Knjiga to ne navodi."}], "pomoc": ["Korak 1: Kako da ga vide?", "Korak 2: Šta to govori o stalnom boravištu?", "Iz lekcije: vladar mora da se pokaže podanicima → stalno putovanje, a rezidencije tek od Milutina."], "objasnjenje": "Pre Milutina vladar je stalno putovao.", "iz_udzbenika": {"strana": 33, "odeljak": "Uzrok → posledica", "tekst": "Vladar mora da se pokaže podanicima, pa stalno putuje, a rezidencije se javljaju tek od Milutina."}, "lekcija": 6}, {"id": "l06-lanac-kraj", "vrsta": "lanac", "tezina": "tesko", "pojmovi": ["car-dusan", "osmanlije"], "karike": ["Država je na vrhuncu pod Dušanom", "Dušan iznenada umire", "?", "Društvo je ugroženo u drugoj polovini XIV veka"], "praznina": 2, "odgovori": [{"tekst": "Jačaju oblasni gospodari, a Osmanlije počinju osvajanja", "tacan": true}, {"tekst": "Sasi preuzimaju presto", "tacan": false, "zasto": "Sasi su rudari."}, {"tekst": "Uroš Nejaki osvaja Carigrad", "tacan": false, "zasto": "Knjiga to ne navodi."}], "pomoc": ["Korak 1: Ko je iznutra jačao?", "Korak 2: Ko dolazi spolja?", "Iz lekcije: sve moćniji oblasni gospodari i osmanlijska osvajanja → ugroženo društvo."], "objasnjenje": "Pretnje su i unutrašnje i spoljne.", "iz_udzbenika": {"strana": 33, "odeljak": "Uzrok → posledica", "tekst": "Sve moćniji oblasni gospodari i osmanlijska osvajanja ugrožavaju društvo u drugoj polovini XIV veka."}, "lekcija": 6}, {"id": "l06-izvor-seljaci", "vrsta": "izvor", "slika_u_pitanju": true, "tezina": "lako", "pojmovi": ["zavisni-seljaci", "feudalno-drustvo"], "izvor": {"autor": "Ilustracija iz udžbenika", "naslov": "Poljoprivredni radovi (opis slike)", "tekst": "Tri sličice jedna do druge: seljak ore plugom koji vuku dva vola, drugi nosi kosu ili srp, treći kosi žito.", "napomena": "Odlomak je prepričan; udžbenik, str. 33."}, "pitanje": "Koja društvena grupa je prikazana na ovoj ilustraciji?", "odgovori": [{"tekst": "zavisni seljaci", "tacan": true}, {"tekst": "vlastela", "tacan": false, "zasto": "Vlastela poseduje zemlju, a ne ore je."}, {"tekst": "najamnici", "tacan": false, "zasto": "Najamnici su vojnici."}, {"tekst": "monasi", "tacan": false, "zasto": "Knjiga kaže da je to posao zavisnih seljaka."}], "pomoc": ["Ko je obrađivao zemlju?", "Oni su radili i na tuđim posedima.", "Iz lekcije: zavisni seljaci obrađivali su svoju zemlju i posede gospodara."], "objasnjenje": "Ilustracija prikazuje rad zavisnih seljaka.", "iz_udzbenika": {"strana": 33, "odeljak": "Društveno uređenje srednjovekovne Srbije i njen dalji privredni uspon", "tekst": "Slika 32 prikazuje poljoprivredne radove.", "slika": "06-uspon-srbije-xiii-xiv-vek/07-poljoprivredni-radovi.jpg"}, "lekcija": 6}, {"id": "l06-izvor-novac-tesko", "vrsta": "izvor", "slika_u_pitanju": true, "tezina": "tesko", "pojmovi": ["rudarstvo", "srebro", "feudalno-drustvo"], "izvor": {"autor": "Fotografija iz udžbenika", "naslov": "Srednjovekovni srpski novac (opis slike)", "tekst": "Na novcu je vladar koji sedi na prestolu, a po obodu je natpis. Knjiga ne kaže čiji je novac.", "napomena": "Odlomak je prepričan; udžbenik, str. 33."}, "pitanje": "Šta, zajedno sa znanjem iz lekcije, može da nam kaže ovakav novac o državi, a šta ne može?", "odgovori": [{"tekst": "Svedoči o razvijenoj privredi i trgovini, ali ne možemo reći čiji je bez dodatnih podataka", "tacan": true}, {"tekst": "Sigurno je Dušanov novac iz 1349.", "tacan": false, "zasto": "Knjiga ne kaže čiji je novac."}, {"tekst": "Dokazuje da su vladari bili bogumili", "tacan": false, "zasto": "Novac o tome ne svedoči."}, {"tekst": "Dokazuje da nije bilo trgovine", "tacan": false, "zasto": "Baš suprotno: novac služi trgovini."}], "pomoc": ["Korak: šta na novcu sigurno vidimo?", "Šta nam knjiga ne kaže o tom novcu?", "Iz lekcije: uz rudarstvo razvijaju se trgovi i gradovi; knjiga ne navodi čiji je novac."], "objasnjenje": "Dobar čitalac izvora razdvaja ono što se vidi od onoga što je pretpostavka.", "iz_udzbenika": {"strana": 33, "odeljak": "Društveno uređenje srednjovekovne Srbije i njen dalji privredni uspon", "tekst": "Slika 31 prikazuje srpski novac, a knjiga ne kaže čiji je.", "slika": "06-uspon-srbije-xiii-xiv-vek/06-srednjovekovni-srpski-novac.jpg"}, "lekcija": 6}, {"id": "l06-uporedi-bastina-pronija", "vrsta": "uporedi", "tezina": "lako", "pojmovi": ["bastina", "pronija"], "a": "Baština", "b": "Pronija", "pitanje": "Na šta se tvrdnja odnosi: baštinu, proniju, oba ili nijedno?", "tvrdnje": [{"tekst": "Nasleđuje se u porodici feudalca.", "odgovor": "a", "zasto": "To je baština."}, {"tekst": "Koristi se dok traje vojna služba.", "odgovor": "b", "zasto": "To je pronija."}, {"tekst": "To je uslovno vlasništvo.", "odgovor": "b", "zasto": "Uslov je vojna služba."}, {"tekst": "To je feudalni posed na kome rade zavisni seljaci.", "odgovor": "oba", "zasto": "Knjiga navodi oba kao feudalne posede."}, {"tekst": "To je ograda dvora.", "odgovor": "nijedan", "zasto": "To je palisada."}], "pomoc": ["Baština je sigurna, pronija uslovna.", "Oba su imanja.", "Iz lekcije: baština nasledna, pronija dok traje služba."], "objasnjenje": "Razlika je u uslovu: nasleđe protiv vojne službe.", "iz_udzbenika": {"strana": 32, "odeljak": "Društveno uređenje srednjovekovne Srbije i njen dalji privredni uspon", "tekst": "Baština je nasledno imanje, a pronija uslovno vlasništvo."}, "lekcija": 6}, {"id": "l06-uporedi-krupno-sitno", "vrsta": "uporedi", "tezina": "srednje", "pojmovi": ["vlastela", "vlastelicici"], "a": "Vlastela", "b": "Vlasteličići", "pitanje": "Na koga se tvrdnja odnosi: vlastelu, vlasteličiće, obe grupe ili nijednu?", "tvrdnje": [{"tekst": "Imaju prostrane posede.", "odgovor": "a", "zasto": "To je krupno plemstvo."}, {"tekst": "Imaju mala imanja.", "odgovor": "b", "zasto": "To je srednje i sitno plemstvo."}, {"tekst": "Zovu se i velmože.", "odgovor": "a", "zasto": "Velmože je drugi naziv za krupno plemstvo."}, {"tekst": "Pripadaju plemstvu.", "odgovor": "oba", "zasto": "Obe grupe su plemstvo."}, {"tekst": "Obrađuju posede feudalnih gospodara.", "odgovor": "nijedan", "zasto": "To rade zavisni seljaci."}], "pomoc": ["Vlasteličići su umanjenica.", "Plemstvo ne ore.", "Iz lekcije: krupno plemstvo je vlastela, a srednje i sitno vlasteličići i vojnici."], "objasnjenje": "Plemstvo je slojevito: krupno i sitno.", "iz_udzbenika": {"strana": 33, "odeljak": "Društveno uređenje srednjovekovne Srbije i njen dalji privredni uspon", "tekst": "Plemstvo je bilo podeljeno na krupno i na srednje i sitno."}, "lekcija": 6}, {"id": "l06-objasni-bastina-pronija", "vrsta": "objasni", "tezina": "lako", "pojmovi": ["bastina", "pronija"], "pitanje": "Šta je baština, a šta pronija?", "uzor": "Baština je nasledno imanje koje ostaje u porodici feudalca. Pronija je uslovno vlasništvo: vlastelin imanje koristi samo dok svom gospodaru služi u vojsci.", "ideje": ["Baština je nasledna.", "Pronija je uslovna.", "Uslov je vojna služba."], "objasnjenje": "Ovo je pitanje iz udžbenika sa str. 33.", "iz_udzbenika": {"strana": 33, "odeljak": "Pitanja za razmišljanje / Zadaci iz udžbenika", "tekst": "Baština je nasledni posed, a pronija posed koji se ima samo dok traje vojna služba."}, "lekcija": 6}, {"id": "l06-objasni-feudalno-drustvo", "vrsta": "objasni", "tezina": "srednje", "pojmovi": ["feudalno-drustvo", "vlastela", "zavisni-seljaci"], "pitanje": "Opiši kako je bilo uređeno feudalno društvo u srednjovekovnoj Srbiji.", "uzor": "Na vrhu je bilo krupno plemstvo, vlastela ili velmože, sa velikim posedima, a ispod srednje i sitno plemstvo. Velike posede imala je i crkva. Na dnu su bili zavisni seljaci, koji su obrađivali svoju zemlju i posede gospodara.", "ideje": ["Krupno plemstvo: vlastela ili velmože.", "Srednje i sitno plemstvo.", "Crkva ima velike posede.", "Zavisni seljaci rade i svoju i gospodarevu zemlju."], "objasnjenje": "Treba pokazati slojeve od vrha do dna.", "iz_udzbenika": {"strana": 33, "odeljak": "Društveno uređenje srednjovekovne Srbije i njen dalji privredni uspon", "tekst": "Plemstvo je bilo podeljeno, a zavisni seljaci obrađivali su zemlju."}, "lekcija": 6}]}, {"naslov": "10. Slabljenje balkanskih država u drugoj polovini XIV veka", "zadaci": [{"id": "l10-lazar-sediste-izbor", "vrsta": "izbor", "tezina": "lako", "pojmovi": ["knez-lazar", "krusevac"], "pitanje": "Gde je bilo sedište kneza Lazara?", "odgovori": [{"tekst": "U Kruševcu", "tacan": true}, {"tekst": "U Solunu", "tacan": false, "zasto": "Solun je grad koji su Turci osvojili 1387. godine; nije bio Lazarevo sedište."}, {"tekst": "U Zeti", "tacan": false, "zasto": "Zeta je stara srpska oblast u kojoj su najjači bili Balšići, a ne Lazar."}, {"tekst": "U Epiru", "tacan": false, "zasto": "Epir je daleki jug, gde su se plemići među prvima osamostalili; Lazar je vladao severnije."}], "pomoc": ["Traži grad u oblasti između Dunava i Kosova.", "Naziv grada počinje slovom K.", "Iz lekcije: sedište kneza Lazara bilo je u Kruševcu."], "objasnjenje": "Lazar je iz Kruševca vladao prostorom od Dunava na severu do Kosova na jugu.", "iz_udzbenika": {"strana": 41, "odeljak": "Slabljenje balkanskih država u drugoj polovini XIV veka", "tekst": "Knez Lazar je bio najistaknutiji oblasni gospodar, a sedište mu je bilo u Kruševcu.", "slika": "10-borba-protiv-turaka-osmanlija/02-knez-lazar-i-knjeginja-milica.jpg"}, "lekcija": 10}, {"id": "l10-balsici-zeta-izbor", "vrsta": "izbor", "tezina": "lako", "pojmovi": ["balsici", "zeta"], "pitanje": "Koja je porodica bila najjača u Zeti?", "odgovori": [{"tekst": "Balšići", "tacan": true}, {"tekst": "Mrnjavčevići", "tacan": false, "zasto": "Braća Mrnjavčević izdvojila su se u Makedoniji, ne u Zeti."}, {"tekst": "Nemanjići", "tacan": false, "zasto": "Nemanjić je bio car Uroš, a Zeta se odvajala upravo od njegove centralne vlasti."}, {"tekst": "Brankovići", "tacan": false, "zasto": "Vuk Branković se pominje među velikašima, ali lekcija u Zeti ističe Balšiće."}], "pomoc": ["Zeta je stara srpska oblast.", "Prezime počinje na B, ali nije Branković.", "Iz lekcije: u Zeti su najjači bili Balšići."], "objasnjenje": "Osamostaljivanje se sa dalekog juga proširilo i na stare srpske oblasti, pa su u Zeti vlast držali Balšići.", "iz_udzbenika": {"strana": 41, "odeljak": "Slabljenje balkanskih država u drugoj polovini XIV veka", "tekst": "Velikaši se osamostaljuju i u starim srpskim oblastima, na primer u Zeti, gde su najjači Balšići."}, "lekcija": 10}, {"id": "l10-mrnjavcevici-makedonija-izbor", "vrsta": "izbor", "tezina": "lako", "pojmovi": ["mrnjavcevici", "kralj-vukasin", "despot-ugljesa"], "pitanje": "U kojoj oblasti su se izdvojila braća Mrnjavčević, Vukašin i Uglješa?", "odgovori": [{"tekst": "U Makedoniji", "tacan": true}, {"tekst": "U Zeti", "tacan": false, "zasto": "Zeta je oblast Balšića."}, {"tekst": "U Bosni", "tacan": false, "zasto": "Bosna je posebna država u kojoj je takođe vladala feudalna anarhija; Mrnjavčevići su bili srpski velikaši."}, {"tekst": "U Epiru", "tacan": false, "zasto": "Epir je daleki jug, gde su se osamostalili drugi plemići."}], "pomoc": ["Seti se gde su Turci posle Marice nametnuli vazalne obaveze.", "To je oblast južno od Kosova.", "Iz lekcije: braća Mrnjavčević izdvojila su se u Makedoniji."], "objasnjenje": "Vukašin i Uglješa bili su moćni velikaši u Makedoniji, zato ih je turski pritisak prve i pogodio.", "iz_udzbenika": {"strana": 41, "odeljak": "Slabljenje balkanskih država u drugoj polovini XIV veka", "tekst": "U Makedoniji se izdvajaju braća Mrnjavčević, Vukašin i Uglješa."}, "lekcija": 10}, {"id": "l10-anarhija-znacenje-izbor", "vrsta": "izbor", "tezina": "lako", "pojmovi": ["anarhija", "feudalna-anarhija"], "pitanje": "Šta je anarhija?", "odgovori": [{"tekst": "Stanje u kome nema zakona i reda, jer ih niko ne sprovodi", "tacan": true}, {"tekst": "Podređenost plemića jačem feudalnom gospodaru", "tacan": false, "zasto": "To opisuje vazala; vazal ima gospodara, dok je anarhija stanje bez reda."}, {"tekst": "Stajaća vojska plaćena doživotno", "tacan": false, "zasto": "To su janičari, turska vojska, a ne stanje u državi."}, {"tekst": "Vlast dvojice vladara u isto vreme", "tacan": false, "zasto": "To bi bilo savladarstvo, kao kod Uroša i Vukašina; anarhija znači da reda uopšte nema."}], "pomoc": ["Reč opisuje stanje u državi, a ne osobu.", "Zamisli zemlju u kojoj zakoni postoje, ali ih niko ne sprovodi.", "Iz lekcije: anarhija je stanje bez zakona i reda, jer ih niko ne sprovodi."], "objasnjenje": "Kada niko ne sprovodi zakone, svaki moćnik radi po svome. Takvo stanje vladalo je i u Bosni.", "iz_udzbenika": {"strana": 41, "odeljak": "Slabljenje balkanskih država u drugoj polovini XIV veka", "tekst": "Anarhija je stanje u kome nema zakona i reda, jer ih niko ne sprovodi."}, "lekcija": 10}, {"id": "l10-osamostaljivanje-prvo-izbor", "vrsta": "izbor", "tezina": "srednje", "pojmovi": ["epir", "tesalija", "car-uros"], "pitanje": "Gde su se plemići pod carem Urošem najpre osamostalili?", "odgovori": [{"tekst": "Na dalekom jugu, u Epiru i Tesaliji", "tacan": true}, {"tekst": "U Zeti i starim srpskim oblastima", "tacan": false, "zasto": "I tamo su se velikaši osamostalili, ali tek posle dalekog juga."}, {"tekst": "U Kruševcu i Braničevu", "tacan": false, "zasto": "To su Lazarevi posedi, a ne prva otcepljena područja."}, {"tekst": "U Trnovu i Vidinu", "tacan": false, "zasto": "To su delovi podeljene Bugarske, ne srpske oblasti."}], "pomoc": ["Razmisli: koje oblasti su najdalje od središta države?", "Te oblasti su na dalekom jugu.", "Iz lekcije: plemići se prvo osamostaljuju u Epiru i Tesaliji, a zatim i u starim srpskim oblastima."], "objasnjenje": "Raspad je krenuo sa dalekog juga, iz Epira i Tesalije, pa se proširio i na stare srpske oblasti poput Zete.", "iz_udzbenika": {"strana": 41, "odeljak": "Slabljenje balkanskih država u drugoj polovini XIV veka", "tekst": "Plemići se prvo osamostaljuju u Epiru i Tesaliji, a zatim i u starim srpskim oblastima."}, "lekcija": 10}, {"id": "l10-lazarevi-posedi-izbor", "vrsta": "izbor", "tezina": "srednje", "pojmovi": ["knez-lazar", "nis", "krusevac"], "pitanje": "Koji su od ovih poseda pripadali knezu Lazaru? (više tačnih)", "odgovori": [{"tekst": "Braničevo", "tacan": true}, {"tekst": "Golubac", "tacan": true}, {"tekst": "Rudnik", "tacan": true}, {"tekst": "Novo Brdo", "tacan": true}, {"tekst": "Zeta", "tacan": false, "zasto": "Zeta je bila oblast Balšića."}, {"tekst": "Tesalija", "tacan": false, "zasto": "Tesalija je na dalekom jugu i među prvima se odvojila; Lazarova vlast je išla od Dunava do Kosova."}, {"tekst": "Solun", "tacan": false, "zasto": "Solun nije među Lazarevim posedima; lekcija ga pominje kao grad koji su Turci osvojili 1387."}], "pomoc": ["Lazareva oblast se prostirala od Dunava do Kosova.", "Odbaci mesta na dalekom jugu i na moru.", "Iz lekcije: pored Kruševca, važni posedi su Braničevo, Golubac, Rudnik, Užice, Niš i Novo Brdo."], "objasnjenje": "Lazarevi najvažniji posedi bili su, pored Kruševca, Braničevo, Golubac, Rudnik, Užice, Niš i Novo Brdo.", "iz_udzbenika": {"strana": 41, "odeljak": "Slabljenje balkanskih država u drugoj polovini XIV veka", "tekst": "Među najvažnijim Lazarevim posedima, pored Kruševca, bili su Braničevo, Golubac, Rudnik, Užice, Niš i Novo Brdo."}, "lekcija": 10}, {"id": "l10-vukasin-savladar-izbor", "vrsta": "izbor", "tezina": "srednje", "pojmovi": ["kralj-vukasin", "car-uros", "mrnjavcevici"], "pitanje": "Kakav je zaista bio položaj kralja Vukašina prema caru Urošu?", "odgovori": [{"tekst": "Bio je krunisan za kralja i savladar, ali se ponašao potpuno nezavisno", "tacan": true}, {"tekst": "Bio je Urošev verni zapovednik bez ikakve sopstvene vlasti", "tacan": false, "zasto": "Vukašin je imao svoju oblast u Makedoniji i ponašao se nezavisno od Uroša."}, {"tekst": "Zbacio je Uroša i sam postao car", "tacan": false, "zasto": "Uroš je ostao car do 1371; Vukašin je bio kralj i savladar."}, {"tekst": "Bio je turski sultan u Makedoniji", "tacan": false, "zasto": "Vukašin je bio srpski velikaš koji je krenuo protiv Osmanlija na Maricu; sultan je bio Murat."}], "pomoc": ["Titula i stvarna moć ne moraju da se poklapaju.", "Formalno je delio vlast sa carem, ali da li ga je slušao?", "Iz lekcije: Vukašin je krunisan za kralja i bio je savladar, ali se ponašao potpuno nezavisno."], "objasnjenje": "Vukašin je primer raspada vlasti: na papiru savladar, u stvari samostalan gospodar.", "iz_udzbenika": {"strana": 41, "odeljak": "Slabljenje balkanskih država u drugoj polovini XIV veka", "tekst": "Vukašin je krunisan za kralja i bio je savladar cara Uroša, ali se ponašao potpuno nezavisno.", "slika": "10-borba-protiv-turaka-osmanlija/01-car-uros-i-kralj-vukasin.jpg"}, "lekcija": 10}, {"id": "l10-feudalni-sukobi-tn", "vrsta": "tacno_netacno", "tezina": "lako", "pojmovi": ["feudalizam", "osmanlije"], "tvrdnja": "Feudalni sukobi na Balkanu olakšali su tursko osvajanje.", "tacno": true, "pomoc": ["Da li je lakše osvojiti složnu ili podeljenu zemlju?", "Iz lekcije: feudalni sukobi su u velikoj meri olakšali tursko osvajanje."], "objasnjenje": "Tačno. Takvi sukobi su bili uobičajeni u srednjem veku, a ovde su Turcima otvorili put.", "iz_udzbenika": {"strana": 41, "odeljak": "Uvod", "tekst": "Feudalni sukobi bili su uobičajeni u srednjovekovnim državama, a ovde su u velikoj meri olakšali tursko osvajanje."}, "lekcija": 10}, {"id": "l10-uros-jak-vladar-tn", "vrsta": "tacno_netacno", "tezina": "lako", "pojmovi": ["car-uros", "feudalizam"], "tvrdnja": "Pod carem Urošem Nemanjićem centralna vlast je ojačala, pa se vlastela nije odvajala.", "tacno": false, "ispravke": [{"tekst": "Pod nejakim Urošem vlastela se odvajala od centralne vlasti.", "tacan": true}, {"tekst": "Pod Urošem je centralna vlast ojačala samo u Epiru i Tesaliji.", "tacan": false, "zasto": "Upravo su se Epir i Tesalija prvi osamostalili."}, {"tekst": "Vlastela se odvajala tek posle Kosovskog boja.", "tacan": false, "zasto": "Odvajanje je počelo znatno ranije, pod Urošem (1355–1371)."}], "pomoc": ["Seti se kakvim su Uroša smatrali savremenici.", "Šta rade velikaši kad je vladar nejak?", "Iz lekcije: vlastela se često odvajala od centralne vlasti, posebno pod nejakim vladarom, kakav je bio Uroš."], "objasnjenje": "Netačno. Slab vladar znači da se moćna vlastela lakše izdvaja, pa se država cepa na oblasti.", "iz_udzbenika": {"strana": 41, "odeljak": "Slabljenje balkanskih država u drugoj polovini XIV veka", "tekst": "U razvijenom feudalizmu vlastela se odvajala od centralne vlasti, a u Srbiji se to dešava pod carem Urošem."}, "osa": {"naziv": "Car Uroš", "od": 1355, "do": 1371, "traka": "vladari"}, "lekcija": 10}, {"id": "l10-bosna-anarhija-tn", "vrsta": "tacno_netacno", "tezina": "lako", "pojmovi": ["bosna", "feudalna-anarhija"], "tvrdnja": "I u Bosni je vladala feudalna anarhija, a velikaši su samostalno držali velike oblasti.", "tacno": true, "pomoc": ["Kriza nije zahvatila samo Srbiju.", "Iz lekcije: Bosna je takođe u feudalnoj anarhiji."], "objasnjenje": "Tačno. Slična slika bila je u Srbiji, Bosni i Bugarskoj: mnogo gospodara i slaba centralna vlast.", "iz_udzbenika": {"strana": 41, "odeljak": "Slabljenje balkanskih država u drugoj polovini XIV veka", "tekst": "I Bosna je u feudalnoj anarhiji, a velikaši samostalno vladaju velikim oblastima."}, "lekcija": 10}, {"id": "l10-bugarska-podela-tn", "vrsta": "tacno_netacno", "tezina": "srednje", "pojmovi": ["bugarska", "trnovsko-carstvo", "vidinsko-carstvo"], "tvrdnja": "Bugarska je dočekala Turke kao jedinstvena i jaka država.", "tacno": false, "ispravke": [{"tekst": "Bugarska je bila podeljena: car je pred smrt razdelio državu na dva dela, a neki delovi su se dalje usitnjavali.", "tacan": true}, {"tekst": "Bugarska je bila podeljena između Srbije i Bosne.", "tacan": false, "zasto": "Državu je podelio sam bugarski car; delovi su bili Trnovsko i Vidinsko carstvo."}, {"tekst": "Bugarska je bila jaka, ali ju je napala Vizantija.", "tacan": false, "zasto": "Bugarska je oslabila unutrašnjom podelom, a pala je pod Turke."}], "pomoc": ["Seti se dva bugarska carstva koja su kasnije pala.", "Koliko je delova bilo?", "Iz lekcije: car pred smrt deli državu na dva dela, a neki se kasnije dalje usitnjavaju."], "objasnjenje": "Netačno. Bugarska je, kao i Srbija, bila podeljena, zato je i pala samo nekoliko godina posle Kosova.", "iz_udzbenika": {"strana": 41, "odeljak": "Slabljenje balkanskih država u drugoj polovini XIV veka", "tekst": "Bugarski car je pred smrt podelio državu na dva dela, a neki delovi su se kasnije usitnjavali."}, "lekcija": 10}, {"id": "l10-lazar-prostor-tn", "vrsta": "tacno_netacno", "tezina": "srednje", "pojmovi": ["knez-lazar"], "tvrdnja": "Vlast kneza Lazara prostirala se od Dunava na severu do Kosova na jugu.", "tacno": true, "pomoc": ["Priseti se najistaknutijeg oblasnog gospodara.", "Iz lekcije: Lazareva vlast se prostire od Dunava do Kosova."], "objasnjenje": "Tačno. Zbog tolikog prostora Lazar je bio najistaknutiji među oblasnim gospodarima.", "iz_udzbenika": {"strana": 41, "odeljak": "Slabljenje balkanskih država u drugoj polovini XIV veka", "tekst": "Lazareva vlast prostirala se od Dunava na severu do Kosova na jugu."}, "lekcija": 10}, {"id": "l10-feudalizam-red-tn", "vrsta": "tacno_netacno", "tezina": "tesko", "pojmovi": ["feudalizam", "knez-lazar", "kralj-vukasin"], "tvrdnja": "Velikaši poput Vukašina i Lazara dobili su moć tek kada su Turci srušili carsku vlast.", "tacno": false, "ispravke": [{"tekst": "Velikaši su jačali zbog slabe centralne vlasti još pre turskih osvajanja u Srbiji.", "tacan": true}, {"tekst": "Velikaše su na vlast postavili Turci kao svoje namesnike.", "tacan": false, "zasto": "Turci su velikašima u Makedoniji nametnuli vazalne obaveze tek posle Marice; oni su već imali svoje oblasti."}, {"tekst": "Velikaši su moć dobili od Vizantije posle Dušanove smrti.", "tacan": false, "zasto": "Oni su jačali unutar srpske države, odvajanjem od slabog cara."}], "pomoc": ["Uporedi vreme: kada je Uroš vladao, a kada je bila Marica?", "Da li su se oblasti već izdvojile pre 1371?", "Iz lekcije: u razvijenom feudalizmu oblasni gospodari jačaju, a vlast cara slabi; Turci stižu do već oslabljenih država."], "objasnjenje": "Netačno. Redosled je obrnut: najpre slabi centralna vlast, pa Turci nailaze na već podeljene države.", "iz_udzbenika": {"strana": 44, "odeljak": "Zapamtite", "tekst": "Turci su stigli do granica hrišćanskih država u razvijenom feudalizmu, kada jačaju oblasni gospodari, a slabi vlast kralja ili cara."}, "lekcija": 10}, {"id": "l10-velikasi-dopuni", "vrsta": "dopuni", "tezina": "lako", "pojmovi": ["balsici", "zeta", "mrnjavcevici", "knez-lazar", "krusevac"], "pitanje": "Dopuni rečenice o srpskim oblasnim gospodarima.", "tekst": "U Zeti su najjači bili {{Balšići}}. U Makedoniji su se izdvojila braća {{Mrnjavčević}}. Najistaknutiji oblasni gospodar bio je knez {{Lazar}}, sa sedištem u {{Kruševcu}}.", "ponudjene": ["Balšići", "Mrnjavčević", "Lazar", "Kruševcu", "Murat", "Solunu"], "pomoc": ["Murat je turski sultan, pa ne spada među srpske velikaše.", "Solun nije bio sedište nijednog od ovih gospodara.", "Iz lekcije: Balšići u Zeti, Mrnjavčevići u Makedoniji, Lazar u Kruševcu."], "objasnjenje": "Svaka oblast imala je svog gospodara: Balšići Zetu, Mrnjavčevići Makedoniju, a Lazar prostor sa sedištem u Kruševcu.", "iz_udzbenika": {"strana": 41, "odeljak": "Slabljenje balkanskih država u drugoj polovini XIV veka", "tekst": "Lekcija navodi Balšiće u Zeti, Mrnjavčeviće u Makedoniji i kneza Lazara sa sedištem u Kruševcu."}, "lekcija": 10}, {"id": "l10-uvod-kriza-dopuni", "vrsta": "dopuni", "tezina": "lako", "pojmovi": ["bosna", "bugarska", "osmanlije"], "pitanje": "Dopuni uvod lekcije.", "tekst": "Srbija, Bosna, Bugarska i Ugarska bile su oslabljene slabom {{centralnom}} vlašću i unutrašnjim borbama kada su počeli upadi {{turskih}} četa na Balkan.", "ponudjene": ["centralnom", "turskih", "crkvenom", "mongolskih"], "pomoc": ["Vlast može biti centralna ili oblasna.", "Mongoli se u lekciji pojavljuju tek kod Angore.", "Iz lekcije: države su bile pogođene slabom centralnom vlašću kada su počeli upadi turskih četa."], "objasnjenje": "Turci su na Balkan stigli u najgorem trenutku za te države, kada su bile razjedinjene.", "iz_udzbenika": {"strana": 41, "odeljak": "Uvod", "tekst": "Srbija, Bosna, Bugarska i Ugarska bile su oslabljene upravo kada su počeli upadi turskih četa."}, "lekcija": 10}, {"id": "l10-lazarevi-gradovi-dopuni", "vrsta": "dopuni", "tezina": "srednje", "pojmovi": ["knez-lazar", "nis", "krusevac"], "pitanje": "Dopuni spisak važnih Lazarevih poseda.", "tekst": "Pored Kruševca, važni Lazarevi posedi bili su {{Braničevo}}, {{Golubac}}, Rudnik, {{Užice}}, Niš i {{Novo Brdo}}.", "ponudjene": ["Braničevo", "Golubac", "Užice", "Novo Brdo", "Cimpe", "Solun"], "pomoc": ["Cimpe je tvrđava koju su zauzeli Turci.", "Solun je Turcima pao 1387. i nije među Lazarevim posedima.", "Iz lekcije: Braničevo, Golubac, Rudnik, Užice, Niš i Novo Brdo."], "objasnjenje": "Ovi posedi pokazuju koliki je prostor držao Lazar, od Dunava do Kosova.", "iz_udzbenika": {"strana": 41, "odeljak": "Slabljenje balkanskih država u drugoj polovini XIV veka", "tekst": "Lekcija navodi Kruševac, Braničevo, Golubac, Rudnik, Užice, Niš i Novo Brdo."}, "lekcija": 10}, {"id": "l10-uros-opis-dopuni", "vrsta": "dopuni", "tezina": "tesko", "pojmovi": ["car-dusan", "car-uros", "epir", "tesalija", "zeta"], "pitanje": "Dopuni bez ponuđenih reči.", "tekst": "Posle smrti cara {{Dušana}} vladao je njegov sin {{Uroš}}. Plemići su se prvo osamostalili u Epiru i {{Tesaliji}}, a zatim i u starim oblastima kao što je {{Zeta}}.", "pomoc": ["Prva praznina je otac, druga sin.", "Daleki jug čine dve oblasti, a u staroj oblasti su jačali Balšići.", "Iz lekcije: Dušan, pa Uroš; Epir i Tesalija, zatim Zeta."], "objasnjenje": "Posle Dušana, pod slabim Urošem, država se raspadala od dalekog juga prema starim oblastima.", "iz_udzbenika": {"strana": 41, "odeljak": "Slabljenje balkanskih država u drugoj polovini XIV veka", "tekst": "Pod Dušanovim sinom Urošem plemići se osamostaljuju u Epiru, Tesaliji i Zeti."}, "lekcija": 10}, {"id": "l10-gospodari-oblasti-povezi", "vrsta": "povezi", "tezina": "lako", "pojmovi": ["balsici", "mrnjavcevici", "knez-lazar", "bosna"], "pitanje": "Poveži gospodare i oblasti u kojima su se isticali.", "parovi": [["Balšići", "Zeta"], ["Braća Mrnjavčević", "Makedonija"], ["Knez Lazar", "Kruševac i prostor od Dunava do Kosova"], ["Samostalni velikaši u feudalnoj anarhiji", "Bosna"]], "pomoc": ["Počni od Lazara, jer je njegovo sedište najpoznatije.", "Balšići su u staroj srpskoj oblasti.", "Iz lekcije: Balšići u Zeti, Mrnjavčevići u Makedoniji, Lazar u Kruševcu, a anarhija i u Bosni."], "objasnjenje": "Uz svakog gospodara ide njegova oblast; svuda je slika ista, slaba centralna vlast i jaki velikaši.", "iz_udzbenika": {"strana": 41, "odeljak": "Slabljenje balkanskih država u drugoj polovini XIV veka", "tekst": "Lekcija navodi oblasne gospodare i prostor na kome su delovali."}, "lekcija": 10}, {"id": "l10-pojmovi-znacenje-povezi", "vrsta": "povezi", "tezina": "srednje", "pojmovi": ["anarhija", "vazal", "janicari", "feudalizam"], "pitanje": "Poveži pojam i njegovo značenje.", "parovi": [["Anarhija", "Nema zakona i reda, jer ih niko ne sprovodi"], ["Vazal", "Plemić podređen jačem gospodaru, kome se zaklinje na vernost"], ["Janičari", "Vojnici plaćeni doživotno, stajaća vojska"], ["Razvijeni feudalizam", "Oblasni gospodari jačaju, a vlast kralja ili cara slabi"]], "pomoc": ["Dva pojma opisuju osobu ili vojnika, dva stanje.", "Zakletva na vernost vezuje se za odnos gospodara i plemića.", "Iz lekcije: anarhija je stanje bez reda, vazal je podređeni plemić, janičari su stajaća vojska."], "objasnjenje": "Ova četiri pojma zajedno objašnjavaju krizu: raspad vlasti s jedne, a tursku organizovanost s druge strane.", "iz_udzbenika": {"strana": 42, "odeljak": "Bitka na Marici 1371.", "tekst": "Vazal je plemić podređen jačem gospodaru i obavezan da mu se zakune na vernost."}, "lekcija": 10}, {"id": "l10-velikasi-titule-povezi", "vrsta": "povezi", "tezina": "tesko", "pojmovi": ["nikola-altomanovic", "knez-lazar", "vuk-brankovic", "kralj-vukasin", "despot-ugljesa"], "pitanje": "Poveži ličnost sa titulom ili odrednicom koju joj daje lekcija.", "parovi": [["Nikola Altomanović", "župan"], ["Lazar Hrebeljanović", "knez"], ["Vukašin Mrnjavčević", "kralj"], ["Uglješa Mrnjavčević", "despot"], ["Vuk Branković", "velikaš"]], "pomoc": ["Jedina krunisana ličnost bila je savladar cara.", "Bratu krunisanog kralja lekcija daje titulu despota.", "Iz lekcije: župan Nikola Altomanović, knez Lazar, kralj Vukašin, despot Uglješa, velikaš Vuk Branković."], "objasnjenje": "Različite titule pokazuju koliko je gospodara bilo: svaki je vladao svojim delom, a jedinstvene vlasti više nije bilo.", "iz_udzbenika": {"strana": 41, "odeljak": "Slabljenje balkanskih država u drugoj polovini XIV veka", "tekst": "Pored Mrnjavčevića, značajni su župan Nikola Altomanović, knez Lazar Hrebeljanović i velikaš Vuk Branković."}, "lekcija": 10}, {"id": "l10-osamostaljivanje-zakljuci", "vrsta": "zakljuci", "tezina": "lako", "pojmovi": ["car-uros", "feudalizam"], "pitanje": "Zašto se vlastela baš pod Urošem počela odvajati od centralne vlasti?", "odgovori": [{"tekst": "Zato što je Uroš bio nejak vladar, a jaka vlastela je to iskoristila", "tacan": true}, {"tekst": "Zato što su to tražili Turci sa Marice", "tacan": false, "zasto": "Odvajanje je počelo pre Marice; Turci su kasnije samo iskoristili podelu."}, {"tekst": "Zato što je Uroš podelio državu sinovima", "tacan": false, "zasto": "Državu je pred smrt podelio bugarski car; u Srbiji su se velikaši sami izdvajali."}, {"tekst": "Zato što je vlastela želela da pomogne Vizantiji", "tacan": false, "zasto": "Velikaši su gledali sopstveni interes, ne Vizantiju."}], "pomoc": ["Korak 1: Kakav je bio Uroš kao vladar?", "Korak 2: Šta velikaš radi kad centralna vlast nema snage da ga obuzda?", "Iz lekcije: vlastela se odvajala posebno pod nejakim vladarom."], "objasnjenje": "U razvijenom feudalizmu vlastela je već bila jaka, a slab vladar joj je dozvolio da se izdvoji.", "iz_udzbenika": {"strana": 41, "odeljak": "Slabljenje balkanskih država u drugoj polovini XIV veka", "tekst": "Vlastela se često odvajala od centralne vlasti, posebno pod nejakim vladarom."}, "lekcija": 10}, {"id": "l10-vukasin-freska-zakljuci", "vrsta": "zakljuci", "slika_u_pitanju": true, "tezina": "srednje", "pojmovi": ["kralj-vukasin", "car-uros"], "pitanje": "Na freski stoje zajedno, kao ravnopravni, car Uroš i kralj Vukašin. Šta to najbolje govori o srpskoj državi tog doba?", "odgovori": [{"tekst": "Car više nije imao vlast iznad moćnog velikaša koji je bio krunisan kao savladar", "tacan": true}, {"tekst": "Uroš je bio Vukašinov vazal, a Vukašin car", "tacan": false, "zasto": "Car je bio Uroš, a Vukašin kralj i savladar; o vazalstvu lekcija govori u vezi sa Turcima."}, {"tekst": "Srbija je tada bila potpuno jedinstvena država", "tacan": false, "zasto": "Baš tada se država cepala na oblasti."}, {"tekst": "Vukašin je bio sultanov namesnik u Srbiji", "tacan": false, "zasto": "Vukašin je bio srpski velikaš koji je krenuo u sukob sa Osmanlijama na Maricu."}], "pomoc": ["Korak 1: Ko je Vukašin bio po tituli?", "Korak 2: Da li se ponašao kao podređen?", "Iz lekcije: Vukašin je bio savladar, ali se ponašao potpuno nezavisno."], "objasnjenje": "Prikaz dvojice vladara jedan pored drugog odgovara stvarnosti u kojoj carska vlast više nije bila jedina.", "iz_udzbenika": {"strana": 41, "odeljak": "Slabljenje balkanskih država u drugoj polovini XIV veka", "tekst": "Freska prikazuje odnos cara Uroša i kralja Vukašina, koji je bio savladar, ali je vladao samostalno.", "slika": "10-borba-protiv-turaka-osmanlija/01-car-uros-i-kralj-vukasin.jpg"}, "lekcija": 10}, {"id": "l10-nesloga-primena-zakljuci", "vrsta": "zakljuci", "tezina": "tesko", "pojmovi": ["feudalizam", "bosna", "bugarska", "osmanlije"], "pitanje": "Zamisli državu čiji se velikaši svađaju, a spolja stiže novi jak neprijatelj. Po iskustvu iz ove lekcije, šta je najverovatnije?", "odgovori": [{"tekst": "Neprijatelj će lakše osvajati, jer svaki velikaš brani samo svoj deo", "tacan": true}, {"tekst": "Velikaši će se odmah i trajno ujediniti pod jednim vladarom", "tacan": false, "zasto": "Kantakuzin opisuje suprotno: neki su čekali da se pridruže pobedniku."}, {"tekst": "Neprijatelj neće smeti da napadne tako veliku državu", "tacan": false, "zasto": "Veličina ne pomaže ako je država podeljena; Turci su napredovali upravo u takvim državama."}, {"tekst": "Država će jačati jer sukobi vežbaju vojsku", "tacan": false, "zasto": "Lekcija kaže suprotno: unutrašnje borbe slabe državu i olakšavaju osvajanje."}], "pomoc": ["Korak 1: Šta je bilo zajedničko Srbiji, Bosni i Bugarskoj?", "Korak 2: Kako su im to Turci iskoristili?", "Iz lekcije: feudalni sukobi su u velikoj meri olakšali tursko osvajanje."], "objasnjenje": "Zajedničko pravilo lekcije: nesloga u državi je prednost za spoljnog osvajača.", "iz_udzbenika": {"strana": 41, "odeljak": "Uvod", "tekst": "Unutrašnji sukobi su u velikoj meri olakšali tursko osvajanje."}, "lekcija": 10}, {"id": "l10-uros-oblasti-lanac", "vrsta": "lanac", "tezina": "lako", "pojmovi": ["car-uros", "feudalizam"], "karike": ["Slab vladar Uroš", "?", "Država se cepa na oblasti"], "praznina": 1, "odgovori": [{"tekst": "Vlastela se izdvaja iz centralne vlasti", "tacan": true}, {"tekst": "Janičari preuzimaju vlast u državi", "tacan": false, "zasto": "Janičari su turska vojska; srpska država se cepala zbog svoje vlastele."}, {"tekst": "Vizantija zauzima celu Srbiju", "tacan": false, "zasto": "Vizantinci su imali priliku da povrate izgubljeno, ali su je uludo potrošili."}], "pomoc": ["Korak 1: Ko je mogao da iskoristi slabost cara?", "Korak 2: Šta rade moćni plemići bez jakog gospodara?", "Iz lekcije: slab vladar → vlastela se izdvaja → država se cepa na oblasti."], "objasnjenje": "Osnovni lanac raspada: slab vladar, jaka vlastela, podeljena država.", "iz_udzbenika": {"strana": 41, "odeljak": "Slabljenje balkanskih država u drugoj polovini XIV veka", "tekst": "U razvijenom feudalizmu vlastela se odvajala od centralne vlasti, posebno pod nejakim vladarom."}, "osa": {"naziv": "Car Uroš", "od": 1355, "do": 1371, "traka": "vladari"}, "lekcija": 10}, {"id": "l10-sukobi-osvajanje-lanac", "vrsta": "lanac", "tezina": "srednje", "pojmovi": ["feudalizam", "feudalna-anarhija", "osmanlije"], "karike": ["U Srbiji, Bosni i Bugarskoj jačaju velikaši", "Unutrašnji sukobi i slaba centralna vlast", "?"], "praznina": 2, "odgovori": [{"tekst": "Turcima je osvajanje mnogo lakše", "tacan": true}, {"tekst": "Balkanske države zajedno teraju Turke iz Evrope", "tacan": false, "zasto": "Do toga nije došlo; srpske zemlje i Bugarska postepeno su dolazile pod tursku vlast."}, {"tekst": "Velikaši se odriču svojih oblasti", "tacan": false, "zasto": "Baš naprotiv: velikaši su samostalno vladali velikim oblastima."}], "pomoc": ["Korak 1: Ko je spoljna opasnost u to vreme?", "Korak 2: Da li je podeljena država jača ili slabija pred njim?", "Iz lekcije: feudalni sukobi na Balkanu olakšali su tursko osvajanje."], "objasnjenje": "Unutrašnji sukobi nisu bili neobični u srednjem veku, ali su ovde došli u trenutku spoljne opasnosti.", "iz_udzbenika": {"strana": 41, "odeljak": "Uvod", "tekst": "Feudalni sukobi su u velikoj meri olakšali tursko osvajanje."}, "lekcija": 10}, {"id": "l10-srbija-bugarska-uporedi", "vrsta": "uporedi", "tezina": "srednje", "pojmovi": ["bugarska", "car-uros", "bosna", "feudalna-anarhija"], "a": "Srbija", "b": "Bugarska", "pitanje": "Na koju se državu odnosi tvrdnja: Srbiju, Bugarsku, obe ili nijednu?", "tvrdnje": [{"tekst": "Car je pred smrt podelio državu na dva dela.", "odgovor": "b", "zasto": "To je učinio bugarski car; u Srbiji su se : "Pod Urošem se plemići osamostaljuju, prvo na jugu, pa i u starim srpskim oblastima."}, "lekcija": 10}, {"id": "l10-nesloga-vlastele-objasni", "vrsta": "objasni", "tezina": "srednje", "pojmovi": ["feudalizam", "jovan-vi-kantakuzin"], "pitanje": "Zašto vlastela hrišćanskih država krajem XIV veka nije bila složna?", "uzor": "U razvijenom feudalizmu oblasni gospodari su jačali, a centralna vlast je slabila. Svaki velikaš je gledao svoj interes i svoju oblast. Zato se nisu okupljali oko jednog vladara čak ni pred turskom opasnošću.", "ideje": ["Oblasni gospodari jačaju, a centralna vlast slabi.", "Svaki velikaš gleda sopstveni interes.", "Kantakuzin opisuje velikaše koji čekaju da se pridruže pobedniku."], "objasnjenje": "Ovo je pitanje iz udžbenika: odgovor spaja feudalno društvo i lični interes velikaša.", "iz_udzbenika": {"strana": 44, "odeljak": "Pitanja za razmišljanje / Zadaci iz udžbenika", "tekst": "Razvijeni feudalizam jača oblasne gospodare i slabi centralnu vlast, a svaki velikaš gleda svoj interes."}, "lekcija": 10}]}, {"naslov": "10. Turci Osmanlije i njihova prva osvajanja", "zadaci": [{"id": "l10-cimpe-izbor", "vrsta": "izbor", "tezina": "lako", "pojmovi": ["cimpe", "osmanlije"], "pitanje": "Koju su tvrđavu Turci zauzeli 1352. i odatle počeli da se naseljavaju u Evropi?", "odgovori": [{"tekst": "Cimpe", "tacan": true}, {"tekst": "Golubac", "tacan": false, "zasto": "Golubac je bio Lazarev posed, a ne prva turska tačka u Evropi."}, {"tekst": "Niš", "tacan": false, "zasto": "Niš su Turci uzeli tek 1386, više od trideset godina kasnije."}, {"tekst": "Gazimestan", "tacan": false, "zasto": "Gazimestan nije tvrđava, nego mesto na Kosovu gde je vođena bitka 1389."}], "pomoc": ["Tvrđava je bila napuštena kada su je Turci zauzeli.", "Ime joj počinje na C.", "Iz lekcije: 1352. Turci zauzimaju napuštenu tvrđavu Cimpe."], "objasnjenje": "Cimpe je prva turska tačka oslonca u Evropi; odatle počinje njihovo naseljavanje.", "iz_udzbenika": {"strana": 41, "odeljak": "Turci Osmanlije i njihova prva osvajanja", "tekst": "Turci su 1352. zauzeli napuštenu tvrđavu Cimpe, i odatle je počelo njihovo naseljavanje Evrope."}, "osa": {"naziv": "Turci zauzimaju Cimpe", "od": 1352, "traka": "dogadjaji"}, "lekcija": 10}, {"id": "l10-janicari-izbor", "vrsta": "izbor", "tezina": "lako", "pojmovi": ["janicari", "osmanlije"], "pitanje": "Ko su bili janičari?", "odgovori": [{"tekst": "Turski vojnici plaćeni doživotno, prva stajaća vojska u Evropi", "tacan": true}, {"tekst": "Srpski velikaši u Makedoniji", "tacan": false, "zasto": "Velikaši u Makedoniji bili su turski vazali, a ne janičari."}, {"tekst": "Vizantijski istoričari", "tacan": false, "zasto": "Vizantijski car i istoričar bio je Kantakuzin; janičari su vojnici."}, {"tekst": "Mongolski osvajači", "tacan": false, "zasto": "Mongoli su pobedili Turke kod Angore; janičari su bili osmanska vojska."}], "pomoc": ["Pojam je vezan za uspeh turske vojske.", "Glavna reč je „stajaća”: vojnici koji su uvek u službi.", "Iz lekcije: janičari su prva stajaća vojska u Evropi, vojnici plaćeni doživotno."], "objasnjenje": "Janičari su stalno bili u službi i plaćeni doživotno, pa je to bio deo razloga za turski uspeh.", "iz_udzbenika": {"strana": 42, "odeljak": "Turci Osmanlije i njihova prva osvajanja", "tekst": "Osmanlije su prve u Evropi imale stajaću vojsku, janičare, vojnike plaćene doživotno."}, "lekcija": 10}, {"id": "l10-pozvani-izbor", "vrsta": "izbor", "tezina": "srednje", "pojmovi": ["osmanlije", "vizantija"], "pitanje": "Kako su Turci došli na Balkan?", "odgovori": [{"tekst": "Kao pozvani učesnici u unutrašnjim sukobima u Vizantiji", "tacan": true}, {"tekst": "Kao saveznici kneza Lazara", "tacan": false, "zasto": "Lazar se protiv njih borio; na Balkan su došli pre njegovog uspona, zbog vizantijskih sukoba."}, {"tekst": "Bežeći pred Mongolima posle Angore", "tacan": false, "zasto": "Angora je 1402, a Turci su već 1352. u Cimpama."}, {"tekst": "Kao trgovci iz Dubrovnika", "tacan": false, "zasto": "Lekcija ih ne opisuje kao trgovce, nego kao učesnike u vizantijskim sukobima."}], "pomoc": ["Nisu došli sami od sebe: neko ih je pozvao.", "Sukob je bio u jednoj staroj carevini.", "Iz lekcije: na Balkan dolaze kao pozvani učesnici u unutrašnjim vizantijskim sukobima."], "objasnjenje": "Unutrašnji sukobi u Vizantiji doveli su Turke na Balkan, a onda su oni tu ostali.", "iz_udzbenika": {"strana": 41, "odeljak": "Turci Osmanlije i njihova prva osvajanja", "tekst": "Turci na Balkan dolaze kao pozvani učesnici u unutrašnjim vizantijskim sukobima."}, "lekcija": 10}, {"id": "l10-murat-namera-izbor", "vrsta": "izbor", "tezina": "srednje", "pojmovi": ["sultan-murat", "osmanlije"], "pitanje": "Šta je bio glavni cilj sultana Murata?", "odgovori": [{"tekst": "Da učvrsti tursku vlast u Evropi", "tacan": true}, {"tekst": "Da se povuče iz Evrope i brani od Mongola", "tacan": false, "zasto": "Mongolski poraz stiže tek 1402, pod Bajazitom; Murat je širio vlast u Evropi."}, {"tekst": "Da pomogne caru Urošu protiv velikaša", "tacan": false, "zasto": "Murat nije pomagao Urošu; Turci su se primicali srpskim oblastima."}, {"tekst": "Da obnovi Vizantiju", "tacan": false, "zasto": "Turci su u vizantijske sukobe ušli kao pozvani, a zatim osvajali za sebe."}], "pomoc": ["Murat vlada 1362–1389.", "Pogledaj kuda su išla njegova osvajanja.", "Iz lekcije: Murat čvrsto namerava da učvrsti tursku vlast u Evropi."], "objasnjenje": "Pod Muratom se osvajanja približavaju srpskim oblastima, sve do Kosova 1389.", "iz_udzbenika": {"strana": 41, "odeljak": "Turci Osmanlije i njihova prva osvajanja", "tekst": "Sultan Murat (1362–1389) čvrsto namerava da učvrsti tursku vlast u Evropi."}, "osa": {"naziv": "Sultan Murat", "od": 1362, "do": 1389, "traka": "vladari"}, "lekcija": 10}, {"id": "l10-pocetak-mala-tn", "vrsta": "tacno_netacno", "tezina": "lako", "pojmovi": ["osmansko-carstvo"], "tvrdnja": "Na početku XIV veka Osmanska država je bila mala kneževina.", "tacno": true, "pomoc": ["Velika sila nije nastala odjednom.", "Iz lekcije: na početku XIV veka to je mala kneževina, koja postepeno prerasta u veliku silu."], "objasnjenje": "Tačno. Osmanska država je od male kneževine postepeno izrasla u veliku silu.", "iz_udzbenika": {"strana": 41, "odeljak": "Turci Osmanlije i njihova prva osvajanja", "tekst": "Na početku XIV veka Osmanska država je mala kneževina, koja postepeno prerasta u veliku silu."}, "lekcija": 10}, {"id": "l10-plocnik-pobeda-tn", "vrsta": "tacno_netacno", "tezina": "lako", "pojmovi": ["plocnik", "osmanlije"], "tvrdnja": "Kod Pločnika 1386. Turci su potukli srpsku vojsku.", "tacno": false, "ispravke": [{"tekst": "Kod Pločnika 1386. srpska vojska je pobedila Turke.", "tacan": true}, {"tekst": "Kod Pločnika 1386. Mongoli su pobedili Turke.", "tacan": false, "zasto": "Mongoli su pobedili kod Angore 1402."}, {"tekst": "Kod Pločnika 1386. Turci su zarobili kneza Lazara.", "tacan": false, "zasto": "Lazar je zarobljen na Kosovu 1389."}], "pomoc": ["Ovo je retka srpska pobeda u lekciji.", "Reč „ali” iz knjige kaže da je posle pobede ipak pao Niš.", "Iz lekcije: srpska vojska pobeđuje Turke kod Pločnika 1386."], "objasnjenje": "Netačno. Pločnik je srpska pobeda, ali Turci iste godine ipak uzimaju Niš.", "iz_udzbenika": {"strana": 41, "odeljak": "Turci Osmanlije i njihova prva osvajanja", "tekst": "Srpska vojska pobedila je Turke kod Pločnika 1386, ali su Osmanlije iste godine uzele Niš."}, "osa": {"naziv": "Bitka kod Pločnika", "od": 1386, "traka": "dogadjaji"}, "lekcija": 10}, {"id": "l10-bajazit-sin-tn", "vrsta": "tacno_netacno", "tezina": "srednje", "pojmovi": ["bajazit-i", "sultan-murat"], "tvrdnja": "Bajazit I bio je Muratov sin i nastavio je širenje Osmanske države.", "tacno": true, "pomoc": ["Pogledaj kada se završava Muratova vladavina, a kada počinje Bajazitova.", "Iz lekcije: Muratov sin Bajazit I (1389–1402) nastavlja širenje države."], "objasnjenje": "Tačno. Posle Muratove pogibije 1389. nasledio ga je sin Bajazit, a osvajanja su se nastavila.", "iz_udzbenika": {"strana": 42, "odeljak": "Turci Osmanlije i njihova prva osvajanja", "tekst": "Muratov sin Bajazit I (1389–1402) nastavio je širenje države."}, "osa": {"naziv": "Bajazit I", "od": 1389, "do": 1402, "traka": "vladari"}, "lekcija": 10}, {"id": "l10-janicari-privremeni-tn", "vrsta": "tacno_netacno", "tezina": "srednje", "pojmovi": ["janicari", "osmanlije"], "tvrdnja": "Janičari su se okupljali samo za vreme rata, a posle bitke su se vraćali kućama.", "tacno": false, "ispravke": [{"tekst": "Janičari su bili stajaća vojska, plaćena doživotno.", "tacan": true}, {"tekst": "Janičari su bili plaćeni samo jednom, po završenoj bici.", "tacan": false, "zasto": "Bili su plaćeni doživotno, to je i bila njihova posebnost."}, {"tekst": "Janičari su bili odredi iz Bosne.", "tacan": false, "zasto": "Odredi iz Bosne pomagali su Srbima na Kosovu; janičari su bili turska vojska."}], "pomoc": ["Šta znači reč „stajaća” vojska?", "Da li takav vojnik ide kući posle bitke?", "Iz lekcije: janičari su stajaća vojska, vojnici plaćeni doživotno."], "objasnjenje": "Netačno. Stalna vojska je uvek spremna, i to je Turcima davalo prednost.", "iz_udzbenika": {"strana": 42, "odeljak": "Turci Osmanlije i njihova prva osvajanja", "tekst": "Janičari su bili prva stajaća vojska u Evropi, plaćena doživotno."}, "lekcija": 10}, {"id": "l10-nis-plocnik-tn", "vrsta": "tacno_netacno", "tezina": "tesko", "pojmovi": ["plocnik", "nis", "knez-lazar"], "tvrdnja": "Pobeda kod Pločnika nije zaustavila Turke: iste godine pao je Niš, jedan od važnih Lazarevih poseda.", "tacno": true, "pomoc": ["Spoji dve činjenice: godinu pada Niša i spisak Lazarevih poseda.", "Iz lekcije: Pločnik 1386, ali Osmanlije iste godine uzimaju Niš; Niš je među važnim Lazarevim posedima."], "objasnjenje": "Tačno. Ni dobijena bitka nije promenila pravac: Turci su se i dalje primicali srpskim oblastima.", "iz_udzbenika": {"strana": 41, "odeljak": "Turci Osmanlije i njihova prva osvajanja", "tekst": "Srpska vojska pobeđuje kod Pločnika 1386, ali Turci iste godine uzimaju Niš."}, "osa": {"naziv": "Turci osvajaju Niš", "od": 1386, "traka": "dogadjaji"}, "lekcija": 10}, {"id": "l10-prva-osvajanja-dopuni", "vrsta": "dopuni", "tezina": "lako", "pojmovi": ["cimpe", "plocnik", "nis", "solun"], "pitanje": "Dopuni pregled turskih osvajanja.", "tekst": "Turci su 1352. zauzeli tvrđavu {{Cimpe}}. Srpska vojska ih je pobedila kod {{Pločnika}} 1386, ali su iste godine uzeli {{Niš}}, a 1387. i {{Solun}}.", "ponudjene": ["Cimpe", "Pločnika", "Niš", "Solun", "Angore", "Kruševac"], "pomoc": ["Kod Angore su Turci izgubili od Mongola, i to mnogo kasnije.", "Kruševac je bio Lazarevo sedište.", "Iz lekcije: Cimpe 1352, Pločnik i Niš 1386, Solun 1387."], "objasnjenje": "Niz pokazuje pravac napredovanja: od male tvrđave do velikih gradova na Balkanu.", "iz_udzbenika": {"strana": 42, "odeljak": "Turci Osmanlije i njihova prva osvajanja", "tekst": "Turci zauzimaju Cimpe 1352, Niš 1386. i Solun 1387, a kod Pločnika gube 1386."}, "lekcija": 10}, {"id": "l10-sultani-dopuni", "vrsta": "dopuni", "tezina": "srednje", "pojmovi": ["sultan-murat", "bajazit-i"], "pitanje": "Dopuni rečenicu o sultanima.", "tekst": "Sultan {{Murat}} vladao je od 1362. do {{1389}}. Nasledio ga je sin {{Bajazit}} I, koji je vladao do {{1402}}.", "ponudjene": ["Murat", "1389", "Bajazit", "1402", "1371", "1352"], "pomoc": ["Muratova vladavina se završava godinom Kosovskog boja.", "Bajazitova se završava godinom Angore.", "Iz lekcije: Murat 1362–1389, Bajazit I 1389–1402."], "objasnjenje": "Dve bitke, Kosovo i Angora, zatvaraju vladavine dvojice sultana.", "iz_udzbenika": {"strana": 42, "odeljak": "Turci Osmanlije i njihova prva osvajanja", "tekst": "Sultan Murat vlada 1362–1389, a njegov sin Bajazit I 1389–1402."}, "lekcija": 10}, {"id": "l10-janicari-dopuni", "vrsta": "dopuni", "tezina": "tesko", "pojmovi": ["janicari", "cimpe"], "pitanje": "Dopuni bez ponuđenih reči.", "tekst": "Turci su u Evropi prvi imali {{stajaću}} vojsku. Njeni vojnici zvali su se {{janičari|janicari}} i bili su plaćeni {{doživotno|dozivotno}}.", "pomoc": ["Prva reč znači: vojska koja postoji stalno, a ne samo u ratu.", "Naziv tih vojnika počinje na j.", "Iz lekcije: stajaća vojska, janičari, plaćeni doživotno."], "objasnjenje": "Stalna i doživotno plaćena vojska objašnjava deo turskog uspeha.", "iz_udzbenika": {"strana": 42, "odeljak": "Turci Osmanlije i njihova prva osvajanja", "tekst": "Osmanlije su prve u Evropi imale stajaću vojsku, janičare, plaćene doživotno."}, "lekcija": 10}, {"id": "l10-sultani-osvajanja-povezi", "vrsta": "povezi", "tezina": "srednje", "pojmovi": ["cimpe", "plocnik", "solun", "bitka-kod-angore"], "pitanje": "Poveži mesto sa onim što se tamo dogodilo.", "parovi": [["Cimpe", "Napuštena tvrđava, početak naseljavanja Evrope"], ["Pločnik", "Srpska vojska pobeđuje Turke"], ["Solun", "Turci ga osvajaju 1387."], ["Angora", "Mongoli zarobljavaju sultana Bajazita"]], "pomoc": ["Jedna bitka je srpska pobeda, a jedna turski poraz od nekog drugog.", "Cimpe je najranije po vremenu.", "Iz lekcije: Cimpe 1352, Pločnik 1386, Solun 1387, Angora 1402."], "objasnjenje": "Četiri mesta pokazuju početak, uspone, jedan poraz i privremeni prekid osvajanja.", "iz_udzbenika": {"strana": 42, "odeljak": "Turci Osmanlije i njihova prva osvajanja", "tekst": "Lekcija beleži Cimpe, Pločnik, Niš, Solun, a zatim i Angoru."}, "lekcija": 10}, {"id": "l10-janicari-prednost-zakljuci", "vrsta": "zakljuci", "tezina": "srednje", "pojmovi": ["janicari", "feudalizam"], "pitanje": "Zašto je stajaća vojska bila velika prednost u odnosu na vojske feudalnih gospodara?", "odgovori": [{"tekst": "Vojnici su stalno u službi i plaćeni doživotno, pa je vojska uvek spremna", "tacan": true}, {"tekst": "Bila je sastavljena od Mongola", "tacan": false, "zasto": "Mongoli su bili protivnici Turaka kod Angore."}, {"tekst": "Nije morala da se bori", "tacan": false, "zasto": "Janičari su bili upravo borbena vojska."}, {"tekst": "Bila je pod komandom Vlatka Vukovića", "tacan": false, "zasto": "Vukovićevi odredi iz Bosne pomagali su Srbima na Kosovu."}], "pomoc": ["Korak 1: Šta je „stajaća” vojska?", "Korak 2: Šta dobija država koja vojsku ima i kad nema rata?", "Iz lekcije: deo turskog uspeha objašnjava se stajaćom, doživotno plaćenom vojskom."], "objasnjenje": "Stalna, doživotno plaćena vojska bila je deo turskog uspeha, dok su balkanske države bile podeljene među velikašima.", "iz_udzbenika": {"strana": 42, "odeljak": "Turci Osmanlije i njihova prva osvajanja", "tekst": "Deo turskog uspeha objašnjava se time što su Osmanlije prve imale stajaću vojsku."}, "lekcija": 10}, {"id": "l10-vizantija-greska-zakljuci", "vrsta": "zakljuci", "tezina": "tesko", "pojmovi": ["vizantija", "osmanlije", "cimpe"], "pitanje": "Šta je najvažnija pouka iz načina na koji su Turci stigli na Balkan?", "odgovori": [{"tekst": "Unutrašnji sukob može da uvede spoljnu silu koja ostane i postane opasnija od protivnika", "tacan": true}, {"tekst": "Vizantija je tim pozivom ojačala i proterala ih", "tacan": false, "zasto": "Nije ih proterala: Turci su 1352. zauzeli Cimpe i počeli naseljavanje."}, {"tekst": "Turci su samo prošli kroz Balkan i vratili se", "tacan": false, "zasto": "Ostali su i širili se sve do Kosova, Soluna i Bugarske."}, {"tekst": "Poziv nije imao nikakve posledice", "tacan": false, "zasto": "Upravo je to bio početak turskog prisustva na Balkanu."}], "pomoc": ["Korak 1: Zašto su Turci pozvani?", "Korak 2: Šta su uradili 1352. i kasnije?", "Iz lekcije: sukobi u Vizantiji → Turci pozvani → dolazak na Balkan → Cimpe 1352."], "objasnjenje": "Pozvani saveznik postao je osvajač, jer je onaj ko ga je zvao bio razdiran sukobima.", "iz_udzbenika": {"strana": 41, "odeljak": "Turci Osmanlije i njihova prva osvajanja", "tekst": "Turci dolaze kao pozvani učesnici vizantijskih sukoba, a 1352. počinju naseljavanje Evrope."}, "osa": {"naziv": "Turci zauzimaju Cimpe", "od": 1352, "traka": "dogadjaji"}, "lekcija": 10}, {"id": "l10-cimpe-datum", "vrsta": "datum", "tezina": "lako", "pojmovi": ["cimpe", "osmanlije"], "dogadjaj": "Turci zauzimaju Cimpe", "pitanje": "Koje godine su Turci zauzeli tvrđavu Cimpe?", "godina": 1352, "traka": "dogadjaji", "pomoc": ["To je sredina XIV veka, pre Dušanove smrti.", "Smrt cara Dušana je 1355, a ovo je tri godine ranije.", "Iz lekcije: Cimpe je zauzeto 1352."], "objasnjenje": "Godine 1352. Turci se učvršćuju u Cimpama i počinje njihovo naseljavanje Evrope.", "iz_udzbenika": {"strana": 41, "odeljak": "Turci Osmanlije i njihova prva osvajanja", "tekst": "Turci su 1352. zauzeli napuštenu tvrđavu Cimpe."}, "lekcija": 10}, {"id": "l10-plocnik-datum", "vrsta": "datum", "tezina": "srednje", "pojmovi": ["plocnik"], "dogadjaj": "Bitka kod Pločnika", "pitanje": "Koje godine je srpska vojska pobedila Turke kod Pločnika?", "godina": 1386, "traka": "dogadjaji", "pomoc": ["Bilo je to nekoliko godina pre Kosova.", "Tri godine pre Kosovskog boja.", "Iz lekcije: Pločnik je 1386."], "objasnjenje": "Pločnik je 1386, tri godine pre Kosova; iste godine pao je i Niš.", "iz_udzbenika": {"strana": 41, "odeljak": "Turci Osmanlije i njihova prva osvajanja", "tekst": "Srpska vojska pobedila je Turke kod Pločnika 1386."}, "lekcija": 10}, {"id": "l10-solun-datum", "vrsta": "datum", "tezina": "srednje", "pojmovi": ["solun"], "dogadjaj": "Turci osvajaju Solun", "pitanje": "Koje godine su Turci osvojili Solun?", "godina": 1387, "traka": "dogadjaji", "pomoc": ["Godinu dana posle Pločnika.", "Dve godine pre Kosova.", "Iz lekcije: Solun je pao 1387."], "objasnjenje": "Solun je pao 1387, između Pločnika i Kosova.", "iz_udzbenika": {"strana": 42, "odeljak": "Turci Osmanlije i njihova prva osvajanja", "tekst": "Turci su 1387. osvojili i Solun."}, "lekcija": 10}, {"id": "l10-murat-datum", "vrsta": "datum", "tezina": "tesko", "pojmovi": ["sultan-murat"], "dogadjaj": "Sultan Murat", "pitanje": "U kom periodu je vladao sultan Murat?", "od": 1362, "do": 1389, "traka": "vladari", "pomoc": ["Završetak znaš: Kosovo. Početak je sedam godina posle Dušanove smrti.", "Dušan je umro 1355.", "Iz lekcije: Murat je vladao 1362–1389."], "objasnjenje": "Murat je vladao od 1362. do pogibije na Kosovu 1389.", "iz_udzbenika": {"strana": 41, "odeljak": "Turci Osmanlije i njihova prva osvajanja", "tekst": "Sultan Murat vlada 1362–1389."}, "lekcija": 10}, {"id": "l10-turska-osvajanja-poredjaj", "vrsta": "poredjaj", "tezina": "lako", "pojmovi": ["cimpe", "plocnik", "solun"], "pitanje": "Poređaj događaje hronološki, od najranijeg.", "stavke": [{"tekst": "Turci zauzimaju Cimpe", "godina": 1352, "naziv": "Turci zauzimaju Cimpe", "traka": "dogadjaji"}, {"tekst": "Srpska pobeda kod Pločnika", "godina": 1386, "naziv": "Bitka kod Pločnika", "traka": "dogadjaji"}, {"tekst": "Turci osvajaju Solun", "godina": 1387, "naziv": "Turci osvajaju Solun", "traka": "dogadjaji"}], "pomoc": ["Počinje se od prve tačke u Evropi.", "Solun pada godinu dana posle srpske pobede.", "Iz lekcije: Cimpe 1352, Pločnik 1386, Solun 1387."], "objasnjenje": "Prvo oslonac u Evropi 1352, pa 1386. Pločnik i 1387. Solun.", "iz_udzbenika": {"strana": 42, "odeljak": "Turci Osmanlije i njihova prva osvajanja", "tekst": "Lekcija beleži Cimpe 1352, Pločnik 1386. i Solun 1387."}, "lekcija": 10}, {"id": "l10-vizantija-cimpe-lanac", "vrsta": "lanac", "tezina": "srednje", "pojmovi": ["vizantija", "osmanlije", "cimpe"], "karike": ["Sukobi u Vizantiji", "?", "Turci dolaze na Balkan", "Zauzimanje Cimpa 1352."], "praznina": 1, "odgovori": [{"tekst": "Turci su pozvani kao pomoć", "tacan": true}, {"tekst": "Srbi su pozvali Turke protiv Dušana", "tacan": false, "zasto": "Sukobi su bili unutrašnji vizantijski, pa su tu Turci i pozvani."}, {"tekst": "Mongoli su proterali Turke iz Azije", "tacan": false, "zasto": "Mongoli su u lekciji tek 1402, kod Angore."}], "pomoc": ["Korak 1: Čiji je bio unutrašnji sukob?", "Korak 2: Kako je neka strana mogla da dobije pomoć?", "Iz lekcije: sukobi u Vizantiji → Turci pozvani u pomoć → dolazak na Balkan → Cimpe 1352."], "objasnjenje": "Pozivom u
