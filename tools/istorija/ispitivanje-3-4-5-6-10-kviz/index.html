"Simeon", "tacan": true}, {"tekst": "Sava", "tacan": false, "zasto": "Sava je Nemanjin najmlađi sin, koji je monah bio pre oca; Nemanja je kao monah Simeon."}, {"tekst": "Jeftimije", "tacan": false, "zasto": "Jeftimije je episkop sa kojim se Nemanja savetovao o bogumilima."}, {"tekst": "Stefan", "tacan": false, "zasto": "Stefan je njegovo svetovno ime, a tako se zvao i sin koji ga je nasledio; monaško ime mu je Simeon."}], "pomoc": ["Monah dobija novo ime, drugačije od svetovnog.", "Ne mešaj ga sa imenom njegovog sina monaha.", "Iz lekcije: slika 21 prikazuje Stefana Nemanju kao monaha Simeona."], "objasnjenje": "Kao monah, Stefan Nemanja nosi ime Simeon, a tako ga prikazuje i freska iz udžbenika.", "iz_udzbenika": {"strana": 26, "odeljak": "Srpska država u periodu Nemanjića", "tekst": "Freska prikazuje Stefana Nemanju kao monaha Simeona, sa dugom belom bradom i u monaškoj odeći.", "slika": "05-srpska-drzava-prvih-nemanjica/02-stefan-nemanja-monah-simeon.jpg"}, "lekcija": 5}, {"id": "l05-izbor-unutrasnjost", "vrsta": "izbor", "tezina": "srednje", "pojmovi": ["stefan-nemanja", "zapadna-morava", "velika-morava", "kosovo", "hvosno"], "pitanje": "Koje oblasti u unutrašnjosti je osvojio Stefan Nemanja? (više tačnih)", "odgovori": [{"tekst": "krajeve uz Zapadnu i Veliku Moravu", "tacan": true}, {"tekst": "Kosovo", "tacan": true}, {"tekst": "Hvosno (Metohiju)", "tacan": true}, {"tekst": "Zahumlje", "tacan": false, "zasto": "Nemanja jeste osvojio Zahumlje, ali je ono u primorju, a pitanje traži unutrašnjost."}, {"tekst": "Duklju", "tacan": false, "zasto": "Duklja je takođe osvojena, ali spada u primorske oblasti."}], "pomoc": ["Podeli osvajanja na kopno u unutrašnjosti i obalu.", "Tri odgovora su tačna: reke i dve oblasti na jugu.", "Iz lekcije: u unutrašnjosti krajevi uz Zapadnu i Veliku Moravu, Kosovo i Hvosno (Metohija)."], "objasnjenje": "U unutrašnjosti je Nemanja osvojio krajeve uz Zapadnu i Veliku Moravu, Kosovo i Hvosno; Zahumlje i Duklja su u primorju.", "iz_udzbenika": {"strana": 26, "odeljak": "Srpska država u periodu Nemanjića", "tekst": "U unutrašnjosti je Nemanja osvojio krajeve uz Zapadnu i Veliku Moravu, Kosovo i Hvosno.", "slika": "05-srpska-drzava-prvih-nemanjica/04-srpske-zemlje-kraj-xii-pocetak-xiii-veka-karta.jpg"}, "lekcija": 5}, {"id": "l05-izbor-primorje", "vrsta": "izbor", "tezina": "srednje", "pojmovi": ["stefan-nemanja", "zahumlje", "travunija", "duklja", "severna-albanija"], "pitanje": "Koje primorske oblasti je Stefan Nemanja uključio u svoju državu? (više tačnih)", "odgovori": [{"tekst": "Zahumlje", "tacan": true}, {"tekst": "Travuniju", "tacan": true}, {"tekst": "Duklju", "tacan": true}, {"tekst": "severnu Albaniju", "tacan": true}, {"tekst": "Hvosno", "tacan": false, "zasto": "Hvosno, odnosno Metohija, jeste osvojeno, ali spada u unutrašnjost."}, {"tekst": "Kosovo", "tacan": false, "zasto": "Kosovo je osvojeno, ali nije primorska oblast, već deo unutrašnjosti."}], "pomoc": ["Pogledaj koje su oblasti uz more.", "Četiri odgovora su tačna.", "Iz lekcije: u primorju Zahumlje, Travunija, Duklja i severna Albanija."], "objasnjenje": "Primorska osvajanja su Zahumlje, Travunija, Duklja i severna Albanija.", "iz_udzbenika": {"strana": 27, "odeljak": "Srpska država u periodu Nemanjića", "tekst": "U primorju je Nemanja osvojio Zahumlje, Travuniju, Duklju i severnu Albaniju.", "slika": "05-srpska-drzava-prvih-nemanjica/04-srpske-zemlje-kraj-xii-pocetak-xiii-veka-karta.jpg"}, "lekcija": 5}, {"id": "l05-izbor-najmladji-sin", "vrsta": "izbor", "tezina": "srednje", "pojmovi": ["stefan-nemanja", "sveti-sava", "sveta-gora"], "pitanje": "Zašto je Sava već bio na Svetoj Gori kada je tamo stigao njegov otac?", "odgovori": [{"tekst": "Tamo je već bio monah", "tacan": true}, {"tekst": "Upravljao je srpskom državom sa Svete Gore", "tacan": false, "zasto": "Državom je posle Nemanje upravljao njegov sin Stefan; Sava je na Svetoj Gori bio monah."}, {"tekst": "Bio je tamo arhiepiskop", "tacan": false, "zasto": "Arhiepiskop je postao tek 1219, u Nikeji, a Nemanja je umro 1199."}, {"tekst": "Pobegao je pred krstašima iz Carigrada", "tacan": false, "zasto": "Iz Carigrada su u Nikeju otišli vizantijski car i patrijarh; Sava sa tim nema veze, on je na Svetoj Gori bio monah."}], "pomoc": ["Šta se na Svetoj Gori radi, ko tamo živi?", "Pazi na vreme: crkvene službe dobija tek mnogo kasnije.", "Iz lekcije: Nemanja je otišao na Svetu Goru, gde je već bio monah njegov najmlađi sin Sava."], "objasnjenje": "Sava, najmlađi Nemanjin sin, bio je monah na Svetoj Gori pre nego što se tamo povukao njegov otac.", "iz_udzbenika": {"strana": 27, "odeljak": "Srpska država u periodu Nemanjića", "tekst": "Pred kraj života Nemanja je otišao na Svetu Goru, gde je već bio monah njegov najmlađi sin Sava."}, "lekcija": 5}, {"id": "l05-izbor-hilandar-znacaj", "vrsta": "izbor", "tezina": "srednje", "pojmovi": ["manastir-hilandar", "manastir-zica"], "pitanje": "Kakvu je ulogu imao Hilandar za Srbe u srednjem veku?", "odgovori": [{"tekst": "Postao je središte srpske srednjovekovne kulture", "tacan": true}, {"tekst": "Bio je prestonica velikih župana", "tacan": false, "zasto": "Prestonica u prvim decenijama Nemanjića bio je Ras, dok je Hilandar manastir na Svetoj Gori."}, {"tekst": "Bio je sedište srpske arhiepiskopije od 1220.", "tacan": false, "zasto": "Sedište arhiepiskopije od 1220. bila je Žiča kod Kraljeva."}, {"tekst": "Služio je kao tvrđava protiv krstaša", "tacan": false, "zasto": "Knjiga Hilandar opisuje kao manastir i središte kulture, a ne kao vojno utvrđenje."}], "pomoc": ["Ne mešaj Hilandar i Žiču.", "Uloga mu nije državna ni vojna.", "Iz lekcije: Hilandar je postao središte srpske srednjovekovne kulture."], "objasnjenje": "Hilandar je bio središte srpske srednjovekovne kulture, a Žiča sedište arhiepiskopije.", "iz_udzbenika": {"strana": 27, "odeljak": "Srpska država u periodu Nemanjića", "tekst": "Hilandar je postao središte srpske srednjovekovne kulture.", "slika": "05-srpska-drzava-prvih-nemanjica/03-manastir-hilandar.jpg"}, "lekcija": 5}, {"id": "l05-izbor-bogumili-gde", "vrsta": "izbor", "tezina": "srednje", "pojmovi": ["bogumili"], "pitanje": "U kojoj zemlji knjiga posebno ističe delatnost bogumila u Nemanjino vreme?", "odgovori": [{"tekst": "u Bosni", "tacan": true}, {"tekst": "u Duklji", "tacan": false, "zasto": "Duklja je primorska oblast koju je Nemanja osvojio; bogumili su bili naročito delatni u Bosni."}, {"tekst": "u Nikeji", "tacan": false, "zasto": "Nikeja je mesto gde su se preselili vizantijski car i patrijarh, a ne središte bogumila."}, {"tekst": "na Svetoj Gori", "tacan": false, "zasto": "Sveta Gora je pravoslavno monaško središte; bogumili su bili naročito delatni u Bosni."}], "pomoc": ["Knjiga je navodi kao zemlju gde su bili najdelatniji.", "Ime zemlje počinje slovom B.", "Iz lekcije: bogumili su bili naročito delatni u Bosni."], "objasnjenje": "Bogumili se javljaju i u Srbiji, ali su bili naročito delatni u Bosni.", "iz_udzbenika": {"strana": 27, "odeljak": "Srpska država u periodu Nemanjića", "tekst": "Za vreme Nemanje u Srbiji se javlja verska zajednica bogumila, naročito delatna u Bosni."}, "lekcija": 5}, {"id": "l05-izbor-zupan-staro", "vrsta": "izbor", "tezina": "tesko", "pojmovi": ["zupan", "veliki-zupan"], "pitanje": "Knjiga kaže da su Srbi titulu župan imali još u pradomovini. Šta iz toga sledi?", "odgovori": [{"tekst": "Titula je starija od države Nemanjića", "tacan": true}, {"tekst": "Titulu je izmislio Stefan Nemanja", "tacan": false, "zasto": "Ako je postojala još u pradomovini, nastala je mnogo pre Nemanje, koji vlada od 1166."}, {"tekst": "Titulu su Srbi preuzeli od krstaša", "tacan": false, "zasto": "Krstaši stižu u vreme Stefana Nemanjića; titula župan je od njih mnogo starija."}, {"tekst": "Titulu je Srbima dodelio rimski papa", "tacan": false, "zasto": "Papa je dao kraljevsku krunu 1217; župan je stara titula Srba iz pradomovine."}], "pomoc": ["Šta znači reč pradomovina: da li je to pre ili posle dolaska na Balkan?", "Uporedi to sa vremenom kada živi Nemanja.", "Iz lekcije: titulu župan Srbi su imali još u pradomovini."], "objasnjenje": "Pošto su Srbi tu titulu imali još u pradomovini, ona je mnogo starija od Nemanjine države.", "iz_udzbenika": {"strana": 27, "odeljak": "Srpska država u periodu Nemanjića", "tekst": "Nemanja se smatra tvorcem nezavisne srpske države, a titulu župan Srbi su imali još u pradomovini."}, "lekcija": 5}, {"id": "l05-tn-postepeno", "vrsta": "tacno_netacno", "tezina": "lako", "pojmovi": ["stefan-nemanja"], "tvrdnja": "Stefan Nemanja je nezavisnost osvajao postepeno, a ne jednim potezom.", "tacno": true, "pomoc": ["Seti se: prvo unutrašnje borbe, pa rat, pa osvajanja.", "Iz lekcije: rodonačelnik dinastije nezavisnost je osvajao postepeno."], "objasnjenje": "Tačno. Nezavisnost je dolazila korak po korak, kroz borbe u zemlji i rat sa Vizantijom.", "iz_udzbenika": {"strana": 26, "odeljak": "Uvod", "tekst": "Rodonačelnik dinastije, Stefan Nemanja, nezavisnost je osvajao postepeno."}, "lekcija": 5}, {"id": "l05-tn-rodonacelnik", "vrsta": "tacno_netacno", "tezina": "lako", "pojmovi": ["stefan-nemanja", "nemanjici", "dinastija"], "tvrdnja": "Rodonačelnik dinastije Nemanjić je Sveti Sava.", "tacno": false, "ispravke": [{"tekst": "Rodonačelnik dinastije je Stefan Nemanja, Savin otac.", "tacan": true}, {"tekst": "Rodonačelnik dinastije je Stefan Prvovenčani.", "tacan": false, "zasto": "Stefan Prvovenčani je Nemanjin sin; rodonačelnik je onaj od koga porodica počinje, dakle Nemanja."}, {"tekst": "Rodonačelnik dinastije je episkop Jeftimije.", "tacan": false, "zasto": "Jeftimije je episkop sa kojim se Nemanja savetovao, nije iz vladarske porodice."}], "pomoc": ["Dinastija je dobila ime po svom osnivaču.", "Sava je sin tog čoveka.", "Iz lekcije: rodonačelnik dinastije je Stefan Nemanja."], "objasnjenje": "Netačno. Rodonačelnik je Stefan Nemanja, a Sava je njegov najmlađi sin.", "iz_udzbenika": {"strana": 26, "odeljak": "Uvod", "tekst": "Rodonačelnik dinastije Nemanjić bio je Stefan Nemanja."}, "lekcija": 5}, {"id": "l05-tn-ras-prestonica", "vrsta": "tacno_netacno", "tezina": "lako", "pojmovi": ["ras", "novi-pazar"], "tvrdnja": "Ras se nalazi kod Novog Pazara.", "tacno": true, "pomoc": ["To je prestonica sa slike 20.", "Iz lekcije: Ras, kod Novog Pazara, bio je prestonica u prvim decenijama Nemanjića."], "objasnjenje": "Tačno. Ostaci utvrđenja Starog Rasa nalaze se kod Novog Pazara.", "iz_udzbenika": {"strana": 26, "odeljak": "Srpska država u periodu Nemanjića", "tekst": "Ras kod Novog Pazara bio je prestonica u prvim decenijama vladavine Nemanjića.", "slika": "05-srpska-drzava-prvih-nemanjica/01-stari-ras.jpg"}, "lekcija": 5}, {"id": "l05-tn-nemanja-umro", "vrsta": "tacno_netacno", "tezina": "lako", "pojmovi": ["stefan-nemanja", "manastir-hilandar"], "tvrdnja": "Stefan Nemanja je umro u Rasu dok je još bio na vlasti.", "tacno": false, "ispravke": [{"tekst": "Umro je 1199. u Hilandaru, kada više nije vladao.", "tacan": true}, {"tekst": "Umro je 1196. u Žiči.", "tacan": false, "zasto": "Godine 1196. prestaje njegova vladavina; umro je 1199. u Hilandaru, a Žiča je sagrađena kasnije."}, {"tekst": "Umro je 1236. u Trnovu.", "tacan": false, "zasto": "U Trnovu je 1236. umro njegov sin Sava."}], "pomoc": ["Vladavina mu se završava 1196, a poslednje godine provodi drugde.", "Povukao se na Svetu Goru.", "Iz lekcije: Nemanja je umro u Hilandaru 1199."], "objasnjenje": "Netačno. Nemanja je pred kraj života otišao na Svetu Goru i umro u Hilandaru 1199.", "iz_udzbenika": {"strana": 27, "odeljak": "Srpska država u periodu Nemanjića", "tekst": "Nemanja je umro u Hilandaru 1199. godine."}, "osa": {"naziv": "Smrt Stefana Nemanje", "od": 1199, "traka": "dogadjaji"}, "lekcija": 5}, {"id": "l05-tn-hilandar-podigli", "vrsta": "tacno_netacno", "tezina": "lako", "pojmovi": ["manastir-hilandar", "stefan-nemanja", "sveti-sava"], "tvrdnja": "Manastir Hilandar podigli su zajedno Stefan Nemanja i njegov sin Sava.", "tacno": true, "pomoc": ["Ko su dvojica Nemanjića koji su egove smrti, a 1204. je nastalo Latinsko carstvo."}, {"tekst": "Vladao je do 1190, kada je poražen na Moravi.", "tacan": false, "zasto": "Poraz 1190. nije okončao njegovu vlast; vladao je do 1196."}], "pomoc": ["Uporedi godinu kraja vladavine i godinu smrti.", "Razlika je tri godine.", "Iz lekcije: Nemanja je vladao 1166–1196, a umro je 1199."], "objasnjenje": "Netačno. Vlast se završila 1196, posle čega nasleđuje Stefan; Nemanja umire 1199. u Hilandaru.", "iz_udzbenika": {"strana": 27, "odeljak": "Srpska država u periodu Nemanjića", "tekst": "Vladao je 1166–1196, a umro je u Hilandaru 1199."}, "lekcija": 5}, {"id": "l05-tn-bogumili-uguseni", "vrsta": "tacno_netacno", "tezina": "srednje", "pojmovi": ["bogumili", "stefan-nemanja"], "tvrdnja": "Nemanja je potpuno ugušio delovanje bogumila u Srbiji i progonio njihove vođe i sledbenike.", "tacno": true, "pomoc": ["Seti se odlomka iz biografije Nemanje.", "Iz lekcije: potpuno je ugušio delovanje te sekte u Srbiji."], "objasnjenje": "Tačno. U Srbiji je delovanje bogumila ugušeno, a njihove vođe i sledbenici progonjeni.", "iz_udzbenika": {"strana": 27, "odeljak": "Srpska država u periodu Nemanjića", "tekst": "Nemanja je potpuno ugušio delovanje bogumila u Srbiji i progonio njihove vođe i sledbenike."}, "lekcija": 5}, {"id": "l05-tn-tvorac-drzave", "vrsta": "tacno_netacno", "tezina": "srednje", "pojmovi": ["stefan-nemanja"], "tvrdnja": "Stefan Nemanja se smatra tvorcem nezavisne srpske države.", "tacno": true, "pomoc": ["Pogledaj okvir na str. 27 i rubriku Zapamtite.", "Iz lekcije: Nemanja se smatra tvorcem nezavisne srpske države."], "objasnjenje": "Tačno. Knjiga ga navodi kao tvorca nezavisne srpske države, koju je stvarao postepeno.", "iz_udzbenika": {"strana": 27, "odeljak": "Srpska država u periodu Nemanjića", "tekst": "Nemanja se smatra tvorcem nezavisne srpske države."}, "lekcija": 5}, {"id": "l05-tn-hvosno-primorje", "vrsta": "tacno_netacno", "tezina": "tesko", "pojmovi": ["hvosno", "metohija", "zahumlje", "travunija"], "tvrdnja": "Hvosno i Zahumlje su dve primorske oblasti koje je Nemanja osvojio.", "tacno": false, "ispravke": [{"tekst": "Zahumlje je u primorju, a Hvosno je drugi naziv za Metohiju i pripada unutrašnjosti.", "tacan": true}, {"tekst": "Obe oblasti su u unutrašnjosti, uz Veliku Moravu.", "tacan": false, "zasto": "Zahumlje je primorska oblast; uz Moravu su neki drugi krajevi koje je Nemanja osvojio."}, {"tekst": "Nemanja nije osvojio nijednu od njih.", "tacan": false, "zasto": "Osvojio je obe; razlika je samo u tome gde se nalaze."}], "pomoc": ["Knjiga deli osvajanja na unutrašnjost i primorje.", "Hvosno ima i drugi naziv, Metohija.", "Iz lekcije: unutrašnjost je Morava, Kosovo i Hvosno; primorje Zahumlje, Travunija, Duklja i severna Albanija."], "objasnjenje": "Netačno. Hvosno (Metohija) je u unutrašnjosti, a Zahumlje u primorju.", "iz_udzbenika": {"strana": 26, "odeljak": "Srpska država u periodu Nemanjića", "tekst": "Osvajanja se dele na ona u unutrašnjosti i ona u primorju.", "slika": "05-srpska-drzava-prvih-nemanjica/04-srpske-zemlje-kraj-xii-pocetak-xiii-veka-karta.jpg"}, "lekcija": 5}, {"id": "l05-dopuni-oblasti-lako", "vrsta": "dopuni", "tezina": "lako", "pojmovi": ["stefan-nemanja", "raska", "vizantija"], "pitanje": "Dopuni rečenicu.", "tekst": "Stefan Nemanja je prvo učvrstio vlast u {{Raškoj}}, a zatim je krenuo u rat protiv {{Vizantije}} za {{nezavisnost}}.", "ponudjene": ["Raškoj", "Vizantije", "nezavisnost", "Bosni", "Ugarske", "krunu"], "pomoc": ["Prva reč je oblast u kojoj je nastala država.", "Rat je vođen protiv velikog carstva.", "Iz lekcije: posle unutrašnjih borbi vlast u Raškoj je učvršćena, a odmah zatim počinje rat sa Vizantijom za nezavisnost."], "objasnjenje": "Tek kad je učvrstio vlast u Raškoj, Nemanja je mogao da krene u rat sa Vizantijom za nezavisnost.", "iz_udzbenika": {"strana": 26, "odeljak": "Srpska država u periodu Nemanjića", "tekst": "Vlast u Raškoj Nemanja je učvrstio posle unutrašnjih borbi, a zatim je krenuo u rat sa Vizan esko", "vrsta": "dopuni", "tezina": "tesko", "pojmovi": ["bogumili", "stefan-nemanja", "episkop-jeftimije"], "pitanje": "Dopuni rečenicu (bez ponuđenih reči).", "tekst": "Za vreme Nemanje u Srbiji se javlja verska zajednica {{bogumila}}, naročito delatna u {{Bosni}}, a pre pohoda na njih Nemanja se savetovao sa episkopom {{Jeftimijem}}.", "pomoc": ["Zajednicu knjiga naziva i sektom.", "Ime zemlje počinje slovom B.", "Iz lekcije: bogumili su bili delatni u Bosni; Nemanja se savetovao sa episkopom Jeftimijem."], "objasnjenje": "Bogumili su bili naročito delatni u Bosni, a Nemanja je protiv njih krenuo posle saveta sa episkopom Jeftimijem, monasima i velikašima.", "iz_udzbenika": {"strana": 29, "odeljak": "Iz istorijskih izvora", "tekst": "Nemanja se o bogumilima savetovao sa episkopom Jeftimijem, monasima i velikašima."}, "lekcija": 5}, {"id": "l05-povezi-mesta", "vrsta": "povezi", "tezina": "lako", "pojmovi": ["ras", "manastir-hilandar", "manastir-zica", "novi-pazar", "kraljevo", "sveta-gora"], "pitanje": "Poveži mesto sa onim po čemu je važno u ovoj lekciji.", "parovi": [["Ras", "prestonica u prvim decenijama vladavine Nemanjića"], ["Hilandar", "središte srpske srednjovekovne kulture na Svetoj Gori"], ["Žiča", "sedište srpske arhiepiskopije od 1220."], ["Trnovo", "mesto u Bugarskoj gde je umro Sveti Sava"]], "pomoc": ["Jedno je državno, a dva su manastirska središta.", "Četvrto mesto nije u Srbiji.", "Iz lekcije: Ras je prestonica, Hilandar središte kulture, Žiča sedište arhiepiskopije, a Trnovo je mesto Savine smrti."], "objasnjenje": "Ras je državno središte, Hilandar kulturno, Žiča crkveno, a Trnovo mesto gde je Sava umro 1236.", "iz_udzbenika": {"strana": 26, "odeljak": "Srpska država u periodu Nemanjića", "tekst": "Ras je bio prestonica, Hilandar središte kulture, a Žiča od 1220. sedište arhiepiskopije."}, "lekcija": 5}, {"id": "l05-povezi-nemanja-uzrok-tesko", "vrsta": "povezi", "tezina": "tesko", "pojmovi": ["stefan-nemanja", "bogumili", "manastir-hilandar", "vizantija"], "pitanje": "Poveži Nemanjin postupak sa onim čemu je služio ili šta je iz njega proizašlo.", "parovi": [["dobio je unutrašnje borbe", "učvrstio je vlast u Raškoj"], ["ratovao je protiv Vizantije", "tražio je nezavisnost"], ["progonio je bogumile", "ta vera se u Srbiji više nije smela spominjati"], ["podigao je Hilandar sa Savom", "Srbi su dobili središte kulture"]], "pomoc": ["Pitaj se za svaki postupak: šta je time postigao?", "Rat i državna vlast idu sa nezavisnošću, a progon sa verom.", "Iz lekcije: svaki Nemanjin korak imao je cilj, od učvršćivanja vlasti do središta kulture."], "objasnjenje": "Unutrašnje borbe donose vlast, rat ide za nezavisnošću, progon je trebalo da iskoreni bogumile, a Hilandar postaje središte kulture.", "iz_udzbenika": {"strana": 27, "odeljak": "Srpska država u periodu Nemanjića", "tekst": "Nemanja je učvrstio vlast, ratovao za nezavisnost, ugušio bogumile i podigao Hilandar."}, "lekcija": 5}, {"id": "l05-zakljuci-redosled-rata", "vrsta": "zakljuci", "tezina": "lako", "pojmovi": ["stefan-nemanja", "vizantija", "raska"], "pitanje": "Zašto Nemanja nije krenuo u rat sa Vizantijom čim je došao na vlast, nego tek posle unutrašnjih borbi?", "odgovori": [{"tekst": "Najpre je morao da učvrsti vlast u svojoj zemlji", "tacan": true}, {"tekst": "Čekao je da krstaši zauzmu Carigrad", "tacan": false, "zasto": "Carigrad je pao 1204, kada Nemanja više nije bio živ."}, {"tekst": "Prvo je morao da dobije krunu od pape", "tacan": false, "zasto": "Krunu je dobio njegov sin 1217; Nemanja je ostao veliki župan."}, {"tekst": "Dok je bio monah, nije smeo da ratuje", "tacan": false, "zasto": "Monah postaje tek pred kraj života, posle vladavine."}], "pomoc": ["Korak 1: Šta se dešavalo u samoj Raškoj?", "Korak 2: Može li vladar koga u zemlji osporavaju da ratuje napolju?", "Iz lekcije: vlast je učvrstio tek posle unutrašnjih borbi, a odmah zatim krenuo u rat."], "objasnjenje": "Vladar sa nesigurnom vlašću kod kuće teško vodi rat protiv carstva, pa je Nemanja prvo rešio unutrašnje borbe.", "iz_udzbenika": {"strana": 26, "odeljak": "Srpska država u periodu Nemanjića", "tekst": "Vlast u Raškoj Nemanja je učvrstio tek pošto je prošao kroz unutrašnje borbe, a odmah zatim krenuo je u rat sa Vizantijom."}, "lekcija": 5}, {"id": "l05-zakljuci-moravski-poraz-uslov", "vrsta": "zakljuci", "tezina": "srednje", "pojmovi": ["stefan-nemanja"], "pitanje": "Knjiga kaže da je Srbiji posle 1190. bilo dozvoljeno da zadrži veći deo zemalja. Šta nam reč dozvoljeno govori o njenom položaju tada?", "odgovori": [{"tekst": "O zemljama je ipak odlučivala i strana sila, a ne samo Srbija", "tacan": true}, {"tekst": "Srbija je tada bila najjača sila na Balkanu", "tacan": false, "zasto": "Pobeđena država kojoj se nešto dozvoljava nije u položaju najjačeg."}, {"tekst": "Srbija je potpuno izgubila svoje vladare", "tacan": false, "zasto": "Nemanja je vladao još šest godina, do 1196."}, {"tekst": "Dozvolu je dala bogumilska zajednica", "tacan": false, "zasto": "Bogumili su bili proganjana verska zajednica i nisu odlučivali o državnim zemljama."}], "pomoc": ["Korak 1: Ko nekome može nešto da dozvoli?", "Korak 2: Da li je to onaj ko je pobedio ili onaj ko je poražen?", "Iz lekcije: posle poraza Srbiji je dozvoljeno da zadrži veći deo stečenog."], "objasnjenje": "Onaj kome se dozvoljava zavisi od tuđe odluke; nezavisnost je zato osvajana postepeno.", "iz_udzbenika": {"strana": 27, "odeljak": "Srpska država u periodu Nemanjića", "tekst": "Mada je poražen, Srbiji je bilo dozvoljeno da zadrži veći deo stečenih zemalja."}, "lekcija": 5}, {"id": "l05-zakljuci-povlacenje", "vrsta": "zakljuci", "tezina": "srednje", "pojmovi": ["stefan-nemanja", "stefan-prvovencani", "sveta-gora"], "pitanje": "Nemanja je vladao do 1196, a umro je 1199. Šta se sigurno može zaključiti?", "odgovori": [{"tekst": "Poslednje godine života proveo je van vlasti", "tacan": true}, {"tekst": "Poginuo je u bici na Moravi", "tacan": false, "zasto": "Bitka je bila 1190, a on je umro 1199. u Hilandaru."}, {"tekst": "Vratio se na presto posle Stefana", "tacan": false, "zasto": "Stefan vlada od 1196. do 1228, bez prekida za Nemanjin povratak."}, {"tekst": "Umro je pre nego što je nastao Hilandar", "tacan": false, "zasto": "Umro je baš u Hilandaru, koji je sam podigao sa Savom."}], "pomoc": ["Korak 1: Oduzmi godinu kraja vladavine od godine smrti.", "Korak 2: Gde je bio u te tri godine?", "Iz lekcije: posle vladavine otišao je na Svetu Goru, gde je umro 1199."], "objasnjenje": "Vlast je predao 1196, a poslednje godine proveo je kao monah na Svetoj Gori.", "iz_udzbenika": {"strana": 27, "odeljak": "Srpska država u periodu Nemanjića", "tekst": "Pred kraj života Nemanja je otišao na Svetu Goru; umro je u Hilandaru 1199."}, "osa": {"naziv": "Smrt Stefana Nemanje", "od": 1199, "traka": "dogadjaji"}, "lekcija": 5}, {"id": "l05-zakljuci-primorje-znacaj", "vrsta": "zakljuci", "tezina": "tesko", "pojmovi": ["stefan-nemanja", "nemanjici", "raska"], "pitanje": "Država iz naslova lekcije nastaje u Raški, a kod Nemanje obuhvata i primorje i Kosovo. Šta to pokazuje o njegovoj vladavini?", "odgovori": [{"tekst": "Mala oblast Raška pretvorena je u znatno veću državu", "tacan": true}, {"tekst": "Raška je tada izgubila svaki značaj", "tacan": false, "zasto": "Ras u Raškoj ostaje prestonica prvih decenija Nemanjića."}, {"tekst": "Država se širila samo prema moru", "tacan": false, "zasto": "Širenje je bilo i u unutrašnjosti: uz Moravu, na Kosovo i Hvosno."}, {"tekst": "Vizantija je te zemlje mirno predala bez ikakve borbe", "tacan": false, "zasto": "Knjiga govori o ratu sa Vizantijom i porazu 1190, dakle ne o mirnoj predaji."}], "pomoc": ["Korak 1: Odakle je država krenula?", "Korak 2: U kojim je pravcima išlo širenje?", "Iz lekcije: osvajanja su bila i u unutrašnjosti i u primorju."], "objasnjenje": "Nemanja je od Raške stvorio državu koja dopire i do mora i na jug, pa se smatra tvorcem nezavisne srpske države.", "iz_udzbenika": {"strana": 26, "odeljak": "Srpska država u periodu Nemanjića", "tekst": "Osvajanja u unutrašnjosti i primorju znatno su proširila državu iz Raške.", "slika": "05-srpska-drzava-prvih-nemanjica/04-srpske-zemlje-kraj-xii-pocetak-xiii-veka-karta.jpg"}, "lekcija": 5}, {"id": "l05-zakljuci-hilandar-van-srbije", "vrsta": "zakljuci", "tezina": "tesko", "pojmovi": ["manastir-hilandar", "sveta-gora", "nemanjici"], "pitanje": "Šta je neobično u tome što je središte srpske kulture bio Hilandar, i šta to govori o Nemanjićima?", "odgovori": [{"tekst": "Nalazio se na Svetoj Gori, pa su Nemanjići gradili važne ustanove i dalje od svog središta u Raškoj", "tacan": true}, {"tekst": "Nalazio se u prestonici, pa je sve bilo na jednom mestu", "tacan": false, "zasto": "Prestonica je bila Ras, a Hilandar je daleko, na Svetoj Gori."}, {"tekst": "Podigli su ga krstaši, pa su ga Nemanjići samo preuzeli", "tacan": false, "zasto": "Podigli su ga Nemanja i Sava, a ne krstaši."}, {"tekst": "Bio je sedište arhiepiskopije, pa je i kultura bila tamo", "tacan": false, "zasto": "Sedište arhiepiskopije bila je Žiča kod Kraljeva."}], "pomoc": ["Korak 1: Gde je Hilandar, a gde Ras?", "Korak 2: Ko ga je podigao?", "Iz lekcije: na Svetoj Gori su Nemanja i Sava podigli Hilandar, središte srpske kulture."], "objasnjenje": "Hilandar nije bio u Raškoj, nego na Svetoj Gori, a ipak je postao središte srpske srednjovekovne kulture.", "iz_udzbenika": {"strana": 27, "odeljak": "Srpska država u periodu Nemanjića", "tekst": "Hilandar na Svetoj Gori, delo Nemanje i Save, postao je središte srpske srednjovekovne kulture.", "slika": "05-srpska-drzava-prvih-nemanjica/03-manastir-hilandar.jpg"}, "lekcija": 5}, {"id": "l05-datum-nemanja", "vrsta": "datum", "tezina": "lako", "pojmovi": ["stefan-nemanja", "veliki-zupan"], "dogadjaj": "Stefan Nemanja", "pitanje": "Od koje do koje godine je vladao veliki župan Stefan Nemanja?", "od": 1166, "do": 1196, "traka": "vladari", "pomoc": ["Vladao je trideset godina.", "Vladavina se završava u poslednjoj deceniji XII veka.", "Iz lekcije: Stefan Nemanja vladao je 1166–1196."], "objasnjenje": "Stefan Nemanja je vladao od 1166. do 1196. godine.", "iz_udzbenika": {"strana": 26, "odeljak": "Srpska država u periodu Nemanjića", "tekst": "Veliki župan Stefan Nemanja vladao je 1166–1196."}, "lekcija": 5}, {"id": "l05-datum-morava", "vrsta": "datum", "tezina": "lako", "pojmovi": ["stefan-nemanja"], "dogadjaj": "Poraz na reci Moravi", "pitanje": "Koje godine je Stefan Nemanja poražen na reci Moravi?", "godina": 1190, "traka": "dogadjaji", "pomoc": ["Bilo je to šest godina pre kraja njegove vladavine.", "Okrugla godina poslednje decenije XII veka.", "Iz lekcije: 1190. je poražen na Moravi."], "objasnjenje": "Poraz na Moravi bio je 1190, ali je Srbija zadržala veći deo stečenih zemalja.", "iz_udzbenika": {"strana": 27, "odeljak": "Srpska država u periodu Nemanjića", "tekst": "Nemanja je 1190. poražen na reci Moravi."}, "lekcija": 5}, {"id": "l05-datum-nemanja-smrt", "vrsta": "datum", "tezina": "srednje", "pojmovi": ["stefan-nemanja", "manastir-hilandar"], "dogadjaj": "Smrt Stefana Nemanje", "pitanje": "Koje godine je Stefan Nemanja umro u Hilandaru?", "godina": 1199, "traka": "dogadjaji", "pomoc": ["Tri godine posle kraja vladavine.", "Poslednja godina pre 1200.", "Iz lekcije: Nemanja je umro u Hilandaru 1199."], "objasnjenje": "Nemanja je umro 1199. u Hilandaru, tri godine pošto je prestao da vlada.", "iz_udzbenika": {"strana": 27, "odeljak": "Srpska država u periodu Nemanjića", "tekst": "Nemanja je umro u Hilandaru 1199.", "slika": "05-srpska-drzava-prvih-nemanjica/02-stefan-nemanja-monah-simeon.jpg"}, "lekcija": 5}, {"id": "l05-poredjaj-nemanja", "vrsta": "poredjaj", "tezina": "lako", "pojmovi": ["stefan-nemanja"], "pitanje": "Poređaj događaje iz Nemanjinog života, od najranijeg.", "stavke": [{"tekst": "Stefan Nemanja postaje veliki župan", "godina": 1166, "do": 1196, "naziv": "Stefan Nemanja", "traka": "vladari"}, {"tekst": "Poraz na reci Moravi", "godina": 1190, "naziv": "Poraz na reci Moravi" anak srpske feudalne države", "od": 1100, "do": 1200, "traka": "dogadjaji", "oznaka": "XII vek"}, "lekcija": 5}, {"id": "l05-objasni-nezavisnost-postepeno", "vrsta": "objasni", "tezina": "srednje", "pojmovi": ["stefan-nemanja", "vizantija"], "pitanje": "Objasni zašto kažemo da je Nemanja nezavisnost osvajao postepeno, a ne odjednom.", "uzor": "Najpre je morao da pobedi u unutrašnjim borbama i učvrsti vlast u Raškoj. Zatim je ratovao sa Vizantijom i širio državu u unutrašnjosti i primorju. Ni poraz na Moravi 1190. nije sve poništio, jer je veći deo zemalja zadržan.", "ideje": ["Prvo unutrašnje borbe i učvršćivanje vlasti.", "Zatim rat sa Vizantijom i osvajanja.", "Poraz 1190. nije poništio veći deo tekovina."], "objasnjenje": "Postepeno znači kroz više faza, a ne jednim događajem.", "iz_udzbenika": {"strana": 26, "odeljak": "Srpska država u periodu Nemanjića", "tekst": "Nemanja se učvrstio posle unutrašnjih borbi, ratovao za nezavisnost i sačuvao veći deo osvojenog."}, "lekcija": 5}, {"id": "l05-objasni-zasto-bogumili", "vrsta": "objasni", "tezina": "srednje", "pojmovi": ["bogumili", "stefan-nemanja"], "pitanje": "Kako je Nemanja postupio sa bogumilima i odakle to znamo?", "uzor": "Nemanja je potpuno ugušio njihovo delovanje u Srbiji. Posle saveta sa episkopom, monasima i velikašima poslao je vojsku: jedne je kaznio, druge proterao, a vođi je odsečen jezik. To znamo iz biografije koju je napisao njegov sin Stefan Prvovenčani.", "ideje": ["Potpuno je ugušio njihovo delovanje u Srbiji.", "Korišćene su teške kazne i proterivanje.", "Izvor je biografija koju je napisao Stefan Prvovenčani."], "objasnjenje": "Pored činjenice treba navesti i izvor iz kog je znamo.", "iz_udzbenika": {"strana": 29, "odeljak": "Iz istorijskih izvora", "tekst": "Biografija Nemanje opisuje progon bogumila: kazne, proterivanje i kažnjavanje njihovog vođe."}, "lekcija": 5}, {"id": "l05-objasni-hilandar", "vrsta": "objasni", "tezina": "lako", "pojmovi": ["manastir-hilandar", "sveta-gora", "stefan-nemanja", "sveti-sava"], "pitanje": "Ko je podigao Hilandar, gde je i zašto je važan za Srbe?", "uzor": "Hilandar su podigli Stefan Nemanja i njegov sin Sava. Nalazi se na Svetoj Gori. Važan je zato što je postao središte srpske srednjovekovne kulture.", "ideje": ["Podigli su ga Nemanja i Sava.", "Nalazi se na Svetoj Gori.", "Postao je središte srpske srednjovekovne kulture."], "objasnjenje": "Tri dela odgovora: ko, gde i zašto je važan.", "iz_udzbenika": {"strana": 27, "odeljak": "Srpska država u periodu Nemanjića", "tekst": "Nemanja i Sava su podigli Hilandar, koji je postao središte srpske srednjovekovne kulture.", "slika": "05-srpska-drzava-prvih-nemanjica/03-manastir-hilandar.jpg"}, "lekcija": 5}, {"id": "l05-objasni-tesko-izvor-i-cilj", "vrsta": "objasni", "tezina": "tesko", "pojmovi": ["bogumili", "stefan-nemanja", "stefan-prvovencani"], "pitanje": "Zašto biografiju Nemanje ne možemo da uzmemo kao potpuno nepristrasan opis događaja, iako je to važan izvor?", "uzor": "Autor je Nemanjin sin Stefan Prvovenčani, pa piše o svom ocu i sa strane vlasti. Progon predstavlja kao ispravan i ne prenosi glas bogumila. Izvor je ipak važan, jer nam govori šta je vlast radila i kako je o tome mislila.", "ideje": ["Autor je Nemanjin sin.", "Piše sa strane vlasti i progonitelja.", "Glas bogumila ne čujemo.", "Izvor je ipak koristan jer pokazuje postupke i stav vlasti."], "objasnjenje": "Izvor treba čitati sa pitanjem ko ga je napisao i zašto.", "iz_udzbenika": {"strana": 29, "odeljak": "Iz istorijskih izvora", "tekst": "O progonu bogumila pisao je Stefan Prvovenčani, sin čoveka koji je progon naredio."}, "lekcija": 5}]}, {"naslov": "5. Proglašenje kraljevstva", "zadaci": [{"id": "l05-izbor-naslednik", "vrsta": "izbor", "tezina": "lako", "pojmovi": ["stefan-prvovencani", "stefan-nemanja"], "pitanje": "Ko je nasledio Stefana Nemanju na vlasti?", "odgovori": [{"tekst": "njegov sin Stefan", "tacan": true}, {"tekst": "njegov sin Sava", "tacan": false, "zasto": "Sava je bio monah i kasnije prvi arhiepiskop, a ne vladar."}, {"tekst": "episkop Jeftimije", "tacan": false, "zasto": "Jeftimije je crkveno lice, savetnik u progonu bogumila, a ne naslednik."}, {"tekst": "vizantijski car", "tacan": false, "zasto": "Nemanja se borio za nezavisnost od Vizantije; nasledio ga je sin."}], "pomoc": ["Nasledio ga je član porodice.", "Taj sin je kasnije primio krunu.", "Iz lekcije: Nemanju je nasledio sin Stefan (1196–1228)."], "objasnjenje": "Nemanju je nasledio sin Stefan, kasnije prozvan Prvovenčani.", "iz_udzbenika": {"strana": 27, "odeljak": "Proglašenje kraljevstva (Stefan Prvovenčani)", "tekst": "Nemanju je nasledio sin Stefan (1196–1228)."}, "osa": {"naziv": "Stefan Prvovenčani", "od": 1196, "do": 1228, "traka": "vladari"}, "lekcija": 5}, {"id": "l05-izbor-kruna-od", "vrsta": "izbor", "tezina": "lako", "pojmovi": ["stefan-prvovencani", "rimski-papa", "kraljevska-kruna"], "pitanje": "Od koga je Stefan 1217. primio kraljevsku krunu?", "odgovori": [{"tekst": "od rimskog pape", "tacan": true}, {"tekst": "od nikejskog patrijarha", "tacan": false, "zasto": "Od patrijarha u Nikeji je Sava 1219. dobio pristanak za arhiepiskopiju; krunu je dao rimski papa."}, {"tekst": "od vizantijskog cara", "tacan": false, "zasto": "Vizantija je tada bila u teškoj krizi; krunu je Stefan dobio od pape."}, {"tekst": "od ohridskog arhiepiskopa", "tacan": false, "zasto": "Ohridski arhiepiskop je upravljao srpskom crkvom pre 1219, a krunu nije dao on."}], "pomoc": ["Kruna je stigla sa zapada.", "Ne mešaj krunu 1217. i crkvenu samostalnost 1219.", "Iz lekcije: 1217. primio je kraljevsku krunu od rimskog pape."], "objasnjenje": "Krunu je 1217. dao rimski papa, a Stefan je zato prozvan Prvovenčani.", "iz_udzbenika": {"strana": 27, "odeljak": "Proglašenje kraljevstva (Stefan Prvovenčani)", "tekst": "Stefan je 1217. primio kraljevsku krunu od rimskog pape."}, "osa": {"naziv": "Stefan Prvovenčani dobija kraljevsku krunu", "od": 1217, "traka": "dogadjaji"}, "lekcija": 5}, {"id": "l05-izbor-ime-prvovencani", "vrsta": "izbor", "tezina": "lako", "pojmovi": ["stefan-prvovencani"], "pitanje": "Zašto je Stefan Nemanjić nazvan Prvovenčani?", "odgovori": [{"tekst": "Zato što je prvi među Nemanjićima krunisan za kralja", "tacan": true}, {"tekst": "Zato što je prvi postao monah na Svetoj Gori", "tacan": false, "zasto": "Na Svetoj Gori su monasi bili Sava i Nemanja, a ime dolazi od krunisanja."}, {"tekst": "Zato što je bio najstariji sin", "tacan": false, "zasto": "Ime dolazi od venčanja krunom, a ne od redosleda rođenja."}, {"tekst": "Zato što je prvi napisao biografiju", "tacan": false, "zasto": "Jeste pisao biografiju oca, ali ime dolazi od krune."}], "pomoc": ["Venčati se ovde znači krunisati se.", "Prvi je u nečemu među Nemanjićima.", "Iz lekcije: pošto je prvi krunisan za kralja, nazvan je Prvovenčani."], "objasnjenje": "Ime govori da je on prvi iz porodice Nemanjić krunisan za kralja.", "iz_udzbenika": {"strana": 27, "odeljak": "Proglašenje kraljevstva (Stefan Prvovenčani)", "tekst": "Stefan je kao prvi krunisani kralj Nemanjića nazvan Prvovenčani."}, "lekcija": 5}, {"id": "l05-izbor-latinsko-gde", "vrsta": "izbor", "tezina": "srednje", "pojmovi": ["latinsko-carstvo", "krstasi", "vizantija"], "pitanje": "Gde su krstaši 1204. stvorili Latinsko carstvo?", "odgovori": [{"tekst": "na vizantijskom tlu", "tacan": true}, {"tekst": "u Raškoj", "tacan": false, "zasto": "Stefan Nemanjić je Rašku sačuvao; Latinsko carstvo je nastalo na vizantijskom tlu."}, {"tekst": "u Rimu", "tacan": false, "zasto": "Rim je sedište pape, a krstaši su osvojili Carigrad."}, {"tekst": "u Bosni", "tacan": false, "zasto": "U Bosni su bili naročito delatni bogumili; Latinsko carstvo je nastalo na tlu Vizantije."}], "pomoc": ["Krstaši su napali Carigrad.", "Država je nastala na zemlji carstva koje su pobedili.", "Iz lekcije: krstaši su osvojili Carigrad i na vizantijskom tlu stvorili Latinsko carstvo."], "objasnjenje": "Latinsko carstvo stvoreno je na vizantijskom tlu, posle osvajanja C Sava je dva puta išao na hodočašće.", "tacan": true}, {"tekst": "Sava nikada nije išao na hodočašće.", "tacan": false, "zasto": "Išao je, a umro je vraćajući se iz Svete zemlje."}, {"tekst": "Sava je pet puta išao na hodočašće.", "tacan": false, "zasto": "Knjiga navodi dva hodočašća."}], "pomoc": ["Hodočašće je putovanje na sveta mesta.", "Broj je mali, ali veći od jedan.", "Iz lekcije: Sava je dva puta išao na hodočašće."], "objasnjenje": "Netačno. Sava je dva puta išao na hodočašće.", "iz_udzbenika": {"strana": 28, "odeljak": "Osnivanje samostalne srpske arhiepiskopije i uloga Svetog Save", "tekst": "Sava je dva puta išao na hodočašće."}, "lekcija": 5}, {"id": "l05-tn-patrijarh-rukopolozio", "vrsta": "tacno_netacno", "tezina": "srednje", "pojmovi": ["nikeja", "sveti-sava"], "tvrdnja": "Savu je za arhiepiskopa rukopoložio rimski papa.", "tacno": false, "ispravke": [{"tekst": "Rukopoložio ga je nikejski patrijarh.", "tacan": true}, {"tekst": "Rukopoložio ga je ohridski arhiepiskop.", "tacan": false, "zasto": "Srpska crkva se tada upravo odvajala od Ohrida; Savu je rukopoložio nikejski patrijarh."}, {"tekst": "Rukopoložio ga je Stefan Prvovenčani.", "tacan": false, "zasto": "Stefan je bio kralj, a ne crkveno lice; to je učinio patrijarh."}], "pomoc": ["Ne mešaj krunu i crkvenu službu.", "Sava je zato išao u Nikeju.", "Iz lekcije: nikejski patrijarh rukopoložio je Savu."], "objasnjenje": "Netačno. Papa je dao krunu Stefanu, a Savu je rukopoložio nikejski patrijarh.", "iz_udzbenika": {"strana": 28, "odeljak": "Osnivanje samostalne srpske arhiepiskopije i uloga Svetog Save", "tekst": "Nikejski patrijarh rukopoložio je Savu za prvog srpskog arhiepiskopa."}, "lekcija": 5}, {"id": "l05-tn-krmcija-grcki", "vrsta": "tacno_netacno", "tezina": "srednje", "pojmovi": ["svetosavska-krmcija", "krmcija"], "tvrdnja": "Svetosavska krmčija je prevedena s grčkog.", "tacno": true, "pomoc": ["Vizantija je bila izvor crkvenog prava.", "Iz lekcije: s grčkog je preveden zbornik crkvenog i svetovnog prava, Svetosavska krmčija."], "objasnjenje": "Tačno. Zbornik je preveden s grčkog i u Srbiji je uživao veliki ugled.", "iz_udzbenika": {"strana": 28, "odeljak": "Osnivanje samostalne srpske arhiepiskopije i uloga Svetog Save", "tekst": "S grčkog je preveden zbornik crkvenog i svetovnog prava, tzv. Svetosavska krmčija."}, "lekcija": 5}, {"id": "l05-tn-krmcija-samo-crkva", "vrsta": "tacno_netacno", "tezina": "srednje", "pojmovi": ["krmcija"], "tvrdnja": "U krmčiji su sabrani samo crkveni propisi.", "tacno": false, "ispravke": [{"tekst": "U krmčiji su sabrani propisi i crkvenog i građanskog prava.", "tacan": true}, {"tekst": "U krmčiji su samo pravila života u manastiru.", "tacan": false, "zasto": "To je tipik; krmčija ima crkveno i građansko pravo."}, {"tekst": "U krmčiji su biografije svetih.", "tacan": false, "zasto": "Krmčija je pravni zbornik, a ne zbirka biografija."}], "pomoc": ["Knjiga kaže da je zbornik crkvenog i svetovnog prava.", "Pazi na reč samo.", "Iz lekcije: krmčija je knjiga propisa crkvenog i građanskog prava."], "objasnjenje": "Netačno. Krmčija sabira i crkvene i građanske propise.", "iz_udzbenika": {"strana": 29, "odeljak": "Osnivanje samostalne srpske arhiepiskopije i uloga Svetog Save", "tekst": "Krmčija je knjiga u kojoj su sabrani propisi crkvenog i građanskog prava."}, "lekcija": 5}, {"id": "l05-tn-tipici-obrazovanje", "vrsta": "tacno_netacno", "tezina": "tesko", "pojmovi": ["tipik", "sveti-sava"], "tvrdnja": "Savini tipici nisu bili važni samo za manastirski red, već su služili i obrazovanju sveštenstva.", "tacno": true, "pomoc": ["Šta knjiga kaže o tome čemu su služili?", "Iz lekcije: tipici su služili obrazovanju sveštenstva."], "objasnjenje": "Tačno. Tipik uređuje život u manastiru, a Savini tipici su služili i obrazovanju sveštenstva.", "iz_udzbenika": {"strana": 28, "odeljak": "Osnivanje samostalne srpske arhiepiskopije i uloga Svetog Save", "tekst": "Sava je napisao manastirske tipike, koji su služili obrazovanju sveštenstva."}, "lekcija": 5}, {"id": "l05-dopuni-arhiepiskopija-lako", "vrsta": "dopuni", "tezina": "lako", "pojmovi": ["sveti-sava", "nikeja", "srpska-arhiepiskopija", "manastir-zica"], "pitanje": "Dopuni rečenicu.", "tekst": "Sava je {{1219.|1219}} u {{Nikeji}} dobio samostalnu srpsku arhiepiskopiju, a njeno sedište je 1220. smešteno u {{Žiču}}.", "ponudjene": ["1219.", "Nikeji", "Žiču", "1204.", "Rimu", "Hilandar"], "pomoc": ["Dve godine posle krune.", "Tamo je bio patrijarh.", "Iz lekcije: 1219. u Nikeji; sedište 1220. u Žiči."], "objasnjenje": "Samostalnost je dobijena 1219. u Nikeji, a sedište je 1220. u Žiči.", "iz_udzbenika": {"strana": 28, "odeljak": "Osnivanje samostalne srpske arhiepiskopije i uloga Svetog Save", "tekst": "Sava je 1219. u Nikeji dobio pristanak za arhiepiskopiju, a sedište je 1220. u Žiči."}, "lekcija": 5}, {"id": "l05-dopuni-sava-kraj-tesko", "vrsta": "dopuni", "tezina": "tesko", "pojmovi": ["sveti-sava", "trnovo", "sveta-zemlja"], "pitanje": "Dopuni rečenicu (bez ponuđenih reči).", "tekst": "Sava je arhiepiskopijom upravljao do {{1233.|1233}}, a umro je {{1236.|1236}} u {{Trnovu}}, vraćajući se iz {{Svete zemlje}}.", "pomoc": ["Upravljao je četrnaest godina od 1219.", "Smrt je tri godine posle kraja upravljanja.", "Iz lekcije: 1219–1233; 1236. u Trnovu, povratak iz Svete zemlje."], "objasnjenje": "Sava je upravljao crkvom 1219–1233, a umro je 1236. u Trnovu.", "iz_udzbenika": {"strana": 28, "odeljak": "Osnivanje samostalne srpske arhiepiskopije i uloga Svetog Save", "tekst": "Sava je arhiepiskopijom upravljao 1219–1233, a umro je 1236. u Trnovu."}, "lekcija": 5}, {"id": "l05-povezi-pojmovi", "vrsta": "povezi", "tezina": "lako", "pojmovi": ["autokefalnost", "tipik", "krmcija"], "pitanje": "Poveži pojam sa objašnjenjem.", "parovi": [["autokefalnost", "nezavisnost crkve u odnosu na drugu crkvenu vlast"], ["tipik", "pravilnik po kom teče život u manastiru"], ["krmčija", "knjiga propisa crkvenog i građanskog prava"]], "pomoc": ["Tipik je za manastir.", "Krmčija ima pravne propise.", "Iz lekcije: to su tri pojma iz okvira na str. 29."], "objasnjenje": "Autokefalnost je nezavisnost crkve, tipik manastirski pravilnik, krmčija zbornik propisa.", "iz_udzbenika": {"strana": 29, "odeljak": "Osnivanje samostalne srpske arhiepiskopije i uloga Svetog Save", "tekst": "Autokefalnost, tipik i krmčija objašnjeni su u okviru."}, "lekcija": 5}, {"id": "l05-povezi-sava-godine", "vrsta": "povezi", "tezina": "srednje", "pojmovi": ["sveti-sava", "manastir-zica", "srpska-arhiepiskopija", "trnovo"], "pitanje": "Poveži godinu sa događajem iz Savinog života.", "parovi": [["1219.", "Sava dobija autokefalnu arhiepiskopiju"], ["1220.", "sedište arhiepiskopije u Žiči"], ["1233.", "kraj Savinog upravljanja arhiepiskopijom"], ["1236.", "smrt u Trnovu"]], "pomoc": ["Poslednja godina je smrt.", "Sedište je smešteno godinu posle osnivanja.", "Iz lekcije: 1219, 1220, 1233, 1236."], "objasnjenje": "Samostalnost 1219, Žiča 1220, kraj upravljanja 1233, smrt 1236.", "iz_udzbenika": {"strana": 28, "odeljak": "Osnivanje samostalne srpske arhiepiskopije i uloga Svetog Save", "tekst": "Sava je dobio samostalnost 1219, sedište je u Žiči od 1220, upravljao je do 1233, a umro je 1236."}, "lekcija": 5}, {"id": "l05-zakljuci-zasto-samostalna", "vrsta": "zakljuci", "tezina": "lako", "pojmovi": ["srpska-arhiepiskopija", "ohridska-arhiepiskopija"], "pitanje": "Zašto su srpski vladari želeli samostalnu crkvu?", "odgovori": [{"tekst": "Država je bila nezavisna, a crkva je i dalje zavisila od grčkog arhiepiskopa", "tacan": true}, {"tekst": "Hteli su da pređu u bogumilsku veru", "tacan": false, "zasto": "Bogumile su progonili; želeli su samostalnu pravoslavnu crkvu."}, {"tekst": "Papa im je zabranio da imaju crkvu", "tacan": false, "zasto": "Knjiga to ne kaže; srpska crkva je zavisila od Ohrida."}, {"tekst": "Hilandar je bio razoren", "tacan": false, "zasto": "Hilandar je ostao središte kulture; razlog je zavisnost crkve."}], "pomoc": ["Korak 1: Šta je država već imala?", "Korak 2: Šta je crkvi nedostajalo?", "Iz lekcije: pošto su izborili nezavisnost države, želeli su samostalnost i za crkvu."], "objasnjenje": "Državnoj nezavisnosti je trebalo pridružiti i crkvenu.", "iz_udzbenika": {"strana": 28, "odeljak": "Osnivanje samostalne srpske arhiepiskopije i uloga Svetog Save", "tekst": "Pošto su vladari izborili nezavisnost države, želeli su samostalnost i za crkvu."}, "lekcija": 5}, {"id": "l05-zakljuci-autokefalnost-posledica", "vrsta": "zakljuci", "tezina": "srednje", "pojmovi": ["autokefalnost", "episkopije"], "pitanje": "Pre 1219. glava crkve je putovala do više crkvene vlasti radi posvećenja. Zašto je ukidanje tih putovanja znak samostalnosti?", "odgovori": [{"tekst": "Crkva sama, preko domaćih episkopa, bira svoju glavu i ne zavisi od tuđe potvrde", "tacan": true}, {"tekst": "Putevi su tada postali opasni zbog krstaša", "tacan": false, "zasto": "Knjiga to ne navodi; razlog je što domaći episkopi sada sami biraju."}, {"tekst": "Patrijarh je zabranio dolaske iz Srbije", "tacan": false, "zasto": "Patrijarh je upravo dao pristanak; nije zabrana, nego samostalnost."}, {"tekst": "Crkvu je od tada vodio kralj", "tacan": false, "zasto": "Crkvu i dalje vodi crkveni poglavar, koga biraju domaći episkopi."}], "pomoc": ["Korak 1: Ko odlučuje o glavi crkve pre 1219?", "Korak 2: Ko odlučuje posle?", "Iz lekcije: autokefalnost 1219 → glavu crkve biraju domaći episkopi, nema više odlaska patrijarhu."], "objasnjenje": "Samostalnost se vidi u tome što odluka ostaje u zemlji: domaći episkopi biraju, bez odlaska patrijarhu.", "iz_udzbenika": {"strana": 28, "odeljak": "Osnivanje samostalne srpske arhiepiskopije i uloga Svetog Save", "tekst": "Glavu srpske crkve od tada biraju domaći episkopi i on više ne putuje patrijarhu radi posvećenja."}, "osa": {"naziv": "Samostalna srpska arhiepiskopija", "od": 1219, "traka": "crkva-kultura"}, "lekcija": 5}, {"id": "l05-zakljuci-pristanak-iz-nikeje", "vrsta": "zakljuci", "tezina": "srednje", "pojmovi": ["sveti-sava", "nikeja", "ohridska-arhiepiskopija"], "pitanje": "Sava je samostalnost dobio od patrijarha, iako je srpska crkva zavisila od ohridskog arhiepiskopa. Šta to pokazuje?", "odgovori": [{"tekst": "Patrijarh je imao višu crkvenu vlast od koje se mogla dobiti takva dozvola", "tacan": true}, {"tekst": "Ohridski arhiepiskop je bio srpski kralj", "tacan": false, "zasto": "Knjiga ga naziva grčkim arhiepiskopom; kralj je bio Stefan."}, {"tekst": "Patrijarh je bio potčinjen Savi", "tacan": false, "zasto": "Sava je došao da traži pristanak i od patrijarha je rukopoložen."}, {"tekst": "Sava je došao u Nikeju zbog krune", "tacan": false, "zasto": "Kruna je Stefanova, dobijena od pape."}], "pomoc": ["Korak 1: Od koga je Sava dobio pristanak?", "Korak 2: Zašto je išao tako daleko umesto da ostane kod ohridskog arhiepiskopa?", "Iz lekcije: od patrijarha je 1219. dobio pristanak."], "objasnjenje": "Sava je išao do patrijarha, što pokazuje da je pristanak morao doći odozgo, od više crkvene vlasti.", "iz_udzbenika": {"strana": 28, "odeljak": "Osnivanje samostalne srpske arhiepiskopije i uloga Svetog Save", "tekst": "Od patrijarha je 1219. dobio pristanak za nezavisnu srpsku arhiepiskopiju."}, "lekcija": 5}, {"id": "l05-zakljuci-krmcija-ugled", "vrsta": "zakljuci", "tezina": "tesko", "pojmovi": ["svetosavska-krmcija", "vizantija", "sveti-sava"], "pitanje": "Srpska crkva je 1219. postala samostalna, a ipak je zbornik propisa preveden s grčkog. Šta se iz toga vidi?", "odgovori": [{"tekst": "Samostalnost nije značila odbacivanje grčkog znanja; ono se koristilo za uređenje sopstvene crkve", "tacan": true}, {"tekst": "Srbi su i dalje morali da slušaju ohridskog arhiepiskopa", "tacan": false, "zasto": "Upravo od toga su se oslobodili; prevod ne znači potčinjenost."}, {"tekst": "Krmčija nije bila važna u Srbiji", "tacan": false, "zasto": "Knjiga kaže da je uživala veliki ugled."}, {"tekst": "Grčki je tada bio jedini jezik u Srbiji", "tacan": false, "zasto": "Knjiga to ne kaže; preveden je upravo zato da se koristi kod Srba."}], "pomoc": ["Korak 1: Da li je samostalnost isto što i odbacivanje svega stranog?", "Korak 2: Zašto prevoditi tuđe propise?", "Iz lekcije: s grčkog je preveden zbornik koji je u Srbiji uživao veliki ugled."], "objasnjenje": "Crkva je organizaciono samostalna, a vizantijska pravna znanja preuzima i koristi.", "iz_udzbenika": {"strana": 28, "odeljak": "Osnivanje samostalne srpske arhiepiskopije i uloga Svetog Save", "tekst": "Svetosavska krmčija je prevedena s grčkog i uživala je veliki ugled."}, "lekcija": 5}, {"id": "l05-zakljuci-dva-koraka", "vrsta": "zakljuci", "tezina": "tesko", "pojmovi": ["stefan-prvovencani", "sveti-sava", "autokefalnost"], "pitanje": "Kruna je stigla iz Rima, a samostalnost crkve iz Nikeje. Šta nam to govori o braći Nemanjić?", "odgovori": [{"tekst": "Svaki je svoj cilj ostvario kod onog autoriteta od koga je to moglo da se dobije", "tacan": true}, {"tekst": "Bili su u sukobu i ratovali jedan protiv drugog", "tacan": false, "zasto": "Knjiga ne govori o ratu među njima, a oba cilja jačaju istu državu."}, {"tekst": "Obojica su primila krunu", "tacan": false, "zasto": "Krunu je primio samo Stefan, a Sava crkvenu službu."}, {"tekst": "Obojica su postali monasi u Nikeji", "tacan": false, "zasto": "Stefan je bio kralj, a Sava je u Nikeji rukopoložen."}], "pomoc": ["Korak 1: Od koga je stigla kruna, a od koga crkvena samostalnost?", "Korak 2: Da li je cilj zajednički?", "Iz lekcije: 1217. kruna od pape, 1219. pristanak od patrijarha."], "objasnjenje": "Stefan i Sava išli su ka zajedničkom cilju, samostalnoj državi i crkvi, kod različitih autoriteta.", "iz_udzbenika": {"strana": 29, "odeljak": "Zapamtite", "tekst": "Stefan je 1217. dobio krunu od pape, a crkvena samostalnost usledila je 1219."}, "lekcija": 5}, {"id": "l05-datum-1219", "vrsta": "datum", "tezina": "lako", "pojmovi": ["srpska-arhiepiskopija", "autokefalnost"], "dogadjaj": "Samostalna srpska arhiepiskopija", "pitanje": "Koje godine je Srpska cr ", "pitanje": "Na šta se tvrdnja odnosi: tipik, krmčija, oba ili nijedno?", "tvrdnje": [{"tekst": "Uređuje život u manastiru.", "odgovor": "a", "zasto": "To je tipik."}, {"tekst": "Sadrži propise crkvenog i građanskog prava.", "odgovor": "b", "zasto": "To je krmčija."}, {"tekst": "Ovu vrstu dela Sava je pisao za manastire.", "odgovor": "a", "zasto": "Sava je pisao manastirske tipike."}, {"tekst": "Zbornik ove vrste preveden je s grčkog.", "odgovor": "b", "zasto": "Svetosavska krmčija je prevedena s grčkog."}, {"tekst": "Sadrži pravila.", "odgovor": "oba", "zasto": "Obe vrste knjiga propisuju pravila."}, {"tekst": "Opisuje život velikog župana.", "odgovor": "nijedan", "zasto": "To radi biografija Stefana Nemanje."}], "pomoc": ["Tipik je uži, samo za manastir.", "Krmčija ide i na građansko pravo.", "Iz lekcije: tipik je manastirski pravilnik, krmčija zbornik propisa."], "objasnjenje": "Tipik važi za manastir, a krmčija i za crkvu i za građansko pravo.", "iz_udzbenika": {"strana": 29, "odeljak": "Osnivanje samostalne srpske arhiepiskopije i uloga Svetog Save", "tekst": "Tipik i krmčija objašnjeni su u okviru na str. 29."}, "lekcija": 5}, {"id": "l05-uporedi-pre-posle-1219", "vrsta": "uporedi", "tezina": "srednje", "pojmovi": ["autokefalnost", "ohridska-arhiepiskopija", "srpska-arhiepiskopija"], "a": "Pre 1219.", "b": "Posle 1219.", "pitanje": "Na koji period se tvrdnja odnosi: pre 1219, posle 1219, oba ili nijedan?", "tvrdnje": [{"tekst": "Srpska crkva zavisi od ohridskog arhiepiskopa.", "odgovor": "a", "zasto": "To je stanje pre samostalnosti."}, {"tekst": "Glavu crkve biraju domaći episkopi.", "odgovor": "b", "zasto": "To donosi autokefalnost."}, {"tekst": "Sedište arhiepiskopije je u Žiči.", "odgovor": "b", "zasto": "Sedište je smešteno u Žiču 1220."}, {"tekst": "Glava crkve putuje patrijarhu radi posvećenja.", "odgovor": "a", "zasto": "Posle 1219. to više nije potrebno."}, {"tekst": "Hilandar je srpski manastir.", "odgovor": "oba", "zasto": "Hilandar je podignut za ka": {"strana": 29, "odeljak": "Zapamtite", "tekst": "Stefan je 1217. dobio krunu, a samostalnost crkve došla je 1219."}, "lekcija": 5}, {"id": "l05-uporedi-hilandar-zica", "vrsta": "uporedi", "tezina": "tesko", "pojmovi": ["manastir-hilandar", "manastir-zica"], "a": "Hilandar", "b": "Žiča", "pitanje": "Na koji manastir se tvrdnja odnosi: Hilandar, Žiča, oba ili nijedan?", "tvrdnje": [{"tekst": "Nalazi se na Svetoj Gori.", "odgovor": "a", "zasto": "To je Hilandar."}, {"tekst": "Nalazi se kod Kraljeva.", "odgovor": "b", "zasto": "To je Žiča."}, {"tekst": "Veoma je važan za Srbe prema rubrici Zapamtite.", "odgovor": "oba", "zasto": "Rubrika izdvaja oba manastira."}, {"tekst": "U njemu je sedište arhiepiskopije od 1220.", "odgovor": "b", "zasto": "Sedište je u Žiči."}, {"tekst": "Podigli su ga Nemanja i Sava.", "odgovor": "a", "zasto": "Knjiga to kaže za Hilandar."}, {"tekst": "U njemu je umro Sveti Sava.", "odgovor": "nijedan", "zasto": "Sava je umro u Trnovu."}], "pomoc": ["Jedan je na Svetoj Gori, drugi u Srbiji.", "Umro je u Bugarskoj, dakle ni u jednom.", "Iz lekcije: Hilandar na Svetoj Gori i Žiča kod Kraljeva."], "objasnjenje": "Hilandar je kulturno, a Žiča crkveno-administrativno središte.", "iz_udzbenika": {"strana": 29, "odeljak": "Zapamtite", "tekst": "Dva važna manastira su Hilandar na Svetoj Gori i Žiča kod Kraljeva."}, "lekcija": 5}, {"id": "l05-kosam-sava", "vrsta": "ko_sam", "tezina": "srednje", "pojmovi": ["sveti-sava", "srpska-arhiepiskopija", "trnovo"], "tragovi": ["Bio sam monah na Svetoj Gori pre svog oca.", "U Nikeji sam dobio pristanak za samostalnu crkvu.", "Umro sam u Trnovu, vraćajući se iz Svete zemlje."], "odgovori": [{"tekst": "Sava Nemanjić", "tacan": true}, {"tekst": "Stefan Prvovenčani", "tacan": false, "zasto": "On je kralj koji je dobio krunu, a nije bio u Nikeji."}, {"tekst": "nikejski patrijarh", "tacan": false, "zasto": "Patrijarh je pristanak dao, a nije ga tražio."}, {"tekst": "Stefan Nemanja", "tacan": false, "zasto": "Nemanja je umro u Hilandaru 1199."}], "objasnjenje": "To je Sava Nemanjić, Sveti Sava, prvi srpski arhiepiskop.", "iz_udzbenika": {"strana": 28, "odeljak": "Osnivanje samostalne srpske arhiepiskopije i uloga Svetog Save", "tekst": "Sava je iz Nikeje doneo samostalnost crkve, a umro je 1236. u Trnovu.", "slika": "05-srpska-drzava-prvih-nemanjica/06-sveti-sava-mileseva.jpg"}, "lekcija": 5}, {"id": "l05-kosam-pojam-tesko", "vrsta": "ko_sam", "tezina": "tesko", "pojmovi": ["svetosavska-krmcija", "krmcija"], "tragovi": ["Nisam čovek, nego knjiga.", "U meni se nalaze crkveni i građanski propisi.", "Prevedena sam s grčkog i u Srbiji sam imala veliki ugled."], "odgovori": [{"tekst": "Svetosavska krmčija", "tacan": true}, {"tekst": "manastirski tipik", "tacan": false, "zasto": "Tipik uređuje život u manastiru; ne sabira građanske propise."}, {"tekst": "biografija Stefana Nemanje", "tacan": false, "zasto": "Biografija priča o životu vladara, a ne donosi propise."}, {"tekst": "kraljevska kruna", "tacan": false, "zasto": "Kruna nije knjiga; dobio ju je Stefan od pape."}], "objasnjenje": "Svetosavska krmčija je zbornik crkvenog i građanskog prava preveden s grčkog.", "iz_udzbenika": {"strana": 28, "odeljak": "Osnivanje samostalne srpske arhiepiskopije i uloga Svetog Save", "tekst": "S grčkog je preveden zbornik crkvenog i svetovnog prava, tzv. Svetosavska krmčija."}, "lekcija": 5}, {"id": "l05-objasni-autokefalnost", "vrsta": "objasni", "tezina": "lako", "pojmovi": ["autokefalnost", "sveti-sava"], "pitanje": "Šta je autokefalnost i šta se njome promenilo u srpskoj crkvi?", "uzor": "Autokefalnost je nezavisnost crkve od druge crkvene vlasti. Srpska crkva ju je dobila 1219. Od tada glavu crkve biraju domaći episkopi i on više ne putuje patrijarhu radi posvećenja.", "ideje": ["Autokefalnost je nezavisnost crkve.", "Dobijena je 1219.", "Glavu crkve biraju domaći episkopi.", "Nema više odlaska patrijarhu."], "objasnjenje": "Definicija se povezuje sa konkretnom promenom.", "iz_udzbenika": {"strana": 28, "odeljak": "Osnivanje samostalne srpske arhiepiskopije i uloga Svetog Save", "tekst": "Autokefalnost znači da glavu srpske crkve biraju domaći episkopi."}, "lekcija": 5}, {"id": "l05-objasni-sava-uloga", "vrsta": "objasni", "tezina": "lako", "pojmovi": ["sveti-sava", "tipik", "svetosavska-krmcija", "episkopije"], "pitanje": "Navedi šta je Sava učinio za srpsku crkvu.", "uzor": "Sava je 1219. u Nikeji dobio samostalnu arhiepiskopiju i postao njen prvi arhiepiskop. Sedište je smestio u Žiču, a osnivane su nove episkopije. Pisao je tipike, a s grčkog je prevedena krmčija.", "ideje": ["Dobio je samostalnost crkve 1219.", "Bio je prvi arhiepiskop.", "Sedište je smešteno u Žiču.", "Pisao je tipike i osnivane su nove episkopije."], "objasnjenje": "Savin doprinos je i u ustanovama i u knjigama.", "iz_udzbenika": {"strana": 28, "odeljak": "Osnivanje samostalne srpske arhiepiskopije i uloga Svetog Save", "tekst": "Sava je izdejstvovao samostalnost, bio prvi arhiepiskop i pisao crkvena dela."}, "lekcija": 5}, {"id": "l05-objasni-nikeja", "vrsta": "objasni", "tezina": "srednje", "pojmovi": ["nikeja", "krstasi", "sveti-sava"], "pitanje": "Objasni kako je Četvrti krstaški rat uticao na to gde je Sava morao da ode za samostalnost crkve.", "uzor": "Krstaši su zauzeli Carigrad i vizantijski car i patrijarh su se preselili u Nikeju. Zato je Sava za pristanak morao da ide tamo, a ne u Carigrad. Tako je događaj iz svetske istorije uticao na srpsku crkvu.", "ideje": ["Krstaši su zauzeli Carigrad.", "Car i patrijarh su se preselili u Nikeju.", "Sava je zato tražio pristanak u Nikeji."], "objasnjenje": "Povezuju se opšta i nacionalna istorija.", "iz_udzbenika": {"strana": 28, "odeljak": "Osnivanje samostalne srpske arhiepiskopije i uloga Svetog Save", "tekst": "Sava je otputovao u Nikeju, kuda su se posle Četvrtog krstaškog rata preselili car i patrijarh."}, "lekcija": 5}, {"id": "l05-objasni-obrazovanje", "vrsta": "objasni", "tezina": "srednje", "pojmovi": ["episkopije", "tipik", "svetosavska-krmcija"], "pitanje": "Kako je samostalna crkva doprinela obrazovanju u Srbiji?", "uzor": "Nove episkopije postale su žarišta duhovnog života, vere i obrazovanja. Sava je pisao tipike koji su služili obrazovanju sveštenstva. Prevedena je i Svetosavska krmčija, zbornik koji je imao veliki ugled.", "ideje": ["Nove episkopije su središta obrazovanja.", "Tipici su služili obrazovanju sveštenstva.", "Prevedena je Svetosavska krmčija."], "objasnjenje": "Crkva je u srednjem veku bila i obrazovna ustanova.", "iz_udzbenika": {"strana": 28, "odeljak": "Osnivanje samostalne srpske arhiepiskopije i uloga Svetog Save", "tekst": "Nove episkopije postale su žarišta obrazovanja, a tipici su služili obrazovanju sveštenstva."}, "lekcija": 5}, {"id": "l05-objasni-drzava-crkva", "vrsta": "objasni", "tezina": "tesko", "pojmovi": ["stefan-prvovencani", "sveti-sava", "autokefalnost", "kraljevska-kruna"], "pitanje": "Zašto kažemo da je između 1217. i 1219. Srbija dobila dve vrste samostalnosti? Objasni vezu između krune i autokefalnosti.", "uzor": "Stefan je 1217. dobio kraljevsku krunu, pa je država stekla viši položaj. Sava je 1219. dobio samostalnu arhiepiskopiju, pa crkva više nije zavisila od Ohrida. Veza je u tome što su vladari, kad su izborili nezavisnost države, želeli isto i za crkvu.", "ideje": ["Kruna 1217. je državni uspeh.", "Autokefalnost 1219. je crkveni uspeh.", "Državna nezavisnost je dovela do težnje za crkvenom.", "Oba uspeha su delo Nemanjinih sinova."], "objasnjenje": "Odgovor treba da pokaže uzročnu vezu, a ne samo dva datuma.", "iz_udzbenika": {"strana": 29, "odeljak": "Zapamtite", "tekst": "Stefan je 1217. dobio krunu, a crkvena samostalnost usledila je dve godine kasnije."}, "lekcija": 5}]}, {"naslov": "6. Uspon i širenje kraljevine Srbije", "zadaci": [{"id": "l06-izbor-sasi-ko", "vrsta": "izbor", "tezina": "lako", "pojmovi": ["sasi", "rudarstvo", "erdelj"], "pitanje": "Ko su bili Sasi?", "odgovori": [{"tekst": "nemački rudari", "tacan": true}, {"t
