<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ispitivanje — lekcije 3, 4, 5, 6 i 10</title>
<style>

 :root{--hub-bg:#faf8f2;--hub-card:#fff;--hub-ink:#2b2b2b;--hub-head:#3a3528;--hub-mute:#6b6456;--hub-line:#e6e0d2;--hub-soft:#f3ecd8;--hub-accent:#b1271f;--hub-ok:#1f7a3a;--hub-nav-w:280px;--hub-drawer-w:440px}
 html:has(.app-body){overflow:hidden}
 .app-body{margin:0;height:100vh;height:100dvh;overflow:hidden;display:flex;flex-direction:column;max-width:100vw;background:var(--hub-bg);color:var(--hub-ink);font-family:system-ui,Segoe UI,Roboto,Arial,sans-serif}
 .app-bar{flex:0 0 auto;display:flex;align-items:center;gap:14px;padding:8px 16px;background:var(--hub-card);border-bottom:1px solid var(--hub-line);min-width:0;position:relative;z-index:50}
 .app-bar .app-menu{display:none;padding:0;width:36px;height:34px;font-size:18px;line-height:1;border:1px solid var(--hub-line);background:var(--hub-card);color:var(--hub-head);border-radius:7px;cursor:pointer}
 .app-bar .app-menu:hover{background:var(--hub-soft);color:var(--hub-head)}
 .brand{font-weight:700;font-size:15px;color:var(--hub-head);text-decoration:none;white-space:nowrap}
 .brand:hover{color:var(--hub-accent)}
 .app-crumbs{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--hub-mute);min-width:0;overflow:hidden;white-space:nowrap}
 .app-crumbs a{color:var(--hub-mute);text-decoration:none}
 .app-crumbs a:hover{color:var(--hub-accent)}
 .app-crumbs .sep{color:#b9b2a0}
 .app-crumbs .cur{color:var(--hub-head);font-weight:600;overflow:hidden;text-overflow:ellipsis}
 .bar-right{margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end;min-width:0}
 .app-grid{flex:1 1 auto;display:grid;grid-template-columns:var(--hub-nav-w) minmax(0,1fr);min-height:0}
 .app-nav{background:var(--hub-card);border-right:1px solid var(--hub-line);overflow:auto;padding:10px 10px 40px;min-height:0}
 .app-filter{width:100%;font:inherit;font-size:13px;padding:7px 9px;border:1px solid var(--hub-line);border-radius:6px;margin:0 0 4px;background:#fff;color:var(--hub-ink)}
 .app-filter:focus{outline:none;border-color:var(--hub-mute)}
 .app-nav .sec{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--hub-mute);padding:12px 6px 4px}
 .app-nav .cnt{font-size:11px;color:var(--hub-mute);font-variant-numeric:tabular-nums;letter-spacing:0;text-transform:none}
 .f-hide{display:none!important}
 .app-main{position:relative;overflow:auto;min-width:0;min-height:0;transition:margin-right .18s ease}
 .app-drawer{position:fixed;top:var(--htop,50px);right:0;bottom:0;width:var(--hub-drawer-w);max-width:100vw;background:var(--hub-card);border-left:1px solid var(--hub-line);box-shadow:-8px 0 24px rgba(58,53,40,.10);transform:translateX(105%);transition:transform .18s ease;z-index:60;display:flex;flex-direction:column}
 .app-drawer.open{transform:none}
 .drawer-head{display:flex;align-items:flex-start;gap:10px;padding:14px 16px 10px;border-bottom:1px solid var(--hub-line)}
 .drawer-head h2{margin:0;font-size:16px;color:var(--hub-head);flex:1 1 auto;overflow-wrap:anywhere}
 .app-drawer .drawer-close{border:0;background:none;padding:0 4px;font-size:24px;line-height:1;cursor:pointer;color:var(--hub-mute)}
 .app-drawer .drawer-close:hover{background:none;color:var(--hub-accent)}
 .drawer-body{flex:1 1 auto;overflow:auto;padding:12px 16px 24px;font-size:13px;line-height:1.55}
 .drawer-foot{flex:0 0 auto;border-top:1px solid var(--hub-line);padding:10px 16px;font-size:12px;color:var(--hub-mute)}
 .mtabs{display:flex;gap:2px;border-bottom:1px solid var(--hub-line);flex-wrap:wrap;background:var(--hub-card);padding:0 12px}
 .mtabs a{text-decoration:none;color:var(--hub-mute);font-size:13px;padding:9px 12px 8px;border-bottom:2px solid transparent}
 .mtabs a[aria-current="page"]{color:var(--hub-head);border-bottom-color:var(--hub-accent);font-weight:600}
 .bar-menu-wrap{position:relative}
 .bar-menu{display:none;position:absolute;right:0;top:calc(100% + 8px);z-index:70;background:var(--hub-card);border:1px solid var(--hub-line);border-radius:10px;box-shadow:0 6px 20px rgba(0,0,0,.16);padding:8px;min-width:240px}
 .bar-menu.open{display:flex;flex-direction:column;align-items:stretch;gap:6px}
 .tbl{width:100%;border-collapse:collapse;background:var(--hub-card);border:1px solid var(--hub-line);border-radius:6px;font-size:13px}
 .tbl th{text-align:left;font-weight:600;font-size:11.5px;color:var(--hub-mute);padding:8px 10px;border-bottom:1px solid var(--hub-line);background:#fcfaf4;white-space:nowrap}
 .tbl td{padding:7px 10px;border-bottom:1px solid #f0ebe0;vertical-align:top}
 .tbl td.num,.tbl th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
 .tbl tr.clk{cursor:pointer} .tbl tr.clk:hover td{background:#fbf7ec}
 @media (min-width:1200px){ .app-body:has(.app-drawer.open) .app-main{margin-right:var(--hub-drawer-w)} }
 @media (max-width:760px){
   .app-bar{gap:10px;padding:8px 12px}
   .app-bar .app-menu{display:inline-block}
   .app-crumbs{display:none}
   .app-grid{grid-template-columns:minmax(0,1fr)}
   .app-nav{position:fixed;top:var(--htop,50px);left:0;bottom:0;width:300px;max-width:88vw;z-index:55;transform:translateX(-105%);transition:transform .18s ease;box-shadow:8px 0 24px rgba(58,53,40,.10)}
   .app-nav.open{transform:none}
   .app-drawer{width:100vw}
 }
 @media print{
   html:has(.app-body){overflow:visible}
   .app-body{height:auto;overflow:visible;display:block}
   .app-grid{display:block}
   .app-main,.app-nav{overflow:visible}
   .app-drawer,.app-filter,.app-menu,.bar-menu-wrap,.mtabs{display:none!important}
 }

 .les{max-width:860px;padding:22px 28px 80px;line-height:1.6;color:#2b2b2b}
 .les h1{font-size:25px;margin:0 0 4px;color:#3a3528}
 .les .meta{color:#6b6456;font-size:13.5px;margin:0 0 6px}
 .les .meta a{color:#b1271f;text-decoration:none}
 .les section{margin:22px 0;scroll-margin-top:12px}
 .les h2{font-size:18px;color:#3a3528;margin:0 0 8px;padding-bottom:5px;border-bottom:1px solid #e6e0d2}
 .les h3{font-size:15.5px;color:#3a3528;margin:0 0 6px}
 .les section.l3{margin-left:14px;padding-left:12px;border-left:3px solid #f3ecd8}
 .les .str{font-size:12px;font-weight:400;color:#6b6456;margin-left:6px;white-space:nowrap}
 .les ul,.les ol{padding-left:22px;margin:6px 0} .les li{margin:3px 0}
 .les p{margin:6px 0}
 .les a{color:#b1271f}
 .les .pojam{border-bottom:1px dotted #b9b2a0}
 .les blockquote{margin:8px 0;padding:6px 14px;border-left:3px solid #c98a2c;background:#fefcf7}
 .les .tbl{overflow-x:auto} .les table{border-collapse:collapse;font-size:14px;margin:8px 0}
 .les th,.les td{border:1px solid #e6e0d2;padding:4px 8px;text-align:left;vertical-align:top} .les th{background:#f3ecd8}
 .strana{margin:26px 0 14px;scroll-margin-top:12px;background:#fff;border:1px solid #e6e0d2;border-radius:10px;overflow:hidden}
 .strana .pg{display:flex;justify-content:space-between;align-items:center;padding:7px 12px;font-size:12.5px;color:#6b6456;background:#fbf7ec;border-bottom:1px solid #e6e0d2}
 .strana .pg b{color:#3a3528}
 .strana .pg button{font:inherit;font-size:12px;border:1px solid #e6e0d2;background:#fff;border-radius:6px;padding:2px 9px;cursor:pointer;color:#3a3528}
 .strana img{display:block;width:100%;height:auto;cursor:zoom-in}
 .strana.zoom{overflow-x:auto} .strana.zoom img{width:auto;max-width:none;cursor:zoom-out}
 .strana.nema{padding:12px;color:#9b9387;font-size:13.5px;background:#fefcf7}
 .notes-lbl{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:#1f7a3a;margin:0 0 -12px}
 .gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin-top:8px}
 .gal figure{margin:0;background:#fff;border:1px solid #e6e0d2;border-radius:8px;overflow:hidden;scroll-margin-top:12px}
 .gal img{display:block;width:100%;height:auto} .gal figcaption{font-size:12.5px;color:#6b6456;padding:6px 9px}
 .hit{animation:hit 2.4s ease-out} @keyframes hit{0%{box-shadow:0 0 0 4px rgba(201,138,44,.55)}100%{box-shadow:0 0 0 4px rgba(201,138,44,0)}}

 :root{--ink:#2b2b2b;--muted:#6b6456;--edge:#b1271f;--accent:#1f7a3a;--border:#e6e0d2;--soft:#fefcf7;--warn:#c98a2c;
       --sea:#cfe6f2;--land:#efeae0;--land-se:#f3ecd8;--bord:#8a8170}
 *{box-sizing:border-box}
 button{font:inherit;padding:7px 14px;border:1px solid var(--edge);background:#fff;color:var(--edge);border-radius:8px;cursor:pointer}
 button:hover{background:var(--edge);color:#fff}
 button.ok{border-color:var(--accent);color:var(--accent)} button.ok:hover{background:var(--accent);color:#fff}
 button:disabled{opacity:.45;cursor:default;background:#fff;color:inherit}
 .opt:disabled,.tn button:disabled,.mcell:disabled,.blank:disabled{opacity:1;cursor:default}
 .opt:disabled:not(.right):not(.wrong){opacity:.6}
 .bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-size:14px}
 .bar-menu-btn{padding:5px 12px;font-size:16px;line-height:1;border-color:var(--muted);color:#3a3528}
 .bar-menu-btn:hover{background:#f3ecd8;color:#3a3528}
 .bar-menu button{width:100%;text-align:left}
 .bar-menu .menu-link{display:block;font-size:13px;color:var(--edge);text-decoration:none;padding:7px 14px;border:1px dashed #e6b0b0;border-radius:8px}
 .stat{background:#f3ecd8;border:1px solid #e1d8c2;border-radius:8px;padding:4px 10px;white-space:nowrap}
 .stat b{font-size:15px;color:var(--accent)}
 .intro p{font-size:14px;color:#4a4434;line-height:1.6;margin:0 0 10px}
 .intro ul{margin:0 0 10px;padding-left:18px;font-size:13.5px;line-height:1.55}
 /* navigation: items */
 .it-row{display:flex;align-items:center;gap:8px;width:100%;border:0;border-radius:5px;background:none;color:var(--ink);font:inherit;font-size:13px;text-align:left;padding:5px 6px;cursor:pointer}
 a.it-row{text-decoration:none;box-sizing:border-box}
 .it-row:hover{background:#f6f1e4;color:var(--ink)}
 .it-row.sel{background:#efe7d2;font-weight:600}
 .it-row.off{opacity:.4}
 .it-row .st{flex:0 0 16px;text-align:center;color:#b9b2a0}
 .it-row.ok .st{color:var(--accent)} .it-row.rev .st,.it-row.fail .st{color:var(--edge)} .it-row.part .st{color:var(--warn)}
 .it-row .lbl{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
 .it-row .pt{flex:0 0 auto;font-size:11px;color:var(--muted);font-weight:400;font-variant-numeric:tabular-nums}
 .tz{flex:0 0 auto;display:inline-block;min-width:1.5em;text-align:center;font-size:10px;font-weight:700;border-radius:8px;padding:1px 5px;letter-spacing:.02em}
 .tz-lako{background:#e3f2e8;color:#1f6b3a} .tz-srednje{background:#fbefd5;color:#8a5a14} .tz-tesko{background:#f8dcd8;color:#8a2a22}
 .tz-legend{display:flex;gap:8px;flex-wrap:wrap;font-size:11px;color:var(--muted);padding:2px 6px 0}
 /* main: item */
 .item{padding:20px 24px 40px;max-width:1100px}
 .ihead{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-bottom:8px}
 .vchip{font-size:11px;text-transform:uppercase;letter-spacing:.05em;border:1px solid var(--border);border-radius:9px;padding:1px 8px;background:#fff}
 .item h2.q{font-size:18px;line-height:1.4;color:#3a3528;margin:0 0 14px}
 .opts{display:flex;flex-direction:column;gap:8px;max-width:640px}
 .opt{display:flex;gap:10px;align-items:flex-start;text-align:left;border:1px solid var(--border);background:#fff;color:var(--ink);border-radius:8px;padding:10px 12px;font-size:14.5px;line-height:1.4}
 .opt:hover{background:#fbf7ec;color:var(--ink)}
 .opt.picked{border-color:#3a3528;background:#f6f1e4}
 .opt.wrong{border-color:#e6b0b0;background:#fdecec;color:#8a2a22} .opt.wrong .ot{text-decoration:line-through}
 .opt.right{border-color:#9fd5b6;background:#e8f5ec;color:#13602c;font-weight:600}
 .opt .box{flex:0 0 18px;height:18px;border:1.5px solid #6b6456;border-radius:4px;margin-top:1px}
 .opt.picked .box{background:#3a3528;box-shadow:inset 0 0 0 3px #fff}
 .opt.round .box{border-radius:50%}
 .tn{display:flex;gap:12px;margin:4px 0 14px}
 .tn button{min-width:8em;padding:10px 18px;font-size:15px}
 .tn button.right{background:var(--accent);border-color:var(--accent);color:#fff}
 .tn button.wrong{background:#fdecec;border-color:#e6b0b0;color:#8a2a22}
 .stmt{font-size:16px;line-height:1.5;border-left:3px solid #e1d8c2;padding:6px 12px;margin:0 0 14px;background:#fff}
 .sub-q{font-weight:600;color:#3a3528;margin:16px 0 8px}
 .cloze{font-size:16px;line-height:2.3;max-width:720px}
 .blank{display:inline-block;min-width:5.5em;border:0;border-bottom:2px solid #6b6456;background:#fff;text-align:center;font:inherit;font-weight:600;color:#3a3528;padding:0 6px;margin:0 3px;border-radius:4px 4px 0 0;cursor:pointer}
 input.blank{cursor:text;width:7em}
 .blank:hover{background:#fbf7ec;color:#3a3528}
 .blank.cur{border-bottom-color:var(--edge);background:#fff7f3}
 .blank.lock{border-bottom-color:var(--accent);background:#e8f5ec;color:#13602c;cursor:default}
 .blank.bad{border-bottom-color:var(--edge);background:#fdecec;color:#8a2a22}
 .blank.rev{border-bottom-color:var(--warn);background:#fdf3e2;color:#8a5a14}
 .bank{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 0}
 .bank button{padding:5px 12px;border-color:#6b6456;color:#3a3528;border-radius:16px}
 .bank button:hover{background:#f3ecd8;color:#3a3528}
 .bank button.used{opacity:.3;pointer-events:none}
 .match{display:grid;grid-template-columns:1fr 1fr;gap:10px 28px;max-width:720px}
 .match .col{display:flex;flex-direction:column;gap:8px}
 .mcell{text-align:left;border:1px solid var(--border);background:#fff;color:var(--ink);border-radius:8px;padding:9px 12px;font-size:14px}
 .mcell:hover{background:#fbf7ec;color:var(--ink)}
 .mcell.cur{border-color:#3a3528;box-shadow:0 0 0 2px rgba(58,53,40,.15)}
 .mcell.done{border-color:#9fd5b6;background:#e8f5ec;color:#13602c;cursor:default}
 .mcell.rev{border-color:#ecc98a;background:#fdf3e2;color:#8a5a14;cursor:default}
 .mcell.bad{animation:shake .3s;border-color:#e6b0b0;background:#fdecec}
 .mcell .n{display:inline-block;min-width:1.4em;font-weight:700;margin-right:6px;color:var(--muted)}
 @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
 .iactions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:18px}
 .fb{font-size:14px;font-weight:600;min-height:1.4em}
 .fb.ok{color:var(--accent)} .fb.bad{color:var(--edge)} .fb.info{color:var(--muted);font-weight:400}
 .expl{margin-top:14px;padding:10px 14px;border-radius:8px;background:#e8f5ec;border:1px solid #bfe0c8;color:#13602c;font-size:14px;line-height:1.5;max-width:720px}
 .expl.rev{background:#fdf3e2;border-color:#f0d878;color:#6b4a10}
 .help-inline{display:none}
 /* map */
 .mapwrap{position:relative;margin-top:6px;border:1px solid var(--border);border-radius:8px;overflow:hidden;background:var(--sea);aspect-ratio:1/1;max-height:70vh;touch-action:none}
 .mapwrap svg{width:100%;height:100%;display:block;cursor:crosshair}
 .mapwrap svg.drag{cursor:grabbing}
 .mapwrap .c{fill:var(--land);stroke:var(--bord);stroke-width:.6;vector-effect:non-scaling-stroke}
 .mapwrap .c.se{fill:var(--land-se)}
 .mapwrap .c.se:hover{fill:#e9dcb8}
 .mapwrap .c.hit{fill:#bfe0c8} .mapwrap .c.miss{fill:#f3c9c4} .mapwrap .c.revc{fill:#f6dca6}
 .mapwrap .mk{pointer-events:none}
 .mapwrap .mk circle{stroke:#fff;vector-effect:non-scaling-stroke}
 .mapwrap .mk text{font-size:13px;font-weight:700;paint-order:stroke;stroke:#fff;stroke-width:3px;vector-effect:non-scaling-stroke}
 .zbar{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px}
 .zbar button{width:36px;height:36px;padding:0;font-size:18px;font-weight:700;background:#fff;border-color:#6b6456;color:#3a3528;box-shadow:0 1px 3px rgba(0,0,0,.2)}
 .zbar button:hover{background:#f3ecd8;color:#3a3528}
 .zhint{position:absolute;left:10px;bottom:8px;font-size:11.5px;color:var(--muted);background:rgba(255,255,255,.85);border-radius:6px;padding:3px 8px;pointer-events:none}
 .clues{list-style:none;margin:0 0 6px;padding:0;max-width:720px}
 .clues li{padding:7px 10px;margin:0 0 6px;border-left:3px solid #e1d8c2;background:#fff;font-size:14.5px;line-height:1.45}

 .clues .k{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-right:6px}
 /* drawer content */

 @keyframes flash{0%{background:#fff3c4}100%{background:transparent}}

 .hl ul{margin:0;padding-left:18px} .hl ul li{margin:3px 0}

 .qfig{margin:16px 0 0;max-width:720px} .qfig img{display:block;max-width:100%;max-height:62vh;border-radius:8px;border:1px solid var(--border);cursor:zoom-in}

 .qfig figcaption{font-size:12.5px;color:var(--muted);margin-top:5px}
 .hl figcaption{font-size:11.5px;color:var(--muted);margin-top:4px}
 .hl .book{border-left:3px solid #e1d8c2;padding:2px 0 2px 12px;margin:6px 0 4px}

 .app-drawer .les{padding:0;max-width:none}

 .lekbar{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}
 .lekbar button{font-size:13px;padding:6px 12px}
 /* summary */
 .sum{padding:22px 26px 40px;max-width:860px}
 .sum h1{font-size:22px;margin:0 0 6px;color:#3a3528}
 .sum .big{font-size:30px;font-weight:700;color:var(--accent)}
 .sum .tbl{margin:14px 0}
 .sum .sub{color:var(--muted);margin:0 0 6px} .sum .lead{color:var(--muted);max-width:640px;line-height:1.5}
 .rv{border:1px solid var(--border);border-radius:8px;background:#fff;padding:10px 14px;margin:12px 0}
 .rv .rq{margin:4px 0 8px;font-weight:600;color:#3a3528} .rv .rl{margin:0;font-size:12px;color:var(--muted)}

 /* vremenska osa */
 .osa{position:relative;margin:16px 0 8px;max-width:1100px}

 .osa .ev span small{color:var(--muted)}
 .osa .ev.rv{opacity:.45} .osa .ev.rv span{font-style:italic}
 .osa .ev.vague{background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.55) 0 4px,transparent 4px 8px)}   /* dated by the book only as part of a century */
 .osa .ticks{position:relative;height:22px;margin-left:110px;border-top:2px solid #3a3528}
 .osa .ticks span{position:absolute;top:3px;font-size:11px;color:var(--muted);transform:translateX(-50%)}
 .osa .ticks span::before{content:'';position:absolute;left:50%;top:-6px;height:5px;border-left:1px solid #3a3528}
 .osa-wrap{overflow-x:auto} .osa-wrap .osa{min-width:720px}
 /* moje znanje */
 .box5{display:inline-flex;gap:3px;vertical-align:middle} .box5 i{width:11px;height:11px;border-radius:3px;background:#e6e0d2;display:inline-block}

 .zn-due{color:var(--edge);font-weight:600}
 .placed{font-size:12.5px;color:var(--accent);margin:8px 0 0}
 #msg{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--edge);color:#fff;padding:9px 18px;border-radius:24px;font-size:14px;font-weight:600;opacity:0;transition:opacity .25s;pointer-events:none;z-index:99}

 @media (max-width:760px){

   .chain .ar{transform:rotate(90deg);width:100%;text-align:center} .chain .lk{flex-basis:100%}

<script>
(function () {
  const root = document.documentElement;
  const bar = document.querySelector('.app-bar');
  function setTop() { if (bar) root.style.setProperty('--htop', bar.offsetHeight + 'px'); }
  window.addEventListener('resize', setTop);
  setTop();

  // ☰ navigation (only shown at ≤760px)
  const nav = document.getElementById('app-nav');
  const navBtn = document.getElementById('app-menu');
  const navOverlay = () => window.matchMedia && window.matchMedia('(max-width:760px)').matches;
  function setNav(open) {
    if (!nav) return;
    nav.classList.toggle('open', !!open);
    if (navBtn) navBtn.setAttribute('aria-expanded', String(!!open));
  }
  if (navBtn) navBtn.addEventListener('click', e => { e.stopPropagation(); setNav(!nav.classList.contains('open')); });

  // navigation filter: case- and diacritic-insensitive (š, č, ć, ž, đ)
  const filter = document.getElementById('app-filter');
  const norm = s => String(s || '').toLowerCase().replace(/đ/g, 'd').normalize('NFD').replace(/[̀-ͯ]/g, '');
  function applyFilter() {
    const q = norm(filter.value.trim());
    document.querySelectorAll('#app-nav [data-filter]').forEach(el =>
      el.classList.toggle('f-hide', !!q && !norm(el.dataset.filter).includes(q)));
    document.querySelectorAll('#app-nav [data-filter-group]').forEach(g =>
      g.classList.toggle('f-hide', !!q && !g.querySelector('[data-filter]:not(.f-hide)')));
  }
  if (filter) filter.addEventListener('input', applyFilter);

  // ⋯ menus: a button with data-menu="<id>" toggles .bar-menu#<id>; a button inside closes it
  function setMenu(m, open) {
    m.classList.toggle('open', !!open);
    const b = document.querySelector('[data-menu="' + m.id + '"]');
    if (b) b.setAttribute('aria-expanded', String(!!open));
  }
  document.querySelectorAll('[data-menu]').forEach(btn => {
    const m = document.getElementById(btn.dataset.menu);
    if (!m) return;
    btn.addEventListener('click', e => { e.stopPropagation(); setMenu(m, !m.classList.contains('open')); });
    m.addEventListener('click', e => { e.stopPropagation(); if (e.target.closest('button')) setMenu(m, false); });
  });
  document.addEventListener('click', e => {
    // composedPath: the clicked node may already be re-rendered away (e.g. a step's "next" button)
    if (!e.composedPath().some(n => n.dataset && n.dataset.keepMenus)) document.querySelectorAll('.bar-menu.open').forEach(m => setMenu(m, false));
    if (nav && nav.classList.contains('open') && navOverlay() && !nav.contains(e.target)) setNav(false);
  });
  document.addEventListener('keydown', e => {
    if (e.key !== 'Escape') return;
    document.querySelectorAll('.bar-menu.open').forEach(m => setMenu(m, false));
    const x = document.querySelector('.app-drawer.open .drawer-close');
    if (x && x.offsetParent !== null) x.click();
  });

  window.HubShell = { setNav, setMenu, applyFilter, navOverlay };
})();
</script>

ava i Dunav su na jugu, a Dunav je bio vizantijska granica do koje su Sloveni tek stigli; pradomovina je bila severnije."}, {"tekst": "Između Pive i Tare", "tacan": false, "zasto": "Piva i Tara se pominju uz srpske saveze na Balkanu, dakle posle doseljavanja, a ne u pradomovini."}, {"tekst": "Između Urala i Kaspijskog mora", "tacan": false, "zasto": "To su Vrata naroda, ravnica kroz koju su prošli Huni, a ne slovenska pradomovina."}], "pomoc": ["Pradomovina je na severu, u današnjoj Poljskoj i okolini.", "Obe reke teku kroz današnju Poljsku ili uz nju.", "Iz lekcije: pradomovina je između Odre i Visle, Azovskog mora i Karpata."], "objasnjenje": "Pradomovina Slovena bila je na severu, između Odre i Visle, Azovskog mora i Karpata.", "iz_udzbenika": {"strana": 18, "odeljak": "Život u pradomovini, uzroci i pravci seobe", "tekst": "Sloveni su živeli na severu, između reka Odre i Visle, Azovskog mora i Karpata.", "slika": "03-doseljavanje-srba-na-balkan/01-karta-pradomovina-slovena.jpg"}, "lekcija": 3}, {"id": "l03-zanimanje-izbor", "vrsta": "izbor", "tezina": "lako", "pojmovi": ["stari-sloveni", "pradomovina-slovena"], "pitanje": "Šta je u pradomovini bilo glavno zanimanje Slovena?", "odgovori": [{"tekst": "Stočarstvo", "tacan": true}, {"tekst": "Zemljoradnja", "tacan": false, "zasto": "Zemljoradnja je postojala, ali kao sporedno zanimanje; glavno je bilo stočarstvo."}, {"tekst": "Pomorstvo", "tacan": false, "zasto": "Lekcija ne govori o pomorstvu; Sloveni su bili kopneni narod koji je živeo od stoke."}, {"tekst": "Trgovina u velikim gradovima", "tacan": false, "zasto": "Živeli su u rodovima i plemenima, a ne u trgovačkim gradovima; glavno zanimanje bila je stoka."}], "pomoc": ["Seti se da su se lako selili sa onim što imaju.", "Zemljoradnja je bila sporedna.", "Iz lekcije: glavno zanimanje je stočarstvo, a zemljoradnja je sporedna."], "objasnjenje": "Sloveni su u pradomovini živeli prvenstveno od stočarstva, a zemljoradnja im je bila sporedno zanimanje.", "iz_udzbenika": {"strana": 18, "odeljak": "Život u pradomovini, uzroci i pravci seobe", "tekst": "Glavno zanimanje Slovena u pradomovini bilo je stočarstvo, a zemljoradnja je bila sporedna."}, "lekcija": 3}, {"id": "l03-danasnje-zemlje-izbor", "vrsta": "izbor", "tezina": "srednje", "pojmovi": ["pradomovina-slovena"], "pitanje": "Na prostoru kojih današnjih zemalja je bila pradomovina Slovena? (više tačnih)", "odgovori": [{"tekst": "Istočna i južna Poljska", "tacan": true}, {"tekst": "Ukrajina", "tacan": true}, {"tekst": "Jugozapadna Rusija", "tacan": true}, {"tekst": "Srbija", "tacan": false, "zasto": "Na tlo Srbije Sloveni dolaze tek seobom; pradomovina je bila severno od Karpata i šire."}, {"tekst": "Grčka", "tacan": false, "zasto": "Grčka je vizantijski jug Balkana do kog su Sloveni stizali u pljačkaškim pohodima (Tesalija, Epir), a ne njihova pradomovina."}], "pomoc": ["Pogledaj kartu: Odra, Visla, Dnjepar, Karpati.", "Tri tačna odgovora su sve severno od Karpata i Crnog mora.", "Iz lekcije: današnja istočna i južna Poljska, Ukrajina i jugozapadna Rusija."], "objasnjenje": "Pradomovina se poklapa sa današnjom istočnom i južnom Poljskom, Ukrajinom i jugozapadnom Rusijom.", "iz_udzbenika": {"strana": 18, "odeljak": "Život u pradomovini, uzroci i pravci seobe", "tekst": "Pradomovina odgovara današnjoj istočnoj i južnoj Poljskoj, Ukrajini i jugozapadnoj Rusiji.", "slika": "03-doseljavanje-srba-na-balkan/01-karta-pradomovina-slovena.jpg"}, "lekcija": 3}, {"id": "l03-ime-slovena-izbor", "vrsta": "izbor", "tezina": "srednje", "pojmovi": ["stari-sloveni", "herodot"], "pitanje": "Šta od navedenog tačno opisuje najstarije vesti o Slovenima?", "odgovori": [{"tekst": "Ime Slovena javlja se u VI veku, a o njihovim precima možda piše već Herodot", "tacan": true}, {"tekst": "Herodot u V veku pre n. e. izričito piše o Slovenima pod tim imenom", "tacan": false, "zasto": "Samo se misli da Herodot govori o njihovim precima; samo ime Slovena javlja se tek u VI veku."}, {"tekst": "Ime Slovena prvi put se javlja u IX veku, uz Ćirila i Metodija", "tacan": false, "zasto": "U IX veku Sloveni već odavno žive na Balkanu; ime se javlja u VI veku."}, {"tekst": "O Slovenima su najpre pisali sami Sloveni", "tacan": false, "zasto": "Pre glagoljice i ćirilice Sloveni nisu imali pismo; vesti o njima ostavili su vizantijski pisci."}], "pomoc": ["Razlikuj ime naroda od nagađanja o njegovim precima.", "Ime se javlja u istom veku u kom vlada Justinijan I.", "Iz lekcije: ime u VI veku; o precima se, kako se misli, govori kod Herodota."], "objasnjenje": "Ime Slovena pojavljuje se u VI veku, a pretpostavlja se da je o njihovim precima pisao već Herodot u V veku pre n. e.", "iz_udzbenika": {"strana": 18, "odeljak": "Život u pradomovini, uzroci i pravci seobe", "tekst": "Ime Slovena prvi put se javlja u VI veku, ali se misli da o njihovim precima govori već Herodot."}, "osa": {"naziv": "Prvi pomen slovenskog imena", "od": 500, "do": 600, "oznaka": "VI vek", "traka": "dogadjaji"}, "lekcija": 3}, {"id": "l03-pravci-seobe-izbor", "vrsta": "izbor", "tezina": "srednje", "pojmovi": ["stari-sloveni", "velika-seoba-naroda"], "pitanje": "U kojim pravcima su Sloveni krenuli iz pradomovine i koja grupa je išla ka Balkanu?", "odgovori": [{"tekst": "Na zapad, istok i jug; južna grupa išla je ka Balkanu", "tacan": true}, {"tekst": "Samo na jug; svi Sloveni došli su na Balkan", "tacan": false, "zasto": "Pravca je bilo tri; na Balkan je išla samo južna grupa, a ostale su otišle na zapad i istok."}, {"tekst": "Na sever i jug; severna grupa išla je ka Balkanu", "tacan": false, "zasto": "Balkan je južno od pradomovine, pa je tamo mogla da ide samo južna grupa; sever nije među pravcima."}, {"tekst": "Na zapad i istok; na Balkan nisu išli", "tacan": false, "zasto": "Bio je i treći, južni pravac, i upravo njim su Sloveni stigli do Dunava i na Balkan."}], "pomoc": ["Pravaca ima tri.", "Pogledaj gde je Balkan u odnosu na Karpate.", "Iz lekcije: tri pravca (zapad, istok, jug), južna grupa ide ka Balkanu."], "objasnjenje": "Sloveni su se razišli u tri pravca, a južna grupa, među njima i srpska plemena, krenula je ka Balkanu.", "iz_udzbenika": {"strana": 18, "odeljak": "Život u pradomovini, uzroci i pravci seobe", "tekst": "Po odlasku iz pradomovine Sloveni kreću na zapad, istok i jug; južna grupa ide ka Balkanu."}, "lekcija": 3}, {"id": "l03-vrata-naroda-tn", "vrsta": "tacno_netacno", "tezina": "lako", "pojmovi": ["vrata-naroda", "huni"], "tvrdnja": "Vrata naroda su naziv za ravnicu između Urala i Kaspijskog mora.", "tacno": true, "pomoc": ["To je prolaz iz Azije u Evropu.", "Iz lekcije: tako se zove ravnica između Urala i Kaspijskog mora."], "objasnjenje": "Tačno. Kroz tu ravnicu Huni su prošli 375. i ušli u Evropu.", "iz_udzbenika": {"strana": 18, "odeljak": "Život u pradomovini, uzroci i pravci seobe", "tekst": "Vrata naroda su ravnica između Urala i Kaspijskog mora."}, "osa": {"naziv": "Huni prolaze kroz Vrata naroda", "od": 375, "traka": "dogadjaji"}, "lekcija": 3}, {"id": "l03-srpska-plemena-vii-tn", "vrsta": "tacno_netacno", "tezina": "lako", "pojmovi": ["stari-sloveni", "doseljavanje", "vizantija"], "tvrdnja": "Srpska plemena su bila deo slovenskih seoba i na vizantijsko tlo stigla su u VII veku.", "tacno": true, "pomoc": ["Seti se kada se Sloveni zaista naseljavaju, a ne samo pljačkaju.", "Iz lekcije: među Slovenima su i srpska plemena, a na vizantijsko tlo stižu u VII veku."], "objasnjenje": "Tačno. Srbi su deo južnih Slovena i na vizantijsku teritoriju dolaze u VII veku.", "iz_udzbenika": {"strana": 18, "odeljak": "Uvod", "tekst": "Među Slovenima su i srpska plemena, koja na vizantijsko tlo stižu u VII veku."}, "lekcija": 3}, {"id": "l03-dva-razloga-tn", "vrsta": "tacno_netacno", "tezina": "srednje", "pojmovi": ["velika-seoba-naroda", "stari-sloveni"], "tvrdnja": "Sloveni su napustili pradomovinu isključivo zato što su ih terali Huni.", "tacno": false, "ispravke": [{"tekst": "Bila su dva razloga: pritisak Velike seobe naroda, ali i traženje povoljnijeg mesta za život.", "tacan": true}, {"tekst": "Huni ih nisu terali; otišli su samo zato što su tražili bolje tle.", "tacan": false, "zasto": "Pritisak je stvaran: Huni su na svom putu naterali plemena u bekstvo, a bolje tle je drugi, dodatni razlog."}, {"tekst": "Terali su ih Avari, a ne Huni.", "tacan": false, "zasto": "Avari stižu tek sredinom VI veka; Velika seoba naroda vezuje se za Hune."}], "pomoc": ["Lekcija navodi dva razloga.", "Jedan je sila spolja, a drugi sopstvena želja.", "Iz lekcije: Velika seoba naroda i traženje povoljnijeg mesta za život."], "objasnjenje": "Netačno. Pored hunskog pritiska, Sloveni su i sami tražili bolje mesto za život.", "iz_udzbenika": {"strana": 18, "odeljak": "Život u pradomovini, uzroci i pravci seobe", "tekst": "Lekcija navodi dva razloga seobe: pritisak Velike seobe naroda i potragu za povoljnijim mestom za život."}, "lekcija": 3}, {"id": "l03-rodovi-bez-saveza-tn", "vrsta": "tacno_netacno", "tezina": "srednje", "pojmovi": ["rodovsko-plemenska-zajednica", "plemenski-savezi", "pradomovina-slovena"], "tvrdnja": "U pradomovini Sloveni su već imali čvrste plemenske saveze.", "tacno": false, "ispravke": [{"tekst": "Živeli su u rodovsko-plemenskim zajednicama, još bez plemenskih saveza.", "tacan": true}, {"tekst": "Imali su jedinstvenu državu sa jednim vladarem.", "tacan": false, "zasto": "Države još nije bilo; postojali su rodovi i plemena, a vladari su poticali iz ustaljenih vladarskih rodova pojedinih zajednica."}, {"tekst": "Živeli su u gradovima-državama, kao stari Grci.", "tacan": false, "zasto": "O gradovima-državama nema ni reči; osnovna zajednica bili su rod i pleme."}], "pomoc": ["Savezi nastaju kasnije, u ratovima posle doseljavanja.", "Osnovna zajednica bila je manja od saveza.", "Iz lekcije: rodovsko-plemenske zajednice, još bez saveza."], "objasnjenje": "Netačno. Savezi nastaju tek na Balkanu; u pradomovini su postojale rodovsko-plemenske zajednice, ali sa ustaljenim vladarskim rodovima.", "iz_udzbenika": {"strana": 18, "odeljak": "Život u pradomovini, uzroci i pravci seobe", "tekst": "Živeli su u rodovsko-plemenskim zajednicama, još bez saveza, a vladari su poticali iz ustaljenih vladarskih rodova.", "slika": "03-doseljavanje-srba-na-balkan/02-skupstina-starih-slovena.jpg"}, "lekcija": 3}, {"id": "l03-podredjeni-saveznici-tn", "vrsta": "tacno_netacno", "tezina": "tesko", "pojmovi": ["stari-sloveni", "huni", "bugari", "vizantija"], "tvrdnja": "Do vizantijske granice na Dunavu Sloveni su došli sa Hunima i Bugarima kao ravnopravni saveznici.", "tacno": false, "ispravke": [{"tekst": "Bili su više u podređenom položaju nego pravi saveznici.", "tacan": true}, {"tekst": "Bili su im vođe, a Huni i Bugari su ih slušali.", "tacan": false, "zasto": "Odnos je bio obrnut: Sloveni su bili potčinjeniji deo, a ne predvodnici tih pokreta."}, {"tekst": "Do Dunava su stigli potpuno sami, bez ikakve veze sa njima.", "tacan": false, "zasto": "Stigli su upravo u pokretu sa Hunima i Bugarima, ali u slabijem položaju."}], "pomoc": ["Seti se kako su Huni postupali sa plemenima na svom putu.", "Razmisli ko je u tom pokretu odlučivao.", "Iz lekcije: stigli su sa Hunima i Bugarima, više podređeni nego kao pravi saveznici."], "objasnjenje": "Netačno. Sloveni su se kretali sa Hunima i Bugarima, ali u podređenom položaju, ne kao jednaki partneri.", "iz_udzbenika": {"strana": 18, "odeljak": "Život u pradomovini, uzroci i pravci seobe", "tekst": "Do dunavske granice stigli su sa Hunima i Bugarima, više u podređenom položaju nego kao pravi saveznici."}, "lekcija": 3}, {"id": "l03-pradomovina-dopuni", "vrsta": "dopuni", "tezina": "lako", "pojmovi": ["pradomovina-slovena", "odra", "visla", "karpati"], "pitanje": "Dopuni rečenicu o pradomovini Slovena.", "tekst": "Pradomovina Slovena bila je između reka {{Odre}} i {{Visle}}, Azovskog mora i {{Karpata}}.", "ponudjene": ["Odre", "Visle", "Karpata", "Dunava", "Urala"], "pomoc": ["Dunav je bio granica Vizantije, a Ural je kod Vrata naroda.", "Planine koje tražiš su južna međa pradomovine.", "Iz lekcije: između Odre i Visle, Azovskog mora i Karpata."], "objasnjenje": "Odra, Visla, Azovsko more i Karpati omeđuju pradomovinu Slovena.", "iz_udzbenika": {"strana": 18, "odeljak": "Život u pradomovini, uzroci i pravci seobe", "tekst": "Pradomovina je na severu, između Odre i Visle, Azovskog mora i Karpata.", "slika": "03-doseljavanje-srba-na-balkan/01-karta-pradomovina-slovena.jpg"}, "lekcija": 3}, {"id": "l03-vrata-naroda-dopuni", "vrsta": "dopuni", "tezina": "srednje", "pojmovi": ["vrata-naroda", "huni", "velika-seoba-naroda"], "pitanje": "Dopuni rečenicu o početku Velike seobe naroda.", "tekst": "Prolaz {{Huna}} kroz ravnicu između Urala i {{Kaspijskog}} mora, koja se zove {{Vrata naroda}}, uzima se za početak Velike seobe naroda.", "ponudjene": ["Huna", "Avara", "Kaspijskog", "Azovskog", "Vrata naroda", "Slovenska"], "pomoc": ["Azovsko more je uz pradomovinu Slovena, a ne uz ovu ravnicu.", "Slovenska je naziv zemlje na Balkanu.", "Iz lekcije: Huni, ravnica između Urala i Kaspijskog mora, Vrata naroda."], "objasnjenje": "Huni su 375. prošli kroz Vrata naroda, ravnicu između Urala i Kaspijskog mora.", "iz_udzbenika": {"strana": 18, "odeljak": "Život u pradomovini, uzroci i pravci seobe", "tekst": "Prolaz Huna kroz Vrata naroda 375. uzima se za početak Velike seobe naroda."}, "osa": {"naziv": "Huni prolaze kroz Vrata naroda", "od": 375, "traka": "dogadjaji"}, "lekcija": 3}, {"id": "l03-razlozi-seobe-dopuni", "vrsta": "dopuni", "tezina": "tesko", "pojmovi": ["velika-seoba-naroda", "stari-sloveni"], "pitanje": "Dopuni svojim znanjem, bez ponuđenih reči.", "tekst": "Sloveni su pradomovinu napustili zbog Velike {{seobe}} naroda, koju su pokrenuli {{Huni}}, i zato što su tražili {{povoljnije|bolje}} mesto za život. Krenuli su u {{tri}} pravca.", "pomoc": ["Prva praznina je deo naziva velikog pokreta naroda.", "Razmisli šta nomadi iz Azije pokreću i šta Sloveni sami žele.", "Iz lekcije: Velika seoba naroda (Huni) i traženje povoljnijeg mesta; tri pravca."], "objasnjenje": "Dva razloga seobe su pritisak Velike seobe naroda i potraga za boljim mestom, a posle odlaska Sloveni idu na zapad, istok i jug.", "iz_udzbenika": {"strana": 22, "odeljak": "Zapamtite", "tekst": "Zbog Velike seobe naroda, ali i radi boljeg tla, Sloveni su napustili zemlje između Odre i Visle."}, "lekcija": 3}, {"id": "l03-pojmovi-seobe-povezi", "vrsta": "povezi", "tezina": "lako", "pojmovi": ["vrata-naroda", "huni", "pradomovina-slovena", "herodot"], "pitanje": "Poveži pojam sa njegovim opisom.", "parovi": [["Vrata naroda", "Ravnica između Urala i Kaspijskog mora"], ["Huni", "Nomadi iz Azije koji pokreću seobu"], ["Pradomovina Slovena", "Zemlje između Odre i Visle, Azovskog mora i Karpata"], ["Herodot", "Grčki istoričar iz V veka pre n. e."]], "pomoc": ["Dva pojma su mesta, a dva su ljudi.", "Jedan od ljudi je pisac.", "Iz lekcije: Vrata naroda su ravnica kod Urala; Herodot je grčki istoričar."], "objasnjenje": "Huni su kroz Vrata naroda ušli u Evropu i pokrenuli plemena; Herodot je najstariji pisac za kog se misli da spominje pretke Slovena.", "iz_udzbenika": {"strana": 18, "odeljak": "Život u pradomovini, uzroci i pravci seobe", "tekst": "Lekcija opisuje Vrata naroda, Hune, pradomovinu Slovena i Herodotove moguće vesti o njihovim precima."}, "lekcija": 3}, {"id": "l03-uzroci-posledice-povezi", "vrsta": "povezi", "tezina": "srednje", "pojmovi": ["huni", "velika-seoba-naroda", "stari-sloveni"], "pitanje": "Poveži uzrok sa posledicom.", "parovi": [["Huni prolaze kroz Vrata naroda", "Počinje Velika seoba naroda"], ["Velika seoba naroda", "Plemena, pa i Sloveni, beže sa svojih zemalja"], ["Traženje boljeg tla", "Seoba Slovena u tri pravca"], ["Malo starih vesti, i to kratkih", "Slabo poznajemo najstarije doba Slovena"]], "pomoc": ["Prati lanac od Huna ka Slovenima.", "Poslednji par nije o selidbi, nego o tome šta danas znamo.", "Iz lekcije: Huni → seoba → bekstvo plemena; bolje tle → tri pravca."], "objasnjenje": "Hunski upad pokreće seobu, ona tera plemena, a potraga za boljim tlom određuje dalje kretanje Slovena; o svemu tome imamo malo vesti.", "iz_udzbenika": {"strana": 18, "odeljak": "Život u pradomovini, uzroci i pravci seobe", "tekst": "Upad Huna pokreće seobu i tera plemena u bekstvo; Sloveni uz to traže bolje mesto za život."}, "lekcija": 3}, {"id": "l03-malo-podataka-zakljuci", "vrsta": "zakljuci", "tezina": "srednje", "pojmovi": ["stari-sloveni", "vizantija"], "pitanje": "Zašto je najstarije doba Slovena teško pouzdano opisati?", "odgovori": [{"tekst": "Podataka je malo, a vizantijski pisci daju kratke i često neprecizne vesti", "tacan": true}, {"tekst": "Sloveni su ostavili mnogo tekstova, ali na jeziku koji niko ne razume", "tacan": false, "zasto": "Sloveni pre glagoljice i ćirilice uopšte nisu imali pismo, pa njihovih tekstova iz tog doba nema."}, {"tekst": "Vizantinci o Slovenima nisu napisali ništa", "tacan": false, "zasto": "Pisali su, i to su naši glavni izvori; problem je što su te vesti kratke i neprecizne."}, {"tekst": "Sve vesti su izgubljene u seobi", "tacan": false, "zasto": "Lekcija ne kaže da su izgubljene; vesti postoje, ali ih je malo i pisali su ih stranci."}], "pomoc": ["Korak 1: Ko je tada pisao o Slovenima?", "Korak 2: Kakve su te vesti: duge i tačne ili kratke?", "Iz lekcije: podataka ima malo, kod vizantijskih pisaca, kratki su i često neprecizni."], "objasnjenje": "Sloveni tada nisu pisali, pa znamo samo ono što su zabeležili Vizantinci, a te vesti su malobrojne, kratke i često neprecizne.", "iz_udzbenika": {"strana": 18, "odeljak": "Život u pradomovini, uzroci i pravci seobe", "tekst": "Podataka iz najstarijeg doba ima malo, kod vizantijskih pisaca, čije su vesti kratke i često neprecizne."}, "lekcija": 3}, {"id": "l03-zasto-375-pocetak-zakljuci", "vrsta": "zakljuci", "tezina": "tesko", "pojmovi": ["velika-seoba-naroda", "huni", "vrata-naroda"], "pitanje": "Zašto se baš prolaz Huna kroz Vrata naroda uzima za početak Velike seobe naroda, iako su Sloveni na Balkan stigli vekovima kasnije?", "odgovori": [{"tekst": "Huni su tada pokrenuli lanac: plemena na njihovom putu krenula su u bekstvo i potiskivala jedna druga", "tacan": true}, {"tekst": "Jer su Huni odmah 375. stigli na Balkan i tu se naselili", "tacan": false, "zasto": "Prolaz kroz Vrata naroda je na granici Azije i Evrope, daleko od Balkana; važan je kao početni podsticaj, a ne kao naseljavanje."}, {"tekst": "Jer su tada i Sloveni prešli Dunav sa porodicama", "tacan": false, "zasto": "Sa porodicama prelaze tek početkom VII veka, više od dva veka kasnije."}, {"tekst": "Jer je tada Vizantija podeljena na dva dela", "tacan": false, "zasto": "Lekcija ovde ne govori o podeli; početak seobe se računa po pokretu naroda, ne po promeni u carstvu."}], "pomoc": ["Korak 1: Šta su Huni uradili plemenima na svom putu?", "Korak 2: Šta se dešava kada se jedno pleme pomeri, a pored njega živi drugo?", "Iz lekcije: Huni su naterali u bekstvo plemena na svom putu, među njima i Slovene."], "objasnjenje": "Početak seobe nije dolazak Slovena, nego prvi udar koji je pokrenuo plemena. Taj udar je hunski prolaz 375, a posledice su trajale vekovima.", "iz_udzbenika": {"strana": 18, "odeljak": "Život u pradomovini, uzroci i pravci seobe", "tekst": "Huni su 375. prošli kroz Vrata naroda i naterali u bekstvo plemena na svom putu, među njima i Slovene."}, "osa": {"naziv": "Huni prolaze kroz Vrata naroda", "od": 375, "traka": "dogadjaji"}, "lekcija": 3}, {"id": "l03-huni-375-datum", "vrsta": "datum", "tezina": "lako", "pojmovi": ["huni", "vrata-naroda", "velika-seoba-naroda"], "dogadjaj": "Huni prolaze kroz Vrata naroda", "pitanje": "Koje godine su Huni prošli kroz Vrata naroda?", "godina": 375, "traka": "dogadjaji", "pomoc": ["To je IV vek, njegova druga polovina.", "Godina se završava sa 5 i počinje sa 3.", "Iz lekcije: Huni su kroz Vrata naroda prošli 375."], "objasnjenje": "Godine 375. Huni su prošli kroz Vrata naroda; to se uzima za početak Velike seobe naroda.", "iz_udzbenika": {"strana": 18, "odeljak": "Život u pradomovini, uzroci i pravci seobe", "tekst": "Huni iz Azije prošli su 375. kroz Vrata naroda."}, "lekcija": 3}, {"id": "l03-rane-vesti-poredjaj", "vrsta": "poredjaj", "tezina": "srednje", "pojmovi": ["herodot", "huni", "stari-sloveni"], "pitanje": "Poređaj hronološki, od najstarijeg.", "stavke": [{"tekst": "Herodot, po mišljenju istoričara, piše o precima Slovena", "godina": -450, "oznaka": "V vek pre n. e.", "naziv": "Herodotove vesti o precima Slovena", "traka": "crkva-kultura"}, {"tekst": "Huni prolaze kroz Vrata naroda", "godina": 375, "naziv": "Huni prolaze kroz Vrata naroda", "traka": "dogadjaji"}, {"tekst": "Prvi put se javlja ime Slovena", "godina": 500, "do": 600, "oznaka": "VI vek", "naziv": "Prvi pomen slovenskog imena", "traka": "dogadjaji"}], "pomoc": ["Jedno od ovoga je pre naše ere.", "Ime Slovena javlja se vek i po posle Huna.", "Iz lekcije: Herodot V vek pre n. e., Huni 375, ime Slovena VI vek."], "objasnjenje": "Herodot (V vek pre n. e.) → Huni (375) → ime Slovena (VI vek).", "iz_udzbenika": {"strana": 18, "odeljak": "Život u pradomovini, uzroci i pravci seobe", "tekst": "Herodot je pisao u V veku pre n. e., Huni prolaze 375, a ime Slovena javlja se u VI veku."}, "lekcija": 3}, {"id": "l03-huni-beg-lanac", "vrsta": "lanac", "tezina": "lako", "pojmovi": ["huni", "velika-seoba-naroda", "stari-sloveni"], "karike": ["Huni upadaju u Evropu", "?", "Sloveni kreću iz pradomovine"], "praznina": 1, "odgovori": [{"tekst": "Počinje Velika seoba naroda, plemena beže", "tacan": true}, {"tekst": "Vizantija ih poziva da se nasele na Balkanu", "tacan": false, "zasto": "Sloveni kreću pod pritiskom i u potrazi za boljim tlom, a Vizantija ih dugo pokušava da zadrži."}, {"tekst": "Stvara se Slovenska između Dunava i Balkana", "tacan": false, "zasto": "Slovenska nastaje tek sredinom VII veka, kao posledica naseljavanja, a ne kao uzrok seobe."}], "pomoc": ["Korak 1: Šta se desilo plemenima na putu Huna?", "Korak 2: Kako se zove taj pokret?", "Iz lekcije: upad Huna → Velika seoba naroda → bekstvo plemena, pa i Slovena."], "objasnjenje": "Hunski upad pokrenuo je plemena, pa su i Sloveni napustili svoju zemlju.", "iz_udzbenika": {"strana": 18, "odeljak": "Život u pradomovini, uzroci i pravci seobe", "tekst": "Upad Huna pokreće Veliku seobu naroda, u kojoj plemena, pa i Sloveni, beže sa svog tla."}, "osa": {"naziv": "Huni prolaze kroz Vrata naroda", "od": 375, "traka": "dogadjaji"}, "lekcija": 3}, {"id": "l03-bolje-tle-lanac", "vrsta": "lanac", "tezina": "srednje", "pojmovi": ["stari-sloveni", "doseljavanje"], "karike": ["Sloveni traže povoljnije mesto za život", "Razilaze se u tri pravca", "?", "Dolaze do vizantijske granice na Dunavu"], "praznina": 2, "odgovori": [{"tekst": "Južna grupa ide ka Balkanu", "tacan": true}, {"tekst": "Zapadna grupa stiže u Franačku i osniva je", "tacan": false, "zasto": "Franačka je bila jak sused Slovena, a ne njihova tvorevina; ka Dunavu je išla južna grupa."}, {"tekst": "Istočna grupa se vraća u Aziju za Hunima", "tacan": false, "zasto": "O tome nema podataka; sledeći korak do Dunava mogla je da napravi samo južna grupa."}], "pomoc": ["Korak 1: Gde je Dunav u odnosu na pradomovinu?", "Korak 2: Koja je grupa onda stigla do njega?", "Iz lekcije: traženje boljeg tla → tri pravca; južna grupa ide ka Balkanu."], "objasnjenje": "Od tri grupe ka Dunavu i Balkanu je išla južna; tako su Sloveni izbili na vizantijsku granicu.", "iz_udzbenika": {"strana": 18, "odeljak": "Život u pradomovini, uzroci i pravci seobe", "tekst": "Južna grupa Slovena ide ka Balkanu i stiže do vizantijske granice na Dunavu."}, "lekcija": 3}, {"id": "l03-iz-pradomovine-na-balkan-lanac", "vrsta": "lanac", "tezina": "tesko", "pojmovi": ["huni", "stari-sloveni", "vizantija"], "karike": ["Huni prolaze kroz Vrata naroda (375)", "Sloveni, u podređenom položaju, stižu sa Hunima i Bugarima do Dunava", "?"], "praznina": 2, "odgovori": [{"tekst": "Počinju brojni napadi na vizantijsku odbranu", "tacan": true}, {"tekst": "Sloveni odmah postaju vizantijski podanici i prelaze u hrišćanstvo", "tacan": false, "zasto": "Hrišćanstvo se učvršćuje tek u IX veku; na Dunavu je prvo usledio niz napada."}, {"tekst": "Sloveni se vraćaju u pradomovinu", "tacan": false, "zasto": "Iz napada su se vraćali samo na levu obalu Dunava, a ne u pradomovinu; njihov pritisak na granicu je rastao."}], "pomoc": ["Korak 1: Šta se nalazi preko Dunava?", "Korak 2: Šta rade plemena koja stoje na bogatoj granici?", "Iz lekcije: stigli su do granice na Dunavu; sledili su brojni napadi na vizantijsku odbranu."], "objasnjenje": "Kada su izbili na Dunav, Sloveni su imali pred sobom bogato carstvo i počeli su napade na njegovu odbranu.", "iz_udzbenika": {"strana": 18, "odeljak": "Život u pradomovini, uzroci i pravci seobe", "tekst": "Do Dunava su stigli sa Hunima i Bugarima, a sledili su brojni napadi na vizantijsku odbranu."}, "lekcija": 3}, {"id": "l03-karta-pradomovine-izvor", "vrsta": "izvor", "slika_u_pitanju": true, "tezina": "srednje", "pojmovi": ["pradomovina-slovena", "karpati", "visla"], "izvor": {"autor": "Karta iz udžbenika", "naslov": "Pradomovina Slovena (opis karte)", "tekst": "Karta razlikuje širu i užu slovensku teritoriju. Uža, tamnije osenčena, pruža se severno od Karpata, od Krakova i Varšave prema Kijevu i Černigovu. Na karti su i Baltičko i Crno more i reke Odra, Visla, Dnjestar, Dnjepar i Dunav.", "napomena": "Odlomak je prepričan; udžbenik, str. 18."}, "pitanje": "Šta sa karte potvrđuje da je pradomovina bila daleko od Balkana?", "odgovori": [{"tekst": "Uža slovenska teritorija leži severno od Karpata", "tacan": true}, {"tekst": "Uža teritorija leži južno od Dunava", "tacan": false, "zasto": "Dunav je južno od te teritorije; karta je stavlja severno od Karpata, pa je Dunav morao tek da se dosegne."}, {"tekst": "Teritorija izlazi na Jadransko more", "tacan": false, "zasto": "Jadransko more nije među morima na karti; označena su Baltičko i Crno more."}, {"tekst": "Teritorija se poklapa sa Trakijom i Tesalijom", "tacan": false, "zasto": "Trakija i Tesalija su vizantijske oblasti do kojih su Sloveni dopirali u pljačkaškim upadima."}], "pomoc": ["Nađi planine koje stoje između pradomovine i Balkana.", "Da li je uža teritorija severno ili južno od njih?", "Iz lekcije: uža oblast proteže se severno od Karpata."], "objasnjenje": "Karpati su međa: uža teritorija je severno od njih, pa je do Balkana trebalo preći dug put.", "iz_udzbenika": {"strana": 18, "odeljak": "Život u pradomovini, uzroci i pravci seobe", "tekst": "Karta pokazuje šire i uže slovensko područje; uže je severno od Karpata.", "slika": "03-doseljavanje-srba-na-balkan/01-karta-pradomovina-slovena.jpg"}, "lekcija": 3}, {"id": "l03-skupstina-izvor", "vrsta": "izvor", "slika_u_pitanju": true, "tezina": "lako", "pojmovi": ["stari-sloveni", "rodovsko-plemenska-zajednica"], "izvor": {"autor": "Ilustracija iz udžbenika", "naslov": "Skupština starih Slovena (opis crteža)", "tekst": "Pod krošnjama u šumi okupili su se muškarci sa kopljima i štapovima. U prvom planu stoje stariji ljudi dugih brada.", "napomena": "Odlomak je prepričan; udžbenik, str. 19."}, "pitanje": "Kakvo uređenje stvarnih zajednica ovaj crtež dočarava?", "odgovori": [{"tekst": "Rodovsko-plemensku zajednicu, u kojoj se zajedno odlučuje o važnim stvarima", "tacan": true}, {"tekst": "Dvor cara sa činovnicima", "tacan": false, "zasto": "Dvor i činovnici pripadaju Vizantiji; Sloveni su živeli po rodovima i plemenima."}, {"tekst": "Crkveni sabor posle pokrštavanja", "tacan": false, "zasto": "Prizor je iz paganskog doba, a pokrštavanje dolazi tek vekovima kasnije."}, {"tekst": "Trgovački sajam u velikom gradu", "tacan": false, "zasto": "Ljudi su u šumi i naoružani; to nije grad nego skup slobodnih članova plemena."}], "pomoc": ["Gde se ljudi okupljaju: u gradu ili u prirodi?", "Zašto su stariji u prvom planu?", "Iz lekcije: stari Sloveni živeli su u rodovsko-plemenskim zajednicama."], "objasnjenje": "Skup slobodnih muškaraca, sa starijima napred, odgovara rodovsko-plemenskoj zajednici.", "iz_udzbenika": {"strana": 19, "odeljak": "Život u pradomovini, uzroci i pravci seobe", "tekst": "Sloveni su živeli u rodovsko-plemenskim zajednicama; crtež prikazuje njihovu skupštinu.", "slika": "03-doseljavanje-srba-na-balkan/02-skupstina-starih-slovena.jpg"}, "lekcija": 3}, {"id": "l03-pritisak-i-privlacnost-uporedi", "vrsta": "uporedi", "tezina": "srednje", "pojmovi": ["velika-seoba-naroda", "huni", "stari-sloveni"], "a": "Pritisak Huna (Velika seoba naroda)", "b": "Traženje boljeg tla", "pitanje": "Na koji razlog seobe Slovena se odnosi tvrdnja?", "tvrdnje": [{"tekst": "Razlog dolazi spolja, Sloveni su naterani u bekstvo.", "odgovor": "a", "zasto": "Huni su na putu terali plemena da beže; to nije bila slobodna odluka."}, {"tekst": "Razlog dolazi od samih Slovena, koji žele bolji život.", "odgovor": "b", "zasto": "Traženje povoljnijeg mesta je sopstvena želja, a ne prinuda."}, {"tekst": "Doveo je do napuštanja pradomovine.", "odgovor": "oba", "zasto": "Lekcija navodi oba kao razloge odlaska iz pradomovine."}, {"tekst": "Vezuje se za godinu 375.", "odgovor": "a", "zasto": "Prolaz Huna kroz Vrata naroda datiran je 375; potraga za boljim tlom nema jednu godinu."}, {"tekst": "Sloveni su pošli zato što im je Vizantija obećala zemlju u pradomovini.", "odgovor": "nijedan", "zasto": "Vizantija im nije ništa obećavala u pradomovini; lekcija navodi samo hunski pritisak i potragu za boljim tlom."}], "pomoc": ["Jedan razlog je prinuda, drugi želja.", "Pazi: jedna tvrdnja važi za oba, a jedna ni za jedan.", "Iz lekcije: dva razloga su Velika seoba naroda i traženje povoljnijeg mesta."], "objasnjenje": "Pritisak Huna je spoljna prinuda, a traženje boljeg tla sopstveni motiv; zajedno objašnjavaju odlazak Slovena.", "iz_udzbenika": {"strana": 18, "odeljak": "Život u pradomovini, uzroci i pravci seobe", "tekst": "Sloveni su pošli i zbog pritiska Velike seobe naroda i zbog traženja boljeg mesta za život."}, "lekcija": 3}, {"id": "l03-herodot-ko-sam", "vrsta": "ko_sam", "tezina": "srednje", "pojmovi": ["herodot", "stari-sloveni"], "tragovi": ["Živeo sam u V veku pre n. e.", "Bio sam grčki istoričar.", "Misli se da sam pisao o precima Slovena, iako njihovo ime tada još niko nije zapisao."], "odgovori": [{"tekst": "Herodot", "tacan": true}, {"tekst": "Justinijan I", "tacan": false, "zasto": "Justinijan je vizantijski car iz VI veka, a tragovi govore o grčkom istoričaru iz V veka pre n. e."}, {"tekst": "Konstantin (Ćirilo)", "tacan": false, "zasto": "Ćirilo je misionar iz IX veka koji je Slovene opismenio, a ne istoričar iz stare Grčke."}], "objasnjenje": "To je Herodot, grčki istoričar kod kog se, kako se misli, govori o precima Slovena.", "iz_udzbenika": {"strana": 18, "odeljak": "Život u pradomovini, uzroci i pravci seobe", "tekst": "Misli se da o precima Slovena govori već grčki istoričar Herodot u V veku pre n. e."}, "lekcija": 3}, {"id": "l03-huni-ko-sam", "vrsta": "ko_sam", "tezina": "lako", "pojmovi": ["huni", "vrata-naroda", "velika-seoba-naroda"], "tragovi": ["Mi smo nomadi koji su došli iz Azije.", "Prošli smo kroz ravnicu između Urala i Kaspijskog mora.", "Naš upad 375. pokrenuo je Veliku seobu naroda."], "odgovori": [{"tekst": "Huni", "tacan": true}, {"tekst": "Bugari", "tacan": false, "zasto": "I Bugari su azijsko pleme, ali početak Velike seobe naroda vezuje se za Hune."}, {"tekst": "Avari", "tacan": false, "zasto": "Avari su takođe iz Azije, ali u Panoniju stižu sredinom VI veka, mnogo posle 375."}], "objasnjenje": "To su Huni, čiji se prolaz kroz Vrata naroda uzima za početak Velike seobe naroda.", "iz_udzbenika": {"strana": 18, "odeljak": "Život u pradomovini, uzroci i pravci seobe", "tekst": "Huni iz Azije prošli su 375. kroz Vrata naroda."}, "osa": {"naziv": "Huni prolaze kroz Vrata naroda", "od": 375, "traka": "dogadjaji"}, "lekcija": 3}, {"id": "l03-zasto-seoba-objasni", "vrsta": "objasni", "tezina": "lako", "pojmovi": ["velika-seoba-naroda", "huni", "stari-sloveni"], "pitanje": "Iz kojih razloga su Sloveni otišli iz pradomovine? Objasni svojim rečima.", "uzor": "Sloveni su otišli iz dva razloga. Huni su pokrenuli Veliku seobu naroda i terali plemena sa njihovog tla, pa su i Sloveni morali da beže. Pored toga, sami su tražili povoljnije mesto za život.", "ideje": ["Velika seoba naroda, koju pokreću Huni.", "Plemena su na hunskom putu naterana u bekstvo.", "Sloveni sami traže povoljnije mesto za život."], "objasnjenje": "Odgovor mora da spoji spoljašnji pritisak i sopstveni motiv.", "iz_udzbenika": {"strana": 22, "odeljak": "Pitanja za razmišljanje / Zadaci iz udžbenika", "tekst": "Udžbenik pita iz kojih razloga su Sloveni otišli iz pradomovine."}, "lekcija": 3}, {"id": "l03-kako-znamo-objasni", "vrsta": "objasni", "tezina": "srednje", "pojmovi": ["stari-sloveni", "vizantija", "herodot"], "pitanje": "Zašto je za najstariji život Slovena važno ko je pisao vesti o njima? Objasni.", "uzor": "O najstarijem dobu Slovena pisali su stranci, vizantijski pisci, jer Sloveni još nisu imali pismo. Njihove vesti su malobrojne, kratke i često neprecizne. Zato naše znanje o tom dobu ostaje nepotpuno i o tome treba suditi oprezno.", "ideje": ["Sloveni tada nisu imali svoje pismo.", "Vesti su pisali vizantijski pisci, dakle stranci.", "Vesti su malobrojne, kratke i neprecizne.", "Zato je znanje o tom dobu nepotpuno."], "objasnjenje": "Ko piše i koliko zna određuje vrednost izvora, pa je oprez nužan.", "iz_udzbenika": {"strana": 18, "odeljak": "Život u pradomovini, uzroci i pravci seobe", "tekst": "Podataka iz najstarijeg doba ima malo, i to kod vizantijskih pisaca čije su vesti kratke i često neprecizne."}, "lekcija": 3}]}, {"naslov": "3. Stari Sloveni i naseljavanje Balkanskog poluostrva", "zadaci": [{"id": "l03-justinijan-upadi-izbor", "vrsta": "izbor", "tezina": "lako", "pojmovi": ["justinijan-i", "stari-sloveni", "vizantija"], "pitanje": "Za vreme kog vizantijskog cara počinju upadi Slovena na Balkan?", "odgovori": [{"tekst": "Justinijana I", "tacan": true}, {"tekst": "Iraklija", "tacan": false, "zasto": "Iraklije vlada 610–641, u vreme naseljavanja; upadi su počeli ranije, u VI veku, pod Justinijanom I."}, {"tekst": "Konstantina VII Porfirogenita", "tacan": false, "zasto": "On vlada u X veku i piše o doseljavanju Srba, mnogo posle prvih upada."}, {"tekst": "Otona I", "tacan": false, "zasto": "Oton I je nemački vladar iz X veka koji je pobedio Mađare, a ne vizantijski car."}], "pomoc": ["Traži cara iz VI veka.", "Vladao je 527–565.", "Iz lekcije: upadi počinju u VI veku, pod carem Justinijanom I."], "objasnjenje": "Upadi Slovena počinju u VI veku, pod carem Justinijanom I (527–565).", "iz_udzbenika": {"strana": 19, "odeljak": "Stari Sloveni i naseljavanje Balkanskog poluostrva", "tekst": "Upadi na Balkan počinju u VI veku, pod carem Justinijanom I (527–565)."}, "osa": {"naziv": "Vladavina Justinijana I", "od": 527, "do": 565, "traka": "vladari"}, "lekcija": 3}, {"id": "l03-karakter-upada-izbor", "vrsta": "izbor", "tezina": "lako", "pojmovi": ["stari-sloveni", "vizantija"], "pitanje": "Kakvi su bili slovenski upadi na Balkan u VI veku?", "odgovori": [{"tekst": "Pljačkaški: posle borbi Sloveni se sa plenom vraćaju preko Dunava", "tacan": true}, {"tekst": "Naseljavanje: dolazili su sa porodicama da ostanu", "tacan": false, "zasto": "To je odlika VII veka; u VI veku su još dolazili radi plena i vraćali se."}, {"tekst": "Misionarski: širili su hrišćanstvo", "tacan": false, "zasto": "Sloveni su tada bili mnogobošci, a hrišćanstvo će tek primiti."}, {"tekst": "Trgovački: mirno su razmenjivali robu", "tacan": false, "zasto": "Upadi su bili oružani i završavali su se plenom, a ne trgovinom."}], "pomoc": ["Šta su nosili sa sobom kada su se vraćali?", "Vraćali su se na levu obalu Dunava.", "Iz lekcije: upadi su bili pljačkaški; posle borbi Sloveni se sa plenom vraćaju."], "objasnjenje": "U VI veku Sloveni pljačkaju i vraćaju se na levu obalu Dunava; naseljavanje dolazi tek u VII veku.", "iz_udzbenika": {"strana": 19, "odeljak": "Stari Sloveni i naseljavanje Balkanskog poluostrva", "tekst": "Upadi su bili pljačkaški: posle borbi Sloveni se sa plenom vraćaju na levu obalu Dunava."}, "lekcija": 3}, {"id": "l03-vrhovni-bog-izbor", "vrsta": "izbor", "tezina": "lako", "pojmovi": ["perun", "svetovid", "dazbog"], "pitanje": "Ko je bio vrhovni bog starih Slovena?", "odgovori": [{"tekst": "Perun ili Svetovid", "tacan": true}, {"tekst": "Dažbog", "tacan": false, "zasto": "Dažbog je bog Sunca i podzemlja, ali ne i vrhovni bog."}, {"tekst": "Vukodlak", "tacan": false, "zasto": "Vukodlaci su bića u koja se verovalo, a ne bogovi."}, {"tekst": "Vila", "tacan": false, "zasto": "I vile su bića iz verovanja, a ne vrhovno božanstvo."}], "pomoc": ["Lekcija navodi dva imena za vrhovnog boga.", "Dažbog je zadužen za Sunce.", "Iz lekcije: vrhovni bog je Perun ili Svetovid."], "objasnjenje": "Vrhovni bog starih Slovena nosio je ime Perun ili Svetovid.", "iz_udzbenika": {"strana": 19, "odeljak": "Stari Sloveni i naseljavanje Balkanskog poluostrva", "tekst": "Vrhovni bog Slovena je Perun ili Svetovid."}, "lekcija": 3}, {"id": "l03-dokle-su-stizali-izbor", "vrsta": "izbor", "tezina": "srednje", "pojmovi": ["stari-sloveni", "vizantija", "bugari", "avari"], "pitanje": "Do kojih oblasti su u VI veku dopirali slovenski pljačkaški upadi? (više tačnih)", "odgovori": [{"tekst": "Trakija", "tacan": true}, {"tekst": "Tesalija", "tacan": true}, {"tekst": "Epir", "tacan": true}, {"tekst": "Panonija", "tacan": false, "zasto": "Panonska nizija je severno od Dunava, a ne vizantijska oblast u koju se upada; tamo stižu Avari."}, {"tekst": "Duklja", "tacan": false, "zasto": "Duklja je ime srpske oblasti i saveza koji nastaju kasnije, posle naseljavanja."}], "pomoc": ["Sve tri tačne oblasti su duboko na jugu Balkana.", "Pomisli na vizantijske krajeve južno od planine Balkan.", "Iz lekcije: stizali su do Trakije, Tesalije i Epira."], "objasnjenje": "Napadajući sa Bugarima, pa sa Avarima, Sloveni su stizali do Trakije, Tesalije i Epira.", "iz_udzbenika": {"strana": 19, "odeljak": "Stari Sloveni i naseljavanje Balkanskog poluostrva", "tekst": "Sloveni su napadali prvo sa Bugarima, pa sa Avarima, i stizali do Trakije, Tesalije i Epira."}, "lekcija": 3}, {"id": "l03-sta-ostaje-vizantiji-izbor", "vrsta": "izbor", "tezina": "srednje", "pojmovi": ["slovenska", "vizantija"], "pitanje": "Šta je sredinom VII veka ostalo Vizantiji na Balkanu? (više tačnih)", "odgovori": [{"tekst": "Dolina Morave, Niš i Sofija", "tacan": true}, {"tekst": "Nekoliko primorskih gradova", "tacan": true}, {"tekst": "Ostrva u Egejskom, Jonskom i Jadranskom moru", "tacan": true}, {"tekst": "Cela zemlja od Dunava do planine Balkan", "tacan": false, "zasto": "Ta zemlja se tada zove Slovenska, jer je pod Slovenima; Vizantiji je ostala samo pomenuta dolina."}, {"tekst": "Pradomovina između Odre i Visle", "tacan": false, "zasto": "Pradomovina nikada nije bila vizantijska; ona je daleko severno od Dunava."}], "pomoc": ["Vizantiji ostaju mesta koja je lako braniti: uz more, na ostrvima i na važnom putu.", "Jedan niz gradova je u unutrašnjosti Balkana.", "Iz lekcije: dolina Morave, Niš i Sofija, nekoliko primorskih gradova i ostrva."], "objasnjenje": "Unutrašnjost je pretežno slovenska, a Vizantija drži dolinu Morave sa Nišom i Sofijom, nekoliko primorskih gradova i ostrva.", "iz_udzbenika": {"strana": 19, "odeljak": "Stari Sloveni i naseljavanje Balkanskog poluostrva", "tekst": "Vizantiji ostaju dolina Morave, Niš i Sofija, nekoliko primorskih gradova i ostrva u tri mora."}, "osa": {"naziv": "Slovenska između Dunava i planine Balkan", "od": 650, "oznaka": "sredina VII veka", "traka": "dogadjaji"}, "lekcija": 3}, {"id": "l03-avari-panonija-izbor", "vrsta": "izbor", "tezina": "srednje", "pojmovi": ["avari", "stari-sloveni"], "pitanje": "Šta su Avari uradili kada su sredinom VI veka stigli u Panonsku niziju?", "odgovori": [{"tekst": "Potčinili su tamošnja slovenska plemena", "tacan": true}, {"tekst": "Proterali su sve Slovene u pradomovinu", "tacan": false, "zasto": "Nisu ih proterali, već potčinili; zato ih kasnije zajedno vidimo u napadima na Vizantiju."}, {"tekst": "Stvorili su Slovensku", "tacan": false, "zasto": "Slovenska je naziv zemlje južno od Dunava sredinom VII veka; Avari su bili u Panoniji."}, {"tekst": "Primili su hrišćanstvo od Justinijana", "tacan": false, "zasto": "Lekcija to ne kaže; Avari se javljaju kao napadači na Vizantiju, a ne kao hrišćani."}], "pomoc": ["Avari su bili jača sila od slovenskih plemena u Panoniji.", "Posle toga Sloveni napadaju Vizantiju zajedno sa njima.", "Iz lekcije: Avari stižu iz Azije i potčinjavaju tamošnja slovenska plemena."], "objasnjenje": "Avari su došli iz Azije i potčinili slovenska plemena u Panonskoj niziji.", "iz_udzbenika": {"strana": 19, "odeljak": "Stari Sloveni i naseljavanje Balkanskog poluostrva", "tekst": "Avari stižu iz Azije u Panonsku niziju sredinom VI veka i potčinjavaju tamošnja slovenska plemena."}, "osa": {"naziv": "Avari stižu u Panonsku niziju", "od": 550, "oznaka": "sredina VI veka", "traka": "dogadjaji"}, "lekcija": 3}, {"id": "l03-levu-obalu-tn", "vrsta": "tacno_netacno", "tezina": "lako", "pojmovi": ["stari-sloveni"], "tvrdnja": "Posle pljačkaških upada u VI veku Sloveni su se vraćali na levu obalu Dunava.", "tacno": true, "pomoc": ["U VI veku još ne ostaju na Balkanu.", "Iz lekcije: posle borbi vraćaju se sa plenom na levu obalu Dunava."], "objasnjenje": "Tačno. Leva obala Dunava bila je van carstva, pa su tamo odnosili plen.", "iz_udzbenika": {"strana": 19, "odeljak": "Stari Sloveni i naseljavanje Balkanskog poluostrva", "tekst": "Posle borbi Sloveni se sa plenom vraćaju na levu obalu Dunava."}, "lekcija": 3}, {"id": "l03-solun-pao-tn", "vrsta": "tacno_netacno", "tezina": "lako", "pojmovi": ["solun", "carigrad", "avari"], "tvrdnja": "Sloveni su 626. zajedno sa Avarima osvojili Carigrad.", "tacno": false, "ispravke": [{"tekst": "Sa Avarima su 626. pokušali da zauzmu Carigrad, ali nisu uspeli.", "tacan": true}, {"tekst": "Carigrad su osvojili sami Sloveni, bez Avara.", "tacan": false, "zasto": "Napad su izveli zajedno, i nije uspeo; Vizantija je zadržala prestonicu."}, {"tekst": "Te godine su osvojili Solun.", "tacan": false, "zasto": "Veliki napad na Solun bio je 586. i takođe je propao."}], "pomoc": ["Da li je Vizantija 626. izgubila prestonicu?", "Oba velika napada, na Solun i na Carigrad, ishodom su ista.", "Iz lekcije: 626. sa Avarima pokušavaju da zauzmu Carigrad, opet neuspešno."], "objasnjenje": "Netačno. Napad na Carigrad 626, kao i napad na Solun 586, nije uspeo.", "iz_udzbenika": {"strana": 19, "odeljak": "Stari Sloveni i naseljavanje Balkanskog poluostrva", "tekst": "Sloveni 626. sa Avarima pokušavaju da zauzmu Carigrad, opet neuspešno."}, "osa": {"naziv": "Avarsko-slovenski napad na Carigrad", "od": 626, "traka": "dogadjaji"}, "lekcija": 3}, {"id": "l03-dazbog-tn", "vrsta": "tacno_netacno", "tezina": "srednje", "pojmovi": ["dazbog", "stari-sloveni"], "tvrdnja": "Dažbog je bio bog samo Sunca i nije imao veze sa podzemljem.", "tacno": false, "ispravke": [{"tekst": "Dažbog je bio bog Sunca, ali i podzemlja.", "tacan": true}, {"tekst": "Dažbog je bio vrhovni bog svih Slovena.", "tacan": false, "zasto": "Vrhovni bog je Perun ili Svetovid; Dažbog ima užu nadležnost."}, {"tekst": "Dažbog je bio duh šume, poput vile.", "tacan": false, "zasto": "Vile su posebna bića u koja se verovalo; Dažbog je bog sa imenom i svojim domenom."}], "pomoc": ["Lekcija mu daje dva domena.", "Drugi domen je suprotan svetlosti.", "Iz lekcije: Dažbog je bog Sunca, ali i podzemlja."], "objasnjenje": "Netačno. Dažbog je i bog Sunca i bog podzemlja.", "iz_udzbenika": {"strana": 19, "odeljak": "Stari Sloveni i naseljavanje Balkanskog poluostrva", "tekst": "Dažbog je bog Sunca, ali i podzemlja."}, "lekcija": 3}, {"id": "l03-rod-vojske-tn", "vrsta": "tacno_netacno", "tezina": "srednje", "pojmovi": ["pesadija", "avari", "bugari", "stari-sloveni"], "tvrdnja": "U zajedničkim borbama Sloveni su bili pešadija, a Avari i Bugari konjica.", "tacno": true, "pomoc": ["Pogledaj crtež starog Slovena: šta nema?", "Iz lekcije: Sloveni su pešadija, a Avari i Bugari konjica."], "objasnjenje": "Tačno. Azijski narodi su bili konjanici, a Sloveni su se borili pešice, sa lakom opremom.", "iz_udzbenika": {"strana": 19, "odeljak": "Stari Sloveni i naseljavanje Balkanskog poluostrva", "tekst": "U borbama su Sloveni pešadija, a Avari i Bugari konjica.", "slika": "03-doseljavanje-srba-na-balkan/03-stari-sloven.jpg"}, "lekcija": 3}, {"id": "l03-otpor-vii-tn", "vrsta": "tacno_netacno", "tezina": "tesko", "pojmovi": ["vizantija", "stari-sloveni", "doseljavanje"], "tvrdnja": "Početkom VII veka Sloveni su granicu probili tek posle teških bitaka, jer je Vizantija tada imala jaku odbranu na Dunavu.", "tacno": false, "ispravke": [{"tekst": "Prešli su granicu bez većeg otpora, jer je carstvo ratovalo i na drugim stranama.", "tacan": true}, {"tekst": "Granicu su prešli samo oni koje je car pozvao da brani carstvo.", "tacan": false, "zasto": "U VI veku i početkom VII veka Sloveni su napadači; o pozivu ovde nema reči."}, {"tekst": "Nisu prelazili granicu sve do IX veka.", "tacan": false, "zasto": "Sredinom VII veka već postoje snažne naseobine, pa je prelazak bio mnogo ranije."}], "pomoc": ["Seti se zašto Vizantija u VI veku nije mogla da brani granicu.", "Da li su se te teškoće popravile?", "Iz lekcije: početkom VII veka Sloveni bez većeg otpora prelaze granicu."], "objasnjenje": "Netačno. Vizantija je bila zauzeta drugim ratovima, pa je prelaz prošao bez većeg otpora.", "iz_udzbenika": {"strana": 19, "odeljak": "Stari Sloveni i naseljavanje Balkanskog poluostrva", "tekst": "Početkom VII veka Sloveni bez većeg otpora prelaze granicu, sada sa porodicama."}, "osa": {"naziv": "Sloveni prelaze Dunav sa porodicama", "od": 605, "oznaka": "početak VII veka", "traka": "dogadjaji"}, "lekcija": 3}, {"id": "l03-bogovi-dopuni", "vrsta": "dopuni", "tezina": "lako", "pojmovi": ["perun", "svetovid", "dazbog"], "pitanje": "Dopuni rečenicu o veri starih Slovena.", "tekst": "Vrhovni bog bio je {{Perun}} ili Svetovid, a {{Dažbog}} je bio bog Sunca i podzemlja. Verovali su i u {{vile}} i vukodlake.", "ponudjene": ["Perun", "Dažbog", "vile", "Justinijan", "Avare"], "pomoc": ["Justinijan je car, a Avari narod.", "Treća praznina su bića iz šuma i voda.", "Iz lekcije: Perun ili Svetovid, Dažbog, vile i vukodlaci."], "objasnjenje": "Slovensko verovanje poznaje vrhovnog boga, boga Sunca i podzemlja i bića poput vila i vukodlaka.", "iz_udzbenika": {"strana": 19, "odeljak": "Stari Sloveni i naseljavanje Balkanskog poluostrva", "tekst": "Vrhovni bog je Perun ili Svetovid, Dažbog je bog Sunca i podzemlja, a verovali su i u vile i vukodlake."}, "lekcija": 3}, {"id": "l03-vi-vii-vek-dopuni", "vrsta": "dopuni", "tezina": "lako", "pojmovi": ["stari-sloveni", "doseljavanje"], "pitanje": "Dopuni rečenicu vekovima.", "tekst": "U {{VI}} veku Sloveni su pljačkali vizantijske oblasti, a od {{VII}} veka se naseljavaju na Balkanu.", "ponudjene": ["VI", "VII", "IX", "IV"], "pomoc": ["Pljačka dolazi pre naseljavanja.", "To su dva susedna veka.", "Iz lekcije: u VI veku pljačkaju, od VII veka se naseljavaju."], "objasnjenje": "Razlika između VI i VII veka je razlika između pljačke i trajnog naseljavanja.", "iz_udzbenika": {"strana": 22, "odeljak": "Zapamtite", "tekst": "U VI veku Sloveni su pljačkali Vizantiju sa Avarima i Bugarima, a od VII veka se naseljavaju."}, "lekcija": 3}, {"id": "l03-slovenska-dopuni", "vrsta": "dopuni", "tezina": "srednje", "pojmovi": ["slovenska", "vizantija"], "pitanje": "Dopuni rečenicu o Slovenskoj.", "tekst": "Sredinom {{VII}} veka zemlja od {{Dunava}} do planine {{Balkan}} zove se Slovenska.", "ponudjene": ["VII", "IX", "Dunava", "Jadrana", "Balkan", "Karpati"], "pomoc": ["Karpati su kod pradomovine, a ne na Balkanu.", "Severna međa je stara vizantijska granica.", "Iz lekcije: sredinom VII veka zemlja od Dunava do planine Balkan zove se Slovenska."], "objasnjenje": "Slovenska je naziv za zemlju od Dunava do planine Balkan sredinom VII veka.", "iz_udzbenika": {"strana": 19, "odeljak": "Stari Sloveni i naseljavanje Balkanskog poluostrva", "tekst": "Sredinom VII veka zemlja od Dunava do planine Balkan zove se Slovenska."}, "osa": {"naziv": "Slovenska između Dunava i planine Balkan", "od": 650, "oznaka": "sredina VII veka", "traka": "dogadjaji"}, "lekcija": 3}, {"id": "l03-napadi-dopuni", "vrsta": "dopuni", "tezina": "tesko", "pojmovi": ["solun", "carigrad", "avari"], "pitanje": "Dopuni bez ponuđenih reči.", "tekst": "Godine {{586}} propao je veliki napad na {{Solun}}, a 626. Sloveni su sa {{Avarima}} bezuspešno napali {{Carigrad}}.", "pomoc": ["Prvi napad je iz VI veka, a drugi iz VII.", "Prva meta je drugi po važnosti grad, a druga prestonica Vizantije.", "Iz lekcije: 586. Solun; 626. sa Avarima na Carigrad."], "objasnjenje": "Oba napada su propala: vizantijski veliki gradovi odoleli su, dok je unutrašnjost Balkana padala.", "iz_udzbenika": {"strana": 19, "odeljak": "Stari Sloveni i naseljavanje Balkanskog poluostrva", "tekst": "Napad na Solun 586. ne uspeva, a 626. sa Avarima pokušavaju da zauzmu Carigrad, opet neuspešno."}, "lekcija": 3}, {"id": "l03-vera-povezi", "vrsta": "povezi", "tezina": "lako", "pojmovi": ["perun", "dazbog", "stari-sloveni"], "pitanje": "Poveži pojam iz slovenske vere sa opisom.", "parovi": [["Perun ili Svetovid", "Vrhovni bog"], ["Dažbog", "Bog Sunca i podzemlja"], ["Vile i vukodlaci", "Bića u koja se verovalo"], ["Šume i reke", "Mesta gde su mnogi bogovi „živeli”"]], "pomoc": ["Sloveni su bili tesno vezani za prirodu.", "Razlikuj bogove od drugih bića.", "Iz lekcije: vrhovni bog Perun ili Svetovid; Dažbog je bog Sunca i podzemlja."], "objasnjenje": "Vera Slovena bila je vezana za prirodu, sa vrhovnim bogom, nižim bogovima i bićima iz verovanja.", "iz_udzbenika": {"strana": 19, "odeljak": "Stari Sloveni i naseljavanje Balkanskog poluostrva", "tekst": "Sloveni su bili vezani za prirodu; mnogi bogovi su živeli u šumama i rekama."}, "lekcija": 3}, {"id": "l03-narodi-u-borbi-povezi", "vrsta": "povezi", "tezina": "srednje", "pojmovi": ["avari", "bugari", "stari-sloveni", "solun", "carigrad"], "pitanje": "Poveži podatak sa pojmom na koji se odnosi.", "parovi": [["586.", "Neuspeli napad na Solun"], ["626.", "Neuspeli napad na Carigrad"], ["Sredina VI veka", "Avari u Panonskoj niziji"], ["Početak VII veka", "Prelazak Dunava sa porodicama"], ["Sredina VII veka", "Naziv Slovenska"]], "pomoc": ["Prati događaje redom, od Avara ka Slovenskoj.", "Napadi na velike gradove imaju tačne godine.", "Iz lekcije: 586. Solun, 626. Carigrad, Slovenska sredinom VII veka."], "objasnjenje": "Avari u Panoniji (sredina VI veka) → Solun 586 → prelazak (početak VII veka) → Carigrad 626 → Slovenska (sredina VII veka).", "iz_udzbenika": {"strana": 19, "odeljak": "Stari Sloveni i naseljavanje Balkanskog poluostrva", "tekst": "Lekcija navodi Avare sredinom VI veka, napade 586. i 626, prelazak početkom VII veka i Slovensku sredinom VII veka."}, "lekcija": 3}, {"id": "l03-vojska-carstva-zakljuci", "vrsta": "zakljuci", "tezina": "srednje", "pojmovi": ["vizantija", "stari-sloveni"], "pitanje": "Zašto Vizantija u VI veku nije mogla da zaustavi slovenske upade?", "odgovori": [{"tekst": "Ratovala je i na drugim stranama carstva, pa nije mogla da brani dunavsku granicu", "tacan": true}, {"tekst": "Car je Slovenima dozvolio da pljačkaju", "tacan": false, "zasto": "Pljačka nije bila dozvoljena; upade je car trpeo samo zato što nije imao čime da ih zaustavi."}, {"tekst": "Vizantija nije imala granicu na Dunavu", "tacan": false, "zasto": "Imala je: Dunav je upravo bio vizantijska granica koju je trebalo braniti."}, {"tekst": "Slovena je bilo manje nego Vizantinaca, pa ih nisu smatrali opasnim", "tacan": false, "zasto": "Lekcija daje drugi razlog: vojska carstva bila je zauzeta na drugim frontovima."}], "pomoc": ["Korak 1: Koliko je ratova carstvo vodilo u isto vreme?", "Korak 2: Šta to znači za vojsku na Dunavu?", "Iz lekcije: Vizantija nije mogla da brani granicu jer je ratovala i na drugim stranama."], "objasnjenje": "Carstvo je ratovalo na više strana, pa je dunavska granica ostala slabo branjena.", "iz_udzbenika": {"strana": 19, "odeljak": "Stari Sloveni i naseljavanje Balkanskog poluostrva", "tekst": "Vizantija nije mogla da brani granicu jer je ratovala i na drugim stranama carstva."}, "lekcija": 3}, {"id": "l03-porodice-znak-zakljuci", "vrsta": "zakljuci", "tezina": "srednje", "pojmovi": ["stari-sloveni", "doseljavanje"], "pitanje": "Šta nam činjenica da Sloveni u VII veku prelaze Dunav sa porodicama govori o njihovoj nameri?", "odgovori": [{"tekst": "Da hoće da ostanu, a ne samo da opljačkaju i vrate se", "tacan": true}, {"tekst": "Da beže od Vizantije", "tacan": false, "zasto": "Prelaze upravo na vizantijsko tlo, pa ne beže od nje nego ulaze u njene oblasti."}, {"tekst": "Da idu u hodočašće", "tacan": false, "zasto": "Sloveni su tada mnogobošci; razlog je naseljavanje."}, {"tekst": "Da se spremaju da odu u pradomovinu", "tacan": false, "zasto": "Pradomovina je na severu, a oni se kreću na jug i ostaju."}], "pomoc": ["Korak 1: Ko ide u pljačku: ratnici ili cele porodice?", "Korak 2: Zašto bi neko vodio decu i žene preko reke?", "Iz lekcije: sada idu sa porodicama i sa namerom da ostanu."], "objasnjenje": "Porodice se ne vode u pljačku; njihovo prisustvo pokazuje da je počelo trajno naseljavanje.", "iz_udzbenika": {"strana": 19, "odeljak": "Stari Sloveni i naseljavanje Balkanskog poluostrva", "tekst": "Početkom VII veka Sloveni prelaze granicu sa porodicama i sa namerom da ostanu."}, "osa": {"naziv": "Sloveni prelaze Dunav sa porodicama", "od": 605, "oznaka": "početak VII veka", "traka": "dogadjaji"}, "lekcija": 3}, {"id": "l03-primorje-i-gradovi-zakljuci", "vrsta": "zakljuci", "tezina": "tesko", "pojmovi": ["vizantija", "slovenska", "solun", "carigrad"], "pitanje": "Sloveni nisu uspeli da zauzmu ni Solun ni Carigrad, a ipak su do sredine VII veka preuzeli veliki deo Balkana. Šta se iz toga može zaključiti?", "odgovori": [{"tekst": "Vizantija je zadržala velike gradove i primorje, a izgubila unutrašnjost zemlje", "tacan": true}, {"tekst": "Sloveni su preuzeli i sve gradove na moru", "tacan": false, "zasto": "Baš suprotno: Vizantiji ostaju primorski gradovi i ostrva, a Sloveni drže unutrašnjost."}, {"tekst": "Neuspeh napada znači da se Sloveni nisu naselili", "tacan": false, "zasto": "Naselili su se bez većeg otpora; neuspeh pred velikim gradovima nije zaustavio naseljavanje."}, {"tekst": "Vizantija je pobedila i proterala Slovene preko Dunava", "tacan": false, "zasto": "Sredinom VII veka zemlja do planine Balkan već se zove Slovenska, pa proterivanja nije bilo."}], "pomoc": ["Korak 1: Koji gradovi i oblasti su ostali Vizantiji?", "Korak 2: Kako se zove zemlja između Dunava i planine Balkan?", "Iz lekcije: Slovenska je pod Slovenima, a Vizantiji ostaju dolina Morave, Niš, Sofija, primorski gradovi i ostrva."], "objasnjenje": "Utvrđene gradove i more Sloveni nisu mogli da uzmu, ali su unutrašnjost zaposeli naseljavanjem. Carstvo se svelo na gradove, primorje i ostrva.", "iz_udzbenika": {"strana": 19, "odeljak": "Stari Sloveni i naseljavanje Balkanskog poluostrva", "tekst": "Napadi na Solun i Carigrad nisu uspeli, a ipak zemlja do planine Balkan postaje Slovenska; Vizantija zadržava gradove i ostrva."}, "osa": {"naziv": "Slovenska između Dunava i planine Balkan", "od": 650, "oznaka": "sredina VII veka", "traka": "dogadjaji"}, "lekcija": 3}, {"id": "l03-sami-ili-sa-avarima-zakljuci", "vrsta": "zakljuci", "tezina": "tesko", "pojmovi": ["stari-sloveni", "avari", "bugari", "pesadija"], "pitanje": "Sloveni su u borbama bili pešadija, a Avari i Bugari konjica. Šta je mogla biti prednost njihovih zajedničkih napada na Vizantiju?", "odgovori": [{"tekst": "Dopunjavali su se: brza konjica i brojna pešadija zajedno čine jaču vojsku", "tacan": true}, {"tekst": "Vizantiji nije smetalo, jer je pešadija beskorisna", "tacan": false, "zasto": "Pešadija nije beskorisna: Sloveni su borbom u šumama i klancima bili opasni protivnici."}, {"tekst": "Avari i Bugari nisu morali da se bore", "tacan": false, "zasto": "Borili su se i oni; bili su konjica, a Sloveni pešadija."}, {"tekst": "Svi su mogli da plove do Carigrada", "tacan": false, "zasto": "Podatak o rodovima vojske govori o kopnenoj borbi, a ne o plovidbi."}], "pomoc": ["Korak 1: U čemu je jaka konjica?", "Korak 2: U čemu je jaka pešadija koju opisuje vizantijski izvor?", "Iz lekcije: Sloveni su pešadija, a Avari i Bugari konjica; zajedno stižu do Trakije, Tesalije i Epira."], "objasnjenje": "Pešaci i konjanici imaju različite prednosti, pa je zajednička vojska mogla da stigne dalje nego svaki rod sam.", "iz_udzbenika": {"strana": 19, "odeljak": "Stari Sloveni i naseljavanje Balkanskog poluostrva", "tekst": "U borbama su Sloveni pešadija, a Avari i Bugari konjica.", "slika": "03-doseljavanje-srba-na-balkan/03-stari-sloven.jpg"}, "lekcija": 3}, {"id": "l03-solun-586-datum", "vrsta": "datum", "tezina": "srednje", "pojmovi": ["solun", "stari-sloveni", "avari"], "dogadjaj": "Avarsko-slovenski napad na Solun", "pitanje": "Koje godine je izveden veliki neuspeli napad na Solun?", "godina": 586, "traka": "dogadjaji", "pomoc": ["To je kraj VI veka.", "Pada četrdeset godina pre napada na Carigrad.", "Iz lekcije: 586. veliki napad na Solun ne uspeva."], "objasnjenje": "Godine 586. Solun je odoleo; to je bio jedan od više takvih pokušaja.", "iz_udzbenika": {"strana": 19, "odeljak": "Stari Sloveni i naseljavanje Balkanskog poluostrva", "tekst": "Godine 586. veliki napad na Solun nije uspeo; bio je jedan od više takvih pokušaja."}, "lekcija": 3}, {"id": "l03-carigrad-626-datum", "vrsta": "datum", "tezina": "lako", "pojmovi": ["carigrad", "avari", "stari-sloveni"], "dogadjaj": "Avarsko-slovenski napad na Carigrad", "pitanje": "Koje godine su Sloveni i Avari napali Carigrad?", "godina": 626, "traka": "dogadjaji", "pomoc": ["To je VII vek, njegova prva polovina.", "Iraklije je tada na prestolu
