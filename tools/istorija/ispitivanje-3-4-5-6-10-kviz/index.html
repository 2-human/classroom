 (610–641).", "Iz lekcije: 626. sa Avarima pokušavaju da zauzmu Carigrad."], "objasnjenje": "Napad 626. nije uspeo, kao ni ranije napadi na Solun.", "iz_udzbenika": {"strana": 19, "odeljak": "Stari Sloveni i naseljavanje Balkanskog poluostrva", "tekst": "Godine 626. Sloveni sa Avarima pokušavaju da zauzmu Carigrad, opet neuspešno."}, "lekcija": 3}, {"id": "l03-justinijan-datum", "vrsta": "datum", "tezina": "tesko", "pojmovi": ["justinijan-i", "vizantija"], "dogadjaj": "Vladavina Justinijana I", "pitanje": "U kom periodu je vladao car Justinijan I?", "od": 527, "do": 565, "traka": "vladari", "pomoc": ["Vladao je gotovo četiri decenije u VI veku.", "Počeo je u drugoj, a završio u sedmoj deceniji VI veka.", "Iz lekcije: Justinijan I (527–565)."], "objasnjenje": "Justinijan I je vladao 527–565. i pod njim počinju upadi Slovena.", "iz_udzbenika": {"strana": 19, "odeljak": "Stari Sloveni i naseljavanje Balkanskog poluostrva", "tekst": "Upadi počinju pod carem Justinijanom I (527–565)."}, "lekcija": 3}, {"id": "l03-iraklije-datum", "vrsta": "datum", "tezina": "tesko", "pojmovi": ["iraklije", "vizantija"], "dogadjaj": "Vladavina cara Iraklija", "pitanje": "U kom periodu je vladao vizantijski car Iraklije?", "od": 610, "do": 641, "traka": "vladari", "pomoc": ["Na prestolu je bio u vreme napada na Carigrad 626.", "Vladao je trideset i jednu godinu u VII veku.", "Iz lekcije: Iraklije 610–641."], "objasnjenje": "Iraklije je vladao 610–641, u vreme kada se Sloveni naseljavaju južno od Dunava.", "iz_udzbenika": {"strana": 17, "odeljak": "Hronologija celog dela II", "tekst": "Vremenska lenta dela II navodi vladavinu vizantijskog cara Iraklija 610–641."}, "lekcija": 3}, {"id": "l03-napadi-poredjaj", "vrsta": "poredjaj", "tezina": "lako", "pojmovi": ["solun", "carigrad", "huni"], "pitanje": "Poređaj događaje hronološki, od najranijeg.", "stavke": [{"tekst": "Huni prolaze kroz Vrata naroda", "godina": 375, "naziv": "Huni prolaze kroz Vrata naroda", "traka": "dogadjaji"}, {"tekst": "Neuspeli napad na Solun", "godina": 586, "naziv": "Avarsko-slovenski napad na Solun", "traka": "dogadjaji"}, {"tekst": "Neuspeli napad na Carigrad", "godina": 626, "naziv": "Avarsko-slovenski napad na Carigrad", "traka": "dogadjaji"}], "pomoc": ["Seoba je počela mnogo pre napada na gradove.", "Solun je napadnut u VI, a Carigrad u VII veku.", "Iz lekcije: 375, 586, 626."], "objasnjenje": "Huni (375) → Solun (586) → Carigrad (626).", "iz_udzbenika": {"strana": 17, "odeljak": "Hronologija celog dela II", "tekst": "Lenta dela II navodi Hune 375, napad na Solun 586. i napad na Carigrad 626."}, "lekcija": 3}, {"id": "l03-od-pljacke-do-slovenske-poredjaj", "vrsta": "poredjaj", "tezina": "tesko", "pojmovi": ["avari", "stari-sloveni", "slovenska", "solun", "carigrad"], "pitanje": "Poređaj ceo tok naseljavanja, od najranijeg događaja.", "stavke": [{"tekst": "Avari stižu u Panonsku niziju", "godina": 550, "oznaka": "sredina VI veka", "naziv": "Avari stižu u Panonsku niziju", "traka": "dogadjaji"}, {"tekst": "Napad na Solun ne uspeva", "godina": 586, "naziv": "Avarsko-slovenski napad na Solun", "traka": "dogadjaji"}, {"tekst": "Sloveni prelaze Dunav sa porodicama", "godina": 605, "oznaka": "početak VII veka", "naziv": "Sloveni prelaze Dunav sa porodicama", "traka": "dogadjaji"}, {"tekst": "Napad na Carigrad ne uspeva", "godina": 626, "naziv": "Avarsko-slovenski napad na Carigrad", "traka": "dogadjaji"}, {"tekst": "Zemlja do planine Balkan zove se Slovenska", "godina": 650, "oznaka": "sredina VII veka", "naziv": "Slovenska između Dunava i planine Balkan", "traka": "dogadjaji"}], "pomoc": ["Dva događaja su u VI veku, a tri u VII.", "Slovenska je rezultat, pa ide na kraj.", "Iz lekcije: Avari sredinom VI veka, Solun 586, prelazak početkom VII veka, Carigrad 626, Slovenska sredinom VII veka."], "objasnjenje": "Sled pokazuje put od pljačke (VI vek) do trajnog naseljavanja i slovenske prevlasti (VII vek).", "iz_udzbenika": {"strana": 19, "odeljak": "Stari Sloveni i naseljavanje Balkanskog poluostrva", "tekst": "Lekcija opisuje korake od dolaska Avara i napada na gradove do naseljavanja i Slovenske."}, "lekcija": 3}, {"id": "l03-upadi-lanac", "vrsta": "lanac", "tezina": "lako", "pojmovi": ["vizantija", "stari-sloveni"], "karike": ["Vizantija ratuje na drugim stranama carstva", "?", "Sloveni upadaju sve do Trakije, Tesalije i Epira"], "praznina": 1, "odgovori": [{"tekst": "Odbrana dunavske granice je slaba", "tacan": true}, {"tekst": "Vizantija gradi novu prestonicu", "tacan": false, "zasto": "Prestonica je Carigrad, a veza između ratova i upada je slaba granica."}, {"tekst": "Sloveni postaju hrišćani", "tacan": false, "zasto": "Hrišćanstvo se učvršćuje tek u IX veku i ne objašnjava upade u VI veku."}], "pomoc": ["Korak 1: Gde je vojska kad je na drugim frontovima?", "Korak 2: Šta se dešava sa granicom bez vojske?", "Iz lekcije: ratovi Vizantije na drugim stranama → slaba odbrana dunavske granice → upadi."], "objasnjenje": "Zauzeto carstvo nije branilo Dunav, pa su Sloveni ulazili duboko na jug.", "iz_udzbenika": {"strana": 19, "odeljak": "Stari Sloveni i naseljavanje Balkanskog poluostrva", "tekst": "Ratovi Vizantije na drugim stranama oslabili su odbranu Dunava, pa su upadi dopirali do Trakije, Tesalije i Epira."}, "lekcija": 3}, {"id": "l03-naseljavanje-lanac", "vrsta": "lanac", "tezina": "srednje", "pojmovi": ["stari-sloveni", "doseljavanje", "slovenska"], "karike": ["Pljačkaški upadi u VI veku", "?", "Slovenske naseobine i naziv Slovenska"], "praznina": 1, "odgovori": [{"tekst": "Naseljavanje sa porodicama u VII veku", "tacan": true}, {"tekst": "Masovan povratak u pradomovinu", "tacan": false, "zasto": "Povratka nije bilo: oni koji su ranije odlazili sada ostaju."}, {"tekst": "Veliki raskol 1054.", "tacan": false, "zasto": "Raskol je pet vekova kasnije i ne tiče se naseljavanja."}], "pomoc": ["Korak 1: Čime se razlikuje VII vek od VI?", "Korak 2: Šta moraš imati da bi nastale naseobine?", "Iz lekcije: pljačkaški upadi → naseljavanje sa porodicama → naseobine i Slovenska."], "objasnjenje": "Pljačka se pretvorila u naseljavanje, a naseljavanje u slovensku prevlast na velikom delu Balkana.", "iz_udzbenika": {"strana": 19, "odeljak": "Stari Sloveni i naseljavanje Balkanskog poluostrva", "tekst": "Upadi iz VI veka u VII veku prelaze u naseljavanje, a sredinom veka postoje snažne naseobine."}, "lekcija": 3}, {"id": "l03-avari-pritisak-lanac", "vrsta": "lanac", "tezina": "tesko", "pojmovi": ["avari", "stari-sloveni", "carigrad"], "karike": ["Avari stižu u Panonsku niziju", "Potčinjavaju tamošnja slovenska plemena", "?", "Napad na Carigrad 626. ne uspeva"], "praznina": 2, "odgovori": [{"tekst": "Sloveni napadaju Vizantiju zajedno sa Avarima", "tacan": true}, {"tekst": "Sloveni i Avari sklapaju mir sa carem i razoružavaju se", "tacan": false, "zasto": "Da je bilo mira, ne bi bilo ni napada 626; lekcija govori o zajedničkim napadima."}, {"tekst": "Avari odlaze iz Panonije na zapad", "tacan": false, "zasto": "Lekcija to ne kaže; Avari ostaju u igri kao saveznici Slovena protiv Vizantije."}], "pomoc": ["Korak 1: Šta potčinjeno pleme radi za gospodara?", "Korak 2: Protiv koga su se zajedno borili?", "Iz lekcije: napadali su prvo sa Bugarima, pa sa Avarima; 626. sa Avarima na Carigrad."], "objasnjenje": "Potčinjeni Sloveni su ratovali uz Avare, pa je i napad na Carigrad bio zajednički.", "iz_udzbenika": {"strana": 19, "odeljak": "Stari Sloveni i naseljavanje Balkanskog poluostrva", "tekst": "Avari potčinjavaju slovenska plemena; Sloveni zatim napadaju sa njima, a 626. i Carigrad."}, "osa": {"naziv": "Avarsko-slovenski napad na Carigrad", "od": 626, "traka": "dogadjaji"}, "lekcija": 3}, {"id": "l03-izvor-sloboda-izvor", "vrsta": "izvor", "tezina": "lako", "pojmovi": ["stari-sloveni", "anti"], "izvor": {"autor": "Vizantijski izvor (ime nije navedeno)", "naslov": "O Slovenima i Antima", "tekst": "Sloveni i srodni Anti žive na isti način i imaju iste običaje. Vole slobodu i teško podnose da im iko vlada, a pogotovu na njihovoj zemlji.", "napomena": "Odlomak je prepričan; udžbenik, str. 21–22."}, "pitanje": "Koju osobinu Slovena i Anta ovaj izvor posebno ističe?", "odgovori": [{"tekst": "Slobodoljubivost", "tacan": true}, {"tekst": "Poslušnost caru", "tacan": false, "zasto": "Izvor tvrdi suprotno: ne trpe da njima vladaju."}, {"tekst": "Bogatstvo", "tacan": false, "zasto": "O bogatstvu nema ni reči; naprotiv, drugi deo izvora pominje oskudicu."}, {"tekst": "Učenost i pismenost", "tacan": false, "zasto": "Tada nisu imali pismo; izvor govori o slobodi, a ne o obrazovanju."}], "pomoc": ["Pročitaj drugu rečenicu.", "Šta ne podnose?", "Iz lekcije: slobodoljubivi su i ne trpe da njima vladaju, naročito u svojoj zemlji."], "objasnjenje": "Vizantijski pisac ističe da Sloveni i Anti vole slobodu i ne podnose tuđu vlast.", "iz_udzbenika": {"strana": 21, "odeljak": "Iz istorijskih izvora", "tekst": "Vizantijski izvor opisuje Slovene i Ante kao slobodoljubive i kaže da ne trpe da njima vladaju."}, "lekcija": 3}, {"id": "l03-izvor-izdrzljivost-izvor", "vrsta": "izvor", "tezina": "srednje", "pojmovi": ["stari-sloveni", "anti"], "izvor": {"autor": "Vizantijski izvor (ime nije navedeno)", "naslov": "O Slovenima i Antima", "tekst": "Ima ih mnogo i izdržljivi su. Lako podnose vrućinu, hladnoću, kišu, a i manjak odeće i hrane.", "napomena": "Odlomak je prepričan; udžbenik, str. 21–22."}, "pitanje": "Zašto bi vizantijski pisac beležio ovakve podatke o Slovenima?", "odgovori": [{"tekst": "Zato što su bili protivnik, pa je važno znati koliko su opasni i izdržljivi", "tacan": true}, {"tekst": "Zato što ih je hteo da pozove na svadbu", "tacan": false, "zasto": "Izvor je opis stranog naroda s kojim se Vizantija sukobljavala, a ne lični poziv."}, {"tekst": "Zato što su Sloveni sami tražili da ih opiše", "tacan": false, "zasto": "Sloveni nisu imali pismo ni uticaj na vizantijske pisce; pisac beleži za svoje ljude."}, {"tekst": "Zato što je želeo da pohvali vizantijsku vojsku", "tacan": false, "zasto": "Izvor govori o Slovenima, a ne o carskoj vojsci."}], "pomoc": ["Seti se kakav je bio odnos Vizantije i Slovena u VI veku.", "Šta treba da znaš o protivniku pre borbe?", "Iz lekcije: izvor opisuje brojnost i izdržljivost, a Sloveni su tada napadali Vizantiju."], "objasnjenje": "Vizantinci su Slovene upoznali kao napadače; podaci o brojnosti i izdržljivosti govore koliko je taj protivnik težak.", "iz_udzbenika": {"strana": 21, "odeljak": "Iz istorijskih izvora", "tekst": "Izvor kaže da su Sloveni brojni i izdržljivi i da lako podnose vrućinu, hladnoću, kišu i oskudicu."}, "lekcija": 3}, {"id": "l03-izvor-zarobljenici-izvor", "vrsta": "izvor", "tezina": "srednje", "pojmovi": ["stari-sloveni", "anti"], "izvor": {"autor": "Vizantijski izvor (ime nije navedeno)", "naslov": "O Slovenima i Antima", "tekst": "Zarobljenike ne drže zauvek u ropstvu. Posle određenog vremena zarobljenik bira: da se otkupi i vrati svojima ili da ostane kao slobodan čovek i prijatelj.", "napomena": "Odlomak je prepričan; udžbenik, str. 21–22."}, "pitanje": "Šta iz ovog odlomka možemo da zaključimo o ropstvu kod Slovena?", "odgovori": [{"tekst": "Ropstvo je bilo ograničeno vremenom, a zarobljenik je mogao da postane slobodan", "tacan": true}, {"tekst": "Zarobljenici su ostajali robovi do smrti", "tacan": false, "zasto": "Izvor kaže upravo da ih ne drže trajno u ropstvu."}, {"tekst": "Sloveni nikada nisu uzimali zarobljenike", "tacan": false, "zasto": "Uzimali su ih, jer izvor opisuje šta dalje sa njima rade."}, {"tekst": "Zarobljenici su odmah puštani bez ikakvog roka", "tacan": false, "zasto": "Oslobađanje dolazi posle određenog roka, a ne odmah."}], "pomoc": ["Nađi izraz koji govori o vremenu.", "Koje dve mogućnosti ima zarobljenik?", "Iz lekcije: posle određenog roka mogu da se otkupe i vrate ili da ostanu kao slobodni i prijatelji."], "objasnjenje": "Izvor pokazuje blaži oblik ropstva: posle roka zarobljenik se može otkupiti ili ostati kao slobodan i prijatelj.", "iz_udzbenika": {"strana": 22, "odeljak": "Iz istorijskih izvora", "tekst": "Sloveni zarobljenike ne drže trajno u ropstvu: posle roka mogu da se otkupe ili da ostanu kao slobodni i prijatelji."}, "lekcija": 3}, {"id": "l03-izvor-zaseda-izvor", "vrsta": "izvor", "tezina": "tesko", "pojmovi": ["stari-sloveni", "zaseda", "pesadija", "avari"], "izvor": {"autor": "Vizantijski izvor (ime nije navedeno)", "naslov": "O Slovenima i Antima", "tekst": "Protivnika radije napadaju u šumama, klancima i na strminama. Umešno se služe zasedama i iznenadnim napadima.", "napomena": "Odlomak je prepričan; udžbenik, str. 21–22."}, "pitanje": "Kako se ovaj opis slaže sa podatkom da su Sloveni bili pešadija, a ne konjica?", "odgovori": [{"tekst": "Pešak se u šumi i klancu lako kreće i skriva, pa je takav teren njegova prednost", "tacan": true}, {"tekst": "Ne slaže se, jer je za zasede u šumi potrebna teška konjica", "tacan": false, "zasto": "Konjica traži otvoren prostor, kakav imaju Avari i Bugari; šuma i strmina pogoduju pešacima."}, {"tekst": "Ne slaže se, jer su Sloveni izbegavali borbu", "tacan": false, "zasto": "Nisu je izbegavali, nego su birali mesto i trenutak koji im odgovaraju."}, {"tekst": "Opis govori o Avarima, a ne o Slovenima", "tacan": false, "zasto": "Izvor izričito govori o Slovenima i Antima."}], "pomoc": ["Zamisli konjanika na strmini među drvećem.", "Ko se u šumi bolje skriva: čovek ili konj?", "Iz lekcije: Sloveni su pešadija; napadaju u šumama, klancima i na strminama, koristeći zasede."], "objasnjenje": "Sloveni su birali teren na kom njihova pešadija ima prednost, a konjica protivnika je nema.", "iz_udzbenika": {"strana": 22, "odeljak": "Iz istorijskih izvora", "tekst": "Protivnike napadaju u šumama, klancima i na strminama i dobro koriste zasede i iznenađenja.", "slika": "03-doseljavanje-srba-na-balkan/05-sloveni-u-zasedi.jpg"}, "lekcija": 3}, {"id": "l03-vi-protiv-vii-uporedi", "vrsta": "uporedi", "tezina": "srednje", "pojmovi": ["stari-sloveni", "doseljavanje", "vizantija"], "a": "Upadi u VI veku", "b": "Naseljavanje u VII veku", "pitanje": "Na koji period se odnosi tvrdnja?", "tvrdnje": [{"tekst": "Sloveni se sa plenom vraćaju preko Dunava.", "odgovor": "a", "zasto": "To je obrazac pljačke u VI veku; u VII veku ostaju."}, {"tekst": "Sloveni dolaze sa porodicama.", "odgovor": "b", "zasto": "Porodice dolaze u VII veku, jer je cilj trajni ostanak."}, {"tekst": "Glavni protivnik je Vizantija.", "odgovor": "oba", "zasto": "I upadi i naseljavanje odvijaju se na vizantijskoj teritoriji."}, {"tekst": "Vlada Justinijan I.", "odgovor": "a", "zasto": "Justinijan I vlada 527–565, u vreme prvih upada."}, {"tekst": "Nastaje naziv Slovenska.", "odgovor": "b", "zasto": "Naziv se javlja sredinom VII veka, kada su naseobine snažne."}, {"tekst": "Sloveni su već primili hrišćanstvo.", "odgovor": "nijedan", "zasto": "Hrišćanstvo se kod Južnih Slovena učvršćuje tek u IX veku."}], "pomoc": ["Pitaj se: ide li se kući posle borbe ili se ostaje?", "Pazi na tvrdnje koje važe za oba perioda ili ni za jedan.", "Iz lekcije: u VI veku pljačka, u VII veku naseljavanje sa porodicama."], "objasnjenje": "U VI veku Sloveni dolaze radi plena, a u VII veku radi ostanka; protivnik je isti, Vizantija.", "iz_udzbenika": {"strana": 19, "odeljak": "Stari Sloveni i naseljavanje Balkanskog poluostrva", "tekst": "Upadi u VI veku su pljačkaški, a u VII veku Sloveni dolaze sa porodicama i ostaju."}, "lekcija": 3}, {"id": "l03-sloveni-avari-uporedi", "vrsta": "uporedi", "tezina": "lako", "pojmovi": ["stari-sloveni", "avari", "pesadija"], "a": "Sloveni", "b": "Avari", "pitanje": "Na koji narod se odnosi tvrdnja?", "tvrdnje": [{"tekst": "U borbi su bili pešadija.", "odgovor": "a", "zasto": "Sloveni su ratovali pešice; Avari su bili konjica."}, {"tekst": "U borbi su bili konjica.", "odgovor": "b", "zasto": "Konjica su bili Avari, kao i Bugari."}, {"tekst": "Stigli su iz Azije u Panonsku niziju.", "odgovor": "b", "zasto": "Avari su došli iz Azije; pradomovina Slovena bila je u Evropi."}, {"tekst": "Napadali su Carigrad 626.", "odgovor": "oba", "zasto": "Napad 626. izveli su zajedno."}, {"tekst": "Poticali su iz zemalja između Odre i Visle.", "odgovor": "a", "zasto": "To je slovenska pradomovina."}], "pomoc": ["Ko je došao iz Azije?", "Jedna tvrdnja važi za oba.", "Iz lekcije: Sloveni su pešadija, Avari konjica; zajedno napadaju 626."], "objasnjenje": "Sloveni i Avari su se razlikovali po poreklu i načinu ratovanja, a povezivali su ih zajednički napadi.", "iz_udzbenika": {"strana": 19, "odeljak": "Stari Sloveni i naseljavanje Balkanskog poluostrva", "tekst": "Avari stižu iz Azije; u borbama su konjica, a Sloveni pešadija."}, "lekcija": 3}, {"id": "l03-justinijan-ko-sam", "vrsta": "ko_sam", "tezina": "srednje", "pojmovi": ["justinijan-i", "vizantija", "stari-sloveni"], "tragovi": ["Bio sam vizantijski car u VI veku.", "Vladao sam od 527. do 565.", "Pod mojom vlašću počeli su upadi Slovena na Balkan."], "odgovori": [{"tekst": "Justinijan I", "tacan": true}, {"tekst": "Iraklije", "tacan": false, "zasto": "Iraklije vlada u VII veku (610–641), posle Justinijana."}, {"tekst": "Herodot", "tacan": false, "zasto": "Herodot je grčki istoričar iz V veka pre n. e., a ne vizantijski car."}], "objasnjenje": "To je Justinijan I, pod kojim počinju pljačkaški upadi Slovena.", "iz_udzbenika": {"strana": 19, "odeljak": "Stari Sloveni i naseljavanje Balkanskog poluostrva", "tekst": "Upadi na Balkan počinju pod carem Justinijanom I (527–565)."}, "osa": {"naziv": "Vladavina Justinijana I", "od": 527, "do": 565, "traka": "vladari"}, "lekcija": 3}, {"id": "l03-avari-ko-sam", "vrsta": "ko_sam", "tezina": "lako", "pojmovi": ["avari", "stari-sloveni", "carigrad"], "tragovi": ["Stigli smo iz Azije u Panonsku niziju sredinom VI veka.", "Potčinili smo tamošnja slovenska plemena.", "Sa Slovenima smo 626. neuspešno napali Carigrad."], "odgovori": [{"tekst": "Avari", "tacan": true}, {"tekst": "Mađari", "tacan": false, "zasto": "I Mađari dolaze u Panoniju iz Azije, ali tek krajem IX veka."}, {"tekst": "Bugari", "tacan": false, "zasto": "Bugari su sa Slovenima napadali ranije, ali Panoniju i napad 626. lekcija vezuje za Avare."}], "objasnjenje": "To su Avari, koji su Slovene u Panoniji potčinili, a posle ih poveli na Vizantiju.", "iz_udzbenika": {"strana": 19, "odeljak": "Stari Sloveni i naseljavanje Balkanskog poluostrva", "tekst": "Avari stižu iz Azije, potčinjavaju slovenska plemena, a 626. napadaju Carigrad sa Slovenima."}, "lekcija": 3}, {"id": "l03-kada-naseljavanje-objasni", "vrsta": "objasni", "tezina": "lako", "pojmovi": ["doseljavanje", "stari-sloveni"], "pitanje": "Kada počinje naseljavanje Slovena na Balkanu i po čemu znamo da to više nisu pljačkaški upadi? Objasni.", "uzor": "Naseljavanje počinje u VII veku. U VI veku Sloveni su pljačkali i sa plenom se vraćali preko Dunava. Od početka VII veka prelaze sa porodicama i sa namerom da ostanu, a sredinom veka već postoje snažne naseobine.", "ideje": ["Naseljavanje počinje u VII veku.", "U VI veku su se posle pljačke vraćali.", "U VII veku dolaze sa porodicama.", "Nastaju snažne slovenske naseobine."], "objasnjenje": "Ključna razlika je namera: povratak sa plenom ili ostanak sa porodicom.", "iz_udzbenika": {"strana": 22, "odeljak": "Pitanja za razmišljanje / Zadaci iz udžbenika", "tekst": "Udžbenik pita kada počinje naseljavanje Balkana."}, "lekcija": 3}, {"id": "l03-zasto-vizantija-gubi-objasni", "vrsta": "objasni", "tezina": "srednje", "pojmovi": ["vizantija", "slovenska", "stari-sloveni"], "pitanje": "Kako je Vizantija do sredine VII veka izgubila veliki deo Balkana, iako nije izgubila ni Solun ni Carigrad? Objasni.", "uzor": "Vizantija je ratovala i na drugim stranama pa nije mogla da brani Dunav. Sloveni su zato početkom VII veka prelazili granicu bez većeg otpora i naseljavali unutrašnjost. Veliki gradovi su odoleli napadima, ali je zemlja do planine Balkan postala Slovenska.", "ideje": ["Ratovi na drugim stranama carstva oslabili su granicu.", "Sloveni prelaze bez većeg otpora i naseljavaju se.", "Solun i Carigrad odolevaju, a unutrašnjost je izgubljena."], "objasnjenje": "Zemlja se ne gubi samo padom velikih gradova, nego i trajnim naseljavanjem unutrašnjosti.", "iz_udzbenika": {"strana": 19, "odeljak": "Stari Sloveni i naseljavanje Balkanskog poluostrva", "tekst": "Vizantija nije mogla da brani granicu, napadi na gradove nisu uspeli, a sredinom VII veka zemlja do planine Balkan zove se Slovenska."}, "lekcija": 3}, {"id": "l03-koliko-verovati-izvoru-objasni", "vrsta": "objasni", "tezina": "tesko", "pojmovi": ["stari-sloveni", "anti", "vizantija", "zaseda"], "pitanje": "Vizantijski izvor o Slovenima i Antima napisao je stranac i protivnik. Šta iz njega možemo da saznamo, a na šta moramo da pazimo? Objasni.", "uzor": "Izvor nam kazuje da su Sloveni bili brojni, izdržljivi i slobodoljubivi, da su zarobljenike posle roka oslobađali i da su ratovali iz zasede. Ali pisac nije Sloven, nego pripadnik carstva koje su Sloveni napadali, pa je gledao spolja i svojim očima. Zato je dobro da takvu vest uporedimo sa drugim podacima.", "ideje": ["Izvor daje podatke o običajima i načinu ratovanja Slovena.", "Pisac je Vizantinac, dakle stranac i protivnik.", "Vizantijske vesti često su kratke i neprecizne.", "Vest treba uporediti sa drugim podacima."], "objasnjenje": "Izvor je dragocen jer drugih gotovo nema, ali ga treba čitati znajući ko ga je napisao.", "iz_udzbenika": {"strana": 21, "odeljak": "Iz istorijskih izvora", "tekst": "Vizantijski izvor opisuje Slovene i Ante; vesti vizantijskih pisaca su inače kratke i često neprecizne."}, "lekcija": 3}, {"id": "l03-severno-od-dunava-izbor", "vrsta": "izbor", "tezina": "tesko", "pojmovi": ["stari-sloveni", "vizantija", "doseljavanje"], "pitanje": "Vizantijski pisci u VI veku pominju Slovene severno od Dunava, a isti ti Sloveni tada pljačkaju Trakiju i Epir. Kako se ova dva podatka slažu?", "odgovori": [{"tekst": "Sloveni su još živeli preko Dunava, a na carsku zemlju dolazili su samo radi plena", "tacan": true}, {"tekst": "Podaci se ne slažu, pa je jedan sigurno izmišljen", "tacan": false, "zasto": "Slažu se: dom je severno od reke, a pljačka je pohod koji se završava povratkom na levu obalu."}, {"tekst": "Trakija i Epir su severno od Dunava", "tacan": false, "zasto": "To su vizantijske oblasti na Balkanu, dakle južno od Dunava."}, {"tekst": "Sloveni su već živeli u Trakiji i Epiru sa porodicama", "tacan": false, "zasto": "Porodice prelaze tek početkom VII veka; u VI veku ostajanja još nema."}], "pomoc": ["Razlikuj gde neko živi od toga dokle stiže u pohodu.", "Gde su se vraćali sa plenom?", "Iz lekcije: u VI veku pominju se severno od Dunava; posle upada vraćaju se na levu obalu."], "objasnjenje": "U VI veku granica je još razdvajala dom i plen: Sloveni žive severno od Dunava, a na jug idu u pljačku.", "iz_udzbenika": {"strana": 18, "odeljak": "Život u pradomovini, uzroci i pravci seobe", "tekst": "U VI veku Sloveni se pominju severno od Dunava, a tada već pljačkaju vizantijske oblasti."}, "lekcija": 3}, {"id": "l03-vera-i-priroda-objasni", "vrsta": "objasni", "tezina": "srednje", "pojmovi": ["stari-sloveni", "perun", "dazbog"], "pitanje": "Kako se vera starih Slovena vezuje za njihov život u prirodi? Objasni.", "uzor": "Sloveni su bili tesno vezani za prirodu, pa su verovali da mnogi bogovi žive u šumama i rekama. Vrhovni bog bio je Perun ili Svetovid, a Dažbog je bio bog Sunca i podzemlja. Verovali su i u vile i vukodlake. Ono što su svakodnevno videli oko sebe pretvarali su u svoja verovanja.", "ideje": ["Sloveni su tesno vezani za prirodu.", "Bogovi žive u šumama i rekama.", "Vrhovni bog je Perun ili Svetovid, a Dažbog bog Sunca i podzemlja.", "Verovali su u vile i vukodlake."], "objasnjenje": "Mnogoboštvo Slovena izrasta iz života u prirodi.", "iz_udzbenika": {"strana": 19, "odeljak": "Stari Sloveni i naseljavanje Balkanskog poluostrva", "tekst": "Sloveni su bili vezani za prirodu; mnogi bogovi su živeli u šumama i rekama."}, "lekcija": 3}]}, {"naslov": "3. Odnosi sa susedima i starosedeocima", "zadaci": [{"id": "l03-vlasi-izbor", "vrsta": "izbor", "tezina": "lako", "pojmovi": ["vlasi", "starosedeoci"], "pitanje": "Koga su Sloveni nazivali Vlasima?", "odgovori": [{"tekst": "Romanizovane Ilire i Tračane", "tacan": true}, {"tekst": "Avare i Bugare", "tacan": false, "zasto": "Avari i Bugari su azijski došljaci, a Vlasi su staro romanizovano stanovništvo Balkana."}, {"tekst": "Vizantijske sveštenike", "tacan": false, "zasto": "Naziv se odnosi na starosedeoce u planinama, a ne na sveštenike carstva."}, {"tekst": "Hrvatska plemena", "tacan": false, "zasto": "Hrvati su južnoslovenska plemena, a Vlasi potomci starog romanizovanog stanovništva."}], "pomoc": ["Oni su na Balkanu živeli pre Slovena.", "Primili su rimsku kulturu i jezik.", "Iz lekcije: tako su Sloveni zvali romanizovane Ilire i Tračane."], "objasnjenje": "Vlasi su romanizovani Iliri i Tračani, koji su se povukli u planine i živeli kao stočari.", "iz_udzbenika": {"strana": 20, "odeljak": "Odnosi sa susedima i starosedeocima", "tekst": "Vlasima su Sloveni zvali romanizovane Ilire i Tračane, koji su se povukli u planine i bavili stočarstvom."}, "lekcija": 3}, {"id": "l03-asimilacija-izbor", "vrsta": "izbor", "tezina": "lako", "pojmovi": ["asimilacija"], "pitanje": "Šta je asimilacija?", "odgovori": [{"tekst": "Nestajanje jednog naroda, obično manjine, stapanjem sa većinskim narodom", "tacan": true}, {"tekst": "Prelazak na hrišćanstvo", "tacan": false, "zasto": "To je hristijanizacija; asimilacija je stapanje sa drugim narodom."}, {"tekst": "Seoba naroda u novu zemlju", "tacan": false, "zasto": "Seoba je kretanje naroda, a asimilacija ono što se može desiti posle, kad se narodi izmešaju."}, {"tekst": "Povlačenje naroda u planine", "tacan": false, "zasto": "Tako su Vlasi izbegli stapanje, pa je to pre suprotnost asimilaciji."}], "pomoc": ["Razmisli šta se desi sa malom grupom među mnogo većom.", "Traži reč „stapanje”.", "Iz lekcije: jedan narod, obično manjina, nestaje stapanjem sa većinskim narodom."], "objasnjenje": "Asimilacija znači da se manjina stopi sa većinom i nestane kao poseban narod.", "iz_udzbenika": {"strana": 20, "odeljak": "Odnosi sa susedima i starosedeocima", "tekst": "Asimilacija je kada jedan narod, obično manjina, nestaje stapanjem sa većinskim narodom na nekom području."}, "lekcija": 3}, {"id": "l03-primorski-gradovi-izbor", "vrsta": "izbor", "tezina": "srednje", "pojmovi": ["starosedeoci"], "pitanje": "U kojim primorskim gradovima su opstali delovi starog rimskog stanovništva? (više tačnih)", "odgovori": [{"tekst": "Drač", "tacan": true}, {"tekst": "Skadar", "tacan": true}, {"tekst": "Trogir", "tacan": true}, {"tekst": "Zadar", "tacan": true}, {"tekst": "Niš", "tacan": false, "zasto": "Niš je ostao vizantijski, ali je u unutrašnjosti, a pitanje traži gradove na obali."}, {"tekst": "Sofija", "tacan": false, "zasto": "I Sofija je ostala Vizantiji, ali nije primorski grad."}], "pomoc": ["Svi tačni gradovi su na Jadranu ili blizu njega.", "Izbaci gradove iz unutrašnjosti Balkana.", "Iz lekcije: Drač, Skadar, Trogir i Zadar."], "objasnjenje": "Stari stanovnici opstali su u Draču, Skadru, Trogiru i Zadru, a Sloveni su se naselili u njihovom zaleđu.", "iz_udzbenika": {"strana": 20, "odeljak": "Odnosi sa susedima i starosedeocima", "tekst": "Delovi rimskog stanovništva opstali su u Draču, Skadru, Trogiru i Zadru, iza kojih su se naselili Sloveni."}, "lekcija": 3}, {"id": "l03-varvari-tn", "vrsta": "tacno_netacno", "tezina": "lako", "pojmovi": ["varvari"], "tvrdnja": "Varvarima su nazivani stranci izvan antičke grčko-rimske kulture.", "tacno": true, "pomoc": ["Pomisli na plemena van rimskih granica.", "Iz lekcije: varvari su stranci izvan antičke grčko-rimske kulture."], "objasnjenje": "Tačno. Varvari su, gledano iz Rima i Grčke, bili oni koji ne pripadaju toj kulturi, na primer plemena van rimskih granica.", "iz_udzbenika": {"strana": 20, "odeljak": "Odnosi sa susedima i starosedeocima", "tekst": "Varvari su stranci izvan antičke grčko-rimske kulture, na primer plemena van rimskih granica."}, "lekcija": 3}, {"id": "l03-povratak-teritorije-tn", "vrsta": "tacno_netacno", "tezina": "srednje", "pojmovi": ["vizantija", "slovenska"], "tvrdnja": "Vizantija se pomirila sa gubitkom Balkana i nije pokušavala da ga vrati.", "tacno": false, "ispravke": [{"tekst": "Od sredine VII veka vodila je brojne ratove da povrati teritoriju.", "tacan": true}, {"tekst": "Vratila je celu teritoriju već 626, posle pobede kod Carigrada.", "tacan": false, "zasto": "Odbrana Carigrada nije vratila zemlju; sredinom VII veka ta zemlja se zvala Slovenska."}, {"tekst": "Prepustila je Balkan Avarima ugovorom.", "tacan": false, "zasto": "O tome nema reči; carstvo je, naprotiv, ratovalo da povrati izgubljeno."}], "pomoc": ["Seti se koliko je carstvu bio važan Balkan.", "Traži podatak o sredini VII veka.", "Iz lekcije: Vizantija je od sredine VII veka vodila brojne ratove da povrati teritoriju."], "objasnjenje": "Netačno. Od sredine VII veka Vizantija je mnogo ratovala da povrati izgubljene krajeve.", "iz_udzbenika": {"strana": 20, "odeljak": "Odnosi sa susedima i starosedeocima", "tekst": "Vizantija je od sredine VII veka vodila brojne ratove da povrati teritoriju."}, "lekcija": 3}, {"id": "l03-vlasi-dopuni", "vrsta": "dopuni", "tezina": "lako", "pojmovi": ["vlasi", "cincari"], "pitanje": "Dopuni rečenicu.", "tekst": "Vlasi su se povukli u {{planine}} i živeli kao {{stočari}}, a i {{Cincari}} potiču od romanizovanog stanovništva.", "ponudjene": ["planine", "stočari", "Cincari", "gradove", "pomorci", "Avari"], "pomoc": ["Mesto povlačenja je daleko od nizija u koje stižu Sloveni.", "Zanimanje se dobro slaže sa planinom.", "Iz lekcije: povukli su se u planine i živeli kao stočari; i Cincari potiču od romanizovanog stanovništva."], "objasnjenje": "Vlasi su opstali u planinama kao stočari; od romanizovanog stanovništva potiču i Cincari.", "iz_udzbenika": {"strana": 20, "odeljak": "Odnosi sa susedima i starosedeocima", "tekst": "Vlasi su se povukli u planine i živeli kao stočari, a Cincari takođe potiču od romanizovanog stanovništva."}, "lekcija": 3}, {"id": "l03-starosedeoci-sudbina-dopuni", "vrsta": "dopuni", "tezina": "tesko", "pojmovi": ["starosedeoci", "asimilacija"], "pitanje": "Dopuni bez ponuđenih reči.", "tekst": "Starosedeoci su uglavnom bili potisnuti i {{asimilovani}}. Izuzetak je današnja {{Albanija}}, čije stanovništvo svoje poreklo vezuje za antičke {{Ilire}}.", "pomoc": ["Prva praznina je pridev od reči za stapanje naroda.", "Traži zemlju uz Jadran južno od Crne Gore.", "Iz lekcije: potisnuti i asimilovani; izuzetak je Albanija, poreklo od antičkih Ilira."], "objasnjenje": "Stari narodi su se većinom stopili sa Slovenima, a stanovništvo Albanije poreklo vezuje za Ilire.", "iz_udzbenika": {"strana": 20, "odeljak": "Odnosi sa susedima i starosedeocima", "tekst": "Starosedeoci su uglavnom potisnuti i asimilovani; izuzetak je današnja Albanija."}, "lekcija": 3}, {"id": "l03-pojmovi-starosedeoci-povezi", "vrsta": "povezi", "tezina": "srednje", "pojmovi": ["vlasi", "cincari", "varvari", "asimilacija"], "pitanje": "Poveži pojam sa objašnjenjem.", "parovi": [["Vlasi", "Romanizovani Iliri i Tračani, stočari u planinama"], ["Cincari", "Takođe potomci romanizovanog stanovništva"], ["Varvari", "Stranci izvan grčko-rimske kulture"], ["Asimilacija", "Stapanje manjine sa većinskim narodom"], ["Drač i Zadar", "Primorski gradovi sa ostacima rimskog stanovništva"]], "pomoc": ["Dve stavke su potomci romanizovanog stanovništva, a jednu odredi po zanimanju.", "Varvar je pogled iz grčko-rimskog sveta.", "Iz lekcije: Vlasi u planinama, Cincari od romanizovanog stanovništva, varvari van rimskih granica."], "objasnjenje": "Pojmovi opisuju šta se desilo sa starim stanovništvom Balkana kada su došli Sloveni.", "iz_udzbenika": {"strana": 20, "odeljak": "Odnosi sa susedima i starosedeocima", "tekst": "Lekcija objašnjava Vlahe, Cincare, varvare i asimilaciju i navodi primorske gradove sa starim stanovništvom."}, "lekcija": 3}, {"id": "l03-albanija-zakljuci", "vrsta": "zakljuci", "tezina": "srednje", "pojmovi": ["starosedeoci", "asimilacija"], "pitanje": "Zašto se današnja Albanija u lekciji navodi kao izuzetak?", "odgovori": [{"tekst": "Starosedeoci drugde su uglavnom asimilovani, a stanovništvo Albanije poreklo vezuje za antičke Ilire", "tacan": true}, {"tekst": "U Albaniji su živeli Avari", "tacan": false, "zasto": "Avari su bili u Panoniji; u Albaniji se radi o potomcima antičkih Ilira."}, {"tekst": "Sloveni su tamo stigli pre Huna", "tacan": false, "zasto": "Sloveni na Balkan stižu mnogo posle Huna, svuda pa i tamo."}, {"tekst": "Stanovništvo Albanije potiče iz pradomovine Slovena", "tacan": false, "zasto": "Upravo nije tako: ono poreklo vezuje za Ilire, starosedeoce Balkana."}], "pomoc": ["Korak 1: Šta se uglavnom desilo sa starosedeocima?", "Korak 2: Sa kojim antičkim narodom se Albanci povezuju?", "Iz lekcije: izuzetak je Albanija, čije stanovništvo poreklo vezuje za antičke Ilire."], "objasnjenje": "Pravilo je asimilacija starosedelaca, a izuzetak je stanovništvo Albanije, koje poreklo vezuje za Ilire.", "iz_udzbenika": {"strana": 20, "odeljak": "Odnosi sa susedima i starosedeocima", "tekst": "Izuzetak je današnja Albanija, čije stanovništvo poreklo vezuje za antičke Ilire."}, "lekcija": 3}, {"id": "l03-romani-uticaj-zakljuci", "vrsta": "zakljuci", "tezina": "tesko", "pojmovi": ["starosedeoci", "stari-sloveni", "hristijanizacija"], "pitanje": "Šta je opstanak romanskog gradskog stanovništva značio za budući razvoj Slovena?", "odgovori": [{"tekst": "Sloveni su od njih mogli da prime kulturne uticaje, pa i prva znanja o hrišćanstvu", "tacan": true}, {"tekst": "Ništa, jer Sloveni i Romani nisu imali nikakav dodir", "tacan": false, "zasto": "Dodira je bilo: Sloveni su se naselili odmah iza tih gradova, a romansko stanovništvo je kulturno uticalo na njih."}, {"tekst": "Sloveni su zato prešli na romanski jezik i nestali", "tacan": false, "zasto": "Dogodilo se obrnuto: starosedeoci su se uglavnom stopili sa Slovenima."}, {"tekst": "Romani su Slovene odmah proterali iz primorja", "tacan": false, "zasto": "Bili su slabiji: opstali su u nekoliko gradova, a Sloveni su im naselili zaleđe."}], "pomoc": ["Korak 1: Gde su se Sloveni naselili u odnosu na primorske gradove?", "Korak 2: Preko koga su Sloveni prvo upoznali hrišćanstvo?", "Iz lekcije: romansko stanovništvo je kulturno uticalo na Slovene; hrišćanstvo su prvo upoznali preko starosedelaca."], "objasnjenje": "Sloveni su živeli odmah uz stare gradove, pa su od njihovih stanovnika primali kulturu i prve hrišćanske uticaje.", "iz_udzbenika": {"strana": 20, "odeljak": "Odnosi sa susedima i starosedeocima", "tekst": "Ponegde je gradsko romansko stanovništvo opstalo i kulturno uticalo na Slovene."}, "lekcija": 3}, {"id": "l03-napustena-naselja-lanac", "vrsta": "lanac", "tezina": "lako", "pojmovi": ["varvari", "avari", "bugari", "starosedeoci"], "karike": ["Avari, Bugari i Sloveni u VI veku stalno napadaju Balkan", "Život u antičkim naseljima postaje nesiguran", "?"], "praznina": 2, "odgovori": [{"tekst": "Mnoga antička naselja su sasvim napuštena", "tacan": true}, {"tekst": "Antička naselja postaju bogatija nego ikad", "tacan": false, "zasto": "Napadi su donosili pustošenje, a ne bogaćenje; mnoga naselja su ostala prazna."}, {"tekst": "Stanovnici naselja odmah primaju slovensku veru", "tacan": false, "zasto": "Stanovnici su uglavnom bežali ili propadali; o takvom prelasku nema reči."}], "pomoc": ["Korak 1: Kako je živeti u mestu koje stalno pljačkaju?", "Korak 2: Šta ljudi tada rade?", "Iz lekcije: stalni napadi → napuštanje antičkih naselja."], "objasnjenje": "Pod stalnim napadima mnoga antička naselja su sasvim napuštena.", "iz_udzbenika": {"strana": 19, "odeljak": "Odnosi sa susedima i starosedeocima", "tekst": "Pod napadima Avara, Bugara i Slovena u VI veku mnoga antička naselja su sasvim napuštena."}, "lekcija": 3}, {"id": "l03-vlasi-planine-lanac", "vrsta": "lanac", "tezina": "srednje", "pojmovi": ["starosedeoci", "vlasi", "asimilacija"], "karike": ["Sloveni se naseljavaju na Balkan", "Starosedeoci su potisnuti", "?"], "praznina": 2, "odgovori": [{"tekst": "Većina se asimiluje, a Vlasi se povlače u planine kao stočari", "tacan": true}, {"tekst": "Svi starosedeoci odlaze u pradomovinu Slovena", "tacan": false, "zasto": "Pradomovina je slovenska i daleko je; starosedeoci su ostajali na Balkanu."}, {"tekst": "Starosedeoci preuzimaju vlast nad Slovenima", "tacan": false, "zasto": "Bili su potisnuti, pa je vlast ostala kod došljaka; preživeli su kao stočari ili u nekoliko gradova."}], "pomoc": ["Korak 1: Šta može da uradi potisnuti narod: da se stopi ili da se skloni?", "Korak 2: Gde su se sklonili Vlasi?", "Iz lekcije: naseljavanje → potiskivanje i asimilacija; Vlasi u planinama kao stočari."], "objasnjenje": "Potisnuti starosedeoci su se većinom stopili sa Slovenima, a Vlasi su opstali u planinama.", "iz_udzbenika": {"strana": 20, "odeljak": "Odnosi sa susedima i starosedeocima", "tekst": "Starosedeoci su potisnuti i asimilovani, a Vlasi su se povukli u planine i živeli kao stočari."}, "lekcija": 3}, {"id": "l03-gradovi-planine-uporedi", "vrsta": "uporedi", "tezina": "tesko", "pojmovi": ["starosedeoci", "vlasi", "asimilacija"], "a": "Romani u primorskim gradovima", "b": "Vlasi u planinama", "pitanje": "Na koju grupu starog stanovništva se odnosi tvrdnja?", "tvrdnje": [{"tekst": "Opstali su u Draču, Skadru, Trogiru i Zadru.", "odgovor": "a", "zasto": "To su primorski gradovi sa ostacima rimskog stanovništva."}, {"tekst": "Živeli su pretežno kao stočari.", "odgovor": "b", "zasto": "Vlasi su se u planinama bavili stočarstvom."}, {"tekst": "Potiču iz vremena pre dolaska Slovena.", "odgovor": "oba", "zasto": "Obe grupe su staro romanizovano stanovništvo Balkana."}, {"tekst": "Mogli su da kulturno utiču na Slovene iz svojih gradova.", "odgovor": "a", "zasto": "Kulturni uticaj lekcija pripisuje gradskom romanskom stanovništvu."}, {"tekst": "Došli su iz Azije.", "odgovor": "nijedan", "zasto": "Iz Azije su Huni, Avari, Bugari i Mađari; ove grupe su starosedeoci."}], "pomoc": ["Prvo odredi gde koja grupa živi.", "Pazi: obe su starosedeoci.", "Iz lekcije: Romani u primorskim gradovima, Vlasi u planinama kao stočari."], "objasnjenje": "Starosedeoci su preživeli na dva načina: iza gradskih zidina uz more ili povlačenjem u planine.", "iz_udzbenika": {"strana": 20, "odeljak": "Odnosi sa susedima i starosedeocima", "tekst": "Rimsko stanovništvo opstalo je u primorskim gradovima, a Vlasi su se povukli u planine."}, "lekcija": 3}, {"id": "l03-vlasi-ko-sam", "vrsta": "ko_sam", "tezina": "lako", "pojmovi": ["vlasi", "starosedeoci"], "tragovi": ["Potomci smo Ilira i Tračana koji su primili rimsku kulturu.", "Ime su nam dali Sloveni.", "Pred došljacima smo se povukli u planine i živeli kao stočari."], "odgovori": [{"tekst": "Vlasi", "tacan": true}, {"tekst": "Avari", "tacan": false, "zasto": "Avari su azijski došljaci, a ne romanizovani starosedeoci."}, {"tekst": "Anti", "tacan": false, "zasto": "Anti su srodnici Slovena koje opisuje vizantijski izvor, a ne romanizovani Iliri i Tračani."}], "objasnjenje": "To su Vlasi, romanizovani Iliri i Tračani koji su opstali kao planinski stočari.", "iz_udzbenika": {"strana": 20, "odeljak": "Odnosi sa susedima i starosedeocima", "tekst": "Sloveni su Vlasima zvali romanizovane Ilire i Tračane."}, "lekcija": 3}, {"id": "l03-sudbina-starosedelaca-objasni", "vrsta": "objasni", "tezina": "srednje", "pojmovi": ["starosedeoci", "asimilacija", "vlasi"], "pitanje": "Šta se dogodilo sa starim stanovništvom Balkana posle dolaska Slovena? Objasni.", "uzor": "Starosedeoci su uglavnom potisnuti i asimilovani, odnosno stopili su se sa Slovenima. Deo je opstao u primorskim gradovima, poput Drača i Zadra, a Vlasi su se povukli u planine i živeli kao stočari. Izuzetak je današnja Albanija.", "ideje": ["Većina je potisnuta i asimilovana.", "Deo opstaje u primorskim gradovima.", "Vlasi se povlače u planine i žive kao stočari.", "Albanija je izuzetak."], "objasnjenje": "Odgovor treba da pokaže i pravilo (asimilacija) i načine opstanka.", "iz_udzbenika": {"strana": 20, "odeljak": "Odnosi sa susedima i starosedeocima", "tekst": "Starosedeoci su uglavnom potisnuti i asimilovani, uz primorske gradove, Vlahe i Albaniju kao izuzetke."}, "lekcija": 3}, {"id": "l03-vlasi-stocari-zakljuci", "vrsta": "zakljuci", "tezina": "lako", "pojmovi": ["vlasi", "starosedeoci"], "pitanje": "Zašto su Vlasi živeli baš kao stočari?", "odgovori": [{"tekst": "Povukli su se u planine, gde je stočarstvo prirodno zanimanje", "tacan": true}, {"tekst": "Bili su pomorci koji su čuvali stoku na brodovima", "tacan": false, "zasto": "Vlasi nisu vezani za more; romansko stanovništvo u primorju živelo je po gradovima."}, {"tekst": "Car im je zabranio da žive u planinama", "tacan": false, "zasto": "Upravo u planinama su živeli, povukavši se pred došljacima."}, {"tekst": "Doneli su stoku iz Azije", "tacan": false, "zasto": "Vlasi nisu došli iz Azije; to su romanizovani Iliri i Tračani sa Balkana."}], "pomoc": ["Korak 1: Kuda su se povukli?", "Korak 2: Šta se na takvom tlu može raditi?", "Iz lekcije: povukli su se u planine i živeli kao stočari."], "objasnjenje": "Planina daje pašnjake, a ne njive i gradove, pa je potisnuto stanovništvo živelo od stoke.", "iz_udzbenika": {"strana": 20, "odeljak": "Odnosi sa susedima i starosedeocima", "tekst": "Vlasi su se povukli u planine i živeli kao stočari."}, "lekcija": 3}]}, {"naslov": "3. Plemenski savezi", "zadaci": [{"id": "l03-sklavinije-izbor", "vrsta": "izbor", "tezina": "lako", "pojmovi": ["sklavinije", "vizantija"], "pitanje": "Šta su sklavinije?", "odgovori": [{"tekst": "Plemenske oblasti Slovena na Balkanu, kako su ih zvali Vizantinci", "tacan": true}, {"tekst": "Vizantijski primorski gradovi", "tacan": false, "zasto": "Gradovi kao Drač i Zadar nisu bili sklavinije; to su oblasti koje drže slovenska plemena."}, {"tekst": "Slovenski bogovi", "tacan": false, "zasto": "Bogovi su Perun, Svetovid i Dažbog; sklavinije su oblasti."}, {"tekst": "Zemlje slovenske pradomovine", "tacan": false, "zasto": "Pradomovina je između Odre i Visle, a sklavinije su na Balkanu."}], "pomoc": ["Naziv sadrži podsetnik na reč Sloveni.", "Naziv potiče od vizantijskih pisaca.", "Iz lekcije: Vizantinci su slovenske plemenske oblasti nazivali sklavinije."], "objasnjenje": "Sklavinije su plemenske oblasti Slovena na Balkanu; naziv su koristili Vizantinci.", "iz_udzbenika": {"strana": 20, "odeljak": "Plemenski savezi", "tekst": "Vizantinci su slovenske plemenske oblasti nazivali sklavinije."}, "lekcija": 3}, {"id": "l03-srpski-savezi-izbor", "vrsta": "izbor", "tezina": "lako", "pojmovi": ["plemenski-savezi", "raska", "duklja"], "pitanje": "U kojim oblastima su nastali najvažniji srpski plemenski savezi?", "odgovori": [{"tekst": "U Raškoj i Duklji", "tacan": true}, {"tekst": "U Trakiji i Tesaliji", "tacan": false, "zasto": "To su vizantijske oblasti do kojih su stizali pljačkaški upadi, a ne središta srpskih saveza."}, {"tekst": "U Panoniji i Moravskoj", "tacan": false, "zasto": "Panonija je vezana za Avare i Mađare, a Moravska za misiju Ćirila i Metodija."}, {"tekst": "U Dalmaciji i Karantaniji", "tacan": false, "zasto": "Dalmatinski gradovi i Karantanski Sloveni pominju se uz pokrštavanje, a ne kao srpski savezi."}], "pomoc": ["Obe oblasti imaće kasnije prve srpske države.", "Jedna od njih izlazi na Jadran.", "Iz lekcije: najvažniji su u Raškoj i u Duklji."], "objasnjenje": "Najvažniji srpski savezi nastali su u Raškoj i Duklji.", "iz_udzbenika": {"strana": 20, "odeljak": "Plemenski savezi", "tekst": "Srpski savezi nastali su u nekoliko oblasti, a najvažniji su u Raškoj i Duklji."}, "lekcija": 3}, {"id": "l03-ratovi-na-zapadu-izbor", "vrsta": "izbor", "tezina": "srednje", "pojmovi": ["plemenski-savezi", "vizantija"], "pitanje": "Sa kojim protivnicima na zapadu su ratovali Sloveni, što je ubrzalo stvaranje saveza? (više tačnih)", "odgovori": [{"tekst": "Langobardi", "tacan": true}, {"tekst": "Bavari", "tacan": true}, {"tekst": "Franci", "tacan": true}, {"tekst": "Huni", "tacan": false, "zasto": "Huni su Slovene pokrenuli još u IV veku; savezi se vežu za kasnije ratove."}, {"tekst": "Vizantija", "tacan": false, "zasto": "Vizantija je zaista bila protivnik, ali na istoku, a pitanje traži zapad."}], "pomoc": ["Vizantija je na istoku, pa je ovde ne traži.", "Tačni odgovori su tri germanska naroda iz srednje Evrope.", "Iz lekcije: Langobardi, Bavari i Franci na zapadu."], "objasnjenje": "Ratovi sa Vizantijom na istoku i sa Langobardima, Bavarima i Francima na zapadu ubrzali su stvaranje saveza.", "iz_udzbenika": {"strana": 20, "odeljak": "Plemenski savezi", "tekst": "Ratovi sa Vizantijom na istoku i sa Langobardima, Bavarima i Francima na zapadu ubrzali su stvaranje saveza."}, "lekcija": 3}, {"id": "l03-nestabilni-savezi-tn", "vrsta": "tacno_netacno", "tezina": "lako", "pojmovi": ["plemenski-savezi"], "tvrdnja": "Slovenski plemenski savezi bili su nestabilni: brzo su nastajali i brzo se raspadali.", "tacno": true, "pomoc": ["Seti se zašto su nastali: zbog rata.", "Iz lekcije: bili su nestabilni, brzo su nastajali i brzo se raspadali."], "objasnjenje": "Tačno. Savezi su bili povezani potrebom rata, pa nisu bili trajni.", "iz_udzbenika": {"strana": 20, "odeljak": "Plemenski savezi", "tekst": "Savezi su bili nestabilni: brzo su nastajali i brzo se raspadali."}, "lekcija": 3}, {"id": "l03-sklavinije-srpski-naziv-tn", "vrsta": "tacno_netacno", "tezina": "srednje", "pojmovi": ["sklavinije", "stari-sloveni"], "tvrdnja": "Naziv sklavinije smislili su sami Sloveni za svoje države.", "tacno": false, "ispravke": [{"tekst": "Tako su slovenske plemenske oblasti nazivali Vizantinci.", "tacan": true}, {"tekst": "Tako su ih nazivali Avari, njihovi gospodari.", "tacan": false, "zasto": "Lekcija naziv vezuje za Vizantince, čiji pisci su i zabeležili te vesti."}, {"tekst": "To je naziv za pravu državu sa jakom vlašću.", "tacan": false, "zasto": "Sklavinije su plemenske oblasti, a ne razvijene države."}], "pomoc": ["Ko je o Slovenima tada pisao?", "Sloveni tada nisu imali pismo.", "Iz lekcije: Vizantinci su te oblasti nazivali sklavinije."], "objasnjenje": "Netačno. To je vizantijski naziv, pogled sa strane na plemenske oblasti Slovena.", "iz_udzbenika": {"strana": 20, "odeljak": "Plemenski savezi", "tekst": "Vizantinci su plemenske oblasti Slovena nazivali sklavinije."}, "lekcija": 3}, {"id": "l03-savezi-dopuni", "vrsta": "dopuni", "tezina": "lako", "pojmovi": ["plemenski-savezi", "raska", "sklavinije"], "pitanje": "Dopuni rečenicu.", "tekst": "Najvažniji srpski plemenski savez bio je u {{Raškoj}}, a slovenske plemenske oblasti Vizantinci su zvali {{sklavinije}}.", "ponudjene": ["Raškoj", "Panoniji", "sklavinije", "Slovenska"], "pomoc": ["Panonija je dom Avara, pa je to pogrešna oblast.", "Slovenska je naziv jedne zemlje, a ne više oblasti.", "Iz lekcije: najvažniji srpski savez je u Raškoj; oblasti se zovu sklavinije."], "objasnjenje": "Raška je najvažniji srpski savez, a sklavinije su vizantijski naziv za slovenske plemenske oblasti.", "iz_udzbenika": {"strana": 22, "odeljak": "Zapamtite", "tekst": "Rano nastaju plemenski savezi; najvažniji srpski je u Raškoj."}, "lekcija": 3}, {"id": "l03-rat-savezi-povezi", "vrsta": "povezi", "tezina": "srednje", "pojmovi": ["plemenski-savezi", "sklavinije", "raska", "duklja"], "pitanje": "Poveži pojam sa onim što ga određuje.", "parovi": [["Raška", "Savez oko reka Pive, Tare i Ibra"], ["Duklja", "Savez između Pive, Tare i Jadranskog mora"], ["Sklavinije", "Vizantijski naziv za slovenske plemenske oblasti"], ["Ratovi na istoku i zapadu", "Ubrzano stvaranje saveza"]], "pomoc": ["Samo jedna od oblasti dopire do mora.", "Poslednji par je uzrok i posledica.", "Iz lekcije: Duklja između Pive, Tare i Jadranskog mora; ratovi su ubrzali stvaranje saveza."], "objasnjenje": "Raška je u unutrašnjosti, a Duklja izlazi na Jadran; savezi nastaju pod pritiskom ratova.", "iz_udzbenika": {"strana": 20, "odeljak": "Plemenski savezi", "tekst": "Najvažniji srpski savezi su u Raškoj i Duklji; ratovi su ubrzali njihovo stvaranje."}, "lekcija": 3}, {"id": "l03-zasto-rat-stvara-saveze-zakljuci", "vrsta": "zakljuci", "tezina": "tesko", "pojmovi": ["plemenski-savezi", "vizantija"], "pitanje": "Zašto su baš ratovi ubrzali povezivanje plemena, a ne, recimo, mirno doba?", "odgovori": [{"tekst": "Pojedinačno pleme ne može da se odupre jakom protivniku, pa se plemena udružuju zbog odbrane", "tacan": true}, {"tekst": "Vizantija je naredila plemenima da se udruže", "tacan": false, "zasto": "Vizantija je bila protivnik, a savez je nastajao upravo protiv takvih neprijatelja."}, {"tekst": "Ratovi su uništili sva plemena, pa su ostali samo savezi", "tacan": false, "zasto": "Plemena su i dalje postojala; savez ih je povezivao, a nije ih zamenio."}, {"tekst": "Savezi su nastali zbog zajedničke hrišćanske vere", "tacan": false, "zasto": "Savezi nastaju pre učvršćivanja hrišćanstva u IX veku; razlog je bio rat."}], "pomoc": ["Korak 1: Koliko je jedno pleme jako prema Vizantiji ili Francima?", "Korak 2: Šta plemena dobijaju udruživanjem?", "Iz lekcije: ratovi sa Vizantijom, Langobardima, Bavarima i Francima ubrzali su stvaranje saveza."], "objasnjenje": "Zajednička opasnost tera slabije da se udruže. Zato su savezi vezani za rat i zato se raspadaju kad opasnost prođe.", "iz_udzbenika": {"strana": 20, "odeljak": "Plemenski savezi", "tekst": "Ratovi na istoku i zapadu ubrzali su stvaranje slovenskih saveza, koji su bili nestabilni."}, "lekcija": 3}, {"id": "l03-savezi-lanac", "vrsta": "lanac", "tezina": "srednje", "pojmovi": ["plemenski-savezi", "raska", "duklja"], "karike": ["Ratovi sa Vizantijom, Langobardima, Bavarima i Francima", "?", "Kod Srba se isti ističu Raška i Duklja"], "praznina": 1, "odgovori": [{"tekst": "Nastaju slovenski plemenski savezi", "tacan": true}, {"tekst": "Sloveni odlaze iz Balkana", "tacan": false, "zasto": "Ostaju i organizuju se; da su otišli, ne bi nastale Raška i Duklja."}, {"tekst": "Nastaje Velikomoravska kneževina", "tacan": false, "zasto": "Ona je u srednjoj Evropi i ne objašnjava srpske oblasti Rašku i Duklju."}], "pomoc": ["Korak 1: Šta plemena rade u ratu sa jakim protivnikom?", "Korak 2: Kako se zovu tvorevine u Raškoj i Duklji?", "Iz lekcije: ratovi → plemenski savezi; najvažniji srpski su u Raškoj i Duklji."], "objasnjenje": "Ratovi su povezali plemena u saveze, a kod Srba su najvažniji raški i dukljanski.", "iz_udzbenika": {"strana": 20, "odeljak": "Plemenski savezi", "tekst": "Ratovi su ubrzali stvaranje saveza; srpski nastaju u nekoliko oblasti, najvažniji u Raškoj i Duklji."}, "lekcija": 3}, {"id": "l03-raska-duklja-uporedi", "vrsta": "uporedi", "tezina": "srednje", "pojmovi": ["raska", "duklja", "plemenski-savezi"], "a": "Raška", "b": "Duklja", "pitanje": "Na koji savez se odnosi tvrdnja?", "tvrdnje": [{"tekst": "Prostire se do Jadranskog mora.", "odgovor": "b", "zasto": "Duklja je između Pive, Tare i Jadrana; Raška je u unutrašnjosti."}, {"tekst": "Među rekama koje je omeđuju je Ibar.", "odgovor": "a", "zasto": "Ibar se navodi kod Raške."}, {"tekst": "Njene granice lekcija vezuje za Pivu i Taru.", "odgovor": "oba", "zasto": "Piva i Tara se navode kod oba saveza."}, {"tekst": "Lekcija ga naziva najvažnijim srpskim savezom.", "odgovor": "a", "zasto": "Rezime izričito navodi Rašku."}, {"tekst": "Nastao je u Panonskoj niziji.", "odgovor": "nijedan", "zasto": "Oba su na Balkanu; Panonija je oblast Avara, a kasnije Mađara."}], "pomoc": ["Pogledaj koji savez izlazi na more.", "Dve reke su zajedničke.", "Iz lekcije: Duklja između Pive, Tare i Jadrana; najvažniji srpski savez je u Raškoj."], "objasnjenje": "Oba saveza dotiču Pivu i Taru, ali Duklja izlazi na more, a Raška je najvažnija.", "iz_udzbenika": {"strana": 20, "odeljak": "Plemenski savezi", "tekst": "Najvažniji srpski savezi su u Raškoj i u Duklji, između Pive, Tare i Jadranskog mora."}, "lekcija": 3}, {"id": "l03-sklavinije-objasni", "vrsta": "objasni", "tezina": "lako", "pojmovi": ["sklavinije", "plemenski-savezi"], "pitanje": "Objasni pojam sklavinije svojim rečima.", "uzor": "Sklavinije su plemenske oblasti Slovena na Balkanu. Taj naziv su im dali Vizantinci. Time su označavali krajeve kojima vladaju slovenska plemena, a ne carstvo.", "ideje": ["To su plemenske oblasti Slovena.", "Nalaze se na Balkanu.", "Naziv potiče od Vizantinaca."], "objasnjenje": "Dobar odgovor kaže šta je pojam, gde je i ko ga je koristio.", "iz_udzbenika": {"strana": 22, "odeljak": "Pitanja za razmišljanje / Zadaci iz udžbenika", "tekst": "Udžbenik traži da objasniš pojam sklavinije."}, "lekcija": 3}, {"id": "l03-savez-i-drzava-objasni", "vrsta": "objasni", "tezina": "tesko", "pojmovi": ["plemenski-savezi", "raska", "duklja"], "pitanje": "Lekcija kaže da su plemenski savezi bili nestabilni. Zašto su ipak važni za srpsku istoriju? Objasni.", "uzor": "Savezi su brzo nastajali i brzo se raspadali, ali su plemena u njima učila da rade zajedno protiv spoljnih protivnika. Oblasti gde su se savezi ustalili, pre svega Raška i Duklja, postale su temelj kasnijih srpskih država. Zato su važan korak od plemena ka državi.", "ideje": ["Savezi povezuju plemena protiv zajedničkih protivnika.", "Bili su nestabilni i nisu još prava država.", "Raška i Duklja kasnije su središta srpskih država."], "objasnjenje": "Nestabilan početak ipak je most između plemena i države.", "iz_udzbenika": {"strana": 20, "odeljak": "Plemenski savezi", "tekst": "Slovenski savezi bili su nestabilni, a najvažniji srpski bili su u Raškoj i Duklji."}, "lekcija": 3}]}, {"naslov": "3. Doseljavanje Bugara i Mađara", "zadaci": [{"id": "l03-asparuh-izbor", "vrsta": "izbor", "tezina": "lako", "pojmovi": ["asparuh", "bugari", "kan"], "pitanje": "Ko je doveo Bugare na Balkan?", "odgovori": [{"tekst": "Kan Asparuh", "tacan": true}, {"tekst": "Oton I", "tacan": false, "zasto": "Oton I je nemački vladar koji je pobedio Mađare 955."}, {"tekst": "Knez Rastislav", "tacan": false, "zasto": "Rastislav je knez Velikomoravske kneževine, koji je pozvao Ćirila i Metodija."}, {"tekst": "Car Iraklije", "tacan": false, "zasto": "Iraklije je vizantijski car, a ne vođa Bugara."}], "pomoc": ["Titula mu je kan.", "To je najpoznatiji bugarski vođa iz ovog doba.", "Iz lekcije: kan Asparuh ih je doveo na Balkan."], "objasnjenje": "Najpoznatiji bugarski vođa je kan Asparuh, koji ih je doveo na Balkan.", "iz_udzbenika": {"strana": 20, "odeljak": "Doseljavanje Bugara i Mađara", "tekst": "Najpoznatiji vođa Bugara je kan Asparuh, koji ih je doveo na Balkan."}, "lekcija": 3}, {"id": "l03-odakle-su-izbor", "vrsta": "izbor", "tezina": "lako", "pojmovi": ["bugari", "madjari"], "pitanje": "Odakle potiču i Bugari i Mađari?", "odgovori": [{"tekst": "Iz Azije", "tacan": true}, {"tekst": "Iz slovenske pradomovine", "tacan": false, "zasto": "Tamo su živeli Sloveni; Bugari i Mađari su azijski narodi."}, {"tekst": "Iz Franačke", "tacan": false, "zasto": "Franačka je zapadni hrišćanski sused Slovena, a ne postojbina ovih naroda."}, {"tekst": "Iz Italije", "tacan": false, "zasto": "Lekcija oba naroda izvodi iz Azije, kao i Hune i Avare."}], "pomoc": ["Isto poreklo imaju Huni i Avari.", "To je kontinent istočno od Urala.", "Iz lekcije: Bugari su azijsko pleme, a Mađari grupa plemena takođe iz Azije."], "objasnjenje": "I Bugari i Mađari došli su iz Azije.", "iz_udzbenika": {"strana": 20, "odeljak": "Doseljavanje Bugara i Mađara", "tekst": "Bugari su azijsko pleme, a Mađari grupa plemena takođe iz Azije."}, "lekcija": 3}, {"id": "l03-oton-leh-izbor", "vrsta": "izbor", "tezina": "srednje", "pojmovi": ["oton-i", "leh", "madjari"], "pitanje": "Gde je Oton I 955. porazio Mađare?", "odgovori": [{"tekst": "Na reci Leh kod Augzburga", "tacan": true}, {"tekst": "Kod Carigrada", "tacan": false, "zasto": "Carigrad je vizantijska prestonica, a sukob je bio u današnjoj Nemačkoj."}, {"tekst": "Na Dunavu kod Soluna", "tacan": false, "zasto": "Solun nije na Dunavu, a bitka je vođena u današnjoj Nemačkoj."}, {"tekst": "U Trakiji", "tacan": false, "zasto": "Trakija je na Balkanu; Mađari su zaustavljeni na zapadu, u Nemačkoj."}], "pomoc": ["Bitka je bila na tlu današnje Nemačke.", "Grad se zove Augzburg.", "Iz lekcije: Oton I ih je 955. porazio na reci Leh kod Augzburga."], "objasnjenje": "Bitka na reci Leh kod Augzburga, u današnjoj Nemačkoj, zaustavila je mađarski prodor na zapad.", "iz_udzbenika": {"strana": 20, "odeljak": "Doseljavanje Bugara i Mađara", "tekst": "Nemački vladar Oton I porazio je Mađare 955. na reci Leh kod Augzburga."}, "osa": {"naziv": "Bitka na reci Leh", "od": 955, "traka": "dogadjaji"}, "lekcija": 3}, {"id": "l03-kan-tn", "vrsta": "tacno_netacno", "tezina": "lako", "pojmovi": ["kan"], "tvrdnja": "Kan je vladarska titula kod plemena srednje Azije.", "tacno": true, "pomoc": ["Nosio ju je Asparuh.", "Iz lekcije: kan je vladarska titula kod plemena srednje Azije."], "objasnjenje": "Tačno. Asparuh je zato kan, a ne knez ili car.", "iz_udzbenika": {"strana": 20, "odeljak": "Doseljavanje Bugara i Mađara", "tekst": "Kan je vladarska titula kod plemena srednje Azije."}, "lekcija": 3}, {"id": "l03-bugari-brisu-tn", "vrsta": "tacno_netacno", "tezina": "srednje", "pojmovi": ["bugari", "stari-sloveni", "asimilacija"], "tvrdnja": "Bugari su izbrisali Slovene između Dunava i planine Balkan i naselili se umesto njih.", "tacno": false, "ispravke": [{"tekst": "Sami su se asimilovali među Slovenima, a Sloveni su preuzeli ime Bugari.", "tacan": true}, {"tekst": "Sloveni su pobegli u Rašku, pa je oblast ostala prazna.", "tacan": false, "zasto": "Sloveni su ostali na svojoj zemlji; došljaci su se upravo među njima izgubili."}, {"tekst": "Bugari i Sloveni su živeli odvojeno i nikada se nisu mešali.", "tacan": false, "zasto": "Mešali su se toliko da je od azijskih Bugara ostalo samo ime."}], "pomoc": ["Ko je bio brojniji: došljaci ili Sloveni?", "Seti se šta je asimilacija.", "Iz lekcije: Slovene nisu izbrisali, nego su se sami u njima asimilovali."], "objasnjenje": "Netačno. Bugari su se stopili sa Slovenima, a narod je zadržao bugarsko ime.", "iz_udzbenika": {"strana": 20, "odeljak": "Doseljavanje Bugara i Mađara", "tekst": "Bugari Slovene nisu izbrisali, nego su se sami u njima asimilovali, a Sloveni su preuzeli ime Bugari."}, "lekcija": 3}, {"id": "l03-put-bugara-dopuni", "vrsta": "dopuni", "tezina": "lako", "pojmovi": ["bugari", "asparuh"], "pitanje": "Dopuni rečenicu o Bugarima.", "tekst": "Bugari su prešli {{Dunav}}, ušli u Gornju {{Meziju}} i stigli do planine {{Balkan}}.", "ponudjene": ["Dunav", "Meziju", "Balkan", "Visla", "Trakiju", "Ural"], "pomoc": ["Prva reka je vizantijska granica.", "Treća reč je ista kao naziv poluostrva.", "Iz lekcije: prešli su Dunav, ušli u Gornju Meziju i stigli do planine Balkan."], "objasnjenje": "Bugari su preko Dunava i Gornje Mezije došli do planine Balkan.", "iz_udzbenika": {"strana": 20, "odeljak": "Doseljavanje Bugara i Mađara", "tekst": "Bugari su prešli Dunav, ušli u Gornju Meziju i stigli do planine Balkan."}, "lekcija": 3}, {"id": "l03-madjari-dopuni", "vrsta": "dopuni", "tezina": "srednje", "pojmovi": ["madjari", "velikomoravska-knezevina"], "pitanje": "Dopuni rečenice o Mađarima.", "tekst": "Mađari se krajem {{IX}} veka nastanjuju u {{Panonskoj}} niziji, početkom X veka pokoravaju {{Velikomoravsku}} kneževinu, a u {{XI}} veku primaju hrišćanstvo.", "ponudjene": ["IX", "XI", "VI", "Panonskoj", "Velikomoravsku", "Solunsku"], "pomoc": ["VI vek je doba Avara, ne Mađara.", "Isprva dolaze u nizijsku oblast oko srednjeg Dunava.", "Iz lekcije: kraj IX veka Panonska nizija, početak X veka Velikomoravska, XI vek hrišćanstvo."], "objasnjenje": "Mađarski put: Panonija (kraj IX veka) → Velikomoravska (početak X veka) → hrišćanstvo (XI vek).", "iz_udzbenika": {"strana": 20, "odeljak": "Doseljavanje Bugara i Mađara", "tekst": "Krajem IX veka Mađari se nastanjuju u Panoniji, početkom X veka pokorena je Velikomoravska, a u XI veku primaju hrišćanstvo."}, "lekcija": 3}, {"id": "l03-bugari-madjari-povezi", "vrsta": "povezi", "tezina": "lako", "pojmovi": ["bugari", "madjari", "oton-i", "asparuh"], "pitanje": "Poveži ličnost ili narod sa podatkom.", "parovi": [["Asparuh", "Kan koji je doveo Bugare na Balkan"], ["Oton I", "Pobednik nad Mađarima 955."], ["Mađari", "Hrišćanstvo primaju u XI veku"], ["Bugari", "Stopili su se sa Slovenima, kojima su ostavili ime"]], "pomoc": ["Dva vladara su različitih naroda i različitih vekova.", "Seti se šta je Bugarima donela asimilacija.", "Iz lekcije: kan Asparuh, Oton I 955, Mađari u XI veku, Bugari asimilovani u Slovenima."], "objasnjenje": "Asparuh predvodi Bugare, Oton I zaustavlja Mađare, a oba naroda snažno utiču na Podunavlje i Balkan.", "iz_udzbenika": {"strana": 20, "odeljak": "Doseljavanje Bugara i Mađara", "tekst": "Lekcija navodi kana Asparuha, asimilaciju Bugara, Otona I i primanje hrišćanstva kod Mađara."}, "lekcija": 3}, {"id": "l03-ime-bugari-zakljuci", "vrsta": "zakljuci", "tezina": "srednje", "pojmovi": ["bugari", "asimilacija", "stari-sloveni"], "pitanje": "Zašto je ime „Bugari” preživelo, a azijsko pleme Bugara nestalo?", "odgovori": [{"tekst": "Došljaci su se stopili sa brojnijim Slovenima, ali su Sloveni preuzeli njihovo ime", "tacan": true}, {"tekst": "Bugari su pobili sve Slovene", "tacan": false, "zasto": "Baš suprotno: Slovene nisu izbrisali, nego su se sami u njima asimilovali."}, {"tekst": "Sloveni su se odselili, a ime je ostalo na zemlji", "tacan": false, "zasto": "Sloveni nisu otišli; ime je ostalo jer su ga oni preuzeli."}, {"tekst": "Vizantija je zabranila slovensko ime", "tacan": false, "zasto": "O tome nema podataka; promena imena posledica je mešanja dva naroda."}], "pomoc": ["Korak 1: Ko se u koga asimilovao?", "Korak 2: Šta su Sloveni preuzeli od došljaka?", "Iz lekcije: sami su se asimilovali u Slovenima, a Sloveni su preuzeli ime Bugari."], "objasnjenje": "Bugarski narod je po poreklu mahom slovenski, a ime je dobio od azijskih došljaka koji su se u njemu izgubili.", "iz_udzbenika": {"strana": 20, "odeljak": "Doseljavanje Bugara i Mađara", "tekst": "Bugari su se asimilovali među Slovenima, a Sloveni su preuzeli ime Bugari."}, "lekcija": 3}, {"id": "l03-leh-znacaj-zakljuci", "vrsta": "zakljuci", "tezina": "tesko", "pojmovi": ["leh", "oton-i", "madjari"], "pitanje": "Mađari su posle poraza na Lehu ostali u Panoniji. Šta je, onda, stvarni značaj te bitke?", "odgovori": [{"tekst": "Zaustavljeni su njihovi upadi na zapad, pa su se ustalili u Panoniji", "tacan": true}, {"tekst": "Mađari su tada istrebljeni", "tacan": false, "zasto": "Nisu nestali: u XI veku primaju hrišćanstvo i dalje snažno utiču na Podunavlje."}, {"tekst": "Oton I je osvojio Panoniju", "tacan": false, "zasto": "Oton I je zaustavio prodor, a Panonija je ostala mađarska."}, {"tekst": "Mađari su se vratili u Aziju", "tacan": false, "zasto": "Ostali su u Panonskoj niziji i tamo primili hrišćanstvo."}], "pomoc": ["Korak 1: Šta su Mađari radili iz Panonije pre 955?", "Korak 2: Šta se tu promenilo posle poraza?", "Iz lekcije: poraz na Lehu → kraj mađarskog prodora na zapad."], "objasnjenje": "Pobeda nije uništila Mađare, ali je prekinula njihove upade u zapadnu Evropu.", "iz_udzbenika": {"strana": 20, "odeljak": "Doseljavanje Bugara i Mađara", "tekst": "Porazom na Lehu 955. zaustavljen je prodor Mađara na zapad; ostali su u Panoniji i u XI veku primili hrišćanstvo."}, "osa": {"naziv": "Bitka na reci Leh", "od": 955, "traka": "dogadjaji"}, "lekcija": 3}, {"id": "l03-leh-datum", "vrsta": "datum", "tezina": "srednje", "pojmovi": ["leh", "oton-i", "madjari"], "dogadjaj": "Bitka na reci Leh", "pitanje": "Koje godine je Oton I porazio Mađare na reci Leh?", "godina": 955, "traka": "dogadjaji", "pomoc": ["To je X vek, njegova sredina.", "Godina ima tri cifre i završava se sa 55.", "Iz lekcije: 955."], "objasnjenje": "Godine 955. Oton I je kod Augzburga zaustavio prodor Mađara na zapad.", "iz_udzbenika": {"strana": 20, "odeljak": "Doseljavanje Bugara i Mađara", "tekst": "Oton I je Mađare porazio 955. na reci Leh kod Augzburga."}, "lekcija": 3}, {"id": "l03-madjari-poredjaj", "vrsta": "poredjaj", "tezina": "tesko", "pojmovi": ["madjari", "velikomoravska-knezevina", "leh"], "pitanje": "Poređaj korake mađarske istorije, od najranijeg.", "stavke": [{"tekst": "Mađari stižu u Panonsku niziju", "godina": 890, "oznaka": "kraj IX veka", "naziv": "Mađari stižu u Panonsku niziju", "traka": "dogadjaji"}, {"tekst": "Pokorena je Velikomoravska kneževina", "godina": 905, "oznaka": "početak X veka", "naziv": "Pokorena Velikomoravska kneževina", "traka": "dogadjaji"}, {"tekst": "Poraz na reci Leh", "godina": 955, "naziv": "Bitka na reci Leh", "traka": "dogadjaji"}, {"tekst": "Mađari primaju hrišćanstvo", "godina": 1000, "do": 1100, "oznaka": "XI vek", "naziv": "Mađari primaju hrišćanstvo", "traka": "crkva-kultura"}], "pomoc": ["Prvo se negde mora doći, pa se tek onda pokorava sused.", "Hrišćanstvo je poslednji korak, posle bitke.", "Iz lekcije: kraj IX veka, početak X veka, 955, XI vek."], "objasnjenje": "Dolazak (kraj IX veka) → Velikomoravska (početak X veka) → Leh (955) → hrišćanstvo (XI vek).", "iz_udzbenika": {"strana": 20, "odeljak": "Doseljavanje Bugara i Mađara", "tekst": "Mađari su krajem IX veka u Panoniji, početkom X veka pokoravaju Velikomoravsku, 955. su poraženi, a u XI veku primaju hrišćanstvo."}, "lekcija": 3}, {"id": "l03-leh-lanac", "vrsta": "lanac", "tezina": "lako", "pojmovi": ["madjari", "oton-i", "leh"], "karike": ["Mađari iz Panonije upadaju u susedne zemlje", "Oton I ih pobeđuje na reci Leh", "?"], "praznina": 2, "odgovori": [{"tekst": "Zaustavljen je njihov prodor na zapad", "tacan": true}, {"tekst": "Mađari osvajaju Nemačku", "tacan": false, "zasto": "Bili su poraženi, pa je nemački vladar zaustavio njihov prodor."}, {"tekst": "Počinje Velika seoba naroda", "tacan": false, "zasto": "Seoba počinje 375, a Leh je 955."}], "pomoc": ["Korak 1: Ko je pobedio?", "Korak 2: Šta poraz znači za dalje upade?", "Iz lekcije: poraz na Lehu 955 → kraj mađarskog prodora u zapadnu Evropu."], "objasnjenje": "Pobeda Otona I prekinula je upade Mađara na zapad.", "iz_udzbenika": {"strana": 20, "odeljak": "Doseljavanje Bugara i Mađara", "tekst": "Oton I je porazio Mađare 955, čime je zaustavljen prodor na zapad."}, "osa": {"naziv": "Bitka na reci Leh", "od": 955, "traka": "dogadjaji"}, "lekcija": 3}, {"id": "l03-bugari-lanac", "vrsta": "lanac", "tezina": "tesko", "pojmovi": ["bugari", "asparuh", "vizantija", "asimilacija"], "karike": ["Asparuh dovodi Bugare preko Dunava do planine Balkan", "?", "Vizantija je u stalnim sukobima sa novim susedom"], "praznina": 1, "odgovori": [{"tekst": "Bugari zauzimaju krajeve koje carstvo pokušava da povrati", "tacan": true}, {"tekst": "Bugari predaju zemlju Vizantiji", "tacan": false, "zasto": "Da su je predali, ne bi bilo sukoba; lekcija beleži brojne sukobe."}, {"tekst": "Bugari se vraćaju preko Dunava", "tacan": false, "zasto": "Ostali su i stopili se sa Slovenima."}], "pomoc": ["Korak 1: Čija je to bila zemlja pre dolaska Bugara?", "Korak 2: Šta Vizantija od sredine VII veka pokušava da uradi?", "Iz lekcije: Asparuh ih je doveo na Balkan; usledili su brojni sukobi sa Vizantijom."], "objasnjenje": "Bugari se smeštaju na zemlju koju Vizantija hoće da vrati, pa su sukobi neizbežni.", "iz_udzbenika": {"strana": 20, "odeljak": "Doseljavanje Bugara i Mađara", "tekst": "Kan Asparuh doveo je Bugare na Balkan, a usledili su brojni sukobi sa Vizantijom."}, "lekcija": 3}, {"id": "l03-bugari-i-madjari-uporedi", "vrsta": "uporedi", "tezina": "srednje", "pojmovi": ["bugari", "madjari", "asimilacija"], "a": "Bugari", "b": "Mađari", "pitanje": "Na koji narod se odnosi tvrdnja?", "tvrdnje": [{"tekst": "Došli su iz Azije.", "odgovor": "oba", "zasto": "Oba naroda potiču iz Azije."}, {"tekst": "Stopili su se sa Slovenima, a ostalo je njihovo ime.", "odgovor": "a", "zasto": "Tako je bilo sa Bugarima u krajevima oko planine Balkan."}, {"tekst": "Nastanili su se u Panonskoj niziji.", "odgovor": "b", "zasto": "Panonija je mađarska oblast od kraja IX veka."}, {"tekst": "Porazio ih je Oton I na Lehu.", "odgovor": "b", "zasto": "Oton I je 955. pobedio Mađare."}, {"tekst": "Snažno su uticali na zbivanja u Podunavlju i na Balkanu.", "odgovor": "oba", "zasto": "Lekcija to izričito kaže za oba naroda."}, {"tekst": "Doveo ih je knez Rastislav.", "odgovor": "nijedan", "zasto": "Rastislav je moravski knez; Bugare je doveo Asparuh."}], "pomoc": ["Prati gde se koji narod naselio.", "Dve tvrdnje važe za oba.", "Iz lekcije: Bugari do planine Balkan i asimilovani, Mađari u Panoniji."], "objasnjenje": "Isto poreklo, različita sudbina: Bugari se stapaju sa Slovenima, a Mađari ostaju poseban narod u Panoniji.", "iz_udzbenika": {"strana": 20, "odeljak": "Doseljavanje Bugara i Mađara", "tekst": "Bugari i Mađari došli su iz Azije i snažno uticali na Podunavlje i Balkan."}, "lekcija": 3}, {"id": "l03-oton-ko-sam", "vrsta": "ko_sam", "tezina": "srednje", "pojmovi": ["oton-i", "madjari", "leh"], "tragovi": ["Bio sam nemački vladar u X veku.", "Pobedio sam kod Augzburga.", "Zaustavio sam prodor Mađara na zapad 955."], "odgovori": [{"tekst": "Oton I", "tacan": true}, {"tekst": "Asparuh", "tacan": false, "zasto": "Asparuh je bugarski kan koji je svoj narod doveo na Balkan."}, {"tekst": "Rastislav", "tacan": false, "zasto": "Rastislav je knez Velikomoravske, koji je pozvao Ćirila i Metodija."}], "objasnjenje": "To je Oton I, pobednik u bici na reci Leh.", "iz_udzbenika": {"strana": 20, "odeljak": "Doseljavanje Bugara i Mađara", "tekst": "Nemački vladar Oton I porazio je Mađare 955. na Lehu kod Augzburga."}, "osa": {"naziv": "Bitka na reci Leh", "od": 955, "traka": "dogadjaji"}, "lekcija": 3}, {"id": "l03-dolazak-bugara-madjara-objasni", "vrsta": "objasni", "tezina": "srednje", "pojmovi": ["bugari", "madjari", "asparuh", "oton-i"], "pitanje": "Opiši dolazak Bugara i Mađara i šta je bilo sa njima na novom tlu.", "uzor": "Bugari su pod kanom Asparuhom prešli Dunav i stigli do planine Balkan, ali su se stopili sa Slovenima, koji su preuzeli njihovo ime. Mađari su se krajem IX veka nastanili u Panonskoj niziji i odatle upadali u susedne zemlje dok ih Oton I nije zaustavio 955. U XI veku primili su hrišćanstvo.", "ideje": ["Bugari prelaze Dunav pod Asparuhom.", "Bugari se asimiluju među Slovenima.", "Mađari se krajem IX veka nastanjuju u Panoniji.", "Oton I ih zaustavlja 955. na Lehu."], "objasnjenje": "Odgovor treba da pokaže oba puta i različitu sudbinu dva naroda.", "iz_udzbenika": {"strana": 22, "odeljak": "Pitanja za razmišljanje / Zadaci iz udžbenika", "tekst": "Udžbenik traži da opišeš dolazak Bugara i Mađara."}, "lekcija": 3}, {"id": "l03-ime-bez-naroda-objasni", "vrsta": "objasni", "tezina": "tesko", "pojmovi": ["bugari", "asimilacija", "stari-sloveni"], "pitanje": "Zašto današnji Bugari nose ime azijskog plemena, iako su azijski Bugari nestali među Slovenima? Objasni i navedi šta je ovde asimilacija.", "uzor": "Azijski Bugari su bili manjina među Slovenima između Dunava i planine Balkan. Nisu ih izbrisali, nego su se sami stopili sa njima, što je primer asimilacije. Ime je ipak ostalo, jer su ga Sloveni preuzeli.", "ideje": ["Bugari su pleme iz Azije, manje brojno od Slovena.", "Stopili su se sa Slovenima (asimilacija).", "Sloveni su preuzeli ime Bugari."], "objasnjenje": "Nestaje narod, a ostaje ime: to pokazuje koliko je asimilacija drugačija od osvajanja.", "iz_udzbenika": {"strana": 20, "odeljak": "Doseljavanje Bugara i Mađara", "tekst": "Bugari su se asimilovali među Slovenima, a Sloveni su preuzeli ime Bugari."}, "lekcija": 3}]}, {"naslov": "3. Pokrštavanje Južnih Slovena", "zadaci": [{"id": "l03-braca-izbor", "vrsta": "izbor", "tezina": "lako", "pojmovi": ["cirilo-i-metodije", "misionar"], "pitanje": "Ko su bili Ćirilo i Metodije?", "odgovori": [{"tekst": "Braća, Grci i propovednici iz okoline Soluna", "tacan": true}, {"tekst": "Vizantijski carevi", "tacan": false, "zasto": "Bili su propovednici koje je car poslao, a ne vladari."}, {"tekst": "Bugarski kanovi", "tacan": false, "zasto": "Kan je Asparuh; Ćirilo i Metodije su grčki misionari."}, {"tekst": "Nemački sveštenici", "tacan": false, "zasto": "Nemačko sveštenstvo im je bilo protivnik u Moravskoj, a oni su bili Grci."}], "pomoc": ["Dolaze iz vizantijskog dela Balkana.", "Njihov kraj je grad koji su Sloveni napali još 586.", "Iz lekcije: braća, Grci, propovednici iz okoline Soluna."], "objasnjenje": "Ćirilo i Metodije su braća, Grci iz okoline Soluna, koji su znali slovenski jezik i običaje.", "iz_udzbenika": {"strana": 21, "odeljak": "Pokrštavanje Južnih Slovena", "tekst": "Ćirilo i Metodije su braća, Grci, propovednici iz okoline Soluna.", "slika": "03-doseljavanje-srba-na-balkan/04-cirilo-i-metodije.jpg"}, "osa": {"naziv": "Misija Ćirila i Metodija", "od": 863, "do": 885, "traka": "crkva-kultura"}, "lekcija": 3}, {"id": "l03-glagoljica-izbor", "vrsta": "izbor", "tezina": "lako", "pojmovi": ["glagoljica", "cirilo-i-metodije"], "pitanje": "Ko je sastavio glagoljicu, prvo slovensko pismo?", "odgovori": [{"tekst": "Ćirilo (Konstantin)", "tacan": true}, {"tekst": "Kliment", "tacan": false, "zasto": "Kliment je učenik braće koji je radio među makedonskim Slovenima i Bugarima; sa ćirilicom se vezuje za krug učenika."}, {"tekst": "Rastislav", "tacan": false, "zasto": "Rastislav je knez koji je pozvao braću, a ne sastavljač pisma."}, {"tekst": "Justinijan I", "tacan": false, "zasto": "Justinijan je car iz VI veka, tri veka pre glagoljice."}], "pomoc": ["Pismo je sastavio jedan od braće.", "Zove se još i Konstantin.", "Iz lekcije: Ćirilo (Konstantin) je sastavio prvo slovensko pismo, glagoljicu."], "objasnjenje": "Glagoljicu je sastavio Ćirilo, zvani i Konstantin.", "iz_udzbenika": {"strana": 21, "odeljak": "Pokrštavanje Južnih Slovena", "tekst": "Ćirilo (Konstantin) je sastavio prvo slovensko pismo, glagoljicu.", "slika": "03-doseljavanje-srba-na-balkan/04-cirilo-i-metodije.jpg"}, "lekcija": 3}, {"id": "l03-rastislav-izbor", "vrsta": "izbor", "tezina": "lako", "pojmovi": ["rastislav", "velikomoravska-knezevina", "cirilo-i-metodije"], "pitanje": "Na čiji poziv su Ćirilo i Metodije otišli u Velikomoravsku kneževinu?", "odgovori": [{"tekst": "Kneza Rastislava", "tacan": true}, {"tekst": "Kana Asparuha", "tacan": false, "zasto": "Asparuh je doveo Bugare na Balkan i nema veze sa Moravskom."}, {"tekst": "Otona I", "tacan": false, "zasto": "Oton I je nemački vladar iz X veka; poziv je stigao u IX veku od moravskog kneza."}, {"tekst": "Pape iz Rima", "tacan": false, "zasto": "Braću je poslao vizantijski car, na poziv kneza Rastislava."}], "pomoc": ["Poziv je stigao od vladara same Moravske.", "Titula mu je knez.", "Iz lekcije: vizantijski car ih je poslao na poziv kneza Rastislava."], "objasnjenje": "Knez Rastislav je pozvao misionare, a vizantijski car ih je poslao u Velikomoravsku.", "iz_udzbenika": {"strana": 21, "odeljak": "Pokrštavanje Južnih Slovena", "tekst": "Vizantijski car poslao je braću u Velikomoravsku kneževinu, na poziv kneza Rastislava."}, "lekcija": 3}, {"id": "l03-raskol-podela-izbor", "vrsta": "izbor", "tezina": "lako", "pojmovi": ["veliki-raskol", "hristijanizacija"], "pitanje": "Šta je podelio Veliki raskol 1054?", "odgovori": [{"tekst": "Hrišćansku crkvu na istočnu i zapadnu", "tacan": true}, {"tekst": "Rimsko carstvo na dva dela", "tacan": false, "zasto": "Lekcija 1054. vezuje za crkvu; raskol nije podela države nego vere."}, {"tekst": "Slovene na Hune i Avare", "tacan": false, "zasto": "Huni i Avari su drugi narodi, a raskol deli hrišćane."}, {"tekst": "Plemenske saveze u Raškoj i Duklji", "tacan": false, "zasto": "Raskol je crkveni događaj, a ne podela srpskih saveza."}], "pomoc": ["Reč raskol govori da se nešto što je bilo celo deli.", "Radi se o veri.", "Iz lekcije: Veliki raskol 1054. podelio je crkvu na istočnu i zapadnu."], "objasnjenje": "Godine 1054. crkva se podelila na istočnu i zapadnu, odnosno pravoslavnu i katoličku.", "iz_udzbenika": {"strana": 21, "odeljak": "Pokrštavanje Južnih Slovena", "tekst": "Veliki raskol 1054. podelio je crkvu na istočnu i zapadnu."}, "osa": {"naziv": "Veliki raskol", "od": 1054, "traka": "crkva-kultura"}, "lekcija": 3}, {"id": "l03-misionar-izbor", "vrsta": "izbor", "tezina": "lako", "pojmovi": ["misionar"], "pitanje": "Ko je misionar?", "odgovori": [{"tekst": "Sveštenik koji širi veru među nevernicima", "tacan": true}, {"tekst": "Vladar plemena srednje Azije", "tacan": false, "zasto": "To je kan; misionar je čovek vere."}, {"tekst": "Grčki istoričar", "tacan": false, "zasto": "Istoričar beleži događaje, kao Herodot; misionar širi veru."}, {"tekst": "Vojskovođa u pljačkaškom upadu", "tacan": false, "zasto": "Misionar širi veru propovedanjem, a ne oružjem."}], "pomoc": ["Takvi su bili Ćirilo i Metodije.", "Reč je povezana sa misijom.", "Iz lekcije: misionar je sveštenik koji širi veru među nevernicima."], "objasnjenje": "Misionar je sveštenik koji širi veru među onima koji je još nisu primili.", "iz_udzbenika": {"strana": 21, "odeljak": "Pokrštavanje Južnih Slovena", "tekst": "Misionar je sveštenik koji širi veru među nevernicima."}, "lekcija": 3}, {"id": "l03-ko-je-koje-vere-izbor", "vrsta": "izbor", "tezina": "srednje", "pojmovi": ["veliki-raskol"], "pitanje": "Koji narodi su posle Velikog raskola pripali pravoslavnoj crkvi? (više tačnih)", "odgovori": [{"tekst": "Srbi", "tacan": true}, {"tekst": "Bugari", "tacan": true}, {"tekst": "Makedonski Sloveni", "tacan": true}, {"tekst": "Hrvati", "tacan": false, "zasto": "Hrvati su pod uticajem dalmatinskih gradova pripali katoličkoj, zapadnoj crkvi."}, {"tekst": "Slovenci", "tacan": false, "zasto": "Slovenci su, kao i Hrvati, pripali katoličkoj crkvi."}], "pomoc": ["Pomisli ko je bio blizu Vizantije.", "Oni dalje na zapadu pripali su Rimu.", "Iz lekcije: makedonski Sloveni, Srbi i Bugari pravoslavnoj; Hrvati i Slovenci katoličkoj."], "objasnjenje": "Pravoslavni postaju makedonski Sloveni, Srbi i Bugari, a katolici Hrvati i Slovenci.", "iz_udzbenika": {"strana": 21, "odeljak": "Pokrštavanje Južnih Slovena", "tekst": "Hrvati i Slovenci pripali su katoličkoj, a makedonski Sloveni, Srbi i Bugari pravoslavnoj crkvi."}, "osa": {"naziv": "Veliki raskol", "od": 1054, "traka": "crkva-kultura"}, "lekcija": 3}, {"id": "l03-ko-danas-cirilica-izbor", "vrsta": "izbor", "tezina": "srednje", "pojmovi": ["cirilica"], "pitanje": "Koji narodi danas, sa izmenama, koriste ćirilicu? (više tačnih)", "odgovori": [{"tekst": "Srbi", "tacan": true}, {"tekst": "Makedonci", "tacan": true}, {"tekst": "Bugari", "tacan": true}, {"tekst": "Rusi", "tacan": true}, {"tekst": "Hrvati", "tacan": false, "zasto": "Lekcija Hrvate ne navodi među narodima koji danas koriste ćirilicu."}, {"tekst": "Mađari", "tacan": false, "zasto": "Mađari nisu Sloveni i nisu na toj listi."}], "pomoc": ["Lekcija navodi četiri naroda.", "Svi su slovenski, a tri su balkanska ili pravoslavna na istoku.", "Iz lekcije: Srbi, Makedonci, Bugari i Rusi."], "objasnjenje": "Ćirilicu danas, sa izmenama, koriste Srbi, Makedonci, Bugari i Rusi.", "iz_udzbenika": {"strana": 21, "odeljak": "Pokrštavanje Južnih Slovena", "tekst": "Ćirilicu danas, sa izmenama, koriste Srbi, Makedonci, Bugari i Rusi."}, "lekcija": 3}, {"id": "l03-prvo-hriscanstvo-izbor", "vrsta": "izbor", "tezina": "srednje", "pojmovi": ["pokrstavanje", "starosedeoci"], "pitanje": "Preko koga su Sloveni na Balkanu prvo upoznali hrišćanstvo?", "odgovori": [{"tekst": "Preko zatečenih starosedelaca", "tacan": true}, {"tekst": "Preko Huna", "tacan": false, "zasto": "Huni su bili nomadi iz Azije koji su pokrenuli seobu i nisu širili hrišćanstvo."}, {"tekst": "Preko Mađara", "tacan": false, "zasto": "Mađari sami primaju hrišćanstvo tek u XI veku, posle Južnih Slovena."}, {"tekst": "Preko Asparuhovih Bugara", "tacan": false, "zasto": "Bugari su bili azijsko pleme sa kanom, a lekcija prvi dodir sa hrišćanstvom vezuje za starosedeoce."}], "pomoc": ["Ko je na Balkanu već bio hrišćanin kada su Sloveni došli?", "Stanovnici starih rimskih gradova.", "Iz lekcije: hri
