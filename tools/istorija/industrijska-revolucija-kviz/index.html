"odgovori": [{"tekst": "U Velikoj Britaniji", "tacan": true}, {"tekst": "U Rusiji", "tacan": false, "zasto": "Istok Evrope industrijski razvoj je do sredine XIX veka uglavnom zaobišao."}, {"tekst": "U Italiji", "tacan": false, "zasto": "Apeninsko poluostrvo spada u delove Evrope koje je industrijski razvoj tada zaobišao."}, {"tekst": "U Sjedinjenim Američkim Državama", "tacan": false, "zasto": "Iz Amerike je pronalazač Fulton, ali revolucija je počela u Britaniji pa se širila po Evropi."}], "pomoc": ["Seti se zemlje koja je imala najviše kolonija i najjaču trgovačku flotu.", "Tamo su radili Vat i Stivenson, a nalaze se i Mančester i Liverpul.", "Iz lekcije: počela je u Velikoj Britaniji, pa zahvatila zapadnu i srednju Evropu."], "objasnjenje": "Prva industrijska revolucija počela je u Velikoj Britaniji, a zatim se proširila na druge delove zapadne i srednje Evrope.", "iz_udzbenika": {"strana": 28, "odeljak": "Uvod", "tekst": "Prva industrijska revolucija počela je u Velikoj Britaniji, a potom zahvatila zapadnu i srednju Evropu."}}, {"id": "uvod-izbor-zaobisla", "vrsta": "izbor", "tezina": "tesko", "pojmovi": ["industrijska-revolucija"], "pitanje": "Koje oblasti je industrijski razvoj do sredine XIX veka uglavnom zaobišao? (više tačnih)", "odgovori": [{"tekst": "Balkansko poluostrvo", "tacan": true}, {"tekst": "Rusiju i istok Evrope", "tacan": true}, {"tekst": "Pirinejsko i Apeninsko poluostrvo", "tacan": true}, {"tekst": "Belgiju", "tacan": false, "zasto": "Belgija je na karti među najrazvijenijim industrijskim teritorijama, odmah posle Britanije."}, {"tekst": "Češku", "tacan": false, "zasto": "Češka (deo Habzburške monarhije) je na karti šrafirana kao razvijena industrijska oblast."}, {"tekst": "Sever Francuske", "tacan": false, "zasto": "Sever Francuske pripada pojasu industrijskih oblasti od Belgije prema nemačkim zemljama."}], "pomoc": ["Razvijene oblasti čine pojas od Britanije preko Belgije do Češke — šta je izvan njega?", "Pogledaj jug i istok karte.", "Iz lekcije: zaobiđeni su jug (tri poluostrva), istok (Rusija) i sever Evrope."], "objasnjenje": "Do sredine XIX veka industrija je bila jaka u Britaniji i pojasu od Belgije do Češke; jug, istok i sever Evrope su uglavnom zaobiđeni.", "iz_udzbenika": {"strana": 28, "odeljak": "Karta — Industrijska revolucija do sredine XIX veka", "tekst": "Uz kartu udžbenik pita koje je zemlje zahvatila industrijska revolucija, a koje delove Evrope je zaobišla.", "slika": "03-industrijska-revolucija/01-karta-industrijska-revolucija.jpg"}}, {"id": "uvod-tn-masine", "vrsta": "tacno_netacno", "tezina": "lako", "pojmovi": ["industrijska-revolucija"], "tvrdnja": "U drugoj polovini XVIII veka mašine su počele da zamenjuju rad ljudske ruke.", "tacno": true, "pomoc": ["Šta je novo u odnosu na manufakturu?", "Iz lekcije: u drugoj polovini XVIII veka mašine zamenjuju ljudsku ruku."], "objasnjenje": "Tačno — to je suština industrijske revolucije; manufakturu sa ručnim radom smenjuje mašinska proizvodnja.", "iz_udzbenika": {"strana": 28, "odeljak": "Uvod", "tekst": "U drugoj polovini XVIII veka mašine su počele da zamenjuju rad ljudske ruke."}, "osa": {"naziv": "Mašine zamenjuju ljudsku ruku", "od": 1750, "do": 1800, "traka": "pronalasci"}}, {"id": "uvod-dopuni-manufaktura", "vrsta": "dopuni", "tezina": "lako", "pojmovi": ["manufaktura", "industrijska-revolucija", "velika-britanija"], "pitanje": "Dopuni rečenice.", "tekst": "Od XVI do XVIII veka proizvodilo se u {{manufakturama}}, gde se radilo {{ručno}}. U drugoj polovini XVIII veka ljudsku ruku zamenjuju {{mašine}}, a promena počinje u {{Velikoj Britaniji}}.", "ponudjene": ["manufakturama", "ručno", "mašine", "Velikoj Britaniji", "fabrikama", "Rusiji", "parom"], "pomoc": ["Prvo je bio ručni rad, pa onda mašine.", "Iz lekcije: manufaktura (ručno) → mašine; početak u Britaniji."], "objasnjenje": "Manufaktura je ručna proizvodnja sa podelom rada; industrijska revolucija uvodi mašine, prvo u Velikoj Britaniji.", "iz_udzbenika": {"strana": 28, "odeljak": "Uvod", "tekst": "Posle manufakturnog razdoblja (XVI–XVIII vek) mašine zamenjuju ruku; revolucija počinje u Britaniji."}}, {"id": "uvod-datum-masine", "vrsta": "datum", "tezina": "srednje", "pojmovi": ["industrijska-revolucija"], "dogadjaj": "Mašine zamenjuju ljudsku ruku", "pitanje": "U kom razdoblju su mašine počele da zamenjuju rad ljudske ruke? (upiši raspon godina)", "od": 1750, "do": 1800, "traka": "pronalasci", "pomoc": ["Bilo je to u XVIII veku — u kojoj polovini?", "Vatova mašina je iz 1769, usred tog razdoblja.", "Iz lekcije: druga polovina XVIII veka (oko 1750–1800)."], "objasnjenje": "Druga polovina XVIII veka, otprilike 1750–1800 — u to vreme pada i Vatova mašina (1769).", "iz_udzbenika": {"strana": 28, "odeljak": "Uvod", "tekst": "Velika promena dolazi u drugoj polovini XVIII veka, kada mašine zamenjuju ljudsku ruku."}}, {"id": "uvod-zakljuci-revolucija", "vrsta": "zakljuci", "tezina": "srednje", "pojmovi": ["industrijska-revolucija"], "pitanje": "Zašto se promena u proizvodnji naziva „revolucija”, a ne samo napredak?", "odgovori": [{"tekst": "Zato što je donela duboke, korenite promene u svim oblastima društva, ne samo u radionicama", "tacan": true}, {"tekst": "Zato što je počela nasilnim ustankom protiv kralja", "tacan": false, "zasto": "Ovde „revolucija” ne znači pobunu; znači korenit preokret u proizvodnji i načinu života."}, {"tekst": "Zato što se desila preko noći, za jednu godinu", "tacan": false, "zasto": "Trajala je decenijama — od Vatove mašine (1769) do sredine XIX veka i dalje."}, {"tekst": "Zato što je zahvatila samo proizvodnju tkanina", "tacan": false, "zasto": "Zahvatila je i metalnu i mašinsku industriju, saobraćaj, gradove i odnose među ljudima."}], "pomoc": ["Korak 1: Šta znači reč revolucija — mala ili velika promena?", "Korak 2: Na šta je sve uticala — samo na mašine, ili i na gradove, porodice, rad dece?", "Iz lekcije: donela je dalekosežne i korenite promene u svim poljima društvenog razvoja."], "objasnjenje": "Revolucija je korenit preokret; mašine su promenile ne samo proizvodnju nego i gradove, društvene grupe i svakodnevni život.", "iz_udzbenika": {"strana": 28, "odeljak": "Uvod", "tekst": "Prva industrijska revolucija donela je dalekosežne i korenite promene u svim poljima društvenog razvoja."}}, {"id": "uvod-izvor-manufaktura", "vrsta": "izvor", "tezina": "lako", "pojmovi": ["manufaktura", "manufakturna-radionica"], "izvor": {"autor": "Nepoznati crtač", "naslov": "Manufakturna radionica (crtež)", "tekst": "Na crtežu je radionica u kojoj više radnika stoji za stolovima. Svako ručno radi svoj deo posla — jedan izrađuje, drugi slaže gotove listove. Mašina na crtežu nema.", "napomena": "Opis slike je prepričan; udžbenik, str. 28."}, "pitanje": "Šta ovaj crtež pokazuje o radu u manufakturi?", "odgovori": [{"tekst": "Radilo se ručno, a posao je bio podeljen među radnicima", "tacan": true}, {"tekst": "Mašine su obavljale ceo posao, a radnici su ih samo nadgledali", "tacan": false, "zasto": "Na crtežu nema mašina — to bi bila fabrika iz doba industrijske revolucije."}, {"tekst": "Jedan majstor je sam pravio ceo proizvod", "tacan": false, "zasto": "Na crtežu radi više ljudi i svako radi svoj deo — to je podela rada."}, {"tekst": "Radnici su bili robovi doneti iz kolonija", "tacan": false, "zasto": "Robovi su radili na plantažama pamuka u kolonijama, a ne u britanskim radionicama."}], "pomoc": ["Prebroj ljude na crtežu i pogledaj da li rade isto.", "Ima li na crtežu mašina?", "Iz lekcije: manufaktura = ručni rad uz podelu posla."], "objasnjenje": "Crtež pokazuje dva obeležja manufakture — ručni rad i podelu posla među više radnika.", "iz_udzbenika": {"strana": 28, "odeljak": "Manufakturna radionica", "tekst": "Crtež prikazuje radnike koji ručno izrađuju i slažu proizvode, svako svoj deo posla.", "slika": "03-industrijska-revolucija/02-manufakturna-radionica.jpg"}}, {"id": "uvod-izvor-karta", "vrsta": "izvor", "tezina": "lako", "pojmovi": ["industrijska-revolucija", "velika-britanija", "zeleznica"], "izvor": {"autor": "Istorijska karta u udžbeniku", "naslov": "Industrijska revolucija i razvoj industrije do sredine XIX veka", "tekst": "Na karti Evrope znakovima su označene metalna i tekstilna industrija i pruge. Šrafurom su obeležene najrazvijenije industrijske teritorije — Velika Britanija i pojas od Belgije, preko severa Francuske i nemačkih zemalja, do Češke.", "napomena": "Opis karte je prepričan; udžbenik, str. 28."}, "pitanje": "Koja oblast je, prema karti, bila najrazvijenija industrijska teritorija Evrope?", "odgovori": [{"tekst": "Velika Britanija, zajedno sa pojasom od Belgije do Češke", "tacan": true}, {"tekst": "Balkansko poluostrvo", "tacan": false, "zasto": "Balkan nije šrafiran — industrijski razvoj ga je do sredine XIX veka zaobišao."}, {"tekst": "Rusija oko Moskve", "tacan": false, "zasto": "Moskva je ucrtana na karti, ali Rusija nije među šrafiranim industrijskim oblastima."}, {"tekst": "Jug Italije i Španije", "tacan": false, "zasto": "Pirinejsko i Apeninsko poluostrvo su van najrazvijenijih oblasti."}], "pomoc": ["Šrafura označava najrazvijenije teritorije — gde je ima?", "Počni od zemlje u kojoj je revolucija počela.", "Iz lekcije: Britanija i pojas od Belgije do Češke."], "objasnjenje": "Karta je izvor koji prikazuje rasprostranjenost — najrazvijenija je Britanija, a zatim pojas od Belgije do Češke.", "iz_udzbenika": {"strana": 28, "odeljak": "Karta", "tekst": "Karta pokazuje industriju i pruge do sredine XIX veka i šrafurom ističe najrazvijenije teritorije.", "slika": "03-industrijska-revolucija/01-karta-industrijska-revolucija.jpg"}}, {"id": "uvod-uporedi-manufaktura-fabrika", "vrsta": "uporedi", "tezina": "lako", "pojmovi": ["manufaktura", "fabrika"], "a": "Manufaktura", "b": "Fabrika", "pitanje": "Na šta se odnosi tvrdnja — na manufakturu, fabriku, obe ili nijednu?", "tvrdnje": [{"tekst": "Proizvodi se ručno.", "odgovor": "a", "zasto": "Ručni rad je obeležje manufakture; u fabrici rade mašine."}, {"tekst": "Proizvodnju pokreću mašine, često na paru.", "odgovor": "b", "zasto": "Fabrika je ustanova mašinske proizvodnje iz doba industrijske revolucije."}, {"tekst": "Više radnika radi zajedno i svako radi svoj deo posla.", "odgovor": "oba", "zasto": "Podela rada postoji već u manufakturi i zadržava se u fabrici."}, {"tekst": "Proizvodi postaju jeftiniji pa zanatlije propadaju.", "odgovor": "b", "zasto": "Mašinska proizvodnja u fabrikama je pojeftinila robu i uništila sitne zanatlije i manufakture."}, {"tekst": "Nalazi se na plantaži u koloniji.", "odgovor": "nijedan", "zasto": "Na plantažama robovi gaje sirovi pamuk; i manufakture i fabrike su u Britaniji."}], "pomoc": ["Šta je glavna razlika — ruka ili mašina?", "Podela rada postoji od manufakture nadalje.", "Iz lekcije: manufaktura = ručno + podela rada; fabrika = mašine."], "objasnjenje": "Obe imaju podelu rada, ali manufaktura radi rukom, a fabrika mašinama — i zato fabrika proizvodi jeftinije.", "iz_udzbenika": {"strana": 28, "odeljak": "Uvod", "tekst": "Manufaktura je ručni rad podeljen na delove; mašinska proizvodnja u fabrikama dolazi u drugoj polovini XVIII veka."}}, {"id": "uvod-objasni-manufaktura-fabrika", "vrsta": "objasni", "tezina": "lako", "pojmovi": ["manufaktura", "fabrika", "industrijska-revolucija"], "pitanje": "Po čemu se rad u fabrici razlikuje od rada u manufakturi? Objasni svojim rečima.", "uzor": "U manufakturi se radilo ručno, ali je posao bio podeljen među radnicima. U fabrici posao obavljaju mašine, koje pokreće voda ili para, a radnici ih opslužuju. Zato fabrika proizvodi brže i jeftinije.", "ideje": ["Manufaktura — ručni rad.", "U oba slučaja postoji podela rada.", "Fabrika — mašine (voda, para).", "Fabrika proizvodi brže i jeftinije."], "objasnjenje": "Ključna razlika je izvor snage — ljudska ruka ili mašina.", "iz_udzbenika": {"strana": 28, "odeljak": "Uvod", "tekst": "Manufakturu (ručni rad, podela posla) smenjuje mašinska proizvodnja."}}]}, {"naslov": "Uzroci industrijske revolucije", "zadaci": [{"id": "uzr-izbor-pomorska-sila", "vrsta": "izbor", "tezina": "lako", "pojmovi": ["velika-britanija", "kolonija"], "pitanje": "Kakva je bila Velika Britanija početkom XVIII veka?", "odgovori": [{"tekst": "Jedna od vodećih pomorskih i kolonijalnih sila", "tacan": true}, {"tekst": "Mala država bez kolonija i flote", "tacan": false, "zasto": "Upravo suprotno — Britanija je imala kolonije i jaku flotu, pa je trgovala na svim kontinentima."}, {"tekst": "Zemlja koja je samo kupovala tuđu robu", "tacan": false, "zasto": "Britanski trgovci su višak svojih proizvoda prodavali u Evropi i na drugim kontinentima."}, {"tekst": "Kolonija neke druge evropske sile", "tacan": false, "zasto": "Britanija je sama imala kolonije — na primer plantaže pamuka."}], "pomoc": ["Britanija je ostrvo — po čemu je bila jaka?", "Odakle je dobijala jeftin pamuk?", "Iz lekcije: vodeća pomorska i kolonijalna sila."], "objasnjenje": "Britanija je bila pomorska i kolonijalna sila — to joj je donelo tržišta, sirovine i bogatstvo, uslove za industrijsku revoluciju.", "iz_udzbenika": {"strana": 29, "odeljak": "Uzroci industrijske revolucije", "tekst": "Početkom XVIII veka Britanija je jedna od vodećih pomorskih i kolonijalnih sila."}}, {"id": "uzr-izbor-uzroci-vise", "vrsta": "izbor", "tezina": "tesko", "pojmovi": ["velika-britanija", "pamuk", "kolonija", "fabrika"], "pitanje": "Šta je doprinelo da industrijska revolucija počne baš u Britaniji? (više tačnih)", "odgovori": [{"tekst": "Bila je pomorska i kolonijalna sila koja je trgovala na svim kontinentima", "tacan": true}, {"tekst": "Iz kolonija je dobijala jeftin sirovi pamuk", "tacan": true}, {"tekst": "Vlasnici radionica su prihod od tkanina ulagali u nove fabrike", "tacan": true}, {"tekst": "Imala je obilje šuma, pa je drvo bilo glavno gorivo", "tacan": false, "zasto": "Obrnuto — zbog nedostatka šuma glavno gorivo je postao kameni ugalj."}, {"tekst": "Lanene i vunene tkanine bile su najjeftinije na svetu", "tacan": false, "zasto": "Najtraženije zbog povoljne cene bile su pamučne tkanine, a lanene i vunene bile su najcenjenije."}], "pomoc": ["Misli o trgovini, sirovinama i novcu.", "Jedan ponuđeni odgovor govori o šumama — kako je zapravo bilo?", "Iz lekcije: pomorska i kolonijalna sila, jeftin pamuk iz kolonija, prihod uložen u fabrike."], "objasnjenje": "Trgovina i kolonije dale su tržište i jeftinu sirovinu, a zarada od pamuka kapital za fabrike.", "iz_udzbenika": {"strana": 29, "odeljak": "Uzroci industrijske revolucije", "tekst": "Britanija trguje na svim kontinentima, pamuk dobija sa plantaža u kolonijama, a prihod od tkanina ulaže se u fabrike."}}, {"id": "uzr-tn-robovi", "vrsta": "tacno_netacno", "tezina": "lako", "pojmovi": ["pamuk", "kolonija", "robovlasnistvo"], "tvrdnja": "Jeftin sirovi pamuk dobijao se sa plantaža u britanskim kolonijama, na kojima su radili crni robovi.", "tacno": true, "pomoc": ["Odakle dolazi sirovina i ko je tamo radio?", "Iz lekcije: plantaže u kolonijama, rad crnih robova."], "objasnjenje": "Tačno — pamuk je bio jeftin i zato što su ga na plantažama gajili robovi.", "iz_udzbenika": {"strana": 29, "odeljak": "Uzroci industrijske revolucije", "tekst": "Sirovi pamuk dolazi sa plantaža u britanskim kolonijama na kojima rade crni robovi."}}, {"id": "uzr-tn-prerada", "vrsta": "tacno_netacno", "tezina": "srednje", "pojmovi": ["pamuk", "tkanine", "kolonija"], "tvrdnja": "Pamuk se prerađivao u tkaninu u kolonijama, a Britanija je uvozila samo gotove tkanine.", "tacno": false, "ispravke": [{"tekst": "Sirovi pamuk se dovozio iz kolonija i prerađivao u britanskim radionicama.", "tacan": true}, {"tekst": "Pamuk se i gajio i prerađivao u Britaniji.", "tacan": false, "zasto": "Pamuk se gajio na plantažama u kolonijama, a ne u Britaniji."}, {"tekst": "Britanija je pamuk kupovala od Rusije.", "tacan": false, "zasto": "Pamuk je dolazio sa plantaža u britanskim kolonijama."}], "pomoc": ["Gde je sirovina, a gde radionice?", "Iz lekcije: pamuk iz kolonija prerađuje se u britanskim radionicama."], "objasnjenje": "Kolonije daju sirovinu, a Britanija je prerađuje — zato su britanske radionice, pa fabrike, toliko zarađivale.", "iz_udzbenika": {"strana": 29, "odeljak": "Uzroci industrijske revolucije", "tekst": "Sirovi pamuk iz kolonija prerađuje se u britanskim radionicama."}}, {"id": "uzr-dopuni-pamuk", "vrsta": "dopuni", "tezina": "lako", "pojmovi": ["pamuk", "kolonija", "robovlasnistvo", "tkanine"], "pitanje": "Dopuni rečenice.", "tekst": "U XVIII veku najtraženije su postale {{pamučne}} tkanine zbog povoljne {{cene}}. Sirovina je stizala sa {{plantaža}} u britanskim kolonijama, gde su radili {{robovi}}.", "ponudjene": ["pamučne", "cene", "plantaža", "robovi", "vunene", "boje", "rudnika", "zanatlije"], "pomoc": ["Koja tkanina je bila jeftina, a koja cenjena?", "Ko je radio na plantažama?", "Iz lekcije: pamučne tkanine, povoljna cena, plantaže, crni robovi."], "objasnjenje": "Jeftina sirovina (rad robova) → jeftina pamučna tkanina → velika potražnja.", "iz_udzbenika": {"strana": 29, "odeljak": "Uzroci industrijske revolucije", "tekst": "Pamučne tkanine najtraženije su zbog cene; sirovina dolazi sa plantaža na kojima rade robovi."}}, {"id": "uzr-povezi-uzroci", "vrsta": "povezi", "tezina": "srednje", "pojmovi": ["pamuk", "kolonija", "fabrika", "velika-britanija"], "pitanje": "Poveži uzrok sa njegovom posledicom.", "parovi": [["Povoljna cena pamučnih tkanina", "Pamučne tkanine postaju najtraženije"], ["Rad robova na plantažama", "Sirovi pamuk je jeftin"], ["Veliki prihod od pamučnih tkanina", "Vlasnici radionica otvaraju fabrike"], ["Britanija ima višak proizvoda", "Trgovci ih prodaju i na drugim kontinentima"]], "pomoc": ["Za svaki uzrok pitaj: šta se zbog toga desilo?", "Iz lekcije: novac od tkanina ulaže se u fabrike."], "objasnjenje": "Svaki korak vodi sledećem — jeftina sirovina, jeftina tkanina, velika prodaja, zarada, nove fabrike.", "iz_udzbenika": {"strana": 29, "odeljak": "Uzroci industrijske revolucije", "tekst": "Prihod od pamučnih tkanina vlasnici radionica ulažu u razvoj proizvodnje i otvaranje fabrika."}}, {"id": "uzr-lanac-prihod", "vrsta": "lanac", "tezina": "lako", "pojmovi": ["pamuk", "fabrika", "tkanine"], "karike": ["Pamučne tkanine se dobro prodaju u Evropi i na drugim kontinentima", "?", "Vlasnici radionica otvaraju fabrike"], "praznina": 1, "odgovori": [{"tekst": "Vlasnici radionica ostvaruju veliki prihod", "tacan": true}, {"tekst": "Zanatlije propadaju", "tacan": false, "zasto": "Propast zanatlija je kasnija posledica fabrika koje proizvode jeftinije, a ne uzrok njihovog otvaranja."}, {"tekst": "Nestaju šume u Britaniji", "tacan": false, "zasto": "Nedostatak šuma je razlog prelaska na kameni ugalj, a ne veza između prodaje i fabrika."}, {"tekst": "Radnici lome mašine", "tacan": false, "zasto": "Lomljenje mašina dolazi kasnije, kao odgovor radnika na loš položaj u fabrikama."}], "pomoc": ["Korak 1: Šta trgovac dobija kad mnogo proda?", "Korak 2: Čime se plaća gradnja fabrike?", "Iz lekcije: pamučna tkanina je donosila veliki prihod, koji se ulagao u fabrike."], "objasnjenje": "Dobra prodaja → veliki prihod → novac za nove fabrike.", "iz_udzbenika": {"strana": 29, "odeljak": "Uzroci industrijske revolucije", "tekst": "Pamučna tkanina donosi veliki prihod, koji vlasnici radionica ulažu u fabrike."}}, {"id": "uzr-lanac-pamuk", "vrsta": "lanac", "tezina": "srednje", "pojmovi": ["pamuk", "robovlasnistvo", "kolonija", "tkanine"], "karike": ["Na plantažama u kolonijama rade crni robovi", "Sirovi pamuk je jeftin", "?", "Potražnja za pamučnim tkaninama je ogromna"], "praznina": 2, "odgovori": [{"tekst": "Pamučne tkanine iz britanskih radionica su jeftine", "tacan": true}, {"tekst": "Lanene i vunene tkanine postaju jeftinije", "tacan": false, "zasto": "Lan i vuna nisu iz kolonija; jeftin je pamuk, pa su jeftine pamučne tkanine."}, {"tekst": "Britanija gubi svoje kolonije", "tacan": false, "zasto": "Lekcija ne govori o gubitku kolonija — one su bile izvor jeftine sirovine."}, {"tekst": "Radnici traže veće plate", "tacan": false, "zasto": "Borba radnika za bolji položaj je posledica fabrika, a ne veza u ovom lancu o ceni."}], "pomoc": ["Korak 1: Ako je sirovina jeftina, kakav će biti gotov proizvod?", "Korak 2: Zašto ljudi kupuju više neke robe?", "Iz lekcije: pamučne tkanine su najtraženije zbog povoljne cene."], "objasnjenje": "Rad robova → jeftina sirovina → jeftine pamučne tkanine → velika potražnja. Bogatstvo britanske industrije počivalo je i na ropstvu.", "iz_udzbenika": {"strana": 29, "odeljak": "Uzroci industrijske revolucije", "tekst": "Jeftin pamuk sa plantaža na kojima rade robovi čini pamučne tkanine najtraženijim."}}, {"id": "uzr-zakljuci-pamuk", "vrsta": "zakljuci", "tezina": "lako", "pojmovi": ["pamuk", "tkanine"], "pitanje": "Zašto su pamučne tkanine u XVIII veku postale najtraženije?", "odgovori": [{"tekst": "Zbog povoljne, niske cene", "tacan": true}, {"tekst": "Zato što su bile najskuplje i najotmenije", "tacan": false, "zasto": "Najcenjenije su bile tkanine od lana i vune; pamuk je pobedio cenom."}, {"tekst": "Zato što su se pravile u Rusiji", "tacan": false, "zasto": "Pamuk se prerađivao u britanskim radionicama, a gajio u britanskim kolonijama."}, {"tekst": "Zato što ih je zakon jedine dozvoljavao", "tacan": false, "zasto": "Lekcija ne pominje takav zakon; ljudi su ih kupovali jer su bile jeftine."}], "pomoc": ["Korak 1: Šta je najvažnije većini kupaca?", "Korak 2: Sirovina je bila jeftina — kakva je onda tkanina?", "Iz lekcije: najtraženije zbog povoljne cene."], "objasnjenje": "Pamuk iz kolonija bio je jeftin, pa su i tkanine bile jeftine — i zato najtraženije.", "iz_udzbenika": {"strana": 29, "odeljak": "Uzroci industrijske revolucije", "tekst": "U XVIII veku najtraženije su pamučne tkanine zbog povoljne cene."}}, {"id": "uzr-zakljuci-britanija", "vrsta": "zakljuci", "tezina": "srednje", "pojmovi": ["velika-britanija", "kolonija", "prva-industrijska-revolucija"], "pitanje": "Kako je to što je Britanija bila kolonijalna sila pomoglo da baš ona započne industrijsku revoluciju?", "odgovori": [{"tekst": "Kolonije su davale jeftinu sirovinu i tržište, pa je trgovina donosila novac za fabrike", "tacan": true}, {"tekst": "Iz kolonija su stizale gotove mašine", "tacan": false, "zasto": "Mašine su izmislili britanski pronalazači; iz kolonija je stizala sirovina — pamuk."}, {"tekst": "Kolonije su slale radnike za britanske fabrike", "tacan": false, "zasto": "U fabrike su dolazili ljudi sa britanskih sela; robovi su radili na plantažama u kolonijama."}, {"tekst": "Kolonije su bile hladne, pa je trebalo više tkanina", "tacan": false, "zasto": "Lekcija to ne kaže; važno je da su kolonije davale jeftin pamuk i da je Britanija trgovala svuda."}], "pomoc": ["Korak 1: Šta je Britanija dobijala iz kolonija?", "Korak 2: Šta je radila sa viškom robe?", "Korak 3: Gde je završavao novac od trgovine? Iz lekcije: u razvoju proizvodnje i fabrikama."], "objasnjenje": "Kolonije i flota značile su jeftinu sirovinu i kupce širom sveta; zarada je uložena u fabrike.", "iz_udzbenika": {"strana": 29, "odeljak": "Uzroci industrijske revolucije", "tekst": "Kao pomorska i kolonijalna sila, Britanija prodaje višak robe svuda i dobija jeftin pamuk iz kolonija."}}, {"id": "uzr-uporedi-tkanine", "vrsta": "uporedi", "tezina": "srednje", "pojmovi": ["tkanine", "pamuk", "kolonija"], "a": "Tkanine od lana i vune", "b": "Pamučne tkanine", "pitanje": "Na koje tkanine se odnosi tvrdnja — A, B, obe ili nijedne?", "tvrdnje": [{"tekst": "Bile su najcenjeniji britanski proizvod.", "odgovor": "a", "zasto": "Lan i vuna su bili najcenjeniji; pamuk je postao najtraženiji."}, {"tekst": "U XVIII veku postale su najtraženije zbog povoljne cene.", "odgovor": "b", "zasto": "Pamuk je pobedio cenom."}, {"tekst": "Sirovina je stizala sa plantaža u kolonijama.", "odgovor": "b", "zasto": "Sirovi pamuk se gajio na plantažama u kolonijama."}, {"tekst": "Bile su britanski proizvod.", "odgovor": "oba", "zasto": "I jedne i druge su izrađivane u Britaniji."}, {"tekst": "Izrađivale su se u kolonijama pa uvozile u Britaniju.", "odgovor": "nijedan", "zasto": "Tkanine su se izrađivale u britanskim radionicama; iz kolonija je dolazila samo sirovina."}], "pomoc": ["Cenjeno nije isto što i traženo.", "Koja sirovina dolazi iz kolonija?", "Iz lekcije: lan i vuna najcenjeniji; pamuk najtraženiji zbog cene."], "objasnjenje": "Lan i vuna — najcenjeniji; pamuk — najtraženiji i najunosniji, zahvaljujući jeftinoj sirovini iz kolonija.", "iz_udzbenika": {"strana": 29, "odeljak": "Uzroci industrijske revolucije", "tekst": "Lanene i vunene tkanine su najcenjenije, a pamučne najtraženije zbog cene."}}, {"id": "uzr-objasni-britanija", "vrsta": "objasni", "tezina": "srednje", "pojmovi": ["velika-britanija", "pamuk", "kolonija", "fabrika"], "pitanje": "Zašto je industrijska revolucija počela baš u Velikoj Britaniji? Navedi bar dva uzroka.", "uzor": "Britanija je bila pomorska i kolonijalna sila, pa je višak robe prodavala po celom svetu. Iz kolonija je dobijala jeftin pamuk, pa su pamučne tkanine bile jeftine i tražene. Veliki prihod od njih vlasnici radionica uložili su u nove fabrike.", "ideje": ["Pomorska i kolonijalna sila, trgovina na svim kontinentima.", "Jeftin pamuk sa plantaža u kolonijama.", "Pamučne tkanine najtraženije zbog cene.", "Prihod uložen u razvoj proizvodnje i fabrike."], "objasnjenje": "Trgovina, sirovine i kapital zajedno su stvorili uslove za mašine i fabrike.", "iz_udzbenika": {"strana": 29, "odeljak": "Uzroci industrijske revolucije", "tekst": "Lekcija navodi trgovinu, jeftin pamuk iz kolonija i ulaganje prihoda u fabrike kao uzroke."}}, {"id": "uzr-objasni-robovi", "vrsta": "objasni", "tezina": "tesko", "pojmovi": ["robovlasnistvo", "pamuk", "kolonija", "fabrika"], "pitanje": "Kako su rad robova na plantažama i bogatstvo britanskih fabrika bili povezani? Objasni svojim rečima.", "uzor": "Robovi na plantažama u kolonijama nisu bili plaćeni, pa je sirovi pamuk bio jeftin. Od jeftinog pamuka britanske radionice su pravile jeftine tkanine koje su se dobro prodavale. Prihod od te prodaje uložen je u fabrike — industrijsko bogatstvo počivalo je i na ropstvu.", "ideje": ["Robovi su gajili pamuk na plantažama u kolonijama.", "Zato je sirovina bila jeftina.", "Jeftine tkanine su donele veliki prihod.", "Prihod je uložen u fabrike."], "objasnjenje": "Lanac vodi od plantaže do fabrike — tuđa neslobodna radna snaga omogućila je britansku zaradu.", "iz_udzbenika": {"strana": 29, "odeljak": "Uzroci industrijske revolucije", "tekst": "Jeftin pamuk sa plantaža na kojima rade crni robovi prerađuje se u britanskim radionicama i donosi veliki prihod."}}]}, {"naslov": "Pojava parne mašine", "zadaci": [{"id": "par-izbor-cunak", "vrsta": "izbor", "tezina": "lako", "pojmovi": ["leteci-cunak", "dzon-kej"], "pitanje": "Šta je ubrzao „leteći čunak” Džona Keja?", "odgovori": [{"tekst": "Tkanje", "tacan": true}, {"tekst": "Kopanje uglja", "tacan": false, "zasto": "U rudnicima su korišćene parne mašine za ispumpavanje vode; čunak je deo tkačkog posla."}, {"tekst": "Vožnju vagona", "tacan": false, "zasto": "Vagone je kasnije vukla Stivensonova lokomotiva."}, {"tekst": "Topljenje gvožđa", "tacan": false, "zasto": "Proizvodnja gvožđa se razvijala odvojeno; čunak služi za tkanje."}], "pomoc": ["Čunak je deo tkačkog posla.", "Posle njega je trebalo brže praviti konac — za šta?", "Iz lekcije: leteći čunak je ubrzao tkanje."], "objasnjenje": "Leteći čunak je ubrzao tkanje, pa je odjednom trebalo mnogo više konca.", "iz_udzbenika": {"strana": 29, "odeljak": "Pojava parne mašine", "tekst": "Leteći čunak Džona Keja ubrzao je tkanje, pa je trebalo brže praviti konac."}}, {"id": "par-izbor-zasto-prekretnica", "vrsta": "izbor", "tezina": "srednje", "pojmovi": ["parna-masina", "dzejms-vat"], "pitanje": "Zašto je Vatova parna mašina bila prekretnica, iako joj je snaga u početku bila skromna?", "odgovori": [{"tekst": "Trošila je dve trećine goriva manje od prethodnih mašina", "tacan": true}, {"tekst": "Bila je prva parna mašina uopšte", "tacan": false, "zasto": "Primitivne parne mašine u rudnicima postojale su već krajem XVII veka."}, {"tekst": "Mogla je da radi bez ikakvog goriva", "tacan": false, "zasto": "I Vatova mašina troši gorivo (ugalj) — samo mnogo manje."}, {"tekst": "Odmah je pokretala lokomotive i brodove", "tacan": false, "zasto": "Za vozila je primenjena tek kasnije — lokomotiva 1814, parobrod 1807."}], "pomoc": ["Nije bila jača — u čemu je onda bila bolja?", "Misli na troškove rada mašine.", "Iz lekcije: troši dve trećine goriva manje od prethodnih modela."], "objasnjenje": "Ušteda goriva učinila je paru isplativom svuda — u rudnicima, radionicama i proizvodnji tkanina.", "iz_udzbenika": {"strana": 29, "odeljak": "Pojava parne mašine", "tekst": "Snaga Vatove mašine je u početku skromna, ali troši dve trećine goriva manje od prethodnih.", "slika": "03-industrijska-revolucija/03-parna-masina-dzejmsa-vata.jpg"}, "osa": {"naziv": "Vatova parna mašina", "od": 1769, "traka": "pronalasci"}}, {"id": "par-izbor-gde-koriscena", "vrsta": "izbor", "tezina": "srednje", "pojmovi": ["parna-masina", "rudarstvo", "tekstilna-industrija"], "pitanje": "Gde se Vatova parna mašina koristila u prvo vreme? (više tačnih)", "odgovori": [{"tekst": "U rudnicima", "tacan": true}, {"tekst": "Za pokretanje mašina za obradu drveta i metala", "tacan": true}, {"tekst": "U proizvodnji tkanina", "tacan": true}, {"tekst": "Za pokretanje automobila", "tacan": false, "zasto": "Automobili nisu deo ove lekcije; para se kasnije primenila na lokomotive i parobrode."}, {"tekst": "Samo na plantažama pamuka", "tacan": false, "zasto": "Na plantažama su radili robovi; mašina je radila u Britaniji — u rudnicima i radionicama."}], "pomoc": ["Tri mesta: ispod zemlje, u radionici, u najrazvijenijoj grani.", "Najrazvijenija grana britanske proizvodnje bile su tkanine.", "Iz lekcije: rudnici, mašine za drvo i metal, proizvodnja tkanina."], "objasnjenje": "Vatova mašina je radila u rudnicima, pokretala mašine za drvo i metal i ubrzo ušla u proizvodnju tkanina.", "iz_udzbenika": {"strana": 29, "odeljak": "Pojava parne mašine", "tekst": "Vatova mašina se koristi u rudnicima, za mašine za obradu drveta i metala i u proizvodnji tkanina."}}, {"id": "par-tn-gvozdje", "vrsta": "tacno_netacno", "tezina": "lako", "pojmovi": ["gvozdje"], "tvrdnja": "Krajem XVIII veka gvožđe je počelo da se koristi i u gradnji mostova i brodova.", "tacno": true, "pomoc": ["Za šta se sve koristilo gvožđe kad ga je bilo više?", "Iz lekcije: alati, oružje, mašine, a zatim mostovi i brodovi."], "objasnjenje": "Tačno — bolja i brža proizvodnja gvožđa omogućila je da se od njega grade i mostovi i brodovi.", "iz_udzbenika": {"strana": 29, "odeljak": "Pojava parne mašine", "tekst": "Do kraja XVIII veka proizvodnja gvožđa je ubrzana; koristi se za alate, oružje, mašine, mostove i brodove."}}, {"id": "par-tn-snaga", "vrsta": "tacno_netacno", "tezina": "srednje", "pojmovi": ["parna-masina", "dzejms-vat"], "tvrdnja": "Vatova parna mašina je od početka bila mnogo snažnija od svih prethodnih.", "tacno": false, "ispravke": [{"tekst": "Snaga joj je u početku bila skromna, ali je trošila mnogo manje goriva.", "tacan": true}, {"tekst": "Bila je slabija, pa se nije nigde koristila.", "tacan": false, "zasto": "Koristila se u rudnicima, za mašine za drvo i metal i u proizvodnji tkanina."}, {"tekst": "Bila je snažnija, ali je trošila više goriva.", "tacan": false, "zasto": "Obrnuto — trošila je dve trećine goriva manje."}], "pomoc": ["Prednost nije bila u snazi.", "Iz lekcije: snaga skromna, gorivo dve trećine manje."], "objasnjenje": "Vatova prednost bila je štedljivost, ne snaga.", "iz_udzbenika": {"strana": 29, "odeljak": "Pojava parne mašine", "tekst": "Snaga mašine je u početku skromna, ali je štedljiva."}}, {"id": "par-tn-primitivne", "vrsta": "tacno_netacno", "tezina": "srednje", "pojmovi": ["parna-masina", "rudarstvo"], "tvrdnja": "Parne mašine nisu postojale pre Džejmsa Vata.", "tacno": false, "ispravke": [{"tekst": "Već krajem XVII veka primitivne parne mašine ispumpavale su vodu iz rudnika.", "tacan": true}, {"tekst": "Pre Vata parne mašine su vukle vagone u rudnicima.", "tacan": false, "zasto": "Vagone sa rudom kasnije vuče Stivensonova lokomotiva (1814); starije mašine su ispumpavale vodu."}, {"tekst": "Pre Vata parne mašine su pokretale parobrode.", "tacan": false, "zasto": "Parobrodi se javljaju krajem XVIII veka i 1807, posle Vata."}], "pomoc": ["Šta je Vat zapravo uradio — izmislio ili poboljšao?", "Iz lekcije: krajem XVII veka, ispumpavanje vode iz rudnika."], "objasnjenje": "Vat nije izmislio paru — poboljšao je mašinu tako da troši mnogo manje goriva.", "iz_udzbenika": {"strana": 29, "odeljak": "Pojava parne mašine", "tekst": "Već krajem XVII veka primitivne parne mašine služe za ispumpavanje vode iz rudnika."}}, {"id": "par-dopuni-vat", "vrsta": "dopuni", "tezina": "lako", "pojmovi": ["parna-masina", "dzejms-vat"], "pitanje": "Dopuni rečenicu.", "tekst": "Parnu mašinu je {{1769}}. napravio {{Džejms Vat|Vat}}; trošila je {{dve trećine}} goriva manje od prethodnih.", "ponudjene": ["1769", "1814", "Džejms Vat", "Robert Fulton", "dve trećine", "polovinu"], "pomoc": ["Godina je u drugoj polovini XVIII veka.", "Iz lekcije: Džejms Vat, 1769, dve trećine goriva manje."], "objasnjenje": "Džejms Vat, 1769 — mašina koja štedi gorivo.", "iz_udzbenika": {"strana": 29, "odeljak": "Pojava parne mašine", "tekst": "Parna mašina Džejmsa Vata iz 1769. troši dve trećine goriva manje."}, "osa": {"naziv": "Vatova parna mašina", "od": 1769, "traka": "pronalasci"}}, {"id": "par-dopuni-grane", "vrsta": "dopuni", "tezina": "srednje", "pojmovi": ["prva-industrijska-revolucija", "tekstilna-industrija", "metalna-industrija", "masinska-industrija", "saobracaj"], "pitanje": "Dopuni rečenicu.", "tekst": "Prva industrijska revolucija, zasnovana na {{parnoj mašini}}, donela je pored tekstilne i razvoj {{metalne}} i {{mašinske}} industrije, a naročito {{saobraćaja}}.", "ponudjene": ["parnoj mašini", "metalne", "mašinske", "saobraćaja", "poljoprivrede", "električnoj struji", "hemijske"], "pomoc": ["Dve grane industrije prave metal i mašine.", "Lokomotiva i parobrod spadaju u koju oblast?", "Iz lekcije: tekstilna, metalna, mašinska industrija i saobraćaj."], "objasnjenje": "Para je pokrenula tekstil, metalnu i mašinsku industriju i — najvidljivije — saobraćaj.", "iz_udzbenika": {"strana": 29, "odeljak": "Pojava parne mašine", "tekst": "Revolucija zasnovana na parnoj mašini donela je razvoj tekstilne, metalne i mašinske industrije i saobraćaja."}}, {"id": "par-dopuni-gorivo", "vrsta": "dopuni", "tezina": "tesko", "pojmovi": ["kameni-ugalj", "rudarstvo", "parna-masina"], "pitanje": "Dopuni rečenice (bez ponuđenih reči).", "tekst": "Zbog nedostatka {{šuma|šume}} glavno čvrsto gorivo u Britaniji postaje {{kameni ugalj|ugalj}}. Već krajem XVII veka primitivne parne mašine služile su za ispumpavanje {{vode}} iz {{rudnika}}.", "pomoc": ["Čega je nedostajalo, pa nije bilo dovoljno drva?", "Šta se kopa iz zemlje i gori?", "Iz lekcije: nedostatak šuma → kameni ugalj; parne mašine ispumpavaju vodu iz rudnika."], "objasnjenje": "Bez šuma nema drva, pa ugalj postaje gorivo; a rudnici uglja su prvo mesto gde se para koristila.", "iz_udzbenika": {"strana": 29, "odeljak": "Pojava parne mašine", "tekst": "Zbog nedostatka šuma glavno gorivo je kameni ugalj; primitivne parne mašine ispumpavaju vodu iz rudnika."}}, {"id": "par-povezi-pronalasci", "vrsta": "povezi", "tezina": "lako", "pojmovi": ["dzon-kej", "dzejms-vat", "dzordz-stivenson", "robert-fulton"], "pitanje": "Poveži pronalazača sa pronalaskom.", "parovi": [["Džon Kej", "leteći čunak"], ["Džejms Vat", "parna mašina"], ["Džordž Stivenson", "parna lokomotiva"], ["Robert Fulton", "parobrod"]], "pomoc": ["Jedan je Amerikanac i vezan je za vodu.", "Iz lekcije: Kej – čunak, Vat – mašina, Stivenson – lokomotiva, Fulton – parobrod."], "objasnjenje": "Kej (tkanje), Vat (para), Stivenson (železnica), Fulton (brodovi).", "iz_udzbenika": {"strana": 29, "odeljak": "Pojava parne mašine; Razvoj saobraćaja", "tekst": "Lekcija navodi Keja, Vata, Stivensona i Fultona kao pronalazače."}}, {"id": "par-povezi-materijali", "vrsta": "povezi", "tezina": "srednje", "pojmovi": ["kameni-ugalj", "gvozdje", "predilica", "parna-masina"], "pitanje": "Poveži materijal ili izvor snage sa njegovom ulogom.", "parovi": [["Kameni ugalj", "glavno čvrsto gorivo"], ["Gvožđe", "alati, oružje, mašine, mostovi i brodovi"], ["Snaga vode", "pokreće predilice"], ["Para", "pokreće Vatovu mašinu"]], "pomoc": ["Šta gori, od čega se gradi, šta okreće točak predilice?", "Iz lekcije: ugalj = gorivo; gvožđe = alati, mašine, mostovi; voda = predilice."], "objasnjenje": "Ugalj daje toplotu, para pokreće mašine, voda je pokretala predilice, a gvožđe je materijal za mašine i gradnju.", "iz_udzbenika": {"strana": 29, "odeljak": "Pojava parne mašine", "tekst": "Predilice pokreće i snaga vode, kameni ugalj postaje gorivo, a gvožđe se koristi za alate, mašine, mostove i brodove."}}, {"id": "par-lanac-cunak", "vrsta": "lanac", "tezina": "lako", "pojmovi": ["leteci-cunak", "predilica", "dzon-kej"], "karike": ["Leteći čunak Džona Keja ubrzava tkanje", "?", "Predilice počinje da pokreće snaga vode"], "praznina": 1, "odgovori": [{"tekst": "Potrebno je mnogo brže praviti konac", "tacan": true}, {"tekst": "Tkanine postaju skuplje", "tacan": false, "zasto": "Brže tkanje vodi jeftinijoj proizvodnji, a ne skupljoj; ovde je problem što nema dovoljno konca."}, {"tekst": "Zatvaraju se rudnici", "tacan": false, "zasto": "Rudnici se razvijaju zbog potrebe za metalima; ovaj lanac je o tkanju i predenju."}, {"tekst": "Radnici lome razboje", "tacan": false, "zasto": "Lomljenje mašina je kasnija pobuna radnika, ne korak između tkanja i predenja."}], "pomoc": ["Korak 1: Da bi se tkalo, potreban je konac.", "Korak 2: Ako tkanje ide brže, čega ponestaje?", "Iz lekcije: brže tkanje → potreba za bržom izradom konca → predilice na vodu."], "objasnjenje": "Jedan pronalazak stvara potrebu za drugim — brže tkanje traži brže predenje.", "iz_udzbenika": {"strana": 29, "odeljak": "Pojava parne mašine", "tekst": "Leteći čunak ubrzava tkanje, javlja se potreba za bržom izradom konca, pa predilice pokreće i voda."}}, {"id": "par-lanac-rudnici", "vrsta": "lanac", "tezina": "lako", "pojmovi": ["rudarstvo", "parna-masina"], "karike": ["Raste potreba za metalima", "?", "Primitivne parne mašine ispumpavaju vodu iz rudnika"], "praznina": 1, "odgovori": [{"tekst": "Razvija se rudarstvo", "tacan": true}, {"tekst": "Grade se parobrodi", "tacan": false, "zasto": "Parobrodi su kasniji (1807) i vezani su za vodeni saobraćaj, ne za rudnike."}, {"tekst": "Uvozi se pamuk iz kolonija", "tacan": false, "zasto": "Pamuk je sirovina za tkanine, a metali se vade iz rudnika."}, {"tekst": "Sade se nove šume", "tacan": false, "zasto": "Lekcija govori o nedostatku šuma, a ne o sadnji; metali se dobijaju iz rudnika."}], "pomoc": ["Korak 1: Odakle se dobijaju metali?", "Korak 2: Šta smeta kopanju duboko pod zemljom?", "Iz lekcije: potreba za metalima → rudarstvo → parne mašine za ispumpavanje vode."], "objasnjenje": "Metali traže rudnike, a duboke rudnike plavi voda — zato su prve parne mašine radile u rudnicima.", "iz_udzbenika": {"strana": 29, "odeljak": "Pojava parne mašine", "tekst": "Zbog potrebe za metalima razvija se rudarstvo; primitivne parne mašine ispumpavaju vodu iz rudnika."}}, {"id": "par-lanac-vat", "vrsta": "lanac", "tezina": "srednje", "pojmovi": ["parna-masina", "dzejms-vat", "prva-industrijska-revolucija"], "karike": ["Vat 1769. pravi parnu mašinu koja štedi gorivo", "?", "Razvijaju se tekstilna, metalna i mašinska industrija i saobraćaj"], "praznina": 1, "odgovori": [{"tekst": "Počinje Prva industrijska revolucija, zasnovana na pari", "tacan": true}, {"tekst": "Počinje manufakturna proizvodnja", "tacan": false, "zasto": "Manufakture postoje od XVI veka; Vatova mašina ih upravo potiskuje."}, {"tekst": "Ukida se ropstvo na plantažama", "tacan": false, "zasto": "Lekcija ne povezuje Vatovu mašinu sa ukidanjem ropstva."}, {"tekst": "Prestaje upotreba uglja", "tacan": false, "zasto": "Parna mašina radi na ugalj — njegova upotreba raste."}], "pomoc": ["Korak 1: Kako lekcija naziva doba koje počinje Vatovim pronalaskom?", "Korak 2: Na čemu je to doba zasnovano?", "Iz lekcije: Vatov pronalazak označio je početak Prve industrijske revolucije."], "objasnjenje": "Vatova mašina je pokrenula Prvu industrijsku revoluciju, a ona je razvila mnoge grane industrije i saobraćaj.", "iz_udzbenika": {"strana": 29, "odeljak": "Pojava parne mašine", "tekst": "Vatov pronalazak označio je početak Prve industrijske revolucije zasnovane na parnoj mašini."}, "osa": {"naziv": "Vatova parna mašina", "od": 1769, "traka": "pronalasci"}}, {"id": "par-lanac-gvozdje", "vrsta": "lanac", "tezina": "srednje", "pojmovi": ["gvozdje", "kameni-ugalj", "rudarstvo"], "karike": ["U Britaniji nedostaje šuma", "?", "Rudarstvo dobija još veći značaj"], "praznina": 1, "odgovori": [{"tekst": "Kameni ugalj postaje glavno čvrsto gorivo", "tacan": true}, {"tekst": "Gvožđe se prestaje koristiti", "tacan": false, "zasto": "Upotreba gvožđa je rasla — za alate, mašine, mostove i brodove."}, {"tekst": "Pamuk zamenjuje drvo kao gorivo", "tacan": false, "zasto": "Pamuk je sirovina za tkanine, ne gorivo."}, {"tekst": "Fabrike se sele u kolonije", "tacan": false, "zasto": "Fabrike su ostale u Britaniji, blizu luka i rudnika."}], "pomoc": ["Korak 1: Ako nema drva, šta se loži?", "Korak 2: Odakle se to gorivo vadi?", "Iz lekcije: zbog nedostatka šuma glavno gorivo postaje kameni ugalj."], "objasnjenje": "Nedostatak šuma → ugalj kao gorivo → ugalj se vadi iz rudnika, pa rudarstvo raste.", "iz_udzbenika": {"strana": 29, "odeljak": "Pojava parne mašine", "tekst": "Zbog nedostatka šuma glavno čvrsto gorivo postaje kameni ugalj."}}, {"id": "par-lanac-niz", "vrsta": "lanac", "tezina": "tesko", "pojmovi": ["parna-masina", "prva-industrijska-revolucija", "saobracaj"], "karike": ["Vatova mašina troši mnogo manje goriva", "?", "Pronalazači pokušavaju da je upotrebe i za vozila", "Nastaju lokomotiva i parobrod"], "praznina": 1, "odgovori": [{"tekst": "Mašina se širi iz rudnika u radionice i proizvodnju tkanina", "tacan": true}, {"tekst": "Mašina se zabranjuje u Britaniji", "tacan": false, "zasto": "Zakoni su kažnjavali lomljenje mašina, a ne njihovu upotrebu."}, {"tekst": "Radnici prestaju da rade u fabrikama", "tacan": false, "zasto": "Fabrike se umnožavaju i zapošljavaju sve više ljudi sa sela."}, {"tekst": "Ponovo se gradi više manufaktura", "tacan": false, "zasto": "Mašina potiskuje manufakture, a ne obnavlja ih."}], "pomoc": ["Korak 1: Ako je mašina jeftinija za rad, šta se dešava sa njenom upotrebom?", "Korak 2: Gde je sve radila pre nego što je stavljena na vozila?", "Iz lekcije: rudnici, mašine za drvo i metal, proizvodnja tkanina — pa pokušaji sa vozilima."], "objasnjenje": "Ušteda goriva proširila je upotrebu pare; kad se pokazala svuda, pronalazači su je stavili na kola i brodove.", "iz_udzbenika": {"strana": 29, "odeljak": "Pojava parne mašine; Razvoj saobraćaja", "tekst": "Vatova mašina se širi u rudnike i tkanje; bilo je i više pokušaja da pokreće vozila."}}, {"id": "par-zakljuci-ugalj", "vrsta": "zakljuci", "tezina": "lako", "pojmovi": ["kameni-ugalj"], "pitanje": "Zašto je u Britaniji kameni ugalj postao glavno čvrsto gorivo?", "odgovori": [{"tekst": "Zato što je nedostajalo šuma, pa i drva", "tacan": true}, {"tekst": "Zato što je bio uvožen iz kolonija", "tacan": false, "zasto": "Iz kolonija je stizao pamuk; ugalj se vadio iz britanskih rudnika."}, {"tekst": "Zato što ga je propisao parlament", "tacan": false, "zasto": "Parlament je donosio zakone o mašinama i radu dece, ne o gorivu."}, {"tekst": "Zato što ne proizvodi dim", "tacan": false, "zasto": "Ugalj stvara mnogo dima — zato su fabrički gradovi bili zadimljeni i zagađeni."}], "pomoc": ["Korak 1: Šta se ložilo pre uglja?", "Korak 2: Zašto toga nije bilo dovoljno?", "Iz lekcije: zbog nedostatka šuma."], "objasnjenje": "Nedostatak šuma je naterao Britance da lože ugalj — što je dalje razvilo rudarstvo.", "iz_udzbenika": {"strana": 29, "odeljak": "Pojava parne mašine", "tekst": "Zbog nedostatka šuma glavno čvrsto gorivo postaje kameni ugalj."}}, {"id": "par-zakljuci-prekretnica", "vrsta": "zakljuci", "tezina": "srednje", "pojmovi": ["parna-masina", "dzejms-vat", "prva-industrijska-revolucija"], "pitanje": "Parne mašine su postojale i ranije. Zašto se baš Vatova smatra početkom Prve industrijske revolucije?", "odgovori": [{"tekst": "Zato što je bila štedljiva, pa se isplatila u mnogim granama, a ne samo u rudnicima", "tacan": true}, {"tekst": "Zato što je bila najveća mašina u Evropi", "tacan": false, "zasto": "Lekcija ne meri veličinu; važna je ušteda od dve trećine goriva."}, {"tekst": "Zato što je Vat bio kralj Britanije", "tacan": false, "zasto": "Vat je bio pronalazač, ne vladar."}, {"tekst": "Zato što je odmah bila jača od svih drugih", "tacan": false, "zasto": "Snaga joj je u početku bila skromna."}], "pomoc": ["Korak 1: Gde su radile starije parne mašine? (samo u rudnicima)", "Korak 2: Šta je Vatovu mašinu učinilo isplativom i drugde?", "Iz lekcije: 2/3 manje goriva → rudnici, mašine za drvo i metal, tkanine."], "objasnjenje": "Prednost nije bila sama para nego ušteda — tek tada se mašina isplatila u celoj privredi.", "iz_udzbenika": {"strana": 29, "odeljak": "Pojava parne mašine", "tekst": "Vatova mašina troši 2/3 manje goriva i širi se iz rudnika u proizvodnju tkanina; označila je početak revolucije."}, "osa": {"naziv": "Vatova parna mašina", "od": 1769, "traka": "pronalasci"}}, {"id": "par-zakljuci-niz", "vrsta": "zakljuci", "tezina": "tesko", "pojmovi": ["leteci-cunak", "predilica", "parna-masina"], "pitanje": "Šta priča o letećem čunku i predilicama pokazuje o tome kako su nastajali pronalasci u industrijskoj revoluciji?", "odgovori": [{"tekst": "Jedan pronalazak stvara novu potrebu, a ona podstiče sledeći pronalazak", "tacan": true}, {"tekst": "Svi pronalasci su nastali iste godine, nezavisno jedan od drugog", "tacan": false, "zasto": "Nastajali su postepeno: čunak, pa predilice na vodu, pa para."}, {"tekst": "Pronalasci su dolazili iz kolonija", "tacan": false, "zasto": "Iz kolonija je dolazila sirovina; pronalazači su bili britanski (i Fulton iz Amerike)."}, {"tekst": "Pronalasci su usporili proizvodnju tkanina", "tacan": false, "zasto": "Ubrzali su je — prvo tkanje, pa predenje."}], "pomoc": ["Korak 1: Šta je čunak promenio u tkanju?", "Korak 2: Kakav je problem time nastao kod konca?", "Korak 3: Kako je problem rešen? Iz lekcije: predilice na snagu vode."], "objasnjenje": "Brže tkanje je tražilo brže predenje, ono veću snagu — pronalasci su se nadovezivali jedan na drugi.", "iz_udzbenika": {"strana": 29, "odeljak": "Pojava parne mašine", "tekst": "Leteći čunak ubrzava tkanje, pa nastaje potreba za bržom izradom konca i predilicama na vodu."}}, {"id": "par-ko-sam-vat", "vrsta": "ko_sam", "tezina": "lako", "pojmovi": ["dzejms-vat", "parna-masina"], "tragovi": ["Moju mašinu danas možeš videti u muzeju — ima ogroman zamajac.", "Moja mašina u početku nije bila snažna, ali je trošila dve trećine goriva manje.", "Moj pronalazak iz 1769. smatra se početkom Prve industrijske revolucije."], "odgovori": [{"tekst": "Džejms Vat", "tacan": true}, {"tekst": "Džordž Stivenson", "tacan": false, "zasto": "Stivensonov pronalazak je lokomotiva iz 1814, a ne mašina iz 1769."}, {"tekst": "Džon Kej", "tacan": false, "zasto": "Kej je izumeo leteći čunak za tkanje."}, {"tekst": "Ned Lud", "tacan": false, "zasto": "Ned Lud nije pronalazač — on je u znak protesta polomio razboj."}], "objasnjenje": "To je Džejms Vat; njegova parna mašina (1769) pokrenula je industrijsku revoluciju.", "iz_udzbenika": {"strana": 29, "odeljak": "Pojava parne mašine", "tekst": "Fotografija prikazuje Vatovu parnu mašinu kao muzejski eksponat.", "slika": "03-industrijska-revolucija/03-parna-masina-dzejmsa-vata.jpg"}}, {"id": "par-ko-sam-kej", "vrsta": "ko_sam", "tezina": "srednje", "pojmovi": ["dzon-kej", "leteci-cunak"], "tragovi": ["Bio sam britanski pronalazač u XVIII veku, pre Vatove mašine.", "Zbog mog pronalaska tkači su odjednom trošili mnogo više konca.", "Izumeo sam „leteći čunak”."], "odgovori": [{"tekst": "Džon Kej", "tacan": true}, {"tekst": "Džejms Vat", "tacan": false, "zasto": "Vat je unapredio parnu mašinu, a ne tkački pribor."}, {"tekst": "Robert Fulton", "tacan": false, "zasto": "Fulton je američki pronalazač parobroda."}, {"tekst": "Ned Lud", "tacan": false, "zasto": "Ned Lud je radnik koji je polomio razboj, a ne pronalazač."}], "objasnjenje": "Džon Kej je izumeo leteći čunak, koji je ubrzao tkanje i stvorio potrebu za bržim predenjem.", "iz_udzbenika": {"strana": 29, "odeljak": "Pojava parne mašine", "tekst": "Leteći čunak Džona Keja ubrzao je tkanje."}}, {"id": "par-datum-vat", "vrsta": "datum", "tezina": "lako", "pojmovi": ["parna-masina", "dzejms-vat"], "dogadjaj": "Vatova parna mašina", "pitanje": "Koje godine je Džejms Vat napravio svoju parnu mašinu?", "godina": 1769, "traka": "pronalasci", "pomoc": ["Druga polovina XVIII veka.", "Kraj sedme decenije veka — 176…", "Iz lekcije: 1769."], "objasnjenje": "1769 — godina Vatove mašine i početak Prve industrijske revolucije.", "iz_udzbenika": {"strana": 29, "odeljak": "Pojava parne mašine", "tekst": "Parna mašina Džejmsa Vata je iz 1769."}}, {"id": "par-izvor-vat", "vrsta": "izvor", "tezina": "lako", "pojmovi": ["parna-masina", "dzejms-vat"], "izvor": {"autor": "Fotografija muzejskog eksponata", "naslov": "Parna mašina Džejmsa Vata", "tekst": "U muzejskoj dvorani stoji velika metalna mašina sa ogromnim točkom-zamajcem. Udžbenik navodi da je to parna mašina Džejmsa Vata.", "napomena": "Opis fotografije je prepričan; udžbenik, str. 29."}, "pitanje": "Kakav je ovaj izvor i šta nam pokazuje?", "odgovori": [{"tekst": "To je sačuvan predmet (mašina) koji pokazuje kako je izgledao pronalazak iz 1769", "tacan": true}, {"tekst": "To je pismo u kome Vat opisuje svoj život", "tacan": false, "zasto": "Na fotografiji je predmet, a ne pisani tekst."}, {"tekst": "To je karta Britanije sa rudnicima", "tacan": false, "zasto": "Karta je drugi izvor u lekciji (str. 28); ovde je mašina."}, {"tekst": "To je slika radnika koji lome mašine", "tacan": false, "zasto": "To je ilustracija ludita na str. 32; ovde je cela mašina u muzeju."}], "pomoc": ["Šta se čuva u muzeju — tekst ili predmet?", "Šta možemo da vidimo na samom predmetu?", "Iz lekcije: fotografija Vatove mašine, muzejskog eksponata."], "objasnjenje": "Sačuvana mašina je predmet iz prošlosti — po njoj vidimo veličinu i izgled Vatovog pronalaska.", "iz_udzbenika": {"strana": 29, "odeljak": "Pojava parne mašine", "tekst": "Fotografija prikazuje Vatovu parnu mašinu izloženu u muzeju.", "slika": "03-industrijska-revolucija/03-parna-masina-dzejmsa-vata.jpg"}}, {"id": "par-uporedi-kej-vat", "vrsta": "uporedi", "tezina": "srednje", "pojmovi": ["dzon-kej", "dzejms-vat", "leteci-cunak", "parna-masina"], "a": "Džon Kej", "b": "Džejms Vat", "pitanje": "Na koga se odnosi tvrdnja — Keja, Vata, obojicu ili nijednog?", "tvrdnje": [{"tekst": "Njegov pronalazak je ubrzao tkanje.", "odgovor": "a", "zasto": "Leteći čunak Džona Keja ubrzao je tkanje."}, {"tekst": "Njegov pronalazak troši dve trećine goriva manje od starijih.", "odgovor": "b", "zasto": "To je Vatova parna mašina iz 1769."}, {"tekst": "Bio je britanski pronalazač XVIII veka.", "odgovor": "oba", "zasto": "I Kej i Vat su britanski pronalazači XVIII veka."}, {"tekst": "Njegov pronalazak označava početak Prve industrijske revolucije.", "odgovor": "b", "zasto": "Lekcija početak revolucije vezuje za Vatovu mašinu."}, {"tekst": "Prikazao je parobrod na reci Hadson.", "odgovor": "nijedan", "zasto": "Parobrod Klermont je prikazao Amerikanac Robert Fulton 1807."}], "pomoc": ["Jedan je vezan za tkanje, drugi za paru.", "Parobrod nije ni od jednog od njih.", "Iz lekcije: Kej – leteći čunak; Vat – parna mašina 1769."], "objasnjenje": "Kej je ubrzao tkanje, Vat je dao štedljivu parnu mašinu; parobrod je Fultonov.", "iz_udzbenika": {"strana": 29, "odeljak": "Pojava parne mašine", "tekst": "Kej je ubrzao tkanje letećim čunkom, a Vat je 1769. napravio štedljivu parnu mašinu."}}, {"id": "par-objasni-prekretnica", "vrsta": "objasni", "tezina": "srednje", "pojmovi": ["parna-masina", "dzejms-vat", "prva-industrijska-revolucija"], "pitanje": "Zašto se Vatova parna mašina smatra prekretnicom? Objasni svojim rečima.", "uzor": "Starije parne mašine su samo ispumpavale vodu iz rudnika. Vatova mašina iz 1769. trošila je dve trećine goriva manje, pa se isplatila i u radionicama i u proizvodnji tkanina. Na njoj je zasnovana Prva industrijska revolucija, koja je razvila industriju i saobraćaj.", "ideje": ["Parne mašine su postojale i ranije (rudnici).", "Vatova troši dve trećine goriva manje.", "Zato se proširila u druge grane (tkanine, drvo, metal).", "Na njoj se zasniva Prva industrijska revolucija i razvoj saobraćaja."], "objasnjenje": "Prekretnica nije sama para nego isplativost pare.", "iz_udzbenika": {"strana": 29, "odeljak": "Pojava parne mašine", "tekst": "Vatova mašina štedi gorivo, širi se u proizvodnju i označava početak revolucije."}, "osa": {"naziv": "Vatova parna mašina", "od": 1769, "traka": "pronalasci"}}, {"id": "par-objasni-niz", "vrsta": "objasni", "tezina": "tesko", "pojmovi": ["leteci-cunak", "predilica", "rudarstvo", "kameni-ugalj", "parna-masina"], "pitanje": "Pokaži na jednom primeru iz lekcije kako je jedna promena izazvala sledeću, sve do parne mašine.", "uzor": "Leteći čunak je ubrzao tkanje, pa je trebalo brže praviti konac; zato su predilice pokretane snagom vode. Slično, potreba za metalima razvila je rudarstvo, a rudnike je trebalo čistiti od vode — tu su radile prve parne mašine. Pošto nije bilo dovoljno šuma, gorivo je postao ugalj iz tih istih rudnika.", "ideje": ["Brže tkanje → potreba za koncem → predilice na vodu.", "Potreba za metalima → rudarstvo → parne mašine za vodu.", "Nedostatak šuma → kameni ugalj.", "Promene se nadovezuju jedna na drugu."], "objasnjenje": "Industrijska revolucija je niz povezanih koraka, a ne jedan izum.", "iz_udzbenika": {"strana": 29, "odeljak": "Pojava parne mašine", "tekst": "Lekcija opisuje kako čunak, rudarstvo, ugalj i gvožđe vode do Vatove mašine."}}]}, {"naslov": "Razvoj saobraćaja", "zadaci": [{"id": "sao-izbor-lokomotiva-rudnik", "vrsta": "izbor", "tezina": "srednje", "pojmovi": ["parna-lokomotiva", "rudarstvo", "zeleznica"], "pitanje": "Za šta se Stivensonova lokomotiva koristila u početku, pre javnog saobraćaja?", "odgovori": [{"tekst": "U rudnicima, za izvlačenje vagona sa rudom", "tacan": true}, {"tekst": "Za prevoz putnika između Londona i Pariza", "tacan": false, "zasto": "Između Britanije i kopna je more; prvi javni saobraćaj bio je na pruzi Stokton–Darlington 1825."}, {"tekst": "Za vuču brodova uz reku Hadson", "tacan": false, "zasto": "Na Hadsonu je plovio Fultonov parobrod Klermont."}, {"tekst": "Za pokretanje razboja u fabrikama", "tacan": false, "zasto": "Razboje i predilice pokretale su voda i parne mašine, a lokomotiva je vozilo."}], "pomoc": ["Prve parne mašine su radile na istom mestu.", "Šta se vadi i vozi u vagonima ispod zemlje?", "Iz lekcije: u rudnicima, za izvlačenje vagona sa rudom; od 1825. u javnom saobraćaju."], "objasnjenje": "Lokomotiva je prvo radila u rudnicima, a od 1825. prevozi i javnost.", "iz_udzbenika": {"strana": 30, "odeljak": "Razvoj saobraćaja", "tekst": "U početku se lokomotiva koristila u rudnicima za izvlačenje vagona sa rudom, a od 1825. u javnom saobraćaju."}}, {"id": "sao-izbor-jedrenjaci", "vrsta": "izbor", "tezina": "lako", "pojmovi": ["parobrod", "jedrenjaci"], "pitanje": "Šta se dogodilo sa jedrenjacima od sredine XIX veka?", "odgovori": [{"tekst": "Parobrodi su ih potisnuli", "tacan": true}, {"tekst": "Postali su brži od parobroda", "tacan": false, "zasto": "Bilo je obrnuto — parobrodi su ih potisnuli."}, {"tekst": "Dobili su parne lokomotive", "tacan": false, "zasto": "Lokomotive voze po šinama; brodovi su dobili parne mašine i postali parobrodi."}, {"tekst": "Ostali su jedini prekomorski brodovi", "tacan": false, "zasto": "Od sredine XIX veka parobrodi preuzimaju prevoz."}], "pomoc": ["Šta se desi sa starom tehnikom kad stigne bolja?", "Prvi parobrodi su još imali jedra, ali kasnije…", "Iz lekcije: od sredine XIX veka parobrodi su potisnuli jedrenjake."], "objasnjenje": "Prvi parobrodi su koristili i jedra i paru, ali su od sredine XIX veka potpuno potisnuli jedrenjake.", "iz_udzbenika": {"strana": 31, "odeljak": "Razvoj saobraćaja", "tekst": "Od sredine XIX veka parobrodi potiskuju stare jedrenjake."}, "osa": {"naziv": "Parobrodi potiskuju jedrenjake", "od": 1850, "traka": "saobracaj"}}, {"id": "sao-izbor-tocak", "vrsta": "izbor", "tezina": "srednje", "pojmovi": ["parobrod", "klermont", "parna-masina"], "pitanje": "Zašto je Klermont imao veliki točak na boku i visok dimnjak?", "odgovori": [{"tekst": "Točak, pokretan parnom mašinom, gura brod kroz vodu; dimnjak odvodi dim od sagorevanja uglja", "tacan": true}, {"tekst": "Točak je služio za kočenje, a dimnjak za grejanje putnika", "tacan": false, "zasto": "Točak je pokretao brod napred; dim dolazi od uglja koji gori u parnoj mašini."}, {"tekst": "Točak je pokretala reka, a dimnjak je bio ukras", "tacan": false, "zasto": "Točak je okretala parna mašina; dimnjak je bio neophodan za odvod dima."}, {"tekst": "Točak je služio da brod vozi i po šinama", "tacan": false, "zasto": "Po šinama vozi lokomotiva; Klermont je samo plovio."}], "pomoc": ["Šta pokreće brod bez vesala?", "Šta gori u parnoj mašini i stvara dim?", "Iz lekcije: lopatični točak pokreće brod; dimnjak odvodi dim od uglja."], "objasnjenje": "Parna mašina okreće lopatični točak koji gura brod, a dim od uglja izlazi kroz dimnjak.", "iz_udzbenika": {"strana": 31, "odeljak": "Parobrod Klermont", "tekst": "Uz sliku Klermonta udžbenik pita čemu služe točak na boku i dimnjak.", "slika": "03-industrijska-revolucija/06-parobrod-klermont.jpg"}}, {"id": "sao-tn-konjska-vuca", "vrsta": "tacno_netacno", "tezina": "lako", "pojmovi": ["parna-lokomotiva", "zeleznica"], "tvrdnja": "Početkom XIX veka parna lokomotiva je zamenila konjsku vuču.", "tacno": true, "pomoc": ["Šta je vuklo vagone i kola pre lokomotive?", "Iz lekcije: lokomotiva je zamenila konjsku vuču."], "objasnjenje": "Tačno — zato su lokomotive i nazivane „gvozdenim konjima”.", "iz_udzbenika": {"strana": 30, "odeljak": "Znatiželja — takmičenje „gvozdenih konja”", "tekst": "Početkom XIX veka ubrzano se grade pruge, a lokomotiva zamenjuje konjsku vuču."}}, {"id": "sao-tn-fulton-prvi", "vrsta": "tacno_netacno", "tezina": "tesko", "pojmovi": ["klermont", "robert-fulton", "parobrod"], "tvrdnja": "Fultonov Klermont bio je prvi parobrod koji je ikada napravljen.", "tacno": false, "ispravke": [{"tekst": "Stariji parobrodi postojali su već krajem XVIII veka, ali je Fultonov prvi donosio finansijsku dobit.", "tacan": true}, {"tekst": "Prvi parobrod je napravio Stivenson 1814.", "tacan": false, "zasto": "Stivenson je 1814. napravio lokomotivu, a ne parobrod."}, {"tekst": "Prvi parobrod je napravljen sredinom XIX veka.", "tacan": false, "zasto": "Sredinom XIX veka parobrodi već potiskuju jedrenjake; najstariji su s kraja XVIII veka."}], "pomoc": ["Šta je bilo posebno kod Klermonta, ako nije bio prvi?", "Iz lekcije: najstariji parobrodi su s kraja XVIII veka; Fultonov je prvi donosio dobit."], "objasnjenje": "Fulton nije prvi napravio parobrod, ali je prvi pokazao da parobrod može da donosi zaradu.", "iz_udzbenika": {"strana": 31, "odeljak": "Parobrod Klermont", "tekst": "Najstariji parobrodi su s kraja XVIII veka, ali je Fultonov prvi donosio finansijsku dobit.", "slika": "03-industrijska-revolucija/06-parobrod-klermont.jpg"}, "osa": {"naziv": "Fultonov parobrod Klermont", "od": 1807, "traka": "saobracaj"}}, {"id": "sao-dopuni-fulton", "vrsta": "dopuni", "tezina": "lako", "pojmovi": ["robert-fulton", "parobrod", "klermont"], "pitanje": "Dopuni rečenicu.", "tekst": "Američki pronalazač {{Robert Fulton|Fulton}} prikazao je {{1807}}. {{parobrod}} Klermont.", "ponudjene": ["Robert Fulton", "Džejms Vat", "1807", "1825", "parobrod", "lokomotivu"], "pomoc": ["Pronalazač je Amerikanac, a izum plovi.", "Iz lekcije: Fulton, 1807, parobrod."], "objasnjenje": "Robert Fulton je 1807. prikazao parobrod Klermont.", "iz_udzbenika": {"strana": 31, "odeljak": "Razvoj saobraćaja", "tekst": "Američki pronalazač Robert Fulton prikazao je 1807. parobrod."}, "osa": {"naziv": "Fultonov parobrod Klermont", "od": 1807, "traka": "saobracaj"}}, {"id": "sao-dopuni-trka", "vrsta": "dopuni", "tezina": "srednje", "pojmovi": ["mancester-liverpul", "raketa", "dzordz-stivenson"], "pitanje": "Dopuni rečenice.", "tekst": "Kad je {{1829}}. dovršena pruga {{Mančester–Liverpul}}, organizovana je trka lokomotiva. Pobedila je Stivensonova {{Raketa}} brzinom od {{30}} km/h.", "ponudjene": ["1829", "1814", "Mančester–Liverpul", "Stokton–Darlington", "Raketa", "Klermont", "30", "48"], "pomoc": ["Trka je bila pre zvaničnog otvaranja pruge (1830).", "Na trci je brzina bila manja nego na otvaranju.", "Iz lekcije: 1829, Mančester–Liverpul, Raketa, 30 km/h."], "objasnjenje": "Na trci 1829. Raketa je postigla 30 km/h; na otvaranju 1830. čak 48 km/h.", "iz_udzbenika": {"strana": 30, "odeljak": "Znatiželja — takmičenje „gvozdenih konja”", "tekst": "Za prugu Mančester–Liverpul organizovana je trka lokomotiva 1829; Raketa je postigla 30 km/h."}, "osa": {"naziv": "Trka lokomotiva (Mančester–Liverpul)", "od": 1829, "traka": "saobracaj"}}, {"id": "sao-dopuni-otvaranje", "vrsta": "dopuni", "tezina": "tesko", "pojmovi": ["raketa", "mancester-liverpul"], "pitanje": "Dopuni rečenicu (bez ponuđenih reči; brojeve piši ciframa).", "tekst": "Na zvaničnom otvaranju pruge, 15. septembra {{1830}}, Raketa je postigla {{48}} km/h, što je više od {{4|četiri}} puta brže od poštanske kočije.", "pomoc": ["Otvaranje je bilo godinu dana posle trke.", "Brzina je bila veća nego na trci (30 km/h).", "Iz lekcije: 1830, 48 km/h, više od četiri puta brže od kočije."], "objasnjenje": "Godinu dana posle trke Raketa je išla 48 km/h — više od četiri puta brže od kočije.", "iz_udzbenika": {"strana": 30, "odeljak": "Znatiželja — takmičenje „gvozdenih konja”", "tekst": "Na otvaranju pruge 15. septembra 1830. Raketa je postigla 48 km/h."}, "osa": {"naziv": "Otvaranje pruge Mančester–Liverpul", "od": 1830, "traka": "saobracaj"}}, {"id": "sao-povezi-mesta", "vrsta": "povezi", "tezina": "tesko", "pojmovi": ["hadson", "stokton-darlington", "mancester-liverpul", "njujork", "olbani"], "pitanje": "Poveži mesto sa onim što se tamo dogodilo.", "parovi": [["Reka Hadson", "plovidba Klermonta 1807."], ["Stokton–Darlington", "otvaranje železnice u javnom saobraćaju 1825."], ["Mančester–Liverpul", "trka lokomotiva 1829."], ["Rudnici", "prva upotreba Stivensonove lokomotive"]], "pomoc": ["Jedno mesto je u Americi, ostala u Engleskoj.", "Iz lekcije: Hadson – Klermont; Stokton–Darlington 1825; Mančester–Liverpul 1829; lokomotiva prvo u rudnicima."], "objasnjenje": "Hadson (Klermont), Stokton–Darlington (prva javna pruga), Mančester–Liverpul (trka), rudnici (prva upotreba lokomotive).", "iz_udzbenika": {"strana": 30, "odeljak": "Razvoj saobraćaja", "tekst": "Lekcija smešta parobrod na Hadson, a lokomotive u rudnike i na pruge Stokton–Darlington i Mančester–Liverpul."}}, {"id": "sao-datum-fulton", "vrsta": "datum", "tezina": "lako", "pojmovi": ["robert-fulton", "klermont", "parobrod"], "dogadjaj": "Fultonov parobrod Klermont", "pitanje": "Koje godine je Robert Fulton prikazao parobrod Klermont?", "godina": 1807, "traka": "saobracaj", "pomoc": ["Početak XIX veka, prva decenija.", "Sedam godina pre Stivensonove lokomotive (1814).", "Iz lekcije: 1807."], "objasnjenje": "1807 — Klermont plovi redovnom linijom na Hadsonu.", "iz_udzbenika": {"strana": 31, "odeljak": "Razvoj saobraćaja", "tekst": "Fulton je 1807. prikazao parobrod Klermont."}}, {"id": "sao-datum-stivenson", "vr a": 1829, "naziv": "Trka lokomotiva (Mančester–Liverpul)", "traka": "saobracaj"}, {"tekst": "Parobrodi potiskuju jedrenjake", "godina": 1850, "naziv": "Parobrodi potiskuju jedrenjake", "traka": "saobracaj"}], "pomoc": ["Jedan događaj je tek sredinom XIX veka.", "Prva javna pruga je pre trke.", "Iz lekcije: 1825, 1829, sredina XIX veka."], "objasnjenje": "Stokton–Darlington (1825) → trka (1829) → parobrodi potiskuju jedrenjake (sredina XIX veka).", "iz_udzbenika": {"strana": 30, "odeljak": "Razvoj saobraćaja", "tekst": "Lekcija prati saobraćaj od prve javne pruge 1825. do sredine XIX veka."}}, {"id": "sao-poredjaj-saobracaj", "vrsta": "poredjaj", "tezina": "srednje", "pojmovi": ["parna-masina", "parobrod", "parna-lokomotiva", "zeleznica"], "pitanje": "Poređaj događaje hronološki, od najranijeg.", "stavke": [{"tekst": "Vat pravi štedljivu parnu mašinu", "godina": 1769, "naziv": "Vatova parna mašina", "traka": "pronalasci"}, {"tekst": "Klermont plovi Hadsonom", "godina": 1807, "naziv": "Fultonov parobrod Klermont", "traka": "saobracaj"}, {"tekst": "Stivenson konstruiše lokomotivu", "godina": 1814, "naziv": "Stivensonova parna lokomotiva", "traka": "pronalasci"}, {"tekst": "Lokomotiva ulazi u javni saobraćaj", "godina": 1825, "naziv": "Pruga Stokton–Darlington", "traka": "saobracaj"}, {"tekst": "Raketa pobeđuje na trci lokomotiva", "godina": 1829, "naziv": "Trka lokomotiva (Mančester–Liverpul)", "traka": "saobracaj"}], "pomoc": ["Parna mašina je uslov za sve ostalo.", "Lokomotiva prvo radi u rudnicima, tek posle u javnom saobraćaju.", "Iz lekcije: 1769, 1807, 1814, 1825, 1829."], "objasnjenje": "Mašina (1769) → parobrod (1807) → lokomotiva (1814) → javna pruga (1825) → trka (1829).", "iz_udzbenika": {"strana": 30, "odeljak": "Razvoj saobraćaja", "tekst": "Vatov izum doprineo je i kopnenom i vodenom saobraćaju."}}, {"id": "sao-poredjaj-blizu", "vrsta": "poredjaj", "tezina": "tesko", "pojmovi": ["parna-lokomotiva", "raketa", "mancester", "luditi"], "pitanje": "Poređaj događaje koji su se dogodili u razmaku od samo dvadesetak godina, od najranijeg.", "stavke": [{"tekst": "Zakonom je propisana smrtna kazna za uništavanje mašina", "godina": 1812, "naziv": "Zakon: smrtna kazna za uništavanje mašina", "traka": "drustvo"}, {"tekst": "Stivenson konstruiše parnu lokomotivu", "godina": 1814, "naziv": "Stivensonova parna lokomotiva", "traka": "pronalasci"}, {"tekst": "Otvara se železnica Stokton–Darlington", "godina": 1825, "naziv": "Pruga Stokton–Darlington", "traka": "saobracaj"}, {"tekst": "Održava se trka lokomotiva", "godina": 1829, "naziv": "Trka lokomotiva (Mančester–Liverpul)", "traka": "saobracaj"}, {"tekst": "Zvanično se otvara pruga Mančester–Liverpul", "godina": 1830, "naziv": "Otvaranje pruge Mančester–Liverpul", "traka": "saobracaj"}], "pomoc": ["Zakon protiv lomljenja mašina je iz vremena ludita, druga decenija XIX veka.", "Trka lokomotiva je godinu dana pre zvaničnog otvaranja pruge.", "Iz lekcije: 1812, 1814, oko 1820, 1825, 1829, 1830."], "objasnjenje": "1812 zakon → 1814 lokomotiva → 1825 prva javna pruga → 1829 trka → 1830 otvaranje.", "iz_udzbenika": {"strana": 30, "odeljak": "Razvoj saobraćaja; Društvene promene", "tekst": "Lekcija u nekoliko decenija smešta i nove pronalaske i nove zakone i gradove."}}, {"id": "sao-lanac-trgovina", "vrsta": "lanac", "tezina": "srednje", "pojmovi": ["saobracaj", "parna-lokomotiva", "parobrod"], "karike": ["Britanija razvija prekomorsku trgovinu i mnogo robe treba prevesti", "?", "Nastaju parna lokomotiva i parobrod"], "praznina": 1, "odgovori": [{"tekst": "Javlja se potreba za boljim saobraćajnim sredstvima, pa se Vatova mašina pokušava staviti na vozila", "tacan": true}, {"tekst": "Grade se nove manufakture", "tacan": false, "zasto": "Manufakture propadaju; trgovini su trebala brža prevozna sredstva."}, {"tekst": "Jedrenjaci postaju brži od svih vozila", "tacan": false, "zasto": "Jedrenjake će potisnuti parobrodi, a ne obrnuto."}, {"tekst": "Zabranjuje se uvoz pamuka", "tacan": false, "zasto": "Lekcija ne govori o takvoj zabrani; pamuk je stalno stizao iz kolonija."}], "pomoc": ["Korak 1: Šta trgovcu treba kad ima mnogo robe za prevoz?", "Korak 2: Koji izum su pronalazači pokušali da stave na kola i brodove?", "Iz lekcije: prekomorska trgovina zahtevala je razvoj saobraćajnih sredstava."], "objasnjenje": "Trgovina je tražila brži prevoz; odgovor je bila para na šinama i na vodi.", "iz_udzbenika": {"strana": 30, "odeljak": "Razvoj saobraćaja", "tekst": "Prekomorska trgovina i transport robe zahtevali su razvoj saobraćajnih sredstava."}}, {"id": "sao-lanac-lokomotiva", "vrsta": "lanac", "tezina": "srednje", "pojmovi": ["parna-lokomotiva", "stokton-darlington", "rudarstvo"], "karike": ["Stivenson 1814. pravi parnu lokomotivu", "Lokomotiva vuče vagone sa rudom u rudnicima", "?"], "praznina": 2, "odgovori": [{"tekst": "Od 1825. lokomotiva vozi u javnom saobraćaju (pruga Stokton–Darlington)", "tacan": true}, {"tekst": "Lokomotiva se zabranjuje zbog buke", "tacan": false, "zasto": "Nije zabranjena — pruge su se ubrzano gradile."}, {"tekst": "Lokomotiva se stavlja na Klermont", "tacan": false, "zasto": "Klermont je parobrod sa sopstvenom parnom mašinom; lokomotiva vozi po šinama."}, {"tekst": "Vraća se konjska vuča", "tacan": false, "zasto": "Obrnuto — lokomotiva je zamenila konjsku vuču."}], "pomoc": ["Korak 1: Gde je lokomotiva prvo radila?", "Korak 2: Kome je zatim služila?", "Iz lekcije: od 1825. u javnom saobraćaju."], "objasnjenje": "Lokomotiva je prvo radila u rudnicima, a 1825. je počela da služi svima — na pruzi Stokton–Darlington.", "iz_udzbenika": {"strana": 30, "odeljak": "Razvoj saobraćaja", "tekst": "Lokomotiva se prvo koristila u rudnicima, a od 1825. u javnom saobraćaju."}, "osa": {"naziv": "Pruga Stokton–Darlington", "od": 1825, "traka": "saobracaj"}}, {"id": "sao-lanac-raketa", "vrsta": "lanac", "tezina": "tesko", "pojmovi": ["raketa", "mancester-liverpul", "dzordz-stivenson"], "karike": ["Dovršena je pruga Mančester–Liverpul, a treba izabrati lokomotivu", "Organizuje se trka lokomotiva", "?", "Raketa dobija nagradu i pravo da vozi na redovnoj pruzi"], "praznina": 2, "odgovori": [{"tekst": "Ostale lokomotive imaju nezgode, a Raketa je najpouzdanija i najbrža", "tacan": true}, {"tekst": "Raketa izgleda najmoćnije pa je sudije biraju bez vožnje", "tacan": false, "zasto": "Raketa je izgledala najskromnije; pobedila je u vožnji."}, {"tekst": "Raketa je jedina lokomotiva koja je stigla na trku", "tacan": false, "zasto": "Bile su gotove četiri lokomotive; jedna nije uzeta u obzir."}, {"tekst": "Raketa je najjeftinija lokomotiva", "tacan": false, "zasto": "Izvor ne govori o ceni; presudile su pouzdanost i brzina."}], "pomoc": ["Korak 1: Šta se proverava na trci?", "Korak 2: Šta se dogodilo drugim lokomotivama?", "Iz lekcije: Raketa je bila najpouzdanija i postigla 30 km/h."], "objasnjenje": "Trka je bila provera — pobedila je lokomotiva koja je radila bez kvara i išla najbrže.", "iz_udzbenika": {"strana": 30, "odeljak": "Znatiželja — takmičenje „gvozdenih konja”", "tekst": "Pobednik trke dobijao je novčanu nagradu i pravo da vozi na pruzi; Raketa je bila najpouzdanija i najbrža.", "slika": "03-industrijska-revolucija/05-lokomotiva-raketa.jpg"}, "osa": {"naziv": "Trka lokomotiva (Mančester–Liverpul)", "od": 1829, "traka": "saobracaj"}}, {"id": "sao-zakljuci-gvozdeni-konji", "vrsta": "zakljuci", "tezina": "srednje", "pojmovi": ["parna-lokomotiva", "gvozdje"], "pitanje": "Zašto su lokomotive nazivane „gvozdenim konjima”?", "odgovori": [{"tekst": "Zato što su zamenile konjsku vuču, a napravljene su od gvožđa", "tacan": true}, {"tekst": "Zato što su ih na početku vukli konji", "tacan": false, "zasto": "Lokomotiva sama vuče vagone — zato je i zamenila konje."}, {"tekst": "Zato što su bile spore kao konji", "tacan": false, "zasto": "Raketa je bila tri puta brža od poštanske kočije."}, {"tekst": "Zato što su prevozile samo konje", "tacan": false, "zasto": "Prevozile su rudu, robu i putnike."}], "pomoc": ["Korak 1: Šta je lokomotiva zamenila u prevozu?", "Korak 2: Od kog materijala je napravljena?", "Iz lekcije: lokomotiva je zamenila konjsku vuču."], "objasnjenje": "„Konj” jer vuče kao konj (i zamenila je konje), „gvozdeni” jer je od gvožđa.", "iz_udzbenika": {"strana": 30, "odeljak": "Znatiželja — takmičenje „gvozdenih konja”", "tekst": "Udžbenik pita zašto su lokomotive zvane gvozdenim konjima; one su zamenile konjsku vuču."}}, {"id": "sao-zakljuci-klermont-dobit", "vrsta": "zakljuci", "tezina": "srednje", "pojmovi": ["klermont", "robert-fulton", "parobrod"], "pitanje": "Stariji parobrodi su postojali još krajem XVIII veka. Zašto se ipak pamti baš Fultonov Klermont?", "odgovori": [{"tekst": "Zato što je prvi donosio finansijsku dobit plovidbom na redovnoj liniji", "tacan": true}, {"tekst": "Zato što nije imao dimnjak", "tacan": false, "zasto": "Klermont je imao dimnjak iz koga kulja dim."}, {"tekst": "Zato što je plovio bez parne mašine", "tacan": false, "zasto": "Pokretala ga je parna mašina — Vatov izum je doprineo i vodenom saobraćaju."}, {"tekst": "Zato što je preplovio okean", "tacan": false, "zasto": "Klermont je plovio rekom Hadson, između Njujorka i Olbanija."}], "pomoc": ["Korak 1: Šta je potrebno da bi se pronalazak zaista proširio?", "Korak 2: Kakva je bila njegova linija — povremena ili redovna?", "Iz lekcije: Fultonov parobrod je prvi donosio finansijsku dobit."], "objasnjenje": "Pronalazak se širi kad se isplati — Klermont je dokazao da parobrod može da zarađuje.", "iz_udzbenika": {"strana": 31, "odeljak": "Parobrod Klermont", "tekst": "Fultonov parobrod je prvi donosio finansijsku dobit, iako su stariji postojali.", "slika": "03-industrijska-revolucija/06-parobrod-klermont.jpg"}, "osa": {"naziv": "Fultonov parobrod Klermont", "od": 1807, "traka": "saobracaj"}}, {"id": "sao-zakljuci-cudovista", "vrsta": "zakljuci", "tezina": "tesko", "pojmovi": ["parobrod", "kameni-ugalj"], "pitanje": "Zašto su ljudi prve parobrode zvali „čudovištima koja povraćaju dim i bljuju vatru”?", "odgovori": [{"tekst": "Zbog dima, varnica i buke iz dimnjaka — nešto što do tada nisu videli", "tacan": true}, {"tekst": "Zato što su parobrodi napadali druge brodove", "tacan": false, "zasto": "Lekcija ne govori o napadima; ljude je uplašio izgled — dim i vatra iz dimnjaka."}, {"tekst": "Zato što su bili mnogo manji od jedrenjaka", "tacan": false, "zasto": "Veličina nije razlog; reč je o dimu i vatri od uglja."}, {"tekst": "Zato što su plovili samo noću", "tacan": false, "zasto": "Klermont je plovio redovnom linijom; nadimak dolazi od dima i varnica."}], "pomoc": ["Korak 1: Šta gori u parnoj mašini?", "Korak 2: Šta izlazi iz dimnjaka kad gori ugalj?", "Korak 3: Kako to izgleda nekome ko nikad nije video mašinu? Iz lekcije: dim, varnice, buka."], "objasnjenje": "Ugalj u mašini pravio je dim i varnice; za ljude naviknute na jedra to je izgledalo kao čudovište.", "iz_udzbenika": {"strana": 31, "odeljak": "Parobrod Klermont", "tekst": "Udžbenik pita zašto su prve parobrode zvali čudovištima koja bljuju vatru.", "slika": "03-industrijska-revolucija/06-parobrod-klermont.jpg"}}, {"id": "sao-izvor-volmar-pobeda", "vrsta": "izvor", "tezina": "srednje", "pojmovi": ["raketa", "mancester-liverpul", "dzordz-stivenson"], "izvor": {"autor": "K. Volmar", "naslov": "Vatra i para (istorija britanske železnice)", "tekst": "Kad je 1829. dovršena pruga Mančester–Liverpul, priređena je trka da se izabere lokomotiva — pobednik je dobijao veliku nagradu i pravo da vozi na pruzi. Bile su gotove samo četiri lokomotive. Stivensonova Raketa izgledala je najskromnije, ali dok su druge imale nezgode, ona je radila pouzdano i postigla 30 km/h, skoro tri puta više od poštanske kočije.", "napomena": "Odlomak je prepričan; udžbenik, str. 30 (Znatiželja)."}, "pitanje": "Zašto je, prema ovom izvoru, pobedila Raketa?", "odgovori": [{"tekst": "Bila je najpouzdanija i najbrža, dok su druge imale nezgode", "tacan": true}, {"tekst": "Izgledala je najlepše i najmoćnije", "tacan": false, "zasto": "Izvor kaže suprotno — izgledala je najskromnije."}, {"tekst": "Bila je jedina lokomotiva na trci", "tacan": false, "zasto": "Bile su gotove četiri lokomotive."}, {"tekst": "Stivenson je bio sudija trke", "tacan": false, "zasto": "Izvor to ne kaže; o pobedi su odlučile pouzdanost i brzina."}], "pomoc": ["Pronađi u odlomku šta se dogodilo drugim lokomotivama.", "Koliku je brzinu postigla Raketa?", "Iz lekcije: najpouzdanija i najbrža — 30 km/h."], "objasnjenje": "Izvor ističe da je Raketa, iako skromna izgleda, jedina radila bez nezgoda i bila najbrža.", "iz_udzbenika": {"strana": 30, "odeljak": "Znatiželja — takmičenje „gvozdenih konja”", "tekst": "Udžbenik prenosi odlomak iz Volmarove knjige o trci lokomotiva 1829.", "slika": "03-industrijska-revolucija/05-lokomotiva-raketa.jpg"}, "osa": {"naziv": "Trka lokomotiva (Mančester–Liverpul)", "od": 1829, "traka": "saobracaj"}}, {"id": "sao-izvor-volmar-kocija", "vrsta": "izvor", "tezina": "tesko", "pojmovi": ["raketa", "parna-lokomotiva"], "izvor": {"autor": "K. Volmar", "naslov": "Vatra i para (istorija britanske železnice)", "tekst": "Na trci 1829. Raketa je postigla 30 km/h, skoro tri puta brže od poštanske kočije. Na zvaničnom otvaranju pruge, 15. septembra 1830, išla je 48 km/h — više od četiri puta brže od kočije.", "napomena": "Odlomak je prepričan; udžbenik, str. 30 (Znatiželja)."}, "pitanje": "Šta iz ovih podataka možemo zaključiti o brzini poštanske kočije, kojom su ljudi do tada putovali?", "odgovori": [{"tekst": "Išla je otprilike 10–12 km/h", "tacan": true}, {"tekst": "Išla je oko 30 km/h, kao Raketa", "tacan": false, "zasto": "Raketa je bila skoro tri puta brža, pa je kočija bila mnogo sporija."}, {"tekst": "Išla je oko 90 km/h", "tacan": false, "zasto": "Tada bi kočija bila brža od Rakete, a izvor kaže da je Raketa bila više puta brža."}, {"tekst": "Iz izvora se ništa ne može zaključiti o kočiji", "tacan": false, "zasto": "Može — izvor daje odnos: 30 km/h je skoro tri puta brže, 48 km/h više od četiri puta brže."}], "pomoc": ["Ako je 30 km/h skoro tri puta brže, koliko je jedan deo?", "Proveri i drugim podatkom: 48 podeljeno sa nešto više od 4.", "Iz lekcije: 30 km/h ≈ 3 × kočija; 48 km/h > 4 × kočija."], "objasnjenje": "30 : 3 ≈ 10 i 48 : 4 = 12 — kočija je išla otprilike 10–12 km/h. Železnica je putovanje ubrzala više puta.", "iz_udzbenika": {"strana": 30, "odeljak": "Znatiželja — takmičenje „gvozdenih konja”", "tekst": "Raketa je bila skoro tri puta, a na otvaranju više od četiri puta brža od poštanske kočije."}, "osa": {"naziv": "Otvaranje pruge Mančester–Liverpul", "od": 1830, "traka": "saobracaj"}}, {"id": "sao-izvor-stokton", "vrsta": "izvor", "tezina": "srednje", "pojmovi": ["stokton-darlington", "zeleznica", "parna-lokomotiva"], "izvor": {"autor": "Gravira iz XIX veka", "naslov": "Otvaranje železnice Stokton–Darlington, 1825.", "tekst": "Lokomotiva vuče dugačak niz vagona preko kamenog mosta. Uz prugu se okupilo mnogo ljudi, neki na konjima, i posmatraju voz.", "napomena": "Opis slike je prepričan; udžbenik, str. 30."}, "pitanje": "Šta nam ova gravira govori o tom događaju?", "odgovori": [{"tekst": "Otvaranje javne železnice bilo je važan događaj koji je privukao mnogo ljudi", "tacan": true}, {"tekst": "Ljudi su se bunili protiv pruge i lomili vagone", "tacan": false, "zasto": "Na graviri ljudi posmatraju voz; lomljenje mašina prikazuje ilustracija ludita."}, {"tekst": "Voz je prevozio samo rudu u rudniku", "tacan": false, "zasto": "Ovo je otvaranje železnice za javni saobraćaj 1825 — izvan rudnika."}, {"tekst": "Konji su vukli vagone", "tacan": false, "zasto": "Vagone vuče lokomotiva; jahači samo posmatraju."}], "pomoc": ["Ko je na slici osim voza?", "Zašto bi se toliko ljudi okupilo?", "Iz lekcije: 1825. lokomotiva ulazi u javni saobraćaj."], "objasnjenje": "Gravira beleži otvaranje prve javne pruge — novinu koju su ljudi došli da vide.", "iz_udzbenika": {"strana": 30, "odeljak": "Razvoj saobraćaja", "tekst": "Slika prikazuje otvaranje železnice na pu
