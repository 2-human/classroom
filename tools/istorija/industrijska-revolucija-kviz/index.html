tu Stokton–Darlington u Engleskoj 1825.", "slika": "03-industrijska-revolucija/04-zeleznica-stokton-darlington.jpg"}, "osa": {"naziv": "Pruga Stokton–Darlington", "od": 1825, "traka": "saobracaj"}}, {"id": "sao-izvor-klermont", "vrsta": "izvor", "tezina": "lako", "pojmovi": ["klermont", "robert-fulton", "hadson", "njujork", "olbani"], "izvor": {"autor": "Natpis uz sliku u udžbeniku", "naslov": "Parobrod Klermont Roberta Fultona", "tekst": "Klermont je 1807. plovio redovnom linijom na reci Hadson, između Njujorka i Olbanija. Na slici se vidi brod sa dimnjakom iz koga kulja crni dim i velikim točkom na boku.", "napomena": "Natpis i opis slike su prepričani; udžbenik, str. 31."}, "pitanje": "Između koja dva grada je plovio Klermont?", "odgovori": [{"tekst": "Njujorka i Olbanija", "tacan": true}, {"tekst": "Mančestera i Liverpula", "tacan": false, "zasto": "Između Mančestera i Liverpula vozila je železnica (Raketa, 1829–1830)."}, {"tekst": "Stoktona i Darlingtona", "tacan": false, "zasto": "To je prva javna železnica u Engleskoj (1825)."}, {"tekst": "Londona i Pariza", "tacan": false, "zasto": "Klermont je plovio rekom u Americi."}], "pomoc": ["Reka Hadson je u Americi.", "Jedan od gradova je danas najveći grad SAD.", "Iz lekcije: Njujork–Olbani."], "objasnjenje": "Klermont je plovio rekom Hadson na liniji Njujork–Olbani.", "iz_udzbenika": {"strana": 31, "odeljak": "Parobrod Klermont", "tekst": "Klermont je plovio redovnom linijom na Hadsonu između Njujorka i Olbanija.", "slika": "03-industrijska-revolucija/06-parobrod-klermont.jpg"}, "osa": {"naziv": "Fultonov parobrod Klermont", "od": 1807, "traka": "saobracaj"}}, {"id": "sao-uporedi-lokomotiva-parobrod", "vrsta": "uporedi", "tezina": "lako", "pojmovi": ["parna-lokomotiva", "parobrod", "dzordz-stivenson", "robert-fulton"], "a": "Parna lokomotiva", "b": "Parobrod", "pitanje": "Na šta se odnosi tvrdnja — lokomotivu, parobrod, oba ili nijedno?", "tvrdnje": [{"tekst": "Konstruisao ju je Džordž Stivenson 1814.", "odgovor": "a", "zasto": "Stivenson je tvorac lokomotive."}, {"tekst": "Prikazao ga je Robert Fulton 1807.", "odgovor": "b", "zasto": "Fulton je američki pronalazač parobroda Klermont."}, {"tekst": "Pokreće ga snaga parne mašine.", "odgovor": "oba", "zasto": "Vatov izum je pokrenuo i kopneni i vodeni saobraćaj."}, {"tekst": "Prvo je koristio i jedra.", "odgovor": "b", "zasto": "Prvi parobrodi su koristili i jedra i paru."}, {"tekst": "Izumeo ga je Džon Kej.", "odgovor": "nijedan", "zasto": "Džon Kej je izumeo leteći čunak za tkanje."}], "pomoc": ["Jedno vozi po šinama, drugo plovi.", "Šta im je zajedničko?", "Iz lekcije: lokomotiva — Stivenson 1814; parobrod — Fulton 1807; oba na paru."], "objasnjenje": "Oba su primena parne mašine u saobraćaju — lokomotiva na kopnu, parobrod na vodi.", "iz_udzbenika": {"strana": 30, "odeljak": "Razvoj saobraćaja", "tekst": "Vatov izum je doprineo i kopnenom (lokomotiva) i vodenom saobraćaju (parobrod)."}}, {"id": "sao-uporedi-pruge", "vrsta": "uporedi", "tezina": "srednje", "pojmovi": ["stokton-darlington", "mancester-liverpul", "zeleznica"], "a": "Pruga Stokton–Darlington", "b": "Pruga Mančester–Liverpul", "pitanje": "Na koju prugu se odnosi tvrdnja — A, B, obe ili nijednu?", "tvrdnje": [{"tekst": "Otvorena je 1825, kad lokomotiva ulazi u javni saobraćaj.", "odgovor": "a", "zasto": "Stokton–Darlington je otvorena 1825."}, {"tekst": "Za nju je 1829. održana trka lokomotiva.", "odgovor": "b", "zasto": "Trka je trebalo da odredi koja će lokomotiva voziti na pruzi Mančester–Liverpul."}, {"tekst": "Nalazi se u Engleskoj.", "odgovor": "oba", "zasto": "Obe pruge su u Engleskoj."}, {"tekst": "Na zvaničnom otvaranju Raketa je išla 48 km/h.", "odgovor": "b", "zasto": "To je otvaranje pruge Mančester–Liverpul, 15. septembra 1830."}, {"tekst": "Po njoj je plovio Klermont.", "odgovor": "nijedan", "zasto": "Klermont je parobrod na reci Hadson."}], "pomoc": ["Jedna je starija i bila je prva javna.", "Za drugu se vezuju Raketa i trka.", "Iz lekcije: Stokton–Darlington 1825; Mančester–Liverpul 1829–1830."], "objasnjenje": "Stokton–Darlington (1825) je prva javna pruga; Mančester–Liverpul je pruga trke (1829) i Raketinih 48 km/h (1830).", "iz_udzbenika": {"strana": 30, "odeljak": "Razvoj saobraćaja; Znatiželja", "tekst": "Lekcija opisuje otvaranje pruge Stokton–Darlington i trku za prugu Mančester–Liverpul."}}, {"id": "sao-uporedi-raketa", "vrsta": "uporedi", "tezina": "tesko", "pojmovi": ["raketa", "mancester-liverpul"], "a": "Raketa na trci 1829.", "b": "Raketa na otvaranju pruge 1830.", "pitanje": "Na koji događaj se odnosi tvrdnja — A, B, oba ili nijedan?", "tvrdnje": [{"tekst": "Postigla je 30 km/h, skoro tri puta brže od poštanske kočije.", "odgovor": "a", "zasto": "Na trci 1829. brzina je bila 30 km/h."}, {"tekst": "Postigla je 48 km/h, više od četiri puta brže od kočije.", "odgovor": "b", "zasto": "Na otvaranju 15. septembra 1830. Raketa je išla 48 km/h."}, {"tekst": "Bila je brža od poštanske kočije.", "odgovor": "oba", "zasto": "U oba slučaja bila je višestruko brža od kočije."}, {"tekst": "Takmičila se protiv još tri gotove lokomotive.", "odgovor": "a", "zasto": "Na trci su bile gotove četiri lokomotive, jedna nije uzeta u obzir."}, {"tekst": "Izgubila je od brže lokomotive.", "odgovor": "nijedan", "zasto": "Raketa je pobedila na trci i zato je vozila na otvaranju."}], "pomoc": ["Na otvaranju je bila brža nego na trci.", "Trka je bila takmičenje, a otvaranje svečanost.", "Iz lekcije: 1829 — 30 km/h; 1830 — 48 km/h."], "objasnjenje": "Trka (1829, 30 km/h) odlučila je ko vozi; na otvaranju (1830) Raketa je postigla 48 km/h.", "iz_udzbenika": {"strana": 30, "odeljak": "Znatiželja — takmičenje „gvozdenih konja”", "tekst": "Izvor navodi brzinu Rakete na trci 1829. i na otvaranju pruge 1830."}, "osa": {"naziv": "Otvaranje pruge Mančester–Liverpul", "od": 1830, "traka": "saobracaj"}}, {"id": "sao-ko-sam-stivenson", "vrsta": "ko_sam", "tezina": "lako", "pojmovi": ["dzordz-stivenson", "parna-lokomotiva", "raketa"], "tragovi": ["Moje vozilo je u početku radilo u rudnicima i izvlačilo vagone sa rudom.", "Moja „Raketa” je pobedila na trci 1829.", "Godine 1814. konstruisao sam parnu lokomotivu."], "odgovori": [{"tekst": "Džordž Stivenson", "tacan": true}, {"tekst": "Robert Fulton", "tacan": false, "zasto": "Fultonov izum je parobrod, a ne lokomotiva."}, {"tekst": "Džejms Vat", "tacan": false, "zasto": "Vat je napravio parnu mašinu 1769, ne lokomotivu."}, {"tekst": "K. Volmar", "tacan": false, "zasto": "Volmar je pisac knjige „Vatra i para” o istoriji železnice."}], "objasnjenje": "To je Džordž Stivenson — lokomotiva 1814, Raketa 1829.", "iz_udzbenika": {"strana": 30, "odeljak": "Razvoj saobraćaja", "tekst": "Stivenson je 1814. konstruisao lokomotivu; njegova Raketa je pobedila 1829.", "slika": "03-industrijska-revolucija/05-lokomotiva-raketa.jpg"}}, {"id": "sao-ko-sam-fulton", "vrsta": "ko_sam", "tezina": "lako", "pojmovi": ["robert-fulton", "klermont", "parobrod"], "tragovi": ["Bio sam američki pronalazač.", "Moj brod je imao veliki točak na boku i dimnjak, a plovio je Hadsonom.", "Godine 1807. prikazao sam parobrod Klermont."], "odgovori": [{"tekst": "Robert Fulton", "tacan": true}, {"tekst": "Džordž Stivenson", "tacan": false, "zasto": "Stivenson je britanski pronalazač lokomotive."}, {"tekst": "Džon Kej", "tacan": false, "zasto": "Kej je izumeo leteći čunak."}, {"tekst": "Džejms Vat", "tacan": false, "zasto": "Vat je britanski pronalazač parne mašine; njegov izum je pokretao i parobrode, ali Klermont je Fultonov."}], "objasnjenje": "To je Robert Fulton, tvorac Klermonta (1807).", "iz_udzbenika": {"strana": 31, "odeljak": "Razvoj saobraćaja", "tekst": "Američki pronalazač Robert Fulton prikazao je parobrod 1807.", "slika": "03-industrijska-revolucija/06-parobrod-klermont.jpg"}}, {"id": "sao-objasni-klermont", "vrsta": "objasni", "tezina": "lako", "pojmovi": ["klermont", "parobrod", "parna-masina"], "pitanje": "Pogledaj sliku Klermonta. Čemu služe veliki točak na boku i dimnjak? Objasni svojim rečima.", "uzor": "Veliki točak sa lopaticama okreće parna mašina, i on gura brod kroz vodu. U mašini gori ugalj, a dim od sagorevanja izlazi kroz dimnjak.", "ideje": ["Točak pokreće brod kroz vodu.", "Točak okreće parna mašina.", "Dimnjak odvodi dim od uglja koji gori."], "objasnjenje": "Točak i dimnjak su vidljivi delovi parne mašine na brodu.", "iz_udzbenika": {"strana": 31, "odeljak": "Parobrod Klermont", "tekst": "Udžbenik pita čemu služe točak na boku i dimnjak Klermonta.", "slika": "03-industrijska-revolucija/06-parobrod-klermont.jpg"}}, {"id": "sao-objasni-trka", "vrsta": "objasni", "tezina": "srednje", "pojmovi": ["raketa", "mancester-liverpul", "parna-lokomotiva"], "pitanje": "Zašto je za prugu Mančester–Liverpul organizovana trka lokomotiva i šta je pokazala? Objasni svojim rečima.", "uzor": "Pruga je bila gotova 1829, a trebalo je izabrati lokomotivu koja će na njoj voziti. Trka je pokazala koja lokomotiva radi bez kvara i ide najbrže. Pobedila je Stivensonova Raketa, iako je izgledala najskromnije — bila je najpouzdanija i išla 30 km/h, skoro tri puta brže od kočije.", "ideje": ["Trebalo je izabrati lokomotivu za novu prugu.", "Pobednik je dobijao nagradu i pravo da vozi na pruzi.", "Raketa je bila najpouzdanija i najbrža.", "Izgled nije presudio."], "objasnjenje": "Trka je bila provera u praksi — pouzdanost i brzina su važnije od izgleda.", "iz_udzbenika": {"strana": 30, "odeljak": "Znatiželja — takmičenje „gvozdenih konja”", "tekst": "Udžbenik prenosi priču o trci lokomotiva 1829.", "slika": "03-industrijska-revolucija/05-lokomotiva-raketa.jpg"}, "osa": {"naziv": "Trka lokomotiva (Mančester–Liverpul)", "od": 1829, "traka": "saobracaj"}}]}, {"naslov": "Društvene promene", "zadaci": [{"id": "dru-izbor-gradovi", "vrsta": "izbor", "tezina": "lako", "pojmovi": ["mancester", "liverpul", "fabrika"], "pitanje": "Koji britanski gradovi su navedeni kao primer novih industrijskih centara?", "odgovori": [{"tekst": "Mančester i Liverpul", "tacan": true}, {"tekst": "Njujork i Olbani", "tacan": false, "zasto": "Njujork i Olbani su američki gradovi povezani Klermontovom linijom."}, {"tekst": "Stokholm i Sankt Peterburg", "tacan": false, "zasto": "To su gradovi na severu i istoku Evrope, koje je industrijski razvoj tada uglavnom zaobišao."}, {"tekst": "Beč i Budim", "tacan": false, "zasto": "To su gradovi Habzburške monarhije, ne britanski industrijski centri iz lekcije."}], "pomoc": ["Između ta dva grada vodila je pruga sa čuvene trke lokomotiva.", "Jedan se zvao „Grad pamuka”.", "Iz lekcije: Mančester i Liverpul."], "objasnjenje": "Mančester i Liverpul su porasli kao industrijski centri zbog doseljavanja ljudi sa sela u fabrike.", "iz_udzbenika": {"strana": 31, "odeljak": "Društvene promene", "tekst": "Seljenjem sa sela raste gradsko stanovništvo i razvijaju se industrijski centri poput Mančestera i Liverpula."}}, {"id": "dru-izbor-gde-fabrike", "vrsta": "izbor", "tezina": "srednje", "pojmovi": ["fabrika", "parna-masina"], "pitanje": "Gde je parna mašina omogućila da se podižu fabrike?", "odgovori": [{"tekst": "Blizu luka i rudnika", "tacan": true}, {"tekst": "Samo u planinama, pored brzih reka", "tacan": false, "zasto": "Snaga vode je pokretala predilice, ali para je omogućila fabrike blizu luka i rudnika."}, {"tekst": "Na plantažama u kolonijama", "tacan": false, "zasto": "Na plantažama se gajio pamuk; fabrike su bile u Britaniji."}, {"tekst": "Samo u Londonu", "tacan": false, "zasto": "Industrijski centri su bili i Mančester i Liverpul; fabrike su se dizale blizu luka i rudnika."}], "pomoc": ["Odakle dolazi ugalj za mašinu, a odakle sirovi pamuk?", "Jedno se vadi iz zemlje, drugo stiže brodom.", "Iz lekcije: blizu luka i rudnika."], "objasnjenje": "Kraj rudnika je bio ugalj za mašine, a kraj luka sirovina i put za izvoz robe.", "iz_udzbenika": {"strana": 31, "odeljak": "Društvene promene", "tekst": "Parna mašina je omogućila podizanje fabrika blizu luka i rudnika."}}, {"id": "dru-izbor-bolesti-zasto", "vrsta": "izbor", "tezina": "srednje", "pojmovi": ["radnicka-naselja", "radnistvo"], "pitanje": "Zašto su se u radničkim naseljima širile zarazne bolesti?", "odgovori": [{"tekst": "Zato što su naselja bila prenaseljena i bez higijenskih uslova", "tacan": true}, {"tekst": "Zato što su radnici dolazili iz kolonija", "tacan": false, "zasto": "Radnici su dolazili sa britanskih sela, a bolesti su se širile zbog prenaseljenosti i prljavštine."}, {"tekst": "Zato što su naselja bila daleko od fabrika", "tacan": false, "zasto": "Naselja su nicala baš oko fabrika i rudnika, na obodima gradova."}, {"tekst": "Zato što su radnici imali previše hrane", "tacan": false, "zasto": "Obrnuto — vladala je pothranjenost."}], "pomoc": ["Zamisli mnogo ljudi zbijenih u malim kućama.", "Šta nedostaje — voda, kanalizacija, čistoća?", "Iz lekcije: prenaseljena naselja bez higijenskih uslova."], "objasnjenje": "Gužva i nedostatak higijene doveli su do zaraznih bolesti, a uz to su vladali pothranjenost i alkoholizam.", "iz_udzbenika": {"strana": 31, "odeljak": "Društvene promene", "tekst": "Prenaseljena radnička naselja bez higijene donose zarazne bolesti, pothranjenost i alkoholizam.", "slika": "03-industrijska-revolucija/09-radnicki-kvart-londona.jpg"}}, {"id": "dru-tn-zene-deca", "vrsta": "tacno_netacno", "tezina": "lako", "pojmovi": ["decji-rad", "radnistvo"], "tvrdnja": "Žene i deca su u fabrikama dobijali veće plate od muškaraca.", "tacno": false, "ispravke": [{"tekst": "Žene i deca su radili za još niže plate.", "tacan": true}, {"tekst": "Žene i deca nisu radili u fabrikama.", "tacan": false, "zasto": "Radili su — i to dugo i bez zaštite."}, {"tekst": "Žene i deca su radili bez ikakve plate, kao robovi.", "tacan": false, "zasto": "Bili su plaćeni, ali još slabije od muškaraca; robovi su radili na plantažama."}], "pomoc": ["Zašto bi vlasnik rado zaposlio dete?", "Iz lekcije: žene i deca rade za još niže plate."], "objasnjenje": "Žene i deca su bili najjeftinija radna snaga — radili su dugo, za još niže plate.", "iz_udzbenika": {"strana": 31, "odeljak": "Društvene promene", "tekst": "U fabrikama rade i žene i deca, sa još nižim platama."}}, {"id": "dru-tn-zagadjenje", "vrsta": "tacno_netacno", "tezina": "lako", "pojmovi": ["zagadjenje-zivotne-sredine", "fabrika"], "tvrdnja": "Fabrike su otrovne gasove i tečnosti ispuštale direktno u prirodu.", "tacno": true, "pomoc": ["Pogledaj dimnjake na slici Mančestera.", "Iz lekcije: posledica je zagađenje životne sredine."], "objasnjenje": "Tačno — zagađenje životne sredine je još jedna posledica industrijske revolucije.", "iz_udzbenika": {"strana": 32, "odeljak": "Društvene promene", "tekst": "Fabrike ispuštaju otrovne gasove i tečnosti u prirodu, što zagađuje životnu sredinu."}}, {"id": "dru-tn-zastita", "vrsta": "tacno_netacno", "tezina": "lako", "pojmovi": ["radnistvo", "fabrika"], "tvrdnja": "Radnici u prvim fabrikama radili su kratko i uz dobru zaštitu na radu.", "tacno": false, "ispravke": [{"tekst": "Radili su dugo, bez osnovne zaštite na radu.", "tacan": true}, {"tekst": "Radili su kratko, ali bez plate.", "tacan": false, "zasto": "Radili su dugo i dobijali niske plate."}, {"tekst": "Radili su dugo, ali za veoma visoke plate.", "tacan": false, "zasto": "Mašinska proizvodnja je oborila cenu rada — plate su bile niske."}], "pomoc": ["Kakav je bio položaj radnika — dobar ili loš?", "Iz lekcije: dug rad, bez osnovne zaštite."], "objasnjenje": "Radni dan je bio dug, a zaštite na radu nije bilo.", "iz_udzbenika": {"strana": 31, "odeljak": "Društvene promene", "tekst": "Radilo se dugo, bez osnovne zaštite na radu."}}, {"id": "dru-tn-gradjanstvo", "vrsta": "tacno_netacno", "tezina": "srednje", "pojmovi": ["gradjanstvo", "burzoazija", "radnistvo"], "tvrdnja": "Industrija je podjednako obogatila sve stanovnike Britanije.", "tacno": false, "ispravke": [{"tekst": "Obogatila je jedan sloj građanstva (buržoazije), a radnici su ostali siromašni.", "tacan": true}, {"tekst": "Obogatila je zanatlije, a građanstvo osiromašila.", "tacan": false, "zasto": "Sitne zanatlije su propale; bogatio se jedan sloj građanstva."}, {"tekst": "Obogatila je samo seljake koji su ostali na selu.", "tacan": false, "zasto": "Seljaci su odlazili u gradove tražeći posao; bogatili su se vlasnici fabrika iz građanstva."}], "pomoc": ["Ko je posedovao fabrike, a ko u njima radio?", "Iz lekcije: obogatio se jedan sloj građanstva; nastalo je radništvo."], "objasnjenje": "Bogatstvo je pripalo delu građanstva; radnici su živeli u bedi — društvo se podelilo.", "iz_udzbenika": {"strana": 31, "odeljak": "Društvene promene", "tekst": "Industrija je obogatila jedan sloj građanstva (buržoazije) i stvorila radničku klasu."}}, {"id": "dru-dopuni-klase", "vrsta": "dopuni", "tezina": "lako", "pojmovi": ["gradjanstvo", "burzoazija", "radnicka-klasa"], "pitanje": "Dopuni rečenicu.", "tekst": "Industrija je obogatila jedan sloj {{građanstva}} (buržoazije) i dovela do nastanka nove grupe — {{radničke klase}}.", "ponudjene": ["građanstva", "radničke klase", "plemstva", "sveštenstva"], "pomoc": ["Jedni poseduju fabrike, drugi u njima rade.", "Iz lekcije: građanstvo (buržoazija) i radnička klasa."], "objasnjenje": "Bogati vlasnici iz građanstva i siromašni radnici — dve grupe koje je stvorila industrija.", "iz_udzbenika": {"strana": 31, "odeljak": "Društvene promene", "tekst": "Industrija je obogatila jedan sloj građanstva i stvorila radničku klasu."}}, {"id": "dru-dopuni-posledice", "vrsta": "dopuni", "tezina": "tesko", "pojmovi": ["fabrika", "mancester", "liverpul", "zagadjenje-zivotne-sredine"], "pitanje": "Dopuni rečenice (bez ponuđenih reči).", "tekst": "Razvoj industrije {{pojeftinio}} je proizvode, pa su sitne zanatlije i {{manufakture}} propale. Ljudi sa {{sela}} odlaze u gradove kao što su Mančester i {{Liverpul}}, a fabrike svojim otrovima izazivaju {{zagađenje}} životne sredine.", "pomoc": ["Šta se desilo sa cenom robe kad su je pravile mašine?", "Odakle dolaze novi stanovnici gradova?", "Iz lekcije: pojeftinjenje, propast manufaktura, selo → grad, Mančester i Liverpul, zagađenje."], "objasnjenje": "Jeftina roba, propast starih radionica, rast gradova i zagađenje — posledice koje i danas prepoznajemo.", "iz_udzbenika": {"strana": 31, "odeljak": "Društvene promene", "tekst": "Industrija pojeftinjuje proizvode, zanatlije propadaju, gradovi rastu, a priroda se zagađuje."}}, {"id": "dru-povezi-posledice", "vrsta": "povezi", "tezina": "lako", "pojmovi": ["fabrika", "radnicka-naselja", "zagadjenje-zivotne-sredine", "mancester"], "pitanje": "Poveži uzrok sa posledicom.", "parovi": [["Proizvodi postaju jeftiniji", "Zanatlije i manufakture propadaju"], ["Otvaraju se fabrike", "Ljudi se sele sa sela u grad"], ["Naselja bez higijene", "Šire se zarazne bolesti"], ["Fabrike ispuštaju otrove", "Zagađuje se životna sredina"]], "pomoc": ["Za svaki uzrok pitaj: šta se zbog toga desilo?", "Iz lekcije: jeftina roba → propast zanatlija; fabrike → seobe u grad; prljavština → bolesti; otrovi → zagađenje."], "objasnjenje": "Svaka promena u proizvodnji imala je društvenu posledicu.", "iz_udzbenika": {"strana": 31, "odeljak": "Društvene promene", "tekst": "Lekcija nabraja društvene posledice industrije: propast zanatlija, rast gradova, bedu radnika i zagađenje."}}, {"id": "dru-lanac-gradovi", "vrsta": "lanac", "tezina": "lako", "pojmovi": ["fabrika", "mancester", "liverpul"], "karike": ["Otvaraju se fabrike", "?", "Rastu industrijski centri kao Mančester i Liverpul"], "praznina": 1, "odgovori": [{"tekst": "Ljudi sa sela odlaze u gradove da traže posao", "tacan": true}, {"tekst": "Ljudi iz gradova sele se na selo", "tacan": false, "zasto": "Bilo je obrnuto — sa sela u grad, zbog posla u fabrikama."}, {"tekst": "Gradovi zabranjuju doseljavanje", "tacan": false, "zasto": "Lekcija ne pominje zabrane; gradovi su brzo rasli."}, {"tekst": "Fabrike se zatvaraju zbog nedostatka radnika", "tacan": false, "zasto": "Radnika je bilo dovoljno — dolazili su sa sela."}], "pomoc": ["Korak 1: Šta fabrike nude ljudima?", "Korak 2: Ko dolazi po taj posao?", "Iz lekcije: ljudi sa sela odlaze u gradove tražeći posao."], "objasnjenje": "Fabrike → posao → seljenje sa sela → veliki gradovi.", "iz_udzbenika": {"strana": 31, "odeljak": "Društvene promene", "tekst": "Otvaranjem fabrika ljudi sa sela odlaze u gradove, pa rastu Mančester i Liverpul."}}, {"id": "dru-lanac-zanatlije", "vrsta": "lanac", "tezina": "lako", "pojmovi": ["fabrika", "manufaktura"], "karike": ["Mašine u fabrikama proizvode brzo i mnogo", "?", "Sitne zanatlije i manufakture propadaju"], "praznina": 1, "odgovori": [{"tekst": "Proizvodi postaju jeftiniji", "tacan": true}, {"tekst": "Proizvodi postaju skuplji", "tacan": false, "zasto": "Mašinska proizvodnja je robu pojeftinila; zanatlije nisu mogle da prate tu cenu."}, {"tekst": "Zanatlije dobijaju parne mašine od države", "tacan": false, "zasto": "Lekcija to ne kaže; zanatlije su propale."}, {"tekst": "Radnici traže veće plate", "tacan": false, "zasto": "To se dešava kasnije i ne objašnjava propast zanatlija."}], "pomoc": ["Korak 1: Šta se desi sa cenom kad se roba pravi brzo i mnogo?", "Korak 2: Može li ručni rad da proda jeftinije od mašine?", "Iz lekcije: razvoj industrije je pojeftinio proizvode."], "objasnjenje": "Zanatlija rukom nije mogao da proda jeftinije od fabrike — zato je propao.", "iz_udzbenika": {"strana": 31, "odeljak": "Društvene promene", "tekst": "Razvoj industrije pojeftinio je proizvode, pa sitne zanatlije i manufakture nestaju."}}, {"id": "dru-lanac-naselja", "vrsta": "lanac", "tezina": "srednje", "pojmovi": ["radnicka-naselja", "radnistvo"], "karike": ["Mnogo ljudi dolazi da radi u fabrikama i rudnicima", "Oko fabrika nastaju prenaseljena naselja bez higijene", "?"], "praznina": 2, "odgovori": [{"tekst": "Šire se zarazne bolesti, pothranjenost i alkoholizam", "tacan": true}, {"tekst": "Radnici postaju bogatiji od vlasnika", "tacan": false, "zasto": "Radnici su bili siromašni; bogatio se deo građanstva."}, {"tekst": "Grade se parobrodi", "tacan": false, "zasto": "Parobrodi su deo razvoja saobraćaja, ne posledica stanja u naseljima."}, {"tekst": "Zagađenje prestaje", "tacan": false, "zasto": "Fabrike su i dalje ispuštale otrove; zagađenje je raslo."}], "pomoc": ["Korak 1: Šta se dešava kad mnogo ljudi živi zbijeno?", "Korak 2: Šta donosi nedostatak higijene?", "Iz lekcije: zarazne bolesti, pothranjenost i alkoholizam."], "objasnjenje": "Prenaseljenost + prljavština + siromaštvo = bolesti, glad i alkoholizam.", "iz_udzbenika": {"strana": 31, "odeljak": "Društvene promene", "tekst": "Oko fabrika i rudnika nastaju prenaseljena naselja bez higijene, sa bolestima, pothranjenošću i alkoholizmom.", "slika": "03-industrijska-revolucija/09-radnicki-kvart-londona.jpg"}}, {"id": "dru-lanac-plate", "vrsta": "lanac", "tezina": "srednje", "pojmovi": ["decji-rad", "radnistvo", "fabrika"], "karike": ["Mašine obavljaju posao koji je ranije tražio veštu ruku", "?", "Vlasnici zapošljavaju i žene i decu za još niže plate"], "praznina": 1, "odgovori": [{"tekst": "Rad postaje jeftin — cena rada pada", "tacan": true}, {"tekst": "Radnici dobijaju veće plate", "tacan": false, "zasto": "Obrnuto — mašinska proizvodnja je oborila cenu rada."}, {"tekst": "Fabrikama nedostaje radnika", "tacan": false, "zasto": "Radnika je bilo mnogo jer su dolazili sa sela."}, {"tekst": "Parlament zabranjuje mašine", "tacan": false, "zasto": "Parlament je štitio mašine — kažnjavao je njihovo lomljenje."}], "pomoc": ["Korak 1: Treba li za mašinom veliki majstor?", "Korak 2: Šta se onda dešava sa platom?", "Iz lekcije: mašinska proizvodnja → niska cena rada; žene i deca još slabije plaćeni."], "objasnjenje": "Kad mašina radi umesto majstora, svako može da je opslužuje — rad postaje jeftin, pa i deca rade za male pare.", "iz_udzbenika": {"strana": 31, "odeljak": "Društvene promene", "tekst": "Mašinska proizvodnja dovela je do niske cene rada; žene i deca imali su još niže plate."}}, {"id": "dru-zakljuci-zanatlije", "vrsta": "zakljuci", "tezina": "lako", "pojmovi": ["manufaktura", "fabrika"], "pitanje": "Zašto su sitne zanatlije propadale u doba industrijske revolucije?", "odgovori": [{"tekst": "Nisu mogle da prodaju jeftino kao fabrike", "tacan": true}, {"tekst": "Zato što su ih luditi napadali", "tacan": false, "zasto": "Luditi su bili radnici koji su lomili fabričke mašine, ne zanatlije."}, {"tekst": "Zato što je parlament zabranio zanate", "tacan": false, "zasto": "Lekcija ne pominje zabranu zanata; propali su zbog jeftinije fabričke robe."}, {"tekst": "Zato što su se svi preselili u kolonije", "tacan": false, "zasto": "Lekcija govori o seljenju sa sela u gradove, ne u kolonije."}], "pomoc": ["Korak 1: Kakva je bila cena fabričke robe?", "Korak 2: Šta kupac bira između dve iste stvari?", "Iz lekcije: pojeftinjenje proizvoda → propast zanatlija i manufaktura."], "objasnjenje": "Fabrička roba je bila jeftinija, pa su kupci prestali da kupuju od zanatlija.", "iz_udzbenika": {"strana": 31, "odeljak": "Društvene promene", "tekst": "Razvoj industrije pojeftinio je proizvode, pa sitne zanatlije i manufakture propadaju."}}, {"id": "dru-zakljuci-selo-grad", "vrsta": "zakljuci", "tezina": "lako", "pojmovi": ["fabrika", "radnistvo"], "pitanje": "Zašto su ljudi napuštali sela i odlazili u gradove?", "odgovori": [{"tekst": "Tražili su posao u novim fabrikama", "tacan": true}, {"tekst": "U gradovima je bio čistiji vazduh", "tacan": false, "zasto": "Bilo je obrnuto — fabrike su zagađivale gradove."}, {"tekst": "U gradovima su dobijali besplatne kuće", "tacan": false, "zasto": "Radnici su živeli u prenaseljenim naseljima bez higijene."}, {"tekst": "Vlast ih je proterala sa sela", "tacan": false, "zasto": "Lekcija kaže da su odlazili tražeći posao."}], "pomoc": ["Korak 1: Šta je novo nastajalo u gradovima?", "Korak 2: Šta je fabrikama trebalo?", "Iz lekcije: ljudi sa sela odlaze u gradove tražeći posao."], "objasnjenje": "Fabrike su nudile posao, pa su ljudi sa sela dolazili u gradove — i gradovi su naglo rasli.", "iz_udzbenika": {"strana": 31, "odeljak": "Društvene promene", "tekst": "Otvaranjem fabrika ljudi sa sela odlaze u gradove tražeći posao."}}, {"id": "dru-zakljuci-zene-deca", "vrsta": "zakljuci", "tezina": "srednje", "pojmovi": ["decji-rad", "radnistvo"], "pitanje": "Zašto su mnogi vlasnici fabrika zapošljavali žene i decu?", "odgovori": [{"tekst": "Zato što su im plaćali još manje nego muškarcima", "tacan": true}, {"tekst": "Zato što je zakon to tražio", "tacan": false, "zasto": "Zakoni o radu dece kasnije su ga ograničavali, a ne tražili."}, {"tekst": "Zato što su deca bila školovanija", "tacan": false, "zasto": "Lekcija o tome ne govori; presudna je bila niska plata."}, {"tekst": "Zato što muškaraca nije bilo u gradovima", "tacan": false, "zasto": "U gradove su dolazili svi sa sela; vlasnicima je odgovarala jeftinija radna snaga."}], "pomoc": ["Korak 1: Šta vlasnik želi da smanji?", "Korak 2: Ko je dobijao najnižu platu?", "Iz lekcije: žene i deca rade sa još nižim platama."], "objasnjenje": "Za vlasnika su žene i deca bili najjeftinija radna snaga.", "iz_udzbenika": {"strana": 31, "odeljak": "Društvene promene", "tekst": "U fabrikama rade i žene i deca, sa još nižim platama, dugo i bez zaštite."}}, {"id": "dru-zakljuci-gde-fabrika", "vrsta": "zakljuci", "tezina": "tesko", "pojmovi": ["fabrika", "parna-masina", "kameni-ugalj"], "pitanje": "Vlasnik oko 1810. želi da otvori fabriku pamučnih tkanina sa parnom mašinom. Na osnovu lekcije, koje mesto je najbolje?", "odgovori": [{"tekst": "Grad blizu luke, a nedaleko od rudnika uglja", "tacan": true}, {"tekst": "Planinsko selo daleko od puteva i luka", "tacan": false, "zasto": "Daleko od luke ne bi stizao pamuk niti bi se roba lako izvozila; daleko od rudnika nema uglja."}, {"tekst": "Plantaža u koloniji", "tacan": false, "zasto": "Na plantažama se gajio pamuk, a prerađivao se u Britaniji."}, {"tekst": "Usred šume, zbog drva za gorivo", "tacan": false, "zasto": "Britaniji su nedostajale šume; gorivo je bio kameni ugalj."}], "pomoc": ["Korak 1: Čime se loži parna mašina i odakle to stiže?", "Korak 2: Kako sirovi pamuk stiže iz kolonija?", "Korak 3: Spoji oba uslova. Iz lekcije: fabrike su se dizale blizu luka i rudnika."], "objasnjenje": "Para traži ugalj (rudnik), a pamuk stiže morem (luka) — zato je najbolje mesto kod luke i rudnika, kao Mančester i Liverpul.", "iz_udzbenika": {"strana": 31, "odeljak": "Društvene promene", "tekst": "Parna mašina je omogućila podizanje fabrika blizu luka i rudnika."}}, {"id": "dru-izvor-mancester", "vrsta": "izvor", "tezina": "lako", "pojmovi": ["mancester", "grad-pamuka", "fabrika"], "izvor": {"autor": "Akvarel iz oko 1820.", "naslov": "Mančester oko 1820.", "tekst": "Uz kanal se nižu velike fabričke zgrade na više spratova, sa visokim dimnjacima iz kojih ide dim. U prvom planu su čamci i ljudi. Savremenici su Mančester zvali „Grad pamuka”.", "napomena": "Opis slike je prepričan; udžbenik, str. 31."}, "pitanje": "Zašto su savremenici Mančester zvali „Grad pamuka”?", "odgovori": [{"tekst": "Zbog mnoštva fabrika pamučnih tkanina", "tacan": true}, {"tekst": "Zato što se pamuk gajio na poljima oko grada", "tacan": false, "zasto": "Pamuk se gajio na plantažama u kolonijama; u Mančesteru se prerađivao."}, {"tekst": "Zato što su kuće bile bele kao pamuk", "tacan": false, "zasto": "Na slici su fabrike i dimnjaci; naziv dolazi od proizvodnje tkanina."}, {"tekst": "Zato što je tu izumljen leteći čunak", "tacan": false, "zasto": "Lekcija ne kaže gde je Kej izumeo čunak; naziv dolazi od fabrika pamuka."}], "pomoc": ["Šta prvo uočavaš na slici?", "Šta se proizvodi u tim fabrikama?", "Iz lekcije: zbog mnoštva fabrika pamučnih tkanina."], "objasnjenje": "Velike fabrike pamučnih tkanina i dimnjaci obeležili su Mančester — zato „Grad pamuka”.", "iz_udzbenika": {"strana": 31, "odeljak": "Mančester oko 1820.", "tekst": "Slika Mančestera oko 1820. prikazuje velike fabrike i dimnjake; zvali su ga Gradom pamuka.", "slika": "03-industrijska-revolucija/07-mancester-1820.jpg"}, "osa": {"naziv": "Mančester — Grad pamuka", "od": 1820, "traka": "drustvo"}}, {"id": "dru-izvor-london", "vrsta": "izvor", "tezina": "lako", "pojmovi": ["london", "radnicka-naselja", "radnistvo"], "izvor": {"autor": "Ilustracija iz XIX veka", "naslov": "Radnički kvart Londona", "tekst": "Tamna slika zbijenih kuća, jedna do druge, sa mnogo dimnjaka. Iznad kvarta prolazi vijadukt železnice.", "napomena": "Opis slike je prepričan; udžbenik, str. 32."}, "pitanje": "Kakve uslove života radnika pokazuje ova slika?", "odgovori": [{"tekst": "Prenaseljen, zadimljen kvart u kome su ljudi živeli zbijeno", "tacan": true}, {"tekst": "Prostrane kuće sa vrtovima", "tacan": false, "zasto": "Kuće su zbijene jedna uz drugu — upravo suprotno od prostranih."}, {"tekst": "Seosko imanje daleko od grada", "tacan": false, "zasto": "To je gradski kvart, sa železnicom iznad krovova."}, {"tekst": "Bogatu četvrt vlasnika fabrika", "tacan": false, "zasto": "Ovo je radnički kvart; bogati nisu živeli u ovakvoj gužvi."}], "pomoc": ["Kako su kuće raspoređene?", "Šta je iznad krovova?", "Iz lekcije: prenaseljena radnička naselja bez higijene."], "objasnjenje": "Zbijene kuće, dim i pruga nad krovovima — slika gužve i bede radničkih naselja.", "iz_udzbenika": {"strana": 32, "odeljak": "Radnički kvart Londona", "tekst": "Ilustracija iz XIX veka prikazuje radnički kvart Londona.", "slika": "03-industrijska-revolucija/09-radnicki-kvart-londona.jpg"}}, {"id": "dru-uporedi-klase", "vrsta": "uporedi", "tezina": "lako", "pojmovi": ["gradjanstvo", "burzoazija", "radnistvo", "radnicka-klasa"], "a": "Građanstvo (buržoazija)", "b": "Radništvo (radnička klasa)", "pitanje": "Na koju grupu se odnosi tvrdnja — A, B, obe ili nijednu?", "tvrdnje": [{"tekst": "Jedan njen sloj se industrijom obogatio.", "odgovor": "a", "zasto": "Industrija je obogatila deo građanstva — vlasnike fabrika."}, {"tekst": "Nova grupa koja je nastala sa industrijom.", "odgovor": "b", "zasto": "Radnička klasa je nova društvena grupa."}, {"tekst": "Živela je u prenaseljenim naseljima oko fabrika.", "odgovor": "b", "zasto": "Radnička naselja su nastajala oko fabrika i rudnika."}, {"tekst": "Njen život je promenila industrijska revolucija.", "odgovor": "oba", "zasto": "Jedni su se obogatili, drugi su nastali kao nova grupa — promena je zahvatila obe."}, {"tekst": "Radila je na plantažama pamuka u kolonijama.", "odgovor": "nijedan", "zasto": "Na plantažama su radili crni robovi."}], "pomoc": ["Ko poseduje fabriku, a ko u njoj radi?", "Ko je radio na plantažama?", "Iz lekcije: građanstvo se bogati, radništvo nastaje."], "objasnjenje": "Industrija je društvo podelila na bogate vlasnike iz građanstva i siromašne radnike.", "iz_udzbenika": {"strana": 31, "odeljak": "Društvene promene", "tekst": "Industrija obogaćuje deo građanstva i stvara radničku klasu."}}, {"id": "dru-uporedi-pre-posle", "vrsta": "uporedi", "tezina": "srednje", "pojmovi": ["manufaktura", "fabrika", "industrijska-revolucija"], "a": "Pre industrijske revolucije", "b": "Posle industrijske revolucije", "pitanje": "Na koje razdoblje se odnosi tvrdnja — A, B, oba ili nijedno?", "tvrdnje": [{"tekst": "Roba se pravi ručno u manufakturama i zanatskim radionicama.", "odgovor": "a", "zasto": "Ručna proizvodnja je obeležje vremena pre mašina (XVI–XVIII vek)."}, {"tekst": "Gradovi kao Mančester naglo rastu.", "odgovor": "b", "zasto": "Rast gradova je posledica fabrika i doseljavanja sa sela."}, {"tekst": "Brodovi plove samo na jedra.", "odgovor": "a", "zasto": "Parobrodi se javljaju krajem XVIII i početkom XIX veka."}, {"tekst": "Britanija trguje sa drugim kontinentima.", "odgovor": "oba", "zasto": "Britanija je i pre revolucije bila pomorska sila — trgovina je jedan od uzroka revolucije."}, {"tekst": "Ljudi putuju električnim vozovima.", "odgovor": "nijedan", "zasto": "Lekcija govori o parnim lokomotivama; električnih vozova tada nema."}], "pomoc": ["Šta je uzrok, a šta posledica revolucije?", "Trgovina je postojala i pre.", "Iz lekcije: ručni rad → mašine; selo → grad; jedra → para."], "objasnjenje": "Ručni rad, jedra i manje gradove zamenile su mašine, para i veliki industrijski centri; trgovina je postojala i pre i posle.", "iz_udzbenika": {"strana": 28, "odeljak": "Uvod; Društvene promene", "tekst": "Lekcija opisuje prelaz sa ručne na mašinsku proizvodnju i njegove posledice."}}, {"id": "dru-ko-sam-mancester", "vrsta": "ko_sam", "tezina": "tesko", "pojmovi": ["mancester", "grad-pamuka", "mancester-liverpul"], "tragovi": ["Ja sam grad, a ne ličnost — porastao sam kad su ljudi sa sela došli u fabrike.", "Na slici iz oko 1820. vide se moje višespratne fabrike i dimnjaci uz kanal.", "Prugom sam povezan sa Liverpulom, a savremenici me zovu „Grad pamuka”."], "odgovori": [{"tekst": "Mančester", "tacan": true}, {"tekst": "London", "tacan": false, "zasto": "London je na slici radničkog kvarta; „Grad pamuka” je Mančester."}, {"tekst": "Liverpul", "tacan": false, "zasto": "Liverpul je drugi kraj pruge; nadimak „Grad pamuka” nosi Mančester."}, {"tekst": "Olbani", "tacan": false, "zasto": "Olbani je američki grad na Klermontovoj liniji."}], "objasnjenje": "To je Mančester — industrijski centar i „Grad pamuka”, povezan prugom sa Liverpulom.", "iz_udzbenika": {"strana": 31, "odeljak": "Mančester oko 1820.", "tekst": "Mančester oko 1820. savremenici zovu Gradom pamuka.", "slika": "03-industrijska-revolucija/07-mancester-1820.jpg"}}, {"id": "dru-objasni-mancester", "vrsta": "objasni", "tezina": "lako", "pojmovi": ["mancester", "grad-pamuka", "fabrika"], "pitanje": "Pogledaj sliku Mančestera oko 1820. Šta prvo uočavaš i zašto su ga zvali „Grad pamuka”?", "uzor": "Prvo se vide velike fabrike na više spratova i visoki dimnjaci iz kojih ide dim. U tim fabrikama pravile su se pamučne tkanine, pa je grad dobio ime „Grad pamuka”.", "ideje": ["Velike višespratne fabrike.", "Dimnjaci i dim.", "Fabrike pamučnih tkanina → „Grad pamuka”."], "objasnjenje": "Slika je izvor koji pokazuje kako je industrija promenila izgled grada.", "iz_udzbenika": {"strana": 31, "odeljak": "Mančester oko 1820.", "tekst": "Udžbenik pita šta prvo uočavaš na slici i zašto je Mančester Grad pamuka.", "slika": "03-industrijska-revolucija/07-mancester-1820.jpg"}, "osa": {"naziv": "Mančester — Grad pamuka", "od": 1820, "traka": "drustvo"}}, {"id": "dru-objasni-naselja", "vrsta": "objasni", "tezina": "srednje", "pojmovi": ["radnicka-naselja", "radnistvo", "decji-rad"], "pitanje": "Opiši kako su živeli i radili radnici u doba industrijske revolucije i objasni zašto je bilo tako.", "uzor": "Radnici su radili dugo, bez zaštite na radu, za niske plate, jer su mašine oborile cenu rada; žene i deca su dobijali još manje. Živeli su u prenaseljenim naseljima oko fabrika i rudnika, bez higijene, pa su se širile zarazne bolesti, pothranjenost i alkoholizam.", "ideje": ["Dug rad bez zaštite.", "Niske plate; žene i deca još niže.", "Prenaseljena naselja bez higijene.", "Bolesti, pothranjenost, alkoholizam."], "objasnjenje": "Loši uslovi rada i života objašnjavaju kasnije radničke nemire.", "iz_udzbenika": {"strana": 31, "odeljak": "Društvene promene", "tekst": "Lekcija opisuje niske plate, dečji rad i bedu u radničkim naseljima.", "slika": "03-industrijska-revolucija/09-radnicki-kvart-londona.jpg"}}, {"id": "dru-objasni-posledice", "vrsta": "objasni", "tezina": "tesko", "pojmovi": ["industrijska-revolucija", "gradjanstvo", "radnistvo", "zagadjenje-zivotne-sredine"], "pitanje": "Navedi po jednu dobru i jednu lošu posledicu industrijske revolucije i objasni kako su obe proistekle iz mašinske proizvodnje.", "uzor": "Mašine su proizvodile brzo, pa je roba pojeftinila, a saobraćaj se ubrzao — to je dobro za kupce i trgovinu. Ali ista jeftina proizvodnja uništila je zanatlije, oborila plate radnika, dovela decu u fabrike i zagadila prirodu. Bogatstvo je dobio deo građanstva, a radnici su živeli u bedi.", "ideje": ["Dobro — jeftinija roba ili brži saobraćaj.", "Loše — propast zanatlija, niske plate, dečji rad, beda ili zagađenje.", "Obe posledice dolaze od istog uzroka — mašinske proizvodnje.", "Koristi nisu bile jednako raspoređene (građanstvo – radništvo)."], "objasnjenje": "Isti uzrok može imati i dobre i loše posledice — zavisi za koga.", "iz_udzbenika": {"strana": 31, "odeljak": "Društvene promene", "tekst": "Lekcija nabraja posledice: jeftiniji proizvodi, rast gradova, bogaćenje građanstva, beda radnika i zagađenje."}}]}, {"naslov": "Radnički nemiri i prvi zakoni", "zadaci": [{"id": "rad-izbor-luditi", "vrsta": "izbor", "tezina": "lako", "pojmovi": ["luditi", "ned-lud", "radnicki-nemiri"], "pitanje": "Ko su bili luditi?", "odgovori": [{"tekst": "Radnici koji su lomili mašine, sledbenici Neda Luda", "tacan": true}, {"tekst": "Pronalazači parnih mašina", "tacan": false, "zasto": "Pronalazači su Vat, Stivenson i Fulton; luditi su mašine uništavali."}, {"tekst": "Vlasnici fabrika u Mančesteru", "tacan": false, "zasto": "Vlasnici su bili na drugoj strani — zakoni su štitili njihove mašine od ludita."}, {"tekst": "Robovi na plantažama pamuka", "tacan": false, "zasto": "Luditi su bili britanski fabrički radnici."}], "pomoc": ["Ime im dolazi od jednog radnika.", "Šta rade ljudi na ilustraciji iz XIX veka?", "Iz lekcije: sledbenici Neda Luda, koji su razbijali mašine."], "objasnjenje": "Luditi su radnici, sledbenici Neda Luda, koji su lomili mašine jer su ih krivili za svoj loš položaj.", "iz_udzbenika": {"strana": 32, "odeljak": "Luditi", "tekst": "Luditi su sledbenici Neda Luda; razbijali su mašine koje su krivili za svoje nedaće.", "slika": "03-industrijska-revolucija/08-luditi.jpg"}}, {"id": "rad-izbor-ned-lud", "vrsta": "izbor", "tezina": "srednje", "pojmovi": ["ned-lud", "razboj", "luditi"], "pitanje": "Šta je uradio Ned Lud, po kome su luditi dobili ime?", "odgovori": [{"tekst": "U znak protesta je polomio tkački razboj", "tacan": true}, {"tekst": "Osnovao je prvo radničko udruženje", "tacan": false, "zasto": "Lekcija ne navodi osnivača udruženja; Ned Lud je poznat po lomljenju razboja."}, {"tekst": "Izumeo je leteći čunak", "tacan": false, "zasto": "Leteći čunak je izumeo Džon Kej."}, {"tekst": "Doneo je zakon o radu dece", "tacan": false, "zasto": "Zakone je donosio britanski parlament; Ned Lud je bio radnik."}], "pomoc": ["Bio je radnik u tekstilu.", "Njegov čin su ponavljali njegovi sledbenici.", "Iz lekcije: u znak protesta polomio je tkački razboj."], "objasnjenje": "Ned Lud je polomio tkački razboj u znak protesta, a radnici koji su ga sledili nazvani su luditi.", "iz_udzbenika": {"strana": 32, "odeljak": "Luditi", "tekst": "Ned Lud je bio radnik koji je u znak protesta polomio tkački razboj.", "slika": "03-industrijska-revolucija/08-luditi.jpg"}}, {"id": "rad-izbor-zakoni-kome", "vrsta": "izbor", "tezina": "srednje", "pojmovi": ["britanski-parlament", "luditi", "fabrika"], "pitanje": "U čiju korist su doneti zakoni koji su lomljenje mašina kažnjavali progonstvom (1721) i smrću (1812)?", "odgovori": [{"tekst": "U korist vlasnika fabrika", "tacan": true}, {"tekst": "U korist radnika", "tacan": false, "zasto": "Ovi zakoni su kažnjavali radnike koji lome mašine; zakoni u korist radnika (o radu dece) dolaze kasnije."}, {"tekst": "U korist robova", "tacan": false, "zasto": "Zakoni se odnose na mašine u Britaniji, ne na plantaže."}, {"tekst": "U korist zanatlija", "tacan": false, "zasto": "Zanatlije su propadale zbog fabrika; zakoni su štitili fabričke mašine."}], "pomoc": ["Čije su bile mašine?", "Ko je imao korist ako mašine ostanu čitave?", "Iz lekcije: zakoni su štitili skupe mašine — u korist vlasnika fabrika."], "objasnjenje": "Zakoni su štitili skupe mašine, dakle imovinu vlasnika fabrika — ne radnike.", "iz_udzbenika": {"strana": 32, "odeljak": "Luditi", "tekst": "Parlament je 1721. lomljenje mašina kaznio progonstvom, a 1812. smrću; udžbenik pita u čiju korist.", "slika": "03-industrijska-revolucija/08-luditi.jpg"}}, {"id": "rad-izbor-zastita-vise", "vrsta": "izbor", "tezina": "tesko", "pojmovi": ["radnicka-udruzenja", "britanski-parlament", "decji-rad"], "pitanje": "Šta je tačno o borbi za bolji položaj radnika? (više tačnih)", "odgovori": [{"tekst": "Početkom XIX veka nastaju prva radnička udruženja", "tacan": true}, {"tekst": "Britanski parlament donosi zakone u korist radnika, posebno o radu dece", "tacan": true}, {"tekst": "Slični zakoni donose se i u Francuskoj i Pruskoj", "tacan": true}, {"tekst": "Ovim zakonima je borba radnika bila završena", "tacan": false, "zasto": "Lekcija naglašava da je to tek početak borbe za bolji položaj radnika."}, {"tekst": "Prvi zakoni u korist radnika doneti su već 1721.", "tacan": false, "zasto": "Zakon iz 1721. kažnjavao je lomljenje mašina progonstvom — štitio je vlasnike."}], "pomoc": ["Kada nastaju udruženja i koje države slede Britaniju?", "Pazi na reč „završena” i na godinu 1721.", "Iz lekcije: udruženja početkom XIX veka; zakoni o radu dece u Britaniji, Francuskoj, Pruskoj; tek početak borbe."], "objasnjenje": "Udruženja i prvi zakoni o radu dece bili su tek početak; zakon iz 1721. je bio protiv radnika koji lome mašine.", "iz_udzbenika": {"strana": 32, "odeljak": "Društvene promene", "tekst": "Početkom XIX veka nastaju radnička udruženja, a parlament donosi zakone u korist radnika, posebno o radu dece; to je tek početak."}}, {"id": "rad-tn-nemiri", "vrsta": "tacno_netacno", "tezina": "lako", "pojmovi": ["radnicki-nemiri"], "tvrdnja": "Prvi radnički nemiri u Engleskoj izbili su već krajem XVIII veka.", "tacno": true, "pomoc": ["Nemiri su počeli rano, kad i fabrike.", "Iz lekcije: krajem XVIII veka u Engleskoj."], "objasnjenje": "Tačno — u očajanju, radnici su već krajem XVIII veka lomili mašine.", "iz_udzbenika": {"strana": 32, "odeljak": "Društvene promene", "tekst": "Već krajem XVIII veka u Engleskoj izbijaju prvi radnički nemiri."}}, {"id": "rad-tn-1812", "vrsta": "tacno_netacno", "tezina": "srednje", "pojmovi": ["britanski-parlament", "luditi"], "tvrdnja": "Zakonom iz 1812. lomljenje mašina kažnjavalo se progonstvom.", "tacno": false, "ispravke": [{"tekst": "Progonstvo je propisano 1721, a zakonom iz 1812. smrtna kazna.", "tacan": true}, {"tekst": "Zakonom iz 1812. lomljenje mašina je dozvoljeno.", "tacan": false, "zasto": "Naprotiv — kazna je postala najstroža, smrtna."}, {"tekst": "Zakonom iz 1812. kažnjavali su se vlasnici fabrika.", "tacan": false, "zasto": "Kažnjavali su se oni koji uništavaju mašine — radnici."}], "pomoc": ["Kazne su vremenom postajale strože.", "Iz lekcije: 1721 progonstvo, 1812 smrtna kazna."], "objasnjenje": "Kazna se pooštrila: 1721. progonstvo, 1812. smrt.", "iz_udzbenika": {"strana": 32, "odeljak": "Luditi", "tekst": "Lomljenje mašina je 1721. kažnjavano progonstvom, a od 1812. smrtnom kaznom."}, "osa": {"naziv": "Zakon: smrtna kazna za uništavanje mašina", "od": 1812, "traka": "drustvo"}}, {"id": "rad-tn-kraj", "vrsta": "tacno_netacno", "tezina": "tesko", "pojmovi": ["radnicka-udruzenja", "britanski-parlament", "decji-rad"], "tvrdnja": "Prvim zakonima o radu dece položaj radnika je bio potpuno rešen.", "tacno": false, "ispravke": [{"tekst": "To je bio tek početak borbe za bolji položaj radnika.", "tacan": true}, {"tekst": "Zakoni o radu dece doneti su samo u Rusiji.", "tacan": false, "zasto": "Doneli su ih britanski parlament, pa Francuska, Pruska i druge države."}, {"tekst": "Zakoni o radu dece su zabranili sve fabrike.", "tacan": false, "zasto": "Fabrike su nastavile da rade; zakoni su ograničavali rad dece."}], "pomoc": ["Kakvu reč lekcija koristi za te zakone — kraj ili početak?", "Iz lekcije: to je tek početak borbe."], "objasnjenje": "Prvi zakoni u korist radnika bili su samo prvi korak duge borbe.", "iz_udzbenika": {"strana": 32, "odeljak": "Društvene promene", "tekst": "Zakoni o radu dece bili su tek početak borbe za bolji položaj radnika."}}, {"id": "rad-dopuni-zakoni", "vrsta": "dopuni", "tezina": "srednje", "pojmovi": ["britanski-parlament", "luditi"], "pitanje": "Dopuni rečenice.", "tekst": "Britanski parlament je {{1721}}. proglasio lomljenje mašina zločinom kažnjivim {{progonstvom}}, a zakonom iz {{1812}}. propisana je {{smrtna kazna}}.", "ponudjene": ["1721", "1812", "1769", "progonstvom", "smrtna kazna", "novčanom kaznom"], "pomoc": ["Starija kazna je blaža.", "Iz lekcije: 1721 — progonstvo; 1812 — smrtna kazna."], "objasnjenje": "Kazne su se pooštravale kako se lomljenje mašina širilo.", "iz_udzbenika": {"strana": 32, "odeljak": "Luditi", "tekst": "Zakon iz 1721. propisuje progonstvo, a zakon iz 1812. smrtnu kaznu za uništavanje mašina.", "slika": "03-industrijska-revolucija/08-luditi.jpg"}}, {"id": "rad-dopuni-udruzenja", "vrsta": "dopuni", "tezina": "tesko", "pojmovi": ["radnicka-udruzenja", "britanski-parlament", "decji-rad"], "pitanje": "Dopuni rečenicu (bez ponuđenih reči).", "tekst": "Početkom {{XIX|19.|19}} veka nastaju prva radnička {{udruženja}}, a britanski {{parlament}} počinje da donosi zakone u korist radnika, posebno o radu {{dece}}.", "pomoc": ["Vek posle kraja XVIII.", "Ko u Britaniji donosi zakone?", "Iz lekcije: početak XIX veka, radnička udruženja, parlament, rad dece."], "objasnjenje": "Radnici se organizuju, a država počinje da ih štiti — najpre decu.", "iz_udzbenika": {"strana": 32, "odeljak": "Društvene promene", "tekst": "Početkom XIX veka nastaju radnička udruženja, a parlament donosi zakone o radu dece."}}, {"id": "rad-datum-1721", "vrsta": "datum", "tezina": "srednje", "pojmovi": ["britanski-parlament", "luditi"], "dogadjaj": "Zakon: progonstvo za lomljenje mašina", "pitanje": "Koje godine je britanski parlament proglasio lomljenje mašina zločinom kažnjivim progonstvom?", "godina": 1721, "traka": "drustvo", "pomoc": ["Prilično rano — pre Vatove mašine.", "Treća decenija XVIII veka.", "Iz lekcije: 1721."], "objasnjenje": "1721 — prvi zakon o lomljenju mašina, mnogo pre Vata (1769).", "iz_udzbenika": {"strana": 32, "odeljak": "Luditi", "tekst": "Parlament je 1721. lomljenje mašina proglasio zločinom kažnjivim progonstvom."}}, {"id": "rad-datum-1812", "vrsta": "datum", "tezina": "srednje", "pojmovi": ["britanski-parlament", "luditi"], "dogadjaj": "Zakon: smrtna kazna za uništavanje mašina", "pitanje": "Koje godine je propisana smrtna kazna za uništavanje mašina?", "godina": 1812, "traka": "drustvo", "pomoc": ["Početak XIX veka, druga decenija.", "Dve godine pre Stivensonove lokomotive (1814).", "Iz lekcije: 1812."], "objasnjenje": "1812 — kazna se pooštrava do smrtne.", "iz_udzbenika": {"strana": 32, "odeljak": "Luditi", "tekst": "Zakonom iz 1812. propisana je smrtna kazna za uništavanje mašina."}}, {"id": "rad-poredjaj-zakoni", "vrsta": "poredjaj", "tezina": "srednje", "pojmovi": ["britanski-parlament", "parna-masina", "luditi", "mancester"], "pitanje": "Poređaj događaje hronološki, od najranijeg.", "stavke": [{"tekst": "Lomljenje mašina kažnjava se progonstvom", "godina": 1721, "naziv": "Zakon: progonstvo za lomljenje mašina", "traka": "drustvo"}, {"tekst": "Vat pravi štedljivu parnu mašinu", "godina": 1769, "naziv": "Vatova parna mašina", "traka": "pronalasci"}, {"tekst": "Za uništavanje mašina propisana je smrtna kazna", "godina": 1812, "naziv": "Zakon: smrtna kazna za uništavanje mašina", "traka": "drustvo"}, {"tekst": "Mančester je „Grad pamuka” sa slike", "godina": 1820, "naziv": "Mančester — Grad pamuka", "traka": "drustvo"}], "pomoc": ["Jedan zakon je stariji čak i od Vatove mašine.", "Kazne postaju strože kako ima više fabrika.", "Iz lekcije: 1721, 1769, 1812, oko 1820."], "objasnjenje": "1721 (progonstvo) → 1769 (Vat) → 1812 (smrtna kazna) → oko 1820 (Mančester).", "iz_udzbenika": {"strana": 32, "odeljak": "Luditi", "tekst": "Zakoni o lomljenju mašina doneti su 1721. i 1812."}}, {"id": "rad-poredjaj-mesano", "vrsta": "poredjaj", "tezina": "tesko", "pojmovi": ["industrijska-revolucija", "parobrod", "jedrenjaci", "luditi"], "pitanje": "Poređaj događaje iz cele lekcije hronološki, od najranijeg.", "stavke": [{"tekst": "Lomljenje mašina kažnjava se progonstvom", "godina": 1721, "naziv": "Zakon: progonstvo za lomljenje mašina", "traka": "drustvo"}, {"tekst": "Mašine počinju da zamenjuju ljudsku ruku", "godina": 1750, "do": 1800, "naziv": "Mašine zamenjuju ljudsku ruku", "traka": "pronalasci"}, {"tekst": "Klermont plovi redovnom linijom", "godina": 1807, "naziv": "Fultonov parobrod Klermont", "traka": "saobracaj"}, {"tekst": "Uvedena je smrtna kazna za uništavanje mašina", "godina": 1812, "naziv": "Zakon: smrtna kazna za uništavanje mašina", "traka": "drustvo"}, {"tekst": "Raketa postiže 48 km/h na otvaranju pruge", "godina": 1830, "naziv": "Otvaranje pruge Mančester–Liverpul", "traka": "saobracaj"}, {"tekst": "Parobrodi potiskuju jedrenjake", "godina": 1850, "naziv": "Parobrodi potiskuju jedrenjake", "traka": "saobracaj"}], "pomoc": ["Jedan zakon prethodi celoj mašinskoj eri.", "Klermont je pre smrtne kazne; jedrenjaci nestaju tek sredinom XIX veka.", "Iz lekcije: 1721, druga polovina XVIII veka, 1807, 1812, 1830, sredina XIX veka."], "objasnjenje": "1721 → druga polovina XVIII veka → 1807 → 1812 → 1830 → sredina XIX veka.", "iz_udzbenika": {"strana": 28, "odeljak": "Cela lekcija", "tekst": "Lekcija obuhvata vreme od prvih zakona o mašinama do sredine XIX veka."}}, {"id": "rad-lanac-luditi", "vrsta": "lanac", "tezina": "tesko", "pojmovi": ["luditi", "radnicki-nemiri", "britanski-parlament"], "karike": ["Radnici žive u bedi i krive mašine za svoj loš položaj", "Radnici u očajanju lome fabričke mašine", "?"], "praznina": 2, "odgovori": [{"tekst": "Parlament donosi stroge zakone — sve do smrtne kazne za uništavanje mašina", "tacan": true}, {"tekst": "Vlasnici povećavaju plate i skraćuju radno vreme", "tacan": false, "zasto": "Lekcija ne kaže da su vlasnici popustili; država je odgovorila kaznama."}, {"tekst": "Fabrike se vraćaju ručnom radu", "tacan": false, "zasto": "Mašine su ostale — zakoni su ih štitili."}, {"tekst": "Ukida se dečji rad", "tacan": false, "zasto": "Zakoni o radu dece dolaze kasnije, kao rezultat rada udruženja, a ne kao odgovor na lomljenje."}], "pomoc": ["Korak 1: Ko je posedovao mašine koje su lomljene?", "Korak 2: Kako je država zaštitila tu imovinu?", "Iz lekcije: 1721 progonstvo, 1812 smrtna kazna — u korist vlasnika fabrika."], "objasnjenje": "Lomljenje mašina nije popravilo položaj radnika — država je stala na stranu vlasnika strogim kaznama.", "iz_udzbenika": {"strana": 32, "odeljak": "Luditi", "tekst": "Radnici su krivili mašine i razbijali ih; parlament je propisao progonstvo, pa smrtnu kaznu.", "slika": "03-industrijska-revolucija/08-luditi.jpg"}, "osa": {"naziv": "Zakon: smrtna kazna za uništavanje mašina", "od": 1812, "traka": "drustvo"}}, {"id": "rad-lanac-udruzenja", "vrsta": "lanac", "tezina": "tesko", "pojmovi": ["radnicka-udruzenja", "britanski-parlament", "decji-rad"], "karike": ["Radnici imaju niske plate, a deca rade dugo i bez zaštite", "?", "Britanski parlament donosi zakone o radu dece", "Slične zakone donose Francuska i Pruska"], "praznina": 1, "odgovori": [{"tekst": "Početkom XIX veka radnici osnivaju udruženja koja traže bolji položaj", "tacan": true}, {"tekst": "Radnici se vraćaju na selo", "tacan": false, "zasto": "Lekcija opisuje suprotan tok — sa sela u grad; promena dolazi kroz udruženja."}, {"tekst": "Vlasnici zatvaraju fabrike", "tacan": false, "zasto": "Fabrike rade dalje; menjaju se zakoni o radu."}, {"tekst": "Ukida se ropstvo na plantažama", "tacan": false, "zasto": "Lekcija ne povezuje zakone o radu dece sa ropstvom."}], "pomoc": ["Korak 1: Lomljenje mašina nije pomoglo — šta su radnici sledeće pokušali?", "Korak 2: Ko je posle toga počeo da donosi zakone u korist radnika?", "Iz lekcije: radnička udruženja → zakoni u Britaniji, Francuskoj, Pruskoj."], "objasnjenje": "Organizovan zahtev (udruženja) doneo je više od lomljenja — prve zakone u korist radnika.", "iz_udzbenika": {"strana": 32, "odeljak": "Društvene promene", "tekst": "Radnička udruženja traže bolji položaj, a parlament i druge države donose zakone o radu dece."}}, {"id": "rad-zakljuci-lomljenje", "vrsta": "zakljuci", "tezina": "tesko", "pojmovi": ["luditi", "radnicki-nemiri", "fabrika"], "pitanje": "Zašto su radnici lomili baš mašine, a ne nešto drugo?", "odgovori": [{"tekst": "Krivili su mašine za niske plate i gubitak posla, jer je rad mašina oborio cenu ljudskog rada", "tacan": true}, {"tekst": "Mašine su bile stare i nisu radile", "tacan": false, "zasto": "Mašine su radile i bile skupe — zato su ih zakoni i štitili."}, {"tekst": "Vlasnici su im to naredili", "tacan": false, "zasto": "Vlasnici su bili protiv toga; zakoni u njihovu korist kažnjavali su lomljenje."}, {"tekst": "Hteli su da od delova naprave sopstvene mašine", "tacan": false, "zasto": "Lekcija kaže da su lomili u očajanju, iz protesta."}], "pomoc": ["Korak 1: Šta su mašine promenile u ceni rada?", "Korak 2: Koga su radnici videli kao krivca za svoju bedu?", "Korak 3: Iz lekcije: radnici su razvoj tehnologije često krivili za svoje nedaće."], "objasnjenje": "Mašine su bile vidljiv „krivac” — rad je zbog njih postao jeftin, pa su ih radnici u očajanju uništavali.", "iz_udzbenika": {"strana": 32, "odeljak": "Luditi", "tekst": "Radnici su razvoj tehnologije često krivili za svoje nedaće, pa su razbijali mašine.", "slika": "03-industrijska-revolucija/08-luditi.jpg"}}, {"id": "rad-zakljuci-strogi", "vrsta": "zakljuci", "tezina": "tesko", "pojmovi": ["britanski-parlament", "luditi", "fabrika"], "pitanje": "Šta pooštravanje kazne sa progonstva (1721) na smrtnu kaznu (1812) govori o tom vremenu?", "odgovori": [{"tekst": "Mašina je bilo sve više, a lomljenje se širilo, pa je država još jače štitila vlasnike", "tacan": true}, {"tekst": "Radnici su dobili više prava nego ranije", "tacan": false, "zasto": "Strože kazne za radnike ne znače više prava; prava su došla kasnije kroz udruženja."}, {"tekst": "Mašine su postale manje važne", "tacan": false, "zasto": "Da su bile manje važne, ne bi ih štitili smrtnom kaznom."}, {"tekst": "Lomljenje mašina je potpuno prestalo posle 1721.", "tacan": false, "zasto": "Da je prestalo, ne bi trebao stroži zakon 1812 — ludita je bilo i u XIX veku."}], "pomoc": ["Korak 1: Zašto bi neko pooštrio kaznu — ako problem nestaje ili ako raste?", "Korak 2: Koliko je mašina bilo 1721, a koliko 1812?", "Iz lekcije: zakoni su štitili skupe mašine, u korist vlasnika fabrika."], "objasnjenje": "Što je mašina bilo više i što su bile vrednije, to je država oštrije kažnjavala njihovo uništavanje.", "iz_udzbenika": {"strana": 32, "odeljak": "Luditi", "tekst": "Udžbenik pita zašto su uvedene ovako stroge mere i u čiju korist su donete.", "slika": "03-industrijska-revolucija/08-luditi.jpg"}, "osa": {"naziv": "Zakon: smrtna kazna za uništavanje mašina", "od": 1812, "traka": "drustvo"}}, {"id": "rad-izvor-svedocanstvo", "vrsta": "izvor", "tezina": "srednje", "pojmovi": ["radnistvo", "gradjanstvo"], "izvor": {"autor": "Britanski list", "naslov": "Članak s početka četvrte decenije XIX veka", "tekst": "Bez rada nema bogatstva. Radnik proizvodi hranu, gradi kuće, skladišta i palate, prede i tka — pa ipak ostaje siromašan i gladan. A bogati su oni koji ništa ne rade i imaju svega u izobilju.", "napomena": "Odlomak je prepričan; udžbenik, str. 32 (Svedočanstvo)."}, "pitanje": "Kakav je stav autora prema radnicima, a kakav prema bogatima?", "odgovori": [{"tekst": "Saoseća sa radnicima, a kritikuje bogate koji ne rade", "tacan": true}, {"tekst": "Hvali vlasnike fabrika kao vredne ljude", "tacan": false, "zasto": "Autor bogate opisuje kao one koji ne rade — to je kritika, ne pohvala."}, {"tekst": "Smatra da su radnici sami krivi za siromaštvo", "tacan": false, "zasto": "Autor kaže da radnici stvaraju sve bogatstvo, a ipak su gladni — krivi su nepravedni odnosi."}, {"tekst": "Nema nikakav stav, samo nabraja zanimanja", "tacan": false, "zasto": "Nabrajanje služi da pokaže koliko radnik stvara — stav je jasno na strani radnika."}], "pomoc": ["Ko u odlomku stvara bogatstvo?", "Ko ga uživa, a ne radi?", "Iz lekcije: autor je kritičan prema vlasnicima, saosećajan prema radnicima."], "objasnjenje": "Autor vidi radnika kao izvor svakog bogatstva i osuđuje to što bogati ne rade a imaju sve.", "iz_udzbenika": {"strana": 32, "odeljak": "Svedočanstvo", "tekst": "Udžbenik donosi odlomak iz britanskog lista iz 1830-ih o radnicima i bogatima i pita kakav je stav autora."}}, {"id": "rad-izvor-svedocanstvo-pristrasnost", "vrsta": "izvor", "tezina": "tesko", "pojmovi": ["radnistvo", "gradjanstvo", "burzoazija"], "izvor": {"autor": "Britanski list", "naslov": "Članak s početka četvrte decenije XIX veka", "tekst": "Bez rada nema bogatstva. Radnik proizvodi hranu, gradi kuće, skladišta i palate, prede i tka — pa ipak ostaje siromašan i gladan. A bogati su oni koji ništa ne rade i imaju svega u izobilju.", "napomena": "Odlomak je prepričan; udžbenik, str. 32 (Svedočanstvo)."}, "pitanje": "Šta istoričar može da zaključi iz ovog izvora, a da ne pogreši?", "odgovori": [{"tekst": "Da su već 1830-ih neki ljudi javno kritikovali položaj radnika i bogatstvo vlasnika", "tacan": true}, {"tekst": "Da baš nijedan vlasnik fabrike nikada nije radio", "tacan": false, "zasto": "Izvor iznosi stav jednog lista; ne može da dokaže tvrdnju o svakom vlasniku."}, {"tekst": "Da su svi Britanci tada mislili isto što i autor", "tacan": false, "zasto": "Jedan članak pokazuje mišljenje autora i lista, ne celog naroda; vlasnici bi verovatno pisali drugačije."}, {"tekst": "Da je list napisao sam vlasnik fabrike", "tacan": false, "zasto": "Ton je kritičan prema bogatima — malo je verovatno, a izvor to ne kaže."}], "pomoc": ["Novinski članak iznosi nečiji stav — da li je to isto što i činjenica o svima?", "Šta sigurno znamo: da je neko to napisao i objavio.", "Iz lekcije: autor je kritičan prema vlasnicima, a saosećajan prema radnicima."], "objasnjenje": "Izvor sigurno pokazuje da je kritika postojala i kakav je bio stav autora; o svim vlasnicima i svim Britancima ne govori.", "iz_udzbenika": {"strana": 32, "odeljak": "Svedočanstvo", "tekst": "Odlomak iz britanskog lista iz 1830-ih kritikuje bogate i brani radnike."}}, {"id": "rad-izvor-luditi", "vrsta": "izvor", "tezina": "srednje", "pojmovi": ["luditi", "ned-lud", "razboj"], "izvor": {"autor": "Ilustracija iz XIX veka", "naslov": "Luditi razbijaju mašinu u tekstilnoj fabrici", "tekst": "Dvojica radnika čekićima udaraju po velikom tkačkom razboju u fabrici. Uz sliku stoji da su luditi sledbenici Neda Luda i da je parlament za lomljenje mašina propisao progonstvo (1721), pa smrtnu kaznu (1812).", "napomena": "Opis slike i natpisa je prepričan; udžbenik, str. 32."}, "pitanje": "Zašto su, prema natpisu, radnici razbijali mašine?", "odgovori": [{"tekst": "Krivili su razvoj tehnologije za svoje nedaće", "tacan": true}, {"tekst": "Mašine su bile pokvarene i trebalo ih je baciti", "tacan": false, "zasto": "Natpis govori o protestu, ne o kvaru."}, {"tekst": "Hteli su da pomognu vlasnicima", "tacan": false, "zasto": "Lomljenje je štetilo vlasnicima — zato su zakoni bili u njihovu korist."}, {"tekst": "Zato što je zakon iz 1812. to dozvoljavao", "tacan": false, "zasto": "Zakon iz 1812. je za to propisao smrtnu kaznu."}], "pomoc": ["Šta su radnici mislili o mašinama?", "Bio je to protest.", "Iz lekcije: radnici su razvoj tehnologije krivili za svoje nedaće."], "objasnjenje": "Ilustracija i natpis pokazuju protest — radnici su u mašinama videli krivca za svoju bedu.", "iz_udzbenika": {"strana": 32, "odeljak": "Luditi", "tekst": "Ilustracija iz XIX veka prikazuje ludite kako razbijaju mašinu u tekstilnoj fabrici.", "slika": "03-industrijska-revolucija/08-luditi.jpg"}}, {"id": "rad-uporedi-zakoni", "vrsta": "uporedi", "tezina": "srednje", "pojmovi": ["britanski-parlament", "luditi", "decji-rad"], "a": "Zakoni o lomljenju mašina (1721, 1812)", "b": "Zakoni o radu dece (XIX vek)", "pitanje": "Na koje zakone se odnosi tvrdnja — A, B, obe ili nijedne?", "tvrdnje": [{"tekst": "Doneti su u korist vlasnika fabrika.", "odgovor": "a", "zasto": "Štitili su skupe mašine — imovinu vlasnika."}, {"tekst": "Doneti su u korist radnika.", "odgovor": "b", "zasto": "Zakoni o radu dece prvi su zakoni u korist radnika."}, {"tekst": "Doneo ih je britanski parlament.", "odgovor": "oba", "zasto": "I jedne i druge je donosio britanski parlament."}, {"tekst": "Doneti su i u Francuskoj i Pruskoj.", "odgovor": "b", "zasto": "Lekcija kaže da su Francuska i Pruska sledile Britaniju u zakonima u korist radnika."}, {"tekst": "Ukinuli su fabrike na paru.", "odgovor": "nijedan", "zasto": "Nijedan zakon nije ukinuo fabrike."}], "pomoc": ["Ko je imao koristi od jednih, a ko od drugih?", "Ko ih je donosio?", "Iz lekcije: kazne za lomljenje štite vlasnike; zakoni o radu dece štite radnike."], "objasnjenje": "Isti parlament je prvo štitio mašine od radnika, a kasnije, pod pritiskom udruženja, i radnike — pre svega decu.", "iz_udzbenika": {"strana": 32, "odeljak": "Luditi; Društvene promene", "tekst": "Parlament je kažnjavao lomljenje mašina, a početkom XIX veka počinje da donosi zakone u korist radnika."}}, {"id": "rad-uporedi-radnik-vlasnik", "vrsta": "uporedi", "tezina": "tesko", "pojmovi": ["radnistvo", "gradjanstvo", "burzoazija"], "a": "Radnik", "b": "Vlasnik fabrike", "pitanje": "Na koga se odnosi tvrdnja — radnika, vlasnika, obojicu ili nijednog?", "tvrdnje": [{"tekst": "Prema članku iz 1830-ih, proizvodi hranu, gradi kuće i palate, a ostaje gladan.", "odgovor": "a", "zasto": "Autor članka radnika vidi kao izvor bogatstva koji ostaje siromašan."}, {"tekst": "Zakoni iz 1721. i 1812. štitili su njegovu imovinu.", "odgovor": "b", "zasto": "Zakoni o lomljenju mašina doneti su u korist vlasnika fabrika."}, {"tekst": "Njegov život je iz osnova promenila industrijska revolucija.", "odgovor": "oba", "zasto": "Vlasnik se obogatio, radnik je postao deo nove klase — promena je zahvatila obojicu."}, {"tekst": "Mogao je biti kažnjen smrću ako uništi mašinu.", "odgovor": "a", "zasto": "Zakon iz 1812. bio je usmeren protiv radnika koji lome mašine."}, {"tekst": "Gajio je pamuk na plantaži u koloniji.", "odgovor": "nijedan", "zasto": "Pamuk su na plantažama gajili crni robovi."}], "pomoc": ["Ko je bogat, a ko radi i ostaje gladan?", "Protiv koga su bili zakoni o lomljenju?", "Iz lekcije: građanstvo se bogati; radnici rade dugo za niske plate."], "objasnjenje": "Radnik i vlasnik su dve strane iste fabrike — jedan stvara, drugi poseduje; zakoni su prvo štitili vlasnika.", "iz_udzbenika": {"strana": 32, "odeljak": "Svedočanstvo; Luditi", "tekst": "Lekcija suprotstavlja bogate vlasnike i siromašne radnike i pokazuje zakone u korist vlasnika."}}, {"id": "rad-ko-sam-ned-lud", "vrsta": "ko_sam", "tezina": "srednje", "pojmovi": ["ned-lud", "luditi", "razboj"], "tragovi": ["Bio sam običan radnik, a ne pronalazač ni vladar.", "Moji sledbenici su razbijali mašine u fabrikama.", "U znak protesta polomio sam tkački razboj, a po meni su nazvani luditi."], "odgovori": [{"tekst": "Ned Lud", "tacan": true}, {"tekst": "Džon Kej", "tacan": false, "zasto": "Kej je izumeo leteći čunak — on je tkanje unapredio, a ne razbijao razboje."}, {"tekst": "Džordž Stivenson", "tacan": false, "zasto": "Stivenson je pronalazač lokomotive."}, {"tekst": "Robert Fulton", "tacan": false, "zasto": "Fulton je pronalazač parobroda."}], "objasnjenje": "To je Ned Lud — radnik koji je polomio razboj; njegovi sledbenici su luditi.", "iz_udzbenika": {"strana": 32, "odeljak": "Luditi", "tekst": "Luditi su sledbenici Neda Luda, radnika koji je u znak protesta polomio tkački razboj.", "slika": "03-industrijska-revolucija/08-luditi.jpg"}}, {"id": "rad-objasni-luditi", "vrsta": "objasni", "tezina": "srednje", "pojmovi": ["luditi", "britanski-parlament", "radnicki-nemiri"], "pitanje": "Zašto su luditi lomili mašine i kako je država na to odgovorila? Objasni svojim rečima.", "uzor": "Radnici su živeli u bedi i krivili su mašine za niske plate i gubitak posla, pa su ih u očajanju lomili. Država je stala na stranu vlasnika fabrika — parlament je 1721. lomljenje kaznio progonstvom, a 1812. smrtnom kaznom, da zaštiti skupe mašine.", "ideje": ["Radnici su krivili mašine za svoj loš položaj.", "Lomljenje je bilo čin očajanja i protesta.", "Parlament je propisao progonstvo (1721) i smrtnu kaznu (1812).", "Zakoni su bili u korist vlasnika fabrika."], "objasnjenje": "Prvi odgovor države na radničke nemire bila je kazna, ne pomoć.", "iz_udzbenika": {"strana": 32, "odeljak": "Luditi", "tekst": "Luditi razbijaju mašine; zakoni iz 1721. i 1812. ih strogo kažnjavaju.", "slika": "03-industrijska-revolucija/08-luditi.jpg"}}, {"id": "rad-objasni-svedocanstvo", "vrsta": "objasni", "tezina": "tesko", "pojmovi": ["radnistvo", "gradjanstvo", "burzoazija"], "pitanje": "Članak iz 1830-ih staje na stranu radnika. Kako bi isti događaj verovatno opisao vlasnik fabrike i šta to govori o čitanju istorijskih izvora?", "uzor": "Vlasnik bi verovatno istakao da je uložio novac u fabriku i mašine, da daje posao ljudima sa sela i da su proizvodi postali jeftiniji. Članak i vlasnik bi isti svet videli različito, jer svako piše iz svog ugla. Zato izvor treba čitati pitajući se ko ga je napisao i kome je bio namenjen, i porediti ga sa drugim izvorima.", "ideje": ["Vlasnik bi naglasio svoje ulaganje, posao koji daje ili jeftiniju robu.", "Svaki izvor ima svoj ugao gledanja.", "Treba se pitati ko je autor i kakav mu je stav.", "Izvore treba porediti."], "objasnjenje": "Jedan izvor pokazuje jedan pogled; istoričar sluša više strana.", "iz_udzbenika": {"strana": 32, "odeljak": "Svedočanstvo", "tekst": "Udžbenik pita kakav je odnos autora članka prema vlasnicima fabrika i prema radnicima."}}]}], "baza": {}, "sastav": {"ucenje": 20, "test": 15, "odnos": [40, 40, 20], "ponavljanje": 50}, "osa": {"od": 1700, "do": 1860, "trake": [{"id": "pronalasci", "label": "Pronalasci", "color": "#9c5a2c"}, {"id": "saobracaj", "label": "Saobraćaj", "color": "#3a6ba5"}, {"id": "drustvo", "label": "Društvo", "color": "#1f7a3a"}]}};

const INTERVAL = [0, 1, 3, 7, 14], DAY = 864e5;

function helpHTML(z, s, fresh) {

  if (!s.miss) return '<div class="hl"><h3>Kako se radi</h3><p class="placeholder">' + esc(UPUTSTVO[z.vrsta]) + '</p><p class="placeholder">Posle svake greške ovde stiže sledeći stepenik pomoći.</p></div>';

      (/^[^:]{1,20}:/.test(p) ? fmt(p).replace(/^([^:]{1,20}):/, '<b>$1:</b>') : '<b>' + HELP_LBL[Math.min(i, 3)] + ':</b> ' + fmt(p)) + '</li>').join('') + '</ol>' +
    '<p class="placeholder">Sada nosi ' + ptsFor(s.miss) + ' b. Još jedna greška posle poslednje pomoći otkriva odgovor.</p></div>';

  const opts = z.odgovori || [], w = (s.ui.wrong || []).filter(i => opts[i] && opts[i].zasto);
  const list = (w.length ? w : opts.map((o, i) => i).filter(i => !opts[i].tacan && opts[i].zasto)).map(i => opts[i]);

if (INFO.zasticeno) { const l = document.getElementById('mProt'); l.href = INFO.zasticeno; l.hidden = false; }   // public copy → the one with images

// ---------- outcome ----------
function fail(z, text, given) {
  const s = st(z.id);
  s.miss++;
  (s.log = s.log || []).push({ v: given || '', ok: false });
  const ended = s.miss > steps(z);
  if (ended) { s.status = helpOn() ? 'revealed' : 'failed'; s.pts = 0; firstTry() && learnFrom(z, 0); if (helpOn()) place(z, false); toast(helpOn() ? 'Evo odgovora' : 'Netačno', false); }
  else toast(text || 'Netačno — pokušaj ponovo', false);
  finishCheck(); save(); renderItem(true); renderNav(); refreshScore();
  if (ended ? s.status === 'revealed' : helpOn() && !mobile()) openDrawer();
}
function succeed(z, given, pts) {   // pts: set only by self-graded `objasni`
  const s = st(z.id);
  s.status = 'ok'; s.pts = pts != null ? pts : ptsFor(s.miss);
  (s.log = s.log || []).push({ v: given || '', ok: true });
  if (firstTry()) learnFrom(z, s.pts);
  s.placed = place(z, true);
  toast('Tačno! +' + s.pts + (s.placed ? ' · na vremenskoj osi' : ''), true);
  finishCheck(); save(); renderItem(false); renderNav(); refreshScore();
  openDrawer();
}
const firstTry = () => !(state.mode === 'test' && att() && att().phase === 'ispravka');   // Ispravka does not change mastery

// ---------- item renderers ----------
const main = document.getElementById('main');
function frame(z, s, inner) {
  const n = numOf(z);
  const pts = isDone(s) ? (s.status === 'ok' ? '✓ ' + s.pts + ' b' : s.status === 'failed' ? '✗ 0 b' : 'otkriveno · 0 b') : (s.miss ? 'sada ' + ptsFor(s.miss) + ' b' : 'do 3 b');
  return '<div class="item"><div class="ihead"><span class="vchip">' + VRSTA_LBL[z.vrsta] + '</span>' + tzBadge(z) + ' ' + TEZ_LBL[z.tezina] + '<span>' + esc(deoNaslov(z)) + ' · zadatak ' + n + ' / ' + curItems().length + '</span><span>' + pts + '</span></div>' +
    inner + '<div class="help-inline" id="helpInline"></div><div class="iactions" id="actions"></div>' +
    (isDone(s) ? '<div class="expl' + (s.status === 'ok' ? '' : ' rev') + '">' + (s.status === 'failed' ? 'Netačno. Odgovor ćeš videti u Ispravci.' : fmt(z.objasnjenje || '')) + '</div>' : '') + '</div>';
}
function actions(btns) {
  const a = document.getElementById('actions');
  a.innerHTML = btns.map(b => '<button type="button" id="' + b[0] + '"' + (b[2] ? ' class="' + b[2] + '"' : '') + '>' + b[1] + '</button>').join('');
}
function nextButton(z) {   // done: Sledeći + reopen the drawer; in progress with help used: reopen the help
  const s = st(z.id), a = document.getElementById('actions');
  if (!isDone(s)) {
    if (s.miss && helpOn() && !CLUES[z.vrsta] && !mobile()) {
      a.insertAdjacentHTML('beforeend', '<button type="button" id="btnHelp">Pomoć</button>');
      document.getElementById('btnHelp').addEventListener('click', openDrawer);
    }
    return;
  }
  a.insertAdjacentHTML('beforeend', '<button type="button" class="ok" id="btnNext">Sledeći ›</button>' +
    (s.status !== 'failed' ? '<button type="button" id="btnMore">' + (z.iz_udzbenika ? 'Iz udžbenika' : 'Saznaj više') + '</button>' : ''));
  document.getElementById('btnNext').addEventListener('click', goNext);
  const m = document.getElementById('btnMore'); if (m) m.addEventListener('click', openDrawer);
}

function prelude(z, s) {   // what stands above the options: a source, a cause→effect chain, the clues so far
  const done = isDone(s), right = z.odgovori && z.odgovori.find(o => o.tacan);
  if (z.vrsta === 'izvor') { const iz = z.izvor;
    return '<div class="src">' + (iz.autor || iz.naslov ? '<p class="who">' + esc([iz.autor, iz.naslov].filter(Boolean).join(' — ')) + '</p>' : '') +
      '<blockquote>' + fmt(iz.tekst) + '</blockquote>' + (iz.napomena ? '<p class="nt">' + fmt(iz.napomena) + '</p>' : '') + '</div>'; }
  if (z.vrsta === 'lanac') return '<div class="chain">' + z.karike.map((k, i) => (i ? '<span class="ar">→</span>' : '') +
    (i === z.praznina ? '<div class="lk q' + (done && s.status !== 'failed' ? ' ok' : '') + '">' + (done && s.status !== 'failed' ? fmt(right.tekst) : '?') + '</div>' : '<div class="lk">' + fmt(k) + '</div>')).join('') + '</div>';
  if (z.vrsta === 'ko_sam') { const n = Math.min(z.tragovi.length, done ? z.tragovi.length : s.miss + 1);
    return '<ul class="clues">' + z.tragovi.slice(0, n).map((t, i) => '<li><span class="k">Trag ' + (i + 1) + '</span>' + fmt(t) + '</li>').join('') + '</ul>'; }
  return '';
}
function renderChoice(z, s) {   // izbor, zakljuci, lanac, izvor, ko_sam (+ the correction step of tacno_netacno)
  const opts = shuffled(z.odgovori, z.id);
  const multi = z.odgovori.filter(o => o.tacan).length > 1;
  const ui = s.ui; ui.wrong = ui.wrong || []; ui.pick = ui.pick || [];
  const done = isDone(s), showRight = s.status === 'ok' || s.status === 'revealed';
  const why = o => o.zasto && (helpOn() || (done && s.status !== 'failed')) ? '<span class="why">' + fmt(o.zasto) + '</span>' : '';
  main.innerHTML = frame(z, s, prelude(z, s) + '<h2 class="q">' + fmt(z.pitanje || (z.vrsta === 'ko_sam' ? 'Ko sam ja?' : 'Koja karika nedostaje?')) + '</h2><div class="opts">' + opts.map(([o, i]) =>
    '<button type="button" class="opt' + (multi ? '' : ' round') + (ui.wrong.includes(i) ? ' wrong' : '') + (showRight && o.tacan ? ' right' : '') +
    (!done && ui.pick.includes(i) ? ' picked' : '') + '" data-i="' + i + '"' + (done || ui.wrong.includes(i) ? ' disabled' : '') + '><span class="box"></span><span><span class="ot">' + fmt(o.tekst) + '</span>' +
    (ui.wrong.includes(i) ? why(o) : '') + '</span></button>').join('') + '</div>');
  if (!done && multi) actions([['btnCheck', 'Proveri', 'ok']]);
  if (!done && z.vrsta === 'ko_sam' && s.miss < steps(z)) { actions([['btnClue', 'Još jedan trag']]); document.getElementById('btnClue').addEventListener('click', () => { ui.why = null; fail(z, 'Novi trag', 'zatražen novi trag'); }); }
  main.querySelectorAll('.opt').forEach(b => b.addEventListener('click', () => {
    const i = +b.dataset.i;
    if (!multi) { if (z.odgovori[i].tacan) succeed(z, z.odgovori[i].tekst); else { ui.wrong.push(i); ui.why = z.odgovori[i].zasto || null; fail(z, undefined, z.odgovori[i].tekst); } return; }
    ui.pick = ui.pick.includes(i) ? ui.pick.filter(x => x !== i) : ui.pick.concat(i);
    b.classList.toggle('picked'); save();
  }));
  const chk = document.getElementById('btnCheck');
  if (chk) chk.addEventListener('click', () => {
    if (!ui.pick.length) { toast('Označi bar jedan odgovor', false); return; }
    const right = z.odgovori.map((o, i) => o.tacan ? i : -1).filter(i => i >= 0);
    const wrongPicked = ui.pick.filter(i => !z.odgovori[i].tacan);
    const given = ui.pick.map(i => z.odgovori[i].tekst).join('; ');
    if (!wrongPicked.length && right.every(i => ui.pick.includes(i))) { succeed(z, given); return; }
    ui.wrong = ui.wrong.concat(wrongPicked); ui.pick = ui.pick.filter(i => z.odgovori[i].tacan);
    ui.why = wrongPicked.map(i => z.odgovori[i].zasto).filter(Boolean).join(' ') || null;
    fail(z, wrongPicked.length ? 'Neki od označenih nisu tačni' : 'Nedostaje još tačnih odgovora', given);
  });
  nextButton(z);
}

function renderTN(z, s) {

  let inner = '<h2 class="q">Tačno ili netačno?</h2><p class="stmt">' + fmt(z.tvrdnja) + '</p><div class="tn">' +
