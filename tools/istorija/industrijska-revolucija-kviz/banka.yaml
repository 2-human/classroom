      - id: par-dopuni-grane
        vrsta: dopuni
        tezina: srednje
        pojmovi: [prva-industrijska-revolucija, tekstilna-industrija, metalna-industrija, masinska-industrija, saobracaj]
        pitanje: Dopuni rečenicu.
