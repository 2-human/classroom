          - {tekst: "Postigla je 48 km/h, više od četiri puta brže od kočije.", odgovor: b, zasto: "Na otvaranju 15. septembra 1830. Raketa je išla 48 km/h."}
          - {tekst: "Bila je brža od poštanske kočije.", odgovor: oba, zasto: "U oba slučaja bila je višestruko brža od kočije."}
          - {tekst: "Takmičila se protiv još tri gotove lokomotive.", odgovor: a, zasto: "Na trci su bile gotove četiri lokomotive, jedna nije uzeta u obzir."}
          - {tekst: "Izgubila je od brže lokomotive.", odgovor: nijedan, zasto: "Raketa je pobedila na trci i zato je vozila na otvaranju."}
        pomoc:
          - "Na otvaranju je bila brža nego na trci."
          - "Trka je bila takmičenje, a otvaranje svečanost."
          - "Iz lekcije: 1829 — 30 km/h; 1830 — 48 km/h."
        objasnjenje: Trka (1829, 30 km/h) odlučila je ko vozi; na otvaranju (1830) Raketa je postigla 48 km/h.
        iz_udzbenika: {strana: 30, odeljak: Znatiželja — takmičenje „gvozdenih konja”, tekst: "Izvor navodi brzinu Rakete na trci 1829. i na otvaranju pruge 1830."}
        osa: {naziv: Otvaranje pruge Mančester–Liverpul, od: 1830, traka: saobracaj}

      - id: sao-ko-sam-stivenson
        vrsta: ko_sam
        tezina: lako
        pojmovi: [dzordz-stivenson, parna-lokomotiva, raketa]
        tragovi:
          - Moje vozilo je u početku radilo u rudnicima i izvlačilo vagone sa rudom.
          - Moja „Raketa” je pobedila na trci 1829.
          - Godine 1814. konstruisao sam parnu lokomotivu.
        odgovori:
          - {tekst: "Džordž Stivenson", tacan: true}
          - {tekst: "Robert Fulton", tacan: false, zasto: "Fultonov izum je parobrod, a ne lokomotiva."}
          - {tekst: "Džejms Vat", tacan: false, zasto: "Vat je napravio parnu mašinu 1769, ne lokomotivu."}
          - {tekst: "K. Volmar", tacan: false, zasto: "Volmar je pisac knjige „Vatra i para” o istoriji železnice."}
        objasnjenje: To je Džordž Stivenson — lokomotiva 1814, Raketa 1829.
        iz_udzbenika: {strana: 30, odeljak: Razvoj saobraćaja, tekst: "Stivenson je 1814. konstruisao lokomotivu; njegova Raketa je pobedila 1829.", slika: 03-industrijska-revolucija/05-lokomotiva-raketa.jpg}

      - id: sao-ko-sam-fulton
        vrsta: ko_sam
        tezina: lako
        pojmovi: [robert-fulton, klermont, parobrod]
        tragovi:
          - Bio sam američki pronalazač.
          - Moj brod je imao veliki točak na boku i dimnjak, a plovio je Hadsonom.
          - Godine 1807. prikazao sam parobrod Klermont.
        odgovori:
          - {tekst: "Robert Fulton", tacan: true}
          - {tekst: "Džordž Stivenson", tacan: false, zasto: "Stivenson je britanski pronalazač lokomotive."}
          - {tekst: "Džon Kej", tacan: false, zasto: "Kej je izumeo leteći čunak."}
          - {tekst: "Džejms Vat", tacan: false, zasto: "Vat je britanski pronalazač parne mašine; njegov izum je pokretao i parobrode, ali Klermont je Fultonov."}
        objasnjenje: To je Robert Fulton, tvorac Klermonta (1807).
        iz_udzbenika: {strana: 31, odeljak: Razvoj saobraćaja, tekst: "Američki pronalazač Robert Fulton prikazao je parobrod 1807.", slika: 03-industrijska-revolucija/06-parobrod-klermont.jpg}

      - id: sao-objasni-klermont
        vrsta: objasni
        tezina: lako
        pojmovi: [klermont, parobrod, parna-masina]
        pitanje: Pogledaj sliku Klermonta. Čemu služe veliki točak na boku i dimnjak? Objasni svojim rečima.
        uzor: Veliki točak sa lopaticama okreće parna mašina, i on gura brod kroz vodu. U mašini gori ugalj, a dim od sagorevanja izlazi kroz dimnjak.
        ideje:
          - Točak pokreće brod kroz vodu.
          - Točak okreće parna mašina.
          - Dimnjak odvodi dim od uglja koji gori.
        objasnjenje: Točak i dimnjak su vidljivi delovi parne mašine na brodu.
        iz_udzbenika: {strana: 31, odeljak: Parobrod Klermont, tekst: "Udžbenik pita čemu služe točak na boku i dimnjak Klermonta.", slika: 03-industrijska-revolucija/06-parobrod-klermont.jpg}

      - id: sao-objasni-trka
        vrsta: objasni
        tezina: srednje
        pojmovi: [raketa, mancester-liverpul, parna-lokomotiva]
        pitanje: Zašto je za prugu Mančester–Liverpul organizovana trka lokomotiva i šta je pokazala? Objasni svojim rečima.
        uzor: Pruga je bila gotova 1829, a trebalo je izabrati lokomotivu koja će na njoj voziti. Trka je pokazala koja lokomotiva radi bez kvara i ide najbrže. Pobedila je Stivensonova Raketa, iako je izgledala najskromnije — bila je najpouzdanija i išla 30 km/h, skoro tri puta brže od kočije.
        ideje:
          - Trebalo je izabrati lokomotivu za novu prugu.
          - Pobednik je dobijao nagradu i pravo da vozi na pruzi.
          - Raketa je bila najpouzdanija i najbrža.
          - Izgled nije presudio.
        objasnjenje: Trka je bila provera u praksi — pouzdanost i brzina su važnije od izgleda.
        iz_udzbenika: {strana: 30, odeljak: Znatiželja — takmičenje „gvozdenih konja”, tekst: "Udžbenik prenosi priču o trci lokomotiva 1829.", slika: 03-industrijska-revolucija/05-lokomotiva-raketa.jpg}
        osa: {naziv: Trka lokomotiva (Mančester–Liverpul), od: 1829, traka: saobracaj}

  - naslov: Društvene promene
    zadaci:
      - id: dru-izbor-gradovi
        vrsta: izbor
        tezina: lako
        pojmovi: [mancester, liverpul, fabrika]
        pitanje: Koji britanski gradovi su navedeni kao primer novih industrijskih centara?
        odgovori:
          - {tekst: "Mančester i Liverpul", tacan: true}
          - {tekst: "Njujork i Olbani", tacan: false, zasto: "Njujork i Olbani su američki gradovi povezani Klermontovom linijom."}
          - {tekst: "Stokholm i Sankt Peterburg", tacan: false, zasto: "To su gradovi na severu i istoku Evrope, koje je industrijski razvoj tada uglavnom zaobišao."}
          - {tekst: "Beč i Budim", tacan: false, zasto: "To su gradovi Habzburške monarhije, ne britanski industrijski centri iz lekcije."}
        pomoc:
          - "Između ta dva grada vodila je pruga sa čuvene trke lokomotiva."
          - "Jedan se zvao „Grad pamuka”."
          - "Iz lekcije: Mančester i Liverpul."
        objasnjenje: Mančester i Liverpul su porasli kao industrijski centri zbog doseljavanja ljudi sa sela u fabrike.
        iz_udzbenika: {strana: 31, odeljak: Društvene promene, tekst: "Seljenjem sa sela raste gradsko stanovništvo i razvijaju se industrijski centri poput Mančestera i Liverpula."}

      - id: dru-izbor-gde-fabrike
        vrsta: izbor
        tezina: srednje
        pojmovi: [fabrika, parna-masina]
        pitanje: Gde je parna mašina omogućila da se podižu fabrike?
        odgovori:
          - {tekst: "Blizu luka i rudnika", tacan: true}
          - {tekst: "Samo u planinama, pored brzih reka", tacan: false, zasto: "Snaga vode je pokretala predilice, ali para je omogućila fabrike blizu luka i rudnika."}
          - {tekst: "Na plantažama u kolonijama", tacan: false, zasto: "Na plantažama se gajio pamuk; fabrike su bile u Britaniji."}
          - {tekst: "Samo u Londonu", tacan: false, zasto: "Industrijski centri su bili i Mančester i Liverpul; fabrike su se dizale blizu luka i rudnika."}
        pomoc:
          - "Odakle dolazi ugalj za mašinu, a odakle sirovi pamuk?"
          - "Jedno se vadi iz zemlje, drugo stiže brodom."
          - "Iz lekcije: blizu luka i rudnika."
        objasnjenje: Kraj rudnika je bio ugalj za mašine, a kraj luka sirovina i put za izvoz robe.
        iz_udzbenika: {strana: 31, odeljak: Društvene promene, tekst: "Parna mašina je omogućila podizanje fabrika blizu luka i rudnika."}

      - id: dru-izbor-bolesti-zasto
        vrsta: izbor
        tezina: srednje
        pojmovi: [radnicka-naselja, radnistvo]
        pitanje: Zašto su se u radničkim naseljima širile zarazne bolesti?
        odgovori:
          - {tekst: "Zato što su naselja bila prenaseljena i bez higijenskih uslova", tacan: true}
          - {tekst: "Zato što su radnici dolazili iz kolonija", tacan: false, zasto: "Radnici su dolazili sa britanskih sela, a bolesti su se širile zbog prenaseljenosti i prljavštine."}
          - {tekst: "Zato što su naselja bila daleko od fabrika", tacan: false, zasto: "Naselja su nicala baš oko fabrika i rudnika, na obodima gradova."}
          - {tekst: "Zato što su radnici imali previše hrane", tacan: false, zasto: "Obrnuto — vladala je pothranjenost."}
        pomoc:
          - "Zamisli mnogo ljudi zbijenih u malim kućama."
          - "Šta nedostaje — voda, kanalizacija, čistoća?"
          - "Iz lekcije: prenaseljena naselja bez higijenskih uslova."
        objasnjenje: Gužva i nedostatak higijene doveli su do zaraznih bolesti, a uz to su vladali pothranjenost i alkoholizam.
        iz_udzbenika: {strana: 31, odeljak: Društvene promene, tekst: "Prenaseljena radnička naselja bez higijene donose zarazne bolesti, pothranjenost i alkoholizam.", slika: 03-industrijska-revolucija/09-radnicki-kvart-londona.jpg}

      - id: dru-tn-zene-deca
        vrsta: tacno_netacno
        tezina: lako
        pojmovi: [decji-rad, radnistvo]
        tvrdnja: Žene i deca su u fabrikama dobijali veće plate od muškaraca.
        tacno: false
        ispravke:
          - {tekst: "Žene i deca su radili za još niže plate.", tacan: true}
          - {tekst: "Žene i deca nisu radili u fabrikama.", tacan: false, zasto: "Radili su — i to dugo i bez zaštite."}
          - {tekst: "Žene i deca su radili bez ikakve plate, kao robovi.", tacan: false, zasto: "Bili su plaćeni, ali još slabije od muškaraca; robovi su radili na plantažama."}
        pomoc:
          - "Zašto bi vlasnik rado zaposlio dete?"
          - "Iz lekcije: žene i deca rade za još niže plate."
        objasnjenje: Žene i deca su bili najjeftinija radna snaga — radili su dugo, za još niže plate.
        iz_udzbenika: {strana: 31, odeljak: Društvene promene, tekst: "U fabrikama rade i žene i deca, sa još nižim platama."}

      - id: dru-tn-zagadjenje
        vrsta: tacno_netacno
        tezina: lako
        pojmovi: [zagadjenje-zivotne-sredine, fabrika]
        tvrdnja: Fabrike su otrovne gasove i tečnosti ispuštale direktno u prirodu.
        tacno: true
        pomoc:
          - "Pogledaj dimnjake na slici Mančestera."
          - "Iz lekcije: posledica je zagađenje životne sredine."
        objasnjenje: Tačno — zagađenje životne sredine je još jedna posledica industrijske revolucije.
        iz_udzbenika: {strana: 32, odeljak: Društvene promene, tekst: "Fabrike ispuštaju otrovne gasove i tečnosti u prirodu, što zagađuje životnu sredinu."}

      - id: dru-tn-zastita
        vrsta: tacno_netacno
        tezina: lako
        pojmovi: [radnistvo, fabrika]
        tvrdnja: Radnici u prvim fabrikama radili su kratko i uz dobru zaštitu na radu.
        tacno: false
        ispravke:
          - {tekst: "Radili su dugo, bez osnovne zaštite na radu.", tacan: true}
          - {tekst: "Radili su kratko, ali bez plate.", tacan: false, zasto: "Radili su dugo i dobijali niske plate."}
          - {tekst: "Radili su dugo, ali za veoma visoke plate.", tacan: false, zasto: "Mašinska proizvodnja je oborila cenu rada — plate su bile niske."}
        pomoc:
          - "Kakav je bio položaj radnika — dobar ili loš?"
          - "Iz lekcije: dug rad, bez osnovne zaštite."
        objasnjenje: Radni dan je bio dug, a zaštite na radu nije bilo.
        iz_udzbenika: {strana: 31, odeljak: Društvene promene, tekst: "Radilo se dugo, bez osnovne zaštite na radu."}

      - id: dru-tn-gradjanstvo
        vrsta: tacno_netacno
        tezina: srednje
        pojmovi: [gradjanstvo, burzoazija, radnistvo]
        tvrdnja: Industrija je podjednako obogatila sve stanovnike Britanije.
        tacno: false
        ispravke:
          - {tekst: "Obogatila je jedan sloj građanstva (buržoazije), a radnici su ostali siromašni.", tacan: true}
          - {tekst: "Obogatila je zanatlije, a građanstvo osiromašila.", tacan: false, zasto: "Sitne zanatlije su propale; bogatio se jedan sloj građanstva."}
          - {tekst: "Obogatila je samo seljake koji su ostali na selu.", tacan: false, zasto: "Seljaci su odlazili u gradove tražeći posao; bogatili su se vlasnici fabrika iz građanstva."}
        pomoc:
          - "Ko je posedovao fabrike, a ko u njima radio?"
          - "Iz lekcije: obogatio se jedan sloj građanstva; nastalo je radništvo."
        objasnjenje: Bogatstvo je pripalo delu građanstva; radnici su živeli u bedi — društvo se podelilo.
        iz_udzbenika: {strana: 31, odeljak: Društvene promene, tekst: "Industrija je obogatila jedan sloj građanstva (buržoazije) i stvorila radničku klasu."}

      - id: dru-dopuni-klase
        vrsta: dopuni
        tezina: lako
        pojmovi: [gradjanstvo, burzoazija, radnicka-klasa]
        pitanje: Dopuni rečenicu.
        tekst: "Industrija je obogatila jedan sloj {{građanstva}} (buržoazije) i dovela do nastanka nove grupe — {{radničke klase}}."
        ponudjene: [građanstva, radničke klase, plemstva, sveštenstva]
        pomoc:
          - "Jedni poseduju fabrike, drugi u njima rade."
          - "Iz lekcije: građanstvo (buržoazija) i radnička klasa."
        objasnjenje: Bogati vlasnici iz građanstva i siromašni radnici — dve grupe koje je stvorila industrija.
        iz_udzbenika: {strana: 31, odeljak: Društvene promene, tekst: "Industrija je obogatila jedan sloj građanstva i stvorila radničku klasu."}

      - id: dru-dopuni-posledice
        vrsta: dopuni
        tezina: tesko
        pojmovi: [fabrika, mancester, liverpul, zagadjenje-zivotne-sredine]
        pitanje: Dopuni rečenice (bez ponuđenih reči).
        tekst: "Razvoj industrije {{pojeftinio}} je proizvode, pa su sitne zanatlije i {{manufakture}} propale. Ljudi sa {{sela}} odlaze u gradove kao što su Mančester i {{Liverpul}}, a fabrike svojim otrovima izazivaju {{zagađenje}} životne sredine."
        pomoc:
          - "Šta se desilo sa cenom robe kad su je pravile mašine?"
          - "Odakle dolaze novi stanovnici gradova?"
          - "Iz lekcije: pojeftinjenje, propast manufaktura, selo → grad, Mančester i Liverpul, zagađenje."
        objasnjenje: Jeftina roba, propast starih radionica, rast gradova i zagađenje — posledice koje i danas prepoznajemo.
        iz_udzbenika: {strana: 31, odeljak: Društvene promene, tekst: "Industrija pojeftinjuje proizvode, zanatlije propadaju, gradovi rastu, a priroda se zagađuje."}

      - id: dru-povezi-posledice
