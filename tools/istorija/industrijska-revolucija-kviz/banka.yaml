          - {tekst: "Mašine su bile pokvarene i trebalo ih je baciti", tacan: false, zasto: "Natpis govori o protestu, ne o kvaru."}
          - {tekst: "Hteli su da pomognu vlasnicima", tacan: false, zasto: "Lomljenje je štetilo vlasnicima — zato su zakoni bili u njihovu korist."}
          - {tekst: "Zato što je zakon iz 1812. to dozvoljavao", tacan: false, zasto: "Zakon iz 1812. je za to propisao smrtnu kaznu."}
        pomoc:
          - "Šta su radnici mislili o mašinama?"
          - "Bio je to protest."
          - "Iz lekcije: radnici su razvoj tehnologije krivili za svoje nedaće."
        objasnjenje: Ilustracija i natpis pokazuju protest — radnici su u mašinama videli krivca za svoju bedu.
        iz_udzbenika: {strana: 32, odeljak: Luditi, tekst: "Ilustracija iz XIX veka prikazuje ludite kako razbijaju mašinu u tekstilnoj fabrici.", slika: 03-industrijska-revolucija/08-luditi.jpg}

      - id: rad-uporedi-zakoni
        vrsta: uporedi
        tezina: srednje
        pojmovi: [britanski-parlament, luditi, decji-rad]
        a: Zakoni o lomljenju mašina (1721, 1812)
        b: Zakoni o radu dece (XIX vek)
        pitanje: Na koje zakone se odnosi tvrdnja — A, B, obe ili nijedne?
        tvrdnje:
          - {tekst: "Doneti su u korist vlasnika fabrika.", odgovor: a, zasto: "Štitili su skupe mašine — imovinu vlasnika."}
          - {tekst: "Doneti su u korist radnika.", odgovor: b, zasto: "Zakoni o radu dece prvi su zakoni u korist radnika."}
          - {tekst: "Doneo ih je britanski parlament.", odgovor: oba, zasto: "I jedne i druge je donosio britanski parlament."}
          - {tekst: "Doneti su i u Francuskoj i Pruskoj.", odgovor: b, zasto: "Lekcija kaže da su Francuska i Pruska sledile Britaniju u zakonima u korist radnika."}
          - {tekst: "Ukinuli su fabrike na paru.", odgovor: nijedan, zasto: "Nijedan zakon nije ukinuo fabrike."}
        pomoc:
          - "Ko je imao koristi od jednih, a ko od drugih?"
          - "Ko ih je donosio?"
          - "Iz lekcije: kazne za lomljenje štite vlasnike; zakoni o radu dece štite radnike."
        objasnjenje: Isti parlament je prvo štitio mašine od radnika, a kasnije, pod pritiskom udruženja, i radnike — pre svega decu.
        iz_udzbenika: {strana: 32, odeljak: Luditi; Društvene promene, tekst: "Parlament je kažnjavao lomljenje mašina, a početkom XIX veka počinje da donosi zakone u korist radnika."}

      - id: rad-uporedi-radnik-vlasnik
        vrsta: uporedi
        tezina: tesko
        pojmovi: [radnistvo, gradjanstvo, burzoazija]
        a: Radnik
        b: Vlasnik fabrike
        pitanje: Na koga se odnosi tvrdnja — radnika, vlasnika, obojicu ili nijednog?
        tvrdnje:
          - {tekst: "Prema članku iz 1830-ih, proizvodi hranu, gradi kuće i palate, a ostaje gladan.", odgovor: a, zasto: "Autor članka radnika vidi kao izvor bogatstva koji ostaje siromašan."}
          - {tekst: "Zakoni iz 1721. i 1812. štitili su njegovu imovinu.", odgovor: b, zasto: "Zakoni o lomljenju mašina doneti su u korist vlasnika fabrika."}
          - {tekst: "Njegov život je iz osnova promenila industrijska revolucija.", odgovor: oba, zasto: "Vlasnik se obogatio, radnik je postao deo nove klase — promena je zahvatila obojicu."}
          - {tekst: "Mogao je biti kažnjen smrću ako uništi mašinu.", odgovor: a, zasto: "Zakon iz 1812. bio je usmeren protiv radnika koji lome mašine."}
          - {tekst: "Gajio je pamuk na plantaži u koloniji.", odgovor: nijedan, zasto: "Pamuk su na plantažama gajili crni robovi."}
        pomoc:
          - "Ko je bogat, a ko radi i ostaje gladan?"
          - "Protiv koga su bili zakoni o lomljenju?"
          - "Iz lekcije: građanstvo se bogati; radnici rade dugo za niske plate."
        objasnjenje: Radnik i vlasnik su dve strane iste fabrike — jedan stvara, drugi poseduje; zakoni su prvo štitili vlasnika.
        iz_udzbenika: {strana: 32, odeljak: Svedočanstvo; Luditi, tekst: "Lekcija suprotstavlja bogate vlasnike i siromašne radnike i pokazuje zakone u korist vlasnika."}

      - id: rad-ko-sam-ned-lud
