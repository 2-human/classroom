        pojmovi: [ned-lud, luditi, razboj]
        tragovi:
          - Bio sam običan radnik, a ne pronalazač ni vladar.
          - Moji sledbenici su razbijali mašine u fabrikama.
          - U znak protesta polomio sam tkački razboj, a po meni su nazvani luditi.
        odgovori:
          - {tekst: "Ned Lud", tacan: true}
          - {tekst: "Džon Kej", tacan: false, zasto: "Kej je izumeo leteći čunak — on je tkanje unapredio, a ne razbijao razboje."}
          - {tekst: "Džordž Stivenson", tacan: false, zasto: "Stivenson je pronalazač lokomotive."}
          - {tekst: "Robert Fulton", tacan: false, zasto: "Fulton je pronalazač parobroda."}
        objasnjenje: To je Ned Lud — radnik koji je polomio razboj; njegovi sledbenici su luditi.
        iz_udzbenika: {strana: 32, odeljak: Luditi, tekst: "Luditi su sledbenici Neda Luda, radnika koji je u znak protesta polomio tkački razboj.", slika: 03-industrijska-revolucija/08-luditi.jpg}

      - id: rad-objasni-luditi
        vrsta: objasni
        tezina: srednje
        pojmovi: [luditi, britanski-parlament, radnicki-nemiri]
        pitanje: Zašto su luditi lomili mašine i kako je država na to odgovorila? Objasni svojim rečima.
        uzor: Radnici su živeli u bedi i krivili su mašine za niske plate i gubitak posla, pa su ih u očajanju lomili. Država je stala na stranu vlasnika fabrika — parlament je 1721. lomljenje kaznio progonstvom, a 1812. smrtnom kaznom, da zaštiti skupe mašine.
        ideje:
          - Radnici su krivili mašine za svoj loš položaj.
          - Lomljenje je bilo čin očajanja i protesta.
          - Parlament je propisao progonstvo (1721) i smrtnu kaznu (1812).
          - Zakoni su bili u korist vlasnika fabrika.
        objasnjenje: Prvi odgovor države na radničke nemire bila je kazna, ne pomoć.
        iz_udzbenika: {strana: 32, odeljak: Luditi, tekst: "Luditi razbijaju mašine; zakoni iz 1721. i 1812. ih strogo kažnjavaju.", slika: 03-industrijska-revolucija/08-luditi.jpg}

      - id: rad-objasni-svedocanstvo
        vrsta: objasni
        tezina: tesko
        pojmovi: [radnistvo, gradjanstvo, burzoazija]
        pitanje: Članak iz 1830-ih staje na stranu radnika. Kako bi isti događaj verovatno opisao vlasnik fabrike i šta to govori o čitanju istorijskih izvora?
        uzor: Vlasnik bi verovatno istakao da je uložio novac u fabriku i mašine, da daje posao ljudima sa sela i da su proizvodi postali jeftiniji. Članak i vlasnik bi isti svet videli različito, jer svako piše iz svog ugla. Zato izvor treba čitati pitajući se ko ga je napisao i kome je bio namenjen, i porediti ga sa drugim izvorima.
        ideje:
          - Vlasnik bi naglasio svoje ulaganje, posao koji daje ili jeftiniju robu.
          - Svaki izvor ima svoj ugao gledanja.
          - Treba se pitati ko je autor i kakav mu je stav.
          - Izvore treba porediti.
        objasnjenje: Jedan izvor pokazuje jedan pogled; istoričar sluša više strana.
        iz_udzbenika: {strana: 32, odeljak: Svedočanstvo, tekst: "Udžbenik pita kakav je odnos autora članka prema vlasnicima fabrika i prema radnicima."}
