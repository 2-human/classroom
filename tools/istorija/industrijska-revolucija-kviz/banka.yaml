        tezina: srednje
        pojmovi: [radnicka-naselja, radnistvo]
        karike:
          - Mnogo ljudi dolazi da radi u fabrikama i rudnicima
          - Oko fabrika nastaju prenaseljena naselja bez higijene
          - "?"
        praznina: 2
        odgovori:
          - {tekst: "Šire se zarazne bolesti, pothranjenost i alkoholizam", tacan: true}
          - {tekst: "Radnici postaju bogatiji od vlasnika", tacan: false, zasto: "Radnici su bili siromašni; bogatio se deo građanstva."}
          - {tekst: "Grade se parobrodi", tacan: false, zasto: "Parobrodi su deo razvoja saobraćaja, ne posledica stanja u naseljima."}
          - {tekst: "Zagađenje prestaje", tacan: false, zasto: "Fabrike su i dalje ispuštale otrove; zagađenje je raslo."}
