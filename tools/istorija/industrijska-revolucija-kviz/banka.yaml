        iz_udzbenika: {strana: 31, odeljak: Društvene promene, tekst: "Oko fabrika i rudnika nastaju prenaseljena naselja bez higijene, sa bolestima, pothranjenošću i alkoholizmom.", slika: 03-industrijska-revolucija/09-radnicki-kvart-londona.jpg}

      - id: dru-lanac-plate
        vrsta: lanac
        tezina: srednje
        pojmovi: [decji-rad, radnistvo, fabrika]
        karike:
          - Mašine obavljaju posao koji je ranije tražio veštu ruku
          - "?"
          - Vlasnici zapošljavaju i žene i decu za još niže plate
        praznina: 1
        odgovori:
          - {tekst: "Rad postaje jeftin — cena rada pada", tacan: true}
          - {tekst: "Radnici dobijaju veće plate", tacan: false, zasto: "Obrnuto — mašinska proizvodnja je oborila cenu rada."}
          - {tekst: "Fabrikama nedostaje radnika", tacan: false, zasto: "Radnika je bilo mnogo jer su dolazili sa sela."}
          - {tekst: "Parlament zabranjuje mašine", tacan: false, zasto: "Parlament je štitio mašine — kažnjavao je njihovo lomljenje."}
        pomoc:
          - "Korak 1: Treba li za mašinom veliki majstor?"
          - "Korak 2: Šta se onda dešava sa platom?"
          - "Iz lekcije: mašinska proizvodnja → niska cena rada; žene i deca još slabije plaćeni."
        objasnjenje: Kad mašina radi umesto majstora, svako može da je opslužuje — rad postaje jeftin, pa i deca rade za male pare.
        iz_udzbenika: {strana: 31, odeljak: Društvene promene, tekst: "Mašinska proizvodnja dovela je do niske cene rada; žene i deca imali su još niže plate."}

      - id: dru-zakljuci-zanatlije
        vrsta: zakljuci
        tezina: lako
        pojmovi: [manufaktura, fabrika]
        pitanje: Zašto su sitne zanatlije propadale u doba industrijske revolucije?
        odgovori:
          - {tekst: "Nisu mogle da prodaju jeftino kao fabrike", tacan: true}
          - {tekst: "Zato što su ih luditi napadali", tacan: false, zasto: "Luditi su bili radnici koji su lomili fabričke mašine, ne zanatlije."}
          - {tekst: "Zato što je parlament zabranio zanate", tacan: false, zasto: "Lekcija ne pominje zabranu zanata; propali su zbog jeftinije fabričke robe."}
          - {tekst: "Zato što su se svi preselili u kolonije", tacan: false, zasto: "Lekcija govori o seljenju sa sela u gradove, ne u kolonije."}
        pomoc:
          - "Korak 1: Kakva je bila cena fabričke robe?"
          - "Korak 2: Šta kupac bira između dve iste stvari?"
          - "Iz lekcije: pojeftinjenje proizvoda → propast zanatlija i manufaktura."
        objasnjenje: Fabrička roba je bila jeftinija, pa su kupci prestali da kupuju od zanatlija.
        iz_udzbenika: {strana: 31, odeljak: Društvene promene, tekst: "Razvoj industrije pojeftinio je proizvode, pa sitne zanatlije i manufakture propadaju."}

      - id: dru-zakljuci-selo-grad
        vrsta: zakljuci
        tezina: lako
        pojmovi: [fabrika, radnistvo]
        pitanje: Zašto su ljudi napuštali sela i odlazili u gradove?
        odgovori:
          - {tekst: "Tražili su posao u novim fabrikama", tacan: true}
          - {tekst: "U gradovima je bio čistiji vazduh", tacan: false, zasto: "Bilo je obrnuto — fabrike su zagađivale gradove."}
          - {tekst: "U gradovima su dobijali besplatne kuće", tacan: false, zasto: "Radnici su živeli u prenaseljenim naseljima bez higijene."}
          - {tekst: "Vlast ih je proterala sa sela", tacan: false, zasto: "Lekcija kaže da su odlazili tražeći posao."}
        pomoc:
          - "Korak 1: Šta je novo nastajalo u gradovima?"
          - "Korak 2: Šta je fabrikama trebalo?"
          - "Iz lekcije: ljudi sa sela odlaze u gradove tražeći posao."
        objasnjenje: Fabrike su nudile posao, pa su ljudi sa sela dolazili u gradove — i gradovi su naglo rasli.
        iz_udzbenika: {strana: 31, odeljak: Društvene promene, tekst: "Otvaranjem fabrika ljudi sa sela odlaze u gradove tražeći posao."}

      - id: dru-zakljuci-zene-deca
        vrsta: zakljuci
        tezina: srednje
        pojmovi: [decji-rad, radnistvo]
        pitanje: Zašto su mnogi vlasnici fabrika zapošljavali žene i decu?
        odgovori:
          - {tekst: "Zato što su im plaćali još manje nego muškarcima", tacan: true}
          - {tekst: "Zato što je zakon to tražio", tacan: false, zasto: "Zakoni o radu dece kasnije su ga ograničavali, a ne tražili."}
          - {tekst: "Zato što su deca bila školovanija", tacan: false, zasto: "Lekcija o tome ne govori; presudna je bila niska plata."}
          - {tekst: "Zato što muškaraca nije bilo u gradovima", tacan: false, zasto: "U gradove su dolazili svi sa sela; vlasnicima je odgovarala jeftinija radna snaga."}
        pomoc:
          - "Korak 1: Šta vlasnik želi da smanji?"
          - "Korak 2: Ko je dobijao najnižu platu?"
          - "Iz lekcije: žene i deca rade sa još nižim platama."
        objasnjenje: Za vlasnika su žene i deca bili najjeftinija radna snaga.
        iz_udzbenika: {strana: 31, odeljak: Društvene promene, tekst: "U fabrikama rade i žene i deca, sa još nižim platama, dugo i bez zaštite."}

      - id: dru-zakljuci-gde-fabrika
        vrsta: zakljuci
        tezina: tesko
        pojmovi: [fabrika, parna-masina, kameni-ugalj]
        pitanje: "Vlasnik oko 1810. želi da otvori fabriku pamučnih tkanina sa parnom mašinom. Na osnovu lekcije, koje mesto je najbolje?"
        odgovori:
          - {tekst: "Grad blizu luke, a nedaleko od rudnika uglja", tacan: true}
          - {tekst: "Planinsko selo daleko od puteva i luka", tacan: false, zasto: "Daleko od luke ne bi stizao pamuk niti bi se roba lako izvozila; daleko od rudnika nema uglja."}
          - {tekst: "Plantaža u koloniji", tacan: false, zasto: "Na plantažama se gajio pamuk, a prerađivao se u Britaniji."}
          - {tekst: "Usred šume, zbog drva za gorivo", tacan: false, zasto: "Britaniji su nedostajale šume; gorivo je bio kameni ugalj."}
        pomoc:
          - "Korak 1: Čime se loži parna mašina i odakle to stiže?"
          - "Korak 2: Kako sirovi pamuk stiže iz kolonija?"
          - "Korak 3: Spoji oba uslova. Iz lekcije: fabrike su se dizale blizu luka i rudnika."
        objasnjenje: Para traži ugalj (rudnik), a pamuk stiže morem (luka) — zato je najbolje mesto kod luke i rudnika, kao Mančester i Liverpul.
        iz_udzbenika: {strana: 31, odeljak: Društvene promene, tekst: "Parna mašina je omogućila podizanje fabrika blizu luka i rudnika."}

      - id: dru-izvor-mancester
        vrsta: izvor
        tezina: lako
        pojmovi: [mancester, grad-pamuka, fabrika]
        izvor:
          autor: Akvarel iz oko 1820.
          naslov: Mančester oko 1820.
          tekst: Uz kanal se nižu velike fabričke zgrade na više spratova, sa visokim dimnjacima iz kojih ide dim. U prvom planu su čamci i ljudi. Savremenici su Mančester zvali „Grad pamuka”.
          napomena: Opis slike je prepričan; udžbenik, str. 31.
        pitanje: Zašto su savremenici Mančester zvali „Grad pamuka”?
        odgovori:
          - {tekst: "Zbog mnoštva fabrika pamučnih tkanina", tacan: true}
          - {tekst: "Zato što se pamuk gajio na poljima oko grada", tacan: false, zasto: "Pamuk se gajio na plantažama u kolonijama; u Mančesteru se prerađivao."}
          - {tekst: "Zato što su kuće bile bele kao pamuk", tacan: false, zasto: "Na slici su fabrike i dimnjaci; naziv dolazi od proizvodnje tkanina."}
          - {tekst: "Zato što je tu izumljen leteći čunak", tacan: false, zasto: "Lekcija ne kaže gde je Kej izumeo čunak; naziv dolazi od fabrika pamuka."}
        pomoc:
          - "Šta prvo uočavaš na slici?"
          - "Šta se proizvodi u tim fabrikama?"
          - "Iz lekcije: zbog mnoštva fabrika pamučnih tkanina."
        objasnjenje: Velike fabrike pamučnih tkanina i dimnjaci obeležili su Mančester — zato „Grad pamuka”.
        iz_udzbenika: {strana: 31, odeljak: Mančester oko 1820., tekst: "Slika Mančestera oko 1820. prikazuje velike fabrike i dimnjake; zvali su ga Gradom pamuka.", slika: 03-industrijska-revolucija/07-mancester-1820.jpg}
        osa: {naziv: Mančester — Grad pamuka, od: 1820, traka: drustvo}

      - id: dru-izvor-london
        vrsta: izvor
        tezina: lako
        pojmovi: [london, radnicka-naselja, radnistvo]
        izvor:
          autor: Ilustracija iz XIX veka
          naslov: Radnički kvart Londona
          tekst: Tamna slika zbijenih kuća, jedna do druge, sa mnogo dimnjaka. Iznad kvarta prolazi vijadukt železnice.
          napomena: Opis slike je prepričan; udžbenik, str. 32.
        pitanje: Kakve uslove života radnika pokazuje ova slika?
        odgovori:
          - {tekst: "Prenaseljen, zadimljen kvart u kome su ljudi živeli zbijeno", tacan: true}
          - {tekst: "Prostrane kuće sa vrtovima", tacan: false, zasto: "Kuće su zbijene jedna uz drugu — upravo suprotno od prostranih."}
          - {tekst: "Seosko imanje daleko od grada", tacan: false, zasto: "To je gradski kvart, sa železnicom iznad krovova."}
          - {tekst: "Bogatu četvrt vlasnika fabrika", tacan: false, zasto: "Ovo je radnički kvart; bogati nisu živeli u ovakvoj gužvi."}
        pomoc:
          - "Kako su kuće raspoređene?"
          - "Šta je iznad krovova?"
          - "Iz lekcije: prenaseljena radnička naselja bez higijene."
        objasnjenje: Zbijene kuće, dim i pruga nad krovovima — slika gužve i bede radničkih naselja.
        iz_udzbenika: {strana: 32, odeljak: Radnički kvart Londona, tekst: "Ilustracija iz XIX veka prikazuje radnički kvart Londona.", slika: 03-industrijska-revolucija/09-radnicki-kvart-londona.jpg}

      - id: dru-uporedi-klase
        vrsta: uporedi
        tezina: lako
        pojmovi: [gradjanstvo, burzoazija, radnistvo, radnicka-klasa]
        a: Građanstvo (buržoazija)
        b: Radništvo (radnička klasa)
        pitanje: Na koju grupu se odnosi tvrdnja — A, B, obe ili nijednu?
        tvrdnje:
          - {tekst: "Jedan njen sloj se industrijom obogatio.", odgovor: a, zasto: "Industrija je obogatila deo građanstva — vlasnike fabrika."}
          - {tekst: "Nova grupa koja je nastala sa industrijom.", odgovor: b, zasto: "Radnička klasa je nova društvena grupa."}
          - {tekst: "Živela je u prenaseljenim naseljima oko fabrika.", odgovor: b, zasto: "Radnička naselja su nastajala oko fabrika i rudnika."}
          - {tekst: "Njen život je promenila industrijska revolucija.", odgovor: oba, zasto: "Jedni su se obogatili, drugi su nastali kao nova grupa — promena je zahvatila obe."}
          - {tekst: "Radila je na plantažama pamuka u kolonijama.", odgovor: nijedan, zasto: "Na plantažama su radili crni robovi."}
        pomoc:
          - "Ko poseduje fabriku, a ko u njoj radi?"
          - "Ko je radio na plantažama?"
          - "Iz lekcije: građanstvo se bogati, radništvo nastaje."
        objasnjenje: Industrija je društvo podelila na bogate vlasnike iz građanstva i siromašne radnike.
        iz_udzbenika: {strana: 31, odeljak: Društvene promene, tekst: "Industrija obogaćuje deo građanstva i stvara radničku klasu."}

      - id: dru-uporedi-pre-posle
        vrsta: uporedi
        tezina: srednje
        pojmovi: [manufaktura, fabrika, industrijska-revolucija]
        a: Pre industrijske revolucije
        b: Posle industrijske revolucije
        pitanje: Na koje razdoblje se odnosi tvrdnja — A, B, oba ili nijedno?
        tvrdnje:
          - {tekst: "Roba se pravi ručno u manufakturama i zanatskim radionicama.", odgovor: a, zasto: "Ručna proizvodnja je obeležje vremena pre mašina (XVI–XVIII vek)."}
          - {tekst: "Gradovi kao Mančester naglo rastu.", odgovor: b, zasto: "Rast gradova je posledica fabrika i doseljavanja sa sela."}
          - {tekst: "Brodovi plove samo na jedra.", odgovor: a, zasto: "Parobrodi se javljaju krajem XVIII i početkom XIX veka."}
          - {tekst: "Britanija trguje sa drugim kontinentima.", odgovor: oba, zasto: "Britanija je i pre revolucije bila pomorska sila — trgovina je jedan od uzroka revolucije."}
          - {tekst: "Ljudi putuju električnim vozovima.", odgovor: nijedan, zasto: "Lekcija govori o parnim lokomotivama; električnih vozova tada nema."}
        pomoc:
          - "Šta je uzrok, a šta posledica revolucije?"
          - "Trgovina je postojala i pre."
          - "Iz lekcije: ručni rad → mašine; selo → grad; jedra → para."
        objasnjenje: Ručni rad, jedra i manje gradove zamenile su mašine, para i veliki industrijski centri; trgovina je postojala i pre i posle.
        iz_udzbenika: {strana: 28, odeljak: Uvod; Društvene promene, tekst: "Lekcija opisuje prelaz sa ručne na mašinsku proizvodnju i njegove posledice."}

      - id: dru-ko-sam-mancester
        vrsta: ko_sam
        tezina: tesko
        pojmovi: [mancester, grad-pamuka, mancester-liverpul]
        tragovi:
          - Ja sam grad, a ne ličnost — porastao sam kad su ljudi sa sela došli u fabrike.
          - Na slici iz oko 1820. vide se moje višespratne fabrike i dimnjaci uz kanal.
          - Prugom sam povezan sa Liverpulom, a savremenici me zovu „Grad pamuka”.
        odgovori:
          - {tekst: "Mančester", tacan: true}
          - {tekst: "London", tacan: false, zasto: "London je na slici radničkog kvarta; „Grad pamuka” je Mančester."}
          - {tekst: "Liverpul", tacan: false, zasto: "Liverpul je drugi kraj pruge; nadimak „Grad pamuka” nosi Mančester."}
          - {tekst: "Olbani", tacan: false, zasto: "Olbani je američki grad na Klermontovoj liniji."}
        objasnjenje: To je Mančester — industrijski centar i „Grad pamuka”, povezan prugom sa Liverpulom.
        iz_udzbenika: {strana: 31, odeljak: Mančester oko 1820., tekst: "Mančester oko 1820. savremenici zovu Gradom pamuka.", slika: 03-industrijska-revolucija/07-mancester-1820.jpg}

      - id: dru-objasni-mancester
        vrsta: objasni
        tezina: lako
        pojmovi: [mancester, grad-pamuka, fabrika]
        pitanje: Pogledaj sliku Mančestera oko 1820. Šta prvo uočavaš i zašto su ga zvali „Grad pamuka”?
        uzor: Prvo se vide velike fabrike na više spratova i visoki dimnjaci iz kojih ide dim. U tim fabrikama pravile su se pamučne tkanine, pa je grad dobio ime „Grad pamuka”.
        ideje:
          - Velike višespratne fabrike.
          - Dimnjaci i dim.
          - Fabrike pamučnih tkanina → „Grad pamuka”.
        objasnjenje: Slika je izvor koji pokazuje kako je industrija promenila izgled grada.
        iz_udzbenika: {strana: 31, odeljak: Mančester oko 1820., tekst: "Udžbenik pita šta prvo uočavaš na slici i zašto je Mančester Grad pamuka.", slika: 03-industrijska-revolucija/07-mancester-1820.jpg}
        osa: {naziv: Mančester — Grad pamuka, od: 1820, traka: drustvo}

      - id: dru-objasni-naselja
        vrsta: objasni
        tezina: srednje
        pojmovi: [radnicka-naselja, radnistvo, decji-rad]
        pitanje: Opiši kako su živeli i radili radnici u doba industrijske revolucije i objasni zašto je bilo tako.
        uzor: Radnici su radili dugo, bez zaštite na radu, za niske plate, jer su mašine oborile cenu rada; žene i deca su dobijali još manje. Živeli su u prenaseljenim naseljima oko fabrika i rudnika, bez higijene, pa su se širile zarazne bolesti, pothranjenost i alkoholizam.
        ideje:
          - Dug rad bez zaštite.
          - Niske plate; žene i deca još niže.
          - Prenaseljena naselja bez higijene.
          - Bolesti, pothranjenost, alkoholizam.
        objasnjenje: Loši uslovi rada i života objašnjavaju kasnije radničke nemire.
        iz_udzbenika: {strana: 31, odeljak: Društvene promene, tekst: "Lekcija opisuje niske plate, dečji rad i bedu u radničkim naseljima.", slika: 03-industrijska-revolucija/09-radnicki-kvart-londona.jpg}

      - id: dru-objasni-posledice
        vrsta: objasni
        tezina: tesko
        pojmovi: [industrijska-revolucija, gradjanstvo, radnistvo, zagadjenje-zivotne-sredine]
        pitanje: Navedi po jednu dobru i jednu lošu posledicu industrijske revolucije i objasni kako su obe proistekle iz mašinske proizvodnje.
        uzor: Mašine su proizvodile brzo, pa je roba pojeftinila, a saobraćaj se ubrzao — to je dobro za kupce i trgovinu. Ali ista jeftina proizvodnja uništila je zanatlije, oborila plate radnika, dovela decu u fabrike i zagadila prirodu. Bogatstvo je dobio deo građanstva, a radnici su živeli u bedi.
        ideje:
          - Dobro — jeftinija roba ili brži saobraćaj.
          - Loše — propast zanatlija, niske plate, dečji rad, beda ili zagađenje.
          - Obe posledice dolaze od istog uzroka — mašinske proizvodnje.
          - Koristi nisu bile jednako raspoređene (građanstvo – radništvo).
        objasnjenje: Isti uzrok može imati i dobre i loše posledice — zavisi za koga.
        iz_udzbenika: {strana: 31, odeljak: Društvene promene, tekst: "Lekcija nabraja posledice: jeftiniji proizvodi, rast gradova, bogaćenje građanstva, beda radnika i zagađenje."}

  - naslov: Radnički nemiri i prvi zakoni
    zadaci:
      - id: rad-izbor-luditi
        vrsta: izbor
        tezina: lako
        pojmovi: [luditi, ned-lud, radnicki-nemiri]
        pitanje: Ko su bili luditi?
        odgovori:
          - {tekst: "Radnici koji su lomili mašine, sledbenici Neda Luda", tacan: true}
          - {tekst: "Pronalazači parnih mašina", tacan: false, zasto: "Pronalazači su Vat, Stivenson i Fulton; luditi su mašine uništavali."}
          - {tekst: "Vlasnici fabrika u Mančesteru", tacan: false, zasto: "Vlasnici su bili na drugoj strani — zakoni su štitili njihove mašine od ludita."}
          - {tekst: "Robovi na plantažama pamuka", tacan: false, zasto: "Luditi su bili britanski fabrički radnici."}
        pomoc:
          - "Ime im dolazi od jednog radnika."
          - "Šta rade ljudi na ilustraciji iz XIX veka?"
          - "Iz lekcije: sledbenici Neda Luda, koji su razbijali mašine."
        objasnjenje: Luditi su radnici, sledbenici Neda Luda, koji su lomili mašine jer su ih krivili za svoj loš položaj.
        iz_udzbenika: {strana: 32, odeljak: Luditi, tekst: "Luditi su sledbenici Neda Luda; razbijali su mašine koje su krivili za svoje nedaće.", slika: 03-industrijska-revolucija/08-luditi.jpg}

      - id: rad-izbor-ned-lud
        vrsta: izbor
        tezina: srednje
        pojmovi: [ned-lud, razboj, luditi]
        pitanje: Šta je uradio Ned Lud, po kome su luditi dobili ime?
        odgovori:
          - {tekst: "U znak protesta je polomio tkački razboj", tacan: true}
          - {tekst: "Osnovao je prvo radničko udruženje", tacan: false, zasto: "Lekcija ne navodi osnivača udruženja; Ned Lud je poznat po lomljenju razboja."}
          - {tekst: "Izumeo je leteći čunak", tacan: false, zasto: "Leteći čunak je izumeo Džon Kej."}
          - {tekst: "Doneo je zakon o radu dece", tacan: false, zasto: "Zakone je donosio britanski parlament; Ned Lud je bio radnik."}
        pomoc:
          - "Bio je radnik u tekstilu."
          - "Njegov čin su ponavljali njegovi sledbenici."
          - "Iz lekcije: u znak protesta polomio je tkački razboj."
        objasnjenje: Ned Lud je polomio tkački razboj u znak protesta, a radnici koji su ga sledili nazvani su luditi.
        iz_udzbenika: {strana: 32, odeljak: Luditi, tekst: "Ned Lud je bio radnik koji je u znak protesta polomio tkački razboj.", slika: 03-industrijska-revolucija/08-luditi.jpg}

      - id: rad-izbor-zakoni-kome
        vrsta: izbor
        tezina: srednje
        pojmovi: [britanski-parlament, luditi, fabrika]
        pitanje: U čiju korist su doneti zakoni koji su lomljenje mašina kažnjavali progonstvom (1721) i smrću (1812)?
        odgovori:
          - {tekst: "U korist vlasnika fabrika", tacan: true}
          - {tekst: "U korist radnika", tacan: false, zasto: "Ovi zakoni su kažnjavali radnike koji lome mašine; zakoni u korist radnika (o radu dece) dolaze kasnije."}
          - {tekst: "U korist robova", tacan: false, zasto: "Zakoni se odnose na mašine u Britaniji, ne na plantaže."}
          - {tekst: "U korist zanatlija", tacan: false, zasto: "Zanatlije su propadale zbog fabrika; zakoni su štitili fabričke mašine."}
        pomoc:
          - "Čije su bile mašine?"
          - "Ko je imao korist ako mašine ostanu čitave?"
