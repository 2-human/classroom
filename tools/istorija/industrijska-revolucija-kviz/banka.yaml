        parovi:
          - [Proizvodi postaju jeftiniji, Zanatlije i manufakture propadaju]
          - [Otvaraju se fabrike, Ljudi se sele sa sela u grad]
          - [Naselja bez higijene, Šire se zarazne bolesti]
          - [Fabrike ispuštaju otrove, Zagađuje se životna sredina]
        pomoc:
          - "Za svaki uzrok pitaj: šta se zbog toga desilo?"
          - "Iz lekcije: jeftina roba → propast zanatlija; fabrike → seobe u grad; prljavština → bolesti; otrovi → zagađenje."
        objasnjenje: Svaka promena u proizvodnji imala je društvenu posledicu.
        iz_udzbenika: {strana: 31, odeljak: Društvene promene, tekst: "Lekcija nabraja društvene posledice industrije: propast zanatlija, rast gradova, bedu radnika i zagađenje."}

      - id: dru-lanac-gradovi
