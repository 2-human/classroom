          - Parne mašine su postojale i ranije (rudnici).
          - Vatova troši dve trećine goriva manje.
          - Zato se proširila u druge grane (tkanine, drvo, metal).
          - Na njoj se zasniva Prva industrijska revolucija i razvoj saobraćaja.
        objasnjenje: Prekretnica nije sama para nego isplativost pare.
        iz_udzbenika: {strana: 29, odeljak: Pojava parne mašine, tekst: "Vatova mašina štedi gorivo, širi se u proizvodnju i označava početak revolucije."}
        osa: {naziv: Vatova parna mašina, od: 1769, traka: pronalasci}

      - id: par-objasni-niz
        vrsta: objasni
        tezina: tesko
        pojmovi: [leteci-cunak, predilica, rudarstvo, kameni-ugalj, parna-masina]
        pitanje: Pokaži na jednom primeru iz lekcije kako je jedna promena izazvala sledeću, sve do parne mašine.
        uzor: Leteći čunak je ubrzao tkanje, pa je trebalo brže praviti konac; zato su predilice pokretane snagom vode. Slično, potreba za metalima razvila je rudarstvo, a rudnike je trebalo čistiti od vode — tu su radile prve parne mašine. Pošto nije bilo dovoljno šuma, gorivo je postao ugalj iz tih istih rudnika.
        ideje:
          - Brže tkanje → potreba za koncem → predilice na vodu.
          - Potreba za metalima → rudarstvo → parne mašine za vodu.
          - Nedostatak šuma → kameni ugalj.
          - Promene se nadovezuju jedna na drugu.
        objasnjenje: Industrijska revolucija je niz povezanih koraka, a ne jedan izum.
        iz_udzbenika: {strana: 29, odeljak: Pojava parne mašine, tekst: "Lekcija opisuje kako čunak, rudarstvo, ugalj i gvožđe vode do Vatove mašine."}

