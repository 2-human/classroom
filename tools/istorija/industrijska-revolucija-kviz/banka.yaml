          - "Novinski članak iznosi nečiji stav — da li je to isto što i činjenica o svima?"
          - "Šta sigurno znamo: da je neko to napisao i objavio."
          - "Iz lekcije: autor je kritičan prema vlasnicima, a saosećajan prema radnicima."
        objasnjenje: Izvor sigurno pokazuje da je kritika postojala i kakav je bio stav autora; o svim vlasnicima i svim Britancima ne govori.
        iz_udzbenika: {strana: 32, odeljak: Svedočanstvo, tekst: "Odlomak iz britanskog lista iz 1830-ih kritikuje bogate i brani radnike."}

