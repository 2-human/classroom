          naslov: Luditi razbijaju mašinu u tekstilnoj fabrici
          tekst: Dvojica radnika čekićima udaraju po velikom tkačkom razboju u fabrici. Uz sliku stoji da su luditi sledbenici Neda Luda i da je parlament za lomljenje mašina propisao progonstvo (1721), pa smrtnu kaznu (1812).
          napomena: Opis slike i natpisa je prepričan; udžbenik, str. 32.
        pitanje: Zašto su, prema natpisu, radnici razbijali mašine?
        odgovori:
