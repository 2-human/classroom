# Banka zadataka — 2.1. Industrijska revolucija (istorija, 7. razred, str. 28–32). Spaja se u spec.yaml.
# Pitanja sopstvenim rečima na osnovu beleške tools/istorija/_source/lekcije-7/03-industrijska-revolucija.md.
# Svaki pogrešan ponuđeni odgovor ima `zasto` — greška treba da nauči, ne samo da kazni.

delovi:
  - naslov: Od manufakture do mašina
    zadaci:
      - id: uvod-izbor-manufaktura
        vrsta: izbor
        tezina: lako
        pojmovi: [manufaktura]
        pitanje: Kako se proizvodilo u manufakturi?
        odgovori:
          - {tekst: "Ručno, a posao je bio podeljen tako da svaki radnik izrađuje jedan deo proizvoda", tacan: true}
          - {tekst: "Mašinama koje pokreće parna mašina", tacan: false, zasto: "To je fabrika — mašine na paru dolaze tek sa industrijskom revolucijom, posle manufakture."}
          - {tekst: "Kod kuće, gde jedan zanatlija sam pravi ceo proizvod", tacan: false, zasto: "U manufakturi je više radnika radilo zajedno, a posao je bio podeljen na delove."}
          - {tekst: "Robovi na plantažama u kolonijama", tacan: false, zasto: "Robovi su na plantažama gajili sirovi pamuk; manufaktura je radionica u kojoj se proizvod pravi ručno."}
        pomoc:
          - "Reč „manufaktura” u sebi ima latinsku reč za ruku."
          - "Mašina još nema — ali radnici dele posao među sobom."
          - "Iz lekcije: radilo se ručno, a svaki radnik je izrađivao samo deo proizvoda."
        objasnjenje: U manufakturi se radilo ručno, ali uz podelu rada — svaki radnik je pravio samo jedan deo proizvoda.
        iz_udzbenika: {strana: 28, odeljak: Uvod, tekst: "Od XVI do XVIII veka razvijala se manufakturna proizvodnja: ručni rad podeljen na delove, gde svaki radnik izrađuje deo proizvoda.", slika: 03-industrijska-revolucija/02-manufakturna-radionica.jpg}

      - id: uvod-izbor-gde-pocela
        vrsta: izbor
        tezina: lako
        pojmovi: [prva-industrijska-revolucija, velika-britanija]
        pitanje: U kojoj zemlji je počela Prva industrijska revolucija?
        odgovori:
          - {tekst: "U Velikoj Britaniji", tacan: true}
          - {tekst: "U Rusiji", tacan: false, zasto: "Istok Evrope industrijski razvoj je do sredine XIX veka uglavnom zaobišao."}
          - {tekst: "U Italiji", tacan: false, zasto: "Apeninsko poluostrvo spada u delove Evrope koje je industrijski razvoj tada zaobišao."}
          - {tekst: "U Sjedinjenim Američkim Državama", tacan: false, zasto: "Iz Amerike je pronalazač Fulton, ali revolucija je počela u Britaniji pa se širila po Evropi."}
        pomoc:
          - "Seti se zemlje koja je imala najviše kolonija i najjaču trgovačku flotu."
          - "Tamo su radili Vat i Stivenson, a nalaze se i Mančester i Liverpul."
          - "Iz lekcije: počela je u Velikoj Britaniji, pa zahvatila zapadnu i srednju Evropu."
        objasnjenje: Prva industrijska revolucija počela je u Velikoj Britaniji, a zatim se proširila na druge delove zapadne i srednje Evrope.
        iz_udzbenika: {strana: 28, odeljak: Uvod, tekst: "Prva industrijska revolucija počela je u Velikoj Britaniji, a potom zahvatila zapadnu i srednju Evropu."}

      - id: uvod-izbor-zaobisla
        vrsta: izbor
        tezina: tesko
        pojmovi: [industrijska-revolucija]
        pitanje: "Koje oblasti je industrijski razvoj do sredine XIX veka uglavnom zaobišao? (više tačnih)"
        odgovori:
          - {tekst: "Balkansko poluostrvo", tacan: true}
          - {tekst: "Rusiju i istok Evrope", tacan: true}
          - {tekst: "Pirinejsko i Apeninsko poluostrvo", tacan: true}
          - {tekst: "Belgiju", tacan: false, zasto: "Belgija je na karti među najrazvijenijim industrijskim teritorijama, odmah posle Britanije."}
          - {tekst: "Češku", tacan: false, zasto: "Češka (deo Habzburške monarhije) je na karti šrafirana kao razvijena industrijska oblast."}
          - {tekst: "Sever Francuske", tacan: false, zasto: "Sever Francuske pripada pojasu industrijskih oblasti od Belgije prema nemačkim zemljama."}
        pomoc:
          - "Razvijene oblasti čine pojas od Britanije preko Belgije do Češke — šta je izvan njega?"
          - "Pogledaj jug i istok karte."
          - "Iz lekcije: zaobiđeni su jug (tri poluostrva), istok (Rusija) i sever Evrope."
        objasnjenje: Do sredine XIX veka industrija je bila jaka u Britaniji i pojasu od Belgije do Češke; jug, istok i sever Evrope su uglavnom zaobiđeni.
        iz_udzbenika: {strana: 28, odeljak: Karta — Industrijska revolucija do sredine XIX veka, tekst: "Uz kartu udžbenik pita koje je zemlje zahvatila industrijska revolucija, a koje delove Evrope je zaobišla.", slika: 03-industrijska-revolucija/01-karta-industrijska-revolucija.jpg}

      - id: uvod-tn-masine
        vrsta: tacno_netacno
        tezina: lako
        pojmovi: [industrijska-revolucija]
        tvrdnja: U drugoj polovini XVIII veka mašine su počele da zamenjuju rad ljudske ruke.
        tacno: true
        pomoc:
          - "Šta je novo u odnosu na manufakturu?"
          - "Iz lekcije: u drugoj polovini XVIII veka mašine zamenjuju ljudsku ruku."
        objasnjenje: Tačno — to je suština industrijske revolucije; manufakturu sa ručnim radom smenjuje mašinska proizvodnja.
        iz_udzbenika: {strana: 28, odeljak: Uvod, tekst: "U drugoj polovini XVIII veka mašine su počele da zamenjuju rad ljudske ruke."}
        osa: {naziv: Mašine zamenjuju ljudsku ruku, od: 1750, do: 1800, traka: pronalasci}

      - id: uvod-dopuni-manufaktura
        vrsta: dopuni
        tezina: lako
        pojmovi: [manufaktura, industrijska-revolucija, velika-britanija]
        pitanje: Dopuni rečenice.
        tekst: "Od XVI do XVIII veka proizvodilo se u {{manufakturama}}, gde se radilo {{ručno}}. U drugoj polovini XVIII veka ljudsku ruku zamenjuju {{mašine}}, a promena počinje u {{Velikoj Britaniji}}."
        ponudjene: [manufakturama, ručno, mašine, Velikoj Britaniji, fabrikama, Rusiji, parom]
        pomoc:
          - "Prvo je bio ručni rad, pa onda mašine."
          - "Iz lekcije: manufaktura (ručno) → mašine; početak u Britaniji."
        objasnjenje: Manufaktura je ručna proizvodnja sa podelom rada; industrijska revolucija uvodi mašine, prvo u Velikoj Britaniji.
        iz_udzbenika: {strana: 28, odeljak: Uvod, tekst: "Posle manufakturnog razdoblja (XVI–XVIII vek) mašine zamenjuju ruku; revolucija počinje u Britaniji."}

      - id: uvod-datum-masine
        vrsta: datum
        tezina: srednje
        pojmovi: [industrijska-revolucija]
        dogadjaj: Mašine zamenjuju ljudsku ruku
        pitanje: U kom razdoblju su mašine počele da zamenjuju rad ljudske ruke? (upiši raspon godina)
        od: 1750
        do: 1800
        traka: pronalasci
        pomoc:
          - "Bilo je to u XVIII veku — u kojoj polovini?"
          - "Vatova mašina je iz 1769, usred tog razdoblja."
          - "Iz lekcije: druga polovina XVIII veka (oko 1750–1800)."
        objasnjenje: Druga polovina XVIII veka, otprilike 1750–1800 — u to vreme pada i Vatova mašina (1769).
        iz_udzbenika: {strana: 28, odeljak: Uvod, tekst: "Velika promena dolazi u drugoj polovini XVIII veka, kada mašine zamenjuju ljudsku ruku."}

      - id: uvod-zakljuci-revolucija
        vrsta: zakljuci
        tezina: srednje
        pojmovi: [industrijska-revolucija]
        pitanje: Zašto se promena u proizvodnji naziva „revolucija”, a ne samo napredak?
        odgovori:
          - {tekst: "Zato što je donela duboke, korenite promene u svim oblastima društva, ne samo u radionicama", tacan: true}
          - {tekst: "Zato što je počela nasilnim ustankom protiv kralja", tacan: false, zasto: "Ovde „revolucija” ne znači pobunu; znači korenit preokret u proizvodnji i načinu života."}
          - {tekst: "Zato što se desila preko noći, za jednu godinu", tacan: false, zasto: "Trajala je decenijama — od Vatove mašine (1769) do sredine XIX veka i dalje."}
          - {tekst: "Zato što je zahvatila samo proizvodnju tkanina", tacan: false, zasto: "Zahvatila je i metalnu i mašinsku industriju, saobraćaj, gradove i odnose među ljudima."}
        pomoc:
          - "Korak 1: Šta znači reč revolucija — mala ili velika promena?"
          - "Korak 2: Na šta je sve uticala — samo na mašine, ili i na gradove, porodice, rad dece?"
          - "Iz lekcije: donela je dalekosežne i korenite promene u svim poljima društvenog razvoja."
        objasnjenje: Revolucija je korenit preokret; mašine su promenile ne samo proizvodnju nego i gradove, društvene grupe i svakodnevni život.
        iz_udzbenika: {strana: 28, odeljak: Uvod, tekst: "Prva industrijska revolucija donela je dalekosežne i korenite promene u svim poljima društvenog razvoja."}

      - id: uvod-izvor-manufaktura
        vrsta: izvor
        tezina: lako
        pojmovi: [manufaktura, manufakturna-radionica]
        izvor:
          autor: Nepoznati crtač
          naslov: Manufakturna radionica (crtež)
          tekst: Na crtežu je radionica u kojoj više radnika stoji za stolovima. Svako ručno radi svoj deo posla — jedan izrađuje, drugi slaže gotove listove. Mašina na crtežu nema.
          napomena: Opis slike je prepričan; udžbenik, str. 28.
        pitanje: Šta ovaj crtež pokazuje o radu u manufakturi?
        odgovori:
          - {tekst: "Radilo se ručno, a posao je bio podeljen među radnicima", tacan: true}
          - {tekst: "Mašine su obavljale ceo posao, a radnici su ih samo nadgledali", tacan: false, zasto: "Na crtežu nema mašina — to bi bila fabrika iz doba industrijske revolucije."}
          - {tekst: "Jedan majstor je sam pravio ceo proizvod", tacan: false, zasto: "Na crtežu radi više ljudi i svako radi svoj deo — to je podela rada."}
          - {tekst: "Radnici su bili robovi doneti iz kolonija", tacan: false, zasto: "Robovi su radili na plantažama pamuka u kolonijama, a ne u britanskim radionicama."}
        pomoc:
          - "Prebroj ljude na crtežu i pogledaj da li rade isto."
          - "Ima li na crtežu mašina?"
          - "Iz lekcije: manufaktura = ručni rad uz podelu posla."
        objasnjenje: Crtež pokazuje dva obeležja manufakture — ručni rad i podelu posla među više radnika.
        iz_udzbenika: {strana: 28, odeljak: Manufakturna radionica, tekst: "Crtež prikazuje radnike koji ručno izrađuju i slažu proizvode, svako svoj deo posla.", slika: 03-industrijska-revolucija/02-manufakturna-radionica.jpg}

      - id: uvod-izvor-karta
        vrsta: izvor
        tezina: lako
        pojmovi: [industrijska-revolucija, velika-britanija, zeleznica]
        izvor:
          autor: Istorijska karta u udžbeniku
          naslov: Industrijska revolucija i razvoj industrije do sredine XIX veka
          tekst: Na karti Evrope znakovima su označene metalna i tekstilna industrija i pruge. Šrafurom su obeležene najrazvijenije industrijske teritorije — Velika Britanija i pojas od Belgije, preko severa Francuske i nemačkih zemalja, do Češke.
          napomena: Opis karte je prepričan; udžbenik, str. 28.
        pitanje: Koja oblast je, prema karti, bila najrazvijenija industrijska teritorija Evrope?
        odgovori:
          - {tekst: "Velika Britanija, zajedno sa pojasom od Belgije do Češke", tacan: true}
          - {tekst: "Balkansko poluostrvo", tacan: false, zasto: "Balkan nije šrafiran — industrijski razvoj ga je do sredine XIX veka zaobišao."}
          - {tekst: "Rusija oko Moskve", tacan: false, zasto: "Moskva je ucrtana na karti, ali Rusija nije među šrafiranim industrijskim oblastima."}
          - {tekst: "Jug Italije i Španije", tacan: false, zasto: "Pirinejsko i Apeninsko poluostrvo su van najrazvijenijih oblasti."}
        pomoc:
          - "Šrafura označava najrazvijenije teritorije — gde je ima?"
          - "Počni od zemlje u kojoj je revolucija počela."
          - "Iz lekcije: Britanija i pojas od Belgije do Češke."
        objasnjenje: Karta je izvor koji prikazuje rasprostranjenost — najrazvijenija je Britanija, a zatim pojas od Belgije do Češke.
        iz_udzbenika: {strana: 28, odeljak: Karta, tekst: "Karta pokazuje industriju i pruge do sredine XIX veka i šrafurom ističe najrazvijenije teritorije.", slika: 03-industrijska-revolucija/01-karta-industrijska-revolucija.jpg}

      - id: uvod-uporedi-manufaktura-fabrika
        vrsta: uporedi
        tezina: lako
        pojmovi: [manufaktura, fabrika]
        a: Manufaktura
        b: Fabrika
        pitanje: Na šta se odnosi tvrdnja — na manufakturu, fabriku, obe ili nijednu?
        tvrdnje:
          - {tekst: "Proizvodi se ručno.", odgovor: a, zasto: "Ručni rad je obeležje manufakture; u fabrici rade mašine."}
          - {tekst: "Proizvodnju pokreću mašine, često na paru.", odgovor: b, zasto: "Fabrika je ustanova mašinske proizvodnje iz doba industrijske revolucije."}
          - {tekst: "Više radnika radi zajedno i svako radi svoj deo posla.", odgovor: oba, zasto: "Podela rada postoji već u manufakturi i zadržava se u fabrici."}
          - {tekst: "Proizvodi postaju jeftiniji pa zanatlije propadaju.", odgovor: b, zasto: "Mašinska proizvodnja u fabrikama je pojeftinila robu i uništila sitne zanatlije i manufakture."}
          - {tekst: "Nalazi se na plantaži u koloniji.", odgovor: nijedan, zasto: "Na plantažama robovi gaje sirovi pamuk; i manufakture i fabrike su u Britaniji."}
        pomoc:
          - "Šta je glavna razlika — ruka ili mašina?"
          - "Podela rada postoji od manufakture nadalje."
          - "Iz lekcije: manufaktura = ručno + podela rada; fabrika = mašine."
        objasnjenje: Obe imaju podelu rada, ali manufaktura radi rukom, a fabrika mašinama — i zato fabrika proizvodi jeftinije.
        iz_udzbenika: {strana: 28, odeljak: Uvod, tekst: "Manufaktura je ručni rad podeljen na delove; mašinska proizvodnja u fabrikama dolazi u drugoj polovini XVIII veka."}

      - id: uvod-objasni-manufaktura-fabrika
        vrsta: objasni
        tezina: lako
        pojmovi: [manufaktura, fabrika, industrijska-revolucija]
        pitanje: Po čemu se rad u fabrici razlikuje od rada u manufakturi? Objasni svojim rečima.
        uzor: U manufakturi se radilo ručno, ali je posao bio podeljen među radnicima. U fabrici posao obavljaju mašine, koje pokreće voda ili para, a radnici ih opslužuju. Zato fabrika proizvodi brže i jeftinije.
        ideje:
          - Manufaktura — ručni rad.
          - U oba slučaja postoji podela rada.
          - Fabrika — mašine (voda, para).
          - Fabrika proizvodi brže i jeftinije.
        objasnjenje: Ključna razlika je izvor snage — ljudska ruka ili mašina.
        iz_udzbenika: {strana: 28, odeljak: Uvod, tekst: "Manufakturu (ručni rad, podela posla) smenjuje mašinska proizvodnja."}

  - naslov: Uzroci industrijske revolucije
    zadaci:
      - id: uzr-izbor-pomorska-sila
        vrsta: izbor
        tezina: lako
        pojmovi: [velika-britanija, kolonija]
        pitanje: Kakva je bila Velika Britanija početkom XVIII veka?
        odgovori:
          - {tekst: "Jedna od vodećih pomorskih i kolonijalnih sila", tacan: true}
          - {tekst: "Mala država bez kolonija i flote", tacan: false, zasto: "Upravo suprotno — Britanija je imala kolonije i jaku flotu, pa je trgovala na svim kontinentima."}
          - {tekst: "Zemlja koja je samo kupovala tuđu robu", tacan: false, zasto: "Britanski trgovci su višak svojih proizvoda prodavali u Evropi i na drugim kontinentima."}
          - {tekst: "Kolonija neke druge evropske sile", tacan: false, zasto: "Britanija je sama imala kolonije — na primer plantaže pamuka."}
        pomoc:
          - "Britanija je ostrvo — po čemu je bila jaka?"
          - "Odakle je dobijala jeftin pamuk?"
          - "Iz lekcije: vodeća pomorska i kolonijalna sila."
        objasnjenje: Britanija je bila pomorska i kolonijalna sila — to joj je donelo tržišta, sirovine i bogatstvo, uslove za industrijsku revoluciju.
        iz_udzbenika: {strana: 29, odeljak: Uzroci industrijske revolucije, tekst: "Početkom XVIII veka Britanija je jedna od vodećih pomorskih i kolonijalnih sila."}

      - id: uzr-izbor-uzroci-vise
        vrsta: izbor
        tezina: tesko
        pojmovi: [velika-britanija, pamuk, kolonija, fabrika]
        pitanje: "Šta je doprinelo da industrijska revolucija počne baš u Britaniji? (više tačnih)"
        odgovori:
          - {tekst: "Bila je pomorska i kolonijalna sila koja je trgovala na svim kontinentima", tacan: true}
          - {tekst: "Iz kolonija je dobijala jeftin sirovi pamuk", tacan: true}
          - {tekst: "Vlasnici radionica su prihod od tkanina ulagali u nove fabrike", tacan: true}
          - {tekst: "Imala je obilje šuma, pa je drvo bilo glavno gorivo", tacan: false, zasto: "Obrnuto — zbog nedostatka šuma glavno gorivo je postao kameni ugalj."}
          - {tekst: "Lanene i vunene tkanine bile su najjeftinije na svetu", tacan: false, zasto: "Najtraženije zbog povoljne cene bile su pamučne tkanine, a lanene i vunene bile su najcenjenije."}
        pomoc:
          - "Misli o trgovini, sirovinama i novcu."
          - "Jedan ponuđeni odgovor govori o šumama — kako je zapravo bilo?"
          - "Iz lekcije: pomorska i kolonijalna sila, jeftin pamuk iz kolonija, prihod uložen u fabrike."
        objasnjenje: Trgovina i kolonije dale su tržište i jeftinu sirovinu, a zarada od pamuka kapital za fabrike.
        iz_udzbenika: {strana: 29, odeljak: Uzroci industrijske revolucije, tekst: "Britanija trguje na svim kontinentima, pamuk dobija sa plantaža u kolonijama, a prihod od tkanina ulaže se u fabrike."}

      - id: uzr-tn-robovi
        vrsta: tacno_netacno
        tezina: lako
        pojmovi: [pamuk, kolonija, robovlasnistvo]
        tvrdnja: Jeftin sirovi pamuk dobijao se sa plantaža u britanskim kolonijama, na kojima su radili crni robovi.
        tacno: true
        pomoc:
          - "Odakle dolazi sirovina i ko je tamo radio?"
          - "Iz lekcije: plantaže u kolonijama, rad crnih robova."
        objasnjenje: Tačno — pamuk je bio jeftin i zato što su ga na plantažama gajili robovi.
        iz_udzbenika: {strana: 29, odeljak: Uzroci industrijske revolucije, tekst: "Sirovi pamuk dolazi sa plantaža u britanskim kolonijama na kojima rade crni robovi."}

      - id: uzr-tn-prerada
        vrsta: tacno_netacno
        tezina: srednje
        pojmovi: [pamuk, tkanine, kolonija]
        tvrdnja: Pamuk se prerađivao u tkaninu u kolonijama, a Britanija je uvozila samo gotove tkanine.
        tacno: false
        ispravke:
          - {tekst: "Sirovi pamuk se dovozio iz kolonija i prerađivao u britanskim radionicama.", tacan: true}
          - {tekst: "Pamuk se i gajio i prerađivao u Britaniji.", tacan: false, zasto: "Pamuk se gajio na plantažama u kolonijama, a ne u Britaniji."}
          - {tekst: "Britanija je pamuk kupovala od Rusije.", tacan: false, zasto: "Pamuk je dolazio sa plantaža u britanskim kolonijama."}
        pomoc:
          - "Gde je sirovina, a gde radionice?"
          - "Iz lekcije: pamuk iz kolonija prerađuje se u britanskim radionicama."
        objasnjenje: Kolonije daju sirovinu, a Britanija je prerađuje — zato su britanske radionice, pa fabrike, toliko zarađivale.
        iz_udzbenika: {strana: 29, odeljak: Uzroci industrijske revolucije, tekst: "Sirovi pamuk iz kolonija prerađuje se u britanskim radionicama."}

      - id: uzr-dopuni-pamuk
        vrsta: dopuni
        tezina: lako
        pojmovi: [pamuk, kolonija, robovlasnistvo, tkanine]
        pitanje: Dopuni rečenice.
        tekst: "U XVIII veku najtraženije su postale {{pamučne}} tkanine zbog povoljne {{cene}}. Sirovina je stizala sa {{plantaža}} u britanskim kolonijama, gde su radili {{robovi}}."
        ponudjene: [pamučne, cene, plantaža, robovi, vunene, boje, rudnika, zanatlije]
        pomoc:
          - "Koja tkanina je bila jeftina, a koja cenjena?"
          - "Ko je radio na plantažama?"
          - "Iz lekcije: pamučne tkanine, povoljna cena, plantaže, crni robovi."
        objasnjenje: Jeftina sirovina (rad robova) → jeftina pamučna tkanina → velika potražnja.
        iz_udzbenika: {strana: 29, odeljak: Uzroci industrijske revolucije, tekst: "Pamučne tkanine najtraženije su zbog cene; sirovina dolazi sa plantaža na kojima rade robovi."}

      - id: uzr-povezi-uzroci
        vrsta: povezi
        tezina: srednje
        pojmovi: [pamuk, kolonija, fabrika, velika-britanija]
        pitanje: Poveži uzrok sa njegovom posledicom.
        parovi:
          - [Povoljna cena pamučnih tkanina, Pamučne tkanine postaju najtraženije]
          - [Rad robova na plantažama, Sirovi pamuk je jeftin]
          - [Veliki prihod od pamučnih tkanina, Vlasnici radionica otvaraju fabrike]
          - [Britanija ima višak proizvoda, Trgovci ih prodaju i na drugim kontinentima]
        pomoc:
          - "Za svaki uzrok pitaj: šta se zbog toga desilo?"
          - "Iz lekcije: novac od tkanina ulaže se u fabrike."
        objasnjenje: Svaki korak vodi sledećem — jeftina sirovina, jeftina tkanina, velika prodaja, zarada, nove fabrike.
        iz_udzbenika: {strana: 29, odeljak: Uzroci industrijske revolucije, tekst: "Prihod od pamučnih tkanina vlasnici radionica ulažu u razvoj proizvodnje i otvaranje fabrika."}

      - id: uzr-lanac-prihod
        vrsta: lanac
        tezina: lako
        pojmovi: [pamuk, fabrika, tkanine]
        karike:
          - Pamučne tkanine se dobro prodaju u Evropi i na drugim kontinentima
          - "?"
          - Vlasnici radionica otvaraju fabrike
        praznina: 1
        odgovori:
          - {tekst: "Vlasnici radionica ostvaruju veliki prihod", tacan: true}
          - {tekst: "Zanatlije propadaju", tacan: false, zasto: "Propast zanatlija je kasnija posledica fabrika koje proizvode jeftinije, a ne uzrok njihovog otvaranja."}
          - {tekst: "Nestaju šume u Britaniji", tacan: false, zasto: "Nedostatak šuma je razlog prelaska na kameni ugalj, a ne veza između prodaje i fabrika."}
          - {tekst: "Radnici lome mašine", tacan: false, zasto: "Lomljenje mašina dolazi kasnije, kao odgovor radnika na loš položaj u fabrikama."}
        pomoc:
          - "Korak 1: Šta trgovac dobija kad mnogo proda?"
          - "Korak 2: Čime se plaća gradnja fabrike?"
          - "Iz lekcije: pamučna tkanina je donosila veliki prihod, koji se ulagao u fabrike."
        objasnjenje: Dobra prodaja → veliki prihod → novac za nove fabrike.
        iz_udzbenika: {strana: 29, odeljak: Uzroci industrijske revolucije, tekst: "Pamučna tkanina donosi veliki prihod, koji vlasnici radionica ulažu u fabrike."}

      - id: uzr-lanac-pamuk
        vrsta: lanac
        tezina: srednje
        pojmovi: [pamuk, robovlasnistvo, kolonija, tkanine]
        karike:
          - Na plantažama u kolonijama rade crni robovi
          - Sirovi pamuk je jeftin
          - "?"
          - Potražnja za pamučnim tkaninama je ogromna
        praznina: 2
        odgovori:
          - {tekst: "Pamučne tkanine iz britanskih radionica su jeftine", tacan: true}
          - {tekst: "Lanene i vunene tkanine postaju jeftinije", tacan: false, zasto: "Lan i vuna nisu iz kolonija; jeftin je pamuk, pa su jeftine pamučne tkanine."}
          - {tekst: "Britanija gubi svoje kolonije", tacan: false, zasto: "Lekcija ne govori o gubitku kolonija — one su bile izvor jeftine sirovine."}
          - {tekst: "Radnici traže veće plate", tacan: false, zasto: "Borba radnika za bolji položaj je posledica fabrika, a ne veza u ovom lancu o ceni."}
        pomoc:
          - "Korak 1: Ako je sirovina jeftina, kakav će biti gotov proizvod?"
          - "Korak 2: Zašto ljudi kupuju više neke robe?"
          - "Iz lekcije: pamučne tkanine su najtraženije zbog povoljne cene."
        objasnjenje: Rad robova → jeftina sirovina → jeftine pamučne tkanine → velika potražnja. Bogatstvo britanske industrije počivalo je i na ropstvu.
        iz_udzbenika: {strana: 29, odeljak: Uzroci industrijske revolucije, tekst: "Jeftin pamuk sa plantaža na kojima rade robovi čini pamučne tkanine najtraženijim."}

      - id: uzr-zakljuci-pamuk
        vrsta: zakljuci
        tezina: lako
        pojmovi: [pamuk, tkanine]
        pitanje: Zašto su pamučne tkanine u XVIII veku postale najtraženije?
        odgovori:
          - {tekst: "Zbog povoljne, niske cene", tacan: true}
          - {tekst: "Zato što su bile najskuplje i najotmenije", tacan: false, zasto: "Najcenjenije su bile tkanine od lana i vune; pamuk je pobedio cenom."}
          - {tekst: "Zato što su se pravile u Rusiji", tacan: false, zasto: "Pamuk se prerađivao u britanskim radionicama, a gajio u britanskim kolonijama."}
          - {tekst: "Zato što ih je zakon jedine dozvoljavao", tacan: false, zasto: "Lekcija ne pominje takav zakon; ljudi su ih kupovali jer su bile jeftine."}
        pomoc:
          - "Korak 1: Šta je najvažnije većini kupaca?"
          - "Korak 2: Sirovina je bila jeftina — kakva je onda tkanina?"
          - "Iz lekcije: najtraženije zbog povoljne cene."
        objasnjenje: Pamuk iz kolonija bio je jeftin, pa su i tkanine bile jeftine — i zato najtraženije.
        iz_udzbenika: {strana: 29, odeljak: Uzroci industrijske revolucije, tekst: "U XVIII veku najtraženije su pamučne tkanine zbog povoljne cene."}

      - id: uzr-zakljuci-britanija
        vrsta: zakljuci
        tezina: srednje
        pojmovi: [velika-britanija, kolonija, prva-industrijska-revolucija]
        pitanje: Kako je to što je Britanija bila kolonijalna sila pomoglo da baš ona započne industrijsku revoluciju?
        odgovori:
          - {tekst: "Kolonije su davale jeftinu sirovinu i tržište, pa je trgovina donosila novac za fabrike", tacan: true}
          - {tekst: "Iz kolonija su stizale gotove mašine", tacan: false, zasto: "Mašine su izmislili britanski pronalazači; iz kolonija je stizala sirovina — pamuk."}
          - {tekst: "Kolonije su slale radnike za britanske fabrike", tacan: false, zasto: "U fabrike su dolazili ljudi sa britanskih sela; robovi su radili na plantažama u kolonijama."}
          - {tekst: "Kolonije su bile hladne, pa je trebalo više tkanina", tacan: false, zasto: "Lekcija to ne kaže; važno je da su kolonije davale jeftin pamuk i da je Britanija trgovala svuda."}
        pomoc:
          - "Korak 1: Šta je Britanija dobijala iz kolonija?"
          - "Korak 2: Šta je radila sa viškom robe?"
          - "Korak 3: Gde je završavao novac od trgovine? Iz lekcije: u razvoju proizvodnje i fabrikama."
        objasnjenje: Kolonije i flota značile su jeftinu sirovinu i kupce širom sveta; zarada je uložena u fabrike.
        iz_udzbenika: {strana: 29, odeljak: Uzroci industrijske revolucije, tekst: "Kao pomorska i kolonijalna sila, Britanija prodaje višak robe svuda i dobija jeftin pamuk iz kolonija."}

      - id: uzr-uporedi-tkanine
        vrsta: uporedi
        tezina: srednje
        pojmovi: [tkanine, pamuk, kolonija]
        a: Tkanine od lana i vune
        b: Pamučne tkanine
        pitanje: Na koje tkanine se odnosi tvrdnja — A, B, obe ili nijedne?
        tvrdnje:
          - {tekst: "Bile su najcenjeniji britanski proizvod.", odgovor: a, zasto: "Lan i vuna su bili najcenjeniji; pamuk je postao najtraženiji."}
          - {tekst: "U XVIII veku postale su najtraženije zbog povoljne cene.", odgovor: b, zasto: "Pamuk je pobedio cenom."}
          - {tekst: "Sirovina je stizala sa plantaža u kolonijama.", odgovor: b, zasto: "Sirovi pamuk se gajio na plantažama u kolonijama."}
          - {tekst: "Bile su britanski proizvod.", odgovor: oba, zasto: "I jedne i druge su izrađivane u Britaniji."}
          - {tekst: "Izrađivale su se u kolonijama pa uvozile u Britaniju.", odgovor: nijedan, zasto: "Tkanine su se izrađivale u britanskim radionicama; iz kolonija je dolazila samo sirovina."}
        pomoc:
          - "Cenjeno nije isto što i traženo."
          - "Koja sirovina dolazi iz kolonija?"
          - "Iz lekcije: lan i vuna najcenjeniji; pamuk najtraženiji zbog cene."
        objasnjenje: Lan i vuna — najcenjeniji; pamuk — najtraženiji i najunosniji, zahvaljujući jeftinoj sirovini iz kolonija.
        iz_udzbenika: {strana: 29, odeljak: Uzroci industrijske revolucije, tekst: "Lanene i vunene tkanine su najcenjenije, a pamučne najtraženije zbog cene."}

      - id: uzr-objasni-britanija
        vrsta: objasni
        tezina: srednje
        pojmovi: [velika-britanija, pamuk, kolonija, fabrika]
        pitanje: Zašto je industrijska revolucija počela baš u Velikoj Britaniji? Navedi bar dva uzroka.
        uzor: Britanija je bila pomorska i kolonijalna sila, pa je višak robe prodavala po celom svetu. Iz kolonija je dobijala jeftin pamuk, pa su pamučne tkanine bile jeftine i tražene. Veliki prihod od njih vlasnici radionica uložili su u nove fabrike.
        ideje:
          - Pomorska i kolonijalna sila, trgovina na svim kontinentima.
          - Jeftin pamuk sa plantaža u kolonijama.
          - Pamučne tkanine najtraženije zbog cene.
          - Prihod uložen u razvoj proizvodnje i fabrike.
        objasnjenje: Trgovina, sirovine i kapital zajedno su stvorili uslove za mašine i fabrike.
        iz_udzbenika: {strana: 29, odeljak: Uzroci industrijske revolucije, tekst: "Lekcija navodi trgovinu, jeftin pamuk iz kolonija i ulaganje prihoda u fabrike kao uzroke."}

      - id: uzr-objasni-robovi
        vrsta: objasni
        tezina: tesko
        pojmovi: [robovlasnistvo, pamuk, kolonija, fabrika]
        pitanje: Kako su rad robova na plantažama i bogatstvo britanskih fabrika bili povezani? Objasni svojim rečima.
        uzor: Robovi na plantažama u kolonijama nisu bili plaćeni, pa je sirovi pamuk bio jeftin. Od jeftinog pamuka britanske radionice su pravile jeftine tkanine koje su se dobro prodavale. Prihod od te prodaje uložen je u fabrike — industrijsko bogatstvo počivalo je i na ropstvu.
        ideje:
          - Robovi su gajili pamuk na plantažama u kolonijama.
          - Zato je sirovina bila jeftina.
          - Jeftine tkanine su donele veliki prihod.
          - Prihod je uložen u fabrike.
        objasnjenje: Lanac vodi od plantaže do fabrike — tuđa neslobodna radna snaga omogućila je britansku zaradu.
        iz_udzbenika: {strana: 29, odeljak: Uzroci industrijske revolucije, tekst: "Jeftin pamuk sa plantaža na kojima rade crni robovi prerađuje se u britanskim radionicama i donosi veliki prihod."}

  - naslov: Pojava parne mašine
    zadaci:

      - id: par-izbor-cunak
        vrsta: izbor
        tezina: lako
        pojmovi: [leteci-cunak, dzon-kej]
        pitanje: Šta je ubrzao „leteći čunak” Džona Keja?
        odgovori:
          - {tekst: "Tkanje", tacan: true}
          - {tekst: "Kopanje uglja", tacan: false, zasto: "U rudnicima su korišćene parne mašine za ispumpavanje vode; čunak je deo tkačkog posla."}
          - {tekst: "Vožnju vagona", tacan: false, zasto: "Vagone je kasnije vukla Stivensonova lokomotiva."}
          - {tekst: "Topljenje gvožđa", tacan: false, zasto: "Proizvodnja gvožđa se razvijala odvojeno; čunak služi za tkanje."}
        pomoc:
          - "Čunak je deo tkačkog posla."
          - "Posle njega je trebalo brže praviti konac — za šta?"
          - "Iz lekcije: leteći čunak je ubrzao tkanje."
        objasnjenje: Leteći čunak je ubrzao tkanje, pa je odjednom trebalo mnogo više konca.
        iz_udzbenika: {strana: 29, odeljak: Pojava parne mašine, tekst: "Leteći čunak Džona Keja ubrzao je tkanje, pa je trebalo brže praviti konac."}

      - id: par-izbor-zasto-prekretnica
        vrsta: izbor
        tezina: srednje
        pojmovi: [parna-masina, dzejms-vat]
        pitanje: Zašto je Vatova parna mašina bila prekretnica, iako joj je snaga u početku bila skromna?
        odgovori:
          - {tekst: "Trošila je dve trećine goriva manje od prethodnih mašina", tacan: true}
          - {tekst: "Bila je prva parna mašina uopšte", tacan: false, zasto: "Primitivne parne mašine u rudnicima postojale su već krajem XVII veka."}
          - {tekst: "Mogla je da radi bez ikakvog goriva", tacan: false, zasto: "I Vatova mašina troši gorivo (ugalj) — samo mnogo manje."}
          - {tekst: "Odmah je pokretala lokomotive i brodove", tacan: false, zasto: "Za vozila je primenjena tek kasnije — lokomotiva 1814, parobrod 1807."}
        pomoc:
          - "Nije bila jača — u čemu je onda bila bolja?"
          - "Misli na troškove rada mašine."
          - "Iz lekcije: troši dve trećine goriva manje od prethodnih modela."
        objasnjenje: Ušteda goriva učinila je paru isplativom svuda — u rudnicima, radionicama i proizvodnji tkanina.
        iz_udzbenika: {strana: 29, odeljak: Pojava parne mašine, tekst: "Snaga Vatove mašine je u početku skromna, ali troši dve trećine goriva manje od prethodnih.", slika: 03-industrijska-revolucija/03-parna-masina-dzejmsa-vata.jpg}
        osa: {naziv: Vatova parna mašina, od: 1769, traka: pronalasci}

      - id: par-izbor-gde-koriscena
        vrsta: izbor
        tezina: srednje
        pojmovi: [parna-masina, rudarstvo, tekstilna-industrija]
        pitanje: "Gde se Vatova parna mašina koristila u prvo vreme? (više tačnih)"
        odgovori:
          - {tekst: "U rudnicima", tacan: true}
          - {tekst: "Za pokretanje mašina za obradu drveta i metala", tacan: true}
          - {tekst: "U proizvodnji tkanina", tacan: true}
          - {tekst: "Za pokretanje automobila", tacan: false, zasto: "Automobili nisu deo ove lekcije; para se kasnije primenila na lokomotive i parobrode."}
          - {tekst: "Samo na plantažama pamuka", tacan: false, zasto: "Na plantažama su radili robovi; mašina je radila u Britaniji — u rudnicima i radionicama."}
        pomoc:
          - "Tri mesta: ispod zemlje, u radionici, u najrazvijenijoj grani."
          - "Najrazvijenija grana britanske proizvodnje bile su tkanine."
          - "Iz lekcije: rudnici, mašine za drvo i metal, proizvodnja tkanina."
        objasnjenje: Vatova mašina je radila u rudnicima, pokretala mašine za drvo i metal i ubrzo ušla u proizvodnju tkanina.
        iz_udzbenika: {strana: 29, odeljak: Pojava parne mašine, tekst: "Vatova mašina se koristi u rudnicima, za mašine za obradu drveta i metala i u proizvodnji tkanina."}

      - id: par-tn-gvozdje
        vrsta: tacno_netacno
        tezina: lako
        pojmovi: [gvozdje]
        tvrdnja: Krajem XVIII veka gvožđe je počelo da se koristi i u gradnji mostova i brodova.
        tacno: true
        pomoc:
          - "Za šta se sve koristilo gvožđe kad ga je bilo više?"
          - "Iz lekcije: alati, oružje, mašine, a zatim mostovi i brodovi."
        objasnjenje: Tačno — bolja i brža proizvodnja gvožđa omogućila je da se od njega grade i mostovi i brodovi.
        iz_udzbenika: {strana: 29, odeljak: Pojava parne mašine, tekst: "Do kraja XVIII veka proizvodnja gvožđa je ubrzana; koristi se za alate, oružje, mašine, mostove i brodove."}

      - id: par-tn-snaga
        vrsta: tacno_netacno
        tezina: srednje
        pojmovi: [parna-masina, dzejms-vat]
        tvrdnja: Vatova parna mašina je od početka bila mnogo snažnija od svih prethodnih.
        tacno: false
        ispravke:
          - {tekst: "Snaga joj je u početku bila skromna, ali je trošila mnogo manje goriva.", tacan: true}
          - {tekst: "Bila je slabija, pa se nije nigde koristila.", tacan: false, zasto: "Koristila se u rudnicima, za mašine za drvo i metal i u proizvodnji tkanina."}
          - {tekst: "Bila je snažnija, ali je trošila više goriva.", tacan: false, zasto: "Obrnuto — trošila je dve trećine goriva manje."}
        pomoc:
          - "Prednost nije bila u snazi."
          - "Iz lekcije: snaga skromna, gorivo dve trećine manje."
        objasnjenje: Vatova prednost bila je štedljivost, ne snaga.
        iz_udzbenika: {strana: 29, odeljak: Pojava parne mašine, tekst: "Snaga mašine je u početku skromna, ali je štedljiva."}

      - id: par-tn-primitivne
