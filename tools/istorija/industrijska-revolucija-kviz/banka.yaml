          naslov: Članak s početka četvrte decenije XIX veka
          tekst: Bez rada nema bogatstva. Radnik proizvodi hranu, gradi kuće, skladišta i palate, prede i tka — pa ipak ostaje siromašan i gladan. A bogati su oni koji ništa ne rade i imaju svega u izobilju.
          napomena: Odlomak je prepričan; udžbenik, str. 32 (Svedočanstvo).
        pitanje: Kakav je stav autora prema radnicima, a kakav prema bogatima?
        odgovori:
          - {tekst: "Saoseća sa radnicima, a kritikuje bogate koji ne rade", tacan: true}
          - {tekst: "Hvali vlasnike fabrika kao vredne ljude", tacan: false, zasto: "Autor bogate opisuje kao one koji ne rade — to je kritika, ne pohvala."}
          - {tekst: "Smatra da su radnici sami krivi za siromaštvo", tacan: false, zasto: "Autor kaže da radnici stvaraju sve bogatstvo, a ipak su gladni — krivi su nepravedni odnosi."}
          - {tekst: "Nema nikakav stav, samo nabraja zanimanja", tacan: false, zasto: "Nabrajanje služi da pokaže koliko radnik stvara — stav je jasno na strani radnika."}
        pomoc:
          - "Ko u odlomku stvara bogatstvo?"
          - "Ko ga uživa, a ne radi?"
          - "Iz lekcije: autor je kritičan prema vlasnicima, saosećajan prema radnicima."
        objasnjenje: Autor vidi radnika kao izvor svakog bogatstva i osuđuje to što bogati ne rade a imaju sve.
        iz_udzbenika: {strana: 32, odeljak: Svedočanstvo, tekst: "Udžbenik donosi odlomak iz britanskog lista iz 1830-ih o radnicima i bogatima i pita kakav je stav autora."}

