      - id: sao-izvor-volmar-pobeda
        vrsta: izvor
        tezina: srednje
        pojmovi: [raketa, mancester-liverpul, dzordz-stivenson]
        izvor:
          autor: K. Volmar
          naslov: Vatra i para (istorija britanske železnice)
          tekst: Kad je 1829. dovršena pruga Mančester–Liverpul, priređena je trka da se izabere lokomotiva — pobednik je dobijao veliku nagradu i pravo da vozi na pruzi. Bile su gotove samo četiri lokomotive. Stivensonova Raketa izgledala je najskromnije, ali dok su druge imale nezgode, ona je radila pouzdano i postigla 30 km/h, skoro tri puta više od poštanske kočije.
          napomena: Odlomak je prepričan; udžbenik, str. 30 (Znatiželja).
        pitanje: Zašto je, prema ovom izvoru, pobedila Raketa?
        odgovori:
          - {tekst: "Bila je najpouzdanija i najbrža, dok su druge imale nezgode", tacan: true}
          - {tekst: "Izgledala je najlepše i najmoćnije", tacan: false, zasto: "Izvor kaže suprotno — izgledala je najskromnije."}
          - {tekst: "Bila je jedina lokomotiva na trci", tacan: false, zasto: "Bile su gotove četiri lokomotive."}
          - {tekst: "Stivenson je bio sudija trke", tacan: false, zasto: "Izvor to ne kaže; o pobedi su odlučile pouzdanost i brzina."}
        pomoc:
          - "Pronađi u odlomku šta se dogodilo drugim lokomotivama."
          - "Koliku je brzinu postigla Raketa?"
          - "Iz lekcije: najpouzdanija i najbrža — 30 km/h."
        objasnjenje: Izvor ističe da je Raketa, iako skromna izgleda, jedina radila bez nezgoda i bila najbrža.
        iz_udzbenika: {strana: 30, odeljak: Znatiželja — takmičenje „gvozdenih konja”, tekst: "Udžbenik prenosi odlomak iz Volmarove knjige o trci lokomotiva 1829.", slika: 03-industrijska-revolucija/05-lokomotiva-raketa.jpg}
        osa: {naziv: Trka lokomotiva (Mančester–Liverpul), od: 1829, traka: saobracaj}

      - id: sao-izvor-volmar-kocija
        vrsta: izvor
        tezina: tesko
        pojmovi: [raketa, parna-lokomotiva]
        izvor:
          autor: K. Volmar
          naslov: Vatra i para (istorija britanske železnice)
          tekst: Na trci 1829. Raketa je postigla 30 km/h, skoro tri puta brže od poštanske kočije. Na zvaničnom otvaranju pruge, 15. septembra 1830, išla je 48 km/h — više od četiri puta brže od kočije.
          napomena: Odlomak je prepričan; udžbenik, str. 30 (Znatiželja).
        pitanje: Šta iz ovih podataka možemo zaključiti o brzini poštanske kočije, kojom su ljudi do tada putovali?
        odgovori:
          - {tekst: "Išla je otprilike 10–12 km/h", tacan: true}
          - {tekst: "Išla je oko 30 km/h, kao Raketa", tacan: false, zasto: "Raketa je bila skoro tri puta brža, pa je kočija bila mnogo sporija."}
          - {tekst: "Išla je oko 90 km/h", tacan: false, zasto: "Tada bi kočija bila brža od Rakete, a izvor kaže da je Raketa bila više puta brža."}
          - {tekst: "Iz izvora se ništa ne može zaključiti o kočiji", tacan: false, zasto: "Može — izvor daje odnos: 30 km/h je skoro tri puta brže, 48 km/h više od četiri puta brže."}
        pomoc:
          - "Ako je 30 km/h skoro tri puta brže, koliko je jedan deo?"
          - "Proveri i drugim podatkom: 48 podeljeno sa nešto više od 4."
          - "Iz lekcije: 30 km/h ≈ 3 × kočija; 48 km/h > 4 × kočija."
        objasnjenje: "30 : 3 ≈ 10 i 48 : 4 = 12 — kočija je išla otprilike 10–12 km/h. Železnica je putovanje ubrzala više puta."
        iz_udzbenika: {strana: 30, odeljak: Znatiželja — takmičenje „gvozdenih konja”, tekst: "Raketa je bila skoro tri puta, a na otvaranju više od četiri puta brža od poštanske kočije."}
        osa: {naziv: Otvaranje pruge Mančester–Liverpul, od: 1830, traka: saobracaj}

