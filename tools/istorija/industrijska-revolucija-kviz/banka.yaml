          - "Iz lekcije: ljudi sa sela odlaze u gradove tražeći posao."
        objasnjenje: Fabrike → posao → seljenje sa sela → veliki gradovi.
        iz_udzbenika: {strana: 31, odeljak: Društvene promene, tekst: "Otvaranjem fabrika ljudi sa sela odlaze u gradove, pa rastu Mančester i Liverpul."}

      - id: dru-lanac-zanatlije
        vrsta: lanac
        tezina: lako
        pojmovi: [fabrika, manufaktura]
        karike:
          - Mašine u fabrikama proizvode brzo i mnogo
          - "?"
          - Sitne zanatlije i manufakture propadaju
        praznina: 1
        odgovori:
          - {tekst: "Proizvodi postaju jeftiniji", tacan: true}
          - {tekst: "Proizvodi postaju skuplji", tacan: false, zasto: "Mašinska proizvodnja je robu pojeftinila; zanatlije nisu mogle da prate tu cenu."}
          - {tekst: "Zanatlije dobijaju parne mašine od države", tacan: false, zasto: "Lekcija to ne kaže; zanatlije su propale."}
          - {tekst: "Radnici traže veće plate", tacan: false, zasto: "To se dešava kasnije i ne objašnjava propast zanatlija."}
        pomoc:
          - "Korak 1: Šta se desi sa cenom kad se roba pravi brzo i mnogo?"
          - "Korak 2: Može li ručni rad da proda jeftinije od mašine?"
          - "Iz lekcije: razvoj industrije je pojeftinio proizvode."
        objasnjenje: Zanatlija rukom nije mogao da proda jeftinije od fabrike — zato je propao.
        iz_udzbenika: {strana: 31, odeljak: Društvene promene, tekst: "Razvoj industrije pojeftinio je proizvode, pa sitne zanatlije i manufakture nestaju."}

      - id: dru-lanac-naselja
