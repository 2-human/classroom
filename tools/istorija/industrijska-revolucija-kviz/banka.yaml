        ponudjene: [parnoj mašini, metalne, mašinske, saobraćaja, poljoprivrede, električnoj struji, hemijske]
        pomoc:
          - "Dve grane industrije prave metal i mašine."
          - "Lokomotiva i parobrod spadaju u koju oblast?"
          - "Iz lekcije: tekstilna, metalna, mašinska industrija i saobraćaj."
        objasnjenje: Para je pokrenula tekstil, metalnu i mašinsku industriju i — najvidljivije — saobraćaj.
        iz_udzbenika: {strana: 29, odeljak: Pojava parne mašine, tekst: "Revolucija zasnovana na parnoj mašini donela je razvoj tekstilne, metalne i mašinske industrije i saobraćaja."}

      - id: par-dopuni-gorivo
        vrsta: dopuni
        tezina: tesko
        pojmovi: [kameni-ugalj, rudarstvo, parna-masina]
        pitanje: Dopuni rečenice (bez ponuđenih reči).
        tekst: "Zbog nedostatka {{šuma|šume}} glavno čvrsto gorivo u Britaniji postaje {{kameni ugalj|ugalj}}. Već krajem XVII veka primitivne parne mašine služile su za ispumpavanje {{vode}} iz {{rudnika}}."
        pomoc:
