          - {tekst: "Pre Vata parne mašine su pokretale parobrode.", tacan: false, zasto: "Parobrodi se javljaju krajem XVIII veka i 1807, posle Vata."}
        pomoc:
          - "Šta je Vat zapravo uradio — izmislio ili poboljšao?"
          - "Iz lekcije: krajem XVII veka, ispumpavanje vode iz rudnika."
        objasnjenje: Vat nije izmislio paru — poboljšao je mašinu tako da troši mnogo manje goriva.
        iz_udzbenika: {strana: 29, odeljak: Pojava parne mašine, tekst: "Već krajem XVII veka primitivne parne mašine služe za ispumpavanje vode iz rudnika."}

