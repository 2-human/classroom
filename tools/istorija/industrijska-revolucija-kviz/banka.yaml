        objasnjenje: Gravira beleži otvaranje prve javne pruge — novinu koju su ljudi došli da vide.
        iz_udzbenika: {strana: 30, odeljak: Razvoj saobraćaja, tekst: "Slika prikazuje otvaranje železnice na putu Stokton–Darlington u Engleskoj 1825.", slika: 03-industrijska-revolucija/04-zeleznica-stokton-darlington.jpg}
        osa: {naziv: Pruga Stokton–Darlington, od: 1825, traka: saobracaj}

