# Industrijska revolucija — kviz po lekciji (tip: lesson-quiz; vidi templates/lesson-quiz/README.md).
# Pitanja su napisana sopstvenim rečima na osnovu lekcije „2.1. Industrijska revolucija” (istorija,
# 7. razred, str. 28–32; str. 33 nije snimljena). Težište je na razumevanju: zašto, šta je iz čega
# proisteklo, kako to znamo iz izvora — ne na pamćenju.
title: Industrijska revolucija — kviz
title_short: Industrijska revolucija
locale: sr
nivo: osnovna
razred: 7
lekcije: [3]
description: >-
  Kviz za lekciju Industrijska revolucija: od manufakture do fabrike, uzroci u Velikoj Britaniji,
  parna mašina, lokomotiva i parobrod, nastanak radništva, luditi i prvi zakoni u korist radnika —
  uzroci i posledice, istorijski izvori, poređenja, vremenska osa i objašnjavanje svojim rečima.

