  - naslov: Materijalni izvori i muzeji
    zadaci:
      - id: mat-izbor-definicija
        vrsta: izbor
        tezina: lako
        pojmovi: [materijalni-istorijski-izvori]
        pitanje: Šta su materijalni istorijski izvori?
        odgovori:
          - {tekst: "Materijalni ostaci prošlosti — od ostataka naselja i građevina do pokućstva", tacan: true}
          - {tekst: "Novine, pisma i dnevnici", tacan: false, zasto: "To su pisani izvori — tekstovi, a ne predmeti."}
          - {tekst: "Fotografije, zvučni zapisi i filmovi", tacan: false, zasto: "To su audio-vizuelni izvori, nova vrsta iz XIX veka."}
          - {tekst: "Samo stari novac", tacan: false, zasto: "Novac jeste materijalni izvor, ali ih ima mnogo više — građevine, pokućstvo, mašine, odeća."}
        pomoc:
          - „Materijalno” znači ono što se može dodirnuti.
          - To su ostaci i predmeti, a ne tekstovi ili snimci.
          - "Iz lekcije: materijalni izvori su ostaci prošlosti — od naselja, preko građevina, do pokućstva."
        objasnjenje: Materijalni izvori su sve što je ljudska ruka ostavila kao predmet — naselja, građevine, pokućstvo, mašine, odeća, novac.
        iz_udzbenika:
          strana: 17
          odeljak: Materijalni istorijski izvori
          tekst: Materijalni izvori su materijalni ostaci prošlosti, od ostataka naselja, preko građevina, do pokućstva.

      - id: mat-izbor-muzeji-vek
        vrsta: izbor
        tezina: lako
        pojmovi: [muzeji]
        pitanje: U kom veku se, prema lekciji, osnivaju muzeji radi prikupljanja, čuvanja i izlaganja materijalnog nasleđa?
        odgovori:
          - {tekst: "U XIX veku", tacan: true}
          - {tekst: "U XVI veku", tacan: false, zasto: "XVI vek se pominje zbog ručne štamparije, a ne zbog muzeja."}
          - {tekst: "Tek posle Prvog svetskog rata", tacan: false, zasto: "Muzeji su osnivani ranije — u XIX veku."}
          - {tekst: "U starom veku", tacan: false, zasto: "Lekcija osnivanje muzeja vezuje za XIX vek."}
        pomoc:
          - Isti vek kada nastaju fotografija i film.
          - Vek koji počinje 1801, a završava se 1900.
          - "Iz lekcije: u XIX veku osnivaju se muzeji."
        objasnjenje: Muzeji se osnivaju u XIX veku da prikupe, sačuvaju i javno izlože materijalno nasleđe.
        iz_udzbenika:
          strana: 17
          odeljak: Materijalni istorijski izvori
          tekst: U XIX veku osnivaju se muzeji radi prikupljanja, čuvanja i javnog izlaganja materijalnog nasleđa.

