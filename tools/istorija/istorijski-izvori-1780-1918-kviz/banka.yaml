          - Bez arhiva bi se mnogi izgubili ili uništili.
          - Istoričari bi imali manje izvora o XIX veku.
          - Arhivi dokumente čuvaju i daju na proučavanje.
        objasnjenje: Arhivi postoje upravo zato da ogromna količina dokumenata ne bi propala i da bi mogla da se proučava.
        iz_udzbenika:
