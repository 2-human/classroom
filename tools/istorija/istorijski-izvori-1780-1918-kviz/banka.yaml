# Banka zadataka — 1.2. Istorijski izvori za izučavanje perioda 1780–1918. (istorija, 7. razred, str. 16–19).
# Spaja se u spec.yaml. Pitanja sopstvenim rečima na osnovu beleške
# tools/istorija/_source/lekcije-7/02-istorijski-izvori-1780-1918.md.
# Svaki pogrešan ponuđeni odgovor ima `zasto` — greška treba da nauči, ne samo da kazni.
# Str. 18: desna kolona je delimično rekonstruisana, pa se sa te strane koriste samo sigurne činjenice
# (Dager 1839, Edison 1877, Limijer 1895, Anastas Jovanović 1817–1899) i potpisi uz slike.
# Ime osobe na fotografiji Anastasa Jovanovića (oko 1850) udžbenik ne daje — o tome nema pitanja.

delovi:
  # ------------------------------------------------------------------------------------------------
  - naslov: Vrste istorijskih izvora
    zadaci:
      - id: vrs-izbor-nova-vrsta
        vrsta: izbor
        tezina: lako
        pojmovi: [istorijski-izvori, audio-vizuelni-izvori]
        pitanje: Koja vrsta istorijskih izvora se javlja kao NOVA u periodu od kraja XVIII veka do kraja Prvog svetskog rata?
        odgovori:
          - {tekst: "Audio-vizuelni izvori", tacan: true}
          - {tekst: "Pisani izvori", tacan: false, zasto: "Pisani izvori postoje i za ranija razdoblja — u ovom periodu ih samo ima mnogo više."}
          - {tekst: "Materijalni izvori", tacan: false, zasto: "Materijalni ostaci prošlosti (naselja, građevine, pokućstvo) postoje za sva razdoblja, ne samo za ovo."}
          - {tekst: "Nijedna — sve vrste su postojale i ranije", tacan: false, zasto: "Fotografija, zvučni zapisi i film nastaju tek u XIX veku, pa su audio-vizuelni izvori zaista nova vrsta."}
        pomoc:
          - Razmisli koja vrsta izvora zavisi od pronalazaka XIX veka.
          - Slika i zvuk se tek tada prvi put mogu zabeležiti aparatom.
          - "Iz lekcije: uz pisane i materijalne izvore, s napretkom nauke javljaju se audio-vizuelni izvori."
        objasnjenje: Pisani i materijalni izvori postoje i za starija razdoblja; audio-vizuelni (fotografija, zvučni zapis, film) javljaju se tek zahvaljujući pronalascima XIX veka.
        iz_udzbenika:
          strana: 16
          odeljak: Uvod
          tekst: Za period od kraja XVIII veka do kraja Prvog svetskog rata, kao i ranije, postoje pisani i materijalni izvori. Napredak nauke donosi i novu vrstu — audio-vizuelne izvore.

      - id: vrs-tn-samo-pisani
        vrsta: tacno_netacno
        tezina: lako
        pojmovi: [istorijski-izvori, pisani-istorijski-izvori, materijalni-istorijski-izvori, audio-vizuelni-izvori]
        tvrdnja: Za period 1780–1918. istoričari imaju samo pisane izvore.
        tacno: false
        ispravke:
          - {tekst: "Postoje pisani, materijalni i audio-vizuelni izvori.", tacan: true}
          - {tekst: "Postoje samo pisani i audio-vizuelni izvori.", tacan: false, zasto: "Izostavljeni su materijalni izvori — muzeji čuvaju mašine, odeću, novac i druge predmete iz tog doba."}
          - {tekst: "Postoje samo materijalni izvori, jer su pisani izgubljeni.", tacan: false, zasto: "Naprotiv — pisanih izvora iz XIX veka ima više nego ikada ranije."}
        pomoc:
          - Setite se koliko vrsta izvora lekcija nabraja.
          - Pored pisanih, tu su i predmeti, kao i fotografije i filmovi.
          - "Iz lekcije: pisani, materijalni i nova vrsta — audio-vizuelni izvori."
        objasnjenje: Za ovaj period postoje sve tri vrste izvora — pisani, materijalni i audio-vizuelni.
        iz_udzbenika:
          strana: 16
          odeljak: Uvod
          tekst: Lekcija deli izvore za period 1780–1918. na pisane, materijalne i audio-vizuelne.

      - id: vrs-povezi-primeri
        vrsta: povezi
        tezina: lako
        pojmovi: [pisani-istorijski-izvori, materijalni-istorijski-izvori, audio-vizuelni-izvori]
        pitanje: Poveži vrstu izvora sa primerom.
        parovi:
          - [Pisani izvor, Naslovna strana lista Politika iz 1914.]
          - [Materijalni izvor, Mašina iz XIX veka izložena u muzeju]
          - [Audio-vizuelni izvor, Film Krunisanje kralja Petra I Karađorđevića]
        pomoc:
          - Pitaj se za svaki primer — da li je napisan, da li je predmet ili je snimljen aparatom?
          - Novine se čitaju, mašina se gleda u muzeju, film se snima kamerom.
          - "Iz lekcije: pisani (novine, dokumenti), materijalni (ostaci, predmeti), audio-vizuelni (fotografija, zvuk, film)."
        objasnjenje: Novine su pisani izvor, mašina u muzeju materijalni, a film audio-vizuelni.
        iz_udzbenika:
          strana: 17
          odeljak: Pisani i materijalni istorijski izvori
          tekst: Pisane izvore čine novine, časopisi i dokumenti; materijalne — ostaci naselja, građevine, pokućstvo, mašine; audio-vizuelne — fotografije, zvučni zapisi i filmovi.

      - id: vrs-zakljuci-nauka
        vrsta: zakljuci
        tezina: srednje
        pojmovi: [audio-vizuelni-izvori, fotografija, fonograf, film]
        pitanje: Zašto za stari i srednji vek nemamo audio-vizuelne izvore, a za XIX vek ih imamo?
        odgovori:
          - {tekst: "Fotografija, fonograf i film izumljeni su tek u XIX veku", tacan: true}
          - {tekst: "Stari audio-vizuelni izvori su svi uništeni u ratovima", tacan: false, zasto: "Oni nisu uništeni — nisu ni postojali, jer aparati za beleženje slike i zvuka još nisu bili izumljeni."}
          - {tekst: "Ranije ljudi nisu umeli da crtaju i slikaju", tacan: false, zasto: "Slike i crteži postoje odavno (npr. štamparija iz XVI veka na graviri), ali to nije snimak aparatom."}
          - {tekst: "Muzeji su u ranijim vekovima odbijali da ih čuvaju", tacan: false, zasto: "Muzeji se uopšte osnivaju tek u XIX veku; razlog je u tehnici snimanja, ne u čuvanju."}
        pomoc:
          - "Korak 1: Šta je potrebno da bi nastao snimak slike ili zvuka?"
          - "Korak 2: Kada su izumljeni ti aparati — Dager 1839, Edison 1877, Limijer 1895?"
          - "Iz lekcije: s napretkom nauke u XIX veku javlja se nova vrsta izvora — audio-vizuelni."
        objasnjenje: Audio-vizuelni izvori zavise od aparata za beleženje slike i zvuka, a ti aparati (dagerotipija, fonograf, film) nastaju tek u XIX veku.
        iz_udzbenika:
          strana: 16
          odeljak: Uvod
          tekst: Napredak nauke u XIX veku doneo je novu vrstu izvora — audio-vizuelne.

      - id: vrs-uporedi-pisani-materijalni
        vrsta: uporedi
        tezina: lako
        pojmovi: [pisani-istorijski-izvori, materijalni-istorijski-izvori, popis-stanovnistva, muzeji, dnevnici]
        a: Pisani izvori
        b: Materijalni izvori
        pitanje: Na koju vrstu izvora se odnosi tvrdnja — A, B, obe ili nijednu?
        tvrdnje:
          - {tekst: "Popis stanovništva iz početka XIX veka", odgovor: a, zasto: "Popis je dokument državne ustanove — pisani izvor."}
          - {tekst: "Saobraćajna sredstva i predmeti za svakodnevnu upotrebu iz XIX veka", odgovor: b, zasto: "To su materijalni ostaci prošlosti; danas ih čuvaju muzeji."}
          - {tekst: "Postoje i za razdoblja pre 1780. godine", odgovor: oba, zasto: "Lekcija kaže da kao i ranije postoje pisani i materijalni izvori."}
          - {tekst: "Dnevnik jednog vojskovođe", odgovor: a, zasto: "Dnevnici i memoari značajnih ličnosti su pisani izvori."}
          - {tekst: "Javljaju se tek u XIX veku, zahvaljujući novim aparatima", odgovor: nijedan, zasto: "To važi za audio-vizuelne izvore; pisani i materijalni su mnogo stariji."}
        pomoc:
          - Pisani izvor se čita, materijalni je predmet ili ostatak.
          - Samo jedna od tri vrste je nova u ovom periodu — i nije ni A ni B.
          - "Iz lekcije: pisani i materijalni izvori postoje i za ranija razdoblja."
        objasnjenje: Popisi i dnevnici su pisani izvori, predmeti i saobraćajna sredstva materijalni; obe vrste su starije od 1780, a nova vrsta su audio-vizuelni izvori.
        iz_udzbenika:
          strana: 17
          odeljak: Pisani i materijalni istorijski izvori
          tekst: Pisane izvore čine i dokumenti (popisi, pisma, izveštaji) i lični zapisi; materijalni izvori su ostaci od naselja i građevina do pokućstva.

      - id: vrs-uporedi-pisani-av
        vrsta: uporedi
        tezina: tesko
        pojmovi: [pisani-istorijski-izvori, audio-vizuelni-izvori, film, fonograf, gutenberg]
        a: Pisani izvori
        b: Audio-vizuelni izvori
        pitanje: Na koju vrstu izvora se odnosi tvrdnja — A, B, obe ili nijednu?
        tvrdnje:
          - {tekst: "Članak iz Malih novina od 3. juna 1896.", odgovor: a, zasto: "Novinski članak je pisani izvor — čak i kada piše o filmu."}
          - {tekst: "Mogu da prikažu pokret ili da sačuvaju zvuk", odgovor: b, zasto: "Film beleži pokret, a fonograf zvuk — to pisani izvor ne može."}
          - {tekst: "Postojali su već u XVI veku, u doba ručne štamparske prese", odgovor: a, zasto: "Pisani izvori su stari; audio-vizuelni nastaju tek od 1839."}
          - {tekst: "Koriste se kao istorijski izvori za period 1780–1918.", odgovor: oba, zasto: "Za ovaj period istoričari koriste i pisane i audio-vizuelne izvore."}
          - {tekst: "Čuvaju se u Zbirci karata i planova Arhiva Vojvodine kao predmeti iz kamenog doba", odgovor: nijedan, zasto: "Ta zbirka čuva dokumente od XVII do XIX veka; predmeti iz davne prošlosti su materijalni izvori."}
        pomoc:
          - Ne zbunjuj se temom — pitaj se kako je izvor nastao (napisan ili snimljen).
          - Članak o filmu je i dalje tekst u novinama.
          - "Iz lekcije: pisani izvori su stari koliko i pismo; audio-vizuelni nastaju s fotografijom, fonografom i filmom."
        objasnjenje: Vrstu izvora određuje način na koji je nastao, a ne tema — članak o filmu je pisani izvor, a film i zvučni zapis su audio-vizuelni.
        iz_udzbenika:
          strana: 19
          odeljak: Svedočanstvo — Prva filmska predstava u Beogradu
          tekst: O prvim filmovima u Beogradu saznajemo iz pisanog izvora — članka novinara Malih novina iz juna 1896.

      - id: vrs-zakljuci-krunisanje
        vrsta: zakljuci
        tezina: srednje
        pojmovi: [audio-vizuelni-izvori, krunisanje-petra-i-karadjordjevica, film]
        pitanje: Istoričar želi da VIDI kako su izgledale ulice Beograda i povorka na krunisanju kralja Petra I 1904. Koji izvor mu najviše pomaže?
        odgovori:
          - {tekst: "Dokumentarni film Krunisanje kralja Petra I Karađorđevića", tacan: true}
          - {tekst: "Naslovna strana Politike iz avgusta 1914.", tacan: false, zasto: "Ona je nastala deset godina kasnije i javlja o pobedi na Ceru, ne o krunisanju."}
          - {tekst: "Popis stanovništva", tacan: false, zasto: "Popis daje brojeve (stanovnici, vera, obrazovanje), a ne sliku jednog događaja."}
          - {tekst: "Članak iz Malih novina iz 1896.", tacan: false, zasto: "Taj članak opisuje prve filmske predstave osam godina pre krunisanja."}
        pomoc:
          - "Korak 1: Šta istoričar hoće — da pročita, da izbroji ili da vidi pokretne prizore?"
          - "Korak 2: Koji izvor je nastao baš 1904. i beleži pokret?"
          - "Iz lekcije: najstariji sačuvani film snimljen u Srbiji je Krunisanje kralja Petra I (1904), oko 50 minuta."
        objasnjenje: Film iz 1904. je snimljen baš na krunisanju i prikazuje pokretne prizore — ulice, kralja na konju, gardiste i narod.
        iz_udzbenika:
          strana: 19
          odeljak: Znatiželja — Prvi filmovi snimljeni u Srbiji
          tekst: Kadar iz filma prikazuje kralja sa krunom na belom konju, okruženog gardistima, na ulici punoj ljudi.
          slika: 02-istorijski-izvori-1780-1918/08-krunisanje-petra-i.jpg
        osa: {naziv: "Film Krunisanje kralja Petra I Karađorđevića", od: 1904, traka: srbija}

      - id: vrs-povezi-uzrok-posledica
        vrsta: povezi
        tezina: tesko
        pojmovi: [obavezno-osnovno-skolovanje, pismenost, telegraf, stampa, arhivi, muzeji, film]
        pitanje: Poveži uzrok sa njegovom posledicom.
        parovi:
          - [Uvedeno obavezno osnovno školovanje, Pismenost prestaje da bude privilegija sveštenstva i plemstva]
          - [Telegraf i telefon ubrzavaju prenos vesti, Štampa postaje još popularnija]
          - [Dokumenata ima više nego ikada, Vlasti osnivaju državne biblioteke i arhive]
          - [Želja da se materijalno nasleđe sačuva i izloži, U XIX veku se osnivaju muzeji]
          - [U Beogradu 1896. još nema bioskopskih sala, Filmovi se prikazuju po kafanama i hotelima]
        pomoc:
          - Kreni od para koji ti je najjasniji, pa isključuj.
          - Arhivi čuvaju dokumente, muzeji predmete; vesti putuju telegrafom.
          - "Iz lekcije: svaka nova ustanova ili navika ima svoj razlog — školovanje, brže vesti, previše dokumenata, briga o nasleđu, nedostatak sala."
        objasnjenje: Školovanje širi pismenost; brže vesti jačaju štampu; mnoštvo dokumenata traži arhive; briga o nasleđu rađa muzeje; bez sala filmovi idu u kafane.
        iz_udzbenika:
          strana: 17
          odeljak: Pisani i materijalni istorijski izvori
          tekst: Lekcija za svaku novu vrstu ustanove navodi razlog — školovanje i štampa, rast dokumenata i arhivi, materijalno nasleđe i muzeji.

      - id: vrs-objasni-tri-vrste
        vrsta: objasni
        tezina: lako
        pojmovi: [pisani-istorijski-izvori, materijalni-istorijski-izvori, audio-vizuelni-izvori]
        pitanje: Navedi tri vrste istorijskih izvora za period 1780–1918. i za svaku daj po jedan primer iz lekcije.
        uzor: Pisani izvori su, na primer, novine poput Politike, popisi stanovništva ili dnevnici. Materijalni izvori su predmeti i ostaci — mašine, saobraćajna sredstva, odeća u muzejima. Audio-vizuelni izvori su fotografije, zvučni zapisi i filmovi, kao film o krunisanju kralja Petra I.
        ideje:
          - Pisani izvori + primer (novine, dokument, pismo, dnevnik).
          - Materijalni izvori + primer (mašina, novac, odeća, građevina).
          - Audio-vizuelni izvori + primer (fotografija, fonograf, film).
          - Audio-vizuelni su nova vrsta u ovom periodu.
        objasnjenje: Tri vrste su pisani, materijalni i audio-vizuelni izvori; poslednja je nova u XIX veku.
        iz_udzbenika:
          strana: 16
          odeljak: Uvod
          tekst: Lekcija deli izvore za period 1780–1918. na pisane, materijalne i audio-vizuelne; poslednji su nova vrsta.

  # ------------------------------------------------------------------------------------------------
  - naslov: Škola, štampa i novine
    zadaci:
      - id: pis-izbor-pismenost
        vrsta: izbor
        tezina: lako
        pojmovi: [pismenost, obavezno-osnovno-skolovanje]
        pitanje: Ko je bio pismen pre nego što je u XIX veku uvedeno obavezno osnovno školovanje?
        odgovori:
          - {tekst: "Uglavnom malobrojni sloj sveštenstva i plemstva", tacan: true}
          - {tekst: "Gotovo svi seljaci", tacan: false, zasto: "Seljaci uglavnom nisu znali da čitaju — pismenost je bila privilegija malobrojnih."}
          - {tekst: "Samo fabrički radnici", tacan: false, zasto: "Radnici nisu bili povlašćeni sloj; pismenost se proširila tek sa obaveznim školovanjem."}
          - {tekst: "Svi stanovnici Evrope", tacan: false, zasto: "Da su svi bili pismeni, obavezno školovanje ne bi ništa promenilo."}
        pomoc:
          - Reč „privilegija” znači povlastica malobrojnih.
          - Mislimo na dva povlašćena sloja starog društva.
          - "Iz lekcije: pismenost je bila privilegija malobrojnog sloja sveštenstva i plemstva."
        objasnjenje: Pre obaveznog školovanja čitati i pisati znali su uglavnom sveštenici i plemići; škola je pismenost proširila na mnogo više ljudi.
        iz_udzbenika:
          strana: 16
          odeljak: Pisani istorijski izvori
          tekst: U XIX veku većina evropskih i neke vanevropske države uvode obavezno osnovno školovanje, pa pismenost prestaje da bude privilegija sveštenstva i plemstva.

      - id: pis-zakljuci-pismenost
        vrsta: zakljuci
        tezina: lako
        pojmovi: [pismenost, obavezno-osnovno-skolovanje]
        pitanje: Zašto je pismenost u XIX veku prestala da bude privilegija sveštenstva i plemstva?
        odgovori:
          - {tekst: "Zato što je uvedeno obavezno osnovno školovanje", tacan: true}
          - {tekst: "Zato što su izumljeni telegraf i telefon", tacan: false, zasto: "Telegraf i telefon su ubrzali vesti i pomogli štampi, ali nisu učili ljude da čitaju."}
          - {tekst: "Zato što su sveštenici i plemići zaboravili da pišu", tacan: false, zasto: "Oni su i dalje bili pismeni — promena je u tome što su pismeni postali i mnogi drugi."}
          - {tekst: "Zato što su osnovani muzeji", tacan: false, zasto: "Muzeji čuvaju i izlažu predmete; čitanje i pisanje se uči u školi."}
        pomoc:
          - "Korak 1: Gde se uči čitanje i pisanje?"
          - "Korak 2: Šta se promenilo kad je ta ustanova postala obavezna za sve?"
          - "Iz lekcije: uvođenjem obaveznog osnovnog školovanja pismenost prestaje da bude privilegija sveštenstva i plemstva."
        objasnjenje: Kad je osnovna škola postala obavezna, čitati i pisati naučili su i ljudi izvan sveštenstva i plemstva.
        iz_udzbenika:
          strana: 16
          odeljak: Pisani istorijski izvori
          tekst: U XIX veku većina evropskih država uvodi obavezno osnovno školovanje, pa se pismenost širi izvan sveštenstva i plemstva.

      - id: pis-dopuni-skolovanje
        vrsta: dopuni
        tezina: lako
        pojmovi: [obavezno-osnovno-skolovanje, pismenost]
        pitanje: Dopuni rečenicu.
        tekst: "U XIX veku uvedeno je {{obavezno}} osnovno školovanje, pa {{pismenost}} više nije bila privilegija sveštenstva i plemstva."
        ponudjene: [obavezno, dobrovoljno, pismenost, štampa, vojska]
        pomoc:
          - Školovanje je postalo nešto što svako mora da prođe.
          - Šta se stiče u školi, a ranije su imali samo sveštenici i plemići?
          - "Iz lekcije: obavezno osnovno školovanje → pismenost više nije privilegija."
        objasnjenje: Obavezno osnovno školovanje proširilo je pismenost izvan sveštenstva i plemstva.
        iz_udzbenika:
          strana: 16
          odeljak: Pisani istorijski izvori
          tekst: Uvođenjem obaveznog osnovnog školovanja pismenost prestaje da bude privilegija malobrojnih.

      - id: pis-lanac-skolovanje
        vrsta: lanac
        tezina: lako
        pojmovi: [obavezno-osnovno-skolovanje, pismenost, stampa]
        karike:
          - Uvodi se obavezno osnovno školovanje
          - "?"
          - Raste potreba za pisanom reči u svakodnevnom životu
        praznina: 1
        odgovori:
          - {tekst: "Sve više ljudi zna da čita i piše", tacan: true}
          - {tekst: "Zatvaraju se štamparije", tacan: false, zasto: "Bilo je obrnuto — više čitalaca značilo je više štampanja, pa se tehnika štampe usavršavala."}
          - {tekst: "Pismenost ostaje samo kod plemstva", tacan: false, zasto: "Upravo to se menja: posle obaveznog školovanja pismenost više nije privilegija plemstva i sveštenstva."}
          - {tekst: "Osnivaju se muzeji", tacan: false, zasto: "Muzeji nastaju zbog čuvanja materijalnog nasleđa, ne zbog školovanja."}
        pomoc:
          - "Korak 1: Šta deca nauče u osnovnoj školi?"
          - "Korak 2: Ko ima potrebu za novinama i knjigama — onaj ko zna ili ne zna da čita?"
          - "Iz lekcije: više pismenih → veća potreba za pisanom reči."
        objasnjenje: Škola stvara sve više pismenih ljudi, a oni u svakodnevnom životu traže sve više pisane reči — novina, knjiga, obaveštenja.
