      - id: film-objasni-cudo
        vrsta: objasni
        tezina: lako
        pojmovi: [kinematograf, fonograf, film]
        pitanje: Kako je novinar Malih novina 1896. opisao čitaocima „čudo od nauke” — kinematograf?
        uzor: Novinar je napisao da je kinematograf aparat koji za pokret čini ono što fonograf čini za zvuk. U njemu se vide živi, pokretni prizori — talasi, kola, lokomotiva i ljudi koji plaču i smeju se — iako se zvuk ne čuje. Pozvao je čitaoce da ne propuste priliku.
        ideje:
          - Uporedio ga je sa fonografom (pokret kao zvuk).
          - Vide se živi, pokretni prizori (talasi, kola, lokomotiva, ljudi).
          - Zvuk se ne čuje.
          - Oduševljeno poziva čitaoce da dođu.
        objasnjenje: Novinar je novo objasnio poznatim (fonograf) i nabrojao prizore koji se kreću; zvuka nije bilo.
        iz_udzbenika:
          strana: 19
          odeljak: Svedočanstvo — Prva filmska predstava u Beogradu
          tekst: Udžbenik pita kako je autor članka iz Malih novina (3. jun 1896) opisao čitaocima „čudo od nauke”.
        osa: {naziv: Prva filmska predstava u Beogradu, od: 1896, traka: srbija}

