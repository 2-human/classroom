# Istorijski izvori za izučavanje perioda 1780–1918. — kviz po lekciji (tip: lesson-quiz; vidi
# templates/lesson-quiz/README.md). Pitanja su napisana sopstvenim rečima na osnovu lekcije
# „1.2. Istorijski izvori za izučavanje perioda 1780–1918.” (istorija, 7. razred, str. 16–19; str. 20–27
# nisu snimljene). Težište je na razumevanju: koje vrste izvora postoje, zašto ih iz ovog doba ima više,
# kako se čitaju i šta mogu da dokažu.
