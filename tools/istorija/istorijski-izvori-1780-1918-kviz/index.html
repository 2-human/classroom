 "vrsta": "dopuni", "tezina": "tesko", "pojmovi": ["dagerotipija", "fonograf", "nemi-film"], "pitanje": "Dopuni rečenicu (bez ponuđenih reči).", "tekst": "Prvi tip fotografije zove se {{dagerotipija}}, mašina za snimanje zvuka zove se {{fonograf}}, a prvi filmovi bez zvuka zvali su se {{nemi|nemi filmovi}} filmovi.", "pomoc": ["Prva reč je izvedena od imena Dager.", "Druga sadrži „fono” (zvuk); treća opisuje film koji ne „govori”.", "Iz lekcije: dagerotipija, fonograf, nemi filmovi."], "objasnjenje": "Dagerotipija je prva fotografija, fonograf beleži zvuk, a filmovi bez zvuka zovu se nemi.", "iz_udzbenika": {"strana": 19, "odeljak": "Svedočanstvo — Prva filmska predstava u Beogradu", "tekst": "Novinar 1896. piše da se u kinematografu vide živi prizori, ali da se ne čuje zvuk — prvi filmovi su bili nemi."}}, {"id": "av-zakljuci-fotografija-1830", "vrsta": "zakljuci", "tezina": "tesko", "pojmovi": ["fotografija", "dagerotipija", "luj-dager", "istorijski-izvori"], "pitanje": "Neko tvrdi da ima pravu fotografiju jednog grada snimljenu 1830. godine. Šta istoričar treba da zaključi?", "odgovori": [{"tekst": "Da je tvrdnja sumnjiva, jer je Dager fotografiju javno prikazao tek 1839.", "tacan": true}, {"tekst": "Da je to sigurno najstarija fotografija na svetu", "tacan": false, "zasto": "Prvi tip fotografije javno je prikazan 1839; tvrdnja da je starija treba proveru, a ne poverenje."}, {"tekst": "Da je to film braće Limijer", "tacan": false, "zasto": "Film se pojavio tek 1895 — još kasnije od fotografije."}, {"tekst": "Da se fotografije uopšte ne mogu koristiti kao izvori", "tacan": false, "zasto": "Fotografije su važni audio-vizuelni izvori — samo treba proveriti kada su nastale."}], "pomoc": ["Korak 1: Kada je fotografija javno prikazana?", "Korak 2: Da li je 1830. pre ili posle toga?", "Iz lekcije: Luj Dager je dagerotipiju javno prikazao 1839."], "objasnjenje": "Godina 1830. je pre javnog prikazivanja dagerotipije (1839), pa istoričar mora da proveri da li je datum tačan — izvor se uvek proverava prema onome što znamo.", "iz_udzbenika": {"strana": 18, "odeljak": "Audio-vizuelni izvori", "tekst": "Luj Dager, začetnik fotografije, javno je prikazao dagerotipiju 1839."}, "osa": {"naziv": "Dager prikazuje dagerotipiju", "od": 1839, "traka": "pronalasci"}}, {"id": "av-izbor-zvuk-1860", "vrsta": "izbor", "tezina": "tesko", "pojmovi": ["fonograf", "tomas-edison", "audio-vizuelni-izvori", "pisani-istorijski-izvori"], "pitanje": "Istoričar želi da sazna kakve su vesti stizale telegrafom 1860. godine. Koji izvori MOGU da postoje za to vreme? Izaberi sve tačne.", "odgovori": [{"tekst": "Novinski članci", "tacan": true}, {"tekst": "Službena pisma i izveštaji", "tacan": true}, {"tekst": "Fotografije", "tacan": true}, {"tekst": "Zvučni zapis glasa telegrafiste", "tacan": false, "zasto": "Prve zvučne zapise Edison je počeo da pravi tek 1877 — 1860. ih još nema."}, {"tekst": "Film o radu telegrafske stanice", "tacan": false, "zasto": "Film se pojavio 1895, mnogo posle 1860."}], "pomoc": ["Proveri za svaku vrstu izvora kada je nastala — 1839, 1877, 1895?", "Pisani izvori postoje odavno; fotografija od 1839.", "Iz lekcije: Dager 1839, Edison 1877, braća Limijer 1895."], "objasnjenje": "Godine 1860. postoje pisani izvori i fotografije (od 1839), ali još nema zvučnih zapisa (od 1877) ni filma (od 1895).", "iz_udzbenika": {"strana": 18, "odeljak": "Audio-vizuelni izvori", "tekst": "Fotografija postoji od 1839, zvučni zapis od 1877, a film od 1895."}}, {"id": "av-lanac-tehnika", "vrsta": "lanac", "tezina": "lako", "pojmovi": ["audio-vizuelni-izvori", "fotografija", "fonograf", "film"], "karike": ["U XIX veku nauka i tehnika brzo napreduju", "?", "Istoričari dobijaju novu vrstu izvora — audio-vizuelne"], "praznina": 1, "odgovori": [{"tekst": "Nastaju fotografija, zvučni zapisi i film", "tacan": true}, {"tekst": "Osnivaju se arhivi za dokumente", "tacan": false, "zasto": "Arhivi čuvaju pisane izvore; ne stvaraju novu vrstu izvora."}, {"tekst": "Uvodi se obavezno školovanje", "tacan": false, "zasto": "Školovanje povećava broj pisanih izvora, a ne stvara audio-vizuelne."}, {"tekst": "Gutenberg izumeva štampu", "tacan": false, "zasto": "To je mnogo starije i odnosi se na pisane izvore."}], "pomoc": ["Korak 1: Šta su audio-vizuelni izvori — slika, zvuk, pokret?", "Korak 2: Koji pronalasci XIX veka to beleže?", "Iz lekcije: u XIX veku javljaju se fotografija, zvučni (audio) i filmski (vizuelni) zapisi."], "objasnjenje": "Napredak tehnike u XIX veku doneo je fotografiju, zvučne zapise i film — a time novu vrstu izvora.", "iz_udzbenika": {"strana": 16, "odeljak": "Uvod", "tekst": "S napretkom nauke javlja se nova vrsta izvora — audio-vizuelni."}}, {"id": "av-izvor-viktorija", "vrsta": "izvor", "tezina": "srednje", "pojmovi": ["kraljica-viktorija", "fotografija", "audio-vizuelni-izvori"], "izvor": {"autor": "Dva portreta kraljice Viktorije", "naslov": "Umetnička slika (1856) i fotografija (1861) — opis", "tekst": "Na slici iz 1856, u boji, kraljica nosi krunu, crvenu haljinu i nakit. Na crno-beloj fotografiji iz 1861. ista kraljica je u tamnoj haljini, okrenuta iz profila, bez ukrasa koji privlače pažnju.", "napomena": "Opis slika je prepričan; udžbenik, str. 18."}, "pitanje": "Koji od dva portreta vernije prikazuje kako je vladarka zaista izgledala?", "odgovori": [{"tekst": "Fotografija iz 1861, jer beleži ono što je bilo pred aparatom", "tacan": true}, {"tekst": "Slika iz 1856, jer je u boji", "tacan": false, "zasto": "Boja ne znači vernost — slikar je mogao da ulepša lik, krunu i nakit."}, {"tekst": "Oba podjednako, jer su nastala istog dana", "tacan": false, "zasto": "Nastala su u kratkom razmaku, ali ne istog dana — 1856. i 1861."}, {"tekst": "Nijedan, jer Viktorija tada nije bila kraljica", "tacan": false, "zasto": "Viktorija je vladala od 1837. do 1901 — oba portreta su iz njene vladavine."}], "pomoc": ["Ko odlučuje šta će se videti na slici — slikar ili aparat?", "Slika je idealizovana, fotografija prirodnija.", "Iz lekcije: dva portreta nastala su u kratkom razmaku; udžbenik pita koji vernije prikazuje vladarku."], "objasnjenje": "Fotografija beleži ono što je bilo pred aparatom, dok slikar može da ulepša i idealizuje — zato fotografija vernije prikazuje izgled.", "iz_udzbenika": {"strana": 18, "odeljak": "Audio-vizuelni izvori — potpis uz sliku", "tekst": "Udžbenik donosi dva portreta britanske kraljice Viktorije — umetničku sliku iz 1856. i fotografiju iz 1861 — i pita u čemu se razlikuju.", "slika": "02-istorijski-izvori-1780-1918/05-kraljica-viktorija-dva-portreta.jpg"}, "osa": {"naziv": "Fotografija kraljice Viktorije", "od": 1861, "traka": "izvori"}}, {"id": "av-uporedi-slika-foto", "vrsta": "uporedi", "tezina": "srednje", "pojmovi": ["kraljica-viktorija", "fotografija"], "a": "Umetnička slika kraljice Viktorije (1856)", "b": "Fotografija kraljice Viktorije (1861)", "pitanje": "Na koji portret se odnosi tvrdnja — A, B, oba ili nijedan?", "tvrdnje": [{"tekst": "U boji je", "odgovor": "a", "zasto": "Slika je u boji; fotografija iz 1861. je crno-bela."}, {"tekst": "Crno-bela je", "odgovor": "b", "zasto": "Rane fotografije su crno-bele."}, {"tekst": "Kraljica nosi krunu i nakit", "odgovor": "a", "zasto": "Na umetničkoj slici kraljica je sa krunom, u crvenoj haljini i sa nakitom."}, {"tekst": "Prikazuje kraljicu Viktoriju u vreme njene vladavine", "odgovor": "oba", "zasto": "Oba su iz vremena njene vladavine (1837–1901)."}, {"tekst": "Nastao je pre nego što je Dager prikazao fotografiju (1839)", "odgovor": "nijedan", "zasto": "Oba su nastala posle 1839 — 1856. i 1861."}], "pomoc": ["Boja i ukrasi — šta od toga može slikar, a šta aparat iz 1861?", "Proveri godine prema 1839.", "Iz lekcije: levo slika iz 1856, desno fotografija iz 1861."], "objasnjenje": "Slika je u boji, sa krunom i nakitom; fotografija je crno-bela i prirodnija. Obe su iz Viktorijine vladavine i nastale posle 1839.", "iz_udzbenika": {"strana": 18, "odeljak": "Audio-vizuelni izvori — potpis uz sliku", "tekst": "Levo je umetnička slika kraljice Viktorije iz 1856, desno fotografija iz 1861.", "slika": "02-istorijski-izvori-1780-1918/05-kraljica-viktorija-dva-portreta.jpg"}, "osa": {"naziv": "Umetnički portret kraljice Viktorije", "od": 1856, "traka": "izvori"}}, {"id": "av-izvor-viktorija-tesko", "vrsta": "izvor", "tezina": "tesko", "pojmovi": ["kraljica-viktorija", "fotografija", "istorijski-izvori"], "izvor": {"autor": "Dva portreta kraljice Viktorije", "naslov": "Umetnička slika (1856) i fotografija (1861) — opis", "tekst": "Slika iz 1856. prikazuje kraljicu u boji, sa krunom, u crvenoj haljini i sa nakitom. Fotografija iz 1861, crno-bela, prikazuje je u tamnoj haljini, iz profila.", "napomena": "Opis slika je prepričan; udžbenik, str. 18."}, "pitanje": "Za šta je umetnička slika ipak KORISTAN izvor, iako je manje verna od fotografije?", "odgovori": [{"tekst": "Za to kako je vladarka želela da bude predstavljena — u sjaju, sa krunom i nakitom", "tacan": true}, {"tekst": "Za tačan izgled njenog lica", "tacan": false, "zasto": "Upravo za to je fotografija pouzdanija, jer slikar može da ulepša lik."}, {"tekst": "Za to kako je zvučao njen glas", "tacan": false, "zasto": "Glas može da sačuva samo zvučni zapis, a njih ima tek od 1877."}, {"tekst": "Ni za šta — umetničke slike nisu istorijski izvori", "tacan": false, "zasto": "I slika je izvor — pokazuje kako se vladar predstavljao javnosti."}], "pomoc": ["Slikar je kraljicu naslikao sa krunom i nakitom — zašto?", "Izvor ne mora biti potpuno veran da bi bio koristan; pitanje je šta pokazuje.", "Iz lekcije: slika je idealizovana, sa krunom i nakitom; fotografija je prirodnija."], "objasnjenje": "Idealizovana slika pokazuje kako je vladarka želela da bude viđena — kraljevski i svečano; fotografija bolje pokazuje stvarni izgled. Svaki izvor odgovara na drugo pitanje.", "iz_udzbenika": {"strana": 18, "odeljak": "Audio-vizuelni izvori — potpis uz sliku", "tekst": "Dva portreta kraljice Viktorije nastala su u kratkom razmaku; udžbenik pita u čemu se razlikuju i koji vernije prikazuje vladarku.", "slika": "02-istorijski-izvori-1780-1918/05-kraljica-viktorija-dva-portreta.jpg"}, "osa": {"naziv": "Umetnički portret kraljice Viktorije", "od": 1856, "traka": "izvori"}}, {"id": "av-datum-viktorija", "vrsta": "datum", "tezina": "srednje", "pojmovi": ["kraljica-viktorija", "velika-britanija"], "dogadjaj": "Kraljica Viktorija", "pitanje": "Od koje do koje godine je vladala britanska kraljica Viktorija?", "od": 1837, "do": 1901, "traka": "licnosti", "pomoc": ["Vladala je više od šezdeset godina — skoro ceo drugi deo XIX veka.", "Počela je dve godine pre Dagerove fotografije, a umrla na samom početku XX veka.", "Iz lekcije: Viktorija (1837–1901)."], "objasnjenje": "Kraljica Viktorija vladala je 1837–1901; njeni portreti iz 1856. i 1861. su iz sredine vladavine.", "iz_udzbenika": {"strana": 18, "odeljak": "Audio-vizuelni izvori — potpis uz sliku", "tekst": "Potpis uz dva portreta navodi britansku kraljicu Viktoriju (1837–1901).", "slika": "02-istorijski-izvori-1780-1918/05-kraljica-viktorija-dva-portreta.jpg"}}, {"id": "av-ko-sam-viktorija", "vrsta": "ko_sam", "tezina": "srednje", "pojmovi": ["kraljica-viktorija", "velika-britanija", "fotografija"], "tragovi": ["Vladala sam više od šezdeset godina, sve do 1901.", "Sačuvana su dva moja portreta iz kratkog razmaka — jedan naslikan, jedan snimljen.", "Na slici iz 1856. nosim krunu, a na fotografiji iz 1861. sam iz profila.", "Bila sam britanska kraljica od 1837. godine."], "odgovori": [{"tekst": "Kraljica Viktorija", "tacan": true}, {"tekst": "Marija Terezija", "tacan": false, "zasto": "Marija Terezija je vladala Habzburškom monarhijom 1740–1780, pre fotografije."}, {"tekst": "Katarina II Velika", "tacan": false, "zasto": "Katarina II je bila ruska carica u XVIII veku; nema njene fotografije."}, {"tekst": "Anastas Jovanović", "tacan": false, "zasto": "Anastas Jovanović je bio slikar i fotograf iz Srbije, a ne vladarka."}], "objasnjenje": "To je britanska kraljica Viktorija (1837–1901); njena slika iz 1856. i fotografija iz 1861. pokazuju razliku između dve vrste portreta.", "iz_udzbenika": {"strana": 18, "odeljak": "Audio-vizuelni izvori — potpis uz sliku", "tekst": "Dva portreta britanske kraljice Viktorije (1837–1901), slika iz 1856. i fotografija iz 1861.", "slika": "02-istorijski-izvori-1780-1918/05-kraljica-viktorija-dva-portreta.jpg"}, "osa": {"naziv": "Kraljica Viktorija", "od": 1837, "do": 1901, "traka": "licnosti"}}, {"id": "av-ko-sam-dager", "vrsta": "ko_sam", "tezina": "lako", "tragovi": ["Smatraju me začetnikom fotografije.", "Svoj pronalazak sam javno prikazao 1839.", "Prvi tip fotografije nosi moje ime — dagerotipija."], "pojmovi": ["luj-dager", "dagerotipija", "fotografija"], "odgovori": [{"tekst": "Luj Dager", "tacan": true}, {"tekst": "Tomas Edison", "tacan": false, "zasto": "Edison je izumeo fonograf — beleži zvuk, ne sliku."}, {"tekst": "Andre Kar", "tacan": false, "zasto": "Andre Kar je zastupnik braće Limijer koji je 1897. snimao filmove u Srbiji."}, {"tekst": "Morze", "tacan": false, "zasto": "Morze je vezan za telegraf (1844)."}], "objasnjenje": "To je Luj Dager — dagerotipiju, prvi tip fotografije, javno je prikazao 1839.", "iz_udzbenika": {"strana": 18, "odeljak": "Audio-vizuelni izvori", "tekst": "Luj Dager je začetnik fotografije; dagerotipiju, nazvanu po njemu, javno je prikazao 1839."}, "osa": {"naziv": "Dager prikazuje dagerotipiju", "od": 1839, "traka": "pronalasci"}}, {"id": "av-ko-sam-edison", "vrsta": "ko_sam", "tezina": "lako", "pojmovi": ["tomas-edison", "fonograf"], "tragovi": ["Moj pronalazak je jedan od početaka audio-vizuelnih izvora.", "Godine 1877. počeo sam da pravim prve zvučne zapise.", "Izumeo sam fonograf, mašinu za snimanje zvuka."], "odgovori": [{"tekst": "Tomas Edison", "tacan": true}, {"tekst": "Bel", "tacan": false, "zasto": "Belov telefon (1876) prenosi glas na daljinu, ali ga ne snima."}, {"tekst": "Luj Dager", "tacan": false, "zasto": "Dager je začetnik fotografije (1839)."}, {"tekst": "Braća Limijer", "tacan": false, "zasto": "Braća Limijer su izumela film (1895)."}], "objasnjenje": "To je Tomas Edison — fonografom je 1877. počeo da pravi prve zvučne zapise.", "iz_udzbenika": {"strana": 18, "odeljak": "Audio-vizuelni izvori", "tekst": "Fonograf je mašina za snimanje zvuka, pronalazak Tomasa Edisona (1877)."}, "osa": {"naziv": "Edisonov fonograf", "od": 1877, "traka": "pronalasci"}}, {"id": "av-ko-sam-anastas", "vrsta": "ko_sam", "tezina": "srednje", "pojmovi": ["anastas-jovanovic", "fotografija"], "tragovi": ["Rođen sam 1817, a umro 1899.", "Bio sam i slikar i fotograf.", "Jednu moju fotografiju, nastalu oko 1850, možeš videti u udžbeniku.", "Smatraju me jednim od pionira fotografije u Srbiji."], "odgovori": [{"tekst": "Anastas Jovanović", "tacan": true}, {"tekst": "Andre Kar", "tacan": false, "zasto": "Andre Kar je 1897. snimao filmove u Srbiji, ali je bio zastupnik braće Limijer, a ne fotograf iz 1850-ih."}, {"tekst": "Luj Dager", "tacan": false, "zasto": "Dager je začetnik fotografije uopšte, a ne pionir fotografije u Srbiji."}, {"tekst": "De Beri", "tacan": false, "zasto": "De Beri je francuski snimatelj koji je u Beogradu radio od 1911."}], "objasnjenje": "To je Anastas Jovanović (1817–1899), slikar i fotograf, jedan od pionira fotografije u Srbiji.", "iz_udzbenika": {"strana": 18, "odeljak": "Audio-vizuelni izvori — fotografija Anastasa Jovanovića", "tekst": "Anastas Jovanović (1817–1899), slikar i fotograf, jedan je od pionira fotografije u Srbiji; u udžbeniku je njegova fotografija iz oko 1850.", "slika": "02-istorijski-izvori-1780-1918/06-fotografija-anastasa-jovanovica.jpg"}, "osa": {"naziv": "Anastas Jovanović", "od": 1817, "do": 1899, "traka": "licnosti"}}, {"id": "av-datum-anastas", "vrsta": "datum", "tezina": "tesko", "pojmovi": ["anastas-jovanovic", "fotografija"], "dogadjaj": "Anastas Jovanović", "pitanje": "Kada je živeo Anastas Jovanović, jedan od pionira fotografije u Srbiji? (godina rođenja – godina smrti)", "od": 1817, "do": 1899, "traka": "licnosti", "pomoc": ["Rođen je dvadesetak godina pre Dagerove fotografije, a umro pred kraj XIX veka.", "Doživeo je i pojavu filma (1895).", "Iz lekcije: Anastas Jovanović (1817–1899)."], "objasnjenje": "Anastas Jovanović je živeo 1817–1899; fotografisao je već oko 1850, desetak godina posle Dagera.", "iz_udzbenika": {"strana": 18, "odeljak": "Audio-vizuelni izvori — fotografija Anastasa Jovanovića", "tekst": "Anastas Jovanović (1817–1899), slikar i fotograf, pionir fotografije u Srbiji.", "slika": "02-istorijski-izvori-1780-1918/06-fotografija-anastasa-jovanovica.jpg"}}, {"id": "av-izvor-anastas", "vrsta": "izvor", "tezina": "srednje", "pojmovi": ["anastas-jovanovic", "fotografija", "audio-vizuelni-izvori"], "izvor": {"autor": "Anastas Jovanović", "naslov": "Fotografija iz oko 1850. godine (opis)", "tekst": "Crno-bela fotografija prikazuje starijeg muškarca koji sedi u fotelji. Na glavi ima fes, nosi velike brkove, a na grudima ordenje.", "napomena": "Opis slike je prepričan; udžbenik, str. 18."}, "pitanje": "Šta istoričar POUZDANO može da sazna iz ove fotografije?", "odgovori": [{"tekst": "Kako su izgledali odeća, fes i ordenje jednog čoveka sredinom XIX veka", "tacan": true}, {"tekst": "Kako je zvučao glas tog čoveka", "tacan": false, "zasto": "Fotografija ne beleži zvuk; zvučni zapisi počinju tek 1877."}, {"tekst": "Kako se taj čovek kretao", "tacan": false, "zasto": "Pokret beleži film, koji se pojavio tek 1895."}, {"tekst": "Koliko je stanovnika imala Srbija", "tacan": false, "zasto": "To daje popis stanovništva, a ne portret jednog čoveka."}], "pomoc": ["Šta fotografija beleži — sliku, zvuk ili pokret?", "Pogledaj šta se na slici zaista vidi — odeća, glava, grudi.", "Iz lekcije: Anastas Jovanović (1817–1899), pionir fotografije u Srbiji; fotografija je iz oko 1850."], "objasnjenje": "Fotografija pouzdano pokazuje izgled — odeću, fes, brkove i ordenje; zvuk, pokret i statistiku ne može da pokaže.", "iz_udzbenika": {"strana": 18, "odeljak": "Audio-vizuelni izvori — fotografija Anastasa Jovanovića", "tekst": "Udžbenik donosi fotografiju Anastasa Jovanovića iz oko 1850 — stariji muškarac sa fesom, brkovima i ordenjem.", "slika": "02-istorijski-izvori-1780-1918/06-fotografija-anastasa-jovanovica.jpg"}, "osa": {"naziv": "Anastas Jovanović", "od": 1817, "do": 1899, "traka": "licnosti"}}, {"id": "av-tn-anastas", "vrsta": "tacno_netacno", "tezina": "srednje", "pojmovi": ["anastas-jovanovic", "fotografija", "dagerotipija"], "tvrdnja": "Anastas Jovanović je fotografisao već oko 1850, desetak godina posle Dagerovog javnog prikazivanja fotografije.", "tacno": true, "pomoc": ["Uporedi godinu fotografije u udžbeniku sa godinom 1839.", "1850 − 1839 = ?", "Iz lekcije: Dager 1839; fotografija Anastasa Jovanovića nastala je oko 1850."], "objasnjenje": "Tačno — fotografija je nova tehnika iz 1839, a Anastas Jovanović je oko 1850. već snimao u Srbiji; zato ga zovu pionirom.", "iz_udzbenika": {"strana": 18, "odeljak": "Audio-vizuelni izvori — fotografija Anastasa Jovanovića", "tekst": "Fotografija Anastasa Jovanovića nastala je oko 1850, nedugo posle pojave dagerotipije (1839).", "slika": "02-istorijski-izvori-1780-1918/06-fotografija-anastasa-jovanovica.jpg"}}, {"id": "av-objasni-viktorija", "vrsta": "objasni", "tezina": "srednje", "pojmovi": ["kraljica-viktorija", "fotografija"], "pitanje": "Dva portreta kraljice Viktorije nastala su u kratkom razmaku. U čemu se razlikuju i koji od njih vernije prikazuje vladarku? Obrazloži.", "uzor": "Umetnička slika iz 1856. je u boji i prikazuje kraljicu sa krunom, u crvenoj haljini i sa nakitom — svečano i ulepšano. Fotografija iz 1861. je crno-bela i prikazuje je iz profila, u tamnoj haljini, prirodnije. Vernija je fotografija, jer aparat beleži ono što je pred njim, a slikar može da ulepša.", "ideje": ["Slika je u boji, fotografija crno-bela.", "Slika je svečana i idealizovana (kruna, nakit).", "Fotografija je prirodnija.", "Vernija je fotografija, jer slikar može da ulepša."], "objasnjenje": "Fotografija je vernija; slika pokazuje kako je vladarka želela da bude viđena.", "iz_udzbenika": {"strana": 18, "odeljak": "Audio-vizuelni izvori — potpis uz sliku", "tekst": "Udžbenik poredi sliku kraljice Viktorije iz 1856. i fotografiju iz 1861. i pita koji portret vernije prikazuje vladarku.", "slika": "02-istorijski-izvori-1780-1918/05-kraljica-viktorija-dva-portreta.jpg"}, "osa": {"naziv": "Fotografija kraljice Viktorije", "od": 1861, "traka": "izvori"}}, {"id": "av-objasni-promena", "vrsta": "objasni", "tezina": "tesko", "pojmovi": ["audio-vizuelni-izvori", "fotografija", "fonograf", "film"], "pitanje": "Kako su fotografija, fonograf i film promenili ono što istoričari mogu da saznaju o prošlosti?", "uzor": "Pre njih istoričar je o izgledu ljudi i mesta znao samo iz opisa i slika, koje su mogle biti ulepšane. Fotografija beleži stvarni izgled, fonograf čuva zvuk i glas, a film pokazuje pokret i događaje kako su se odvijali. Zato za period posle XIX veka istoričar može ne samo da čita o prošlosti nego i da je vidi i čuje.", "ideje": ["Ranije su postojali samo pisani opisi i slike.", "Fotografija beleži stvarni izgled.", "Fonograf čuva zvuk, film pokazuje pokret.", "Prošlost se može videti i čuti, ne samo čitati."], "objasnjenje": "Audio-vizuelni izvori dodaju sliku, zvuk i pokret onome što su ranije davali samo tekstovi i predmeti.", "iz_udzbenika": {"strana": 18, "odeljak": "Audio-vizuelni izvori", "tekst": "U XIX veku javljaju se fotografija (1839), zvučni zapis (1877) i film (1895) — nova vrsta izvora."}}]}, {"naslov": "Prvi filmovi u Srbiji", "zadaci": [{"id": "film-izvor-zlatni-krst", "vrsta": "izvor", "tezina": "lako", "pojmovi": ["kinematograf", "beograd", "film"], "izvor": {"autor": "Novinar beogradskih Malih novina", "naslov": "Prva filmska predstava u Beogradu, 3. jun 1896. (prepričano)", "tekst": "Već nekoliko dana kod kafane „Zlatni krst” prikazuje se kinematograf — aparat koji za pokret čini ono što fonograf čini za zvuk. Vide se živi prizori — talasi, kola, lokomotiva, ljudi koji plaču i smeju se — iako se zvuk ne čuje. Ne propustite priliku! Prikazivanja su pre podne od 9 do 12 i posle podne od 3 do 9.", "napomena": "Odlomak je prepričan; udžbenik, str. 19 (Svedočanstvo)."}, "pitanje": "Gde se, prema članku, prikazivao kinematograf?", "odgovori": [{"tekst": "Kod kafane Zlatni krst", "tacan": true}, {"tekst": "U hotelu Pariz na Terazijama", "tacan": false, "zasto": "Tamo je tek 1908. otvoren prvi stalni bioskop."}, {"tekst": "U Narodnom muzeju", "tacan": false, "zasto": "Muzeji čuvaju predmete; filmovi su 1896. prikazivani po kafanama, hotelima i pod šatorima."}, {"tekst": "U pariskoj operi", "tacan": false, "zasto": "Članak opisuje prikazivanje u Beogradu, a ne u Parizu."}], "pomoc": ["Bioskopskih sala tada još nije bilo.", "Ime mesta pominje se na početku članka.", "Iz lekcije: kinematograf se prikazivao kod kafane „Zlatni krst”."], "objasnjenje": "Kinematograf se 1896. prikazivao kod kafane „Zlatni krst” — bioskopa još nije bilo.", "iz_udzbenika": {"strana": 19, "odeljak": "Svedočanstvo — Prva filmska predstava u Beogradu", "tekst": "Novinar Malih novina 3. juna 1896. javlja da se kod kafane „Zlatni krst” prikazuje kinematograf."}, "osa": {"naziv": "Prva filmska predstava u Beogradu", "od": 1896, "traka": "srbija"}}, {"id": "film-izvor-fonograf", "vrsta": "izvor", "tezina": "srednje", "pojmovi": ["kinematograf", "fonograf", "film"], "izvor": {"autor": "Novinar beogradskih Malih novina", "naslov": "Prva filmska predstava u Beogradu, 3. jun 1896. (prepričano)", "tekst": "Kinematograf je aparat koji za pokret čini ono što fonograf čini za zvuk. U njemu se vide živi prizori — talasi, kola, lokomotiva, ljudi — iako se zvuk ne čuje.", "napomena": "Odlomak je prepričan; udžbenik, str. 19 (Svedočanstvo)."}, "pitanje": "Kako je novinar čitaocima objasnio šta je kinematograf?", "odgovori": [{"tekst": "Uporedio ga je sa fonografom — kao što fonograf beleži zvuk, kinematograf beleži pokret", "tacan": true}, {"tekst": "Opisao ga je kao novu vrstu štamparske mašine", "tacan": false, "zasto": "Štamparska mašina štampa tekst; kinematograf prikazuje pokretne slike."}, {"tekst": "Rekao je da je to telefon sa slikom", "tacan": false, "zasto": "U članku se kinematograf poredi sa fonografom, ne sa telefonom."}, {"tekst": "Napisao je da prikazuje samo nepomične slike, kao fotografija", "tacan": false, "zasto": "Naprotiv — novinar ističe žive, pokretne prizore."}], "pomoc": ["Novinar koristi poređenje sa aparatom koji su čitaoci već mogli da znaju.", "Taj aparat čuva zvuk.", "Iz lekcije: kinematograf za pokret čini ono što fonograf čini za zvuk."], "objasnjenje": "Novinar je novi aparat objasnio poređenjem — fonograf čuva zvuk, a kinematograf pokret.", "iz_udzbenika": {"strana": 19, "odeljak": "Svedočanstvo — Prva filmska predstava u Beogradu", "tekst": "Udžbenik pita kako je autor članka opisao „čudo od nauke”; novinar ga poredi sa fonografom."}, "osa": {"naziv": "Prva filmska predstava u Beogradu", "od": 1896, "traka": "srbija"}}, {"id": "film-izvor-nemi", "vrsta": "izvor", "tezina": "srednje", "pojmovi": ["nemi-film", "kinematograf", "film"], "izvor": {"autor": "Novinar beogradskih Malih novina", "naslov": "Prva filmska predstava u Beogradu, 3. jun 1896. (prepričano)", "tekst": "U kinematografu se vide talasi, kola, lokomotiva i ljudi koji plaču i smeju se — sve živo i u pokretu, samo što se zvuk ne čuje.", "napomena": "Odlomak je prepričan; udžbenik, str. 19 (Svedočanstvo)."}, "pitanje": "Koju osobinu prvih filmova potvrđuje ovaj članak?", "odgovori": [{"tekst": "Bili su bez zvuka — „nemi filmovi”", "tacan": true}, {"tekst": "Bili su u boji i sa muzikom", "tacan": false, "zasto": "Novinar izričito kaže da se zvuk ne čuje."}, {"tekst": "Trajali su po nekoliko sati", "tacan": false, "zasto": "Članak ne govori o trajanju filmova — samo opisuje šta se vidi i da se zvuk ne čuje."}, {"tekst": "Bili su snimljeni u Srbiji", "tacan": false, "zasto": "To su fi   // whole bank (shares count across all levels, with a little randomness so draws differ); inside a
  // section the items alternate by type (rr). A level that runs short is filled from the others.
  const size = {}, taken = {};
  for (const z of bank) size[z.deo] = (size[z.deo] || 0) + 1;
  const pools = Object.fromEntries(TEZ.map(t => {
    const bySec = {};
    for (const z of bank.filter(x => x.tezina === t)) (bySec[z.deo] = bySec[z.deo] || []).push(z);
    return [t, Object.fromEntries(Object.entries(bySec).map(([d, zs]) => [d, rr(zs, x => x.vrsta)]))];
  }));
  const takeOne = t => {
    const ks = Object.keys(pools[t]).filter(k => pools[t][k].length);
    if (!ks.length) return null;
    const k = ks.reduce((a, x) => ((taken[x] || 0) + r()) / size[x] < ((taken[a] || 0) + r()) / size[a] ? x : a);
    taken[k] = (taken[k] || 0) + 1;
    return pools[t][k].shift();
  };
  const picked = [];
  for (const t of TEZ) for (let i = 0; i < want[t]; i++) { const z = takeOne(t); if (z) picked.push(z); }
  for (const t of ['srednje', 'lako', 'tesko']) { let z; while (picked.length < n && (z = takeOne(t))) picked.push(z); }   // a level ran short
  again.forEach(z => { z.ponovo = true; picked.push(z); });
  picked.sort((a, b) => a.deo - b.deo || TEZ.indexOf(a.tezina) - TEZ.indexOf(b.tezina));
  const secs = [];
  for (const z of picked) { const name = deoNaslov(z); let sec = secs.find(x => x.naslov === name); if (!sec) secs.push(sec = { naslov: name, ids: [] }); sec.ids.push(z.id); }

function frame(z, s, inner) {
  const n = numOf(z);
  const pts = isDone(s) ? (s.status === 'ok' ? '✓ ' + s.pts + ' b' : s.status === 'failed' ? '✗ 0 b' : 'otkriveno · 0 b') : (s.miss ? 'sada ' + ptsFor(s.miss) + ' b' : 'do 3 b');
  return '<div class="item"><div class="ihead"><span class="vchip">' + VRSTA_LBL[z.vrsta] + '</span>' + tzBadge(z) + ' ' + TEZ_LBL[z.tezina] + '<span>' + esc(deoNaslov(z)) + ' · zadatak ' + n + ' / ' + curItems().length + '</span><span>' + pts + '</span></div>' +
    inner + '<div class="help-inline" id="helpInline"></div><div class="iactions" id="actions"></div>' +
    (isDone(s) ? '<div class="expl' + (s.status === 'ok' ? '' : ' rev') + '">' + (s.status === 'failed' ? 'Netačno. Odgovor ćeš videti u Ispravci.' : fmt(z.objasnjenje || '')) + '</div>' : '') + '</div>';
}
function actions(btns) {
  const a = document.getElementById('actions');
  a.innerHTML = btns.map(b => '<button type="button" id="' + b[0] + '"' + (b[2] ? ' class="' + b[2] + '"' : '') + '>' + b[1] + '</button>').join('');
}
function nextButton(z) {   // done: Sledeći + reopen the drawer; in progress with help used: reopen the help
  const s = st(z.id), a = document.getElementById('actions');
  if (!isDone(s)) {
    if (s.miss && helpOn() && !CLUES[z.vrsta] && !mobile()) {
      a.insertAdjacentHTML('beforeend', '<button type="button" id="btnHelp">Pomoć</button>');
      document.getElementById('btnHelp').addEventListener('click', openDrawer);
    }
    return;
  }
  a.insertAdjacentHTML('beforeend', '<button type="button" class="ok" id="btnNext">Sledeći ›</button>' +
    (s.status !== 'failed' ? '<button type="button" id="btnMore">' + (z.iz_udzbenika ? 'Iz udžbenika' : 'Saznaj više') + '</button>' : ''));
  document.getElementById('btnNext').addEventListener('click', goNext);
  const m = document.getElementById('btnMore'); if (m) m.addEventListener('click', openDrawer);
}

function prelude(z, s) {   // what stands above the options: a source, a cause→effect chain, the clues so far
  const done = isDone(s), right = z.odgovori && z.odgovori.find(o => o.tacan);
  if (z.vrsta === 'izvor') { const iz = z.izvor;
    return '<div class="src">' + (iz.autor || iz.naslov ? '<p class="who">' + esc([iz.autor, iz.naslov].filter(Boolean).join(' — ')) + '</p>' : '') +
      '<blockquote>' + fmt(iz.tekst) + '</blockquote>' + (iz.napomena ? '<p class="nt">' + fmt(iz.napomena) + '</p>' : '') + '</div>'; }
  if (z.vrsta === 'lanac') return '<div class="chain">' + z.karike.map((k, i) => (i ? '<span class="ar">→</span>' : '') +
    (i === z.praznina ? '<div class="lk q' + (done && s.status !== 'failed' ? ' ok' : '') + '">' + (done && s.status !== 'failed' ? fmt(right.tekst) : '?') + '</div>' : '<div class="lk">' + fmt(k) + '</div>')).join('') + '</div>';
  if (z.vrsta === 'ko_sam') { const n = Math.min(z.tragovi.length, done ? z.tragovi.length : s.miss + 1);
    return '<ul class="clues">' + z.tragovi.slice(0, n).map((t, i) => '<li><span class="k">Trag ' + (i + 1) + '</span>' + fmt(t) + '</li>').join('') + '</ul>'; }
  return '';
}
function renderChoice(z, s) {   // izbor, zakljuci, lanac, izvor, ko_sam (+ the correction step of tacno_netacno)
  const opts = shuffled(z.odgovori, z.id);
  const multi = z.odgovori.filter(o => o.tacan).length > 1;
  const ui = s.ui; ui.wrong = ui.wrong || []; ui.pick = ui.pick || [];
  const done = isDone(s), showRight = s.status === 'ok' || s.status === 'revealed';
  const why = o => o.zasto && (helpOn() || (done && s.status !== 'failed')) ? '<span class="why">' + fmt(o.zasto) + '</span>' : '';
  main.innerHTML = frame(z, s, prelude(z, s) + '<h2 class="q">' + fmt(z.pitanje || (z.vrsta === 'ko_sam' ? 'Ko sam ja?' : 'Koja karika nedostaje?')) + '</h2><div class="opts">' + opts.map(([o, i]) =>
    '<button type="button" class="opt' + (multi ? '' : ' round') + (ui.wrong.includes(i) ? ' wrong' : '') + (showRight && o.tacan ? ' right' : '') +
    (!done && ui.pick.includes(i) ? ' picked' : '') + '" data-i="' + i + '"' + (done || ui.wrong.includes(i) ? ' disabled' : '') + '><span class="box"></span><span><span class="ot">' + fmt(o.tekst) + '</span>' +
    (ui.wrong.includes(i) ? why(o) : '') + '</span></button>').join('') + '</div>');
  if (!done && multi) actions([['btnCheck', 'Proveri', 'ok']]);
  if (!done && z.vrsta === 'ko_sam' && s.miss < steps(z)) { actions([['btnClue', 'Još jedan trag']]); document.getElementById('btnClue').addEventListener('click', () => { ui.why = null; fail(z, 'Novi trag', 'zatražen novi trag'); }); }
  main.querySelectorAll('.opt').forEach(b => b.addEventListener('click', () => {
    const i = +b.dataset.i;
    if (!multi) { if (z.odgovori[i].tacan) succeed(z, z.odgovori[i].tekst); else { ui.wrong.push(i); ui.why = z.odgovori[i].zasto || null; fail(z, undefined, z.odgovori[i].tekst); } return; }
    ui.pick = ui.pick.includes(i) ? ui.pick.filter(x => x !== i) : ui.pick.concat(i);
    b.classList.toggle('picked'); save();
  }));
  const chk = document.getElementById('btnCheck');
  if (chk) chk.addEventListener('click', () => {
    if (!ui.pick.length) { toast('Označi bar jedan odgovor', false); return; }
    const right = z.odgovori.map((o, i) => o.tacan ? i : -1).filter(i => i >= 0);
    const wrongPicked = ui.pick.filter(i => !z.odgovori[i].tacan);
    const given = ui.pick.map(i => z.odgovori[i].tekst).join('; ');
    if (!wrongPicked.length && right.every(i => ui.pick.includes(i))) { succeed(z, given); return; }
    ui.wrong = ui.wrong.concat(wrongPicked); ui.pick = ui.pick.filter(i => z.odgovori[i].tacan);
    ui.why = wrongPicked.map(i => z.odgovori[i].zasto).filter(Boolean).join(' ') || null;
    fail(z, wrongPicked.length ? 'Neki od označenih nisu tačni' : 'Nedostaje još tačnih odgovora', given);
  });
  nextButton(z);
}

function renderTN(z, s) {
  const ui = s.ui, done = isDone(s), showAns = s.status === 'ok' || s.status === 'revealed';
  let inner = '<h2 class="q">Tačno ili netačno?</h2><p class="stmt">' + fmt(z.tvrdnja) + '</p><div class="tn">' +
    [[true, 'Tačno'], [false, 'Netačno']].map(([v, t]) => '<button type="button" data-v="' + v + '" class="' +
      ((showAns || ui.phase === 'fix') && v === z.tacno ? 'right' : (ui.tnWrong === v ? 'wrong' : '')) + '"' + (done || ui.phase === 'fix' || ui.tnWrong === v ? ' disabled' : '') + '>' + t + '</button>').join('') + '</div>';
  if (!z.tacno && (ui.phase === 'fix' || showAns)) {
    ui.wrong = ui.wrong || [];
    inner += '<p class="sub-q">Kako glasi tačno?</p><div class="opts">' + shuffled(z.ispravke, z.id + 'fix').map(([o, i]) =>
      '<button type="button" class="opt round fix' + (ui.wrong.includes(i) ? ' wrong' : '') + (showAns && o.tacan ? ' right' : '') + '" data-i="' + i + '"' +
      (done || ui.wrong.includes(i) ? ' disabled' : '') + '><span class="box"></span><span><span class="ot">' + fmt(o.tekst) + '</span>' + (ui.wrong.includes(i) && o.zasto && (helpOn() || done) ? '<span class="why">' + fmt(o.zasto) + '</span>' : '') + '</span></button>').join('') + '</div>';
  }
  main.innerHTML = frame(z, s, inner);
  main.querySelectorAll('.tn button').forEach(b => b.addEventListener('click', () => {
    const v = b.dataset.v === 'true';
    if (v !== z.tacno) {   // a binary guess: a wrong one on a true statement leaves nothing to find → revealed;
      ui.tnWrong = v;       // on a false one the pupil still has to find the correction
      if (z.tacno) st(z.id).miss = steps(z); else ui.phase = 'fix';
      fail(z, undefined, v ? 'Tačno' : 'Netačno'); return;
    }
    if (z.tacno) { succeed(z, 'Tačno'); return; }
    st(z.id).log.push({ v: 'Netačno', ok: true });
    ui.phase = 'fix'; save(); renderItem(false); toast('Tačno — sad je ispravi', true);
  }));
  main.querySelectorAll('.opt.fix').forEach(b => b.addEventListener('click', () => {
    const i = +b.dataset.i;
    if (z.ispravke[i].tacan) succeed(z, 'ispravka: ' + z.ispravke[i].tekst); else { ui.wrong.push(i); ui.why = z.ispravke[i].zasto || null; fail(z, undefined, 'ispravka: ' + z.ispravke[i].tekst); }
  }));
  nextButton(z);
}

function parseCloze(t) {   // → [text, {answers}, text, …]
  const parts = []; let last = 0;
  t.replace(/\{\{(.+?)\}\}/g, (m, inner, at) => { parts.push(t.slice(last, at)); parts.push({ answers: inner.split('|') }); last = at + m.length; return m; });
  parts.push(t.slice(last));
  return parts;
}
function renderCloze(z, s) {
  const ui = s.ui; ui.val = ui.val || {}; ui.lock = ui.lock || {};
  const parts = parseCloze(z.tekst), blanks = parts.filter(p => typeof p === 'object');
  const done = isDone(s), bank = z.ponudjene && z.ponudjene.length;
  if (ui.cur == null || ui.lock[ui.cur]) ui.cur = blanks.findIndex((_, i) => !ui.lock[i]);
  let bi = -1;
  const html = parts.map(p => {
    if (typeof p === 'string') return fmt(p);
    bi++;
    const val = done && !ui.lock[bi] ? p.answers[0] : (ui.val[bi] || '');
    const cls = 'blank' + (ui.lock[bi] ? ' lock' : '') + (done && !ui.lock[bi] ? ' rev' : '') + (!done && ui.bad && ui.bad.includes(bi) ? ' bad' : '') + (!done && !bank && false ? '' : '') + (!done && bi === ui.cur && bank ? ' cur' : '');
    return bank || done || ui.lock[bi] ? '<button type="button" class="' + cls + '" data-b="' + bi + '"' + (done || ui.lock[bi] ? ' disabled' : '') + '>' + (esc(val) || '&nbsp;') + '</button>'
      : '<input class="' + cls + '" data-b="' + bi + '" value="' + esc(val) + '" autocomplete="off" spellcheck="false">';
  }).join('');
  const used = Object.values(ui.val);
  main.innerHTML = frame(z, s, '<h2 class="q">' + fmt(z.pitanje || 'Dopuni rečenicu.') + '</h2><div class="cloze">' + html + '</div>' +
    (bank && !done ? '<div class="bank">' + z.ponudjene.map(w => '<button type="button"' + (used.includes(w) ? ' class="used"' : '') + ' data-w="' + esc(w) + '">' + esc(w) + '</button>').join('') + '</div>' : ''));
  if (!done) actions([['btnCheck', 'Proveri', 'ok']]);
  main.querySelectorAll('button.blank').forEach(b => b.addEventListener('click', () => { const i = +b.dataset.b; if (ui.val[i]) delete ui.val[i]; ui.cur = i; ui.bad = []; save(); renderItem(false); }));
  main.querySelectorAll('input.blank').forEach(inp => {
    inp.addEventListener('input', () => { ui.val[+inp.dataset.b] = inp.value; save(); });
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('btnCheck').click(); });
  });
  main.querySelectorAll('.bank button').forEach(b => b.addEventListener('click', () => {
    let i = ui.cur; if (i == null || i < 0 || ui.lock[i] || ui.val[i]) i = blanks.findIndex((_, k) => !ui.lock[k] && !ui.val[k]);
    if (i < 0) return;
    ui.val[i] = b.dataset.w; ui.bad = [];
    ui.cur = blanks.findIndex((_, k) => !ui.lock[k] && !ui.val[k]);
    save(); renderItem(false);
  }));
  const chk = document.getElementById('btnCheck');
  if (chk) chk.addEventListener('click', () => {
    const open = blanks.map((_, i) => i).filter(i => !ui.lock[i]);
    if (open.some(i => !norm(ui.val[i]))) { toast('Popuni sve praznine', false); return; }
    ui.bad = [];
    const given = open.map(i => ui.val[i]).join(' / ');
    for (const i of open) { if (blanks[i].answers.map(norm).includes(norm(ui.val[i]))) ui.lock[i] = true; else { ui.bad.push(i); delete ui.val[i]; } }
    if (!ui.bad.length) succeed(z, given); else fail(z, ui.bad.length === 1 ? 'Jedna praznina nije tačna' : 'Neke praznine nisu tačne', given);
  });
  nextButton(z);
}

function renderMatch(z, s) {
  const ui = s.ui; ui.done = ui.done || [];
  const done = isDone(s), right = shuffled(z.parovi.map(p => p[1]), z.id);
  const num = i => ui.done.indexOf(i) + 1;
  main.innerHTML = frame(z, s, '<h2 class="q">' + fmt(z.pitanje) + '</h2><div class="match"><div class="col">' +
    z.parovi.map((p, i) => { const m = ui.done.includes(i), rv = done && !m;
      return '<button type="button" class="mcell L' + (m ? ' done' : rv ? ' rev' : '') + (ui.left === i && !done ? ' cur' : '') + '" data-i="' + i + '"' + (m || done ? ' disabled' : '') + '>' +
        (m || rv ? '<span class="n">' + (m ? num(i) : '→') + '</span>' : '') + fmt(p[0]) + '</button>'; }).join('') +
    '</div><div class="col">' + right.map(([t, i]) => { const m = ui.done.includes(i), rv = done && !m;
      return '<button type="button" class="mcell R' + (m ? ' done' : rv ? ' rev' : '') + '" data-i="' + i + '"' + (m || done ? ' disabled' : '') + '>' +
        (m ? '<span class="n">' + num(i) + '</span>' : rv ? '<span class="n">←</span>' : '') + fmt(t) + (rv ? ' <small>(' + esc(z.parovi[i][0]) + ')</small>' : '') + '</button>'; }).join('') + '</div></div>');
  main.querySelectorAll('.mcell.L').forEach(b => b.addEventListener('click', () => { ui.left = +b.dataset.i; save(); renderItem(false); }));
  main.querySelectorAll('.mcell.R').forEach(b => b.addEventListener('click', () => {
    if (ui.left == null) { toast('Prvo klikni pojam levo', false); return; }
    const i = +b.dataset.i, pair = z.parovi[ui.left][0] + ' → ' + z.parovi[i][1];
    if (i === ui.left) { ui.done.push(i); ui.left = null; if (ui.done.length === z.parovi.length) succeed(z, pair); else { st(z.id).log.push({ v: pair, ok: true }); save(); renderItem(false); } }
    else { b.classList.add('bad'); ui.left = null; setTimeout(() => fail(z, 'Nisu par', pair), 280); }
  }));
  nextButton(z);
}

// ---------- history: datum, poredjaj, uporedi, objasni ----------
// `oznaka` = how the book dates an event it gives no years for ("kraj XVIII veka"): shown instead of the
// (approximate) years, which only place it on the axis.
const fmtY = y => y < 0 ? -y + ' pre n. e.' : String(y);   // years before the common era are negative in the data
const yrSpan = (a, b) => b == null ? fmtY(a) : a < 0 && b < 0 ? -a + '–' + fmtY(b) : fmtY(a) + '–' + fmtY(b);
const yrs = z => z.oznaka ? z.oznaka : z.godina != null ? fmtY(z.godina) : yrSpan(z.od, z.do);
function renderDate(z, s) {   // one year (`godina`) or a range (`od`, `do`), ± `tolerancija` years
  const ui = s.ui, done = isDone(s), range = z.godina == null && z.do != null, tol = z.tolerancija || 0;
  ui.v = ui.v || {};
  const want = range ? { od: z.od, do: z.do } : { od: z.godina != null ? z.godina : z.od };
  const bce = Object.values(want).some(y => y < 0);   // the era is then part of the answer: chosen per field
  ui.era = ui.era || {};
  const eraOf = k => done && s.status !== 'failed' ? (want[k] < 0 ? 'pre' : 'ne') : (ui.era[k] || 'pre');
  const field = (k, ph) => '<input inputmode="numeric" data-k="' + k + '" placeholder="' + ph + '" value="' + esc(done && s.status !== 'failed' ? Math.abs(want[k]) : (ui.v[k] || '')) + '"' +
    (done ? ' disabled' : '') + (ui.bad && ui.bad.includes(k) ? ' class="bad"' : '') + '>' +
    (bce ? '<select data-era="' + k + '" aria-label="Era"' + (done ? ' disabled' : '') + '><option value="pre"' + (eraOf(k) === 'pre' ? ' selected' : '') + '>pre n. e.</option><option value="ne"' + (eraOf(k) === 'ne' ? ' selected' : '') + '>n. e.</option></select>' : '');
  const val = k => bce && (ui.era[k] || 'pre') === 'pre' ? -ui.v[k] : +ui.v[k];
  main.innerHTML = frame(z, s, '<h2 class="q">' + fmt(z.pitanje || 'Kada?') + '</h2><p class="ev">' + fmt(z.dogadjaj) + '</p>' +
    '<div class="dt">' + (range ? field('od', 'od') + '<span>–</span>' + field('do', 'do') : field('od', 'godina')) + '</div>');
  if (!done) actions([['btnCheck', 'Proveri', 'ok']]);
  main.querySelectorAll('.dt select').forEach(sel => sel.addEventListener('change', () => { ui.era[sel.dataset.era] = sel.value; save(); }));
  main.querySelectorAll('.dt input').forEach(inp => {
    inp.addEventListener('input', () => { ui.v[inp.dataset.k] = inp.value.replace(/[^0-9]/g, ''); save(); });
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('btnCheck').click(); });
  });
  const chk = document.getElementById('btnCheck');
  if (chk) chk.addEventListener('click', () => {
    const ks = Object.keys(want);
    if (ks.some(k => !ui.v[k])) { toast('Upiši godinu', false); return; }
    const given = ks.map(k => fmtY(val(k))).join('–');
    ui.bad = ks.filter(k => Math.abs(val(k) - want[k]) > tol);
    if (!ui.bad.length) { succeed(z, given); return; }
    const k = ui.bad[0], d = val(k) - want[k];
    let msg = 'Netačno';
    if (helpOn()) msg = (range ? (k === 'od' ? 'Početak: ' : 'Kraj: ') : '') + (d < 0 ? 'kasnije' : 'ranije') + (Math.abs(d) <= 10 ? ' — blizu si (do 10 godina)' : Math.abs(d) <= 50 ? ' (manje od 50 godina)' : ' — pogrešan vek?');
    ui.why = helpOn() ? 'Tvoj odgovor ' + given + ': ' + msg + '.' : null;
    fail(z, msg, given);
  });
  nextButton(z);
}
function renderOrder(z, s) {   // stavke are authored in the right order; the pupil fills slots 1…n
  const ui = s.ui, n = z.stavke.length, done = isDone(s);
  ui.seq = ui.seq || Array(n).fill(null); ui.lock = ui.lock || {};
  const pool = shuffled(z.stavke, z.id).filter(([, i]) => !ui.seq.includes(i));
  const slots = z.stavke.map((_, p) => {
    const i = done && !ui.lock[p] ? p : ui.seq[p], it = i != null ? z.stavke[i] : null;
    const cls = ui.lock[p] ? 'lock' : done ? 'rev' : it ? 'fill' : '';
    return '<button type="button" class="slot ' + cls + '" data-p="' + p + '"' + (done || ui.lock[p] ? ' disabled' : '') + '><span class="n">' + (p + 1) + '.</span><span>' + (it ? fmt(it.tekst) : '&nbsp;') + '</span>' +
      (done && it && (it.godina != null) ? '<span class="yr">' + yrs({ godina: it.godina, od: it.godina, do: it.do }) + '</span>' : '') + '</button>';
  }).join('');
  main.innerHTML = frame(z, s, '<h2 class="q">' + fmt(z.pitanje || 'Poređaj hronološki, od najranijeg do najkasnijeg.') + '</h2><div class="ord"><div class="col"><h4>Redosled</h4>' + slots + '</div>' +
    (done ? '' : '<div class="col pool"><h4>Događaji</h4>' + (pool.map(([it, i]) => '<button type="button" class="slot fill" data-i="' + i + '"><span>' + fmt(it.tekst) + '</span></button>').join('') || '<p class="placeholder">Sve je raspoređeno — Proveri.</p>') + '</div>') + '</div>');
  if (!done) actions([['btnCheck', 'Proveri', 'ok']]);
  main.querySelectorAll('.pool [data-i]').forEach(b => b.addEventListener('click', () => { const p = ui.seq.indexOf(null); if (p >= 0) { ui.seq[p] = +b.dataset.i; save(); renderItem(false); } }));
  main.querySelectorAll('.ord .slot[data-p]').forEach(b => b.addEventListener('click', () => { const p = +b.dataset.p; if (ui.seq[p] != null && !ui.lock[p]) { ui.seq[p] = null; save(); renderItem(false); } }));
  const chk = document.getElementById('btnCheck');
  if (chk) chk.addEventListener('click', () => {
    if (ui.seq.includes(null)) { toast('Rasporedi sve događaje', false); return; }
    const given = ui.seq.map(i => z.stavke[i].tekst).join(' → ');
    let bad = 0;
    ui.seq.forEach((i, p) => { if (i === p) ui.lock[p] = true; else { bad++; ui.seq[p] = null; } });
    if (!bad) succeed(z, given); else fail(z, bad === 1 ? 'Jedan događaj nije na svom mestu' : bad + ' događaja nisu na svom mestu', given);
  });
  nextButton(z);
}
const cmpShort = z => z.a.length <= 14 && z.b.length <= 14;   // short names fit on the buttons; long ones → A / B + legend
function renderCompare(z, s) {   // tvrdnje → a | b | oba | nijedan
  const ui = s.ui, done = isDone(s); ui.ans = ui.ans || {}; ui.lock = ui.lock || {}; ui.bad = ui.bad || [];
  const short = cmpShort(z), L = { a: short ? z.a : 'A', b: short ? z.b : 'B', oba: 'Oba', nijedan: 'Nijedan' };
  const rows = z.tvrdnje.map((t, i) => {
    const lock = ui.lock[i], showAns = lock || (done && s.status !== 'failed');
    return '<tr class="' + (lock ? 'lock' : ui.bad.includes(i) ? 'bad' : '') + '"><td>' + fmt(t.tekst) + (ui.bad.includes(i) && helpOn() && t.zasto ? '<span class="why">' + fmt(t.zasto) + '</span>' : '') + '</td><td class="bt">' +
      Object.keys(L).map(k => '<button type="button" class="cb' + (showAns && t.odgovor === k ? ' right' : (!showAns && ui.ans[i] === k ? ' on' : '')) + '" data-i="' + i + '" data-k="' + k + '"' + (done || lock ? ' disabled' : '') + '>' + esc(L[k]) + '</button>').join('') + '</td></tr>';
  }).join('');
  main.innerHTML = frame(z, s, '<h2 class="q">' + fmt(z.pitanje || ('Na koga se odnosi: ' + z.a + ' ili ' + z.b + '?')) + '</h2>' +
    (short ? '' : '<p class="cmp-key"><b>A</b> = ' + fmt(z.a) + '<br><b>B</b> = ' + fmt(z.b) + '</p>') + '<table class="cmp"><tbody>' + rows + '</tbody></table>');
  if (!done) actions([['btnCheck', 'Proveri', 'ok']]);

const P = MAPI.proj;
const toLonLat = (x, y) => [P.lon0 + x / P.sx, P.lat1 - y / P.sy];
const toXY = (lon, lat) => [(lon - P.lon0) * P.sx, (P.lat1 - lat) * P.sy];

  const h = Math.sin(dLa / 2) ** 2 + Math.cos(a[1] * r) * Math.cos(b[1] * r) * Math.sin(dLo / 2) ** 2; return 12742 * Math.asin(Math.sqrt(h)); }
function targetLonLat(c) {
  if (c.mesto) { const m = MAPI.mesta[c.mesto]; return [m.lon, m.lat]; }
  return null;
}
function mountMap(z, s, onClick) {
  const wrap = document.getElementById('mapwrap');
  wrap.innerHTML = document.getElementById('mapTpl').innerHTML + '<div class="zbar"><button type="button" data-z="1.5">+</button><button type="button" data-z="0.667">−</button><button type="button" data-z="0">⟳</button></div><div class="zhint">Točkić / +− za zum · prevuci za pomeranje</div>';
  const svg = wrap.querySelector('svg'), marks = svg.querySelector('.marks');
  let vb = s.ui.vb || [0, 0, P.w, P.h];
  const setVB = () => { svg.setAttribute('viewBox', vb.join(' ')); s.ui.vb = vb; };
  setVB();
  function zoom(f, cx, cy) {
    if (!f) { vb = [0, 0, P.w, P.h]; setVB(); return; }
    const nw = Math.min(P.w, Math.max(P.w / 14, vb[2] / f)), nh = nw * P.h / P.w;
    cx = cx == null ? vb[0] + vb[2] / 2 : cx; cy = cy == null ? vb[1] + vb[3] / 2 : cy;
    const rx = (cx - vb[0]) / vb[2], ry = (cy - vb[1]) / vb[3];
    vb = [cx - rx * nw, cy - ry * nh, nw, nh]; clamp(); setVB();

  function clamp() { vb[0] = Math.min(Math.max(vb[0], 0), P.w - vb[2]); vb[1] = Math.min(Math.max(vb[1], 0), P.h - vb[3]); }
  const svgPt = e => { const p = svg.createSVGPoint(); p.x = e.clientX; p.y = e.clientY; return p.matrixTransform(svg.getScreenCTM().inverse()); };
  wrap.querySelectorAll('.zbar button').forEach(b => b.addEventListener('click', () => zoom(+b.dataset.z)));
  svg.addEventListener('wheel', e => { e.preventDefault(); const p = svgPt(e); zoom(e.deltaY < 0 ? 1.25 : 0.8, p.x, p.y); }, { passive: false });
  let down = null;
  svg.addEventListener('pointerdown', e => { down = { x: e.clientX, y: e.clientY, vb: vb.slice(), moved: false, target: e.target }; svg.setPointerCapture(e.pointerId); });
  svg.addEventListener('pointermove', e => {
    if (!down) return;

    if (!down.moved && Math.hypot(dx, dy) < 5) return;
    down.moved = true; svg.classList.add('drag');
    const k = vb[2] / svg.getBoundingClientRect().width;
    vb = [down.vb[0] - dx * k, down.vb[1] - dy * k, vb[2], vb[3]]; clamp(); setVB();
  });
  svg.addEventListener('pointerup', e => {
    const d = down; down = null; svg.classList.remove('drag');
    if (!d || d.moved) { save(); return; }
    const p = svgPt(e), hit = d.target.closest && d.target.closest('path.c');
    onClick({ x: p.x, y: p.y, iso: hit ? hit.dataset.iso : null, el: hit });
  });

    mark(x, y, color, label) { const r = vb[2] / 150; marks.insertAdjacentHTML('beforeend', '<g class="mk"><circle cx="' + x + '" cy="' + y + '" r="' + r + '" fill="' + color + '"/>' + (label ? '<text x="' + (x + r * 1.4) + '" y="' + (y + r * .5) + '" fill="' + color + '" style="font-size:' + (vb[2] / 70) + 'px">' + esc(label) + '</text>' : '') + '</g>'); },
    country(iso, cls) { svg.querySelectorAll('path[data-iso="' + iso + '"]').forEach(p => p.classList.add(cls)); } };
}
function renderMapItem(z, s) {

  if (z.vrsta === 'lanac') return z.karike.map((k, i) => i === z.praznina ? '?' : k).join(' → ');
  if (z.vrsta === 'izvor') return (z.izvor.autor ? z.izvor.autor + ': ' : '') + '„' + z.izvor.tekst + '” — ' + z.pitanje;
  if (z.vrsta === 'uporedi') return rowLabel(z) + ' — ' + z.tvrdnje.map(t => t.tekst).join(' / ');
  return z.pitanje || rowLabel(z);
}
function correctText(z) {
  if (['izbor', 'zakljuci', 'lanac', 'izvor', 'ko_sam'].includes(z.vrsta)) return z.odgovori.filter(o => o.tacan).map(o => o.tekst).join('; ');
  if (z.vrsta === 'datum') return yrs(z);
  if (z.vrsta === 'poredjaj') return z.stavke.map(s => s.tekst + (s.godina != null ? ' (' + (s.oznaka || fmtY(s.godina)) + ')' : '')).join(' → ');
  if (z.vrsta === 'uporedi') { const L = { a: z.a, b: z.b, oba: 'oba', nijedan: 'nijedan' }; return z.tvrdnje.map((t, i) => (i + 1) + ': ' + L[t.odgovor]).join('; '); }
  if (z.vrsta === 'objasni') return z.uzor;
  if (z.vrsta === 'tacno_netacno') return z.tacno ? 'Tačno' : 'Netačno — ' + z.ispravke.find(o => o.tacan).tekst;
  if (z.vrsta === 'dopuni') return z.tekst.replace(/\{\{(.+?)\}\}/g, (m, x) => x.split('|')[0]);
  if (z.vrsta === 'povezi') return z.parovi.map(p => p[0] + ' → ' + p[1]).join('; ');
  return z.cilj.drzava ? MAPI.drzave[z.cilj.drzava] : (MAPI.mesta[z.cilj.mesto] || {}).naziv || z.cilj.mesto;
}
const outcome = s => !s || s.status === 'open' ? 'nije rađeno' : s.status === 'ok' ? 'tačno, ' + s.pts + ' b' : '0 b';
function renderReview(t) {
  if (!t) { renderStart(); return; }
  const rows = t.items.map((z, i) => {
    const s = t.b[z.id], f = t.fix[z.id];
    const log = (s && s.log || []).map(l => '<li class="' + (l.ok ? 'ok' : 'bad') + '">' + (l.ok ? '✓ ' : '✗ ') + esc(l.v || '—') + '</li>').join('');
    return '<div class="rv"><div class="ihead"><span class="vchip">' + VRSTA_LBL[z.vrsta] + '</span>' + tzBadge(z) + '<span>' + (i + 1) + '. ' + esc(deoNaslov(z)) + '</span><span>' + outcome(s) + (f ? ' · ispravka: ' + outcome(f) : '') + '</span></div>' +
      '<p class="rq">' + fmt(questionText(z)) + '</p><p class="rl">Odgovori učenika:</p><ul class="rlog">' + (log || '<li>—</li>') + '</ul>' +
      '<p class="rc"><b>Tačan odgovor:</b> ' + fmt(correctText(z)) + '</p></div>';
  }).join('');
  main.innerHTML = '<div class="sum"><h1>Pregled rada</h1><p class="sub">' + fmtDate(t.start) + (t.ime ? ' · ' + esc(t.ime) : '') + ' · <b>' + t.score + ' / ' + t.max + '</b> bodova' +
    (Object.keys(t.fix).length ? ' · ispravka ' + testScore(t, 'fix') : '') + '</p><div class="iactions"><button type="button" id="btnCsv">Preuzmi (CSV)</button><button type="button" id="btnBack">Moji testovi</button></div>' + rows + '</div>';
  document.getElementById('btnCsv').addEventListener('click', () => downloadCsv([t]));
  document.getElementById('btnBack').addEventListener('click', () => { if (!att()) go('_start'); else go('_sum'); });
}
function downloadCsv(tests) {   // one row per item of each test: for the teacher (opens in Excel / Sheets)
  const q = v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
  const head = ['test', 'datum', 'ime', 'br', 'deo', 'vrsta', 'tezina', 'pitanje', 'odgovori_ucenika', 'tacan_odgovor', 'bodovi', 'ispravka_bodovi'];
  const lines = [head.join(',')];
  for (const t of tests) t.items.forEach((z, i) => {
    const s = t.b[z.id] || {}, f = t.fix[z.id];
    lines.push([t.id, fmtDate(t.start), t.ime, i + 1, deoNaslov(z), VRSTA_LBL[z.vrsta], TEZ_LBL[z.tezina], questionText(z),
      (s.log || []).map(l => (l.ok ? '✓ ' : '✗ ') + l.v).join(' | '), correctText(z), s.pts == null ? '' : s.pts, f && f.pts != null ? f.pts : ''].map(q).join(','));
  });
  const blob = new Blob(['﻿' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'test-' + (SPEC.slug || 'kviz') + '-' + (tests.length === 1 ? tests[0].id : 'svi') + '.csv';
  document.body.appendChild(a); a.click(); a.remove();
}
function go(id) { state.cur = id; save(); HubShell.setNav(false); if (!drawer.dataset.intro) closeDrawer(); refresh(); main.scrollTop = 0; }
function goNext() {
  const ids = listIds(), i = ids.indexOf(state.cur);
  const next = ids.slice(i + 1).concat(ids.slice(0, i)).find(id => !isDone(st(id)));
  go(next || '_sum');
}
function refresh() { renderNav(); refreshScore(); renderItem(false); }

// ---------- bar ----------
document.querySelectorAll('.ms-btn').forEach(b => b.addEventListener('click', () => {
  const m = b.dataset.mode;
  if (m === state.mode) return;
  state.mode = m;
  state.cur = m === 'test' && !att() ? '_start' : (listIds().find(id => !isDone(st(id))) || '_sum');
  closeDrawer(); save(); refresh();
}));
document.getElementById('mReset').addEventListener('click', () => {
  if (state.mode === 'ucenje') {
    if (!confirm('Počni učenje ispočetka — novi izbor zadataka?')) return;
    newLearning();
  } else {
    const a = att(); if (!a || a.end || !confirm('Odustati od ovog testa? Neće biti zabeležen.')) return;
    state.tests = state.tests.filter(t => t.id !== a.id); state.active = null; state.cur = '_start';
  }
  save(); refresh();
});
document.getElementById('mRepeat').addEventListener('click', () => {
  const rev = state.ucenje.items.filter(z => (state.ucenje.b[z.id] || {}).status === 'revealed').map(z => z.id);
  rev.forEach(id => { delete state.ucenje.b[id]; });
  if (rev.length) { state.cur = rev[0]; save(); refresh(); }
});

// ---------- init ----------
if (!state.ucenje) newLearning();
if (!byId(state.cur) && !['_sum', '_start', '_znanje', '_osa'].includes(state.cur) && !String(state.cur).startsWith('r:') && !lekRoute()) state.cur = state.mode === 'test' ? '_start' : state.ucenje.items[0].id;
refresh();
let introSeen = false; try { introSeen = localStorage.getItem(STATE_KEY + ':intro') === '1'; } catch (e) {}
if (!introSeen) showIntro();
</script>
