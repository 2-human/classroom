<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Istorijski izvori za izučavanje perioda 1780–1918. — kviz</title>
<style>

 :root{--hub-bg:#faf8f2;--hub-card:#fff;--hub-ink:#2b2b2b;--hub-head:#3a3528;--hub-mute:#6b6456;--hub-line:#e6e0d2;--hub-soft:#f3ecd8;--hub-accent:#b1271f;--hub-ok:#1f7a3a;--hub-nav-w:280px;--hub-drawer-w:440px}
 html:has(.app-body){overflow:hidden}
 .app-body{margin:0;height:100vh;height:100dvh;overflow:hidden;display:flex;flex-direction:column;max-width:100vw;background:var(--hub-bg);color:var(--hub-ink);font-family:system-ui,Segoe UI,Roboto,Arial,sans-serif}
 .app-bar{flex:0 0 auto;display:flex;align-items:center;gap:14px;padding:8px 16px;background:var(--hub-card);border-bottom:1px solid var(--hub-line);min-width:0;position:relative;z-index:50}
 .app-bar .app-menu{display:none;padding:0;width:36px;height:34px;font-size:18px;line-height:1;border:1px solid var(--hub-line);background:var(--hub-card);color:var(--hub-head);border-radius:7px;cursor:pointer}
 .app-bar .app-menu:hover{background:var(--hub-soft);color:var(--hub-head)}
 .brand{font-weight:700;font-size:15px;color:var(--hub-head);text-decoration:none;white-space:nowrap}
 .brand:hover{color:var(--hub-accent)}
 .app-crumbs{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--hub-mute);min-width:0;overflow:hidden;white-space:nowrap}
 .app-crumbs a{color:var(--hub-mute);text-decoration:none}
 .app-crumbs a:hover{color:var(--hub-accent)}
 .app-crumbs .sep{color:#b9b2a0}
 .app-crumbs .cur{color:var(--hub-head);font-weight:600;overflow:hidden;text-overflow:ellipsis}
 .bar-right{margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end;min-width:0}
 .app-grid{flex:1 1 auto;display:grid;grid-template-columns:var(--hub-nav-w) minmax(0,1fr);min-height:0}
 .app-nav{background:var(--hub-card);border-right:1px solid var(--hub-line);overflow:auto;padding:10px 10px 40px;min-height:0}
 .app-filter{width:100%;font:inherit;font-size:13px;padding:7px 9px;border:1px solid var(--hub-line);border-radius:6px;margin:0 0 4px;background:#fff;color:var(--hub-ink)}
 .app-filter:focus{outline:none;border-color:var(--hub-mute)}
 .app-nav .sec{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--hub-mute);padding:12px 6px 4px}
 .app-nav .cnt{font-size:11px;color:var(--hub-mute);font-variant-numeric:tabular-nums;letter-spacing:0;text-transform:none}
 .f-hide{display:none!important}
 .app-main{position:relative;overflow:auto;min-width:0;min-height:0;transition:margin-right .18s ease}
 .app-drawer{position:fixed;top:var(--htop,50px);right:0;bottom:0;width:var(--hub-drawer-w);max-width:100vw;background:var(--hub-card);border-left:1px solid var(--hub-line);box-shadow:-8px 0 24px rgba(58,53,40,.10);transform:translateX(105%);transition:transform .18s ease;z-index:60;display:flex;flex-direction:column}
 .app-drawer.open{transform:none}
 .drawer-head{display:flex;align-items:flex-start;gap:10px;padding:14px 16px 10px;border-bottom:1px solid var(--hub-line)}
 .drawer-head h2{margin:0;font-size:16px;color:var(--hub-head);flex:1 1 auto;overflow-wrap:anywhere}
 .app-drawer .drawer-close{border:0;background:none;padding:0 4px;font-size:24px;line-height:1;cursor:pointer;color:var(--hub-mute)}
 .app-drawer .drawer-close:hover{background:none;color:var(--hub-accent)}
 .drawer-body{flex:1 1 auto;overflow:auto;padding:12px 16px 24px;font-size:13px;line-height:1.55}
 .drawer-foot{flex:0 0 auto;border-top:1px solid var(--hub-line);padding:10px 16px;font-size:12px;color:var(--hub-mute)}
 .mtabs{display:flex;gap:2px;border-bottom:1px solid var(--hub-line);flex-wrap:wrap;background:var(--hub-card);padding:0 12px}
 .mtabs a{text-decoration:none;color:var(--hub-mute);font-size:13px;padding:9px 12px 8px;border-bottom:2px solid transparent}
 .mtabs a[aria-current="page"]{color:var(--hub-head);border-bottom-color:var(--hub-accent);font-weight:600}
 .bar-menu-wrap{position:relative}
 .bar-menu{display:none;position:absolute;right:0;top:calc(100% + 8px);z-index:70;background:var(--hub-card);border:1px solid var(--hub-line);border-radius:10px;box-shadow:0 6px 20px rgba(0,0,0,.16);padding:8px;min-width:240px}
 .bar-menu.open{display:flex;flex-direction:column;align-items:stretch;gap:6px}
 .tbl{width:100%;border-collapse:collapse;background:var(--hub-card);border:1px solid var(--hub-line);border-radius:6px;font-size:13px}
 .tbl th{text-align:left;font-weight:600;font-size:11.5px;color:var(--hub-mute);padding:8px 10px;border-bottom:1px solid var(--hub-line);background:#fcfaf4;white-space:nowrap}
 .tbl td{padding:7px 10px;border-bottom:1px solid #f0ebe0;vertical-align:top}
 .tbl td.num,.tbl th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
 .tbl tr.clk{cursor:pointer} .tbl tr.clk:hover td{background:#fbf7ec}
 @media (min-width:1200px){ .app-body:has(.app-drawer.open) .app-main{margin-right:var(--hub-drawer-w)} }
 @media (max-width:760px){
   .app-bar{gap:10px;padding:8px 12px}
   .app-bar .app-menu{display:inline-block}
   .app-crumbs{display:none}
   .app-grid{grid-template-columns:minmax(0,1fr)}
   .app-nav{position:fixed;top:var(--htop,50px);left:0;bottom:0;width:300px;max-width:88vw;z-index:55;transform:translateX(-105%);transition:transform .18s ease;box-shadow:8px 0 24px rgba(58,53,40,.10)}
   .app-nav.open{transform:none}
   .app-drawer{width:100vw}
 }
 @media print{
   html:has(.app-body){overflow:visible}
   .app-body{height:auto;overflow:visible;display:block}
   .app-grid{display:block}
   .app-main,.app-nav{overflow:visible}
   .app-drawer,.app-filter,.app-menu,.bar-menu-wrap,.mtabs{display:none!important}
 }

 .les{max-width:860px;padding:22px 28px 80px;line-height:1.6;color:#2b2b2b}
 .les h1{font-size:25px;margin:0 0 4px;color:#3a3528}
 .les .meta{color:#6b6456;font-size:13.5px;margin:0 0 6px}
 .les .meta a{color:#b1271f;text-decoration:none}
 .les section{margin:22px 0;scroll-margin-top:12px}
 .les h2{font-size:18px;color:#3a3528;margin:0 0 8px;padding-bottom:5px;border-bottom:1px solid #e6e0d2}
 .les h3{font-size:15.5px;color:#3a3528;margin:0 0 6px}
 .les section.l3{margin-left:14px;padding-left:12px;border-left:3px solid #f3ecd8}
 .les .str{font-size:12px;font-weight:400;color:#6b6456;margin-left:6px;white-space:nowrap}
 .les ul,.les ol{padding-left:22px;margin:6px 0} .les li{margin:3px 0}
 .les p{margin:6px 0}
 .les a{color:#b1271f}
 .les .pojam{border-bottom:1px dotted #b9b2a0}
 .les blockquote{margin:8px 0;padding:6px 14px;border-left:3px solid #c98a2c;background:#fefcf7}
 .les .tbl{overflow-x:auto} .les table{border-collapse:collapse;font-size:14px;margin:8px 0}
 .les th,.les td{border:1px solid #e6e0d2;padding:4px 8px;text-align:left;vertical-align:top} .les th{background:#f3ecd8}
 .strana{margin:26px 0 14px;scroll-margin-top:12px;background:#fff;border:1px solid #e6e0d2;border-radius:10px;overflow:hidden}
 .strana .pg{display:flex;justify-content:space-between;align-items:center;padding:7px 12px;font-size:12.5px;color:#6b6456;background:#fbf7ec;border-bottom:1px solid #e6e0d2}
 .strana .pg b{color:#3a3528}
 .strana .pg button{font:inherit;font-size:12px;border:1px solid #e6e0d2;background:#fff;border-radius:6px;padding:2px 9px;cursor:pointer;color:#3a3528}
 .strana img{display:block;width:100%;height:auto;cursor:zoom-in}
 .strana.zoom{overflow-x:auto} .strana.zoom img{width:auto;max-width:none;cursor:zoom-out}
 .strana.nema{padding:12px;color:#9b9387;font-size:13.5px;background:#fefcf7}
 .notes-lbl{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:#1f7a3a;margin:0 0 -12px}
 .gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin-top:8px}
 .gal figure{margin:0;background:#fff;border:1px solid #e6e0d2;border-radius:8px;overflow:hidden;scroll-margin-top:12px}
 .gal img{display:block;width:100%;height:auto} .gal figcaption{font-size:12.5px;color:#6b6456;padding:6px 9px}
 .hit{animation:hit 2.4s ease-out} @keyframes hit{0%{box-shadow:0 0 0 4px rgba(201,138,44,.55)}100%{box-shadow:0 0 0 4px rgba(201,138,44,0)}}

 :root{--ink:#2b2b2b;--muted:#6b6456;--edge:#b1271f;--accent:#1f7a3a;--border:#e6e0d2;--soft:#fefcf7;--warn:#c98a2c;
       --sea:#cfe6f2;--land:#efeae0;--land-se:#f3ecd8;--bord:#8a8170}
 *{box-sizing:border-box}
 button{font:inherit;padding:7px 14px;border:1px solid var(--edge);background:#fff;color:var(--edge);border-radius:8px;cursor:pointer}
 button:hover{background:var(--edge);color:#fff}
 button.ok{border-color:var(--accent);color:var(--accent)} button.ok:hover{background:var(--accent);color:#fff}
 button:disabled{opacity:.45;cursor:default;background:#fff;color:inherit}
 .opt:disabled,.tn button:disabled,.mcell:disabled,.blank:disabled{opacity:1;cursor:default}
 .opt:disabled:not(.right):not(.wrong){opacity:.6}
 .bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-size:14px}
 .bar-menu-btn{padding:5px 12px;font-size:16px;line-height:1;border-color:var(--muted);color:#3a3528}
 .bar-menu-btn:hover{background:#f3ecd8;color:#3a3528}
 .bar-menu button{width:100%;text-align:left}
 .bar-menu .menu-link{display:block;font-size:13px;color:var(--edge);text-decoration:none;padding:7px 14px;border:1px dashed #e6b0b0;border-radius:8px}
 .mode-switch{display:inline-flex}
 .ms-btn{padding:5px 12px;border-color:#6b6456;color:#3a3528;min-width:5.5em}
 .ms-btn:first-child{border-radius:8px 0 0 8px} .ms-btn:last-child{border-radius:0 8px 8px 0;border-left:none}
 .ms-btn:hover{background:#f3ecd8;color:#3a3528}
 .ms-btn.active{background:#3a3528;color:#fff;border-color:#3a3528}
 .stat{background:#f3ecd8;border:1px solid #e1d8c2;border-radius:8px;padding:4px 10px;white-space:nowrap}
 .stat b{font-size:15px;color:var(--accent)}
 .intro p{font-size:14px;color:#4a4434;line-height:1.6;margin:0 0 10px}
 .intro ul{margin:0 0 10px;padding-left:18px;font-size:13.5px;line-height:1.55}
 /* navigation: items */
 .it-row{display:flex;align-items:center;gap:8px;width:100%;border:0;border-radius:5px;background:none;color:var(--ink);font:inherit;font-size:13px;text-align:left;padding:5px 6px;cursor:pointer}
 .it-row:hover{background:#f6f1e4;color:var(--ink)}
 .it-row.sel{background:#efe7d2;font-weight:600}
 .it-row.off{opacity:.4}
 .it-row .st{flex:0 0 16px;text-align:center;color:#b9b2a0}
 .it-row.ok .st{color:var(--accent)} .it-row.rev .st,.it-row.fail .st{color:var(--edge)} .it-row.part .st{color:var(--warn)}
 .it-row .lbl{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
 .it-row .pt{flex:0 0 auto;font-size:11px;color:var(--muted);font-weight:400;font-variant-numeric:tabular-nums}
 .tz{flex:0 0 auto;display:inline-block;min-width:1.5em;text-align:center;font-size:10px;font-weight:700;border-radius:8px;padding:1px 5px;letter-spacing:.02em}
 .tz-lako{background:#e3f2e8;color:#1f6b3a} .tz-srednje{background:#fbefd5;color:#8a5a14} .tz-tesko{background:#f8dcd8;color:#8a2a22}
 .tz-legend{display:flex;gap:8px;flex-wrap:wrap;font-size:11px;color:var(--muted);padding:2px 6px 0}
 /* main: item */
 .item{padding:20px 24px 40px;max-width:1100px}
 .ihead{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-bottom:8px}
 .vchip{font-size:11px;text-transform:uppercase;letter-spacing:.05em;border:1px solid var(--border);border-radius:9px;padding:1px 8px;background:#fff}
 .item h2.q{font-size:18px;line-height:1.4;color:#3a3528;margin:0 0 14px}
 .opts{display:flex;flex-direction:column;gap:8px;max-width:640px}
 .opt{display:flex;gap:10px;align-items:flex-start;text-align:left;border:1px solid var(--border);background:#fff;color:var(--ink);border-radius:8px;padding:10px 12px;font-size:14.5px;line-height:1.4}
 .opt:hover{background:#fbf7ec;color:var(--ink)}
 .opt.picked{border-color:#3a3528;background:#f6f1e4}
 .opt.wrong{border-color:#e6b0b0;background:#fdecec;color:#8a2a22} .opt.wrong .ot{text-decoration:line-through}
 .opt.right{border-color:#9fd5b6;background:#e8f5ec;color:#13602c;font-weight:600}
 .opt .box{flex:0 0 18px;height:18px;border:1.5px solid #6b6456;border-radius:4px;margin-top:1px}
 .opt.picked .box{background:#3a3528;box-shadow:inset 0 0 0 3px #fff}
 .opt.round .box{border-radius:50%}
 .tn{display:flex;gap:12px;margin:4px 0 14px}
 .tn button{min-width:8em;padding:10px 18px;font-size:15px}
 .tn button.right{background:var(--accent);border-color:var(--accent);color:#fff}
 .tn button.wrong{background:#fdecec;border-color:#e6b0b0;color:#8a2a22}
 .stmt{font-size:16px;line-height:1.5;border-left:3px solid #e1d8c2;padding:6px 12px;margin:0 0 14px;background:#fff}
 .sub-q{font-weight:600;color:#3a3528;margin:16px 0 8px}
 .cloze{font-size:16px;line-height:2.3;max-width:720px}
 .blank{display:inline-block;min-width:5.5em;border:0;border-bottom:2px solid #6b6456;background:#fff;text-align:center;font:inherit;font-weight:600;color:#3a3528;padding:0 6px;margin:0 3px;border-radius:4px 4px 0 0;cursor:pointer}
 input.blank{cursor:text;width:7em}
 .blank:hover{background:#fbf7ec;color:#3a3528}
 .blank.cur{border-bottom-color:var(--edge);background:#fff7f3}
 .blank.lock{border-bottom-color:var(--accent);background:#e8f5ec;color:#13602c;cursor:default}
 .blank.bad{border-bottom-color:var(--edge);background:#fdecec;color:#8a2a22}
 .blank.rev{border-bottom-color:var(--warn);background:#fdf3e2;color:#8a5a14}
 .bank{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 0}
 .bank button{padding:5px 12px;border-color:#6b6456;color:#3a3528;border-radius:16px}
 .bank button:hover{background:#f3ecd8;color:#3a3528}
 .bank button.used{opacity:.3;pointer-events:none}
 .match{display:grid;grid-template-columns:1fr 1fr;gap:10px 28px;max-width:720px}
 .match .col{display:flex;flex-direction:column;gap:8px}
 .mcell{text-align:left;border:1px solid var(--border);background:#fff;color:var(--ink);border-radius:8px;padding:9px 12px;font-size:14px}
 .mcell:hover{background:#fbf7ec;color:var(--ink)}
 .mcell.cur{border-color:#3a3528;box-shadow:0 0 0 2px rgba(58,53,40,.15)}
 .mcell.done{border-color:#9fd5b6;background:#e8f5ec;color:#13602c;cursor:default}
 .mcell.rev{border-color:#ecc98a;background:#fdf3e2;color:#8a5a14;cursor:default}
 .mcell.bad{animation:shake .3s;border-color:#e6b0b0;background:#fdecec}
 .mcell .n{display:inline-block;min-width:1.4em;font-weight:700;margin-right:6px;color:var(--muted)}
 @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
 .iactions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:18px}
 .fb{font-size:14px;font-weight:600;min-height:1.4em}
 .fb.ok{color:var(--accent)} .fb.bad{color:var(--edge)} .fb.info{color:var(--muted);font-weight:400}
 .expl{margin-top:14px;padding:10px 14px;border-radius:8px;background:#e8f5ec;border:1px solid #bfe0c8;color:#13602c;font-size:14px;line-height:1.5;max-width:720px}
 .expl.rev{background:#fdf3e2;border-color:#f0d878;color:#6b4a10}
 .help-inline{display:none}
 /* map */
 .mapwrap{position:relative;margin-top:6px;border:1px solid var(--border);border-radius:8px;overflow:hidden;background:var(--sea);aspect-ratio:1/1;max-height:70vh;touch-action:none}
 .mapwrap svg{width:100%;height:100%;display:block;cursor:crosshair}
 .mapwrap svg.drag{cursor:grabbing}
 .mapwrap .c{fill:var(--land);stroke:var(--bord);stroke-width:.6;vector-effect:non-scaling-stroke}
 .mapwrap .c.se{fill:var(--land-se)}
 .mapwrap .c.se:hover{fill:#e9dcb8}
 .mapwrap .c.hit{fill:#bfe0c8} .mapwrap .c.miss{fill:#f3c9c4} .mapwrap .c.revc{fill:#f6dca6}
 .mapwrap .mk{pointer-events:none}
 .mapwrap .mk circle{stroke:#fff;vector-effect:non-scaling-stroke}
 .mapwrap .mk text{font-size:13px;font-weight:700;paint-order:stroke;stroke:#fff;stroke-width:3px;vector-effect:non-scaling-stroke}
 .zbar{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px}
 .zbar button{width:36px;height:36px;padding:0;font-size:18px;font-weight:700;background:#fff;border-color:#6b6456;color:#3a3528;box-shadow:0 1px 3px rgba(0,0,0,.2)}
 .zbar button:hover{background:#f3ecd8;color:#3a3528}
 .zhint{position:absolute;left:10px;bottom:8px;font-size:11.5px;color:var(--muted);background:rgba(255,255,255,.85);border-radius:6px;padding:3px 8px;pointer-events:none}
 .clues{list-style:none;margin:0 0 6px;padding:0;max-width:720px}
 .clues li{padding:7px 10px;margin:0 0 6px;border-left:3px solid #e1d8c2;background:#fff;font-size:14.5px;line-height:1.45}
 .clues li:last-child{border-left-color:var(--edge)}
 .clues .k{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-right:6px}
 /* drawer content */
 .hl h3{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:14px 0 6px}
 .hl ol{margin:0;padding-left:20px} .hl li{margin:0 0 10px;line-height:1.5}
 .hl li.new{animation:flash 1.2s}
 @keyframes flash{0%{background:#fff3c4}100%{background:transparent}}
 .hl .placeholder{color:#9b9387;font-style:italic}
 .hl .chips{display:flex;flex-wrap:wrap;gap:6px}
 .hl .pchip{font-size:12px;border:1px solid var(--border);border-radius:10px;padding:1px 9px;background:#fefcf7}
 .hl a{color:var(--edge);text-decoration:none}
 .hl ul{margin:0;padding-left:18px} .hl ul li{margin:3px 0}
 .hl .ref{font-size:12px;color:var(--muted);margin:0 0 6px}
 .hl figure{margin:6px 0 10px} .hl figure img{display:block;max-width:100%;border-radius:6px;border:1px solid var(--border)}
 .hl figcaption{font-size:11.5px;color:var(--muted);margin-top:4px}
 .hl .book{border-left:3px solid #e1d8c2;padding:2px 0 2px 12px;margin:6px 0 4px}
 .hl .odeljak{margin:10px 0 4px;padding:8px 12px;background:#fefcf7;border:1px solid #e6e0d2;border-radius:8px;font-size:14px;line-height:1.5}
 .hl .odeljak summary{cursor:pointer;font-weight:600;color:#3a3528;font-size:13px}
 .hl .odeljak ul,.hl .odeljak ol{padding-left:20px;margin:6px 0} .hl .odeljak li{margin:3px 0} .hl .odeljak p{margin:6px 0}
 .hl .odeljak table{border-collapse:collapse;font-size:13px} .hl .odeljak th,.hl .odeljak td{border:1px solid #e6e0d2;padding:3px 6px}
 .hl .tekst-links{display:flex;flex-wrap:wrap;gap:6px 14px;margin:8px 0 4px;font-size:13.5px}
 .hl .tekst-links a{color:var(--edge);font-weight:600;text-decoration:none}
 /* the lesson (protected copy): main column via the nav, or one part of it in the wide drawer */
 .app-drawer.wide{width:min(820px,100vw)}
 .app-drawer .les{padding:0;max-width:none}
 .app-drawer .les section,.app-drawer .les .strana{margin:0 0 16px}
 .lekbar{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}
 .lekbar button{font-size:13px;padding:6px 12px}
 /* summary */
 .sum{padding:22px 26px 40px;max-width:860px}
 .sum h1{font-size:22px;margin:0 0 6px;color:#3a3528}
 .sum .big{font-size:30px;font-weight:700;color:var(--accent)}
 .sum .tbl{margin:14px 0}
 .sum .sub{color:var(--muted);margin:0 0 6px} .sum .lead{color:var(--muted);max-width:640px;line-height:1.5}
 .rv{border:1px solid var(--border);border-radius:8px;background:#fff;padding:10px 14px;margin:12px 0}
 .rv .rq{margin:4px 0 8px;font-weight:600;color:#3a3528} .rv .rl{margin:0;font-size:12px;color:var(--muted)}

 /* vremenska osa */

 .osa .ticks{position:relative;height:22px;margin-left:110px;border-top:2px solid #3a3528}
 .osa .ticks span{position:absolute;top:3px;font-size:11px;color:var(--muted);transform:translateX(-50%)}

 /* moje znanje */

 }

<script>
(function () {
  const root = document.documentElement;
  const bar = document.querySelector('.app-bar');
  function setTop() { if (bar) root.style.setProperty('--htop', bar.offsetHeight + 'px'); }
  window.addEventListener('resize', setTop);
  setTop();

  // ☰ navigation (only shown at ≤760px)
  const nav = document.getElementById('app-nav');
  const navBtn = document.getElementById('app-menu');
  const navOverlay = () => window.matchMedia && window.matchMedia('(max-width:760px)').matches;
  function setNav(open) {
    if (!nav) return;
    nav.classList.toggle('open', !!open);
    if (navBtn) navBtn.setAttribute('aria-expanded', String(!!open));
  }
  if (navBtn) navBtn.addEventListener('click', e => { e.stopPropagation(); setNav(!nav.classList.contains('open')); });

  // navigation filter: case- and diacritic-insensitive (š, č, ć, ž, đ)
  const filter = document.getElementById('app-filter');
  const norm = s => String(s || '').toLowerCase().replace(/đ/g, 'd').normalize('NFD').replace(/[̀-ͯ]/g, '');
  function applyFilter() {
    const q = norm(filter.value.trim());
    document.querySelectorAll('#app-nav [data-filter]').forEach(el =>
      el.classList.toggle('f-hide', !!q && !norm(el.dataset.filter).includes(q)));
    document.querySelectorAll('#app-nav [data-filter-group]').forEach(g =>
      g.classList.toggle('f-hide', !!q && !g.querySelector('[data-filter]:not(.f-hide)')));
  }
  if (filter) filter.addEventListener('input', applyFilter);

  // ⋯ menus: a button with data-menu="<id>" toggles .bar-menu#<id>; a button inside closes it
  function setMenu(m, open) {
    m.classList.toggle('open', !!open);
    const b = document.querySelector('[data-menu="' + m.id + '"]');
    if (b) b.setAttribute('aria-expanded', String(!!open));
  }
  document.querySelectorAll('[data-menu]').forEach(btn => {
    const m = document.getElementById(btn.dataset.menu);
    if (!m) return;
    btn.addEventListener('click', e => { e.stopPropagation(); setMenu(m, !m.classList.contains('open')); });
    m.addEventListener('click', e => { e.stopPropagation(); if (e.target.closest('button')) setMenu(m, false); });
  });
  document.addEventListener('click', e => {
    // composedPath: the clicked node may already be re-rendered away (e.g. a step's "next" button)
    if (!e.composedPath().some(n => n.dataset && n.dataset.keepMenus)) document.querySelectorAll('.bar-menu.open').forEach(m => setMenu(m, false));
    if (nav && nav.classList.contains('open') && navOverlay() && !nav.contains(e.target)) setNav(false);
  });
  document.addEventListener('keydown', e => {
    if (e.key !== 'Escape') return;
    document.querySelectorAll('.bar-menu.open').forEach(m => setMenu(m, false));
    const x = document.querySelector('.app-drawer.open .drawer-close');
    if (x && x.offsetParent !== null) x.click();
  });

  window.HubShell = { setNav, setMenu, applyFilter, navOverlay };
})();
</script>

ni-istorijski-izvori", "materijalni-istorijski-izvori", "audio-vizuelni-izvori"], "tvrdnja": "Za period 1780–1918. istoričari imaju samo pisane izvore.", "tacno": false, "ispravke": [{"tekst": "Postoje pisani, materijalni i audio-vizuelni izvori.", "tacan": true}, {"tekst": "Postoje samo pisani i audio-vizuelni izvori.", "tacan": false, "zasto": "Izostavljeni su materijalni izvori — muzeji čuvaju mašine, odeću, novac i druge predmete iz tog doba."}, {"tekst": "Postoje samo materijalni izvori, jer su pisani izgubljeni.", "tacan": false, "zasto": "Naprotiv — pisanih izvora iz XIX veka ima više nego ikada ranije."}], "pomoc": ["Setite se koliko vrsta izvora lekcija nabraja.", "Pored pisanih, tu su i predmeti, kao i fotografije i filmovi.", "Iz lekcije: pisani, materijalni i nova vrsta — audio-vizuelni izvori."], "objasnjenje": "Za ovaj period postoje sve tri vrste izvora — pisani, materijalni i audio-vizuelni.", "iz_udzbenika": {"strana": 16, "odeljak": "Uvod", "tekst": "Lekcija deli izvore za period 1780–1918. na pisane, materijalne i audio-vizuelne."}}, {"id": "vrs-povezi-primeri", "vrsta": "povezi", "tezina": "lako", "pojmovi": ["pisani-istorijski-izvori", "materijalni-istorijski-izvori", "audio-vizuelni-izvori"], "pitanje": "Poveži vrstu izvora sa primerom.", "parovi": [["Pisani izvor", "Naslovna strana lista Politika iz 1914."], ["Materijalni izvor", "Mašina iz XIX veka izložena u muzeju"], ["Audio-vizuelni izvor", "Film Krunisanje kralja Petra I Karađorđevića"]], "pomoc": ["Pitaj se za svaki primer — da li je napisan, da li je predmet ili je snimljen aparatom?", "Novine se čitaju, mašina se gleda u muzeju, film se snima kamerom.", "Iz lekcije: pisani (novine, dokumenti), materijalni (ostaci, predmeti), audio-vizuelni (fotografija, zvuk, film)."], "objasnjenje": "Novine su pisani izvor, mašina u muzeju materijalni, a film audio-vizuelni.", "iz_udzbenika": {"strana": 17, "odeljak": "Pisani i materijalni istorijski izvori", "tekst": "Pisane izvore čine novine, časopisi i dokumenti; materijalne — ostaci naselja, građevine, pokućstvo, mašine; audio-vizuelne — fotografije, zvučni zapisi i filmovi."}}, {"id": "vrs-zakljuci-nauka", "vrsta": "zakljuci", "tezina": "srednje", "pojmovi": ["audio-vizuelni-izvori", "fotografija", "fonograf", "film"], "pitanje": "Zašto za stari i srednji vek nemamo audio-vizuelne izvore, a za XIX vek ih imamo?", "odgovori": [{"tekst": "Fotografija, fonograf i film izumljeni su tek u XIX veku", "tacan": true}, {"tekst": "Stari audio-vizuelni izvori su svi uništeni u ratovima", "tacan": false, "zasto": "Oni nisu uništeni — nisu ni postojali, jer aparati za beleženje slike i zvuka još nisu bili izumljeni."}, {"tekst": "Ranije ljudi nisu umeli da crtaju i slikaju", "tacan": false, "zasto": "Slike i crteži postoje odavno (npr. štamparija iz XVI veka na graviri), ali to nije snimak aparatom."}, {"tekst": "Muzeji su u ranijim vekovima odbijali da ih čuvaju", "tacan": false, "zasto": "Muzeji se uopšte osnivaju tek u XIX veku; razlog je u tehnici snimanja, ne u čuvanju."}], "pomoc": ["Korak 1: Šta je potrebno da bi nastao snimak slike ili zvuka?", "Korak 2: Kada su izumljeni ti aparati — Dager 1839, Edison 1877, Limijer 1895?", "Iz lekcije: s napretkom nauke u XIX veku javlja se nova vrsta izvora — audio-vizuelni."], "objasnjenje": "Audio-vizuelni izvori zavise od aparata za beleženje slike i zvuka, a ti aparati (dagerotipija, fonograf, film) nastaju tek u XIX veku.", "iz_udzbenika": {"strana": 16, "odeljak": "Uvod", "tekst": "Napredak nauke u XIX veku doneo je novu vrstu izvora — audio-vizuelne."}}, {"id": "vrs-uporedi-pisani-materijalni", "vrsta": "uporedi", "tezina": "lako", "pojmovi": ["pisani-istorijski-izvori", "materijalni-istorijski-izvori", "popis-stanovnistva", "muzeji", "dnevnici"], "a": "Pisani izvori", "b": "Materijalni izvori", "pitanje": "Na koju vrstu izvora se odnosi tvrdnja — A, B, obe ili nijednu?", "tvrdnje": [{"tekst": "Popis stanovništva iz početka XIX veka", "odgovor": "a", "zasto": "Popis je dokument državne ustanove — pisani izvor."}, {"tekst": "Saobraćajna sredstva i predmeti za svakodnevnu upotrebu iz XIX veka", "odgovor": "b", "zasto": "To su materijalni ostaci prošlosti; danas ih čuvaju muzeji."}, {"tekst": "Postoje i za razdoblja pre 1780. godine", "odgovor": "oba", "zasto": "Lekcija kaže da kao i ranije postoje pisani i materijalni izvori."}, {"tekst": "Dnevnik jednog vojskovođe", "odgovor": "a", "zasto": "Dnevnici i memoari značajnih ličnosti su pisani izvori."}, {"tekst": "Javljaju se tek u XIX veku, zahvaljujući novim aparatima", "odgovor": "nijedan", "zasto": "To važi za audio-vizuelne izvore; pisani i materijalni su mnogo stariji."}], "pomoc": ["Pisani izvor se čita, materijalni je predmet ili ostatak.", "Samo jedna od tri vrste je nova u ovom periodu — i nije ni A ni B.", "Iz lekcije: pisani i materijalni izvori postoje i za ranija razdoblja."], "objasnjenje": "Popisi i dnevnici su pisani izvori, predmeti i saobraćajna sredstva materijalni; obe vrste su starije od 1780, a nova vrsta su audio-vizuelni izvori.", "iz_udzbenika": {"strana": 17, "odeljak": "Pisani i materijalni istorijski izvori", "tekst": "Pisane izvore čine i dokumenti (popisi, pisma, izveštaji) i lični zapisi; materijalni izvori su ostaci od naselja i građevina do pokućstva."}}, {"id": "vrs-uporedi-pisani-av", "vrsta": "uporedi", "tezina": "tesko", "pojmovi": ["pisani-istorijski-izvori", "audio-vizuelni-izvori", "film", "fonograf", "gutenberg"], "a": "Pisani izvori", "b": "Audio-vizuelni izvori", "pitanje": "Na koju vrstu izvora se odnosi tvrdnja — A, B, obe ili nijednu?", "tvrdnje": [{"tekst": "Članak iz Malih novina od 3. juna 1896.", "odgovor": "a", "zasto": "Novinski članak je pisani izvor — čak i kada piše o filmu."}, {"tekst": "Mogu da prikažu pokret ili da sačuvaju zvuk", "odgovor": "b", "zasto": "Film beleži pokret, a fonograf zvuk — to pisani izvor ne može."}, {"tekst": "Postojali su već u XVI veku, u doba ručne štamparske prese", "odgovor": "a", "zasto": "Pisani izvori su stari; audio-vizuelni nastaju tek od 1839."}, {"tekst": "Koriste se kao istorijski izvori za period 1780–1918.", "odgovor": "oba", "zasto": "Za ovaj period istoričari koriste i pisane i audio-vizuelne izvore."}, {"tekst": "Čuvaju se u Zbirci karata i planova Arhiva Vojvodine kao predmeti iz kamenog doba", "odgovor": "nijedan", "zasto": "Ta zbirka čuva dokumente od XVII do XIX veka; predmeti iz davne prošlosti su materijalni izvori."}], "pomoc": ["Ne zbunjuj se temom — pitaj se kako je izvor nastao (napisan ili snimljen).", "Članak o filmu je i dalje tekst u novinama.", "Iz lekcije: pisani izvori su stari koliko i pismo; audio-vizuelni nastaju s fotografijom, fonografom i filmom."], "objasnjenje": "Vrstu izvora određuje način na koji je nastao, a ne tema — članak o filmu je pisani izvor, a film i zvučni zapis su audio-vizuelni.", "iz_udzbenika": {"strana": 19, "odeljak": "Svedočanstvo — Prva filmska predstava u Beogradu", "tekst": "O prvim filmovima u Beogradu saznajemo iz pisanog izvora — članka novinara Malih novina iz juna 1896."}}, {"id": "vrs-zakljuci-krunisanje", "vrsta": "zakljuci", "tezina": "srednje", "pojmovi": ["audio-vizuelni-izvori", "krunisanje-petra-i-karadjordjevica", "film"], "pitanje": "Istoričar želi da VIDI kako su izgledale ulice Beograda i povorka na krunisanju kralja Petra I 1904. Koji izvor mu najviše pomaže?", "odgovori": [{"tekst": "Dokumentarni film Krunisanje kralja Petra I Karađorđevića", "tacan": true}, {"tekst": "Naslovna strana Politike iz avgusta 1914.", "tacan": false, "zasto": "Ona je nastala deset godina kasnije i javlja o pobedi na Ceru, ne o krunisanju."}, {"tekst": "Popis stanovništva", "tacan": false, "zasto": "Popis daje brojeve (stanovnici, vera, obrazovanje), a ne sliku jednog događaja."}, {"tekst": "Članak iz Malih novina iz 1896.", "tacan": false, "zasto": "Taj članak opisuje prve filmske predstave osam godina pre krunisanja."}], "pomoc": ["Korak 1: Šta istoričar hoće — da pročita, da izbroji ili da vidi pokretne prizore?", "Korak 2: Koji izvor je nastao baš 1904. i beleži pokret?", "Iz lekcije: najstariji sačuvani film snimljen u Srbiji je Krunisanje kralja Petra I (1904), oko 50 minuta."], "objasnjenje": "Film iz 1904. je snimljen baš na krunisanju i prikazuje pokretne prizore — ulice, kralja na konju, gardiste i narod.", "iz_udzbenika": {"strana": 19, "odeljak": "Znatiželja — Prvi filmovi snimljeni u Srbiji", "tekst": "Kadar iz filma prikazuje kralja sa krunom na belom konju, okruženog gardistima, na ulici punoj ljudi.", "slika": "02-istorijski-izvori-1780-1918/08-krunisanje-petra-i.jpg"}, "osa": {"naziv": "Film Krunisanje kralja Petra I Karađorđevića", "od": 1904, "traka": "srbija"}}, {"id": "vrs-povezi-uzrok-posledica", "vrsta": "povezi", "tezina": "tesko", "pojmovi": ["obavezno-osnovno-skolovanje", "pismenost", "telegraf", "stampa", "arhivi", "muzeji", "film"], "pitanje": "Poveži uzrok sa njegovom posledicom.", "parovi": [["Uvedeno obavezno osnovno školovanje", "Pismenost prestaje da bude privilegija sveštenstva i plemstva"], ["Telegraf i telefon ubrzavaju prenos vesti", "Štampa postaje još popularnija"], ["Dokumenata ima više nego ikada", "Vlasti osnivaju državne biblioteke i arhive"], ["Želja da se materijalno nasleđe sačuva i izloži", "U XIX veku se osnivaju muzeji"], ["U Beogradu 1896. još nema bioskopskih sala", "Filmovi se prikazuju po kafanama i hotelima"]], "pomoc": ["Kreni od para koji ti je najjasniji, pa isključuj.", "Arhivi čuvaju dokumente, muzeji predmete; vesti putuju telegrafom.", "Iz lekcije: svaka nova ustanova ili navika ima svoj razlog — školovanje, brže vesti, previše dokumenata, briga o nasleđu, nedostatak sala."], "objasnjenje": "Školovanje širi pismenost; brže vesti jačaju štampu; mnoštvo dokumenata traži arhive; briga o nasleđu rađa muzeje; bez sala filmovi idu u kafane.", "iz_udzbenika": {"strana": 17, "odeljak": "Pisani i materijalni istorijski izvori", "tekst": "Lekcija za svaku novu vrstu ustanove navodi razlog — školovanje i štampa, rast dokumenata i arhivi, materijalno nasleđe i muzeji."}}, {"id": "vrs-objasni-tri-vrste", "vrsta": "objasni", "tezina": "lako", "pojmovi": ["pisani-istorijski-izvori", "materijalni-istorijski-izvori", "audio-vizuelni-izvori"], "pitanje": "Navedi tri vrste istorijskih izvora za period 1780–1918. i za svaku daj po jedan primer iz lekcije.", "uzor": "Pisani izvori su, na primer, novine poput Politike, popisi stanovništva ili dnevnici. Materijalni izvori su predmeti i ostaci — mašine, saobraćajna sredstva, odeća u muzejima. Audio-vizuelni izvori su fotografije, zvučni zapisi i filmovi, kao film o krunisanju kralja Petra I.", "ideje": ["Pisani izvori + primer (novine, dokument, pismo, dnevnik).", "Materijalni izvori + primer (mašina, novac, odeća, građevina).", "Audio-vizuelni izvori + primer (fotografija, fonograf, film).", "Audio-vizuelni su nova vrsta u ovom periodu."], "objasnjenje": "Tri vrste su pisani, materijalni i audio-vizuelni izvori; poslednja je nova u XIX veku.", "iz_udzbenika": {"strana": 16, "odeljak": "Uvod", "tekst": "Lekcija deli izvore za period 1780–1918. na pisane, materijalne i audio-vizuelne; poslednji su nova vrsta."}}]}, {"naslov": "Škola, štampa i novine", "zadaci": [{"id": "pis-izbor-pismenost", "vrsta": "izbor", "tezina": "lako", "pojmovi": ["pismenost", "obavezno-osnovno-skolovanje"], "pitanje": "Ko je bio pismen pre nego što je u XIX veku uvedeno obavezno osnovno školovanje?", "odgovori": [{"tekst": "Uglavnom malobrojni sloj sveštenstva i plemstva", "tacan": true}, {"tekst": "Gotovo svi seljaci", "tacan": false, "zasto": "Seljaci uglavnom nisu znali da čitaju — pismenost je bila privilegija malobrojnih."}, {"tekst": "Samo fabrički radnici", "tacan": false, "zasto": "Radnici nisu bili povlašćeni sloj; pismenost se proširila tek sa obaveznim školovanjem."}, {"tekst": "Svi stanovnici Evrope", "tacan": false, "zasto": "Da su svi bili pismeni, obavezno školovanje ne bi ništa promenilo."}], "pomoc": ["Reč „privilegija” znači povlastica malobrojnih.", "Mislimo na dva povlašćena sloja starog društva.", "Iz lekcije: pismenost je bila privilegija malobrojnog sloja sveštenstva i plemstva."], "objasnjenje": "Pre obaveznog školovanja čitati i pisati znali su uglavnom sveštenici i plemići; škola je pismenost proširila na mnogo više ljudi.", "iz_udzbenika": {"strana": 16, "odeljak": "Pisani istorijski izvori", "tekst": "U XIX veku većina evropskih i neke vanevropske države uvode obavezno osnovno školovanje, pa pismenost prestaje da bude privilegija sveštenstva i plemstva."}}, {"id": "pis-zakljuci-pismenost", "vrsta": "zakljuci", "tezina": "lako", "pojmovi": ["pismenost", "obavezno-osnovno-skolovanje"], "pitanje": "Zašto je pismenost u XIX veku prestala da bude privilegija sveštenstva i plemstva?", "odgovori": [{"tekst": "Zato što je uvedeno obavezno osnovno školovanje", "tacan": true}, {"tekst": "Zato što su izumljeni telegraf i telefon", "tacan": false, "zasto": "Telegraf i telefon su ubrzali vesti i pomogli štampi, ali nisu učili ljude da čitaju."}, {"tekst": "Zato što su sveštenici i plemići zaboravili da pišu", "tacan": false, "zasto": "Oni su i dalje bili pismeni — promena je u tome što su pismeni postali i mnogi drugi."}, {"tekst": "Zato što su osnovani muzeji", "tacan": false, "zasto": "Muzeji čuvaju i izlažu predmete; čitanje i pisanje se uči u školi."}], "pomoc": ["Korak 1: Gde se uči čitanje i pisanje?", "Korak 2: Šta se promenilo kad je ta ustanova postala obavezna za sve?", "Iz lekcije: uvođenjem obaveznog osnovnog školovanja pismenost prestaje da bude privilegija sveštenstva i plemstva."], "objasnjenje": "Kad je osnovna škola postala obavezna, čitati i pisati naučili su i ljudi izvan sveštenstva i plemstva.", "iz_udzbenika": {"strana": 16, "odeljak": "Pisani istorijski izvori", "tekst": "U XIX veku većina evropskih država uvodi obavezno osnovno školovanje, pa se pismenost širi izvan sveštenstva i plemstva."}}, {"id": "pis-dopuni-skolovanje", "vrsta": "dopuni", "tezina": "lako", "pojmovi": ["obavezno-osnovno-skolovanje", "pismenost"], "pitanje": "Dopuni rečenicu.", "tekst": "U XIX veku uvedeno je {{obavezno}} osnovno školovanje, pa {{pismenost}} više nije bila privilegija sveštenstva i plemstva.", "ponudjene": ["obavezno", "dobrovoljno", "pismenost", "štampa", "vojska"], "pomoc": ["Školovanje je postalo nešto što svako mora da prođe.", "Šta se stiče u školi, a ranije su imali samo sveštenici i plemići?", "Iz lekcije: obavezno osnovno školovanje → pismenost više nije privilegija."], "objasnjenje": "Obavezno osnovno školovanje proširilo je pismenost izvan sveštenstva i plemstva.", "iz_udzbenika": {"strana": 16, "odeljak": "Pisani istorijski izvori", "tekst": "Uvođenjem obaveznog osnovnog školovanja pismenost prestaje da bude privilegija malobrojnih."}}, {"id": "pis-lanac-skolovanje", "vrsta": "lanac", "tezina": "lako", "pojmovi": ["obavezno-osnovno-skolovanje", "pismenost", "stampa"], "karike": ["Uvodi se obavezno osnovno školovanje", "?", "Raste potreba za pisanom reči u svakodnevnom životu"], "praznina": 1, "odgovori": [{"tekst": "Sve više ljudi zna da čita i piše", "tacan": true}, {"tekst": "Zatvaraju se štamparije", "tacan": false, "zasto": "Bilo je obrnuto — više čitalaca značilo je više štampanja, pa se tehnika štampe usavršavala."}, {"tekst": "Pismenost ostaje samo kod plemstva", "tacan": false, "zasto": "Upravo to se menja: posle obaveznog školovanja pismenost više nije privilegija plemstva i sveštenstva."}, {"tekst": "Osnivaju se muzeji", "tacan": false, "zasto": "Muzeji nastaju zbog čuvanja materijalnog nasleđa, ne zbog školovanja."}], "pomoc": ["Korak 1: Šta deca nauče u osnovnoj školi?", "Korak 2: Ko ima potrebu za novinama i knjigama — onaj ko zna ili ne zna da čita?", "Iz lekcije: više pismenih → veća potreba za pisanom reči."], "objasnjenje": "Škola stvara sve više pismenih ljudi, a oni u svakodnevnom životu traže sve više pisane reči — novina, knjiga, obaveštenja.", "iz_udzbenika": {"strana": 16, "odeljak": "Pisani istorijski izvori", "tekst": "Porast broja pismenih povećao je potrebu za pisanom reči u svakodnevnom životu."}}, {"id": "pis-lanac-stampa", "vrsta": "lanac", "tezina": "srednje", "pojmovi": ["pismenost", "stampa", "novine", "casopisi"], "karike": ["Broj pismenih ljudi raste", "Raste potreba za pisanom reči", "?", "Novine i časopisi postaju u XIX veku veoma rašireni"], "praznina": 2, "odgovori": [{"tekst": "Tehnika štampanja se dalje unapređuje", "tacan": true}, {"tekst": "Uvodi se obavezno osnovno školovanje", "tacan": false, "zasto": "Školovanje je početak ovog lanca — ono je uzrok rasta pismenosti, a ne korak posle njega."}, {"tekst": "Braća Limijer prikazuju prvi film", "tacan": false, "zasto": "Film (1895) je audio-vizuelni izvor; ne objašnjava zašto su novine i časopisi postali rašireni."}, {"tekst": "Gutenberg izumeva štampu", "tacan": false, "zasto": "Gutenbergov pronalazak je mnogo stariji — označio je početak novog veka."}], "pomoc": ["Korak 1: Ako svi traže više novina, šta mora da se poboljša da bi ih bilo dovoljno?", "Korak 2: Uporedi ručnu presu iz XVI veka i rotacionu mašinu iz 1860-ih.", "Iz lekcije: veća potreba za pisanom reči podstakla je dalje unapređenje tehnike štampanja."], "objasnjenje": "Kada je čitalaca bilo više, trebalo je štampati brže i više — tehnika štampanja se usavršila, pa su novine i časopisi postali masovni.", "iz_udzbenika": {"strana": 16, "odeljak": "Pisani istorijski izvori", "tekst": "Veća potreba za pisanom reči dovela je do unapređenja štampanja; štampa je u XIX veku postala veoma raširena."}}, {"id": "pis-lanac-industrija", "vrsta": "lanac", "tezina": "tesko", "pojmovi": ["industrijska-revolucija", "rotaciona-stamparska-masina", "stamparija", "pisani-istorijski-izvori"], "karike": ["Razvija se industrija", "?", "Novine se štampaju u desetinama hiljada primeraka", "Iz perioda posle industrijske revolucije sačuvano je mnogo više pisanih izvora nego iz ranog novog veka"], "praznina": 1, "odgovori": [{"tekst": "Ručnu presu zamenjuje velika rotaciona mašina na mašinski pogon", "tacan": true}, {"tekst": "Gutenberg izumeva štampanje", "tacan": false, "zasto": "Gutenbergova štampa je iz vremena prelaza srednjeg u novi vek — mnogo pre industrijske revolucije."}, {"tekst": "Pismenost ponovo postaje privilegija plemstva", "tacan": false, "zasto": "Desilo se suprotno — pismenost se širi, a ne sužava."}, {"tekst": "Braća Limijer izumevaju film", "tacan": false, "zasto": "Film je audio-vizuelni izvor; ne objašnjava zašto ima više novina i pisanih izvora."}], "pomoc": ["Korak 1: Šta industrija daje — ručni rad ili mašine?", "Korak 2: Pogledaj dve gravire na str. 16 — ručna presa iz XVI veka i ogromna mašina iz 1860-ih.", "Iz lekcije: rotaciona štamparska mašina iz sedme decenije XIX veka štampa brže i u mnogo više primeraka."], "objasnjenje": "Industrija je donela rotacionu mašinu na mašinski pogon; ona štampa brzo i u ogromnom broju primeraka, pa iz XIX veka imamo mnogo više pisanih izvora.", "iz_udzbenika": {"strana": 16, "odeljak": "Uvod — dve štamparije", "tekst": "Udžbenik poredi štampariju iz druge polovine XVI veka i rotacionu štamparsku mašinu iz 1860-ih i pita kako je industrija doprinela razvoju štampe.", "slika": "02-istorijski-izvori-1780-1918/02-rotaciona-stamparska-masina.jpg"}}, {"id": "pis-izvor-gravire", "vrsta": "izvor", "tezina": "srednje", "pojmovi": ["stamparija", "rotaciona-stamparska-masina", "stampa"], "izvor": {"autor": "Dve gravire iz udžbenika", "naslov": "Štamparija iz XVI veka i rotaciona mašina iz 1860-ih (opis)", "tekst": "Na prvoj graviri nekoliko majstora radi u radionici — slažu slova i ručno pritiskaju listove na drvenoj presi. Na drugoj je ogromna mašina sa valjcima i zupčanicima, toliko velika da se radnici penju na nju.", "napomena": "Opis slika je prepričan; udžbenik, str. 16."}, "pitanje": "Šta poređenje ove dve slike najbolje pokazuje?", "odgovori": [{"tekst": "Da je industrija omogućila brže štampanje u mnogo više primeraka", "tacan": true}, {"tekst": "Da se u XIX veku štampalo manje nego u XVI veku", "tacan": false, "zasto": "Ogromna mašina pokazuje suprotno — štampa se mnogo više i brže."}, {"tekst": "Da je štampa izumljena tek u XIX veku", "tacan": false, "zasto": "Prva gravira prikazuje štampariju već u XVI veku; XIX vek donosi samo bolju tehniku."}, {"tekst": "Da su štampari u XIX veku radili bez mašina", "tacan": false, "zasto": "Upravo je mašina glavna razlika — ručnu presu zamenila je mašina sa valjcima."}], "pomoc": ["Šta se promenilo — ko ili šta obavlja posao?", "Ruke majstora prema valjcima i zupčanicima.", "Iz lekcije: razvoj industrije doveo je do rotacione mašine, a time do masovne štampe."], "objasnjenje": "Ručna presa iz XVI veka i rotaciona mašina iz 1860-ih pokazuju kako je industrija pretvorila štampanje u brz, masovan posao.", "iz_udzbenika": {"strana": 16, "odeljak": "Uvod — dve štamparije", "tekst": "Levo je štamparija iz druge polovine XVI veka, desno rotaciona štamparska mašina iz sedme decenije XIX veka.", "slika": "02-istorijski-izvori-1780-1918/01-stamparija-xvi-vek.jpg"}}, {"id": "pis-izbor-gutenberg", "vrsta": "izbor", "tezina": "srednje", "pojmovi": ["gutenberg", "stamparija"], "pitanje": "Šta je, prema onome što se uči u istoriji, označio Gutenbergov pronalazak štampe?", "odgovori": [{"tekst": "Kraj srednjeg i početak novog veka", "tacan": true}, {"tekst": "Početak industrijske revolucije", "tacan": false, "zasto": "Industrijska revolucija je mnogo kasnija; ona je donela rotacionu mašinu, a ne prvu štampu."}, {"tekst": "Kraj Prvog svetskog rata", "tacan": false, "zasto": "Kraj Prvog svetskog rata (1918) zatvara period koji učimo ove godine, a ne srednji vek."}, {"tekst": "Pojavu prvog filma", "tacan": false, "zasto": "Film su izumela braća Limijer 1895, nekoliko vekova posle Gutenberga."}], "pomoc": ["Ovo je pitanje iz 6. razreda — granica između dva velika doba.", "Štampa pokretnim slovima omogućila je brzo širenje knjiga i znanja.", "Iz lekcije: udžbenik podseća da je Gutenbergov pronalazak označio kraj srednjeg i početak novog veka."], "objasnjenje": "Gutenbergova štampa pokretnim slovima omogućila je brzo širenje knjiga i znanja, pa se uzima kao jedna od granica srednjeg i novog veka.", "iz_udzbenika": {"strana": 16, "odeljak": "Uvod — dve štamparije", "tekst": "Uz sliku štamparije iz XVI veka udžbenik traži da se setimo kako je Gutenbergov pronalazak označio kraj srednjeg i početak novog veka.", "slika": "02-istorijski-izvori-1780-1918/01-stamparija-xvi-vek.jpg"}}, {"id": "pis-izbor-zasto-vise", "vrsta": "izbor", "tezina": "tesko", "pojmovi": ["pisani-istorijski-izvori", "obavezno-osnovno-skolovanje", "stampa", "dokumenti"], "pitanje": "Zašto iz XIX veka imamo mnogo više pisanih izvora nego iz ranog novog veka? Izaberi SVE tačne razloge.", "odgovori": [{"tekst": "Obavezno školovanje stvorilo je mnogo više pismenih ljudi", "tacan": true}, {"tekst": "Novine i časopisi su se štampali u ogromnom broju primeraka", "tacan": true}, {"tekst": "Moderne države i njihove ustanove stvarale su mnoštvo dokumenata", "tacan": true}, {"tekst": "Gutenberg je tek u XIX veku izumeo štampu", "tacan": false, "zasto": "Gutenbergov pronalazak je iz doba prelaza srednjeg u novi vek; XIX vek je samo usavršio štampanje."}, {"tekst": "Pismenost je i dalje bila privilegija sveštenstva i plemstva", "tacan": false, "zasto": "To važi za ranija vremena; u XIX veku pismenost se širi zahvaljujući školovanju."}], "pomoc": ["Ima više tačnih odgovora — škola, štampa i država.", "Pazi na odgovore koji zvuče poznato ali su iz pogrešnog veka.", "Iz lekcije: školovanje, raširena štampa i dokumenti modernih država — zato je pisanih izvora više nego ikada."], "objasnjenje": "Tri razloga deluju zajedno — više pismenih, masovna štampa i države koje proizvode mnoštvo dokumenata.", "iz_udzbenika": {"strana": 17, "odeljak": "Pisani istorijski izvori", "tekst": "Školovanje, razvoj štampe i nagli razvoj državnih ustanova učinili su da je dokumenata iz XIX i početka XX veka više nego ikada."}}, {"id": "pis-izbor-tiraz", "vrsta": "izbor", "tezina": "srednje", "pojmovi": ["novine", "stampa", "velika-britanija", "francuska"], "pitanje": "U koliko primeraka su se u drugoj polovini XIX veka štampale najuglednije novine u Velikoj Britaniji i Francuskoj?", "odgovori": [{"tekst": "U više desetina hiljada primeraka", "tacan": true}, {"tekst": "U nekoliko desetina primeraka", "tacan": false, "zasto": "Toliko se moglo odštampati ručnom presom; rotaciona mašina je omogućila desetine hiljada."}, {"tekst": "U samo jednom rukom pisanom primerku", "tacan": false, "zasto": "Novine se štampaju, a ne prepisuju rukom — i to masovno."}, {"tekst": "U nekoliko stotina primeraka, samo za plemiće", "tacan": false, "zasto": "Štampa je bila veoma raširena jer je čitalaca bilo mnogo više, ne samo među plemićima."}], "pomoc": ["Štampa je u XIX veku postala veoma raširena.", "Broj je izražen u hiljadama — i to desetinama.", "Iz lekcije: najuglednije novine u V. Britaniji i Francuskoj štampale su se u više desetina hiljada primeraka."], "objasnjenje": "Zahvaljujući školovanju i rotacionoj mašini, ugledne britanske i francuske novine izlazile su u desetinama hiljada primeraka.", "iz_udzbenika": {"strana": 16, "odeljak": "Pisani istorijski izvori", "tekst": "Već u drugoj polovini XIX veka najuglednije novine u Velikoj Britaniji i Francuskoj štampale su se u više desetina hiljada primeraka."}}, {"id": "pis-dopuni-tiraz", "vrsta": "dopuni", "tezina": "tesko", "pojmovi": ["novine", "velika-britanija", "francuska", "stampa"], "pitanje": "Dopuni rečenicu (bez ponuđenih reči).", "tekst": "U drugoj polovini XIX veka najuglednije novine u Velikoj Britaniji i {{Francuskoj}} štampale su se u više {{desetina}} hiljada primeraka.", "pomoc": ["Druga zemlja je ona u kojoj su i braća Limijer prikazala prvi film (Pariz).", "Broj primeraka je „više … hiljada”.", "Iz lekcije: Velika Britanija i Francuska, više desetina hiljada primeraka."], "objasnjenje": "Ugledne novine u Velikoj Britaniji i Francuskoj imale su tiraže od više desetina hiljada primeraka.", "iz_udzbenika": {"strana": 16, "odeljak": "Pisani istorijski izvori", "tekst": "Štampa je u XIX veku veoma raširena; ugledne britanske i francuske novine štampaju se u desetinama hiljada primeraka."}}, {"id": "pis-datum-morze", "vrsta": "datum", "tezina": "lako", "pojmovi": ["morzeov-telegraf", "telegraf"], "dogadjaj": "Morzeov telegraf", "pitanje": "Koje godine je nastao Morzeov telegraf?", "godina": 1844, "traka": "pronalasci", "pomoc": ["Sredina XIX veka, pet godina posle Dagerove fotografije.", "Godina počinje sa 184…", "Iz lekcije: Morzeov telegraf (1844)."], "objasnjenje": "Morzeov telegraf pojavio se 1844. i ubrzao prenos vesti.", "iz_udzbenika": {"strana": 16, "odeljak": "Pisani istorijski izvori", "tekst": "Pronalasci Morzeovog telegrafa (1844) i Belovog telefona (1876) ubrzali su prenos vesti."}}, {"id": "pis-datum-bel", "vrsta": "datum", "tezina": "srednje", "pojmovi": ["belov-telefon", "telefon"], "dogadjaj": "Belov telefon", "pitanje": "Koje godine je nastao Belov telefon?", "godina": 1876, "traka": "pronalasci", "pomoc": ["Tridesetak godina posle Morzeovog telegrafa (1844).", "Godinu dana pre Edisonovog fonografa (1877).", "Iz lekcije: Belov telefon (1876)."], "objasnjenje": "Belov telefon pojavio se 1876; zajedno sa telegrafom ubrzao je prenos vesti.", "iz_udzbenika": {"strana": 16, "odeljak": "Pisani istorijski izvori", "tekst": "Belov telefon (1876) je, kao i telegraf, ubrzao prenos vesti i povećao popularnost štampe."}}, {"id": "pis-zakljuci-telegraf", "vrsta": "zakljuci", "tezina": "srednje", "pojmovi": ["telegraf", "telefon", "stampa", "novine"], "pitanje": "Kako su telegraf i telefon uticali na štampu?", "odgovori": [{"tekst": "Vesti su putovale brže, pa je štampa postala još popularnija", "tacan": true}, {"tekst": "Ljudi su prestali da čitaju novine jer su vesti slušali telefonom", "tacan": false, "zasto": "Lekcija kaže suprotno — brži prenos vesti povećao je popularnost štampe."}, {"tekst": "Zamenili su štamparske mašine", "tacan": false, "zasto": "Telegraf i telefon prenose poruke; novine se i dalje štampaju na mašinama."}, {"tekst": "Nisu imali nikakav uticaj na novine", "tacan": false, "zasto": "Imali su — vesti su brže stizale, pa su novine postale popularnije."}], "pomoc": ["Korak 1: Čemu služe telegraf i telefon — šta oni prenose?", "Korak 2: Šta novine objavljuju? Ako vest stigne brže, novine su…", "Iz lekcije: telegraf i telefon ubrzali su prenos vesti, što je doprinelo još većoj popularnosti štampe."], "objasnjenje": "Telegraf i telefon su ubrzali prenos vesti, pa su novine mogle da donose svežije vesti i postale su još popularnije.", "iz_udzbenika": {"strana": 16, "odeljak": "Pisani istorijski izvori", "tekst": "Morzeov telegraf i Belov telefon ubrzali su prenos vesti i tako doprineli popularnosti štampe."}}, {"id": "pis-lanac-telegraf", "vrsta": "lanac", "tezina": "srednje", "pojmovi": ["morzeov-telegraf", "belov-telefon", "stampa"], "karike": ["Pronalaze se Morzeov telegraf (1844) i Belov telefon (1876)", "?", "Štampa postaje još popularnija"], "praznina": 1, "odgovori": [{"tekst": "Vesti se prenose mnogo brže", "tacan": true}, {"tekst": "Zatvaraju se redakcije novina", "tacan": false, "zasto": "Da su se redakcije zatvarale, štampa ne bi postala popularnija."}, {"tekst": "Uvodi se obavezno osnovno školovanje", "tacan": false, "zasto": "Školovanje je drugi uzrok rasta štampe, ali nije posledica telegrafa i telefona."}, {"tekst": "Nastaju prvi zvučni zapisi", "tacan": false, "zasto": "Zvučne zapise je počeo da pravi Edison fonografom 1877; telefon prenosi glas, ne snima ga."}], "pomoc": ["Korak 1: Šta je zajedničko telegrafu i telefonu?", "Korak 2: Kako brzina poruka pomaže novinama?", "Iz lekcije: telegraf i telefon → brži prenos vesti → popularnija štampa."], "objasnjenje": "Telegraf i telefon su ubrzali prenos vesti, a brže vesti su štampu učinile još popularnijom.", "iz_udzbenika": {"strana": 16, "odeljak": "Pisani istorijski izvori", "tekst": "Pronalasci telegrafa i telefona  "Da su uništavani, ne bi trebalo osnivati ustanove za njihovo čuvanje."}, {"tekst": "Prestaje upotreba pisma u državnoj službi", "tacan": false, "zasto": "Naprotiv — službena pisma, izveštaji i popisi se umnožavaju."}, {"tekst": "Osnivaju se muzeji", "tacan": false, "zasto": "Muzeji čuvaju predmete; ova karika mora da objasni zašto trebaju arhivi."}], "pomoc": ["Korak 1: Šta državne ustanove svakodnevno proizvode?", "Korak 2: Zašto bi onda trebalo graditi posebne ustanove za čuvanje?", "Iz lekcije: razvoj državnih ustanova → količina dokumenata veća nego ikada → biblioteke i arhivi."], "objasnjenje": "Moderne države i njihove ustanove stvaraju mnoštvo dokumenata, a toliku količinu treba negde čuvati — zato nastaju arhivi.", "iz_udzbenika": {"strana": 17, "odeljak": "Pisani istorijski izvori", "tekst": "Sa naglim razvojem državnih ustanova količina dokumenata iz XIX i početka XX veka veća je nego ikada."}}, {"id": "arh-lanac-dokumenti", "vrsta": "lanac", "tezina": "srednje", "pojmovi": ["dokumenti", "popis-stanovnistva", "arhivi", "arhivistika"], "karike": ["?", "Državne ustanove sprovode popise i pišu službena pisma i izveštaje", "Vlasti osnivaju arhive za veliku količinu dokumenata", "Istoričari danas mogu da proučavaju XIX vek kroz mnoštvo dokumenata"], "praznina": 0, "odgovori": [{"tekst": "Od kraja XVIII veka razvijaju se moderne države", "tacan": true}, {"tekst": "Gutenberg izumeva štampu pokretnim slovima", "tacan": false, "zasto": "To je mnogo starije i objašnjava širenje knjiga, a ne rad državnih ustanova u XIX veku."}, {"tekst": "Braća Limijer prikazuju prvi film", "tacan": false, "zasto": "Film je audio-vizuelni izvor i nema veze sa radom državnih ustanova."}, {"tekst": "U XIX veku se osnivaju muzeji", "tacan": false, "zasto": "Muzeji su posledica brige o materijalnom nasleđu, a ne uzrok državnih dokumenata."}], "pomoc": ["Korak 1: Ko sprovodi popise i piše službene izveštaje?", "Korak 2: Kada i zašto je takvih ustanova odjednom bilo mnogo više?", "Iz lekcije: sa razvojem modernih država od kraja XVIII veka nagli je razvoj državnih ustanova."], "objasnjenje": "Moderne države od kraja XVIII veka grade mnoge ustanove; one stvaraju popise, pisma i izveštaje, zbog toga nastaju arhivi — i zato istoričar ima toliko dokumenata.", "iz_udzbenika": {"strana": 17, "odeljak": "Pisani istorijski izvori", "tekst": "Razvoj modernih država doveo je do naglog razvoja državnih ustanova i do dotad najveće količine dokumenata."}}, {"id": "arh-izbor-popis", "vrsta": "izbor", "tezina": "lako", "pojmovi": ["popis-stanovnistva", "velika-britanija", "francuska"], "pitanje": "Koje su države početkom XIX veka sprovele prve popise stanovništva?", "odgovori": [{"tekst": "Velika Britanija i Francuska", "tacan": true}, {"tekst": "Srbija i Crna Gora", "tacan": false, "zasto": "Lekcija kao prve navodi dve velike zapadnoevropske države."}, {"tekst": "Rusija i Osmansko carstvo", "tacan": false, "zasto": "One se u lekciji ne pominju u vezi sa popisima; prve su bile Britanija i Francuska."}, {"tekst": "Sjedinjene Američke Države i Japan", "tacan": false, "zasto": "Lekcija govori o evropskim državama — Britaniji i Francuskoj."}], "pomoc": ["To su iste dve države čije su novine imale desetine hiljada primeraka.", "Jedna je ostrvska, druga joj je sused preko kanala.", "Iz lekcije: početkom XIX veka Velika Britanija i Francuska sprovele su prve popise stanovništva."], "objasnjenje": "Prve popise stanovništva početkom XIX veka sprovele su Velika Britanija i Francuska.", "iz_udzbenika": {"strana": 17, "odeljak": "Pisani istorijski izvori", "tekst": "Početkom XIX veka Velika Britanija i Francuska sprovele su prve popise stanovništva."}}, {"id": "arh-tn-popis", "vrsta": "tacno_netacno", "tezina": "lako", "pojmovi": ["popis-stanovnistva", "dokumenti"], "tvrdnja": "Popisi stanovništva daju samo jedan podatak — koliko ljudi živi u državi.", "tacno": false, "ispravke": [{"tekst": "Popisi daju podatke i o broju stanovnika, i o verskoj pripadnosti, i o stepenu obraz
