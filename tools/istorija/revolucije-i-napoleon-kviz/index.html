: "Starosedeoci (Indijanci)", "tacan": true}, {"tekst": "Beli vlasnici zemlje", "tacan": false, "zasto": "Samo su oni imali pravo da biraju i budu birani."}], "pomoc": ["Ko je JEDINI imao pravo glasa?", "Svi ostali su bez prava.", "Iz lekcije: pravo glasa samo beli zemljoposednici; siromašni belci, žene, crni robovi i Indijanci bez političkih prava."], "objasnjenje": "Pravo da biraju i budu birani imali su samo beli vlasnici zemlje; svi ostali — siromašni belci, žene, robovi i Indijanci — bili su bez političkih prava.", "iz_udzbenika": {"strana": 44, "odeljak": "Uređenje Sjedinjenih Američkih Država", "tekst": "Siromašni belci, žene, crni robovi i starosedeoci bili su lišeni političkih prava."}, "lekcija": 5}, {"id": "l05-sad-izbor-ime-grada", "vrsta": "izbor", "tezina": "srednje", "pojmovi": ["vasington-grad", "dzordz-vasington"], "pitanje": "Zašto je glavni grad SAD, osnovan 1800, dobio ime po Džordžu Vašingtonu?", "odgovori": [{"tekst": "Kao junak revolucije i prvi predsednik uživao je veliki ugled", "tacan": true}, {"tekst": "Zato što je on lično sagradio grad", "tacan": false, "zasto": "Lekcija razlog vidi u njegovom ugledu, ne u gradnji."}, {"tekst": "Zato što je sastavio Deklaraciju nezavisnosti", "tacan": false, "zasto": "Deklaraciju je sastavio Džeferson."}, {"tekst": "Zato što je bio britanski kralj", "tacan": false, "zasto": "Vašington je vodio vojsku protiv Britanije."}], "pomoc": ["Šta je Vašington radio u ratu, a šta posle njega?", "Ljudi su ga veoma poštovali.", "Iz lekcije: kao jedan od junaka revolucije uživao je veliki ugled; glavni grad je nazvan po njemu."], "objasnjenje": "Vašington je bio junak revolucije i prvi predsednik, pa je po njemu nazvan glavni grad osnovan 1800.", "iz_udzbenika": {"strana": 44, "odeljak": "Uređenje Sjedinjenih Američkih Država", "tekst": "Vašington je kao junak revolucije uživao veliki ugled; glavni grad SAD, osnovan 1800, dobio je ime po njemu.", "slika": "05-engleska-i-americka-revolucija/07-dzordz-vasington.jpg"}, "lekcija": 5}, {"id": "l05-sad-tn-prvi-predsednik", "vrsta": "tacno_netacno", "tezina": "lako", "pojmovi": ["dzordz-vasington", "predsednik"], "tvrdnja": "Za prvog američkog predsednika 1789. izabran je Džordž Vašington.", "tacno": true, "pomoc": ["Ko je vodio vojsku kolonista?", "Iz lekcije: prvi predsednik bio je Džordž Vašington, izabran 1789."], "objasnjenje": "Tačno — Džordž Vašington je 1789. postao prvi predsednik SAD.", "iz_udzbenika": {"strana": 44, "odeljak": "Uređenje Sjedinjenih Američkih Država", "tekst": "Za prvog američkog predsednika izabran je Džordž Vašington 1789.", "slika": "05-engleska-i-americka-revolucija/07-dzordz-vasington.jpg"}, "osa": {"naziv": "Džordž Vašington, prvi predsednik SAD", "od": 1789, "traka": "vladari"}, "lekcija": 5}, {"id": "l05-sad-tn-federacija", "vrsta": "tacno_netacno", "tezina": "lako", "pojmovi": ["federacija"], "tvrdnja": "Bivše kolonije su se ujedinile u savez država — federaciju.", "tacno": true, "pomoc": ["Svaka kolonija je postala posebna država — šta su onda uradile?", "Iz lekcije: bivše kolonije su se ujedinile u savez država (federaciju)."], "objasnjenje": "Tačno — samostalne bivše kolonije ujedinile su se u federaciju.", "iz_udzbenika": {"strana": 44, "odeljak": "Uređenje Sjedinjenih Američkih Država", "tekst": "Bivše kolonije bile su zasebne države i ujedinile su se u savez država (federaciju)."}, "lekcija": 5}, {"id": "l05-sad-tn-dzeferson-grad", "vrsta": "tacno_netacno", "tezina": "lako", "pojmovi": ["vasington-grad", "tomas-dzeferson"], "tvrdnja": "Glavni grad SAD, osnovan 1800, dobio je ime po Tomasu Džefersonu.", "tacno": false, "ispravke": [{"tekst": "Glavni grad je dobio ime po Džordžu Vašingtonu.", "tacan": true}, {"tekst": "Glavni grad je dobio ime po Filadelfiji.", "tacan": false, "zasto": "Filadelfija je poseban grad, gde je zasedao Kongres."}, {"tekst": "Glavni grad je Boston, osnovan 1800.", "tacan": false, "zasto": "Boston je stari kolonijalni grad; glavni grad je Vašington."}], "pomoc": ["Ko je prvi predsednik i junak revolucije?", "Grad se zove kao on.", "Iz lekcije: glavni grad SAD, osnovan 1800, dobio je ime po Vašingtonu."], "objasnjenje": "Netačno — glavni grad nosi ime Džordža Vašingtona.", "iz_udzbenika": {"strana": 44, "odeljak": "Uređenje Sjedinjenih Američkih Država", "tekst": "Glavni grad SAD, osnovan 1800, dobio je ime po Vašingtonu."}, "lekcija": 5}, {"id": "l05-sad-tn-vrhovni-sud", "vrsta": "tacno_netacno", "tezina": "tesko", "pojmovi": ["vrhovni-sud", "podela-vlasti", "predsednik"], "tvrdnja": "U SAD su Kongres i Vrhovni sud bili podređeni predsedniku.", "tacno": false, "ispravke": [{"tekst": "Svaka od tri grane vlasti je nezavisna; one sarađuju i nadziru jedna drugu, a sva tela su pod nadzorom Vrhovnog suda.", "tacan": true}, {"tekst": "Predsednik i Vrhovni sud bili su podređeni britanskom kralju.", "tacan": false, "zasto": "SAD su nezavisne od 1783; nemaju kralja."}, {"tekst": "Vrhovni sud je birao predsednika svake godine.", "tacan": false, "zasto": "Predsednika biraju građani na izborima, na četiri godine."}], "pomoc": ["Seti se podele vlasti iz lekcije o prosvetiteljima (Monteskje).", "Da li je ijedna grana iznad drugih?", "Iz lekcije: svaka grana vlasti je nezavisna; sva tela su pod nadzorom Vrhovnog suda."], "objasnjenje": "Netačno — grane vlasti su nezavisne i nadziru jedna drugu; tako se sprečava kršenje ustava.", "iz_udzbenika": {"strana": 44, "odeljak": "Uređenje Sjedinjenih Američkih Država", "tekst": "Sva tela vlasti su pod nadzorom Vrhovnog suda; svaka grana je nezavisna, a grane sarađuju i nadziru jedna drugu."}, "lekcija": 5}, {"id": "l05-sad-dopuni-grane", "vrsta": "dopuni", "tezina": "lako", "pojmovi": ["podela-vlasti", "ustav"], "pitanje": "Dopuni rečenicu.", "tekst": "Ustav je predvideo podelu vlasti na tri grane: {{izvršnu}}, {{zakonodavnu}} i {{sudsku}}.", "ponudjene": ["izvršnu", "zakonodavnu", "sudsku", "crkvenu", "plemićku", "kraljevsku"], "pomoc": ["Jedna grana sprovodi, druga donosi zakone, treća sudi.", "Isto je predlagao Monteskje.", "Iz lekcije: izvršna, zakonodavna i sudska vlast."], "objasnjenje": "Ustav SAD deli vlast na izvršnu (predsednik), zakonodavnu (Kongres) i sudsku (Vrhovni sud).", "iz_udzbenika": {"strana": 44, "odeljak": "Uređenje Sjedinjenih Američkih Država", "tekst": "Ustav je predvideo podelu vlasti na izvršnu, zakonodavnu i sudsku."}, "lekcija": 5}, {"id": "l05-sad-dopuni-definicije", "vrsta": "dopuni", "tezina": "srednje", "pojmovi": ["federacija", "ustav", "kongres"], "pitanje": "Dopuni objašnjenja pojmova.", "tekst": "Federacija je {{savez}} država u kome svaka savezna jedinica ima poseban položaj i samostalno odlučuje o državnim poslovima. Ustav je {{najviši}} pravni akt jedne zemlje. Kongres je naziv za američki {{parlament}}.", "ponudjene": ["savez", "najviši", "parlament", "najniži", "sud", "rat"], "pomoc": ["Federacija spaja više država.", "Iznad ustava nema drugog zakona.", "Iz lekcije: federacija — savez država; ustav — najviši pravni akt; kongres — američki parlament."], "objasnjenje": "Federacija = savez država; ustav = najviši pravni akt; Kongres = američki parlament.", "iz_udzbenika": {"strana": 44, "odeljak": "Definicije: federacija, ustav, kongres", "tekst": "Federacija je savez država, ustav najviši pravni akt, a kongres naziv za američki parlament."}, "lekcija": 5}, {"id": "l05-sad-povezi-grane", "vrsta": "povezi", "tezina": "lako", "pojmovi": ["podela-vlasti", "predsednik", "kongres", "vrhovni-sud"], "pitanje": "Poveži granu vlasti sa telom koje je predstavlja u SAD.", "parovi": [["Izvršna vlast", "predsednik"], ["Zakonodavna vlast", "Kongres (Senat i Predstavnički dom)"], ["Sudska vlast", "Vrhovni sud"]], "pomoc": ["Zakone donosi skupština predstavnika.", "Predsednik sprovodi odluke.", "Iz lekcije: izvršna — predsednik; zakonodavna — Kongres; nadzor nad svim telima — Vrhovni sud."], "objasnjenje": "Predsednik je izvršna, Kongres zakonodavna, a Vrhovni sud sudska vlast.", "iz_udzbenika": {"strana": 44, "odeljak": "Uređenje Sjedinjenih Američkih Država", "tekst": "Izvršnu vlast ima predsednik, zakonodavnu Kongres, a sva tela su pod nadzorom Vrhovnog suda."}, "lekcija": 5}, {"id": "l05-sad-povezi-pojmovi", "vrsta": "povezi", "tezina": "srednje", "pojmovi": ["federacija", "ustav", "kongres", "parlamentarna-monarhija"], "pitanje": "Poveži pojam sa objašnjenjem.", "parovi": [["Federacija", "savez država sa samostalnim jedinicama"], ["Ustav", "najviši pravni akt zemlje"], ["Kongres", "američki parlament"], ["Parlamentarna monarhija", "vladar deli vlast sa parlamentom"]], "pomoc": ["Dva pojma su iz američkog, jedan iz britanskog uređenja, a jedan važi za svaku zemlju.", "Najviši zakon je …", "Iz lekcije: federacija — savez država; ustav — najviši pravni akt; kongres — američki parlament; parlamentarna monarhija — vladar deli vlast sa parlamentom."], "objasnjenje": "Pojmovi iz „?” kućica na str. 41 i 44.", "iz_udzbenika": {"strana": 44, "odeljak": "Definicije: federacija, ustav, kongres", "tekst": "Udžbenik objašnjava pojmove federacija, ustav, kongres i parlamentarna monarhija."}, "lekcija": 5}, {"id": "l05-sad-datum-ustav", "vrsta": "datum", "tezina": "lako", "pojmovi": ["ustav", "kongres"], "dogadjaj": "Ustav SAD", "pitanje": "Koje godine je Kongres doneo američki ustav?", "godina": 1787, "traka": "dogadjaji", "pomoc": ["Nekoliko godina posle mira u Parizu (1783).", "Dve godine pre izbora prvog predsednika (1789).", "Iz lekcije: Kongres je 1787. doneo američki ustav."], "objasnjenje": "Američki ustav donet je 1787; po njemu je 1789. izabran prvi predsednik.", "iz_udzbenika": {"strana": 44, "odeljak": "Uređenje Sjedinjenih Američkih Država", "tekst": "Kongres je 1787. doneo američki ustav."}, "lekcija": 5}, {"id": "l05-sad-datum-predsednik", "vrsta": "datum", "tezina": "srednje", "pojmovi": ["dzordz-vasington", "predsednik"], "dogadjaj": "Džordž Vašington, prvi predsednik SAD", "pitanje": "Koje godine je Džordž Vašington izabran za prvog predsednika SAD?", "godina": 1789, "traka": "vladari", "pomoc": ["Dve godine posle ustava (1787).", "Iste godine počinje i Francuska revolucija.", "Iz lekcije: Vašington je izabran 1789."], "objasnjenje": "Džordž Vašington postao je prvi predsednik SAD 1789.", "iz_udzbenika": {"strana": 44, "odeljak": "Uređenje Sjedinjenih Američkih Država", "tekst": "Za prvog američkog predsednika izabran je Džordž Vašington 1789."}, "lekcija": 5}, {"id": "l05-sad-datum-grad", "vrsta": "datum", "tezina": "tesko", "pojmovi": ["vasington-grad"], "dogadjaj": "Osnovan grad Vašington", "pitanje": "Koje godine je osnovan glavni grad SAD, Vašington?", "godina": 1800, "traka": "dogadjaji", "pomoc": ["Na samom prelazu iz XVIII u XIX vek.", "Okrugla godina.", "Iz lekcije: glavni grad SAD osnovan je 1800."], "objasnjenje": "Grad Vašington, glavni grad SAD, osnovan je 1800. i nazvan po prvom predsedniku.", "iz_udzbenika": {"strana": 44, "odeljak": "Uređenje Sjedinjenih Američkih Država", "tekst": "Glavni grad SAD, osnovan 1800, dobio je ime po Vašingtonu."}, "lekcija": 5}, {"id": "l05-sad-poredjaj-lekcija", "vrsta": "poredjaj", "tezina": "tesko", "pojmovi": ["gradjanski-rat-u-engleskoj", "slavna-revolucija", "bostonska-cajanka", "deklaracija-nezavisnosti", "ustav", "dzordz-vasington"], "pitanje": "Poređaj događaje iz cele lekcije od najranijeg.", "stavke": [{"tekst": "Građanski rat u Engleskoj", "godina": 1642, "do": 1649, "naziv": "Građanski rat u Engleskoj", "traka": "dogadjaji"}, {"tekst": "Slavna (Beskrvna) revolucija", "godina": 1688, "naziv": "Slavna revolucija", "traka": "dogadjaji"}, {"tekst": "Bostonska čajanka", "godina": 1773, "naziv": "Bostonska čajanka", "traka": "dogadjaji"}, {"tekst": "Deklaracija nezavisnosti", "godina": 1776, "naziv": "Deklaracija nezavisnosti", "traka": "dogadjaji"}, {"tekst": "Ustav SAD", "godina": 1787, "naziv": "Ustav SAD", "traka": "dogadjaji"}, {"tekst": "Vašington postaje prvi predsednik SAD", "godina": 1789, "naziv": "Džordž Vašington, prvi predsednik SAD", "traka": "vladari"}], "pomoc": ["Engleski događaji su u XVII veku, američki u XVIII.", "U Americi: povod, pa nezavisnost, pa uređenje države.", "Iz lekcije: 1642, 1688, 1773, 1776, 1787, 1789."], "objasnjenje": "Građanski rat (1642–1649) → Slavna revolucija (1688) → Bostonska čajanka (1773) → Deklaracija (1776) → ustav (1787) → Vašington predsednik (1789).", "iz_udzbenika": {"strana": 44, "odeljak": "Uređenje Sjedinjenih Američkih Država", "tekst": "Lekcija vodi od engleskog Građanskog rata do prvog američkog predsednika."}, "lekcija": 5}, {"id": "l05-sad-lanac-federacija", "vrsta": "lanac", "tezina": "srednje", "pojmovi": ["federacija", "ustav", "kongres"], "karike": ["Bivše kolonije postaju zasebne države", "?", "Kongres 1787. donosi američki ustav"], "praznina": 1, "odgovori": [{"tekst": "Ujedinjuju se u savez država — federaciju", "tacan": true}, {"tekst": "Ponovo postaju britanske kolonije", "tacan": false, "zasto": "Britanija je 1783. priznala njihovu nezavisnost."}, {"tekst": "Biraju zajedničkog kralja", "tacan": false, "zasto": "Nova država je republika — bez kralja."}], "pomoc": ["Male države su se udružile.", "Kako se zove savez država?", "Iz lekcije: bivše kolonije ujedinile su se u savez država (federaciju)."], "objasnjenje": "Zasebne države udružile su se u federaciju, a zajednički ustav dobile su 1787.", "iz_udzbenika": {"strana": 44, "odeljak": "Uređenje Sjedinjenih Američkih Država", "tekst": "Bivše kolonije ujedinile su se u federaciju; Kongres je 1787. doneo ustav."}, "osa": {"naziv": "Ustav SAD", "od": 1787, "traka": "dogadjaji"}, "lekcija": 5}, {"id": "l05-sad-lanac-pravo-glasa", "vrsta": "lanac", "tezina": "tesko", "pojmovi": ["pravo-glasa", "indijanci"], "karike": ["Pravo da biraju i budu birani imaju samo beli vlasnici zemlje", "?", "U politici SAD učestvuje samo manji deo stanovništva"], "praznina": 1, "odgovori": [{"tekst": "Siromašni belci, žene, crni robovi i Indijanci ostaju bez političkih prava", "tacan": true}, {"tekst": "Svi građani dobijaju pravo glasa", "tacan": false, "zasto": "Pravo glasa imali su samo beli zemljoposednici."}, {"tekst": "Vlast prelazi na britanskog kralja", "tacan": false, "zasto": "SAD su nezavisna republika."}], "pomoc": ["Korak 1: Ko sve NIJE beli zemljoposednik?", "Korak 2: Šta to znači za njihova prava?", "Iz lekcije: siromašni belci, žene, crni robovi i starosedeoci bili su lišeni političkih prava."], "objasnjenje": "Pošto su glasali samo beli zemljoposednici, većina ljudi bila je bez političkih prava — kao i u Britaniji, politika je bila stvar manjine.", "iz_udzbenika": {"strana": 44, "odeljak": "Uređenje Sjedinjenih Američkih Država", "tekst": "Samo beli zemljoposednici imali su pravo glasa, pa je u politici učestvovao manji deo stanovništva."}, "lekcija": 5}, {"id": "l05-sad-zakljuci-nadzor", "vrsta": "zakljuci", "tezina": "srednje", "pojmovi": ["podela-vlasti", "vrhovni-sud", "ustav"], "pitanje": "Zašto su tri grane vlasti u SAD nezavisne i nadziru jedna drugu?", "odgovori": [{"tekst": "Da nijedna ne bi zloupotrebila vlast i da se spreči kršenje ustava", "tacan": true}, {"tekst": "Da bi predsednik mogao da vlada doživotno", "tacan": false, "zasto": "Predsednik se bira na četiri godine; nadzor upravo ograničava moć."}, {"tekst": "Da bi britanski kralj lakše upravljao Amerikom", "tacan": false, "zasto": "SAD su nezavisne i nemaju kralja."}, {"tekst": "Da bi se ukinuli izbori", "tacan": false, "zasto": "Predsednik i Kongres se biraju na izborima."}], "pomoc": ["Korak 1: Šta bi se moglo desiti da jedna grana ima svu vlast?", "Korak 2: Šta grane međusobno sprečavaju?", "Iz lekcije: grane sarađuju, ali i nadziru jedna drugu i sprečavaju kršenje ustava."], "objasnjenje": "Podela i međusobni nadzor sprečavaju da se vlast skupi u jednim rukama i da se krši ustav — ideja Monteskjea.", "iz_udzbenika": {"strana": 44, "odeljak": "Uređenje Sjedinjenih Američkih Država", "tekst": "Tri grane vlasti sarađuju, ali i nadziru jedna drugu i sprečavaju kršenje ustava."}, "lekcija": 5}, {"id": "l05-sad-zakljuci-ustav-bez-vladara", "vrsta": "zakljuci", "tezina": "tesko", "pojmovi": ["ustav", "republika"], "pitanje": "Po čemu se ustav SAD razlikovao od ustava u državama zapadne Evrope?", "odgovori": [{"tekst": "Nije služio da ograniči moć vladara, jer vladara nije bilo — sve vlasti birali su građani", "tacan": true}, {"tekst": "Davao je kralju neograničenu vlast", "tacan": false, "zasto": "U SAD nije bilo kralja."}, {"tekst": "Davao je pravo glasa svim stanovnicima", "tacan": false, "zasto": "Pravo glasa imali su samo beli zemljoposednici."}, {"tekst": "Nije predviđao nikakvu podelu vlasti", "tacan": false, "zasto": "Predviđao je tri grane vlasti."}], "pomoc": ["Korak 1: Čemu su služili ustavi u evropskim monarhijama?", "Korak 2: Da li je u SAD postojao kralj ili car?", "Iz lekcije: ustav u SAD nije služio ograničavanju moći vladara jer vladara nije bilo."], "objasnjenje": "U Evropi je ustav ograničavao kralja; u SAD kralja nije bilo, pa je ustav uredio vlast koju biraju građani.", "iz_udzbenika": {"strana": 44, "odeljak": "Uređenje Sjedinjenih Američkih Država", "tekst": "Za razliku od zapadne Evrope, ustav u SAD nije služio ograničavanju moći vladara, jer vladara nije bilo."}, "lekcija": 5}, {"id": "l05-sad-zakljuci-jednakost", "vrsta": "zakljuci", "tezina": "tesko", "pojmovi": ["deklaracija-nezavisnosti", "pravo-glasa", "robovlasnistvo"], "pitanje": "Deklaracija kaže da su svi ljudi stvoreni jednaki. Koja suprotnost postoji između te ideje i stvarnog uređenja SAD?", "odgovori": [{"tekst": "Pravo glasa imali su samo beli zemljoposednici, a robovi, žene, siromašni i Indijanci bili su bez prava", "tacan": true}, {"tekst": "SAD su imale kralja koji je vladao po božjoj milosti", "tacan": false, "zasto": "SAD su republika bez kralja."}, {"tekst": "Predsednik je vladao doživotno", "tacan": false, "zasto": "Predsednik se birao na četiri godine."}, {"tekst": "Nema suprotnosti — svi su imali ista prava", "tacan": false, "zasto": "Većina stanovnika bila je lišena političkih prava, a postojalo je i ropstvo."}], "pomoc": ["Korak 1: Ko je imao pravo glasa?", "Korak 2: Da li su svi ljudi tada bili jednaki pred zakonom?", "Iz lekcije: samo beli vlasnici zemlje biraju i biraju se; žene, siromašni belci, robovi i Indijanci su bez političkih prava."], "objasnjenje": "Ideja jednakosti iz Deklaracije nije važila za sve: ropstvo je ostalo, a pravo glasa imala je samo manjina.", "iz_udzbenika": {"strana": 44, "odeljak": "Uređenje Sjedinjenih Američkih Država", "tekst": "Iako Deklaracija govori o jednakosti, pravo glasa imali su samo beli zemljoposednici."}, "lekcija": 5}, {"id": "l05-sad-ko-sam-vasington", "vrsta": "ko_sam", "tezina": "lako", "pojmovi": ["dzordz-vasington", "predsednik", "jorktaun"], "tragovi": ["Pre revolucije istakao sam se u britanskoj službi.", "Kao glavni zapovednik kolonista primorao sam Britance na predaju kod Jorktauna.", "Postao sam prvi predsednik SAD 1789, a po meni je nazvan glavni grad."], "odgovori": [{"tekst": "Džordž Vašington", "tacan": true}, {"tekst": "Tomas Džeferson", "tacan": false, "zasto": "Džeferson je sastavio Deklaraciju, nije vodio vojsku."}, {"tekst": "Oliver Kromvel", "tacan": false, "zasto": "Kromvel je vodio engleski parlament u XVII veku."}, {"tekst": "Čarls I", "tacan": false, "zasto": "Čarls I je engleski kralj iz XVII veka."}], "objasnjenje": "To je Džordž Vašington — zapovednik kolonista, prvi predsednik SAD.", "iz_udzbenika": {"strana": 44, "odeljak": "Uređenje Sjedinjenih Američkih Država", "tekst": "Vašington je, kao junak revolucije, 1789. izabran za prvog predsednika SAD.", "slika": "05-engleska-i-americka-revolucija/07-dzordz-vasington.jpg"}, "lekcija": 5}, {"id": "l05-sad-ko-sam-vasington-portret", "vrsta": "ko_sam", "slika_u_pitanju": true, "tezina": "srednje", "pojmovi": ["dzordz-vasington", "vasington-grad"], "tragovi": ["Na portretu iz udžbenika imam belu kosu i belu čipkastu maramu oko vrata.", "Kongres mi je poverio komandu nad vojskom pobunjenih kolonija.", "Glavni grad SAD, osnovan 1800, nosi moje ime."], "odgovori": [{"tekst": "Džordž Vašington", "tacan": true}, {"tekst": "Oliver Kromvel", "tacan": false, "zasto": "Kromvel je na portretu u oklopu, sa dugom tamnom kosom."}, {"tekst": "Tomas Džeferson", "tacan": false, "zasto": "Po Džefersonu nije nazvan glavni grad, niti je komandovao vojskom."}, {"tekst": "Volter", "tacan": false, "zasto": "Volter je francuski prosvetitelj."}], "objasnjenje": "Portret prikazuje Džordža Vašingtona, po kome je nazvan glavni grad SAD.", "iz_udzbenika": {"strana": 44, "odeljak": "Uređenje Sjedinjenih Američkih Država", "tekst": "Uz tekst o uređenju SAD nalazi se portret Džordža Vašingtona.", "slika": "05-engleska-i-americka-revolucija/07-dzordz-vasington.jpg"}, "lekcija": 5}, {"id": "l05-sad-uporedi-britanija-sad", "vrsta": "uporedi", "tezina": "srednje", "pojmovi": ["velika-britanija", "sjedinjene-americke-drzave", "pravo-glasa"], "a": "Velika Britanija (XVIII vek)", "b": "SAD (kraj XVIII veka)", "pitanje": "Na koju državu se odnosi tvrdnja?", "tvrdnje": [{"tekst": "Na čelu države je kralj.", "odgovor": "a", "zasto": "Velika Britanija je parlamentarna monarhija; SAD imaju predsednika."}, {"tekst": "Na čelu je predsednik biran na četiri godine.", "odgovor": "b", "zasto": "To je američko rešenje."}, {"tekst": "Članovi jednog doma parlamenta mesto nasleđuju.", "odgovor": "a", "zasto": "Dom lordova je nasledni; u SAD se biraju i predsednik i Kongres."}, {"tekst": "Samo manji deo stanovništva učestvuje u politici.", "odgovor": "oba", "zasto": "Lekcija izričito kaže: kao i u Velikoj Britaniji, i u SAD je u politici učestvovao manji deo stanovništva."}, {"tekst": "Parlament ima dva doma (tela).", "odgovor": "oba", "zasto": "Britanija: Gornji i Donji dom; SAD: Senat i Predstavnički dom."}, {"tekst": "Vladar vlada apsolutistički, bez ikakvog parlamenta.", "odgovor": "nijedan", "zasto": "Britanski kralj je posle 1689. vezan za parlament, a SAD nemaju vladara."}], "pomoc": ["Jedna država je monarhija, druga republika.", "Seti se šta lekcija kaže za pravo glasa u obe zemlje.", "Iz lekcije: Britanija — kralj, nasledni Dom lordova; SAD — predsednik na 4 godine; u obe mali deo stanovništva glasa."], "objasnjenje": "Britanija je parlamentarna monarhija, SAD republika; obe imaju dvodomni parlament i u obe politiku vodi manjina.", "iz_udzbenika": {"strana": 44, "odeljak": "Uređenje Sjedinjenih Američkih Država", "tekst": "Kao i u Velikoj Britaniji, u politici SAD je krajem XVIII i u prvoj polovini XIX veka učestvovao manji deo stanovništva."}, "lekcija": 5}, {"id": "l05-sad-uporedi-grane", "vrsta": "uporedi", "tezina": "tesko", "pojmovi": ["predsednik", "kongres", "podela-vlasti"], "a": "Izvršna vlast (predsednik)", "b": "Zakonodavna vlast (Kongres)", "pitanje": "Na koju granu vlasti u SAD se odnosi tvrdnja?", "tvrdnje": [{"tekst": "Bira se na četiri godine i ima je jedna osoba.", "odgovor": "a", "zasto": "Predsednik se bira na četiri godine."}, {"tekst": "Sastoji se od Senata i Predstavničkog doma.", "odgovor": "b", "zasto": "To su dva tela Kongresa."}, {"tekst": "Biraju je građani na izborima.", "odgovor": "oba", "zasto": "I predsednika i članove Kongresa birali su građani."}, {"tekst": "Pod nadzorom je Vrhovnog suda.", "odgovor": "oba", "zasto": "Sva tela vlasti bila su pod nadzorom Vrhovnog suda."}, {"tekst": "Mesto se nasleđuje po rođenju.", "odgovor": "nijedan", "zasto": "U SAD se ništa ne nasleđuje — sve se bira."}], "pomoc": ["Jedna grana je jedan čovek, druga skupština.", "Obe su izborne i obe nadzire sud.", "Iz lekcije: predsednik na 4 godine; Kongres — Senat i Predstavnički dom; sve biraju građani i nadzire Vrhovni sud."], "objasnjenje": "Predsednik i Kongres su različite grane, ali obe biraju građani i obe nadzire Vrhovni sud.", "iz_udzbenika": {"strana": 44, "odeljak": "Uređenje Sjedinjenih Američkih Država", "tekst": "Predsednika i članove Kongresa birali su građani, a sva tela vlasti nadzirao je Vrhovni sud."}, "lekcija": 5}, {"id": "l05-sad-objasni-ustav", "vrsta": "objasni", "tezina": "lako", "pojmovi": ["ustav", "republika", "podela-vlasti"], "pitanje": "Šta je ustav i šta je uredio ustav SAD iz 1787?", "uzor": "Ustav je najviši pravni akt jedne zemlje. Američki ustav iz 1787. uredio je SAD kao republiku i podelio vlast na tri grane: izvršnu (predsednik), zakonodavnu (Kongres) i sudsku (Vrhovni sud).", "ideje": ["Ustav je najviši pravni akt.", "Donet je 1787.", "SAD su republika.", "Podela vlasti na izvršnu, zakonodavnu i sudsku."], "objasnjenje": "Ustav SAD je temelj republike i podele vlasti.", "iz_udzbenika": {"strana": 44, "odeljak": "Uređenje Sjedinjenih Američkih Država", "tekst": "Kongres je 1787. doneo ustav: SAD su republika sa podelom vlasti na tri grane."}, "lekcija": 5}, {"id": "l05-sad-objasni-podela", "vrsta": "objasni", "tezina": "srednje", "pojmovi": ["podela-vlasti", "predsednik", "kongres", "vrhovni-sud"], "pitanje": "Objasni kako je bila podeljena vlast u SAD i zašto je to važno.", "uzor": "Izvršnu vlast imao je predsednik biran na četiri godine, zakonodavnu Kongres (Senat i Predstavnički dom), a sva tela vlasti nadzirao je Vrhovni sud. Svaka grana je nezavisna; grane sarađuju, ali se i nadziru, pa nijedna ne može da zloupotrebi vlast i krši ustav.", "ideje": ["Izvršna vlast — predsednik (4 godine).", "Zakonodavna — Kongres (Senat i Predstavnički dom).", "Vrhovni sud nadzire sva tela vlasti.", "Grane se međusobno nadziru i sprečavaju kršenje ustava."], "objasnjenje": "Podela vlasti po Monteskjeovoj ideji sprečava da se moć skupi u jednim rukama.", "iz_udzbenika": {"strana": 44, "odeljak": "Uređenje Sjedinjenih Američkih Država", "tekst": "Predsednik, Kongres i Vrhovni sud su nezavisni, sarađuju i nadziru jedni druge."}, "lekcija": 5}, {"id": "l05-sad-objasni-ucesce", "vrsta": "objasni", "tezina": "tesko", "pojmovi": ["pravo-glasa", "velika-britanija", "sjedinjene-americke-drzave"], "pitanje": "Uporedi ko je mogao da učestvuje u politici u SAD i u Velikoj Britaniji krajem XVIII veka.", "uzor": "U SAD je pravo da bira i bude biran imao samo beli vlasnik zemlje; siromašni belci, žene, crni robovi i Indijanci nisu imali političkih prava. U Velikoj Britaniji je pravo glasa takođe imao samo mali deo stanovništva, a članovi Gornjeg doma mesto su nasleđivali. Dakle, u obe zemlje u politici je učestvovala manjina, iako SAD nisu imale kralja i nasledne lordove.", "ideje": ["SAD: pravo glasa samo beli zemljoposednici.", "Bez prava: siromašni belci, žene, robovi, Indijanci.", "Britanija: mali deo stanovništva glasa; nasledni Gornji dom.", "Zaključak: u obe zemlje politiku vodi manjina."], "objasnjenje": "Iako su uređenja različita, ni u jednoj zemlji većina ljudi nije učestvovala u politici.", "iz_udzbenika": {"strana": 44, "odeljak": "Uređenje Sjedinjenih Američkih Država", "tekst": "Kao i u Velikoj Britaniji, u politici SAD učestvovao je samo manji deo stanovništva."}, "lekcija": 5}]}, {"naslov": "6. Uvod", "zadaci": [{"id": "l06-uvod-izbor-tri-staleza", "vrsta": "izbor", "tezina": "lako", "pojmovi": ["stalezi", "francuska"], "pitanje": "Na koliko staleža je bilo podeljeno francusko društvo u XVIII veku?", "odgovori": [{"tekst": "Na tri", "tacan": true}, {"tekst": "Na dva", "tacan": false, "zasto": "Pored sveštenstva i plemstva postojao je i Treći stalež — svi ostali."}, {"tekst": "Na pet", "tacan": false, "zasto": "Staleža je bilo tri; građanstvo, seljaci i zanatlije bili su zajedno u Trećem staležu."}, {"tekst": "Društvo nije bilo podeljeno na staleže", "tacan": false, "zasto": "Bilo je — upravo razlike među staležima dovele su do revolucije."}], "pomoc": ["Seti se brojeva u nazivima: Prvi, Drugi, …", "Poslednji stalež okuplja sve koji nisu sveštenici ni plemići.", "Iz lekcije: sveštenstvo, plemstvo i Treći stalež."], "objasnjenje": "Francusko društvo XVIII veka delilo se na tri staleža — sveštenstvo, plemstvo i Treći stalež.", "iz_udzbenika": {"strana": 46, "odeljak": "Uvod", "tekst": "U XVIII veku francusko društvo je bilo podeljeno na tri staleža: sveštenstvo, plemstvo i Treći stalež."}, "lekcija": 6}, {"id": "l06-uvod-tn-pobuna", "vrsta": "tacno_netacno", "tezina": "lako", "pojmovi": ["treci-stalez", "francuska-revolucija"], "tvrdnja": "Francusku revoluciju pokrenula je pobuna Trećeg staleža.", "tacno": true, "pomoc": ["Koji stalež je bio najbrojniji i najviše opterećen?", "Iz lekcije: razlike među staležima dovele su do pobune jednog od njih krajem XVIII veka."], "objasnjenje": "Tačno — razlike u bogatstvu, pravima i obavezama dovele su do pobune Trećeg staleža, kojom je počela revolucija.", "iz_udzbenika": {"strana": 46, "odeljak": "Uvod", "tekst": "Razlike među staležima krajem XVIII veka dovele su do pobune Trećeg staleža, koja je pokrenula revoluciju."}, "lekcija": 6}, {"id": "l06-uvod-izbor-karikatura", "vrsta": "izbor", "slika_u_pitanju": true, "tezina": "lako", "pojmovi": ["treci-stalez", "seljastvo", "stalezi"], "pitanje": "Pogledaj karikaturu. Koji stalež predstavlja starac u skromnoj odeći koji na leđima nosi drugu dvojicu?", "odgovori": [{"tekst": "Treći stalež (seljaka)", "tacan": true}, {"tekst": "Prvi stalež (sveštenstvo)", "tacan": false, "zasto": "Sveštenik je jedan od dvojice koje starac nosi — Prvi stalež nije plaćao porez."}, {"tekst": "Drugi stalež (plemstvo)", "tacan": false, "zasto": "Plemić sa perjem i mačem sedi na leđima — on ne nosi teret, nego ga nose."}, {"tekst": "Kralja", "tacan": false, "zasto": "Karikatura prikazuje staleže, a starac sa motikom je seljak, ne kralj."}], "pomoc": ["Pogledaj odeću i alat koji starac drži.", "Ko je radio zemlju i plaćao poreze i dažbine?", "Iz lekcije: samo Treći stalež je plaćao poreze — on „nosi” ostala dva."], "objasnjenje": "Starac sa motikom je seljak iz Trećeg staleža; na leđima nosi sveštenika i plemića, koji ne plaćaju poreze.", "iz_udzbenika": {"strana": 46, "odeljak": "Uvod", "tekst": "Karikatura prikazuje lik koji na leđima nosi preostalu dvojicu; staleže treba prepoznati po odeći i nakitu.", "slika": "06-francuska-revolucija/01-karikatura-tri-staleza.jpg"}, "lekcija": 6}, {"id": "l06-uvod-zakljuci-simbolika", "vrsta": "zakljuci", "slika_u_pitanju": true, "tezina": "srednje", "pojmovi": ["treci-stalez", "prvi-stalez", "drugi-stalez", "porezi"], "pitanje": "Šta je autor karikature hteo da poruči time što jedan lik nosi druga dvojicu?", "odgovori": [{"tekst": "Da Treći stalež svojim radom i porezima izdržava sveštenstvo i plemstvo", "tacan": true}, {"tekst": "Da sveštenstvo i plemstvo pomažu seljacima u radu", "tacan": false, "zasto": "Na slici je obrnuto — seljak nosi njih, a oni samo sede."}, {"tekst": "Da su sva tri staleža bila ravnopravna", "tacan": false, "zasto": "Da su ravnopravni, niko ne bi nosio druge; karikatura pokazuje nepravdu."}, {"tekst": "Da je seljak bio najbogatiji stalež", "tacan": false, "zasto": "Seljak je u skromnoj odeći i pogrbljen — bogati su oni na njegovim leđima."}], "pomoc": ["Korak 1: Ko na slici radi, a ko se odmara?", "Korak 2: Ko je plaćao poreze, a ko je bio oslobođen?", "Iz lekcije: Treći stalež plaća poreze, a Prvi i Drugi žive od dažbina seljaka."], "objasnjenje": "Karikatura pokazuje nepravdu — Treći stalež plaća poreze i dažbine i tako „nosi” sveštenstvo i plemstvo.", "iz_udzbenika": {"strana": 46, "odeljak": "Uvod", "tekst": "Karikatura simbolično prikazuje podelu društva na staleže: jedan lik nosi preostalu dvojicu.", "slika": "06-francuska-revolucija/01-karikatura-tri-staleza.jpg"}, "lekcija": 6}, {"id": "l06-uvod-izvor-karikatura", "vrsta": "izvor", "slika_u_pitanju": true, "tezina": "tesko", "pojmovi": ["prvi-stalez", "drugi-stalez", "svestenstvo", "plemstvo"], "izvor": {"autor": "Karikatura iz doba revolucije", "naslov": "Podela francuskog društva na staleže (opis slike)", "tekst": "Pogrbljeni starac u jednostavnoj odeći, oslonjen na motiku, nosi na leđima dvojicu: jednog u crkvenoj odeždi i jednog u raskošnom odelu, sa perjanicom na šeširu i mačem o boku. Oko starčevih nogu su ptice, zec i kupus.", "napomena": "Opis slike je prepričan; udžbenik, str. 46."}, "pitanje": "Kojim staležima pripadaju dvojica koje starac nosi?", "odgovori": [{"tekst": "Lik u crkvenoj odeždi Prvom, a lik sa perjem i mačem Drugom staležu", "tacan": true}, {"tekst": "Obojica pripadaju Trećem staležu", "tacan": false, "zasto": "Treći stalež je starac koji ih nosi; oni su povlašćeni staleži."}, {"tekst": "Lik sa perjem i mačem je sveštenik, a drugi plemić", "tacan": false, "zasto": "Mač i perjanica su znaci plemića, a odežda sveštenika — ne obrnuto."}, {"tekst": "Obojica su kraljevi", "tacan": false, "zasto": "Karikatura govori o staležima — sveštenstvu i plemstvu."}], "pomoc": ["Ko nosi mač i perje — vojnik-plemić ili sveštenik?", "Prvi stalež su sveštenici, Drugi plemići.", "Iz lekcije: Prvi stalež = rimokatoličko sveštenstvo, Drugi = plemstvo."], "objasnjenje": "Odežda otkriva sveštenika (Prvi stalež), a mač i perjanica plemića (Drugi stalež); obojicu nosi seljak iz Trećeg staleža.", "iz_udzbenika": {"strana": 46, "odeljak": "Uvod", "tekst": "Udžbenik traži da se po odeći i nakitu prepoznaju staleži na karikaturi.", "slika": "06-francuska-revolucija/01-karikatura-tri-staleza.jpg"}, "lekcija": 6}, {"id": "l06-uvod-dopuni-sastav-treceg", "vrsta": "dopuni", "tezina": "srednje", "pojmovi": ["treci-stalez", "gradjanstvo", "seljastvo"], "pitanje": "Dopuni rečenicu o Trećem staležu.", "tekst": "Treći stalež činili su {{građanstvo|građani|buržoazija}}, {{seljaci|seljaštvo}}, zanatlije i ostali.", "ponudjene": ["građanstvo", "seljaci", "plemići", "sveštenici"], "pomoc": ["Treći stalež su svi koji nisu ni sveštenici ni plemići.", "Jedna grupa živi u gradovima, druga obrađuje zemlju.", "Iz lekcije: građanstvo, seljaci, zanatlije i ostali."], "objasnjenje": "Treći stalež su činili svi koji nisu bili sveštenici ni plemići — građanstvo, seljaci, zanatlije i ostali.", "iz_udzbenika": {"strana": 46, "odeljak": "Uvod", "tekst": "Treći stalež su činili građanstvo, seljaci, zanatlije i ostali."}, "lekcija": 6}, {"id": "l06-uvod-objasni-razlike", "vrsta": "objasni", "tezina": "srednje", "pojmovi": ["stalezi", "treci-stalez", "francuska-revolucija"], "pitanje": "Objasni kako su razlike među staležima dovele do Francuske revolucije.", "uzor": "Staleži su se razlikovali po bogatstvu, pravima i obavezama prema državi. Sveštenstvo i plemstvo nisu plaćali porez i imali su povlastice, a Treći stalež, najbrojniji, nosio je sve obaveze. Zbog te nepravde Treći stalež se krajem XVIII veka pobunio i pokrenuo revoluciju.", "ideje": ["Staleži se razlikuju po bogatstvu, pravima i obavezama.", "Prvi i Drugi stalež imaju povlastice i ne plaćaju porez.", "Treći stalež nosi teret i nezadovoljan je.", "Pobuna Trećeg staleža pokreće revoluciju."], "objasnjenje": "Nejednakost staleža u pravima i obavezama izazvala je nezadovoljstvo i pobunu Trećeg staleža.", "iz_udzbenika": {"strana": 46, "odeljak": "Uvod", "tekst": "Razlike u bogatstvu, pravima i obavezama prema državi dovele su do pobune Trećeg staleža."}, "lekcija": 6}]}, {"naslov": "6. Uzroci revolucije", "zadaci": [{"id": "l06-uzr-izbor-prvi-stalez", "vrsta": "izbor", "tezina": "lako", "pojmovi": ["prvi-stalez", "svestenstvo"], "pitanje": "Ko je činio Prvi stalež?", "odgovori": [{"tekst": "Rimokatoličko sveštenstvo", "tacan": true}, {"tekst": "Plemstvo", "tacan": false, "zasto": "Plemstvo je bilo Drugi stalež."}, {"tekst": "Građanstvo", "tacan": false, "zasto": "Građanstvo je pripadalo Trećem staležu."}, {"tekst": "Seljaštvo", "tacan": false, "zasto": "Seljaci su bili deo Trećeg staleža."}], "pomoc": ["Prvi stalež je bio vezan za crkvu.", "U Francuskoj je preovladavala katolička vera.", "Iz lekcije: Prvi stalež — rimokatoličko sveštenstvo."], "objasnjenje": "Prvi stalež je činilo rimokatoličko sveštenstvo.", "iz_udzbenika": {"strana": 46, "odeljak": "Uzroci revolucije", "tekst": "Prvi stalež činilo je rimokatoličko sveštenstvo, Drugi plemstvo, a Treći svi ostali."}, "lekcija": 6}, {"id": "l06-uzr-povezi-stalezi", "vrsta": "povezi", "tezina": "lako", "pojmovi": ["prvi-stalez", "drugi-stalez", "treci-stalez", "svestenstvo", "plemstvo", "gradjanstvo"], "pitanje": "Poveži stalež sa onima koji su ga činili.", "parovi": [["Prvi stalež", "rimokatoličko sveštenstvo"], ["Drugi stalež", "plemstvo"], ["Treći stalež", "građanstvo, seljaštvo i ostali"]], "pomoc": ["Crkva je bila na prvom mestu.", "Plemići su odmah posle sveštenika.", "Iz lekcije: Prvi — sveštenstvo, Drugi — plemstvo, Treći — svi ostali."], "objasnjenje": "Prvi stalež — sveštenstvo, Drugi — plemstvo, Treći — svi ostali, pre svega građanstvo i seljaštvo.", "iz_udzbenika": {"strana": 46, "odeljak": "Uzroci revolucije", "tekst": "Stanovništvo Francuske se delilo na tri staleža: sveštenstvo, plemstvo i sve ostale."}, "lekcija": 6}, {"id": "l06-uzr-datum-luj-xvi", "vrsta": "datum", "tezina": "srednje", "pojmovi": ["luj-xvi"], "dogadjaj": "Vladavina Luja XVI", "pitanje": "Od koje do koje godine je vladao francuski kralj Luj XVI?", "od": 1774, "do": 1792, "traka": "vladari", "pomoc": ["Zbačen je iste godine kad je proglašena republika.", "Počeo je da vlada petnaestak godina pre revolucije.", "Iz lekcije: Luj XVI (1774–1792)."], "objasnjenje": "Luj XVI je vladao od 1774. do 1792, kada je zbačen sa prestola.", "iz_udzbenika": {"strana": 46, "odeljak": "Uzroci revolucije", "tekst": "Kralj Luj XVI vladao je 1774–1792.", "slika": "06-francuska-revolucija/02-luj-xvi.jpg"}, "lekcija": 6}, {"id": "l06-uzr-izbor-procenat", "vrsta": "izbor", "tezina": "srednje", "pojmovi": ["treci-stalez"], "pitanje": "Koliki deo stanovništva Francuske je pripadao Trećem staležu?", "odgovori": [{"tekst": "Više od 90%", "tacan": true}, {"tekst": "Oko polovine", "tacan": false, "zasto": "Mnogo više — sveštenstvo i plemstvo zajedno bili su sasvim mala manjina."}, {"tekst": "Oko 10%", "tacan": false, "zasto": "Toliko su otprilike bila prva dva staleža zajedno; Treći je bio ogromna većina."}, {"tekst": "Tačno trećina", "tacan": false, "zasto": "Tri staleža nisu bila jednako brojna — Treći je bio daleko najbrojniji."}], "pomoc": ["Treći stalež su „svi ostali”.", "Sveštenika i plemića bilo je malo.", "Iz lekcije: Treći stalež je činio više od 90% stanovništva."], "objasnjenje": "Treći stalež je činio više od 90% stanovništva — ogromnu većinu.", "iz_udzbenika": {"strana": 46, "odeljak": "Uzroci revolucije", "tekst": "Pripadnici Trećeg staleža činili su više od 90% stanovništva Francuske."}, "lekcija": 6}, {"id": "l06-uzr-tn-porez", "vrsta": "tacno_netacno", "tezina": "lako", "pojmovi": ["treci-stalez", "porezi", "prvi-stalez", "drugi-stalez"], "tvrdnja": "Sva tri staleža u Francuskoj plaćala su poreze jednako.", "tacno": false, "ispravke": [{"tekst": "Poreze je plaćao samo Treći stalež; Prvi i Drugi bili su oslobođeni.", "tacan": true}, {"tekst": "Poreze su plaćali samo sveštenici.", "tacan": false, "zasto": "Sveštenstvo je, naprotiv, bilo oslobođeno poreza."}, {"tekst": "Porez je plaćalo samo plemstvo, jer je bilo najbogatije.", "tacan": false, "zasto": "Plemstvo je bilo oslobođeno poreza i živelo je od dažbina seljaka."}], "pomoc": ["Seti se karikature — ko koga nosi?", "Povlašćeni staleži su imali posebna prava.", "Iz lekcije: Treći stalež je plaćao poreze, a prvi i drugi su bili oslobođeni."], "objasnjenje": "Netačno — porez je plaćao samo Treći stalež, dok su sveštenstvo i plemstvo bili oslobođeni.", "iz_udzbenika": {"strana": 46, "odeljak": "Uzroci revolucije", "tekst": "Treći stalež je plaćao poreze, dok su prvi i drugi bili toga oslobođeni."}, "lekcija": 6}, {"id": "l06-uzr-izbor-prihodi-plemstva", "vrsta": "izbor", "tezina": "srednje", "pojmovi": ["prvi-stalez", "drugi-stalez", "seljastvo"], "pitanje": "Od čega su živeli Prvi i Drugi stalež?", "odgovori": [{"tekst": "Od velikih zemljišnih poseda, sa kojih su ubirali dažbine od seljaka", "tacan": true}, {"tekst": "Od plata koje im je isplaćivala država", "tacan": false, "zasto": "Lekcija kaže da su živeli od svojih poseda i dažbina seljaka."}, {"tekst": "Od rada u fabrikama", "tacan": false, "zasto": "U fabrikama su radili radnici; sveštenici i plemići nisu."}, {"tekst": "Od trgovine sa kolonijama", "tacan": false, "zasto": "Trgovinom i bankarstvom bavilo se građanstvo, a ne povlašćeni staleži."}], "pomoc": ["Šta su posedovali sveštenstvo i plemstvo?", "Ko je obrađivao njihovu zemlju?", "Iz lekcije: živeli su od velikih zemljišnih poseda i dažbina seljaštva."], "objasnjenje": "Sveštenstvo i plemstvo živeli su od velikih zemljišnih poseda, sa kojih su ubirali dažbine od seljaka.", "iz_udzbenika": {"strana": 46, "odeljak": "Uzroci revolucije", "tekst": "Prvi i Drugi stalež živeli su od velikih zemljišnih poseda, sa kojih su ubirali dažbine od seljaštva."}, "lekcija": 6}, {"id": "l06-uzr-izbor-uzroci", "vrsta": "izbor", "tezina": "srednje", "pojmovi": ["apsolutisticka-monarhija", "versaj", "velika-britanija", "prosvetiteljstvo", "americka-revolucija"], "pitanje": "Šta je od navedenog bio uzrok Francuske revolucije? (više tačnih)", "odgovori": [{"tekst": "Ogromni troškovi kraljevskog dvora u Versaju", "tacan": true}, {"tekst": "Zaostajanje Francuske za Velikom Britanijom u privredi, trgovini i bankarstvu", "tacan": true}, {"tekst": "Ideje prosvetiteljstva među građanstvom", "tacan": true}, {"tekst": "Uspeh Američke revolucije", "tacan": true}, {"tekst": "Napad Pruske na Francusku", "tacan": false, "zasto": "Rat sa Pruskom počinje tek 1792, i to tako što su ga revolucionari objavili."}, {"tekst": "Pogubljenje kralja", "tacan": false, "zasto": "Kralj je pogubljen 1793 — to je posledica revolucije, a ne uzrok."}], "pomoc": ["Traži stvari koje su se desile PRE 1789.", "Uzroci su bili i privredni (novac), i idejni (knjige), i primer iz sveta.", "Iz lekcije: troškovi dvora, zaostajanje za Britanijom, prosvetiteljstvo, Američka revolucija."], "objasnjenje": "Kriza je imala više uzroka — rasipnički dvor, slabiju privredu od britanske, prosvetiteljske ideje i ohrabrujući primer Američke revolucije.", "iz_udzbenika": {"strana": 46, "odeljak": "Uzroci revolucije", "tekst": "Troškovi dvora u Versaju bili su ogromni, Francuska je zaostajala za Britanijom, a građanstvo su podstakle prosvetiteljske ideje i uspeh Američke revolucije."}, "lekcija": 6}, {"id": "l06-uzr-tn-luj-xiv", "vrsta": "tacno_netacno", "tezina": "srednje", "pojmovi": ["luj-xiv", "apsolutisticka-monarhija"], "tvrdnja": "Kriza apsolutističke monarhije u Francuskoj snažno se osećala još za vreme Luja XIV.", "tacno": false, "ispravke": [{"tekst": "Kriza se snažno osećala u vreme naslednika Luja XIV.", "tacan": true}, {"tekst": "Kriza je počela tek posle pada Bastilje.", "tacan": false, "zasto": "Kriza je bila uzrok revolucije, pa je postojala pre pada Bastilje."}, {"tekst": "Kriza se osećala samo u Velikoj Britaniji.", "tacan": false, "zasto": "Britanija je bila napredniji uzor; reč je o krizi u Francuskoj."}], "pomoc": ["Pročitaj prvu rečenicu odeljka o uzrocima.", "Luj XVI nije neposredno nasledio Luja XIV, ali je jedan od njegovih naslednika.", "Iz lekcije: kriza se snažno osećala u vreme naslednika Luja XIV."], "objasnjenje": "Netačno — kriza se snažno osetila tek kod naslednika Luja XIV.", "iz_udzbenika": {"strana": 46, "odeljak": "Uzroci revolucije", "tekst": "U vreme naslednika Luja XIV u Francuskoj se snažno osećala kriza apsolutističke monarhije."}, "lekcija": 6}, {"id": "l06-uzr-dopuni-burzoazija", "vrsta": "dopuni", "tezina": "lako", "pojmovi": ["burzoazija", "gradjanstvo"], "pitanje": "Dopuni.", "tekst": "Drugi naziv za građanstvo je {{buržoazija}}.", "ponudjene": ["buržoazija", "plemstvo", "sveštenstvo", "seljaštvo"], "pomoc": ["Reč dolazi iz francuskog i znači „građani”.", "Počinje na slovo B.", "Iz lekcije: buržoazija — drugi naziv za građanstvo."], "objasnjenje": "Buržoazija je drugi naziv za građanstvo.", "iz_udzbenika": {"strana": 46, "odeljak": "Definicije („?\" kućice)", "tekst": "Buržoazija je drugi naziv za građanstvo."}, "lekcija": 6}, {"id": "l06-uzr-izbor-trazi-gradjanstvo", "vrsta": "izbor", "tezina": "srednje", "pojmovi": ["gradjanstvo", "prosvetiteljstvo"], "pitanje": "Šta je tražio obrazovaniji i bogatiji deo građanstva?", "odgovori": [{"tekst": "Učešće u državnoj vlasti i društvene reforme", "tacan": true}, {"tekst": "Da postane deo plemstva i prestane da plaća porez", "tacan": false, "zasto": "Tražili su promenu sistema — učešće u vlasti i reforme, ne lične titule."}, {"tekst": "Povratak na vladavinu Luja XIV", "tacan": false, "zasto": "Kriza je počela upravo posle Luja XIV; građanstvo je tražilo promene, ne povratak."}, {"tekst": "Da kralj dobije još više vlasti", "tacan": false, "zasto": "Prosvetitelji su kritikovali apsolutizam; građanstvo je htelo deo vlasti za sebe."}], "pomoc": ["Na šta su ih podstakle ideje prosvetitelja?", "Imali su novac i obrazovanje, ali ne i vlast.", "Iz lekcije: zahtevali su učešće u državnoj vlasti i društvene reforme."], "objasnjenje": "Obrazovano i bogato građanstvo, podstaknuto prosvetiteljstvom, tražilo je učešće u vlasti i reforme.", "iz_udzbenika": {"strana": 46, "odeljak": "Uzroci revolucije", "tekst": "Obrazovani i bogatiji deo građanstva, podstaknut idejama prosvetiteljstva, zahtevao je učešće u vlasti i društvene reforme."}, "lekcija": 6}, {"id": "l06-uzr-zakljuci-amerika", "vrsta": "zakljuci", "tezina": "tesko", "pojmovi": ["americka-revolucija", "burzoazija", "francuska"], "pitanje": "Zašto je baš uspeh Američke revolucije posebno ohrabrio francusku buržoaziju?", "odgovori": [{"tekst": "Francuska je i sama pomogla Amerikancima, pa su Francuzi videli da se ideje slobode mogu ostvariti", "tacan": true}, {"tekst": "Amerikanci su obećali da će napasti francuskog kralja", "tacan": false, "zasto": "Lekcija o tome ništa ne kaže; Francuska je pomagala Amerikancima, a ne obrnuto."}, {"tekst": "Američka revolucija se desila u Parizu", "tacan": false, "zasto": "Desila se u Severnoj Americi — zato je bila primer izdaleka."}, {"tekst": "Posle nje je Luj XVI sam ukinuo staleže", "tacan": false, "zasto": "Staleže je ukinula tek revolucija u Francuskoj, ne kralj."}], "pomoc": ["Korak 1: Ko je pomogao uspeh Američke revolucije?", "Korak 2: Šta Francuzi mogu da zaključe kad vide da je pobuna protiv vlasti uspela?", "Iz lekcije: uspeh Američke revolucije, kojoj je doprinela Francuska, ohrabrio je buržoaziju."], "objasnjenje": "Francuska je doprinela uspehu Američke revolucije; buržoazija je videla da pobuna u ime slobode može da uspe — i to ju je ohrabrilo.", "iz_udzbenika": {"strana": 46, "odeljak": "Uzroci revolucije", "tekst": "Uspešan ishod Američke revolucije, kojoj je doprinela upravo Francuska, dodatno je ohrabrio buržoaziju."}, "lekcija": 6}, {"id": "l06-uzr-tn-luj-reforme", "vrsta": "tacno_netacno", "tezina": "lako", "pojmovi": ["luj-xvi"], "tvrdnja": "Luj XVI je pokušao da sprovede neke reforme, ali je bio neodlučan i nesposoban vladar.", "tacno": true, "pomoc": ["Seti se kako udžbenik opisuje Luja XVI.", "Iz lekcije: pokušao je reforme, ali se pokazao neodlučnim i nesposobnim."], "objasnjenje": "Tačno — Luj XVI je pokušao reforme, ali nije umeo da ih sprovede.", "iz_udzbenika": {"strana": 46, "odeljak": "Uzroci revolucije", "tekst": "Luj XVI pokušao je da izvrši određene reforme, ali se pokazao kao neodlučan i nesposoban vladar.", "slika": "06-francuska-revolucija/02-luj-xvi.jpg"}, "lekcija": 6}, {"id": "l06-uzr-uporedi-stalezi", "vrsta": "uporedi", "tezina": "srednje", "pojmovi": ["treci-stalez", "prvi-stalez", "drugi-stalez", "porezi"], "a": "Prvi i Drugi stalež", "b": "Treći stalež", "pitanje": "Na koga se odnosi tvrdnja — na Prvi i Drugi stalež, na Treći stalež, na sve ili ni na jedan?", "tvrdnje": [{"tekst": "Plaćao je poreze.", "odgovor": "b", "zasto": "Samo Treći stalež je plaćao poreze."}, {"tekst": "Bio je oslobođen poreza.", "odgovor": "a", "zasto": "Sveštenstvo i plemstvo nisu plaćali porez."}, {"tekst": "Činio je više od 90% stanovništva.", "odgovor": "b", "zasto": "Treći stalež je bio ogromna većina."}, {"tekst": "Ubirao je dažbine od seljaka sa velikih poseda.", "odgovor": "a", "zasto": "Sveštenstvo i plemstvo su živeli od dažbina sa svojih poseda."}, {"tekst": "U njega je spadalo i građanstvo.", "odgovor": "b", "zasto": "Građanstvo je bilo deo Trećeg staleža."}, {"tekst": "Bio je deo francuskog društva u XVIII veku.", "odgovor": "oba", "zasto": "Sva tri staleža činila su francusko društvo."}, {"tekst": "Imao je pravo da sam bira kralja.", "odgovor": "nijedan", "zasto": "Francuska je bila apsolutistička monarhija — kralj je vlast nasleđivao."}], "pomoc": ["Ko plaća, a ko ubira?", "Povlašćeni su bili malobrojni.", "Iz lekcije: Treći stalež (90%+) plaća poreze; Prvi i Drugi su oslobođeni i žive od poseda."], "objasnjenje": "Povlašćeni staleži (sveštenstvo, plemstvo) nisu plaćali porez i živeli su od dažbina, a Treći stalež, ogromna većina, plaćao je poreze.", "iz_udzbenika": {"strana": 46, "odeljak": "Uzroci revolucije", "tekst": "Treći stalež je plaćao poreze, dok su prvi i drugi bili oslobođeni i živeli od zemljišnih poseda."}, "lekcija": 6}, {"id": "l06-uzr-lanac-nezadovoljstvo", "vrsta": "lanac", "tezina": "srednje", "pojmovi": ["treci-stalez", "porezi", "francuska-revolucija"], "karike": ["Samo Treći stalež plaća poreze, a povlašćeni žive od njegovih dažbina", "?", "Pobuna Trećeg staleža pokreće revoluciju"], "praznina": 1, "odgovori": [{"tekst": "Raste nezadovoljstvo najbrojnijeg staleža nejednakošću", "tacan": true}, {"tekst": "Treći stalež postaje najbogatiji", "tacan": false, "zasto": "Plaćao je sve poreze i dažbine, pa nije mogao postati najbogatiji."}, {"tekst": "Kralj ukida sve poreze", "tacan": false, "zasto": "Kralj je, naprotiv, tražio nove poreze jer mu je blagajna bila prazna."}], "pomoc": ["Kako se oseća neko ko nosi sav teret?", "Pobuna dolazi iz nezadovoljstva.", "Iz lekcije: razlike u pravima i obavezama dovele su do pobune Trećeg staleža."], "objasnjenje": "Nejednakost u porezima i pravima izazvala je nezadovoljstvo Trećeg staleža, a ono pobunu.", "iz_udzbenika": {"strana": 46, "odeljak": "Uzroci revolucije", "tekst": "Treći stalež je plaćao poreze, a razlike u pravima i obavezama dovele su do njegove pobune."}, "lekcija": 6}, {"id": "l06-uzr-lanac-prosvetiteljstvo", "vrsta": "lanac", "tezina": "tesko", "pojmovi": ["prosvetiteljstvo", "gradjanstvo", "americka-revolucija"], "karike": ["Prosvetitelji kritikuju apsolutizam i povlastice", "Obrazovano građanstvo traži učešće u vlasti i reforme", "?"], "praznina": 2, "odgovori": [{"tekst": "Uspeh Američke revolucije ga dodatno ohrabruje da se izbori za promene", "tacan": true}, {"tekst": "Građanstvo odustaje i prelazi u plemstvo", "tacan": false, "zasto": "Građanstvo nije odustalo — upravo ono predvodi Treći stalež u revoluciji."}, {"tekst": "Kralj odmah prihvata sve zahteve i revolucija nije potrebna", "tacan": false, "zasto": "Luj XVI je bio neodlučan; zahtevi nisu ispunjeni, pa je došlo do revolucije."}], "pomoc": ["Šta se desilo preko okeana, uz pomoć Francuske?", "Primer uspeha daje hrabrost.", "Iz lekcije: uspeh Američke revolucije dodatno je ohrabrio buržoaziju."], "objasnjenje": "Prosvetiteljske ideje pokrenule su zahteve građanstva, a uspeh Američke revolucije dao mu je hrabrost da ih ostvari.", "iz_udzbenika": {"strana": 46, "odeljak": "Uzroci revolucije", "tekst": "Građanstvo podstaknuto prosvetiteljstvom zahtevalo je reforme; uspeh Američke revolucije ga je dodatno ohrabrio."}, "lekcija": 6}, {"id": "l06-uzr-ko-sam-luj-xvi", "vrsta": "ko_sam", "tezina": "lako", "pojmovi": ["luj-xvi", "skupstina-drzavnih-staleza", "marija-antoaneta"], "tragovi": ["Vladao sam Francuskom od 1774. do 1792.", "Kad mi je ponestalo novca, sazvao sam Skupštinu državnih staleža.", "Moja žena bila je Marija Antoaneta; oboje smo pogubljeni 1793."], "odgovori": [{"tekst": "Luj XVI", "tacan": true}, {"tekst": "Luj XIV", "tacan": false, "zasto": "Luj XIV je vladao ranije; kriza je nastupila u vreme njegovih naslednika."}, {"tekst": "Maksimilijan Robespjer", "tacan": false, "zasto": "Robespjer je bio vođa jakobinaca, a ne kralj."}, {"tekst": "Fridrih II Veliki", "tacan": false, "zasto": "Fridrih II je bio pruski kralj iz lekcije o prosvetiteljstvu."}], "objasnjenje": "To je Luj XVI — poslednji francuski kralj pre republike, zbačen 1792. i pogubljen 1793.", "iz_udzbenika": {"strana": 46, "odeljak": "Uzroci revolucije", "tekst": "Luj XVI (1774–1792) bio je neodlučan vladar koji je 1789. sazvao Skupštinu državnih staleža.", "slika": "06-francuska-revolucija/02-luj-xvi.jpg"}, "lekcija": 6}, {"id": "l06-uzr-objasni-uzroci", "vrsta": "objasni", "tezina": "tesko", "pojmovi": ["apsolutisticka-monarhija", "treci-stalez", "prosvetiteljstvo", "americka-revolucija"], "pitanje": "Navedi i objasni bar tri uzroka Francuske revolucije.", "uzor": "Apsolutistička monarhija bila je u krizi: dvor u Versaju trošio je ogroman novac, a Francuska je u privredi zaostajala za Britanijom. Poreze je plaćao samo Treći stalež, iako je činio više od 90% stanovništva. Građanstvo je pod uticajem prosvetiteljstva i uspeha Američke revolucije tražilo učešće u vlasti, a kralj Luj XVI bio je neodlučan.", "ideje": ["Kriza monarhije: troškovi dvora, zaostajanje privrede.", "Nepravedna podela poreza među staležima.", "Ideje prosvetiteljstva i primer Američke revolucije.", "Neodlučan i nesposoban kralj."], "objasnjenje": "Revolucija ima više uzroka — finansijske, društvene, idejne i lične (slab vladar).", "iz_udzbenika": {"strana": 46, "odeljak": "Uzroci revolucije", "tekst": "Kriza monarhije, nepravedna podela na staleže, prosvetiteljske ideje, primer Amerike i neodlučni kralj bili su uzroci revolucije."}, "lekcija": 6}, {"id": "l06-uzr-objasni-luj", "vrsta": "objasni", "tezina": "lako", "pojmovi": ["luj-xvi"], "pitanje": "Kakav je vladar bio Luj XVI? Objasni svojim rečima.", "uzor": "Luj XVI je vladao Francuskom od 1774. do 1792. Pokušao je da sprovede neke reforme, ali je bio neodlučan i nije umeo da reši krizu.", "ideje": ["Vladao od 1774. do 1792.", "Pokušao je reforme.", "Bio je neodlučan i nesposoban."], "objasnjenje": "Luj XVI je imao nameru da menja stvari, ali mu je nedostajala odlučnost.", "iz_udzbenika": {"strana": 46, "odeljak": "Uzroci revolucije", "tekst": "Luj XVI je pokušao reforme, ali se pokazao kao neodlučan i nesposoban vladar.", "slika": "06-francuska-revolucija/02-luj-xvi.jpg"}, "lekcija": 6}, {"id": "l06-uzr-uporedi-luj-marija", "vrsta": "uporedi", "tezina": "lako", "pojmovi": ["luj-xvi", "marija-antoaneta"], "a": "Luj XVI", "b": "Marija Antoaneta", "pitanje": "Na koga se odnosi tvrdnja — na Luja XVI, Mariju Antoanetu, oboje ili nikoga?", "tvrdnje": [{"tekst": "Bio je francuski kralj od 1774. do 1792.", "odgovor": "a", "zasto": "To je Luj XVI."}, {"tekst": "Bila je ćerka habzburške carice Marije Terezije.", "odgovor": "b", "zasto": "Marija Antoaneta je bila ćerka Marije Terezije."}, {"tekst": "Pogubljen(a) je 1793.", "odgovor": "oba", "zasto": "Prvo je pogubljen kralj, a iste godine i kraljica."}, {"tekst": "Bio je vođa jakobinaca.", "odgovor": "nijedan", "zasto": "Vođa jakobinaca bio je Robespjer."}], "pomoc": ["Jedno je kralj, drugo kraljica.", "Oboje su stradali u revoluciji iste godine.", "Iz lekcije: Luj XVI (1774–1792), Marija Antoaneta — ćerka Marije Terezije; oboje pogubljeni 1793."], "objasnjenje": "Luj XVI je bio kralj, Marija Antoaneta njegova žena i ćerka Marije Terezije; oboje su pogubljeni 1793.", "iz_udzbenika": {"strana": 46, "odeljak": "Uzroci revolucije", "tekst": "Luj XVI je vladao 1774–1792; njegova žena Marija Antoaneta bila je ćerka Marije Terezije.", "slika": "06-francuska-revolucija/02-luj-xvi.jpg"}, "lekcija": 6}, {"id": "l06-uzr-ko-sam-luj-tesko", "vrsta": "ko_sam", "tezina": "tesko", "pojmovi": ["luj-xvi", "ustavna-monarhija", "versaj"], "tragovi": ["Javno sam prihvatao promene, a tajno sam tražio pomoć stranih vladara.", "Po ustavu iz 1791. mogao sam da sprečim donošenje zakona.", "Morao sam da napustim Versaj i preselim se u Pariz."], "odgovori": [{"tekst": "Luj XVI", "tacan": true}, {"tekst": "Maksimilijan Robespjer", "tacan": false, "zasto": "Robespjer nije imao pravo da sprečava zakone kao kralj; bio je vođa jakobinaca."}, {"tekst": "Jedan od pet direktora", "tacan": false, "zasto": "Direktorijum dolazi 1795, kada Versaj više nije bio dvor."}, {"tekst": "Luj XIV", "tacan": false, "zasto": "Luj XIV nije doživeo revoluciju i ustav iz 1791."}], "objasnjenje": "To je Luj XVI — kralj ustavne monarhije, koga su Parižani preselili iz Versaja u Pariz.", "iz_udzbenika": {"strana": 49, "odeljak": "Ustavna monarhija", "tekst": "Luj XVI je javno prihvatao tekovine revolucije, a tajno tražio pomoć; po ustavu je mogao da spreči donošenje zakona.", "slika": "06-francuska-revolucija/02-luj-xvi.jpg"}, "lekcija": 6}]}, {"naslov": "6. Početak revolucije: događaji iz 1789. godine", "zadaci": [{"id": "l06-poc-izbor-zasto-skupstina", "vrsta": "izbor", "tezina": "lako", "pojmovi": ["skupstina-drzavnih-staleza", "luj-xvi"], "pitanje": "Zašto je Luj XVI sazvao Skupštinu državnih staleža?", "odgovori": [{"tekst": "Jer je u državnoj blagajni ponestalo novca", "tacan": true}, {"tekst": "Jer je hteo da proglasi republiku", "tacan": false, "zasto": "Kralj nije hteo republiku — republika ga je kasnije zbacila."}, {"tekst": "Jer je hteo da objavi rat Pruskoj", "tacan": false, "zasto": "Rat Pruskoj objavili su revolucionari tek 1792."}, {"tekst": "Jer je hteo da ukine feudalizam", "tacan": false, "zasto": "Feudalizam je ukinula Ustavotvorna skupština, a ne kralj."}], "pomoc": ["Kakvo je bilo stanje u državnoj blagajni?", "Kralj je od skupštine očekivao da odobri nove poreze.", "Iz lekcije: pošto je ponestalo novca u blagajni, kralj saziva skupštinu."], "objasnjenje": "Državna blagajna je bila prazna, pa je Luj XVI sazvao Skupštinu državnih staleža da odobri nove poreze.", "iz_udzbenika": {"strana": 47, "odeljak": "Početak revolucije: događaji iz 1789. godine", "tekst": "Pošto je ponestalo novca u državnoj blagajni, Luj XVI je sazvao Skupštinu državnih staleža 1789."}, "lekcija": 6}, {"id": "l06-poc-datum-skupstina", "vrsta": "datum", "tezina": "lako", "pojmovi": ["skupstina-drzavnih-staleza"], "dogadjaj": "Skupština državnih staleža", "pitanje": "Koje godine je sazvana Skupština državnih staleža?", "godina": 1789, "traka": "dogadjaji", "pomoc": ["Iste godine pala je Bastilja.", "Godina je u naslovu ovog dela lekcije.", "Iz lekcije: Skupština državnih staleža sazvana je 1789."], "objasnjenje": "Skupština državnih staleža sazvana je 1789 — godine kada je počela revolucija.", "iz_udzbenika": {"strana": 47, "odeljak": "Početak revolucije: događaji iz 1789. godine", "tekst": "Luj XVI je sazvao Skupštinu državnih staleža 1789. godine."}, "lekcija": 6}, {"id": "l06-poc-izbor-ocekivanje", "vrsta": "izbor", "tezina": "srednje", "pojmovi": ["skupstina-drzavnih-staleza", "porezi"], "pitanje": "Šta je kralj očekivao od Skupštine državnih staleža?", "odgovori": [{"tekst": "Da odobri nove poreze i tako reši finansijsku krizu", "tacan": true}, {"tekst": "Da donese prvi ustav Francuske", "tacan": false, "zasto": "Ustav je zahtevao Treći stalež, protiv volje kralja."}, {"tekst": "Da ga proglasi carem", "tacan": false, "zasto": "Luj XVI je već bio kralj; potreban mu je bio novac."}, {"tekst": "Da ukine povlastice plemstva", "tacan": false, "zasto": "Kralj nije tražio ukidanje povlastica — to je kasnije učinila Ustavotvorna skupština."}], "pomoc": ["Šta je kralju nedostajalo?", "Novac država dobija od poreza.", "Iz lekcije: očekivao je da skupština odobri nove poreze."], "objasnjenje": "Luj XVI je hteo da skupština odobri nove poreze i tako popuni praznu blagajnu.", "iz_udzbenika": {"strana": 47, "odeljak": "Početak revolucije: događaji iz 1789. godine", "tekst": "Vladar je očekivao da će skupština odobriti uvođenje novih poreza i tako prevazići finansijsku krizu."}, "lekcija": 6}, {"id": "l06-poc-izbor-mesto", "vrsta": "izbor", "tezina": "lako", "pojmovi": ["skupstina-drzavnih-staleza", "versaj"], "pitanje": "Gde se sastala Skupština državnih staleža?", "odgovori": [{"tekst": "U Versaju", "tacan": true}, {"tekst": "U Bastilji", "tacan": false, "zasto": "Bastilja je bila tvrđava-zatvor u Parizu."}, {"tekst": "U Londonu", "tacan": false, "zasto": "London je glavni grad Britanije; skupština je bila francuska."}, {"tekst": "U Beču", "tacan": false, "zasto": "Beč je bio prestonica Habzburške monarhije."}], "pomoc": ["Tamo je bio kraljevski dvor.", "Dvor čiji su troškovi bili ogromni.", "Iz lekcije: skupština se sastala u Versaju."], "objasnjenje": "Skupština se sastala u Versaju, gde je bio kraljevski dvor.", "iz_udzbenika": {"strana": 47, "odeljak": "Početak revolucije: događaji iz 1789. godine", "tekst": "Skupština se sastala u Versaju, ali predstavnici staleža nisu mogli da se dogovore."}, "lekcija": 6}, {"id": "l06-poc-uporedi-glasanje", "vrsta": "uporedi", "tezina": "srednje", "pojmovi": ["treci-stalez", "prvi-stalez", "drugi-stalez", "skupstina-drzavnih-staleza"], "a": "Treći stalež", "b": "Prvi i Drugi stalež", "pitanje": "Čiji je zahtev ili stav u Skupštini državnih staleža — Trećeg staleža, Prvog i Drugog, oba ili nijednog?", "tvrdnje": [{"tekst": "Svaka osoba ima pravo na jedan glas.", "odgovor": "a", "zasto": "To je bio novi način glasanja koji je tražio Treći stalež."}, {"tekst": "Svaki stalež ima po jedan glas.", "odgovor": "b", "zasto": "Glasanjem po staležima povlašćeni bi imali dva glasa protiv jednog."}, {"tekst": "Imao je najviše poslanika.", "odgovor": "a", "zasto": "Poslanici Trećeg staleža bili su najbrojniji."}, {"tekst": "Ovim načinom glasanja bio bi siguran da ima većinu.", "odgovor": "oba", "zasto": "Svaka strana je birala način koji joj donosi većinu: Treći po glavi, povlašćeni po staležima."}, {"tekst": "Tražio je da se zasedanje prekine i poslanici raziđu.", "odgovor": "nijedan", "zasto": "To je naredio kralj Luj XVI."}], "pomoc": ["Ko ima više ljudi, a ko više staleža?", "Prebroj: dva staleža protiv jednog.", "Iz lekcije: Treći stalež traži glas po osobi, Prvi i Drugi glasanje po staležima."], "objasnjenje": "Treći stalež, sa najviše poslanika, tražio je glas po osobi; povlašćeni su tražili glas po staležu (2 : 1). Prekid zasedanja naredio je kralj.", "iz_udzbenika": {"strana": 47, "odeljak": "Početak revolucije: događaji iz 1789. godine", "tekst": "Treći stalež je tražio da svaka osoba ima jedan glas, a Prvi i Drugi da svaki stalež ima jedan glas."}, "lekcija": 6}, {"id": "l06-poc-zakljuci-po-stalezima", "vrsta": "zakljuci", "tezina": "srednje", "pojmovi": ["prvi-stalez", "drugi-stalez", "skupstina-drzavnih-staleza"], "pitanje": "Zašto su Prvi i Drugi stalež tražili glasanje po staležima?", "odgovori": [{"tekst": "Jer bi tada sa dva glasa protiv jednog uvek imali većinu", "tacan": true}, {"tekst": "Jer su imali najviše poslanika", "tacan": false, "zasto": "Najviše poslanika imao je Treći stalež — zato je on tražio glas po osobi."}, {"tekst": "Jer su hteli da pomognu Trećem staležu", "tacan": false, "zasto": "Takvo glasanje bi Trećem staležu oduzelo snagu, a ne pomoglo mu."}, {"tekst": "Jer je tako tražio Robespjer", "tacan": false, "zasto": "Robespjer se u lekciji javlja kasnije, kao vođa jakobinaca."}], "pomoc": ["Korak 1: Koliko staleža je bilo povlašćeno?", "Korak 2: Koliko glasova bi imali kada svaki stalež ima jedan glas?", "Iz lekcije: tako su mogli da budu sigurni da će imati većinu."], "objasnjenje": "Kad svaki stalež ima jedan glas, sveštenstvo i plemstvo zajedno uvek nadglasaju Treći stalež (2 : 1).", "iz_udzbenika": {"strana": 47, "odeljak": "Početak revolucije: događaji iz 1789. godine", "tekst": "Prvi i drugi stalež zahtevali su glasanje po staležima — tako su mogli biti sigurni da će imati većinu."}, "lekcija": 6}, {"id": "l06-poc-zakljuci-po-osobi", "vrsta": "zakljuci", "tezina": "tesko", "pojmovi": ["treci-stalez", "skupstina-drzavnih-staleza"], "pitanje": "Zašto je Treći stalež tražio da svaka osoba ima jedan glas?", "odgovori": [{"tekst": "Jer je imao najviše poslanika, pa bi tako mogao da nadglasa povlašćene", "tacan": true}, {"tekst": "Jer je hteo da kralj odlučuje sam", "tacan": false, "zasto": "Treći stalež je tražio više uticaja za sebe, a ne više vlasti za kralja."}, {"tekst": "Jer je imao samo jednog poslanika", "tacan": false, "zasto": "Naprotiv, njegovi sto": "Odbili su kraljevo naređenje — to je bio početak otpora."}, {"tekst": "Treći stalež pristaje na glasanje po staležima", "tacan": false, "zasto": "Treći stalež nije popustio; proglasio se Narodnom skupštinom."}], "pomoc": ["Da li su poslanici poslušali kralja?", "Proglasili su se predstavnicima celog naroda.", "Iz lekcije: odbili su i proglasili se za Narodnu skupštinu."], "objasnjenje": "Suočen sa otporom, kralj je hteo da rastera skupštinu, ali je Treći stalež odbio i proglasio se Narodnom skupštinom.", "iz_udzbenika": {"strana": 47, "odeljak": "Početak revolucije: događaji iz 1789. godine", "tekst": "Luj XVI je naredio da se zasedanje okonča, ali su poslanici Trećeg staleža odbili i proglasili se za Narodnu skupštinu."}, "lekcija": 6}, {"id": "l06-poc-izvor-bastilja", "vrsta": "izvor", "slika_u_pitanju": true, "tezina": "srednje", "pojmovi": ["bastilja", "pariz"], "izvor": {"autor": "Slika iz doba revolucije", "naslov": "Pad Bastilje 1789. (opis slike)", "tekst": "Na slici je visoka kamena tvrđava sa okruglim kulama. Ispred nje se gura velika masa naoružanih ljudi, iz pušaka se diže dim, a kod kapije gori vatra.", "napomena": "Opis slike je prepričan; udžbenik, str. 47."}, "pitanje": "Koji događaj prikazuje slika i šta je on značio?", "odgovori": [{"tekst": "Zauzimanje Bastilje 14. jula 1789. — početak revolucije", "tacan": true}, {"tekst": "Marš žena na Versaj — kralj se seli u Pariz", "tacan": false, "zasto": "Na slici je tvrđava sa kulama, a marš žena je išao ka dvoru u Versaju."}, {"tekst": "Pogubljenje kralja 1793.", "tacan": false, "zasto": "Kralj je pogubljen javno u Parizu, a ne u napadu na tvrđavu."}, {"tekst": "Zasedanje Skupštine državnih staleža", "tacan": false, "zasto": "Skupština je zasedala mirno, u Versaju — ne usred borbe."}], "pomoc": ["Kakva je zgrada u središtu slike?", "Tvrđava-zatvor u Parizu.", "Iz lekcije: padom Bastilje počela je revolucija."], "objasnjenje": "Slika prikazuje napad na Bastilju 14. jula 1789 — događaj kojim je počela Francuska revolucija.", "iz_udzbenika": {"strana": 47, "odeljak": "Početak revolucije: događaji iz 1789. godine", "tekst": "Slika Pad Bastilje 1789. prikazuje napad naoružanih Parižana na tvrđavu.", "slika": "06-francuska-revolucija/03-pad-bastilje.jpg"}, "osa": {"naziv": "Pad Bastilje", "od": 1789, "traka": "dogadjaji"}, "lekcija": 6}, {"id": "l06-poc-povezi-skupstine", "vrsta": "povezi", "tezina": "tesko", "pojmovi": ["skupstina-drzavnih-staleza", "narodna-skupstina", "ustavotvorna-skupstina"], "pitanje": "Poveži naziv skupštine sa onim što o njoj kaže lekcija.", "parovi": [["Skupština državnih staleža", "sazvana da odobri nove poreze"], ["Narodna skupština", "Treći stalež se tako proglasio kada je odbio da se raziđe"], ["Ustavotvorna skupština", "zaklela se da neće otići dok ne donese ustav"]], "pomoc": ["Prvu je sazvao kralj, zbog novca.", "Druga je nastala iz otpora kralju, a treća je dobila ime po cilju.", "Iz lekcije: Skupština staleža (porezi) → Narodna (otpor) → Ustavotvorna (ustav)."], "objasnjenje": "Kralj saziva Skupštinu državnih staleža zbog poreza; Treći stalež se proglašava Narodnom, a zatim Ustavotvornom skupštinom.", "iz_udzbenika": {"strana": 47, "odeljak": "Početak revolucije: događaji iz 1789. godine", "tekst": "Skupština državnih staleža postala je, zalaganjem Trećeg staleža, Narodna pa Ustavotvorna skupština."}, "lekcija": 6}, {"id": "l06-poc-objasni-zakletva", "vrsta": "objasni", "tezina": "tesko", "pojmovi": ["narodna-skupstina", "ustavotvorna-skupstina", "luj-xvi"], "pitanje": "Zašto se zakletva poslanika u junu 1789. smatra činom otpora kralju?", "uzor": "Kralj je naredio da se skupština raziđe, a poslanici su se zakleli da neće otići dok ne donesu ustav. Tako su odbili njegovo naređenje i sami preuzeli pravo da odlučuju o uređenju države. Ustav bi ograničio kraljevu vlast.", "ideje": ["Kralj je naredio razilaženje.", "Poslanici su odbili naređenje.", "Hteli su ustav koji ograničava kraljevu vlast."], "objasnjenje": "Zakletva je bila otvoren otpor apsolutnoj vlasti — skupština, a ne kralj, odlučuje o ustavu.", "iz_udzbenika": {"strana": 47, "odeljak": "Početak revolucije: događaji iz 1789. godine", "tekst": "Poslanici su odbili kraljevo naređenje i zakleli se da se neće razići dok ne donesu prvi ustav."}, "lekcija": 6}, {"id": "l06-poc-objasni-bastilja", "vrsta": "objasni", "tezina": "srednje", "pojmovi": ["bastilja", "francuska-revolucija"], "pitanje": "Opiši kako je pala Bastilja i zašto je taj događaj važan.", "uzor": "Parižani su se naoružali jer su čuli da kralj želi da rastera skupštinu. U zoru 14. jula 1789. napali su Bastilju, zatvor za političke zatvorenike, i zauzeli je iako je posada pucala. Time je počela Francuska revolucija.", "ideje": ["Parižani su se naoružali zbog glasina.", "Bastilja je bila zatvor za političke zatvorenike.", "Zauzeta je 14. jula 1789.", "Tim događajem počela je revolucija."], "objasnjenje": "Pad Bastilje je prvi veliki čin naroda protiv kraljeve vlasti i početak revolucije.", "iz_udzbenika": {"strana": 47, "odeljak": "Početak revolucije: događaji iz 1789. godine", "tekst": "Naoružani Parižani zauzeli su Bastilju 14. jula 1789; padom Bastilje počela je revolucija.", "slika": "06-francuska-revolucija/03-pad-bastilje.jpg"}, "lekcija": 6}, {"id": "l06-poc-lanac-blagajna", "vrsta": "lanac", "tezina": "lako", "pojmovi": ["skupstina-drzavnih-staleza", "luj-xvi", "porezi"], "karike": ["U državnoj blagajni nema novca", "Luj XVI saziva Skupštinu državnih staleža", "?"], "praznina": 2, "odgovori": [{"tekst": "Kralj očekuje da skupština odobri nove poreze", "tacan": true}, {"tekst": "Kralj očekuje da skupština proglasi republiku", "tacan": false, "zasto": "Kralj nije želeo republiku — hteo je novac."}, {"tekst": "Kralj očekuje da skupština ukine sve poreze", "tacan": false, "zasto": "Bez poreza blagajna bi ostala prazna; on je tražio nove poreze."}], "pomoc": ["Odakle država dobija novac?", "Kralj je hteo da reši finansijsku krizu.", "Iz lekcije: očekivao je da skupština odobri nove poreze."], "objasnjenje": "Prazna blagajna → sazivanje skupštine → kralj očekuje odobrenje novih poreza.", "iz_udzbenika": {"strana": 47, "odeljak": "Početak revolucije: događaji iz 1789. godine", "tekst": "Vladar je očekivao da će skupština odobriti nove poreze i tako prevazići finansijsku krizu."}, "lekcija": 6}, {"id": "l06-poc-zakljuci-ime", "vrsta": "zakljuci", "tezina": "lako", "pojmovi": ["ustavotvorna-skupstina", "ustav"], "pitanje": "Zašto se Narodna skupština proglasila baš za Ustavotvornu skupštinu?", "odgovori": [{"tekst": "Jer je njen cilj bio da donese prvi ustav Francuske", "tacan": true}, {"tekst": "Jer ju je tako nazvao kralj", "tacan": false, "zasto": "Kralj je hteo da je rastera; ime su izabrali sami poslanici."}, {"tekst": "Jer je zasedala u tvrđavi Bastilji", "tacan": false, "zasto": "Bastilja je bila zatvor; ime skupštine dolazi od ustava."}, {"tekst": "Jer je trebalo da odobri nove poreze", "tacan": false, "zasto": "To je kralj očekivao od Skupštine staleža, ne od Ustavotvorne."}], "pomoc": ["Korak 1: Na šta su se poslanici zakleli?", "Korak 2: Raščlani reč: ustav + tvoriti.", "Iz lekcije: zakleli su se da neće otići dok ne donesu ustav."], "objasnjenje": "Skupština je dobila ime po svom zadatku — da „stvori” ustav.", "iz_udzbenika": {"strana": 47, "odeljak": "Početak revolucije: događaji iz 1789. godine", "tekst": "Poslanici su se zakleli da se neće razići dok ne donesu prvi ustav, pa se skupština proglasila za Ustavotvornu."}, "lekcija": 6}, {"id": "l06-poc-povezi-datumi", "vrsta": "povezi", "tezina": "lako", "pojmovi": ["bastilja", "deklaracija-o-pravima-coveka-i-gradjanina", "republika"], "pitanje": "Poveži datum sa događajem.", "parovi": [["14. jul 1789.", "pad Bastilje"], ["26. avgust 1789.", "Deklaracija o pravima čoveka i građanina"], ["22. septembar 1792.", "proglašenje republike"]], "pomoc": ["Revolucija počinje leta 1789.", "Republika je proglašena tri godine kasnije.", "Iz lekcije: 14. jul — Bastilja; 26. avgust — Deklaracija; 22. septembar 1792 — republika."], "objasnjenje": "14. jul 1789 — pad Bastilje; 26. avgust 1789 — Deklaracija; 22. septembar 1792 — republika.", "iz_udzbenika": {"strana": 47, "odeljak": "Početak revolucije: događaji iz 1789. godine", "tekst": "Bastilja je pala 14. jula 1789; Deklaracija je usvojena 26. avgusta 1789, a republika proglašena 22. septembra 1792."}, "lekcija": 6}]}, {"naslov": "6. Širenje revolucije", "zadaci": [{"id": "l06-sir-izbor-selo", "vrsta": "izbor", "tezina": "lako", "pojmovi": ["plemstvo", "seljastvo"], "pitanje": "Šta se dešavalo na selu kada se revolucija proširila na unutrašnjost Francuske?", "odgovori": [{"tekst": "Paljeni su plemićki zamkovi i izbijali su veliki nemiri", "tacan": true}, {"tekst": "Seljaci su branili plemiće od Parižana", "tacan": false, "zasto": "Seljaci su bili deo Trećeg staleža i ustali su protiv plemića."}, {"tekst": "Na selu je vladao mir", "tacan": false, "zasto": "Revolucija je brzo zahvatila i selo, uz velike nemire."}, {"tekst": "Gradile su se nove fabrike", "tacan": false, "zasto": "To je tema industrijske revolucije, a ne Francuske revolucije."}], "pomoc": ["Protiv koga su se bunili seljaci?", "Gde su živeli plemići na selu?", "Iz lekcije: na selu je došlo do paljenja plemićkih zamkova."], "objasnjenje": "Revolucija se proširila na selo — seljaci su palili plemićke zamkove, izbijali su veliki nemiri.", "iz_udzbenika": {"strana": 47, "odeljak": "Širenje revolucije", "tekst": "Na selu je došlo do paljenja plemićkih zamkova i velikih nemira."}, "lekcija": 6}, {"id": "l06-sir-izbor-ukinuto", "vrsta": "izbor", "tezina": "srednje", "pojmovi": ["ustavotvorna-skupstina", "feudalizam", "prvi-stalez", "drugi-stalez"], "pitanje": "Šta je Ustavotvorna skupština uradila 1789? (više tačnih)", "odgovori": [{"tekst": "Ukinula je poreske povlastice prva dva staleža", "tacan": true}, {"tekst": "Uvela je jednakost svih ljudi pred zakonom", "tacan": true}, {"tekst": "Ukinula je feudalne obaveze seljaka", "tacan": true}, {"tekst": "Oduzela je imanja crkvi", "tacan": true}, {"tekst": "Proglasila je republiku", "tacan": false, "zasto": "Republika je proglašena tek 22. septembra 1792."}, {"tekst": "Pogubila je kralja", "tacan": false, "zasto": "Kralj je pogubljen tek početkom 1793."}], "pomoc": ["Sve tačno se odnosi na ukidanje starog, feudalnog poretka.", "Republika i pogubljenje kralja dolaze nekoliko godina kasnije.", "Iz lekcije: ukinute povlastice i feudalne obaveze, jednakost pred zakonom, crkvena imanja oduzeta."], "objasnjenje": "Skupština je 1789. ukinula povlastice, feudalne obaveze i crkvena imanja i uvela jednakost pred zakonom — tako je ukinut feudalizam.", "iz_udzbenika": {"strana": 47, "odeljak": "Širenje revolucije", "tekst": "Ustavotvorna skupština je 1789. ukinula poreske povlastice, uvela jednakost pred zakonom, ukinula feudalne obaveze seljaka i oduzela imanja crkvi."}, "lekcija": 6}, {"id": "l06-sir-dopuni-feudalizam", "vrsta": "dopuni", "tezina": "lako", "pojmovi": ["feudalizam", "francuska"], "pitanje": "Dopuni.", "tekst": "Ukidanjem povlastica i feudalnih obaveza seljaka 1789. u Francuskoj je ukinut {{feudalizam}}.", "ponudjene": ["feudalizam", "apsolutizam", "porez", "stalež"], "pomoc": ["Kako se zove poredak u kome seljaci duguju obaveze plemićima?", "Obaveze koje su ukinute zvale su se feudalne.", "Iz lekcije: ovim činom u Francuskoj je ukinut feudalizam."], "objasnjenje": "Ukidanjem povlastica i feudalnih obaveza u Francuskoj je ukinut feudalizam.", "iz_udzbenika": {"strana": 47, "odeljak": "Širenje revolucije", "tekst": "Ovim činom u Francuskoj je ukinut feudalizam."}, "osa": {"naziv": "Ukidanje feudalizma u Francuskoj", "od": 1789, "traka": "dogadjaji"}, "lekcija": 6}, {"id": "l06-sir-tn-crkva", "vrsta": "tacno_netacno", "tezina": "srednje", "pojmovi": ["svestenstvo", "ustavotvorna-skupstina"], "tvrdnja": "Ustavotvorna skupština je crkvi dodelila nova imanja.", "tacno": false, "ispravke": [{"tekst": "Ustavotvorna skupština je oduzela imanja crkvi.", "tacan": true}, {"tekst": "Ustavotvorna skupština je crkvi oprostila sve poreze.", "tacan": false, "zasto": "Naprotiv, ukinute su poreske povlastice sveštenstva."}, {"tekst": "Crkvena imanja su predata kralju.", "tacan": false, "zasto": "Lekcija kaže samo da su imanja oduzeta crkvi; kralj nije dobio nova imanja."}], "pomoc": ["Da li je revolucija jačala ili slabila povlašćene staleže?", "Prvi stalež je izgubio i povlastice i posede.", "Iz lekcije: skupština je oduzela imanja crkvi."], "objasnjenje": "Netačno — skupština je crkvi oduzela imanja, a sveštenstvu ukinula poreske povlastice.", "iz_udzbenika": {"strana": 47, "odeljak": "Širenje revolucije", "tekst": "Ustavotvorna skupština je oduzela imanja crkvi."}, "lekcija": 6}, {"id": "l06-sir-lanac-feudalizam", "vrsta": "lanac", "tezina": "srednje", "pojmovi": ["feudalizam", "seljastvo", "ustavotvorna-skupstina"], "karike": ["Revolucija se širi na selo, gore plemićki zamkovi", "Skupština ukida povlastice i feudalne obaveze seljaka", "?"], "praznina": 2, "odgovori": [{"tekst": "U Francuskoj je ukinut feudalizam", "tacan": true}, {"tekst": "Kralj postaje jači nego ikad", "tacan": false, "zasto": "Ukidanje starog poretka slabilo je, a ne jačalo kraljevu vlast."}, {"tekst": "Seljaci moraju da plaćaju više dažbina", "tacan": false, "zasto": "Feudalne obaveze seljaka su upravo ukinute."}], "pomoc": ["Kako se zove poredak zasnovan na povlasticama i obavezama seljaka?", "Kad se ukinu njegovi temelji, nestaje i on.", "Iz lekcije: ovim činom ukinut je feudalizam."], "objasnjenje": "Ukidanjem povlastica i feudalnih obaveza nestao je feudalni poredak u Francuskoj.", "iz_udzbenika": {"strana": 47, "odeljak": "Širenje revolucije", "tekst": "Ukidanjem povlastica i feudalnih obaveza u Francuskoj je ukinut feudalizam."}, "lekcija": 6}, {"id": "l06-sir-datum-deklaracija", "vrsta": "datum", "tezina": "srednje", "pojmovi": ["deklaracija-o-pravima-coveka-i-gradjanina"], "dogadjaj": "Deklaracija o pravima čoveka i građanina", "pitanje": "Koje godine je usvojena Deklaracija o pravima čoveka i građanina?", "godina": 1789, "traka": "ideje", "pomoc": ["Usvojena je iste godine kada je pala Bastilja.", "Krajem leta te godine — 26. avgusta.", "Iz lekcije: 26. avgusta 1789."], "objasnjenje": "Deklaracija je usvojena 26. avgusta 1789, nešto više od mesec dana posle pada Bastilje.", "iz_udzbenika": {"strana": 48, "odeljak": "Širenje revolucije", "tekst": "Skupština je 26. avgusta 1789. usvojila Deklaraciju o pravima čoveka i građanina."}, "lekcija": 6}, {"id": "l06-sir-izbor-deklaracija-sta", "vrsta": "izbor", "tezina": "lako", "pojmovi": ["deklaracija-o-pravima-coveka-i-gradjanina", "ustav"], "pitanje": "Šta je predstavljala Deklaracija o pravima čoveka i građanina?", "odgovori": [{"tekst": "Niz načela na kojima je trebalo doneti ustav", "tacan": true}, {"tekst": "Objavu rata Austriji i Pruskoj", "tacan": false, "zasto": "Rat je objavljen tek 1792."}, {"tekst": "Kraljev zakon o novim porezima", "tacan": false, "zasto": "Deklaraciju je usvojila skupština, i ona govori o pravima, ne o porezima."}, {"tekst": "Republikanski kalendar", "tacan": false, "zasto": "Kalendar je uveden tek posle proglašenja republike 1792."}], "pomoc": ["Deklaracija je bila priprema za jedan važan dokument.", "Taj dokument je najviši zakon države.", "Iz lekcije: niz načela na osnovu kojih je trebalo doneti ustav."], "objasnjenje": "Deklaracija je skup načela (prava i jednakost) na kojima je trebalo zasnovati ustav.", "iz_udzbenika": {"strana": 48, "odeljak": "Širenje revolucije", "tekst": "Deklaracija je predstavljala niz načela na osnovu kojih je trebalo doneti ustav."}, "lekcija": 6}, {"id": "l06-sir-tn-jednaki", "vrsta": "tacno_netacno", "tezina": "lako", "pojmovi": ["deklaracija-o-pravima-coveka-i-gradjanina"], "tvrdnja": "Deklaracija je proglasila da su svi ljudi jednaki pred zakonom.", "tacno": true, "pomoc": ["Šta je bila suprotnost staležima sa povlasticama?", "Iz lekcije: proglašeno je da su svi ljudi jednaki pred zakonom i da imaju osnov
