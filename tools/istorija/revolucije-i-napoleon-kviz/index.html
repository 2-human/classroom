na prava."], "objasnjenje": "Tačno — Deklaracija proglašava jednakost svih pred zakonom i garantuje osnovna ljudska i politička prava.", "iz_udzbenika": {"strana": 48, "odeljak": "Širenje revolucije", "tekst": "Proglašeno je da su svi ljudi jednaki pred zakonom i da su im garantovana osnovna ljudska i politička prava."}, "lekcija": 6}, {"id": "l06-sir-izbor-preseljenje", "vrsta": "izbor", "tezina": "lako", "pojmovi": ["luj-xvi", "versaj", "pariz"], "pitanje": "Kuda je Luj XVI sa dvorom morao da se preseli pod pritiskom pobunjenih Parižana?", "odgovori": [{"tekst": "Iz Versaja u Pariz", "tacan": true}, {"tekst": "Iz Pariza u Versaj", "tacan": false, "zasto": "Obrnuto — dvor je bio u Versaju, a Parižani su ga doveli u Pariz."}, {"tekst": "U Beč, kod Habzburgovaca", "tacan": false, "zasto": "Bekstvo iz Francuske pokušao je tek 1791. i bio je uhvaćen."}, {"tekst": "U Bastilju", "tacan": false, "zasto": "Bastilja je srušena kao zatvor; kralj se preselio u Pariz."}], "pomoc": ["Gde je bio dvor pre revolucije?", "Parižani su hteli kralja pod svojim okom.", "Iz lekcije: kralj je morao da pređe iz Versaja u Pariz, a za njim i skupština."], "objasnjenje": "Pod pritiskom Parižana kralj se sa dvorom preselio iz Versaja u Pariz, a zatim i Ustavotvorna skupština.", "iz_udzbenika": {"strana": 48, "odeljak": "Širenje revolucije", "tekst": "Pod pritiskom pobunjenih Parižana Luj XVI je sa dvorom prešao iz Versaja u Pariz, a zatim i Ustavotvorna skupština."}, "lekcija": 6}, {"id": "l06-sir-zakljuci-pariz", "vrsta": "zakljuci", "tezina": "tesko", "pojmovi": ["pariz", "luj-xvi", "ustavotvorna-skupstina"], "pitanje": "Šta je značilo to što su kralj i skupština morali da se presele u Pariz?", "odgovori": [{"tekst": "Pobunjeni Parižani su dobili veliki uticaj na kralja i skupštinu", "tacan": true}, {"tekst": "Kralj je pobedio revoluciju", "tacan": false, "zasto": "Kralj nije sam izabrao Pariz — prisilili su ga pobunjeni Parižani."}, {"tekst": "Revolucija se završila", "tacan": false, "zasto": "Revolucija se nastavlja još godinama — ustav, republika, jakobinci."}, {"tekst": "Versaj je postao prestonica Francuske", "tacan": false, "zasto": "Upravo suprotno — kralj napušta Versaj i odlazi u Pariz."}], "pomoc": ["Korak 1: Ko je naterao kralja da se preseli?", "Korak 2: Ko sad može lakše da vrši pritisak na kralja i skupštinu?", "Iz lekcije: preseljenje je usledilo pod pritiskom pobunjenih Parižana."], "objasnjenje": "Kralj i skupština su sada bili usred pobunjenog Pariza, pa su Parižani mogli neposredno da utiču na njihove odluke.", "iz_udzbenika": {"strana": 48, "odeljak": "Širenje revolucije", "tekst": "Pod pritiskom Parižana kralj i skupština su prešli iz Versaja u Pariz."}, "lekcija": 6}, {"id": "l06-sir-poredjaj-1789", "vrsta": "poredjaj", "tezina": "tesko", "pojmovi": ["bastilja", "deklaracija-o-pravima-coveka-i-gradjanina", "mars-zena-na-versaj"], "pitanje": "Poređaj događaje iz druge polovine 1789. hronološki.", "stavke": [{"tekst": "Pad Bastilje", "godina": 1789, "naziv": "Pad Bastilje", "traka": "dogadjaji"}, {"tekst": "Usvojena Deklaracija o pravima čoveka i građanina", "godina": 1789, "naziv": "Deklaracija o pravima čoveka i građanina", "traka": "ideje"}, {"tekst": "Marš žena na Versaj", "godina": 1789, "naziv": "Marš žena na Versaj", "traka": "dogadjaji"}], "pomoc": ["Jul, avgust, oktobar.", "Revolucija počinje padom Bastilje.", "Iz lekcije: 14. jul — 26. avgust — 5. oktobar 1789."], "objasnjenje": "Pad Bastilje (14. jul) → Deklaracija (26. avgust) → marš žena na Versaj (5. oktobar 1789).", "iz_udzbenika": {"strana": 48, "odeljak": "Širenje revolucije", "tekst": "Posle pada Bastilje usvojena je Deklaracija 26. avgusta, a 5. oktobra žene su krenule na Versaj."}, "lekcija": 6}, {"id": "l06-sir-objasni-deklaracija", "vrsta": "objasni", "tezina": "srednje", "pojmovi": ["deklaracija-o-pravima-coveka-i-gradjanina", "stalezi"], "pitanje": "Zašto je Deklaracija o pravima čoveka i građanina bila suprotna staleškom društvu?", "uzor": "U staleškom društvu sveštenstvo i plemstvo imali su povlastice i nisu plaćali porez. Deklaracija je proglasila da su svi ljudi jednaki pred zakonom i da svi imaju ista osnovna prava. Time su povlastice izgubile svaki osnov.", "ideje": ["Staleži su imali različita prava i povlastice.", "Deklaracija: svi su jednaki pred zakonom.", "Svima su zagarantovana osnovna prava."], "objasnjenje": "Jednakost pred zakonom ne trpi povlastice po rođenju — zato je Deklaracija rušila staleško društvo.", "iz_udzbenika": {"strana": 48, "odeljak": "Širenje revolucije", "tekst": "Deklaracija je proglasila jednakost svih pred zakonom i zagarantovala osnovna ljudska i politička prava."}, "lekcija": 6}, {"id": "l06-mars-izbor-uzrok", "vrsta": "izbor", "tezina": "lako", "pojmovi": ["mars-zena-na-versaj", "pariz"], "pitanje": "Zašto su se Parižanke pobunile u oktobru 1789?", "odgovori": [{"tekst": "Zbog nestašice i skupoće hleba", "tacan": true}, {"tekst": "Zato što im je oduzeto pravo glasa", "tacan": false, "zasto": "Žene nisu ni imale pravo glasa; buna je bila zbog hleba."}, {"tekst": "Zbog pogubljenja kraljice", "tacan": false, "zasto": "Kraljica je pogubljena tek 1793."}, {"tekst": "Zbog rata sa Engleskom", "tacan": false, "zasto": "Rat sa Engleskom počinje tek posle pogubljenja kralja, 1793."}], "pomoc": ["Bile su gladne.", "Šta je osnovna namirnica koje nije bilo?", "Iz lekcije: gladne Parižanke pobunile su se zbog nestašice i skupoće hleba."], "objasnjenje": "Gladne Parižanke pobunile su se jer hleba nije bilo, a ono malo bilo je skupo.", "iz_udzbenika": {"strana": 48, "odeljak": "Marš žena na Versaj", "tekst": "Skup gladnih Parižanki, pobunjenih zbog nestašice i skupoće hleba, pretvorio se u marš na Versaj.", "slika": "06-francuska-revolucija/04-mars-zena-na-versaj.jpg"}, "lekcija": 6}, {"id": "l06-mars-datum", "vrsta": "datum", "tezina": "lako", "pojmovi": ["mars-zena-na-versaj"], "dogadjaj": "Marš žena na Versaj", "pitanje": "Koje godine je bio marš žena na Versaj?", "godina": 1789, "traka": "dogadjaji", "pomoc": ["Iste godine kada je pala Bastilja.", "Bio je u oktobru, prve godine revolucije.", "Iz lekcije: 5. oktobra 1789."], "objasnjenje": "Marš žena na Versaj bio je 5. oktobra 1789.", "iz_udzbenika": {"strana": 48, "odeljak": "Marš žena na Versaj", "tekst": "Marš žena na Versaj bio je 5. oktobra 1789.", "slika": "06-francuska-revolucija/04-mars-zena-na-versaj.jpg"}, "lekcija": 6}, {"id": "l06-mars-tn-obecanje", "vrsta": "tacno_netacno", "tezina": "srednje", "pojmovi": ["mars-zena-na-versaj", "luj-xvi"], "tvrdnja": "Kralj je odbio da primi delegaciju žena.", "tacno": false, "ispravke": [{"tekst": "Kralj je primio delegaciju i obećao da će lično brinuti o snabdevanju prestonice.", "tacan": true}, {"tekst": "Kralj je naredio da se žene zatvore u Bastilju.", "tacan": false, "zasto": "Bastilja je pala još u julu; kralj je primio delegaciju."}, {"tekst": "Kralj je odmah pobegao iz Francuske.", "tacan": false, "zasto": "Bekstvo je pokušao tek 1791."}], "pomoc": ["Pročitaj okvir o maršu još jednom.", "Kralj je nešto obećao ženama.", "Iz lekcije: kralj je primio delegaciju i obećao snabdevanje prestonice."], "objasnjenje": "Netačno — kralj je primio žene i obećao da će se lično pobrinuti da Pariz ima hrane.", "iz_udzbenika": {"strana": 48, "odeljak": "Marš žena na Versaj", "tekst": "Kralj je primio delegaciju žena i obećao da će se lično pobrinuti za snabdevanje prestonice."}, "lekcija": 6}, {"id": "l06-mars-lanac", "vrsta": "lanac", "tezina": "srednje", "pojmovi": ["mars-zena-na-versaj", "versaj", "pariz", "luj-xvi"], "karike": ["Nestašica i skupoća hleba u Parizu", "Gladne Parižanke kreću u marš na Versaj", "?", "Kralj pristaje da se trajno preseli u Pariz"], "praznina": 2, "odgovori": [{"tekst": "Sutradan, 6. oktobra, masa napada Versaj", "tacan": true}, {"tekst": "Kralj proglašava republiku", "tacan": false, "zasto": "Republiku je proglasila skupština 1792, a ne kralj."}, {"tekst": "Žene se mirno vraćaju kući bez ičega", "tacan": false, "zasto": "Marš se završio napadom na Versaj i kraljevim preseljenjem."}], "pomoc": ["Šta se desilo dan posle marša?", "Okupljena masa je bila nasilna.", "Iz lekcije: 6. oktobra masa je napala Versaj, pa je kralj pristao da se preseli."], "objasnjenje": "Glad → marš na Versaj (5. oktobar) → napad na Versaj (6. oktobar) → kralj se seli u Pariz.", "iz_udzbenika": {"strana": 48, "odeljak": "Marš žena na Versaj", "tekst": "Sutradan, 6. oktobra, masa je napala Versaj, pa je kralj pristao da se trajno preseli u buntovni Pariz."}, "lekcija": 6}, {"id": "l06-mars-izvor", "vrsta": "izvor", "slika_u_pitanju": true, "tezina": "tesko", "pojmovi": ["mars-zena-na-versaj", "versaj"], "izvor": {"autor": "Gravira iz doba revolucije", "naslov": "Marš žena na Versaj (opis slike)", "tekst": "Povorka žena u dugim haljinama kreće napred. U rukama nose koplja, motke i oruđe, a nekoliko njih vuče top na točkovima.", "napomena": "Opis slike je prepričan; udžbenik, str. 48."}, "pitanje": "Šta nam ova slika govori o ulozi žena u Francuskoj revoluciji?", "odgovori": [{"tekst": "Žene su aktivno, pa i naoružane, učestvovale u važnim događajima revolucije", "tacan": true}, {"tekst": "Žene su u revoluciji samo posmatrale događaje", "tacan": false, "zasto": "Na slici žene nose oružje i vuku top — one su učesnice, ne posmatrači."}, {"tekst": "Žene su branile kralja od revolucionara", "tacan": false, "zasto": "Žene su krenule na Versaj protiv kralja, zbog gladi."}, {"tekst": "Žene su posle marša dobile pravo glasa", "tacan": false, "zasto": "Ni ustav iz 1791. nije ženama dao politička prava."}], "pomoc": ["Šta žene na slici drže u rukama?", "Okvir u udžbeniku počinje rečenicom o ženama u revoluciji.", "Iz lekcije: u značajnim događajima revolucije često su učestvovale žene."], "objasnjenje": "Gravira pokazuje žene kao aktivne, naoružane učesnice revolucije — iako nisu imale politička prava.", "iz_udzbenika": {"strana": 48, "odeljak": "Marš žena na Versaj", "tekst": "U važnim događajima Francuske revolucije često su učestvovale žene.", "slika": "06-francuska-revolucija/04-mars-zena-na-versaj.jpg"}, "osa": {"naziv": "Marš žena na Versaj", "od": 1789, "traka": "dogadjaji"}, "lekcija": 6}, {"id": "l06-dekl-izbor-prirodna-prava", "vrsta": "izbor", "tezina": "srednje", "pojmovi": ["deklaracija-o-pravima-coveka-i-gradjanina"], "pitanje": "Koja prirodna prava čoveka navodi član 2 Deklaracije? (više tačnih)", "odgovori": [{"tekst": "slobodu", "tacan": true}, {"tekst": "vlasništvo", "tacan": true}, {"tekst": "sigurnost", "tacan": true}, {"tekst": "otpor ugnjetavanju", "tacan": true}, {"tekst": "povlastice plemstva", "tacan": false, "zasto": "Deklaracija ukida povlastice — svi se rađaju sa istim pravima."}, {"tekst": "pravo kralja na neograničenu vlast", "tacan": false, "zasto": "Deklaracija štiti prava svakog čoveka, a ne apsolutnu vlast kralja."}], "pomoc": ["Prirodna prava ima SVAKI čovek, ne samo neki.", "Četiri su; jedno se odnosi na imovinu, jedno na borbu protiv nepravde.", "Iz Svedočanstva: sloboda, vlasništvo, sigurnost i otpor ugnjetavanju."], "objasnjenje": "Član 2 navodi četiri prirodna i neotuđiva prava — slobodu, vlasništvo, sigurnost i otpor ugnjetavanju.", "iz_udzbenika": {"strana": 48, "odeljak": "Svedočanstvo: Deklaracija o pravima čoveka i građanina iz 1789.", "tekst": "Svrha političkog udruživanja je zaštita prirodnih prava: slobode, vlasništva, sigurnosti i otpora ugnjetavanju."}, "lekcija": 6}, {"id": "l06-dekl-povezi-clanovi", "vrsta": "povezi", "tezina": "tesko", "pojmovi": ["deklaracija-o-pravima-coveka-i-gradjanina"], "pitanje": "Poveži član Deklaracije sa njegovim sadržajem (prepričano).", "parovi": [["Čl. 1", "ljudi se rađaju slobodni i jednaki u pravima"], ["Čl. 4", "sloboda je činiti sve što ne šteti drugome"], ["Čl. 9", "svako je nevin dok se ne dokaže krivica"], ["Čl. 10", "niko ne sme biti uznemiravan zbog svojih mišljenja, ni verskih"], ["Čl. 11", "slobodno se može govoriti, pisati i štampati"]], "pomoc": ["Prvi član govori o rođenju.", "Poslednji član u odlomku govori o štampi.", "Iz Svedočanstva: 1 jednakost, 4 granice slobode, 9 nevinost, 10 sloboda mišljenja, 11 sloboda izražavanja."], "objasnjenje": "Čl. 1 — jednakost od rođenja; čl. 4 — granica slobode; čl. 9 — pretpostavka nevinosti; čl. 10 — sloboda mišljenja i vere; čl. 11 — sloboda govora i štampe.", "iz_udzbenika": {"strana": 48, "odeljak": "Svedočanstvo: Deklaracija o pravima čoveka i građanina iz 1789.", "tekst": "Odlomak sadrži članove 1, 2, 4, 9, 10 i 11 Deklaracije."}, "lekcija": 6}, {"id": "l06-dekl-izvor-cl4", "vrsta": "izvor", "tezina": "srednje", "pojmovi": ["deklaracija-o-pravima-coveka-i-gradjanina"], "izvor": {"autor": "Deklaracija o pravima čoveka i građanina", "naslov": "Član 4 (1789)", "tekst": "Sloboda znači da čovek sme da radi sve što ne nanosi štetu drugome. Prava svakog čoveka sežu do tačke na kojoj počinju prava drugih ljudi, a tu granicu može da odredi samo zakon.", "napomena": "Odlomak je prepričan; udžbenik, str. 48."}, "pitanje": "Ko, prema ovom članu, sme da odredi granice slobode?", "odgovori": [{"tekst": "Samo zakon", "tacan": true}, {"tekst": "Kralj, po svojoj volji", "tacan": false, "zasto": "Deklaracija odbacuje samovolju kralja — granice postavlja zakon."}, {"tekst": "Crkva", "tacan": false, "zasto": "Član govori o zakonu, ne o crkvi."}, {"tekst": "Svaki čovek sam za sebe", "tacan": false, "zasto": "Tada bi jači mogao da šteti slabijem; zato granice određuje zakon, isti za sve."}], "pomoc": ["Pročitaj poslednju rečenicu odlomka.", "Ista pravila za sve.", "Iz Svedočanstva: takve granice može odrediti samo zakon."], "objasnjenje": "Granice slobode određuje samo zakon — isti za sve, a ne volja vladara.", "iz_udzbenika": {"strana": 48, "odeljak": "Svedočanstvo: Deklaracija o pravima čoveka i građanina iz 1789.", "tekst": "Sloboda je činiti sve što ne šteti drugome; granice slobode može odrediti samo zakon."}, "lekcija": 6}, {"id": "l06-dekl-izvor-cl9", "vrsta": "izvor", "tezina": "tesko", "pojmovi": ["deklaracija-o-pravima-coveka-i-gradjanina", "bastilja"], "izvor": {"autor": "Deklaracija o pravima čoveka i građanina", "naslov": "Član 9 (1789)", "tekst": "Svaki čovek se smatra nevinim sve dok se ne utvrdi da je kriv. Ako je hapšenje neophodno, zakon mora strogo da spreči svaku grubost koja nije potrebna.", "napomena": "Odlomak je prepričan; udžbenik, str. 48."}, "pitanje": "Protiv kakve prakse starog poretka je bio usmeren ovaj član?", "odgovori": [{"tekst": "Protiv zatvaranja ljudi bez dokazane krivice, kao političkih zatvorenika u Bastilji", "tacan": true}, {"tekst": "Protiv plaćanja poreza", "tacan": false, "zasto": "Član govori o hapšenju i krivici, a ne o porezima."}, {"tekst": "Protiv slobode štampe", "tacan": false, "zasto": "Slobodu štampe Deklaracija štiti (čl. 11); ovaj član štiti optužene."}, {"tekst": "Protiv republikanskog kalendara", "tacan": false, "zasto": "Kalendar je uveden tek 1792, posle Deklaracije."}], "pomoc": ["O čemu govori član — o novcu ili o hapšenju?", "Seti se čemu je služila Bastilja.", "Iz Svedočanstva: svako je nevin dok ga ne proglase krivim."], "objasnjenje": "Član 9 uvodi pretpostavku nevinosti — suprotno starom poretku, u kome su protivnici vlasti mogli da završe u Bastilji bez suđenja.", "iz_udzbenika": {"strana": 48, "odeljak": "Svedočanstvo: Deklaracija o pravima čoveka i građanina iz 1789.", "tekst": "Svako se smatra nevinim dok ga ne proglase krivim; prestroga postupanja pri hapšenju moraju se suzbiti zakonom."}, "lekcija": 6}, {"id": "l06-dekl-tn-cl10", "vrsta": "tacno_netacno", "tezina": "srednje", "pojmovi": ["deklaracija-o-pravima-coveka-i-gradjanina", "verska-tolerancija"], "tvrdnja": "Prema Deklaraciji, niko ne sme biti uznemiravan zbog svojih stavova, čak ni verskih, ako ne remeti javni red.", "tacno": true, "pomoc": ["Seti se člana 10.", "Iz Svedočanstva: sloboda mišljenja i vere, dok se ne remeti zakonom utvrđeni javni red."], "objasnjenje": "Tačno — član 10 štiti slobodu mišljenja i vere, uz uslov da se ne narušava javni red.", "iz_udzbenika": {"strana": 48, "odeljak": "Svedočanstvo: Deklaracija o pravima čoveka i građanina iz 1789.", "tekst": "Niko ne sme biti uznemiravan zbog svojih stavova, čak ni verskih, ako ne remeti javni red."}, "lekcija": 6}, {"id": "l06-dekl-tn-cl11", "vrsta": "tacno_netacno", "tezina": "tesko", "pojmovi": ["deklaracija-o-pravima-coveka-i-gradjanina"], "tvrdnja": "Prema članu 11, sloboda štampe je neograničena i za njenu zloupotrebu se ne odgovara.", "tacno": false, "ispravke": [{"tekst": "Svako sme slobodno da govori, piše i štampa, ali odgovara za zloupotrebu u slučajevima koje odredi zakon.", "tacan": true}, {"tekst": "Štampati smeju samo plemići.", "tacan": false, "zasto": "Član 11 se odnosi na svakog građanina."}, {"tekst": "Sloboda štampe je zabranjena.", "tacan": false, "zasto": "Naprotiv — slobodno izražavanje je jedno od najdragocenijih prava."}], "pomoc": ["Pročitaj kraj člana 11.", "Sloboda uvek ima granicu koju određuje zakon.", "Iz Svedočanstva: slobodno se govori i štampa, ali se odgovara za zloupotrebu."], "objasnjenje": "Netačno — sloboda izražavanja je dragoceno pravo, ali se za njenu zloupotrebu odgovara po zakonu.", "iz_udzbenika": {"strana": 48, "odeljak": "Svedočanstvo: Deklaracija o pravima čoveka i građanina iz 1789.", "tekst": "Svaki građanin može slobodno govoriti, pisati i štampati, ali odgovara za zloupotrebu u slučajevima utvrđenim zakonom."}, "lekcija": 6}, {"id": "l06-dekl-zakljuci-cl1", "vrsta": "zakljuci", "tezina": "tesko", "pojmovi": ["deklaracija-o-pravima-coveka-i-gradjanina", "stalezi", "plemstvo"], "pitanje": "Član 1 kaže da se ljudi rađaju slobodni i jednaki u pravima. Šta to znači za plemiće?", "odgovori": [{"tekst": "Plemić više ne može imati posebna prava samo zato što je rođen kao plemić", "tacan": true}, {"tekst": "Plemići postaju jedini slobodni ljudi", "tacan": false, "zasto": "Član govori o SVIM ljudima, ne samo o plemićima."}, {"tekst": "Plemići moraju da postanu sveštenici", "tacan": false, "zasto": "Član ništa ne kaže o zanimanju — govori o jednakim pravima."}, {"tekst": "Ništa se ne menja", "tacan": false, "zasto": "Menja se mnogo — povlastice po rođenju gube osnov."}], "pomoc": ["Korak 1: Kako se postajalo plemić?", "Korak 2: Ako svi imaju ista prava od rođenja, šta biva sa povlasticama po rođenju?", "Iz Svedočanstva: ljudi se rađaju slobodni i imaju ista prava."], "objasnjenje": "Ako se svi rađaju sa istim pravima, nema više povlastica po rođenju — plemstvo gubi posebna prava.", "iz_udzbenika": {"strana": 48, "odeljak": "Svedočanstvo: Deklaracija o pravima čoveka i građanina iz 1789.", "tekst": "Ljudi se rađaju slobodni i imaju ista prava; društvene razlike mogu počivati samo na zajedničkoj koristi."}, "lekcija": 6}, {"id": "l06-dekl-objasni-danas", "vrsta": "objasni", "tezina": "tesko", "pojmovi": ["deklaracija-o-pravima-coveka-i-gradjanina"], "pitanje": "Izdvoj jedan član Deklaracije koji ti se čini najvažnijim i objasni zašto je važan i danas.", "uzor": "Najvažniji mi je član 9: svako je nevin dok mu se ne dokaže krivica. Tako niko ne može biti kažnjen samo zato što se nekome ne sviđa. Taj princip i danas važi u sudovima.", "ideje": ["Tačno je naveden sadržaj izabranog člana.", "Objašnjeno je koga ili šta taj član štiti.", "Povezano je sa današnjim životom."], "objasnjenje": "Članovi Deklaracije (jednakost, nevinost, sloboda mišljenja i štampe) i danas su temelj ljudskih prava.", "iz_udzbenika": {"strana": 48, "odeljak": "Svedočanstvo: Deklaracija o pravima čoveka i građanina iz 1789.", "tekst": "Udžbenik traži da izdvojiš članove koje smatraš važnim i da ih prokomentarišeš."}, "lekcija": 6}, {"id": "l06-dekl-izvor-cl1", "vrsta": "izvor", "tezina": "lako", "pojmovi": ["deklaracija-o-pravima-coveka-i-gradjanina"], "izvor": {"autor": "Deklaracija o pravima čoveka i građanina", "naslov": "Član 1 (1789)", "tekst": "Svi ljudi dolaze na svet slobodni i sa istim pravima. Razlike među ljudima u društvu dozvoljene su samo ako služe opštem dobru.", "napomena": "Odlomak je prepričan; udžbenik, str. 48."}, "pitanje": "Šta prema ovom članu važi za sve ljude?", "odgovori": [{"tekst": "Rađaju se slobodni i sa istim pravima", "tacan": true}, {"tekst": "Rađaju se u različitim staležima sa različitim pravima", "tacan": false, "zasto": "To je staro, staleško društvo koje Deklaracija odbacuje."}, {"tekst": "Moraju da slušaju kralja u svemu", "tacan": false, "zasto": "Član govori o slobodi i jednakosti, a ne o poslušnosti kralju."}, {"tekst": "Svi moraju biti istog zanimanja", "tacan": false, "zasto": "Član govori o jednakim pravima, ne o istom poslu."}], "pomoc": ["Pročitaj prvu rečenicu odlomka.", "Dve ključne reči: slobodni i …", "Iz Svedočanstva: ljudi se rađaju slobodni i imaju ista prava."], "objasnjenje": "Član 1 kaže da se svi ljudi rađaju slobodni i jednaki u pravima.", "iz_udzbenika": {"strana": 48, "odeljak": "Svedočanstvo: Deklaracija o pravima čoveka i građanina iz 1789.", "tekst": "Ljudi se rađaju slobodni i imaju ista prava."}, "lekcija": 6}, {"id": "l06-sir-objasni-deklaracija-lako", "vrsta": "objasni", "tezina": "lako", "pojmovi": ["deklaracija-o-pravima-coveka-i-gradjanina"], "pitanje": "Šta je Deklaracija o pravima čoveka i građanina? Objasni ukratko.", "uzor": "To je dokument koji je skupština usvojila 26. avgusta 1789. U njemu su načela za budući ustav: svi ljudi su jednaki pred zakonom i imaju osnovna ljudska i politička prava.", "ideje": ["Usvojena 26. avgusta 1789.", "Načela za ustav.", "Jednakost pred zakonom i osnovna prava."], "objasnjenje": "Deklaracija je skup načela o jednakosti i pravima na kojima je trebalo izgraditi ustav.", "iz_udzbenika": {"strana": 48, "odeljak": "Širenje revolucije", "tekst": "Deklaracija je predstavljala niz načela na osnovu kojih je trebalo doneti ustav."}, "lekcija": 6}]}, {"naslov": "6. Ustavna monarhija", "zadaci": [{"id": "l06-um-izbor-dvolicnost", "vrsta": "izbor", "tezina": "srednje", "pojmovi": ["luj-xvi"], "pitanje": "Kako se Luj XVI odnosio prema tekovinama revolucije?", "odgovori": [{"tekst": "Javno ih je prihvatao, a tajno tražio pomoć stranih vladara da uguši revoluciju", "tacan": true}, {"tekst": "Iskreno ih je podržavao i predvodio revoluciju", "tacan": false, "zasto": "Tajno je tražio pomoć da se revolucija uguši, pa je nije iskreno podržavao."}, {"tekst": "Otvoreno je objavio rat skupštini", "tacan": false, "zasto": "Javno se pravio da prihvata promene; protiv njih je radio tajno."}, {"tekst": "Odmah je abdicirao i otišao u manastir", "tacan": false, "zasto": "Ostao je kralj do 1792, kada je zbačen."}], "pomoc": ["Razlikuj šta je kralj radio javno, a šta tajno.", "Od koga je tajno tražio pomoć?", "Iz lekcije: javno je prihvatao tekovine, a u tajnosti tražio pomoć evropskih vladara."], "objasnjenje": "Kralj je bio dvoličan — javno je prihvatao promene, a tajno tražio da strani vladari uguše revoluciju.", "iz_udzbenika": {"strana": 49, "odeljak": "Ustavna monarhija", "tekst": "Luj XVI je javno prihvatao tekovine revolucije, a u tajnosti je tražio pomoć drugih evropskih vladara za gušenje revolucije."}, "lekcija": 6}, {"id": "l06-um-tn-bekstvo", "vrsta": "tacno_netacno", "tezina": "lako", "pojmovi": ["luj-xvi"], "tvrdnja": "U leto 1791. kraljevska porodica je uspešno pobegla iz Francuske.", "tacno": false, "ispravke": [{"tekst": "Kraljevska porodica je uhvaćena na granici i uz vojnu pratnju vraćena u Pariz.", "tacan": true}, {"tekst": "Kraljevska porodica je stigla u Beč i tamo ostala.", "tacan": false, "zasto": "Nisu uspeli da napuste Francusku — uhvaćeni su na granici."}, {"tekst": "Kraljevska porodica nije ni pokušala da beži.", "tacan": false, "zasto": "Pokušala je, u leto 1791."}], "pomoc": ["Da li su stigli preko granice?", "Gde je kralj bio posle toga, sve do pogubljenja?", "Iz lekcije: uhvaćeni su na granici i vraćeni u Pariz."], "objasnjenje": "Netačno — bekstvo nije uspelo; porodica je uhvaćena na granici i vraćena u Pariz.", "iz_udzbenika": {"strana": 49, "odeljak": "Ustavna monarhija", "tekst": "U leto 1791. kraljevska porodica pokušala je da pobegne; uhvaćeni su na granici i vraćeni u Pariz."}, "osa": {"naziv": "Bekstvo kraljevske porodice", "od": 1791, "traka": "dogadjaji"}, "lekcija": 6}, {"id": "l06-um-datum-ustav", "vrsta": "datum", "tezina": "lako", "pojmovi": ["ustav", "ustavotvorna-skupstina"], "dogadjaj": "Prvi ustav Francuske", "pitanje": "Koje godine je donet prvi ustav Francuske?", "godina": 1791, "traka": "dogadjaji", "pomoc": ["Dve godine posle pada Bastilje.", "Iste godine kada je kralj pokušao da pobegne.", "Iz lekcije: prvi ustav Francuske 1791."], "objasnjenje": "Ustavotvorna skupština donela je prvi ustav Francuske 1791.", "iz_udzbenika": {"strana": 49, "odeljak": "Ustavna monarhija", "tekst": "Ustavotvorna skupština donela je prvi ustav Francuske 1791."}, "lekcija": 6}, {"id": "l06-um-izbor-uredjenje", "vrsta": "izbor", "tezina": "lako", "pojmovi": ["ustavna-monarhija", "ustav"], "pitanje": "Šta je Francuska postala ustavom iz 1791?", "odgovori": [{"tekst": "Ustavna monarhija", "tacan": true}, {"tekst": "Republika", "tacan": false, "zasto": "Republika je proglašena tek 1792; 1791. Francuska još ima kralja."}, {"tekst": "Apsolutistička monarhija", "tacan": false, "zasto": "Ustav je upravo ograničio kraljevu vlast — to više nije apsolutizam."}, {"tekst": "Carstvo", "tacan": false, "zasto": "Lekcija o carstvu ne govori; Francuska je postala ustavna monarhija."}], "pomoc": ["Kralj je ostao, ali je vlast ograničena.", "Šta ograničava kraljevu vlast?", "Iz lekcije: Francuska je proglašena za ustavnu monarhiju."], "objasnjenje": "Ustavom iz 1791. Francuska je postala ustavna monarhija — kralj ostaje, ali deli vlast sa skupštinom.", "iz_udzbenika": {"strana": 49, "odeljak": "Ustavna monarhija", "tekst": "Francuska je 1791. proglašena za ustavnu monarhiju."}, "lekcija": 6}, {"id": "l06-um-izbor-kralj-pravo", "vrsta": "izbor", "tezina": "srednje", "pojmovi": ["ustavna-monarhija", "luj-xvi", "narodna-skupstina"], "pitanje": "Kakvu je vlast kralj imao po ustavu iz 1791?", "odgovori": [{"tekst": "Delio je vlast sa Narodnom skupštinom, ali je mogao da spreči donošenje zakona", "tacan": true}, {"tekst": "Imao je neograničenu vlast", "tacan": false, "zasto": "To je apsolutizam; ustavna monarhija znači ograničenu vlast."}, {"tekst": "Nije imao nikakvu vlast", "tacan": false, "zasto": "Kralj je i dalje delio vlast i mogao je da spreči donošenje zakona."}, {"tekst": "Birao ga je narod na četiri godine", "tacan": false, "zasto": "Kralj se nije birao — to bi bila republika."}], "pomoc": ["Vlast nije bila ni sva kraljeva ni sva skupštinska.", "Kralj je imao jedno važno pravo nad zakonima.", "Iz lekcije: kralj deli vlast sa skupštinom, ali može da spreči donošenje zakona."], "objasnjenje": "U ustavnoj monarhiji kralj deli vlast sa skupštinom; Luj XVI je zadržao pravo da spreči donošenje zakona.", "iz_udzbenika": {"strana": 49, "odeljak": "Ustavna monarhija", "tekst": "Kralj je delio vlast sa Narodnom skupštinom, ali je imao pravo da spreči donošenje zakona."}, "lekcija": 6}, {"id": "l06-um-izbor-pravo-glasa", "vrsta": "izbor", "tezina": "srednje", "pojmovi": ["pravo-glasa", "ustav"], "pitanje": "Ko je po ustavu iz 1791. imao pravo glasa?", "odgovori": [{"tekst": "Samo imućni, koji su plaćali porez preko određenog iznosa", "tacan": true}, {"tekst": "Svi punoletni muškarci i žene", "tacan": false, "zasto": "Žene i siromašni nisu imali politička prava."}, {"tekst": "Samo plemići i sveštenici", "tacan": false, "zasto": "Povlastice staleža su ukinute; pravo glasa zavisilo je od bogatstva."}, {"tekst": "Samo kralj", "tacan": false, "zasto": "Kralj je delio vlast sa skupštinom koju su birali imućni građani."}], "pomoc": ["Pravo glasa je zavisilo od novca.", "Koliko si poreza plaćao?", "Iz lekcije: pravo glasa samo za imućne koji plaćaju porez preko određenog iznosa."], "objasnjenje": "Pravo glasa imali su samo imućni građani koji su plaćali dovoljno poreza; žene i siromašni nisu.", "iz_udzbenika": {"strana": 49, "odeljak": "Ustavna monarhija", "tekst": "Pravo glasa bilo je rezervisano samo za imućne koji su plaćali porez preko određenog iznosa."}, "lekcija": 6}, {"id": "l06-um-tn-zene", "vrsta": "tacno_netacno", "tezina": "lako", "pojmovi": ["pravo-glasa", "ustav"], "tvrdnja": "Ustav iz 1791. nije dao politička prava ženama i siromašnima.", "tacno": true, "pomoc": ["Ko je imao pravo glasa?", "Iz lekcije: žene i siromašni nisu imali politička prava."], "objasnjenje": "Tačno — puna politička jednakost nije ostvarena; žene i siromašni nisu imali politička prava.", "iz_udzbenika": {"strana": 49, "odeljak": "Ustavna monarhija", "tekst": "Žene i siromašni nisu imali politička prava."}, "lekcija": 6}, {"id": "l06-um-dopuni-tolerancija", "vrsta": "dopuni", "tezina": "srednje", "pojmovi": ["verska-tolerancija", "ustav"], "pitanje": "Dopuni rečenicu o ustavu iz 1791.", "tekst": "Ustav je proglasio versku {{toleranciju|trpeljivost}} prema {{protestantima}} i Jevrejima.", "ponudjene": ["toleranciju", "protestantima", "katolicima", "zabranu"], "pomoc": ["Tolerancija znači trpeljivost, poštovanje druge vere.", "Većina Francuza su bili katolici — tolerancija se odnosi na manjine.", "Iz lekcije: verska tolerancija prema protestantima i Jevrejima."], "objasnjenje": "Ustav iz 1791. proglasio je versku toleranciju prema protestantima i Jevrejima.", "iz_udzbenika": {"strana": 49, "odeljak": "Ustavna monarhija", "tekst": "Ustav je proglasio versku toleranciju prema protestantima i Jevrejima."}, "lekcija": 6}, {"id": "l06-um-zakljuci-jednakost", "vrsta": "zakljuci", "tezina": "tesko", "pojmovi": ["pravo-glasa", "deklaracija-o-pravima-coveka-i-gradjanina", "ustav"], "pitanje": "Zašto se kaže da ustav iz 1791. nije do kraja ostvario ideje Deklaracije?", "odgovori": [{"tekst": "Jer je potvrdio jednakost građana, ali je pravo glasa dao samo imućnima", "tacan": true}, {"tekst": "Jer je vratio povlastice plemstvu", "tacan": false, "zasto": "Povlastice nisu vraćene; problem je bilo pravo glasa zasnovano na imovini."}, {"tekst": "Jer je zabranio sve vere osim katoličke", "tacan": false, "zasto": "Naprotiv, proglasio je versku toleranciju."}, {"tekst": "Jer je ukinuo kralja", "tacan": false, "zasto": "Ustav iz 1791. je zadržao kralja — ustavna monarhija."}], "pomoc": ["Korak 1: Šta Deklaracija kaže o jednakosti?", "Korak 2: Da li su po ustavu svi mogli da glasaju?", "Iz lekcije: ravnopravnost potvrđena, ali puna politička jednakost nije ostvarena."], "objasnjenje": "Deklaracija kaže da su svi jednaki, a ustav je pravo glasa vezao za bogatstvo — žene i siromašni ostali su bez političkih prava.", "iz_udzbenika": {"strana": 49, "odeljak": "Ustavna monarhija", "tekst": "Ustav je potvrdio ravnopravnost građana, ali puna politička jednakost nije ostvarena."}, "lekcija": 6}, {"id": "l06-um-lanac-bekstvo", "vrsta": "lanac", "tezina": "srednje", "pojmovi": ["luj-xvi", "ustavna-monarhija"], "karike": ["Kralj tajno traži pomoć stranih vladara", "?", "Porodica je uhvaćena na granici i vraćena u Pariz"], "praznina": 1, "odgovori": [{"tekst": "Kraljevska porodica u leto 1791. pokušava da pobegne iz Francuske", "tacan": true}, {"tekst": "Kralj proglašava republiku", "tacan": false, "zasto": "Republiku je proglasila skupština 1792. godine."}, {"tekst": "Kralj predvodi marš na Versaj", "tacan": false, "zasto": "Marš na Versaj su predvodile gladne Parižanke, protiv kralja."}], "pomoc": ["Šta se desilo pre hapšenja na granici?", "Hteo je da ode kod onih od kojih je tražio pomoć.", "Iz lekcije: u leto 1791. porodica je pokušala da pobegne."], "objasnjenje": "Kralj je tajno računao na strane vladare, a u leto 1791. pokušao je da pobegne — ali je uhvaćen na granici.", "iz_udzbenika": {"strana": 49, "odeljak": "Ustavna monarhija", "tekst": "Kralj je tajno tražio pomoć; u leto 1791. porodica je pokušala da pobegne, ali je uhvaćena na granici."}, "lekcija": 6}, {"id": "l06-um-uporedi-1791", "vrsta": "uporedi", "tezina": "tesko", "pojmovi": ["ustavna-monarhija", "apsolutisticka-monarhija", "ustav", "luj-xvi"], "a": "Apsolutistička monarhija (pre 1789)", "b": "Ustavna monarhija (ustav 1791)", "pitanje": "Na koje uređenje Francuske se odnosi tvrdnja — pre revolucije, po ustavu 1791, oba ili nijedno?", "tvrdnje": [{"tekst": "Kralj ima neograničenu vlast.", "odgovor": "a", "zasto": "To je apsolutizam; ustav je kraljevu vlast ograničio."}, {"tekst": "Kralj deli vlast sa Narodnom skupštinom.", "odgovor": "b", "zasto": "Po ustavu 1791. vlast je podeljena između kralja i skupštine."}, {"tekst": "Na čelu države je kralj Luj XVI.", "odgovor": "oba", "zasto": "Luj XVI je vladao i pre revolucije i u ustavnoj monarhiji — sve do 1792."}, {"tekst": "Sveštenstvo i plemstvo ne plaćaju porez.", "odgovor": "a", "zasto": "Poreske povlastice ukinute su već 1789."}, {"tekst": "Proglašena je verska tolerancija prema protestantima i Jevrejima.", "odgovor": "b", "zasto": "To je proglasio ustav iz 1791."}, {"tekst": "Žene imaju pravo glasa.", "odgovor": "nijedan", "zasto": "Ni ustav iz 1791. ženama nije dao politička prava."}], "pomoc": ["Šta je revolucija promenila, a šta je ostalo isto?", "Kralj je ostao, ali sa manje vlasti.", "Iz lekcije: ustav 1791 — ustavna monarhija, ograničena vlast kralja, verska tolerancija; žene bez prava."], "objasnjenje": "Pre 1789. kralj je bio apsolutni vladar, a staleži povlašćeni; ustav 1791. ograničava kralja i uvodi versku toleranciju — ali ni tada žene ne glasaju.", "iz_udzbenika": {"strana": 49, "odeljak": "Ustavna monarhija", "tekst": "Ustavom iz 1791. Francuska je postala ustavna monarhija u kojoj kralj deli vlast sa Narodnom skupštinom."}, "lekcija": 6}, {"id": "l06-um-poredjaj", "vrsta": "poredjaj", "tezina": "srednje", "pojmovi": ["bastilja", "ustav", "republika"], "pitanje": "Poređaj događaje hronološki.", "stavke": [{"tekst": "Pad Bastilje", "godina": 1789, "naziv": "Pad Bastilje", "traka": "dogadjaji"}, {"tekst": "Prvi ustav Francuske — ustavna monarhija", "godina": 1791, "naziv": "Prvi ustav Francuske", "traka": "dogadjaji"}, {"tekst": "Proglašenje republike", "godina": 1792, "naziv": "Proglašenje republike u Francuskoj", "traka": "dogadjaji"}, {"tekst": "Pogubljenje Luja XVI", "godina": 1793, "naziv": "Pogubljenje Luja XVI", "traka": "dogadjaji"}], "pomoc": ["Revolucija počinje padom Bastilje.", "Kralj je morao biti zbačen pre nego što je pogubljen.", "Iz lekcije: 1789 — 1791 — 1792 — 1793."], "objasnjenje": "Pad Bastilje (1789) → ustav i ustavna monarhija (1791) → republika (1792) → pogubljenje kralja (1793).", "iz_udzbenika": {"strana": 49, "odeljak": "Ustavna monarhija", "tekst": "Posle pada Bastilje (1789) donet je ustav (1791), a zatim je proglašena republika (1792)."}, "lekcija": 6}, {"id": "l06-um-objasni-ustavna", "vrsta": "objasni", "tezina": "srednje", "pojmovi": ["ustavna-monarhija", "ustav"], "pitanje": "Šta je ustavna monarhija? Objasni na primeru Francuske 1791.", "uzor": "Ustavna monarhija je država u kojoj postoji kralj, ali je njegova vlast ograničena ustavom. U Francuskoj je od 1791. Luj XVI delio vlast sa Narodnom skupštinom, mada je mogao da spreči donošenje zakona.", "ideje": ["Na čelu je kralj.", "Vlast mu ograničava ustav.", "Vlast deli sa skupštinom."], "objasnjenje": "U ustavnoj monarhiji kralj ne vlada sam — ustav propisuje i ograničava njegovu vlast.", "iz_udzbenika": {"strana": 49, "odeljak": "Ustavna monarhija", "tekst": "Francuska je 1791. postala ustavna monarhija: kralj je delio vlast sa Narodnom skupštinom."}, "lekcija": 6}]}, {"naslov": "6. Proglašenje republike", "zadaci": [{"id": "l06-rep-izbor-zakonodavna", "vrsta": "izbor", "tezina": "srednje", "pojmovi": ["zakonodavna-skupstina", "ustavotvorna-skupstina"], "pitanje": "Koja skupština je izabrana kada je, posle donošenja ustava, raspuštena Ustavotvorna skupština?", "odgovori": [{"tekst": "Zakonodavna skupština", "tacan": true}, {"tekst": "Skupština državnih staleža", "tacan": false, "zasto": "Nju je kralj sazvao 1789; staleži su u međuvremenu ukinuti."}, {"tekst": "Komitet javnog spasa", "tacan": false, "zasto": "Komitet je odbor iz vremena jakobinske diktature, a ne skupština."}, {"tekst": "Direktorijum", "tacan": false, "zasto": "Direktorijum je vlada od pet direktora, od 1795."}], "pomoc": ["Ustav je donet — sledeći posao skupštine su zakoni.", "Naziv dolazi od reči „zakon”.", "Iz lekcije: izabrana je nova Zakonodavna skupština."], "objasnjenje": "Kad je ustav donet, Ustavotvorna skupština je ispunila zadatak i raspuštena je; izabrana je Zakonodavna skupština.", "iz_udzbenika": {"strana": 49, "odeljak": "Proglašenje republike", "tekst": "Donošenjem ustava raspuštena je Ustavotvorna skupština i izabrana nova Zakonodavna skupština."}, "lekcija": 6}, {"id": "l06-rep-uporedi-struje", "vrsta": "uporedi", "tezina": "srednje", "pojmovi": ["zirondinci", "jakobinci", "maksimilijan-robespjer"], "a": "Žirondinci", "b": "Jakobinci", "pitanje": "Na koga se odnosi tvrdnja — na žirondince, jakobince, obe struje ili nijednu?", "tvrdnje": [{"tekst": "Bili su umerenija struja.", "odgovor": "a", "zasto": "Žirondinci su umerena demokratska struja."}, {"tekst": "Tražili su dalje reforme i opšte pravo glasa.", "odgovor": "b", "zasto": "Jakobinci su bili radikalni i tražili su opšte pravo glasa."}, {"tekst": "Ime su dobili po oblasti iz koje su poticale njihove vođe.", "odgovor": "a", "zasto": "Ime žirondinaca dolazi od oblasti Žironda."}, {"tekst": "Ime su dobili po manastiru u kome su se sastajali.", "odgovor": "b", "zasto": "Jakobinci su se sastajali u manastiru Sv. Jakova."}, {"tekst": "Jedan od vođa bio je Maksimilijan Robespjer.", "odgovor": "b", "zasto": "Robespjer je bio vođa jakobinaca."}, {"tekst": "Imali su važnu ulogu u Zakonodavnoj skupštini kao pristalice republike.", "odgovor": "oba", "zasto": "Obe struje su bile republikanske i delovale su u Zakonodavnoj skupštini."}, {"tekst": "Branili su apsolutnu vlast kralja.", "odgovor": "nijedan", "zasto": "Obe struje su bile za republiku, a ne za apsolutizam."}], "pomoc": ["Umereni naspram radikalnih.", "Jedno ime je po oblasti, drugo po svetitelju.", "Iz lekcije: žirondinci umereni (Žironda), jakobinci radikalni (manastir Sv. Jakova, Robespjer)."], "objasnjenje": "Obe struje su republikanske; žirondinci su umereni i nazvani po Žirondi, jakobinci radikalni, nazvani po manastiru Sv. Jakova, sa Robespjerom kao vođom.", "iz_udzbenika": {"strana": 49, "odeljak": "Proglašenje republike", "tekst": "Umereniju struju činili su žirondinci, a jakobinci su bili za dalje reforme i opšte pravo glasa."}, "lekcija": 6}, {"id": "l06-rep-povezi-imena", "vrsta": "povezi", "tezina": "lako", "pojmovi": ["zirondinci", "jakobinci"], "pitanje": "Poveži političku struju sa poreklom njenog imena.", "parovi": [["žirondinci", "oblast Žironda"], ["jakobinci", "manastir Sv. Jakova"]], "pomoc": ["Ime koje počinje kao „Žir…” krije naziv oblasti.", "„Jakob” je Jakov.", "Iz lekcije: žirondinci — Žironda; jakobinci — manastir Sv. Jakova."], "objasnjenje": "Žirondinci su nazvani po oblasti Žironda (odakle su im bile vođe), a jakobinci po manastiru Sv. Jakova (gde su se sastajali).", "iz_udzbenika": {"strana": 49, "odeljak": "Definicije („?\" kućice)", "tekst": "Žirondinci su dobili ime po oblasti Žironda, a jakobinci po manastiru Sv. Jakova."}, "lekcija": 6}, {"id": "l06-rep-tn-robespjer", "vrsta": "tacno_netacno", "tezina": "lako", "pojmovi": ["maksimilijan-robespjer", "jakobinci"], "tvrdnja": "Maksimilijan Robespjer, po zanimanju pravnik, bio je jedan od vođa jakobinaca.", "tacno": true, "pomoc": ["Seti se ko je predvodio radikalnu struju.", "Iz lekcije: jedan od vođa jakobinaca bio je pravnik Maksimilijan Robespjer."], "objasnjenje": "Tačno — pravnik Maksimilijan Robespjer bio je jedan od vođa jakobinaca.", "iz_udzbenika": {"strana": 49, "odeljak": "Proglašenje republike", "tekst": "Jedan od vođa jakobinaca bio je pravnik Maksimilijan Robespjer.", "slika": "06-francuska-revolucija/08-maksimilijan-robespjer.jpg"}, "lekcija": 6}, {"id": "l06-rep-izbor-rat", "vrsta": "izbor", "tezina": "lako", "pojmovi": ["habzburska-monarhija", "pruska"], "pitanje": "Kojim državama su francuski revolucionari objavili rat 1792?", "odgovori": [{"tekst": "Habzburškoj monarhiji (Austriji) i Pruskoj", "tacan": true}, {"tekst": "Velikoj Britaniji i Americi", "tacan": false, "zasto": "Engleska je ušla u rat tek posle pogubljenja kralja 1793, a Ameriku je Francuska ranije podržala."}, {"tekst": "Rusiji i Osmanskom carstvu", "tacan": false, "zasto": "Lekcija ih ne pominje; savez su sklopile Austrija i Pruska."}, {"tekst": "Španiji i Holandiji", "tacan": false, "zasto": "One su objavile rat Francuskoj tek posle pogubljenja kralja."}], "pomoc": ["Koje dve države su sklopile savez protiv revolucije?", "Jedna je imala habzburšku dinastiju.", "Iz lekcije: Habzburška monarhija (Austrija) i Pruska sklopile su savez, pa im je objavljen rat 1792."], "objasnjenje": "Kad su Austrija i Pruska sklopile savez, revolucionari su im 1792. objavili rat.", "iz_udzbenika": {"strana": 49, "odeljak": "Proglašenje republike", "tekst": "Habzburška monarhija i Pruska sklopile su savez, pa su im revolucionari objavili rat 1792."}, "osa": {"naziv": "Rat Habzburškoj monarhiji i Pruskoj", "od": 1792, "traka": "dogadjaji"}, "lekcija": 6}, {"id": "l06-rep-zakljuci-strah", "vrsta": "zakljuci", "tezina": "srednje", "pojmovi": ["habzburska-monarhija", "pruska", "francuska-revolucija"], "pitanje": "Zašto su se Habzburška monarhija i Pruska udružile protiv revolucionarne Francuske?", "odgovori": [{"tekst": "Plašile su se da će revolucija zahvatiti i njihove zemlje", "tacan": true}, {"tekst": "Htele su da Francuskoj pomognu da postane republika", "tacan": false, "zasto": "Bile su monarhije i bojale su se revolucije, a ne da je pomognu."}, {"tekst": "Francuska im je prva objavila rat bez razloga", "tacan": false, "zasto": "Francuska je objavila rat tek kad su sklopile savez protiv nje."}, {"tekst": "Htele su da zaštite žirondince", "tacan": false, "zasto": "Strane monarhije nisu štitile nijednu revolucionarnu struju."}], "pomoc": ["Korak 1: Kakvo su uređenje imale ove države?", "Korak 2: Čega se boji apsolutni vladar kad vidi da je susedni kralj izgubio vlast?", "Iz lekcije: evropski dvorovi plašili su se da će revolucija zahvatiti i njihove zemlje."], "objasnjenje": "Evropski monarsi su se bojali da će se revolucija preliti i na njihove države, pa su se udružili.", "iz_udzbenika": {"strana": 49, "odeljak": "Proglašenje republike", "tekst": "Evropski dvorovi plašili su se da će revolucija zahvatiti i njihove zemlje."}, "lekcija": 6}, {"id": "l06-rep-izbor-zasto-rat", "vrsta": "izbor", "tezina": "tesko", "pojmovi": ["francuska-revolucija", "svestenstvo", "plemstvo"], "pitanje": "Šta su neki revolucionari očekivali od rata? (više tačnih)", "odgovori": [{"tekst": "Da će ujediniti zemlju", "tacan": true}, {"tekst": "Da će probuditi narod", "tacan": true}, {"tekst": "Da će razotkriti protivnike revolucije na dvoru i među sveštenstvom i plemstvom", "tacan": true}, {"tekst": "Da će vratiti kralju apsolutnu vlast", "tacan": false, "zasto": "Revolucionari su hteli suprotno — da razotkriju kraljeve pristalice."}, {"tekst": "Da će doneti nove kolonije", "tacan": false, "zasto": "Lekcija ne pominje kolonije; ciljevi su bili unutrašnji."}], "pomoc": ["Rat protiv spoljnog neprijatelja može da okupi narod.", "U ratu se vidi ko je na čijoj strani.", "Iz lekcije: ujediniti zemlju, probuditi narod, razotkriti protivnike."], "objasnjenje": "Neki revolucionari su verovali da će rat ujediniti zemlju, probuditi narod i razotkriti protivnike revolucije.", "iz_udzbenika": {"strana": 49, "odeljak": "Proglašenje republike", "tekst": "Pojedini revolucionari smatrali su da će rat ujediniti zemlju, probuditi narod i razotkriti protivnike revolucije."}, "lekcija": 6}, {"id": "l06-rep-datum-zbacivanje", "vrsta": "datum", "tezina": "srednje", "pojmovi": ["luj-xvi"], "dogadjaj": "Zbacivanje Luja XVI", "pitanje": "Koje godine je skupština zbacila kralja Luja XVI?", "godina": 1792, "traka": "dogadjaji", "pomoc": ["Iste godine kada je počeo rat sa Austrijom i Pruskom.", "Desilo se 10. avgusta, mesec i po pre proglašenja republike.", "Iz lekcije: 10. avgusta 1792. skupština je zbacila kralja."], "objasnjenje": "Pod pritiskom Parižana skupština je 10. avgusta 1792. zbacila kralja.", "iz_udzbenika": {"strana": 49, "odeljak": "Proglašenje republike", "tekst": "Skupština je, pod pritiskom Parižana, 10. avgusta 1792. zbacila kralja."}, "lekcija": 6}, {"id": "l06-rep-datum-republika", "vrsta": "datum", "tezina": "lako", "pojmovi": ["republika", "francuska"], "dogadjaj": "Proglašenje republike u Francuskoj", "pitanje": "Koje godine je Francuska proglašena za republiku?", "godina": 1792, "traka": "dogadjaji", "pomoc": ["Iste godine kada je kralj zbačen.", "Tri godine posle pada Bastilje.", "Iz lekcije: 22. septembra 1792."], "objasnjenje": "Francuska je proglašena za republiku 22. septembra 1792.", "iz_udzbenika": {"strana": 49, "odeljak": "Proglašenje republike", "tekst": "Francuska je 22. septembra 1792. proglašena za republiku."}, "lekcija": 6}, {"id": "l06-rep-dopuni-datumi", "vrsta": "dopuni", "tezina": "tesko", "pojmovi": ["luj-xvi", "republika", "jakobinci"], "pitanje": "Dopuni datume (bez banke reči).", "tekst": "Skupština je zbacila kralja {{10}}. avgusta 1792, a Francuska je proglašena za republiku {{22}}. septembra iste godine, kada su u novoj skupštini glavnu reč vodili {{jakobinci}}.", "pomoc": ["Kralj je zbačen u prvoj trećini avgusta.", "Republika je proglašena krajem septembra; isti dan je i početak republikanskog kalendara.", "Iz lekcije: 10. avgust 1792 — zbacivanje; 22. septembar 1792 — republika; vode jakobinci."], "objasnjenje": "Kralj je zbačen 10. avgusta 1792, a republika proglašena 22. septembra 1792; u novoj skupštini vodili su jakobinci.", "iz_udzbenika": {"strana": 49, "odeljak": "Proglašenje republike", "tekst": "Skupština je 10. avgusta 1792. zbacila kralja, a 22. septembra 1792. proglašena je republika."}, "lekcija": 6}, {"id": "l06-rep-lanac-republika", "vrsta": "lanac", "tezina": "srednje", "pojmovi": ["luj-xvi", "republika", "jakobinci"], "karike": ["Pod pritiskom Parižana skupština 10. avgusta 1792. zbacuje kralja", "Bira se nova skupština u kojoj glavnu reč vode jakobinci", "?"], "praznina": 2, "odgovori": [{"tekst": "Francuska je 22. septembra 1792. proglašena za republiku", "tacan": true}, {"tekst": "Luj XVI se vraća na presto", "tacan": false, "zasto": "Kralj je zbačen, suđeno mu je i pogubljen je 1793."}, {"tekst": "Vlast preuzima Direktorijum", "tacan": false, "zasto": "Direktorijum dolazi tek 1795, posle pada jakobinaca."}], "pomoc": ["Ako nema kralja, kakva je država?", "Jakobinci su bili republikanci.", "Iz lekcije: 22. septembra 1792. proglašena je republika."], "objasnjenje": "Zbacivanje kralja i jakobinska većina vode proglašenju republike 22. septembra 1792.", "iz_udzbenika": {"strana": 49, "odeljak": "Proglašenje republike", "tekst": "Posle zbacivanja kralja izabrana je skupština sa jakobinskom većinom, a 22. septembra 1792. proglašena je republika."}, "lekcija": 6}, {"id": "l06-rep-datum-pogubljenje", "vrsta": "datum", "tezina": "lako", "pojmovi": ["luj-xvi", "gilotina"], "dogadjaj": "Pogubljenje Luja XVI", "pitanje": "Koje godine je javno pogubljen Luj XVI?", "godina": 1793, "traka": "dogadjaji", "pomoc": ["Godinu posle proglašenja republike.", "Početkom te godine; iste godine pogubljena je i kraljica.", "Iz lekcije: početkom 1793."], "objasnjenje": "Svrgnuti kralj Luj XVI javno je pogubljen u Parizu početkom 1793.", "iz_udzbenika": {"strana": 50, "odeljak": "Proglašenje republike", "tekst": "Svrgnuti kralj Luj XVI osuđen je na smrt i javno pogubljen u Parizu početkom 1793."}, "lekcija": 6}, {"id": "l06-rep-izbor-rat-evropa", "vrsta": "izbor", "tezina": "srednje", "pojmovi": ["engleska", "spanija", "holandija", "republika"], "pitanje": "Koje su zemlje objavile rat Francuskoj posle pogubljenja kralja? (više tačnih)", "odgovori": [{"tekst": "Engleska", "tacan": true}, {"tekst": "Španija", "tacan": true}, {"tekst": "Holandija", "tacan": true}, {"tekst": "Sjedinjene Američke Države", "tacan": false, "zasto": "Lekcija ih ne pominje; Francuska je ranije pomagala Američkoj revoluciji."}, {"tekst": "Švajcarska", "tacan": false, "zasto": "Švajcarska se ne pominje među zemljama koje su objavile rat."}], "pomoc": ["Jedna je ostrvska, jedna na Pirinejskom poluostrvu, jedna nizijska.", "Lekcija kaže: „i druge zemlje” — ali imenuje tri.", "Iz lekcije: Engleska, Španija, Holandija i druge."], "objasnjenje": "Posle pogubljenja kralja rat Francuskoj objavljuju Engleska, Španija, Holandija i druge zemlje.", "iz_udzbenika": {"strana": 50, "odeljak": "Proglašenje republike", "tekst": "Posle pogubljenja kralja Engleska, Španija, Holandija i druge zemlje objavile su rat Francuskoj."}, "lekcija": 6}, {"id": "l06-rep-zakljuci-cela-evropa", "vrsta": "zakljuci", "tezina": "tesko", "pojmovi": ["luj-xvi", "republika", "engleska"], "pitanje": "Zašto je pogubljenje kralja dovelo Francusku u rat sa gotovo celom Evropom?", "odgovori": [{"tekst": "Evropski monarsi su u tome videli opasan primer za svoje zemlje", "tacan": true}, {"tekst": "Luj XVI je bio kralj svih evropskih zemalja", "tacan": false, "zasto": "Luj XVI je bio samo francuski kralj."}, {"tekst": "Francuska je posle pogubljenja ukinula vojsku", "tacan": false, "zasto": "Nije — jakobinska vlast je čak nizala pobede nad spoljnim neprijateljem."}, {"tekst": "Robespjer je pozvao druge zemlje da napadnu Francusku", "tacan": false, "zasto": "Robespjer je bio vođa revolucije i borio se protiv tih zemalja."}], "pomoc": ["Korak 1: Kakvo su uređenje imale gotovo sve evropske države?", "Korak 2: Šta poruka „narod je pogubio kralja” znači za druge kraljeve?", "Iz lekcije: mlada republika se našla u sukobu sa gotovo celom Evropom."], "objasnjenje": "Pogubljenje kralja uplašilo je evropske monarhe, jer je pokazalo da narod može da ukloni vladara — zato su ratovali protiv republike.", "iz_udzbenika": {"strana": 50, "odeljak": "Proglašenje republike", "tekst": "Posle pogubljenja kralja mnoge države su objavile rat i mlada republika se našla u sukobu sa gotovo celom Evropom."}, "lekcija": 6}, {"id": "l06-rep-objasni-period", "vrsta": "objasni", "tezina": "tesko", "pojmovi": ["republika", "luj-xvi", "jakobinci", "pariz"], "pitanje": "Kako je Francuska od ustavne monarhije postala republika? Opiši korake.", "uzor": "Rat sa Austrijom i Pruskom 1792. i nepoverenje u kralja pojačali su pritisak Parižana. Skupština je 10. avgusta 1792. zbacila kralja. Izabrana je nova skupština u kojoj su vodili jakobinci, i ona je 22. septembra 1792. proglasila republiku.", "ideje": ["Rat i nepoverenje prema kralju.", "Pritisak Parižana i zbacivanje kralja 10. avgusta 1792.", "Nova skupština sa jakobinskom većinom.", "Republika 22. septembra 1792."], "objasnjenje": "Ključni koraci su rat, zbacivanje kralja, jakobinska skupština i proglašenje republike.", "iz_udzbenika": {"strana": 49, "odeljak": "Proglašenje republike", "tekst": "Skupština je 10. avgusta 1792. zbacila kralja; nova skupština, u kojoj su vodili jakobinci, proglasila je republiku 22. septembra 1792."}, "lekcija": 6}, {"id": "l06-ma-ko-sam", "vrsta": "ko_sam", "tezina": "srednje", "pojmovi": ["marija-antoaneta", "marija-terezija", "luj-xvi", "gilotina"], "tragovi": ["Rođena sam 1755. godine.", "Moja majka bila je habzburška carica Marija Terezija.", "Bila sam žena francuskog kralja Luja XVI i pogubljena sam na giljotini 1793."], "odgovori": [{"tekst": "Marija Antoaneta", "tacan": true}, {"tekst": "Marija Terezija", "tacan": false, "zasto": "Marija Terezija je bila njena majka, habzburška carica."}, {"tekst": "Katarina II Velika", "tacan": false, "zasto": "Katarina II je bila ruska carica iz lekcije o prosvetiteljstvu."}, {"tekst": "Jedna od Parižanki iz marša na Versaj", "tacan": false, "zasto": "Žene iz marša su bile gladne Parižanke, a ne kraljica."}], "objasnjenje": "To je Marija Antoaneta (1755–1793), francuska kraljica, ćerka Marije Terezije, pogubljena 1793.", "iz_udzbenika": {"strana": 49, "odeljak": "Potpis: Marija Antoaneta", "tekst": "Marija Antoaneta (1755–1793), žena Luja XVI i ćerka Marije Terezije, pogubljena je na giljotini 1793.", "slika": "06-francuska-revolucija/06-marija-antoaneta.jpg"}, "lekcija": 6}, {"id": "l06-ma-tn-giljotina", "vrsta": "tacno_netacno", "tezina": "srednje", "pojmovi": ["marija-antoaneta", "gilotina"], "tvrdnja": "Marija Antoaneta je pogubljena pre svog muža Luja XVI.", "tacno": false, "ispravke": [{"tekst": "Marija Antoaneta je pogubljena posle svog muža, 1793.", "tacan": true}, {"tekst": "Marija Antoaneta je pobegla iz Francuske i preživela.", "tacan": false, "zasto": "Porodica je uhvaćena na granici 1791, a kraljica je pogubljena 1793."}, {"tekst": "Marija Antoaneta je pogubljena 1789, posle pada Bastilje.", "tacan": false, "zasto": "Pogubljena je 1793, posle kralja."}], "pomoc": ["Ko je prvi izveden pred sud?", "Udžbenik je naziva „kraljeva udovica”.", "Iz lekcije: posle pogubljenja kralja pogubljena je i kraljeva udovica."], "objasnjenje": "Netačno — prvo je pogubljen kralj (početkom 1793), a zatim njegova udovica Marija Antoaneta (iste godine).", "iz_udzbenika": {"strana": 49, "odeljak": "Potpis: Marija Antoaneta", "tekst": "Marija Antoaneta je ubijena na giljotini 1793, posle svog muža Luja XVI.", "slika": "06-francuska-revolucija/06-marija-antoaneta.jpg"}, "lekcija": 6}, {"id": "l06-ma-izvor-anegdota", "vrsta": "izvor", "tezina": "tesko", "pojmovi": ["marija-antoaneta", "mars-zena-na-versaj"], "izvor": {"autor": "Anegdota o Mariji Antoaneti", "naslov": "Navodna izreka kraljice (prepričano)", "tekst": "Priča se da je kraljica, kada su joj rekli da se narod buni jer nema hleba, odgovorila da ljudi onda mogu da jedu kolače.", "napomena": "Prepričana anegdota iz potpisa uz sliku; udžbenik, str. 49. Udžbenik naglašava da je izreka navodna."}, "pitanje": "Šta je ova anegdota trebalo da pokaže o kraljici?", "odgovori": [{"tekst": "Da je bila daleko od života običnih ljudi i nije razumela njihovu glad", "tacan": true}, {"tekst": "Da je bila vrlo dobra kuvarica", "tacan": false, "zasto": "Anegdota ne govori o kuvanju, već o neosetljivosti prema gladnima."}, {"tekst": "Da je delila hranu gladnima", "tacan": false, "zasto": "Upravo suprotno — kolači umesto hleba pokazuju nerazumevanje."}, {"tekst": "Da je predvodila marš žena na Versaj", "tacan": false, "zasto": "Marš su predvodile gladne Parižanke, protiv dvora."}], "pomoc": ["Može li gladan čovek koji nema za hleb da kupi kolače?", "Šta kraljica, po anegdoti, ne razume?", "Iz lekcije: izreka je navodno izrečena kada je čula da je narod gladan i da se buni."], "objasnjenje": "Anegdota (koju udžbenik naziva navodnom) prikazuje kraljicu kao nekog ko ne razume nevolju gladnog naroda.", "iz_udzbenika": {"strana": 49, "odeljak": "Potpis: Marija Antoaneta", "tekst": "O Mariji Antoaneti postoje mnoge anegdote; najpoznatija je njena navodna izreka o hlebu i kolačima.", "slika": "06-francuska-revolucija/06-marija-antoaneta.jpg"}, "osa": {"naziv": "Marija Antoaneta", "od": 1755, "do": 1793, "traka": "vladari"}, "lekcija": 6}, {"id": "l06-kal-izbor-pocetak", "vrsta": "izbor", "tezina": "srednje", "pojmovi": ["republikanski-kalendar", "republika"], "pitanje": "Koji dan je uzet za početak republikanskog kalendara?", "odgovori": [{"tekst": "Dan proglašenja republike, 22. septembar 1792.", "tacan": true}, {"tekst": "Dan pada Bastilje, 14. jul 1789.", "tacan": false, "zasto": "Pad Bastilje je početak revolucije, ali kalendar broji od proglašenja republike."}, {"tekst": "Dan usvajanja Deklaracije, 26. avgust 1789.", "tacan": false, "zasto": "Kalendar nije računao od Deklaracije, već od republike."}, {"tekst": "1. januar 1793.", "tacan": false, "zasto": "Nova godina je počinjala u jesen, danom republike."}], "pomoc": ["Kalendar se zove „republikanski”.", "Prvi dan Prve godine je dan kada je nastala republika.", "Iz lekcije: 22. septembar 1792 = prvi dan Prve godine."], "objasnjenje": "Republikanski kalendar je brojao godine od proglašenja republike — 22. septembar 1792. bio je prvi dan Prve godine.", "iz_udzbenika": {"strana": 50, "odeljak": "Znatiželja: Republikanski kalendar", "tekst": "Za početak novog kalendara uzet je datum proglašenja republike, 22. septembar 1792."}, "osa": {"naziv": "Republikanski kalendar", "od": 1792, "do": 1806, "traka": "ideje"}, "lekcija": 6}, {"id": "l06-kal-povezi-meseci", "vrsta": "povezi", "tezina": "lako", "pojmovi": ["republikanski-kalendar"], "pitanje": "Poveži jesenji mesec republikanskog kalendara sa značenjem njegovog imena.", "parovi": [["vandemijer", "berba grožđa"], ["brimer", "magla"], ["frimer", "mraz"]], "pomoc": ["Imena su po poljskim radovima ili vremenu.", "Prvi jesenji mesec je mesec berbe.", "Iz lekcije: vandemijer — berba grožđa, brimer — magla, frimer — mraz."], "objasnjenje": "Vandemijer = berba grožđa, brimer = magla, frimer = mraz.", "iz_udzbenika": {"strana": 50, "odeljak": "Znatiželja: Republikanski kalendar", "tekst": "Jesenji meseci bili su vandemijer (berba grožđa), brimer (magla) i frimer (mraz).", "slika": "06-francuska-revolucija/07-vandemijer-gravira.jpg"}, "lekcija": 6}, {"id": "l06-kal-tn-nedelje", "vrsta": "tacno_netacno", "tezina": "srednje", "pojmovi": ["republikanski-kalendar"], "tvrdnja": "U republikanskom kalendaru mesec je bio podeljen na četiri sedmodnevne nedelje.", "tacno": false, "ispravke": [{"tekst": "Mesec je bio podeljen na tri desetodnevne nedelje.", "tacan": true}, {"tekst": "Mesec nije bio deljen na nedelje.", "tacan": false, "zasto": "Bio je — na tri nedelje od po deset dana."}, {"tekst": "Mesec je bio podeljen na dve petnaestodnevne nedelje.", "tacan": false, "zasto": "Nedelje su imale po deset dana, a bilo ih je tri."}], "pomoc": ["Revolucionari su voleli broj deset (kao u metričkom sistemu).", "3 × 10 = 30 dana.", "Iz lekcije: meseci su se delili na tri desetodnevne nedelje."], "objasnjenje": "Netačno — svaki mesec imao je tri nedelje od po deset dana.", "iz_udzbenika": {"strana": 50, "odeljak": "Znatiželja: Republikanski kalendar", "tekst": "Meseci su se dalje delili na tri desetodnevne nedelje."}, "lekcija": 6}, {"id": "l06-kal-datum-ukinut", "vrsta": "datum", "tezina": "tesko", "pojmovi": ["republikanski-kalendar", "gregorijanski-kalendar"], "dogadjaj": "Republikanski kalendar", "pitanje": "Od koje do koje godine je važio republikanski kalendar?", "od": 1792, "do": 1806, "traka": "ideje", "pomoc": ["Počeo je proglašenjem republike.", "Ukinut je posle trinaest godina, kada je vraćen gregorijanski kalendar.", "Iz lekcije: od 22. septembra 1792. do 1806."], "objasnjenje": "Republikanski kalendar je važio od 1792. do 1806, kada se Francuska vratila gregorijanskom kalendaru.", "iz_udzbenika": {"strana": 50, "odeljak": "Znatiželja: Republikanski kalendar", "tekst": "Kalendar je ukinut posle trinaest godina, 1806, kada se Francuska vratila gregorijanskom kalendaru."}, "lekcija": 6}, {"id": "l06-kal-zakljuci-zasto", "vrsta": "zakljuci", "tezina": "srednje", "pojmovi": ["republikanski-kalendar", "republika"], "pitanje": "Zašto su revolucionari hteli da promene kalendar?", "odgovori": [{"tekst": "Da jasno raskinu sa tradicijama monarhističke Francuske", "tacan": true}, {"tekst": "Jer stari kalendar nije imao dvanaest meseci", "tacan": false, "zasto": "I novi kalendar je imao dvanaest meseci; promena je bila simbolična."}, {"tekst": "Da bi se Francuska uskladila sa ostatkom Evrope", "tacan": false, "zasto": "Upravo suprotno — novim kalendarom Francuska se izdvojila od drugih."}, {"tekst": "Jer je to zahtevao kralj", "tacan": false, "zasto": "Kalendar je uveden posle zbacivanja kralja, od dana republike."}], "pomoc": ["Korak 1: Od kog događaja novi kalendar broji godine?", "Korak 2: Šta revolucionari hoće da poruče kad počnu „od Prve godine”?", "Iz lekcije: kalendar otkriva težnju da se raskine sa tradicijama monarhističke Francuske."], "objasnjenje": "Novi kalendar, koji broji od republike, trebalo je da obeleži početak novog doba i raskid sa monarhijom.", "iz_udzbenika": {"strana": 50, "odeljak": "Znatiželja: Republikanski kalendar", "tekst": "Republikanski kalendar je otkrivao težnju revolucionara da raskinu sa tradicijama monarhističke Francuske."}, "lekcija": 6}, {"id": "l06-kal-uporedi-novine", "vrsta": "uporedi", "tezina": "tesko", "pojmovi": ["republikanski-kalendar", "metricki-sistem"], "a": "Republikanski kalendar", "b": "Metrički sistem", "pitanje": "Na koju novinu iz doba revolucije se odnosi tvrdnja — kalendar, metrički sistem, obe ili nijednu?", "tvrdnje": [{"tekst": "Usvojen je 1791. godine.", "odgovor": "b", "zasto": "Metrički sistem je usvojen 1791; kalendar počinje 1792."}, {"tekst": "Ukinut je 1806.", "odgovor": "a", "zasto": "Kalendar je ukinut posle 13 godina, 1806."}, {"tekst": "Pokazao se kao koristan i trajan.", "odgovor": "b", "zasto": "Lekcija kaže da su se neke novine, kao metrički sistem, pokazale trajnim."}, {"tekst": "Nastao je u vreme Francuske revolucije.", "odgovor": "oba", "zasto": "Obe novine potiču iz vremena revolucije."}, {"tekst": "Uveo ga je Luj XIV.", "odgovor": "nijedan", "zasto": "Obe novine su delo revolucije, a ne kraljeva."}], "pomoc": ["Jedna novina se održala do danas, druga nije.", "Kalendar počinje od republike (1792).", "Iz lekcije: kalendar 1792–1806; metrički sistem 1791, koristan i trajan."], "objasnjenje": "Kalendar se nije održao (1792–1806), a metrički sistem (1791) pokazao se trajnim; obe novine su iz revolucije.", "iz_udzbenika": {"strana": 50, "odeljak": "Znatiželja: Republikanski kalendar", "tekst": "Kalendar se nije održao, a druge novine, kao metrički sistem iz 1791, pokazale su se korisnim i trajnim."}, "osa": {"naziv": "Metrički sistem", "od": 1791, "traka": "ideje"}, "lekcija": 6}, {"id": "l06-kal-izvor-gravira", "vrsta": "izvor", "slika_u_pitanju": true, "tezina": "lako", "pojmovi": ["republikanski-kalendar"], "izvor": {"autor": "Gravira s kraja XVIII veka", "naslov": "Vandemijer (opis slike)", "tekst": "Mlada žena prikazana je sa lozom punom grozdova; gravira predstavlja jedan mesec republikanskog kalendara.", "napomena": "Opis slike je prepričan; udžbenik, str. 50."}, "pitanje": "Koji mesec predstavlja gravira i po čemu je dobio ime?", "odgovori": [{"tekst": "Vandemijer — po berbi grožđa", "tacan": true}, {"tekst": "Frimer — po mrazu", "tacan": false, "zasto": "Na slici je grožđe, a ne mraz."}, {"tekst": "Brimer — po magli", "tacan": false, "zasto": "Grozdovi na slici ukazuju na berbu, ne na maglu."}, {"tekst": "Januar — po rimskom bogu", "tacan": false, "zasto": "Republikanski meseci su imenovani po vremenu i poljskim radovima, ne po bogovima."}], "pomoc": ["Šta žena drži?", "Jesen je vreme berbe.", "Iz lekcije: vandemijer = mesec berbe grožđa."], "objasnjenje": "Gravira predstavlja vandemijer — mesec berbe grožđa, prvi jesenji mesec republikanske godine.", "iz_udzbenika": {"strana": 50, "odeljak": "Znatiželja: Republikanski kalendar", "tekst": "Slika prikazuje Vandemijer (Mesec berbe grožđa), gravira s kraja XVIII veka.", "slika": "06-francuska-revolucija/07-vandemijer-gravira.jpg"}, "lekcija": 6}, {"id": "l06-rep-poredjaj-luj", "vrsta": "poredjaj", "tezina": "lako", "pojmovi": ["luj-xvi", "skupstina-drzavnih-staleza"], "pitanje": "Poređaj događaje iz života Luja XVI hronološki.", "stavke": [{"tekst": "Saziva Skupštinu državnih staleža", "godina": 1789, "naziv": "Skupština državnih staleža", "traka": "dogadjaji"}, {"tekst": "Pokušava da pobegne iz Francuske", "godina": 1791, "naziv": "Bekstvo kraljevske porodice", "traka": "dogadjaji"}, {"tekst": "Skupština ga zbacuje sa prestola", "godina": 1792, "naziv": "Zbacivanje Luja XVI", "traka": "dogadjaji"}, {"tekst": "Javno je pogubljen u Parizu", "godina": 1793, "naziv": "Pogubljenje Luja XVI", "traka": "dogadjaji"}], "pomoc": ["Pogubljenje je svakako poslednje.", "Bekstvo je bilo dok je još bio kralj ustavne monarhije.", "Iz lekcije: 1789 — 1791 — 1792 — 1793."], "objasnjenje": "Skupština staleža (1789) → bekstvo (1791) → zbacivanje (1792) → pogubljenje (1793).", "iz_udzbenika": {"strana": 49, "odeljak": "Proglašenje republike", "tekst": "Kralj je 1791. pokušao da pobegne, 1792. je zbačen, a početkom 1793. pogubljen."}, "lekcija": 6}, {"id": "l06-rep-datum-rat", "vrsta": "datum", "tezina": "lako", "pojmovi": ["habzburska-monarhija", "pruska"], "dogadjaj": "Rat Habzburškoj monarhiji i Pruskoj", "pitanje": "Koje godine su revolucionari objavili rat Habzburškoj monarhiji i Pruskoj?", "godina": 1792, "traka": "dogadjaji", "pomoc": ["Iste godine proglašena je republika.", "Godinu posle prvog ustava.", "Iz lekcije: rat je objavljen 1792."], "objasnjenje": "Rat Habzburškoj monarhiji i Pruskoj objavljen je 1792.", "iz_udzbenika": {"strana": 49, "odeljak": "Proglašenje republike", "tekst": "Revolucionari su Habzburškoj monarhiji i Pruskoj objavili rat 1792."}, "lekcija": 6}, {"id": "l06-ma-izvor-portret", "vrsta": "izvor", "slika_u_pitanju": true, "tezina": "lako", "pojmovi": ["marija-antoaneta", "versaj"], "izvor": {"autor": "Portret iz XVIII veka", "naslov": "Marija Antoaneta (opis slike)", "tekst": "Kraljica sedi u raskošnoj svilenoj haljini punoj ukrasa, sa visokom frizurom i perjem. Pored nje su globus, skupoceni predmeti i teške zavese.", "napomena": "Opis slike je prepričan; udžbenik, str. 49."}, "pitanje": "Šta portret govori o životu na francuskom dvoru?", "odgovori": [{"tekst": "Dvor je živeo u velikom raskošu", "tacan": true}, {"tekst": "Dvor je živeo skromno, kao seljaci", "tacan": false, "zasto": "Haljina, nakit i predmeti pokazuju bogatstvo, a ne skromnost."}, {"tekst": "Kraljica je radila u polju", "tacan": false, "zasto": "Ništa na slici ne ukazuje na rad — sve govori o raskoši."}, {"tekst": "Dvor je bio bez novca i ukrasa", "tacan": false, "zasto": "Država je bila bez novca, ali dvor je i dalje živeo raskošno."}], "pomoc": ["Pogledaj haljinu i predmete oko kraljice.", "Seti se šta lekcija kaže o troškovima dvora u Versaju.", "Iz lekcije: troškovi dvora u Versaju bili su ogromni."], "objasnjenje": "Raskošna odeća i predmeti pokazuju koliko je dvor trošio — dok je narod bio gladan.", "iz_udzbenika": {"strana": 49, "odeljak": "Potpis: Marija Antoaneta", "tekst": "Portret francuske kraljice Marije Antoanete (1755–1793), žene Luja XVI.", "slika": "06-francuska-revolucija/06-marija-antoaneta.jpg"}, "lekcija": 6}, {"id": "l06-kal-objasni-lako", "vrsta": "objasni", "tezina": "lako", "pojmovi": ["republikanski-kalendar"], "pitanje": "Šta je bio republikanski kalendar? Opiši ga ukratko.", "uzor": "To je kalendar koji su uveli revolucionari. Počinjao je 22. septembra 1792, danom proglašenja republike. Imao je 12 meseci nazvanih po vremenu i poljskim radovima, a svaki mesec tri nedelje od po deset dana.", "ideje": ["Početak od proglašenja republike (22. 9. 1792).", "Meseci nazvani po vremenu ili poljskim radovima.", "Tri desetodnevne nedelje u mesecu."], "objasnjenje": "Republikanski kalendar je brojao godine od republike i imao nova imena meseci i desetodnevne nedelje.", "iz_udzbenika": {"strana": 50, "odeljak": "Znatiželja: Republikanski kalendar", "tekst": "Republikanski kalendar počinje 22. septembra 1792; meseci imaju nova imena, a nedelje po deset dana."}, "lekcija": 6}]}, {"naslov": "6. Jakobinska diktatura", "zadaci": [{"id": "l06-jak-izbor-zirondinci", "vrsta": "izbor", "tezina": "lako", "pojmovi": ["jakobinci", "zirondinci"], "pitanje": "Koga su jakobinci izbacili iz skupštine?", "odgovori": [{"tekst": "Žirondince", "tacan": true}, {"tekst": "Plemiće", "tacan": false, "zasto": "Staleži su već ukinuti; jakobinci su se obračunali sa umerenim revolucionarima — žirondincima."}, {"tekst": "Kralja", "tacan": false, "zasto": "Kralj nije bio član skupštine; zbačen je 1792, a pogubljen 1793."}, {"tekst": "Direktore", "tacan": false, "zasto": "Direktorijum dolazi tek posle pada jakobinaca."}], "pomoc": ["Jakobinci su bili radikalni. Koja je bila umerena struja?", "Ime im dolazi od oblasti Žironda.", "Iz lekcije: jakobinci su uspeli da izbace žirondince iz skupštine."], "objasnjenje": "Jakobinci su izbacili umerenije žirondince iz skupštine i preuzeli svu vlast.", "iz_udzbenika": {"strana": 50, "odeljak": "Jakobinska diktatura", "tekst": "Jakobinci su uspeli da izbace žirondince iz skupštine."}, "lekcija": 6}, {"id": "l06-jak-datum-diktatura", "vrsta": "datum", "tezina": "srednje", "pojmovi": ["jakobinska-diktatura", "jakobinci"], "dogadjaj": "Jakobinska diktatura", "pitanje": "Od koje do koje godine je trajala jakobinska diktatura?", "od": 1793, "do": 1794, "traka": "dogadjaji", "pomoc": ["Počela je leta iste godine kada je pogubljen kralj.", "Završila se leta sledeće godine, padom Robespjera.", "Iz lekcije: leto 1793 — leto 1794."], "objasnjenje": "Jakobinska diktatura trajala je od leta 1793. do leta 1794, kada su Robespjer i saradnici pogubljeni.", "iz_udzbenika": {"strana": 50, "odeljak": "Jakobinska diktatura", "tekst": "U leto 1793. jakobinci su zaveli diktaturu; u leto 1794. Robespjer je pogubljen."}, "lekcija": 6}, {"id": "l06-jak-izbor-komitet", "vrsta": "izbor", "tezina": "lako", "pojmovi": ["komitet-javnog-spasa", "maksimilijan-robespjer"], "pitanje": "Koji je bio najznačajniji odbor za vreme jakobinske diktature?", "odgovori": [{"tekst": "Komitet javnog spasa", "tacan": true}, {"tekst": "Direktorijum", "tacan": false, "zasto": "Direktorijum je vlada posle jakobinaca (1795–1799)."}, {"tekst": "Skupština državnih staleža", "tacan": false, "zasto": "Ona je zasedala 1789. i nije bila odbor."}, {"tekst": "Zakonodavna skupština", "tacan": false, "zasto": "Zakonodavna skupština je bila skupština, izabrana posle ustava 1791."}], "pomoc": ["„Komitet” znači odbor.", "Trebalo je da „spase” republiku.", "Iz lekcije: najznačajniji je bio Komitet javnog spasa, na čelu sa Robespjerom."], "objasnjenje": "Najvažniji odbor bio je Komitet javnog spasa, kojim je rukovodio Robespjer.", "iz_udzbenika": {"strana": 50, "odeljak": "Jakobinska diktatura", "tekst": "Državom je upravljalo nekoliko odbora, a najznačajniji je bio Komitet javnog spasa, kojim je rukovodio Robespjer."}, "lekcija": 6}, {"id": "l06-jak-dopuni-komitet", "vrsta": "dopuni", "tezina": "lako", "pojmovi": ["komitet-javnog-spasa"], "pitanje": "Dopuni.", "tekst": "Reč komitet znači {{odbor}}.", "ponudjene": ["odbor", "zakon", "sud", "vojska"], "pomoc": ["Komitet je grupa ljudi koja upravlja nekim poslom.", "Državom je upravljalo nekoliko takvih grupa.", "Iz lekcije: komitet — odbor."], "objasnjenje": "Komitet znači odbor.", "iz_udzbenika": {"strana": 50, "odeljak": "Definicije („?\" kućice)", "tekst": "Komitet — odbor."}, "lekcija": 6}, {"id": "l06-jak-tn-teror", "vrsta": "tacno_netacno", "tezina": "lako", "pojmovi": ["strahovlada", "jakobinci", "zakon-o-sumnjivima"], "tvrdnja": "Jakobinci su strahovladu (teror) uveli Zakonom o sumnjivima.", "tacno": true, "pomoc": ["Kako su jakobinci gušili unutrašnje nemire?", "Iz lekcije: strahovlada je uvedena donošenjem Zakona o sumnjivima."], "objasnjenje": "Tačno — Zakonom o sumnjivima jakobinci su uveli strahovladu.", "iz_udzbenika": {"strana": 50, "odeljak": "Jakobinska diktatura", "tekst": "Da bi suzbili unutrašnje nemire, jakobinci su zaveli strahovladu (teror) donošenjem Zakona o sumnjivima."}, "lekcija": 6}, {"id": "l06-jak-izbor-sumnjivi", "vrsta": "izbor", "tezina": "lako", "pojmovi": ["zakon-o-sumnjivima", "strahovlada"], "pitanje": "Šta se dešavalo sa onima koji su bili osumnjičeni da su neprijatelji revolucije?", "odgovori": [{"tekst": "Bili su zatvarani ili pogubljeni", "tacan": true}, {"tekst": "Dobijali su pravo glasa", "tacan": false, "zasto": "Osumnjičeni su kažnjavani, a ne nagrađivani."}, {"tekst": "Puštani su da slobodno odu iz zemlje", "tacan": false, "zasto": "Strahovlada nije puštala sumnjive — zatvarala ih je ili pogubljivala."}, {"tekst": "Izvođeni su pred sud i uvek oslobađani", "tacan": false, "zasto": "U doba terora dovoljna je bila sumnja da neko završi u zatvoru ili na gubilištu."}], "pomoc": ["Zašto se ta vladavina zove „strahovlada”?", "Bilo je dovoljno da neko bude osumnjičen.", "Iz lekcije: osumnjičeni su bili zatvarani ili pogubljeni."], "objasnjenje": "U vreme strahovlade svi osumnjičeni da su neprijatelji revolucije bili su zatvarani ili pogubljeni.", "iz_udzbenika": {"strana": 50, "odeljak": "Jakobinska diktatura", "tekst": "Svi koji su bili osumnjičeni da su neprijatelji revolucije bili su zatvarani ili pogubljeni."}, "lekcija": 6}, {"id": "l06-jak-zakljuci-deklaracija", "vrsta": "zakljuci", "tezina": "tesko", "pojmovi": ["zakon-o-sumnjivima", "deklaracija-o-pravima-coveka-i-gradjanina", "strahovlada"], "pitanje": "Koji član Deklaracije iz 1789. je Zakon o sumnjivima najočiglednije kršio?", "odgovori": [{"tekst": "Član 9 — da je svako nevin dok mu se ne dokaže krivica", "tacan": true}, {"tekst": "Član 11 — o slobodi štampe", "tacan": false, "zasto": "I sloboda je bila ugrožena, ali zatvaranje zbog same sumnje direktno krši pretpostavku nevinosti."}, {"tekst": "Nijedan — zakon je bio u skladu sa Deklaracijom", "tacan": false, "zasto": "Kažnjavanje zbog sumnje, bez dokazane krivice, suprotno je Deklaraciji."}, {"tekst": "Član o pravu kralja na vlast", "tacan": false, "zasto": "Takvog člana u odlomku nema; Deklaracija govori o pravima ljudi."}], "pomoc": ["Korak 1: Šta je bilo dovoljno da neko bude zatvoren u doba terora?", "Korak 2: Koji član govori o krivici i hapšenju?", "Iz lekcije: osumnjičeni su zatvarani ili pogubljeni; čl. 9 — svako je nevin dok ga ne proglase krivim."], "objasnjenje": "Zakon o sumnjivima kažnjavao je ljude zbog same sumnje — suprotno članu 9, po kome je svako nevin dok se krivica ne dokaže.", "iz_udzbenika": {"strana": 50, "odeljak": "Jakobinska diktatura", "tekst": "Svi osumnjičeni da su neprijatelji revolucije bili su zatvarani ili pogubljeni."}, "lekcija": 6}, {"id": "l06-jak-uporedi-vladavina", "vrsta": "uporedi", "tezina": "srednje", "pojmovi": ["jakobinska-diktatura", "maksimilijan-robespjer"], "a": "Dobre strane jakobinske vlasti", "b": "Loše strane jakobinske vlasti", "pitanje": "Razvrstaj šta lekcija kaže o jakobinskoj vlasti — dobra strana, loša strana, oba ili nijedno?", "tvrdnje": [{"tekst": "Niz pobeda nad spoljnim neprijateljem.", "odgovor": "a", "zasto": "Jakobinska vlada je odnela niz pobeda u ratu."}, {"tekst": "Mere u korist siromašnih.", "odgovor": "a", "zasto": "Jakobinci su doneli mere u korist siromašnih."}, {"tekst": "Zatvaranje i pogubljenje osumnjičenih.", "odgovor": "b", "zasto": "To je strahovlada — nezapamćeno surova."}, {"tekst": "Izbacivanje političkih protivnika (žirondinaca) iz skupštine.", "odgovor": "b", "zasto": "Jakobinci su se obračunali sa protivnicima, umesto da dele vlast."}, {"tekst": "Vraćanje kralja na presto.", "odgovor": "nijedan", "zasto": "Jakobinci su bili republikanci — kralj je pogubljen."}], "pomoc": ["Šta je koristilo republici i siromašnima, a šta je bilo surovo?", "Lekcija kaže „ipak” — posle dobrih strana dolazi loša.", "Iz lekcije: pobede i mere za siromašne, ali nezapamćeno surova vlast."], "objasnjenje": "Jakobinci su pobeđivali spoljne neprijatelje i pomagali siromašnima, ali su vladali nezapamćeno surovo.", "iz_udzbenika": {"strana": 50, "odeljak": "Jakobinska diktatura", "tekst": "Jakobinska vlada odnela je niz pobeda i donela mere u korist siromašnih, ali je Robespjerova vladavina bila nezapamćeno surova."}, "lekcija": 6}, {"id": "l06-jak-tn-sudjenje", "vrsta": "tacno_netacno", "tezina": "srednje", "pojmovi": ["maksimilijan-robespjer", "komitet-javnog-spasa"], "tvrdnja": "Robespjer je posle zavere u skupštini izveden pred sud i oslobođen.", "tacno": false, "ispravke": [{"tekst": "Robespjer i saradnici su uhapšeni i bez suđenja pogubljeni.", "tacan": true}, {"tekst": "Robespjer je pobegao iz Francuske.", "tacan": false, "zasto": "Robespjer je uhapšen i pogubljen."}, {"tekst": "Robespjer je postao jedan od pet direktora.", "tacan": false, "zasto": "Direktorijum je nastao posle pada jakobinaca; Robespjer je tada već bio pogubljen."}], "pomoc": ["Šta se desilo sa Robespjerom leta 1794?", "Prošao je kao mnoge žrtve terora — bez suđenja.", "Iz lekcije: Robespjer i saborci su uhapšeni i bez suđenja pogubljeni."], "objasnjenje": "Netačno — Robespjer i njegovi saradnici su leta 1794. uhapšeni i pogubljeni bez suđenja.", "iz_udzbenika": {"strana": 50, "odeljak": "Jakobinska diktatura", "tekst": "U leto 1794. skovana je zavera protiv Komiteta javnog spasa; Robespjer i saborci su uhapšeni i bez suđenja pogubljeni."}, "lekcija": 6}, {"id": "l06-jak-datum-pad", "vrsta": "datum", "tezina": "srednje", "pojmovi": ["maksimilijan-robespjer"], "dogadjaj": "Pad Robespjera", "pitanje": "Koje godine su Robespjer i njegovi saradnici uhapšeni i pogubljeni?", "godina": 1794, "traka": "dogadjaji", "pomoc": ["Godinu dana posle uvođenja diktature.", "Iste godine trobojka je proglašena za državnu zastavu.", "Iz lekcije: u leto 1794."], "objasnjenje": "Robespjer je pao u leto 1794, posle zavere u skupštini.", "iz_udzbenika": {"strana": 50, "odeljak": "Jakobinska diktatura", "tekst": "U leto 1794. Robespjer i njegovi saborci su uhapšeni i pogubljeni."}, "lekcija": 6}, {"id": "l06-jak-izbor-direktorijum", "vrsta": "izbor", "tezina": "lako", "pojmovi": ["direktorijum"], "pitanje": "Kome je poverena vlast posle pada jakobinaca?", "odgovori": [{"tekst": "Direktorijumu", "tacan": true}, {"tekst": "Luju XVI", "tacan": false, "zasto": "Luj XVI je pogubljen još 1793."}, {"tekst": "Komitetu javnog spasa", "tacan": false, "zasto": "Komitet je pao zajedno sa Robespjerom."}, {"tekst": "Žirondincima", "tacan": false, "zasto": "Vlast je poverena vladi od pet direktora — Direktorijumu."}], "pomoc": ["Vlada je dobila ime po svojim članovima — direktorima.", "Vladao je od 1795. do 1799.", "Iz lekcije: vlast je poverena Direktorijumu (1795–1799)."], "objasnjenje": "Posle pada jakobinaca vlast je dobio Direktorijum — vlada od pet direktora.", "iz_udzbenika": {"strana": 50, "odeljak": "Jakobinska diktatura", "tekst": "Posle pada jakobinaca vlast je poverena Direktorijumu (1795–1799)."}, "lekcija": 6}, {"id": "l06-jak-datum-direktorijum", "vrsta": "datum", "tezina": "tesko", "pojmovi": ["direktorijum"], "dogadjaj": "Direktorijum", "pitanje": "Od koje do koje godine je vladao Direktorijum?", "od": 1795, "do": 1799, "traka": "vladari", "pomoc": ["Počeo je iste godine kada je Marseljeza postala himna.", "Trajao je četiri godine, do kraja veka.", "Iz lekcije: Direktorijum (1795–1799)."], "objasnjenje": "Direktorijum je vladao Francuskom od 1795. do 1799.", "iz_udzbenika": {"strana": 50, "odeljak": "Jakobinska diktatura", "tekst": "Vlast je bila poverena Direktorijumu (1795–1799)."}, "lekcija": 6}, {"id": "l06-jak-dopuni-pet", "vrsta": "dopuni", "tezina": "srednje", "pojmovi": ["direktorijum"], "pitanje": "Dopuni rečenicu o Direktorijumu (bez banke reči).", "tekst": "Direktorijum je bila vlada koju je činilo {{pet|5}} direktora (ministara).", "pomoc": ["Broj je manji od deset.", "Broj prstiju na jednoj ruci.", "Iz lekcije: vladu je činilo pet direktora."], "objasnjenje": "Direktorijum je činilo pet direktora (ministara).", "iz_udzbenika": {"strana": 50, "odeljak": "Jakobinska diktatura", "tekst": "Direktorijum je bila vlada koju je činilo pet direktora (ministara)."}, "lekcija": 6}, {"id": "l06-jak-ko-sam-robespjer", "vrsta": "ko_sam", "tezina": "lako", "pojmovi": ["maksimilijan-robespjer", "jakobinci", "komitet-javnog-spasa", "sloboda-jednakost-bratstvo"], "tragovi": ["Bio sam pravnik i jedan od vođa jakobinaca.", "Rukovodio sam Komitetom javnog spasa u vreme strahovlade.", "Moj moto „Sloboda, jednakost, bratstvo” i danas je geslo Francuske."], "odgovori": [{"tekst": "Maksimilijan Robespjer", "tacan": true}, {"tekst": "Luj XVI", "tacan": false, "zasto": "Luj XVI je bio kralj, a ne vođa jakobinaca."}, {"tekst": "Monteskje", "tacan": false, "zasto": "Monteskje je prosvetitelj iz ranijeg doba; za vreme revolucije više nije živ."}, {"tekst": "Jedan od pet direktora", "tacan": false, "zasto": "Direktorijum je došao posle Robespjerovog pada."}], "objasnjenje": "To je Maksimilijan Robespjer — vođa jakobinaca, na čelu Komiteta javnog spasa, pogubljen 1794.", "iz_udzbenika": {"strana": 50, "odeljak
