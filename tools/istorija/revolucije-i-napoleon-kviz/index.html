", "tezina": "srednje", "pojmovi": ["povelja-o-pravima", "parlament"], "izvor": {"autor": "Povelja o pravima, 1689.", "naslov": "Prava i slobode (sažetak odlomka)", "tekst": "Za ono što se u parlamentu kaže, raspravlja i radi, niko ne sme da bude osuđen ni pozvan na odgovornost na sudu ili bilo gde van parlamenta. Parlament treba da se sastaje često, da bi se žalbe i izmene zakona rešavale na vreme.", "napomena": "Odlomak je prepričan; udžbenik, str. 41."}, "pitanje": "Šta ova tačka znači za poslanike?", "odgovori": [{"tekst": "Mogu slobodno da govore u parlamentu, bez straha da će zbog toga biti kažnjeni", "tacan": true}, {"tekst": "Ne smeju ništa da govore bez kraljeve dozvole", "tacan": false, "zasto": "Odlomak štiti upravo slobodu govora u parlamentu."}, {"tekst": "Smeju da se sastaju samo jednom u deset godina", "tacan": false, "zasto": "Povelja traži da se parlament sastaje često."}, {"tekst": "Mogu da sude kralju kad god žele", "tacan": false, "zasto": "Odlomak govori o zaštiti poslanika, a ne o suđenju kralju."}], "pomoc": ["Ko je zaštićen ovom tačkom?", "Šta se ne sme raditi zbog onoga što je rečeno u parlamentu?", "Iz lekcije: sloboda govora, rasprave i postupaka u parlamentu ne sme se kažnjavati van parlamenta."], "objasnjenje": "Poslanici mogu slobodno da govore i kritikuju, jer ih niko van parlamenta ne može goniti zbog toga.", "iz_udzbenika": {"strana": 41, "odeljak": "Svedočanstvo: Povelja o pravima", "tekst": "Povelja štiti slobodu govora, rasprave i postupaka u parlamentu i traži da se parlament često sastaje."}, "lekcija": 5}, {"id": "l05-parl-izvor-nasledje", "vrsta": "izvor", "tezina": "srednje", "pojmovi": ["povelja-o-pravima"], "izvor": {"autor": "Udžbenik (prepričano)", "naslov": "Uvod u odlomak Povelje o pravima", "tekst": "Odlomak iz Povelje o pravima iz 1689. je deo kojim se proglašavaju prava i slobode pojedinaca i rešava pitanje nasleđivanja krune.", "napomena": "Prepričano; udžbenik, str. 41."}, "pitanje": "Koja dva pitanja, prema ovom opisu, rešava Povelja o pravima?", "odgovori": [{"tekst": "Prava i slobode pojedinaca i nasleđivanje krune", "tacan": true}, {"tekst": "Nezavisnost američkih kolonija i ropstvo", "tacan": false, "zasto": "Povelja je engleski dokument iz 1689; kolonije se odvajaju tek 1776."}, {"tekst": "Ujedinjenje sa Škotskom i granice sa Francuskom", "tacan": false, "zasto": "Ujedinjenje sa Škotskom je početkom XVIII veka i ne pominje se u Povelji."}, {"tekst": "Gradnju fabrika i rad dece", "tacan": false, "zasto": "To su teme industrijske revolucije, ne Povelje o pravima."}], "pomoc": ["Pročitaj uvodnu rečenicu iznad odlomka.", "Jedno se tiče ljudi, drugo kralja.", "Iz lekcije: Povelja proglašava prava i slobode pojedinaca i rešava nasleđivanje krune."], "objasnjenje": "Povelja o pravima proglašava prava i slobode pojedinaca i uređuje ko nasleđuje krunu.", "iz_udzbenika": {"strana": 41, "odeljak": "Svedočanstvo: Povelja o pravima", "tekst": "Odlomak proglašava prava i slobode pojedinaca i rešava pitanje nasleđivanja krune."}, "lekcija": 5}, {"id": "l05-parl-izvor-najvaznije", "vrsta": "izvor", "tezina": "tesko", "pojmovi": ["povelja-o-pravima", "parlamentarna-monarhija"], "izvor": {"autor": "Povelja o pravima, 1689.", "naslov": "Četiri tačke (sažetak)", "tekst": "1) Kralj bez pristanka parlamenta ne sme da obustavlja niti po svom nahođenju primenjuje zakone. 2) Izbori za parlament su slobodni. 3) Za reči i postupke u parlamentu niko ne sme biti gonjen van parlamenta. 4) Parlament treba često da se sastaje.", "napomena": "Odlomak je prepričan; udžbenik, str. 41."}, "pitanje": "Koja tačka najneposrednije pretvara Englesku u parlamentarnu monarhiju?", "odgovori": [{"tekst": "Prva — kralj ne može mimo parlamenta da menja i obustavlja zakone", "tacan": true}, {"tekst": "Treća — sloboda govora poslanika", "tacan": false, "zasto": "Važna je za rad parlamenta, ali ne određuje odnos kralja i parlamenta prema zakonima."}, {"tekst": "Četvrta — česta zasedanja", "tacan": false, "zasto": "Česta zasedanja pomažu, ali sama ne oduzimaju kralju vlast nad zakonima."}, {"tekst": "Nijedna — Povelja ne ograničava kralja", "tacan": false, "zasto": "Povelja upravo vezuje kralja za odluke parlamenta."}], "pomoc": ["Parlamentarna monarhija = vladar deli vlast sa parlamentom.", "Koja tačka direktno govori o kralju i zakonima?", "Iz lekcije: vladar mora da vlada u skladu sa odlukama parlamenta."], "objasnjenje": "Kad kralj ne može bez parlamenta da obustavi ili primeni zakon, on deli vlast sa parlamentom — to je parlamentarna monarhija.", "iz_udzbenika": {"strana": 41, "odeljak": "Svedočanstvo: Povelja o pravima", "tekst": "Udžbenik traži da navedeš šta Povelja utvrđuje i koju tačku smatraš najvažnijom."}, "lekcija": 5}, {"id": "l05-parl-uporedi-domovi", "vrsta": "uporedi", "tezina": "srednje", "pojmovi": ["gornji-dom", "donji-dom"], "a": "Gornji dom (Dom lordova)", "b": "Donji dom", "pitanje": "Na koji dom britanskog parlamenta se odnosi tvrdnja?", "tvrdnje": [{"tekst": "Članovi su bili predstavnici krupnog plemstva.", "odgovor": "a", "zasto": "Dom lordova je bio dom krupnog plemstva."}, {"tekst": "Članovi su bili izabrani poslanici.", "odgovor": "b", "zasto": "U Donji dom se biralo."}, {"tekst": "Mesto se dobijalo naslednim pravom.", "odgovor": "a", "zasto": "Lordovi su nasleđivali mesto u parlamentu."}, {"tekst": "Stranka sa najviše poslanika u njemu sastavlja vladu.", "odgovor": "b", "zasto": "Vlada je zavisila od izbora za Donji dom."}, {"tekst": "Deo je britanskog parlamenta.", "odgovor": "oba", "zasto": "Parlament je imao oba doma."}, {"tekst": "Činili su ga predstavnici američkih kolonija.", "odgovor": "nijedan", "zasto": "Zahtev kolonista da uđu u britanski parlament bio je odbijen."}], "pomoc": ["Jedan dom je nasledni, drugi izborni.", "Vlada potiče iz izbornog doma.", "Iz lekcije: Gornji dom — krupno plemstvo, nasledno; Donji dom — izabrani poslanici, iz njega vlada."], "objasnjenje": "Gornji dom = nasledno krupno plemstvo; Donji dom = izabrani poslanici sitnog plemstva i građanstva, iz kojih nastaje vlada.", "iz_udzbenika": {"strana": 41, "odeljak": "Stvaranje parlamentarne monarhije", "tekst": "Gornji dom činili su krupni plemići po naslednom pravu, a Donji dom izabrani poslanici."}, "lekcija": 5}, {"id": "l05-parl-uporedi-stranke", "vrsta": "uporedi", "tezina": "tesko", "pojmovi": ["vigovci", "torijevci"], "a": "Vigovci", "b": "Torijevci", "pitanje": "Na koju stranku se odnosi tvrdnja?", "tvrdnje": [{"tekst": "Protive se apsolutističkoj vlasti kralja.", "odgovor": "a", "zasto": "Vigovci su protivnici apsolutističke kraljevske vlasti."}, {"tekst": "Zalažu se za snažnu kraljevsku vlast.", "odgovor": "b", "zasto": "Torijevci su pristalice snažne kraljevske vlasti."}, {"tekst": "Njeni poslanici sede u britanskom parlamentu.", "odgovor": "oba", "zasto": "Poslanici su se delili na ove dve stranke."}, {"tekst": "Ako dobije najviše poslanika, može da sastavi vladu.", "odgovor": "oba", "zasto": "To pravilo važi za svaku stranku koja pobedi na izborima za Donji dom."}, {"tekst": "To je stranka u američkom Kongresu iz 1787.", "odgovor": "nijedan", "zasto": "Vigovci i torijevci su britanske stranke; lekcija ne govori o strankama u Kongresu."}], "pomoc": ["Jedna stranka je za jakog kralja, druga protiv.", "Obe se takmiče na istim izborima.", "Iz lekcije: vigovci — protivnici apsolutizma; torijevci — pristalice snažne kraljevske vlasti."], "objasnjenje": "Razlikuju se po stavu prema kraljevskoj vlasti, a obe su britanske parlamentarne stranke koje mogu sastaviti vladu.", "iz_udzbenika": {"strana": 41, "odeljak": "Definicije: parlamentarna monarhija, vigovci, torijevci", "tekst": "Vigovci su protivnici apsolutističke vlasti, torijevci pristalice snažne kraljevske vlasti."}, "lekcija": 5}, {"id": "l05-parl-objasni-parlamentarna", "vrsta": "objasni", "tezina": "lako", "pojmovi": ["parlamentarna-monarhija", "povelja-o-pravima"], "pitanje": "Šta je parlamentarna monarhija i kako je nastala u Engleskoj?", "uzor": "Parlamentarna monarhija je monarhija u kojoj vladar deli vlast sa parlamentom. U Engleskoj je nastala posle Slavne revolucije 1688, kada je kralj 1689. prihvatio Povelju o pravima. Njom je utvrđeno da vladar mora da vlada u skladu sa odlukama parlamenta.", "ideje": ["Vladar deli vlast sa parlamentom.", "Slavna revolucija 1688.", "Povelja o pravima 1689.", "Kralj mora da poštuje odluke parlamenta."], "objasnjenje": "Kralj ostaje na prestolu, ali ne vlada sam — vezan je odlukama parlamenta.", "iz_udzbenika": {"strana": 41, "odeljak": "Stvaranje parlamentarne monarhije", "tekst": "Povelja o pravima (1689) je utvrdila da vladar vlada u skladu sa odlukama parlamenta; uspostavljena je parlamentarna monarhija."}, "lekcija": 5}, {"id": "l05-parl-objasni-povelja-tacka", "vrsta": "objasni", "tezina": "tesko", "pojmovi": ["povelja-o-pravima", "parlament"], "pitanje": "Navedi šta je utvrđeno Poveljom o pravima. Koju tačku smatraš najvažnijom i zašto?", "uzor": "Povelja o pravima zabranjuje kralju da bez pristanka parlamenta obustavlja ili primenjuje zakone, traži slobodne izbore za parlament, štiti slobodu govora u parlamentu i traži da se parlament često sastaje. Najvažnija mi je prva tačka, jer kralj više ne može da vlada mimo parlamenta — vlast više nije u rukama jednog čoveka.", "ideje": ["Kralj ne može bez parlamenta da obustavlja ili primenjuje zakone.", "Slobodni izbori i sloboda govora u parlamentu.", "Parlament treba često da se sastaje.", "Izabrana tačka je obrazložena (npr. ograničava kralja)."], "objasnjenje": "Svaki izbor je dobar ako je obrazložen; ključno je da Povelja ograničava kralja i štiti parlament.", "iz_udzbenika": {"strana": 41, "odeljak": "Svedočanstvo: Povelja o pravima", "tekst": "Udžbenik traži da navedeš šta je utvrđeno Poveljom o pravima i obrazložiš koja je tačka najvažnija."}, "lekcija": 5}, {"id": "l05-parl-objasni-slavna", "vrsta": "objasni", "tezina": "srednje", "pojmovi": ["slavna-revolucija", "parlamentarna-monarhija"], "pitanje": "Zašto se revolucija iz 1688. zove Slavna ili Beskrvna i šta je njome postignuto?", "uzor": "Posle novih sukoba naslednika Čarlsa I i parlamenta, 1688. je došlo do promene vlasti bez sukoba i nasilja, pa je revolucija nazvana Beskrvnom ili Slavnom. Kralj je 1689. prihvatio Povelju o pravima i Engleska je postala parlamentarna monarhija.", "ideje": ["Prošla je bez sukoba i nasilja.", "Okončala je sukobe kralja i parlamenta.", "Kralj prihvata Povelju o pravima 1689.", "Nastaje parlamentarna monarhija."], "objasnjenje": "Za razliku od Građanskog rata, promena je bila mirna, a ishod trajan — parlamentarna monarhija.", "iz_udzbenika": {"strana": 41, "odeljak": "Stvaranje parlamentarne monarhije", "tekst": "Slavna ili Beskrvna revolucija (1688) prošla je bez nasilja i dovela do Povelje o pravima."}, "lekcija": 5}]}, {"naslov": "5. Britanske kolonije u Severnoj Americi", "zadaci": [{"id": "l05-kol-izbor-broj", "vrsta": "izbor", "tezina": "lako", "pojmovi": ["trinaest-kolonija", "severna-amerika"], "pitanje": "Koliko je britanskih kolonija nastalo na atlantskoj obali Severne Amerike?", "odgovori": [{"tekst": "Trinaest", "tacan": true}, {"tekst": "Tri", "tacan": false, "zasto": "Tri su samo najveća trgovačka središta (Boston, Filadelfija, Njujork), a kolonija je bilo trinaest."}, {"tekst": "Pedeset", "tacan": false, "zasto": "Pedeset je broj saveznih država SAD danas; kolonija je bilo trinaest."}, {"tekst": "Sedam", "tacan": false, "zasto": "Kolonija je bilo trinaest."}], "pomoc": ["Na karti su kolonije iz 1775. obojene istom bojom uz istočnu obalu.", "Broj je veći od deset.", "Iz lekcije: na atlantskoj obali stvoreno je trinaest kolonija."], "objasnjenje": "Na atlantskoj obali Severne Amerike nastalo je trinaest britanskih kolonija.", "iz_udzbenika": {"strana": 41, "odeljak": "Britanske kolonije u Severnoj Americi", "tekst": "Na atlantskoj obali Severne Amerike stvoreno je trinaest britanskih kolonija."}, "lekcija": 5}, {"id": "l05-kol-izbor-francuzi", "vrsta": "izbor", "tezina": "lako", "pojmovi": ["francuska", "severna-amerika"], "pitanje": "Od koga su Britanci u XVIII veku preoteli posede u Severnoj Americi?", "odgovori": [{"tekst": "Od Francuza", "tacan": true}, {"tekst": "Od Rusa", "tacan": false, "zasto": "Lekcija navodi Francuze."}, {"tekst": "Od Amerikanaca", "tacan": false, "zasto": "SAD tada još nisu postojale — nastaju tek 1776–1783."}, {"tekst": "Od Holanđana", "tacan": false, "zasto": "Lekcija kao suparnika u XVIII veku navodi Francuze."}], "pomoc": ["Ta zemlja je kasnije pomogla kolonistima protiv Britanije.", "Velika suparnica Britanije u XVIII veku.", "Iz lekcije: tokom XVIII veka Britanci su preoteli Francuzima posede u Severnoj Americi."], "objasnjenje": "Britanci su u XVIII veku preoteli Francuzima posede u Severnoj Americi — zato je Francuska kasnije rado pomogla kolonistima.", "iz_udzbenika": {"strana": 41, "odeljak": "Britanske kolonije u Severnoj Americi", "tekst": "Tokom XVIII veka Britanci su preoteli Francuzima posede u Severnoj Americi."}, "lekcija": 5}, {"id": "l05-kol-izbor-doseljenici", "vrsta": "izbor", "tezina": "srednje", "pojmovi": ["kolonisti", "protestanti"], "pitanje": "Ko su bili stanovnici britanskih kolonija u Severnoj Americi?", "odgovori": [{"tekst": "Doseljenici sa Britanskih ostrva i iz drugih delova zapadne i severne Evrope, većinom protestanti", "tacan": true}, {"tekst": "Samo Francuzi katolici", "tacan": false, "zasto": "Doseljenici su bili sa Britanskih ostrva i iz zapadne i severne Evrope, a većina protestanti."}, {"tekst": "Samo starosedeoci Indijanci", "tacan": false, "zasto": "Kolonije su naselili evropski doseljenici."}, {"tekst": "Doseljenici iz Rusije i sa Balkana, pravoslavni", "tacan": false, "zasto": "Lekcija navodi zapadnu i severnu Evropu i protestantsku veru."}], "pomoc": ["Kolonije su britanske — odakle je većina došla?", "Bilo je i ljudi iz drugih zemalja zapada i severa Evrope.", "Iz lekcije: doseljenici sa Britanskih ostrva i iz zapadne i severne Evrope; većina protestanti."], "objasnjenje": "Kolonije su naselili doseljenici sa Britanskih ostrva i iz zapadne i severne Evrope; većina su bili protestanti.", "iz_udzbenika": {"strana": 41, "odeljak": "Britanske kolonije u Severnoj Americi", "tekst": "Stanovništvo kolonija činili su doseljenici sa Britanskih ostrva i iz zapadne i severne Evrope, većinom protestanti."}, "lekcija": 5}, {"id": "l05-kol-izbor-gradovi", "vrsta": "izbor", "tezina": "srednje", "pojmovi": ["boston", "filadelfija", "njujork"], "pitanje": "Koji gradovi su bili glavna središta trgovine, zanatstva i bankarstva u kolonijama? (više tačnih)", "odgovori": [{"tekst": "Boston", "tacan": true}, {"tekst": "Filadelfija", "tacan": true}, {"tekst": "Njujork", "tacan": true}, {"tekst": "Vašington", "tacan": false, "zasto": "Grad Vašington je osnovan tek 1800, kao glavni grad SAD."}, {"tekst": "Liverpul", "tacan": false, "zasto": "Liverpul je engleski lučki grad, ne kolonijalni."}], "pomoc": ["U jednom je bila čajanka, u drugom Kongres.", "Treći je danas najveći grad SAD.", "Iz lekcije: Boston, Filadelfija i Njujork bili su glavni centri trgovine, zanatstva i bankarstva."], "objasnjenje": "Boston, Filadelfija i Njujork bili su središta trgovine, zanatstva i bankarstva u kolonijama.", "iz_udzbenika": {"strana": 42, "odeljak": "Britanske kolonije u Severnoj Americi", "tekst": "Boston, Filadelfija i Njujork bili su glavni centri trgovine, zanatstva i bankarstva."}, "lekcija": 5}, {"id": "l05-kol-tn-protestanti", "vrsta": "tacno_netacno", "tezina": "lako", "pojmovi": ["kolonisti", "protestanti"], "tvrdnja": "Većina kolonista u Severnoj Americi bila je protestantske vere.", "tacno": true, "pomoc": ["Iz kojih delova Evrope su dolazili doseljenici?", "Iz lekcije: većina kolonista bila je protestantske vere."], "objasnjenje": "Tačno — doseljenici sa Britanskih ostrva i iz zapadne i severne Evrope bili su većinom protestanti.", "iz_udzbenika": {"strana": 41, "odeljak": "Britanske kolonije u Severnoj Americi", "tekst": "Većina kolonista bila je protestantske vere."}, "lekcija": 5}, {"id": "l05-kol-tn-bez-robova", "vrsta": "tacno_netacno", "tezina": "lako", "pojmovi": ["robovlasnistvo", "plantaze"], "tvrdnja": "U britanskim kolonijama u Severnoj Americi nije bilo robovlasništva.", "tacno": false, "ispravke": [{"tekst": "Robovlasništvo je postojalo: robovi poreklom iz Afrike radili su na plantažama pamuka i duvana.", "tacan": true}, {"tekst": "Robovi su postojali samo u Bostonu i radili u bankama.", "tacan": false, "zasto": "Robovi su radili na plantažama pamuka i duvana."}, {"tekst": "Robovi su bili doseljenici iz severne Evrope.", "tacan": false, "zasto": "Robovi su bili poreklom iz Afrike."}], "pomoc": ["Seti se odakle je Britanija dobijala jeftin pamuk (lekcija 2.1).", "Ko je radio na plantažama?", "Iz lekcije: u kolonijama je postojalo robovlasništvo; robovi iz Afrike radili su na plantažama pamuka i duvana."], "objasnjenje": "Netačno — robovi poreklom iz Afrike radili su na plantažama pamuka i duvana.", "iz_udzbenika": {"strana": 42, "odeljak": "Britanske kolonije u Severnoj Americi", "tekst": "U kolonijama je postojalo robovlasništvo; robovi iz Afrike radili su na plantažama pamuka i duvana."}, "lekcija": 5}, {"id": "l05-kol-tn-predstavnici", "vrsta": "tacno_netacno", "tezina": "srednje", "pojmovi": ["kolonisti", "britanski-parlament"], "tvrdnja": "Britanci su prihvatili zahtev kolonista da njihovi predstavnici uđu u britanski parlament.", "tacno": false, "ispravke": [{"tekst": "Zahtev je odbijen, pa su kolonisti počeli proteste i bojkot britanske robe.", "tacan": true}, {"tekst": "Zahtev je prihvaćen, ali kolonisti su ipak digli ustanak.", "tacan": false, "zasto": "Zahtev nije prihvaćen — upravo je odbijanje izazvalo proteste."}, {"tekst": "Kolonisti takav zahtev nikada nisu postavili.", "tacan": false, "zasto": "Jesu — tražili su da njihovi predstavnici učestvuju u radu parlamenta."}], "pomoc": ["Šta su kolonisti uradili posle odgovora Britanaca?", "Da li bi protestovali da je zahtev prihvaćen?", "Iz lekcije: zahtevi su odbijeni, pa su kolonisti protestovali i prestali da kupuju britansku robu."], "objasnjenje": "Netačno — zahtev je odbijen, a kolonisti su odgovorili protestima i bojkotom britanske robe.", "iz_udzbenika": {"strana": 42, "odeljak": "Britanske kolonije u Severnoj Americi", "tekst": "Kolonisti su tražili predstavnike u britanskom parlamentu; kad je zahtev odbijen, počeli su proteste i bojkot."}, "lekcija": 5}, {"id": "l05-kol-dopuni-robovi", "vrsta": "dopuni", "tezina": "lako", "pojmovi": ["robovlasnistvo", "pamuk", "duvan", "plantaze"], "pitanje": "Dopuni rečenicu.", "tekst": "U kolonijama je postojalo i {{robovlasništvo}}: robovi poreklom iz {{Afrike}} radili su na plantažama {{pamuka}} i {{duvana}}.", "ponudjene": ["robovlasništvo", "Afrike", "pamuka", "duvana", "Azije", "čaja", "kmetstvo"], "pomoc": ["Ljudi su bili vlasništvo drugih ljudi.", "Na plantažama su se gajile biljke za tkanine i za pušenje.", "Iz lekcije: robovi iz Afrike radili su na plantažama pamuka i duvana."], "objasnjenje": "Robovi poreklom iz Afrike radili su na plantažama pamuka i duvana.", "iz_udzbenika": {"strana": 42, "odeljak": "Britanske kolonije u Severnoj Americi", "tekst": "Robovi poreklom iz Afrike radili su na plantažama pamuka i duvana."}, "lekcija": 5}, {"id": "l05-kol-dopuni-mere", "vrsta": "dopuni", "tezina": "srednje", "pojmovi": ["carine", "gradjanstvo", "kolonija"], "pitanje": "Dopuni opis britanskih mera.", "tekst": "Britanske vlasti nametale su kolonijama stroga pravila u {{trgovini}} sa evropskim kontinentom i uvele razne {{carine}} i druge dažbine. Zato je {{građanstvo}} u kolonijama bilo nezadovoljno, jer su mere ograničavale razvoj {{privrede}}.", "ponudjene": ["trgovini", "carine", "građanstvo", "privrede", "plemstvo", "umetnosti", "ratovanju"], "pomoc": ["Pravila su se ticala kupovine i prodaje robe.", "Nezadovoljni su bili trgovci, zanatlije i bankari.", "Iz lekcije: stroga pravila u trgovini, carine i dažbine → nezadovoljno građanstvo, sputana privreda."], "objasnjenje": "Stroga trgovačka pravila, carine i dažbine sputavale su privredu kolonija, pa je građanstvo bilo nezadovoljno.", "iz_udzbenika": {"strana": 42, "odeljak": "Britanske kolonije u Severnoj Americi", "tekst": "Britanci su nametali stroga pravila u trgovini, carine i dažbine, što je ograničavalo privredu kolonija."}, "lekcija": 5}, {"id": "l05-kol-povezi-kolonije", "vrsta": "povezi", "tezina": "srednje", "pojmovi": ["kolonisti", "robovlasnistvo", "boston", "plantaze"], "pitanje": "Poveži pojam sa opisom iz lekcije.", "parovi": [["Doseljenici", "sa Britanskih ostrva i iz zapadne i severne Evrope"], ["Robovi", "poreklom iz Afrike"], ["Plantaže", "pamuk i duvan"], ["Boston, Filadelfija, Njujork", "trgovina, zanatstvo i bankarstvo"]], "pomoc": ["Ko je došao dobrovoljno, a ko doveden?", "Gradovi su bili privredna središta.", "Iz lekcije: doseljenici iz Evrope, robovi iz Afrike na plantažama pamuka i duvana, gradovi kao centri trgovine."], "objasnjenje": "Kolonije su naselili Evropljani; robovi iz Afrike radili su na plantažama; Boston, Filadelfija i Njujork bili su središta trgovine i bankarstva.", "iz_udzbenika": {"strana": 42, "odeljak": "Britanske kolonije u Severnoj Americi", "tekst": "Lekcija opisuje stanovništvo, gradove i plantaže kolonija."}, "lekcija": 5}, {"id": "l05-kol-datum-1775", "vrsta": "datum", "tezina": "srednje", "pojmovi": ["kolonisti", "americka-revolucija"], "dogadjaj": "Britanci pokušavaju da uhapse vođe kolonista", "pitanje": "Koje godine je britanska vojska neuspešno pokušala da uhapsi vođe protesta i oduzme oružje kolonistima?", "godina": 1775, "traka": "dogadjaji", "pomoc": ["Desilo se u proleće, iste godine kada počinje Američka revolucija.", "Dve godine posle Bostonske čajanke (1773).", "Iz lekcije: u proleće 1775. britanska vojska je neuspešno pokušala da uhapsi vođe protesta."], "objasnjenje": "U proleće 1775. propao je pokušaj hapšenja vođa i oduzimanja oružja, a sukobi su prerasli u Američku revoluciju.", "iz_udzbenika": {"strana": 42, "odeljak": "Britanske kolonije u Severnoj Americi", "tekst": "U proleće 1775. britanska vojska je neuspešno pokušala da pohapsi vođe protesta i oduzme oružje kolonistima."}, "lekcija": 5}, {"id": "l05-kol-lanac-nezadovoljstvo", "vrsta": "lanac", "tezina": "lako", "pojmovi": ["carine", "gradjanstvo", "kolonisti"], "karike": ["Britanci uvode stroga pravila u trgovini i carine", "?", "Kolonisti traže predstavnike u britanskom parlamentu"], "praznina": 1, "odgovori": [{"tekst": "Građanstvo u kolonijama je nezadovoljno jer je privreda sputana", "tacan": true}, {"tekst": "Kolonije se brzo bogate i zadovoljne su", "tacan": false, "zasto": "Mere su ograničavale razvoj privrede, pa su kolonisti bili nezadovoljni."}, {"tekst": "Francuska ulazi u rat", "tacan": false, "zasto": "Francuska ulazi u rat tek tokom revolucije, posle 1775."}], "pomoc": ["Kako trgovci reaguju na nove namete?", "Ako im privreda ne može da raste, šta osećaju?", "Iz lekcije: građanstvo je bilo nezadovoljno, jer su mere ograničavale privredu."], "objasnjenje": "Namete i trgovinska ograničenja građanstvo je doživelo kao nepravdu i zatražilo glas u parlamentu.", "iz_udzbenika": {"strana": 42, "odeljak": "Britanske kolonije u Severnoj Americi", "tekst": "Pravila i carine izazvali su nezadovoljstvo građanstva; kolonisti traže predstavnike u parlamentu."}, "lekcija": 5}, {"id": "l05-kol-lanac-bojkot", "vrsta": "lanac", "tezina": "srednje", "pojmovi": ["kolonisti", "britanski-parlament"], "karike": ["Zahtev kolonista za predstavnicima u parlamentu je odbijen", "?", "Britanska vojska pokušava da uhapsi vođe protesta (1775)"], "praznina": 1, "odgovori": [{"tekst": "Kolonisti protestuju i prestaju da kupuju britansku robu", "tacan": true}, {"tekst": "Kolonisti biraju Kromvela za vođu", "tacan": false, "zasto": "Kromvel je iz XVII veka i vodio je engleski parlament."}, {"tekst": "Kolonisti donose ustav", "tacan": false, "zasto": "Ustav dolazi tek 1787, posle pobede."}], "pomoc": ["Šta možeš da uradiš kad te ne slušaju, a ne želiš odmah rat?", "Prestaneš da kupuješ njihovu robu.", "Iz lekcije: kolonisti su počeli proteste i obustavili kupovinu britanskih proizvoda."], "objasnjenje": "Posle odbijanja kolonisti protestuju i bojkotuju britansku robu, a Britanci pokušavaju da uhapse vođe.", "iz_udzbenika": {"strana": 42, "odeljak": "Britanske kolonije u Severnoj Americi", "tekst": "Kad su zahtevi odbijeni, kolonisti su počeli proteste i obustavili kupovinu britanskih proizvoda."}, "lekcija": 5}, {"id": "l05-kol-lanac-revolucija", "vrsta": "lanac", "tezina": "srednje", "pojmovi": ["americka-revolucija", "kolonisti"], "karike": ["Protesti i bojkot britanske robe", "Britanska vojska neuspešno pokušava da uhapsi vođe i oduzme oružje (proleće 1775)", "?"], "praznina": 2, "odgovori": [{"tekst": "Sukobi prerastaju u Američku revoluciju", "tacan": true}, {"tekst": "Kolonisti odustaju i plaćaju sve carine", "tacan": false, "zasto": "Pokušaj hapšenja je propao, a sukobi su se rasplamsali."}, {"tekst": "Odmah se sklapa mir u Parizu", "tacan": false, "zasto": "Mir u Parizu sklopljen je tek 1783, posle osam godina rata."}], "pomoc": ["Korak 1: Da li je britanski pokušaj uspeo?", "Korak 2: Šta se dešava kad se nasilje proširi?", "Iz lekcije: sukobi su ubrzo prerasli u Američku revoluciju."], "objasnjenje": "Neuspeo pokušaj razoružanja kolonista doveo je do otvorenog rata — Američke revolucije.", "iz_udzbenika": {"strana": 42, "odeljak": "Britanske kolonije u Severnoj Americi", "tekst": "Posle neuspelog pokušaja hapšenja vođa u proleće 1775. sukobi su prerasli u Američku revoluciju."}, "osa": {"naziv": "Američka revolucija", "od": 1775, "do": 1783, "traka": "dogadjaji"}, "lekcija": 5}, {"id": "l05-kol-zakljuci-nezadovoljstvo", "vrsta": "zakljuci", "tezina": "srednje", "pojmovi": ["gradjanstvo", "carine"], "pitanje": "Zašto je baš građanstvo u kolonijama bilo najnezadovoljnije britanskim merama?", "odgovori": [{"tekst": "Bavilo se trgovinom, zanatstvom i bankarstvom, a mere su sputavale privredu", "tacan": true}, {"tekst": "Jer je građanstvo bilo katoličke vere", "tacan": false, "zasto": "Većina kolonista bila je protestantske vere; razlog je bio privredni."}, {"tekst": "Jer su građani bili robovi na plantažama", "tacan": false, "zasto": "Na plantažama su radili robovi iz Afrike, a ne građanstvo."}, {"tekst": "Jer je Britanija ukinula sve gradove", "tacan": false, "zasto": "Ništa slično; gradovi poput Bostona su cvetali, ali ih je kočila britanska politika."}], "pomoc": ["Korak 1: Čime se bavilo građanstvo u Bostonu, Filadelfiji i Njujorku?", "Korak 2: Koga najviše pogađaju pravila u trgovini i carine?", "Iz lekcije: mere su ograničavale razvoj privrede u kolonijama."], "objasnjenje": "Trgovina, zanatstvo i bankarstvo bili su posao građanstva, a britanska pravila i carine pogađali su upravo njih.", "iz_udzbenika": {"strana": 42, "odeljak": "Britanske kolonije u Severnoj Americi", "tekst": "Građanstvo je bilo nezadovoljno, jer su mere britanskih vlasti ograničavale razvoj privrede."}, "lekcija": 5}, {"id": "l05-kol-zakljuci-bojkot", "vrsta": "zakljuci", "tezina": "tesko", "pojmovi": ["kolonisti", "britanski-parlament"], "pitanje": "Čemu je služio bojkot (prestanak kupovine) britanske robe?", "odgovori": [{"tekst": "Da se Britanija pogodi u privredi i natera da popusti kolonistima", "tacan": true}, {"tekst": "Da kolonisti uštede novac za plaćanje carina", "tacan": false, "zasto": "Cilj je bio pritisak na Britaniju, ne štednja za carine."}, {"tekst": "Da se pokaže podrška britanskom kralju", "tacan": false, "zasto": "Bojkot je bio oblik protesta protiv britanske politike."}, {"tekst": "Da se ubrzaju izbori za Donji dom", "tacan": false, "zasto": "Kolonisti nisu ni imali predstavnike u parlamentu."}], "pomoc": ["Korak 1: Ko zarađuje kada kolonisti kupuju britansku robu?", "Korak 2: Šta se dešava kad prestanu?", "Iz lekcije: posle odbijenih zahteva kolonisti su protestovali i obustavili kupovinu britanskih proizvoda."], "objasnjenje": "Bojkot je pritisak bez oružja: britanski trgovci gube zaradu, pa vlada treba da popusti.", "iz_udzbenika": {"strana": 42, "odeljak": "Britanske kolonije u Severnoj Americi", "tekst": "Kolonisti su odgovorili protestima i prestali da kupuju britanske proizvode."}, "lekcija": 5}, {"id": "l05-kol-izbor-kotao", "vrsta": "izbor", "slika_u_pitanju": true, "tezina": "lako", "pojmovi": ["karikatura", "americka-revolucija"], "pitanje": "Šta na britanskoj karikaturi iz 1780. predstavlja ogromni kotao koji državnici krpe?", "odgovori": [{"tekst": "Državu, kojoj pobuna američkih kolonija pravi „rupe”", "tacan": true}, {"tekst": "Kotao za kuvanje čaja iz Bostona", "tacan": false, "zasto": "Kotao je simbol države; državnici pokušavaju da „zakrpe” pobunu."}, {"tekst": "Parnu mašinu Džejmsa Vata", "tacan": false, "zasto": "Karikatura nije o industriji, nego o pobuni kolonija."}, {"tekst": "Krunu engleskog kralja", "tacan": false, "zasto": "Kruna nije prikazana kao kotao; kotao je cela država."}], "pomoc": ["Pročitaj naslov karikature: „Državne kotlokrpe”.", "Šta državnici pokušavaju da „zakrpe”?", "Iz lekcije: državnici pokušavaju da zakrpe državni kotao, tj. da uguše pobunu kolonija."], "objasnjenje": "Kotao je država; rupe su pobuna kolonija; državnici su „kotlokrpe” koje ih krpe.", "iz_udzbenika": {"strana": 42, "odeljak": "Karikatura „Državne kotlokrpe”", "tekst": "Karikatura iz 1780. prikazuje britanske državnike kako krpe državni kotao, tj. guše pobunu kolonija.", "slika": "05-engleska-i-americka-revolucija/03-karikatura-drzavne-kotlokrpe.jpg"}, "osa": {"naziv": "Karikatura „Državne kotlokrpe”", "od": 1780, "traka": "ideje"}, "lekcija": 5}, {"id": "l05-kol-izvor-karikatura", "vrsta": "izvor", "slika_u_pitanju": true, "tezina": "tesko", "pojmovi": ["karikatura", "americka-revolucija"], "izvor": {"autor": "Britanski karikaturista, 1780.", "naslov": "Državne kotlokrpe (opis karikature)", "tekst": "Nekoliko britanskih državnika stoji oko ogromnog, već iskrpljenog kotla. Jedan zamahuje velikim čekićem, drugi kleči i petlja oko dna. Kotao je pun rupa i zakrpa.", "napomena": "Opis karikature; udžbenik, str. 42."}, "pitanje": "Šta autor karikature misli o merama britanske vlade protiv pobune?", "odgovori": [{"tekst": "Da su grube i nespretne i da ne uspevaju — „krpljenje” čekićem samo pravi nove rupe", "tacan": true}, {"tekst": "Da su veoma uspešne i da je pobuna već ugušena", "tacan": false, "zasto": "Karikatura je izašla 1780, usred rata, i prikazuje nespretne „majstore” — pobuna se nastavlja."}, {"tekst": "Da kolonisti treba da plaćaju više poreza", "tacan": false, "zasto": "Karikatura ismeva državnike, a ne koloniste."}, {"tekst": "Da je kotao potpuno nov i čitav", "tacan": false, "zasto": "Kotao je star, izubijan i pun zakrpa."}], "pomoc": ["Karikatura se uvek nečemu podsmeva — kome ovde?", "Da li se rupa popravlja velikim čekićem?", "Iz lekcije: udžbenik pita jesu li mere, prema karikaturi, delotvorne."], "objasnjenje": "Karikaturista ismeva vladu: grubim merama „krpi” državu, a rupe — pobuna — samo rastu.", "iz_udzbenika": {"strana": 42, "odeljak": "Karikatura „Državne kotlokrpe”", "tekst": "Udžbenik pita kako izgleda kotao, kojim sredstvima ga krpe i jesu li mere delotvorne.", "slika": "05-engleska-i-americka-revolucija/03-karikatura-drzavne-kotlokrpe.jpg"}, "lekcija": 5}, {"id": "l05-kol-izbor-karta-obala", "vrsta": "izbor", "slika_u_pitanju": true, "tezina": "lako", "pojmovi": ["trinaest-kolonija", "severna-amerika"], "pitanje": "Gde se, prema karti teritorijalnog razvoja SAD, nalazilo 13 britanskih kolonija 1775?", "odgovori": [{"tekst": "Duž istočne, atlantske obale", "tacan": true}, {"tekst": "Na obali Tihog okeana", "tacan": false, "zasto": "Pacifička obala je pripala SAD mnogo kasnije (npr. posle Meksičkog rata 1848)."}, {"tekst": "Oko Meksičkog zaliva i na Floridi", "tacan": false, "zasto": "Florida je kupljena od Španije tek 1819."}, {"tekst": "U Teksasu", "tacan": false, "zasto": "Teksas je pripojen tek 1845."}], "pomoc": ["Potraži na karti imena Virdžinija, Pensilvanija, Masačusets.", "Te kolonije su uz okean koji gleda ka Evropi.", "Iz lekcije: trinaest kolonija nastalo je na atlantskoj obali."], "objasnjenje": "Trinaest kolonija ležalo je uz atlantsku obalu; ostatak teritorije SAD dobile su kasnije.", "iz_udzbenika": {"strana": 42, "odeljak": "Karta: teritorijalni razvoj SAD", "tekst": "Karta pokazuje 13 britanskih kolonija 1775. uz atlantsku obalu i kasnije širenje SAD.", "slika": "05-engleska-i-americka-revolucija/04-karta-teritorijalni-razvoj-sad.jpg"}, "lekcija": 5}, {"id": "l05-kol-izbor-karta-kolonije", "vrsta": "izbor", "slika_u_pitanju": true, "tezina": "tesko", "pojmovi": ["trinaest-kolonija"], "pitanje": "Koje su od navedenih teritorija, prema karti, bile među 13 britanskih kolonija? (više tačnih)", "odgovori": [{"tekst": "Virdžinija", "tacan": true}, {"tekst": "Masačusets", "tacan": true}, {"tekst": "Pensilvanija", "tacan": true}, {"tekst": "Džordžija", "tacan": true}, {"tekst": "Teksas", "tacan": false, "zasto": "Teksas je pripojen SAD tek 1845."}, {"tekst": "Florida", "tacan": false, "zasto": "Floridu su SAD kupile od Španije 1819."}], "pomoc": ["Kolonije su na karti imenovane uz istočnu obalu.", "Izbaci teritorije dobijene u XIX veku.", "Iz lekcije (karta): kolonije su npr. Nju Hempšir, Masačusets, Pensilvanija, Virdžinija, Karoline, Džordžija."], "objasnjenje": "Virdžinija, Masačusets, Pensilvanija i Džordžija su među 13 kolonija; Florida (1819) i Teksas (1845) dolaze kasnije.", "iz_udzbenika": {"strana": 42, "odeljak": "Karta: teritorijalni razvoj SAD", "tekst": "Na karti su imenovane kolonije na istočnoj obali, od Nju Hempšira do Džordžije.", "slika": "05-engleska-i-americka-revolucija/04-karta-teritorijalni-razvoj-sad.jpg"}, "lekcija": 5}, {"id": "l05-kol-poredjaj-karta", "vrsta": "poredjaj", "slika_u_pitanju": true, "tezina": "tesko", "pojmovi": ["sjedinjene-americke-drzave"], "pitanje": "Prema legendi karte, poređaj širenje SAD od najranijeg.", "stavke": [{"tekst": "Teritorija dobijena sticanjem nezavisnosti", "godina": 1783, "naziv": "Pariski mir", "traka": "dogadjaji"}, {"tekst": "Teritorija kupljena od Francuske", "godina": 1803, "naziv": "SAD kupuju teritoriju od Francuske", "traka": "dogadjaji"}, {"tekst": "Florida kupljena od Španije", "godina": 1819, "naziv": "SAD kupuju Floridu od Španije", "traka": "dogadjaji"}, {"tekst": "Teksas pripojen", "godina": 1845, "naziv": "Teksas pripojen SAD", "traka": "dogadjaji"}, {"tekst": "Teritorija pripojena posle Meksičkog rata", "godina": 1848, "naziv": "Pripajanje posle Meksičkog rata", "traka": "dogadjaji"}], "pomoc": ["Prva teritorija dolazi sa priznanjem nezavisnosti.", "Teksas i rat sa Meksikom su susedni u vremenu, Teksas prvi.", "Iz lekcije (legenda): 1783, 1803 (Francuska), 1819 (Florida), 1845 (Teksas), 1848 (Meksički rat)."], "objasnjenje": "1783 nezavisnost → 1803 kupovina od Francuske → 1819 Florida → 1845 Teksas → 1848 posle Meksičkog rata.", "iz_udzbenika": {"strana": 42, "odeljak": "Karta: teritorijalni razvoj SAD", "tekst": "Legenda karte pokazuje kako su se SAD širile od 1783. do sredine XIX veka.", "slika": "05-engleska-i-americka-revolucija/04-karta-teritorijalni-razvoj-sad.jpg"}, "lekcija": 5}, {"id": "l05-kol-uporedi-strane", "vrsta": "uporedi", "tezina": "srednje", "pojmovi": ["kolonisti", "velika-britanija", "carine"], "a": "Britanske vlasti", "b": "Kolonisti", "pitanje": "Ko je to uradio — britanske vlasti, kolonisti, obe strane ili niko?", "tvrdnje": [{"tekst": "Uvele su carine i druge dažbine.", "odgovor": "a", "zasto": "Carine i dažbine nametale su britanske vlasti."}, {"tekst": "Tražili su predstavnike u britanskom parlamentu.", "odgovor": "b", "zasto": "To je bio zahtev kolonista."}, {"tekst": "Prestali su da kupuju britansku robu.", "odgovor": "b", "zasto": "Bojkot je bio odgovor kolonista na odbijanje."}, {"tekst": "Pokušala je da uhapsi vođe protesta 1775.", "odgovor": "a", "zasto": "Britanska vojska je pokušala hapšenje i razoružavanje."}, {"tekst": "Učestvovali su u sukobima koji su prerasli u Američku revoluciju.", "odgovor": "oba", "zasto": "Rat su vodile obe strane."}, {"tekst": "Ukinuli su robovlasništvo u kolonijama.", "odgovor": "nijedan", "zasto": "Robovlasništvo je postojalo i nije ga ukinula nijedna strana u ovom periodu."}], "pomoc": ["Ko je nametao pravila, a ko se bunio?", "Rat uvek ima dve strane.", "Iz lekcije: Britanci — pravila, carine, pokušaj hapšenja; kolonisti — zahtev za predstavnicima, protesti, bojkot."], "objasnjenje": "Britanske vlasti su nametale mere i poslale vojsku; kolonisti su tražili prava, protestovali i bojkotovali robu.", "iz_udzbenika": {"strana": 42, "odeljak": "Britanske kolonije u Severnoj Americi", "tekst": "Lekcija opisuje mere Britanaca i odgovor kolonista do 1775."}, "lekcija": 5}, {"id": "l05-kol-objasni-nezadovoljstvo", "vrsta": "objasni", "tezina": "srednje", "pojmovi": ["kolonisti", "carine", "britanski-parlament"], "pitanje": "Zašto su američki kolonisti bili nezadovoljni britanskom vlašću i kako su to pokazali?", "uzor": "Britanske vlasti su kolonijama nametale stroga pravila u trgovini, carine i druge dažbine, pa je razvoj privrede bio sputan. Kolonisti su tražili da njihovi predstavnici učestvuju u radu britanskog parlamenta. Kad je zahtev odbijen, počeli su da protestuju i prestali su da kupuju britansku robu.", "ideje": ["Stroga trgovačka pravila, carine i dažbine.", "Sputan razvoj privrede, nezadovoljno građanstvo.", "Zahtev za predstavnicima u parlamentu je odbijen.", "Protesti i bojkot britanske robe."], "objasnjenje": "Kolonisti su plaćali namete, a nisu imali glas u parlamentu koji ih je uvodio.", "iz_udzbenika": {"strana": 42, "odeljak": "Britanske kolonije u Severnoj Americi", "tekst": "Mere britanskih vlasti sputavale su privredu; kolonisti su tražili predstavnike, a posle odbijanja protestovali i bojkotovali robu."}, "lekcija": 5}]}, {"naslov": "5. Američka revolucija", "zadaci": [{"id": "l05-amr-izbor-vasington", "vrsta": "izbor", "tezina": "lako", "pojmovi": ["dzordz-vasington", "kongres"], "pitanje": "Koga je Kongres pobunjenih kolonija imenovao za glavnog zapovednika vojske?", "odgovori": [{"tekst": "Džordža Vašingtona", "tacan": true}, {"tekst": "Tomasa Džefersona", "tacan": false, "zasto": "Džeferson je sastavio Deklaraciju nezavisnosti; vojsku je vodio Vašington."}, {"tekst": "Olivera Kromvela", "tacan": false, "zasto": "Kromvel je vodio engleski parlament u XVII veku."}, {"tekst": "Luja XVI", "tacan": false, "zasto": "Luj XVI je bio francuski kralj."}], "pomoc": ["Po njemu je kasnije nazvan glavni grad SAD.", "Postao je i prvi američki predsednik.", "Iz lekcije: Kongres je za glavnog zapovednika imenovao generala Džordža Vašingtona."], "objasnjenje": "General Džordž Vašington, koji se ranije istakao u britanskoj službi, postao je glavni zapovednik vojske kolonija.", "iz_udzbenika": {"strana": 43, "odeljak": "Američka revolucija", "tekst": "Kongres je za glavnog zapovednika imenovao generala Džordža Vašingtona."}, "lekcija": 5}, {"id": "l05-amr-izbor-dzeferson", "vrsta": "izbor", "tezina": "lako", "pojmovi": ["tomas-dzeferson", "deklaracija-nezavisnosti"], "pitanje": "Ko je sastavio Deklaraciju nezavisnosti?", "odgovori": [{"tekst": "Tomas Džeferson", "tacan": true}, {"tekst": "Džordž Vašington", "tacan": false, "zasto": "Vašington je bio zapovednik vojske, a Deklaraciju je sastavio Džeferson."}, {"tekst": "Volter", "tacan": false, "zasto": "Volter je francuski prosvetitelj; Džeferson se služio idejama prosvetitelja, ali je sam pisao Deklaraciju."}, {"tekst": "Engleski kralj", "tacan": false, "zasto": "Deklaracija je upravo odvajanje od engleskog (britanskog) kralja."}], "pomoc": ["Nije vojskovođa, nego pisac dokumenta.", "Ime mu počinje na T.", "Iz lekcije: Deklaraciju je sastavio Tomas Džeferson."], "objasnjenje": "Deklaraciju nezavisnosti sastavio je Tomas Džeferson, po idejama francuskih prosvetitelja.", "iz_udzbenika": {"strana": 43, "odeljak": "Američka revolucija", "tekst": "Deklaraciju je, prema idejama francuskih prosvetitelja, sastavio Tomas Džeferson."}, "lekcija": 5}, {"id": "l05-amr-izbor-ideje", "vrsta": "izbor", "tezina": "lako", "pojmovi": ["deklaracija-nezavisnosti", "prosvetitelji"], "pitanje": "Na čijim idejama je zasnovana Deklaracija nezavisnosti?", "odgovori": [{"tekst": "Francuskih prosvetitelja", "tacan": true}, {"tekst": "Ruskih careva", "tacan": false, "zasto": "Ruski carevi su bili apsolutistički vladari; ideje su došle od prosvetitelja."}, {"tekst": "Engleskih kraljeva iz dinastije Stjuart", "tacan": false, "zasto": "Stjuarti su bili za jaku vlast kralja — suprotno idejama Deklaracije."}, {"tekst": "Luditi", "tacan": false, "zasto": "Luditi su engleski radnici koji su lomili mašine; nisu imali veze sa Deklaracijom."}], "pomoc": ["Seti se prethodne lekcije: ko je govorio o razumu, pravima i volji naroda?", "Monteskje, Ruso, Volter …", "Iz lekcije: Deklaracija je sastavljena prema idejama francuskih prosvetitelja."], "objasnjenje": "Džeferson je pisao Deklaraciju po idejama francuskih prosvetitelja — o prirodnim pravima i vlasti koja potiče od naroda.", "iz_udzbenika": {"strana": 43, "odeljak": "Američka revolucija", "tekst": "Deklaracija je sastavljena prema idejama francuskih prosvetitelja."}, "lekcija": 5}, {"id": "l05-amr-izbor-francuska", "vrsta": "izbor", "tezina": "lako", "pojmovi": ["francuska", "americka-revolucija"], "pitanje": "Ulazak koje države u rat bio je važna prekretnica za koloniste?", "odgovori": [{"tekst": "Francuske", "tacan": true}, {"tekst": "Rusije", "tacan": false, "zasto": "Lekcija kao prekretnicu navodi ulazak Francuske."}, {"tekst": "Škotske", "tacan": false, "zasto": "Škotska je bila deo Velike Britanije."}, {"tekst": "Kanade", "tacan": false, "zasto": "Kanada je ostala britanska i posle rata."}], "pomoc": ["Ta država je ranije izgubila posede u Americi od Britanaca.", "Poslala je ratne brodove i vojsku.", "Iz lekcije: važna prekretnica bio je ulazak Francuske u rat."], "objasnjenje": "Francuska je ušla u rat na strani kolonista i pomogla im brodovima i vojskom.", "iz_udzbenika": {"strana": 43, "odeljak": "Američka revolucija", "tekst": "Za koloniste je važna prekretnica bila ulazak Francuske u rat."}, "lekcija": 5}, {"id": "l05-amr-izbor-kanada", "vrsta": "izbor", "tezina": "srednje", "pojmovi": ["pariski-mir-1783", "kanada", "karipsko-more"], "pitanje": "Šta su Britanci zadržali u Severnoj Americi posle mira 1783?", "odgovori": [{"tekst": "Kanadu i ostrva u Karipskom moru", "tacan": true}, {"tekst": "Boston i Njujork", "tacan": false, "zasto": "Ti gradovi su u bivšim kolonijama, koje su postale SAD."}, {"tekst": "Virdžiniju i Džordžiju", "tacan": false, "zasto": "To su bile dve od 13 kolonija koje su postale nezavisne."}, {"tekst": "Ništa — izgubili su sve posede u Americi", "tacan": false, "zasto": "Zadržali su Kanadu i karipska ostrva."}], "pomoc": ["Jedna teritorija je severno od SAD.", "Druga su ostrva u toplom moru.", "Iz lekcije: Britanci su zadržali Kanadu i ostrva u Karipskom moru."], "objasnjenje": "Britanija je priznala SAD, ali je zadržala Kanadu i ostrva u Karipskom moru.", "iz_udzbenika": {"strana": 43, "odeljak": "Američka revolucija", "tekst": "Britanci su u Severnoj Americi zadržali Kanadu i ostrva u Karipskom moru."}, "lekcija": 5}, {"id": "l05-amr-izbor-cajanka-slika", "vrsta": "izbor", "slika_u_pitanju": true, "tezina": "lako", "pojmovi": ["bostonska-cajanka", "boston"], "pitanje": "Šta rade ljudi na brodu na slici Bostonske čajanke?", "odgovori": [{"tekst": "Bacaju sanduke čaja u more", "tacan": true}, {"tekst": "Istovaraju čaj i plaćaju carinu", "tacan": false, "zasto": "Kolonisti su upravo odbijali da plate carinu i bacili su čaj."}, {"tekst": "Piju čaj sa britanskim vojnicima", "tacan": false, "zasto": "„Čajanka” je ironičan naziv — čaj je završio u moru."}, {"tekst": "Potpisuju Deklaraciju nezavisnosti", "tacan": false, "zasto": "Deklaracija je izglasana u Filadelfiji 1776, ne na brodu."}], "pomoc": ["Pogledaj ruke ljudi na palubi.", "Šta pada u vodu?", "Iz lekcije: prerušeni kolonisti su upali na brodove i bacili tovare čaja u more."], "objasnjenje": "Kolonisti prerušeni u Indijance bacaju britanski čaj u more, a gomila na obali ih bodri.", "iz_udzbenika": {"strana": 43, "odeljak": "Znatiželja: Bostonska čajanka", "tekst": "Grupa kolonista prerušenih u Indijance bacila je tovare čaja sa britanskih brodova u more.", "slika": "05-engleska-i-americka-revolucija/06-bostonska-cajanka.jpg"}, "lekcija": 5}, {"id": "l05-amr-izbor-indija", "vrsta": "izbor", "tezina": "srednje", "pojmovi": ["bostonska-cajanka"], "pitanje": "Šta je britanska vlada 1773. pokušala da uradi u američkim kolonijama?", "odgovori": [{"tekst": "Da rasproda zalihe čaja iz Indije", "tacan": true}, {"tekst": "Da zabrani pijenje čaja", "tacan": false, "zasto": "Naprotiv, htela je da proda što više čaja."}, {"tekst": "Da kupi čaj od kolonista", "tacan": false, "zasto": "Čaj je dolazio iz Indije i Britanija ga je prodavala kolonijama."}, {"tekst": "Da kolonistima pokloni čaj", "tacan": false, "zasto": "Uvezeni čaj je trebalo i ocariniti — kolonisti su to sprečavali."}], "pomoc": ["Odakle je dolazio čaj?", "Vlada je imala viškove i htela je da ih proda.", "Iz lekcije: britanska vlada je pokušala da u kolonijama rasproda zalihe čaja iz Indije."], "objasnjenje": "Britanska vlada je htela da u kolonijama rasproda čaj iz Indije; kolonisti su sprečavali da se on ocarini i istovari.", "iz_udzbenika": {"strana": 43, "odeljak": "Znatiželja: Bostonska čajanka", "tekst": "Britanska vlada pokušala je da u kolonijama rasproda zalihe čaja iz Indije."}, "lekcija": 5}, {"id": "l05-amr-tn-deklaracija", "vrsta": "tacno_netacno", "tezina": "lako", "pojmovi": ["deklaracija-nezavisnosti", "filadelfija", "kongres"], "tvrdnja": "Kongres je u Filadelfiji 4. jula 1776. izglasao Deklaraciju nezavisnosti.", "tacno": true, "pomoc": ["Seti se američkog praznika nezavisnosti.", "Iz lekcije: Kongres je u Filadelfiji izglasao Deklaraciju nezavisnosti 4. jula 1776."], "objasnjenje": "Tačno — 4. jul 1776. je dan kada je u Filadelfiji izglasana Deklaracija nezavisnosti.", "iz_udzbenika": {"strana": 43, "odeljak": "Američka revolucija", "tekst": "Kongres je u Filadelfiji izglasao Deklaraciju nezavisnosti 4. jula 1776.", "slika": "05-engleska-i-americka-revolucija/05-proglasenje-deklaracije-nezavisnosti.jpg"}, "osa": {"naziv": "Deklaracija nezavisnosti", "od": 1776, "traka": "dogadjaji"}, "lekcija": 5}, {"id": "l05-amr-tn-francuska-zasto", "vrsta": "tacno_netacno", "tezina": "srednje", "pojmovi": ["francuska", "americka-revolucija"], "tvrdnja": "Francuska je pomogla kolonistima jer je i sama želela da postane republika.", "tacno": false, "ispravke": [{"tekst": "Francuska je pomogla kolonistima da bi nanela što veću štetu Britaniji.", "tacan": true}, {"tekst": "Francuska je pomogla jer su kolonisti bili Francuzi.", "tacan": false, "zasto": "Kolonisti su većinom bili doseljenici sa Britanskih ostrva i iz zapadne i severne Evrope."}, {"tekst": "Francuska je pomogla jer je htela da dobije Kanadu od kolonista.", "tacan": false, "zasto": "Lekcija kao razlog navodi štetu Britaniji; Kanada je ostala britanska."}], "pomoc": ["Ko je bio najveći suparnik Francuske?", "Ko je Francuzima oteo posede u Americi?", "Iz lekcije: Francuska je želela da pomogne kolonistima kako bi nanela što veću štetu Britaniji."], "objasnjenje": "Netačno — Francuska je htela da oslabi suparnicu Britaniju.", "iz_udzbenika": {"strana": 43, "odeljak": "Američka revolucija", "tekst": "Francuska je želela da pomogne kolonistima kako bi nanela što veću štetu Britaniji."}, "lekcija": 5}, {"id": "l05-amr-tn-mir-kolonije", "vrsta": "tacno_netacno", "tezina": "tesko", "pojmovi": ["pariski-mir-1783", "sjedinjene-americke-drzave"], "tvrdnja": "Mirom u Parizu 1783. Velika Britanija je zadržala svih trinaest kolonija, ali im je dala više prava.", "tacno": false, "ispravke": [{"tekst": "Mirom u Parizu Britanija je priznala nezavisnost SAD i zadržala samo Kanadu i karipska ostrva.", "tacan": true}, {"tekst": "Mirom u Parizu kolonije su pripale Francuskoj.", "tacan": false, "zasto": "Kolonije su postale nezavisne SAD, a ne francuske."}, {"tekst": "Mir u Parizu sklopljen je pre početka rata, 1774.", "tacan": false, "zasto": "Mir je sklopljen 1783, na kraju rata; 1774. je bio prvi kongres u Filadelfiji."}], "pomoc": ["Čime se završila Američka revolucija?", "Šta je Britanija morala da prizna?", "Iz lekcije: mirom u Parizu 1783. Britanija je priznala nezavisnost SAD."], "objasnjenje": "Netačno — mir u Parizu doneo je priznanje nezavisnosti SAD; Britanija je zadržala Kanadu i ostrva u Karipskom moru.", "iz_udzbenika": {"strana": 43, "odeljak": "Američka revolucija", "tekst": "Mir je sklopljen u Parizu 1783; Velika Britanija je priznala nezavisnost SAD."}, "osa": {"naziv": "Pariski mir", "od": 1783, "traka": "dogadjaji"}, "lekcija": 5}, {"id": "l05-amr-tn-indijanci", "vrsta": "tacno_netacno", "tezina": "srednje", "pojmovi": ["bostonska-cajanka", "kolonisti", "indijanci"], "tvrdnja": "Tovare čaja u Bostonu bacili su u more pravi Indijanci, starosedeoci Amerike.", "tacno": false, "ispravke": [{"tekst": "Čaj su bacili kolonisti prerušeni u Indijance.", "tacan": true}, {"tekst": "Čaj su bacili britanski vojnici jer je bio pokvaren.", "tacan": false, "zasto": "Britanci su hteli da prodaju čaj; uništili su ga kolonisti."}, {"tekst": "Čaj su bacili francuski mornari.", "tacan": false, "zasto": "Francuska ulazi u rat tek kasnije; akcija u Bostonu bila je delo kolonista."}], "pomoc": ["Pročitaj pažljivo: ljudi su bili „maskirani”.", "Ko je imao razlog da protestuje protiv britanskog čaja?", "Iz lekcije: grupa kolonista, maskirana u Indijance, upala je na brodove."], "objasnjenje": "Netačno — to su bili kolonisti prerušeni u Indijance.", "iz_udzbenika": {"strana": 43, "odeljak": "Znatiželja: Bostonska čajanka", "tekst": "Grupa kolonista, prerušena u Indijance, upala je na usidrene britanske brodove.", "slika": "05-engleska-i-americka-revolucija/06-bostonska-cajanka.jpg"}, "lekcija": 5}, {"id": "l05-amr-datum-deklaracija", "vrsta": "datum", "tezina": "lako", "pojmovi": ["deklaracija-nezavisnosti"], "dogadjaj": "Deklaracija nezavisnosti", "pitanje": "Koje godine je izglasana Deklaracija nezavisnosti?", "godina": 1776, "traka": "dogadjaji", "pomoc": ["Dan nezavisnosti SAD je 4. jul — koje godine?", "Godinu dana posle početka rata (1775).", "Iz lekcije: Deklaracija nezavisnosti, 4. jul 1776."], "objasnjenje": "Deklaracija nezavisnosti izglasana je 4. jula 1776. u Filadelfiji.", "iz_udzbenika": {"strana": 43, "odeljak": "Američka revolucija", "tekst": "Deklaracija nezavisnosti izglasana je 4. jula 1776."}, "lekcija": 5}, {"id": "l05-amr-datum-revolucija", "vrsta": "datum", "tezina": "srednje", "pojmovi": ["americka-revolucija", "americki-rat-za-nezavisnost"], "dogadjaj": "Američka revolucija", "pitanje": "Kada je trajao Američki rat za nezavisnost (Američka revolucija)?", "od": 1775, "do": 1783, "traka": "dogadjaji", "pomoc": ["Počeo je posle neuspelog pokušaja hapšenja vođa u proleće.", "Završio se mirom u Parizu.", "Iz lekcije: Američka revolucija (1775–1783)."], "objasnjenje": "Američka revolucija trajala je od 1775. do mira u Parizu 1783.", "iz_udzbenika": {"strana": 43, "odeljak": "Američka revolucija", "tekst": "Američki rat za nezavisnost ili Američka revolucija trajala je 1775–1783."}, "lekcija": 5}, {"id": "l05-amr-datum-jorktaun", "vrsta": "datum", "tezina": "srednje", "pojmovi": ["jorktaun", "dzordz-vasington"], "dogadjaj": "Bitka kod Jorktauna", "pitanje": "Koje godine je Vašington naterao britanske snage na predaju kod Jorktauna?", "godina": 1781, "traka": "dogadjaji", "pomoc": ["Bilo je to pred kraj rata, uz francusku pomoć.", "Dve godine pre mira u Parizu (1783).", "Iz lekcije: predaja Britanaca kod Jorktauna 1781."], "objasnjenje": "Kod Jorktauna 1781. Vašington je, uz francuske brodove i vojsku, primorao Britance na predaju.", "iz_udzbenika": {"strana": 43, "odeljak": "Američka revolucija", "tekst": "Vašington je kod Jorktauna 1781. naterao britanske snage na predaju."}, "lekcija": 5}, {"id": "l05-amr-datum-cajanka", "vrsta": "datum", "tezina": "lako", "pojmovi": ["bostonska-cajanka"], "dogadjaj": "Bostonska čajanka", "pitanje": "Koje godine se dogodila Bostonska čajanka?", "godina": 1773, "traka": "dogadjaji", "pomoc": ["Bila je nekoliko godina pre početka rata (1775).", "Godinu dana pre prvog kongresa u Filadelfiji (1774).", "Iz lekcije: Bostonska čajanka 1773."], "objasnjenje": "Bostonska čajanka bila je 1773, a već sledeće godine sazvan je prvi kongres kolonista.", "iz_udzbenika": {"strana": 43, "odeljak": "Znatiželja: Bostonska čajanka", "tekst": "Bostonska čajanka dogodila se 1773."}, "lekcija": 5}, {"id": "l05-amr-datum-mir", "vrsta": "datum", "tezina": "lako", "pojmovi": ["pariski-mir-1783", "sjedinjene-americke-drzave"], "dogadjaj": "Pariski mir", "pitanje": "Koje godine je sklopljen mir u Parizu kojim je Britanija priznala nezavisnost SAD?", "godina": 1783, "traka": "dogadjaji", "pomoc": ["To je kraj Američke revolucije.", "Dve godine posle Jorktauna (1781).", "Iz lekcije: mir u Parizu 1783."], "objasnjenje": "Mir u Parizu 1783. okončao je rat; Velika Britanija je priznala SAD.", "iz_udzbenika": {"strana": 43, "odeljak": "Američka revolucija", "tekst": "Mir je sklopljen u Parizu 1783."}, "lekcija": 5}, {"id": "l05-amr-poredjaj-rat", "vrsta": "poredjaj", "tezina": "srednje", "pojmovi": ["bostonska-cajanka", "americka-revolucija", "deklaracija-nezavisnosti", "jorktaun", "pariski-mir-1783"], "pitanje": "Poređaj događaje Američke revolucije od najranijeg.", "stavke": [{"tekst": "Bostonska čajanka", "godina": 1773, "naziv": "Bostonska čajanka", "traka": "dogadjaji"}, {"tekst": "Prvi kongres kolonista u Filadelfiji", "godina": 1774, "naziv": "Prvi kongres kolonista u Filadelfiji", "traka": "dogadjaji"}, {"tekst": "Britanci neuspešno pokušavaju da uhapse vođe kolonista", "godina": 1775, "naziv": "Britanci pokušavaju da uhapse vođe kolonista", "traka": "dogadjaji"}, {"tekst": "Deklaracija nezavisnosti", "godina": 1776, "naziv": "Deklaracija nezavisnosti", "traka": "dogadjaji"}, {"tekst": "Predaja Britanaca kod Jorktauna", "godina": 1781, "naziv": "Bitka kod Jorktauna", "traka": "dogadjaji"}, {"tekst": "Mir u Parizu", "godina": 1783, "naziv": "Pariski mir", "traka": "dogadjaji"}], "pomoc": ["Povod rata dolazi pre samog rata.", "Deklaracija je godinu dana posle početka rata, a mir na kraju.", "Iz lekcije: 1773, 1774, 1775, 1776, 1781, 1783."], "objasnjenje": "Čajanka (1773) → kongres (1774) → početak rata (1775) → Deklaracija (1776) → Jorktaun (1781) → mir u Parizu (1783).", "iz_udzbenika": {"strana": 43, "odeljak": "Američka revolucija", "tekst": "Lekcija prati put od Bostonske čajanke do mira u Parizu."}, "lekcija": 5}, {"id": "l05-amr-dopuni-deklaracija", "vrsta": "dopuni", "tezina": "lako", "pojmovi": ["deklaracija-nezavisnosti", "filadelfija", "tomas-dzeferson"], "pitanje": "Dopuni rečenicu.", "tekst": "Kongres je u gradu {{Filadelfiji}} 4. jula {{1776}}. izglasao Deklaraciju nezavisnosti, koju je sastavio {{Tomas Džeferson}}.", "ponudjene": ["Filadelfiji", "1776", "Tomas Džeferson", "Bostonu", "1783", "Džordž Vašington"], "pomoc": ["Grad u kome se okupljao Kongres.", "Pisac Deklaracije nije zapovednik vojske.", "Iz lekcije: Filadelfija, 4. jul 1776, Tomas Džeferson."], "objasnjenje": "Deklaraciju je Kongres izglasao u Filadelfiji 4. jula 1776; sastavio ju je Tomas Džeferson.", "iz_udzbenika": {"strana": 43, "odeljak": "Američka revolucija", "tekst": "Kongres je u Filadelfiji 4. jula 1776. izglasao Deklaraciju koju je sastavio Džeferson."}, "lekcija": 5}, {"id": "l05-amr-dopuni-kraj-rata", "vrsta": "dopuni", "tezina": "tesko", "pojmovi": ["jorktaun", "pariski-mir-1783", "francuska"], "pitanje": "Dopuni bez ponuđenih reči.", "tekst": "Uz pomoć ratnih brodova i vojske iz {{Francuske}}, Vašington je primorao Britance na predaju kod {{Jorktauna}} 1781. Mir je sklopljen u {{Parizu}} {{1783}}. godine.", "pomoc": ["Pomoć je stigla od velike suparnice Britanije.", "Mir je potpisan u glavnom gradu te iste zemlje.", "Iz lekcije: francuska pomoć, Jorktaun 1781, mir u Parizu 1783."], "objasnjenje": "Francuska pomoć donela je pobedu kod Jorktauna (1781), a mir u Parizu (1783) priznao je SAD.", "iz_udzbenika": {"strana": 43, "odeljak": "Američka revolucija", "tekst": "Uz francusku pomoć Britanci su se predali kod Jorktauna 1781; mir je sklopljen u Parizu 1783."}, "lekcija": 5}, {"id": "l05-amr-povezi-godine", "vrsta": "povezi", "tezina": "tesko", "pojmovi": ["bostonska-cajanka", "deklaracija-nezavisnosti", "jorktaun", "pariski-mir-1783"], "pitanje": "Poveži godinu sa događajem.", "parovi": [["1773.", "Bostonska čajanka"], ["1774.", "prvi kongres kolonista u Filadelfiji"], ["1776.", "Deklaracija nezavisnosti"], ["1781.", "predaja Britanaca kod Jorktauna"], ["1783.", "mir u Parizu"]], "pomoc": ["Povod je bio pre kongresa.", "Mir je poslednji, dve godine posle odlučujuće predaje.", "Iz lekcije: 1773 čajanka, 1774 kongres, 1776 Deklaracija, 1781 Jorktaun, 1783 mir."], "objasnjenje": "1773 Bostonska čajanka; 1774 prvi kongres; 1776 Deklaracija; 1781 Jorktaun; 1783 mir u Parizu.", "iz_udzbenika": {"strana": 43, "odeljak": "Američka revolucija", "tekst": "Lekcija daje godine ključnih događaja Američke revolucije."}, "lekcija": 5}, {"id": "l05-amr-lanac-cajanka", "vrsta": "lanac", "tezina": "lako", "pojmovi": ["bostonska-cajanka", "kolonisti"], "karike": ["Britanska vlada hoće da u kolonijama rasproda čaj iz Indije", "Kolonisti sprečavaju da se čaj ocarini i istovari", "?"], "praznina": 2, "odgovori": [{"tekst": "U Bostonu prerušeni kolonisti bacaju tovare čaja u more (1773)", "tacan": true}, {"tekst": "Kolonisti kupuju sav čaj po dvostrukoj ceni", "tacan": false, "zasto": "Kolonisti su se bunili protiv čaja i carina, a ne kupovali ga."}, {"tekst": "Kralj prihvata Povelju o pravima", "tacan": false, "zasto": "Povelja o pravima je engleski dokument iz 1689."}], "pomoc": ["Gde se odigrala najveća protestna akcija?", "Šta se desilo sa čajem?", "Iz lekcije: u Bostonu su kolonisti, prerušeni u Indijance, bacili čaj u more."], "objasnjenje": "Protest protiv britanskog čaja vrhunac je dostigao u Bostonu, gde je čaj bačen u more.", "iz_udzbenika": {"strana": 43, "odeljak": "Znatiželja: Bostonska čajanka", "tekst": "U lukama su kolonisti sprečavali carinjenje i istovar čaja; u Bostonu su ga bacili u more."}, "osa": {"naziv": "Bostonska čajanka", "od": 1773, "traka": "dogadjaji"}, "lekcija": 5}, {"id": "l05-amr-lanac-kongres", "vrsta": "lanac", "tezina": "srednje", "pojmovi": ["bostonska-cajanka", "kongres", "filadelfija"], "karike": ["Bostonska čajanka (1773)", "Britanci zatvaraju bostonsku luku i dovode nove trupe", "?"], "praznina": 2, "odgovori": [{"tekst": "Sazvan je prvi kongres predstavnika kolonista u Filadelfiji (1774)", "tacan": true}, {"tekst": "Kolonisti plaćaju naknadu i prekidaju protest", "tacan": false, "zasto": "Kolonisti su mere nazvali „nepodnošljivim” i okupili se na kongresu."}, {"tekst": "Kongres donosi ustav SAD", "tacan": false, "zasto": "Ustav je donet tek 1787."}], "pomoc": ["Kako su kolonisti nazvali britanske mere?", "Te mere su bile povod za okupljanje predstavnika svih kolonija.", "Iz lekcije: „nepodnošljive” mere bile su povod za prvi kongres u Filadelfiji 1774."], "objasnjenje": "Kazne posle čajanke kolonisti su nazvali nepodnošljivim i zato su sazvali prvi kongres u Filadelfiji 1774.", "iz_udzbenika": {"strana": 43, "odeljak": "Znatiželja: Bostonska čajanka", "tekst": "Zatvaranje luke i nove trupe bile su povod za prvi kongres kolonista u Filadelfiji 1774."}, "osa": {"naziv": "Prvi kongres kolonista u Filadelfiji", "od": 1774, "traka": "dogadjaji"}, "lekcija": 5}, {"id": "l05-amr-lanac-mir", "vrsta": "lanac", "tezina": "tesko", "pojmovi": ["francuska", "jorktaun", "pariski-mir-1783", "sjedinjene-americke-drzave"], "karike": ["Francuska ulazi u rat na strani kolonista", "Britanci se predaju kod Jorktauna (1781)", "?", "Velika Britanija priznaje nezavisnost SAD"], "praznina": 2, "odgovori": [{"tekst": "Mešanje Francuske i drugih sila tera Britaniju na mirovne pregovore — mir u Parizu 1783.", "tacan": true}, {"tekst": "Kongres bira Vašingtona za predsednika", "tacan": false, "zasto": "Vašington postaje predsednik tek 1789, posle ustava."}, {"tekst": "Bostonska čajanka", "tacan": false, "zasto": "Čajanka je 1773, na početku sukoba."}], "pomoc": ["Korak 1: Šta posle poraza preostaje Britaniji?", "Korak 2: Gde je sklopljen mir?", "Iz lekcije: uplitanje Francuske i drugih sila nateralo je Britaniju na pregovore; mir u Parizu 1783."], "objasnjenje": "Poraz kod Jorktauna i pritisak evropskih sila doveli su do pregovora i mira u Parizu, kojim je priznata nezavisnost SAD.", "iz_udzbenika": {"strana": 43, "odeljak": "Američka revolucija", "tekst": "Uplitanje Francuske i drugih sila nateralo je Britaniju na pregovore; mirom u Parizu 1783. priznata je nezavisnost SAD."}, "lekcija": 5}, {"id": "l05-amr-zakljuci-vasington", "vrsta": "zakljuci", "tezina": "lako", "pojmovi": ["dzordz-vasington", "kongres"], "pitanje": "Zašto je Kongres poverio komandu baš Džordžu Vašingtonu?", "odgovori": [{"tekst": "Imao je vojno iskustvo — ranije se istakao u britanskoj službi", "tacan": true}, {"tekst": "Bio je sin britanskog kralja", "tacan": false, "zasto": "Vašington je bio kolonista i general, ne kraljev sin."}, {"tekst": "Bio je već predsednik SAD", "tacan": false, "zasto": "Predsednik je postao tek 1789."}, {"tekst": "Napisao je Deklaraciju nezavisnosti", "tacan": false, "zasto": "Deklaraciju je napisao Džeferson."}], "pomoc": ["Korak 1: Šta je potrebno zapovedniku vojske?", "Korak 2: Gde je Vašington ranije služio?", "Iz lekcije: general Vašington se ranije istakao u britanskoj službi."], "objasnjenje": "Vašington je kao general u britanskoj službi stekao iskustvo, pa je bio prirodan izbor za zapovednika.", "iz_udzbenika": {"strana": 43, "odeljak": "Američka revolucija", "tekst": "Kongres je imenovao generala Vašingtona, koji se ranije istakao u britanskoj službi."}, "lekcija": 5}, {"id": "l05-amr-zakljuci-opravdanje", "vrsta": "zakljuci", "tezina": "tesko", "pojmovi": ["deklaracija-nezavisnosti", "tomas-dzeferson"], "pitanje": "Kako je Džeferson u Deklaraciji opravdao pravo kolonista da stvore svoju državu?", "odgovori": [{"tekst": "Britanske vlasti su odbile zahteve svojih podanika, pa podanici imaju pravo da se odvoje", "tacan": true}, {"tekst": "Kolonisti su bili bogatiji od Britanaca", "tacan": false, "zasto": "Deklaracija ne govori o bogatstvu, nego o pravima i odbijenim zahtevima."}, {"tekst": "Tako je odlučio francuski kralj", "tacan": false, "zasto": "Francuska ulazi u rat kasnije; Deklaracija se poziva na prava naroda."}, {"tekst": "Kolonije su bile daleko od Engleske", "tacan": false, "zasto": "Udaljenost nije razlog koji Deklaracija navodi."}], "pomoc": ["Korak 1: Šta su kolonisti tražili od Britanaca pre rata?", "Korak 2: Šta su Britanci uradili sa tim zahtevima?", "Iz lekcije: kolonisti imaju pravo da stvore državu jer su britanske vlasti odbile zahteve podanika."], "objasnjenje": "Vlast koja odbija opravdane zahteve podanika gubi pravo na njihovu poslušnost — zato kolonisti mogu da stvore svoju državu.", "iz_udzbenika": {"strana": 43, "odeljak": "Američka revolucija", "tekst": "Džeferson ističe da kolonisti imaju pravo na svoju državu jer su britanske vlasti odbile njihove zahteve."}, "lekcija": 5}, {"id": "l05-amr-zakljuci-nepodnosljive", "vrsta": "zakljuci", "tezina": "srednje", "pojmovi": ["bostonska-cajanka", "boston"], "pitanje": "Zašto su kolonisti britanske mere posle Bostonske čajanke nazvali „nepodnošljivim”?", "odgovori": [{"tekst": "Zatvaranje luke i dovođenje trupa kažnjavali su ceo grad i njegovu trgovinu", "tacan": true}, {"tekst": "Jer su Britanci ukinuli čaj u celom svetu", "tacan": false, "zasto": "Britanci su, naprotiv, hteli da prodaju čaj."}, {"tekst": "Jer je Britanija priznala nezavisnost Bostona", "tacan": false, "zasto": "Nezavisnost je priznata tek 1783, i to svim kolonijama."}, {"tekst": "Jer su morali da glasaju za vigovce", "tacan": false, "zasto": "Kolonisti nisu imali predstavnike u britanskom parlamentu."}], "pomoc": ["Korak 1: Šta su Britanci uradili sa bostonskom lukom?", "Korak 2: Šta znači luka bez trgovine za grad trgovaca?", "Iz lekcije: luka je zatvorena za trgovinu, a u grad su dovedene nove trupe."], "objasnjenje": "Boston je živeo od trgovine; zatvorena luka i strane trupe bile su kolektivna kazna — zato „nepodnošljive mere”.", "iz_udzbenika": {"strana": 43, "odeljak": "Znatiželja: Bostonska čajanka", "tekst": "Bostonska luka zatvorena je za trgovinu, a u grad su dovedene nove trupe; kolonisti su to nazvali nepodnošljivim."}, "lekcija": 5}, {"id": "l05-amr-izvor-prava", "vrsta": "izvor", "tezina": "lako", "pojmovi": ["deklaracija-nezavisnosti", "neotudjiva-prava"], "izvor": {"autor": "Deklaracija nezavisnosti, 1776.", "naslov": "O pravima ljudi (sažetak odlomka)", "tekst": "Očigledno je da su svi ljudi stvoreni jednaki i da imaju neka prava koja im se ne mogu oduzeti: pravo na život, na slobodu i na težnju ka sreći.", "napomena": "Odlomak je prepričan; udžbenik, str. 44."}, "pitanje": "Koja su neotuđiva prava navedena u ovom odlomku?", "odgovori": [{"tekst": "Život, sloboda i težnja ka sreći", "tacan": true}, {"tekst": "Pravo na krunu, plemićku titulu i zemlju", "tacan": false, "zasto": "Deklaracija govori o pravima svih ljudi, a ne o povlasticama plemstva."}, {"tekst": "Pravo kralja da obustavi zakone", "tacan": false, "zasto": "To je ono što je i engleska Povelja o pravima zabranila kralju."}, {"tekst": "Pravo na robove", "tacan": false, "zasto": "Odlomak ne govori o tome; govori o jednakosti ljudi."}], "pomoc": ["Prava su tri.", "Jedno je da živiš, drugo da budeš slobodan, treće …", "Iz lekcije: neotuđiva prava su život, sloboda i težnja ka sreći."], "objasnjenje": "Deklaracija navodi tri neotuđiva prava: život, slobodu i težnju ka sreći.", "iz_udzbenika": {"strana": 44, "odeljak": "Svedočanstvo: Deklaracija nezavisnosti", "tekst": "Deklaracija navodi da su svi ljudi jednaki i da imaju pravo na život, slobodu i težnju ka sreći."}, "lekcija": 5}, {"id": "l05-amr-izvor-vlade", "vrsta": "izvor", "tezina": "srednje", "pojmovi": ["deklaracija-nezavisnosti", "neotudjiva-prava"], "izvor": {"autor": "Deklaracija nezavisnosti, 1776.", "naslov": "O vladama (sažetak odlomka)", "tekst": "Da bi se ta prava osigurala, ljudi ustanovljavaju vlade. Pravedna moć vlade potiče iz volje onih kojima ona upravlja.", "napomena": "Odlomak je prepričan; udžbenik, str. 44."}, "pitanje": "Odakle, prema Deklaraciji, vlada dobija svoju pravednu moć?", "odgovori": [{"tekst": "Iz volje ljudi kojima upravlja", "tacan": true}, {"tekst": "Od Boga, po božjoj milosti", "tacan": false, "zasto": "Tako su govorili kraljevi poput Stjuarta; Deklaracija vlast izvodi iz volje naroda."}, {"tekst": "Od britanskog parlamenta", "tacan": false, "zasto": "Kolonisti se upravo odvajaju od britanske vlasti."}, {"tekst": "Iz snage vojske", "tacan": false, "zasto": "Deklaracija govori o volji naroda, ne o sili."}], "pomoc": ["Šta je suprotno od „božje milosti”?", "Ko daje vlast vladi?", "Iz lekcije: pravedna moć vlade proističe iz volje onih kojima vlada."], "objasnjenje": "Deklaracija kaže da vlast dolazi od naroda — suprotno ideji o vlasti po božjoj milosti.", "iz_udzbenika": {"strana": 44, "odeljak": "Svedočanstvo: Deklaracija nezavisnosti", "tekst": "Vlade se osnivaju da čuvaju prava, a njihova pravedna moć potiče iz volje onih kojima vladaju."}, "lekcija": 5}, {"id": "l05-amr-izvor-smena", "vrsta": "izvor", "tezina": "tesko", "pojmovi": ["deklaracija-nezavisnosti", "neotudjiva-prava"], "izvor": {"autor": "Deklaracija nezavisnosti, 1776.", "naslov": "O pravu naroda (sažetak odlomka)", "tekst": "Kad god neki oblik vlade počne da šteti ciljevima zbog kojih je osnovan, narod ima pravo da ga promeni ili ukine i da osnuje novu vladu, onako kako smatra da će najbolje obezbediti svoju sigurnost i sreću.", "napomena": "Odlomak je prepričan; udžbenik, str. 44."}, "pitanje": "Pod kojim uslovom, prema Deklaraciji, narod sme da smeni vladu?", "odgovori": [{"tekst": "Kad vlada počne da ugrožava prava zbog kojih je osnovana", "tacan": true}, {"tekst": "Nikada — vladi se mora uvek pokoravati", "tacan": false, "zasto": "Deklaracija izričito daje narodu pravo da promeni ili ukine vladu."}, {"tekst": "Samo kada to dozvoli kralj", "tacan": false, "zasto": "Deklaracija se ne oslanja na kralja; pravo pripada narodu."}, {"tekst": "Svake godine, bez razloga", "tacan": false, "zasto": "Uslov je da vlada šteti pravima naroda."}], "pomoc": ["Zbog čega se, prema odlomku, vlade uopšte osnivaju?", "Šta ako vlada počne da radi suprotno tom cilju?", "Iz lekcije: kad oblik vlade postane štetan po te ciljeve, narod ima pravo da ga promeni ili ukine."], "objasnjenje": "Vlada postoji da čuva prava; ako ih ugrožava, narod može da je promeni ili ukine — tako kolonisti opravdavaju odvajanje od Britanije.", "iz_udzbenika": {"strana": 44, "odeljak": "Svedočanstvo: Deklaracija nezavisnosti", "tekst": "Udžbenik pita ima li narod pravo da smeni vladu i pod kojim uslovima."}, "lekcija": 5}, {"id": "l05-amr-ko-sam-dzeferson", "vrsta": "ko_sam", "tezina": "tesko", "pojmovi": ["tomas-dzeferson", "deklaracija-nezavisnosti", "prosvetitelji"], "tragovi": ["Bio sam jedan od vođa američkih kolonista.", "Ideje sam crpeo od francuskih prosvetitelja.", "Sastavio sam dokument koji je Kongres izglasao 4. jula 1776."], "odgovori": [{"tekst": "Tomas Džeferson", "tacan": true}, {"tekst": "Džordž Vašington", "tacan": false, "zasto": "Vašington je bio glavni zapovednik vojske, a ne pisac Deklaracije."}, {"tekst": "Monteskje", "tacan": false, "zasto": "Monteskje je francuski prosvetitelj, a ne američki kolonista."}, {"tekst": "Oliver Kromvel", "tacan": false, "zasto": "Kromvel je engleski vođa iz XVII veka."}], "objasnjenje": "To je Tomas Džeferson, pisac Deklaracije nezavisnosti.", "iz_udzbenika": {"strana": 43, "odeljak": "Američka revolucija", "tekst": "Deklaraciju je, prema idejama francuskih prosvetitelja, sastavio Tomas Džeferson."}, "lekcija": 5}, {"id": "l05-amr-uporedi-cajanka-jorktaun", "vrsta": "uporedi", "tezina": "lako", "pojmovi": ["bostonska-cajanka", "jorktaun"], "a": "Bostonska čajanka", "b": "Jorktaun", "pitanje": "Na koji događaj se odnosi tvrdnja?", "tvrdnje": [{"tekst": "Dogodio se 1773.", "odgovor": "a", "zasto": "Bostonska čajanka je 1773."}, {"tekst": "Dogodio se 1781.", "odgovor": "b", "zasto": "Predaja kod Jorktauna je 1781."}, {"tekst": "Kolonisti prerušeni u Indijance bacaju čaj u more.", "odgovor": "a", "zasto": "To je Bostonska čajanka."}, {"tekst": "Pomogli su francuski ratni brodovi i vojska.", "odgovor": "b", "zasto": "Kod Jorktauna Vašington pobeđuje uz francusku pomoć."}, {"tekst": "Deo je borbe kolonista protiv britanske vlasti.", "odgovor": "oba", "zasto": "Čajanka je povod, a Jorktaun odlučujuća pobeda iste borbe."}, {"tekst": "Tu je potpisan mir 1783.", "odgovor": "nijedan", "zasto": "Mir je potpisan u Parizu."}], "pomoc": ["Jedan događaj je povod, drugi odlučujuća pobeda.", "Ko je pomagao Vašingtonu na kraju rata?", "Iz lekcije: Bostonska čajanka 1773; Jorktaun 1781 uz francusku pomoć; mir u Parizu 1783."], "objasnjenje": "Čajanka (1773) je povod revolucije, Jorktaun (1781) odlučujuća pobeda; mir je potpisan u Parizu.", "iz_udzbenika": {"strana": 43, "odeljak": "Američka revolucija", "tekst": "Lekcija opisuje Bostonsku čajanku kao povod i predaju kod Jorktauna kao odlučujući događaj."}, "lekcija": 5}, {"id": "l05-amr-uporedi-revolucije", "vrsta": "uporedi", "tezina": "tesko", "pojmovi": ["engleska-revolucija", "americka-revolucija", "republika"], "a": "Engleska u XVII veku (Građanski rat i Slavna revolucija)", "b": "Američka revolucija", "pitanje": "Na koju revoluciju se odnosi tvrdnja?", "tvrdnje": [{"tekst": "Kralj je izveden pred sud i osuđen na smrt.", "odgovor": "a", "zasto": "Čarls I je osuđen posle Građanskog rata; u Americi kralj nije suđen."}, {"tekst": "Nastala je nova, nezavisna država.", "odgovor": "b", "zasto": "Iz kolonija su nastale SAD; Engleska je ostala ista država."}, {"tekst": "Pomogla je strana sila, Francuska.", "odgovor": "b", "zasto": "Francuska je pomagala američke koloniste."}, {"tekst": "Vodila se protiv neograničene vlasti kralja (krune).", "odgovor": "oba", "zasto": "U Engleskoj protiv Stjuarta, u Americi protiv britanske krune i njenih mera."}, {"tekst": "Posle nje je bila uspostavljena republika.", "odgovor": "oba", "zasto": "Engleska je posle Građanskog rata proglašena republikom, a SAD su republika od nastanka."}, {"tekst": "Počela je u Francuskoj.", "odgovor": "nijedan", "zasto": "Jedna je u Engleskoj, druga u Severnoj Americi."}], "pomoc": ["Šta se desilo sa kraljem u Engleskoj, a šta sa kolonijama u Americi?", "U obe se vodi borba protiv vlasti krune.", "Iz lekcije: Engleska — suđenje kralju, republika, pa parlamentarna monarhija; Amerika — nezavisnost uz pomoć Francuske, republika."], "objasnjenje": "Obe revolucije ograničavaju ili odbacuju vlast krune i vode do republike, ali samo američka stvara novu državu i to uz francusku pomoć.", "iz_udzbenika": {"strana": 43, "odeljak": "Američka revolucija", "tekst": "Lekcija opisuje dve revolucije: englesku u XVII i američku u XVIII veku."}, "lekcija": 5}, {"id": "l05-amr-objasni-cajanka", "vrsta": "objasni", "tezina": "srednje", "pojmovi": ["bostonska-cajanka", "kongres", "americka-revolucija"], "pitanje": "Šta je bila Bostonska čajanka i zašto se smatra povodom Američke revolucije?", "uzor": "Britanska vlada je 1773. htela da u kolonijama rasproda čaj iz Indije. Kolonisti su to sprečavali, a u Bostonu su, prerušeni u Indijance, bacili tovare čaja sa britanskih brodova u more. Britanci su zatvorili luku i doveli nove trupe, a te „nepodnošljive” mere bile su povod za prvi kongres kolonista u Filadelfiji 1774, što neki istoričari smatraju početkom revolucije.", "ideje": ["Britanija hoće da proda čaj iz Indije u kolonijama.", "Kolonisti prerušeni u Indijance bacaju čaj u more (1773).", "Britanci zatvaraju luku i dovode trupe („nepodnošljive mere”).", "Povod za prvi kongres u Filadelfiji 1774."], "objasnjenje": "Čajanka je izazvala oštre britanske kazne, a one su ujedinile koloniste na prvom kongresu.", "iz_udzbenika": {"strana": 43, "odeljak": "Znatiželja: Bostonska čajanka", "tekst": "Bostonska čajanka 1773. i britanske kazne bile su povod za prvi kongres kolonista 1774.", "slika": "05-engleska-i-americka-revolucija/06-bostonska-cajanka.jpg"}, "lekcija": 5}, {"id": "l05-amr-objasni-francuska", "vrsta": "objasni", "tezina": "srednje", "pojmovi": ["francuska", "jorktaun", "pariski-mir-1783"], "pitanje": "Zašto je ulazak Francuske u rat bio prekretnica za američke koloniste?", "uzor": "Francuska je želela da nanese što veću štetu Britaniji, pa je pomogla kolonistima ratnim brodovima i redovnom vojskom. Uz tu pomoć Vašington je 1781. primorao Britance na predaju kod Jorktauna. Mešanje Francuske i drugih sila nateralo je Britaniju na mir u Parizu 1783. i priznanje SAD.", "ideje": ["Francuska hoće da naudi Britaniji.", "Pomaže ratnim brodovima i vojskom.", "Pobeda kod Jorktauna 1781.", "Britanija pristaje na mir u Parizu 1783."], "objasnjenje": "Bez francuske flote i vojske kolonisti teško da bi pobedili kod Jorktauna i izborili mir.", "iz_udzbenika": {"strana": 43, "odeljak": "Američka revolucija", "tekst": "Uz francusku pomoć Britanci su se predali kod Jorktauna 1781, a mir u Parizu 1783. priznao je SAD."}, "lekcija": 5}, {"id": "l05-amr-objasni-deklaracija", "vrsta": "objasni", "tezina": "tesko", "pojmovi": ["deklaracija-nezavisnosti", "neotudjiva-prava"], "pitanje": "Prema Deklaraciji nezavisnosti, zašto nastaju vlade i ima li narod pravo da smeni vladu? Šta ti misliš o tome?", "uzor": "Prema Deklaraciji, svi ljudi su jednaki i imaju neotuđiva prava na život, slobodu i težnju ka sreći. Vlade nastaju da bi čuvale ta prava, a moć dobijaju od naroda. Ako vlada počne da ugrožava ta prava, narod ima pravo da je promeni ili ukine i osnuje novu. Mislim da je to pravedno, jer vlast treba da služi ljudima.", "ideje": ["Neotuđiva prava: život, sloboda, težnja ka sreći.", "Vlade nastaju da čuvaju ta prava.", "Moć vlade potiče iz volje naroda.", "Narod može da promeni vladu koja ugrožava ta prava (+ lični stav)."], "objasnjenje": "Deklaracija vlast zasniva na narodu, a ne na božjoj milosti — zato narod može i da je smeni.", "iz_udzbenika": {"strana": 44, "odeljak": "Svedočanstvo: Deklaracija nezavisnosti", "tekst": "Udžbenik pita koja su neotuđiva prava, zašto nastaju vlade i ima li narod pravo da smeni vladu."}, "lekcija": 5}]}, {"naslov": "5. Uređenje Sjedinjenih Američkih Država", "zadaci": [{"id": "l05-sad-izbor-republika", "vrsta": "izbor", "tezina": "lako", "pojmovi": ["republika", "sjedinjene-americke-drzave"], "pitanje": "Kako je bila uređena nova američka država?", "odgovori": [{"tekst": "Kao republika", "tacan": true}, {"tekst": "Kao apsolutistička monarhija", "tacan": false, "zasto": "SAD nisu imale kralja; predsednika su birali građani."}, {"tekst": "Kao parlamentarna monarhija", "tacan": false, "zasto": "To je britansko uređenje; u SAD nema vladara."}, {"tekst": "Kao kolonija Francuske", "tacan": false, "zasto": "SAD su postale nezavisne; Francuska im je samo pomogla u ratu."}], "pomoc": ["Ko je na čelu SAD — kralj ili izabrani predsednik?", "Država bez kralja je …", "Iz lekcije: nova država bila je organizovana kao republika."], "objasnjenje": "SAD su republika: na čelu je predsednik koga biraju građani.", "iz_udzbenika": {"strana": 44, "odeljak": "Uređenje Sjedinjenih Američkih Država", "tekst": "Nova država bila je organizovana kao republika."}, "lekcija": 5}, {"id": "l05-sad-izbor-mandat", "vrsta": "izbor", "tezina": "lako", "pojmovi": ["predsednik"], "pitanje": "Na koliko godina se birao američki predsednik?", "odgovori": [{"tekst": "Na četiri godine", "tacan": true}, {"tekst": "Doživotno", "tacan": false, "zasto": "Doživotno je vladao Kromvel u Engleskoj; u SAD predsednik se bira na četiri godine."}, {"tekst": "Na jednu godinu", "tacan": false, "zasto": "Mandat je četiri godine."}, {"tekst": "Na četrdeset godina", "tacan": false, "zasto": "Mandat je četiri, ne četrdeset godina."}], "pomoc": ["Mandat je kraći od deset godina.", "Izbori su svake … godine.", "Iz lekcije: predsednik je biran na četiri godine."], "objasnjenje": "Izvršnu vlast u SAD ima predsednik biran na četiri godine.", "iz_udzbenika": {"strana": 44, "odeljak": "Uređenje Sjedinjenih Američkih Država", "tekst": "Izvršnu vlast je predstavljao predsednik biran na četiri godine."}, "lekcija": 5}, {"id": "l05-sad-izbor-kongres", "vrsta": "izbor", "tezina": "lako", "pojmovi": ["kongres", "senat", "predstavnicki-dom"], "pitanje": "Od koja dva tela se sastojao američki Kongres?", "odgovori": [{"tekst": "Senata i Predstavničkog doma", "tacan": true}, {"tekst": "Gornjeg doma i Donjeg doma", "tacan": false, "zasto": "To su domovi britanskog parlamenta."}, {"tekst": "Predsednika i Vrhovnog suda", "tacan": false, "zasto": "Predsednik je izvršna, a Vrhovni sud sudska vlast — nisu delovi Kongresa."}, {"tekst": "Vigovaca i torijevaca", "tacan": false, "zasto": "To su britanske stranke, ne tela Kongresa."}], "pomoc": ["Kongres je zakonodavna vlast SAD.", "Jedno telo ima ime koje podseća na stari Rim.", "Iz lekcije: Kongres čine Senat i Predstavnički dom."], "objasnjenje": "Zakonodavnu vlast u SAD ima Kongres sa dva tela — Senatom i Predstavničkim domom.", "iz_udzbenika": {"strana": 44, "odeljak": "Uređenje Sjedinjenih Američkih Država", "tekst": "Zakonodavnu vlast predstavljao je Kongres, sastavljen od Senata i Predstavničkog doma."}, "lekcija": 5}, {"id": "l05-sad-izbor-bez-prava", "vrsta": "izbor", "tezina": "srednje", "pojmovi": ["pravo-glasa", "indijanci", "robovlasnistvo"], "pitanje": "Ko je u SAD krajem XVIII veka bio lišen političkih prava? (više tačnih)", "odgovori": [{"tekst": "Siromašni belci", "tacan": true}, {"tekst": "Žene", "tacan": true}, {"tekst": "Crni robovi", "tacan": true}, {"tekst"
