<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Revolucije i Napoleon — kviz</title>
<style>

 :root{--hub-bg:#faf8f2;--hub-card:#fff;--hub-ink:#2b2b2b;--hub-head:#3a3528;--hub-mute:#6b6456;--hub-line:#e6e0d2;--hub-soft:#f3ecd8;--hub-accent:#b1271f;--hub-ok:#1f7a3a;--hub-nav-w:280px;--hub-drawer-w:440px}
 html:has(.app-body){overflow:hidden}
 .app-body{margin:0;height:100vh;height:100dvh;overflow:hidden;display:flex;flex-direction:column;max-width:100vw;background:var(--hub-bg);color:var(--hub-ink);font-family:system-ui,Segoe UI,Roboto,Arial,sans-serif}
 .app-bar{flex:0 0 auto;display:flex;align-items:center;gap:14px;padding:8px 16px;background:var(--hub-card);border-bottom:1px solid var(--hub-line);min-width:0;position:relative;z-index:50}
 .app-bar .app-menu{display:none;padding:0;width:36px;height:34px;font-size:18px;line-height:1;border:1px solid var(--hub-line);background:var(--hub-card);color:var(--hub-head);border-radius:7px;cursor:pointer}
 .app-bar .app-menu:hover{background:var(--hub-soft);color:var(--hub-head)}
 .brand{font-weight:700;font-size:15px;color:var(--hub-head);text-decoration:none;white-space:nowrap}
 .brand:hover{color:var(--hub-accent)}
 .app-crumbs{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--hub-mute);min-width:0;overflow:hidden;white-space:nowrap}
 .app-crumbs a{color:var(--hub-mute);text-decoration:none}
 .app-crumbs a:hover{color:var(--hub-accent)}
 .app-crumbs .sep{color:#b9b2a0}
 .app-crumbs .cur{color:var(--hub-head);font-weight:600;overflow:hidden;text-overflow:ellipsis}
 .bar-right{margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end;min-width:0}
 .app-grid{flex:1 1 auto;display:grid;grid-template-columns:var(--hub-nav-w) minmax(0,1fr);min-height:0}
 .app-nav{background:var(--hub-card);border-right:1px solid var(--hub-line);overflow:auto;padding:10px 10px 40px;min-height:0}
 .app-filter{width:100%;font:inherit;font-size:13px;padding:7px 9px;border:1px solid var(--hub-line);border-radius:6px;margin:0 0 4px;background:#fff;color:var(--hub-ink)}
 .app-filter:focus{outline:none;border-color:var(--hub-mute)}
 .app-nav .sec{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--hub-mute);padding:12px 6px 4px}
 .app-nav .cnt{font-size:11px;color:var(--hub-mute);font-variant-numeric:tabular-nums;letter-spacing:0;text-transform:none}
 .f-hide{display:none!important}
 .app-main{position:relative;overflow:auto;min-width:0;min-height:0;transition:margin-right .18s ease}
 .app-drawer{position:fixed;top:var(--htop,50px);right:0;bottom:0;width:var(--hub-drawer-w);max-width:100vw;background:var(--hub-card);border-left:1px solid var(--hub-line);box-shadow:-8px 0 24px rgba(58,53,40,.10);transform:translateX(105%);transition:transform .18s ease;z-index:60;display:flex;flex-direction:column}
 .app-drawer.open{transform:none}
 .drawer-head{display:flex;align-items:flex-start;gap:10px;padding:14px 16px 10px;border-bottom:1px solid var(--hub-line)}
 .drawer-head h2{margin:0;font-size:16px;color:var(--hub-head);flex:1 1 auto;overflow-wrap:anywhere}
 .app-drawer .drawer-close{border:0;background:none;padding:0 4px;font-size:24px;line-height:1;cursor:pointer;color:var(--hub-mute)}
 .app-drawer .drawer-close:hover{background:none;color:var(--hub-accent)}
 .drawer-body{flex:1 1 auto;overflow:auto;padding:12px 16px 24px;font-size:13px;line-height:1.55}
 .drawer-foot{flex:0 0 auto;border-top:1px solid var(--hub-line);padding:10px 16px;font-size:12px;color:var(--hub-mute)}
 .mtabs{display:flex;gap:2px;border-bottom:1px solid var(--hub-line);flex-wrap:wrap;background:var(--hub-card);padding:0 12px}
 .mtabs a{text-decoration:none;color:var(--hub-mute);font-size:13px;padding:9px 12px 8px;border-bottom:2px solid transparent}
 .mtabs a[aria-current="page"]{color:var(--hub-head);border-bottom-color:var(--hub-accent);font-weight:600}
 .bar-menu-wrap{position:relative}
 .bar-menu{display:none;position:absolute;right:0;top:calc(100% + 8px);z-index:70;background:var(--hub-card);border:1px solid var(--hub-line);border-radius:10px;box-shadow:0 6px 20px rgba(0,0,0,.16);padding:8px;min-width:240px}
 .bar-menu.open{display:flex;flex-direction:column;align-items:stretch;gap:6px}
 .tbl{width:100%;border-collapse:collapse;background:var(--hub-card);border:1px solid var(--hub-line);border-radius:6px;font-size:13px}
 .tbl th{text-align:left;font-weight:600;font-size:11.5px;color:var(--hub-mute);padding:8px 10px;border-bottom:1px solid var(--hub-line);background:#fcfaf4;white-space:nowrap}
 .tbl td{padding:7px 10px;border-bottom:1px solid #f0ebe0;vertical-align:top}
 .tbl td.num,.tbl th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
 .tbl tr.clk{cursor:pointer} .tbl tr.clk:hover td{background:#fbf7ec}
 @media (min-width:1200px){ .app-body:has(.app-drawer.open) .app-main{margin-right:var(--hub-drawer-w)} }
 @media (max-width:760px){
   .app-bar{gap:10px;padding:8px 12px}
   .app-bar .app-menu{display:inline-block}
   .app-crumbs{display:none}
   .app-grid{grid-template-columns:minmax(0,1fr)}
   .app-nav{position:fixed;top:var(--htop,50px);left:0;bottom:0;width:300px;max-width:88vw;z-index:55;transform:translateX(-105%);transition:transform .18s ease;box-shadow:8px 0 24px rgba(58,53,40,.10)}
   .app-nav.open{transform:none}
   .app-drawer{width:100vw}
 }
 @media print{
   html:has(.app-body){overflow:visible}
   .app-body{height:auto;overflow:visible;display:block}
   .app-grid{display:block}
   .app-main,.app-nav{overflow:visible}
   .app-drawer,.app-filter,.app-menu,.bar-menu-wrap,.mtabs{display:none!important}
 }

 .les{max-width:860px;padding:22px 28px 80px;line-height:1.6;color:#2b2b2b}
 .les h1{font-size:25px;margin:0 0 4px;color:#3a3528}
 .les .meta{color:#6b6456;font-size:13.5px;margin:0 0 6px}
 .les .meta a{color:#b1271f;text-decoration:none}
 .les section{margin:22px 0;scroll-margin-top:12px}
 .les h2{font-size:18px;color:#3a3528;margin:0 0 8px;padding-bottom:5px;border-bottom:1px solid #e6e0d2}
 .les h3{font-size:15.5px;color:#3a3528;margin:0 0 6px}
 .les section.l3{margin-left:14px;padding-left:12px;border-left:3px solid #f3ecd8}
 .les .str{font-size:12px;font-weight:400;color:#6b6456;margin-left:6px;white-space:nowrap}
 .les ul,.les ol{padding-left:22px;margin:6px 0} .les li{margin:3px 0}
 .les p{margin:6px 0}
 .les a{color:#b1271f}
 .les .pojam{border-bottom:1px dotted #b9b2a0}
 .les blockquote{margin:8px 0;padding:6px 14px;border-left:3px solid #c98a2c;background:#fefcf7}
 .les .tbl{overflow-x:auto} .les table{border-collapse:collapse;font-size:14px;margin:8px 0}
 .les th,.les td{border:1px solid #e6e0d2;padding:4px 8px;text-align:left;vertical-align:top} .les th{background:#f3ecd8}
 .strana{margin:26px 0 14px;scroll-margin-top:12px;background:#fff;border:1px solid #e6e0d2;border-radius:10px;overflow:hidden}
 .strana .pg{display:flex;justify-content:space-between;align-items:center;padding:7px 12px;font-size:12.5px;color:#6b6456;background:#fbf7ec;border-bottom:1px solid #e6e0d2}
 .strana .pg b{color:#3a3528}
 .strana .pg button{font:inherit;font-size:12px;border:1px solid #e6e0d2;background:#fff;border-radius:6px;padding:2px 9px;cursor:pointer;color:#3a3528}
 .strana img{display:block;width:100%;height:auto;cursor:zoom-in}
 .strana.zoom{overflow-x:auto} .strana.zoom img{width:auto;max-width:none;cursor:zoom-out}
 .strana.nema{padding:12px;color:#9b9387;font-size:13.5px;background:#fefcf7}
 .notes-lbl{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:#1f7a3a;margin:0 0 -12px}
 .gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin-top:8px}
 .gal figure{margin:0;background:#fff;border:1px solid #e6e0d2;border-radius:8px;overflow:hidden;scroll-margin-top:12px}
 .gal img{display:block;width:100%;height:auto} .gal figcaption{font-size:12.5px;color:#6b6456;padding:6px 9px}
 .hit{animation:hit 2.4s ease-out} @keyframes hit{0%{box-shadow:0 0 0 4px rgba(201,138,44,.55)}100%{box-shadow:0 0 0 4px rgba(201,138,44,0)}}

 :root{--ink:#2b2b2b;--muted:#6b6456;--edge:#b1271f;--accent:#1f7a3a;--border:#e6e0d2;--soft:#fefcf7;--warn:#c98a2c;
       --sea:#cfe6f2;--land:#efeae0;--land-se:#f3ecd8;--bord:#8a8170}
 *{box-sizing:border-box}
 button{font:inherit;padding:7px 14px;border:1px solid var(--edge);background:#fff;color:var(--edge);border-radius:8px;cursor:pointer}
 button:hover{background:var(--edge);color:#fff}
 button.ok{border-color:var(--accent);color:var(--accent)} button.ok:hover{background:var(--accent);color:#fff}
 button:disabled{opacity:.45;cursor:default;background:#fff;color:inherit}
 .opt:disabled,.tn button:disabled,.mcell:disabled,.blank:disabled{opacity:1;cursor:default}
 .opt:disabled:not(.right):not(.wrong){opacity:.6}
 .bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-size:14px}
 .bar-menu-btn{padding:5px 12px;font-size:16px;line-height:1;border-color:var(--muted);color:#3a3528}
 .bar-menu-btn:hover{background:#f3ecd8;color:#3a3528}
 .bar-menu button{width:100%;text-align:left}
 .bar-menu .menu-link{display:block;font-size:13px;color:var(--edge);text-decoration:none;padding:7px 14px;border:1px dashed #e6b0b0;border-radius:8px}
 .stat{background:#f3ecd8;border:1px solid #e1d8c2;border-radius:8px;padding:4px 10px;white-space:nowrap}
 .stat b{font-size:15px;color:var(--accent)}
 .intro p{font-size:14px;color:#4a4434;line-height:1.6;margin:0 0 10px}
 .intro ul{margin:0 0 10px;padding-left:18px;font-size:13.5px;line-height:1.55}
 /* navigation: items */
 .it-row{display:flex;align-items:center;gap:8px;width:100%;border:0;border-radius:5px;background:none;color:var(--ink);font:inherit;font-size:13px;text-align:left;padding:5px 6px;cursor:pointer}
 a.it-row{text-decoration:none;box-sizing:border-box}
 .it-row:hover{background:#f6f1e4;color:var(--ink)}
 .it-row.sel{background:#efe7d2;font-weight:600}
 .it-row.off{opacity:.4}
 .it-row .st{flex:0 0 16px;text-align:center;color:#b9b2a0}
 .it-row.ok .st{color:var(--accent)} .it-row.rev .st,.it-row.fail .st{color:var(--edge)} .it-row.part .st{color:var(--warn)}
 .it-row .lbl{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
 .it-row .pt{flex:0 0 auto;font-size:11px;color:var(--muted);font-weight:400;font-variant-numeric:tabular-nums}
 .tz{flex:0 0 auto;display:inline-block;min-width:1.5em;text-align:center;font-size:10px;font-weight:700;border-radius:8px;padding:1px 5px;letter-spacing:.02em}
 .tz-lako{background:#e3f2e8;color:#1f6b3a} .tz-srednje{background:#fbefd5;color:#8a5a14} .tz-tesko{background:#f8dcd8;color:#8a2a22}
 .tz-legend{display:flex;gap:8px;flex-wrap:wrap;font-size:11px;color:var(--muted);padding:2px 6px 0}
 /* main: item */
 .item{padding:20px 24px 40px;max-width:1100px}
 .ihead{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-bottom:8px}
 .vchip{font-size:11px;text-transform:uppercase;letter-spacing:.05em;border:1px solid var(--border);border-radius:9px;padding:1px 8px;background:#fff}
 .item h2.q{font-size:18px;line-height:1.4;color:#3a3528;margin:0 0 14px}
 .opts{display:flex;flex-direction:column;gap:8px;max-width:640px}
 .opt{display:flex;gap:10px;align-items:flex-start;text-align:left;border:1px solid var(--border);background:#fff;color:var(--ink);border-radius:8px;padding:10px 12px;font-size:14.5px;line-height:1.4}
 .opt:hover{background:#fbf7ec;color:var(--ink)}
 .opt.picked{border-color:#3a3528;background:#f6f1e4}
 .opt.wrong{border-color:#e6b0b0;background:#fdecec;color:#8a2a22} .opt.wrong .ot{text-decoration:line-through}
 .opt.right{border-color:#9fd5b6;background:#e8f5ec;color:#13602c;font-weight:600}
 .opt .box{flex:0 0 18px;height:18px;border:1.5px solid #6b6456;border-radius:4px;margin-top:1px}
 .opt.picked .box{background:#3a3528;box-shadow:inset 0 0 0 3px #fff}
 .opt.round .box{border-radius:50%}
 .tn{display:flex;gap:12px;margin:4px 0 14px}
 .tn button{min-width:8em;padding:10px 18px;font-size:15px}
 .tn button.right{background:var(--accent);border-color:var(--accent);color:#fff}
 .tn button.wrong{background:#fdecec;border-color:#e6b0b0;color:#8a2a22}
 .stmt{font-size:16px;line-height:1.5;border-left:3px solid #e1d8c2;padding:6px 12px;margin:0 0 14px;background:#fff}
 .sub-q{font-weight:600;color:#3a3528;margin:16px 0 8px}
 .cloze{font-size:16px;line-height:2.3;max-width:720px}
 .blank{display:inline-block;min-width:5.5em;border:0;border-bottom:2px solid #6b6456;background:#fff;text-align:center;font:inherit;font-weight:600;color:#3a3528;padding:0 6px;margin:0 3px;border-radius:4px 4px 0 0;cursor:pointer}
 input.blank{cursor:text;width:7em}
 .blank:hover{background:#fbf7ec;color:#3a3528}
 .blank.cur{border-bottom-color:var(--edge);background:#fff7f3}
 .blank.lock{border-bottom-color:var(--accent);background:#e8f5ec;color:#13602c;cursor:default}
 .blank.bad{border-bottom-color:var(--edge);background:#fdecec;color:#8a2a22}
 .blank.rev{border-bottom-color:var(--warn);background:#fdf3e2;color:#8a5a14}
 .bank{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 0}
 .bank button{padding:5px 12px;border-color:#6b6456;color:#3a3528;border-radius:16px}
 .bank button:hover{background:#f3ecd8;color:#3a3528}
 .bank button.used{opacity:.3;pointer-events:none}
 .match{display:grid;grid-template-columns:1fr 1fr;gap:10px 28px;max-width:720px}
 .match .col{display:flex;flex-direction:column;gap:8px}
 .mcell{text-align:left;border:1px solid var(--border);background:#fff;color:var(--ink);border-radius:8px;padding:9px 12px;font-size:14px}
 .mcell:hover{background:#fbf7ec;color:var(--ink)}
 .mcell.cur{border-color:#3a3528;box-shadow:0 0 0 2px rgba(58,53,40,.15)}
 .mcell.done{border-color:#9fd5b6;background:#e8f5ec;color:#13602c;cursor:default}
 .mcell.rev{border-color:#ecc98a;background:#fdf3e2;color:#8a5a14;cursor:default}
 .mcell.bad{animation:shake .3s;border-color:#e6b0b0;background:#fdecec}
 .mcell .n{display:inline-block;min-width:1.4em;font-weight:700;margin-right:6px;color:var(--muted)}
 @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
 .iactions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:18px}
 .fb{font-size:14px;font-weight:600;min-height:1.4em}
 .fb.ok{color:var(--accent)} .fb.bad{color:var(--edge)} .fb.info{color:var(--muted);font-weight:400}
 .expl{margin-top:14px;padding:10px 14px;border-radius:8px;background:#e8f5ec;border:1px solid #bfe0c8;color:#13602c;font-size:14px;line-height:1.5;max-width:720px}
 .expl.rev{background:#fdf3e2;border-color:#f0d878;color:#6b4a10}
 .help-inline{display:none}
 /* map */
 .mapwrap{position:relative;margin-top:6px;border:1px solid var(--border);border-radius:8px;overflow:hidden;background:var(--sea);aspect-ratio:1/1;max-height:70vh;touch-action:none}
 .mapwrap svg{width:100%;height:100%;display:block;cursor:crosshair}
 .mapwrap svg.drag{cursor:grabbing}
 .mapwrap .c{fill:var(--land);stroke:var(--bord);stroke-width:.6;vector-effect:non-scaling-stroke}
 .mapwrap .c.se{fill:var(--land-se)}
 .mapwrap .c.se:hover{fill:#e9dcb8}
 .mapwrap .c.hit{fill:#bfe0c8} .mapwrap .c.miss{fill:#f3c9c4} .mapwrap .c.revc{fill:#f6dca6}
 .mapwrap .mk{pointer-events:none}
 .mapwrap .mk circle{stroke:#fff;vector-effect:non-scaling-stroke}
 .mapwrap .mk text{font-size:13px;font-weight:700;paint-order:stroke;stroke:#fff;stroke-width:3px;vector-effect:non-scaling-stroke}
 .zbar{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px}
 .zbar button{width:36px;height:36px;padding:0;font-size:18px;font-weight:700;background:#fff;border-color:#6b6456;color:#3a3528;box-shadow:0 1px 3px rgba(0,0,0,.2)}
 .zbar button:hover{background:#f3ecd8;color:#3a3528}
 .zhint{position:absolute;left:10px;bottom:8px;font-size:11.5px;color:var(--muted);background:rgba(255,255,255,.85);border-radius:6px;padding:3px 8px;pointer-events:none}
 .clues{list-style:none;margin:0 0 6px;padding:0;max-width:720px}
 .clues li{padding:7px 10px;margin:0 0 6px;border-left:3px solid #e1d8c2;background:#fff;font-size:14.5px;line-height:1.45}
 .clues li:last-child{border-left-color:var(--edge)}
 .clues .k{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-right:6px}
 /* drawer content */
 .hl h3{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:14px 0 6px}
 .hl ol{margin:0;padding-left:20px} .hl li{margin:0 0 10px;line-height:1.5}
 .hl li.new{animation:flash 1.2s}
 @keyframes flash{0%{background:#fff3c4}100%{background:transparent}}
 .hl .placeholder{color:#9b9387;font-style:italic}
 .hl .chips{display:flex;flex-wrap:wrap;gap:6px}
 .hl .pchip{font-size:12px;border:1px solid var(--border);border-radius:10px;padding:1px 9px;background:#fefcf7}
 .hl a{color:var(--edge);text-decoration:none}
 .hl ul{margin:0;padding-left:18px} .hl ul li{margin:3px 0}
 .hl .ref{font-size:12px;color:var(--muted);margin:0 0 6px}
 .hl figure{margin:6px 0 10px} .hl figure img{display:block;max-width:100%;border-radius:6px;border:1px solid var(--border)}
 .qfig{margin:16px 0 0;max-width:720px} .qfig img{display:block;max-width:100%;max-height:62vh;border-radius:8px;border:1px solid var(--border);cursor:zoom-in}
 .qfig.zoom{max-width:none;overflow-x:auto} .qfig.zoom img{max-width:none;max-height:none;cursor:zoom-out}
 .qfig figcaption{font-size:12.5px;color:var(--muted);margin-top:5px}
 .hl figcaption{font-size:11.5px;color:var(--muted);margin-top:4px}
 .hl .book{border-left:3px solid #e1d8c2;padding:2px 0 2px 12px;margin:6px 0 4px}
 .hl .odeljak{margin:10px 0 4px;padding:8px 12px;background:#fefcf7;border:1px solid #e6e0d2;border-radius:8px;font-size:14px;line-height:1.5}
 .hl .odeljak summary{cursor:pointer;font-weight:600;color:#3a3528;font-size:13px}
 .hl .odeljak ul,.hl .odeljak ol{padding-left:20px;margin:6px 0} .hl .odeljak li{margin:3px 0} .hl .odeljak p{margin:6px 0}
 .hl .odeljak table{border-collapse:collapse;font-size:13px} .hl .odeljak th,.hl .odeljak td{border:1px solid #e6e0d2;padding:3px 6px}
 .hl .tekst-links{display:flex;flex-wrap:wrap;gap:6px 14px;margin:8px 0 4px;font-size:13.5px}
 .hl .tekst-links a{color:var(--edge);font-weight:600;text-decoration:none}
 /* the lesson (protected copy): main column via the nav, or one part of it in the wide drawer */
 .app-drawer.wide{width:min(820px,100vw)}
 .app-drawer .les{padding:0;max-width:none}
 .app-drawer .les section,.app-drawer .les .strana{margin:0 0 16px}
 .lekbar{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}
 .lekbar button{font-size:13px;padding:6px 12px}
 /* summary */
 .sum{padding:22px 26px 40px;max-width:860px}
 .sum h1{font-size:22px;margin:0 0 6px;color:#3a3528}
 .sum .big{font-size:30px;font-weight:700;color:var(--accent)}
 .sum .tbl{margin:14px 0}
 .sum .sub{color:var(--muted);margin:0 0 6px} .sum .lead{color:var(--muted);max-width:640px;line-height:1.5}
 .rv{border:1px solid var(--border);border-radius:8px;background:#fff;padding:10px 14px;margin:12px 0}
 .rv .rq{margin:4px 0 8px;font-weight:600;color:#3a3528} .rv .rl{margin:0;font-size:12px;color:var(--muted)}

 /* vremenska osa */

 .osa .ev.vague{background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.55) 0 4px,transparent 4px 8px)}   /* dated by the book only as part of a century */
 .osa .ticks{position:relative;height:22px;margin-left:110px;border-top:2px solid #3a3528}

 /* moje znanje */

 .zn-due{color:var(--edge);font-weight:600}

<script>
(function () {
  const root = document.documentElement;
  const bar = document.querySelector('.app-bar');
  function setTop() { if (bar) root.style.setProperty('--htop', bar.offsetHeight + 'px'); }
  window.addEventListener('resize', setTop);
  setTop();

  // ☰ navigation (only shown at ≤760px)
  const nav = document.getElementById('app-nav');
  const navBtn = document.getElementById('app-menu');
  const navOverlay = () => window.matchMedia && window.matchMedia('(max-width:760px)').matches;
  function setNav(open) {
    if (!nav) return;
    nav.classList.toggle('open', !!open);
    if (navBtn) navBtn.setAttribute('aria-expanded', String(!!open));
  }
  if (navBtn) navBtn.addEventListener('click', e => { e.stopPropagation(); setNav(!nav.classList.contains('open')); });

  // navigation filter: case- and diacritic-insensitive (š, č, ć, ž, đ)
  const filter = document.getElementById('app-filter');
  const norm = s => String(s || '').toLowerCase().replace(/đ/g, 'd').normalize('NFD').replace(/[̀-ͯ]/g, '');
  function applyFilter() {
    const q = norm(filter.value.trim());
    document.querySelectorAll('#app-nav [data-filter]').forEach(el =>
      el.classList.toggle('f-hide', !!q && !norm(el.dataset.filter).includes(q)));
    document.querySelectorAll('#app-nav [data-filter-group]').forEach(g =>
      g.classList.toggle('f-hide', !!q && !g.querySelector('[data-filter]:not(.f-hide)')));
  }
  if (filter) filter.addEventListener('input', applyFilter);

  // ⋯ menus: a button with data-menu="<id>" toggles .bar-menu#<id>; a button inside closes it
  function setMenu(m, open) {
    m.classList.toggle('open', !!open);
    const b = document.querySelector('[data-menu="' + m.id + '"]');
    if (b) b.setAttribute('aria-expanded', String(!!open));
  }
  document.querySelectorAll('[data-menu]').forEach(btn => {
    const m = document.getElementById(btn.dataset.menu);
    if (!m) return;
    btn.addEventListener('click', e => { e.stopPropagation(); setMenu(m, !m.classList.contains('open')); });
    m.addEventListener('click', e => { e.stopPropagation(); if (e.target.closest('button')) setMenu(m, false); });
  });
  document.addEventListener('click', e => {
    // composedPath: the clicked node may already be re-rendered away (e.g. a step's "next" button)
    if (!e.composedPath().some(n => n.dataset && n.dataset.keepMenus)) document.querySelectorAll('.bar-menu.open').forEach(m => setMenu(m, false));
    if (nav && nav.classList.contains('open') && navOverlay() && !nav.contains(e.target)) setNav(false);
  });
  document.addEventListener('keydown', e => {
    if (e.key !== 'Escape') return;
    document.querySelectorAll('.bar-menu.open').forEach(m => setMenu(m, false));
    const x = document.querySelector('.app-drawer.open .drawer-close');
    if (x && x.offsetParent !== null) x.click();
  });

  window.HubShell = { setNav, setMenu, applyFilter, navOverlay };
})();
</script>

eđenje)."], "objasnjenje": "Revolucija je nagli i koreniti preobražaj; najčešće se misli na političke promene, kao što je promena državnog uređenja.", "iz_udzbenika": {"strana": 40, "odeljak": "Uvod", "tekst": "Revoluciju obično vezujemo za političke promene, npr. u državnom uređenju, ali može se desiti u svakoj oblasti života."}, "lekcija": 5}, {"id": "l05-uvod-tn-samo-politika", "vrsta": "tacno_netacno", "tezina": "lako", "pojmovi": ["revolucija"], "tvrdnja": "Revolucija može biti samo promena državnog uređenja.", "tacno": false, "ispravke": [{"tekst": "Revolucija se može desiti u bilo kojoj oblasti života, npr. i u proizvodnji.", "tacan": true}, {"tekst": "Revolucija je samo promena vere u nekoj zemlji.", "tacan": false, "zasto": "Ni to nije jedina vrsta — revolucija može biti politička, privredna ili neka druga."}, {"tekst": "Revolucija je samo smena kralja istom porodicom.", "tacan": false, "zasto": "Smena po naslednom pravu nije koreniti preobražaj."}], "pomoc": ["Seti se naslova prethodne lekcije o mašinama i fabrikama.", "I ona se zove revolucija, a nije politička.", "Iz lekcije: revolucije se mogu desiti u svakoj oblasti života."], "objasnjenje": "Netačno — najčešće govorimo o političkim revolucijama, ali postoji i, na primer, industrijska revolucija u proizvodnji.", "iz_udzbenika": {"strana": 40, "odeljak": "Uvod", "tekst": "Revoluciju najčešće vezujemo za političke promene, ali ona se može desiti u svakoj oblasti života."}, "lekcija": 5}, {"id": "l05-uvod-zakljuci-industrijska", "vrsta": "zakljuci", "tezina": "srednje", "pojmovi": ["revolucija"], "pitanje": "Zašto se i velike promene u proizvodnji krajem XVIII veka nazivaju revolucijom?", "odgovori": [{"tekst": "Jer su naglo i iz korena promenile način proizvodnje i život ljudi", "tacan": true}, {"tekst": "Jer su radnici zbacili kralja i proglasili republiku", "tacan": false, "zasto": "To bi bila politička promena; industrijska revolucija je promena u proizvodnji (mašine, fabrike)."}, {"tekst": "Jer su se odigrale tokom Građanskog rata u Engleskoj", "tacan": false, "zasto": "Građanski rat je 1642–1649, a industrijska revolucija počinje u drugoj polovini XVIII veka."}, {"tekst": "Jer su trajale nekoliko vekova bez većih promena", "tacan": false, "zasto": "Revolucija je nagla, a ne spora promena."}], "pomoc": ["Korak 1: Šta znači reč revolucija?", "Korak 2: Da li su mašine i fabrike promenile proizvodnju naglo i duboko?", "Iz lekcije: revolucija je nagli i koreniti preobražaj u bilo kojoj oblasti."], "objasnjenje": "Mašine su zamenile ljudsku ruku, nastale su fabrike i novi društveni slojevi — nagli i koreniti preobražaj, dakle revolucija, ali u privredi.", "iz_udzbenika": {"strana": 40, "odeljak": "Uvod", "tekst": "Udžbenik traži da se podsetiš kakve je promene donela Prva industrijska revolucija."}, "lekcija": 5}, {"id": "l05-uvod-izbor-slike-parlament", "vrsta": "izbor", "slika_u_pitanju": true, "tezina": "lako", "pojmovi": ["parlament", "engleska"], "pitanje": "Šta prikazuju dve slike na početku lekcije?", "odgovori": [{"tekst": "Engleski parlament u XIII i u XVII veku", "tacan": true}, {"tekst": "Američki Kongres 1776. i 1787.", "tacan": false, "zasto": "Slike su mnogo starije — prikazuju engleski parlament u srednjem veku i u XVII veku."}, {"tekst": "Krunisanje dva engleska kralja", "tacan": false, "zasto": "Prikazana su zasedanja skupa predstavnika, a ne krunisanja."}, {"tekst": "Francuske prosvetitelje na skupu", "tacan": false, "zasto": "Prosvetitelji su iz XVIII veka; slike prikazuju englesku skupštinu."}], "pomoc": ["Pogledaj: mnogo ljudi sedi oko kralja i u klupama.", "To je skup koji je savetovao engleskog kralja.", "Iz lekcije: predstava engleskog parlamenta u XIII veku (levo) i XVII veku (desno)."], "objasnjenje": "Leva slika prikazuje engleski parlament u XIII veku, desna u XVII veku.", "iz_udzbenika": {"strana": 40, "odeljak": "Uvod", "tekst": "Na dve slike prikazan je engleski parlament u XIII i u XVII veku.", "slika": "05-engleska-i-americka-revolucija/01-engleski-parlament-xiii-i-xvii-vek.jpg"}, "lekcija": 5}, {"id": "l05-uvod-zakljuci-slike-poredjenje", "vrsta": "zakljuci", "slika_u_pitanju": true, "tezina": "tesko", "pojmovi": ["parlament", "engleska"], "pitanje": "Uporedi dve slike engleskog parlamenta. Šta se najviše promenilo od XIII do XVII veka?", "odgovori": [{"tekst": "U XVII veku parlament ima mnogo više članova — dvorana je puna klupa sa poslanicima", "tacan": true}, {"tekst": "U XVII veku parlament više ne postoji, a kralj sedi sam", "tacan": false, "zasto": "Na desnoj slici dvorana je puna ljudi — parlament postoji i veći je."}, {"tekst": "U XIII veku parlament je bio veći nego u XVII veku", "tacan": false, "zasto": "Na levoj slici je mali broj ljudi oko kralja; na desnoj stotine poslanika."}, {"tekst": "Na obe slike nema kralja ni prestola", "tacan": false, "zasto": "Na obe slike vidi se presto na čelu skupa."}], "pomoc": ["Korak 1: Prebroj otprilike ljude na levoj slici.", "Korak 2: Uporedi sa redovima klupa na desnoj.", "Iz lekcije: levo je parlament u XIII veku, desno u XVII veku."], "objasnjenje": "Parlament je rastao — u XVII veku zasedaju stotine poslanika, što pokazuje koliko je postao važan; baš u tom veku izbija sukob kralja i parlamenta.", "iz_udzbenika": {"strana": 40, "odeljak": "Uvod", "tekst": "Udžbenik upoređuje predstave engleskog parlamenta iz XIII i XVII veka.", "slika": "05-engleska-i-americka-revolucija/01-engleski-parlament-xiii-i-xvii-vek.jpg"}, "lekcija": 5}, {"id": "l05-uvod-uporedi-revolucije", "vrsta": "uporedi", "tezina": "srednje", "pojmovi": ["revolucija", "engleska-revolucija"], "a": "Revolucija u politici (Engleska u XVII veku)", "b": "Industrijska revolucija", "pitanje": "Na koju revoluciju se odnosi tvrdnja — prvu, drugu, obe ili nijednu?", "tvrdnje": [{"tekst": "Menja se državno uređenje — ko i kako vlada.", "odgovor": "a", "zasto": "To je politička revolucija, npr. kad Engleska postaje republika."}, {"tekst": "Mašine zamenjuju rad ljudske ruke.", "odgovor": "b", "zasto": "To je promena u proizvodnji — industrijska revolucija."}, {"tekst": "To je nagli i koreniti preobražaj.", "odgovor": "oba", "zasto": "Svaka revolucija je nagli i koreniti preobražaj, ma u kojoj oblasti."}, {"tekst": "Odigrala se u Engleskoj (Velikoj Britaniji).", "odgovor": "oba", "zasto": "Građanski rat i Slavna revolucija su u Engleskoj, a industrijska revolucija počinje u Velikoj Britaniji."}, {"tekst": "Počela je u Rusiji.", "odgovor": "nijedan", "zasto": "Nijedna nije počela u Rusiji."}], "pomoc": ["Pitaj se: menja li se vlast ili proizvodnja?", "Zajedničko im je ono što svaku promenu čini revolucijom.", "Iz lekcije: revolucija je nagli i koreniti preobražaj — u politici ili bilo kojoj oblasti."], "objasnjenje": "Politička revolucija menja vlast, industrijska proizvodnju; obe su nagle i korenite i obe se vezuju za Englesku.", "iz_udzbenika": {"strana": 40, "odeljak": "Uvod", "tekst": "Revolucija može biti politička, ali i u bilo kojoj drugoj oblasti, kao Prva industrijska revolucija."}, "lekcija": 5}, {"id": "l05-uvod-objasni-revolucija", "vrsta": "objasni", "tezina": "srednje", "pojmovi": ["revolucija"], "pitanje": "Šta je revolucija? Navedi primer političke i primer nepolitičke revolucije.", "uzor": "Revolucija je nagli i koreniti preobražaj. Najčešće se misli na političke promene, kao kad je Engleska u XVII veku postala republika. Ali revolucija može biti i u privredi — Prva industrijska revolucija promenila je proizvodnju jer su mašine zamenile ljudsku ruku.", "ideje": ["Revolucija je nagla i korenita promena.", "Najčešće se vezuje za politiku i državno uređenje.", "Može se desiti i u drugim oblastima.", "Primer: Prva industrijska revolucija (mašine)."], "objasnjenje": "Bitno je da je promena brza i duboka; oblast može biti politika, privreda ili nešto drugo.", "iz_udzbenika": {"strana": 40, "odeljak": "Uvod", "tekst": "Revolucija je nagli i koreniti preobražaj, najčešće politički, ali moguć u svakoj oblasti života."}, "lekcija": 5}]}, {"naslov": "5. Građanski rat i republika u Engleskoj", "zadaci": [{"id": "l05-grat-izbor-parlament-ko", "vrsta": "izbor", "tezina": "lako", "pojmovi": ["parlament", "plemstvo", "svestenstvo"], "pitanje": "Čiji su predstavnici činili engleski parlament? (više tačnih)", "odgovori": [{"tekst": "Plemstva", "tacan": true}, {"tekst": "Sveštenstva", "tacan": true}, {"tekst": "Gradova", "tacan": true}, {"tekst": "Robova", "tacan": false, "zasto": "Robovi nisu imali nikakva prava, pa ni predstavnike."}, {"tekst": "Svih seljaka", "tacan": false, "zasto": "Seljaci nisu bili među grupama koje su slale predstavnike u parlament."}], "pomoc": ["Seti se tri grupe koje su bile najuticajnije u srednjem veku.", "Među njima su i oni koji služe crkvi i stanovnici varoši.", "Iz lekcije: parlament su činili predstavnici plemstva, sveštenstva i gradova."], "objasnjenje": "Parlament su činili predstavnici plemstva, sveštenstva i gradova; s njima se kralj savetovao još od kasnog srednjeg veka.", "iz_udzbenika": {"strana": 40, "odeljak": "Građanski rat i republika u Engleskoj", "tekst": "Parlament su činili predstavnici plemstva, sveštenstva i gradova.", "slika": "05-engleska-i-americka-revolucija/01-engleski-parlament-xiii-i-xvii-vek.jpg"}, "lekcija": 5}, {"id": "l05-grat-izbor-stjuarti", "vrsta": "izbor", "tezina": "lako", "pojmovi": ["stjuarti", "parlament"], "pitanje": "Vladari iz koje dinastije su u XVII veku narušili odnos kralja i parlamenta u Engleskoj?", "odgovori": [{"tekst": "Stjuart", "tacan": true}, {"tekst": "Habzburg", "tacan": false, "zasto": "Habzburzi su vladali Habzburškom monarhijom (Austrija, Češka, Ugarska), ne Engleskom."}, {"tekst": "Romanov", "tacan": false, "zasto": "Romanovi su ruska dinastija."}, {"tekst": "Hoencolern", "tacan": false, "zasto": "Hoencolerni su vladali Pruskom."}], "pomoc": ["Pogubljeni kralj nosi ime te dinastije u svom imenu.", "Taj kralj je Čarls I …", "Iz lekcije: poredak su u XVII veku narušili vladari iz dinastije Stjuart."], "objasnjenje": "Vladari iz dinastije Stjuart u XVII veku pokušali su da vladaju mimo parlamenta, što je dovelo do Građanskog rata.", "iz_udzbenika": {"strana": 40, "odeljak": "Građanski rat i republika u Engleskoj", "tekst": "Vekovni poredak saradnje kralja i parlamenta narušili su u XVII veku Stjuarti."}, "lekcija": 5}, {"id": "l05-grat-izbor-sudjenje", "vrsta": "izbor", "tezina": "srednje", "pojmovi": ["carls-i-stjuart", "gradjanski-rat-u-engleskoj"], "pitanje": "Šta je bilo nezabeleženo (bez presedana) posle pobede pristalica parlamenta?", "odgovori": [{"tekst": "Kralj je izveden pred sud i osuđen", "tacan": true}, {"tekst": "Kralj je pobegao u Francusku", "tacan": false, "zasto": "Čarls I je bio zarobljen, a ne pobegao."}, {"tekst": "Parlament je izabrao novog kralja iz Škotske", "tacan": false, "zasto": "Engleska je proglašena republikom, a ne kraljevinom sa novim kraljem."}, {"tekst": "Plemstvo je izgubilo mesto u parlamentu", "tacan": false, "zasto": "Lekcija o tome ne govori; novina je bila suđenje kralju."}], "pomoc": ["Šta su pobednici uradili sa zarobljenim kraljem?", "Vladari su do tada smatrani iznad zakona.", "Iz lekcije: pobednici su kralja izveli pred sud — do tada nezabeležen slučaj."], "objasnjenje": "Do tada se smatralo da kralj vlada po božjoj milosti i da je iznad zakona; zato je suđenje Čarlsu I bilo bez presedana.", "iz_udzbenika": {"strana": 40, "odeljak": "Građanski rat i republika u Engleskoj", "tekst": "Pobednici su kralja izveli pred sud, što je bio do tada nezabeležen slučaj."}, "lekcija": 5}, {"id": "l05-grat-izbor-kromvel-portret", "vrsta": "izbor", "slika_u_pitanju": true, "tezina": "lako", "pojmovi": ["oliver-kromvel", "lord-zastitnik"], "pitanje": "Kako je na portretu prikazan Oliver Kromvel?", "odgovori": [{"tekst": "U oklopu, kao vojskovođa", "tacan": true}, {"tekst": "Sa krunom i plaštom od hermelina", "tacan": false, "zasto": "Kromvel nije bio krunisan — na portretu nosi oklop."}, {"tekst": "U sveštenićkoj odeždi", "tacan": false, "zasto": "Bio je plemić i vojskovođa, a ne sveštenik."}, {"tekst": "Sa belom perikom, kao američki predsednik", "tacan": false, "zasto": "To je opis Vašingtonovog portreta; Kromvel ima dugu kosu i oklop."}], "pomoc": ["Pogledaj šta nosi na grudima i ramenu.", "Predvodio je vojsku pristalica parlamenta.", "Iz lekcije: Oliver Kromvel kao lord zaštitnik — u oklopu."], "objasnjenje": "Kromvel je prikazan u oklopu — kao vojskovođa koji je pobedio u Građanskom ratu i potom vladao kao lord zaštitnik.", "iz_udzbenika": {"strana": 40, "odeljak": "Građanski rat i republika u Engleskoj", "tekst": "Portret prikazuje Olivera Kromvela kao lorda zaštitnika.", "slika": "05-engleska-i-americka-revolucija/02-oliver-kromvel.jpg"}, "lekcija": 5}, {"id": "l05-grat-tn-kromvel", "vrsta": "tacno_netacno", "tezina": "lako", "pojmovi": ["oliver-kromvel", "gradjanski-rat-u-engleskoj"], "tvrdnja": "U Građanskom ratu pristalice parlamenta predvodio je plemić Oliver Kromvel.", "tacno": true, "pomoc": ["Ko je kasnije dobio titulu lord zaštitnik?", "Iz lekcije: pristalice parlamenta vodio je plemić Oliver Kromvel."], "objasnjenje": "Tačno — Kromvel je predvodio pristalice parlamenta i porazio kralja Čarlsa I.", "iz_udzbenika": {"strana": 40, "odeljak": "Građanski rat i republika u Engleskoj", "tekst": "Pristalice parlamenta pod vođstvom plemića Olivera Kromvela porazile su i zarobile kralja."}, "osa": {"naziv": "Građanski rat u Engleskoj", "od": 1642, "do": 1649, "traka": "dogadjaji"}, "lekcija": 5}, {"id": "l05-grat-tn-kralj-pobedio", "vrsta": "tacno_netacno", "tezina": "srednje", "pojmovi": ["carls-i-stjuart", "gradjanski-rat-u-engleskoj"], "tvrdnja": "Čarls I je pobedio u Građanskom ratu i raspustio parlament.", "tacno": false, "ispravke": [{"tekst": "Čarls I je poražen, zarobljen, izveden pred sud i osuđen na smrt.", "tacan": true}, {"tekst": "Čarls I je pobedio, ali je kasnije abdicirao u korist Kromvela.", "tacan": false, "zasto": "Kralj nije pobedio niti predao vlast — poražen je i pogubljen."}, {"tekst": "Rat se završio bez pobednika, sporazumom kralja i parlamenta.", "tacan": false, "zasto": "Pobedile su pristalice parlamenta; mirno rešenje dolazi tek sa Slavnom revolucijom 1688."}], "pomoc": ["Ko je zarobljen u ratu?", "Kako se završio život Čarlsa I?", "Iz lekcije: pristalice parlamenta porazile su i zarobile Čarlsa I, a sud ga je osudio na smrt."], "objasnjenje": "Netačno — pobedio je parlament, a kralj je osuđen na smrt kao tiranin, izdajnik, ubica i neprijatelj naroda.", "iz_udzbenika": {"strana": 40, "odeljak": "Građanski rat i republika u Engleskoj", "tekst": "Pristalice parlamenta zarobile su Čarlsa I, a on je osuđen na smrt."}, "lekcija": 5}, {"id": "l05-grat-tn-republika-izbori", "vrsta": "tacno_netacno", "tezina": "srednje", "pojmovi": ["republika", "oliver-kromvel", "lord-zastitnik"], "tvrdnja": "Engleskom republikom upravljao je predsednik biran svake četiri godine.", "tacno": false, "ispravke": [{"tekst": "Republikom je doživotno upravljao Oliver Kromvel sa titulom lord zaštitnik.", "tacan": true}, {"tekst": "Republikom je upravljao Čarls I, ali bez krune.", "tacan": false, "zasto": "Čarls I je osuđen na smrt; vladao je Kromvel."}, {"tekst": "Republikom je upravljao Džordž Vašington.", "tacan": false, "zasto": "Vašington je prvi predsednik SAD (1789), više od sto godina kasnije."}], "pomoc": ["Predsednik biran na četiri godine postoji u SAD — ne u Engleskoj XVII veka.", "Ko je imao titulu lord zaštitnik?", "Iz lekcije: republikom je poput nekrunisanog kralja doživotno upravljao Kromvel."], "objasnjenje": "Netačno — republika je u stvari bila doživotna vlast Kromvela, lorda zaštitnika.", "iz_udzbenika": {"strana": 40, "odeljak": "Građanski rat i republika u Engleskoj", "tekst": "Republikom je, poput nekrunisanog kralja, doživotno upravljao Kromvel kao lord zaštitnik."}, "lekcija": 5}, {"id": "l05-grat-dopuni-rat", "vrsta": "dopuni", "tezina": "lako", "pojmovi": ["gradjanski-rat-u-engleskoj", "oliver-kromvel", "carls-i-stjuart", "parlament"], "pitanje": "Dopuni rečenicu.", "tekst": "Tokom {{Građanskog rata}} (1642–1649) pristalice {{parlamenta}}, pod vođstvom {{Olivera Kromvela}}, porazile su i zarobile kralja {{Čarlsa I}}.", "ponudjene": ["Građanskog rata", "parlamenta", "Olivera Kromvela", "Čarlsa I", "Džordža Vašingtona", "kralja", "Tridesetogodišnjeg rata"], "pomoc": ["Rat se vodio između pristalica kralja i pristalica parlamenta.", "Pobednički vođa kasnije postaje lord zaštitnik.", "Iz lekcije: u Građanskom ratu pristalice parlamenta pod Kromvelom zarobile su Čarlsa I."], "objasnjenje": "U Građanskom ratu (1642–1649) Kromvelove pristalice parlamenta pobedile su kralja Čarlsa I Stjuarta.", "iz_udzbenika": {"strana": 40, "odeljak": "Građanski rat i republika u Engleskoj", "tekst": "U Građanskom ratu (1642–1649) pristalice parlamenta pod Kromvelom zarobile su Čarlsa I."}, "lekcija": 5}, {"id": "l05-grat-dopuni-lord", "vrsta": "dopuni", "tezina": "tesko", "pojmovi": ["lord-zastitnik", "republika", "oliver-kromvel"], "pitanje": "Dopuni bez ponuđenih reči.", "tekst": "Engleska je proglašena za {{republiku}}, ali njome je doživotno upravljao Kromvel sa titulom {{lord zaštitnik|lorda zaštitnika|protektor|lord protektor}}.", "pomoc": ["Kakav je oblik države bez kralja?", "Kromvelova titula na srpskom znači „onaj koji štiti”.", "Iz lekcije: republika; titula lord zaštitnik (protektor)."], "objasnjenje": "Engleska je postala republika, ali Kromvel je vladao doživotno kao lord zaštitnik — poput nekrunisanog kralja.", "iz_udzbenika": {"strana": 40, "odeljak": "Građanski rat i republika u Engleskoj", "tekst": "Engleska je proglašena republikom, kojom je doživotno upravljao Kromvel kao lord zaštitnik."}, "lekcija": 5}, {"id": "l05-grat-datum-rat", "vrsta": "datum", "tezina": "lako", "pojmovi": ["gradjanski-rat-u-engleskoj"], "dogadjaj": "Građanski rat u Engleskoj", "pitanje": "Kada je trajao Građanski rat u Engleskoj?", "od": 1642, "do": 1649, "traka": "dogadjaji", "pomoc": ["Bio je sredinom XVII veka i trajao sedam godina.", "Počeo je početkom četrdesetih godina XVII veka.", "Iz lekcije: Građanski rat (1642–1649)."], "objasnjenje": "Građanski rat u Engleskoj trajao je od 1642. do 1649. godine.", "iz_udzbenika": {"strana": 40, "odeljak": "Građanski rat i republika u Engleskoj", "tekst": "Građanski rat u Engleskoj vodio se 1642–1649."}, "lekcija": 5}, {"id": "l05-grat-datum-obnova", "vrsta": "datum", "tezina": "srednje", "pojmovi": ["obnova-monarhije", "oliver-kromvel"], "dogadjaj": "Obnova monarhije u Engleskoj", "pitanje": "Koje godine je, posle Kromvelove smrti, u Engleskoj ponovo uspostavljena monarhija?", "godina": 1660, "traka": "dogadjaji", "pomoc": ["Desilo se jedanaest godina posle kraja Građanskog rata.", "Godina je okrugla — početak sedme decenije XVII veka.", "Iz lekcije: posle Kromvelove smrti, 1660. godine, monarhija je obnovljena."], "objasnjenje": "Posle smrti Kromvela, 1660, monarhija je obnovljena; a sa naslednicima Čarlsa I usledili su novi sukobi sa parlamentom.", "iz_udzbenika": {"strana": 40, "odeljak": "Građanski rat i republika u Engleskoj", "tekst": "Posle Kromvelove smrti, 1660. godine, u Engleskoj je ponovo uspostavljena monarhija."}, "lekcija": 5}, {"id": "l05-grat-povezi-licnosti", "vrsta": "povezi", "tezina": "lako", "pojmovi": ["oliver-kromvel", "carls-i-stjuart", "stjuarti", "parlament"], "pitanje": "Poveži pojam ili ličnost sa opisom.", "parovi": [["Oliver Kromvel", "vođa pristalica parlamenta, lord zaštitnik"], ["Čarls I", "kralj osuđen na smrt"], ["Stjuarti", "dinastija koja je narušila poredak u XVII veku"], ["Parlament", "predstavnici plemstva, sveštenstva i gradova"]], "pomoc": ["Jedan je pobednik, drugi poraženi kralj.", "Dinastija i skupština su preostala dva.", "Iz lekcije: Kromvel vodi parlament, Čarls I Stjuart je osuđen, parlament čine plemstvo, sveštenstvo i gradovi."], "objasnjenje": "Stjuarti narušavaju poredak, Kromvel predvodi parlament, a Čarls I je osuđen na smrt.", "iz_udzbenika": {"strana": 40, "odeljak": "Građanski rat i republika u Engleskoj", "tekst": "Lekcija opisuje sukob Stjuarta i parlamenta, Kromvelovu pobedu i osudu Čarlsa I."}, "lekcija": 5}, {"id": "l05-grat-zakljuci-bozja-milost", "vrsta": "zakljuci", "tezina": "lako", "pojmovi": ["carls-i-stjuart", "parlament"], "pitanje": "Zašto su vladari smatrali da im niko ne može suditi?", "odgovori": [{"tekst": "Tvrdili su da vladaju po božjoj milosti, pa su iznad zakona", "tacan": true}, {"tekst": "Zato što ih je izabrao narod na izborima", "tacan": false, "zasto": "Kraljevi su vlast nasleđivali, a ne dobijali na izborima."}, {"tekst": "Zato što je to pisalo u Povelji o pravima", "tacan": false, "zasto": "Povelja (1689) dolazi posle i upravo ograničava kralja."}, {"tekst": "Zato što je parlament tako odlučio", "tacan": false, "zasto": "Parlament je, naprotiv, sudio kralju."}], "pomoc": ["Korak 1: Odakle su kraljevi tvrdili da dolazi njihova vlast?", "Korak 2: Ako vlast dolazi od Boga, da li važe ljudski zakoni?", "Iz lekcije: vladari su isticali da vladaju po božjoj milosti i da su zato iznad zakona."], "objasnjenje": "Vladari su tvrdili da vlast dobijaju od Boga, pa su se smatrali iznad zakona — zato je suđenje kralju bilo nečuveno.", "iz_udzbenika": {"strana": 40, "odeljak": "Građanski rat i republika u Engleskoj", "tekst": "Vladari su isticali da vladaju po božjoj milosti i da se zato nalaze iznad zakona."}, "lekcija": 5}, {"id": "l05-grat-zakljuci-republika-po-imenu", "vrsta": "zakljuci", "tezina": "tesko", "pojmovi": ["republika", "oliver-kromvel", "lord-zastitnik"], "pitanje": "Zašto se za Kromvela kaže da je vladao „poput nekrunisanog kralja”?", "odgovori": [{"tekst": "Iako je Engleska bila republika, on je imao vlast doživotno, kao kralj", "tacan": true}, {"tekst": "Zato što je bio sin Čarlsa I", "tacan": false, "zasto": "Kromvel je bio plemić i vođa protivnika kralja, a ne kraljev sin."}, {"tekst": "Zato što ga je parlament krunisao posle rata", "tacan": false, "zasto": "Nije krunisan — zato i „nekrunisani” kralj."}, {"tekst": "Zato što je vlast predavao svake godine drugom", "tacan": false, "zasto": "Vladao je doživotno, do smrti."}], "pomoc": ["Korak 1: Po čemu se republika razlikuje od monarhije?", "Korak 2: Koliko dugo je Kromvel upravljao?", "Iz lekcije: republikom je doživotno upravljao Kromvel kao lord zaštitnik."], "objasnjenje": "U republici vlast treba da se bira na određeno vreme, a Kromvel je vladao doživotno — kao kralj, samo bez krune.", "iz_udzbenika": {"strana": 40, "odeljak": "Građanski rat i republika u Engleskoj", "tekst": "Republikom je doživotno, poput nekrunisanog kralja, upravljao Kromvel."}, "lekcija": 5}, {"id": "l05-grat-lanac-rat", "vrsta": "lanac", "tezina": "lako", "pojmovi": ["stjuarti", "gradjanski-rat-u-engleskoj", "carls-i-stjuart"], "karike": ["Stjuarti u XVII veku narušavaju saradnju kralja i parlamenta", "?", "Čarls I je poražen i zarobljen"], "praznina": 1, "odgovori": [{"tekst": "Izbija Građanski rat (1642–1649)", "tacan": true}, {"tekst": "Izbija Bostonska čajanka", "tacan": false, "zasto": "Bostonska čajanka je 1773. u Americi."}, {"tekst": "Kralj prihvata Povelju o pravima", "tacan": false, "zasto": "Povelja dolazi tek 1689, posle Slavne revolucije."}], "pomoc": ["Šta se dešava kad se kralj i parlament ne slože, a nijedan ne popušta?", "Sukob se rešava oružjem.", "Iz lekcije: sledi Građanski rat (1642–1649) u kome Čarls I biva zarobljen."], "objasnjenje": "Narušeni poredak doveo je do Građanskog rata u kome su pristalice parlamenta zarobile kralja.", "iz_udzbenika": {"strana": 40, "odeljak": "Građanski rat i republika u Engleskoj", "tekst": "Stjuarti su narušili poredak; u Građanskom ratu kralj je zarobljen."}, "osa": {"naziv": "Građanski rat u Engleskoj", "od": 1642, "do": 1649, "traka": "dogadjaji"}, "lekcija": 5}, {"id": "l05-grat-lanac-republika", "vrsta": "lanac", "tezina": "srednje", "pojmovi": ["carls-i-stjuart", "republika"], "karike": ["Pristalice parlamenta pobeđuju", "Čarls I je osuđen na smrt", "?"], "praznina": 2, "odgovori": [{"tekst": "Engleska je proglašena republikom", "tacan": true}, {"tekst": "Engleska postaje parlamentarna monarhija", "tacan": false, "zasto": "To se dešava tek posle Slavne revolucije i Povelje o pravima (1688–1689)."}, {"tekst": "Engleska se ujedinjuje sa Škotskom", "tacan": false, "zasto": "Ujedinjenje je početkom XVIII veka."}], "pomoc": ["Ako kralja više nema, kakva je država?", "Država bez kralja zove se …", "Iz lekcije: posle osude kralja Engleska je proglašena republikom."], "objasnjenje": "Kad je kralj osuđen, Engleska je proglašena republikom.", "iz_udzbenika": {"strana": 40, "odeljak": "Građanski rat i republika u Engleskoj", "tekst": "Posle osude Čarlsa I Engleska je proglašena republikom."}, "lekcija": 5}, {"id": "l05-grat-lanac-obnova", "vrsta": "lanac", "tezina": "srednje", "pojmovi": ["lord-zastitnik", "oliver-kromvel", "obnova-monarhije"], "karike": ["Kromvel vlada doživotno kao lord zaštitnik", "Kromvel umire", "?"], "praznina": 2, "odgovori": [{"tekst": "1660. monarhija se ponovo uspostavlja", "tacan": true}, {"tekst": "Engleska postaje deo Francuske", "tacan": false, "zasto": "Ništa slično se nije desilo; vratila se monarhija."}, {"tekst": "Parlament bira predsednika na četiri godine", "tacan": false, "zasto": "Predsednik na četiri godine je američko rešenje iz 1787."}], "pomoc": ["Korak 1: Ko je posle Kromvela mogao da vlada Engleskom?", "Korak 2: Na str. 41 se govori o „naslednicima Čarlsa I”.", "Iz lekcije: posle Kromvelove smrti, 1660, monarhija je obnovljena."], "objasnjenje": "Republika je počivala na Kromvelu; posle njegove smrti, 1660, vratila se monarhija.", "iz_udzbenika": {"strana": 40, "odeljak": "Građanski rat i republika u Engleskoj", "tekst": "Posle Kromvelove smrti, 1660. godine, monarhija je obnovljena."}, "osa": {"naziv": "Obnova monarhije u Engleskoj", "od": 1660, "traka": "dogadjaji"}, "lekcija": 5}, {"id": "l05-grat-ko-sam-kromvel", "vrsta": "ko_sam", "tezina": "srednje", "pojmovi": ["oliver-kromvel", "lord-zastitnik", "gradjanski-rat-u-engleskoj"], "tragovi": ["Bio sam plemić, ali sam se borio protiv kralja.", "Predvodio sam pristalice parlamenta u Građanskom ratu.", "Upravljao sam republikom doživotno, sa titulom lord zaštitnik."], "odgovori": [{"tekst": "Oliver Kromvel", "tacan": true}, {"tekst": "Čarls I Stjuart", "tacan": false, "zasto": "Čarls I je bio kralj protiv koga se Kromvel borio."}, {"tekst": "Džordž Vašington", "tacan": false, "zasto": "Vašington je vodio američke koloniste protiv Britanije u XVIII veku."}, {"tekst": "Tomas Džeferson", "tacan": false, "zasto": "Džeferson je sastavio američku Deklaraciju nezavisnosti."}], "objasnjenje": "To je Oliver Kromvel — vođa pristalica parlamenta i doživotni lord zaštitnik engleske republike.", "iz_udzbenika": {"strana": 40, "odeljak": "Građanski rat i republika u Engleskoj", "tekst": "Kromvel je predvodio pristalice parlamenta i doživotno upravljao republikom kao lord zaštitnik.", "slika": "05-engleska-i-americka-revolucija/02-oliver-kromvel.jpg"}, "lekcija": 5}, {"id": "l05-grat-ko-sam-carls", "vrsta": "ko_sam", "tezina": "lako", "pojmovi": ["carls-i-stjuart", "stjuarti"], "tragovi": ["Bio sam engleski kralj iz dinastije Stjuart.", "Zarobile su me pristalice parlamenta u Građanskom ratu.", "Sud me je osudio na smrt kao tiranina i neprijatelja naroda."], "odgovori": [{"tekst": "Čarls I", "tacan": true}, {"tekst": "Oliver Kromvel", "tacan": false, "zasto": "Kromvel je pobedio kralja i nije bio iz dinastije Stjuart."}, {"tekst": "Luj XIV", "tacan": false, "zasto": "Luj XIV je bio francuski kralj."}, {"tekst": "Fridrih II Veliki", "tacan": false, "zasto": "Fridrih II je bio pruski kralj iz dinastije Hoencolern."}], "objasnjenje": "To je Čarls I Stjuart — prvi kralj koga su podanici izveli pred sud i osudili na smrt.", "iz_udzbenika": {"strana": 40, "odeljak": "Građanski rat i republika u Engleskoj", "tekst": "Čarls I Stjuart je zarobljen u Građanskom ratu i osuđen na smrt."}, "lekcija": 5}, {"id": "l05-grat-izvor-presuda", "vrsta": "izvor", "tezina": "srednje", "pojmovi": ["carls-i-stjuart", "parlament"], "izvor": {"autor": "Udžbenik (prepričano)", "naslov": "Suđenje Čarlsu I", "tekst": "Pobednici u Građanskom ratu izveli su kralja pred sud. Do tada su vladari tvrdili da vladaju po božjoj milosti i da su iznad zakona. Čarls I je osuđen na smrt kao tiranin, izdajnik, ubica i neprijatelj naroda.", "napomena": "Odlomak je prepričan; udžbenik, str. 40."}, "pitanje": "Koju ideju o vlasti je ovo suđenje srušilo?", "odgovori": [{"tekst": "Da je vladar iznad zakona jer vlada po božjoj milosti", "tacan": true}, {"tekst": "Da parlament ima pravo da savetuje kralja", "tacan": false, "zasto": "Tu ideju suđenje nije srušilo — naprotiv, parlament je pobedio."}, {"tekst": "Da kralj mora da poštuje zakone", "tacan": false, "zasto": "Suđenje je upravo pokazalo da i kralj mora da odgovara pred zakonom."}, {"tekst": "Da je Engleska republika", "tacan": false, "zasto": "Republika je proglašena tek posle osude kralja."}], "pomoc": ["Šta su vladari do tada tvrdili o sebi?", "Ako kralju može da se sudi, da li je on iznad zakona?", "Iz lekcije: vladari su govorili da vladaju po božjoj milosti i da su iznad zakona."], "objasnjenje": "Suđenje je pokazalo da ni kralj nije iznad zakona — srušena je ideja da vlast po božjoj milosti stoji iznad svakog suda.", "iz_udzbenika": {"strana": 40, "odeljak": "Građanski rat i republika u Engleskoj", "tekst": "Kralj je izveden pred sud iako su vladari tvrdili da su iznad zakona; osuđen je na smrt."}, "lekcija": 5}, {"id": "l05-grat-uporedi-carls-kromvel", "vrsta": "uporedi", "tezina": "tesko", "pojmovi": ["carls-i-stjuart", "oliver-kromvel"], "a": "Čarls I", "b": "Oliver Kromvel", "pitanje": "Na koga se odnosi tvrdnja — Čarlsa I, Kromvela, obojicu ili nijednog?", "tvrdnje": [{"tekst": "Bio je iz dinastije Stjuart.", "odgovor": "a", "zasto": "Čarls I Stjuart; Kromvel je bio plemić, ne član dinastije."}, {"tekst": "Nosio je titulu lord zaštitnik.", "odgovor": "b", "zasto": "Tu titulu imao je Kromvel kao vladar republike."}, {"tekst": "Osuđen je na smrt.", "odgovor": "a", "zasto": "Osuđen je kralj; Kromvel je umro kao vladar."}, {"tekst": "Vladao je Engleskom.", "odgovor": "oba", "zasto": "Čarls I kao kralj, Kromvel kao lord zaštitnik republike."}, {"tekst": "Bio je izabran na izborima na četiri godine.", "odgovor": "nijedan", "zasto": "Kralj je nasledio presto, a Kromvel je vladao doživotno."}], "pomoc": ["Ko je pobednik, a ko poraženi u Građanskom ratu?", "Obojica su u nekom trenutku stajali na čelu Engleske.", "Iz lekcije: Čarls I Stjuart osuđen; Kromvel doživotni lord zaštitnik."], "objasnjenje": "Čarls I je Stjuart osuđen na smrt; Kromvel je vladao republikom kao lord zaštitnik; nijedan nije biran na određeno vreme.", "iz_udzbenika": {"strana": 40, "odeljak": "Građanski rat i republika u Engleskoj", "tekst": "Lekcija suprotstavlja kralja Čarlsa I Stjuarta i Kromvela, pobednika i lorda zaštitnika."}, "lekcija": 5}, {"id": "l05-grat-objasni-sudjenje", "vrsta": "objasni", "tezina": "srednje", "pojmovi": ["carls-i-stjuart", "gradjanski-rat-u-engleskoj"], "pitanje": "Zašto je suđenje kralju Čarlsu I bilo događaj bez presedana?", "uzor": "Vladari su do tada tvrdili da vladaju po božjoj milosti i da su zato iznad zakona, pa im niko nije mogao suditi. Posle Građanskog rata pristalice parlamenta izvele su Čarlsa I pred sud i osudile ga na smrt. Time su pokazale da i kralj mora da odgovara za svoja dela.", "ideje": ["Vladari su se smatrali iznad zakona (božja milost).", "Pobednici u Građanskom ratu su kralju sudili.", "Čarls I je osuđen na smrt.", "Pokazano je da ni kralj nije iznad zakona."], "objasnjenje": "Suđenje je srušilo ideju da je kralj iznad zakona.", "iz_udzbenika": {"strana": 40, "odeljak": "Građanski rat i republika u Engleskoj", "tekst": "Vladari su tvrdili da su po božjoj milosti iznad zakona, a Čarlsu I je ipak suđeno."}, "lekcija": 5}, {"id": "l05-grat-objasni-prava-republika", "vrsta": "objasni", "tezina": "tesko", "pojmovi": ["republika", "oliver-kromvel", "lord-zastitnik"], "pitanje": "Da li je Engleska pod Kromvelom bila prava republika? Obrazloži.", "uzor": "Engleska je posle osude Čarlsa I proglašena republikom, ali njom je doživotno upravljao Kromvel sa titulom lord zaštitnik. To liči na vlast kralja bez krune, a ne na republiku u kojoj se vlast bira na određeno vreme. Posle Kromvelove smrti, 1660, monarhija je obnovljena.", "ideje": ["Engleska je zvanično proglašena republikom.", "Kromvel je vladao doživotno, kao nekrunisani kralj.", "U pravoj republici vlast se bira na određeno vreme.", "Posle njegove smrti vraćena je monarhija (1660)."], "objasnjenje": "Republika je postojala po imenu, ali vlast jednog čoveka doživotno ličila je na monarhiju.", "iz_udzbenika": {"strana": 40, "odeljak": "Građanski rat i republika u Engleskoj", "tekst": "Engleska je proglašena republikom, ali Kromvel je njom upravljao doživotno, poput nekrunisanog kralja."}, "lekcija": 5}]}, {"naslov": "5. Stvaranje parlamentarne monarhije", "zadaci": [{"id": "l05-parl-izbor-beskrvna", "vrsta": "izbor", "tezina": "lako", "pojmovi": ["slavna-revolucija"], "pitanje": "Zašto se revolucija iz 1688. naziva Beskrvnom?", "odgovori": [{"tekst": "Jer se odigrala bez sukoba i nasilja", "tacan": true}, {"tekst": "Jer je u njoj kralj pogubljen", "tacan": false, "zasto": "Kralj je pogubljen u Građanskom ratu (Čarls I), a 1688. nije bilo nasilja."}, {"tekst": "Jer je trajala sedam godina", "tacan": false, "zasto": "Sedam godina trajao je Građanski rat (1642–1649)."}, {"tekst": "Jer su je vodili kolonisti u Americi", "tacan": false, "zasto": "Slavna revolucija je u Engleskoj; Američka je počela 1775."}], "pomoc": ["Šta znači reč „beskrvna”?", "Nije bilo ni borbi ni žrtava.", "Iz lekcije: Slavna ili Beskrvna revolucija (1688) prošla je bez sukoba i nasilja."], "objasnjenje": "Slavna revolucija 1688. dobila je ime „Beskrvna” jer je prošla bez sukoba i nasilja.", "iz_udzbenika": {"strana": 41, "odeljak": "Stvaranje parlamentarne monarhije", "tekst": "Sukobi naslednika Čarlsa I i parlamenta završeni su Slavnom ili Beskrvnom revolucijom 1688, bez sukoba i nasilja."}, "osa": {"naziv": "Slavna revolucija", "od": 1688, "traka": "dogadjaji"}, "lekcija": 5}, {"id": "l05-parl-izbor-povelja", "vrsta": "izbor", "tezina": "lako", "pojmovi": ["povelja-o-pravima"], "pitanje": "Koji dokument je engleski kralj prihvatio 1689. godine?", "odgovori": [{"tekst": "Povelju o pravima", "tacan": true}, {"tekst": "Deklaraciju nezavisnosti", "tacan": false, "zasto": "Deklaraciju nezavisnosti su 1776. izglasali američki kolonisti."}, {"tekst": "Ustav SAD", "tacan": false, "zasto": "Ustav SAD donet je 1787. u Americi."}, {"tekst": "Patent o verskoj toleranciji", "tacan": false, "zasto": "Patent o verskoj toleranciji izdao je Josif II u Habzburškoj monarhiji 1781."}], "pomoc": ["Dokument govori o pravima i slobodama.", "Odmah posle Slavne revolucije.", "Iz lekcije: kralj je 1689. prihvatio Povelju o pravima."], "objasnjenje": "Posle Slavne revolucije kralj je 1689. prihvatio Povelju o pravima, kojom je ograničena njegova vlast.", "iz_udzbenika": {"strana": 41, "odeljak": "Stvaranje parlamentarne monarhije", "tekst": "Engleski kralj je prihvatio Povelju o pravima 1689."}, "lekcija": 5}, {"id": "l05-parl-izbor-sustina-povelje", "vrsta": "izbor", "tezina": "srednje", "pojmovi": ["povelja-o-pravima", "parlamentarna-monarhija"], "pitanje": "Šta je, pre svega, utvrđeno Poveljom o pravima?", "odgovori": [{"tekst": "Da vladar mora da vlada u skladu sa odlukama parlamenta", "tacan": true}, {"tekst": "Da se ukida monarhija i uvodi republika", "tacan": false, "zasto": "Povelja zadržava kralja, ali ga vezuje za odluke parlamenta."}, {"tekst": "Da kralj vlada po božjoj milosti, bez parlamenta", "tacan": false, "zasto": "Upravo suprotno — vladar više ne može mimo parlamenta."}, {"tekst": "Da svi stanovnici dobijaju pravo glasa", "tacan": false, "zasto": "Pravo glasa je i u XVIII i u većem delu XIX veka imao mali deo stanovništva."}], "pomoc": ["Ko posle 1689. ima poslednju reč — kralj ili parlament?", "Kralj ostaje, ali je ograničen.", "Iz lekcije: vladar mora da vlada u saglasnosti sa odlukama parlamenta."], "objasnjenje": "Povelja o pravima obavezuje vladara da vlada u skladu sa odlukama parlamenta — tako nastaje parlamentarna monarhija.", "iz_udzbenika": {"strana": 41, "odeljak": "Stvaranje parlamentarne monarhije", "tekst": "Povelja o pravima je utvrdila da vladar mora da vlada u skladu sa odlukama parlamenta."}, "lekcija": 5}, {"id": "l05-parl-izbor-gornji-dom", "vrsta": "izbor", "tezina": "lako", "pojmovi": ["gornji-dom", "plemstvo"], "pitanje": "Ko je činio Gornji dom (Dom lordova) i kako se postajalo njegov član?", "odgovori": [{"tekst": "Krupno plemstvo, po naslednom pravu", "tacan": true}, {"tekst": "Izabrani poslanici sitnog plemstva i građanstva", "tacan": false, "zasto": "To je sastav Donjeg doma."}, {"tekst": "Predstavnici kolonija, izabrani u Americi", "tacan": false, "zasto": "Kolonisti nisu dobili predstavnike u britanskom parlamentu — to je bio njihov neispunjen zahtev."}, {"tekst": "Sveštenici koje imenuje papa", "tacan": false, "zasto": "Lekcija Gornji dom opisuje kao skup krupnog plemstva."}], "pomoc": ["Ime „Dom lordova” govori ko tu sedi.", "Na izbore se ne ide — mesto se nasleđuje.", "Iz lekcije: Gornji dom čine predstavnici krupnog plemstva, po naslednom pravu."], "objasnjenje": "Članovi Gornjeg doma bili su krupni plemići koji su mesto nasleđivali.", "iz_udzbenika": {"strana": 41, "odeljak": "Stvaranje parlamentarne monarhije", "tekst": "Gornji dom ili Dom lordova činili su predstavnici krupnog plemstva, članovi po naslednom pravu."}, "lekcija": 5}, {"id": "l05-parl-izbor-donji-dom", "vrsta": "izbor", "tezina": "srednje", "pojmovi": ["donji-dom", "plemstvo", "gradjanstvo"], "pitanje": "Koje tvrdnje važe za Donji dom? (više tačnih)", "odgovori": [{"tekst": "Činili su ga izabrani poslanici", "tacan": true}, {"tekst": "Poslanici su uglavnom bili sitno plemstvo i bogato građanstvo", "tacan": true}, {"tekst": "Stranka sa najviše poslanika u njemu sastavljala je vladu", "tacan": true}, {"tekst": "Njegove odluke nije morao niko da odobri", "tacan": false, "zasto": "Sve odluke Donjeg doma morao je najpre da odobri Gornji dom."}, {"tekst": "Članom se postajalo naslednim pravom", "tacan": false, "zasto": "Nasledno pravo važi za Gornji dom; u Donji dom se biralo."}], "pomoc": ["Donji dom je izborni dom.", "Seti se uloge Gornjeg doma u odlukama.", "Iz lekcije: Donji dom — izabrani poslanici sitnog plemstva i bogatog građanstva; pobednička stranka sastavlja vladu."], "objasnjenje": "Donji dom je bio izborni dom sitnog plemstva i bogatog građanstva; iz njega je nastajala vlada, ali su njegove odluke prolazile i kroz Gornji dom.", "iz_udzbenika": {"strana": 41, "odeljak": "Stvaranje parlamentarne monarhije", "tekst": "Donji dom su činili izabrani poslanici, uglavnom sitno plemstvo i bogato građanstvo."}, "lekcija": 5}, {"id": "l05-parl-tn-velika-britanija", "vrsta": "tacno_netacno", "tezina": "lako", "pojmovi": ["velika-britanija", "engleska", "skotska"], "tvrdnja": "Velika Britanija je nastala početkom XVIII veka ujedinjenjem Engleske i Škotske.", "tacno": true, "pomoc": ["Koja zemlja je susedna Engleskoj na severu?", "Iz lekcije: početkom XVIII veka Engleska se ujedinila sa Škotskom — nastala je Velika Britanija."], "objasnjenje": "Tačno — ujedinjenjem Engleske i susedne Škotske početkom XVIII veka nastala je Velika Britanija.", "iz_udzbenika": {"strana": 41, "odeljak": "Stvaranje parlamentarne monarhije", "tekst": "Početkom XVIII veka Engleska se ujedinila sa Škotskom i tako je stvorena Velika Britanija."}, "osa": {"naziv": "Ujedinjenje Engleske i Škotske", "od": 1700, "do": 1720, "traka": "dogadjaji", "oznaka": "početak XVIII veka"}, "lekcija": 5}, {"id": "l05-parl-tn-nasledno", "vrsta": "tacno_netacno", "tezina": "lako", "pojmovi": ["gornji-dom"], "tvrdnja": "Članovi Gornjeg doma postajali su članovi parlamenta po naslednom pravu.", "tacno": true, "pomoc": ["Da li se u Dom lordova biralo?", "Iz lekcije: krupni plemići u Gornjem domu postaju članovi po naslednom pravu."], "objasnjenje": "Tačno — mesto u Gornjem domu se nasleđivalo, a u Donji dom se biralo.", "iz_udzbenika": {"strana": 41, "odeljak": "Stvaranje parlamentarne monarhije", "tekst": "Predstavnici krupnog plemstva su po naslednom pravu postajali članovi parlamenta."}, "lekcija": 5}, {"id": "l05-parl-tn-svi-glasaju", "vrsta": "tacno_netacno", "tezina": "srednje", "pojmovi": ["pravo-glasa", "velika-britanija"], "tvrdnja": "U XVIII veku svi odrasli stanovnici Velike Britanije imali su pravo glasa.", "tacno": false, "ispravke": [{"tekst": "U XVIII i većem delu XIX veka pravo glasa imao je samo mali deo stanovništva.", "tacan": true}, {"tekst": "Pravo glasa imali su samo kralj i lordovi.", "tacan": false, "zasto": "Poslanici Donjeg doma su se birali, pa je glasalo više ljudi — ali ipak mali deo stanovništva."}, {"tekst": "Pravo glasa imale su samo žene.", "tacan": false, "zasto": "Ništa takvo lekcija ne kaže; glasao je mali deo stanovništva."}], "pomoc": ["Seti se šta lekcija kaže kao „međutim” posle opisa parlamenta.", "Glasalo se, ali ne svi.", "Iz lekcije: samo mali deo stanovništva imao je pravo glasa."], "objasnjenje": "Netačno — i u XVIII i u većem delu XIX veka pravo glasa imao je samo mali deo stanovništva.", "iz_udzbenika": {"strana": 41, "odeljak": "Stvaranje parlamentarne monarhije", "tekst": "U XVIII i većem delu XIX veka samo je mali deo stanovništva Velike Britanije imao pravo glasa."}, "lekcija": 5}, {"id": "l05-parl-tn-donji-sam", "vrsta": "tacno_netacno", "tezina": "tesko", "pojmovi": ["donji-dom", "gornji-dom"], "tvrdnja": "Odluke Donjeg doma stupale su na snagu odmah, bez ičijeg odobrenja.", "tacno": false, "ispravke": [{"tekst": "Sve odluke Donjeg doma morao je najpre da odobri Gornji dom.", "tacan": true}, {"tekst": "Odluke Donjeg doma morao je da odobri američki Kongres.", "tacan": false, "zasto": "Kongres je američki parlament i nema veze sa britanskim domovima."}, {"tekst": "Odluke Donjeg doma morala je da odobri vlada.", "tacan": false, "zasto": "Obrnuto — vlada je odgovarala parlamentu i podnosila mu izveštaje."}], "pomoc": ["Parlament ima dva doma.", "Nasledni dom je imao pravo da odobrava odluke izbornog doma.", "Iz lekcije: sve odluke Donjeg doma najpre je morao da odobri Gornji dom."], "objasnjenje": "Netačno — Gornji dom, sastavljen od naslednog plemstva, odobravao je sve odluke Donjeg doma.", "iz_udzbenika": {"strana": 41, "odeljak": "Stvaranje parlamentarne monarhije", "tekst": "Sve odluke Donjeg doma morao je najpre da odobri Gornji dom."}, "lekcija": 5}, {"id": "l05-parl-dopuni-definicije", "vrsta": "dopuni", "tezina": "lako", "pojmovi": ["parlamentarna-monarhija", "vigovci", "torijevci"], "pitanje": "Dopuni objašnjenja pojmova.", "tekst": "U parlamentarnoj monarhiji vladar deli vlast sa {{parlamentom}}. Vigovci su stranka {{protivnika}} apsolutističke kraljevske vlasti, a torijevci stranka {{pristalica}} snažne kraljevske vlasti.", "ponudjene": ["parlamentom", "protivnika", "pristalica", "crkvom", "vojskom", "robova"], "pomoc": ["Vladar ne vlada sam — s kim deli vlast?", "Jedna stranka je za jakog kralja, druga protiv.", "Iz lekcije: vigovci — protivnici apsolutističke vlasti; torijevci — pristalice snažne kraljevske vlasti."], "objasnjenje": "Parlamentarna monarhija: vladar deli vlast sa parlamentom. Vigovci su protiv apsolutizma, torijevci za snažnog kralja.", "iz_udzbenika": {"strana": 41, "odeljak": "Definicije: parlamentarna monarhija, vigovci, torijevci", "tekst": "Parlamentarna monarhija je oblik monarhije u kome vladar deli vlast sa parlamentom; vigovci i torijevci su dve stranke."}, "lekcija": 5}, {"id": "l05-parl-dopuni-vlada", "vrsta": "dopuni", "tezina": "srednje", "pojmovi": ["vlada", "donji-dom", "parlament"], "pitanje": "Dopuni opis kako je radila britanska vlada.", "tekst": "Stranka koja dobije najviše poslanika u {{Donjem domu}} sastavlja {{vladu}}. Vlada podnosi {{izveštaje}} o svom radu parlamentu, a parlament može da izglasa njenu {{smenu}} i raspiše nove izbore.", "ponudjene": ["Donjem domu", "vladu", "izveštaje", "smenu", "Gornjem domu", "krunu", "platu"], "pomoc": ["U koji dom se biralo?", "Ko kome polaže račune — vlada parlamentu ili obrnuto?", "Iz lekcije: pobednik izbora za Donji dom sastavlja vladu; vlada izveštava parlament, koji je može smeniti."], "objasnjenje": "Vladu sastavlja pobednička stranka u Donjem domu; ona odgovara parlamentu, koji je može smeniti i raspisati izbore.", "iz_udzbenika": {"strana": 41, "odeljak": "Stvaranje parlamentarne monarhije", "tekst": "Pobednička stranka sastavlja vladu, koja podnosi izveštaje parlamentu; parlament može da izglasa smenu vlade."}, "lekcija": 5}, {"id": "l05-parl-povezi-domovi", "vrsta": "povezi", "tezina": "lako", "pojmovi": ["vigovci", "torijevci", "gornji-dom", "donji-dom"], "pitanje": "Poveži pojam sa opisom.", "parovi": [["Vigovci", "protivnici apsolutističke kraljevske vlasti"], ["Torijevci", "pristalice snažne kraljevske vlasti"], ["Gornji dom", "krupno plemstvo po naslednom pravu"], ["Donji dom", "izabrani poslanici sitnog plemstva i građanstva"]], "pomoc": ["Dve stranke i dva doma parlamenta.", "Jedan dom je nasledni, drugi izborni.", "Iz lekcije: vigovci protiv apsolutizma, torijevci za jakog kralja; Gornji dom — lordovi, Donji dom — izabrani."], "objasnjenje": "Vigovci i torijevci su stranke; Gornji dom je nasledni (lordovi), Donji dom izborni.", "iz_udzbenika": {"strana": 41, "odeljak": "Stvaranje parlamentarne monarhije", "tekst": "Parlament ima Gornji i Donji dom; poslanici se dele na vigovce i torijevce."}, "lekcija": 5}, {"id": "l05-parl-datum-slavna", "vrsta": "datum", "tezina": "lako", "pojmovi": ["slavna-revolucija"], "dogadjaj": "Slavna revolucija", "pitanje": "Koje godine je bila Slavna (Beskrvna) revolucija?", "godina": 1688, "traka": "dogadjaji", "pomoc": ["Bila je krajem XVII veka.", "Samo godinu dana pre Povelje o pravima (1689).", "Iz lekcije: Slavna revolucija 1688."], "objasnjenje": "Slavna revolucija bila je 1688, a godinu kasnije kralj je prihvatio Povelju o pravima.", "iz_udzbenika": {"strana": 41, "odeljak": "Stvaranje parlamentarne monarhije", "tekst": "Slavna ili Beskrvna revolucija dogodila se 1688."}, "lekcija": 5}, {"id": "l05-parl-datum-povelja", "vrsta": "datum", "tezina": "srednje", "pojmovi": ["povelja-o-pravima"], "dogadjaj": "Povelja o pravima", "pitanje": "Koje godine je engleski kralj prihvatio Povelju o pravima?", "godina": 1689, "traka": "dogadjaji", "pomoc": ["Desilo se odmah posle Slavne revolucije.", "Poslednja godina pred kraj osamdesetih godina XVII veka.", "Iz lekcije: Povelja o pravima 1689."], "objasnjenje": "Povelju o pravima kralj je prihvatio 1689; time je uspostavljena parlamentarna monarhija.", "iz_udzbenika": {"strana": 41, "odeljak": "Stvaranje parlamentarne monarhije", "tekst": "Engleski kralj je prihvatio Povelju o pravima 1689. godine."}, "lekcija": 5}, {"id": "l05-parl-poredjaj-engleska", "vrsta": "poredjaj", "tezina": "lako", "pojmovi": ["gradjanski-rat-u-engleskoj", "obnova-monarhije", "slavna-revolucija", "povelja-o-pravima"], "pitanje": "Poređaj događaje engleske istorije od najranijeg.", "stavke": [{"tekst": "Građanski rat između kralja i parlamenta", "godina": 1642, "do": 1649, "naziv": "Građanski rat u Engleskoj", "traka": "dogadjaji"}, {"tekst": "Posle Kromvelove smrti obnovljena je monarhija", "godina": 1660, "naziv": "Obnova monarhije u Engleskoj", "traka": "dogadjaji"}, {"tekst": "Slavna (Beskrvna) revolucija", "godina": 1688, "naziv": "Slavna revolucija", "traka": "dogadjaji"}, {"tekst": "Kralj prihvata Povelju o pravima", "godina": 1689, "naziv": "Povelja o pravima", "traka": "dogadjaji"}], "pomoc": ["Prvo je bio rat, a na kraju dokument koji ograničava kralja.", "Republika posle rata nije dugo trajala.", "Iz lekcije: 1642–1649 rat, 1660 obnova monarhije, 1688 Slavna revolucija, 1689 Povelja."], "objasnjenje": "Građanski rat (1642–1649) → obnova monarhije (1660) → Slavna revolucija (1688) → Povelja o pravima (1689).", "iz_udzbenika": {"strana": 41, "odeljak": "Stvaranje parlamentarne monarhije", "tekst": "Lekcija prati Englesku od Građanskog rata do Povelje o pravima i parlamentarne monarhije."}, "lekcija": 5}, {"id": "l05-parl-zakljuci-kontrola-vlade", "vrsta": "zakljuci", "tezina": "srednje", "pojmovi": ["vlada", "parlament"], "pitanje": "Kako je britanski parlament mogao da nadzire vladu?", "odgovori": [{"tekst": "Vlada mu je podnosila izveštaje, a on je mogao da izglasa njenu smenu i nove izbore", "tacan": true}, {"tekst": "Parlament je mogao da pogubi ministre bez suđenja", "tacan": false, "zasto": "O tome lekcija ništa ne kaže; nadzor je išao kroz izveštaje i smenu vlade."}, {"tekst": "Nikako — vladu je postavljao i nadzirao samo kralj", "tacan": false, "zasto": "Vladu je sastavljala stranka sa najviše poslanika i ona je odgovarala parlamentu."}, {"tekst": "Preko Vrhovnog suda", "tacan": false, "zasto": "Vrhovni sud koji nadzire sva tela vlasti je odlika uređenja SAD."}], "pomoc": ["Korak 1: Kome je vlada morala da podnosi izveštaje?", "Korak 2: Šta je parlament mogao da uradi ako nije zadovoljan?", "Iz lekcije: vlada podnosi izveštaje parlamentu; parlament može da izglasa smenu vlade i raspiše izbore."], "objasnjenje": "Vlada je odgovarala parlamentu: izveštavala ga je o radu, a parlament je mogao da je smeni i raspiše nove izbore.", "iz_udzbenika": {"strana": 41, "odeljak": "Stvaranje parlamentarne monarhije", "tekst": "Vlada je morala da podnosi izveštaje parlamentu, koji je mogao da izglasa smenu vlade i nove izbore."}, "lekcija": 5}, {"id": "l05-parl-zakljuci-ne-za-sve", "vrsta": "zakljuci", "tezina": "tesko", "pojmovi": ["pravo-glasa", "gornji-dom", "parlamentarna-monarhija"], "pitanje": "Zašto britanski parlament u XVIII veku nije predstavljao većinu stanovnika?", "odgovori": [{"tekst": "Pravo glasa imao je mali deo ljudi, a odluke izabranog doma odobravalo je nasledno plemstvo", "tacan": true}, {"tekst": "Parlament se uopšte nije sastajao", "tacan": false, "zasto": "Parlament je imao glavnu ulogu u političkom životu zemlje."}, {"tekst": "Svi poslanici su bili sveštenici", "tacan": false, "zasto": "Gornji dom je krupno plemstvo, Donji dom sitno plemstvo i bogato građanstvo."}, {"tekst": "Kralj je i dalje vladao apsolutistički", "tacan": false, "zasto": "Posle Povelje o pravima kralj vlada u skladu sa odlukama parlamenta."}], "pomoc": ["Korak 1: Koliko je ljudi moglo da glasa?", "Korak 2: Ko je imao poslednju reč o odlukama Donjeg doma?", "Iz lekcije: mali deo stanovništva ima pravo glasa; Gornji dom odobrava odluke Donjeg doma."], "objasnjenje": "Glasao je samo mali deo stanovništva, a nasledni Gornji dom je odobravao odluke izabranog Donjeg doma — moć je ostajala u rukama malobrojnih.", "iz_udzbenika": {"strana": 41, "odeljak": "Stvaranje parlamentarne monarhije", "tekst": "Pravo glasa je imao mali deo stanovništva, a odluke Donjeg doma morao je da odobri Gornji dom."}, "lekcija": 5}, {"id": "l05-parl-zakljuci-dve-revolucije", "vrsta": "zakljuci", "tezina": "srednje", "pojmovi": ["slavna-revolucija", "gradjanski-rat-u-engleskoj"], "pitanje": "Po čemu se Slavna revolucija (1688) najviše razlikuje od Građanskog rata (1642–1649)?", "odgovori": [{"tekst": "Prošla je bez nasilja, a završila se trajnim dogovorom — kralj prihvata vlast parlamenta", "tacan": true}, {"tekst": "U njoj je pogubljen kralj", "tacan": false, "zasto": "Kralj je pogubljen posle Građanskog rata, ne 1688."}, {"tekst": "Posle nje Engleska je postala republika", "tacan": false, "zasto": "Republika je bila posle Građanskog rata; 1688–1689. nastaje parlamentarna monarhija."}, {"tekst": "Vodili su je američki kolonisti", "tacan": false, "zasto": "Obe su engleski događaji; kolonisti se bune tek 1775."}], "pomoc": ["Korak 1: Kako se završio Građanski rat — za kralja i za državu?", "Korak 2: Šta je 1688–1689. bilo drugačije: krv, ishod?", "Iz lekcije: Beskrvna revolucija bez sukoba i nasilja → Povelja o pravima → parlamentarna monarhija."], "objasnjenje": "Građanski rat je krvav i daje republiku pod Kromvelom; Slavna revolucija je bez nasilja i daje parlamentarnu monarhiju.", "iz_udzbenika": {"strana": 41, "odeljak": "Stvaranje parlamentarne monarhije", "tekst": "Slavna revolucija prošla je bez sukoba i nasilja i dovela do parlamentarne monarhije."}, "lekcija": 5}, {"id": "l05-parl-lanac-monarhija", "vrsta": "lanac", "tezina": "lako", "pojmovi": ["slavna-revolucija", "povelja-o-pravima", "parlamentarna-monarhija"], "karike": ["Slavna revolucija (1688)", "Kralj prihvata Povelju o pravima (1689)", "?"], "praznina": 2, "odgovori": [{"tekst": "U Engleskoj je uspostavljena parlamentarna monarhija", "tacan": true}, {"tekst": "Engleska je proglašena republikom", "tacan": false, "zasto": "Republika je bila posle Građanskog rata; Povelja zadržava kralja."}, {"tekst": "Kralj ponovo vlada apsolutistički", "tacan": false, "zasto": "Povelja upravo ograničava kralja odlukama parlamenta."}], "pomoc": ["Kralj ostaje, ali mora da poštuje parlament.", "Kako se zove takva monarhija?", "Iz lekcije: tako je u Engleskoj uspostavljena parlamentarna monarhija."], "objasnjenje": "Povelja vezuje kralja za odluke parlamenta → parlamentarna monarhija.", "iz_udzbenika": {"strana": 41, "odeljak": "Stvaranje parlamentarne monarhije", "tekst": "Povelja o pravima obavezuje vladara na odluke parlamenta i tako nastaje parlamentarna monarhija."}, "osa": {"naziv": "Povelja o pravima", "od": 1689, "traka": "dogadjaji"}, "lekcija": 5}, {"id": "l05-parl-lanac-vlada", "vrsta": "lanac", "tezina": "srednje", "pojmovi": ["donji-dom", "vlada", "vigovci", "torijevci"], "karike": ["Stranka dobija najviše poslanika na izborima za Donji dom", "?", "Vlada podnosi izveštaje o svom radu parlamentu"], "praznina": 1, "odgovori": [{"tekst": "Ta stranka dobija priliku da sastavi vladu", "tacan": true}, {"tekst": "Kralj raspušta parlament", "tacan": false, "zasto": "Posle Povelje o pravima kralj vlada u skladu sa parlamentom."}, {"tekst": "Gornji dom bira predsednika", "tacan": false, "zasto": "U Britaniji nema predsednika — na čelu je kralj, a vladu sastavlja pobednička stranka."}], "pomoc": ["Šta dobija pobednik izbora?", "Pobednik izbora vodi državne poslove.", "Iz lekcije: stranka sa najviše poslanika sastavlja vladu."], "objasnjenje": "Pobednička stranka u Donjem domu sastavlja vladu, a vlada odgovara parlamentu.", "iz_udzbenika": {"strana": 41, "odeljak": "Stvaranje parlamentarne monarhije", "tekst": "Stranka sa najviše poslanika u Donjem domu dobija mogućnost da sastavi vladu."}, "lekcija": 5}, {"id": "l05-parl-izvor-zakoni", "vrsta": "izvor", "tezina": "lako", "pojmovi": ["povelja-o-pravima", "parlament"], "izvor": {"autor": "Povelja o pravima, 1689.", "naslov": "Prava i slobode (sažetak odlomka)", "tekst": "Nezakonito je da kraljevska vlast bez pristanka parlamenta obustavlja zakone ili ih primenjuje po svom nahođenju. Izbori za članove parlamenta treba da budu slobodni.", "napomena": "Odlomak je prepričan; udžbenik, str. 41."}, "pitanje": "Čiji je pristanak, prema ovom odlomku, potreban da bi se zakon obustavio?", "odgovori": [{"tekst": "Parlamenta", "tacan": true}, {"tekst": "Samo kralja", "tacan": false, "zasto": "Upravo to Povelja zabranjuje — kralj ne može sam."}, {"tekst": "Pape", "tacan": false, "zasto": "Crkva se u odlomku ne pominje."}, {"tekst": "Američkih kolonista", "tacan": false, "zasto": "Kolonisti nisu imali predstavnike u britanskom parlamentu."}], "pomoc": ["Pročitaj prvu rečenicu odlomka.", "Bez čijeg pristanka je to nezakonito?", "Iz lekcije: kralj ne može bez pristanka parlamenta da obustavi ili primeni zakone."], "objasnjenje": "Povelja zahteva pristanak parlamenta — kralj više ne može sam da menja ili obustavlja zakone.", "iz_udzbenika": {"strana": 41, "odeljak": "Svedočanstvo: Povelja o pravima", "tekst": "Povelja zabranjuje kralju da bez pristanka parlamenta obustavlja ili primenjuje zakone."}, "lekcija": 5}, {"id": "l05-parl-izvor-sloboda-govora", "vrsta": "izvor
