i kako je Napoleon izgubio vlast — od Lajpciga do Svete Jelene.", "uzor": "Oslabljena posle Rusije, Francuska je 1813. izgubila Bitku naroda kod Lajpciga. Saveznici su ušli u Pariz, a Napoleon se 1814. odrekao prestola i otišao na Elbu. U proleće 1815. vratio se na „sto dana”, ali je kod Vaterloa konačno poražen, predao se Britancima i do smrti 1821. živeo na Svetoj Jeleni.", "ideje": ["Poraz kod Lajpciga 1813.", "Odricanje 1814. i progonstvo na Elbu.", "Sto dana i poraz kod Vaterloa 1815.", "Sveta Jelena do smrti 1821."], "objasnjenje": "Pad je trajao od 1813. do 1815: Lajpcig, Elba, sto dana, Vaterlo, Sveta Jelena.", "iz_udzbenika": {"strana": 58, "odeljak": "Napoleonov pad", "tekst": "Napoleon je posle Lajpciga izgubio vlast, vratio se na sto dana i konačno pao kod Vaterloa."}, "lekcija": 7}, {"id": "l07-pad-objasni-vojska-slika", "vrsta": "objasni", "tezina": "lako", "pojmovi": ["pohod-na-rusiju"], "pitanje": "Opiši izgled Napoleonove vojske na slici povratka iz Rusije i reci zašto je takva.", "uzor": "Vojnici su umorni, promrzli i umotani u šta su stigli, a mnogi leže mrtvi u snegu, kao i konji. Takvi su jer su ih tokom povlačenja uništili oštra zima i ruski napadi.", "ideje": ["Vojnici su iscrpljeni i promrzli.", "Mnogo je mrtvih ljudi i konja.", "Uzrok su oštra zima i ruski napadi."], "objasnjenje": "Slika pokazuje posledicu pohoda: vojska je skoro potpuno uništena.", "iz_udzbenika": {"strana": 58, "odeljak": "Povratak Napoleonove vojske iz Rusije", "tekst": "Udžbenik traži da opišeš izgled Napoleonove vojske na slici povratka iz Rusije.", "slika": "07-napoleonovo-doba/07-povratak-iz-rusije.jpg"}, "lekcija": 7}]}, {"naslov": "7. Bečki kongres", "zadaci": [{"id": "l07-kongres-izbor-sile", "vrsta": "izbor", "tezina": "lako", "pojmovi": ["becki-kongres", "rusija", "austrija", "pruska", "velika-britanija"], "pitanje": "Koje sile su imale vodeću ulogu na Bečkom kongresu? (više tačnih)", "odgovori": [{"tekst": "Rusija", "tacan": true}, {"tekst": "Austrija", "tacan": true}, {"tekst": "Pruska", "tacan": true}, {"tekst": "Velika Britanija", "tacan": true}, {"tekst": "Osmansko carstvo", "tacan": false, "zasto": "Osmansko carstvo nije bilo među silama pobednicama koje su vodile kongres."}, {"tekst": "Švajcarska", "tacan": false, "zasto": "Švajcarska je bila mala država, a ne sila pobednica."}], "pomoc": ["Vodile su ga sile koje su pobedile Napoleona.", "Tri sile su kasnije stvorile Svetu alijansu, a četvrta je vladala morem.", "Iz lekcije: Rusija, Austrija, Pruska i Velika Britanija."], "objasnjenje": "Bečki kongres vodile su sile pobednice: Rusija, Austrija, Pruska i Velika Britanija.", "iz_udzbenika": {"strana": 58, "odeljak": "Bečki kongres", "tekst": "Vodeću ulogu imale su sile pobednice: Rusija, Austrija, Pruska i Velika Britanija."}, "lekcija": 7}, {"id": "l07-kongres-datum", "vrsta": "datum", "tezina": "lako", "pojmovi": ["becki-kongres"], "dogadjaj": "Bečki kongres", "pitanje": "Od koje do koje godine je zasedao Bečki kongres?", "od": 1814, "do": 1815, "traka": "dogadjaji", "pomoc": ["Počeo je posle Napoleonovog prvog odricanja.", "Završio se godine Vaterloa.", "Iz lekcije: Bečki kongres 1814–1815."], "objasnjenje": "Bečki kongres zasedao je 1814–1815.", "iz_udzbenika": {"strana": 58, "odeljak": "Bečki kongres", "tekst": "Posle Napoleonovih ratova zasedao je Bečki kongres (1814–1815)."}, "lekcija": 7}, {"id": "l07-kongres-izbor-cilj", "vrsta": "izbor", "tezina": "lako", "pojmovi": ["becki-kongres", "francuska-revolucija"], "pitanje": "Šta je Bečki kongres odlučio o poretku u evropskim državama?", "odgovori": [{"tekst": "Da se vrati poredak od pre Francuske revolucije", "tacan": true}, {"tekst": "Da se svuda uvede Napoleonov Građanski zakonik", "tacan": false, "zasto": "Kongres je hteo da poništi promene iz revolucionarnog i Napoleonovog doba."}, {"tekst": "Da sve države postanu republike", "tacan": false, "zasto": "Vladari su hteli obnovu apsolutizma, ne republike."}, {"tekst": "Da Napoleon ostane car", "tacan": false, "zasto": "Napoleon je zbačen, a u Francusku su vraćeni Burboni."}], "pomoc": ["Vladari su želeli staro stanje.", "Kako je bilo pre 1789?", "Iz lekcije: odlučeno je da se vrati poredak od pre Francuske revolucije."], "objasnjenje": "Kongres je odlučio da se vrati predrevolucionarni poredak — apsolutizam, stare granice i dinastije.", "iz_udzbenika": {"strana": 58, "odeljak": "Bečki kongres", "tekst": "Na kongresu je odlučeno da se vrati poredak iz perioda pre Francuske revolucije."}, "lekcija": 7}, {"id": "l07-kongres-izbor-zelje", "vrsta": "izbor", "tezina": "srednje", "pojmovi": ["becki-kongres", "apsolutizam"], "pitanje": "Šta su želeli evropski vladari na Bečkom kongresu? (više tačnih)", "odgovori": [{"tekst": "Obnovu apsolutizma", "tacan": true}, {"tekst": "Povratak starih granica", "tacan": true}, {"tekst": "Povratak starih dinastija", "tacan": true}, {"tekst": "Širenje ideja Deklaracije o pravima čoveka", "tacan": false, "zasto": "Te ideje su se širile uprkos vladarima — oni su hteli staro stanje."}, {"tekst": "Ujedinjenje Italije", "tacan": false, "zasto": "Italijanske državice ostale su razjedinjene."}], "pomoc": ["Sve što žele vezano je za reč „staro”.", "Neograničena vlast vladara zove se…", "Iz lekcije: obnova apsolutizma i povratak starih granica i dinastija."], "objasnjenje": "Vladari su hteli apsolutizam, stare granice i stare dinastije.", "iz_udzbenika": {"strana": 58, "odeljak": "Bečki kongres", "tekst": "Evropski vladari želeli su obnovu apsolutizma i povratak starih granica i dinastija."}, "lekcija": 7}, {"id": "l07-kongres-izbor-luj", "vrsta": "izbor", "tezina": "lako", "pojmovi": ["luj-xviii", "burboni"], "pitanje": "Ko je posle Napoleona postao kralj Francuske?", "odgovori": [{"tekst": "Luj XVIII, brat Luja XVI", "tacan": true}, {"tekst": "Aleksandar I", "tacan": false, "zasto": "Aleksandar I je bio ruski car; na karikaturi samo vraća krunu Luju XVIII."}, {"tekst": "Napoleonov sin", "tacan": false, "zasto": "Kongres je vratio staru dinastiju Burbon."}, {"tekst": "Admiral Nelson", "tacan": false, "zasto": "Nelson je bio britanski admiral i poginuo je 1805."}], "pomoc": ["Vraćena je stara kraljevska dinastija.", "On je brat pogubljenog kralja.", "Iz lekcije: kralj je postao Luj XVIII, brat Luja XVI."], "objasnjenje": "Na vlast je vraćena dinastija Burbon — kralj je postao Luj XVIII, brat Luja XVI.", "iz_udzbenika": {"strana": 58, "odeljak": "Bečki kongres", "tekst": "U Francuskoj je vraćena dinastija Burbon, a novi kralj postao je Luj XVIII, brat Luja XVI."}, "lekcija": 7}, {"id": "l07-kongres-tn-granice", "vrsta": "tacno_netacno", "tezina": "srednje", "pojmovi": ["becki-kongres"], "tvrdnja": "Bečki kongres je odlučio da se državne granice vrate na stanje iz 1792.", "tacno": true, "pomoc": ["To je godina pre velikih francuskih osvajanja.", "Iz lekcije: granice se vraćaju na stanje iz 1792."], "objasnjenje": "Tačno — granice su vraćene na stanje iz 1792.", "iz_udzbenika": {"strana": 58, "odeljak": "Bečki kongres", "tekst": "Bečki kongres je odlučio da se granice vrate na stanje iz 1792."}, "lekcija": 7}, {"id": "l07-kongres-tn-male-drzave", "vrsta": "tacno_netacno", "tezina": "srednje", "pojmovi": ["becki-kongres"], "tvrdnja": "Na Bečkom kongresu male države su dobile nove teritorije od sila pobednica.", "tacno": false, "ispravke": [{"tekst": "Mnoge manje države su nestale, a njihove teritorije pripojene su silama pobednicama.", "tacan": true}, {"tekst": "Male države su ujedinjene u jednu veliku republiku.", "tacan": false, "zasto": "Republike nisu stvarane — vraćen je stari poredak."}, {"tekst": "Sve male države ostale su potpuno iste kao pod Napoleonom.", "tacan": false, "zasto": "Mnoge su nestale; granice su vraćene na 1792."}], "pomoc": ["Ko je dobio, a ko izgubio na kongresu?", "Iz lekcije: mnoge manje države su nestale, a njihove teritorije pripale su pobednicima."], "objasnjenje": "Netačno — dobile su sile pobednice; mnoge manje države su nestale.", "iz_udzbenika": {"strana": 58, "odeljak": "Bečki kongres", "tekst": "Mnoge manje države su nestale, a njihove teritorije pripojene su silama pobednicama."}, "lekcija": 7}, {"id": "l07-kongres-tn-italija", "vrsta": "tacno_netacno", "tezina": "lako", "pojmovi": ["becki-kongres", "italija"], "tvrdnja": "Posle Bečkog kongresa italijanske državice ostale su razjedinjene.", "tacno": true, "pomoc": ["Pogledaj kartu: koliko država ima na Apeninskom poluostrvu?", "Iz lekcije: italijanske državice ostale su razjedinjene."], "objasnjenje": "Tačno — Italija je ostala podeljena na više državica.", "iz_udzbenika": {"strana": 58, "odeljak": "Bečki kongres", "tekst": "Italijanske državice ostale su razjedinjene."}, "lekcija": 7}, {"id": "l07-kongres-dopuni", "vrsta": "dopuni", "tezina": "lako", "pojmovi": ["becki-kongres", "burboni", "luj-xviii", "nemacka-konfederacija"], "pitanje": "Dopuni rečenice o Bečkom kongresu.", "tekst": "U Francuskoj je na vlast vraćena dinastija {{Burbon}}, a kralj je postao {{Luj XVIII}}. Tridesetak nemačkih država udruženo je u {{Nemačku konfederaciju}}.", "ponudjene": ["Burbon", "Habzburg", "Luj XVIII", "Luj XVI", "Nemačku konfederaciju", "Rajnski savez"], "pomoc": ["Luj XVI je pogubljen u revoluciji — kralj je postao njegov brat.", "Rajnski savez je bio Napoleonova tvorevina.", "Iz lekcije: Burboni, Luj XVIII, Nemačka konfederacija."], "objasnjenje": "Burboni su vraćeni (Luj XVIII), a nemačke države udružene u Nemačku konfederaciju.", "iz_udzbenika": {"strana": 58, "odeljak": "Bečki kongres", "tekst": "Vraćeni su Burboni sa Lujem XVIII, a tridesetak nemačkih država udruženo je u Nemačku konfederaciju."}, "lekcija": 7}, {"id": "l07-kongres-dopuni-tesko", "vrsta": "dopuni", "tezina": "tesko", "pojmovi": ["becki-kongres"], "pitanje": "Dopuni bez ponuđenih reči.", "tekst": "Bečki kongres je vratio granice na stanje iz {{1792}}. godine, a oko {{trideset|tridesetak|30}} nemačkih država udružio je u Nemačku konfederaciju.", "pomoc": ["Godina je tri godine posle početka Francuske revolucije.", "Broj nemačkih država je nekoliko desetina.", "Iz lekcije: granice iz 1792; tridesetak nemačkih država."], "objasnjenje": "Granice su vraćene na 1792, a tridesetak nemačkih država činilo je Nemačku konfederaciju.", "iz_udzbenika": {"strana": 58, "odeljak": "Bečki kongres", "tekst": "Granice su vraćene na stanje iz 1792, a tridesetak nemačkih država udruženo je u Nemačku konfederaciju."}, "lekcija": 7}, {"id": "l07-kongres-izbor-alijansa", "vrsta": "izbor", "tezina": "lako", "pojmovi": ["sveta-alijansa", "alijansa"], "pitanje": "Šta znači reč „alijansa”?", "odgovori": [{"tekst": "Savez", "tacan": true}, {"tekst": "Rat", "tacan": false, "zasto": "Alijansa je savez, a ne rat."}, {"tekst": "Zakon", "tacan": false, "zasto": "Zakon je, na primer, Građanski zakonik; alijansa znači savez."}, {"tekst": "Kruna", "tacan": false, "zasto": "Alijansa znači savez."}], "pomoc": ["Sveta alijansa je bila udruženje vladara.", "Isto što i koalicija — udruživanje.", "Iz lekcije: alijansa — savez."], "objasnjenje": "Alijansa znači savez.", "iz_udzbenika": {"strana": 59, "odeljak": "Bečki kongres", "tekst": "U rečniku lekcije: alijansa — savez."}, "lekcija": 7}, {"id": "l07-kongres-izbor-alijansa-osnivaci", "vrsta": "izbor", "tezina": "srednje", "pojmovi": ["sveta-alijansa", "rusija", "austrija", "pruska", "velika-britanija"], "pitanje": "Pod vođstvom kojih vladara je stvorena Sveta alijansa? (više tačnih)", "odgovori": [{"tekst": "Ruskog", "tacan": true}, {"tekst": "Austrijskog", "tacan": true}, {"tekst": "Pruskog", "tacan": true}, {"tekst": "Britanskog", "tacan": false, "zasto": "Britanija je bila na Bečkom kongresu, ali Svetu alijansu udžbenik vezuje za vladare Rusije, Austrije i Pruske."}, {"tekst": "Francuskog", "tacan": false, "zasto": "Francuska je bila poražena strana."}], "pomoc": ["Tri istočne monarhije.", "Jedna od četiri sile pobednice nije na spisku.", "Iz lekcije: pod vođstvom vladara Rusije, Austrije i Pruske."], "objasnjenje": "Svetu alijansu stvorili su vladari Rusije, Austrije i Pruske.", "iz_udzbenika": {"strana": 59, "odeljak": "Bečki kongres", "tekst": "Pod vođstvom vladara Rusije, Austrije i Pruske stvorena je Sveta alijansa."}, "lekcija": 7}, {"id": "l07-kongres-uporedi-ciljevi", "vrsta": "uporedi", "tezina": "srednje", "pojmovi": ["sveta-alijansa"], "a": "Zvanični cilj Svete alijanse", "b": "Tajni cilj Svete alijanse", "pitanje": "Da li je navedeno zvanični cilj, tajni cilj, oba ili nijedno?", "tvrdnje": [{"tekst": "Očuvanje mira u Evropi", "odgovor": "a", "zasto": "To je bio javno izrečen cilj."}, {"tekst": "Sprečavanje novih revolucija, makar i silom", "odgovor": "b", "zasto": "To je bio tajni cilj."}, {"tekst": "Širenje ideja Francuske revolucije", "odgovor": "nijedan", "zasto": "Alijansa je htela upravo suprotno — da guši revolucije."}, {"tekst": "Povratak Napoleona na vlast", "odgovor": "nijedan", "zasto": "Sile su Napoleona proglasile pretnjom miru."}], "pomoc": ["Šta se kaže javno, a šta se krije?", "Vladari su se bojali revolucija.", "Iz lekcije: zvanično — mir; tajno — sprečiti revolucije."], "objasnjenje": "Zvanično mir, a tajno gušenje revolucija, i to silom ako treba.", "iz_udzbenika": {"strana": 59, "odeljak": "Bečki kongres", "tekst": "Zvanični cilj alijanse bio je očuvanje mira, a tajni sprečavanje novih revolucija."}, "lekcija": 7}, {"id": "l07-kongres-zakljuci-tajni", "vrsta": "zakljuci", "tezina": "tesko", "pojmovi": ["sveta-alijansa", "apsolutizam", "francuska-revolucija"], "pitanje": "Zašto su vladari Svete alijanse hteli da spreče nove revolucije?", "odgovori": [{"tekst": "Revolucije su rušile apsolutizam i stare dinastije, a oni su ih upravo obnovili", "tacan": true}, {"tekst": "Revolucije su donosile mir u Evropi", "tacan": false, "zasto": "Upravo su posle revolucije usledili dugi ratovi."}, {"tekst": "Revolucionari su hteli da vrate Burbone", "tacan": false, "zasto": "Burbone je vratio Bečki kongres; revolucija ih je oborila."}, {"tekst": "Revolucije su jačale vlast careva", "tacan": false, "zasto": "Francuska revolucija je srušila apsolutnog kralja."}], "pomoc": ["Korak 1: Šta je Francuska revolucija uradila sa kraljem i apsolutizmom?", "Korak 2: Šta je Bečki kongres obnovio?", "Iz lekcije: vladari su želeli obnovu apsolutizma, a tajni cilj alijanse bio je sprečiti revolucije."], "objasnjenje": "Vladari koji su obnovili apsolutizam bojali su se da bi nova revolucija ponovo srušila njihovu vlast.", "iz_udzbenika": {"strana": 59, "odeljak": "Bečki kongres", "tekst": "Tajni cilj Svete alijanse bio je da se spreče nove revolucije, makar i silom."}, "lekcija": 7}, {"id": "l07-kongres-izbor-reforme", "vrsta": "izbor", "tezina": "srednje", "pojmovi": ["becki-kongres", "holandija", "rajna"], "pitanje": "Gde su, uprkos Bečkom kongresu, opstale reforme iz Napoleonovog doba? (više tačnih)", "odgovori": [{"tekst": "U Francuskoj", "tacan": true}, {"tekst": "U Holandiji", "tacan": true}, {"tekst": "U nemačkim zemljama na Rajni", "tacan": true}, {"tekst": "U državama severne Italije", "tacan": true}, {"tekst": "U Osmanskom carstvu", "tacan": false, "zasto": "Osmansko carstvo nije bilo pod Napoleonom, pa tamo nije bilo njegovih reformi."}, {"tekst": "U Rusiji", "tacan": false, "zasto": "Rusija nije bila pod Napoleonovom vlašću."}], "pomoc": ["Reforme su ostale tamo gde je Napoleon dugo vladao.", "Sve su to zemlje na zapadu Evrope blizu Francuske.", "Iz lekcije: Francuska, Holandija, nemačke zemlje na Rajni, severna Italija."], "objasnjenje": "U Francuskoj, Holandiji, nemačkim zemljama na Rajni i severnoj Italiji opstale su reforme u privredi, sudstvu, upravi i vojsci.", "iz_udzbenika": {"strana": 59, "odeljak": "Bečki kongres", "tekst": "U Francuskoj, Holandiji, nemačkim zemljama na Rajni i severnoj Italiji opstale su razne reforme."}, "lekcija": 7}, {"id": "l07-kongres-tn-povratak", "vrsta": "tacno_netacno", "tezina": "tesko", "pojmovi": ["becki-kongres", "deklaracija-o-pravima-coveka-i-gradjanina"], "tvrdnja": "Bečki kongres je uspeo da potpuno vrati Evropu u stanje pre Francuske revolucije.", "tacno": false, "ispravke": [{"tekst": "Potpun povratak nije bio moguć — reforme i ideje revolucije ostavile su dubok trag.", "tacan": true}, {"tekst": "Kongres nije ni pokušavao da vrati stari poredak.", "tacan": false, "zasto": "Pokušavao je — to mu je bio glavni cilj."}, {"tekst": "Kongres je uveo Deklaraciju o pravima čoveka u celu Evropu.", "tacan": false, "zasto": "Deklaracija je delo revolucije; kongres je hteo da je poništi."}], "pomoc": ["Šta se dogodilo sa reformama u privredi, sudstvu i vojsci?", "Iz lekcije: potpun povratak na staro nije bio moguć."], "objasnjenje": "Netačno — reforme su opstale, a ideje revolucije i Deklaracije ostavile su dubok trag u Evropi.", "iz_udzbenika": {"strana": 59, "odeljak": "Bečki kongres", "tekst": "Iako su sile učinile sve za povratak na staro, potpun povratak nije bio moguć."}, "lekcija": 7}, {"id": "l07-kongres-lanac-alijansa", "vrsta": "lanac", "tezina": "lako", "pojmovi": ["becki-kongres", "sveta-alijansa"], "karike": ["Bečki kongres obnavlja apsolutizam i stare dinastije", "?", "Nastaje Sveta alijansa koja treba da spreči nove revolucije"], "praznina": 1, "odgovori": [{"tekst": "Vladari se boje da bi nove revolucije srušile obnovljeni poredak", "tacan": true}, {"tekst": "Vladari žele da Napoleon ponovo zavlada", "tacan": false, "zasto": "Napoleona su proglasili pretnjom miru."}, {"tekst": "Vladari žele da prošire ideje Deklaracije", "tacan": false, "zasto": "Ideje Deklaracije su ugrožavale apsolutizam."}], "pomoc": ["Korak 1: Šta je revolucija uradila sa starim poretkom?", "Korak 2: Čega se zato boje vladari?", "Iz lekcije: tajni cilj alijanse bio je sprečiti nove revolucije."], "objasnjenje": "Obnovljeni poredak trebalo je zaštititi od novih revolucija — otuda Sveta alijansa.", "iz_udzbenika": {"strana": 59, "odeljak": "Bečki kongres", "tekst": "Vladari Rusije, Austrije i Pruske stvorili su Svetu alijansu da spreče nove revolucije."}, "lekcija": 7}, {"id": "l07-kongres-lanac-trag", "vrsta": "lanac", "tezina": "srednje", "pojmovi": ["deklaracija-o-pravima-coveka-i-gradjanina", "francuska-revolucija", "becki-kongres"], "karike": ["Napoleon u pokorenim zemljama sprovodi reforme po idejama revolucije", "Reforme se ukorenjuju u Francuskoj, Holandiji, na Rajni i u severnoj Italiji", "?"], "praznina": 2, "odgovori": [{"tekst": "Bečki kongres ne može potpuno da vrati staro stanje", "tacan": true}, {"tekst": "Bečki kongres sve reforme lako ukida", "tacan": false, "zasto": "Reforme su opstale — potpun povratak nije bio moguć."}, {"tekst": "Napoleon se zato vraća na presto zauvek", "tacan": false, "zasto": "Napoleon je umro u progonstvu 1821."}], "pomoc": ["Korak 1: Mogu li se lako ukinuti promene na koje su se ljudi navikli?", "Korak 2: Šta kaže udžbenik o povratku na staro?", "Iz lekcije: potpun povratak nije bio moguć; ideje revolucije ostavile su dubok trag."], "objasnjenje": "Ukorenjene reforme i ideje nisu se mogle izbrisati — Evropa se nije vratila u stanje pre 1789.", "iz_udzbenika": {"strana": 59, "odeljak": "Bečki kongres", "tekst": "U više zemalja opstale su reforme u privredi, sudstvu, upravi i vojsci."}, "lekcija": 7}, {"id": "l07-kongres-povezi", "vrsta": "povezi", "tezina": "lako", "pojmovi": ["becki-kongres", "sveta-alijansa", "nemacka-konfederacija", "luj-xviii"], "pitanje": "Poveži pojam sa objašnjenjem.", "parovi": [["Bečki kongres", "Skup pobednika 1814–1815."], ["Sveta alijansa", "Savez Rusije, Austrije i Pruske"], ["Nemačka konfederacija", "Tridesetak udruženih nemačkih država"], ["Luj XVIII", "Burbonski kralj vraćen u Francusku"]], "pomoc": ["Jedan je skup, jedan savez, jedan udruženje država, jedan čovek.", "Alijansa znači savez.", "Iz lekcije: kongres 1814–1815, Sveta alijansa, Nemačka konfederacija, Luj XVIII."], "objasnjenje": "Kongres — pobednici; Sveta alijansa — savez tri vladara; Nemačka konfederacija — nemačke države; Luj XVIII — vraćeni kralj.", "iz_udzbenika": {"strana": 59, "odeljak": "Bečki kongres", "tekst": "Bečki kongres doneo je povratak Burbona, Nemačku konfederaciju i Svetu alijansu."}, "lekcija": 7}, {"id": "l07-kongres-uporedi-rajnski-nemacka", "vrsta": "uporedi", "tezina": "tesko", "pojmovi": ["rajnski-savez", "nemacka-konfederacija"], "a": "Rajnski savez", "b": "Nemačka konfederacija", "pitanje": "Na koju tvorevinu se odnosi tvrdnja — Rajnski savez, Nemačka konfederacija, obe ili nijednu?", "tvrdnje": [{"tekst": "Stvorio ju je Napoleon.", "odgovor": "a", "zasto": "Napoleon je manje nemačke države okupio u Rajnski savez."}, {"tekst": "Nastala je odlukom Bečkog kongresa.", "odgovor": "b", "zasto": "Na Bečkom kongresu tridesetak nemačkih država udruženo je u Nemačku konfederaciju."}, {"tekst": "Okupljala je nemačke države.", "odgovor": "oba", "zasto": "Oba saveza su udruživala nemačke države."}, {"tekst": "Na karti Napoleonove Evrope obojena je kao zavisna od Napoleona.", "odgovor": "a", "zasto": "Rajnski savez je svetloplav — zavisan od Napoleona."}, {"tekst": "Bila je jedinstvena nemačka država sa jednim kraljem.", "odgovor": "nijedan", "zasto": "Oba su bila saveza više država, a ne jedna država."}], "pomoc": ["Jedan savez je iz Napoleonovog doba, drugi posle njega.", "Ko je kada pobeđivao?", "Iz lekcije: Rajnski savez — Napoleon; Nemačka konfederacija — Bečki kongres."], "objasnjenje": "Rajnski savez je Napoleonova tvorevina, a Nemačka konfederacija tvorevina Bečkog kongresa — oba su savezi nemačkih država.", "iz_udzbenika": {"strana": 58, "odeljak": "Bečki kongres", "tekst": "Bečki kongres udružio je tridesetak nemačkih država u Nemačku konfederaciju."}, "lekcija": 7}, {"id": "l07-kongres-uporedi-napoleon-kongres", "vrsta": "uporedi", "tezina": "srednje", "pojmovi": ["becki-kongres", "prvo-francusko-carstvo", "burboni"], "a": "Napoleonovo doba", "b": "Posle Bečkog kongresa", "pitanje": "Na koje vreme se odnosi tvrdnja — Napoleonovo doba, posle Bečkog kongresa, oba ili nijedno?", "tvrdnje": [{"tekst": "U Francuskoj vlada car.", "odgovor": "a", "zasto": "Napoleon je bio car 1804–1815."}, {"tekst": "U Francuskoj vlada kralj iz dinastije Burbon.", "odgovor": "b", "zasto": "Bečki kongres je vratio Burbone (Luj XVIII)."}, {"tekst": "Postoji Rajnski savez.", "odgovor": "a", "zasto": "Rajnski savez je Napoleonova tvorevina."}, {"tekst": "Italija je podeljena na više država.", "odgovor": "oba", "zasto": "Italija nije bila ujedinjena ni pod Napoleonom ni posle kongresa."}, {"tekst": "Postoji Sveto rimsko carstvo nemačkog naroda.", "odgovor": "nijedan", "zasto": "Ukinuto je 1806, a kongres ga nije obnovio."}], "pomoc": ["Ko je vladao Francuskom pre, a ko posle 1815?", "Sveto rimsko carstvo je ukinuo Napoleon.", "Iz lekcije: posle kongresa Burboni, Nemačka konfederacija, razjedinjena Italija."], "objasnjenje": "Napoleonovo doba: car i Rajnski savez; posle kongresa: Burboni i Nemačka konfederacija; Italija razjedinjena u oba.", "iz_udzbenika": {"strana": 59, "odeljak": "Bečki kongres", "tekst": "Udžbenik traži da uporediš Evropu u Napoleonovo doba i posle Bečkog kongresa."}, "lekcija": 7}, {"id": "l07-kongres-objasni-odluke", "vrsta": "objasni", "tezina": "lako", "pojmovi": ["becki-kongres", "burboni", "luj-xviii"], "pitanje": "Koje su glavne odluke Bečkog kongresa?", "uzor": "Bečki kongres je odlučio da se u Evropi vrati poredak od pre Francuske revolucije. U Francusku su vraćeni Burboni, a kralj je postao Luj XVIII. Granice su vraćene na stanje iz 1792, mnoge male države su nestale, a nemačke države udružene su u Nemačku konfederaciju.", "ideje": ["Povratak poretka od pre revolucije.", "Burboni (Luj XVIII) vraćeni u Francusku.", "Granice iz 1792; male države pripale pobednicima.", "Nemačka konfederacija; Italija razjedinjena."], "objasnjenje": "Kongres je vratio stari poredak, stare dinastije i granice.", "iz_udzbenika": {"strana": 58, "odeljak": "Bečki kongres", "tekst": "Bečki kongres je vratio predrevolucionarni poredak, Burbone i granice iz 1792."}, "lekcija": 7}, {"id": "l07-kongres-objasni-alijansa", "vrsta": "objasni", "tezina": "srednje", "pojmovi": ["sveta-alijansa"], "pitanje": "Šta je bila Sveta alijansa i koji su joj bili ciljevi?", "uzor": "Sveta alijansa bila je savez evropskih država pod vođstvom vladara Rusije, Austrije i Pruske. Zvanični cilj bio je čuvanje mira u Evropi. Tajni cilj bio je da se spreče nove revolucije, pa makar i silom.", "ideje": ["Savez pod vođstvom Rusije, Austrije i Pruske.", "Zvanični cilj: mir u Evropi.", "Tajni cilj: sprečiti revolucije, i silom."], "objasnjenje": "Sveta alijansa je savez vladara koji je, pod izgovorom mira, trebalo da guši revolucije.", "iz_udzbenika": {"strana": 59, "odeljak": "Bečki kongres", "tekst": "Sveta alijansa imala je zvanični cilj očuvanje mira, a tajni sprečavanje revolucija."}, "lekcija": 7}, {"id": "l07-kongres-objasni-trag", "vrsta": "objasni", "tezina": "tesko", "pojmovi": ["becki-kongres", "deklaracija-o-pravima-coveka-i-gradjanina", "francuska-revolucija"], "pitanje": "Zašto potpun povratak na stanje pre Francuske revolucije nije bio moguć?", "uzor": "U Francuskoj, Holandiji, nemačkim zemljama na Rajni i severnoj Italiji opstale su reforme u privredi, sudstvu, upravi i vojsci. Ideje Francuske revolucije i Deklaracije o pravima čoveka i građanina proširile su se Evropom i ostavile dubok trag. Ljudi koji su upoznali slobodu i jednakost nisu se lako odricali tih prava.", "ideje": ["Opstale su reforme u privredi, sudstvu, upravi i vojsci.", "Navedene su zemlje gde su reforme opstale.", "Ideje revolucije i Deklaracije ostavile su dubok trag."], "objasnjenje": "Promene iz revolucionarnog i Napoleonovog doba bile su previše duboke da bi se izbrisale odlukom kongresa.", "iz_udzbenika": {"strana": 59, "odeljak": "Bečki kongres", "tekst": "Reforme su opstale, a ideje revolucije i Deklaracije ostavile su dubok trag širom Evrope."}, "lekcija": 7}, {"id": "l07-kongres-izvor-karikatura", "vrsta": "izvor", "slika_u_pitanju": true, "tezina": "lako", "pojmovi": ["becki-kongres", "napoleon-bonaparta"], "izvor": {"autor": "Karikatura iz 1814.", "naslov": "Bečki kongres (opis karikature)", "tekst": "Vladari stoje oko stola: Napoleon desno vraća teritorije koje je osvojio, ruski car pruža krunu jednom gospodinu, austrijski car trpa zemlje u veliku korpu, pruski kralj se saginje po gradove, a španski kralj levo zadovoljno odlazi.", "napomena": "Opis karikature je prepričan; udžbenik, str. 58."}, "pitanje": "Šta karikatura poručuje o Bečkom kongresu?", "odgovori": [{"tekst": "Pobednici dele teritorije koje je Napoleon morao da vrati", "tacan": true}, {"tekst": "Napoleon osvaja nove zemlje", "tacan": false, "zasto": "On ih upravo vraća — „iskašljava”."}, {"tekst": "Vladari se odriču svih teritorija", "tacan": false, "zasto": "Naprotiv, grabe ih — austrijski car ih trpa u korpu."}, {"tekst": "Kongres je uveo republike", "tacan": false, "zasto": "Vraćeni su kraljevi — ruski car pruža krunu Burbonu."}], "pomoc": ["Šta radi austrijski car sa korpom?", "Šta radi Napoleon?", "Iz lekcije: Napoleon vraća osvojeno, a vladari grabe teritorije."], "objasnjenje": "Karikatura ismeva pobednike koji grabe teritorije koje je Napoleon morao da vrati.", "iz_udzbenika": {"strana": 58, "odeljak": "Karikatura Bečkog kongresa", "tekst": "Karikatura iz 1814. prikazuje kako Napoleon vraća osvojeno, a vladari dele teritorije.", "slika": "07-napoleonovo-doba/08-karikatura-becki-kongres.jpg"}, "lekcija": 7}, {"id": "l07-kongres-povezi-karikatura", "vrsta": "povezi", "slika_u_pitanju": true, "tezina": "srednje", "pojmovi": ["becki-kongres", "aleksandar-i", "luj-xviii"], "pitanje": "Poveži lik na karikaturi Bečkog kongresa sa onim što radi.", "parovi": [["Napoleon (desno)", "Vraća osvojene teritorije"], ["Aleksandar I (zelena uniforma)", "Vraća krunu Luju XVIII"], ["Austrijski car (bela uniforma)", "Ubacuje teritorije u korpu"], ["Pruski kralj", "Saginje se po gradove"], ["Španski kralj (skroz levo)", "Zadovoljno odlazi"]], "pomoc": ["Ruski car je u zelenom, austrijski u belom.", "Napoleon je desno.", "Iz lekcije: potpis karikature opisuje svaki lik."], "objasnjenje": "Svaki vladar na karikaturi grabi svoje, a Napoleon vraća sve što je osvojio.", "iz_udzbenika": {"strana": 58, "odeljak": "Karikatura Bečkog kongresa", "tekst": "Potpis karikature opisuje Napoleona, Aleksandra I, austrijskog cara, pruskog i španskog kralja.", "slika": "07-napoleonovo-doba/08-karikatura-becki-kongres.jpg"}, "lekcija": 7}, {"id": "l07-kongres-izbor-karta-habzburg", "vrsta": "izbor", "slika_u_pitanju": true, "tezina": "tesko", "pojmovi": ["habzburska-monarhija", "venecija", "dubrovnik", "becki-kongres"], "pitanje": "Prema karti Evrope posle Bečkog kongresa, u kojoj državi su se našli Venecija i Dubrovnik?", "odgovori": [{"tekst": "U Habzburškoj monarhiji", "tacan": true}, {"tekst": "U Francuskoj", "tacan": false, "zasto": "Francuska je vraćena u stare granice; Ilirske provincije su nestale."}, {"tekst": "U Osmanskom carstvu", "tacan": false, "zasto": "Osmanska granica je južnije, kod Beograda."}, {"tekst": "U Papskoj državi", "tacan": false, "zasto": "Papska država je u srednjoj Italiji, oko Rima."}], "pomoc": ["Pogledaj boju Venecije i obale Jadrana.", "Ista boja kao Beč.", "Iz lekcije: na karti su Venecija i Dalmacija do Dubrovnika u Habzburškoj monarhiji."], "objasnjenje": "Posle kongresa Venecija i Dalmacija sa Dubrovnikom pripale su Habzburškoj monarhiji — sili pobednici.", "iz_udzbenika": {"strana": 59, "odeljak": "Karta: Evropa posle Bečkog kongresa", "tekst": "Na karti posle Bečkog kongresa Venecija i Dubrovnik su u Habzburškoj monarhiji.", "slika": "07-napoleonovo-doba/09-karta-evropa-posle-beckog-kongresa.jpg"}, "lekcija": 7}, {"id": "l07-kongres-tn-karta-italija", "vrsta": "tacno_netacno", "slika_u_pitanju": true, "tezina": "srednje", "pojmovi": ["italija", "becki-kongres"], "tvrdnja": "Na karti posle Bečkog kongresa na Apeninskom poluostrvu vide se Savoja, Toskana, Papska država i Kraljevina Dveju Sicilija.", "tacno": true, "pomoc": ["Prebroj države od severa do juga Italije.", "Iz lekcije: italijanske državice ostale su razjedinjene."], "objasnjenje": "Tačno — Italija je podeljena na više državica, a sever je pod Habzburzima.", "iz_udzbenika": {"strana": 59, "odeljak": "Karta: Evropa posle Bečkog kongresa", "tekst": "Karta pokazuje razjedinjene italijanske države.", "slika": "07-napoleonovo-doba/09-karta-evropa-posle-beckog-kongresa.jpg"}, "lekcija": 7}, {"id": "l07-betoven-ko-sam", "vrsta": "ko_sam", "tezina": "lako", "pojmovi": ["ludvig-van-betoven", "eroika"], "tragovi": ["Bio sam nemački kompozitor.", "Oduševila me je Francuska revolucija i njene ideje.", "Svoju Simfoniju br. 3 nazvao sam Eroika i posvetio je Napoleonu, pa posvetu uklonio."], "odgovori": [{"tekst": "Ludvig van Betoven", "tacan": true}, {"tekst": "Žak-Luj David", "tacan": false, "zasto": "David je bio slikar koji je slikao Napoleona."}, {"tekst": "Admiral Nelson", "tacan": false, "zasto": "Nelson je bio britanski admiral."}, {"tekst": "Aleksandar I", "tacan": false, "zasto": "Aleksandar I je bio ruski car."}], "objasnjenje": "To je Ludvig van Betoven, autor simfonije Eroika.", "iz_udzbenika": {"strana": 59, "odeljak": "Znatiželja: Betovenova Eroika", "tekst": "Betoven je Simfoniju br. 3 nazvao Eroika i napisao je u Napoleonovu čast."}, "lekcija": 7}, {"id": "l07-betoven-zakljuci", "vrsta": "zakljuci", "tezina": "srednje", "pojmovi": ["ludvig-van-betoven", "eroika", "napoleon-bonaparta"], "pitanje": "Šta je razočaralo Betovena i zašto je uklonio posvetu Napoleonu?", "odgovori": [{"tekst": "Napoleon se 1804. proglasio za cara, a Betoven ga je video kao nastavljača ideja revolucije", "tacan": true}, {"tekst": "Napoleon je izgubio kod Vaterloa", "tacan": false, "zasto": "Betoven se razočarao 1804, deset godina pre Vaterloa."}, {"tekst": "Napoleon je zabranio muziku", "tacan": false, "zasto": "O tome nema reči; razlog je proglašenje carstva."}, {"tekst": "Napoleon je napao Rusiju", "tacan": false, "zasto": "Pohod na Rusiju bio je 1812, a posveta je uklonjena 1804."}], "pomoc": ["Korak 1: Šta je Betoven cenio kod Napoleona?", "Korak 2: Da li se carska kruna slaže sa idejama slobode i jednakosti?", "Iz lekcije: kad se Napoleon 1804. proglasio za cara, Betoven je uklonio posvetu."], "objasnjenje": "Betoven je u Napoleonu video čuvara revolucije; carska kruna mu je izgledala kao izdaja tih ideja.", "iz_udzbenika": {"strana": 59, "odeljak": "Znatiželja: Betovenova Eroika", "tekst": "Kada se Napoleon 1804. proglasio za cara, Betoven se razočarao i uklonio posvetu."}, "lekcija": 7}, {"id": "l07-betoven-tn", "vrsta": "tacno_netacno", "tezina": "lako", "pojmovi": ["ludvig-van-betoven", "eroika"], "tvrdnja": "Betoven je svoju simfoniju Eroika napisao u čast Napoleona.", "tacno": true, "pomoc": ["Šta je Betoven prvo nameravao, pre razočaranja?", "Iz lekcije: Eroiku je napisao u Napoleonovu čast, a posvetu je kasnije uklonio."], "objasnjenje": "Tačno — napisao ju je u Napoleonovu čast, a 1804. uklonio posvetu.", "iz_udzbenika": {"strana": 59, "odeljak": "Znatiželja: Betovenova Eroika", "tekst": "Betoven je Eroiku napisao u Napoleonovu čast."}, "lekcija": 7}]}], "baza": {}, "sastav": {"pitanja": 25, "odnos": [40, 40, 20]}, "osa": {"od": 1640, "do": 1830, "trake": [{"id": "dogadjaji", "label": "Događaji", "color": "#b1271f"}, {"id": "vladari", "label": "Vladari", "color": "#3a6ba5"}, {"id": "ideje", "label": "Ideje i dokumenti", "color": "#1f7a3a"}]}};

  if (!s.miss) return '<div class="hl"><h3>Kako se radi</h3><p class="placeholder">' + esc(UPUTSTVO[z.vrsta]) + '</p><p class="placeholder">U rezultat ide tvoj prvi odgovor. Posle greške ovde stiže pomoć, da nađeš tačan odgovor.</p></div>';
  const shown = (z.pomoc || []).slice(0, s.miss);
  return '<div class="hl">' + why + '<h3>Pomoć (' + shown.length + ' / ' + (z.pomoc || []).length + ')</h3><ol>' +
    shown.map((p, i) => '<li' + (fresh && i === shown.length - 1 ? ' class="new"' : '') + '>' +   // a step that names itself ("Korak 1:", "Iz lekcije:") keeps its own label
      (/^[^:]{1,20}:/.test(p) ? fmt(p).replace(/^([^:]{1,20}):/, '<b>$1:</b>') : '<b>' + HELP_LBL[Math.min(i, 3)] + ':</b> ' + fmt(p)) + '</li>').join('') + '</ol>' +
    '<p class="placeholder">U rezultat ide prvi odgovor; ovo je da naučiš. Greška posle poslednje pomoći otkriva odgovor.</p></div>';
}
function whyListHTML(z, s) {   // after the answer: why each option the pupil picked (or every wrong one) is wrong
  const opts = z.odgovori || [], w = (s.ui.wrong || []).filter(i => opts[i] && opts[i].zasto);
  const list = (w.length ? w : opts.map((o, i) => i).filter(i => !opts[i].tacan && opts[i].zasto)).map(i => opts[i]);
  return list.length ? '<h3>' + (w.length ? 'Zašto nisu tačni tvoji izbori' : 'Zašto su ostali odgovori pogrešni') + '</h3><ul>' + list.map(o => '<li><b>' + fmt(o.tekst) + '</b> — ' + fmt(o.zasto) + '</li>').join('') + '</ul>' : '';
}
function renderDrawer(fresh) {

  drawerBody.innerHTML = h;
  if (inl) inl.innerHTML = (s.miss && !isDone(s) && (!CLUES[z.vrsta] || s.ui.why)) ? h : '';
}
function showIntro() {

  document.getElementById('drawerTitle').textContent = 'Kako se igra';
  drawerBody.innerHTML = '<div class="intro"><p>' + esc(SPEC.description || '') + '</p><ul>' +
    '<li><b>Kviz</b> — ' + esc(sastavText((SPEC.sastav || {}).pitanja || 25)) + '. U rezultat ide tvoj prvi odgovor na svako pitanje.</li>' +
    '<li><b>Pomoć</b> — posle greške u ovoj fioci stiže pomoć: <i>usmeri</i> → <i>suzi</i> → <i>iz lekcije</i>. Tako nađeš tačan odgovor, ali se rezultat ne menja.</li>' +
    '<li><b>Arhiva rezultata</b> — završen kviz ostaje u arhivi, levo. Novi kviz ima uglavnom nova pitanja, a vraća i nekoliko iz prethodnog (↻), najpre ona na koja si pogrešio.</li>' +
    (ITEMS.some(z => z.odgovori && z.odgovori.some(o => o.zasto)) ? '<li><b>Svaka greška nešto kaže</b> — kad izabereš pogrešan odgovor, vidiš <i>zašto</i> nije tačan.</li>' : '') +
    '<li><b>Moje znanje</b> (levo, Pregled) — pojmovi koje si pogrešio vraćaju se u sledećim kvizovima, kroz drugu vrstu zadatka; one koje znaš viđaš sve ređe.</li>' +
    (SPEC.osa ? '<li><b>Vremenska osa</b> — svaki tačno rešen zadatak sa datumom stavlja događaj na tvoju osu.</li>' : '') +
    '<li>Levo su zadaci po delovima lekcije; možeš ih rešavati bilo kojim redom.</li></ul>' +

document.getElementById('mIntro').addEventListener('click', showIntro);
if (INFO.zasticeno) { const l = document.getElementById('mProt'); l.href = INFO.zasticeno; l.hidden = false; }   // public copy → the one with images

// ---------- outcome ----------
function fail(z, text, given) {
  const s = st(z.id);
  s.miss++;
  record(z, s, false, given);
  const ended = s.miss > steps(z);
  if (ended) { s.status = 'revealed'; s.pts = 0; learnFrom(z, 0); place(z, false); toast('Evo odgovora', false); }
  else toast(text || 'Netačno — pokušaj ponovo', false);
  finishCheck(); save(); renderItem(true); renderNav(); refreshScore();
  if (ended || !mobile()) openDrawer();
}
function succeed(z, given, pts) {   // pts: set only by self-graded `objasni`
  const s = st(z.id), first = s.first == null;
  s.status = 'ok'; s.pts = pts != null ? pts : ptsFor(s.miss);
  record(z, s, true, given);
  learnFrom(z, s.pts);
  s.placed = place(z, true);
  toast((first ? 'Tačno!' : 'Tačno, ali u rezultat ide prvi odgovor') + (s.placed ? ' · na vremenskoj osi' : ''), true);
  finishCheck(); save(); renderItem(false); renderNav(); refreshScore();
  openDrawer();
}

// ---------- item renderers ----------
const main = document.getElementById('main');
function frame(z, s, inner) {
  const n = numOf(z);
  const pts = s.first === true ? '✓ tačno' : s.first === false ? '✗ netačno u prvom pokušaju' : '';
  return '<div class="item"><div class="ihead"><span class="vchip">' + VRSTA_LBL[z.vrsta] + '</span>' + tzBadge(z) + ' ' + TEZ_LBL[z.tezina] + '<span>' + esc(deoNaslov(z)) + ' · zadatak ' + n + ' / ' + curItems().length + '</span><span>' + pts + '</span></div>' +
    inner + '<div class="help-inline" id="helpInline"></div><div class="iactions" id="actions"></div>' +
    (isDone(s) ? '<div class="expl' + (s.status === 'ok' ? '' : ' rev') + '">' + fmt(z.objasnjenje || '') + '</div>' : '') + questionFig(z, s) + '</div>';
}
function questionFig(z, s) {   // `slika_u_pitanju`: the question asks to look at the picture, so it stands under the answers (caption only once answered)
  const b = z.iz_udzbenika; if (!z.slika_u_pitanju || !b || !b.slika) return '';
  const cap = isDone(s) ? INFO.slikeNaslovi[b.slika] || '' : '';
  return '<figure class="qfig"><img src="' + esc(INFO.slikeData[b.slika] || INFO.slike + b.slika) + '" alt="Slika uz pitanje" onclick="this.parentNode.classList.toggle(\'zoom\')" onerror="' +
    (INFO.zasticeno ? 'this.parentNode.outerHTML=\'<p class=&quot;ref&quot;>Slika uz ovo pitanje je u <a href=&quot;' + esc(INFO.zasticeno) + '&quot;>verziji sa slikama iz udžbenika (lozinka)</a>.</p>\'' : 'this.parentNode.remove()') +
    '">' + (cap ? '<figcaption>' + esc(cap) + '</figcaption>' : '') + '</figure>';
}
function actions(btns) {
  const a = document.getElementById('actions');
  a.innerHTML = btns.map(b => '<button type="button" id="' + b[0] + '"' + (b[2] ? ' class="' + b[2] + '"' : '') + '>' + b[1] + '</button>').join('');
}
function nextButton(z) {   // done: Sledeći + reopen the drawer; in progress with help used: reopen the help
  const s = st(z.id), a = document.getElementById('actions');
  if (!isDone(s)) {
    if (s.miss && !CLUES[z.vrsta] && !mobile()) {
      a.insertAdjacentHTML('beforeend', '<button type="button" id="btnHelp">Pomoć</button>');
      document.getElementById('btnHelp').addEventListener('click', openDrawer);
    }
    return;
  }
  a.insertAdjacentHTML('beforeend', '<button type="button" class="ok" id="btnNext">Sledeći ›</button>' +
    '<button type="button" id="btnMore">' + (z.iz_udzbenika ? 'Iz udžbenika' : 'Saznaj više') + '</button>');
  document.getElementById('btnNext').addEventListener('click', goNext);
  const m = document.getElementById('btnMore'); if (m) m.addEventListener('click', openDrawer);
}

function prelude(z, s) {   // what stands above the options: a source, a cause→effect chain, the clues so far
  const done = isDone(s), right = z.odgovori && z.odgovori.find(o => o.tacan);
  if (z.vrsta === 'izvor') { const iz = z.izvor;
    return '<div class="src">' + (iz.autor || iz.naslov ? '<p class="who">' + esc([iz.autor, iz.naslov].filter(Boolean).join(' — ')) + '</p>' : '') +
      '<blockquote>' + fmt(iz.tekst) + '</blockquote>' + (iz.napomena ? '<p class="nt">' + fmt(iz.napomena) + '</p>' : '') + '</div>'; }
  if (z.vrsta === 'lanac') return '<div class="chain">' + z.karike.map((k, i) => (i ? '<span class="ar">→</span>' : '') +
    (i === z.praznina ? '<div class="lk q' + (done ? ' ok' : '') + '">' + (done ? fmt(right.tekst) : '?') + '</div>' : '<div class="lk">' + fmt(k) + '</div>')).join('') + '</div>';
  if (z.vrsta === 'ko_sam') { const n = Math.min(z.tragovi.length, done ? z.tragovi.length : s.miss + 1);
    return '<ul class="clues">' + z.tragovi.slice(0, n).map((t, i) => '<li><span class="k">Trag ' + (i + 1) + '</span>' + fmt(t) + '</li>').join('') + '</ul>'; }
  return '';
}
function renderChoice(z, s) {   // izbor, zakljuci, lanac, izvor, ko_sam (+ the correction step of tacno_netacno)
  const opts = shuffled(z.odgovori, z.id);
  const multi = z.odgovori.filter(o => o.tacan).length > 1;
  const ui = s.ui; ui.wrong = ui.wrong || []; ui.pick = ui.pick || [];
  const done = isDone(s), showRight = s.status === 'ok' || s.status === 'revealed';
  const why = o => o.zasto ? '<span class="why">' + fmt(o.zasto) + '</span>' : '';
  main.innerHTML = frame(z, s, prelude(z, s) + '<h2 class="q">' + fmt(z.pitanje || (z.vrsta === 'ko_sam' ? 'Ko sam ja?' : 'Koja karika nedostaje?')) + '</h2><div class="opts">' + opts.map(([o, i]) =>
    '<button type="button" class="opt' + (multi ? '' : ' round') + (ui.wrong.includes(i) ? ' wrong' : '') + (showRight && o.tacan ? ' right' : '') +
    (!done && ui.pick.includes(i) ? ' picked' : '') + '" data-i="' + i + '"' + (done || ui.wrong.includes(i) ? ' disabled' : '') + '><span class="box"></span><span><span class="ot">' + fmt(o.tekst) + '</span>' +
    (ui.wrong.includes(i) ? why(o) : '') + '</span></button>').join('') + '</div>');
  if (!done && multi) actions([['btnCheck', 'Proveri', 'ok']]);
  if (!done && z.vrsta === 'ko_sam' && s.miss < steps(z)) { actions([['btnClue', 'Još jedan trag']]); document.getElementById('btnClue').addEventListener('click', () => { ui.why = null; fail(z, 'Novi trag', 'zatražen novi trag'); }); }
  main.querySelectorAll('.opt').forEach(b => b.addEventListener('click', () => {
    const i = +b.dataset.i;
    if (!multi) { if (z.odgovori[i].tacan) succeed(z, z.odgovori[i].tekst); else { ui.wrong.push(i); ui.why = z.odgovori[i].zasto || null; fail(z, undefined, z.odgovori[i].tekst); } return; }
    ui.pick = ui.pick.includes(i) ? ui.pick.filter(x => x !== i) : ui.pick.concat(i);
    b.classList.toggle('picked'); save();
  }));
  const chk = document.getElementById('btnCheck');
  if (chk) chk.addEventListener('click', () => {
    if (!ui.pick.length) { toast('Označi bar jedan odgovor', false); return; }
    const right = z.odgovori.map((o, i) => o.tacan ? i : -1).filter(i => i >= 0);
    const wrongPicked = ui.pick.filter(i => !z.odgovori[i].tacan);
    const given = ui.pick.map(i => z.odgovori[i].tekst).join('; ');
    if (!wrongPicked.length && right.every(i => ui.pick.includes(i))) { succeed(z, given); return; }
    ui.wrong = ui.wrong.concat(wrongPicked); ui.pick = ui.pick.filter(i => z.odgovori[i].tacan);
    ui.why = wrongPicked.map(i => z.odgovori[i].zasto).filter(Boolean).join(' ') || null;
    fail(z, wrongPicked.length ? 'Neki od označenih nisu tačni' : 'Nedostaje još tačnih odgovora', given);
  });
  nextButton(z);
}

function renderTN(z, s) {
  const ui = s.ui, done = isDone(s), showAns = s.status === 'ok' || s.status === 'revealed';
  let inner = '<h2 class="q">Tačno ili netačno?</h2><p class="stmt">' + fmt(z.tvrdnja) + '</p><div class="tn">' +
    [[true, 'Tačno'], [false, 'Netačno']].map(([v, t]) => '<button type="button" data-v="' + v + '" class="' +
      ((showAns || ui.phase === 'fix') && v === z.tacno ? 'right' : (ui.tnWrong === v ? 'wrong' : '')) + '"' + (done || ui.phase === 'fix' || ui.tnWrong === v ? ' disabled' : '') + '>' + t + '</button>').join('') + '</div>';
  if (!z.tacno && (ui.phase === 'fix' || showAns)) {
    ui.wrong = ui.wrong || [];
    inner += '<p class="sub-q">Kako glasi tačno?</p><div class="opts">' + shuffled(z.ispravke, z.id + 'fix').map(([o, i]) =>
      '<button type="button" class="opt round fix' + (ui.wrong.includes(i) ? ' wrong' : '') + (showAns && o.tacan ? ' right' : '') + '" data-i="' + i + '"' +
      (done || ui.wrong.includes(i) ? ' disabled' : '') + '><span class="box"></span><span><span class="ot">' + fmt(o.tekst) + '</span>' + (ui.wrong.includes(i) && o.zasto ? '<span class="why">' + fmt(o.zasto) + '</span>' : '') + '</span></button>').join('') + '</div>';
  }
  main.innerHTML = frame(z, s, inner);
  main.querySelectorAll('.tn button').forEach(b => b.addEventListener('click', () => {
    const v = b.dataset.v === 'true';
    if (v !== z.tacno) {   // a binary guess: a wrong one on a true statement leaves nothing to find → revealed;
      ui.tnWrong = v;       // on a false one the pupil still has to find the correction
      if (z.tacno) st(z.id).miss = steps(z); else ui.phase = 'fix';
      fail(z, undefined, v ? 'Tačno' : 'Netačno'); return;
    }
    if (z.tacno) { succeed(z, 'Tačno'); return; }
    st(z.id).log.push({ v: 'Netačno', ok: true });
    ui.phase = 'fix'; save(); renderItem(false); toast('Tačno — sad je ispravi', true);
  }));
  main.querySelectorAll('.opt.fix').forEach(b => b.addEventListener('click', () => {
    const i = +b.dataset.i;
    if (z.ispravke[i].tacan) succeed(z, 'ispravka: ' + z.ispravke[i].tekst); else { ui.wrong.push(i); ui.why = z.ispravke[i].zasto || null; fail(z, undefined, 'ispravka: ' + z.ispravke[i].tekst); }
  }));
  nextButton(z);
}

function parseCloze(t) {   // → [text, {answers}, text, …]
  const parts = []; let last = 0;
  t.replace(/\{\{(.+?)\}\}/g, (m, inner, at) => { parts.push(t.slice(last, at)); parts.push({ answers: inner.split('|') }); last = at + m.length; return m; });
  parts.push(t.slice(last));
  return parts;
}
function renderCloze(z, s) {
  const ui = s.ui; ui.val = ui.val || {}; ui.lock = ui.lock || {};
  const parts = parseCloze(z.tekst), blanks = parts.filter(p => typeof p === 'object');
  const done = isDone(s), bank = z.ponudjene && z.ponudjene.length;
  if (ui.cur == null || ui.lock[ui.cur]) ui.cur = blanks.findIndex((_, i) => !ui.lock[i]);
  let bi = -1;
  const html = parts.map(p => {
    if (typeof p === 'string') return fmt(p);
    bi++;
    const val = done && !ui.lock[bi] ? p.answers[0] : (ui.val[bi] || '');
    const cls = 'blank' + (ui.lock[bi] ? ' lock' : '') + (done && !ui.lock[bi] ? ' rev' : '') + (!done && ui.bad && ui.bad.includes(bi) ? ' bad' : '') + (!done && !bank && false ? '' : '') + (!done && bi === ui.cur && bank ? ' cur' : '');
    return bank || done || ui.lock[bi] ? '<button type="button" class="' + cls + '" data-b="' + bi + '"' + (done || ui.lock[bi] ? ' disabled' : '') + '>' + (esc(val) || '&nbsp;') + '</button>'
      : '<input class="' + cls + '" data-b="' + bi + '" value="' + esc(val) + '" autocomplete="off" spellcheck="false">';
  }).join('');
  const used = Object.values(ui.val);
  main.innerHTML = frame(z, s, '<h2 class="q">' + fmt(z.pitanje || 'Dopuni rečenicu.') + '</h2><div class="cloze">' + html + '</div>' +
    (bank && !done ? '<div class="bank">' + z.ponudjene.map(w => '<button type="button"' + (used.includes(w) ? ' class="used"' : '') + ' data-w="' + esc(w) + '">' + esc(w) + '</button>').join('') + '</div>' : ''));
  if (!done) actions([['btnCheck', 'Proveri', 'ok']]);
  main.querySelectorAll('button.blank').forEach(b => b.addEventListener('click', () => { const i = +b.dataset.b; if (ui.val[i]) delete ui.val[i]; ui.cur = i; ui.bad = []; save(); renderItem(false); }));
  main.querySelectorAll('input.blank').forEach(inp => {
    inp.addEventListener('input', () => { ui.val[+inp.dataset.b] = inp.value; save(); });
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('btnCheck').click(); });
  });
  main.querySelectorAll('.bank button').forEach(b => b.addEventListener('click', () => {
    let i = ui.cur; if (i == null || i < 0 || ui.lock[i] || ui.val[i]) i = blanks.findIndex((_, k) => !ui.lock[k] && !ui.val[k]);
    if (i < 0) return;
    ui.val[i] = b.dataset.w; ui.bad = [];
    ui.cur = blanks.findIndex((_, k) => !ui.lock[k] && !ui.val[k]);
    save(); renderItem(false);
  }));
  const chk = document.getElementById('btnCheck');
  if (chk) chk.addEventListener('click', () => {
    const open = blanks.map((_, i) => i).filter(i => !ui.lock[i]);
    if (open.some(i => !norm(ui.val[i]))) { toast('Popuni sve praznine', false); return; }
    ui.bad = [];
    const given = open.map(i => ui.val[i]).join(' / ');
    for (const i of open) { if (blanks[i].answers.map(norm).includes(norm(ui.val[i]))) ui.lock[i] = true; else { ui.bad.push(i); delete ui.val[i]; } }
    if (!ui.bad.length) succeed(z, given); else fail(z, ui.bad.length === 1 ? 'Jedna praznina nije tačna' : 'Neke praznine nisu tačne', given);
  });
  nextButton(z);
}

function renderMatch(z, s) {
  const ui = s.ui; ui.done = ui.done || [];
  const done = isDone(s), right = shuffled(z.parovi.map(p => p[1]), z.id);
  const num = i => ui.done.indexOf(i) + 1;
  main.innerHTML = frame(z, s, '<h2 class="q">' + fmt(z.pitanje) + '</h2><div class="match"><div class="col">' +
    z.parovi.map((p, i) => { const m = ui.done.includes(i), rv = done && !m;
      return '<button type="button" class="mcell L' + (m ? ' done' : rv ? ' rev' : '') + (ui.left === i && !done ? ' cur' : '') + '" data-i="' + i + '"' + (m || done ? ' disabled' : '') + '>' +
        (m || rv ? '<span class="n">' + (m ? num(i) : '→') + '</span>' : '') + fmt(p[0]) + '</button>'; }).join('') +
    '</div><div class="col">' + right.map(([t, i]) => { const m = ui.done.includes(i), rv = done && !m;
      return '<button type="button" class="mcell R' + (m ? ' done' : rv ? ' rev' : '') + '" data-i="' + i + '"' + (m || done ? ' disabled' : '') + '>' +
        (m ? '<span class="n">' + num(i) + '</span>' : rv ? '<span class="n">←</span>' : '') + fmt(t) + (rv ? ' <small>(' + esc(z.parovi[i][0]) + ')</small>' : '') + '</button>'; }).join('') + '</div></div>');
  main.querySelectorAll('.mcell.L').forEach(b => b.addEventListener('click', () => { ui.left = +b.dataset.i; save(); renderItem(false); }));
  main.querySelectorAll('.mcell.R').forEach(b => b.addEventListener('click', () => {
    if (ui.left == null) { toast('Prvo klikni pojam levo', false); return; }
    const i = +b.dataset.i, pair = z.parovi[ui.left][0] + ' → ' + z.parovi[i][1];
    if (i === ui.left) { ui.done.push(i); ui.left = null; if (ui.done.length === z.parovi.length) succeed(z, pair); else { st(z.id).log.push({ v: pair, ok: true }); save(); renderItem(false); } }
    else { b.classList.add('bad'); ui.left = null; setTimeout(() => fail(z, 'Nisu par', pair), 280); }
  }));
  nextButton(z);
}

// ---------- history: datum, poredjaj, uporedi, objasni ----------
// `oznaka` = how the book dates an event it gives no years for ("kraj XVIII veka"): shown instead of the
// (approximate) years, which only place it on the axis.
const fmtY = y => y < 0 ? -y + ' pre n. e.' : String(y);   // years before the common era are negative in the data
const yrSpan = (a, b) => b == null ? fmtY(a) : a < 0 && b < 0 ? -a + '–' + fmtY(b) : fmtY(a) + '–' + fmtY(b);
const yrs = z => z.oznaka ? z.oznaka : z.godina != null ? fmtY(z.godina) : yrSpan(z.od, z.do);
function renderDate(z, s) {   // one year (`godina`) or a range (`od`, `do`), ± `tolerancija` years
  const ui = s.ui, done = isDone(s), range = z.godina == null && z.do != null, tol = z.tolerancija || 0;
  ui.v = ui.v || {};
  const want = range ? { od: z.od, do: z.do } : { od: z.godina != null ? z.godina : z.od };
  const bce = Object.values(want).some(y => y < 0);   // the era is then part of the answer: chosen per field
  ui.era = ui.era || {};
  const eraOf = k => done ? (want[k] < 0 ? 'pre' : 'ne') : (ui.era[k] || 'pre');
  const field = (k, ph) => '<input inputmode="numeric" data-k="' + k + '" placeholder="' + ph + '" value="' + esc(done ? Math.abs(want[k]) : (ui.v[k] || '')) + '"' +

}
function renderOsa() {   // every placed event, by lane; a range is a bar, one year a dot; labels stack in rows
  const O = SPEC.osa, y0 = O.od, y1 = O.do, span = y1 - y0, pct = y => Math.max(0, Math.min(100, (y - y0) / span * 100));
  const trake = O.trake && O.trake.length ? O.trake : [{ id: '_', label: '', color: '#3a6ba5' }];
  const placed = Object.values(state.osa || {}).map(e => Object.assign({}, e)), total = Object.keys(OSA_ALL).length;
  const step = span <= 60 ? 5 : span <= 150 ? 10 : span <= 300 ? 25 : 50;
  let ticks = ''; for (let y = Math.ceil(y0 / step) * step; y <= y1; y += step) ticks += '<span style="left:' + pct(y) + '%">' + y + '</span>';
  const lanes = trake.map(t => {
    const evs = placed.filter(e => (e.traka || trake[0].id) === t.id).sort((a, b) => a.od - b.od), rows = [];
    for (const e of evs) {
      const x = pct(e.od), w = e.do != null ? pct(e.do) - x : 0, lab = 1.5 + (String(e.naziv).length + yrs(e).length) * 0.62;
      e._lft = x + w + lab > 100;   // label would run past the axis end → draw it left of the bar
      const start = e._lft ? x - lab : x, end = e._lft ? x + w : x + w + lab;
      let r = rows.findIndex(last => last < start); if (r < 0) { r = rows.length; rows.push(-Infinity); }
      rows[r] = end; e._r = r; e._x = x; e._w = w;
    }
    const rowHtml = rows.map((_, r) => '<div class="row">' + evs.filter(e => e._r === r).map(e =>
      '<div class="ev' + (e.ok ? '' : ' rv') + (e._lft ? ' lft' : '') + (e.oznaka ? ' vague' : '') + '" title="' + esc(e.naziv + ' · ' + yrs(e)) + '" style="left:' + e._x + '%;' + (e._w ? 'width:' + e._w + '%;' : 'width:12px;margin-left:-6px;') + 'background:' + (t.color || '#3a6ba5') + '"><span>' + esc(e.naziv) + ' <small>' + yrs(e) + '</small></span></div>').join('') + '</div>').join('');
    return '<div class="lane"><div class="ll" style="color:' + (t.color || '#3a3528') + '">' + esc(t.label) + '</div>' + (rowHtml || '<div class="row"></div>') + '</div>';
  }).join('');
  main.innerHTML = '<div class="sum" style="max-width:1200px"><h1>Moja vremenska osa</h1><p class="lead">Svaki tačno rešen zadatak sa datumom stavlja svoj događaj na osu (bledo = otkriven odgovor). Na osi: <b>' + placed.length + '</b> od ' + total + ' događaja iz lekcije.</p>' +
    '<div class="osa-wrap"><div class="osa">' + lanes + '<div class="ticks">' + ticks + '</div></div></div>' +
    (placed.length ? '' : '<p class="placeholder">Osa je još prazna — reši zadatke „Kada?” i „Poređaj” u Učenju.</p>') + '</div>';
}
function renderZnanje() {   // mastery per concept: due now / not practised / learning / mastered
  const Z = state.znanje || {}, now = Date.now(), all = [...new Set(ITEMS.flatMap(z => z.pojmovi || []))];
  const name = p => INFO.pojmovi[p] || p.replace(/-/g, ' ');
  const g = { due: [], nov: [], uci: [], sav: [] };
  for (const p of all) { const k = Z[p]; (!k ? g.nov : k.due <= now ? g.due : k.box >= 4 ? g.sav : g.uci).push(p); }
  const box = k => '<span class="box5">' + [0, 1, 2, 3].map(i => '<i' + (k && k.box > i ? ' class="on"' : '') + '></i>').join('') + '</span>';
  const when = k => k.due <= now ? '<span class="zn-due">na redu</span>' : 'za ' + Math.max(1, Math.round((k.due - now) / DAY)) + ' d';
  const table = (title, ps, lead) => ps.length ? '<h2 style="margin-top:22px">' + title + ' <small style="color:var(--muted);font-weight:400">' + ps.length + '</small></h2>' + (lead ? '<p class="sub">' + lead + '</p>' : '') +
    '<table class="tbl"><tbody>' + ps.sort((a, b) => name(a).localeCompare(name(b), 'sr')).map(p => '<tr><td>' + esc(name(p)) + '</td><td>' + box(Z[p]) + '</td><td class="num">' + (Z[p] ? when(Z[p]) : '—') + '</td></tr>').join('') + '</tbody></table>' : '';
  main.innerHTML = '<div class="sum"><h1>Moje znanje</h1><p class="lead">Svaki pojam iz lekcije ima nivo (0–4 kvadratića). Tačno iz prve podiže nivo i pojam se vraća sve kasnije (posle 1, 3, 7, 14 dana); greška ga vraća na početak, pa ga vežbaš već u sledećoj sesiji — i to kroz drugu vrstu zadatka.</p>' +
    '<p><b>' + g.sav.length + '</b> savladano · <b>' + g.uci.length + '</b> u učenju · <b class="zn-due">' + g.due.length + '</b> na redu · ' + g.nov.length + ' još nisi vežbao</p>' +
    table('Na redu za ponavljanje', g.due, 'Nova sesija učenja počinje ovim pojmovima.') + table('U učenju', g.uci) + table('Savladano', g.sav) + table('Još nisi vežbao', g.nov) + '</div>';
}
function sastavText(n) {
  const o = (SPEC.sastav || {}).odnos || [40, 40, 20];
  return n + ' pitanja (' + o[0] + '% lakih, ' + o[1] + '% srednjih, ' + o[2] + '% teških) iz banke od ' + ITEMS.length + ' pitanja' + (BAZA ? ' i zadataka iz baze država' : '');
}
function questionText(z) {
  if (z.vrsta === 'tacno_netacno') return z.tvrdnja;
  if (z.vrsta === 'dopuni') return z.tekst.replace(/\{\{(.+?)\}\}/g, '____');
  if (CLUES[z.vrsta]) return (z.vrsta === 'gde_sam' ? 'Gde sam? ' : 'Ko sam? ') + z.tragovi.join(' · ');
  if (z.vrsta === 'datum') return 'Kada: ' + z.dogadjaj;
  if (z.vrsta === 'lanac') return z.karike.map((k, i) => i === z.praznina ? '?' : k).join(' → ');
  if (z.vrsta === 'izvor') return (z.izvor.autor ? z.izvor.autor + ': ' : '') + '„' + z.izvor.tekst + '” — ' + z.pitanje;
  if (z.vrsta === 'uporedi') return rowLabel(z) + ' — ' + z.tvrdnje.map(t => t.tekst).join(' / ');
  return z.pitanje || rowLabel(z);
}
function correctText(z) {
  if (['izbor', 'zakljuci', 'lanac', 'izvor', 'ko_sam'].includes(z.vrsta)) return z.odgovori.filter(o => o.tacan).map(o => o.tekst).join('; ');
  if (z.vrsta === 'datum') return yrs(z);
  if (z.vrsta === 'poredjaj') return z.stavke.map(s => s.tekst + (s.godina != null ? ' (' + (s.oznaka || fmtY(s.godina)) + ')' : '')).join(' → ');
  if (z.vrsta === 'uporedi') { const L = { a: z.a, b: z.b, oba: 'oba', nijedan: 'nijedan' }; return z.tvrdnje.map((t, i) => (i + 1) + ': ' + L[t.odgovor]).join('; '); }
  if (z.vrsta === 'objasni') return z.uzor;
  if (z.vrsta === 'tacno_netacno') return z.tacno ? 'Tačno' : 'Netačno — ' + z.ispravke.find(o => o.tacan).tekst;
  if (z.vrsta === 'dopuni') return z.tekst.replace(/\{\{(.+?)\}\}/g, (m, x) => x.split('|')[0]);
  if (z.vrsta === 'povezi') return z.parovi.map(p => p[0] + ' → ' + p[1]).join('; ');
  return z.cilj.drzava ? MAPI.drzave[z.cilj.drzava] : (MAPI.mesta[z.cilj.mesto] || {}).naziv || z.cilj.mesto;
}
const outcome = s => !s || s.first == null ? 'bez odgovora' : s.first ? 'tačno' : 'netačno';
function renderReview(t) {
  if (!t) { go('_sum'); return; }
  const rows = t.items.map((z, i) => {
    const s = t.b[z.id];
    const log = (s && s.log || []).map(l => '<li class="' + (l.ok ? 'ok' : 'bad') + '">' + (l.ok ? '✓ ' : '✗ ') + esc(l.v || '—') + '</li>').join('');
    return '<div class="rv"><div class="ihead"><span class="vchip">' + VRSTA_LBL[z.vrsta] + '</span>' + tzBadge(z) + '<span>' + (i + 1) + '. ' + (z.ponovo ? '↻ ' : '') + esc(deoNaslov(z)) + '</span><span>' + outcome(s) + '</span></div>' +
      '<p class="rq">' + fmt(questionText(z)) + '</p><p class="rl">Odgovori učenika:</p><ul class="rlog">' + (log || '<li>—</li>') + '</ul>' +
      '<p class="rc"><b>Tačan odgovor:</b> ' + fmt(correctText(z)) + '</p></div>';
  }).join('');
  main.innerHTML = '<div class="sum"><h1>Kviz ' + t.n + ' — pregled rada</h1><p class="sub">' + fmtDate(t.start) + ' · <b>' + t.score + ' / ' + t.max + '</b> tačno</p>' +
    '<div class="iactions"><button type="button" id="btnCsv">Preuzmi (CSV)</button><button type="button" id="btnBack">Nazad</button></div>' + rows + '</div>';
  document.getElementById('btnCsv').addEventListener('click', () => downloadCsv([t]));
  document.getElementById('btnBack').addEventListener('click', () => go('_sum'));
}
function downloadCsv(list) {   // one row per item of each instance: for the teacher (opens in Excel / Sheets)
  const q = v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
  const head = ['kviz', 'datum', 'br', 'deo', 'vrsta', 'tezina', 'pitanje', 'prvi_odgovor', 'svi_odgovori', 'tacan_odgovor'];
  const lines = [head.join(',')];
  for (const t of list) t.items.forEach((z, i) => {
    const s = t.b[z.id] || {};
    lines.push([t.n, fmtDate(t.start), i + 1, deoNaslov(z), VRSTA_LBL[z.vrsta], TEZ_LBL[z.tezina], questionText(z), outcome(s),
      (s.log || []).map(l => (l.ok ? '✓ ' : '✗ ') + l.v).join(' | '), correctText(z)].map(q).join(','));
  });
  const blob = new Blob(['\ufeff' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'kviz-' + (SPEC.slug || 'kviz') + '-' + (list.length === 1 ? list[0].n : 'arhiva') + '.csv';
  document.body.appendChild(a); a.click(); a.remove();
}
function go(id) { state.cur = id; save(); HubShell.setNav(false); if (!drawer.dataset.intro) closeDrawer(); refresh(); main.scrollTop = 0; }
function goNext() {
  const ids = listIds(), i = ids.indexOf(state.cur);
  const next = ids.slice(i + 1).concat(ids.slice(0, i)).find(id => !isDone(st(id)));
  go(next || '_sum');
}
function refresh() { renderNav(); refreshScore(); renderItem(false); }

// ---------- bar ----------
document.getElementById('mReset').addEventListener('click', () => {
  const a = att();
  if (a && !a.end) {
    if (!confirm('Odustati od ovog kviza? Neće biti zabeležen u arhivi.')) return;
    state.inst = state.inst.filter(t => t.id !== a.id);
  }
  newInstance(); closeDrawer(); refresh(); main.scrollTop = 0;
});

// ---------- init ----------
if (!att()) newInstance();
if (location.hash.startsWith('#r:') && state.inst.some(t => 'r:' + t.id === location.hash.slice(1))) state.cur = location.hash.slice(1);
if (!byId(state.cur) && !['_sum', '_znanje', '_osa'].includes(state.cur) && !String(state.cur).startsWith('r:') && !lekRoute()) state.cur = att().end ? '_sum' : curItems()[0].id;
refresh();
let introSeen = false; try { introSeen = localStorage.getItem(STATE_KEY + ':intro') === '1'; } catch (e) {}
if (!introSeen) showIntro();
</script>
