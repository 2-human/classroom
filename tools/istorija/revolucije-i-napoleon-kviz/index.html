orak 1: Koliko je vlasti imala skupština?", "Korak 2: Ko je postavljao ministre i sudije?", "Iz lekcije: opšte pravo glasa, ali skupština sa malim ovlašćenjima."], "objasnjenje": "Glasanje je postojalo, ali je stvarna vlast bila u rukama prvog konzula Napoleona.", "iz_udzbenika": {"strana": 55, "odeljak": "Konzulat", "tekst": "Ustav je uveo opšte pravo glasa, ali su ovlašćenja skupštine bila mala."}, "lekcija": 7}]}, {"naslov": "7. Napoleonovo carstvo", "zadaci": [{"id": "l07-car-izbor-razlog", "vrsta": "izbor", "tezina": "srednje", "pojmovi": ["napoleon-bonaparta", "prvo-francusko-carstvo", "velika-britanija"], "pitanje": "Šta je podstaklo Napoleona da još više učvrsti vlast i proglasi se za cara?", "odgovori": [{"tekst": "Novi rat protiv Britanaca i zavere", "tacan": true}, {"tekst": "Poraz u Rusiji", "tacan": false, "zasto": "Pohod na Rusiju bio je 1812, osam godina posle proglašenja carstva."}, {"tekst": "Odluka Bečkog kongresa", "tacan": false, "zasto": "Bečki kongres je zasedao posle njegovog pada i vratio Burbone."}, {"tekst": "Molba pape", "tacan": false, "zasto": "Papa ga nije molio; Napoleon je čak sam stavio krunu na glavu."}], "pomoc": ["Mir sa Britanijom je bio kratkotrajan.", "Pretila mu je opasnost i spolja i iznutra.", "Iz lekcije: suočen sa novim ratom protiv Britanaca i zaverama, učvrstio je vlast."], "objasnjenje": "Novi rat sa Britanijom i zavere naveli su Napoleona da 1804. postane car.", "iz_udzbenika": {"strana": 55, "odeljak": "Napoleonovo carstvo", "tekst": "Suočen sa novim ratom protiv Britanaca i zaverama, Napoleon je dalje učvrstio svoju vlast."}, "lekcija": 7}, {"id": "l07-car-izbor-gde", "vrsta": "izbor", "tezina": "lako", "pojmovi": ["krunisanje", "notr-dam", "pariz"], "pitanje": "Gde je Napoleon krunisan za cara?", "odgovori": [{"tekst": "U pariskoj katedrali Notr Dam", "tacan": true}, {"tekst": "U Rimu, kod pape", "tacan": false, "zasto": "Krunisanje je bilo u Parizu; papa je došao tamo."}, {"tekst": "U Beču", "tacan": false, "zasto": "U Beču je zasedao kongres posle Napoleonovog pada."}, {"tekst": "U Moskvi", "tacan": false, "zasto": "U Moskvu je ušao 1812. i zatekao je zapaljenu."}], "pomoc": ["U glavnom gradu Francuske.", "Čuvena gotska katedrala.", "Iz lekcije: krunisanje u katedrali Notr Dam u Parizu."], "objasnjenje": "Napoleon je krunisan 1804. u katedrali Notr Dam u Parizu.", "iz_udzbenika": {"strana": 55, "odeljak": "Napoleonovo carstvo", "tekst": "Krunisanje je obavljeno u pariskoj katedrali Notr Dam."}, "lekcija": 7}, {"id": "l07-car-datum-car", "vrsta": "datum", "tezina": "lako", "pojmovi": ["napoleon-bonaparta", "krunisanje"], "dogadjaj": "Napoleon se proglašava za cara", "pitanje": "Koje godine se Napoleon proglasio za cara?", "godina": 1804, "traka": "vladari", "pomoc": ["Iste godine kao Građanski zakonik.", "Pet godina posle uvođenja Konzulata.", "Iz lekcije: proglasio se za cara 1804."], "objasnjenje": "Napoleon se proglasio za cara 1804.", "iz_udzbenika": {"strana": 55, "odeljak": "Napoleonovo carstvo", "tekst": "Napoleon se proglasio za cara 1804."}, "lekcija": 7}, {"id": "l07-car-datum-carstvo", "vrsta": "datum", "tezina": "srednje", "pojmovi": ["prvo-francusko-carstvo"], "dogadjaj": "Prvo francusko carstvo", "pitanje": "Od koje do koje godine je trajalo Prvo francusko carstvo?", "od": 1804, "do": 1815, "traka": "vladari", "pomoc": ["Počinje proglašenjem Napoleona za cara.", "Završava se godine Vaterloa.", "Iz lekcije: Prvo francusko carstvo 1804–1815."], "objasnjenje": "Prvo francusko carstvo trajalo je od 1804. do 1815.", "iz_udzbenika": {"strana": 55, "odeljak": "Napoleonovo carstvo", "tekst": "Prvo francusko carstvo trajalo je do 1815."}, "lekcija": 7}, {"id": "l07-car-izbor-neprijatelj", "vrsta": "izbor", "tezina": "lako", "pojmovi": ["velika-britanija", "prvo-francusko-carstvo"], "pitanje": "Ko je bio glavni neprijatelj Francuske u carskom periodu?", "odgovori": [{"tekst": "Velika Britanija", "tacan": true}, {"tekst": "Osmansko carstvo", "tacan": false, "zasto": "Osmansko carstvo se ne pominje među Napoleonovim glavnim protivnicima u carskom periodu."}, {"tekst": "Španija", "tacan": false, "zasto": "Španiju je Napoleon okupirao, ali glavni neprijatelj bila je Britanija."}, {"tekst": "Švajcarska", "tacan": false, "zasto": "Švajcarska je bila zavisna od Napoleona."}], "pomoc": ["Ta zemlja je vladala morima.", "Protiv nje je uvedena kontinentalna blokada.", "Iz lekcije: glavni neprijatelj Francuske bila je Velika Britanija."], "objasnjenje": "Velika Britanija je bila glavni i najuporniji Napoleonov neprijatelj.", "iz_udzbenika": {"strana": 56, "odeljak": "Napoleonovo carstvo", "tekst": "Glavni neprijatelj Francuske bila je Velika Britanija."}, "lekcija": 7}, {"id": "l07-car-izbor-koalicija", "vrsta": "izbor", "tezina": "srednje", "pojmovi": ["koalicija", "habzburska-monarhija", "pruska", "rusija"], "pitanje": "Kako su se zvali savezi evropskih sila protiv Napoleona?", "odgovori": [{"tekst": "Koalicije", "tacan": true}, {"tekst": "Sestrinske republike", "tacan": false, "zasto": "To su bile države zavisne od Francuske, a ne savezi protiv nje."}, {"tekst": "Rajnski savez", "tacan": false, "zasto": "Rajnski savez je Napoleon sam stvorio od nemačkih država."}, {"tekst": "Konzulat", "tacan": false, "zasto": "Konzulat je oblik vlasti u Francuskoj 1799–1804."}], "pomoc": ["Udruživale su se Habzburška monarhija, Pruska i Rusija.", "Reč je istaknuta žutom bojom u tekstu.", "Iz lekcije: sile su se udruživale u saveze — koalicije."], "objasnjenje": "Savezi sila protiv Napoleona zovu se koalicije.", "iz_udzbenika": {"strana": 56, "odeljak": "Napoleonovo carstvo", "tekst": "Habzburška monarhija, Pruska i Rusija povremeno su ratovale protiv Napoleona udružene u saveze (koalicije)."}, "lekcija": 7}, {"id": "l07-car-izbor-trafalgar", "vrsta": "izbor", "tezina": "lako", "pojmovi": ["bitka-kod-trafalgara", "admiral-nelson"], "pitanje": "Gde je 1805. francuska ratna flota doživela težak poraz?", "odgovori": [{"tekst": "Kod Trafalgara", "tacan": true}, {"tekst": "Kod Austerlica", "tacan": false, "zasto": "Kod Austerlica je Napoleon pobedio na kopnu."}, {"tekst": "Kod Borodina", "tacan": false, "zasto": "Borodino je kopnena bitka u Rusiji 1812."}, {"tekst": "Kod Lajpciga", "tacan": false, "zasto": "Lajpcig je kopnena „Bitka naroda” 1813."}], "pomoc": ["Pitanje je o floti — dakle bitka na moru.", "Na karti je kod juga Španije.", "Iz lekcije: francuska flota je poražena kod Trafalgara 1805."], "objasnjenje": "Kod Trafalgara (1805) britanski admiral Nelson potopio je francusku flotu.", "iz_udzbenika": {"strana": 56, "odeljak": "Napoleonovo carstvo", "tekst": "Francuska flota doživela je težak poraz kod Trafalgara 1805."}, "osa": {"naziv": "Bitka kod Trafalgara", "od": 1805, "traka": "dogadjaji"}, "lekcija": 7}, {"id": "l07-car-tn-nelson", "vrsta": "tacno_netacno", "tezina": "srednje", "pojmovi": ["admiral-nelson", "bitka-kod-trafalgara"], "tvrdnja": "Admiral Nelson je posle pobede kod Trafalgara krunisan za britanskog kralja.", "tacno": false, "ispravke": [{"tekst": "Admiral Nelson je potopio francusku flotu, ali je i sam poginuo u toj bici.", "tacan": true}, {"tekst": "Admiral Nelson je bio francuski admiral i izgubio je bitku.", "tacan": false, "zasto": "Nelson je bio britanski admiral i pobedio je."}, {"tekst": "Nelson je bio ruski general kod Borodina.", "tacan": false, "zasto": "Ruski general kod Borodina bio je Kutuzov."}], "pomoc": ["Šta se sa Nelsonom dogodilo u samoj bici?", "Iz lekcije: Nelson je potopio francusku flotu i poginuo u bici."], "objasnjenje": "Netačno — Nelson je pobedio, ali je poginuo kod Trafalgara.", "iz_udzbenika": {"strana": 56, "odeljak": "Napoleonovo carstvo", "tekst": "Britanski admiral Nelson potopio je francusku flotu i sam poginuo u bici."}, "lekcija": 7}, {"id": "l07-car-lanac-trafalgar", "vrsta": "lanac", "tezina": "srednje", "pojmovi": ["bitka-kod-trafalgara", "velika-britanija"], "karike": ["Napoleon planira invaziju na Veliku Britaniju", "Francuska flota je uništena kod Trafalgara (1805)", "?"], "praznina": 2, "odgovori": [{"tekst": "Invazija propada; Britanija zadržava prevlast na morima", "tacan": true}, {"tekst": "Napoleon osvaja London", "tacan": false, "zasto": "Bez flote vojska nije mogla da pređe more."}, {"tekst": "Britanija se predaje i pristupa kontinentalnoj blokadi", "tacan": false, "zasto": "Blokada je bila uperena protiv Britanije; ona se nikad nije predala."}], "pomoc": ["Korak 1: Čemu je flota trebalo da služi?", "Korak 2: Može li se preći more bez brodova?", "Iz lekcije: posle Trafalgara prevlast Velike Britanije na morima bila je očuvana."], "objasnjenje": "Bez flote nije bilo invazije; Britanija je ostala gospodar mora.", "iz_udzbenika": {"strana": 56, "odeljak": "Napoleonovo carstvo", "tekst": "Posle poraza kod Trafalgara prevlast Velike Britanije na morima bila je očuvana."}, "lekcija": 7}, {"id": "l07-car-izbor-austerlic", "vrsta": "izbor", "tezina": "srednje", "pojmovi": ["bitka-kod-austerlica", "austrija", "rusija"], "pitanje": "Zašto se bitka kod Austerlica naziva „Bitka tri cara”?", "odgovori": [{"tekst": "Napoleon je pobedio udruženu austrijsko-rusku vojsku — učestvovale su vojske tri cara", "tacan": true}, {"tekst": "U bici su poginula tri cara", "tacan": false, "zasto": "Nijedan car nije poginuo; reč je o tri carske vojske."}, {"tekst": "Bitka je trajala tri godine", "tacan": false, "zasto": "Bitka je vođena 1805; ime se odnosi na vladare."}, {"tekst": "U bici su učestvovali Britanci, Španci i Portugalci", "tacan": false, "zasto": "Protiv Napoleona su bile vojske Austrije i Rusije."}], "pomoc": ["Ko su bili protivnici kod Austerlica?", "I austrijski i ruski vladar nosili su titulu cara, kao i Napoleon.", "Iz lekcije: kod Austerlica pobeđena je udružena austrijsko-ruska vojska."], "objasnjenje": "Francuski, austrijski i ruski car — tri carske vojske, otuda „Bitka tri cara”.", "iz_udzbenika": {"strana": 56, "odeljak": "Napoleonovo carstvo", "tekst": "Napoleon je kod Austerlica (Bitka tri cara) 1805. porazio austrijsko-rusku vojsku."}, "osa": {"naziv": "Bitka kod Austerlica", "od": 1805, "traka": "dogadjaji"}, "lekcija": 7}, {"id": "l07-car-datum-austerlic", "vrsta": "datum", "tezina": "lako", "pojmovi": ["bitka-kod-austerlica"], "dogadjaj": "Bitka kod Austerlica", "pitanje": "Koje godine je bila bitka kod Austerlica?", "godina": 1805, "traka": "dogadjaji", "pomoc": ["Iste godine kao Trafalgar.", "Godinu dana posle krunisanja.", "Iz lekcije: Austerlic 1805."], "objasnjenje": "Bitka kod Austerlica bila je 1805.", "iz_udzbenika": {"strana": 56, "odeljak": "Napoleonovo carstvo", "tekst": "Napoleon je pobedio kod Austerlica 1805."}, "lekcija": 7}, {"id": "l07-car-datum-trafalgar", "vrsta": "datum", "tezina": "srednje", "pojmovi": ["bitka-kod-trafalgara"], "dogadjaj": "Bitka kod Trafalgara", "pitanje": "Koje godine je francuska flota poražena kod Trafalgara?", "godina": 1805, "traka": "dogadjaji", "pomoc": ["Godinu dana posle Napoleonovog krunisanja.", "Iste godine kao Austerlic.", "Iz lekcije: Trafalgar 1805."], "objasnjenje": "Kod Trafalgara 1805. Britanci su uništili francusku flotu.", "iz_udzbenika": {"strana": 56, "odeljak": "Napoleonovo carstvo", "tekst": "Poraz francuske flote kod Trafalgara bio je 1805."}, "lekcija": 7}, {"id": "l07-car-izbor-dobitci-1806", "vrsta": "izbor", "tezina": "srednje", "pojmovi": ["austrija", "venecija", "dalmacija", "dubrovnik", "istra"], "pitanje": "Koje oblasti je Francuska dobila od Austrije mirom početkom 1806? (više tačnih)", "odgovori": [{"tekst": "Veneciju", "tacan": true}, {"tekst": "Dalmaciju", "tacan": true}, {"tekst": "Dubrovnik", "tacan": true}, {"tekst": "Istru", "tacan": true}, {"tekst": "Beograd", "tacan": false, "zasto": "Beograd je bio u Osmanskom carstvu, ne u austrijskim posedima."}, {"tekst": "Moskvu", "tacan": false, "zasto": "Moskva je u Rusiji; Napoleon je ušao u nju tek 1812."}], "pomoc": ["Sve te oblasti su na obali Jadranskog mora.", "Jedna je grad u Italiji, ostale su na istočnoj obali Jadrana.", "Iz lekcije: Venecija, Dalmacija, Dubrovnik i Istra."], "objasnjenje": "Francuska je dobila Veneciju, Dalmaciju, Dubrovnik i Istru.", "iz_udzbenika": {"strana": 56, "odeljak": "Napoleonovo carstvo", "tekst": "Francuskoj su pripale Venecija, Dalmacija, Dubrovnik i Istra."}, "osa": {"naziv": "Mir sa Austrijom", "od": 1806, "traka": "dogadjaji"}, "lekcija": 7}, {"id": "l07-car-dopuni-ilirske", "vrsta": "dopuni", "tezina": "srednje", "pojmovi": ["ilirske-provincije", "dalmacija", "dubrovnik", "istra"], "pitanje": "Dopuni rečenicu.", "tekst": "Od Dalmacije, Dubrovnika i Istre Napoleon je na obali {{Jadranskog}} mora stvorio {{Ilirske provincije}}.", "ponudjene": ["Jadranskog", "Crnog", "Ilirske provincije", "Rajnski savez", "Sestrinske republike"], "pomoc": ["Dalmacija i Istra leže uz more između Italije i Balkana.", "Naziv dolazi od starog imena za stanovnike tog kraja.", "Iz lekcije: na Jadranu je stvorio Ilirske provincije."], "objasnjenje": "Na Jadranskoj obali nastale su Ilirske provincije.", "iz_udzbenika": {"strana": 56, "odeljak": "Napoleonovo carstvo", "tekst": "Na obali Jadranskog mora Napoleon je stvorio Ilirske provincije."}, "lekcija": 7}, {"id": "l07-car-tn-sveto-rimsko", "vrsta": "tacno_netacno", "tezina": "srednje", "pojmovi": ["sveto-rimsko-carstvo", "rajnski-savez"], "tvrdnja": "Napoleon je ukinuo Sveto rimsko carstvo nemačkog naroda, a niz manjih nemačkih država udružio je u Rajnski savez.", "tacno": true, "pomoc": ["Šta je zamenilo staro carstvo u nemačkim zemljama?", "Iz lekcije: Sveto rimsko carstvo je ukinuto, a manje nemačke države okupljene u Rajnski savez."], "objasnjenje": "Tačno — staro carstvo je ukinuto, a nemačke države udružene u Rajnski savez zavisan od Napoleona.", "iz_udzbenika": {"strana": 56, "odeljak": "Napoleonovo carstvo", "tekst": "Ukinuto je Sveto rimsko carstvo nemačkog naroda, a manje nemačke države okupljene su u Rajnski savez."}, "lekcija": 7}, {"id": "l07-car-dopuni-rajnski-tesko", "vrsta": "dopuni", "tezina": "tesko", "pojmovi": ["sveto-rimsko-carstvo", "rajnski-savez"], "pitanje": "Dopuni bez ponuđenih reči.", "tekst": "Posle pobede kod Austerlica ukinuto je staro {{Sveto rimsko carstvo}} nemačkog naroda, a manje nemačke države Napoleon je okupio u {{Rajnski savez|Rajnskom savezu}}.", "pomoc": ["Staro carstvo je postojalo još od srednjeg veka.", "Savez nosi ime po reci u zapadnoj Nemačkoj.", "Iz lekcije: Sveto rimsko carstvo nemačkog naroda je ukinuto; nastao je Rajnski savez."], "objasnjenje": "Sveto rimsko carstvo nemačkog naroda zamenjeno je Rajnskim savezom.", "iz_udzbenika": {"strana": 56, "odeljak": "Napoleonovo carstvo", "tekst": "Ukinuto je Sveto rimsko carstvo, a nemačke države okupljene su u Rajnski savez."}, "lekcija": 7}, {"id": "l07-car-izbor-blokada", "vrsta": "izbor", "tezina": "lako", "pojmovi": ["kontinentalna-blokada", "velika-britanija"], "pitanje": "Šta je značila kontinentalna blokada?", "odgovori": [{"tekst": "Zemljama pod francuskom vlašću i saveznicima Francuske bilo je zabranjeno da trguju sa Britanijom", "tacan": true}, {"tekst": "Britanska flota je zatvorila sve francuske luke", "tacan": false, "zasto": "Blokadu je proglasio Napoleon protiv Britanije, ne obrnuto."}, {"tekst": "Zabranjeno je putovanje kroz Alpe", "tacan": false, "zasto": "Blokada se ticala trgovine sa Britanijom."}, {"tekst": "Zatvorene su granice Rusije", "tacan": false, "zasto": "Rusija je, naprotiv, kršila blokadu trgujući sa Britanijom."}], "pomoc": ["Uperena je protiv glavnog neprijatelja Francuske.", "Tiče se trgovine, ne vojske.", "Iz lekcije: zabrana trgovine sa Britanijom za sve zemlje pod francuskom vlašću i saveznike."], "objasnjenje": "Kontinentalnom blokadom Napoleon je zabranio trgovinu sa Britanijom svim zemljama pod svojom vlašću i saveznicima.", "iz_udzbenika": {"strana": 56, "odeljak": "Napoleonovo carstvo", "tekst": "Kontinentalna blokada je zabranila trgovinu sa Britanijom zemljama pod francuskom vlašću i saveznicima."}, "lekcija": 7}, {"id": "l07-car-izbor-berlin", "vrsta": "izbor", "tezina": "srednje", "pojmovi": ["kontinentalna-blokada", "berlin", "pruska"], "pitanje": "U kom gradu je Napoleon proglasio kontinentalnu blokadu?", "odgovori": [{"tekst": "U Berlinu", "tacan": true}, {"tekst": "U Londonu", "tacan": false, "zasto": "London nikad nije osvojio — blokada je bila protiv Britanije."}, {"tekst": "U Beču", "tacan": false, "zasto": "U Beču je kasnije zasedao kongres pobednika."}, {"tekst": "U Moskvi", "tacan": false, "zasto": "U Moskvu je ušao 1812, a blokada je proglašena ranije."}], "pomoc": ["Desilo se posle pobeda nad Pruskom.", "Ušao je u prestonicu poražene Pruske.", "Iz lekcije: u Berlinu je proglasio kontinentalnu blokadu."], "objasnjenje": "Posle pobeda nad Pruskom Napoleon je ušao u Berlin i tamo proglasio blokadu.", "iz_udzbenika": {"strana": 56, "odeljak": "Napoleonovo carstvo", "tekst": "Napoleon je umarširao u Berlin i tamo proglasio kontinentalnu blokadu."}, "lekcija": 7}, {"id": "l07-car-zakljuci-blokada", "vrsta": "zakljuci", "tezina": "tesko", "pojmovi": ["kontinentalna-blokada", "bitka-kod-trafalgara", "velika-britanija"], "pitanje": "Zašto je Napoleon Britaniju pokušao da pobedi trgovinskom blokadom, a ne vojskom?", "odgovori": [{"tekst": "Posle Trafalgara nije imao flotu za invaziju, pa je hteo da je oslabi ekonomski", "tacan": true}, {"tekst": "Britanija je bila njegov saveznik", "tacan": false, "zasto": "Britanija je bila glavni neprijatelj Francuske."}, {"tekst": "Britanija nije imala vojsku", "tacan": false, "zasto": "Britanija je ratovala, a njena flota je pobedila kod Trafalgara."}, {"tekst": "To mu je naredio Bečki kongres", "tacan": false, "zasto": "Bečki kongres je bio posle njegovog pada."}], "pomoc": ["Korak 1: Šta se desilo sa francuskom flotom 1805?", "Korak 2: Od čega je Britanija živela — od trgovine ili od osvajanja kopna?", "Iz lekcije: invazija je propala kod Trafalgara, pa je Napoleon zabranio trgovinu s Britanijom."], "objasnjenje": "Bez flote nije mogao da pređe more; zato je pokušao da Britaniju, zemlju trgovine, iscrpi zabranom trgovine.", "iz_udzbenika": {"strana": 56, "odeljak": "Napoleonovo carstvo", "tekst": "Posle Trafalgara Britanija je vladala morem, a Napoleon je proglasio kontinentalnu blokadu."}, "lekcija": 7}, {"id": "l07-car-lanac-spanija", "vrsta": "lanac", "tezina": "lako", "pojmovi": ["kontinentalna-blokada", "spanija", "portugalija"], "karike": ["Napoleon proglašava kontinentalnu blokadu", "Španija i Portugalija je ne poštuju", "?"], "praznina": 2, "odgovori": [{"tekst": "Napoleon šalje vojsku i okupira ih", "tacan": true}, {"tekst": "Napoleon ih nagrađuje teritorijama", "tacan": false, "zasto": "Kaznio ih je — vojnim pohodom."}, {"tekst": "Britanija ih okupira", "tacan": false, "zasto": "Okupirao ih je Napoleon jer su kršile blokadu."}], "pomoc": ["Korak 1: Kako Napoleon kažnjava neposlušne?", "Korak 2: Na karti su Španija i Portugalija u boji država pod njegovom vlašću.", "Iz lekcije: protiv zemalja koje ne poštuju blokadu preduzeo je vojne pohode i okupirao ih."], "objasnjenje": "Kršenje blokade → vojni pohod → okupacija Španije i Portugalije.", "iz_udzbenika": {"strana": 56, "odeljak": "Napoleonovo carstvo", "tekst": "Protiv Španije i Portugalije, koje nisu poštovale blokadu, Napoleon je preduzeo vojne pohode i okupirao ih."}, "lekcija": 7}, {"id": "l07-car-izbor-aleksandar", "vrsta": "izbor", "tezina": "srednje", "pojmovi": ["aleksandar-i", "rusija"], "pitanje": "Sa kim je Napoleon 1807. svečano sklopio savez?", "odgovori": [{"tekst": "Sa ruskim carem Aleksandrom I", "tacan": true}, {"tekst": "Sa admiralom Nelsonom", "tacan": false, "zasto": "Nelson je poginuo kod Trafalgara 1805. kao Napoleonov protivnik."}, {"tekst": "Sa Lujem XVIII", "tacan": false, "zasto": "Luj XVIII je burbonski kralj vraćen posle Napoleona."}, {"tekst": "Sa britanskim kraljem", "tacan": false, "zasto": "Britanija je ostala neprijatelj — protiv nje je bila blokada."}], "pomoc": ["Posle pobedonosnog rata 1807. Napoleon se nagodio sa jednim od protivnika.", "Pet godina kasnije napao je baš tu zemlju.", "Iz lekcije: sa ruskim carem Aleksandrom I sklopio je savez."], "objasnjenje": "Napoleon se 1807. sastao sa ruskim carem Aleksandrom I i sklopio savez.", "iz_udzbenika": {"strana": 56, "odeljak": "Napoleonovo carstvo", "tekst": "Napoleon je 1807. završio ratovanje i sklopio savez sa ruskim carem Aleksandrom I."}, "osa": {"naziv": "Savez Napoleona i Aleksandra I", "od": 1807, "traka": "dogadjaji"}, "lekcija": 7}, {"id": "l07-car-uporedi-pokorene", "vrsta": "uporedi", "tezina": "srednje", "pojmovi": ["napoleon-bonaparta", "prvo-francusko-carstvo"], "a": "Korist za pokorene zemlje", "b": "Teret za pokorene zemlje", "pitanje": "Da li je ono što je Napoleon doneo pokorenim zemljama korist, teret, oba ili nijedno?", "tvrdnje": [{"tekst": "Reforma pravosuđa", "odgovor": "a", "zasto": "Sudovi su uređeni po novim, jednakim pravilima."}, {"tekst": "Škole na narodnom jeziku", "odgovor": "a", "zasto": "Narod se školuje na svom jeziku."}, {"tekst": "Izgradnja puteva", "odgovor": "a", "zasto": "Putevi olakšavaju saobraćaj i trgovinu."}, {"tekst": "Obavezno služenje u francuskoj vojsci", "odgovor": "b", "zasto": "Ljudi su morali da ratuju za Napoleona."}, {"tekst": "Izdržavanje francuske vlasti", "odgovor": "b", "zasto": "Stanovništvo je plaćalo francusku upravu."}, {"tekst": "Povratak kmetstva i plemićkih povlastica", "odgovor": "nijedan", "zasto": "Napoleon to nije uvodio — njegov zakonik je počivao na jednakosti."}], "pomoc": ["Šta je zemlji ostalo kao dobro, a šta je moralo da daje Francuskoj?", "Vojska i plaćanje uprave bili su obaveze.", "Iz lekcije: reforme, škole i putevi, ali i služenje vojske i izdržavanje vlasti."], "objasnjenje": "Napoleon je donosio reforme, škole i puteve, ali su pokoreni služili vojsku i izdržavali francusku vlast.", "iz_udzbenika": {"strana": 56, "odeljak": "Napoleonovo carstvo", "tekst": "U pokorenim zemljama Napoleon je reformisao pravosuđe, otvarao škole i gradio puteve, a stanovništvo je služilo vojsku i izdržavalo francusku vlast."}, "lekcija": 7}, {"id": "l07-car-poredjaj", "vrsta": "poredjaj", "tezina": "tesko", "pojmovi": ["prvo-francusko-carstvo", "bitka-kod-austerlica", "aleksandar-i", "marija-lujza"], "pitanje": "Poređaj događaje carskog perioda hronološki.", "stavke": [{"tekst": "Napoleon se proglašava za cara", "godina": 1804, "naziv": "Napoleon se proglašava za cara", "traka": "vladari"}, {"tekst": "Pobeda kod Austerlica", "godina": 1805, "naziv": "Bitka kod Austerlica", "traka": "dogadjaji"}, {"tekst": "Austrija prihvata mir i gubi teritorije", "godina": 1806, "naziv": "Mir sa Austrijom", "traka": "dogadjaji"}, {"tekst": "Savez sa ruskim carem Aleksandrom I", "godina": 1807, "naziv": "Savez Napoleona i Aleksandra I", "traka": "dogadjaji"}, {"tekst": "Ženidba austrijskom princezom Marijom Lujzom", "godina": 1810, "naziv": "Napoleonova ženidba Marijom Lujzom", "traka": "dogadjaji"}], "pomoc": ["Mir sa Austrijom došao je posle bitke kod Austerlica.", "Ženidba je poslednja.", "Iz lekcije: 1804 car, 1805 Austerlic, 1806 mir, 1807 savez, 1810 ženidba."], "objasnjenje": "1804 car → 1805 Austerlic → 1806 mir sa Austrijom → 1807 savez sa Aleksandrom I → 1810 ženidba Marijom Lujzom.", "iz_udzbenika": {"strana": 56, "odeljak": "Napoleonovo carstvo", "tekst": "Carski period: krunisanje 1804, Austerlic 1805, mir 1806, savez sa Rusijom 1807, ženidba 1810."}, "lekcija": 7}, {"id": "l07-car-povezi-bitke", "vrsta": "povezi", "tezina": "lako", "pojmovi": ["bitka-kod-trafalgara", "bitka-kod-austerlica", "admiral-nelson"], "pitanje": "Poveži bitku iz 1805. sa onim što je za nju tačno.", "parovi": [["Trafalgar", "Pomorski poraz Francuza"], ["Austerlic", "„Bitka tri cara”"], ["Admiral Nelson", "Pobednik koji je poginuo u bici"]], "pomoc": ["Jedna bitka je na moru, druga na kopnu.", "Nelson je bio britanski admiral.", "Iz lekcije: Trafalgar — poraz flote; Austerlic — Bitka tri cara."], "objasnjenje": "Trafalgar je pomorski poraz Francuske (Nelson pobedio i poginuo), Austerlic kopnena pobeda Napoleona.", "iz_udzbenika": {"strana": 56, "odeljak": "Napoleonovo carstvo", "tekst": "1805. francuska flota je poražena kod Trafalgara, a Napoleon je pobedio kod Austerlica."}, "lekcija": 7}, {"id": "l07-car-uporedi-trafalgar-austerlic", "vrsta": "uporedi", "tezina": "tesko", "pojmovi": ["bitka-kod-trafalgara", "bitka-kod-austerlica"], "a": "Trafalgar", "b": "Austerlic", "pitanje": "Na koju bitku se odnosi tvrdnja — Trafalgar, Austerlic, obe ili nijednu?", "tvrdnje": [{"tekst": "Vođena je 1805.", "odgovor": "oba", "zasto": "Obe bitke su iz 1805."}, {"tekst": "Francuska je izgubila.", "odgovor": "a", "zasto": "Kod Trafalgara je francuska flota potopljena."}, {"tekst": "Napoleon je pobedio austrijsko-rusku vojsku.", "odgovor": "b", "zasto": "To je Austerlic — Bitka tri cara."}, {"tekst": "Posle nje je osujećena invazija na Britaniju.", "odgovor": "a", "zasto": "Bez flote nije bilo prelaska na britansko ostrvo."}, {"tekst": "Posle nje je Austrija morala da prihvati mir.", "odgovor": "b", "zasto": "Početkom 1806. Austrija je izgubila niz teritorija."}, {"tekst": "Vođena je u Rusiji.", "odgovor": "nijedan", "zasto": "U Rusiji je bilo Borodino (1812)."}], "pomoc": ["Jedna je na moru, druga na kopnu.", "Ko je pobedio u kojoj?", "Iz lekcije: Trafalgar — poraz flote; Austerlic — pobeda nad Austrijom i Rusijom."], "objasnjenje": "Iste godine Napoleon je izgubio more (Trafalgar), a pobedio na kopnu (Austerlic).", "iz_udzbenika": {"strana": 56, "odeljak": "Napoleonovo carstvo", "tekst": "1805: poraz kod Trafalgara i pobeda kod Austerlica."}, "lekcija": 7}, {"id": "l07-car-ko-sam-nelson", "vrsta": "ko_sam", "tezina": "srednje", "pojmovi": ["admiral-nelson", "bitka-kod-trafalgara"], "tragovi": ["Komandovao sam britanskom flotom.", "Potopio sam francusku flotu 1805.", "Pobedio sam kod Trafalgara, ali sam u toj bici i poginuo."], "odgovori": [{"tekst": "Admiral Nelson", "tacan": true}, {"tekst": "General Kutuzov", "tacan": false, "zasto": "Kutuzov je ruski general iz 1812."}, {"tekst": "Aleksandar I", "tacan": false, "zasto": "Aleksandar I je ruski car."}, {"tekst": "Napoleon Bonaparta", "tacan": false, "zasto": "Napoleonova flota je kod Trafalgara potopljena."}], "objasnjenje": "To je britanski admiral Nelson, pobednik i žrtva bitke kod Trafalgara.", "iz_udzbenika": {"strana": 56, "odeljak": "Napoleonovo carstvo", "tekst": "Britanski admiral Nelson potopio je francusku flotu kod Trafalgara i poginuo."}, "lekcija": 7}, {"id": "l07-car-ko-sam-aleksandar", "vrsta": "ko_sam", "tezina": "tesko", "pojmovi": ["aleksandar-i", "rusija", "becki-kongres", "luj-xviii"], "tragovi": ["Sa Napoleonom sam se 1807. svečano sastao i sklopio savez.", "Moja zemlja je kasnije kršila kontinentalnu blokadu.", "Na karikaturi Bečkog kongresa u zelenoj uniformi vraćam krunu Luju XVIII."], "odgovori": [{"tekst": "Ruski car Aleksandar I", "tacan": true}, {"tekst": "Austrijski car", "tacan": false, "zasto": "Austrijski car je na karikaturi u beloj uniformi, sa korpom."}, {"tekst": "Pruski kralj", "tacan": false, "zasto": "Pruski kralj se na karikaturi saginje po gradove."}, {"tekst": "General Kutuzov", "tacan": false, "zasto": "Kutuzov je bio general, a ne vladar koji sklapa saveze."}], "objasnjenje": "To je ruski car Aleksandar I — saveznik 1807, protivnik 1812, pobednik na Bečkom kongresu.", "iz_udzbenika": {"strana": 56, "odeljak": "Napoleonovo carstvo", "tekst": "Napoleon je 1807. sklopio savez sa ruskim carem Aleksandrom I."}, "lekcija": 7}, {"id": "l07-car-objasni-blokada", "vrsta": "objasni", "tezina": "srednje", "pojmovi": ["kontinentalna-blokada", "velika-britanija", "spanija", "portugalija"], "pitanje": "Šta je bila kontinentalna blokada i kakve je posledice imala za zemlje koje je nisu poštovale?", "uzor": "Kontinentalnu blokadu Napoleon je proglasio u Berlinu protiv Velike Britanije. Svim zemljama pod francuskom vlašću i saveznicima Francuske bila je zabranjena trgovina sa Britanijom. Zemlje koje je nisu poštovale, kao Španija i Portugalija, Napoleon je napao i okupirao.", "ideje": ["Zabrana trgovine sa Britanijom.", "Važila je za zemlje pod francuskom vlašću i saveznike.", "Španija i Portugalija su zbog kršenja okupirane."], "objasnjenje": "Blokada je trgovinski rat protiv Britanije; ko je nije poštovao, dočekala ga je francuska vojska.", "iz_udzbenika": {"strana": 56, "odeljak": "Napoleonovo carstvo", "tekst": "Kontinentalna blokada je zabranila trgovinu sa Britanijom; Španiju i Portugaliju, koje je nisu poštovale, Napoleon je okupirao."}, "lekcija": 7}, {"id": "l07-car-izbor-kruna", "vrsta": "izbor", "slika_u_pitanju": true, "tezina": "lako", "pojmovi": ["krunisanje", "papa", "zozefina"], "pitanje": "Šta je na krunisanju bilo neobično?", "odgovori": [{"tekst": "Napoleon je sam stavio krunu na svoju glavu, a zatim na glavu Žozefine", "tacan": true}, {"tekst": "Krunisao ga je ruski car", "tacan": false, "zasto": "Ruski car nije učestvovao — krunu je stavio sam Napoleon."}, {"tekst": "Krunisanje je bilo u Moskvi", "tacan": false, "zasto": "Bilo je u katedrali Notr Dam u Parizu."}, {"tekst": "Papa je krunisao samo Žozefinu", "tacan": false, "zasto": "Napoleon je krunisao i sebe i nju."}], "pomoc": ["Ko je obično krunisao vladare?", "Napoleon tu ulogu nije prepustio drugome.", "Iz lekcije: sam je stavio krunu sebi, pa supruzi Žozefini."], "objasnjenje": "Iako je bilo uobičajeno da papa kruniše vladare, Napoleon je sam stavio krunu sebi i Žozefini.", "iz_udzbenika": {"strana": 55, "odeljak": "Krunisanje u Notr Damu", "tekst": "Napoleon je sam stavio krunu na svoju glavu, a zatim na glavu supruge Žozefine.", "slika": "07-napoleonovo-doba/03-krunisanje-napoleona.jpg"}, "osa": {"naziv": "Napoleon se proglašava za cara", "od": 1804, "traka": "vladari"}, "lekcija": 7}, {"id": "l07-car-zakljuci-papa", "vrsta": "zakljuci", "slika_u_pitanju": true, "tezina": "tesko", "pojmovi": ["krunisanje", "papa", "napoleon-bonaparta"], "pitanje": "Šta je Napoleon hteo da pokaže time što papi nije prepustio krunisanje?", "odgovori": [{"tekst": "Da vlast duguje sebi i svojim zaslugama, a ne crkvi", "tacan": true}, {"tekst": "Da je papa njegov neprijatelj u ratu", "tacan": false, "zasto": "Papa je prisustvovao krunisanju; nije bio ratni protivnik."}, {"tekst": "Da se odriče prestola", "tacan": false, "zasto": "Krunisanjem je postao car — odricanje dolazi tek 1814."}, {"tekst": "Da je Žozefina važnija od njega", "tacan": false, "zasto": "Krunu je prvo stavio sebi."}], "pomoc": ["Korak 1: Šta znači kada papa kruniše vladara?", "Korak 2: Šta znači kada se vladar kruniše sam?", "Iz lekcije: udžbenik pita šta je Napoleon želeo da pokaže tim postupkom."], "objasnjenje": "Krunom iz sopstvenih ruku Napoleon pokazuje da je carstvo stekao sam i da nije podređen papi.", "iz_udzbenika": {"strana": 55, "odeljak": "Krunisanje u Notr Damu", "tekst": "Udžbenik pita zašto Napoleon nije papi prepustio čin krunisanja.", "slika": "07-napoleonovo-doba/03-krunisanje-napoleona.jpg"}, "lekcija": 7}, {"id": "l07-car-izvor-karikatura", "vrsta": "izvor", "slika_u_pitanju": true, "tezina": "srednje", "pojmovi": ["napoleon-bonaparta", "velika-britanija"], "izvor": {"autor": "Karikatura iz engleskih novina", "naslov": "Podela sveta (1805, opis)", "tekst": "Za stolom sede engleski ministar i Napoleon i noževima seku zemaljsku kuglu kao kolač: jedan uzima kopno, drugi more.", "napomena": "Opis karikature je prepričan; udžbenik, str. 56."}, "pitanje": "Šta je uzeo Napoleon, a šta engleski ministar?", "odgovori": [{"tekst": "Napoleon kopno, Britanac more", "tacan": true}, {"tekst": "Napoleon more, Britanac kopno", "tacan": false, "zasto": "Britanija je vladala morem (Trafalgar), a Napoleon kopnom Evrope."}, {"tekst": "Obojica po pola mora", "tacan": false, "zasto": "Podela je kopno–more."}, {"tekst": "Napoleon Ameriku, Britanac Aziju", "tacan": false, "zasto": "Karikatura deli kopno i more, a ne kontinente."}], "pomoc": ["Ko je pobedio kod Trafalgara?", "Ko je pobeđivao kopnene bitke?", "Iz lekcije: jedan uzima kopno, a drugi more."], "objasnjenje": "Napoleon je gospodario kopnom Evrope, a Britanija morima — to karikatura i pokazuje.", "iz_udzbenika": {"strana": 56, "odeljak": "Karikatura iz engleskih novina", "tekst": "Karikatura iz 1805: Napoleon i engleski ministar dele Zemlju — jedan uzima kopno, drugi more.", "slika": "07-napoleonovo-doba/04-karikatura-podela-sveta.jpg"}, "lekcija": 7}, {"id": "l07-car-tn-kapija", "vrsta": "tacno_netacno", "slika_u_pitanju": true, "tezina": "lako", "pojmovi": ["trijumfalna-kapija", "bitka-kod-austerlica", "pariz"], "tvrdnja": "Trijumfalnu kapiju u Parizu Napoleon je naručio posle pobede kod Austerlica.", "tacno": true, "pomoc": ["Trijumf znači slavlje pobede.", "Iz lekcije: posle pobede kod Austerlica naručio je izgradnju Trijumfalne kapije."], "objasnjenje": "Tačno — kapija slavi pobedu kod Austerlica; danas je jedan od najpoznatijih spomenika Pariza.", "iz_udzbenika": {"strana": 56, "odeljak": "Trijumfalna kapija", "tekst": "Posle pobede kod Austerlica Napoleon je naručio izgradnju Trijumfalne kapije.", "slika": "07-napoleonovo-doba/05-trijumfalna-kapija.jpg"}, "lekcija": 7}, {"id": "l07-car-izbor-kapija-uzor", "vrsta": "izbor", "slika_u_pitanju": true, "tezina": "srednje", "pojmovi": ["trijumfalna-kapija"], "pitanje": "Po uzoru na vladare kog carstva je Napoleon podigao slavoluk?", "odgovori": [{"tekst": "Rimskog carstva", "tacan": true}, {"tekst": "Osmanskog carstva", "tacan": false, "zasto": "Slavoluci za pobede su obeležje starog Rima, ne Osmanlija."}, {"tekst": "Ruskog carstva", "tacan": false, "zasto": "Rusija je bila Napoleonov savremeni protivnik, ne uzor."}, {"tekst": "Kineskog carstva", "tacan": false, "zasto": "Slavoluke za trijumf podizali su rimski carevi."}], "pomoc": ["Seti se građevina iz starog veka koje su slavile pobede vojskovođa.", "Napoleon se, kao i oni, nazivao carem i slavio pobede.", "Iz lekcije: odgovor je Rimsko carstvo."], "objasnjenje": "Rimski carevi podizali su slavoluke u čast pobeda; Napoleon ih je oponašao.", "iz_udzbenika": {"strana": 56, "odeljak": "Trijumfalna kapija", "tekst": "Udžbenik pita po uzoru na vladare kog carstva je Napoleon podigao slavoluk.", "slika": "07-napoleonovo-doba/05-trijumfalna-kapija.jpg"}, "lekcija": 7}, {"id": "l07-car-datum-zenidba", "vrsta": "datum", "tezina": "tesko", "pojmovi": ["marija-lujza", "trijumfalna-kapija"], "dogadjaj": "Napoleonova ženidba Marijom Lujzom", "pitanje": "Koje godine se Napoleon oženio austrijskom princezom Marijom Lujzom?", "godina": 1810, "traka": "dogadjaji", "pomoc": ["Između saveza sa Rusijom (1807) i pohoda na Rusiju (1812).", "Okrugla godina.", "Iz lekcije: ženidba Marijom Lujzom 1810."], "objasnjenje": "Napoleon se 1810. oženio Marijom Lujzom, austrijskom princezom.", "iz_udzbenika": {"strana": 56, "odeljak": "Trijumfalna kapija", "tekst": "Gradnja kapije vezana je za careve ženidbu Marijom Lujzom 1810.", "slika": "07-napoleonovo-doba/05-trijumfalna-kapija.jpg"}, "lekcija": 7}, {"id": "l07-karta1-izbor-bitke", "vrsta": "izbor", "slika_u_pitanju": true, "tezina": "srednje", "pojmovi": ["bitka-kod-trafalgara", "bitka-kod-austerlica", "bitka-kod-borodina", "bitka-naroda", "bitka-kod-vaterloa", "abukir"], "pitanje": "Koje bitke su označene na karti Evrope u doba Napoleona? (više tačnih)", "odgovori": [{"tekst": "Trafalgar 1805.", "tacan": true}, {"tekst": "Austerlic 1805.", "tacan": true}, {"tekst": "Borodino 1812.", "tacan": true}, {"tekst": "Vaterlo 1815.", "tacan": true}, {"tekst": "Kosovska bitka", "tacan": false, "zasto": "Kosovska bitka je iz srednjeg veka (1389), nema je na ovoj karti."}, {"tekst": "Bitka kod Lepanta", "tacan": false, "zasto": "Lepanto je pomorska bitka iz XVI veka, ne iz Napoleonovog doba."}], "pomoc": ["Na karti su samo bitke iz Napoleonovog doba (1799–1815).", "Izbaci bitke iz srednjeg i novog veka.", "Iz lekcije: Trafalgar, Austerlic, Abukir, Borodino, Lajpcig, Vaterlo."], "objasnjenje": "Karta pokazuje Trafalgar i Austerlic (1805), Abukir (1799), Borodino (1812), Lajpcig (1813) i Vaterlo (1815).", "iz_udzbenika": {"strana": 57, "odeljak": "Karta: Evropa u doba Napoleona", "tekst": "Karta označava velike bitke Napoleonovog doba.", "slika": "07-napoleonovo-doba/06-karta-evropa-u-doba-napoleona.jpg"}, "lekcija": 7}, {"id": "l07-karta1-datum-abukir", "vrsta": "datum", "slika_u_pitanju": true, "tezina": "tesko", "pojmovi": ["abukir", "egipat"], "dogadjaj": "Bitka kod Abukira", "pitanje": "Koja godina stoji na karti uz bitku kod Abukira u Egiptu?", "godina": 1799, "traka": "dogadjaji", "pomoc": ["Pogledaj jugoistok karte, kod ušća Nila.", "Iste godine kao prevrat protiv Direktorijuma.", "Iz lekcije: Abukir 1799."], "objasnjenje": "Na karti piše Abukir 1799 — kraj egipatskog pohoda.", "iz_udzbenika": {"strana": 57, "odeljak": "Karta: Evropa u doba Napoleona", "tekst": "Na karti je u Egiptu označena bitka kod Abukira 1799.", "slika": "07-napoleonovo-doba/06-karta-evropa-u-doba-napoleona.jpg"}, "lekcija": 7}, {"id": "l07-karta1-uporedi-boje", "vrsta": "uporedi", "slika_u_pitanju": true, "tezina": "tesko", "pojmovi": ["prvo-francusko-carstvo", "rajnski-savez", "habzburska-monarhija", "osmansko-carstvo"], "a": "Pod Napoleonovom vlašću ili zavisna", "b": "Van Napoleonove vlasti", "pitanje": "Prema karti, gde spada koja država — pod Napoleonovom vlašću (ili zavisna), van nje, oba ili nijedno?", "tvrdnje": [{"tekst": "Španija", "odgovor": "a", "zasto": "Na karti je plava — pod Napoleonovom vlašću (okupirana)."}, {"tekst": "Rajnski savez", "odgovor": "a", "zasto": "Svetloplav — zavisan od Napoleona."}, {"tekst": "Velika Britanija", "odgovor": "b", "zasto": "Crveno-narandžasta — nikad nije pokorena."}, {"tekst": "Osmansko carstvo", "odgovor": "b", "zasto": "Zeleno-žuto — van Napoleonove vlasti."}, {"tekst": "Habzburška monarhija", "odgovor": "b", "zasto": "Narandžasta — poražena, ali nije pod francuskom vlašću."}, {"tekst": "Švajcarska", "odgovor": "a", "zasto": "Zavisna od Napoleona."}], "pomoc": ["Plave nijanse = Napoleonova vlast; ostale boje = van nje.", "Britanija je ostrvo koje nije osvojio.", "Iz lekcije: legenda razlikuje carstvo, države pod vlašću i zavisne države."], "objasnjenje": "Plavo su carstvo, države pod vlašću (Španija, Italija) i zavisne (Rajnski savez, Švajcarska); Britanija, Habzburška monarhija i Osmansko carstvo su van.", "iz_udzbenika": {"strana": 57, "odeljak": "Karta: Evropa u doba Napoleona", "tekst": "Legenda karte razlikuje Napoleonovo carstvo, države pod njegovom vlašću i države zavisne od njega.", "slika": "07-napoleonovo-doba/06-karta-evropa-u-doba-napoleona.jpg"}, "lekcija": 7}, {"id": "l07-karta1-tn-egipat", "vrsta": "tacno_netacno", "slika_u_pitanju": true, "tezina": "srednje", "pojmovi": ["egipat", "abukir"], "tvrdnja": "Na karti strelica Napoleonovog pohoda na Egipat ide od Đenove preko Malte do Abukira.", "tacno": true, "pomoc": ["Prati tamnu strelicu preko Sredozemnog mora.", "Iz lekcije: put vodi od Đenove preko Malte do Abukira, Kaira i Ake."], "objasnjenje": "Tačno — tamna strelica vodi iz Đenove, preko Malte, do Abukira u Egiptu.", "iz_udzbenika": {"strana": 57, "odeljak": "Karta: Evropa u doba Napoleona", "tekst": "Strelica pohoda na Egipat vodi od Đenove preko Malte do Abukira.", "slika": "07-napoleonovo-doba/06-karta-evropa-u-doba-napoleona.jpg"}, "lekcija": 7}, {"id": "l07-car-objasni-austerlic", "vrsta": "objasni", "tezina": "srednje", "pojmovi": ["bitka-kod-austerlica", "ilirske-provincije", "sveto-rimsko-carstvo", "rajnski-savez"], "pitanje": "Kakve su bile posledice Napoleonove pobede kod Austerlica?", "uzor": "Austrija je početkom 1806. morala da prihvati mir i izgubila je niz teritorija. Francuska je dobila Veneciju, Dalmaciju, Dubrovnik i Istru, a od jadranskih oblasti nastale su Ilirske provincije. Ukinuto je Sveto rimsko carstvo nemačkog naroda, a manje nemačke države okupljene su u Rajnski savez. Napoleon je u čast pobede naručio Trijumfalnu kapiju.", "ideje": ["Mir 1806; Austrija gubi teritorije.", "Ilirske provincije (Dalmacija, Dubrovnik, Istra).", "Ukinuto Sveto rimsko carstvo; nastaje Rajnski savez.", "Trijumfalna kapija u Parizu."], "objasnjenje": "Austerlic je preuredio srednju Evropu u Napoleonovu korist.", "iz_udzbenika": {"strana": 56, "odeljak": "Napoleonovo carstvo", "tekst": "Posle Austerlica Austrija gubi teritorije, nastaju Ilirske provincije i Rajnski savez."}, "lekcija": 7}]}, {"naslov": "7. Pohod na Rusiju", "zadaci": [{"id": "l07-rus-izbor-razlog", "vrsta": "izbor", "tezina": "lako", "pojmovi": ["rusija", "kontinentalna-blokada", "pohod-na-rusiju"], "pitanje": "Zašto je Napoleon 1812. krenuo u rat protiv Rusije?", "odgovori": [{"tekst": "Rusija se nije u potpunosti pridržavala kontinentalne blokade", "tacan": true}, {"tekst": "Rusija je napala Pariz", "tacan": false, "zasto": "Saveznička vojska ušla je u Pariz tek 1814, posle Napoleonovih poraza."}, {"tekst": "Rusi su potopili francusku flotu kod Trafalgara", "tacan": false, "zasto": "Flotu kod Trafalgara potopili su Britanci."}, {"tekst": "Rusija je ukinula Mletačku republiku", "tacan": false, "zasto": "Mletačku republiku ukinuo je sam Napoleon 1797."}], "pomoc": ["Seti se Napoleonove zabrane trgovine sa Britanijom.", "Rusija je ipak prodavala robu Britaniji.", "Iz lekcije: Rusija se nije sasvim pridržavala kontinentalne blokade."], "objasnjenje": "Rusija je trgovala sa Britanijom i tako kršila blokadu — zato je Napoleon krenuo u rat.", "iz_udzbenika": {"strana": 57, "odeljak": "Pohod na Rusiju", "tekst": "Rusija se nije sasvim pridržavala kontinentalne blokade, pa je Napoleon 1812. odlučio da krene u rat."}, "lekcija": 7}, {"id": "l07-rus-izbor-izvoz", "vrsta": "izbor", "tezina": "srednje", "pojmovi": ["rusija", "velika-britanija"], "pitanje": "Kome je donosio zaradu izvoz ruskih poljoprivrednih proizvoda u Britaniju?", "odgovori": [{"tekst": "Ruskom plemstvu", "tacan": true}, {"tekst": "Francuskim trgovcima", "tacan": false, "zasto": "Francuskoj je trgovina sa Britanijom bila zabranjena."}, {"tekst": "Osmanskom sultanu", "tacan": false, "zasto": "Reč je o ruskim proizvodima i ruskoj zaradi."}, {"tekst": "Napoleonu", "tacan": false, "zasto": "Napoleonu je ta trgovina smetala — zato je i krenuo u rat."}], "pomoc": ["Ko je u Rusiji posedovao zemlju i imanja?", "Najbogatiji sloj ruskog društva.", "Iz lekcije: izvoz u Britaniju donosio je zaradu ruskom plemstvu."], "objasnjenje": "Rusko plemstvo, vlasnici imanja, zarađivalo je prodajom žita i drugih poljoprivrednih proizvoda Britaniji.", "iz_udzbenika": {"strana": 57, "odeljak": "Pohod na Rusiju", "tekst": "Izvoz poljoprivrednih proizvoda u Veliku Britaniju donosio je zaradu ruskom plemstvu."}, "lekcija": 7}, {"id": "l07-rus-izbor-velicina", "vrsta": "izbor", "tezina": "lako", "pojmovi": ["pohod-na-rusiju"], "pitanje": "Koliko je otprilike ljudi imala Napoleonova vojska koja je 1812. ušla u Rusiju?", "odgovori": [{"tekst": "Oko 660.000", "tacan": true}, {"tekst": "Oko 20.000", "tacan": false, "zasto": "Toliko se vojnika vratilo iz Rusije, a ne ušlo u nju."}, {"tekst": "Oko 6.000", "tacan": false, "zasto": "Vojska je bila ogromna — stotine hiljada ljudi."}, {"tekst": "Oko 6 miliona", "tacan": false, "zasto": "Toliko velike vojske nije bilo; brojka je oko 660.000."}], "pomoc": ["Udžbenik je naziva ogromnom vojskom.", "Broj je više od pola miliona.", "Iz lekcije: oko 660.000 ljudi."], "objasnjenje": "U Rusiju je u junu 1812. ušla vojska od oko 660.000 ljudi.", "iz_udzbenika": {"strana": 57, "odeljak": "Pohod na Rusiju", "tekst": "U junu 1812. Napoleonova vojska od oko 660.000 ljudi ušla je u Rusiju."}, "lekcija": 7}, {"id": "l07-rus-izbor-povratak", "vrsta": "izbor", "tezina": "lako", "pojmovi": ["pohod-na-rusiju"], "pitanje": "Koliko se francuskih vojnika vratilo iz Rusije?", "odgovori": [{"tekst": "Samo oko 20.000", "tacan": true}, {"tekst": "Oko 660.000 — svi", "tacan": false, "zasto": "Toliko ih je ušlo; vojska je skoro potpuno uništena."}, {"tekst": "Oko polovine", "tacan": false, "zasto": "Vratio se samo mali deo — oko 20.000."}, {"tekst": "Nijedan", "tacan": false, "zasto": "Vratilo se oko 20.000 vojnika."}], "pomoc": ["Pohod je bio katastrofa.", "Broj je manji od jedne tridesetine vojske.", "Iz lekcije: vratilo se samo oko 20.000 francuskih vojnika."], "objasnjenje": "Od oko 660.000 vratilo se samo oko 20.000 vojnika.", "iz_udzbenika": {"strana": 57, "odeljak": "Pohod na Rusiju", "tekst": "Iz Rusije se vratilo samo oko 20.000 francuskih vojnika."}, "lekcija": 7}, {"id": "l07-rus-tn-kutuzov", "vrsta": "tacno_netacno", "tezina": "lako", "pojmovi": ["bitka-kod-borodina", "kutuzov"], "tvrdnja": "U bici kod Borodina Napoleonova vojska sukobila se sa trupama ruskog generala Kutuzova.", "tacno": true, "pomoc": ["Ko je vodio Ruse?", "Iz lekcije: kod Borodina — protiv trupa generala Kutuzova."], "objasnjenje": "Tačno — kod Borodina protivnik je bio ruski general Kutuzov.", "iz_udzbenika": {"strana": 57, "odeljak": "Pohod na Rusiju", "tekst": "Kod Borodina Napoleonova vojska sukobila se sa trupama generala Kutuzova."}, "osa": {"naziv": "Bitka kod Borodina", "od": 1812, "traka": "dogadjaji"}, "lekcija": 7}, {"id": "l07-rus-tn-borodino-pobeda", "vrsta": "tacno_netacno", "tezina": "srednje", "pojmovi": ["bitka-kod-borodina"], "tvrdnja": "Bitka kod Borodina završila se velikom pobedom Rusa i Napoleon nije stigao do Moskve.", "tacno": false, "ispravke": [{"tekst": "Bitka je imala nerešen ishod uz velike gubitke obe strane, a Napoleon je ušao u Moskvu.", "tacan": true}, {"tekst": "Napoleon je kod Borodina pobedio i Rusija se odmah predala.", "tacan": false, "zasto": "Ishod je bio nerešen, a Rusija se nije predala."}, {"tekst": "Kod Borodina je poginuo general Kutuzov.", "tacan": false, "zasto": "Udžbenik to ne kaže — kaže samo da su gubici bili veliki na obe strane."}], "pomoc": ["Da li je Napoleon posle bitke ušao u Moskvu?", "Iz lekcije: nerešen ishod, veliki gubici, Napoleon ulazi u Moskvu."], "objasnjenje": "Netačno — ishod je bio nerešen, a Napoleon je posle bitke ušao u Moskvu.", "iz_udzbenika": {"strana": 57, "odeljak": "Pohod na Rusiju", "tekst": "I pored nerešenog ishoda i velikih gubitaka, Napoleon je ušao u Moskvu."}, "lekcija": 7}, {"id": "l07-rus-tn-moskva", "vrsta": "tacno_netacno", "tezina": "tesko", "pojmovi": ["moskva", "pohod-na-rusiju"], "tvrdnja": "Napoleon je u Moskvi zatekao bogat grad pun zaliha i u njemu prezimio sa vojskom.", "tacno": false, "ispravke": [{"tekst": "Moskva je bila napuštena i zapaljena, pa je Napoleon odlučio da se povuče.", "tacan": true}, {"tekst": "Napoleon nikad nije stigao do Moskve.", "tacan": false, "zasto": "Ušao je u Moskvu posle Borodina."}, {"tekst": "Moskvu su branili Britanci, pa se morao povući.", "tacan": false, "zasto": "Grad je bio napušten; Britanci nisu bili u Moskvi."}], "pomoc": ["Kakvu su taktiku Rusi primenjivali dok su se povlačili?", "Iz lekcije: zatekao je napušten i zapaljen grad i odlučio se na povlačenje."], "objasnjenje": "Netačno — Rusi su sve palili za sobom; Moskva je bila napuštena i u plamenu, pa se Napoleon povukao.", "iz_udzbenika": {"strana": 57, "odeljak": "Pohod na Rusiju", "tekst": "Napoleon je zatekao napuštenu i zapaljenu Moskvu i odlučio da se povuče."}, "lekcija": 7}, {"id": "l07-rus-dopuni-tok", "vrsta": "dopuni", "tezina": "lako", "pojmovi": ["pohod-na-rusiju", "moskva", "bitka-kod-borodina", "kutuzov"], "pitanje": "Dopuni rečenice o pohodu na Rusiju.", "tekst": "Napoleonova vojska ušla je u Rusiju u {{junu}} 1812. Kod {{Borodina}} se sukobila sa trupama generala {{Kutuzova}}, a zatim je ušla u {{Moskvu}}.", "ponudjene": ["junu", "decembru", "Borodina", "Lajpciga", "Kutuzova", "Nelsona", "Moskvu", "Berlin"], "pomoc": ["Vojska je krenula leti, a vraćala se zimi.", "Nelson je bio admiral na moru.", "Iz lekcije: jun 1812, Borodino, general Kutuzov, Moskva."], "objasnjenje": "Jun 1812 → Borodino (Kutuzov) → Moskva.", "iz_udzbenika": {"strana": 57, "odeljak": "Pohod na Rusiju", "tekst": "U junu 1812. vojska ulazi u Rusiju, bije se kod Borodina sa Kutuzovom i ulazi u Moskvu."}, "lekcija": 7}, {"id": "l07-rus-dopuni-brojevi", "vrsta": "dopuni", "tezina": "srednje", "pojmovi": ["pohod-na-rusiju"], "pitanje": "Dopuni brojevima.", "tekst": "U Rusiju je ušlo oko {{660.000|660000|660 000}} ljudi, a vratilo se samo oko {{20.000|20000|20 000}} francuskih vojnika.", "ponudjene": ["660.000", "20.000", "200.000", "66.000"], "pomoc": ["Prvi broj je više od pola miliona.", "Drugi broj je nekoliko desetina hiljada.", "Iz lekcije: oko 660.000 ušlo, oko 20.000 vratilo se."], "objasnjenje": "Od oko 660.000 vojnika vratilo se oko 20.000.", "iz_udzbenika": {"strana": 57, "odeljak": "Pohod na Rusiju", "tekst": "Vojska od oko 660.000 ljudi uništena je; vratilo se oko 20.000 vojnika."}, "lekcija": 7}, {"id": "l07-rus-datum-pohod", "vrsta": "datum", "tezina": "lako", "pojmovi": ["pohod-na-rusiju"], "dogadjaj": "Pohod na Rusiju", "pitanje": "Koje godine je Napoleon krenuo u pohod na Rusiju?", "godina": 1812, "traka": "dogadjaji", "pomoc": ["Pet godina posle saveza sa Aleksandrom I (1807).", "Godinu dana pre Bitke naroda kod Lajpciga.", "Iz lekcije: pohod na Rusiju 1812."], "objasnjenje": "Pohod na Rusiju bio je 1812.", "iz_udzbenika": {"strana": 57, "odeljak": "Pohod na Rusiju", "tekst": "Napoleon je 1812. odlučio da krene u rat protiv Rusije."}, "lekcija": 7}, {"id": "l07-rus-datum-borodino", "vrsta": "datum", "tezina": "srednje", "pojmovi": ["bitka-kod-borodina"], "dogadjaj": "Bitka kod Borodina", "pitanje": "Koje godine je vođena bitka kod Borodina?", "godina": 1812, "traka": "dogadjaji", "pomoc": ["Za vreme pohoda na Moskvu.", "Na karti uz Borodino stoji godina pohoda na Rusiju.", "Iz lekcije: Borodino 1812."], "objasnjenje": "Bitka kod Borodina vođena je 1812, na putu ka Moskvi.", "iz_udzbenika": {"strana": 57, "odeljak": "Pohod na Rusiju", "tekst": "Na putu ka Moskvi, 1812, vođena je bitka kod Borodina."}, "lekcija": 7}, {"id": "l07-rus-lanac-spaljena", "vrsta": "lanac", "tezina": "srednje", "pojmovi": ["rusija", "moskva", "pohod-na-rusiju"], "karike": ["Rusi se povlače i pale sve za sobom", "Napoleon ulazi u napuštenu i zapaljenu Moskvu", "?", "Oštra zima i ruski napadi uništavaju francusku vojsku"], "praznina": 2, "odgovori": [{"tekst": "Napoleon odlučuje da se povuče", "tacan": true}, {"tekst": "Rusija potpisuje mir i predaje se", "tacan": false, "zasto": "Rusija se nije predala — nastavila je da napada vojsku u povlačenju."}, {"tekst": "Napoleon se proglašava ruskim carem", "tacan": false, "zasto": "U spaljenom gradu nije mogao da ostane, a kamoli da zavlada."}], "pomoc": ["Korak 1: Može li vojska prezimiti u spaljenom gradu bez hrane?", "Korak 2: Šta onda preostaje?", "Iz lekcije: zatekao je zapaljen grad i odlučio se na povlačenje."], "objasnjenje": "Bez zaliha u spaljenoj Moskvi Napoleon se povukao — a u povlačenju su ga dotukli zima i ruski napadi.", "iz_udzbenika": {"strana": 57, "odeljak": "Pohod na Rusiju", "tekst": "U zapaljenoj Moskvi Napoleon se odlučio na povlačenje; zima i ruski napadi uništili su vojsku."}, "lekcija": 7}, {"id": "l07-rus-lanac-blokada", "vrsta": "lanac", "tezina": "lako", "pojmovi": ["kontinentalna-blokada", "rusija", "pohod-na-rusiju"], "karike": ["Rusko plemstvo zarađuje izvozom u Britaniju", "?", "Napoleon 1812. kreće u rat protiv Rusije"], "praznina": 1, "odgovori": [{"tekst": "Rusija ne poštuje u potpunosti kontinentalnu blokadu", "tacan": true}, {"tekst": "Rusija napada Francusku", "tacan": false, "zasto": "Rat je pokrenuo Napoleon."}, {"tekst": "Rusija se pridružuje Rajnskom savezu", "tacan": false, "zasto": "Rajnski savez su činile nemačke države."}], "pomoc": ["Korak 1: Šta je Napoleon zabranio svim saveznicima?", "Korak 2: Šta znači trgovati sa Britanijom?", "Iz lekcije: Rusija se nije sasvim pridržavala kontinentalne blokade."], "objasnjenje": "Trgovina sa Britanijom = kršenje blokade = razlog za Napoleonov rat protiv Rusije.", "iz_udzbenika": {"strana": 57, "odeljak": "Pohod na Rusiju", "tekst": "Zbog izvoza u Britaniju Rusija nije poštovala blokadu, pa je Napoleon 1812. krenuo u rat."}, "lekcija": 7}, {"id": "l07-rus-zakljuci-poraz", "vrsta": "zakljuci", "tezina": "srednje", "pojmovi": ["pohod-na-rusiju"], "pitanje": "Šta je najviše doprinelo uništenju Napoleonove vojske u Rusiji?", "odgovori": [{"tekst": "Oštra zima i ruski napadi u povlačenju, uz spaljenu zemlju bez zaliha", "tacan": true}, {"tekst": "Jedna velika ruska pobeda kod Borodina", "tacan": false, "zasto": "Borodino je bilo nerešeno; vojska je propala tek u povlačenju."}, {"tekst": "Britanska flota", "tacan": false, "zasto": "Britanska flota nije delovala u unutrašnjosti Rusije."}, {"tekst": "Bolesti u pustinji", "tacan": false, "zasto": "Pustinjska klima i bolesti su mučile vojsku u Egiptu, ne u Rusiji."}], "pomoc": ["Korak 1: Kakav je bio ishod Borodina?", "Korak 2: Šta je čekalo vojsku na povratku iz Moskve?", "Iz lekcije: oštra zima i ruski napadi doveli su do potpunog uništenja."], "objasnjenje": "Vojsku nije uništila jedna bitka, već zima, glad (spaljena zemlja) i stalni napadi Rusa.", "iz_udzbenika": {"strana": 57, "odeljak": "Pohod na Rusiju", "tekst": "Oštra zima i ruski napadi doveli su do potpunog uništenja francuskih snaga."}, "lekcija": 7}, {"id": "l07-rus-izbor-taktika", "vrsta": "izbor", "tezina": "tesko", "pojmovi": ["rusija", "pohod-na-rusiju"], "pitanje": "Zašto je ruska odluka da se povlače i pale sve za sobom bila opasna za Napoleona?", "odgovori": [{"tekst": "Ogromna vojska nije mogla da nađe hranu i sklonište na putu kroz spaljenu zemlju", "tacan": true}, {"tekst": "Zato što su Rusi tako brzo osvojili Pariz", "tacan": false, "zasto": "Povlačenje je bilo u Rusiji; saveznici su u Pariz ušli tek 1814."}, {"tekst": "Zato što je vatra uništila francusku flotu", "tacan": false, "zasto": "Flota je uništena kod Trafalgara 1805, a pohod je bio kopneni."}, {"tekst": "Nije bila opasna — Napoleon je zbog nje pobedio", "tacan": false, "zasto": "Pohod se pretvorio u njegov prvi veliki poraz."}], "pomoc": ["Šta treba vojsci od 660.000 ljudi svakog dana?", "Šta ostaje iza vojske koja sve pali?", "Iz lekcije: Rusi su palili sve za sobom, a i Moskvu su zatekli zapaljenu."], "objasnjenje": "Spaljena zemlja ostavila je ogromnu vojsku bez hrane i skloništa, što je pred zimu bilo pogubno.", "iz_udzbenika": {"strana": 57, "odeljak": "Pohod na Rusiju", "tekst": "Povlačeći se pred francuskom vojskom, Rusi su palili sve za sobom."}, "lekcija": 7}, {"id": "l07-rus-povezi-brojevi", "vrsta": "povezi", "tezina": "tesko", "pojmovi": ["pohod-na-rusiju", "bitka-kod-borodina", "moskva"], "pitanje": "Poveži podatak o pohodu na Rusiju sa onim na šta se odnosi.", "parovi": [["Jun 1812.", "Ulazak vojske u Rusiju"], ["Oko 660.000", "Veličina vojske na početku"], ["Oko 20.000", "Vojnici koji su se vratili"], ["Borodino", "Nerešena bitka sa velikim gubicima"], ["Decembar 1812.", "Povlačenje prikazano na slici"]], "pomoc": ["Dva podatka su meseci, dva brojevi.", "Slika povlačenja je zimska.", "Iz lekcije: jun — ulazak; 660.000 — vojska; 20.000 — povratak; decembar — povlačenje."], "objasnjenje": "Jun 1812 ulazak, 660.000 vojnika, Borodino nerešeno, decembar povlačenje, 20.000 preživelih.", "iz_udzbenika": {"strana": 57, "odeljak": "Pohod na Rusiju", "tekst": "Pohod je počeo u junu 1812. sa oko 660.000 ljudi, a završio se povratkom oko 20.000."}, "lekcija": 7}, {"id": "l07-rus-ko-sam-kutuzov", "vrsta": "ko_sam", "tezina": "lako", "pojmovi": ["kutuzov", "bitka-kod-borodina"], "tragovi": ["Bio sam ruski general 1812.", "Moje trupe sukobile su se sa Napoleonom na putu ka Moskvi.", "Bitka kod Borodina sa mnom završila se nerešeno."], "odgovori": [{"tekst": "General Kutuzov", "tacan": true}, {"tekst": "Aleksandar I", "tacan": false, "zasto": "Aleksandar I je bio car, a ne general na bojnom polju."}, {"tekst": "Admiral Nelson", "tacan": false, "zasto": "Nelson je bio britanski admiral iz 1805."}, {"tekst": "Luj XVIII", "tacan": false, "zasto": "Luj XVIII je francuski kralj iz dinastije Burbon."}], "objasnjenje": "To je ruski general Kutuzov.", "iz_udzbenika": {"strana": 57, "odeljak": "Pohod na Rusiju", "tekst": "Kod Borodina Napoleonova vojska sukobila se sa trupama ruskog generala Kutuzova."}, "lekcija": 7}, {"id": "l07-rus-uporedi-egipat-rusija", "vrsta": "uporedi", "tezina": "lako", "pojmovi": ["egipat", "pohod-na-rusiju"], "a": "Pohod na Egipat", "b": "Pohod na Rusiju", "pitanje": "Na koji pohod se odnosi tvrdnja — Egipat, Rusija, oba ili nijedan?", "tvrdnje": [{"tekst": "Vojnici su stradali od surove klime.", "odgovor": "oba", "zasto": "U Egiptu vrućina i bolesti, u Rusiji oštra zima."}, {"tekst": "Bila je pobeda kod piramida.", "odgovor": "a", "zasto": "Bitka kod piramida bila je u Egiptu."}, {"tekst": "Grad u koji je ušao bio je zapaljen.", "odgovor": "b", "zasto": "Moskva je bila napuštena i zapaljena."}, {"tekst": "Napoleon je napustio vojsku da bi stigao u Francusku na prevrat.", "odgovor": "a", "zasto": "To je bilo u Egiptu, 1799."}, {"tekst": "Završio se Napoleonovom pobedom i osvajanjem zemlje.", "odgovor": "nijedan", "zasto": "Oba pohoda su propala."}], "pomoc": ["Jedan je u vrućoj, drugi u hladnoj zemlji.", "Kod piramida — Afrika; Moskva — Rusija.", "Iz lekcije: Egipat 1798/99, Rusija 1812 — oba neuspešna."], "objasnjenje": "U oba pohoda klima je desetkovala vojsku i oba su propala; piramide i prevrat vezani su za Egipat, zapaljena Moskva za Rusiju.", "iz_udzbenika": {"strana": 57, "odeljak": "Pohod na Rusiju", "tekst": "U Rusiji su oštra zima i ruski napadi uništili francusku vojsku."}, "lekcija": 7}, {"id": "l07-rus-objasni-poraz", "vrsta": "objasni", "tezina": "srednje", "pojmovi": ["pohod-na-rusiju", "kontinentalna-blokada", "moskva"], "pitanje": "Objasni zašto se pohod na Rusiju pretvorio u prvi veliki Napoleonov poraz.", "uzor": "Napoleon je napao Rusiju 1812. jer je kršila kontinentalnu blokadu. Rusi su se povlačili i palili sve za sobom, a posle nerešene bitke kod Borodina Napoleon je zatekao napuštenu i zapaljenu Moskvu. Morao je da se povuče, a oštra zima i ruski napadi uništili su vojsku — od oko 660.000 vratilo se oko 20.000.", "ideje": ["Rusi su se povlačili i palili sve za sobom.", "Moskva je bila napuštena i zapaljena.", "Oštra zima i ruski napadi u povlačenju.", "Vratilo se samo oko 20.000 od oko 660.000."], "objasnjenje": "Spaljena zemlja, zapaljena Moskva, zima i napadi — ogromna vojska je propala.", "iz_udzbenika": {"strana": 57, "odeljak": "Pohod na Rusiju", "tekst": "Pohod na Rusiju pretvorio se u prvi veliki Napoleonov poraz."}, "lekcija": 7}, {"id": "l07-rus-objasni-razlog", "vrsta": "objasni", "tezina": "lako", "pojmovi": ["kontinentalna-blokada", "rusija"], "pitanje": "Kako je kontinentalna blokada dovela do rata sa Rusijom?", "uzor": "Blokada je zabranjivala trgovinu sa Britanijom. Rusko plemstvo je zarađivalo prodajući poljoprivredne proizvode Britaniji, pa se Rusija nije pridržavala blokade. Zato je Napoleon 1812. krenuo u rat protiv Rusije.", "ideje": ["Blokada je zabranjivala trgovinu sa Britanijom.", "Rusija je trgovala sa Britanijom (zarada plemstva).", "Napoleon je zato napao Rusiju 1812."], "objasnjenje": "Kršenje blokade bilo je povod za pohod na Rusiju.", "iz_udzbenika": {"strana": 57, "odeljak": "Pohod na Rusiju", "tekst": "Rusija se nije pridržavala blokade jer je izvoz u Britaniju donosio zaradu plemstvu."}, "lekcija": 7}, {"id": "l07-rus-izbor-karta-moskva", "vrsta": "izbor", "slika_u_pitanju": true, "tezina": "lako", "pojmovi": ["bitka-kod-borodina", "moskva"], "pitanje": "Koja bitka je na karti označena blizu Moskve?", "odgovori": [{"tekst": "Borodino 1812.", "tacan": true}, {"tekst": "Lajpcig 1813.", "tacan": false, "zasto": "Lajpcig je u nemačkim zemljama, daleko od Moskve."}, {"tekst": "Austerlic 1805.", "tacan": false, "zasto": "Austerlic je u Habzburškoj monarhiji, blizu Beča."}, {"tekst": "Abukir 1799.", "tacan": false, "zasto": "Abukir je u Egiptu."}], "pomoc": ["Pogledaj severoistok karte.", "Bitka iz godine pohoda na Rusiju.", "Iz lekcije: kod Moskve je označeno Borodino 1812."], "objasnjenje": "Blizu Moskve na karti stoji Borodino 1812.", "iz_udzbenika": {"strana": 57, "odeljak": "Karta: Evropa u doba Napoleona", "tekst": "Na karti je kod Moskve označena bitka kod Borodina 1812.", "slika": "07-napoleonovo-doba/06-karta-evropa-u-doba-napoleona.jpg"}, "lekcija": 7}]}, {"naslov": "7. Napoleonov pad", "zadaci": [{"id": "l07-pad-izbor-lajpcig", "vrsta": "izbor", "tezina": "lako", "pojmovi": ["bitka-naroda", "lajpcig"], "pitanje": "Kako se naziva bitka kod Lajpciga 1813. u kojoj je Napoleon poražen?", "odgovori": [{"tekst": "Bitka naroda", "tacan": true}, {"tekst": "Bitka tri cara", "tacan": false, "zasto": "„Bitka tri cara” je Austerlic 1805, gde je Napoleon pobedio."}, {"tekst": "Sto dana", "tacan": false, "zasto": "„Sto dana” je naziv Napoleonove druge vladavine 1815."}, {"tekst": "Bitka kod piramida", "tacan": false, "zasto": "Bitka kod piramida bila je u Egiptu 1798/99."}], "pomoc": ["Protiv Napoleona su se borile vojske mnogih zemalja.", "Naziv govori da su učestvovali mnogi narodi.", "Iz lekcije: „Bitka naroda” kod Lajpciga 1813."], "objasnjenje": "Kod Lajpciga 1813, u „Bici naroda”, Napoleona je porazio novi savez evropskih sila.", "iz_udzbenika": {"strana": 58, "odeljak": "Napoleonov pad", "tekst": "U „Bici naroda” kod Lajpciga 1813. Napoleon je doživeo poraz."}, "osa": {"naziv": "Bitka naroda kod Lajpciga", "od": 1813, "traka": "dogadjaji"}, "lekcija": 7}, {"id": "l07-pad-datum-lajpcig", "vrsta": "datum", "tezina": "srednje", "pojmovi": ["bitka-naroda", "lajpcig"], "dogadjaj": "Bitka naroda kod Lajpciga", "pitanje": "Koje godine je bila „Bitka naroda” kod Lajpciga?", "godina": 1813, "traka": "dogadjaji", "pomoc": ["Godinu dana posle pohoda na Rusiju.", "Godinu dana pre odricanja od prestola.", "Iz lekcije: Lajpcig 1813."], "objasnjenje": "Bitka naroda kod Lajpciga vođena je 1813.", "iz_udzbenika": {"strana": 58, "odeljak": "Napoleonov pad", "tekst": "Napoleon je poražen u Bici naroda kod Lajpciga 1813."}, "lekcija": 7}, {"id": "l07-pad-izbor-elba", "vrsta": "izbor", "tezina": "lako", "pojmovi": ["elba"], "pitanje": "Kuda su pobednici 1814. proterali Napoleona?", "odgovori": [{"tekst": "Na ostrvo Elbu u Sredozemlju", "tacan": true}, {"tekst": "Na ostrvo Svetu Jelenu", "tacan": false, "zasto": "Na Svetu Jelenu je poslat tek posle Vaterloa, 1815."}, {"tekst": "U Moskvu", "tacan": false, "zasto": "Moskva je bila cilj njegovog pohoda 1812, ne mesto progonstva."}, {"tekst": "U Egipat", "tacan": false, "zasto": "Egipat je mesto njegovog pohoda 1798/99."}], "pomoc": ["Prvo progonstvo bilo je blizu Francuske.", "Ostrvo je u Sredozemnom moru.", "Iz lekcije: 1814. proteran je na Elbu."], "objasnjenje": "Posle prvog odricanja (1814) Napoleon je proteran na ostrvo Elbu u Sredozemlju.", "iz_udzbenika": {"strana": 58, "odeljak": "Napoleonov pad", "tekst": "Napoleon se 1814. odrekao prestola i proteran je na ostrvo Elbu u Sredozemlju."}, "lekcija": 7}, {"id": "l07-pad-izbor-sveta-jelena", "vrsta": "izbor", "tezina": "lako", "pojmovi": ["sveta-jelena"], "pitanje": "Gde je Napoleon proveo poslednje godine života?", "odgovori": [{"tekst": "Na ostrvu Sveta Jelena u Atlantskom okeanu", "tacan": true}, {"tekst": "Na ostrvu Elbi", "tacan": false, "zasto": "Sa Elbe je pobegao 1815; posle Vaterloa poslat je na Svetu Jelenu."}, {"tekst": "U Parizu, kao car", "tacan": false, "zasto": "Posle Vaterloa više nije vladao."}, {"tekst": "Na Malti", "tacan": false, "zasto": "Malta je bila samo usputna stanica na putu za Egipat."}], "pomoc": ["Ostrvo je daleko, u okeanu.", "Bio je pod britanskim nadzorom.", "Iz lekcije: do smrti 1821. živeo je na Svetoj Jeleni."], "objasnjenje": "Napoleon je pod britanskim nadzorom živeo na Svetoj Jeleni do smrti 1821.", "iz_udzbenika": {"strana": 58, "odeljak": "Napoleonov pad", "tekst": "Do smrti 1821. Napoleon je živeo pod britanskim nadzorom na ostrvu Sveta Jelena u Atlantskom okeanu."}, "osa": {"naziv": "Napoleonova smrt na Svetoj Jeleni", "od": 1821, "traka": "dogadjaji"}, "lekcija": 7}, {"id": "l07-pad-tn-sto-dana", "vrsta": "tacno_netacno", "tezina": "lako", "pojmovi": ["sto-dana"], "tvrdnja": "Napoleonova druga vladavina 1815. trajala je kratko i naziva se „Napoleonovih sto dana”.", "tacno": true, "pomoc": ["Koliko je trajala vlast posle povratka sa Elbe?", "Iz lekcije: druga vladavina bila je kratka — „Napoleonovih sto dana”."], "objasnjenje": "Tačno — vratio se u proleće 1815, a posle Vaterloa ponovo je izgubio vlast.", "iz_udzbenika": {"strana": 58, "odeljak": "Napoleonov pad", "tekst": "Napoleonova druga vladavina kratko je trajala („Napoleonovih sto dana”)."}, "osa": {"naziv": "Napoleonovih sto dana", "od": 1815, "traka": "vladari"}, "lekcija": 7}, {"id": "l07-pad-tn-vaterlo-francuska", "vrsta": "tacno_netacno", "tezina": "srednje", "pojmovi": ["bitka-kod-vaterloa"], "tvrdnja": "Bitka kod Vaterloa vođena je u Rusiji, protiv ruske vojske.", "tacno": false, "ispravke": [{"tekst": "Vaterlo je u današnjoj Belgiji, a Napoleon se borio protiv brojnijih prusko-britanskih odreda.", "tacan": true}, {"tekst": "Vaterlo je u Španiji, a protivnici su bili Španci.", "tacan": false, "zasto": "Vaterlo je u današnjoj Belgiji; protivnici su bili Prusi i Britanci."}, {"tekst": "Vaterlo je pomorska bitka kod Britanije.", "tacan": false, "zasto": "Vaterlo je kopnena bitka; pomorska bitka je bila Trafalgar."}], "pomoc": ["Pogledaj kartu — Vaterlo je severno od Pariza.", "Iz lekcije: Vaterlo je u današnjoj Belgiji, protivnici prusko-britanski odredi."], "objasnjenje": "Netačno — Vaterlo je u današnjoj Belgiji; Napoleon je izgubio od brojnijih prusko-britanskih snaga.", "iz_udzbenika": {"strana": 58, "odeljak": "Napoleonov pad", "tekst": "Napoleon je doživeo konačan poraz kod Vaterloa u današnjoj Belgiji od brojnijih prusko-britanskih odreda."}, "lekcija": 7}, {"id": "l07-pad-tn-odmetnik", "vrsta": "tacno_netacno", "tezina": "tesko", "pojmovi": ["sto-dana", "napoleon-bonaparta"], "tvrdnja": "Kad se Napoleon 1815. vratio, sile pobednice su ga priznale za zakonitog vladara Francuske.", "tacno": false, "ispravke": [{"tekst": "Sile pobednice proglasile su ga odmetnikom i pretnjom miru.", "tacan": true}, {"tekst": "Sile pobednice su ga pozvale na Bečki kongres kao ravnopravnog.", "tacan": false, "zasto": "Bečki kongres je odlučivao bez njega — vratio je Burbone."}, {"tekst": "Sile su se povukle i ostavile mu sva osvajanja.", "tacan": false, "zasto": "Krenule su u rat i porazile ga kod Vaterloa."}], "pomoc": ["Kako su sile reagovale — mirom ili ratom?", "Iz lekcije: proglasile su ga za odmetnika i pretnju miru."], "objasnjenje": "Netačno — proglašen je odmetnikom i pretnjom miru, a zatim konačno poražen kod Vaterloa.", "iz_udzbenika": {"strana": 58, "odeljak": "Napoleonov pad", "tekst": "Sile pobednice proglasile su Napoleona za odmetnika i pretnju miru."}, "lekcija": 7}, {"id": "l07-pad-dopuni-pad", "vrsta": "dopuni", "tezina": "lako", "pojmovi": ["elba", "sto-dana", "bitka-kod-vaterloa", "sveta-jelena"], "pitanje": "Dopuni rečenice o Napoleonovom padu.", "tekst": "Posle odricanja 1814. Napoleon je proteran na {{Elbu}}. U proleće 1815. vratio se na „{{sto dana}}”, ali je konačno poražen kod {{Vaterloa}}. Umro je 1821. na ostrvu {{Sveta Jelena}}.", "ponudjene": ["Elbu", "Svetu Jelenu", "sto dana", "hiljadu dana", "Vaterloa", "Austerlica", "Sveta Jelena", "Malta"], "pomoc": ["Prvo ostrvo je u Sredozemlju, drugo u Atlantiku.", "Kod Austerlica je pobedio.", "Iz lekcije: Elba 1814, sto dana i Vaterlo 1815, Sveta Jelena do 1821."], "objasnjenje": "Elba (1814) → sto dana i Vaterlo (1815) → Sveta Jelena (do 1821).", "iz_udzbenika": {"strana": 58, "odeljak": "Napoleonov pad", "tekst": "Napoleon je proteran na Elbu, vratio se na sto dana, poražen kod Vaterloa i umro na Svetoj Jeleni."}, "lekcija": 7}, {"id": "l07-pad-dopuni-tesko", "vrsta": "dopuni", "tezina": "tesko", "pojmovi": ["bitka-kod-vaterloa", "sveta-jelena"], "pitanje": "Dopuni bez ponuđenih reči.", "tekst": "Kod Vaterloa, u današnjoj {{Belgiji|Belgija}}, Napoleon je poražen od prusko-{{britanskih|engleskih}} odreda, pa se predao {{Britancima|Englezima}}.", "pomoc": ["Država severno od Francuske, između Francuske i Holandije.", "Ista sila mu je bila glavni neprijatelj sve vreme.", "Iz lekcije: Vaterlo u Belgiji; prusko-britanski odredi; predao se Britancima."], "objasnjenje": "Vaterlo je u današnjoj Belgiji; Napoleona su porazili Prusi i Britanci, a on se predao Britancima.", "iz_udzbenika": {"strana": 58, "odeljak": "Napoleonov pad", "tekst": "Posle poraza kod Vaterloa od prusko-britanskih odreda Napoleon se predao Britancima."}, "lekcija": 7}, {"id": "l07-pad-datum-vaterlo", "vrsta": "datum", "tezina": "lako", "pojmovi": ["bitka-kod-vaterloa"], "dogadjaj": "Bitka kod Vaterloa", "pitanje": "Koje godine je Napoleon konačno poražen kod Vaterloa?", "godina": 1815, "traka": "dogadjaji", "pomoc": ["Iste godine kada su bili „sto dana”.", "Godina kraja Prvog francuskog carstva.", "Iz lekcije: Vaterlo 1815."], "objasnjenje": "Vaterlo je bio 1815. — kraj Napoleonove vlasti.", "iz_udzbenika": {"strana": 58, "odeljak": "Napoleonov pad", "tekst": "Konačan poraz kod Vaterloa bio je 1815."}, "lekcija": 7}, {"id": "l07-pad-datum-abdikacija", "vrsta": "datum", "tezina": "srednje", "pojmovi": ["elba", "napoleon-bonaparta"], "dogadjaj": "Napoleon se odriče prestola", "pitanje": "Koje godine se Napoleon prvi put odrekao prestola?", "godina": 1814, "traka": "dogadjaji", "pomoc": ["Posle ulaska saveznika u Pariz.", "Godinu dana posle Lajpciga.", "Iz lekcije: odrekao se prestola 1814."], "objasnjenje": "Napoleon se odrekao prestola 1814. i proteran je na Elbu.", "iz_udzbenika": {"strana": 58, "odeljak": "Napoleonov pad", "tekst": "Napoleon se odrekao prestola 1814."}, "lekcija": 7}, {"id": "l07-pad-poredjaj", "vrsta": "poredjaj", "tezina": "lako", "pojmovi": ["pohod-na-rusiju", "bitka-naroda", "elba", "bitka-kod-vaterloa"], "pitanje": "Poređaj događaje Napoleonovog pada hronološki.", "stavke": [{"tekst": "Pohod na Rusiju", "godina": 1812, "naziv": "Pohod na Rusiju", "traka": "dogadjaji"}, {"tekst": "Bitka naroda kod Lajpciga", "godina": 1813, "naziv": "Bitka naroda kod Lajpciga", "traka": "dogadjaji"}, {"tekst": "Odricanje od prestola i progonstvo na Elbu", "godina": 1814, "naziv": "Napoleon se odriče prestola", "traka": "dogadjaji"}, {"tekst": "Poraz kod Vaterloa", "godina": 1815, "naziv": "Bitka kod Vaterloa", "traka": "dogadjaji"}], "pomoc": ["Svaki događaj je godinu dana posle prethodnog.", "Rusija je prvi veliki poraz, Vaterlo konačni.", "Iz lekcije: 1812 Rusija, 1813 Lajpcig, 1814 Elba, 1815 Vaterlo."], "objasnjenje": "1812 Rusija → 1813 Lajpcig → 1814 Elba → 1815 Vaterlo.", "iz_udzbenika": {"strana": 58, "odeljak": "Napoleonov pad", "tekst": "Posle Rusije (1812) sledili su Lajpcig (1813), odricanje (1814) i Vaterlo (1815)."}, "lekcija": 7}, {"id": "l07-pad-poredjaj-ceo", "vrsta": "poredjaj", "tezina": "tesko", "pojmovi": ["napoleon-bonaparta", "prevrat-1799", "gradjanski-zakonik", "bitka-kod-austerlica", "pohod-na-rusiju", "sto-dana"], "pitanje": "Poređaj događaje iz cele Napoleonove karijere hronološki.", "stavke": [{"tekst": "Ukidanje Mletačke republike", "godina": 1797, "naziv": "Ukidanje Mletačke republike", "traka": "dogadjaji"}, {"tekst": "Prevrat protiv Direktorijuma", "godina": 1799, "naziv": "Prevrat protiv Direktorijuma", "traka": "dogadjaji"}, {"tekst": "Napoleon postaje doživotni konzul", "godina": 1802, "naziv": "Napoleon doživotni konzul", "traka": "vladari"}, {"tekst": "Građanski zakonik", "godina": 1804, "naziv": "Građanski zakonik (Napoleonov kodeks)", "traka": "ideje"}, {"tekst": "Savez sa Aleksandrom I", "godina": 1807, "naziv": "Savez Napoleona i Aleksandra I", "traka": "dogadjaji"}, {"tekst": "Napoleonovih sto dana", "godina": 1815, "naziv": "Napoleonovih sto dana", "traka": "vladari"}], "pomoc": ["Mletačka republika je ukinuta još pre Konzulata.", "Doživotni konzul je pre zakonika, a savez sa Rusijom posle.", "Iz lekcije: 1797, 1799, 1802, 1804, 1807, 1815."], "objasnjenje": "1797 Venecija → 1799 prevrat → 1802 doživotni konzul → 1804 zakonik → 1807 savez sa Rusijom → 1815 sto dana.", "iz_udzbenika": {"strana": 58, "odeljak": "Napoleonov pad", "tekst": "Napoleonova vlast traje od prevrata 1799. do pada 1815."}, "lekcija": 7}, {"id": "l07-pad-lanac-pariz", "vrsta": "lanac", "tezina": "srednje", "pojmovi": ["bitka-naroda", "elba", "pariz"], "karike": ["Poraz u Bici naroda kod Lajpciga (1813)", "Borbe se vode na granicama Francuske", "?", "Napoleon se odriče prestola i odlazi na Elbu (1814)"], "praznina": 2, "odgovori": [{"tekst": "Saveznička vojska ulazi u Pariz", "tacan": true}, {"tekst": "Napoleon osvaja Moskvu", "tacan": false, "zasto": "U Moskvu je ušao 1812, pre Lajpciga."}, {"tekst": "Francuska pobeđuje kod Vaterloa", "tacan": false, "zasto": "Kod Vaterloa je Napoleon izgubio, i to tek 1815."}], "pomoc": ["Korak 1: Šta se dešava kad neprijatelj probije granicu?", "Korak 2: Koji grad je bio cilj saveznika?", "Iz lekcije: pošto je saveznička vojska ušla u Pariz, Napoleon se odrekao prestola."], "objasnjenje": "Posle Lajpciga rat je prešao na francusku granicu; kad su saveznici ušli u Pariz, Napoleon se odrekao prestola.", "iz_udzbenika": {"strana": 58, "odeljak": "Napoleonov pad", "tekst": "Pošto je saveznička vojska ušla u Pariz, Napoleon se 1814. odrekao prestola."}, "lekcija": 7}, {"id": "l07-pad-lanac-povratak", "vrsta": "lanac", "tezina": "lako", "pojmovi": ["sto-dana", "bitka-kod-vaterloa", "sveta-jelena"], "karike": ["Napoleon se u proleće 1815. vraća u Francusku", "Sile ga proglašavaju odmetnikom", "?", "Do smrti živi na Svetoj Jeleni"], "praznina": 2, "odgovori": [{"tekst": "Konačan poraz kod Vaterloa i predaja Britancima", "tacan": true}, {"tekst": "Pobeda kod Austerlica", "tacan": false, "zasto": "Austerlic je bio 1805."}, {"tekst": "Krunisanje u Notr Damu", "tacan": false, "zasto": "Krunisanje je bilo 1804."}], "pomoc": ["Korak 1: Šta sledi kad te sve sile proglase odmetnikom?", "Korak 2: Gde se taj rat završio?", "Iz lekcije: konačan poraz kod Vaterloa, predaja Britancima, Sveta Jelena."], "objasnjenje": "Povratak → odmetnik → Vaterlo i predaja → Sveta Jelena.", "iz_udzbenika": {"strana": 58, "odeljak": "Napoleonov pad", "tekst": "Posle poraza kod Vaterloa Napoleon se predao Britancima i živeo na Svetoj Jeleni."}, "lekcija": 7}, {"id": "l07-pad-povezi-ostrva", "vrsta": "povezi", "tezina": "srednje", "pojmovi": ["elba", "sveta-jelena"], "pitanje": "Poveži mesto sa događajem iz Napoleonovog pada.", "parovi": [["Lajpcig", "Bitka naroda 1813."], ["Pariz", "Ulazak savezničke vojske 1814."], ["Elba", "Prvo progonstvo"], ["Vaterlo", "Konačan poraz 1815."], ["Sveta Jelena", "Smrt 1821."]], "pomoc": ["Dva mesta su ostrva.", "Jedno ostrvo je u Sredozemlju, drugo u Atlantiku.", "Iz lekcije: Lajpcig 1813, Pariz i Elba 1814, Vaterlo 1815, Sveta Jelena 1821."], "objasnjenje": "Lajpcig — poraz; Pariz — ulazak saveznika; Elba — prvo progonstvo; Vaterlo — kraj; Sveta Jelena — smrt.", "iz_udzbenika": {"strana": 58, "odeljak": "Napoleonov pad", "tekst": "Napoleonov pad vodi od Lajpciga preko Pariza i Elbe do Vaterloa i Svete Jelene."}, "lekcija": 7}, {"id": "l07-pad-uporedi-elba-jelena", "vrsta": "uporedi", "tezina": "srednje", "pojmovi": ["elba", "sveta-jelena"], "a": "Elba", "b": "Sveta Jelena", "pitanje": "Na koje ostrvo se odnosi tvrdnja — Elba, Sveta Jelena, oba ili nijedno?", "tvrdnje": [{"tekst": "Nalazi se u Sredozemnom moru.", "odgovor": "a", "zasto": "Elba je u Sredozemlju."}, {"tekst": "Nalazi se u Atlantskom okeanu.", "odgovor": "b", "zasto": "Sveta Jelena je u Atlantiku."}, {"tekst": "Napoleon je tamo bio prognan.", "odgovor": "oba", "zasto": "Elba 1814, Sveta Jelena posle 1815."}, {"tekst": "Sa njega se vratio u Francusku na sto dana.", "odgovor": "a", "zasto": "Sa Elbe se vratio u proleće 1815."}, {"tekst": "Tamo je umro 1821.", "odgovor": "b", "zasto": "Umro je na Svetoj Jeleni pod britanskim nadzorom."}, {"tekst": "Tamo je vođena Bitka naroda.", "odgovor": "nijedan", "zasto": "Bitka naroda je vođena kod Lajpciga."}], "pomoc": ["Prvo progonstvo je bilo bliže, drugo dalje od Francuske.", "Sa kog ostrva je mogao da pobegne?", "Iz lekcije: Elba 1814 (Sredozemlje); Sveta Jelena do 1821 (Atlantik)."], "objasnjenje": "Elba — blizu, odatle se vratio; Sveta Jelena — daleko u Atlantiku, tamo je umro.", "iz_udzbenika": {"strana": 58, "odeljak": "Napoleonov pad", "tekst": "Napoleon je prognan prvo na Elbu u Sredozemlju, a zatim na Svetu Jelenu u Atlantskom okeanu."}, "lekcija": 7}, {"id": "l07-pad-zakljuci-jelena", "vrsta": "zakljuci", "tezina": "tesko", "pojmovi": ["sveta-jelena", "elba", "sto-dana"], "pitanje": "Zašto su Napoleona drugi put poslali na daleko ostrvo u Atlantskom okeanu, a ne ponovo na Elbu?", "odgovori": [{"tekst": "Sa Elbe, blizu Francuske, već se jednom vratio i ponovo preuzeo vlast", "tacan": true}, {"tekst": "Zato što je Elba u Atlantskom okeanu", "tacan": false, "zasto": "Elba je u Sredozemlju, blizu Francuske — baš zato je odatle mogao da se vrati."}, {"tekst": "Zato što je sam to tražio", "tacan": false, "zasto": "Bio je zarobljenik pod britanskim nadzorom, nije birao."}, {"tekst": "Zato što je na Elbi bio Bečki kongres", "tacan": false, "zasto": "Bečki kongres je zasedao u Beču."}], "pomoc": ["Korak 1: Šta je uradio posle prvog progonstva?", "Korak 2: Šta pobednici žele da spreče?", "Iz lekcije: sa Elbe se 1815. vratio na sto dana."], "objasnjenje": "Pošto je pobegao sa Elbe i vratio se na sto dana, pobednici su ga poslali daleko, pod britanski nadzor.", "iz_udzbenika": {"strana": 58, "odeljak": "Napoleonov pad", "tekst": "Posle sto dana i Vaterloa Napoleon je živeo pod britanskim nadzorom na Svetoj Jeleni."}, "lekcija": 7}, {"id": "l07-pad-izvor-slika", "vrsta": "izvor", "slika_u_pitanju": true, "tezina": "lako", "pojmovi": ["pohod-na-rusiju"], "izvor": {"autor": "Slika iz udžbenika", "naslov": "Povratak Napoleonove vojske iz Rusije, decembar 1812. (opis)", "tekst": "Kroz duboki sneg jaše Napoleon na belom konju, a za njim idu umotani, pogureni vojnici; u prednjem planu leže mrtvi ljudi i konji.", "napomena": "Opis slike je prepričan; udžbenik, str. 58."}, "pitanje": "Kakva je Napoleonova vojska na slici?", "odgovori": [{"tekst": "Iscrpljena, promrzla i desetkovana", "tacan": true}, {"tekst": "Sveža i spremna za novi napad", "tacan": false, "zasto": "Vojnici su pogureni, umotani, a oko njih leže mrtvi."}, {"tekst": "Svečano postrojena za paradu", "tacan": false, "zasto": "Ovo je povlačenje kroz sneg, a ne parada."}, {"tekst": "Odmara se na toplom moru", "tacan": false, "zasto": "Slika prikazuje rusku zimu, decembar 1812."}], "pomoc": ["Pogledaj sneg i ljude na zemlji.", "Od 660.000 vratilo se oko 20.000.", "Iz lekcije: povratak iz Rusije u decembru 1812."], "objasnjenje": "Slika pokazuje vojsku koju su uništili zima i ruski napadi.", "iz_udzbenika": {"strana": 58, "odeljak": "Povratak Napoleonove vojske iz Rusije", "tekst": "Slika prikazuje povratak Napoleonove vojske iz Rusije u decembru 1812.", "slika": "07-napoleonovo-doba/07-povratak-iz-rusije.jpg"}, "lekcija": 7}, {"id": "l07-pad-ko-sam-napoleon-kraj", "vrsta": "ko_sam", "tezina": "srednje", "pojmovi": ["napoleon-bonaparta", "elba", "sveta-jelena"], "tragovi": ["Dva puta sam se odrekao prestola.", "Pobegao sam iz prvog progonstva i vladao još sto dana.", "Umro sam 1821. pod britanskim nadzorom u Atlantskom okeanu."], "odgovori": [{"tekst": "Napoleon Bonaparta", "tacan": true}, {"tekst": "Luj XVI", "tacan": false, "zasto": "Luj XVI nije bio prognan na ostrva."}, {"tekst": "Luj XVIII", "tacan": false, "zasto": "Luj XVIII je vraćen na presto posle Napoleona."}, {"tekst": "Aleksandar I", "tacan": false, "zasto": "Aleksandar I je bio među pobednicima, ne u progonstvu."}], "objasnjenje": "To je Napoleon — Elba, sto dana, Vaterlo, Sveta Jelena.", "iz_udzbenika": {"strana": 58, "odeljak": "Napoleonov pad", "tekst": "Napoleon se dva puta odrekao prestola i umro na Svetoj Jeleni 1821."}, "lekcija": 7}, {"id": "l07-pad-objasni-pad", "vrsta": "objasni", "tezina": "srednje", "pojmovi": ["bitka-naroda", "elba", "sto-dana", "bitka-kod-vaterloa"], "pitanje": "Opiš
