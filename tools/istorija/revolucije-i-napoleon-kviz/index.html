": "Jakobinska diktatura", "tekst": "Robespjer, vođa jakobinaca, rukovodio je Komitetom javnog spasa.", "slika": "06-francuska-revolucija/08-maksimilijan-robespjer.jpg"}, "lekcija": 6}, {"id": "l06-jak-lanac-teror", "vrsta": "lanac", "tezina": "srednje", "pojmovi": ["jakobinska-diktatura", "strahovlada", "zakon-o-sumnjivima"], "karike": ["Rat sa Evropom i stalni unutrašnji sukobi", "Jakobinci uvode diktaturu (1793)", "?", "Osumnjičeni za neprijateljstvo prema revoluciji zatvaraju se ili pogubljuju"], "praznina": 2, "odgovori": [{"tekst": "Donosi se Zakon o sumnjivima i uvodi strahovlada", "tacan": true}, {"tekst": "Proglašava se verska tolerancija", "tacan": false, "zasto": "Verska tolerancija je iz ustava 1791, a ne iz doba terora."}, {"tekst": "Kralj se vraća u Versaj", "tacan": false, "zasto": "Kralj je pogubljen početkom 1793."}], "pomoc": ["Kojim zakonom su jakobinci gušili nemire?", "Zakon je bio usmeren na one koji su samo „sumnjivi”.", "Iz lekcije: strahovlada (teror) uvedena je Zakonom o sumnjivima."], "objasnjenje": "Ratovi i nemiri → diktatura → Zakon o sumnjivima i teror → zatvaranje i pogubljenja.", "iz_udzbenika": {"strana": 50, "odeljak": "Jakobinska diktatura", "tekst": "Da bi suzbili unutrašnje nemire, jakobinci su zaveli strahovladu donošenjem Zakona o sumnjivima."}, "lekcija": 6}, {"id": "l06-jak-lanac-pad", "vrsta": "lanac", "tezina": "tesko", "pojmovi": ["maksimilijan-robespjer", "direktorijum", "komitet-javnog-spasa"], "karike": ["Robespjerova vladavina je nezapamćeno surova", "?", "Robespjer i saradnici su pogubljeni bez suđenja", "Vlast preuzima Direktorijum"], "praznina": 1, "odgovori": [{"tekst": "U leto 1794. u skupštini se kuje zavera protiv Komiteta javnog spasa", "tacan": true}, {"tekst": "Engleska osvaja Pariz", "tacan": false, "zasto": "Lekcija o tome ne govori; jakobinci su, naprotiv, pobeđivali spoljne neprijatelje."}, {"tekst": "Kralj se vraća na presto", "tacan": false, "zasto": "Kralj je pogubljen 1793; posle jakobinaca dolazi Direktorijum."}], "pomoc": ["Ko se okrenuo protiv Robespjera?", "Zavera je skovana u samoj skupštini.", "Iz lekcije: u leto 1794. u skupštini je skovana zavera protiv Komiteta javnog spasa."], "objasnjenje": "Surovost terora okrenula je skupštinu protiv Robespjera; zavera 1794. dovela je do njegovog pogubljenja i do Direktorijuma.", "iz_udzbenika": {"strana": 50, "odeljak": "Jakobinska diktatura", "tekst": "U leto 1794. u skupštini je skovana zavera protiv Komiteta javnog spasa; posle pada jakobinaca vlast je dobio Direktorijum."}, "lekcija": 6}, {"id": "l06-jak-poredjaj-vlasti", "vrsta": "poredjaj", "tezina": "tesko", "pojmovi": ["ustavna-monarhija", "republika", "jakobinska-diktatura", "direktorijum"], "pitanje": "Poređaj oblike vlasti u Francuskoj redom kojim su se smenjivali.", "stavke": [{"tekst": "Ustavna monarhija (prvi ustav)", "godina": 1791, "naziv": "Prvi ustav Francuske", "traka": "dogadjaji"}, {"tekst": "Proglašenje republike", "godina": 1792, "naziv": "Proglašenje republike u Francuskoj", "traka": "dogadjaji"}, {"tekst": "Jakobinska diktatura", "godina": 1793, "do": 1794, "naziv": "Jakobinska diktatura", "traka": "dogadjaji"}, {"tekst": "Direktorijum", "godina": 1795, "do": 1799, "naziv": "Direktorijum", "traka": "vladari"}], "pomoc": ["Prvo kralj sa ustavom, zatim bez kralja.", "Direktorijum dolazi posle pada jakobinaca.", "Iz lekcije: 1791 — 1792 — 1793–1794 — 1795–1799."], "objasnjenje": "Ustavna monarhija (1791) → republika (1792) → jakobinska diktatura (1793–1794) → Direktorijum (1795–1799).", "iz_udzbenika": {"strana": 50, "odeljak": "Jakobinska diktatura", "tekst": "Posle republike i jakobinske diktature vlast je dobio Direktorijum (1795–1799)."}, "lekcija": 6}, {"id": "l06-jak-objasni-diktatura", "vrsta": "objasni", "tezina": "srednje", "pojmovi": ["jakobinska-diktatura", "komitet-javnog-spasa", "strahovlada"], "pitanje": "Kako su jakobinci vladali Francuskom 1793–1794? Opiši svojim rečima.", "uzor": "Jakobinci su izbacili žirondince iz skupštine i u leto 1793. uveli diktaturu. Državom su upravljali odbori, najvažniji je bio Komitet javnog spasa sa Robespjerom na čelu. Zakonom o sumnjivima uveli su strahovladu, pa su osumnjičeni zatvarani ili pogubljivani.", "ideje": ["Izbacili su žirondince i uveli diktaturu.", "Vladali su preko Komiteta javnog spasa (Robespjer).", "Zakon o sumnjivima i strahovlada."], "objasnjenje": "Jakobinska vlast bila je diktatura odbora predvođenih Robespjerom, zasnovana na strahu.", "iz_udzbenika": {"strana": 50, "odeljak": "Jakobinska diktatura", "tekst": "Jakobinci su zaveli diktaturu; Komitetom javnog spasa rukovodio je Robespjer, a Zakonom o sumnjivima uvedena je strahovlada."}, "lekcija": 6}, {"id": "l06-jak-objasni-ocena", "vrsta": "objasni", "tezina": "tesko", "pojmovi": ["jakobinska-diktatura", "maksimilijan-robespjer"], "pitanje": "Kako bi ocenio jakobinsku vlast? Navedi i dobre i loše strane.", "uzor": "Jakobinci su odbranili republiku — odneli su niz pobeda nad spoljnim neprijateljem i doneli mere za siromašne. Ali su vladali nezapamćeno surovo: zatvarali su i pogubljivali sve osumnjičene, a na kraju je i sam Robespjer pogubljen bez suđenja.", "ideje": ["Pobede nad spoljnim neprijateljem.", "Mere u korist siromašnih.", "Surova strahovlada i pogubljenja.", "Lični stav uz obrazloženje."], "objasnjenje": "Dobra ocena uzima u obzir i uspehe (rat, siromašni) i zločine (teror) jakobinske vlasti.", "iz_udzbenika": {"strana": 50, "odeljak": "Jakobinska diktatura", "tekst": "Jakobinska vlada odnela je niz pobeda i donela mere u korist siromašnih, ali je bila nezapamćeno surova."}, "lekcija": 6}, {"id": "l06-jak-zakljuci-teror-lako", "vrsta": "zakljuci", "tezina": "lako", "pojmovi": ["strahovlada", "jakobinci"], "pitanje": "Zašto su jakobinci uveli strahovladu?", "odgovori": [{"tekst": "Da bi suzbili unutrašnje nemire", "tacan": true}, {"tekst": "Da bi vratili kralja na presto", "tacan": false, "zasto": "Jakobinci su bili republikanci; kralj je pogubljen."}, {"tekst": "Da bi dali pravo glasa ženama", "tacan": false, "zasto": "Strahovlada je značila zatvaranje i pogubljenja, a ne nova prava."}, {"tekst": "Da bi ukinuli republikanski kalendar", "tacan": false, "zasto": "Kalendar je ukinut tek 1806."}], "pomoc": ["Korak 1: Sa čim su, osim rata, bili suočeni?", "Korak 2: Strah treba da uguši otpor.", "Iz lekcije: da bi suzbili unutrašnje nemire, zaveli su strahovladu."], "objasnjenje": "Jakobinci su strahovladom hteli da uguše unutrašnje nemire i protivnike revolucije.", "iz_udzbenika": {"strana": 50, "odeljak": "Jakobinska diktatura", "tekst": "Da bi suzbili unutrašnje nemire, jakobinci su zaveli strahovladu (teror)."}, "lekcija": 6}, {"id": "l06-jak-lanac-direktorijum", "vrsta": "lanac", "tezina": "lako", "pojmovi": ["maksimilijan-robespjer", "direktorijum", "jakobinci"], "karike": ["Robespjer i saradnici su pogubljeni (1794)", "Pada vlast jakobinaca", "?"], "praznina": 2, "odgovori": [{"tekst": "Vlast se poverava Direktorijumu", "tacan": true}, {"tekst": "Vlast se vraća Luju XVI", "tacan": false, "zasto": "Luj XVI je pogubljen još 1793."}, {"tekst": "Ponovo se saziva Skupština državnih staleža", "tacan": false, "zasto": "Staleži su ukinuti; vlast dobija Direktorijum."}], "pomoc": ["Ko vlada od 1795. do 1799?", "Vlada od pet direktora.", "Iz lekcije: posle pada jakobinaca vlast je poverena Direktorijumu."], "objasnjenje": "Posle pada jakobinaca vlast je dobio Direktorijum (1795–1799).", "iz_udzbenika": {"strana": 50, "odeljak": "Jakobinska diktatura", "tekst": "Posle pada jakobinaca vlast u Francuskoj je bila poverena Direktorijumu."}, "lekcija": 6}, {"id": "l06-jak-izbor-celo-komiteta", "vrsta": "izbor", "tezina": "lako", "pojmovi": ["komitet-javnog-spasa", "maksimilijan-robespjer"], "pitanje": "Ko je rukovodio Komitetom javnog spasa?", "odgovori": [{"tekst": "Maksimilijan Robespjer", "tacan": true}, {"tekst": "Luj XVI", "tacan": false, "zasto": "Luj XVI je pogubljen pre nego što su jakobinci zaveli diktaturu."}, {"tekst": "Marija Antoaneta", "tacan": false, "zasto": "Kraljica je bila žrtva revolucije, a ne njen vođa."}, {"tekst": "Vođe žirondinaca", "tacan": false, "zasto": "Žirondince su jakobinci izbacili iz skupštine."}], "pomoc": ["Komitet je bio u rukama jakobinaca.", "Njihov vođa bio je pravnik.", "Iz lekcije: Komitetom javnog spasa rukovodio je Robespjer."], "objasnjenje": "Komitetom javnog spasa rukovodio je Robespjer, vođa jakobinaca.", "iz_udzbenika": {"strana": 50, "odeljak": "Jakobinska diktatura", "tekst": "Najznačajniji odbor bio je Komitet javnog spasa, kojim je rukovodio Robespjer.", "slika": "06-francuska-revolucija/08-maksimilijan-robespjer.jpg"}, "lekcija": 6}, {"id": "l06-jak-tn-direktori", "vrsta": "tacno_netacno", "tezina": "lako", "pojmovi": ["direktorijum"], "tvrdnja": "Direktorijum je bila vlada od pet direktora (ministara).", "tacno": true, "pomoc": ["Ime vlade dolazi od njenih članova.", "Iz lekcije: vladu je činilo pet direktora."], "objasnjenje": "Tačno — Direktorijum je činilo pet direktora.", "iz_udzbenika": {"strana": 50, "odeljak": "Jakobinska diktatura", "tekst": "Direktorijum je bila vlada koju je činilo pet direktora (ministara)."}, "lekcija": 6}, {"id": "l06-jak-dopuni-strahovlada", "vrsta": "dopuni", "tezina": "lako", "pojmovi": ["strahovlada", "zakon-o-sumnjivima"], "pitanje": "Dopuni rečenicu.", "tekst": "Jakobinci su doneli Zakon o {{sumnjivima}} i tako uveli {{strahovladu|teror}}.", "ponudjene": ["sumnjivima", "strahovladu", "porezima", "republiku"], "pomoc": ["Zakon je pogađao one koji su „sumnjivi”.", "Vladavina zasnovana na strahu.", "Iz lekcije: Zakonom o sumnjivima uvedena je strahovlada (teror)."], "objasnjenje": "Zakonom o sumnjivima jakobinci su uveli strahovladu.", "iz_udzbenika": {"strana": 50, "odeljak": "Jakobinska diktatura", "tekst": "Jakobinci su zaveli strahovladu (teror) donošenjem Zakona o sumnjivima."}, "lekcija": 6}]}, {"naslov": "6. Posledice Francuske revolucije", "zadaci": [{"id": "l06-pos-izbor-promene", "vrsta": "izbor", "tezina": "lako", "pojmovi": ["francuska-revolucija", "stalezi", "feudalizam", "republika"], "pitanje": "Šta je Francuska revolucija promenila u Francuskoj? (više tačnih)", "odgovori": [{"tekst": "Srušena je monarhija i uvedena republika", "tacan": true}, {"tekst": "Ukinuti su staleži i feudalni poredak", "tacan": true}, {"tekst": "Ukinute su plemićke titule i privilegije", "tacan": true}, {"tekst": "Seljaci su postali kmetovi", "tacan": false, "zasto": "Upravo suprotno — seljaci su postali slobodni i vlasnici zemlje."}, {"tekst": "Sveštenstvo je dobilo nove povlastice", "tacan": false, "zasto": "Povlastice svih staleža su ukinute, a crkvi su oduzeta imanja."}], "pomoc": ["Revolucija ruši stari poredak.", "Seljaci su posle revolucije bili slobodni.", "Iz lekcije: srušena monarhija, uvedena republika, ukinuti staleži, feudalni poredak, titule i privilegije."], "objasnjenje": "Revolucija je srušila monarhiju i uvela republiku, a ukinula staleže, feudalizam, plemićke titule i privilegije.", "iz_udzbenika": {"strana": 51, "odeljak": "Posledice Francuske revolucije", "tekst": "Srušena je monarhija i uvedena republika; ukinuti su staleži, feudalni poredak, plemićke titule i privilegije."}, "lekcija": 6}, {"id": "l06-pos-tn-seljaci", "vrsta": "tacno_netacno", "tezina": "lako", "pojmovi": ["seljastvo", "feudalizam"], "tvrdnja": "Posle revolucije seljaci su postali slobodni i dobili su vlasništvo nad zemljom.", "tacno": true, "pomoc": ["Feudalne obaveze seljaka su ukinute.", "Iz lekcije: seljaci su postali slobodni i dobili vlasništvo nad zemljom."], "objasnjenje": "Tačno — ukidanjem feudalizma seljaci su postali slobodni vlasnici zemlje.", "iz_udzbenika": {"strana": 51, "odeljak": "Posledice Francuske revolucije", "tekst": "Seljaci su postali slobodni i dobili su vlasništvo nad zemljom."}, "lekcija": 6}, {"id": "l06-pos-izbor-gradjani", "vrsta": "izbor", "tezina": "lako", "pojmovi": ["gradjanstvo", "deklaracija-o-pravima-coveka-i-gradjanina"], "pitanje": "Kakav je bio položaj građana pred zakonom posle revolucije?", "odgovori": [{"tekst": "Bili su izjednačeni pred zakonom", "tacan": true}, {"tekst": "Plemići su imali više prava od ostalih", "tacan": false, "zasto": "Plemićke titule i privilegije su ukinute."}, {"tekst": "Samo sveštenici su bili iznad zakona", "tacan": false, "zasto": "Povlastice sveštenstva su ukinute već 1789."}, {"tekst": "Prava su zavisila od staleža", "tacan": false, "zasto": "Staleži su ukinuti."}], "pomoc": ["Seti se Deklaracije.", "Nema više povlastica po rođenju.", "Iz lekcije: građani su izjednačeni pred zakonom."], "objasnjenje": "Posle revolucije svi građani su bili jednaki pred zakonom.", "iz_udzbenika": {"strana": 51, "odeljak": "Posledice Francuske revolucije", "tekst": "Građani su bili izjednačeni pred zakonom."}, "lekcija": 6}, {"id": "l06-pos-povezi-pokreti", "vrsta": "povezi", "tezina": "srednje", "pojmovi": ["nacionalizam", "romantizam"], "pitanje": "Poveži pokret sa njegovim opisom.", "parovi": [["nacionalizam", "politički pokret — svest o pripadnosti jednoj naciji"], ["romantizam", "kulturni pokret"]], "pomoc": ["„Nacija” — narod.", "Jedan je politički, drugi kulturni pokret.", "Iz lekcije: nacionalizam — politički (svest o pripadnosti naciji); romantizam — kulturni."], "objasnjenje": "Nacionalizam je politički pokret zasnovan na svesti o pripadnosti naciji, a romantizam kulturni pokret.", "iz_udzbenika": {"strana": 51, "odeljak": "Posledice Francuske revolucije", "tekst": "Revolucija je uticala na pojavu političkog pokreta nacionalizma i kulturnog pokreta romantizma."}, "osa": {"naziv": "Nacionalizam i romantizam", "od": 1840, "do": 1860, "traka": "ideje", "oznaka": "sredina XIX veka"}, "lekcija": 6}, {"id": "l06-pos-dopuni-pokreti", "vrsta": "dopuni", "tezina": "tesko", "pojmovi": ["nacionalizam", "romantizam"], "pitanje": "Dopuni (bez banke reči).", "tekst": "Francuska revolucija uticala je na pojavu političkog pokreta {{nacionalizma|nacionalizam}} i kulturnog pokreta {{romantizma|romantizam}}, koji će se razviti sredinom {{XIX|19}} veka.", "pomoc": ["Prvi pokret dolazi od reči „nacija”.", "Drugi je pokret u umetnosti i književnosti; vreme — evropske revolucije.", "Iz lekcije: nacionalizam i romantizam, sredinom XIX veka."], "objasnjenje": "Revolucija je uticala na nacionalizam (politički) i romantizam (kulturni), koji se razvijaju sredinom XIX veka.", "iz_udzbenika": {"strana": 51, "odeljak": "Posledice Francuske revolucije", "tekst": "Nacionalizam i romantizam razviće se sredinom XIX veka, u vreme evropskih revolucija."}, "lekcija": 6}, {"id": "l06-pos-zakljuci-evropa", "vrsta": "zakljuci", "tezina": "srednje", "pojmovi": ["francuska-revolucija"], "pitanje": "Kako je Francuska revolucija uticala na druge evropske države?", "odgovori": [{"tekst": "Njene ideje o jednakosti i slobodi pokrenule su iste procese i u drugim državama", "tacan": true}, {"tekst": "Nije imala nikakvog uticaja van Francuske", "tacan": false, "zasto": "Imala je — upravo zato su se evropski dvorovi plašili i ratovali protiv nje."}, {"tekst": "Sve evropske države su odmah postale republike", "tacan": false, "zasto": "Lekcija kaže da će procesi tek početi; monarhije nisu nestale odmah."}, {"tekst": "Uvela je republikanski kalendar u celoj Evropi", "tacan": false, "zasto": "Kalendar je važio samo u Francuskoj i ukinut je 1806."}], "pomoc": ["Korak 1: Koje ideje je širila revolucija?", "Korak 2: Šta se dešava kad ljudi u drugim zemljama čuju za te ideje?", "Iz lekcije: ideje jednakosti i slobode uticale su na druge države, gde će početi isti procesi."], "objasnjenje": "Ideje slobode i jednakosti proširile su se Evropom i pokrenule slične promene u drugim zemljama.", "iz_udzbenika": {"strana": 51, "odeljak": "Posledice Francuske revolucije", "tekst": "Ideje o jednakosti i slobodi uticale su na ostale evropske države, u kojima će početi da se dešavaju isti procesi."}, "lekcija": 6}, {"id": "l06-pos-tn-amerika", "vrsta": "tacno_netacno", "tezina": "srednje", "pojmovi": ["americki-rat-za-nezavisnost", "francuska-revolucija"], "tvrdnja": "Kao i u Američkom ratu za nezavisnost, u Francuskoj je narod preuzeo vlast i počeo da bira svoje predstavnike.", "tacno": true, "pomoc": ["Šta je zajedničko dvema revolucijama iz kraja XVIII veka?", "Iz lekcije: kao u Američkom ratu za nezavisnost, narod je preuzeo vlast i birao predstavnike."], "objasnjenje": "Tačno — u obe revolucije vlast je prešla na narod, koji bira svoje predstavnike.", "iz_udzbenika": {"strana": 51, "odeljak": "Posledice Francuske revolucije", "tekst": "Kao i u Američkom ratu za nezavisnost, narod je preuzeo vlast i počeo da bira svoje predstavnike."}, "lekcija": 6}, {"id": "l06-pos-uporedi-pre-posle", "vrsta": "uporedi", "tezina": "srednje", "pojmovi": ["stalezi", "feudalizam", "republika", "seljastvo"], "a": "Francuska pre revolucije", "b": "Francuska posle revolucije", "pitanje": "Odnosi li se tvrdnja na Francusku pre revolucije, posle nje, na oba perioda ili ni na jedan?", "tvrdnje": [{"tekst": "Društvo je podeljeno na staleže.", "odgovor": "a", "zasto": "Staleži su ukinuti revolucijom."}, {"tekst": "Građani su jednaki pred zakonom.", "odgovor": "b", "zasto": "Jednakost pred zakonom je tekovina revolucije."}, {"tekst": "Seljaci duguju feudalne obaveze plemićima.", "odgovor": "a", "zasto": "Feudalne obaveze su ukinute 1789."}, {"tekst": "Seljaci su vlasnici zemlje.", "odgovor": "b", "zasto": "Posle revolucije seljaci su dobili vlasništvo nad zemljom."}, {"tekst": "Francuska je jedna od velikih evropskih država.", "odgovor": "oba", "zasto": "Francuska je bila velika sila i pre i posle revolucije."}, {"tekst": "Svi stanovnici, i muškarci i žene, imaju pravo glasa.", "odgovor": "nijedan", "zasto": "Ni posle revolucije žene nisu dobile politička prava."}], "pomoc": ["Šta je revolucija ukinula, a šta uvela?", "Žene nisu imale politička prava ni u ustavu 1791.", "Iz lekcije: ukinuti staleži i feudalizam; jednakost pred zakonom; seljaci slobodni vlasnici."], "objasnjenje": "Revolucija je ukinula staleže i feudalne obaveze i uvela jednakost pred zakonom i seljačko vlasništvo — ali ne i pravo glasa za žene.", "iz_udzbenika": {"strana": 51, "odeljak": "Posledice Francuske revolucije", "tekst": "Ukinuti su staleži i feudalni poredak; građani su izjednačeni pred zakonom, a seljaci su postali slobodni vlasnici zemlje."}, "lekcija": 6}, {"id": "l06-pos-lanac-ideje", "vrsta": "lanac", "tezina": "tesko", "pojmovi": ["francuska-revolucija", "nacionalizam"], "karike": ["Revolucija širi ideje slobode i jednakosti", "?", "Sredinom XIX veka izbijaju evropske revolucije, razvijaju se nacionalizam i romantizam"], "praznina": 1, "odgovori": [{"tekst": "Iste ideje prihvataju se u drugim evropskim državama", "tacan": true}, {"tekst": "Evropa zaboravlja na Francusku revoluciju", "tacan": false, "zasto": "Ideje revolucije su ostale žive i pokrenule su nove revolucije."}, {"tekst": "Svuda se vraća feudalizam", "tacan": false, "zasto": "Lekcija govori o širenju ideja slobode, ne o povratku feudalizma."}], "pomoc": ["Kako ideje iz Francuske stižu do evropskih revolucija?", "U drugim zemljama „počinju isti procesi”.", "Iz lekcije: ideje jednakosti i slobode uticale su na ostale evropske države."], "objasnjenje": "Ideje revolucije prešle su granice Francuske; u drugim državama pokrenule su iste procese, sve do revolucija sredinom XIX veka.", "iz_udzbenika": {"strana": 51, "odeljak": "Posledice Francuske revolucije", "tekst": "Ideje o jednakosti i slobodi uticale su na ostale evropske države; nacionalizam i romantizam razviće se sredinom XIX veka."}, "lekcija": 6}, {"id": "l06-pos-objasni-posledice", "vrsta": "objasni", "tezina": "srednje", "pojmovi": ["francuska-revolucija", "feudalizam", "republika", "nacionalizam"], "pitanje": "Navedi najvažnije posledice Francuske revolucije za Francusku i za Evropu.", "uzor": "U Francuskoj je srušena monarhija i uvedena republika, ukinuti su staleži, feudalizam i plemićke povlastice, građani su jednaki pred zakonom, a seljaci slobodni vlasnici zemlje. U Evropi su se proširile ideje slobode i jednakosti, a revolucija je uticala na nacionalizam i romantizam.", "ideje": ["Kraj monarhije, uvedena republika.", "Ukinuti staleži, feudalizam, povlastice.", "Jednakost pred zakonom; slobodni seljaci.", "Širenje ideja po Evropi; nacionalizam i romantizam."], "objasnjenje": "Posledice su i unutrašnje (novo društvo bez staleža) i evropske (širenje ideja, novi pokreti).", "iz_udzbenika": {"strana": 51, "odeljak": "Posledice Francuske revolucije", "tekst": "Francuska revolucija unela je duboke promene u francusku državu i društvo i uticala na druge evropske države."}, "lekcija": 6}, {"id": "l06-sim-izbor-moto", "vrsta": "izbor", "tezina": "lako", "pojmovi": ["sloboda-jednakost-bratstvo", "maksimilijan-robespjer"], "pitanje": "Koji moto iz doba revolucije je danas zvanično geslo Republike Francuske?", "odgovori": [{"tekst": "„Sloboda, jednakost, bratstvo!”", "tacan": true}, {"tekst": "„Bog i kralj”", "tacan": false, "zasto": "To bi bio moto monarhije; revolucija je slavila slobodu i jednakost."}, {"tekst": "„Rad, red i mir”", "tacan": false, "zasto": "Takvo geslo se u lekciji ne pominje."}, {"tekst": "„Razum iznad svega”", "tacan": false, "zasto": "Lekcija navodi Robespjerov moto o slobodi, jednakosti i bratstvu."}], "pomoc": ["Tri reči; prve dve su ideje revolucije.", "Treća reč govori o odnosu među ljudima kao među braćom.", "Iz lekcije: Robespjerov moto „Sloboda, jednakost, bratstvo!”."], "objasnjenje": "Robespjerov moto „Sloboda, jednakost, bratstvo!” odnosio se na sve Francuze i danas je zvanično geslo Francuske.", "iz_udzbenika": {"strana": 51, "odeljak": "Znatiželja: Simboli revolucije – državni simboli Francuske", "tekst": "Robespjerov moto „Sloboda, jednakost, bratstvo!” danas je zvanična krilatica Republike Francuske."}, "lekcija": 6}, {"id": "l06-sim-tn-praznik", "vrsta": "tacno_netacno", "tezina": "lako", "pojmovi": ["bastilja", "francuska"], "tvrdnja": "Pad Bastilje (14. jul) i danas se slavi kao nacionalni praznik Francuske.", "tacno": true, "pomoc": ["Koji događaj se smatra početkom revolucije?", "Iz lekcije: 14. jul se i danas slavi kao nacionalni praznik."], "objasnjenje": "Tačno — 14. jul, dan pada Bastilje, nacionalni je praznik Francuske.", "iz_udzbenika": {"strana": 51, "odeljak": "Znatiželja: Simboli revolucije – državni simboli Francuske", "tekst": "Pad Bastilje (14. jul) i danas se slavi kao nacionalni praznik."}, "lekcija": 6}, {"id": "l06-sim-izbor-marseljeza", "vrsta": "izbor", "tezina": "srednje", "pojmovi": ["marseljeza"], "pitanje": "Kako se prvobitno zvala pesma poznata kao Marseljeza?", "odgovori": [{"tekst": "Ratna pesma Rajnske armije", "tacan": true}, {"tekst": "Pesma Bastilje", "tacan": false, "zasto": "Ime pesme vezano je za vojsku na Rajni, ne za Bastilju."}, {"tekst": "Himna Burbona", "tacan": false, "zasto": "Burboni su kraljevska dinastija; Marseljeza je pesma vojnika republike."}, {"tekst": "Pesma jakobinaca", "tacan": false, "zasto": "Pesma je nazvana po Rajnskoj armiji i postala je omiljena među vojnicima."}], "pomoc": ["Pesma je nastala u vojsci.", "Ta vojska je dobila ime po velikoj reci.", "Iz lekcije: Ratna pesma Rajnske armije, poznata kao Marseljeza."], "objasnjenje": "Marseljeza je nastala kao Ratna pesma Rajnske armije i postala omiljena među vojnicima republike.", "iz_udzbenika": {"strana": 51, "odeljak": "Znatiželja: Simboli revolucije – državni simboli Francuske", "tekst": "Ratna pesma Rajnske armije, poznata kao Marseljeza, bila je široko prihvaćena, posebno među vojnicima republike."}, "lekcija": 6}, {"id": "l06-sim-datum-himna", "vrsta": "datum", "tezina": "srednje", "pojmovi": ["marseljeza"], "dogadjaj": "Marseljeza postaje himna", "pitanje": "Koje godine je Marseljeza proglašena za himnu Francuske?", "godina": 1795, "traka": "ideje", "pomoc": ["Godinu posle pada Robespjera.", "Iste godine kada je počeo Direktorijum.", "Iz lekcije: za himnu je proglašena 1795."], "objasnjenje": "Marseljeza je proglašena za himnu Francuske 1795.", "iz_udzbenika": {"strana": 51, "odeljak": "Znatiželja: Simboli revolucije – državni simboli Francuske", "tekst": "Marseljeza je proglašena za himnu Francuske 1795."}, "lekcija": 6}, {"id": "l06-sim-izbor-boje", "vrsta": "izbor", "slika_u_pitanju": true, "tezina": "srednje", "pojmovi": ["trobojka", "burboni", "pariz"], "pitanje": "Pogledaj francusku zastavu. Šta predstavljaju njene boje?", "odgovori": [{"tekst": "Belu boju dinastije Burbona i plavu i crvenu boju Pariza", "tacan": true}, {"tekst": "Tri staleža francuskog društva", "tacan": false, "zasto": "Revolucija je ukinula staleže; boje su Burbonske i pariske."}, {"tekst": "Slobodu, jednakost i bratstvo, svaka po jednu", "tacan": false, "zasto": "Udžbenik objašnjava boje drugačije — bela je boja Burbona, plava i crvena boje Pariza."}, {"tekst": "Boje Habzburške monarhije", "tacan": false, "zasto": "Habzburzi su bili neprijatelj revolucije; zastava spaja Burbone i Pariz."}], "pomoc": ["Jedna boja potiče od kraljevske dinastije.", "Dve boje pripadaju glavnom gradu.", "Iz lekcije: bela — Burboni, plava i crvena — Pariz."], "objasnjenje": "Trobojka spaja belu boju Burbona sa plavom i crvenom, bojama Pariza.", "iz_udzbenika": {"strana": 51, "odeljak": "Znatiželja: Simboli revolucije – državni simboli Francuske", "tekst": "Trikolora sjedinjuje belu boju dinastije Burbona sa bojama Pariza, plavom i crvenom.", "slika": "06-francuska-revolucija/09-francuska-zastava.jpg"}, "lekcija": 6}, {"id": "l06-sim-datum-zastava", "vrsta": "datum", "tezina": "tesko", "pojmovi": ["trobojka", "jakobinska-diktatura"], "dogadjaj": "Trobojka postaje državna zastava", "pitanje": "Koje godine je trobojka proglašena za državnu zastavu Francuske?", "godina": 1794, "traka": "ideje", "pomoc": ["Desilo se za vreme jakobinske diktature.", "Iste godine kada je pao Robespjer.", "Iz lekcije: 1794, tokom jakobinske diktature."], "objasnjenje": "Trobojka je postala državna zastava 1794, za vreme jakobinske diktature.", "iz_udzbenika": {"strana": 51, "odeljak": "Znatiželja: Simboli revolucije – državni simboli Francuske", "tekst": "Trikolora je proglašena za državnu zastavu tokom jakobinske diktature 1794.", "slika": "06-francuska-revolucija/09-francuska-zastava.jpg"}, "lekcija": 6}, {"id": "l06-sim-povezi", "vrsta": "povezi", "tezina": "srednje", "pojmovi": ["sloboda-jednakost-bratstvo", "marseljeza", "trobojka", "bastilja"], "pitanje": "Poveži simbol Francuske sa podatkom o njemu.", "parovi": [["„Sloboda, jednakost, bratstvo!”", "Robespjerov moto, danas geslo republike"], ["Marseljeza", "himna od 1795."], ["trobojka", "državna zastava od 1794."], ["14. jul", "nacionalni praznik — pad Bastilje"]], "pomoc": ["Jedan simbol se peva, jedan se vije, jedan se izgovara, jedan se slavi.", "Zastava je proglašena godinu pre himne.", "Iz lekcije: moto — Robespjer; Marseljeza 1795; trobojka 1794; 14. jul — praznik."], "objasnjenje": "Svi današnji državni simboli Francuske potiču iz revolucije: geslo, himna (1795), zastava (1794) i praznik 14. jula.", "iz_udzbenika": {"strana": 51, "odeljak": "Znatiželja: Simboli revolucije – državni simboli Francuske", "tekst": "Državni simboli Francuske — geslo, himna, zastava i nacionalni praznik — nastali su u doba revolucije."}, "lekcija": 6}, {"id": "l06-sim-poredjaj", "vrsta": "poredjaj", "tezina": "tesko", "pojmovi": ["bastilja", "trobojka", "marseljeza", "republikanski-kalendar"], "pitanje": "Poređaj hronološki.", "stavke": [{"tekst": "Pad Bastilje (danas nacionalni praznik)", "godina": 1789, "naziv": "Pad Bastilje", "traka": "dogadjaji"}, {"tekst": "Početak republikanskog kalendara", "godina": 1792, "do": 1806, "naziv": "Republikanski kalendar", "traka": "ideje"}, {"tekst": "Trobojka postaje državna zastava", "godina": 1794, "naziv": "Trobojka postaje državna zastava", "traka": "ideje"}, {"tekst": "Marseljeza postaje himna", "godina": 1795, "naziv": "Marseljeza postaje himna", "traka": "ideje"}], "pomoc": ["Revolucija počinje 1789.", "Kalendar počinje danom republike; zastava je iz vremena jakobinaca.", "Iz lekcije: 1789 — 1792 — 1794 — 1795."], "objasnjenje": "Pad Bastilje (1789) → republikanski kalendar (1792) → trobojka (1794) → Marseljeza (1795).", "iz_udzbenika": {"strana": 51, "odeljak": "Znatiželja: Simboli revolucije – državni simboli Francuske", "tekst": "Pad Bastilje je 1789, trobojka je postala zastava 1794, a Marseljeza himna 1795."}, "lekcija": 6}, {"id": "l06-sim-objasni-srbija", "vrsta": "objasni", "tezina": "tesko", "pojmovi": ["trobojka", "marseljeza", "sloboda-jednakost-bratstvo"], "pitanje": "Šta simbolizuju državni simboli Francuske i zašto su nastali baš u revoluciji?", "uzor": "Simboli Francuske — geslo „Sloboda, jednakost, bratstvo”, Marseljeza, trobojka i 14. jul — nastali su u revoluciji. Oni izražavaju ideje revolucije i jedinstvo naroda: zastava spaja kraljevsku belu boju sa bojama Pariza, a praznik slavi pad Bastilje. Republika je trebalo da ima nove simbole umesto kraljevskih.", "ideje": ["Navedeni su simboli (geslo, himna, zastava, praznik).", "Izražavaju ideje slobode i jednakosti.", "Nova republika zamenjuje kraljevske simbole."], "objasnjenje": "Simboli Francuske izražavaju ideje revolucije i zato su nastali kad je stvarana nova, republikanska država. (Udžbenik traži i poređenje sa simbolima Srbije.)", "iz_udzbenika": {"strana": 51, "odeljak": "Znatiželja: Simboli revolucije – državni simboli Francuske", "tekst": "Udžbenik traži da uporediš državne simbole Francuske i Srbije: kada su nastali, šta je na njima i šta simbolizuju."}, "lekcija": 6}]}, {"naslov": "7. Napoleonov uspon i pad Direktorijuma", "zadaci": [{"id": "l07-uspon-izbor-direktorijum", "vrsta": "izbor", "tezina": "lako", "pojmovi": ["direktorijum"], "pitanje": "Zašto vlast Direktorijuma nije bila sigurna?", "odgovori": [{"tekst": "Zbog neprekidnih ratova", "tacan": true}, {"tekst": "Zbog kontinentalne blokade", "tacan": false, "zasto": "Kontinentalnu blokadu Napoleon je proglasio tek kao car, mnogo posle pada Direktorijuma."}, {"tekst": "Zbog poraza kod Vaterloa", "tacan": false, "zasto": "Vaterlo je bio 1815, kada Direktorijuma odavno nije bilo."}, {"tekst": "Zbog povratka Burbona", "tacan": false, "zasto": "Burboni su vraćeni tek posle Napoleonovog pada, na Bečkom kongresu."}], "pomoc": ["Šta je Francuska stalno vodila u to vreme?", "Upravo u tome su se proslavili generali.", "Iz lekcije: zbog stalnih ratova vlast Direktorijuma bila je nesigurna."], "objasnjenje": "Stalni ratovi su potresali Direktorijum, a istovremeno su generalima, pre svih Napoleonu, donosili slavu.", "iz_udzbenika": {"strana": 54, "odeljak": "Napoleonov uspon i pad Direktorijuma", "tekst": "Zbog neprekidnih ratova vlast Direktorijuma nije bila stabilna."}, "lekcija": 7}, {"id": "l07-uspon-izbor-italija", "vrsta": "izbor", "tezina": "lako", "pojmovi": ["napoleon-bonaparta", "austrija", "italija"], "pitanje": "U kom ratu se Napoleon Bonaparta prvi put proslavio?", "odgovori": [{"tekst": "U ratu protiv Austrije u Italiji", "tacan": true}, {"tekst": "U ratu protiv Rusije", "tacan": false, "zasto": "Pohod na Rusiju bio je 1812. i završio se njegovim velikim porazom."}, {"tekst": "U ratu protiv Pruske kod Berlina", "tacan": false, "zasto": "U Berlin je ušao tek kao car, posle 1805."}, {"tekst": "U bici kod Trafalgara", "tacan": false, "zasto": "Kod Trafalgara (1805) francuska flota je teško poražena."}], "pomoc": ["Bilo je to 1796–1797, još pod Direktorijumom.", "Neprijatelj je bila habzburška država, a bojište južno od Alpa.", "Iz lekcije: slavu je stekao ratujući protiv Austrije u Italiji 1796–1797."], "objasnjenje": "Napoleon se proslavio pobedama nad Austrijom u Italiji 1796–1797.", "iz_udzbenika": {"strana": 54, "odeljak": "Napoleonov uspon i pad Direktorijuma", "tekst": "Napoleon Bonaparta postao je slavan ratujući protiv Austrije u Italiji 1796–1797."}, "osa": {"naziv": "Napoleonov rat protiv Austrije u Italiji", "od": 1796, "do": 1797, "traka": "dogadjaji"}, "lekcija": 7}, {"id": "l07-uspon-izbor-egipat-vlast", "vrsta": "izbor", "tezina": "srednje", "pojmovi": ["egipat", "osmansko-carstvo"], "pitanje": "Pod čijom vlašću je bio Egipat kada je tamo poslat Napoleon?", "odgovori": [{"tekst": "Osmanskog carstva", "tacan": true}, {"tekst": "Velike Britanije", "tacan": false, "zasto": "Britanska flota je ratovala kod Egipta, ali Egipat je tada pripadao Osmanskom carstvu."}, {"tekst": "Habzburške monarhije", "tacan": false, "zasto": "Habzburška monarhija nije imala posede u Africi."}, {"tekst": "Rusije", "tacan": false, "zasto": "Rusija nije vladala Egiptom."}], "pomoc": ["Ista sila je vladala i Balkanom.", "Njena prestonica je bio Istanbul.", "Iz lekcije: Egipat je tada bio pod vlašću Osmanskog carstva."], "objasnjenje": "Egipat je 1798/99. bio deo Osmanskog carstva.", "iz_udzbenika": {"strana": 54, "odeljak": "Napoleonov uspon i pad Direktorijuma", "tekst": "Direktorijum je poslao Napoleona u Egipat, koji je tada pripadao Osmanskom carstvu."}, "lekcija": 7}, {"id": "l07-uspon-izbor-nil", "vrsta": "izbor", "tezina": "srednje", "pojmovi": ["velika-britanija", "nil", "egipat"], "pitanje": "Zbog čega je Napoleon ostao „zarobljen” u Egiptu?", "odgovori": [{"tekst": "Britanska flota je uništila francuske brodove na ušću Nila", "tacan": true}, {"tekst": "Osmanska vojska ga je opkolila kod piramida", "tacan": false, "zasto": "Kod piramida su Francuzi pobedili."}, {"tekst": "Direktorijum mu je zabranio povratak", "tacan": false, "zasto": "Napoleon se na kraju sam vratio i srušio Direktorijum — zabrana nije bila razlog."}, {"tekst": "Zima je zatvorila puteve", "tacan": false, "zasto": "Zima je uništila njegovu vojsku u Rusiji 1812, ne u Egiptu."}], "pomoc": ["Iz Egipta se u Francusku vraćalo morem.", "Šta se dogodilo sa brodovima?", "Iz lekcije: britanska flota uništila je francuske brodove na ušću Nila."], "objasnjenje": "Bez brodova francuska vojska nije mogla da se vrati morem — Britanci su uništili flotu na ušću Nila.", "iz_udzbenika": {"strana": 54, "odeljak": "Napoleonov uspon i pad Direktorijuma", "tekst": "Kada je britanska flota potopila francuske brodove na ušću Nila, Napoleon je ostao zatočen u Egiptu."}, "lekcija": 7}, {"id": "l07-uspon-tn-piramide", "vrsta": "tacno_netacno", "tezina": "lako", "pojmovi": ["bitka-kod-piramida", "egipat"], "tvrdnja": "U Bici kod piramida francuska vojska je pobedila.", "tacno": true, "pomoc": ["Problemi Francuza u Egiptu nisu došli od bitke.", "Iz lekcije: pobedili su kod piramida, ali su stradali od klime i bolesti."], "objasnjenje": "Tačno — Francuzi su pobedili kod piramida, ali su vojnici stradali od surove klime i bolesti.", "iz_udzbenika": {"strana": 54, "odeljak": "Napoleonov uspon i pad Direktorijuma", "tekst": "Francuska vojska je pobedila u Bici kod piramida, ali su vojnici stradali od klime i bolesti."}, "lekcija": 7}, {"id": "l07-uspon-tn-ostavio-vojsku", "vrsta": "tacno_netacno", "tezina": "srednje", "pojmovi": ["napoleon-bonaparta", "egipat"], "tvrdnja": "Napoleon je ostao sa svojom vojskom u Egiptu do kraja pohoda i vratio se sa njom u Francusku.", "tacno": false, "ispravke": [{"tekst": "Napoleon je napustio svoje vojnike da bi se što pre vratio u Francusku i učestvovao u prevratu.", "tacan": true}, {"tekst": "Napoleon je poginuo u Egiptu.", "tacan": false, "zasto": "Napoleon je živeo do 1821. i umro na Svetoj Jeleni."}, {"tekst": "Napoleon je ostao u Egiptu kao njegov vladar.", "tacan": false, "zasto": "Egipat je bio osmanski; Napoleon se vratio u Francusku 1799."}], "pomoc": ["Šta mu je bilo važnije — vojska ili vlast u Parizu?", "Iz lekcije: napustio je vojnike da bi stigao na prevrat protiv Direktorijuma."], "objasnjenje": "Netačno — Napoleon je ostavio vojsku u Egiptu i žurno se vratio u Francusku da bi učestvovao u prevratu.", "iz_udzbenika": {"strana": 54, "odeljak": "Napoleonov uspon i pad Direktorijuma", "tekst": "Napoleon je napustio vojnike i vratio se u Francusku da bi učestvovao u prevratu 1799."}, "lekcija": 7}, {"id": "l07-uspon-tn-mletacka", "vrsta": "tacno_netacno", "tezina": "srednje", "pojmovi": ["mletacka-republika", "venecija", "napoleon-bonaparta"], "tvrdnja": "Napoleon je osvojio Veneciju i 1797. ukinuo Mletačku republiku.", "tacno": true, "pomoc": ["Seti se kojom je državom vladala Venecija.", "Iz lekcije: osvojio je Veneciju i ukinuo Mletačku republiku 1797."], "objasnjenje": "Tačno — u ratu u Italiji Napoleon je zauzeo Veneciju i ukinuo Mletačku republiku (1797).", "iz_udzbenika": {"strana": 54, "odeljak": "Napoleonov uspon i pad Direktorijuma", "tekst": "Napoleon je zauzeo Veneciju i ukinuo Mletačku republiku 1797."}, "osa": {"naziv": "Ukidanje Mletačke republike", "od": 1797, "traka": "dogadjaji"}, "lekcija": 7}, {"id": "l07-uspon-dopuni-uspon", "vrsta": "dopuni", "tezina": "lako", "pojmovi": ["napoleon-bonaparta", "mletacka-republika", "egipat", "direktorijum", "konzulat"], "pitanje": "Dopuni rečenice o Napoleonovom usponu.", "tekst": "Napoleon je 1797. ukinuo {{Mletačku republiku}}, a 1798/99. ratovao je u {{Egiptu}}. Posle prevrata 1799. {{Direktorijum}} je raspušten i uveden je {{Konzulat}}.", "ponudjene": ["Mletačku republiku", "Egiptu", "Direktorijum", "Konzulat", "Rusiji", "Carstvo"], "pomoc": ["Prvo se vodio rat u Italiji, pa u Africi.", "Carstvo dolazi tek 1804.", "Iz lekcije: Mletačka republika 1797, Egipat 1798/99, prevrat 1799 — Direktorijum raspušten, uveden Konzulat."], "objasnjenje": "Redom: Mletačka republika (1797), Egipat (1798/99), Direktorijum raspušten i uveden Konzulat (1799).", "iz_udzbenika": {"strana": 54, "odeljak": "Napoleonov uspon i pad Direktorijuma", "tekst": "Od Italije i Egipta Napoleon je stigao do prevrata 1799, posle koga je uveden Konzulat."}, "lekcija": 7}, {"id": "l07-uspon-dopuni-egipat-tesko", "vrsta": "dopuni", "tezina": "tesko", "pojmovi": ["egipat", "nil", "bitka-kod-piramida", "osmansko-carstvo"], "pitanje": "Dopuni bez ponuđenih reči.", "tekst": "Egipat je tada bio pod vlašću {{Osmanskog carstva|Osmanlija}}. Britanska flota je potopila francuske brodove na ušću reke {{Nila|Nil}}, a francuska vojska je pobedila u Bici kod {{piramida}}.", "pomoc": ["Najveća reka Egipta.", "Najpoznatiji spomenici starog Egipta.", "Iz lekcije: Osmansko carstvo, ušće Nila, Bitka kod piramida."], "objasnjenje": "Egipat je bio osmanski; flota je uništena na ušću Nila; Francuzi su pobedili kod piramida.", "iz_udzbenika": {"strana": 54, "odeljak": "Napoleonov uspon i pad Direktorijuma", "tekst": "U Egiptu, osmanskoj zemlji, Britanci su uništili francusku flotu na ušću Nila, a Francuzi pobedili kod piramida."}, "lekcija": 7}, {"id": "l07-uspon-datum-zivot", "vrsta": "datum", "tezina": "srednje", "pojmovi": ["napoleon-bonaparta"], "dogadjaj": "Napoleon Bonaparta (život)", "pitanje": "Od koje do koje godine je živeo Napoleon Bonaparta?", "od": 1769, "do": 1821, "traka": "vladari", "pomoc": ["Rođen je u drugoj polovini XVIII veka, oko 20 godina pre Francuske revolucije.", "Umro je šest godina posle Vaterloa.", "Iz lekcije: Napoleon Bonaparta (1769–1821)."], "objasnjenje": "Napoleon je živeo od 1769. do 1821. godine.", "iz_udzbenika": {"strana": 54, "odeljak": "Napoleonov uspon i pad Direktorijuma", "tekst": "Napoleon Bonaparta živeo je od 1769. do 1821."}, "lekcija": 7}, {"id": "l07-uspon-datum-egipat", "vrsta": "datum", "tezina": "lako", "pojmovi": ["egipat", "napoleon-bonaparta"], "dogadjaj": "Napoleonov pohod na Egipat", "pitanje": "Kada je Napoleon ratovao u Egiptu?", "od": 1798, "do": 1799, "traka": "dogadjaji", "pomoc": ["Posle rata u Italiji (1796–1797), a pre prevrata 1799.", "Udžbenik piše dve godine sa kosom crtom.", "Iz lekcije: Egipat 1798/99."], "objasnjenje": "Pohod na Egipat trajao je 1798–1799.", "iz_udzbenika": {"strana": 54, "odeljak": "Napoleonov uspon i pad Direktorijuma", "tekst": "Direktorijum je poslao Napoleona u Egipat 1798/99."}, "lekcija": 7}, {"id": "l07-uspon-datum-prevrat", "vrsta": "datum", "tezina": "lako", "pojmovi": ["prevrat-1799", "direktorijum"], "dogadjaj": "Prevrat protiv Direktorijuma", "pitanje": "Koje godine je izveden prevrat protiv Direktorijuma?", "godina": 1799, "traka": "dogadjaji", "pomoc": ["Iste godine kada se Napoleon vratio iz Egipta.", "Poslednja godina XVIII veka pre 1800.", "Iz lekcije: prevrat protiv Direktorijuma 1799."], "objasnjenje": "Prevrat je izveden 1799; Direktorijum je raspušten i uveden Konzulat.", "iz_udzbenika": {"strana": 54, "odeljak": "Napoleonov uspon i pad Direktorijuma", "tekst": "Napoleon je učestvovao u prevratu protiv Direktorijuma 1799."}, "lekcija": 7}, {"id": "l07-uspon-poredjaj", "vrsta": "poredjaj", "tezina": "srednje", "pojmovi": ["napoleon-bonaparta", "mletacka-republika", "egipat", "prevrat-1799"], "pitanje": "Poređaj događaje Napoleonovog uspona hronološki.", "stavke": [{"tekst": "Napoleon ratuje protiv Austrije u Italiji", "godina": 1796, "do": 1797, "naziv": "Napoleonov rat protiv Austrije u Italiji", "traka": "dogadjaji"}, {"tekst": "Ukinuta je Mletačka republika", "godina": 1797, "naziv": "Ukidanje Mletačke republike", "traka": "dogadjaji"}, {"tekst": "Napoleon vodi vojsku u Egipat", "godina": 1798, "do": 1799, "naziv": "Napoleonov pohod na Egipat", "traka": "dogadjaji"}, {"tekst": "Prevrat ruši Direktorijum", "godina": 1799, "naziv": "Prevrat protiv Direktorijuma", "traka": "dogadjaji"}], "pomoc": ["Italija je bila pre Egipta.", "Mletačka republika ukinuta je na kraju rata u Italiji.", "Iz lekcije: Italija 1796–1797, Venecija 1797, Egipat 1798/99, prevrat 1799."], "objasnjenje": "Italija (1796–1797) → ukidanje Mletačke republike (1797) → Egipat (1798/99) → prevrat (1799).", "iz_udzbenika": {"strana": 54, "odeljak": "Napoleonov uspon i pad Direktorijuma", "tekst": "Od rata u Italiji preko Egipta Napoleon je došao do prevrata 1799."}, "lekcija": 7}, {"id": "l07-uspon-povezi", "vrsta": "povezi", "tezina": "srednje", "pojmovi": ["italija", "egipat", "nil", "bitka-kod-piramida"], "pitanje": "Poveži mesto sa onim što se tamo dogodilo.", "parovi": [["Italija", "Pobede nad Austrijom 1796–1797"], ["Venecija", "Kraj Mletačke republike"], ["Ušće Nila", "Britanci uništavaju francuske brodove"], ["Piramide", "Pobeda francuske vojske u Egiptu"]], "pomoc": ["Dva mesta su u Evropi, dva u Egiptu.", "Na ušću reke bila je pomorska bitka.", "Iz lekcije: Italija — pobede nad Austrijom; Venecija — Mletačka republika; Nil — flota; piramide — pobeda."], "objasnjenje": "Italija i Venecija su mesta Napoleonovih uspeha 1796–1797; u Egiptu je flota uništena na ušću Nila, a vojska pobedila kod piramida.", "iz_udzbenika": {"strana": 54, "odeljak": "Napoleonov uspon i pad Direktorijuma", "tekst": "Napoleon je pobeđivao u Italiji, ukinuo Mletačku republiku, a u Egiptu izgubio flotu, ali pobedio kod piramida."}, "lekcija": 7}, {"id": "l07-uspon-zakljuci-slava", "vrsta": "zakljuci", "tezina": "srednje", "pojmovi": ["napoleon-bonaparta", "direktorijum", "prevrat-1799"], "pitanje": "Zašto je baš jedan general mogao da sruši Direktorijum?", "odgovori": [{"tekst": "U vreme stalnih ratova uspešan vojskovođa ima slavu i vojsku iza sebe, a vlast je bila slaba", "tacan": true}, {"tekst": "Zato što je Napoleon bio iz kraljevske porodice Burbona", "tacan": false, "zasto": "Napoleon nije bio Burbon — Burboni su se vratili tek posle njegovog pada."}, {"tekst": "Zato što ga je papa postavio za vladara", "tacan": false, "zasto": "Papa ga nije postavio; čak se i krunisao sam."}, {"tekst": "Zato što je pobedio Britance kod Trafalgara", "tacan": false, "zasto": "Kod Trafalgara je francuska flota poražena, i to tek 1805."}], "pomoc": ["Korak 1: Kakva je bila vlast Direktorijuma?", "Korak 2: Ko je u ratovima stekao ugled — političari ili generali?", "Iz lekcije: zbog ratova vlast je bila nesigurna, a Napoleon je slavu stekao kao general."], "objasnjenje": "Slaba vlast u ratno doba i slavan, uspešan general — to je omogućilo prevrat 1799.", "iz_udzbenika": {"strana": 54, "odeljak": "Napoleonov uspon i pad Direktorijuma", "tekst": "Vlast Direktorijuma bila je nesigurna zbog ratova, a Napoleon je stekao slavu pobedama."}, "lekcija": 7}, {"id": "l07-uspon-zakljuci-egipat", "vrsta": "zakljuci", "tezina": "tesko", "pojmovi": ["egipat", "napoleon-bonaparta", "velika-britanija"], "pitanje": "Kako bi ocenio pohod na Egipat kada se sve sabere?", "odgovori": [{"tekst": "Neuspeh — flota je izgubljena, vojska je stradala od klime i bolesti, a Napoleon ju je napustio", "tacan": true}, {"tekst": "Potpun uspeh — Egipat je postao francuska provincija", "tacan": false, "zasto": "Egipat nije pripojen; vojska je ostala bez brodova i stradala."}, {"tekst": "Uspeh, jer je uništena britanska flota", "tacan": false, "zasto": "Obrnuto — Britanci su uništili francuske brodove."}, {"tekst": "Nije se ni dogodio, jer je Napoleon ostao u Italiji", "tacan": false, "zasto": "Napoleon je 1798/99. bio u Egiptu."}], "pomoc": ["Korak 1: Šta se desilo sa flotom?", "Korak 2: Šta je bilo sa vojnicima posle pobede kod piramida?", "Iz lekcije: flota uništena na ušću Nila, vojnici stradali, Napoleon ih napustio."], "objasnjenje": "Iako je pobedio kod piramida, pohod je bio neuspeh: bez flote, sa bolesnom vojskom koju je Napoleon ostavio.", "iz_udzbenika": {"strana": 54, "odeljak": "Napoleonov uspon i pad Direktorijuma", "tekst": "U Egiptu je Napoleon izgubio flotu, vojska je stradala, a on ju je napustio."}, "lekcija": 7}, {"id": "l07-uspon-lanac-egipat", "vrsta": "lanac", "tezina": "srednje", "pojmovi": ["egipat", "nil", "velika-britanija"], "karike": ["Britanska flota potapa francuske brodove na ušću Nila", "?", "Vojnici stradaju od surove klime i bolesti"], "praznina": 1, "odgovori": [{"tekst": "Napoleon i vojska ostaju zarobljeni u Egiptu", "tacan": true}, {"tekst": "Napoleon se odmah brodom vraća sa vojskom", "tacan": false, "zasto": "Brodova više nije bilo — zato su ostali zarobljeni."}, {"tekst": "Egipat postaje francuski", "tacan": false, "zasto": "Egipat je ostao pod Osmanskim carstvom."}], "pomoc": ["Korak 1: Kako se iz Egipta vraća u Francusku?", "Korak 2: Šta znači ostati bez brodova?", "Iz lekcije: posle uništenja flote Napoleon je postao zatočenik Egipta."], "objasnjenje": "Bez flote vojska nije mogla nazad, pa je ostala u Egiptu, gde je stradala od klime i bolesti.", "iz_udzbenika": {"strana": 54, "odeljak": "Napoleonov uspon i pad Direktorijuma", "tekst": "Bez brodova Napoleon je ostao zatočen u Egiptu, a vojnici su stradali od klime i bolesti."}, "lekcija": 7}, {"id": "l07-uspon-lanac-prevrat", "vrsta": "lanac", "tezina": "lako", "pojmovi": ["prevrat-1799", "direktorijum", "konzulat"], "karike": ["Napoleon se vraća iz Egipta u Francusku", "Učestvuje u prevratu 1799.", "?"], "praznina": 2, "odgovori": [{"tekst": "Direktorijum je raspušten i uveden je Konzulat", "tacan": true}, {"tekst": "Napoleon je krunisan za cara", "tacan": false, "zasto": "Carem se proglasio tek 1804."}, {"tekst": "Vraća se kralj iz dinastije Burbon", "tacan": false, "zasto": "Burboni su vraćeni tek posle Napoleonovog pada (1814–1815)."}], "pomoc": ["Korak 1: Protiv koga je bio prevrat?", "Korak 2: Šta dolazi umesto njega?", "Iz lekcije: posle prevrata Direktorijum je raspušten, a uveden je Konzulat."], "objasnjenje": "Prevrat 1799. ruši Direktorijum i uvodi Konzulat, u kome Napoleon postaje prvi konzul.", "iz_udzbenika": {"strana": 54, "odeljak": "Napoleonov uspon i pad Direktorijuma", "tekst": "Posle prevrata 1799. Direktorijum je raspušten i uveden je Konzulat."}, "osa": {"naziv": "Prevrat protiv Direktorijuma", "od": 1799, "traka": "dogadjaji"}, "lekcija": 7}, {"id": "l07-uspon-ko-sam-napoleon", "vrsta": "ko_sam", "tezina": "lako", "pojmovi": ["napoleon-bonaparta", "mletacka-republika", "egipat"], "tragovi": ["Rođen sam 1769, a slavu sam stekao kao mladi general.", "Ukinuo sam Mletačku republiku i ratovao u Egiptu.", "Ostavio sam vojsku u Egiptu da bih 1799. srušio Direktorijum."], "odgovori": [{"tekst": "Napoleon Bonaparta", "tacan": true}, {"tekst": "Admiral Nelson", "tacan": false, "zasto": "Nelson je bio britanski admiral, koji je potapao francuske brodove."}, {"tekst": "General Kutuzov", "tacan": false, "zasto": "Kutuzov je bio ruski general u ratu 1812."}, {"tekst": "Luj XVIII", "tacan": false, "zasto": "Luj XVIII je burbonski kralj vraćen na presto posle Napoleona."}], "objasnjenje": "To je Napoleon Bonaparta (1769–1821).", "iz_udzbenika": {"strana": 54, "odeljak": "Napoleonov uspon i pad Direktorijuma", "tekst": "Napoleon Bonaparta je posle Italije i Egipta srušio Direktorijum 1799."}, "lekcija": 7}, {"id": "l07-uspon-objasni-uspon", "vrsta": "objasni", "tezina": "srednje", "pojmovi": ["napoleon-bonaparta", "direktorijum", "prevrat-1799"], "pitanje": "Objasni kako je Napoleon od generala došao do vlasti.", "uzor": "Zbog stalnih ratova vlast Direktorijuma bila je slaba, a Napoleon je stekao slavu pobedama nad Austrijom u Italiji 1796–1797. Iako je pohod na Egipat propao, on je napustio vojsku, vratio se u Francusku i 1799. učestvovao u prevratu. Direktorijum je raspušten, a uveden je Konzulat.", "ideje": ["Vlast Direktorijuma je bila slaba zbog ratova.", "Napoleon se proslavio u Italiji.", "Vratio se iz Egipta i učestvovao u prevratu 1799.", "Uveden je Konzulat."], "objasnjenje": "Slaba vlast + slavni general + prevrat 1799 = Napoleon na vlasti.", "iz_udzbenika": {"strana": 54, "odeljak": "Napoleonov uspon i pad Direktorijuma", "tekst": "Napoleon je od slavnog generala postao vođa prevrata 1799."}, "lekcija": 7}, {"id": "l07-uspon-objasni-egipat", "vrsta": "objasni", "tezina": "tesko", "pojmovi": ["egipat", "napoleon-bonaparta", "velika-britanija"], "pitanje": "Zašto je pohod na Egipat bio neuspeh, iako je Napoleon pobedio kod piramida?", "uzor": "Britanska flota je uništila francuske brodove na ušću Nila, pa vojska nije mogla da se vrati. Vojnici su stradali od surove klime i bolesti. Napoleon ih je na kraju napustio i vratio se u Francusku.", "ideje": ["Britanci su uništili francusku flotu.", "Vojska je ostala zarobljena u Egiptu.", "Vojnici su stradali od klime i bolesti."], "objasnjenje": "Jedna dobijena bitka nije spasla pohod: bez flote i sa bolesnom vojskom pohod je propao.", "iz_udzbenika": {"strana": 54, "odeljak": "Napoleonov uspon i pad Direktorijuma", "tekst": "U Egiptu je Napoleon izgubio flotu, a vojska je stradala iako je pobedila kod piramida."}, "lekcija": 7}, {"id": "l07-alpe-izbor-slikar", "vrsta": "izbor", "slika_u_pitanju": true, "tezina": "lako", "pojmovi": ["zak-luj-david", "napoleon-bonaparta"], "pitanje": "Ko je naslikao sliku „Napoleon prelazi Alpe”?", "odgovori": [{"tekst": "Žak-Luj David", "tacan": true}, {"tekst": "Ludvig van Betoven", "tacan": false, "zasto": "Betoven je bio kompozitor — napisao je simfoniju Eroika."}, {"tekst": "Admiral Nelson", "tacan": false, "zasto": "Nelson je bio britanski admiral, ne slikar."}, {"tekst": "Volter", "tacan": false, "zasto": "Volter je bio prosvetitelj i pisac iz XVIII veka."}], "pomoc": ["Ime je francusko i dvostruko.", "Ispod slike u udžbeniku stoji ime slikara.", "Iz lekcije: sliku je 1801. naslikao Žak-Luj David."], "objasnjenje": "Sliku „Napoleon prelazi Alpe” naslikao je Žak-Luj David 1801. godine.", "iz_udzbenika": {"strana": 54, "odeljak": "Slika: Napoleon prelazi Alpe", "tekst": "Žak-Luj David naslikao je „Napoleon prelazi Alpe” 1801.", "slika": "07-napoleonovo-doba/01-napoleon-prelazi-alpe.jpg"}, "osa": {"naziv": "David slika „Napoleon prelazi Alpe”", "od": 1801, "traka": "ideje"}, "lekcija": 7}, {"id": "l07-alpe-izbor-imena", "vrsta": "izbor", "slika_u_pitanju": true, "tezina": "srednje", "pojmovi": ["hanibal", "karlo-veliki", "napoleon-bonaparta"], "pitanje": "Čija su imena urezana na kamenju u prednjem planu slike, pored imena Bonaparta? (više tačnih)", "odgovori": [{"tekst": "Hanibal", "tacan": true}, {"tekst": "Karlo Veliki", "tacan": true}, {"tekst": "Luj XVI", "tacan": false, "zasto": "Luj XVI je pogubljeni francuski kralj — slikar Napoleona ne poredi s njim."}, {"tekst": "Aleksandar I", "tacan": false, "zasto": "Aleksandar I je ruski car, Napoleonov savremenik, ne lik sa ove slike."}], "pomoc": ["To su veliki vojskovođe i osvajači iz prošlosti.", "Jedan je u starom veku prešao Alpe sa slonovima.", "Iz lekcije: na kamenju su imena Hanibala i Karla Velikog."], "objasnjenje": "Pored Bonaparte urezani su Hanibal i Karlo Veliki.", "iz_udzbenika": {"strana": 54, "odeljak": "Slika: Napoleon prelazi Alpe", "tekst": "Na kamenju su uz ime Bonaparta urezana imena Hanibala i Karla Velikog.", "slika": "07-napoleonovo-doba/01-napoleon-prelazi-alpe.jpg"}, "lekcija": 7}, {"id": "l07-alpe-zakljuci-poredjenje", "vrsta": "zakljuci", "slika_u_pitanju": true, "tezina": "tesko", "pojmovi": ["hanibal", "karlo-veliki", "napoleon-bonaparta", "zak-luj-david"], "pitanje": "Zašto slikar poredi Napoleona sa Hanibalom i Karlom Velikim?", "odgovori": [{"tekst": "Da ga prikaže kao jednog od najvećih vojskovođa i osvajača u istoriji", "tacan": true}, {"tekst": "Da pokaže da je Napoleon izgubio rat kao i oni", "tacan": false, "zasto": "Slika slavi Napoleona — ne govori o porazima."}, {"tekst": "Zato što su sva trojica bili kraljevi Francuske", "tacan": false, "zasto": "Hanibal je bio kartaginski vojskovođa, a ne francuski kralj."}, {"tekst": "Da pokaže da Napoleon ne voli ratove", "tacan": false, "zasto": "Poredi ga upravo sa slavnim ratnicima i osvajačima."}], "pomoc": ["Korak 1: Po čemu su Hanibal i Karlo Veliki poznati?", "Korak 2: Kakav utisak slika ostavlja — slavi ili kritikuje Napoleona?", "Iz lekcije: imena velikih osvajača uz Bonapartu svrstavaju ga među njih."], "objasnjenje": "Hanibal (prešao Alpe) i Karlo Veliki (stvorio carstvo) bili su veliki vojskovođe; slikar Napoleona stavlja u isti red.", "iz_udzbenika": {"strana": 54, "odeljak": "Slika: Napoleon prelazi Alpe", "tekst": "Udžbenik pita zašto slikar poredi Napoleona sa Hanibalom i Karlom Velikim.", "slika": "07-napoleonovo-doba/01-napoleon-prelazi-alpe.jpg"}, "lekcija": 7}, {"id": "l07-alpe-izvor-slika", "vrsta": "izvor", "slika_u_pitanju": true, "tezina": "srednje", "pojmovi": ["zak-luj-david", "napoleon-bonaparta"], "izvor": {"autor": "Žak-Luj David", "naslov": "Napoleon prelazi Alpe (opis slike, 1801)", "tekst": "Napoleon u raširenom ogrtaču sedi na belom konju koji se propinje na strmoj planinskoj stazi; rukom pokazuje ka vrhu, a u pozadini vojnici vuku top.", "napomena": "Opis slike je prepričan; udžbenik, str. 54."}, "pitanje": "Kakvog Napoleona slika prikazuje?", "odgovori": [{"tekst": "Hrabrog, odlučnog vođu koji pokazuje put svojoj vojsci", "tacan": true}, {"tekst": "Umornog i poraženog vojskovođu", "tacan": false, "zasto": "Takav je prikazan na slici povlačenja iz Rusije 1812, ne ovde."}, {"tekst": "Kralja na prestolu u palati", "tacan": false, "zasto": "Napoleon je na konju u planinama, a ne u palati."}, {"tekst": "Mirnog seljaka na polju", "tacan": false, "zasto": "Na slici je vojskovođa u uniformi na propetom konju."}], "pomoc": ["Pogledaj pokret konja i ruke.", "Slikar želi da proslavi Napoleona.", "Iz lekcije: slika ga prikazuje kao velikog vojskovođu."], "objasnjenje": "Propeti konj, ogrtač na vetru i ruka ka vrhu — slikar prikazuje hrabrog, odlučnog vojskovođu.", "iz_udzbenika": {"strana": 54, "odeljak": "Slika: Napoleon prelazi Alpe", "tekst": "Udžbenik traži da opišeš kako je umetnik predstavio Napoleona.", "slika": "07-napoleonovo-doba/01-napoleon-prelazi-alpe.jpg"}, "lekcija": 7}, {"id": "l07-alpe-datum", "vrsta": "datum", "tezina": "tesko", "pojmovi": ["zak-luj-david"], "dogadjaj": "David slika „Napoleon prelazi Alpe”", "pitanje": "Koje godine je nastala Davidova slika „Napoleon prelazi Alpe”?", "godina": 1801, "traka": "ideje", "pomoc": ["Napoleon je tada već bio prvi konzul.", "Prva godina XIX veka.", "Iz lekcije: slika iz 1801."], "objasnjenje": "Slika je iz 1801, iz doba Konzulata.", "iz_udzbenika": {"strana": 54, "odeljak": "Slika: Napoleon prelazi Alpe", "tekst": "Davidova slika nastala je 1801.", "slika": "07-napoleonovo-doba/01-napoleon-prelazi-alpe.jpg"}, "lekcija": 7}]}, {"naslov": "7. Konzulat", "zadaci": [{"id": "l07-konz-izbor-broj", "vrsta": "izbor", "tezina": "lako", "pojmovi": ["konzulat", "ustav-iz-1799"], "pitanje": "Koliko je konzula po ustavu iz 1799. bilo na čelu države?", "odgovori": [{"tekst": "Tri", "tacan": true}, {"tekst": "Jedan", "tacan": false, "zasto": "Napoleon je bio prvi konzul, ali uz njega su bila još dvojica."}, {"tekst": "Pet", "tacan": false, "zasto": "Pet članova imao je Direktorijum, koji je Konzulat zamenio."}, {"tekst": "Dvanaest", "tacan": false, "zasto": "Toliko konzula nije bilo; državu je vodila trojica."}], "pomoc": ["Napoleon je bio „prvi” — znači da ih je bilo više.", "Uz njega su bila dvojica kolega-savetnika.", "Iz lekcije: na čelu države bila su tri konzula."], "objasnjenje": "Po ustavu iz 1799. državu su vodila tri konzula; Napoleon je bio prvi konzul.", "iz_udzbenika": {"strana": 55, "odeljak": "Konzulat", "tekst": "Po ustavu iz 1799. na čelu države bila su tri konzula."}, "lekcija": 7}, {"id": "l07-konz-izbor-prvi-konzul", "vrsta": "izbor", "tezina": "lako", "pojmovi": ["prvi-konzul", "napoleon-bonaparta"], "pitanje": "Koju vlast je imao prvi konzul Napoleon?", "odgovori": [{"tekst": "Izvršnu i zakonodavnu", "tacan": true}, {"tekst": "Samo ulogu savetnika", "tacan": false, "zasto": "Savetnici su bila druga dvojica konzula."}, {"tekst": "Nikakvu — vladala je skupština", "tacan": false, "zasto": "Skupština je imala mala ovlašćenja; vlast je bila u rukama prvog konzula."}, {"tekst": "Samo versku vlast", "tacan": false, "zasto": "Prvi konzul je vodio državu, vojsku i spoljnu politiku — ne crkvu."}], "pomoc": ["Druga dvojica konzula su ga samo savetovala.", "On je i donosio zakone i sprovodio ih.", "Iz lekcije: prvom konzulu pripadala je izvršna i zakonodavna vlast."], "objasnjenje": "Prvi konzul je imao izvršnu i zakonodavnu vlast — bio je pravi gospodar države.", "iz_udzbenika": {"strana": 55, "odeljak": "Konzulat", "tekst": "Prvi konzul Napoleon imao je izvršnu i zakonodavnu vlast, a ostala dvojica bila su savetnici."}, "lekcija": 7}, {"id": "l07-konz-izbor-ovlascenja", "vrsta": "izbor", "tezina": "srednje", "pojmovi": ["prvi-konzul"], "pitanje": "Šta je sve radio prvi konzul? (više tačnih)", "odgovori": [{"tekst": "Postavljao ministre, činovnike, oficire i sudije", "tacan": true}, {"tekst": "Vodio spoljnu politiku", "tacan": true}, {"tekst": "Komandovao vojskom", "tacan": true}, {"tekst": "Krunisao papu", "tacan": false, "zasto": "Papa nije krunisan; pre bi se reklo da je Napoleon odbio da ga papa kruniše."}, {"tekst": "Birao članove Direktorijuma", "tacan": false, "zasto": "Direktorijum je raspušten 1799, kada je uveden Konzulat."}], "pomoc": ["Imao je vlast nad upravom, sudovima, vojskom i odnosima sa drugim državama.", "Direktorijuma više nije bilo.", "Iz lekcije: postavljao je ministre, činovnike, oficire i sudije, vodio spoljnu politiku i komandovao vojskom."], "objasnjenje": "Prvi konzul je postavljao sve važne ljude u državi, vodio spoljnu politiku i komandovao vojskom.", "iz_udzbenika": {"strana": 55, "odeljak": "Konzulat", "tekst": "Prvi konzul postavlja ministre, činovnike, oficire i sudije, vodi spoljnu politiku i komanduje vojskom."}, "lekcija": 7}, {"id": "l07-konz-tn-pravo-glasa", "vrsta": "tacno_netacno", "tezina": "srednje", "pojmovi": ["ustav-iz-1799", "opste-pravo-glasa"], "tvrdnja": "Ustav iz 1799. uveo je opšte pravo glasa i dao skupštini velika ovlašćenja.", "tacno": false, "ispravke": [{"tekst": "Ustav je uveo opšte pravo glasa, ali su ovlašćenja skupštine bila mala.", "tacan": true}, {"tekst": "Ustav je ukinuo pravo glasa, a skupština je imala svu vlast.", "tacan": false, "zasto": "Ustav je uveo opšte pravo glasa, a vlast je bila kod prvog konzula."}, {"tekst": "Ustav nije pominjao ni pravo glasa ni skupštinu.", "tacan": false, "zasto": "Pominjao je oba — uveo je opšte pravo glasa, a skupštini dao mala ovlašćenja."}], "pomoc": ["Ko je imao zakonodavnu vlast — skupština ili prvi konzul?", "Iz lekcije: opšte pravo glasa je uvedeno, ali su ovlašćenja skupštine bila mala."], "objasnjenje": "Netačno — pravo glasa je postojalo, ali skupština je bila slaba; stvarnu vlast je imao prvi konzul.", "iz_udzbenika": {"strana": 55, "odeljak": "Konzulat", "tekst": "Ustav je uveo opšte pravo glasa, ali su ovlašćenja skupštine bila mala."}, "lekcija": 7}, {"id": "l07-konz-tn-dozivotni", "vrsta": "tacno_netacno", "tezina": "lako", "pojmovi": ["dozivotni-konzul", "napoleon-bonaparta"], "tvrdnja": "Napoleon je 1802. izabran za doživotnog konzula.", "tacno": true, "pomoc": ["Doživotno znači do kraja života.", "Iz lekcije: 1802. Bonaparta je izabran za doživotnog konzula."], "objasnjenje": "Tačno — 1802. postao je doživotni konzul, korak bliže carskoj kruni.", "iz_udzbenika": {"strana": 55, "odeljak": "Konzulat", "tekst": "Napoleon je 1802. izabran za doživotnog konzula."}, "osa": {"naziv": "Napoleon doživotni konzul", "od": 1802, "traka": "vladari"}, "lekcija": 7}, {"id": "l07-konz-tn-mir-britanija", "vrsta": "tacno_netacno", "tezina": "srednje", "pojmovi": ["velika-britanija", "napoleon-bonaparta"], "tvrdnja": "Mir koji je Napoleon 1802. sklopio sa Velikom Britanijom trajao je do kraja njegove vladavine.", "tacno": false, "ispravke": [{"tekst": "Mir sa Velikom Britanijom bio je kratkotrajan; ubrzo je počeo novi rat.", "tacan": true}, {"tekst": "Mir sa Britanijom sklopljen je tek na Bečkom kongresu, a pre toga nije bilo mira.", "tacan": false, "zasto": "Mir je sklopljen 1802, samo je kratko trajao."}, {"tekst": "Mir je sklopljen sa Rusijom, a ne sa Britanijom.", "tacan": false, "zasto": "1802. sklopljen je mir upravo sa Velikom Britanijom; savez sa Rusijom bio je 1807."}], "pomoc": ["Sa kim je Napoleon ratovao kod Trafalgara 1805?", "Iz lekcije: mir sa Britanijom 1802. bio je kratkotrajan."], "objasnjenje": "Netačno — mir iz 1802. bio je kratkotrajan; Velika Britanija je ostala glavni neprijatelj Francuske.", "iz_udzbenika": {"strana": 55, "odeljak": "Konzulat", "tekst": "Iste godine (1802) Napoleon je sklopio kratkotrajni mir sa Velikom Britanijom."}, "osa": {"naziv": "Mir sa Velikom Britanijom", "od": 1802, "traka": "dogadjaji"}, "lekcija": 7}, {"id": "l07-konz-dopuni-konzulat", "vrsta": "dopuni", "tezina": "lako", "pojmovi": ["konzulat", "prvi-konzul", "dozivotni-konzul", "ustav-iz-1799"], "pitanje": "Dopuni rečenice o Konzulatu.", "tekst": "Po ustavu iz {{1799}}. državu su vodila tri konzula. Napoleon je bio {{prvi}} konzul, a 1802. postao je {{doživotni}} konzul.", "ponudjene": ["1799", "1804", "prvi", "drugi", "doživotni", "privremeni"], "pomoc": ["Konzulat je uveden posle prevrata.", "Napoleon je bio na čelu, a kasnije zauvek.", "Iz lekcije: ustav iz 1799, prvi konzul, 1802. doživotni konzul."], "objasnjenje": "Ustav iz 1799. uvodi tri konzula; Napoleon je prvi konzul, a od 1802. doživotni.", "iz_udzbenika": {"strana": 55, "odeljak": "Konzulat", "tekst": "Po ustavu iz 1799. Napoleon je prvi konzul, a 1802. postaje doživotni konzul."}, "lekcija": 7}, {"id": "l07-konz-dopuni-sestrinske", "vrsta": "dopuni", "tezina": "tesko", "pojmovi": ["sestrinske-republike", "italija", "holandija", "svajcarska", "rajna"], "pitanje": "Dopuni bez ponuđenih reči.", "tekst": "Zavisne „{{sestrinske}}” republike nastale su u Italiji, {{Holandiji}}, Švajcarskoj i nemačkim kneževinama uz reku {{Rajnu|Rajna}}.", "pomoc": ["Republike su bile kao „rođaci” Francuske.", "Jedna je zemlja nizija i kanala, a reka teče kroz zapadnu Nemačku.", "Iz lekcije: sestrinske republike u Italiji, Holandiji, Švajcarskoj i uz Rajnu."], "objasnjenje": "„Sestrinske republike” nastale su u Italiji, Holandiji, Švajcarskoj i nemačkim kneževinama uz Rajnu.", "iz_udzbenika": {"strana": 55, "odeljak": "Konzulat", "tekst": "U Italiji, Holandiji, Švajcarskoj i nemačkim kneževinama uz Rajnu nastale su zavisne sestrinske republike."}, "lekcija": 7}, {"id": "l07-konz-zakljuci-sestrinske", "vrsta": "zakljuci", "tezina": "srednje", "pojmovi": ["sestrinske-republike", "francuska-revolucija"], "pitanje": "Kakva je bila posledica stvaranja „sestrinskih republika”?", "odgovori": [{"tekst": "Tekovine Francuske revolucije proširile su se i van Francuske", "tacan": true}, {"tekst": "Francuska je izgubila sva osvajanja", "tacan": false, "zasto": "Mirom 1802. osvajanja su joj čak priznata."}, {"tekst": "U tim zemljama vraćen je apsolutizam", "tacan": false, "zasto": "Apsolutizam je obnavljao Bečki kongres; sestrinske republike su nosile revolucionarne ideje."}, {"tekst": "Te zemlje su postale britanske kolonije", "tacan": false, "zasto": "Bile su zavisne od Francuske, ne od Britanije."}], "pomoc": ["Korak 1: Od koga su te republike zavisile?", "Korak 2: Šta je Francuska donosila sa sobom?", "Iz lekcije: tako su se tekovine Francuske revolucije proširile van Francuske."], "objasnjenje": "Zavisne republike preuzimale su francuske zakone i ideje — revolucija se širila Evropom.", "iz_udzbenika": {"strana": 55, "odeljak": "Konzulat", "tekst": "Stvaranjem sestrinskih republika tekovine Francuske revolucije proširene su van Francuske."}, "lekcija": 7}, {"id": "l07-konz-izbor-zakonik", "vrsta": "izbor", "tezina": "lako", "pojmovi": ["gradjanski-zakonik"], "pitanje": "Koje je najvažnije delo iz perioda Konzulata?", "odgovori": [{"tekst": "Građanski zakonik (Napoleonov kodeks)", "tacan": true}, {"tekst": "Deklaracija o pravima čoveka i građanina", "tacan": false, "zasto": "Deklaracija je doneta u Francuskoj revoluciji, pre Napoleona."}, {"tekst": "Kontinentalna blokada", "tacan": false, "zasto": "Blokadu je Napoleon proglasio kao car, u Berlinu."}, {"tekst": "Sveta alijansa", "tacan": false, "zasto": "Svetu alijansu stvorili su vladari Rusije, Austrije i Pruske posle Napoleonovog pada."}], "pomoc": ["Delo je zakon, a nosi Napoleonovo ime.", "Donet je 1804.", "Iz lekcije: najznačajnije delo Konzulata je Građanski zakonik."], "objasnjenje": "Građanski zakonik ili Napoleonov kodeks iz 1804. najvažnije je delo Konzulata.", "iz_udzbenika": {"strana": 55, "odeljak": "Konzulat", "tekst": "Najznačajnije delo Konzulata bio je Građanski zakonik (Napoleonov kodeks) iz 1804."}, "lekcija": 7}, {"id": "l07-konz-izbor-zakonik-sadrzaj", "vrsta": "izbor", "tezina": "srednje", "pojmovi": ["gradjanski-zakonik"], "pitanje": "Šta je Građanski zakonik potvrdio? (više tačnih)", "odgovori": [{"tekst": "Slobodu veroispovesti", "tacan": true}, {"tekst": "Jednakost građana pred zakonom", "tacan": true}, {"tekst": "Pravo na svojinu", "tacan": true}, {"tekst": "Povlastice plemstva", "tacan": false, "zasto": "Zakonik se zasniva na jednakosti svih ljudi — povlastice joj protivreče."}, {"tekst": "Neograničenu vlast kralja", "tacan": false, "zasto": "To je apsolutizam, koji je Francuska revolucija srušila."}], "pomoc": ["Zakonik počiva na slobodi i jednakosti.", "Tri prava: vera, zakon, imovina.", "Iz lekcije: verske slobode, jednakost pred zakonom i pravo na svojinu."], "objasnjenje": "Zakonik je potvrdio slobodu veroispovesti, jednakost pred zakonom i pravo na svojinu.", "iz_udzbenika": {"strana": 55, "odeljak": "Konzulat", "tekst": "Zakonik je potvrdio verske slobode, ravnopravnost pred zakonom i pravo na svojinu."}, "lekcija": 7}, {"id": "l07-konz-datum-zakonik", "vrsta": "datum", "tezina": "lako", "pojmovi": ["gradjanski-zakonik"], "dogadjaj": "Građanski zakonik (Napoleonov kodeks)", "pitanje": "Koje godine je donet Građanski zakonik?", "godina": 1804, "traka": "ideje", "pomoc": ["Iste godine Napoleon postaje car.", "Pet godina posle prevrata.", "Iz lekcije: Građanski zakonik 1804."], "objasnjenje": "Građanski zakonik donet je 1804.", "iz_udzbenika": {"strana": 55, "odeljak": "Konzulat", "tekst": "Građanski zakonik donet je 1804."}, "lekcija": 7}, {"id": "l07-konz-datum-ustav", "vrsta": "datum", "tezina": "srednje", "pojmovi": ["ustav-iz-1799", "konzulat"], "dogadjaj": "Ustav iz 1799.", "pitanje": "Koje godine je donet ustav kojim je uveden Konzulat?", "godina": 1799, "traka": "ideje", "pomoc": ["Iste godine je srušen Direktorijum.", "Godina se vidi i u nazivu pojma.", "Iz lekcije: ustav iz 1799."], "objasnjenje": "Ustav Konzulata donet je 1799, odmah posle prevrata.", "iz_udzbenika": {"strana": 55, "odeljak": "Konzulat", "tekst": "Po novom ustavu iz 1799. na čelu države bila su tri konzula."}, "lekcija": 7}, {"id": "l07-konz-lanac-zakonik", "vrsta": "lanac", "tezina": "srednje", "pojmovi": ["francuska-revolucija", "gradjanski-zakonik"], "karike": ["Francuska revolucija ističe slobodu i jednakost svih ljudi", "?", "Potvrđene su verske slobode, jednakost pred zakonom i pravo na svojinu"], "praznina": 1, "odgovori": [{"tekst": "Na tim idejama zasniva se Građanski zakonik iz 1804.", "tacan": true}, {"tekst": "Bečki kongres vraća stari poredak", "tacan": false, "zasto": "Bečki kongres je pokušao da poništi ideje revolucije, a ne da ih potvrdi."}, {"tekst": "Napoleon proglašava kontinentalnu blokadu", "tacan": false, "zasto": "Blokada je bila trgovinska mera protiv Britanije, nije potvrdila prava građana."}], "pomoc": ["Korak 1: Koji dokument je preneo ideje revolucije u zakone?", "Korak 2: Doneo ga je Napoleon u doba Konzulata.", "Iz lekcije: zakonik se temeljio na idejama slobode i jednakosti iz Francuske revolucije."], "objasnjenje": "Ideje revolucije (sloboda, jednakost) ugrađene su u Građanski zakonik, koji je potvrdio osnovna prava građana.", "iz_udzbenika": {"strana": 55, "odeljak": "Konzulat", "tekst": "Zakonik se zasnivao na idejama slobode i jednakosti iz Francuske revolucije."}, "lekcija": 7}, {"id": "l07-konz-lanac-dozivotni", "vrsta": "lanac", "tezina": "tesko", "pojmovi": ["prvi-konzul", "dozivotni-konzul", "prvo-francusko-carstvo"], "karike": ["Napoleon postaje prvi konzul (1799)", "?", "Napoleon se proglašava za cara (1804)"], "praznina": 1, "odgovori": [{"tekst": "Izabran je za doživotnog konzula (1802)", "tacan": true}, {"tekst": "Poražen je kod Vaterloa", "tacan": false, "zasto": "Vaterlo (1815) je kraj njegove vladavine, ne korak ka carstvu."}, {"tekst": "Proteran je na Elbu", "tacan": false, "zasto": "Na Elbu je proteran 1814, posle odricanja od prestola."}], "pomoc": ["Korak 1: Kako se vlast prvog konzula mogla još produžiti?", "Korak 2: Šta se dogodilo 1802?", "Iz lekcije: 1802. izabran je za doživotnog konzula."], "objasnjenje": "Napoleon je postepeno jačao vlast: prvi konzul (1799) → doživotni konzul (1802) → car (1804).", "iz_udzbenika": {"strana": 55, "odeljak": "Konzulat", "tekst": "Bonaparta je 1802. postao doživotni konzul, a 1804. car."}, "lekcija": 7}, {"id": "l07-konz-uporedi-direktorijum-konzulat", "vrsta": "uporedi", "tezina": "tesko", "pojmovi": ["direktorijum", "konzulat", "prvi-konzul", "ustav-iz-1799"], "a": "Direktorijum", "b": "Konzulat", "pitanje": "Na koji oblik vlasti se odnosi tvrdnja — Direktorijum, Konzulat, oba ili nijedan?", "tvrdnje": [{"tekst": "Raspušten je posle prevrata 1799.", "odgovor": "a", "zasto": "Prevratom 1799. raspušten je Direktorijum."}, {"tekst": "Na čelu su tri konzula, a prvi ima izvršnu i zakonodavnu vlast.", "odgovor": "b", "zasto": "Tako je uređen Konzulat po ustavu iz 1799."}, {"tekst": "Postojao je u Francuskoj posle revolucije, a pre carstva.", "odgovor": "oba", "zasto": "Prvo Direktorijum, zatim Konzulat — oba pre carstva 1804."}, {"tekst": "Vlast je bila nesigurna zbog stalnih ratova.", "odgovor": "a", "zasto": "To udžbenik kaže za Direktorijum; zato je i pao."}, {"tekst": "Napoleon je izabran za doživotnog konzula.", "odgovor": "b", "zasto": "1802, u doba Konzulata."}, {"tekst": "Na čelu je bio kralj iz dinastije Burbon.", "odgovor": "nijedan", "zasto": "Burboni se vraćaju tek posle Napoleonovog pada."}], "pomoc": ["Koji je stariji, a koji ga je zamenio?", "Konzule je uveo Napoleon.", "Iz lekcije: Direktorijum je pao 1799; Konzulat — tri konzula, Napoleon prvi."], "objasnjenje": "Direktorijum je slaba vlast srušena 1799; Konzulat daje vlast prvom konzulu Napoleonu.", "iz_udzbenika": {"strana": 55, "odeljak": "Konzulat", "tekst": "Umesto Direktorijuma Napoleon je 1799. uveo Konzulat sa tri konzula."}, "lekcija": 7}, {"id": "l07-konz-povezi-pojmovi", "vrsta": "povezi", "tezina": "lako", "pojmovi": ["prvi-konzul", "dozivotni-konzul", "gradjanski-zakonik", "sestrinske-republike"], "pitanje": "Poveži pojam sa objašnjenjem.", "parovi": [["Prvi konzul", "Ima izvršnu i zakonodavnu vlast"], ["Doživotni konzul", "Napoleonova titula od 1802."], ["Građanski zakonik", "Jednakost pred zakonom i pravo na svojinu"], ["Sestrinske republike", "Zavisne države nastale oko Francuske"]], "pomoc": ["Dve stavke su Napoleonove titule.", "Jedna je zakon, jedna su države.", "Iz lekcije: prvi konzul (1799), doživotni (1802), zakonik (1804), sestrinske republike."], "objasnjenje": "Prvi konzul — vlast; doživotni konzul — 1802; Građanski zakonik — prava građana; sestrinske republike — zavisne države.", "iz_udzbenika": {"strana": 55, "odeljak": "Konzulat", "tekst": "Konzulat donosi titule prvog i doživotnog konzula, Građanski zakonik i sestrinske republike."}, "lekcija": 7}, {"id": "l07-konz-objasni-vlast", "vrsta": "objasni", "tezina": "srednje", "pojmovi": ["konzulat", "prvi-konzul", "opste-pravo-glasa"], "pitanje": "Zašto kažemo da je u Konzulatu sva stvarna vlast bila u Napoleonovim rukama?", "uzor": "Kao prvi konzul imao je izvršnu i zakonodavnu vlast, a druga dvojica konzula bila su samo savetnici. Postavljao je ministre, činovnike, oficire i sudije, vodio spoljnu politiku i komandovao vojskom. Skupština je imala mala ovlašćenja, a od 1802. bio je doživotni konzul.", "ideje": ["Imao je izvršnu i zakonodavnu vlast.", "Ostali konzuli bili su savetnici.", "Postavljao je sve važne ljude i komandovao vojskom.", "Skupština je bila slaba."], "objasnjenje": "Prvi konzul je kontrolisao zakone, upravu, vojsku i spoljnu politiku — skupština i ostali konzuli nisu mu bili prepreka.", "iz_udzbenika": {"strana": 55, "odeljak": "Konzulat", "tekst": "Prvi konzul imao je izvršnu i zakonodavnu vlast, a skupština mala ovlašćenja."}, "lekcija": 7}, {"id": "l07-zakonik-izvor-slava", "vrsta": "izvor", "tezina": "srednje", "pojmovi": ["gradjanski-zakonik", "napoleon-bonaparta", "bitka-kod-vaterloa"], "izvor": {"autor": "Napoleon Bonaparta", "naslov": "Zapis iz progonstva (prepričano)", "tekst": "Pred kraj života Napoleon je zapisao da njegova prava slava nije u četrdesetak dobijenih bitaka, jer će poraz kod Vaterloa izbrisati sećanje na njih, ali da će njegov Građanski zakonik trajati zauvek.", "napomena": "Odlomak je prepričan; udžbenik, str. 55."}, "pitanje": "Šta je Napoleon smatrao svojim najvećim nasleđem?", "odgovori": [{"tekst": "Građanski zakonik", "tacan": true}, {"tekst": "Četrdeset dobijenih bitaka", "tacan": false, "zasto": "Upravo kaže da slava nije u bitkama — njih će Vaterlo izbrisati."}, {"tekst": "Krunisanje u Notr Damu", "tacan": false, "zasto": "U zapisu ne pominje krunisanje, već zakonik."}, {"tekst": "Kontinentalnu blokadu", "tacan": false, "zasto": "Blokada se u zapisu ne pominje i nije uspela."}], "pomoc": ["Šta će, po njemu, „živeti večno”?", "To je zakon iz 1804.", "Iz lekcije: Napoleon je Građanski zakonik smatrao svojim najvećim nasleđem."], "objasnjenje": "Napoleon je verovao da će bitke biti zaboravljene, a da će Građanski zakonik trajati.", "iz_udzbenika": {"strana": 55, "odeljak": "Građanski zakonik — prva strana", "tekst": "Napoleon je Građanski zakonik smatrao svojom najvećom zaostavštinom.", "slika": "07-napoleonovo-doba/02-gradjanski-zakonik-1804.jpg"}, "lekcija": 7}, {"id": "l07-zakonik-izvor-vaterlo", "vrsta": "izvor", "tezina": "tesko", "pojmovi": ["gradjanski-zakonik", "bitka-kod-vaterloa", "sveta-jelena"], "izvor": {"autor": "Napoleon Bonaparta", "naslov": "Zapis iz progonstva (prepričano)", "tekst": "Napoleon piše da njegova slava nije u pobedama u četrdesetak bitaka, jer će jedan poraz izbrisati uspomenu na sve njih, dok će zakonik ostati.", "napomena": "Odlomak je prepričan; udžbenik, str. 55."}, "pitanje": "Gde je Napoleon bio kada je ovo zapisao i koji poraz misli kad kaže „jedan poraz”?", "odgovori": [{"tekst": "U progonstvu na Svetoj Jeleni; misli na Vaterlo", "tacan": true}, {"tekst": "U Moskvi; misli na Borodino", "tacan": false, "zasto": "Zapis je nastao pred kraj života, u progonstvu; Borodino je bilo nerešeno."}, {"tekst": "Na Elbi; misli na Trafalgar", "tacan": false, "zasto": "Pred kraj života bio je na Svetoj Jeleni, a poraz koji pominje je Vaterlo."}, {"tekst": "U Parizu kao car; misli na Austerlic", "tacan": false, "zasto": "Austerlic je bila njegova velika pobeda, a ne poraz."}], "pomoc": ["Zapisao je to pred kraj života, a umro je 1821.", "Koji je bio njegov poslednji, konačni poraz?", "Iz lekcije: u progonstvu je pisao da će Vaterlo izbrisati uspomenu na pobede."], "objasnjenje": "Pisao je u progonstvu na Svetoj Jeleni; poraz koji briše pobede je Vaterlo (1815).", "iz_udzbenika": {"strana": 55, "odeljak": "Građanski zakonik — prva strana", "tekst": "Boraveći u progonstvu, pred kraj života, Napoleon piše da će Vaterlo izbrisati sećanje na njegove pobede.", "slika": "07-napoleonovo-doba/02-gradjanski-zakonik-1804.jpg"}, "lekcija": 7}, {"id": "l07-zakonik-tn-slika", "vrsta": "tacno_netacno", "slika_u_pitanju": true, "tezina": "lako", "pojmovi": ["gradjanski-zakonik", "pariz"], "tvrdnja": "Na slici je prva strana Građanskog zakonika, štampanog na francuskom jeziku u Parizu.", "tacno": true, "pomoc": ["Pročitaj naslov i mesto na dnu strane.", "Iz lekcije: prva strana Građanskog zakonika iz 1804, štampana u Parizu."], "objasnjenje": "Tačno — naslov je na francuskom, a dole piše Pariz i godina 1804.", "iz_udzbenika": {"strana": 55, "odeljak": "Građanski zakonik — prva strana", "tekst": "Slika prikazuje prvu stranu Građanskog zakonika (1804).", "slika": "07-napoleonovo-doba/02-gradjanski-zakonik-1804.jpg"}, "lekcija": 7}, {"id": "l07-zakonik-objasni-nasledje", "vrsta": "objasni", "tezina": "tesko", "pojmovi": ["gradjanski-zakonik", "francuska-revolucija"], "pitanje": "Zašto je Napoleon verovao da će Građanski zakonik trajati duže od slave njegovih pobeda?", "uzor": "Pobede su prolazne — jedan poraz, kao kod Vaterloa, može da ih poništi. Zakonik je uredio život svih građana: potvrdio je slobodu vere, jednakost pred zakonom i pravo na svojinu, vrednosti Francuske revolucije. Takva pravila ostaju i kad se promene vladari.", "ideje": ["Pobede može da poništi jedan poraz (Vaterlo).", "Zakonik uređuje svakodnevni život građana.", "Zakonik čuva ideje revolucije: slobodu i jednakost."], "objasnjenje": "Bitke se zaborave, a zakoni koji uređuju život ljudi ostaju — zato je zakonik Napoleonovo trajno nasleđe.", "iz_udzbenika": {"strana": 55, "odeljak": "Građanski zakonik — prva strana", "tekst": "Napoleon je smatrao da će Građanski zakonik živeti večno, a da će Vaterlo izbrisati sećanje na pobede."}, "lekcija": 7}, {"id": "l07-konz-objasni-zakonik", "vrsta": "objasni", "tezina": "lako", "pojmovi": ["gradjanski-zakonik", "francuska-revolucija"], "pitanje": "Šta je bio Građanski zakonik i šta je potvrdio?", "uzor": "Građanski zakonik ili Napoleonov kodeks donet je 1804. i bio je najvažnije delo Konzulata. Zasnivao se na idejama slobode i jednakosti iz Francuske revolucije. Potvrdio je slobodu veroispovesti, jednakost građana pred zakonom i pravo na svojinu.", "ideje": ["Donet je 1804, u doba Konzulata.", "Zasniva se na idejama slobode i jednakosti.", "Sloboda vere, jednakost pred zakonom, pravo na svojinu."], "objasnjenje": "Građanski zakonik je ideje revolucije pretvorio u zakone.", "iz_udzbenika": {"strana": 55, "odeljak": "Konzulat", "tekst": "Građanski zakonik iz 1804. potvrdio je verske slobode, jednakost pred zakonom i pravo na svojinu."}, "lekcija": 7}, {"id": "l07-konz-zakljuci-skupstina", "vrsta": "zakljuci", "tezina": "lako", "pojmovi": ["ustav-iz-1799", "opste-pravo-glasa", "prvi-konzul"], "pitanje": "Ljudi su po ustavu iz 1799. imali opšte pravo glasa. Da li je narod time stvarno odlučivao o državi?", "odgovori": [{"tekst": "Ne — skupština je imala mala ovlašćenja, a vlast je bila kod prvog konzula", "tacan": true}, {"tekst": "Da — skupština je imala svu vlast", "tacan": false, "zasto": "Ovlašćenja skupštine bila su mala."}, {"tekst": "Da — narod je birao ministre i sudije", "tacan": false, "zasto": "Ministre i sudije postavljao je prvi konzul."}], "pomoc": ["K
