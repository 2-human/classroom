# Banka zadataka — 2.2. Doba prosvetiteljstva (istorija, 7. razred, str. 34–38). Spaja se u spec.yaml.
# Pitanja sopstvenim rečima na osnovu beleške tools/istorija/_source/lekcije-7/04-doba-prosvetiteljstva.md.
# Svaki pogrešan ponuđeni odgovor ima `zasto` — greška treba da nauči, ne samo da kazni.

delovi:
  - naslov: Prosvetiteljstvo i prosvetitelji
    zadaci:
      - id: pros-izbor-uzrok-nedaca
        vrsta: izbor
        tezina: lako
        pojmovi: [prosvetiteljstvo, prosvetitelji]
        pitanje: Šta su prosvetitelji smatrali glavnim uzrokom svih nedaća u društvu?
        odgovori:
          - {tekst: Neobrazovanost naroda, tacan: true}
          - {tekst: Previše nauke i knjiga, tacan: false, zasto: "Upravo suprotno — prosvetitelji su verovali da nauka i razum mogu da poprave svet."}
          - {tekst: Slabu vojsku, tacan: false, zasto: "Vojska je bila briga vladara poput Fridriha II; prosvetitelji su govorili o znanju i razumu."}
          - {tekst: Industrijske mašine, tacan: false, zasto: "Industrijska revolucija je druga tema; prosvetitelji su kritikovali neznanje, praznoverje i nepravedno uređenje."}
        pomoc:
          - Setite se odakle dolazi sam naziv „prosvetitelji”.
          - Narod je trebalo „prosvetliti” — čime?
          - "Iz lekcije: uzrok svih nedaća videli su u neobrazovanosti; narod treba prosvetliti znanjem."
        objasnjenje: Prosvetitelji su verovali da je neznanje izvor nedaća, pa narod treba „prosvetliti” znanjem — odatle i njihovo ime.
        iz_udzbenika:
          strana: 34
          odeljak: Prosvetiteljstvo
          tekst: Francuski filozofi, književnici i naučnici XVIII veka zalagali su se za vladavinu razuma nad neznanjem i praznoverjem; neobrazovanost su smatrali glavnim uzrokom nedaća.

      - id: pros-izvor-ruso
        vrsta: izvor
        tezina: srednje
        pojmovi: [ruso, republika, drustveni-ugovor]
        izvor:
          autor: Žan-Žak Ruso
          naslov: Društveni ugovor (sažetak odlomka)
          tekst: Monarhija je uvek lošija od republike. U republici javno mnjenje dovodi na najviše položaje prosvećene i sposobne ljude, a narod se u izboru vara mnogo ređe nego vladar. Sposoban čovek u kraljevskoj vladi redak je koliko i budala na čelu republike.
          napomena: Odlomak je prepričan; udžbenik, str. 36 (Svedočanstvo).
        pitanje: Zašto je, prema ovom izvoru, republika bolja od monarhije?
        odgovori:
          - {tekst: Zato što narod bolje bira sposobne ljude nego što to čini vladar, tacan: true}
          - {tekst: Zato što u republici nema zakona, tacan: false, zasto: "Ruso piše da se zakoni donose uz odobrenje naroda — zakoni postoje, samo ih odobrava narod."}
          - {tekst: Zato što republika ima jaču vojsku, tacan: false, zasto: "O vojsci u odlomku nema ni reči; Ruso poredi kako se biraju ljudi na vlast."}
          - {tekst: Zato što je narod nedostojan da vlada sam, tacan: false, zasto: "To je Volterov stav iz pisma Katarini — Ruso tvrdi suprotno."}
        pomoc:
          - Pronađi u odlomku ko bira ljude na najviše položaje.
          - Ruso poredi ko se ređe vara u izboru — narod ili vladar.
          - "Iz lekcije: po Rusou se zakoni donose samo uz odobrenje naroda, pa je najbolje uređenje republika."
        objasnjenje: Ruso veruje da narod, kroz javno mnjenje, na vlast dovodi sposobne i prosvećene ljude i da se u izboru vara ređe od vladara — zato je republika bolja.
        iz_udzbenika:
          strana: 36
          odeljak: Svedočanstvo
          tekst: Udžbenik donosi odlomak iz Rusoovog „Društvenog ugovora” u kome on poredi monarhiju i republiku i pita kako autori posmatraju ulogu naroda.
          slika: 04-doba-prosvetiteljstva/05-ruso.jpg

      - id: pros-uporedi-volter-ruso
        vrsta: uporedi
        tezina: tesko
        pojmovi: [volter, ruso, monteskje, prosveceni-apsolutizam, republika]
        a: Volter
        b: Ruso
        pitanje: Na koga se odnosi tvrdnja — Voltera, Rusoa, obojicu ili nijednog?
        tvrdnje:
          - {tekst: "Najbolje uređenje je prosvećeni apsolutizam, „savez filozofa i kraljeva”.", odgovor: a, zasto: "To je Volterova ideja; Ruso je za republiku."}
          - {tekst: Zakoni se mogu donositi samo uz odobrenje naroda., odgovor: b, zasto: "Ruso u „Društvenom ugovoru” — odatle mu je republika najbolje uređenje."}
          - {tekst: Pisao je za Enciklopediju., odgovor: oba, zasto: "Enciklopediju su pisali najpoznatiji prosvetitelji — Volter, Ruso i Monteskje."}
          - {tekst: Zalagao se za podelu vlasti na izvršnu, zakonodavnu i sudsku., odgovor: nijedan, zasto: "Podelu vlasti je zastupao Monteskje."}
          - {tekst: Dopisivao se sa ruskom caricom Katarinom II., odgovor: a, zasto: "Volter je sa Katarinom vodio dugogodišnju prepisku; ona je posle njegove smrti otkupila njegovu biblioteku."}
        pomoc:
          - Ko je verovao vladarima, a ko narodu?
          - Volter → prosvećeni apsolutizam; Ruso → republika; podela vlasti je ideja trećeg prosvetitelja.
          - "Iz lekcije: Enciklopediju su pisali Volter, Ruso i Monteskje."
        objasnjenje: Volter je verovao prosvećenim vladarima, Ruso narodu (republika), a podela vlasti je Monteskjeova ideja. Obojica su pisali za Enciklopediju.

      - id: pros-objasni-biblija-prosvecenih
        vrsta: objasni
        tezina: srednje
        pojmovi: [enciklopedija, prosvetiteljstvo]
        pitanje: Zašto su savremenici Enciklopediju zvali „Biblijom prosvećenih”? Objasni svojim rečima.
        uzor: Enciklopedija je sabrala znanje i ideje prosvetitelja — o nauci, religiji, politici i vlasti. Za pristalice prosvetiteljstva bila je ono što je Biblija za vernike, glavna knjiga u koju veruju. Zbog članaka o religiji i vlasti francuske vlasti su je zabranile.
        ideje:
          - Sabrala je znanje i ideje prosvetitelja.
          - Za prosvetitelje je imala značaj kao Biblija za vernike.
          - Pisali su je najpoznatiji prosvetitelji (Volter, Ruso, Monteskje).
        objasnjenje: „Biblija prosvećenih” znači glavna knjiga jednog pokreta — Enciklopedija je bila to za prosvetitelje.
        osa: {naziv: Enciklopedija, od: 1751, do: 1772, traka: ideje}

  - naslov: Habzburška monarhija
    zadaci:
      - id: hab-datum-marija-terezija
        vrsta: datum
        tezina: srednje
        pojmovi: [marija-terezija, habzburska-monarhija]
        dogadjaj: Vladavina Marije Terezije
        pitanje: Od koje do koje godine je vladala Marija Terezija?
        od: 1740
        do: 1780
        traka: vladari
        pomoc:
          - Vladala je u sredini XVIII veka, četrdeset godina.
          - Počela je iste godine kad i Fridrih II u Pruskoj; nasledio ju je sin Josif II.
          - "Iz lekcije: Marija Terezija (1740–1780)."
        objasnjenje: Marija Terezija je vladala 1740–1780; posle nje Josif II (1780–1790).

      - id: hab-ko-sam-josif
        vrsta: ko_sam
        tezina: srednje
        pojmovi: [josif-ii, patent-o-verskoj-toleranciji, kmetstvo]
        tragovi:
          - Tajno sam putovao svojim carstvom da proverim kako se sprovode moje mere.
          - Raspustio sam stotine rimokatoličkih manastira, a njihova imanja dao osnivačima manufaktura.
          - Uveo sam nemački kao zvanični jezik celog carstva i pokušao da ukinem kmetstvo.
          - Godine 1781. doneo sam Patent o verskoj toleranciji.
        odgovori:
          - {tekst: Josif II, tacan: true}
          - {tekst: Fridrih II Veliki, tacan: false, zasto: "Fridrih je bio pruski kralj; reforme su mu bile usmerene pre svega na vojsku."}
          - {tekst: Petar I Veliki, tacan: false, zasto: "Petar je bio ruski car (1682–1725) — osnovao je Sankt Peterburg, a nije bio habzburški vladar."}
          - {tekst: Karlo VI, tacan: false, zasto: "Karlo VI je otac Marije Terezije; reforme su sprovodili njegova ćerka i unuk."}
        objasnjenje: To je Josif II (1780–1790), sin Marije Terezije, vladar prosvećenog apsolutizma u Habzburškoj monarhiji.
        iz_udzbenika:
          strana: 37
          odeljak: Znatiželja — Prerušeni car u inspekciji
          tekst: Josif II je prerušen kao „grof Hohberški, pratilac cara” stigao u Lavov; sobarici je rekao da cara „ponekad obrije”.
          slika: 04-doba-prosvetiteljstva/08-josif-ii.jpg

      - id: hab-zakljuci-povlacenje
        vrsta: zakljuci
        tezina: tesko
        pojmovi: [josif-ii, kmetstvo, reforma]
        pitanje: Zašto je Josif II na samrti morao da povuče većinu svojih zakona?
        odgovori:
          - {tekst: Njegove reforme su naišle na veliki otpor, posebno ugarskog plemstva, tacan: true}
          - {tekst: Izgubio je rat sa Rusijom, tacan: false, zasto: "Lekcija ne govori o takvom ratu; razlog je bio otpor unutar carstva."}
          - {tekst: Narod je tražio republiku, tacan: false, zasto: "Ideju republike zastupao je Ruso u Francuskoj; Josifu su se suprotstavili plemići."}
          - {tekst: Zakoni su bili previše blagi prema plemstvu, tacan: false, zasto: "Bilo je obrnuto — ukidanje kmetstva i nemački jezik ugrožavali su moć i običaje plemstva."}
        pomoc:
          - "Korak 1: Koje su njegove mere oduzimale nešto plemićima? (kmetovi)"
          - "Korak 2: Zašto bi Ugri bili protiv nemačkog kao zvaničnog jezika?"
          - "Korak 3: Ko je bio dovoljno moćan da zaustavi cara? Iz lekcije: otpor je bio najjači kod plemstva u Ugarskoj."
        objasnjenje: Ukidanje kmetstva, nemački kao zvanični jezik i apsolutističko vladanje izazvali su veliki otpor, naročito ugarskog plemstva — zato je na samrti povukao većinu zakona.

      - id: hab-tn-patent
        vrsta: tacno_netacno
        tezina: lako
        pojmovi: [josif-ii, patent-o-verskoj-toleranciji, sloboda-vere]
        tvrdnja: Patentom o verskoj toleranciji (1781) Josif II je zabranio pravoslavlje u carstvu.
        tacno: false
        ispravke:
          - {tekst: "Patent je doneo slobodu vere protestantima i pravoslavnima i dozvolio im da stupaju u državnu službu.", tacan: true}
          - {tekst: "Patent je zabranio protestantizam, a pravoslavlje dozvolio.", tacan: false, zasto: "Tolerancija je važila za obe vere — i protestante i pravoslavne."}
          - {tekst: "Patent je rimokatoličku crkvu stavio pod nadzor države.", tacan: false, zasto: "To je mera Marije Terezije, a ne sadržaj Patenta."}
        objasnjenje: Tolerancija znači trpeljivost — Patent je protestantskim i pravoslavnim podanicima dao slobodu vere i pristup državnoj službi.
        osa: {naziv: Patent o verskoj toleranciji, od: 1781, traka: dogadjaji}

  - naslov: Pruska i Rusija
    zadaci:
      - id: rus-lanac-baltik
        vrsta: lanac
        tezina: srednje
        pojmovi: [petar-i-veliki, sankt-peterburg, rusija]
        karike:
          - Petar I gradi stajaću vojsku i pobeđuje Švedsku
          - "?"
          - Na ušću Neve nastaje nova prestonica, Sankt Peterburg
        praznina: 1
        odgovori:
          - {tekst: Rusija dobija izlaz na Baltičko more, tacan: true}
          - {tekst: Rusija dobija izlaz na Crno more, tacan: false, zasto: "Crno more Rusija dobija kasnije, za Katarine II, ratujući protiv Osmanlija."}
          - {tekst: Rusija učestvuje u podeli Poljske, tacan: false, zasto: "Podela Poljske je delo Katarine II zajedno sa Austrijom i Pruskom, ne posledica rata sa Švedskom."}
          - {tekst: Plemstvo dobija pravo da bira cara, tacan: false, zasto: "Naprotiv — Petar je silom slomio otpor plemstva."}
        pomoc:
          - Šta Rusija dobija kad pobedi Švedsku, svog suseda na severu?
          - Neva se uliva u Baltičko more.
          - "Iz lekcije: pobedom nad Švedskom Rusija je dobila izlaz na Baltičko more."
        objasnjenje: Pobeda nad Švedskom dala je Rusiji izlaz na Baltičko more; na njegovoj obali, na ušću Neve, Petar je podigao Sankt Peterburg.
        osa: {naziv: Petar I Veliki, od: 1682, do: 1725, traka: vladari}

      - id: rus-poredjaj-vladari
        vrsta: poredjaj
        tezina: srednje
        pojmovi: [petar-i-veliki, marija-terezija, katarina-ii-velika, josif-ii, enciklopedija]
        pitanje: Poređaj događaje hronološki, od najranijeg do najkasnijeg.
        stavke:
          - {tekst: Petar I Veliki postaje ruski car, godina: 1682, do: 1725, naziv: Petar I Veliki, traka: vladari}
          - {tekst: Marija Terezija i Fridrih II stupaju na presto, godina: 1740, do: 1780, naziv: Vladavina Marije Terezije, traka: vladari}
          - {tekst: Počinje da izlazi Enciklopedija, godina: 1751, do: 1772, naziv: Enciklopedija, traka: ideje}
          - {tekst: Katarina II Velika postaje ruska carica, godina: 1762, do: 1796, naziv: Katarina II Velika, traka: vladari}
          - {tekst: Josif II donosi Patent o verskoj toleranciji, godina: 1781, naziv: Patent o verskoj toleranciji, traka: dogadjaji}
        pomoc:
          - Petar I je vladao na samom kraju XVII veka — on je najraniji.
          - Marija Terezija i Fridrih II počinju iste godine, pre Enciklopedije (1751–1772).
          - "Iz lekcije: 1682 Petar I, 1740 Marija Terezija, 1751 Enciklopedija, 1762 Katarina II, 1781 Patent."
        objasnjenje: Petar I (1682) → Marija Terezija i Fridrih II (1740) → Enciklopedija (1751) → Katarina II (1762) → Patent o verskoj toleranciji (1781).

      - id: rus-izbor-crno-more
        vrsta: izbor
        tezina: lako
        pojmovi: [katarina-ii-velika, rusija]
        pitanje: Za čije vladavine je Rusija, ratujući protiv Osmanlija, dobila izlaz na Crno more?
        odgovori:
          - {tekst: Katarine II Velike, tacan: true}
          - {tekst: Petra I Velikog, tacan: false, zasto: "Petar je pobedio Švedsku i dobio izlaz na Baltičko, ne na Crno more."}
          - {tekst: Marije Terezije, tacan: false, zasto: "Marija Terezija je vladala Habzburškom monarhijom, ne Rusijom."}
          - {tekst: Fridriha II, tacan: false, zasto: "Fridrih II je bio pruski kralj."}
        pomoc:
          - Crno more je na jugu — protiv koga je Rusija tamo ratovala?
          - Bila je to carica koja je vladala u drugoj polovini XVIII veka.
          - "Iz lekcije: Katarina II Velika (1762–1796) — izlaz na Crno more."
        objasnjenje: Katarina II je uspešno ratovala protiv Osmanlija i dobila izlaz na Crno more; Petar I je ranije dobio Baltik.
        osa: {naziv: Katarina II Velika, od: 1762, do: 1796, traka: vladari}

      - id: rus-objasni-kmetovi
        vrsta: objasni
        tezina: tesko
        pojmovi: [kmetstvo, petar-i-veliki, katarina-ii-velika, prosveceni-apsolutizam]
        pitanje: Petar I i Katarina II bili su reformatori, a ipak se položaj seljaka u Rusiji pogoršao. Kako je to moguće?
        uzor: Da bi plemstvo podržalo njihove reforme, Petar I i Katarina II dozvolili su da se seljaci pretvaraju u kmetove. Gospodar je mogao slobodno da raspolaže životom kmeta i njegove porodice, a bune kmetova su surovo gušene. Reforme su jačale državu, upravu i vojsku, ali ne i slobodu seljaka.
        ideje:
          - Hteli su da pridobiju plemstvo za svoje reforme.
          - Zato su odobrili pretvaranje seljaka u kmetove.
          - Reforme su jačale državu, ali ne i položaj običnog naroda.
        objasnjenje: Prosvećeni apsolutizam je prvo jačao državu; u Rusiji je cena za podršku plemstva bila sloboda seljaka.

      - id: pru-objasni-vojska
        vrsta: objasni
        tezina: srednje
        pojmovi: [pruska, fridrih-ii-veliki]
        pitanje: Jedan savremenik je zapisao da Pruska nije država koja ima vojsku, nego vojska koja je zaposela državu. Kako tumačiš te reči?
        uzor: Fridrih II je sve reforme — u privredi, trgovini, školstvu — usmeravao pre svega na jačanje vojske. Vojska je bila najvažnija stvar u državi i oslonac kralju, pa je izgledalo kao da država postoji zbog vojske, a ne vojska zbog države.
        ideje:
          - Reforme Fridriha II bile su usmerene na jačanje vojske.
          - Vojska je bila najvažnija u državi.
          - Obrnut je uobičajen odnos — država služi vojsci.
        objasnjenje: Izreka kaže da je u Pruskoj vojska bila iznad svega, jer su sve reforme služile njenom jačanju.
        iz_udzbenika:
          strana: 38
          odeljak: Pruska — oficir u pruskoj vojsci
          tekst: Uz sliku pruskog oficira udžbenik navodi reči savremenika o vojsci koja je zaposela državu i pita kako ih tumačiš.
          slika: 04-doba-prosvetiteljstva/09-pruski-oficir.jpg
        osa: {naziv: Fridrih II Veliki, od: 1740, do: 1786, traka: vladari}
