# Doba prosvetiteljstva — kviz po lekciji (tip: lesson-quiz; vidi templates/lesson-quiz/README.md).
# Pitanja su napisana sopstvenim rečima na osnovu lekcije „2.2. Doba prosvetiteljstva” (istorija,
# 7. razred, str. 34–38; str. 39 nije snimljena). Težište je na razumevanju: zašto, šta je iz čega
# proisteklo, kako to znamo iz izvora — ne na pamćenju.
title: Doba prosvetiteljstva — kviz
title_short: Doba prosvetiteljstva
locale: sr
nivo: osnovna
razred: 7
lekcije: [4]
description: >-
  Kviz za lekciju Doba prosvetiteljstva: prosvetitelji i njihove ideje, prosvećeni apsolutizam,
  Habzburška monarhija, Pruska i Rusija — uzroci i posledice, istorijski izvori, poređenja,
  vremenska osa i objašnjavanje svojim rečima.

# Vremenska osa lekcije: rešeni zadaci sa datumom stavljaju svoj događaj na osu (kartica u Pregledu).
