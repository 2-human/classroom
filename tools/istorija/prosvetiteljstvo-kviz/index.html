aka."}], "pomoc": ["Korak 1: Ko je bio „običan narod” — najbrojniji sloj?", "Korak 2: Koja mera olakšava život seljaka?", "Iz lekcije: Marija Terezija je strogo ograničila obaveze seljaka prema plemstvu."], "objasnjenje": "Ograničavanje obaveza seljaka prema plemstvu (Marija Terezija) poboljšava položaj naroda; u Rusiji je bilo obrnuto, pa su se kmetovi bunili.", "iz_udzbenika": {"strana": 36, "odeljak": "Prosvećeni apsolutizam; Habzburška monarhija", "tekst": "Marija Terezija je strogo ograničila obaveze seljaka prema plemstvu; lekcija kaže da je za uspeh reformi trebalo popraviti položaj običnog naroda."}, "osa": {"naziv": "Vladavina Marije Terezije", "od": 1740, "do": 1780, "traka": "vladari"}}, {"id": "apso-tn-bastilja", "vrsta": "tacno_netacno", "tezina": "lako", "pojmovi": ["volter", "bastilja"], "tvrdnja": "Zbog svojih dela Volter je dva puta bio zatvoren u pariskom zatvoru Bastilji.", "tacno": true, "pomoc": ["Volter je vodio nemiran život.", "Iz lekcije: dva puta je bio u Bastilji i morao je u izgnanstvo u Englesku."], "objasnjenje": "Tačno — zbog kritika crkve i vlasti Volter je dva puta bio u Bastilji, a zatim u izgnanstvu.", "iz_udzbenika": {"strana": 36, "odeljak": "Znatiželja — Volter i vladari", "tekst": "Zbog svojih dela Volter je dva puta bio u Bastilji i morao je da ode u izgnanstvo u Englesku."}}, {"id": "apso-tn-volter-fridrih", "vrsta": "tacno_netacno", "tezina": "srednje", "pojmovi": ["volter", "fridrih-ii-veliki"], "tvrdnja": "Volter je do kraja života ostao na dvoru Fridriha II u Pruskoj.", "tacno": false, "ispravke": [{"tekst": "Posle nekoliko godina na Fridrihovom dvoru Volter se razočarano razišao s pruskim kraljem.", "tacan": true}, {"tekst": "Volter nikada nije bio u Pruskoj, samo se dopisivao s Fridrihom.", "tacan": false, "zasto": "Boravio je na Fridrihovom dvoru; prepisku je vodio sa Katarinom II."}, {"tekst": "Fridrih II je Voltera zatvorio u Bastilju.", "tacan": false, "zasto": "Bastilja je pariski zatvor — tamo su ga zatvarale francuske vlasti."}], "pomoc": ["Prijateljstvo nije trajalo zauvek.", "Iz lekcije: posle nekoliko godina razočarano se razišao s pruskim kraljem."], "objasnjenje": "Volter je bio Fridrihov prijatelj i gost, ali se posle nekoliko godina razočaran razišao s njim.", "iz_udzbenika": {"strana": 36, "odeljak": "Znatiželja — Volter i vladari", "tekst": "Volter je boravio na dvoru Fridriha II, ali se posle nekoliko godina razočarano razišao s njim.", "slika": "04-doba-prosvetiteljstva/06-fridrih-ii-veliki.jpg"}}, {"id": "apso-lanac-volter-progon", "vrsta": "lanac", "tezina": "lako", "pojmovi": ["volter", "bastilja"], "karike": ["Volter piše protiv crkve, verske netrpeljivosti i nepravednih zakona", "?", "Francuski dvor mu zabranjuje povratak u Pariz"], "praznina": 1, "odgovori": [{"tekst": "Dva puta završava u Bastilji i mora u izgnanstvo u Englesku", "tacan": true}, {"tekst": "Postaje savetnik francuskog kralja", "tacan": false, "zasto": "Francuski dvor ga je progonio; savete su slušali strani vladari, Fridrih II i Katarina II."}, {"tekst": "Katarina II otkupljuje njegovu biblioteku", "tacan": false, "zasto": "To se desilo tek posle Volterove smrti."}], "pomoc": ["Kako su francuske vlasti odgovarale na kritiku?", "Zatvor i izgnanstvo.", "Iz lekcije: zbog svojih dela dva puta je bio u Bastilji i morao u izgnanstvo u Englesku."], "objasnjenje": "Volterove kritike donele su mu zatvor u Bastilji, izgnanstvo u Englesku i zabranu povratka u Pariz.", "iz_udzbenika": {"strana": 36, "odeljak": "Znatiželja — Volter i vladari", "tekst": "Volter je zbog svojih dela bio zatvaran i proteran, a francuski dvor mu je zabranio povratak u Pariz."}}, {"id": "apso-lanac-biblioteka", "vrsta": "lanac", "tezina": "srednje", "pojmovi": ["volter", "katarina-ii-velika", "ermitaz"], "karike": ["Volter i Katarina II godinama vode učenu prepisku", "Volter umire", "?"], "praznina": 2, "odgovori": [{"tekst": "Katarina otkupljuje celu njegovu biblioteku, koja se i danas čuva u Ermitažu", "tacan": true}, {"tekst": "Biblioteku zaplenjuju francuske vlasti i čuvaju je u Bastilji", "tacan": false, "zasto": "Bastilja je bila zatvor u kome je Volter ležao, a biblioteka je otišla u Rusiju."}, {"tekst": "Fridrih II prenosi biblioteku u Prusku", "tacan": false, "zasto": "Fridrih je o Volterovoj smrti samo zapisao da ga teši što je živeo u njegovo doba; biblioteku je otkupila Katarina."}], "pomoc": ["Ko je od vladara najduže bio u vezi s Volterom?", "Muzej se nalazi u Rusiji.", "Iz lekcije: carica je otkupila celu Volterovu biblioteku; čuva se u Ermitažu."], "objasnjenje": "Posle Volterove smrti Katarina II je otkupila celu njegovu biblioteku; i danas je u muzeju Ermitaž.", "iz_udzbenika": {"strana": 36, "odeljak": "Znatiželja — Volter i vladari", "tekst": "Posle Volterove smrti Katarina II je otkupila njegovu biblioteku, koja se i danas čuva u Ermitažu."}, "osa": {"naziv": "Katarina II Velika", "od": 1762, "do": 1796, "traka": "vladari"}}, {"id": "apso-dopuni-ermitaz", "vrsta": "dopuni", "tezina": "srednje", "pojmovi": ["volter", "katarina-ii-velika", "ermitaz"], "pitanje": "Dopuni rečenicu.", "tekst": "Posle Volterove smrti carica {{Katarina II}} otkupila je celu njegovu biblioteku, koja se i danas čuva u muzeju {{Ermitaž}}.", "ponudjene": ["Katarina II", "Marija Terezija", "Ermitaž", "Bastilja"], "pomoc": ["Volter se dugo dopisivao sa jednom caricom.", "Bastilja nije muzej, nego pariski zatvor.", "Iz lekcije: Katarina II je otkupila biblioteku; čuva se u Ermitažu."], "objasnjenje": "Katarina II je otkupila Volterovu biblioteku; ona je i danas u Ermitažu u Rusiji.", "iz_udzbenika": {"strana": 36, "odeljak": "Znatiželja — Volter i vladari", "tekst": "Katarina II je posle Volterove smrti otkupila njegovu biblioteku za muzej Ermitaž."}}, {"id": "apso-zakljuci-volter-savez", "vrsta": "zakljuci", "tezina": "srednje", "pojmovi": ["volter", "prosveceni-apsolutizam", "fridrih-ii-veliki", "katarina-ii-velika"], "pitanje": "Zašto je Volter mogao da veruje u „savez filozofa i kraljeva”?", "odgovori": [{"tekst": "Bio je prijatelj Fridriha II i dopisivao se s Katarinom II — vladari su slušali filozofe", "tacan": true}, {"tekst": "I sam je bio kralj", "tacan": false, "zasto": "Volter je bio pisac i filozof, a ne vladar."}, {"tekst": "Francuski kralj ga je postavio za ministra", "tacan": false, "zasto": "Francuski dvor ga je zatvarao i zabranio mu povratak u Pariz."}, {"tekst": "Verovao je da narod treba da bira vlast", "tacan": false, "zasto": "To je Rusoova ideja; Volter je pisao da je narod retko dostojan da vlada sam."}], "pomoc": ["Korak 1: S kojim vladarima je Volter bio blizak?", "Korak 2: Šta bi filozof dobio od takvog prijateljstva?", "Iz lekcije: prijatelj Fridriha II, prepiska s Katarinom II; ideal — prosvećeni apsolutizam."], "objasnjenje": "Volter je lično poznavao vladare koji su prihvatali ideje prosvetitelja, pa je verovao da filozofi i kraljevi zajedno mogu da poprave svet.", "iz_udzbenika": {"strana": 35, "odeljak": "Prosvetiteljstvo — Volter", "tekst": "Volter je bio prijatelj Fridriha II, dopisivao se s Katarinom II i smatrao prosvećeni apsolutizam najboljim uređenjem.", "slika": "04-doba-prosvetiteljstva/03-volter.jpg"}}, {"id": "apso-zakljuci-paradoks", "vrsta": "zakljuci", "tezina": "tesko", "pojmovi": ["volter", "francuska", "fridrih-ii-veliki", "katarina-ii-velika"], "pitanje": "Volter je u Francuskoj bio zatvaran i proterivan, a strani vladari su ga cenili. Šta to najbolje objašnjava?", "odgovori": [{"tekst": "Francuske vlasti su branile uređenje koje je on kritikovao, a Fridrih II i Katarina II su prihvatali ideje prosvetiteljstva", "tacan": true}, {"tekst": "Volter je pisao samo na ruskom i nemačkom", "tacan": false, "zasto": "Bio je francuski pisac, veoma popularan u celoj Evropi."}, {"tekst": "Strani vladari nisu znali za njegove kritike crkve", "tacan": false, "zasto": "Bio je veoma popularan u Evropi — njegove ideje su bile dobro poznate."}, {"tekst": "Volter je hvalio francuskog kralja, a kritikovao strane", "tacan": false, "zasto": "Bilo je obrnuto: kritikovao je francusku crkvu i zakone, a strane vladare je hvalio."}], "pomoc": ["Korak 1: Šta je Volter kritikovao u Francuskoj?", "Korak 2: Kakvi su bili vladari koji su ga cenili — šta su prihvatali?", "Iz lekcije: Fridrih II i Katarina II — vladari prosvećenog apsolutizma, Volterovi prijatelji."], "objasnjenje": "Za francuski dvor Volter je bio kritičar postojećeg uređenja; za prosvećene apsolutiste bio je saveznik čije ideje su primenjivali.", "iz_udzbenika": {"strana": 36, "odeljak": "Znatiželja — Volter i vladari", "tekst": "Volter je zatvaran i proterivan u Francuskoj, a bio je prijatelj Fridriha II i dopisnik Katarine II."}}, {"id": "apso-izvor-volter-pismo", "vrsta": "izvor", "tezina": "lako", "pojmovi": ["volter", "prosveceni-apsolutizam", "katarina-ii-velika"], "izvor": {"autor": "Volter", "naslov": "Pismo Katarini Velikoj (sažetak)", "tekst": "Monarsi vladaju svetom zato što je narod retko dostojan da vlada sam. Gotovo sve veliko u svetu delo je genija i upornosti jednog čoveka koji se suprotstavio predrasudama mnoštva. Ne volim kada vlada rulja.", "napomena": "Odlomak je prepričan; udžbenik, str. 36 (Svedočanstvo)."}, "pitanje": "Šta Volter u ovom pismu misli o sposobnosti naroda da vlada?", "odgovori": [{"tekst": "Narod je retko dostojan da vlada sam", "tacan": true}, {"tekst": "Narod bira sposobne ljude bolje od vladara", "tacan": false, "zasto": "To tvrdi Ruso u Društvenom ugovoru — suprotno Volteru."}, {"tekst": "Narod treba da odobrava sve zakone", "tacan": false, "zasto": "To je Rusoova ideja; Volter veruje prosvećenom vladaru."}, {"tekst": "Narod i vladar treba da podele vlast na tri dela", "tacan": false, "zasto": "Podela vlasti je Monteskjeova ideja i u pismu je nema."}], "pomoc": ["Pronađi u odlomku reč „dostojan”.", "Volter ne voli kad vlada „rulja”.", "Iz lekcije: Volter smatra da monarsi vladaju jer je narod retko dostojan da vlada sam."], "objasnjenje": "Volter ne veruje narodu — vlast treba da drži prosvećeni monarh; zato je pristalica prosvećenog apsolutizma.", "iz_udzbenika": {"strana": 36, "odeljak": "Svedočanstvo — Volter o prosvećenom apsolutizmu", "tekst": "Udžbenik donosi Volterovo pismo Katarini Velikoj o prosvećenom apsolutizmu.", "slika": "04-doba-prosvetiteljstva/03-volter.jpg"}}, {"id": "apso-izvor-volter-genije", "vrsta": "izvor", "tezina": "srednje", "pojmovi": ["volter", "prosveceni-apsolutizam"], "izvor": {"autor": "Volter", "naslov": "Pismo Katarini Velikoj (sažetak)", "tekst": "Monarsi vladaju svetom zato što je narod retko dostojan da vlada sam. Gotovo sve veliko u svetu delo je genija i upornosti jednog čoveka koji se suprotstavio predrasudama mnoštva. Ne volim kada vlada rulja.", "napomena": "Odlomak je prepričan; udžbenik, str. 36 (Svedočanstvo)."}, "pitanje": "Kome Volter pripisuje gotovo sve velike stvari u svetu i kako to podržava njegovo omiljeno uređenje?", "odgovori": [{"tekst": "Geniju i upornosti pojedinca — zato veruje u jakog, prosvećenog vladara", "tacan": true}, {"tekst": "Mnoštvu ljudi — zato veruje u republiku", "tacan": false, "zasto": "Volter kaže da se veliki pojedinac suprotstavio predrasudama mnoštva; republiku zagovara Ruso."}, {"tekst": "Crkvi — zato traži da crkva vlada", "tacan": false, "zasto": "Volter je kritikovao crkvu; u pismu crkve uopšte nema."}, {"tekst": "Parlamentu — zato traži podelu vlasti", "tacan": false, "zasto": "Parlamentarnu monarhiju i podelu vlasti traži Monteskje."}], "pomoc": ["Ko se u odlomku suprotstavlja predrasudama mnoštva?", "Ako veliko delo stvara jedan čovek, ko treba da vlada?", "Iz lekcije: Volter smatra najboljim prosvećeni apsolutizam."], "objasnjenje": "Volter veliča pojedinca koji se uzdiže iznad mnoštva — pa i prosvećenog monarha. Odatle njegova podrška prosvećenom apsolutizmu.", "iz_udzbenika": {"strana": 36, "odeljak": "Svedočanstvo — Volter o prosvećenom apsolutizmu", "tekst": "U pismu Katarini Volter piše da je gotovo sve veliko delo genija i upornosti pojedinca."}}, {"id": "apso-izvor-dva-autora", "vrsta": "izvor", "tezina": "tesko", "pojmovi": ["volter", "ruso", "republika", "prosveceni-apsolutizam"], "izvor": {"autor": "Volter i Ruso", "naslov": "Dva svedočanstva (sažeci)", "tekst": "Volter Katarini: monarsi vladaju svetom jer je narod retko dostojan da vlada sam; ne volim kad vlada rulja. — Ruso, Društveni ugovor: monarhija je uvek lošija od republike; narod se u izboru vara mnogo ređe nego vladar.", "napomena": "Odlomak je prepričan; udžbenik, str. 36 (Svedočanstvo)."}, "pitanje": "Koji autor hvali, a koji kritikuje monarhiju — i zašto?", "odgovori": [{"tekst": "Volter hvali monarhiju jer ne veruje narodu; Ruso je kritikuje jer veruje narodu", "tacan": true}, {"tekst": "Ruso hvali monarhiju, a Volter je kritikuje", "tacan": false, "zasto": "Obrnuto — Ruso piše da je monarhija uvek lošija od republike."}, {"tekst": "Obojica hvale monarhiju", "tacan": false, "zasto": "Ruso monarhiju jasno kritikuje i bira republiku."}, {"tekst": "Obojica kritikuju monarhiju jer veruju narodu", "tacan": false, "zasto": "Volter piše da je narod retko dostojan da vlada sam — on ne veruje narodu."}], "pomoc": ["Pronađi u svakom odlomku šta autor misli o narodu.", "Ko kaže da se narod ređe vara? Ko kaže da je retko dostojan?", "Iz lekcije: Volter hvali prosvećenu monarhiju, Ruso je kritikuje i bira republiku."], "objasnjenje": "Ključ je odnos prema narodu: Volter mu ne veruje pa hvali prosvećenu monarhiju; Ruso mu veruje pa kritikuje monarhiju i bira republiku.", "iz_udzbenika": {"strana": 36, "odeljak": "Svedočanstvo", "tekst": "Udžbenik pita koji autor hvali, a koji kritikuje monarhiju i kako posmatraju ulogu naroda."}}, {"id": "apso-izvor-fridrih-volter", "vrsta": "izvor", "tezina": "srednje", "pojmovi": ["fridrih-ii-veliki", "volter"], "izvor": {"autor": "Fridrih II Veliki", "naslov": "Zapis po vesti o Volterovoj smrti (sažetak)", "tekst": "Kad je čuo da je Volter umro, pruski kralj je zapisao da ga teši to što je živeo u Volterovo doba.", "napomena": "Odlomak je prepričan; udžbenik, str. 36 (Znatiželja)."}, "pitanje": "Šta ovaj zapis pokazuje o odnosu Fridriha II prema Volteru?", "odgovori": [{"tekst": "I posle njihovog razlaza Fridrih je veoma cenio Voltera", "tacan": true}, {"tekst": "Fridrih se obradovao Volterovoj smrti", "tacan": false, "zasto": "Zapis kaže suprotno — teši ga što je živeo u Volterovo doba, to je pohvala."}, {"tekst": "Fridrih nikada nije upoznao Voltera", "tacan": false, "zasto": "Volter je nekoliko godina boravio na Fridrihovom dvoru."}, {"tekst": "Fridrih je otkupio Volterovu biblioteku", "tacan": false, "zasto": "Biblioteku je otkupila Katarina II; danas je u Ermitažu."}], "pomoc": ["Da li je reč „teši” pohvala ili kritika?", "Seti se: Volter i Fridrih su se razišli, ali zapis dolazi posle toga.", "Iz lekcije: Volter je boravio kod Fridriha, razišli su se, a Fridrih je po vesti o smrti zapisao da ga teši što je živeo u Volterovo doba."], "objasnjenje": "Zapis je veliko priznanje: i posle razočaranja i razlaza Fridrih je Voltera smatrao velikanom svog doba.", "iz_udzbenika": {"strana": 36, "odeljak": "Znatiželja — Volter i vladari", "tekst": "Fridrih Veliki je po vesti o Volterovoj smrti zapisao da ga teši to što je živeo u Volterovo doba.", "slika": "04-doba-prosvetiteljstva/06-fridrih-ii-veliki.jpg"}, "osa": {"naziv": "Fridrih II Veliki", "od": 1740, "do": 1786, "traka": "vladari"}}, {"id": "apso-uporedi-apsolutizam", "vrsta": "uporedi", "tezina": "tesko", "pojmovi": ["apsolutizam", "prosveceni-apsolutizam", "volter"], "a": "Apsolutizam", "b": "Prosvećeni apsolutizam", "pitanje": "Na šta se odnosi tvrdnja — apsolutizam, prosvećeni apsolutizam, oba ili nijedno?", "tvrdnje": [{"tekst": "Vladar ima neograničenu vlast.", "odgovor": "oba", "zasto": "I prosvećeni apsolutista zadržava apsolutna ovlašćenja — razlika je kako ih koristi."}, {"tekst": "Vladar prihvata ideje prosvetitelja i uvodi mere na dobrobit društva.", "odgovor": "b", "zasto": "To je ono „prosvećeno” u prosvećenom apsolutizmu."}, {"tekst": "Prosvetitelji su ga kritikovali kod francuskih kraljeva.", "odgovor": "a", "zasto": "Monteskje i drugi kritikovali su apsolutizam francuskih kraljeva."}, {"tekst": "Narod bira vlast na određeno vreme.", "odgovor": "nijedan", "zasto": "To je republika; u oba apsolutizma vlast se nasleđuje."}, {"tekst": "Volter ga je smatrao najboljim uređenjem.", "odgovor": "b", "zasto": "Volterov „savez filozofa i kraljeva” je prosvećeni apsolutizam."}], "pomoc": ["Šta je zajedničko — šta znači reč apsolutizam?", "Šta dodaje reč „prosvećeni”?", "Iz lekcije: prosvećeni vladar koristi apsolutna ovlašćenja za mere po idejama prosvetitelja."], "objasnjenje": "Oba uređenja daju vladaru neograničenu vlast; prosvećeni vladar je koristi za reforme po idejama prosvetitelja.", "iz_udzbenika": {"strana": 35, "odeljak": "Prosvećeni apsolutizam", "tekst": "Prosvećeni apsolutizam je oblik vladavine u kome vladar sa apsolutnim ovlašćenjima uvodi mere prihvatajući ideje prosvetiteljstva."}}, {"id": "apso-povezi-nadimci", "vrsta": "povezi", "tezina": "tesko", "pojmovi": ["enciklopedija", "prosveceni-apsolutizam", "marija-terezija", "katarina-ii-velika"], "pitanje": "Poveži nadimak ili opis sa onim na šta se odnosi.", "parovi": [["„Biblija prosvećenih”", "Enciklopedija"], ["„savez filozofa i kraljeva”", "prosvećeni apsolutizam"], ["„majka Monarhije”", "Marija Terezija"], ["„gospa od Peterburga”", "Katarina II"]], "pomoc": ["Jedan nadimak je dobila carica sa šesnaestoro dece.", "Volter je jednoj carici davao laskava imena.", "Iz lekcije: Enciklopedija — Biblija prosvećenih; Volterov ideal — savez filozofa i kraljeva; Marija Terezija — majka Monarhije."], "objasnjenje": "Enciklopedija je „Biblija prosvećenih”, prosvećeni apsolutizam „savez filozofa i kraljeva”, Marija Terezija „majka Monarhije”, a Katarinu II Volter je zvao „gospom od Peterburga”.", "iz_udzbenika": {"strana": 36, "odeljak": "Prosvetiteljstvo; Znatiželja; Habzburška monarhija", "tekst": "Lekcija navodi nadimke Enciklopedije, prosvećenog apsolutizma, Marije Terezije i Katarine II."}}, {"id": "apso-poredjaj-sve", "vrsta": "poredjaj", "tezina": "tesko", "pojmovi": ["petar-i-veliki", "marija-terezija", "enciklopedija", "katarina-ii-velika", "josif-ii", "patent-o-verskoj-toleranciji"], "pitanje": "Poređaj događaje hronološki, od najranijeg do najkasnijeg.", "stavke": [{"tekst": "Petar I Veliki postaje ruski car", "godina": 1682, "do": 1725, "naziv": "Petar I Veliki", "traka": "vladari"}, {"tekst": "Marija Terezija stupa na habzburški presto", "godina": 1740, "do": 1780, "naziv": "Vladavina Marije Terezije", "traka": "vladari"}, {"tekst": "Počinje da izlazi Enciklopedija", "godina": 1751, "do": 1772, "naziv": "Enciklopedija", "traka": "ideje"}, {"tekst": "Katarina II Velika postaje ruska carica", "godina": 1762, "do": 1796, "naziv": "Katarina II Velika", "traka": "vladari"}, {"tekst": "Josif II nasleđuje majku", "godina": 1780, "do": 1790, "naziv": "Josif II", "traka": "vladari"}, {"tekst": "Donet je Patent o verskoj toleranciji", "godina": 1781, "naziv": "Patent o verskoj toleranciji", "traka": "dogadjaji"}], "pomoc": ["Jedini događaj iz XVII veka ide prvi.", "Josif II je morao da postane car pre nego što je doneo Patent.", "Iz lekcije: 1682, 1740, 1751, 1762, 1780, 1781."], "objasnjenje": "Petar I (1682) → Marija Terezija (1740) → Enciklopedija (1751) → Katarina II (1762) → Josif II (1780) → Patent (1781).", "iz_udzbenika": {"strana": 38, "odeljak": "Hronologija lekcije", "tekst": "Lekcija pokriva vreme od Petra I (od 1682) do Patenta o verskoj toleranciji (1781)."}}, {"id": "apso-objasni-definicija", "vrsta": "objasni", "tezina": "lako", "pojmovi": ["prosveceni-apsolutizam", "apsolutizam", "prosvetiteljstvo"], "pitanje": "Objasni svojim rečima šta je prosvećeni apsolutizam.", "uzor": "To je vladavina u kojoj vladar zadržava neograničenu vlast, ali je koristi da uvodi mere na dobrobit društva i države, prihvatajući ideje prosvetitelja. Jačale su se uprava, vojska i privreda. Takvi vladari bili su Marija Terezija, Josif II, Fridrih II i Katarina II.", "ideje": ["Vladar ima neograničenu (apsolutnu) vlast.", "Prihvata ideje prosvetitelja.", "Uvodi mere na dobrobit društva i države.", "Primer: Josif II, Fridrih II ili Katarina II."], "objasnjenje": "Prosvećeni apsolutizam = stara, neograničena vlast + nove, prosvetiteljske ideje.", "iz_udzbenika": {"strana": 35, "odeljak": "Prosvećeni apsolutizam", "tekst": "Pojedini vladari prihvatili su ideje prosvetiteljstva i, koristeći apsolutna ovlašćenja, uvodili mere na dobrobit društva i države."}}, {"id": "apso-objasni-volter", "vrsta": "objasni", "tezina": "lako", "pojmovi": ["volter", "bastilja", "francuska"], "pitanje": "Zašto je Volter, veoma popularan u Evropi, imao nemiran život u svojoj Francuskoj? Objasni svojim rečima.", "uzor": "Volter je u svojim delima kritikovao rimokatoličku crkvu i sveštenstvo, versku netrpeljivost i surove, nepravedne zakone. Francuskim vlastima to je smetalo, pa je dva puta bio zatvoren u Bastilji i morao je u izgnanstvo u Englesku. Francuski dvor mu je zabranio povratak u Pariz.", "ideje": ["Kritikovao je crkvu, versku netrpeljivost i nepravedne zakone.", "Dva puta je bio zatvoren u Bastilji.", "Morao je u izgnanstvo u Englesku i nije smeo da se vrati u Pariz."], "objasnjenje": "Kritika crkve i vlasti donela je Volteru slavu u Evropi, a progon u Francuskoj.", "iz_udzbenika": {"strana": 36, "odeljak": "Znatiželja — Volter i vladari", "tekst": "Zbog svojih dela Volter je dva puta bio u Bastilji, živeo je u izgnanstvu u Engleskoj, a dvor mu je zabranio povratak u Pariz.", "slika": "04-doba-prosvetiteljstva/03-volter.jpg"}}, {"id": "apso-objasni-narod", "vrsta": "objasni", "tezina": "tesko", "pojmovi": ["volter", "ruso", "republika", "prosveceni-apsolutizam"], "pitanje": "Kako Volter, a kako Ruso gledaju na ulogu naroda u državi? Objasni razliku i šta iz nje sledi.", "uzor": "Volter smatra da je narod retko dostojan da vlada sam i da velike stvari stvaraju pojedinci, pa veruje prosvećenom vladaru — prosvećenom apsolutizmu. Ruso misli da se narod u izboru vara ređe od vladara i da zakone mora da odobri narod, pa je za njega najbolja republika. Različit pogled na narod vodi ih do suprotnih uređenja.", "ideje": ["Volter: narod je retko dostojan da vlada sam.", "Volter zato bira prosvećeni apsolutizam.", "Ruso: narod bira bolje od vladara i odobrava zakone.", "Ruso zato bira republiku."], "objasnjenje": "Odnos prema narodu odlučuje koje uređenje prosvetitelj bira.", "iz_udzbenika": {"strana": 36, "odeljak": "Svedočanstvo", "tekst": "Udžbenik pita kako Volter i Ruso posmatraju ulogu naroda."}}]}, {"naslov": "Habzburška monarhija", "zadaci": [{"id": "hab-izbor-posedi", "vrsta": "izbor", "tezina": "srednje", "pojmovi": ["habzburska-monarhija", "habzburzi", "austrija", "ceska", "ugarska"], "pitanje": "Koje zemlje su pre svega činile nasledne posede Habzburga? (više tačnih)", "odgovori": [{"tekst": "Austrija", "tacan": true}, {"tekst": "Češka", "tacan": true}, {"tekst": "Ugarska", "tacan": true}, {"tekst": "Pruska", "tacan": false, "zasto": "Pruska je bila posebna nemačka država Hoencolerna i glavni takmac Austrije."}, {"tekst": "Poljska", "tacan": false, "zasto": "Poljsku su Austrija, Pruska i Rusija kasnije zajedno podelile; nije bila habzburški nasledni posed."}], "pomoc": ["Jedna od tih zemalja je pružila najjači otpor Josifu II.", "Habzburzi su vladali iz Beča.", "Iz lekcije: Austrija, Češka i Ugarska."], "objasnjenje": "Habzburšku monarhiju činili su nasledni posedi dinastije Habzburg, pre svega Austrija, Češka i Ugarska.", "iz_udzbenika": {"strana": 36, "odeljak": "Habzburška monarhija", "tekst": "Habzburšku monarhiju činili su nasledni posedi Habzburga, pre svega Austrija, Češka i Ugarska."}}, {"id": "hab-izbor-titula", "vrsta": "izbor", "tezina": "lako", "pojmovi": ["habzburzi", "sveto-rimsko-carstvo"], "pitanje": "Koju titulu su Habzburzi nosili od XV veka?", "odgovori": [{"tekst": "Careva Svetog rimskog carstva nemačkog naroda", "tacan": true}, {"tekst": "Ruskih careva", "tacan": false, "zasto": "Rusijom je od XVII veka vladala dinastija Romanov."}, {"tekst": "Kraljeva Francuske", "tacan": false, "zasto": "Marija Antoaneta je postala kraljica Francuske udajom, ali Habzburzi nisu nosili tu titulu."}, {"tekst": "Pruskih kraljeva", "tacan": false, "zasto": "Pruski kraljevi bili su iz dinastije Hoencolern."}], "pomoc": ["Titula je povezana sa nemačkim zemljama i Rimom.", "U tom carstvu je Pruska bila takmac Austrije.", "Iz lekcije: od XV veka Habzburzi su carevi Svetog rimskog carstva nemačkog naroda."], "objasnjenje": "Habzburzi su od XV veka nosili titulu careva Svetog rimskog carstva nemačkog naroda.", "iz_udzbenika": {"strana": 36, "odeljak": "Habzburška monarhija", "tekst": "Habzburzi su od XV veka nosili titulu careva Svetog rimskog carstva nemačkog naroda."}}, {"id": "hab-lanac-slaba-vlast", "vrsta": "lanac", "tezina": "lako", "pojmovi": ["habzburzi", "sveto-rimsko-carstvo", "reforma"], "karike": ["U XVIII veku carska vlast Habzburga je slaba", "Habzburzi žele da ojačaju vlast", "?"], "praznina": 2, "odgovori": [{"tekst": "Uvode niz reformi (Marija Terezija, Josif II)", "tacan": true}, {"tekst": "Odriču se carske titule", "tacan": false, "zasto": "Hteli su da ojačaju vlast, a ne da je napuste."}, {"tekst": "Proglašavaju republiku", "tacan": false, "zasto": "Ostali su monarsi; republike su bile samo manje države."}], "pomoc": ["Kako vladar jača državu?", "Iz lekcije: zbog slabe carske vlasti Habzburzi uvode niz mera."], "objasnjenje": "Slaba carska vlast navela je Habzburge na reforme — prvo Marija Terezija, zatim Josif II.", "iz_udzbenika": {"strana": 36, "odeljak": "Habzburška monarhija", "tekst": "Pošto je carska vlast u XVIII veku bila slaba, Habzburzi su uveli niz mera da je ojačaju."}}, {"id": "hab-datum-marija-terezija", "vrsta": "datum", "tezina": "srednje", "pojmovi": ["marija-terezija", "habzburska-monarhija"], "dogadjaj": "Vladavina Marije Terezije", "pitanje": "Od koje do koje godine je vladala Marija Terezija?", "od": 1740, "do": 1780, "traka": "vladari", "pomoc": ["Vladala je u sredini XVIII veka, četrdeset godina.", "Počela je iste godine kad i Fridrih II u Pruskoj; nasledio ju je sin Josif II.", "Iz lekcije: Marija Terezija (1740–1780)."], "objasnjenje": "Marija Terezija je vladala 1740–1780; posle nje Josif II (1780–1790).", "iz_udzbenika": {"strana": 36, "odeljak": "Habzburška monarhija", "tekst": "Marija Terezija je vladala od 1740. do 1780. i sprovela brojne reforme.", "slika": "04-doba-prosvetiteljstva/07-marija-terezija-sa-porodicom.jpg"}}, {"id": "hab-lanac-nasledje", "vrsta": "lanac", "tezina": "srednje", "pojmovi": ["karlo-vi", "marija-terezija"], "karike": ["Car Karlo VI nema muške dece", "?", "Marija Terezija postaje prva žena na habzburškom prestolu"], "praznina": 1, "odgovori": [{"tekst": "Karlo VI donosi akt po kome i ženski potomci mogu da naslede presto", "tacan": true}, {"tekst": "Plemstvo bira Mariju Tereziju na izborima", "tacan": false, "zasto": "Presto se nasleđivao; trebalo je promeniti pravilo nasleđivanja, a ne birati."}, {"tekst": "Pruska joj pomaže da osvoji presto", "tacan": false, "zasto": "Pruska je bila takmac Austrije, a Marija Terezija je presto nasledila po očevom aktu."}], "pomoc": ["Ko je mogao da nasledi presto pre toga?", "Otac je morao da promeni pravilo.", "Iz lekcije: Karlo VI je doneo akt da i ženski potomci nasleđuju presto."], "objasnjenje": "Bez muškog naslednika, Karlo VI je omogućio da presto nasledi i ćerka — tako je Marija Terezija postala prva žena na habzburškom prestolu.", "iz_udzbenika": {"strana": 37, "odeljak": "Habzburška monarhija — Marija Terezija", "tekst": "Pošto Karlo VI nije imao muške dece, doneo je akt kojim i ženski potomci mogu da nasleđuju presto.", "slika": "04-doba-prosvetiteljstva/07-marija-terezija-sa-porodicom.jpg"}, "osa": {"naziv": "Vladavina Marije Terezije", "od": 1740, "do": 1780, "traka": "vladari"}}, {"id": "hab-tn-mt-reforme", "vrsta": "tacno_netacno", "tezina": "lako", "pojmovi": ["marija-terezija", "reforma"], "tvrdnja": "Marija Terezija je reformisala vojsku i brinula da se porezi revnosno prikupljaju kako bi se državna kasa redovno punila.", "tacno": true, "pomoc": ["Seti se njenih reformi: seljaci, porezi, vojska, škole, zdravstvo, crkva.", "Iz lekcije: porezi su revnosno prikupljani, a vojska reformisana."], "objasnjenje": "Tačno — uz to je ograničila obaveze seljaka, unapredila školstvo i zdravstvo i stavila crkvu pod nadzor države.", "iz_udzbenika": {"strana": 36, "odeljak": "Habzburška monarhija — Marija Terezija", "tekst": "Marija Terezija je revnosno prikupljala poreze da bi se državna kasa redovno punila i reformisala vojsku."}, "osa": {"naziv": "Vladavina Marije Terezije", "od": 1740, "do": 1780, "traka": "vladari"}}, {"id": "hab-tn-mt-crkva", "vrsta": "tacno_netacno", "tezina": "srednje", "pojmovi": ["marija-terezija", "reforma"], "tvrdnja": "Marija Terezija je državne vlasti stavila pod nadzor rimokatoličke crkve.", "tacno": false, "ispravke": [{"tekst": "Bilo je obrnuto — rimokatoličku crkvu stavila je pod nadzor državnih vlasti.", "tacan": true}, {"tekst": "Ukinula je rimokatoličku crkvu u monarhiji.", "tacan": false, "zasto": "Crkva nije ukinuta; stavljena je pod nadzor države, a Josif II je kasnije raspustio stotine manastira."}, {"tekst": "Donela je Patent o verskoj toleranciji.", "tacan": false, "zasto": "Patent je 1781. doneo njen sin Josif II."}], "pomoc": ["Prosvećeni vladari jačaju državu — ko je nad kim?", "Iz lekcije: rimokatolička crkva je stavljena pod nadzor državnih vlasti."], "objasnjenje": "U duhu prosvećenog apsolutizma, Marija Terezija je ojačala državu i stavila crkvu pod njen nadzor.", "iz_udzbenika": {"strana": 36, "odeljak": "Habzburška monarhija — Marija Terezija", "tekst": "Marija Terezija je rimokatoličku crkvu stavila pod nadzor državnih vlasti."}}, {"id": "hab-izbor-mt-reforme", "vrsta": "izbor", "tezina": "tesko", "pojmovi": ["marija-terezija", "josif-ii", "reforma"], "pitanje": "Koje su mere sprovela Marija Terezija (a ne njen sin)? (više tačnih)", "odgovori": [{"tekst": "Strogo je ograničila obaveze seljaka prema plemstvu", "tacan": true}, {"tekst": "Rimokatoličku crkvu je stavila pod nadzor države", "tacan": true}, {"tekst": "Unapredila je školstvo i zdravstvo", "tacan": true}, {"tekst": "Donela je Patent o verskoj toleranciji", "tacan": false, "zasto": "Patent je 1781. doneo Josif II, posle njene smrti."}, {"tekst": "Uvela je nemački kao zvanični jezik celog carstva", "tacan": false, "zasto": "To je uradio Josif II da bi čvršće povezao posede."}, {"tekst": "Raspustila je stotine manastira", "tacan": false, "zasto": "Manastire je raspuštao Josif II i njihova imanja delio osnivačima manufaktura."}], "pomoc": ["Svaku meru proveri: majka (1740–1780) ili sin (1780–1790)?", "Sve mere koje počinju posle 1780. su Josifove.", "Iz lekcije: Marija Terezija — seljaci, porezi, vojska, školstvo, zdravstvo, nadzor nad crkvom."], "objasnjenje": "Marija Terezija je ograničila obaveze seljaka, reformisala poreze i vojsku, školstvo i zdravstvo i nadzirala crkvu; Patent, nemački jezik i raspuštanje manastira su mere Josifa II.", "iz_udzbenika": {"strana": 36, "odeljak": "Habzburška monarhija", "tekst": "Lekcija posebno navodi reforme Marije Terezije i reforme njenog sina Josifa II."}}, {"id": "hab-zakljuci-porezi", "vrsta": "zakljuci", "tezina": "srednje", "pojmovi": ["marija-terezija", "reforma"], "pitanje": "Zašto je Mariji Tereziji bilo važno da se porezi revnosno prikupljaju?", "odgovori": [{"tekst": "Da se državna kasa redovno puni — od nje zavise vojska i druge reforme", "tacan": true}, {"tekst": "Da bi kaznila seljake", "tacan": false, "zasto": "Ona je obaveze seljaka prema plemstvu, naprotiv, ograničila."}, {"tekst": "Da bi novac dala crkvi", "tacan": false, "zasto": "Crkvu je stavila pod nadzor države, a ne finansirala njenu moć."}, {"tekst": "Da bi platila Volteru", "tacan": false, "zasto": "Lekcija ne povezuje Mariju Tereziju s Volterom; Volter je bio u vezi s Fridrihom II i Katarinom II."}], "pomoc": ["Korak 1: Šta se puni porezima?", "Korak 2: Šta sve košta — vojska, škole, zdravstvo?", "Iz lekcije: porezi su revnosno prikupljani da se državna kasa redovno puni."], "objasnjenje": "Reforme vojske, škola i zdravstva koštaju; bez pune državne kase ne bi bilo ni jačanja vlasti.", "iz_udzbenika": {"strana": 36, "odeljak": "Habzburška monarhija — Marija Terezija", "tekst": "Porezi su revnosno prikupljani da bi se državna kasa redovno punila."}}, {"id": "hab-dopuni-mt", "vrsta": "dopuni", "tezina": "lako", "pojmovi": ["marija-terezija", "habzburska-monarhija"], "pitanje": "Dopuni rečenicu o Mariji Tereziji.", "tekst": "Marija Terezija bila je prva {{žena}} na habzburškom prestolu. Pošto je rodila {{šesnaestoro}} dece, prozvana je „{{majkom Monarhije}}”.", "ponudjene": ["žena", "šesnaestoro", "četvoro", "majkom Monarhije", "gospom od Peterburga"], "pomoc": ["Na porodičnoj slici je mnogo dece.", "„Gospa od Peterburga” je Volterovo ime za Katarinu II.", "Iz lekcije: prva žena na habzburškom prestolu, šesnaestoro dece, „majka Monarhije”."], "objasnjenje": "Marija Terezija je bila prva žena na habzburškom prestolu i majka šesnaestoro dece — „majka Monarhije”.", "iz_udzbenika": {"strana": 37, "odeljak": "Habzburška monarhija — potpis uz sliku", "tekst": "Marija Terezija je bila prva žena na habzburškom prestolu; zbog šesnaestoro dece zvali su je „majkom Monarhije”.", "slika": "04-doba-prosvetiteljstva/07-marija-terezija-sa-porodicom.jpg"}}, {"id": "hab-izbor-antoaneta", "vrsta": "izbor", "slika_u_pitanju": true, "tezina": "lako", "pojmovi": ["marija-antoaneta", "marija-terezija", "francuska"], "pitanje": "Ko je Marija Antoaneta, treća sleva na slici porodice Marije Terezije?", "odgovori": [{"tekst": "Buduća kraljica Francuske", "tacan": true}, {"tekst": "Buduća ruska carica", "tacan": false, "zasto": "Ruska carica tog doba je Katarina II."}, {"tekst": "Prva žena na habzburškom prestolu", "tacan": false, "zasto": "To je sama Marija Terezija."}, {"tekst": "Pruska kraljica, žena Fridriha II", "tacan": false, "zasto": "Lekcija o tome ništa ne kaže; Marija Antoaneta je buduća kraljica Francuske."}], "pomoc": ["Njena buduća zemlja je zemlja prosvetitelja.", "Iz lekcije: Marija Antoaneta, buduća kraljica Francuske."], "objasnjenje": "Na porodičnoj slici Marije Terezije treća sleva je Marija Antoaneta, buduća kraljica Francuske.", "iz_udzbenika": {"strana": 37, "odeljak": "Habzburška monarhija — potpis uz sliku", "tekst": "Na slici Marije Terezije sa porodicom, treća sleva je Marija Antoaneta, buduća kraljica Francuske.", "slika": "04-doba-prosvetiteljstva/07-marija-terezija-sa-porodicom.jpg"}}, {"id": "hab-izvor-porodica", "vrsta": "izvor", "slika_u_pitanju": true, "tezina": "tesko", "pojmovi": ["marija-terezija", "habzburska-monarhija"], "izvor": {"autor": "Slika iz udžbenika", "naslov": "Marija Terezija sa porodicom (opis slike)", "tekst": "Svečani grupni portret carske porodice na terasi dvorca. Oko carice je mnogo dece u raskošnoj odeći. Potpis kaže da je rodila šesnaestoro dece i da je bila prva žena na habzburškom prestolu.", "napomena": "Odlomak je prepričan; udžbenik, str. 37."}, "pitanje": "Udžbenik pita da li je carica sama odgajala svoju decu. Šta je najrazumniji zaključak?", "odgovori": [{"tekst": "Verovatno nije — uz vođenje carstva i šesnaestoro dece, pomagali su joj dadilje i vaspitači", "tacan": true}, {"tekst": "Da — slika dokazuje da je sve radila sama", "tacan": false, "zasto": "Slika pokazuje porodicu na svečanosti, a ne ko se brinuo o deci; zaključujemo iz njenih obaveza."}, {"tekst": "Nije imala decu, pa pitanje nema smisla", "tacan": false, "zasto": "Imala je šesnaestoro dece — zato je „majka Monarhije”."}, {"tekst": "Decu je odgajao Volter", "tacan": false, "zasto": "Volter nije bio u službi Habzburga; boravio je kod Fridriha II."}], "pomoc": ["Koliko je dece imala i čime se još bavila?", "Slika je svečani portret — šta ona može, a šta ne može da dokaže?", "Iz lekcije: vladala je 40 godina, sprovela mnogo reformi i rodila šesnaestoro dece."], "objasnjenje": "Izvor ne kaže ko je odgajao decu, ali iz njenih državničkih obaveza i broja dece razumno je zaključiti da je imala mnogo pomoći.", "iz_udzbenika": {"strana": 37, "odeljak": "Habzburška monarhija — slika", "tekst": "Uz porodičnu sliku udžbenik pita da li je carica sama odgajala decu i traži obrazloženje.", "slika": "04-doba-prosvetiteljstva/07-marija-terezija-sa-porodicom.jpg"}}, {"id": "hab-ko-sam-mt", "vrsta": "ko_sam", "tezina": "lako", "pojmovi": ["marija-terezija", "karlo-vi", "habzburska-monarhija"], "tragovi": ["Moj otac je doneo akt po kome i ćerke mogu da naslede presto.", "Rodila sam šesnaestoro dece, pa su me zvali „majkom Monarhije”.", "Vladala sam Habzburškom monarhijom od 1740. do 1780."], "odgovori": [{"tekst": "Marija Terezija", "tacan": true}, {"tekst": "Katarina II Velika", "tacan": false, "zasto": "Katarina je bila ruska carica (1762–1796)."}, {"tekst": "Marija Antoaneta", "tacan": false, "zasto": "Marija Antoaneta je buduća kraljica Francuske, sa porodične slike Marije Terezije."}, {"tekst": "Josif II", "tacan": false, "zasto": "Josif II je njen sin i naslednik (1780–1790)."}], "objasnjenje": "To je Marija Terezija, prva žena na habzburškom prestolu (1740–1780).", "iz_udzbenika": {"strana": 37, "odeljak": "Habzburška monarhija — Marija Terezija", "tekst": "Marija Terezija (1740–1780), ćerka Karla VI, majka šesnaestoro dece.", "slika": "04-doba-prosvetiteljstva/07-marija-terezija-sa-porodicom.jpg"}}, {"id": "hab-datum-josif", "vrsta": "datum", "tezina": "srednje", "pojmovi": ["josif-ii", "habzburska-monarhija"], "dogadjaj": "Josif II", "pitanje": "Od koje do koje godine je vladao Josif II?", "od": 1780, "do": 1790, "traka": "vladari", "pomoc": ["Nasledio je majku kad je ona prestala da vlada.", "Vladao je samo deset godina.", "Iz lekcije: Josif II (1780–1790)."], "objasnjenje": "Josif II je vladao 1780–1790, posle majke Marije Terezije.", "iz_udzbenika": {"strana": 37, "odeljak": "Habzburška monarhija — Josif II", "tekst": "Josif II (1780–1790), sin i naslednik Marije Terezije, nastavio je reforme.", "slika": "04-doba-prosvetiteljstva/08-josif-ii.jpg"}}, {"id": "hab-tn-patent", "vrsta": "tacno_netacno", "tezina": "lako", "pojmovi": ["josif-ii", "patent-o-verskoj-toleranciji", "sloboda-vere"], "tvrdnja": "Patentom o verskoj toleranciji (1781) Josif II je zabranio pravoslavlje u carstvu.", "tacno": false, "ispravke": [{"tekst": "Patent je doneo slobodu vere protestantima i pravoslavnima i dozvolio im da stupaju u državnu službu.", "tacan": true}, {"tekst": "Patent je zabranio protestantizam, a pravoslavlje dozvolio.", "tacan": false, "zasto": "Tolerancija je važila za obe vere — i protestante i pravoslavne."}, {"tekst": "Patent je rimokatoličku crkvu stavio pod nadzor države.", "tacan": false, "zasto": "To je mera Marije Terezije, a ne sadržaj Patenta."}], "pomoc": ["Reč „tolerancija” znači trpeljivost — dozvoliti, a ne zabraniti.", "Iz lekcije: Patent je doneo slobodu vere protestantskim i pravoslavnim podanicima."], "objasnjenje": "Tolerancija znači trpeljivost — Patent je protestantskim i pravoslavnim podanicima dao slobodu vere i pristup državnoj službi.", "iz_udzbenika": {"strana": 37, "odeljak": "Habzburška monarhija — Josif II", "tekst": "Patentom o verskoj toleranciji (1781) protestanti i pravoslavni dobili su slobodu vere i pravo da stupaju u državnu službu."}, "osa": {"naziv": "Patent o verskoj toleranciji", "od": 1781, "traka": "dogadjaji"}}, {"id": "hab-datum-patent", "vrsta": "datum", "tezina": "lako", "pojmovi": ["patent-o-verskoj-toleranciji", "josif-ii"], "dogadjaj": "Patent o verskoj toleranciji", "pitanje": "Koje godine je Josif II doneo Patent o verskoj toleranciji?", "godina": 1781, "traka": "dogadjaji", "pomoc": ["Na samom početku Josifove vladavine.", "Godinu dana posle smrti njegove majke (1780).", "Iz lekcije: Patent o verskoj toleranciji, 1781."], "objasnjenje": "Patent o verskoj toleranciji donet je 1781, odmah na početku vladavine Josifa II.", "iz_udzbenika": {"strana": 37, "odeljak": "Habzburška monarhija — Josif II", "tekst": "Josif II je 1781. doneo Patent o verskoj toleranciji."}}, {"id": "hab-zakljuci-patent", "vrsta": "zakljuci", "tezina": "srednje", "pojmovi": ["patent-o-verskoj-toleranciji", "sloboda-vere", "volter", "prosveceni-apsolutizam"], "pitanje": "Zašto se Patent o verskoj toleranciji smatra merom u duhu prosvetiteljstva?", "odgovori": [{"tekst": "Prosvetitelji, pre svih Volter, pisali su protiv verske netrpeljivosti, a Patent je doneo slobodu vere", "tacan": true}, {"tekst": "Zato što je ojačao moć rimokatoličke crkve", "tacan": false, "zasto": "Patent je dao prava drugim verama; prosvetitelji su kritikovali moć crkve."}, {"tekst": "Zato što je uveo republiku", "tacan": false, "zasto": "Josif II je vladao apsolutistički; Patent govori o veri."}, {"tekst": "Zato što je zabranio sve vere", "tacan": false, "zasto": "Upravo suprotno — dozvolio je slobodu vere protestantima i pravoslavnima."}], "pomoc": ["Korak 1: Protiv čega je Volter pisao?", "Korak 2: Šta Patent daje drugim verama?", "Iz lekcije: Volter piše protiv verske netrpeljivosti; Patent donosi slobodu vere."], "objasnjenje": "Patent sprovodi u delo prosvetiteljsku ideju verske trpeljivosti — vladar koristi neograničenu vlast za meru koju su prosvetitelji tražili.", "iz_udzbenika": {"strana": 37, "odeljak": "Habzburška monarhija — Josif II", "tekst": "Josif II je nastavio reforme u duhu prosvećenog apsolutizma; Patentom je doneo slobodu vere."}, "osa": {"naziv": "Patent o verskoj toleranciji", "od": 1781, "traka": "dogadjaji"}}, {"id": "hab-lanac-manastiri", "vrsta": "lanac", "tezina": "srednje", "pojmovi": ["josif-ii", "manufaktura"], "karike": ["Josif II nastavlja reforme u duhu prosvećenog apsolutizma", "Raspušta stotine rimokatoličkih manastira", "?"], "praznina": 2, "odgovori": [{"tekst": "Njihova imanja besplatno deli osnivačima manufaktura", "tacan": true}, {"tekst": "Imanja predaje ugarskom plemstvu", "tacan": false, "zasto": "Plemstvo u Ugarskoj mu se, naprotiv, najviše opiralo; imanja su dobili osnivači manufaktura."}, {"tekst": "Imanja prodaje Pruskoj", "tacan": false, "zasto": "Pruska je bila takmac Austrije; imanja su ostala u carstvu i dobili su ih osnivači manufaktura."}], "pomoc": ["Šta bi prosvećeni vladar uradio sa zemljom da ojača privredu?", "Manufakture su radionice — preteče fabrika.", "Iz lekcije: imanja manastira besplatno je delio osnivačima manufaktura."], "objasnjenje": "Josif II je oduzeo imanja stotinama manastira i besplatno ih dao osnivačima manufaktura — slabio je crkvu i jačao privredu.", "iz_udzbenika": {"strana": 37, "odeljak": "Habzburška monarhija — Josif II", "tekst": "Josif II je raspustio stotine rimokatoličkih manastira, a njihova imanja besplatno delio osnivačima manufaktura."}, "osa": {"naziv": "Josif II", "od": 1780, "do": 1790, "traka": "vladari"}}, {"id": "hab-lanac-jezik", "vrsta": "lanac", "tezina": "lako", "pojmovi": ["josif-ii", "austrija", "ceska", "ugarska"], "karike": ["Carstvo čine različite zemlje — Austrija, Češka, Ugarska", "Josif II želi da čvršće poveže svoje posede", "?"], "praznina": 2, "odgovori": [{"tekst": "Uvodi nemački kao zvanični jezik celog carstva", "tacan": true}, {"tekst": "Svakoj zemlji daje potpunu samostalnost", "tacan": false, "zasto": "To bi posede razdvojilo, a ne povezalo."}, {"tekst": "Uvodi francuski, jezik prosvetitelja", "tacan": false, "zasto": "Prosvetitelji jesu pisali na francuskom, ali Josif je uveo nemački."}], "pomoc": ["Šta može da poveže ljude različitih zemalja u jednoj državi?", "Iz lekcije: da bi čvršće povezao posede, uveo je nemački kao zvanični jezik."], "objasnjenje": "Jedan zvanični jezik — nemački — trebalo je da poveže raznorodne habzburške zemlje.", "iz_udzbenika": {"strana": 37, "odeljak": "Habzburška monarhija — Josif II", "tekst": "Da bi čvršće povezao posede, Josif II je uveo nemački kao zvanični jezik celog carstva."}, "osa": {"naziv": "Josif II", "od": 1780, "do": 1790, "traka": "vladari"}}, {"id": "hab-lanac-otpor", "vrsta": "lanac", "tezina": "lako", "pojmovi": ["josif-ii", "kmetstvo", "ugarska"], "karike": ["Josif II pokušava da ukine kmetstvo, uvodi nemački i vlada apsolutistički", "Plemstvo, naročito u Ugarskoj, pruža veliki otpor", "?"], "praznina": 2, "odgovori": [{"tekst": "Na samrti povlači većinu svojih zakona", "tacan": true}, {"tekst": "Ukida plemstvo u celom carstvu", "tacan": false, "zasto": "Plemstvo je bilo dovoljno jako da ga natera na povlačenje, a ne obrnuto."}, {"tekst": "Proglašava Ugarsku republikom", "tacan": false, "zasto": "Lekcija ne govori ni o čemu takvom; Josif je morao da odustane od zakona."}], "pomoc": ["Ko je bio jači na kraju — car ili plemstvo?", "Iz lekcije: na samrti je morao da povuče većinu zakona."], "objasnjenje": "Otpor plemstva bio je toliki da je Josif II na samrti povukao većinu svojih zakona.", "iz_udzbenika": {"strana": 37, "odeljak": "Habzburška monarhija — Josif II", "tekst": "Zbog velikog otpora, posebno plemstva u Ugarskoj, Josif II je na samrti povukao većinu zakona."}, "osa": {"naziv": "Josif II", "od": 1780, "do": 1790, "traka": "vladari"}}, {"id": "hab-zakljuci-povlacenje", "vrsta": "zakljuci", "tezina": "tesko", "pojmovi": ["josif-ii", "kmetstvo", "reforma", "ugarska"], "pitanje": "Zašto je Josif II na samrti morao da povuče većinu svojih zakona?", "odgovori": [{"tekst": "Njegove reforme su naišle na veliki otpor, posebno ugarskog plemstva", "tacan": true}, {"tekst": "Izgubio je rat sa Rusijom", "tacan": false, "zasto": "Lekcija ne govori o takvom ratu; razlog je bio otpor unutar carstva."}, {"tekst": "Narod je tražio republiku", "tacan": false, "zasto": "Ideju republike zastupao je Ruso u Francuskoj; Josifu su se suprotstavili plemići."}, {"tekst": "Zakoni su bili previše blagi prema plemstvu", "tacan": false, "zasto": "Bilo je obrnuto — ukidanje kmetstva i nemački jezik ugrožavali su moć i običaje plemstva."}], "pomoc": ["Korak 1: Koje su njegove mere oduzimale nešto plemićima? (kmetovi)", "Korak 2: Zašto bi Ugri bili protiv nemačkog kao zvaničnog jezika?", "Korak 3: Ko je bio dovoljno moćan da zaustavi cara? Iz lekcije: otpor je bio najjači kod plemstva u Ugarskoj."], "objasnjenje": "Ukidanje kmetstva, nemački kao zvanični jezik i apsolutističko vladanje izazvali su veliki otpor, naročito ugarskog plemstva — zato je na samrti povukao većinu zakona.", "iz_udzbenika": {"strana": 37, "odeljak": "Habzburška monarhija — Josif II", "tekst": "Pokušaji da ukine kmetstvo, uvede nemački i vlada apsolutistički izazvali su otpor, posebno ugarskog plemstva."}, "osa": {"naziv": "Josif II", "od": 1780, "do": 1790, "traka": "vladari"}}, {"id": "hab-ko-sam-josif", "vrsta": "ko_sam", "tezina": "srednje", "pojmovi": ["josif-ii", "patent-o-verskoj-toleranciji", "kmetstvo"], "tragovi": ["Tajno sam putovao svojim carstvom da proverim kako se sprovode moje mere.", "Raspustio sam stotine rimokatoličkih manastira, a njihova imanja dao osnivačima manufaktura.", "Uveo sam nemački kao zvanični jezik celog carstva i pokušao da ukinem kmetstvo.", "Godine 1781. doneo sam Patent o verskoj toleranciji."], "odgovori": [{"tekst": "Josif II", "tacan": true}, {"tekst": "Fridrih II Veliki", "tacan": false, "zasto": "Fridrih je bio pruski kralj; reforme su mu bile usmerene pre svega na vojsku."}, {"tekst": "Petar I Veliki", "tacan": false, "zasto": "Petar je bio ruski car (1682–1725) — osnovao je Sankt Peterburg, a nije bio habzburški vladar."}, {"tekst": "Karlo VI", "tacan": false, "zasto": "Karlo VI je otac Marije Terezije; reforme su sprovodili njegova ćerka i unuk."}], "objasnjenje": "To je Josif II (1780–1790), sin Marije Terezije, vladar prosvećenog apsolutizma u Habzburškoj monarhiji.", "iz_udzbenika": {"strana": 37, "odeljak": "Znatiželja — Prerušeni car u inspekciji", "tekst": "Josif II je prerušen kao „grof Hohberški, pratilac cara” stigao u Lavov; sobarici je rekao da cara „ponekad obrije”.", "slika": "04-doba-prosvetiteljstva/08-josif-ii.jpg"}}, {"id": "hab-izvor-lavov", "vrsta": "izvor", "tezina": "lako", "pojmovi": ["josif-ii", "lavov"], "izvor": {"autor": "Znatiželja iz udžbenika", "naslov": "Prerušeni car u inspekciji (prepričana priča)", "tekst": "Car Josif II stigao je u Lavov i u hotelsku knjigu upisao se kao grof Hohberški, pratilac cara Josifa. Dok se brijao, sobarica ga je pitala kakvu službu ima kod cara. Odgovorio je: „Ponekad ga obrijem.”", "napomena": "Odlomak je prepričan; udžbenik, str. 37."}, "pitanje": "Zašto je car putovao pod lažnim imenom?", "odgovori": [{"tekst": "Tajno je proveravao kako se sprovode njegove mere", "tacan": true}, {"tekst": "Bežao je od ugarskog plemstva", "tacan": false, "zasto": "Plemstvo mu se opiralo, ali lekcija kaže da je putovao da proveri sprovođenje mera."}, {"tekst": "Bio je proteran iz Beča kao Volter iz Pariza", "tacan": false, "zasto": "Proteran je bio Volter; Josif je bio car i putovao je svojevoljno."}, {"tekst": "Hteo je da postane brica", "tacan": false, "zasto": "To je šala iz priče — brijao je samog sebe."}], "pomoc": ["Ako službenici znaju da car dolazi, šta će uraditi?", "Iz lekcije: često je tajno putovao carstvom da proveri kako se sprovode njegove mere."], "objasnjenje": "Kao nepoznat putnik car je mogao da vidi pravo stanje — kako se njegove reforme zaista sprovode.", "iz_udzbenika": {"strana": 37, "odeljak": "Znatiželja — Prerušeni car u inspekciji", "tekst": "Josif II je često tajno putovao carstvom da proveri kako se sprovode njegove mere.", "slika": "04-doba-prosvetiteljstva/08-josif-ii.jpg"}, "osa": {"naziv": "Josif II", "od": 1780, "do": 1790, "traka": "vladari"}}, {"id": "hab-zakljuci-sala", "vrsta": "zakljuci", "tezina": "srednje", "pojmovi": ["josif-ii", "lavov"], "pitanje": "U priči o Lavovu car kaže sobarici da cara „ponekad obrije”. U čemu je šala?", "odgovori": [{"tekst": "Car je brijao sam sebe, pa je rekao istinu koju sobarica nije razumela", "tacan": true}, {"tekst": "Car je zaista radio kao brica na dvoru", "tacan": false, "zasto": "On je bio car; „pratilac” je bila samo izmišljena uloga."}, {"tekst": "Sobarica je znala da je to car i šalila se s njim", "tacan": false, "zasto": "Upisao se pod lažnim imenom — sobarica nije znala ko je."}, {"tekst": "Grof Hohberški je bio carev brica", "tacan": false, "zasto": "Grof Hohberški je izmišljeno ime pod kojim se car upisao."}], "pomoc": ["Korak 1: Ko je zapravo bio „grof Hohberški”?", "Korak 2: Koga je onda brijao kada se brijao?", "Iz lekcije: car se upisao kao pratilac cara; dok se brijao, rekao je da cara ponekad obrije."], "objasnjenje": "Pošto je „pratilac” zapravo sam car, rekao je istinu — on sam sebe brije. Sobarica, koja ne zna ko je, to ne može da shvati.", "iz_udzbenika": {"strana": 37, "odeljak": "Znatiželja — Prerušeni car u inspekciji", "tekst": "Sobarici koja ga je, dok se brijao, pitala za službu kod cara, Josif II je odgovorio da ga ponekad obrije."}}, {"id": "hab-povezi-mere", "vrsta": "povezi", "tezina": "srednje", "pojmovi": ["marija-terezija", "josif-ii", "reforma", "patent-o-verskoj-toleranciji"], "pitanje": "Poveži meru sa njenim ciljem ili posledicom.", "parovi": [["nemački kao zvanični jezik", "čvršće povezani habzburški posedi"], ["revnosno prikupljanje poreza", "redovno punjenje državne kase"], ["Patent o verskoj toleranciji", "sloboda vere i državna služba za protestante i pravoslavne"], ["raspuštanje manastira", "imanja za osnivače manufaktura"]], "pomoc": ["Za svaku meru pitaj: šta se njome dobija?", "Jezik povezuje, porezi pune kasu.", "Iz lekcije: nemački — povezivanje poseda; porezi — kasa; Patent — sloboda vere; manastiri — manufakture."], "objasnjenje": "Svaka reforma ima cilj: jezik povezuje carstvo, porezi pune kasu, Patent donosi slobodu vere, a manastirska imanja dobijaju manufakture.", "iz_udzbenika": {"strana": 37, "odeljak": "Habzburška monarhija", "tekst": "Lekcija navodi reforme Marije Terezije i Josifa II i njihove ciljeve."}}, {"id": "hab-dopuni-josif", "vrsta": "dopuni", "tezina": "tesko", "pojmovi": ["josif-ii", "manufaktura"], "pitanje": "Dopuni rečenicu (bez ponuđenih reči).", "tekst": "Josif II je imanja raspuštenih manastira besplatno delio osnivačima {{manufaktura}}, a da bi čvršće povezao posede uveo je {{nemački|nemački jezik}} kao zvanični jezik.", "pomoc": ["Manastirska imanja su otišla onima koji osnivaju radionice.", "Zvanični jezik je jezik Beča.", "Iz lekcije: imanja osnivačima manufaktura; nemački kao zvanični jezik."], "objasnjenje": "Imanja manastira dobili su osnivači manufaktura, a zvanični jezik postao je nemački.", "iz_udzbenika": {"strana": 37, "odeljak": "Habzburška monarhija — Josif II", "tekst": "Josif II je imanja manastira delio osnivačima manufaktura i uveo nemački kao zvanični jezik."}, "osa": {"naziv": "Josif II", "od": 1780, "do": 1790, "traka": "vladari"}}, {"id": "hab-uporedi-mt-josif", "vrsta": "uporedi", "tezina": "srednje", "pojmovi": ["marija-terezija", "josif-ii", "reforma"], "a": "Marija Terezija", "b": "Josif II", "pitanje": "Na koga se odnosi tvrdnja — Mariju Tereziju, Josifa II, oboje ili nikoga?", "tvrdnje": [{"tekst": "Rimokatoličku crkvu stavio/la je pod nadzor države.", "odgovor": "a", "zasto": "To je mera Marije Terezije."}, {"tekst": "Raspustio/la je stotine manastira.", "odgovor": "b", "zasto": "Manastire je raspustio Josif II."}, {"tekst": "Doneo/la je Patent o verskoj toleranciji.", "odgovor": "b", "zasto": "Josif II, 1781."}, {"tekst": "Sprovodio/la je reforme u duhu prosvećenog apsolutizma.", "odgovor": "oba", "zasto": "Oboje su reformatori prosvećenog apsolutizma; Josif je nastavio majčine reforme."}, {"tekst": "Strogo je ograničio/la obaveze seljaka prema plemstvu.", "odgovor": "a", "zasto": "To je reforma Marije Terezije; Josif je otišao dalje i pokušao da ukine kmetstvo."}, {"tekst": "Udvostručio/la je teritoriju države.", "odgovor": "nijedan", "zasto": "To je uradio Fridrih II u Pruskoj."}], "pomoc": ["Majka: seljaci, porezi, vojska, škole, zdravstvo, crkva pod nadzorom.", "Sin: Patent, manastiri, nemački, pokušaj ukidanja kmetstva.", "Iz lekcije: Josif II je nastavio reforme majke u duhu prosvećenog apsolutizma."], "objasnjenje": "Marija Terezija je započela reforme, a Josif II ih je nastavio i zaoštrio (Patent, manastiri, nemački, kmetstvo).", "iz_udzbenika": {"strana": 37, "odeljak": "Habzburška monarhija", "tekst": "Josif II, sin i naslednik Marije Terezije, nastavio je reforme u duhu prosvećenog apsolutizma."}}, {"id": "hab-poredjaj-habzburzi", "vrsta": "poredjaj", "tezina": "lako", "pojmovi": ["marija-terezija", "josif-ii", "patent-o-verskoj-toleranciji"], "pitanje": "Poređaj događaje iz Habzburške monarhije hronološki.", "stavke": [{"tekst": "Marija Terezija stupa na presto", "godina": 1740, "do": 1780, "naziv": "Vladavina Marije Terezije", "traka": "vladari"}, {"tekst": "Josif II nasleđuje majku", "godina": 1780, "do": 1790, "naziv": "Josif II", "traka": "vladari"}, {"tekst": "Donet je Patent o verskoj toleranciji", "godina": 1781, "naziv": "Patent o verskoj toleranciji", "traka": "dogadjaji"}], "pomoc": ["Prvo majka, pa sin.", "Patent je doneo sin kad je već bio car.", "Iz lekcije: 1740 Marija Terezija, 1780 Josif II, 1781 Patent."], "objasnjenje": "Marija Terezija (1740) → Josif II (1780) → Patent o verskoj toleranciji (1781).", "iz_udzbenika": {"strana": 37, "odeljak": "Habzburška monarhija", "tekst": "Marija Terezija (1740–1780), Josif II (1780–1790), Patent o verskoj toleranciji (1781)."}}, {"id": "hab-objasni-mt-presto", "vrsta": "objasni", "tezina": "lako", "pojmovi": ["marija-terezija", "karlo-vi"], "pitanje": "Kako je Marija Terezija postala prva žena na habzburškom prestolu? Objasni svojim rečima.", "uzor": "Njen otac, car Karlo VI, nije imao muške dece. Zato je doneo akt po kome i ženski potomci mogu da naslede presto. Tako je Marija Terezija 1740. postala vladarka.", "ideje": ["Karlo VI nije imao sinove.", "Doneo je akt o nasleđivanju po ženskoj liniji.", "Marija Terezija je nasledila presto 1740."], "objasnjenje": "Promena pravila nasleđivanja omogućila je ćerki da nasledi oca.", "iz_udzbenika": {"strana": 37, "odeljak": "Habzburška monarhija — potpis uz sliku", "tekst": "Karlo VI, bez muške dece, doneo je akt kojim i ženski potomci mogu da nasleđuju presto.", "slika": "04-doba-prosvetiteljstva/07-marija-terezija-sa-porodicom.jpg"}, "osa": {"naziv": "Vladavina Marije Terezije", "od": 1740, "do": 1780, "traka": "vladari"}}, {"id": "hab-objasni-josif", "vrsta": "objasni", "tezina": "tesko", "pojmovi": ["josif-ii", "prosveceni-apsolutizam", "patent-o-verskoj-toleranciji", "kmetstvo"], "pitanje": "Josif II je bio vladar prosvećenog apsolutizma. Šta je u njegovim merama bilo „prosvećeno”, a šta „apsolutističko”?", "uzor": "Prosvećene su bile mere po idejama prosvetitelja — Patent o verskoj toleranciji (sloboda vere, protiv netrpeljivosti), pokušaj ukidanja kmetstva i jačanje privrede manufakturama. Apsolutističko je bilo to što je sve odlučivao sam i nametao ih bez pristanka plemstva, na primer nemački kao zvanični jezik. Zbog toga je naišao na otpor i na samrti povukao većinu zakona.", "ideje": ["Prosvećeno: Patent o verskoj toleranciji.", "Prosvećeno: pokušaj ukidanja kmetstva.", "Apsolutističko: odlučivao je sam i nametao mere (npr. nemački jezik).", "Posledica: otpor plemstva i povlačenje zakona."], "objasnjenje": "Kod Josifa II se vidi i dobra i slaba strana prosvećenog apsolutizma: napredne ideje, nametnute odozgo.", "iz_udzbenika": {"strana": 37, "odeljak": "Habzburška monarhija — Josif II", "tekst": "Josif II je reforme sprovodio u duhu prosvećenog apsolutizma, ali je apsolutističko vladanje izazvalo veliki otpor.", "slika": "04-doba-prosvetiteljstva/08-josif-ii.jpg"}, "osa": {"naziv": "Josif II", "od": 1780, "do": 1790, "traka": "vladari"}}]}, {"naslov": "Pruska", "zadaci": [{"id": "pru-izbor-dinastija", "vrsta": "izbor", "tezina": "lako", "pojmovi": ["fridrih-ii-veliki", "hoencolerni", "pruska"], "pitanje": "Iz koje dinastije je bio pruski kralj Fridrih II Veliki?", "odgovori": [{"tekst": "Hoencolern", "tacan": true}, {"tekst": "Habzburg", "tacan": false, "zasto": "Habzburzi su vladali Austrijom, Češkom i Ugarskom — glavnim takmacem Pruske."}, {"tekst": "Romanov", "tacan": false, "zasto": "Romanovi su ruska dinastija (Petar I)."}, {"tekst": "Burbon", "tacan": false, "zasto": "Ta dinastija se u lekciji ne pominje; Fridrih je Hoencolern."}], "pomoc": ["Ime dinastije počinje na H, ali to nisu Habzburzi.", "Iz lekcije: Fridrih II Veliki iz dinastije Hoencolern."], "objasnjenje": "Fridrih II Veliki (1740–1786) bio je iz dinastije Hoencolern.", "iz_udzbenika": {"strana": 38, "odeljak": "Pruska", "tekst": "Pruska je za vladavine Fridriha II Velikog iz dinastije Hoencolern postala glavni takmac Austrije.", "slika": "04-doba-prosvetiteljstva/06-fridrih-ii-veliki.jpg"}}, {"id": "pru-izbor-unapredio", "vrsta": "izbor", "tezina": "srednje", "pojmovi": ["fridrih-ii-veliki", "manufaktura"], "pitanje": "Šta je unapredio Fridrih II u Pruskoj? (više tačnih)", "odgovori": [{"tekst": "Manufakturnu proizvodnju", "tacan": true}, {"tekst": "Trgovinu", "tacan": true}, {"tekst": "Poljoprivredu", "tacan": true}, {"tekst": "Školstvo", "tacan": true}, {"tekst": "Vakcinaciju protiv velikih boginja", "tacan": false, "zasto": "Vakcinaciju je u Rusiji uvela Katarina II."}, {"tekst": "Slobodu vere za pravoslavne", "tacan": false, "zasto": "Tu slobodu je Patentom (1781) doneo Josif II u Habzburškoj monarhiji."}], "pomoc": ["Četiri oblasti privrede i obrazovanja.", "Dve mere pripadaju drugim vladarima.", "Iz lekcije: manufakturna proizvodnja, trgovina, poljoprivreda i školstvo."], "objasnjenje": "Fridrih II je unapredio manufakture, trgovinu, poljoprivredu i školstvo — ali je sve to pre svega služilo jačanju vojske.", "iz_udzbenika": {"strana": 38, "odeljak": "Pruska", "tekst": "Fridrih II je unapredio manufakturnu proizvodnju, trgovinu, poljoprivredu i školstvo."}}, {"id": "pru-tn-teritorija", "vrsta": "tacno_netacno", "tezina": "lako", "pojmovi": ["fridrih-ii-veliki", "pruska"], "tvrdnja": "Fridrih II Veliki je udvostručio teritoriju Pruske.", "tacno": true, "pomoc": ["Pruska je pod njim postala takmac Austrije — je li porasla ili se smanjila?", "Iz lekcije: Fridrih je udvostručio teritoriju države."], "objasnjenje": "Tačno — oslanjajući se na činovnike i vojsku, Fridrih II je udvostručio teritoriju Pruske.", "iz_udzbenika": {"strana": 38, "odeljak": "Pruska", "tekst": "Fridrih II se oslanjao na činovnike i dobro uređenu vojsku i udvostručio je teritoriju države."}, "osa": {"naziv": "Fridrih II Veliki", "od": 1740, "do": 1786, "traka": "vladari"}}, {"id": "pru-tn-reforme", "vrsta": "tacno_netacno", "tezina": "srednje", "pojmovi": ["fridrih-ii-veliki", "pruska"], "tvrdnja": "Reforme Fridriha II bile su pre svega usmerene na smanjenje vojske, da bi novac otišao u škole.", "tacno": false, "ispravke": [{"tekst": "Sve reforme bile su pre svega usmerene na jačanje vojske, iako je unapredio i školstvo.", "tacan": true}, {"tekst": "Reforme su bile usmerene na jačanje moći crkve.", "tacan": false, "zasto": "O crkvi kod Fridriha lekcija ne govori; cilj je bila vojska."}, {"tekst": "Fridrih nije sprovodio nikakve reforme.", "tacan": false, "zasto": "Unapredio je manufakture, trgovinu, poljoprivredu i školstvo."}], "pomoc": ["Seti se izreke o vojsci koja je zaposela državu.", "Iz lekcije: sve reforme bile su pre svega usmerene na jačanje pruske vojske."], "objasnjenje": "Školstvo i privreda su napredovali, ali glavni cilj svih Fridrihovih reformi bila je jača vojska.", "iz_udzbenika": {"strana": 38, "odeljak": "Pruska", "tekst": "Sve reforme Fridriha II bile su pre svega usmerene na jačanje pruske vojske."}}, {"id": "pru-datum-fridrih", "vrsta": "datum", "tezina": "tesko", "pojmovi": ["fridrih-ii-veliki", "pruska"], "dogadjaj": "Fridrih II Veliki", "pitanje": "Od koje do koje godine je vladao Fridrih II Veliki?", "od": 1740, "do": 1786, "traka": "vladari", "pomoc": ["Počeo je iste godine kao Marija Terezija.", "Nadživeo je Mariju Tereziju i vladao još nekoliko godina uz Josifa II.", "Iz lekcije: Fridrih II Veliki (1740–1786)."], "objasnjenje": "Fridrih II je vladao 1740–1786 — počeo je zajedno sa Marijom Terezijom, a umro za vreme Josifa II.", "iz_udzbenika": {"strana": 38, "odeljak": "Pruska", "tekst": "Fridrih II Veliki vladao je Pruskom od 1740. do 1786.", "slika": "04-doba-prosvetiteljstva/06-fridrih-ii-veliki.jpg"}}, {"id": "pru-lanac-takmac", "vrsta": "lanac", "tezina": "srednje", "pojmovi": ["fridrih-ii-veliki", "pruska", "austrija"], "karike": ["Fridrih II se oslanja na činovnike i dobro uređenu vojsku", "Udvostručuje teritoriju države", "?"], "praznina": 2, "odgovori": [{"tekst": "Pruska postaje glavni takmac Austrije u Svetom rimskom carstvu", "tacan": true}, {"tekst": "Pruska postaje republika", "tacan": false, "zasto": "Pruska je ostala kraljevina; republike su bile samo male države."}, {"tekst": "Pruska dobija izlaz na Crno more", "tacan": false, "zasto": "Crno more je dobila Rusija za Katarine II."}], "pomoc": ["Ko je u nemačkim zemljama do tada bio najjači?", "Veća i jača Pruska ugrožava njegov primat.", "Iz lekcije: Pruska je postala glavni takmac Austrije."], "objasnjenje": "Jaka vojska i činovništvo udvostručili su Prusku i učinili je glavnim takmacem Austrije.", "iz_udzbenika": {"strana": 38, "odeljak": "Pruska", "tekst": "Uz pomoć činovnika i vojske Fridrih je udvostručio teritoriju i Pruska je postala takmac Austrije."}, "osa": {"naziv": "Fridrih II Veliki", "od": 1740, "do": 1786, "traka": "vladari"}}, {"id": "pru-dopuni-fridrih", "vrsta": "dopuni", "tezina": "srednje", "pojmovi": ["fridrih-ii-veliki", "pruska"], "pitanje": "Dopuni rečenicu o Fridrihu II.", "tekst": "Fridrih II se oslanjao na {{činovnike}} i dobro uređenu {{vojsku}}, a unapredio je manufakture, trgovinu, poljoprivredu i {{školstvo}}.", "ponudjene": ["činovnike", "plemiće", "vojsku", "crkvu", "školstvo", "mornaricu"], "pomoc": ["Ratnu mornaricu je gradio Petar I u Rusiji.", "Oslonac države: ljudi koji je vode i ljudi koji je brane.", "Iz lekcije: činovnici i dobro uređena vojska; unapređeno i školstvo."], "objasnjenje": "Fridrih II je vladao uz pomoć činovnika i vojske, a unapredio je i privredu i školstvo.", "iz_udzbenika": {"strana": 38, "odeljak": "Pruska", "tekst": "Fridrih se oslanjao na činovnike i dobro uređenu vojsku i unapredio je privredu i školstvo."}}, {"id": "pru-povezi-dinastije", "vrsta": "povezi", "tezina": "lako", "pojmovi": ["hoencolerni", "habzburzi", "romanovi"], "pitanje": "Poveži dinastiju sa zemljom kojom je vladala.", "parovi": [["Hoencolerni", "Pruska"], ["Habzburzi", "Austrija, Češka i Ugarska"], ["Romanovi", "Rusija"]], "pomoc": ["Fridrih II je Hoencolern.", "Petar I je Romanov.", "Iz lekcije: Hoencolerni — Pruska, Habzburzi — Habzburška monarhija, Romanovi — Rusija."], "objasnjenje": "Hoencolerni su vladali Pruskom, Habzburzi Austrijom, Češkom i Ugarskom, a Romanovi Rusijom.", "iz_udzbenika": {"strana": 38, "odeljak": "Habzburška monarhija; Pruska; Rusija", "tekst": "Lekcija navodi tri dinastije: Habzburge, Hoencolerne i Romanove."}}, {"id": "pru-izvor-oficir", "vrsta": "izvor", "tezina": "lako", "pojmovi": ["pruska", "fridrih-ii-veliki"], "izvor": {"autor": "Savremenik (potpis uz sliku)", "naslov": "O pruskoj vojsci (sažetak)", "tekst": "Pruska nije država koja ima vojsku, nego vojska koja je zaposela državu.", "napomena": "Odlomak je prepričan; udžbenik, str. 38."}, "pitanje": "Šta je, prema ovom zapisu, bilo najvažnije u Pruskoj?", "odgovori": [{"tekst": "Vojska", "tacan": true}, {"tekst": "Crkva", "tacan": false, "zasto": "Zapis govori samo o vojsci i državi."}, {"tekst": "Trgovina", "tacan": false, "zasto": "Fridrih je unapredio i trgovinu, ali po zapisu vojska je iznad svega."}, {"tekst": "Narod koji bira vlast", "tacan": false, "zasto": "Pruska je bila apsolutistička kraljevina, a ne republika."}], "pomoc": ["Ko je, po zapisu, „zaposeo” državu?", "Iz lekcije: sve reforme Fridriha II bile su usmerene na jačanje vojske."], "objasnjenje": "Zapis kaže da je u Pruskoj vojska bila toliko važna da se činilo da ona vlada državom.", "iz_udzbenika": {"strana": 38, "odeljak": "Pruska — oficir u pruskoj vojsci", "tekst": "Uz sliku pruskog oficira udžbenik navodi reči savremenika o vojsci koja je zaposela državu.", "slika": "04-doba-prosvetiteljstva/09-pruski-oficir.jpg"}, "osa": {"naziv": "Fridrih II Veliki", "od": 1740, "do": 1786, "traka": "vladari"}}, {"id": "pru-ko-sam-fridrih", "vrsta": "ko_sam", "tezina": "srednje", "pojmovi": ["fridrih-ii-veliki", "volter", "hoencolerni"], "tragovi": ["Volter je nekoliko godina živeo na mom dvoru, pa smo se razišli.", "Oslanjao sam se na činovnike i vojsku i udvostručio teritoriju svoje države.", "Bio sam kralj iz dinastije Hoencolern, od 1740. do 1786."], "odgovori": [{"tekst": "Fridrih II Veliki", "tacan": true}, {"tekst": "Josif II", "tacan": false, "zasto": "Josif II je bio Habzburg; Volter nije boravio na njegovom dvoru."}, {"tekst": "Petar I Veliki", "tacan": false, "zasto": "Petar je ruski car iz dinastije Romanov, umro 1725."}, {"tekst": "Karlo VI", "tacan": false, "zasto": "Karlo VI je habzburški car, otac Marije Terezije."}], "objasnjenje": "To je Fridrih II Veliki, pruski kralj (1740–1786), prosvećeni apsolutista i Volterov prijatelj.", "iz_udzbenika": {"strana": 38, "odeljak": "Pruska", "tekst": "Fridrih II Veliki iz dinastije Hoencolern vladao je Pruskom 1740–1786.", "slika": "04-doba-prosvetiteljstva/06-fridrih-ii-veliki.jpg"}}, {"id": "pru-zakljuci-prosvecenost", "vrsta": "zakljuci", "tezina": "tesko", "pojmovi": ["fridrih-ii-veliki", "prosveceni-apsolutizam", "volter"], "pitanje": "Fridrih II je bio Volterov prijatelj i prosvećeni vladar, a ipak su sve njegove reforme služile jačanju vojske. Šta to pokazuje o prosvećenom apsolutizmu?", "odgovori": [{"tekst": "Vladari su prihvatali ideje prosvetitelja, ali im je glavni cilj bila jača država i vojska", "tacan": true}, {"tekst": "Fridrih je potpuno odbacio prosvetiteljstvo", "tacan": false, "zasto": "Unapredio je školstvo i družio se s Volterom — ideje nije odbacio."}, {"tekst": "Prosvetitelji su tražili da vojska vlada državom", "tacan": false, "zasto": "Prosvetitelji su tražili razum, znanje i pravednije zakone, a ne vlast vojske."}, {"tekst": "Pruska je bila republika pa je vojska birala vlast", "tacan": false, "zasto": "Pruska je bila apsolutistička kraljevina."}], "pomoc": ["Korak 1: Šta je prosvećeni apsolutizam jačao — upravu, vojsku, privredu?", "Korak 2: Šta je kod Fridriha bilo najvažnije?", "Iz lekcije: prosvećeni apsolutizam jača upravu, vojsku i privredu; Fridrihove reforme služe pre svega vojsci."], "objasnjenje": "Prosvećeni vladari koristili su ideje prosvetitelja tamo gde jačaju državu; kod Fridriha je to pre svega bila vojska.", "iz_udzbenika": {"strana": 38, "odeljak": "Pruska", "tekst": "Sve reforme Fridriha II bile su usmerene na jačanje vojske."}, "osa": {"naziv": "Fridrih II Veliki", "od": 1740, "do": 1786, "traka": "vladari"}}, {"id": "pru-uporedi-fridrih-josif", "vrsta": "uporedi", "tezina": "tesko", "pojmovi": ["fridrih-ii-veliki", "josif-ii", "hoencolerni"], "a": "Fridrih II Veliki", "b": "Josif II", "pitanje": "Na koga se odnosi tvrdnja — Fridriha II, Josifa II, obojicu ili nijednog?", "tvrdnje": [{"tekst": "Vladao je i 1785. godine.", "odgovor": "oba", "zasto": "Fridrih je vladao 1740–1786, a Josif 1780–1790 — 1785. obojica su na prestolu."}, {"tekst": "Bio je kralj iz dinastije Hoencolern.", "odgovor": "a", "zasto": "Fridrih II je Hoencolern; Josif II je Habzburg."}, {"tekst": "Na samrti je povukao većinu svojih zakona.", "odgovor": "b", "zasto": "Josif II, zbog otpora plemstva."}, {"tekst": "Udvostručio je teritoriju države.", "odgovor": "a", "zasto": "Fridrih II je udvostručio Prusku."}, {"tekst": "Na karti Evrope oko 1780. označen je krunom.", "odgovor": "oba", "zasto": "Krunom su označeni Fridrih II, Josif II i Katarina II."}, {"tekst": "Dobio je izlaz na Baltičko more.", "odgovor": "nijedan", "zasto": "Izlaz na Baltik dobila je Rusija pod Petrom I."}], "pomoc": ["Uporedi godine vladavine: 1740–1786 i 1780–1790.", "Jedan je Hoencolern, drugi Habzburg.", "Iz lekcije: oba su vladari prosvećenog apsolutizma sa karte 1780."], "objasnjenje": "Fridrih II i Josif II su savremenici i takmaci (Pruska i Austrija); obojica prosvećeni apsolutisti, ali sa različitim ciljevima i ishodima.", "iz_udzbenika": {"strana": 38, "odeljak": "Pruska; Habzburška monarhija", "tekst": "Fridrih II (1740–1786) i Josif II (1780–1790) bili su vladari prosvećenog apsolutizma.", "slika": "04-doba-prosvetiteljstva/01-karta-evrope-1780.jpg"}}, {"id": "pru-poredjaj-fridrih", "vrsta": "poredjaj", "tezina": "tesko", "pojmovi": ["fridrih-ii-veliki", "enciklopedija", "katarina-ii-velika", "josif-ii", "patent-o-verskoj-toleranciji"], "pitanje": "Poređaj događaje koji su se desili za vreme vladavine Fridriha II, od najranijeg.", "stavke": [{"tekst": "Fridrih II postaje pruski kralj", "godina": 1740, "do": 1786, "naziv": "Fridrih II Veliki", "traka": "vladari"}, {"tekst": "Počinje da izlazi Enciklopedija", "godina": 1751, "do": 1772, "naziv": "Enciklopedija", "traka": "ideje"}, {"tekst": "Katarina II postaje ruska carica", "godina": 1762, "do": 1796, "naziv": "Katarina II Velika", "traka": "vladari"}, {"tekst": "Josif II nasleđuje majku", "godina": 1780, "do": 1790, "naziv": "Josif II", "traka": "vladari"}, {"tekst": "Donet je Patent o verskoj toleranciji", "godina": 1781, "naziv": "Patent o verskoj toleranciji", "traka": "dogadjaji"}], "pomoc": ["Prvo mora da počne Fridrihova vladavina.", "Enciklopedija počinje pre Katarinine vladavine.", "Iz lekcije: 1740, 1751, 1762, 1780, 1781."], "objasnjenje": "Fridrih II (1740) → Enciklopedija (1751) → Katarina II (1762) → Josif II (1780) → Patent (1781). Sve se dešava za Fridrihovog života.", "iz_udzbenika": {"strana": 38, "odeljak": "Pruska", "tekst": "Fridrih II je vladao skoro pola veka, 1740–1786."}}, {"id": "pru-objasni-vojska", "vrsta": "objasni", "tezina": "srednje", "pojmovi": ["pruska", "fridrih-ii-veliki"], "pitanje": "Jedan savremenik je zapisao da Pruska nije država koja ima vojsku, nego vojska koja je zaposela državu. Kako tumačiš te reči?", "uzor": "Fridrih II je sve reforme — u privredi, trgovini, školstvu — usmeravao pre svega na jačanje vojske. Vojska je bila najvažnija stvar u državi i oslonac kralju, pa je izgledalo kao da država postoji zbog vojske, a ne vojska zbog države.", "ideje": ["Reforme Fridriha II bile su usmerene na jačanje vojske.", "Vojska je bila najvažnija u državi.", "Obrnut je uobičajen odnos — država služi vojsci."], "objasnjenje": "Izreka kaže da je u Pruskoj vojska bila iznad svega, jer su sve reforme služile njenom jačanju.", "iz_udzbenika": {"strana": 38, "odeljak": "Pruska — oficir u pruskoj vojsci", "tekst": "Uz sliku pruskog oficira udžbenik navodi reči savremenika o vojsci koja je zaposela državu i pita kako ih tumačiš.", "slika": "04-doba-prosvetiteljstva/09-pruski-oficir.jpg"}, "osa": {"naziv": "Fridrih II Veliki", "od": 1740, "do": 1786, "traka": "vladari"}}]}, {"naslov": "Rusija", "zadaci": [{"id": "rus-izbor-romanovi", "vrsta": "izbor", "tezina": "lako", "pojmovi": ["romanovi", "rusija", "petar-i-veliki"], "pitanje": "Koja dinastija je u XVII veku zavladala Rusijom?", "odgovori": [{"tekst": "Romanov", "tacan": true}, {"tekst": "Habzburg", "tacan": false, "zasto": "Habzburzi su vladali Austrijom, Češkom i Ugarskom."}, {"tekst": "Hoencolern", "tacan": false, "zasto": "Hoencolerni su vladali Pruskom."}, {"tekst": "Volter", "tacan": false, "zasto": "Volter je prosvetitelj, a ne dinastija."}], "pomoc": ["Petar I Veliki je njen najznačajniji predstavnik.", "Iz lekcije: u XVII veku Rusijom je zavladala dinastija Romanov."], "objasnjenje": "Romanovi su zavladali Rusijom u XVII veku; najznačajniji je bio Petar I Veliki.", "iz_udzbenika": {"strana": 38, "odeljak": "Rusija", "tekst": "U XVII veku Rusijom je zavladala dinastija Romanov, čiji je najznačajniji predstavnik bio Petar I Veliki.", "slika": "04-doba-prosvetiteljstva/10-petar-i-veliki.jpg"}}, {"id": "rus-tn-pre-petra", "vrsta": "tacno_netacno", "tezina": "srednje", "pojmovi": ["rusija", "petar-i-veliki"], "tvrdnja": "Pre Petra I Rusija je bila najmoćnija država Evrope.", "tacno": false, "ispravke": [{"tekst": "Bila je prostrano carstvo, ali često u senci moćnijih suseda.", "tacan": true}, {"tekst": "Bila je mala država bez velike teritorije.", "tacan": false, "zasto": "Rusija je bila prostrano carstvo; slabost nije bila u veličini."}, {"tekst": "Bila je deo Habzburške monarhije.", "tacan": false, "zasto": "Rusija je bila samostalno carstvo Romanovih."}], "pomoc": ["Šta je Petar morao da izgradi da bi Rusija postala jaka?", "Iz lekcije: do Petra Rusija je prostrano carstvo, često u senci moćnijih suseda."], "objasnjenje": "Rusija je bila velika, ali slaba — tek Petrove reforme, vojska i mornarica učinile su je moćnom.", "iz_udzbenika": {"strana": 38, "odeljak": "Rusija", "tekst": "Do Petra I Rusija je bila prostrano carstvo, često u senci moćnijih suseda."}}, {"id": "rus-izbor-petar-reforme", "vrsta": "izbor", "tezina": "srednje", "pojmovi": ["petar-i-veliki", "rusija"], "pitanje": "Šta je uradio Petar I Veliki? (više tačnih)", "odgovori": [{"tekst": "Osnovao je modernu stajaću vojsku", "tacan": true}, {"tekst": "Izgradio je ratnu mornaricu", "tacan": true}, {"tekst": "Silom je slomio otpor plemstva i crkve", "tacan": true}, {"tekst": "Uveo je vakcinaciju protiv velikih boginja", "tacan": false, "zasto": "Vakcinaciju je uvela Katarina II."}, {"tekst": "Učestvovao je u podeli Poljske", "tacan": false, "zasto": "Podela Poljske je delo Katarine II, sa vladarima Austrije i Pruske."}], "pomoc": ["Petar je vladao od 1682. do 1725 — pre Katarine.", "Vojska, mornarica i lomljenje otpora su njegovi.", "Iz lekcije: stajaća vojska, ratna mornarica, slomljen otpor plemstva i crkve, reforme uprave, privrede i obrazovanja."], "objasnjenje": "Petar I je stvorio stajaću vojsku i mornaricu, slomio otpor plemstva i crkve i reformisao upravu, privredu i obrazovanje.", "iz_udzbenika": {"strana": 38, "odeljak": "Rusija — Petar I Veliki", "tekst": "Petar I je osnovao stajaću vojsku, izgradio mornaricu i silom slomio otpor plemstva i crkve.", "slika": "04-doba-prosvetiteljstva/10-petar-i-veliki.jpg"}, "osa": {"naziv": "Petar I Veliki", "od": 1682, "do": 1725, "traka": "vladari"}}, {"id": "rus-datum-petar", "vrsta": "datum", "tezina": "tesko", "pojmovi": ["petar-i-veliki", "rusija"], "dogadjaj": "Petar I Veliki", "pitanje": "Od koje do koje godine je vladao Petar I Veliki?", "od": 1682, "do": 1725, "traka": "vladari", "pomoc": ["Počeo je da vlada još u XVII veku.", "Umro je u prvoj četvrtini XVIII veka.", "Iz lekcije: Petar I Veliki (1682–1725)."], "objasnjenje": "Petar I je vladao 1682–1725 — najranije od svih vladara u lekciji.", "iz_udzbenika": {"strana": 38, "odeljak": "Rusija — Petar I Veliki", "tekst": "Najznačajniji predstavnik Romanovih bio je car Petar I Veliki (1682–1725).", "slika": "04-doba-prosvetiteljstva/10-petar-i-veliki.jpg"}}, {"id": "rus-lanac-baltik", "vrsta": "lanac", "tezina": "srednje", "pojmovi": ["petar-i-veliki", "sankt-peterburg", "rusija", "svedska", "baltisko-more"], "karike": ["Petar I gradi stajaću vojsku i pobeđuje Švedsku", "?", "Na ušću Neve nastaje nova prestonica, Sankt Peterburg"], "praznina": 1, "odgovori": [{"tekst": "Rusija dobija izlaz na Baltičko more", "tacan": true}, {"tekst": "Rusija dobija izlaz na Crno more", "tacan": false, "zasto": "Crno more Rusija dobija kasnije, za Katarine II, ratujući protiv Osmanlija."}, {"tekst": "Rusija učestvuje u podeli Poljske", "tacan": false, "zasto": "Podela Poljske je delo Katarine II zajedno sa Austrijom i Pruskom, ne posledica rata sa Švedskom."}, {"tekst": "Plemstvo dobija pravo da bira cara", "tacan": false, "zasto": "Naprotiv — Petar je silom slomio otpor plemstva."}], "pomoc": ["Šta Rusija dobija kad pobedi Švedsku, svog suseda na severu?", "Neva se uliva u Baltičko more.", "Iz lekcije: pobedom nad Švedskom Rusija je dobila izlaz na Baltičko more."], "objasnjenje": "Pobeda nad Švedskom dala je Rusiji izlaz na Baltičko more; na njegovoj obali, na ušću Neve, Petar je podigao Sankt Peterburg.", "iz_udzbenika": {"strana": 38, "odeljak": "Rusija — Petar I Veliki", "tekst": "Pobedom nad Švedskom Rusija je dobila izlaz na Baltičko more, a Petar je na ušću Neve osnovao Sankt Peterburg."}, "osa": {"naziv": "Petar I Veliki", "od": 1682, "do": 1725, "traka": "vladari"}}, {"id": "rus-tn-peterburg", "vrsta": "tacno_netacno", "tezina": "lako", "pojmovi": ["sankt-peterburg", "neva", "baltisko-more"], "tvrdnja": "Sankt Peterburg je podignut na ušću reke Neve u Baltičko more.", "tacno": true, "pomoc": ["Prestonica je podignuta na moru koje je Rusija dobila od Švedske.", "Iz lekcije: Sankt Peterburg — na ušću Neve u Baltičko more."], "objasnjenje": "Tačno — Petar I je početkom XVIII veka podigao Sankt Peterburg na ušću Neve u Baltičko more.", "iz_udzbenika": {"strana": 38, "odeljak": "Rusija — Petar I Veliki", "tekst": "Početkom XVIII veka Petar I je na ušću Neve u Baltičko more osnovao novu prestonicu, Sankt Peterburg."}}, {"id": "rus-izbor-peterburg-vek", "vrsta": "izbor", "tezina": "lako", "pojmovi": ["sankt-peterburg", "petar-i-veliki"], "pitanje": "Kada je Petar I osnovao novu prestonicu, Sankt Peterburg?", "odgovori": [{"tekst": "Početkom XVIII veka", "tacan": true}, {"tekst": "U XV veku", "tacan": false, "zasto": "Petar je vladao 1682–1725; u XV veku Habzburzi tek postaju carevi Svetog rimskog carstva."}, {"tekst": "Krajem XVIII veka", "tacan": false, "zasto": "Petar je umro 1725; kraj veka je vreme Katarine II."}, {"tekst": "U XIX veku", "tacan": false, "zasto": "To je mnogo posle Petrove smrti (1725)."}], "pomoc": ["Petar je umro 1725.", "Iz lekcije: početkom XVIII veka osnovao je Sankt Peterburg."], "objasnjenje": "Sankt Peterburg je osnovan početkom XVIII veka, za vladavine Petra I (1682–1725).", "iz_udzbenika": {"strana": 38, "odeljak": "Rusija — Petar I Veliki", "tekst": "Početkom XVIII veka Pet
