ar I je osnovao novu prestonicu, Sankt Peterburg."}, "osa": {"naziv": "Petar I Veliki", "od": 1682, "do": 1725, "traka": "vladari"}}, {"id": "rus-zakljuci-peterburg", "vrsta": "zakljuci", "tezina": "srednje", "pojmovi": ["sankt-peterburg", "petar-i-veliki", "baltisko-more", "svedska"], "pitanje": "Zašto je Petar I novu prestonicu mogao da podigne baš na obali Baltičkog mora?", "odgovori": [{"tekst": "Zato što je pobedom nad Švedskom Rusija tek dobila izlaz na Baltičko more", "tacan": true}, {"tekst": "Zato što je Rusija tu imala luku još od XV veka", "tacan": false, "zasto": "Izlaz na Baltik Rusija je dobila tek Petrovom pobedom nad Švedskom."}, {"tekst": "Zato što mu je Fridrih II poklonio tu obalu", "tacan": false, "zasto": "Fridrih II je vladao kasnije (od 1740); obalu je Rusija osvojila od Švedske."}, {"tekst": "Zato što je Katarina II tu već dobila izlaz na more", "tacan": false, "zasto": "Katarina je vladala posle Petra i dobila izlaz na Crno, ne Baltičko more."}], "pomoc": ["Korak 1: Ko je pre Petra držao baltičku obalu?", "Korak 2: Šta se promenilo posle rata?", "Iz lekcije: pobedom nad Švedskom Rusija je dobila izlaz na Baltik; Sankt Peterburg je na ušću Neve u Baltičko more."], "objasnjenje": "Prestonica na moru bila je moguća tek kad je Rusija pobedom nad Švedskom izašla na Baltik.", "iz_udzbenika": {"strana": 38, "odeljak": "Rusija — Petar I Veliki", "tekst": "Pobeda nad Švedskom donela je izlaz na Baltik, gde je Petar podigao Sankt Peterburg."}, "osa": {"naziv": "Petar I Veliki", "od": 1682, "do": 1725, "traka": "vladari"}}, {"id": "rus-zakljuci-susedi", "vrsta": "zakljuci", "tezina": "tesko", "pojmovi": ["petar-i-veliki", "rusija"], "pitanje": "Do Petra I Rusija je bila u senci moćnijih suseda. Koje njegove mere su najdirektnije promenile taj položaj?", "odgovori": [{"tekst": "Stajaća vojska, ratna mornarica i pobeda nad Švedskom", "tacan": true}, {"tekst": "Pretvaranje seljaka u kmetove", "tacan": false, "zasto": "To je bila cena podrške plemstva i pogoršalo je položaj seljaka; nije ojačalo Rusiju prema susedima."}, {"tekst": "Prepiska sa Volterom", "tacan": false, "zasto": "S Volterom se dopisivala Katarina II, a ne Petar."}, {"tekst": "Patent o verskoj toleranciji", "tacan": false, "zasto": "Patent je mera Josifa II u Habzburškoj monarhiji (1781)."}], "pomoc": ["Korak 1: Šta državu čini moćnom prema susedima?", "Korak 2: Kog je moćnog suseda Petar pobedio?", "Iz lekcije: stajaća vojska, pobeda nad Švedskom, izlaz na Baltik, ratna mornarica."], "objasnjenje": "Vojska, mornarica i pobeda nad Švedskom izvukle su Rusiju iz senke suseda i otvorile joj Baltik.", "iz_udzbenika": {"strana": 38, "odeljak": "Rusija — Petar I Veliki", "tekst": "Petar je osnovao stajaću vojsku, pobedio Švedsku i izgradio ratnu mornaricu."}, "osa": {"naziv": "Petar I Veliki", "od": 1682, "do": 1725, "traka": "vladari"}}, {"id": "rus-dopuni-petar", "vrsta": "dopuni", "tezina": "lako", "pojmovi": ["petar-i-veliki", "svedska", "baltisko-more", "neva", "sankt-peterburg"], "pitanje": "Dopuni rečenicu o Petru I.", "tekst": "Petar I je pobedio {{Švedsku}} i dobio izlaz na {{Baltičko}} more, a na ušću {{Neve}} podigao je Sankt Peterburg.", "ponudjene": ["Švedsku", "Prusku", "Baltičko", "Crno", "Neve", "Dunava"], "pomoc": ["Crno more je osvojila Katarina II.", "Protivnik je bio sused na severu.", "Iz lekcije: pobeda nad Švedskom, izlaz na Baltik, Sankt Peterburg na ušću Neve."], "objasnjenje": "Petar I: Švedska → Baltičko more → Sankt Peterburg na ušću Neve.", "iz_udzbenika": {"strana": 38, "odeljak": "Rusija — Petar I Veliki", "tekst": "Pobedom nad Švedskom Rusija je dobila izlaz na Baltik; prestonica je podignuta na ušću Neve."}, "osa": {"naziv": "Petar I Veliki", "od": 1682, "do": 1725, "traka": "vladari"}}, {"id": "rus-ko-sam-petar", "vrsta": "ko_sam", "tezina": "lako", "pojmovi": ["petar-i-veliki", "romanovi", "sankt-peterburg"], "tragovi": ["Silom sam slomio otpor plemstva i crkve.", "Izgradio sam ratnu mornaricu i pobedio Švedsku.", "Osnovao sam Sankt Peterburg na ušću Neve."], "odgovori": [{"tekst": "Petar I Veliki", "tacan": true}, {"tekst": "Katarina II Velika", "tacan": false, "zasto": "Katarina je nastavila reforme, ali Sankt Peterburg je osnovao Petar."}, {"tekst": "Fridrih II Veliki", "tacan": false, "zasto": "Fridrih je bio pruski kralj; nije ratovao za Baltik protiv Švedske prema lekciji."}, {"tekst": "Josif II", "tacan": false, "zasto": "Josif II je bio habzburški car, a ne ruski."}], "objasnjenje": "To je Petar I Veliki (1682–1725), najznačajniji Romanov, osnivač Sankt Peterburga.", "iz_udzbenika": {"strana": 38, "odeljak": "Rusija — Petar I Veliki", "tekst": "Petar I je izgradio vojsku i mornaricu, pobedio Švedsku i osnovao Sankt Peterburg.", "slika": "04-doba-prosvetiteljstva/10-petar-i-veliki.jpg"}}, {"id": "rus-objasni-petar", "vrsta": "objasni", "tezina": "srednje", "pojmovi": ["petar-i-veliki", "rusija", "sankt-peterburg"], "pitanje": "Kako je Petar I Veliki promenio Rusiju? Objasni svojim rečima.", "uzor": "Pre Petra Rusija je bila prostrano carstvo u senci moćnijih suseda. Petar je osnovao stajaću vojsku i ratnu mornaricu, pobedio Švedsku i dobio izlaz na Baltičko more, gde je podigao Sankt Peterburg. Silom je slomio otpor plemstva i crkve i reformisao upravu, privredu i obrazovanje.", "ideje": ["Stajaća vojska i ratna mornarica.", "Pobeda nad Švedskom i izlaz na Baltičko more.", "Nova prestonica Sankt Peterburg.", "Slomljen otpor plemstva i crkve; reforme uprave, privrede i obrazovanja."], "objasnjenje": "Petar je od velike, ali slabe Rusije napravio moćnu državu sa izlazom na more.", "iz_udzbenika": {"strana": 38, "odeljak": "Rusija — Petar I Veliki", "tekst": "Lekcija opisuje Petrove reforme i položaj Rusije pre i posle njega.", "slika": "04-doba-prosvetiteljstva/10-petar-i-veliki.jpg"}, "osa": {"naziv": "Petar I Veliki", "od": 1682, "do": 1725, "traka": "vladari"}}, {"id": "rus-datum-katarina", "vrsta": "datum", "tezina": "srednje", "pojmovi": ["katarina-ii-velika", "rusija"], "dogadjaj": "Katarina II Velika", "pitanje": "Od koje do koje godine je vladala Katarina II Velika?", "od": 1762, "do": 1796, "traka": "vladari", "pomoc": ["Obeležila je drugu polovinu XVIII veka.", "Počela je da vlada dok je Enciklopedija još izlazila.", "Iz lekcije: Katarina II Velika (1762–1796)."], "objasnjenje": "Katarina II je vladala 1762–1796, u drugoj polovini XVIII veka.", "iz_udzbenika": {"strana": 38, "odeljak": "Rusija — Katarina II Velika", "tekst": "Katarina II Velika (1762–1796) obeležila je rusku i evropsku istoriju druge polovine XVIII veka.", "slika": "04-doba-prosvetiteljstva/11-katarina-ii-velika.jpg"}}, {"id": "rus-izbor-crno-more", "vrsta": "izbor", "tezina": "lako", "pojmovi": ["katarina-ii-velika", "rusija", "crno-more", "osmansko-carstvo"], "pitanje": "Za čije vladavine je Rusija, ratujući protiv Osmanlija, dobila izlaz na Crno more?", "odgovori": [{"tekst": "Katarine II Velike", "tacan": true}, {"tekst": "Petra I Velikog", "tacan": false, "zasto": "Petar je pobedio Švedsku i dobio izlaz na Baltičko, ne na Crno more."}, {"tekst": "Marije Terezije", "tacan": false, "zasto": "Marija Terezija je vladala Habzburškom monarhijom, ne Rusijom."}, {"tekst": "Fridriha II", "tacan": false, "zasto": "Fridrih II je bio pruski kralj."}], "pomoc": ["Crno more je na jugu — protiv koga je Rusija tamo ratovala?", "Bila je to carica koja je vladala u drugoj polovini XVIII veka.", "Iz lekcije: Katarina II Velika (1762–1796) — izlaz na Crno more."], "objasnjenje": "Katarina II je uspešno ratovala protiv Osmanlija i dobila izlaz na Crno more; Petar I je ranije dobio Baltik.", "iz_udzbenika": {"strana": 38, "odeljak": "Rusija — Katarina II Velika", "tekst": "Ratujući uspešno protiv Osmanlija, Rusija je za Katarine II dobila izlaz na Crno more.", "slika": "04-doba-prosvetiteljstva/11-katarina-ii-velika.jpg"}, "osa": {"naziv": "Katarina II Velika", "od": 1762, "do": 1796, "traka": "vladari"}}, {"id": "rus-lanac-crno-more", "vrsta": "lanac", "tezina": "lako", "pojmovi": ["katarina-ii-velika", "osmansko-carstvo", "crno-more"], "karike": ["Katarina II nastavlja jačanje Rusije", "Uspešno ratuje protiv Osmanskog carstva", "?"], "praznina": 2, "odgovori": [{"tekst": "Rusija dobija izlaz na Crno more", "tacan": true}, {"tekst": "Rusija dobija izlaz na Baltičko more", "tacan": false, "zasto": "Baltik je Petar I osvojio ranije, od Švedske."}, {"tekst": "Osmansko carstvo postaje republika", "tacan": false, "zasto": "Osmansko carstvo je ostalo apsolutistička monarhija."}], "pomoc": ["Osmansko carstvo leži južno od Rusije.", "Iz lekcije: ratujući protiv Osmanlija Rusija dobija izlaz na Crno more."], "objasnjenje": "Pobede nad Osmanlijama donele su Rusiji izlaz na Crno more.", "iz_udzbenika": {"strana": 38, "odeljak": "Rusija — Katarina II Velika", "tekst": "Uspešni ratovi Katarine II protiv Osmanlija doneli su Rusiji izlaz na Crno more."}, "osa": {"naziv": "Katarina II Velika", "od": 1762, "do": 1796, "traka": "vladari"}}, {"id": "rus-tn-vakcinacija", "vrsta": "tacno_netacno", "tezina": "lako", "pojmovi": ["katarina-ii-velika", "vakcinacija"], "tvrdnja": "Katarina II je u Rusiji uvela vakcinaciju protiv velikih boginja.", "tacno": true, "pomoc": ["Katarina je osnivala bolnice, škole i sirotišta.", "Iz lekcije: uvela je vakcinaciju protiv velikih boginja."], "objasnjenje": "Tačno — uz bolnice, škole i sirotišta, Katarina II je uvela i vakcinaciju protiv velikih boginja.", "iz_udzbenika": {"strana": 38, "odeljak": "Rusija — Katarina II Velika", "tekst": "Katarina II je osnivala bolnice, škole i sirotišta i uvela vakcinaciju protiv velikih boginja."}, "osa": {"naziv": "Katarina II Velika", "od": 1762, "do": 1796, "traka": "vladari"}}, {"id": "rus-izbor-poljska", "vrsta": "izbor", "tezina": "srednje", "pojmovi": ["podela-poljske", "katarina-ii-velika", "poljska", "austrija", "pruska"], "pitanje": "Sa vladarima kojih država je Katarina II učestvovala u podeli Poljske?", "odgovori": [{"tekst": "Austrije i Pruske", "tacan": true}, {"tekst": "Švedske i Osmanskog carstva", "tacan": false, "zasto": "Sa Švedskom je ratovao Petar I, a sa Osmanlijama Katarina — to su bili protivnici, ne saveznici."}, {"tekst": "Francuske i Velike Britanije", "tacan": false, "zasto": "Lekcija ih ne pominje u podeli Poljske."}, {"tekst": "Venecije i Đenove", "tacan": false, "zasto": "To su bile male republike, ne sile koje dele druge države."}], "pomoc": ["Poljsku su podelili njeni susedi.", "To su i dve druge države prosvećenog apsolutizma.", "Iz lekcije: Katarina II je zajedno sa vladarima Austrije i Pruske učestvovala u podeli Poljske."], "objasnjenje": "Poljsku su podelile tri susedne sile prosvećenog apsolutizma — Rusija, Austrija i Pruska.", "iz_udzbenika": {"strana": 38, "odeljak": "Rusija — Katarina II Velika", "tekst": "Zajedno sa vladarima Austrije i Pruske Katarina II je učestvovala u podeli Poljske."}, "osa": {"naziv": "Katarina II Velika", "od": 1762, "do": 1796, "traka": "vladari"}}, {"id": "rus-izbor-katarina-mere", "vrsta": "izbor", "tezina": "tesko", "pojmovi": ["katarina-ii-velika", "petar-i-veliki", "vakcinacija", "podela-poljske"], "pitanje": "Šta je od navedenog delo Katarine II, a ne Petra I? (više tačnih)", "odgovori": [{"tekst": "Osnivanje bolnica, škola i sirotišta", "tacan": true}, {"tekst": "Vakcinacija protiv velikih boginja", "tacan": true}, {"tekst": "Izlaz na Crno more", "tacan": true}, {"tekst": "Učešće u podeli Poljske", "tacan": true}, {"tekst": "Osnivanje Sankt Peterburga", "tacan": false, "zasto": "Sankt Peterburg je osnovao Petar I početkom XVIII veka."}, {"tekst": "Pobeda nad Švedskom", "tacan": false, "zasto": "Švedsku je pobedio Petar I i tako dobio Baltik."}, {"tekst": "Pretvaranje seljaka u kmetove", "tacan": false, "zasto": "Zamka: to su odobrili OBOJE, Petar I i Katarina II — nije samo Katarinino."}], "pomoc": ["Petar: vojska, mornarica, Baltik, Sankt Peterburg.", "Pazi na meru koju su sproveli oboje.", "Iz lekcije: Katarina — bolnice, škole, sirotišta, vakcinacija, Crno more, Poljska; kmetstvo su odobrili i Petar i Katarina."], "objasnjenje": "Katarinina su: socijalne ustanove, vakcinacija, Crno more i podela Poljske. Sankt Peterburg i Švedska su Petrovi, a kmetstvo su odobrili oboje.", "iz_udzbenika": {"strana": 38, "odeljak": "Rusija", "tekst": "Lekcija posebno opisuje reforme Petra I i Katarine II.", "slika": "04-doba-prosvetiteljstva/11-katarina-ii-velika.jpg"}}, {"id": "rus-dopuni-katarina", "vrsta": "dopuni", "tezina": "tesko", "pojmovi": ["katarina-ii-velika", "vakcinacija", "osmansko-carstvo"], "pitanje": "Dopuni rečenicu (bez ponuđenih reči).", "tekst": "Katarina II je osnivala bolnice, škole i {{sirotišta}}, uvela vakcinaciju protiv velikih {{boginja}}, a ratujući protiv {{Osmanlija|Osmanskog carstva|Turaka|Osmanlije}} dobila je izlaz na Crno more.", "pomoc": ["Ustanove za decu bez roditelja.", "Bolest protiv koje se vakcinisalo zove se velike …", "Iz lekcije: bolnice, škole, sirotišta; vakcinacija protiv velikih boginja; ratovi protiv Osmanlija."], "objasnjenje": "Katarina II je brinula o ustanovama (sirotišta), zdravlju (vakcinacija protiv velikih boginja) i granicama (Crno more, ratovi s Osmanlijama).", "iz_udzbenika": {"strana": 38, "odeljak": "Rusija — Katarina II Velika", "tekst": "Katarina je osnivala bolnice, škole i sirotišta, uvela vakcinaciju i ratujući protiv Osmanlija dobila izlaz na Crno more."}, "osa": {"naziv": "Katarina II Velika", "od": 1762, "do": 1796, "traka": "vladari"}}, {"id": "rus-ko-sam-katarina", "vrsta": "ko_sam", "tezina": "tesko", "pojmovi": ["katarina-ii-velika", "volter", "ermitaz"], "tragovi": ["Volter me je u pismima zvao laskavim imenima.", "Posle njegove smrti otkupila sam celu njegovu biblioteku.", "Uvela sam vakcinaciju protiv velikih boginja i dobila izlaz na Crno more."], "odgovori": [{"tekst": "Katarina II Velika", "tacan": true}, {"tekst": "Marija Terezija", "tacan": false, "zasto": "Marija Terezija je habzburška vladarka; Volter se dopisivao sa Katarinom."}, {"tekst": "Marija Antoaneta", "tacan": false, "zasto": "Marija Antoaneta je buduća kraljica Francuske, sa slike porodice Marije Terezije."}, {"tekst": "Fridrih II Veliki", "tacan": false, "zasto": "Fridrih je bio Volterov prijatelj, ali biblioteku je otkupila Katarina."}], "objasnjenje": "To je Katarina II Velika (1762–1796), Volterova dugogodišnja prepiskačica.", "iz_udzbenika": {"strana": 36, "odeljak": "Znatiželja — Volter i vladari; Rusija", "tekst": "Katarina II se dopisivala s Volterom, otkupila njegovu biblioteku i uvela vakcinaciju.", "slika": "04-doba-prosvetiteljstva/11-katarina-ii-velika.jpg"}}, {"id": "rus-uporedi-petar-katarina", "vrsta": "uporedi", "tezina": "srednje", "pojmovi": ["petar-i-veliki", "katarina-ii-velika", "kmetstvo"], "a": "Petar I Veliki", "b": "Katarina II Velika", "pitanje": "Na koga se odnosi tvrdnja — Petra I, Katarinu II, oboje ili nikoga?", "tvrdnje": [{"tekst": "Dobio/la je izlaz na Baltičko more.", "odgovor": "a", "zasto": "Petar, pobedom nad Švedskom."}, {"tekst": "Dobio/la je izlaz na Crno more.", "odgovor": "b", "zasto": "Katarina, ratujući protiv Osmanlija."}, {"tekst": "Odobrio/la je pretvaranje seljaka u kmetove.", "odgovor": "oba", "zasto": "Oboje — da bi pridobili plemstvo za reforme."}, {"tekst": "Osnovao/la je Sankt Peterburg.", "odgovor": "a", "zasto": "Petar, početkom XVIII veka."}, {"tekst": "Dopisivao/la se sa Volterom.", "odgovor": "b", "zasto": "Katarina je sa Volterom vodila dugogodišnju prepisku."}, {"tekst": "Doneo/la je Patent o verskoj toleranciji.", "odgovor": "nijedan", "zasto": "Patent je doneo Josif II u Habzburškoj monarhiji."}], "pomoc": ["Petar: sever i Baltik; Katarina: jug i Crno more.", "Jedna mera je zajednička i pogoršala je položaj seljaka.", "Iz lekcije: Petar I i Katarina II odobrili su pretvaranje seljaka u kmetove."], "objasnjenje": "Petar je otvorio Baltik i podigao Sankt Peterburg, Katarina je dobila Crno more i dopisivala se s Volterom; oboje su odobrili kmetstvo.", "iz_udzbenika": {"strana": 38, "odeljak": "Rusija", "tekst": "Lekcija opisuje dva velika ruska reformatora, Petra I i Katarinu II."}}, {"id": "rus-tn-seljaci", "vrsta": "tacno_netacno", "tezina": "tesko", "pojmovi": ["kmetstvo", "seljastvo", "petar-i-veliki", "katarina-ii-velika"], "tvrdnja": "Reforme Petra I i Katarine II poboljšale su položaj ruskih seljaka.", "tacno": false, "ispravke": [{"tekst": "Položaj seljaka se pogoršao: da bi pridobili plemstvo, vladari su odobrili pretvaranje seljaka u kmetove.", "tacan": true}, {"tekst": "Seljaci su dobili pravo da biraju cara.", "tacan": false, "zasto": "Rusija je bila apsolutistička monarhija; seljaci nisu birali vlast."}, {"tekst": "Katarina II je ukinula kmetstvo.", "tacan": false, "zasto": "Ukidanje kmetstva pokušao je Josif II u Habzburškoj monarhiji; u Rusiji se kmetstvo širilo."}], "pomoc": ["Čiju podršku su ruski vladari morali da pridobiju za reforme?", "Iz lekcije: u XVIII veku položaj seljaštva u Rusiji se pogoršao."], "objasnjenje": "Reforme su jačale državu, ali seljaci — najbrojniji sloj — postajali su kmetovi; bune su gušene.", "iz_udzbenika": {"strana": 38, "odeljak": "Rusija", "tekst": "U XVIII veku pogoršan je položaj seljaštva, najbrojnijeg sloja u Rusiji."}}, {"id": "rus-lanac-kmetovi", "vrsta": "lanac", "tezina": "srednje", "pojmovi": ["kmetstvo", "plemstvo", "petar-i-veliki", "katarina-ii-velika"], "karike": ["Petar I i Katarina II žele podršku plemstva za reforme", "?", "Položaj seljaštva se pogoršava"], "praznina": 1, "odgovori": [{"tekst": "Odobravaju pretvaranje seljaka u kmetove", "tacan": true}, {"tekst": "Ukidaju kmetstvo", "tacan": false, "zasto": "Ukidanje kmetstva bi naljutilo plemstvo — to je pokušao Josif II i naišao na otpor."}, {"tekst": "Dele zemlju seljacima", "tacan": false, "zasto": "To bi poboljšalo, a ne pogoršalo položaj seljaka."}], "pomoc": ["Šta bi plemstvu dalo više moći nad seljacima?", "Iz lekcije: da bi pridobili plemstvo, odobrili su pretvaranje seljaka u kmetove."], "objasnjenje": "Podrška plemstva kupljena je slobodom seljaka — odobreno je pretvaranje seljaka u kmetove.", "iz_udzbenika": {"strana": 38, "odeljak": "Rusija", "tekst": "Da bi pridobili plemstvo za reforme, Petar I i Katarina II odobrili su pretvaranje seljaka u kmetove."}}, {"id": "rus-lanac-bune", "vrsta": "lanac", "tezina": "lako", "pojmovi": ["kmetstvo", "seljastvo"], "karike": ["Gospodar slobodno raspolaže životom kmeta i njegove porodice", "Kmetovi dižu bune", "?"], "praznina": 2, "odgovori": [{"tekst": "Bune se surovo guše, a položaj seljaka ostaje težak i narednih decenija", "tacan": true}, {"tekst": "Car ukida kmetstvo", "tacan": false, "zasto": "U Rusiji kmetstvo nije ukinuto u ovom periodu; bune su gušene."}, {"tekst": "Kmetovi postaju plemići", "tacan": false, "zasto": "Bune su ugušene; kmetovi nisu dobili ništa."}], "pomoc": ["Kako je apsolutistička vlast odgovarala na bune?", "Iz lekcije: bune kmetova su surovo gušene."], "objasnjenje": "Bune kmetova su surovo ugušene, pa je položaj seljaštva ostao težak i u narednim decenijama.", "iz_udzbenika": {"strana": 38, "odeljak": "Rusija", "tekst": "Bune kmetova surovo su gušene, a položaj seljaštva ostao je težak i narednih decenija."}}, {"id": "rus-uporedi-kmetstvo", "vrsta": "uporedi", "tezina": "tesko", "pojmovi": ["kmetstvo", "josif-ii", "petar-i-veliki", "katarina-ii-velika", "plemstvo"], "a": "Habzburška monarhija (Josif II)", "b": "Rusija (Petar I i Katarina II)", "pitanje": "Na koju zemlju se odnosi tvrdnja — Habzburšku monarhiju, Rusiju, obe ili nijednu?", "tvrdnje": [{"tekst": "Vladar je pokušao da ukine kmetstvo.", "odgovor": "a", "zasto": "Josif II je pokušao da ukine kmetstvo."}, {"tekst": "Vladari su odobrili pretvaranje seljaka u kmetove.", "odgovor": "b", "zasto": "Petar I i Katarina II, da bi pridobili plemstvo."}, {"tekst": "Vladar se sukobio sa plemstvom.", "odgovor": "oba", "zasto": "Petar je silom slomio otpor plemstva, a Josifu se opiralo ugarsko plemstvo."}, {"tekst": "Bune kmetova su surovo gušene.", "odgovor": "b", "zasto": "Lekcija to govori za Rusiju."}, {"tekst": "Nemački je uveden kao zvanični jezik.", "odgovor": "a", "zasto": "Josif II je uveo nemački da poveže posede."}, {"tekst": "Seljaci su dobili pravo da biraju vlast.", "odgovor": "nijedan", "zasto": "Obe zemlje su bile apsolutističke monarhije."}], "pomoc": ["Josif II je hteo da oslobodi kmetove, ruski vladari su ih stvarali.", "Petar je silom slomio otpor plemstva i crkve.", "Iz lekcije: Josif II — pokušaj ukidanja kmetstva, otpor plemstva; Rusija — kmetstvo radi podrške plemstva."], "objasnjenje": "Prema kmetstvu dve zemlje idu suprotnim putem: Josif ga ukida (i gubi bitku sa plemstvom), a ruski vladari ga šire (da bi dobili plemstvo).", "iz_udzbenika": {"strana": 38, "odeljak": "Habzburška monarhija; Rusija", "tekst": "Josif II je pokušao da ukine kmetstvo, a Petar I i Katarina II odobrili su pretvaranje seljaka u kmetove."}}, {"id": "rus-poredjaj-rusija", "vrsta": "poredjaj", "tezina": "lako", "pojmovi": ["petar-i-veliki", "enciklopedija", "katarina-ii-velika"], "pitanje": "Poređaj događaje hronološki.", "stavke": [{"tekst": "Petar I Veliki postaje ruski car", "godina": 1682, "do": 1725, "naziv": "Petar I Veliki", "traka": "vladari"}, {"tekst": "Počinje da izlazi Enciklopedija", "godina": 1751, "do": 1772, "naziv": "Enciklopedija", "traka": "ideje"}, {"tekst": "Katarina II Velika postaje ruska carica", "godina": 1762, "do": 1796, "naziv": "Katarina II Velika", "traka": "vladari"}], "pomoc": ["Jedan događaj je iz XVII veka.", "Katarina se dopisivala s Volterom, koji je pisao Enciklopediju.", "Iz lekcije: 1682 Petar I, 1751 Enciklopedija, 1762 Katarina II."], "objasnjenje": "Petar I (1682) → Enciklopedija (1751) → Katarina II (1762).", "iz_udzbenika": {"strana": 38, "odeljak": "Rusija", "tekst": "Petar I (1682–1725), Enciklopedija (1751–1772), Katarina II (1762–1796)."}}, {"id": "rus-poredjaj-vladari", "vrsta": "poredjaj", "tezina": "srednje", "pojmovi": ["petar-i-veliki", "marija-terezija", "katarina-ii-velika", "josif-ii", "enciklopedija"], "pitanje": "Poređaj događaje hronološki, od najranijeg do najkasnijeg.", "stavke": [{"tekst": "Petar I Veliki postaje ruski car", "godina": 1682, "do": 1725, "naziv": "Petar I Veliki", "traka": "vladari"}, {"tekst": "Marija Terezija i Fridrih II stupaju na presto", "godina": 1740, "do": 1780, "naziv": "Vladavina Marije Terezije", "traka": "vladari"}, {"tekst": "Počinje da izlazi Enciklopedija", "godina": 1751, "do": 1772, "naziv": "Enciklopedija", "traka": "ideje"}, {"tekst": "Katarina II Velika postaje ruska carica", "godina": 1762, "do": 1796, "naziv": "Katarina II Velika", "traka": "vladari"}, {"tekst": "Josif II donosi Patent o verskoj toleranciji", "godina": 1781, "naziv": "Patent o verskoj toleranciji", "traka": "dogadjaji"}], "pomoc": ["Petar I je vladao na samom kraju XVII veka — on je najraniji.", "Marija Terezija i Fridrih II počinju iste godine, pre Enciklopedije (1751–1772).", "Iz lekcije: 1682 Petar I, 1740 Marija Terezija, 1751 Enciklopedija, 1762 Katarina II, 1781 Patent."], "objasnjenje": "Petar I (1682) → Marija Terezija i Fridrih II (1740) → Enciklopedija (1751) → Katarina II (1762) → Patent o verskoj toleranciji (1781).", "iz_udzbenika": {"strana": 38, "odeljak": "Hronologija lekcije", "tekst": "Lekcija obuhvata vladare od Petra I (1682) do Josifa II i Patenta (1781)."}}, {"id": "rus-objasni-katarina", "vrsta": "objasni", "tezina": "srednje", "pojmovi": ["katarina-ii-velika", "crno-more", "podela-poljske", "volter"], "pitanje": "Zašto se kaže da je Katarina II obeležila i rusku i evropsku istoriju? Objasni svojim rečima.", "uzor": "U Rusiji je nastavila reforme, osnivala bolnice, škole i sirotišta i uvela vakcinaciju protiv velikih boginja. U Evropi je ratujući protiv Osmanlija dobila izlaz na Crno more, a sa Austrijom i Pruskom podelila Poljsku. Dopisivala se s Volterom i otkupila njegovu biblioteku.", "ideje": ["Reforme u Rusiji: bolnice, škole, sirotišta, vakcinacija.", "Izlaz na Crno more posle ratova s Osmanlijama.", "Podela Poljske sa Austrijom i Pruskom.", "Veza sa prosvetiteljima (Volter)."], "objasnjenje": "Katarina je delovala i unutra (reforme) i spolja (ratovi, Poljska), pa je ostavila trag u istoriji cele Evrope.", "iz_udzbenika": {"strana": 38, "odeljak": "Rusija — Katarina II Velika", "tekst": "Katarina II je obeležila rusku i evropsku istoriju druge polovine XVIII veka.", "slika": "04-doba-prosvetiteljstva/11-katarina-ii-velika.jpg"}, "osa": {"naziv": "Katarina II Velika", "od": 1762, "do": 1796, "traka": "vladari"}}, {"id": "rus-objasni-kmetovi", "vrsta": "objasni", "tezina": "tesko", "pojmovi": ["kmetstvo", "petar-i-veliki", "katarina-ii-velika", "prosveceni-apsolutizam"], "pitanje": "Petar I i Katarina II bili su reformatori, a ipak se položaj seljaka u Rusiji pogoršao. Kako je to moguće?", "uzor": "Da bi plemstvo podržalo njihove reforme, Petar I i Katarina II dozvolili su da se seljaci pretvaraju u kmetove. Gospodar je mogao slobodno da raspolaže životom kmeta i njegove porodice, a bune kmetova su surovo gušene. Reforme su jačale državu, upravu i vojsku, ali ne i slobodu seljaka.", "ideje": ["Hteli su da pridobiju plemstvo za svoje reforme.", "Zato su odobrili pretvaranje seljaka u kmetove.", "Reforme su jačale državu, ali ne i položaj običnog naroda."], "objasnjenje": "Prosvećeni apsolutizam je prvo jačao državu; u Rusiji je cena za podršku plemstva bila sloboda seljaka.", "iz_udzbenika": {"strana": 38, "odeljak": "Rusija", "tekst": "Da bi pridobili plemstvo za reforme, Petar I i Katarina II odobrili su pretvaranje seljaka u kmetove; bune su surovo gušene."}}]}], "baza": {}, "sastav": {"ucenje": 20, "test": 15, "odnos": [40, 40, 20], "ponavljanje": 50}, "osa": {"od": 1680, "do": 1800, "trake": [{"id": "vladari", "label": "Vladari", "color": "#9c5a2c"}, {"id": "ideje", "label": "Ideje i dela", "color": "#1f7a3a"}, {"id": "dogadjaji", "label": "Događaji", "color": "#3a6ba5"}]}};

  const odnos = S.odnos || [40, 40, 20];
  const want = { lako: Math.round(n * odnos[0] / 100), tesko: Math.round(n * odnos[2] / 100) };
  want.srednje = n - want.lako - want.tesko;
  const rr = (list, key) => {   // shuffle, group by key, then take one from each group in turn
    const groups = {};
    for (const z of pickN(list, list.length, r)) (groups[key(z)] = groups[key(z)] || []).push(z);
    const keys = pickN(Object.keys(groups), Object.keys(groups).length, r), out = [];
    while (out.length < list.length) for (const k of keys) if (groups[k].length) out.push(groups[k].shift());
    return out;
  };
  // Per level, take items one at a time from the section that is furthest below its share of the
  // whole bank (shares count across all levels, with a little randomness so draws differ); inside a
  // section the items alternate by type (rr). A level that runs short is filled from the others.
  const size = {}, taken = {};
  for (const z of bank) size[z.deo] = (size[z.deo] || 0) + 1;
  const pools = Object.fromEntries(TEZ.map(t => {

    return [t, Object.fromEntries(Object.entries(bySec).map(([d, zs]) => [d, rr(zs, x => x.vrsta)]))];
  }));
  const takeOne = t => {
    const ks = Object.keys(pools[t]).filter(k => pools[t][k].length);
    if (!ks.length) return null;
    const k = ks.reduce((a, x) => ((taken[x] || 0) + r()) / size[x] < ((taken[a] || 0) + r()) / size[a] ? x : a);
    taken[k] = (taken[k] || 0) + 1;

  };

  for (const t of TEZ) for (let i = 0; i < want[t]; i++) { const z = takeOne(t); if (z) picked.push(z); }
  for (const t of ['srednje', 'lako', 'tesko']) { let z; while (picked.length < n && (z = takeOne(t))) picked.push(z); }   // a level ran short
  again.forEach(z => { z.ponovo = true; picked.push(z); });
  picked.sort((a, b) => a.deo - b.deo || TEZ.indexOf(a.tezina) - TEZ.indexOf(b.tezina));

}

const firstTry = () => !(state.mode === 'test' && att() && att().phase === 'ispravka');   // Ispravka does not change mastery

// ---------- item renderers ----------
const main = document.getElementById('main');
function frame(z, s, inner) {

function questionFig(z, s) {   // `slika_u_pitanju`: the question asks to look at the picture, so it stands under the answers (caption only once answered)
  const b = z.iz_udzbenika; if (!z.slika_u_pitanju || !b || !b.slika) return '';

    (INFO.zasticeno ? 'this.parentNode.outerHTML=\'<p class=&quot;ref&quot;>Slika uz ovo pitanje je u <a href=&quot;' + esc(INFO.zasticeno) + '&quot;>verziji sa slikama iz udžbenika (lozinka)</a>.</p>\'' : 'this.parentNode.remove()') +

function actions(btns) {

}
function nextButton(z) {   // done: Sledeći + reopen the drawer; in progress with help used: reopen the help
  const s = st(z.id), a = document.getElementById('actions');
  if (!isDone(s)) {

function prelude(z, s) {   // what stands above the options: a source, a cause→effect chain, the clues so far
  const done = isDone(s), right = z.odgovori && z.odgovori.find(o => o.tacan);
  if (z.vrsta === 'izvor') { const iz = z.izvor;
    return '<div class="src">' + (iz.autor || iz.naslov ? '<p class="who">' + esc([iz.autor, iz.naslov].filter(Boolean).join(' — ')) + '</p>' : '') +
      '<blockquote>' + fmt(iz.tekst) + '</blockquote>' + (iz.napomena ? '<p class="nt">' + fmt(iz.napomena) + '</p>' : '') + '</div>'; }
  if (z.vrsta === 'lanac') return '<div class="chain">' + z.karike.map((k, i) => (i ? '<span class="ar">→</span>' : '') +
    (i === z.praznina ? '<div class="lk q' + (done && s.status !== 'failed' ? ' ok' : '') + '">' + (done && s.status !== 'failed' ? fmt(right.tekst) : '?') + '</div>' : '<div class="lk">' + fmt(k) + '</div>')).join('') + '</div>';
  if (z.vrsta === 'ko_sam') { const n = Math.min(z.tragovi.length, done ? z.tragovi.length : s.miss + 1);
    return '<ul class="clues">' + z.tragovi.slice(0, n).map((t, i) => '<li><span class="k">Trag ' + (i + 1) + '</span>' + fmt(t) + '</li>').join('') + '</ul>'; }
  return '';
}
function renderChoice(z, s) {   // izbor, zakljuci, lanac, izvor, ko_sam (+ the correction step of tacno_netacno)
  const opts = shuffled(z.odgovori, z.id);

  const ui = s.ui; ui.wrong = ui.wrong || []; ui.pick = ui.pick || [];

  const why = o => o.zasto && (helpOn() || (done && s.status !== 'failed')) ? '<span class="why">' + fmt(o.zasto) + '</span>' : '';
  main.innerHTML = frame(z, s, prelude(z, s) + '<h2 class="q">' + fmt(z.pitanje || (z.vrsta === 'ko_sam' ? 'Ko sam ja?' : 'Koja karika nedostaje?')) + '</h2><div class="opts">' + opts.map(([o, i]) =>

    (ui.wrong.includes(i) ? why(o) : '') + '</span></button>').join('') + '</div>');
  if (!done && multi) actions([['btnCheck', 'Proveri', 'ok']]);
  if (!done && z.vrsta === 'ko_sam' && s.miss < steps(z)) { actions([['btnClue', 'Još jedan trag']]); document.getElementById('btnClue').addEventListener('click', () => { ui.why = null; fail(z, 'Novi trag', 'zatražen novi trag'); }); }
  main.querySelectorAll('.opt').forEach(b => b.addEventListener('click', () => {
    const i = +b.dataset.i;
    if (!multi) { if (z.odgovori[i].tacan) succeed(z, z.odgovori[i].tekst); else { ui.wrong.push(i); ui.why = z.odgovori[i].zasto || null; fail(z, undefined, z.odgovori[i].tekst); } return; }
    ui.pick = ui.pick.includes(i) ? ui.pick.filter(x => x !== i) : ui.pick.concat(i);

    ui.why = wrongPicked.map(i => z.odgovori[i].zasto).filter(Boolean).join(' ') || null;
    fail(z, wrongPicked.length ? 'Neki od označenih nisu tačni' : 'Nedostaje još tačnih odgovora', given);
  });
  nextButton(z);
}

function renderTN(z, s) {
  const ui = s.ui, done = isDone(s), showAns = s.status === 'ok' || s.status === 'revealed';
  let inner = '<h2 class="q">Tačno ili netačno?</h2><p class="stmt">' + fmt(z.tvrdnja) + '</p><div class="tn">' +
    [[true, 'Tačno'], [false, 'Netačno']].map(([v, t]) => '<button type="button" data-v="' + v + '" class="' +
      ((showAns || ui.phase === 'fix') && v === z.tacno ? 'right' : (ui.tnWrong === v ? 'wrong' : '')) + '"' + (done || ui.phase === 'fix' || ui.tnWrong === v ? ' disabled' : '') + '>' + t + '</button>').join('') + '</div>';
  if (!z.tacno && (ui.phase === 'fix' || showAns)) {

      (done || ui.wrong.includes(i) ? ' disabled' : '') + '><span class="box"></span><span><span class="ot">' + fmt(o.tekst) + '</span>' + (ui.wrong.includes(i) && o.zasto && (helpOn() || done) ? '<span class="why">' + fmt(o.zasto) + '</span>' : '') + '</span></button>').join('') + '</div>';

      ui.tnWrong = v;       // on a false one the pupil still has to find the correction
      if (z.tacno) st(z.id).miss = steps(z); else ui.phase = 'fix';

    }
    if (z.tacno) { succeed(z, 'Tačno'); return; }

    ui.phase = 'fix'; save(); renderItem(false); toast('Tačno — sad je ispravi', true);

  }));

}

function parseCloze(t) {   // → [text, {answers}, text, …]
  const parts = []; let last = 0;

  parts.push(t.slice(last));

}
function renderCloze(z, s) {

  const done = isDone(s), bank = z.ponudjene && z.ponudjene.length;
  if (ui.cur == null || ui.lock[ui.cur]) ui.cur = blanks.findIndex((_, i) => !ui.lock[i]);
  let bi = -1;
  const html = parts.map(p => {
    if (typeof p === 'string') return fmt(p);
    bi++;
    const val = done && !ui.lock[bi] ? p.answers[0] : (ui.val[bi] || '');
    const cls = 'blank' + (ui.lock[bi] ? ' lock' : '') + (done && !ui.lock[bi] ? ' rev' : '') + (!done && ui.bad && ui.bad.includes(bi) ? ' bad' : '') + (!done && !bank && false ? '' : '') + (!done && bi === ui.cur && bank ? ' cur' : '');
    return bank || done || ui.lock[bi] ? '<button type="button" class="' + cls + '" data-b="' + bi + '"' + (done || ui.lock[bi] ? ' disabled' : '') + '>' + (esc(val) || '&nbsp;') + '</button>'
      : '<input class="' + cls + '" data-b="' + bi + '" value="' + esc(val) + '" autocomplete="off" spellcheck="false">';
  }).join('');
  const used = Object.values(ui.val);
  main.innerHTML = frame(z, s, '<h2 class="q">' + fmt(z.pitanje || 'Dopuni rečenicu.') + '</h2><div class="cloze">' + html + '</div>' +
    (bank && !done ? '<div class="bank">' + z.ponudjene.map(w => '<button type="button"' + (used.includes(w) ? ' class="used"' : '') + ' data-w="' + esc(w) + '">' + esc(w) + '</button>').join('') + '</div>' : ''));
  if (!done) actions([['btnCheck', 'Proveri', 'ok']]);
  main.querySelectorAll('button.blank').forEach(b => b.addEventListener('click', () => { const i = +b.dataset.b; if (ui.val[i]) delete ui.val[i]; ui.cur = i; ui.bad = []; save(); renderItem(false); }));
  main.querySelectorAll('input.blank').forEach(inp => {
    inp.addEventListener('input', () => { ui.val[+inp.dataset.b] = inp.value; save(); });
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('btnCheck').click(); });
  });
  main.querySelectorAll('.bank button').forEach(b => b.addEventListener('click', () => {
    let i = ui.cur; if (i == null || i < 0 || ui.lock[i] || ui.val[i]) i = blanks.findIndex((_, k) => !ui.lock[k] && !ui.val[k]);
    if (i < 0) return;

  }));
  const chk = document.getElementById('btnCheck');
  if (chk) chk.addEventListener('click', () => {
    const open = blanks.map((_, i) => i).filter(i => !ui.lock[i]);
    if (open.some(i => !norm(ui.val[i]))) { toast('Popuni sve praznine', false); return; }
    ui.bad = [];
    const given = open.map(i => ui.val[i]).join(' / ');
    for (const i of open) { if (blanks[i].answers.map(norm).includes(norm(ui.val[i]))) ui.lock[i] = true; else { ui.bad.push(i); delete ui.val[i]; } }
    if (!ui.bad.length) succeed(z, given); else fail(z, ui.bad.length === 1 ? 'Jedna praznina nije tačna' : 'Neke praznine nisu tačne', given);
  });

}

function renderMatch(z, s) {
  const ui = s.ui; ui.done = ui.done || [];
  const done = isDone(s), right = shuffled(z.parovi.map(p => p[1]), z.id);
  const num = i => ui.done.indexOf(i) + 1;

    z.parovi.map((p, i) => { const m = ui.done.includes(i), rv = done && !m;
      return '<button type="button" class="mcell L' + (m ? ' done' : rv ? ' rev' : '') + (ui.left === i && !done ? ' cur' : '') + '" data-i="' + i + '"' + (m || done ? ' disabled' : '') + '>' +
        (m || rv ? '<span class="n">' + (m ? num(i) : '→') + '</span>' : '') + fmt(p[0]) + '</button>'; }).join('') +
    '</div><div class="col">' + right.map(([t, i]) => { const m = ui.done.includes(i), rv = done && !m;
      return '<button type="button" class="mcell R' + (m ? ' done' : rv ? ' rev' : '') + '" data-i="' + i + '"' + (m || done ? ' disabled' : '') + '>' +
        (m ? '<span class="n">' + num(i) + '</span>' : rv ? '<span class="n">←</span>' : '') + fmt(t) + (rv ? ' <small>(' + esc(z.parovi[i][0]) + ')</small>' : '') + '</button>'; }).join('') + '</div></div>');
  main.querySelectorAll('.mcell.L').forEach(b => b.addEventListener('click', () => { ui.left = +b.dataset.i; save(); renderItem(false); }));
  main.querySelectorAll('.mcell.R').forEach(b => b.addEventListener('click', () => {
    if (ui.left == null) { toast('Prvo klikni pojam levo', false); return; }
    const i = +b.dataset.i, pair = z.parovi[ui.left][0] + ' → ' + z.parovi[i][1];
    if (i === ui.left) { ui.done.push(i); ui.left = null; if (ui.done.length === z.parovi.length) succeed(z, pair); else { st(z.id).log.push({ v: pair, ok: true }); save(); renderItem(false); } }
    else { b.classList.add('bad'); ui.left = null; setTimeout(() => fail(z, 'Nisu par', pair), 280); }
  }));

// ---------- history: datum, poredjaj, uporedi, objasni ----------
// `oznaka` = how the book dates an event it gives no years for ("kraj XVIII veka"): shown instead of the
// (approximate) years, which only place it on the axis.
const fmtY = y => y < 0 ? -y + ' pre n. e.' : String(y);   // years before the common era are negative in the data
const yrSpan = (a, b) => b == null ? fmtY(a) : a < 0 && b < 0 ? -a + '–' + fmtY(b) : fmtY(a) + '–' + fmtY(b);
const yrs = z => z.oznaka ? z.oznaka : z.godina != null ? fmtY(z.godina) : yrSpan(z.od, z.do);
function renderDate(z, s) {   // one year (`godina`) or a range (`od`, `do`), ± `tolerancija` years
  const ui = s.ui, done = isDone(s), range = z.godina == null && z.do != null, tol = z.tolerancija || 0;
  ui.v = ui.v || {};
  const want = range ? { od: z.od, do: z.do } : { od: z.godina != null ? z.godina : z.od };
  const bce = Object.values(want).some(y => y < 0);   // the era is then part of the answer: chosen per field
  ui.era = ui.era || {};
  const eraOf = k => done && s.status !== 'failed' ? (want[k] < 0 ? 'pre' : 'ne') : (ui.era[k] || 'pre');
  const field = (k, ph) => '<input inputmode="numeric" data-k="' + k + '" placeholder="' + ph + '" value="' + esc(done && s.status !== 'failed' ? Math.abs(want[k]) : (ui.v[k] || '')) + '"' +
    (done ? ' disabled' : '') + (ui.bad && ui.bad.includes(k) ? ' class="bad"' : '') + '>' +
    (bce ? '<select data-era="' + k + '" aria-label="Era"' + (done ? ' disabled' : '') + '><option value="pre"' + (eraOf(k) === 'pre' ? ' selected' : '') + '>pre n. e.</option><option value="ne"' + (eraOf(k) === 'ne' ? ' selected' : '') + '>n. e.</option></select>' : '');
  const val = k => bce && (ui.era[k] || 'pre') === 'pre' ? -ui.v[k] : +ui.v[k];
  main.innerHTML = frame(z, s, '<h2 class="q">' + fmt(z.pitanje || 'Kada?') + '</h2><p class="ev">' + fmt(z.dogadjaj) + '</p>' +
    '<div class="dt">' + (range ? field('od', 'od') + '<span>–</span>' + field('do', 'do') : field('od', 'godina')) + '</div>');
  if (!done) actions([['btnCheck', 'Proveri', 'ok']]);
  main.querySelectorAll('.dt select').forEach(sel => sel.addEventListener('change', () => { ui.era[sel.dataset.era] = sel.value; save(); }));
  main.querySelectorAll('.dt input').forEach(inp => {
    inp.addEventListener('input', () => { ui.v[inp.dataset.k] = inp.value.replace(/[^0-9]/g, ''); save(); });
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('btnCheck').click(); });
  });
  const chk = document.getElementById('btnCheck');
  if (chk) chk.addEventListener('click', () => {
    const ks = Object.keys(want);
    if (ks.some(k => !ui.v[k])) { toast('Upiši godinu', false); return; }
    const given = ks.map(k => fmtY(val(k))).join('–');
    ui.bad = ks.filter(k => Math.abs(val(k) - want[k]) > tol);
    if (!ui.bad.length) { succeed(z, given); return; }
    const k = ui.bad[0], d = val(k) - want[k];
    let msg = 'Netačno';
    if (helpOn()) msg = (range ? (k === 'od' ? 'Početak: ' : 'Kraj: ') : '') + (d < 0 ? 'kasnije' : 'ranije') + (Math.abs(d) <= 10 ? ' — blizu si (do 10 godina)' : Math.abs(d) <= 50 ? ' (manje od 50 godina)' : ' — pogrešan vek?');
    ui.why = helpOn() ? 'Tvoj odgovor ' + given + ': ' + msg + '.' : null;
    fail(z, msg, given);
  });
  nextButton(z);
}
function renderOrder(z, s) {   // stavke are authored in the right order; the pupil fills slots 1…n
  const ui = s.ui, n = z.stavke.length, done = isDone(s);
  ui.seq = ui.seq || Array(n).fill(null); ui.lock = ui.lock || {};
  const pool = shuffled(z.stavke, z.id).filter(([, i]) => !ui.seq.includes(i));
  const slots = z.stavke.map((_, p) => {
    const i = done && !ui.lock[p] ? p : ui.seq[p], it = i != null ? z.stavke[i] : null;
    const cls = ui.lock[p] ? 'lock' : done ? 'rev' : it ? 'fill' : '';
    return '<button type="button" class="slot ' + cls + '" data-p="' + p + '"' + (done || ui.lock[p] ? ' disabled' : '') + '><span class="n">' + (p + 1) + '.</span><span>' + (it ? fmt(it.tekst) : '&nbsp;') + '</span>' +
      (done && it && (it.godina != null) ? '<span class="yr">' + yrs({ godina: it.godina, od: it.godina, do: it.do }) + '</span>' : '') + '</button>';
  }).join('');
  main.innerHTML = frame(z, s, '<h2 class="q">' + fmt(z.pitanje || 'Poređaj hronološki, od najranijeg do najkasnijeg.') + '</h2><div class="ord"><div class="col"><h4>Redosled</h4>' + slots + '</div>' +
    (done ? '' : '<div class="col pool"><h4>Događaji</h4>' + (pool.map(([it, i]) => '<button type="button" class="slot fill" data-i="' + i + '"><span>' + fmt(it.tekst) + '</span></button>').join('') || '<p class="placeholder">Sve je raspoređeno — Proveri.</p>') + '</div>') + '</div>');
  if (!done) actions([['btnCheck', 'Proveri', 'ok']]);
  main.querySelectorAll('.pool [data-i]').forEach(b => b.addEventListener('click', () => { const p = ui.seq.indexOf(null); if (p >= 0) { ui.seq[p] = +b.dataset.i; save(); renderItem(false); } }));
  main.querySelectorAll('.ord .slot[data-p]').forEach(b => b.addEventListener('click', () => { const p = +b.dataset.p; if (ui.seq[p] != null && !ui.lock[p]) { ui.seq[p] = null; save(); renderItem(false); } }));
  const chk = document.getElementById('btnCheck');
  if (chk) chk.addEventListener('click', () => {
    if (ui.seq.includes(null)) { toast('Rasporedi sve događaje', false); return; }
    const given = ui.seq.map(i => z.stavke[i].tekst).join(' → ');
    let bad = 0;
    ui.seq.forEach((i, p) => { if (i === p) ui.lock[p] = true; else { bad++; ui.seq[p] = null; } });
    if (!bad) succeed(z, given); else fail(z, bad === 1 ? 'Jedan događaj nije na svom mestu' : bad + ' događaja nisu na svom mestu', given);
  });
  nextButton(z);
}
const cmpShort = z => z.a.length <= 14 && z.b.length <= 14;   // short names fit on the buttons; long ones → A / B + legend
function renderCompare(z, s) {   // tvrdnje → a | b | oba | nijedan

const P = MAPI.proj;

  const h = Math.sin(dLa / 2) ** 2 + Math.cos(a[1] * r) * Math.cos(b[1] * r) * Math.sin(dLo / 2) ** 2; return 12742 * Math.asin(Math.sqrt(h)); }

  return null;
}
function mountMap(z, s, onClick) {
  const wrap = document.getElementById('mapwrap');
  wrap.innerHTML = document.getElementById('mapTpl').innerHTML + '<div class="zbar"><button type="button" data-z="1.5">+</button><button type="button" data-z="0.667">−</button><button type="button" data-z="0">⟳</button></div><div class="zhint">Točkić / +− za zum · prevuci za pomeranje</div>';
  const svg = wrap.querySelector('svg'), marks = svg.querySelector('.marks');
  let vb = s.ui.vb || [0, 0, P.w, P.h];
  const setVB = () => { svg.setAttribute('viewBox', vb.join(' ')); s.ui.vb = vb; };
  setVB();
  function zoom(f, cx, cy) {
    if (!f) { vb = [0, 0, P.w, P.h]; setVB(); return; }
    const nw = Math.min(P.w, Math.max(P.w / 14, vb[2] / f)), nh = nw * P.h / P.w;
    cx = cx == null ? vb[0] + vb[2] / 2 : cx; cy = cy == null ? vb[1] + vb[3] / 2 : cy;
    const rx = (cx - vb[0]) / vb[2], ry = (cy - vb[1]) / vb[3];

  const svgPt = e => { const p = svg.createSVGPoint(); p.x = e.clientX; p.y = e.clientY; return p.matrixTransform(svg.getScreenCTM().inverse()); };
  wrap.querySelectorAll('.zbar button').forEach(b => b.addEventListener('click', () => zoom(+b.dataset.z)));
  svg.addEventListener('wheel', e => { e.preventDefault(); const p = svgPt(e); zoom(e.deltaY < 0 ? 1.25 : 0.8, p.x, p.y); }, { passive: false });
  let down = null;
  svg.addEventListener('pointerdown', e => { down = { x: e.clientX, y: e.clientY, vb: vb.slice(), moved: false, target: e.target }; svg.setPointerCapture(e.pointerId); });

    down.moved = true; svg.classList.add('drag');

  });

    const d = down; down = null; svg.classList.remove('drag');

    const p = svgPt(e), hit = d.target.closest && d.target.closest('path.c');

  });

    mark(x, y, color, label) { const r = vb[2] / 150; marks.insertAdjacentHTML('beforeend', '<g class="mk"><circle cx="' + x + '" cy="' + y + '" r="' + r + '" fill="' + color + '"/>' + (label ? '<text x="' + (x + r * 1.4) + '" y="' + (y + r * .5) + '" fill="' + color + '" style="font-size:' + (vb[2] / 70) + 'px">' + esc(label) + '</text>' : '') + '</g>'); },

    '<div class="iactions"><button type="button" class="ok" id="btnStart">Započni test</button></div>' +
    (fin.length ? '<h2 style="margin-top:28px">Moji testovi</h2><table class="tbl"><thead><tr><th>Datum</th><th>Ime</th><th class="num">Bodovi</th><th class="num">Ispravka</th><th></th></tr></thead><tbody>' +
      fin.map(t => '<tr><td>' + fmtDate(t.start) + '</td><td>' + esc(t.ime || '') + '</td><td class="num">' + t.score + ' / ' + t.max + '</td><td class="num">' +
        (Object.keys(t.fix).length ? testScore(t, 'fix') : '—') + '</td><td><button type="button" data-r="' + t.id + '">Pregled</button></td></tr>').join('') +
      '</tbody></table><div class="iactions"><button type="button" id="btnCsvAll">Preuzmi sve testove (CSV)</button></div>' : '') + '</div>';
  document.getElementById('btnStart').addEventListener('click', () => { startTest(document.getElementById('testIme').value.trim()); closeDrawer(); refresh(); main.scrollTop = 0; });
  main.querySelectorAll('[data-r]').forEach(b => b.addEventListener('click', () => go('r:' + b.dataset.r)));
  const all = document.getElementById('btnCsvAll'); if (all) all.addEventListener('click', () => downloadCsv(fin.slice().reverse()));
}
function questionText(z) {
  if (z.vrsta === 'tacno_netacno') return z.tvrdnja;
  if (z.vrsta === 'dopuni') return z.tekst.replace(/\{\{(.+?)\}\}/g, '____');
  if (CLUES[z.vrsta]) return (z.vrsta === 'gde_sam' ? 'Gde sam? ' : 'Ko sam? ') + z.tragovi.join(' · ');
  if (z.vrsta === 'datum') return 'Kada: ' + z.dogadjaj;
  if (z.vrsta === 'lanac') return z.karike.map((k, i) => i === z.praznina ? '?' : k).join(' → ');
  if (z.vrsta === 'izvor') return (z.izvor.autor ? z.izvor.autor + ': ' : '') + '„' + z.izvor.tekst + '” — ' + z.pitanje;
  if (z.vrsta === 'uporedi') return rowLabel(z) + ' — ' + z.tvrdnje.map(t => t.tekst).join(' / ');
  return z.pitanje || rowLabel(z);
}
function correctText(z) {
  if (['izbor', 'zakljuci', 'lanac', 'izvor', 'ko_sam'].includes(z.vrsta)) return z.odgovori.filter(o => o.tacan).map(o => o.tekst).join('; ');
  if (z.vrsta === 'datum') return yrs(z);
  if (z.vrsta === 'poredjaj') return z.stavke.map(s => s.tekst + (s.godina != null ? ' (' + (s.oznaka || fmtY(s.godina)) + ')' : '')).join(' → ');
  if (z.vrsta === 'uporedi') { const L = { a: z.a, b: z.b, oba: 'oba', nijedan: 'nijedan' }; return z.tvrdnje.map((t, i) => (i + 1) + ': ' + L[t.odgovor]).join('; '); }
  if (z.vrsta === 'objasni') return z.uzor;
  if (z.vrsta === 'tacno_netacno') return z.tacno ? 'Tačno' : 'Netačno — ' + z.ispravke.find(o => o.tacan).tekst;
  if (z.vrsta === 'dopuni') return z.tekst.replace(/\{\{(.+?)\}\}/g, (m, x) => x.split('|')[0]);
  if (z.vrsta === 'povezi') return z.parovi.map(p => p[0] + ' → ' + p[1]).join('; ');
  return z.cilj.drzava ? MAPI.drzave[z.cilj.drzava] : (MAPI.mesta[z.cilj.mesto] || {}).naziv || z.cilj.mesto;
}
const outcome = s => !s || s.status === 'open' ? 'nije rađeno' : s.status === 'ok' ? 'tačno, ' + s.pts + ' b' : '0 b';
function renderReview(t) {
  if (!t) { renderStart(); return; }
  const rows = t.items.map((z, i) => {
    const s = t.b[z.id], f = t.fix[z.id];
    const log = (s && s.log || []).map(l => '<li class="' + (l.ok ? 'ok' : 'bad') + '">' + (l.ok ? '✓ ' : '✗ ') + esc(l.v || '—') + '</li>').join('');
    return '<div class="rv"><div class="ihead"><span class="vchip">' + VRSTA_LBL[z.vrsta] + '</span>' + tzBadge(z) + '<span>' + (i + 1) + '. ' + esc(deoNaslov(z)) + '</span><span>' + outcome(s) + (f ? ' · ispravka: ' + outcome(f) : '') + '</span></div>' +
      '<p class="rq">' + fmt(questionText(z)) + '</p><p class="rl">Odgovori učenika:</p><ul class="rlog">' + (log || '<li>—</li>') + '</ul>' +
      '<p class="rc"><b>Tačan odgovor:</b> ' + fmt(correctText(z)) + '</p></div>';
  }).join('');
  main.innerHTML = '<div class="sum"><h1>Pregled rada</h1><p class="sub">' + fmtDate(t.start) + (t.ime ? ' · ' + esc(t.ime) : '') + ' · <b>' + t.score + ' / ' + t.max + '</b> bodova' +
    (Object.keys(t.fix).length ? ' · ispravka ' + testScore(t, 'fix') : '') + '</p><div class="iactions"><button type="button" id="btnCsv">Preuzmi (CSV)</button><button type="button" id="btnBack">Moji testovi</button></div>' + rows + '</div>';
  document.getElementById('btnCsv').addEventListener('click', () => downloadCsv([t]));
  document.getElementById('btnBack').addEventListener('click', () => { if (!att()) go('_start'); else go('_sum'); });
}
function downloadCsv(tests) {   // one row per item of each test: for the teacher (opens in Excel / Sheets)
  const q = v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
  const head = ['test', 'datum', 'ime', 'br', 'deo', 'vrsta', 'tezina', 'pitanje', 'odgovori_ucenika', 'tacan_odgovor', 'bodovi', 'ispravka_bodovi'];
  const lines = [head.join(',')];
  for (const t of tests) t.items.forEach((z, i) => {
    const s = t.b[z.id] || {}, f = t.fix[z.id];
    lines.push([t.id, fmtDate(t.start), t.ime, i + 1, deoNaslov(z), VRSTA_LBL[z.vrsta], TEZ_LBL[z.tezina], questionText(z),
      (s.log || []).map(l => (l.ok ? '✓ ' : '✗ ') + l.v).join(' | '), correctText(z), s.pts == null ? '' : s.pts, f && f.pts != null ? f.pts : ''].map(q).join(','));
  });
  const blob = new Blob(['﻿' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'test-' + (SPEC.slug || 'kviz') + '-' + (tests.length === 1 ? tests[0].id : 'svi') + '.csv';
  document.body.appendChild(a); a.click(); a.remove();
}
function go(id) { state.cur = id; save(); HubShell.setNav(false); if (!drawer.dataset.intro) closeDrawer(); refresh(); main.scrollTop = 0; }
function goNext() {
  const ids = listIds(), i = ids.indexOf(state.cur);
  const next = ids.slice(i + 1).concat(ids.slice(0, i)).find(id => !isDone(st(id)));
  go(next || '_sum');
}
function refresh() { renderNav(); refreshScore(); renderItem(false); }

// ---------- bar ----------
document.querySelectorAll('.ms-btn').forEach(b => b.addEventListener('click', () => {
  const m = b.dataset.mode;
  if (m === state.mode) return;
  state.mode = m;
  state.cur = m === 'test' && !att() ? '_start' : (listIds().find(id => !isDone(st(id))) || '_sum');
  closeDrawer(); save(); refresh();
}));
document.getElementById('mReset').addEventListener('click', () => {
  if (state.mode === 'ucenje') {
    if (!confirm('Počni učenje ispočetka — novi izbor zadataka?')) return;
    newLearning();
  } else {
    const a = att(); if (!a || a.end || !confirm('Odustati od ovog testa? Neće biti zabeležen.')) return;
    state.tests = state.tests.filter(t => t.id !== a.id); state.active = null; state.cur = '_start';
  }
  save(); refresh();
});
document.getElementById('mRepeat').addEventListener('click', () => {
  const rev = state.ucenje.items.filter(z => (state.ucenje.b[z.id] || {}).status === 'revealed').map(z => z.id);
  rev.forEach(id => { delete state.ucenje.b[id]; });
  if (rev.length) { state.cur = rev[0]; save(); refresh(); }
});

// ---------- init ----------
if (!state.ucenje) newLearning();
if (!byId(state.cur) && !['_sum', '_start', '_znanje', '_osa'].includes(state.cur) && !String(state.cur).startsWith('r:') && !lekRoute()) state.cur = state.mode === 'test' ? '_start' : state.ucenje.items[0].id;
refresh();
let introSeen = false; try { introSeen = localStorage.getItem(STATE_KEY + ':intro') === '1'; } catch (e) {}
if (!introSeen) showIntro();
</script>
