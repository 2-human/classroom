<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Doba prosvetiteljstva — kviz</title>
<style>

 :root{--hub-bg:#faf8f2;--hub-card:#fff;--hub-ink:#2b2b2b;--hub-head:#3a3528;--hub-mute:#6b6456;--hub-line:#e6e0d2;--hub-soft:#f3ecd8;--hub-accent:#b1271f;--hub-ok:#1f7a3a;--hub-nav-w:280px;--hub-drawer-w:440px}
 html:has(.app-body){overflow:hidden}
 .app-body{margin:0;height:100vh;height:100dvh;overflow:hidden;display:flex;flex-direction:column;max-width:100vw;background:var(--hub-bg);color:var(--hub-ink);font-family:system-ui,Segoe UI,Roboto,Arial,sans-serif}
 .app-bar{flex:0 0 auto;display:flex;align-items:center;gap:14px;padding:8px 16px;background:var(--hub-card);border-bottom:1px solid var(--hub-line);min-width:0;position:relative;z-index:50}
 .app-bar .app-menu{display:none;padding:0;width:36px;height:34px;font-size:18px;line-height:1;border:1px solid var(--hub-line);background:var(--hub-card);color:var(--hub-head);border-radius:7px;cursor:pointer}
 .app-bar .app-menu:hover{background:var(--hub-soft);color:var(--hub-head)}
 .brand{font-weight:700;font-size:15px;color:var(--hub-head);text-decoration:none;white-space:nowrap}
 .brand:hover{color:var(--hub-accent)}
 .app-crumbs{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--hub-mute);min-width:0;overflow:hidden;white-space:nowrap}
 .app-crumbs a{color:var(--hub-mute);text-decoration:none}
 .app-crumbs a:hover{color:var(--hub-accent)}
 .app-crumbs .sep{color:#b9b2a0}
 .app-crumbs .cur{color:var(--hub-head);font-weight:600;overflow:hidden;text-overflow:ellipsis}
 .bar-right{margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end;min-width:0}
 .app-grid{flex:1 1 auto;display:grid;grid-template-columns:var(--hub-nav-w) minmax(0,1fr);min-height:0}
 .app-nav{background:var(--hub-card);border-right:1px solid var(--hub-line);overflow:auto;padding:10px 10px 40px;min-height:0}
 .app-filter{width:100%;font:inherit;font-size:13px;padding:7px 9px;border:1px solid var(--hub-line);border-radius:6px;margin:0 0 4px;background:#fff;color:var(--hub-ink)}
 .app-filter:focus{outline:none;border-color:var(--hub-mute)}
 .app-nav .sec{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--hub-mute);padding:12px 6px 4px}
 .app-nav .cnt{font-size:11px;color:var(--hub-mute);font-variant-numeric:tabular-nums;letter-spacing:0;text-transform:none}
 .f-hide{display:none!important}
 .app-main{position:relative;overflow:auto;min-width:0;min-height:0;transition:margin-right .18s ease}
 .app-drawer{position:fixed;top:var(--htop,50px);right:0;bottom:0;width:var(--hub-drawer-w);max-width:100vw;background:var(--hub-card);border-left:1px solid var(--hub-line);box-shadow:-8px 0 24px rgba(58,53,40,.10);transform:translateX(105%);transition:transform .18s ease;z-index:60;display:flex;flex-direction:column}
 .app-drawer.open{transform:none}
 .drawer-head{display:flex;align-items:flex-start;gap:10px;padding:14px 16px 10px;border-bottom:1px solid var(--hub-line)}
 .drawer-head h2{margin:0;font-size:16px;color:var(--hub-head);flex:1 1 auto;overflow-wrap:anywhere}
 .app-drawer .drawer-close{border:0;background:none;padding:0 4px;font-size:24px;line-height:1;cursor:pointer;color:var(--hub-mute)}
 .app-drawer .drawer-close:hover{background:none;color:var(--hub-accent)}
 .drawer-body{flex:1 1 auto;overflow:auto;padding:12px 16px 24px;font-size:13px;line-height:1.55}
 .drawer-foot{flex:0 0 auto;border-top:1px solid var(--hub-line);padding:10px 16px;font-size:12px;color:var(--hub-mute)}
 .mtabs{display:flex;gap:2px;border-bottom:1px solid var(--hub-line);flex-wrap:wrap;background:var(--hub-card);padding:0 12px}
 .mtabs a{text-decoration:none;color:var(--hub-mute);font-size:13px;padding:9px 12px 8px;border-bottom:2px solid transparent}
 .mtabs a[aria-current="page"]{color:var(--hub-head);border-bottom-color:var(--hub-accent);font-weight:600}
 .bar-menu-wrap{position:relative}
 .bar-menu{display:none;position:absolute;right:0;top:calc(100% + 8px);z-index:70;background:var(--hub-card);border:1px solid var(--hub-line);border-radius:10px;box-shadow:0 6px 20px rgba(0,0,0,.16);padding:8px;min-width:240px}
 .bar-menu.open{display:flex;flex-direction:column;align-items:stretch;gap:6px}
 .tbl{width:100%;border-collapse:collapse;background:var(--hub-card);border:1px solid var(--hub-line);border-radius:6px;font-size:13px}
 .tbl th{text-align:left;font-weight:600;font-size:11.5px;color:var(--hub-mute);padding:8px 10px;border-bottom:1px solid var(--hub-line);background:#fcfaf4;white-space:nowrap}
 .tbl td{padding:7px 10px;border-bottom:1px solid #f0ebe0;vertical-align:top}
 .tbl td.num,.tbl th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
 .tbl tr.clk{cursor:pointer} .tbl tr.clk:hover td{background:#fbf7ec}
 @media (min-width:1200px){ .app-body:has(.app-drawer.open) .app-main{margin-right:var(--hub-drawer-w)} }
 @media (max-width:760px){
   .app-bar{gap:10px;padding:8px 12px}
   .app-bar .app-menu{display:inline-block}
   .app-crumbs{display:none}
   .app-grid{grid-template-columns:minmax(0,1fr)}
   .app-nav{position:fixed;top:var(--htop,50px);left:0;bottom:0;width:300px;max-width:88vw;z-index:55;transform:translateX(-105%);transition:transform .18s ease;box-shadow:8px 0 24px rgba(58,53,40,.10)}
   .app-nav.open{transform:none}
   .app-drawer{width:100vw}
 }
 @media print{
   html:has(.app-body){overflow:visible}
   .app-body{height:auto;overflow:visible;display:block}
   .app-grid{display:block}
   .app-main,.app-nav{overflow:visible}
   .app-drawer,.app-filter,.app-menu,.bar-menu-wrap,.mtabs{display:none!important}
 }

 .les{max-width:860px;padding:22px 28px 80px;line-height:1.6;color:#2b2b2b}
 .les h1{font-size:25px;margin:0 0 4px;color:#3a3528}
 .les .meta{color:#6b6456;font-size:13.5px;margin:0 0 6px}
 .les .meta a{color:#b1271f;text-decoration:none}
 .les section{margin:22px 0;scroll-margin-top:12px}
 .les h2{font-size:18px;color:#3a3528;margin:0 0 8px;padding-bottom:5px;border-bottom:1px solid #e6e0d2}
 .les h3{font-size:15.5px;color:#3a3528;margin:0 0 6px}
 .les section.l3{margin-left:14px;padding-left:12px;border-left:3px solid #f3ecd8}
 .les .str{font-size:12px;font-weight:400;color:#6b6456;margin-left:6px;white-space:nowrap}
 .les ul,.les ol{padding-left:22px;margin:6px 0} .les li{margin:3px 0}
 .les p{margin:6px 0}
 .les a{color:#b1271f}
 .les .pojam{border-bottom:1px dotted #b9b2a0}
 .les blockquote{margin:8px 0;padding:6px 14px;border-left:3px solid #c98a2c;background:#fefcf7}
 .les .tbl{overflow-x:auto} .les table{border-collapse:collapse;font-size:14px;margin:8px 0}
 .les th,.les td{border:1px solid #e6e0d2;padding:4px 8px;text-align:left;vertical-align:top} .les th{background:#f3ecd8}
 .strana{margin:26px 0 14px;scroll-margin-top:12px;background:#fff;border:1px solid #e6e0d2;border-radius:10px;overflow:hidden}
 .strana .pg{display:flex;justify-content:space-between;align-items:center;padding:7px 12px;font-size:12.5px;color:#6b6456;background:#fbf7ec;border-bottom:1px solid #e6e0d2}
 .strana .pg b{color:#3a3528}
 .strana .pg button{font:inherit;font-size:12px;border:1px solid #e6e0d2;background:#fff;border-radius:6px;padding:2px 9px;cursor:pointer;color:#3a3528}
 .strana img{display:block;width:100%;height:auto;cursor:zoom-in}
 .strana.zoom{overflow-x:auto} .strana.zoom img{width:auto;max-width:none;cursor:zoom-out}
 .strana.nema{padding:12px;color:#9b9387;font-size:13.5px;background:#fefcf7}
 .notes-lbl{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:#1f7a3a;margin:0 0 -12px}
 .gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin-top:8px}
 .gal figure{margin:0;background:#fff;border:1px solid #e6e0d2;border-radius:8px;overflow:hidden;scroll-margin-top:12px}
 .gal img{display:block;width:100%;height:auto} .gal figcaption{font-size:12.5px;color:#6b6456;padding:6px 9px}
 .hit{animation:hit 2.4s ease-out} @keyframes hit{0%{box-shadow:0 0 0 4px rgba(201,138,44,.55)}100%{box-shadow:0 0 0 4px rgba(201,138,44,0)}}

 :root{--ink:#2b2b2b;--muted:#6b6456;--edge:#b1271f;--accent:#1f7a3a;--border:#e6e0d2;--soft:#fefcf7;--warn:#c98a2c;
       --sea:#cfe6f2;--land:#efeae0;--land-se:#f3ecd8;--bord:#8a8170}
 *{box-sizing:border-box}
 button{font:inherit;padding:7px 14px;border:1px solid var(--edge);background:#fff;color:var(--edge);border-radius:8px;cursor:pointer}
 button:hover{background:var(--edge);color:#fff}
 button.ok{border-color:var(--accent);color:var(--accent)} button.ok:hover{background:var(--accent);color:#fff}
 button:disabled{opacity:.45;cursor:default;background:#fff;color:inherit}
 .opt:disabled,.tn button:disabled,.mcell:disabled,.blank:disabled{opacity:1;cursor:default}
 .opt:disabled:not(.right):not(.wrong){opacity:.6}
 .bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-size:14px}
 .bar-menu-btn{padding:5px 12px;font-size:16px;line-height:1;border-color:var(--muted);color:#3a3528}
 .bar-menu-btn:hover{background:#f3ecd8;color:#3a3528}
 .bar-menu button{width:100%;text-align:left}
 .bar-menu .menu-link{display:block;font-size:13px;color:var(--edge);text-decoration:none;padding:7px 14px;border:1px dashed #e6b0b0;border-radius:8px}
 .mode-switch{display:inline-flex}
 .ms-btn{padding:5px 12px;border-color:#6b6456;color:#3a3528;min-width:5.5em}
 .ms-btn:first-child{border-radius:8px 0 0 8px} .ms-btn:last-child{border-radius:0 8px 8px 0;border-left:none}
 .ms-btn:hover{background:#f3ecd8;color:#3a3528}
 .ms-btn.active{background:#3a3528;color:#fff;border-color:#3a3528}
 .stat{background:#f3ecd8;border:1px solid #e1d8c2;border-radius:8px;padding:4px 10px;white-space:nowrap}
 .stat b{font-size:15px;color:var(--accent)}
 .intro p{font-size:14px;color:#4a4434;line-height:1.6;margin:0 0 10px}
 .intro ul{margin:0 0 10px;padding-left:18px;font-size:13.5px;line-height:1.55}
 /* navigation: items */
 .it-row{display:flex;align-items:center;gap:8px;width:100%;border:0;border-radius:5px;background:none;color:var(--ink);font:inherit;font-size:13px;text-align:left;padding:5px 6px;cursor:pointer}
 .it-row:hover{background:#f6f1e4;color:var(--ink)}
 .it-row.sel{background:#efe7d2;font-weight:600}
 .it-row.off{opacity:.4}
 .it-row .st{flex:0 0 16px;text-align:center;color:#b9b2a0}
 .it-row.ok .st{color:var(--accent)} .it-row.rev .st,.it-row.fail .st{color:var(--edge)} .it-row.part .st{color:var(--warn)}
 .it-row .lbl{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
 .it-row .pt{flex:0 0 auto;font-size:11px;color:var(--muted);font-weight:400;font-variant-numeric:tabular-nums}
 .tz{flex:0 0 auto;display:inline-block;min-width:1.5em;text-align:center;font-size:10px;font-weight:700;border-radius:8px;padding:1px 5px;letter-spacing:.02em}
 .tz-lako{background:#e3f2e8;color:#1f6b3a} .tz-srednje{background:#fbefd5;color:#8a5a14} .tz-tesko{background:#f8dcd8;color:#8a2a22}
 .tz-legend{display:flex;gap:8px;flex-wrap:wrap;font-size:11px;color:var(--muted);padding:2px 6px 0}
 /* main: item */
 .item{padding:20px 24px 40px;max-width:1100px}
 .ihead{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-bottom:8px}
 .vchip{font-size:11px;text-transform:uppercase;letter-spacing:.05em;border:1px solid var(--border);border-radius:9px;padding:1px 8px;background:#fff}
 .item h2.q{font-size:18px;line-height:1.4;color:#3a3528;margin:0 0 14px}
 .opts{display:flex;flex-direction:column;gap:8px;max-width:640px}
 .opt{display:flex;gap:10px;align-items:flex-start;text-align:left;border:1px solid var(--border);background:#fff;color:var(--ink);border-radius:8px;padding:10px 12px;font-size:14.5px;line-height:1.4}
 .opt:hover{background:#fbf7ec;color:var(--ink)}
 .opt.picked{border-color:#3a3528;background:#f6f1e4}
 .opt.wrong{border-color:#e6b0b0;background:#fdecec;color:#8a2a22} .opt.wrong .ot{text-decoration:line-through}
 .opt.right{border-color:#9fd5b6;background:#e8f5ec;color:#13602c;font-weight:600}
 .opt .box{flex:0 0 18px;height:18px;border:1.5px solid #6b6456;border-radius:4px;margin-top:1px}
 .opt.picked .box{background:#3a3528;box-shadow:inset 0 0 0 3px #fff}
 .opt.round .box{border-radius:50%}
 .tn{display:flex;gap:12px;margin:4px 0 14px}
 .tn button{min-width:8em;padding:10px 18px;font-size:15px}
 .tn button.right{background:var(--accent);border-color:var(--accent);color:#fff}
 .tn button.wrong{background:#fdecec;border-color:#e6b0b0;color:#8a2a22}
 .stmt{font-size:16px;line-height:1.5;border-left:3px solid #e1d8c2;padding:6px 12px;margin:0 0 14px;background:#fff}
 .sub-q{font-weight:600;color:#3a3528;margin:16px 0 8px}
 .cloze{font-size:16px;line-height:2.3;max-width:720px}
 .blank{display:inline-block;min-width:5.5em;border:0;border-bottom:2px solid #6b6456;background:#fff;text-align:center;font:inherit;font-weight:600;color:#3a3528;padding:0 6px;margin:0 3px;border-radius:4px 4px 0 0;cursor:pointer}
 input.blank{cursor:text;width:7em}
 .blank:hover{background:#fbf7ec;color:#3a3528}
 .blank.cur{border-bottom-color:var(--edge);background:#fff7f3}
 .blank.lock{border-bottom-color:var(--accent);background:#e8f5ec;color:#13602c;cursor:default}
 .blank.bad{border-bottom-color:var(--edge);background:#fdecec;color:#8a2a22}
 .blank.rev{border-bottom-color:var(--warn);background:#fdf3e2;color:#8a5a14}
 .bank{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 0}
 .bank button{padding:5px 12px;border-color:#6b6456;color:#3a3528;border-radius:16px}
 .bank button:hover{background:#f3ecd8;color:#3a3528}
 .bank button.used{opacity:.3;pointer-events:none}
 .match{display:grid;grid-template-columns:1fr 1fr;gap:10px 28px;max-width:720px}
 .match .col{display:flex;flex-direction:column;gap:8px}
 .mcell{text-align:left;border:1px solid var(--border);background:#fff;color:var(--ink);border-radius:8px;padding:9px 12px;font-size:14px}
 .mcell:hover{background:#fbf7ec;color:var(--ink)}
 .mcell.cur{border-color:#3a3528;box-shadow:0 0 0 2px rgba(58,53,40,.15)}
 .mcell.done{border-color:#9fd5b6;background:#e8f5ec;color:#13602c;cursor:default}
 .mcell.rev{border-color:#ecc98a;background:#fdf3e2;color:#8a5a14;cursor:default}
 .mcell.bad{animation:shake .3s;border-color:#e6b0b0;background:#fdecec}
 .mcell .n{display:inline-block;min-width:1.4em;font-weight:700;margin-right:6px;color:var(--muted)}
 @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
 .iactions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:18px}
 .fb{font-size:14px;font-weight:600;min-height:1.4em}
 .fb.ok{color:var(--accent)} .fb.bad{color:var(--edge)} .fb.info{color:var(--muted);font-weight:400}
 .expl{margin-top:14px;padding:10px 14px;border-radius:8px;background:#e8f5ec;border:1px solid #bfe0c8;color:#13602c;font-size:14px;line-height:1.5;max-width:720px}
 .expl.rev{background:#fdf3e2;border-color:#f0d878;color:#6b4a10}
 .help-inline{display:none}
 /* map */
 .mapwrap{position:relative;margin-top:6px;border:1px solid var(--border);border-radius:8px;overflow:hidden;background:var(--sea);aspect-ratio:1/1;max-height:70vh;touch-action:none}
 .mapwrap svg{width:100%;height:100%;display:block;cursor:crosshair}
 .mapwrap svg.drag{cursor:grabbing}
 .mapwrap .c{fill:var(--land);stroke:var(--bord);stroke-width:.6;vector-effect:non-scaling-stroke}
 .mapwrap .c.se{fill:var(--land-se)}
 .mapwrap .c.se:hover{fill:#e9dcb8}
 .mapwrap .c.hit{fill:#bfe0c8} .mapwrap .c.miss{fill:#f3c9c4} .mapwrap .c.revc{fill:#f6dca6}
 .mapwrap .mk{pointer-events:none}
 .mapwrap .mk circle{stroke:#fff;vector-effect:non-scaling-stroke}
 .mapwrap .mk text{font-size:13px;font-weight:700;paint-order:stroke;stroke:#fff;stroke-width:3px;vector-effect:non-scaling-stroke}
 .zbar{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px}
 .zbar button{width:36px;height:36px;padding:0;font-size:18px;font-weight:700;background:#fff;border-color:#6b6456;color:#3a3528;box-shadow:0 1px 3px rgba(0,0,0,.2)}
 .zbar button:hover{background:#f3ecd8;color:#3a3528}
 .zhint{position:absolute;left:10px;bottom:8px;font-size:11.5px;color:var(--muted);background:rgba(255,255,255,.85);border-radius:6px;padding:3px 8px;pointer-events:none}
 .clues{list-style:none;margin:0 0 6px;padding:0;max-width:720px}
 .clues li{padding:7px 10px;margin:0 0 6px;border-left:3px solid #e1d8c2;background:#fff;font-size:14.5px;line-height:1.45}
 .clues li:last-child{border-left-color:var(--edge)}
 .clues .k{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-right:6px}
 /* drawer content */
 .hl h3{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:14px 0 6px}
 .hl ol{margin:0;padding-left:20px} .hl li{margin:0 0 10px;line-height:1.5}
 .hl li.new{animation:flash 1.2s}
 @keyframes flash{0%{background:#fff3c4}100%{background:transparent}}
 .hl .placeholder{color:#9b9387;font-style:italic}
 .hl .chips{display:flex;flex-wrap:wrap;gap:6px}
 .hl .pchip{font-size:12px;border:1px solid var(--border);border-radius:10px;padding:1px 9px;background:#fefcf7}
 .hl a{color:var(--edge);text-decoration:none}
 .hl ul{margin:0;padding-left:18px} .hl ul li{margin:3px 0}
 .hl .ref{font-size:12px;color:var(--muted);margin:0 0 6px}
 .hl figure{margin:6px 0 10px} .hl figure img{display:block;max-width:100%;border-radius:6px;border:1px solid var(--border)}
 .qfig{margin:16px 0 0;max-width:720px} .qfig img{display:block;max-width:100%;max-height:62vh;border-radius:8px;border:1px solid var(--border);cursor:zoom-in}
 .qfig.zoom{max-width:none;overflow-x:auto} .qfig.zoom img{max-width:none;max-height:none;cursor:zoom-out}
 .qfig figcaption{font-size:12.5px;color:var(--muted);margin-top:5px}
 .hl figcaption{font-size:11.5px;color:var(--muted);margin-top:4px}
 .hl .book{border-left:3px solid #e1d8c2;padding:2px 0 2px 12px;margin:6px 0 4px}
 .hl .odeljak{margin:10px 0 4px;padding:8px 12px;background:#fefcf7;border:1px solid #e6e0d2;border-radius:8px;font-size:14px;line-height:1.5}
 .hl .odeljak summary{cursor:pointer;font-weight:600;color:#3a3528;font-size:13px}
 .hl .odeljak ul,.hl .odeljak ol{padding-left:20px;margin:6px 0} .hl .odeljak li{margin:3px 0} .hl .odeljak p{margin:6px 0}
 .hl .odeljak table{border-collapse:collapse;font-size:13px} .hl .odeljak th,.hl .odeljak td{border:1px solid #e6e0d2;padding:3px 6px}
 .hl .tekst-links{display:flex;flex-wrap:wrap;gap:6px 14px;margin:8px 0 4px;font-size:13.5px}
 .hl .tekst-links a{color:var(--edge);font-weight:600;text-decoration:none}
 /* the lesson (protected copy): main column via the nav, or one part of it in the wide drawer */
 .app-drawer.wide{width:min(820px,100vw)}
 .app-drawer .les{padding:0;max-width:none}
 .app-drawer .les section,.app-drawer .les .strana{margin:0 0 16px}
 .lekbar{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}
 .lekbar button{font-size:13px;padding:6px 12px}
 /* summary */
 .sum{padding:22px 26px 40px;max-width:860px}
 .sum h1{font-size:22px;margin:0 0 6px;color:#3a3528}
 .sum .big{font-size:30px;font-weight:700;color:var(--accent)}
 .sum .tbl{margin:14px 0}

<script>
(function () {
  const root = document.documentElement;
  const bar = document.querySelector('.app-bar');
  function setTop() { if (bar) root.style.setProperty('--htop', bar.offsetHeight + 'px'); }
  window.addEventListener('resize', setTop);
  setTop();

  // ☰ navigation (only shown at ≤760px)
  const nav = document.getElementById('app-nav');
  const navBtn = document.getElementById('app-menu');
  const navOverlay = () => window.matchMedia && window.matchMedia('(max-width:760px)').matches;
  function setNav(open) {
    if (!nav) return;
    nav.classList.toggle('open', !!open);
    if (navBtn) navBtn.setAttribute('aria-expanded', String(!!open));
  }
  if (navBtn) navBtn.addEventListener('click', e => { e.stopPropagation(); setNav(!nav.classList.contains('open')); });

  // navigation filter: case- and diacritic-insensitive (š, č, ć, ž, đ)
  const filter = document.getElementById('app-filter');
  const norm = s => String(s || '').toLowerCase().replace(/đ/g, 'd').normalize('NFD').replace(/[̀-ͯ]/g, '');
  function applyFilter() {
    const q = norm(filter.value.trim());
    document.querySelectorAll('#app-nav [data-filter]').forEach(el =>
      el.classList.toggle('f-hide', !!q && !norm(el.dataset.filter).includes(q)));
    document.querySelectorAll('#app-nav [data-filter-group]').forEach(g =>
      g.classList.toggle('f-hide', !!q && !g.querySelector('[data-filter]:not(.f-hide)')));
  }
  if (filter) filter.addEventListener('input', applyFilter);

  // ⋯ menus: a button with data-menu="<id>" toggles .bar-menu#<id>; a button inside closes it
  function setMenu(m, open) {
    m.classList.toggle('open', !!open);
    const b = document.querySelector('[data-menu="' + m.id + '"]');
    if (b) b.setAttribute('aria-expanded', String(!!open));
  }
  document.querySelectorAll('[data-menu]').forEach(btn => {
    const m = document.getElementById(btn.dataset.menu);
    if (!m) return;
    btn.addEventListener('click', e => { e.stopPropagation(); setMenu(m, !m.classList.contains('open')); });
    m.addEventListener('click', e => { e.stopPropagation(); if (e.target.closest('button')) setMenu(m, false); });
  });
  document.addEventListener('click', e => {
    // composedPath: the clicked node may already be re-rendered away (e.g. a step's "next" button)
    if (!e.composedPath().some(n => n.dataset && n.dataset.keepMenus)) document.querySelectorAll('.bar-menu.open').forEach(m => setMenu(m, false));
    if (nav && nav.classList.contains('open') && navOverlay() && !nav.contains(e.target)) setNav(false);
  });
  document.addEventListener('keydown', e => {
    if (e.key !== 'Escape') return;
    document.querySelectorAll('.bar-menu.open').forEach(m => setMenu(m, false));
    const x = document.querySelector('.app-drawer.open .drawer-close');
    if (x && x.offsetParent !== null) x.click();
  });

  window.HubShell = { setNav, setMenu, applyFilter, navOverlay };
})();
</script>

"Švajcarska", "tacan": true}, {"tekst": "Holandija", "tacan": true}, {"tekst": "Velika Britanija", "tacan": false, "zasto": "Velika Britanija je bila monarhija — doduše ne apsolutistička, nego sa parlamentom."}, {"tekst": "Pruska", "tacan": false, "zasto": "Pruska je bila kraljevina kojom je apsolutistički vladao Fridrih II."}], "pomoc": ["Republike su bile samo manje države.", "Dve od njih su italijanski primorski gradovi-države.", "Iz lekcije: republike su bile Venecija, Đenova, Švajcarska i Holandija."], "objasnjenje": "Republikansko uređenje imale su samo manje države — Venecija, Đenova, Švajcarska i Holandija.", "iz_udzbenika": {"strana": 34, "odeljak": "Uvod — Evropa oko 1780.", "tekst": "Samo manje države, Venecija, Đenova, Švajcarska i Holandija, imale su republikansko uređenje.", "slika": "04-doba-prosvetiteljstva/01-karta-evrope-1780.jpg"}}, {"id": "evr-izbor-apsolutisticke", "vrsta": "izbor", "slika_u_pitanju": true, "tezina": "tesko", "pojmovi": ["apsolutisticka-monarhija", "francuska", "rusija", "osmansko-carstvo", "holandija", "velika-britanija"], "pitanje": "Koje su od navedenih država na karti Evrope oko 1780. bile apsolutističke monarhije? (više tačnih)", "odgovori": [{"tekst": "Francuska", "tacan": true}, {"tekst": "Rusija", "tacan": true}, {"tekst": "Osmansko carstvo", "tacan": true}, {"tekst": "Habzburška monarhija", "tacan": true}, {"tekst": "Holandija", "tacan": false, "zasto": "Holandija je bila republika — jedna od manjih država bez monarha."}, {"tekst": "Venecija", "tacan": false, "zasto": "Venecija je bila republika."}, {"tekst": "Velika Britanija", "tacan": false, "zasto": "Velika Britanija je jedina sila koja nije bila apsolutistička — imala je parlament."}], "pomoc": ["Pravilo iz lekcije: sve velike sile, osim jedne, bile su apsolutističke.", "Izbaci manje države sa republikanskim uređenjem i silu sa parlamentom.", "Iz lekcije: osim Velike Britanije sve sile su apsolutističke; Venecija, Đenova, Švajcarska i Holandija su republike."], "objasnjenje": "Velike sile (Francuska, Rusija, Habzburška monarhija, Osmansko carstvo, Pruska, Španija…) bile su apsolutističke; izuzetak je Velika Britanija, a republike su bile manje države.", "iz_udzbenika": {"strana": 34, "odeljak": "Uvod — Evropa oko 1780.", "tekst": "Udžbenik traži da na karti pokažeš apsolutističke monarhije — to su sve sile osim Velike Britanije.", "slika": "04-doba-prosvetiteljstva/01-karta-evrope-1780.jpg"}}, {"id": "evr-tn-monarhije", "vrsta": "tacno_netacno", "tezina": "lako", "pojmovi": ["apsolutisticka-monarhija", "republika"], "tvrdnja": "Sredinom XVIII veka većina evropskih država bile su monarhije.", "tacno": true, "pomoc": ["Pogledaj kartu: koliko je republika, a koliko kraljevina i carstava?", "Iz lekcije: republike su bile samo nekoliko manjih država."], "objasnjenje": "Tačno — monarhije su bile pravilo, a republike retke i male (Venecija, Đenova, Švajcarska, Holandija).", "iz_udzbenika": {"strana": 34, "odeljak": "Uvod — Evropa oko 1780.", "tekst": "Sredinom XVIII veka većina evropskih država imala je monarhijsko uređenje."}}, {"id": "evr-tn-velike-republike", "vrsta": "tacno_netacno", "tezina": "srednje", "pojmovi": ["republika", "venecija", "holandija"], "tvrdnja": "Republike su sredinom XVIII veka bile najveće i najmoćnije evropske države.", "tacno": false, "ispravke": [{"tekst": "Republike su bile samo manje države — Venecija, Đenova, Švajcarska i Holandija.", "tacan": true}, {"tekst": "Jedina republika bila je Velika Britanija.", "tacan": false, "zasto": "Velika Britanija je bila monarhija sa parlamentom, a ne republika."}, {"tekst": "Republika je bila Francuska, zahvaljujući prosvetiteljima.", "tacan": false, "zasto": "Francuska je bila apsolutistička monarhija; prosvetitelji su je kritikovali, ali je uređenje ostalo isto."}], "pomoc": ["Seti se koje su države bile republike.", "Jesu li Venecija ili Švajcarska bile velike sile?", "Iz lekcije: republikansko uređenje imale su samo manje države."], "objasnjenje": "Netačno — sve velike sile bile su monarhije; republike su bile male države.", "iz_udzbenika": {"strana": 34, "odeljak": "Uvod — Evropa oko 1780.", "tekst": "Samo manje države, Venecija, Đenova, Švajcarska i Holandija, bile su republike."}}, {"id": "evr-datum-karta", "vrsta": "datum", "slika_u_pitanju": true, "tezina": "lako", "pojmovi": ["prosveceni-apsolutizam"], "dogadjaj": "Karta Evrope oko 1780.", "pitanje": "Oko koje godine je prikazana Evropa na karti na početku lekcije?", "godina": 1780, "traka": "dogadjaji", "pomoc": ["Na karti su krunom označeni Fridrih II, Josif II i Katarina II — svi su tada na prestolu.", "Josif II je počeo da vlada sam baš te godine.", "Iz lekcije: karta prikazuje Evropu oko 1780."], "objasnjenje": "Karta prikazuje Evropu oko 1780. — tada vladaju Fridrih II, Josif II i Katarina II.", "iz_udzbenika": {"strana": 34, "odeljak": "Uvod — karta", "tekst": "Karta Evrope oko 1780. krunom označava vladare prosvećenog apsolutizma.", "slika": "04-doba-prosvetiteljstva/01-karta-evrope-1780.jpg"}}, {"id": "evr-povezi-vladari", "vrsta": "povezi", "tezina": "lako", "pojmovi": ["fridrih-ii-veliki", "josif-ii", "katarina-ii-velika", "monteskje"], "pitanje": "Poveži ličnost sa državom u kojoj je delovala.", "parovi": [["Fridrih II Veliki", "Pruska"], ["Josif II", "Habzburška monarhija"], ["Katarina II Velika", "Rusija"], ["Monteskje", "Francuska"]], "pomoc": ["Trojica vladara su označena krunom na karti.", "Prosvetitelji su delovali u Francuskoj.", "Iz lekcije: Fridrih II — Pruska, Josif II — Habzburška monarhija, Katarina II — Rusija."], "objasnjenje": "Fridrih II je pruski kralj, Josif II habzburški car, Katarina II ruska carica, a Monteskje francuski prosvetitelj.", "iz_udzbenika": {"strana": 34, "odeljak": "Uvod — karta", "tekst": "Na karti su krunom označeni Fridrih II u Pruskoj, Josif II u Habzburškoj monarhiji i Katarina II u Rusiji.", "slika": "04-doba-prosvetiteljstva/01-karta-evrope-1780.jpg"}}, {"id": "evr-dopuni-krune", "vrsta": "dopuni", "slika_u_pitanju": true, "tezina": "lako", "pojmovi": ["fridrih-ii-veliki", "josif-ii", "katarina-ii-velika", "prosveceni-apsolutizam"], "pitanje": "Dopuni rečenicu imenima vladara označenih krunom na karti.", "tekst": "Oko 1780. vladari prosvećenog apsolutizma bili su {{Fridrih II}} u Pruskoj, {{Josif II}} u Habzburškoj monarhiji i {{Katarina II}} u Rusiji.", "ponudjene": ["Fridrih II", "Josif II", "Katarina II", "Petar I", "Karlo VI"], "pomoc": ["Petar I je umro mnogo ranije, 1725.", "Karlo VI je otac Marije Terezije.", "Iz lekcije: Fridrih II (Pruska), Josif II (Habzburška monarhija), Katarina II (Rusija)."], "objasnjenje": "Krunom su na karti označeni Fridrih II, Josif II i Katarina II.", "iz_udzbenika": {"strana": 34, "odeljak": "Uvod — karta", "tekst": "Na karti Evrope oko 1780. krunom su označeni vladari prosvećenog apsolutizma.", "slika": "04-doba-prosvetiteljstva/01-karta-evrope-1780.jpg"}}, {"id": "evr-izvor-karta", "vrsta": "izvor", "slika_u_pitanju": true, "tezina": "srednje", "pojmovi": ["prosveceni-apsolutizam", "fridrih-ii-veliki", "josif-ii", "katarina-ii-velika"], "izvor": {"autor": "Karta iz udžbenika", "naslov": "Evropa oko 1780. (opis karte)", "tekst": "Na političkoj karti Evrope oko 1780. krunom su označena tri vladara: Fridrih II (1740–1786) u Pruskoj, Josif II (1780–1790) u Habzburškoj monarhiji i Katarina II (1762–1796) u Rusiji.", "napomena": "Odlomak je prepričan; udžbenik, str. 34."}, "pitanje": "Šta je zajedničko vladarima koje karta označava krunom?", "odgovori": [{"tekst": "Svi su bili vladari prosvećenog apsolutizma", "tacan": true}, {"tekst": "Svi su vladali istom državom", "tacan": false, "zasto": "Svako je vladao drugom državom — Pruskom, Habzburškom monarhijom i Rusijom."}, {"tekst": "Svi su bili iz dinastije Habzburg", "tacan": false, "zasto": "Samo je Josif II Habzburg; Fridrih II je iz dinastije Hoencolern."}, {"tekst": "Svi su bili izabrani predsednici republika", "tacan": false, "zasto": "Bili su monarsi sa neograničenom vlašću — republike su bile samo male države."}], "pomoc": ["Pogledaj naslov lekcije i šta karta ističe.", "Sva trojica su sprovodila reforme koristeći neograničenu vlast.", "Iz lekcije: krunom su označeni vladari prosvećenog apsolutizma."], "objasnjenje": "Kruna na karti označava vladare prosvećenog apsolutizma — monarhe koji su, sa neograničenom vlašću, uvodili reforme po idejama prosvetitelja.", "iz_udzbenika": {"strana": 34, "odeljak": "Uvod — karta", "tekst": "Karta Evrope oko 1780. krunom označava Fridriha II, Josifa II i Katarinu II.", "slika": "04-doba-prosvetiteljstva/01-karta-evrope-1780.jpg"}, "osa": {"naziv": "Karta Evrope oko 1780.", "od": 1780, "traka": "dogadjaji"}}, {"id": "evr-zakljuci-josif-na-karti", "vrsta": "zakljuci", "slika_u_pitanju": true, "tezina": "srednje", "pojmovi": ["josif-ii", "marija-terezija", "habzburska-monarhija"], "pitanje": "Zašto je na karti oko 1780. krunom označen Josif II, a ne Marija Terezija, iako je i ona sprovodila reforme?", "odgovori": [{"tekst": "Marija Terezija je vladala do 1780. godine, a tada je presto preuzeo njen sin Josif II", "tacan": true}, {"tekst": "Marija Terezija nije bila habzburška vladarka", "tacan": false, "zasto": "Bila je — i to prva žena na habzburškom prestolu (1740–1780)."}, {"tekst": "Žene u Habzburškoj monarhiji nisu smele da nasleđuju presto", "tacan": false, "zasto": "Karlo VI je doneo akt po kome i ženski potomci mogu da naslede presto — zato je Marija Terezija vladala."}, {"tekst": "Marija Terezija nije sprovodila nikakve reforme", "tacan": false, "zasto": "Sprovela je mnogo reformi — porezi, vojska, školstvo, zdravstvo, nadzor nad crkvom."}], "pomoc": ["Korak 1: Do koje godine je vladala Marija Terezija?", "Korak 2: Ko je nasledio presto te godine?", "Iz lekcije: Marija Terezija (1740–1780), Josif II (1780–1790)."], "objasnjenje": "Karta prikazuje stanje oko 1780 — tada se vladavina Marije Terezije završava i počinje vladavina Josifa II.", "iz_udzbenika": {"strana": 34, "odeljak": "Uvod — karta; Habzburška monarhija", "tekst": "Na karti je za Habzburšku monarhiju označen Josif II (1780–1790), sin i naslednik Marije Terezije (1740–1780).", "slika": "04-doba-prosvetiteljstva/01-karta-evrope-1780.jpg"}, "osa": {"naziv": "Josif II", "od": 1780, "do": 1790, "traka": "vladari"}}, {"id": "evr-zakljuci-engleska", "vrsta": "zakljuci", "tezina": "tesko", "pojmovi": ["velika-britanija", "monteskje", "parlamentarna-monarhija", "apsolutizam"], "pitanje": "Monteskje je predlagao uređenje „po engleskom uzoru”. Šta je Englesku (Veliku Britaniju) izdvajalo od drugih velikih sila na karti?", "odgovori": [{"tekst": "Bila je jedina velika sila koja nije bila apsolutistička monarhija", "tacan": true}, {"tekst": "Bila je republika", "tacan": false, "zasto": "Bila je monarhija, ali sa parlamentom — zato Monteskje govori o parlamentarnoj monarhiji."}, {"tekst": "Njen vladar je na karti označen krunom kao prosvećeni apsolutista", "tacan": false, "zasto": "Krunom su označeni samo Fridrih II, Josif II i Katarina II."}, {"tekst": "Bila je najveće carstvo u Evropi", "tacan": false, "zasto": "Lekcija o tome ne govori; prostrano carstvo je bila Rusija. Razlika je u uređenju, ne u veličini."}], "pomoc": ["Korak 1: Šta je Monteskje kritikovao kod francuskih kraljeva?", "Korak 2: Koja sila je jedina izuzetak od tog uređenja?", "Iz lekcije: osim Velike Britanije sve sile su apsolutističke; Monteskje je za parlamentarnu monarhiju po engleskom uzoru."], "objasnjenje": "Monteskje kritikuje apsolutizam, a Engleska je jedina velika sila koja nije apsolutistička — vlast kralja ograničava parlament. Zato mu je ona uzor.", "iz_udzbenika": {"strana": 34, "odeljak": "Uvod; Prosvetiteljstvo", "tekst": "Velika Britanija je jedina sila koja nije apsolutistička monarhija; Monteskje traži parlamentarnu monarhiju po engleskom uzoru."}}, {"id": "evr-uporedi-monarhija-republika", "vrsta": "uporedi", "tezina": "lako", "pojmovi": ["republika", "apsolutisticka-monarhija", "ruso", "volter"], "a": "Monarhija", "b": "Republika", "pitanje": "Na koje uređenje se odnosi tvrdnja — monarhiju, republiku, oba ili nijedno?", "tvrdnje": [{"tekst": "Na čelu je vladar koji vlast nasleđuje i drži doživotno.", "odgovor": "a", "zasto": "To je monarhija; u republici građani biraju vlast."}, {"tekst": "Građani biraju vlast na određeno vreme.", "odgovor": "b", "zasto": "To je odlika republike."}, {"tekst": "Ovakvo uređenje imale su Venecija i Holandija.", "odgovor": "b", "zasto": "Venecija, Đenova, Švajcarska i Holandija bile su republike."}, {"tekst": "Ovakvo uređenje imale su sve velike sile sredinom XVIII veka.", "odgovor": "a", "zasto": "Sve velike sile bile su monarhije — sve osim Velike Britanije čak apsolutističke."}, {"tekst": "Ruso ga je smatrao najboljim uređenjem.", "odgovor": "b", "zasto": "Ruso: zakoni samo uz odobrenje naroda, pa je republika najbolja."}, {"tekst": "Postojalo je u Evropi sredinom XVIII veka.", "odgovor": "oba", "zasto": "Bilo je i monarhija (većina) i republika (manje države)."}], "pomoc": ["Ko je na čelu — naslednik ili izabrani?", "Velike sile su monarhije, male države republike.", "Iz lekcije: u monarhiji vlast se nasleđuje, u republici je biraju građani na određeno vreme."], "objasnjenje": "Monarhija = naslednji vladar (sve velike sile); republika = vlast izabrana na određeno vreme (Venecija, Đenova, Švajcarska, Holandija; Rusoov ideal).", "iz_udzbenika": {"strana": 34, "odeljak": "Okvir — Podseti se", "tekst": "Udžbenik traži da se podsetiš glavnih razlika između republike i monarhije."}}, {"id": "evr-poredjaj-krune", "vrsta": "poredjaj", "slika_u_pitanju": true, "tezina": "srednje", "pojmovi": ["fridrih-ii-veliki", "katarina-ii-velika", "josif-ii"], "pitanje": "Poređaj vladare sa karte po tome kada su počeli da vladaju, od najranijeg.", "stavke": [{"tekst": "Fridrih II Veliki postaje pruski kralj", "godina": 1740, "do": 1786, "naziv": "Fridrih II Veliki", "traka": "vladari"}, {"tekst": "Katarina II Velika postaje ruska carica", "godina": 1762, "do": 1796, "naziv": "Katarina II Velika", "traka": "vladari"}, {"tekst": "Josif II nasleđuje majku Mariju Tereziju", "godina": 1780, "do": 1790, "naziv": "Josif II", "traka": "vladari"}], "pomoc": ["Jedan od njih je počeo iste godine kao Marija Terezija.", "Josif II je počeo tek kad mu je majka prestala da vlada.", "Iz lekcije: Fridrih II 1740, Katarina II 1762, Josif II 1780."], "objasnjenje": "Fridrih II (1740) → Katarina II (1762) → Josif II (1780). Oko 1780. sva trojica su na prestolu.", "iz_udzbenika": {"strana": 34, "odeljak": "Uvod — karta", "tekst": "Uz krune na karti stoje godine vladavine: Fridrih II 1740–1786, Katarina II 1762–1796, Josif II 1780–1790.", "slika": "04-doba-prosvetiteljstva/01-karta-evrope-1780.jpg"}}, {"id": "evr-objasni-monarhija-republika", "vrsta": "objasni", "tezina": "lako", "pojmovi": ["republika", "apsolutisticka-monarhija"], "pitanje": "Koja je glavna razlika između monarhije i republike? Objasni svojim rečima.", "uzor": "U monarhiji na čelu države je vladar koji vlast nasleđuje i drži je doživotno. U republici vlast biraju građani i to na određeno vreme. Sredinom XVIII veka velike sile su bile monarhije, a republike samo manje države.", "ideje": ["U monarhiji se vlast nasleđuje.", "Vladar vlada doživotno.", "U republici građani biraju vlast na određeno vreme."], "objasnjenje": "Ključna razlika je kako se dolazi na vlast — nasleđem (monarhija) ili izborom (republika).", "iz_udzbenika": {"strana": 34, "odeljak": "Okvir — Podseti se", "tekst": "Udžbenik traži da se podsetiš glavnih razlika između republike i monarhije."}}]}, {"naslov": "Prosvetiteljstvo i prosvetitelji", "zadaci": [{"id": "pros-izbor-uzrok-nedaca", "vrsta": "izbor", "tezina": "lako", "pojmovi": ["prosvetiteljstvo", "prosvetitelji"], "pitanje": "Šta su prosvetitelji smatrali glavnim uzrokom svih nedaća u društvu?", "odgovori": [{"tekst": "Neobrazovanost naroda", "tacan": true}, {"tekst": "Previše nauke i knjiga", "tacan": false, "zasto": "Upravo suprotno — prosvetitelji su verovali da nauka i razum mogu da poprave svet."}, {"tekst": "Slabu vojsku", "tacan": false, "zasto": "Vojska je bila briga vladara poput Fridriha II; prosvetitelji su govorili o znanju i razumu."}, {"tekst": "Industrijske mašine", "tacan": false, "zasto": "Industrijska revolucija je druga tema; prosvetitelji su kritikovali neznanje, praznoverje i nepravedno uređenje."}], "pomoc": ["Setite se odakle dolazi sam naziv „prosvetitelji”.", "Narod je trebalo „prosvetliti” — čime?", "Iz lekcije: uzrok svih nedaća videli su u neobrazovanosti; narod treba prosvetliti znanjem."], "objasnjenje": "Prosvetitelji su verovali da je neznanje izvor nedaća, pa narod treba „prosvetliti” znanjem — odatle i njihovo ime.", "iz_udzbenika": {"strana": 34, "odeljak": "Prosvetiteljstvo", "tekst": "Francuski filozofi, književnici i naučnici XVIII veka zalagali su se za vladavinu razuma nad neznanjem i praznoverjem; neobrazovanost su smatrali glavnim uzrokom nedaća."}}, {"id": "pros-izbor-zemlja", "vrsta": "izbor", "tezina": "lako", "pojmovi": ["prosvetitelji", "francuska"], "pitanje": "U kojoj zemlji su se u XVIII veku pojavili filozofi, književnici i naučnici nazvani prosvetiteljima?", "odgovori": [{"tekst": "U Francuskoj", "tacan": true}, {"tekst": "U Rusiji", "tacan": false, "zasto": "Ruska carica Katarina II se dopisivala s Volterom, ali pokret je nastao u Francuskoj."}, {"tekst": "U Pruskoj", "tacan": false, "zasto": "Volter je boravio na dvoru Fridriha II, ali prosvetitelji su bili Francuzi."}, {"tekst": "U Velikoj Britaniji", "tacan": false, "zasto": "Monteskje je Englesku uzimao za uzor, ali prosvetiteljstvo se javlja u Francuskoj."}], "pomoc": ["Volter, Monteskje i Ruso su pisali na istom jeziku.", "Enciklopedija je izlazila u Parizu.", "Iz lekcije: u Francuskoj se u XVIII veku javljaju prosvetitelji."], "objasnjenje": "Prosvetiteljstvo je nastalo u Francuskoj u XVIII veku, a odatle su se ideje širile Evropom.", "iz_udzbenika": {"strana": 34, "odeljak": "Prosvetiteljstvo", "tekst": "U XVIII veku u Francuskoj se pojavljuju filozofi, književnici i naučnici koji kritikuju postojeće uređenje."}}, {"id": "pros-izbor-kritika", "vrsta": "izbor", "tezina": "srednje", "pojmovi": ["prosvetiteljstvo", "feudalizam", "apsolutizam", "svestenstvo"], "pitanje": "Šta su prosvetitelji kritikovali? (više tačnih)", "odgovori": [{"tekst": "Feudalno uređenje", "tacan": true}, {"tekst": "Apsolutizam vladara", "tacan": true}, {"tekst": "Svemoćni uticaj crkve", "tacan": true}, {"tekst": "Nauku i istraživanje", "tacan": false, "zasto": "Prosvetitelji su verovali da nauka može da promeni svet na bolje — nauku su zagovarali."}, {"tekst": "Obrazovanje naroda", "tacan": false, "zasto": "Upravo su tražili da se narod obrazuje, jer su neznanje smatrali uzrokom nedaća."}], "pomoc": ["Kritikovali su uređenje države, vlast i crkvu.", "Nauku i znanje su, naprotiv, hvalili.", "Iz lekcije: kritikovali su feudalizam, apsolutizam i svemoćni uticaj crkve."], "objasnjenje": "Prosvetitelji su napadali feudalno uređenje, apsolutizam i moć crkve, a zagovarali razum, nauku i obrazovanje.", "iz_udzbenika": {"strana": 34, "odeljak": "Prosvetiteljstvo", "tekst": "Prosvetitelji su kritikovali feudalno uređenje, apsolutizam vladara i svemoćni uticaj crkve."}}, {"id": "pros-tn-ime", "vrsta": "tacno_netacno", "tezina": "srednje", "pojmovi": ["prosvetitelji", "prosvetiteljstvo"], "tvrdnja": "Prosvetitelji su dobili ime zato što su svi radili kao učitelji u školama.", "tacno": false, "ispravke": [{"tekst": "Ime dolazi od ideje da narod treba „prosvetliti” znanjem, jer su neznanje smatrali uzrokom nedaća.", "tacan": true}, {"tekst": "Ime im je dala crkva, jer su bili sveštenici.", "tacan": false, "zasto": "Prosvetitelji su kritikovali crkvu i sveštenstvo — nisu bili njeni ljudi."}, {"tekst": "Ime su dobili po Enciklopediji, koja se zvala Prosveta.", "tacan": false, "zasto": "Enciklopedija je bila njihovo delo, ali ime dolazi od „prosvetliti” narod."}], "pomoc": ["Ime je povezano sa svetlom — šta je trebalo „osvetliti”?", "Iz lekcije: narod treba prosvetliti znanjem — odatle prosvetitelji i prosvetiteljstvo."], "objasnjenje": "Prosvetitelji su hteli da „prosvetle” narod znanjem; po tome su dobili ime i oni i pokret.", "iz_udzbenika": {"strana": 34, "odeljak": "Prosvetiteljstvo", "tekst": "Pošto su neobrazovanost smatrali uzrokom svih nedaća, zalagali su se da se narod prosvetli znanjem — zato su nazvani prosvetiteljima."}}, {"id": "pros-lanac-ime", "vrsta": "lanac", "tezina": "lako", "pojmovi": ["prosvetitelji", "prosvetiteljstvo"], "karike": ["Prosvetitelji smatraju da je neobrazovanost uzrok svih nedaća", "?", "Pokret dobija ime prosvetiteljstvo"], "praznina": 1, "odgovori": [{"tekst": "Narod treba „prosvetliti” znanjem", "tacan": true}, {"tekst": "Narod treba podići na bunu protiv kralja", "tacan": false, "zasto": "Prosvetitelji su pisali i raspravljali, a rešenje su videli u znanju, ne u buni."}, {"tekst": "Treba ojačati moć crkve", "tacan": false, "zasto": "Upravo su kritikovali svemoćni uticaj crkve."}], "pomoc": ["Šta je lek za neobrazovanost?", "Ime pokreta dolazi od reči koja znači osvetliti, prosvetliti.", "Iz lekcije: narod treba prosvetliti znanjem → prosvetitelji, prosvetiteljstvo."], "objasnjenje": "Ako je neznanje uzrok nedaća, rešenje je znanje — narod treba „prosvetliti”, pa se pokret zove prosvetiteljstvo.", "iz_udzbenika": {"strana": 34, "odeljak": "Prosvetiteljstvo", "tekst": "Uzrok nedaća su videli u neobrazovanosti, pa su tražili da se narod prosvetli znanjem."}}, {"id": "pros-lanac-pokret", "vrsta": "lanac", "tezina": "srednje", "pojmovi": ["prosvetiteljstvo", "feudalizam", "apsolutizam"], "karike": ["Francuski filozofi kritikuju feudalizam, apsolutizam i moć crkve", "Veruju da razum i nauka mogu da poprave svet", "?"], "praznina": 2, "odgovori": [{"tekst": "Nastaje pokret prosvetiteljstva", "tacan": true}, {"tekst": "Počinje industrijska revolucija", "tacan": false, "zasto": "Industrijska revolucija je drugo lice „doba revolucija” (lekcija 2.1) i počinje u Engleskoj, sa mašinama."}, {"tekst": "Svi vladari Evrope ukidaju monarhiju", "tacan": false, "zasto": "Monarhije su ostale; neki vladari su prihvatili ideje i postali prosvećeni apsolutisti."}], "pomoc": ["Kako se zove pokret tih filozofa?", "To je pokret po kome je lekcija dobila ime.", "Iz lekcije: iz kritike starog uređenja i vere u razum rađa se prosvetiteljstvo."], "objasnjenje": "Kritika feudalizma, apsolutizma i crkve, zajedno sa verom u razum i nauku, stvorila je pokret prosvetiteljstva.", "iz_udzbenika": {"strana": 34, "odeljak": "Prosvetiteljstvo", "tekst": "Filozofi, književnici i naučnici u Francuskoj kritikovali su staro uređenje i verovali u razum — to je prosvetiteljstvo."}}, {"id": "pros-zakljuci-primena", "vrsta": "zakljuci", "tezina": "lako", "pojmovi": ["prosvetiteljstvo", "prosvetitelji"], "pitanje": "Koju bi od ovih mera prosvetitelj najverovatnije podržao?", "odgovori": [{"tekst": "Otvaranje škola za obične ljude", "tacan": true}, {"tekst": "Zabranu knjiga o nauci", "tacan": false, "zasto": "Prosvetitelji su verovali u nauku; zabrane knjiga su, naprotiv, pogađale njih (Enciklopedija)."}, {"tekst": "Davanje crkvi veće vlasti nad državom", "tacan": false, "zasto": "Kritikovali su svemoćni uticaj crkve."}, {"tekst": "Strože kazne za one koji drugačije veruju", "tacan": false, "zasto": "Volter je pisao protiv verske netrpeljivosti i surovih zakona."}], "pomoc": ["Korak 1: Šta je za prosvetitelje bio uzrok nedaća?", "Korak 2: Koja mera taj uzrok uklanja?", "Iz lekcije: narod treba prosvetliti znanjem."], "objasnjenje": "Ako je neznanje uzrok nedaća, prosvetitelj podržava obrazovanje naroda — na primer škole.", "iz_udzbenika": {"strana": 34, "odeljak": "Prosvetiteljstvo", "tekst": "Prosvetitelji su se zalagali za razum i znanje i protiv neznanja i praznoverja."}}, {"id": "pros-datum-enciklopedija", "vrsta": "datum", "tezina": "lako", "pojmovi": ["enciklopedija"], "dogadjaj": "Enciklopedija", "pitanje": "Od koje do koje godine je izlazila Enciklopedija?", "od": 1751, "do": 1772, "traka": "ideje", "pomoc": ["Izlazila je sredinom XVIII veka, više od dvadeset godina.", "Počela je da izlazi nešto posle 1750.", "Iz lekcije: Enciklopedija (1751–1772)."], "objasnjenje": "Enciklopedija je izlazila od 1751. do 1772. godine.", "iz_udzbenika": {"strana": 35, "odeljak": "Prosvetiteljstvo — Enciklopedija", "tekst": "Za širenje ideja prosvetiteljstva bila je važna Enciklopedija, koja je izlazila od 1751. do 1772.", "slika": "04-doba-prosvetiteljstva/02-enciklopedija-naslovna-strana.jpg"}}, {"id": "pros-lanac-zabrana", "vrsta": "lanac", "tezina": "srednje", "pojmovi": ["enciklopedija", "francuska"], "karike": ["Enciklopedija objavljuje članke o religiji, politici i vlasti", "?", "Francuske vlasti zabranjuju njeno izlaženje"], "praznina": 1, "odgovori": [{"tekst": "Članci izazivaju velike rasprave", "tacan": true}, {"tekst": "Članci hvale apsolutizam francuskih kraljeva", "tacan": false, "zasto": "Da su hvalili kralja, vlasti je ne bi zabranile; prosvetitelji su apsolutizam kritikovali."}, {"tekst": "Niko ne želi da je čita", "tacan": false, "zasto": "Bila je toliko uticajna da su je zvali „Biblijom prosvećenih” — zabranjena je zbog rasprava, ne zbog nezainteresovanosti."}], "pomoc": ["Šta se desi kad neko javno piše o vlasti i crkvi koje kritikuje?", "Teme su bile osetljive za kralja i crkvu.", "Iz lekcije: članci o religiji, politici i vlasti izazvali su rasprave, pa su je vlasti zabranile."], "objasnjenje": "Članci o religiji, politici i vlasti izazvali su velike rasprave, pa su francuske vlasti zabranile Enciklopediju.", "iz_udzbenika": {"strana": 35, "odeljak": "Prosvetiteljstvo — Enciklopedija", "tekst": "Članci o religiji, politici i vlasti izazivali su rasprave, pa su francuske vlasti zabranile izlaženje Enciklopedije."}, "osa": {"naziv": "Enciklopedija", "od": 1751, "do": 1772, "traka": "ideje"}}, {"id": "pros-zakljuci-zabrana", "vrsta": "zakljuci", "tezina": "tesko", "pojmovi": ["enciklopedija", "apsolutizam", "francuska"], "pitanje": "Zašto su baš francuskim apsolutističkim vlastima smetali članci Enciklopedije o politici, vlasti i religiji?", "odgovori": [{"tekst": "Dovodili su u pitanje neograničenu vlast kralja i moć crkve, na kojima je počivalo uređenje", "tacan": true}, {"tekst": "Bili su napisani na stranom jeziku", "tacan": false, "zasto": "Enciklopedija je francusko delo, izlazila je u Parizu."}, {"tekst": "Hvalili su pruskog kralja Fridriha II", "tacan": false, "zasto": "Lekcija o tome ne govori; zabranjena je zbog rasprava o religiji, politici i vlasti."}, {"tekst": "Govorili su samo o zanatima i mašinama", "tacan": false, "zasto": "Bilo je i takvih tema, ali vlast su uznemirili članci o religiji, politici i vlasti."}], "pomoc": ["Korak 1: Šta su prosvetitelji kritikovali?", "Korak 2: Ko je u Francuskoj imao neograničenu vlast i ko je bio svemoćan?", "Iz lekcije: prosvetitelji kritikuju apsolutizam i svemoćni uticaj crkve; Enciklopedija je zabranjena."], "objasnjenje": "Prosvetitelji su kritikovali apsolutizam i moć crkve. Članci koji to šire bili su opasni za kralja i crkvu, pa su vlasti zabranile Enciklopediju.", "iz_udzbenika": {"strana": 35, "odeljak": "Prosvetiteljstvo — Enciklopedija", "tekst": "Zbog rasprava koje su izazvali članci o religiji, politici i vlasti francuske vlasti su zabranile Enciklopediju."}, "osa": {"naziv": "Enciklopedija", "od": 1751, "do": 1772, "traka": "ideje"}}, {"id": "pros-izvor-naslovna", "vrsta": "izvor", "tezina": "lako", "pojmovi": ["enciklopedija", "prosvetiteljstvo"], "izvor": {"autor": "Naslovna strana prvog toma", "naslov": "Enciklopedija (opis dokumenta)", "tekst": "Na požuteloj naslovnoj strani, ispod ukrasne vinjete, piše na francuskom: Enciklopedija, ili razumni rečnik nauka, umetnosti i zanata. Prvi tom. Pariz.", "napomena": "Odlomak je prepričan; udžbenik, str. 35."}, "pitanje": "Šta naslov govori o tome šta je Enciklopedija sabirala?", "odgovori": [{"tekst": "Znanje iz nauka, umetnosti i zanata", "tacan": true}, {"tekst": "Samo molitve i verske tekstove", "tacan": false, "zasto": "Naslov pominje nauke, umetnosti i zanate; o religiji je imala članke, ali kao jednu od tema."}, {"tekst": "Zakone francuskog kralja", "tacan": false, "zasto": "Francuske vlasti su je, naprotiv, zabranile."}, {"tekst": "Pesme i romane", "tacan": false, "zasto": "Naslov kaže da je to rečnik nauka, umetnosti i zanata — zbirka znanja."}], "pomoc": ["Pročitaj podnaslov: rečnik čega?", "Iz lekcije: Enciklopedija je sabirala znanje i ideje prosvetitelja."], "objasnjenje": "Naslov kaže da je Enciklopedija rečnik nauka, umetnosti i zanata — zbirka celokupnog znanja, kako su prosvetitelji i želeli.", "iz_udzbenika": {"strana": 35, "odeljak": "Prosvetiteljstvo — slika naslovne strane", "tekst": "Udžbenik prikazuje naslovnu stranu prvog toma Enciklopedije, štampanog u Parizu.", "slika": "04-doba-prosvetiteljstva/02-enciklopedija-naslovna-strana.jpg"}}, {"id": "pros-izvor-naslovna-pariz", "vrsta": "izvor", "tezina": "srednje", "pojmovi": ["enciklopedija", "francuska"], "izvor": {"autor": "Naslovna strana prvog toma", "naslov": "Enciklopedija (opis dokumenta)", "tekst": "Na požuteloj naslovnoj strani, ispod ukrasne vinjete, piše na francuskom: Enciklopedija, ili razumni rečnik nauka, umetnosti i zanata. Prvi tom. Pariz.", "napomena": "Odlomak je prepričan; udžbenik, str. 35."}, "pitanje": "Šta naslovna strana, zajedno sa lekcijom, govori o Enciklopediji?", "odgovori": [{"tekst": "Štampana je u Parizu, u Francuskoj, čije su je vlasti kasnije zabranile", "tacan": true}, {"tekst": "Štampana je u Sankt Peterburgu po naredbi Katarine II", "tacan": false, "zasto": "Na strani piše Pariz; Katarina je kasnije otkupila Volterovu biblioteku, ne Enciklopediju."}, {"tekst": "Imala je samo jedan tom", "tacan": false, "zasto": "Piše „Prvi tom” — bilo ih je više, izlazila je od 1751. do 1772."}, {"tekst": "Bila je napisana na latinskom za sveštenike", "tacan": false, "zasto": "Naslov je na francuskom, a prosvetitelji su kritikovali moć crkve."}], "pomoc": ["Na dnu strane piše ime grada.", "Reči „Prvi tom” govore da je bilo više tomova.", "Iz lekcije: francuske vlasti su zabranile izlaženje Enciklopedije."], "objasnjenje": "Prvi tom je štampan u Parizu; tomovi su izlazili od 1751. do 1772, dok ih francuske vlasti nisu zabranile.", "iz_udzbenika": {"strana": 35, "odeljak": "Prosvetiteljstvo — slika naslovne strane", "tekst": "Naslovna strana prvog toma nosi oznaku Pariza.", "slika": "04-doba-prosvetiteljstva/02-enciklopedija-naslovna-strana.jpg"}, "osa": {"naziv": "Enciklopedija", "od": 1751, "do": 1772, "traka": "ideje"}}, {"id": "pros-objasni-biblija-prosvecenih", "vrsta": "objasni", "tezina": "srednje", "pojmovi": ["enciklopedija", "prosvetiteljstvo"], "pitanje": "Zašto su savremenici Enciklopediju zvali „Biblijom prosvećenih”? Objasni svojim rečima.", "uzor": "Enciklopedija je sabrala znanje i ideje prosvetitelja — o nauci, religiji, politici i vlasti. Za pristalice prosvetiteljstva bila je ono što je Biblija za vernike, glavna knjiga u koju veruju. Zbog članaka o religiji i vlasti francuske vlasti su je zabranile.", "ideje": ["Sabrala je znanje i ideje prosvetitelja.", "Za prosvetitelje je imala značaj kao Biblija za vernike.", "Pisali su je najpoznatiji prosvetitelji (Volter, Ruso, Monteskje)."], "objasnjenje": "„Biblija prosvećenih” znači glavna knjiga jednog pokreta — Enciklopedija je bila to za prosvetitelje.", "iz_udzbenika": {"strana": 35, "odeljak": "Prosvetiteljstvo — Enciklopedija", "tekst": "Udžbenik pita zašto su savremenici Enciklopediju zvali „Biblijom prosvećenih”.", "slika": "04-doba-prosvetiteljstva/02-enciklopedija-naslovna-strana.jpg"}, "osa": {"naziv": "Enciklopedija", "od": 1751, "do": 1772, "traka": "ideje"}}, {"id": "pros-povezi-ideje", "vrsta": "povezi", "tezina": "lako", "pojmovi": ["volter", "monteskje", "ruso", "prosveceni-apsolutizam", "podela-vlasti", "republika"], "pitanje": "Poveži prosvetitelja sa njegovom glavnom idejom o uređenju države.", "parovi": [["Volter", "prosvećeni apsolutizam — „savez filozofa i kraljeva”"], ["Monteskje", "podela vlasti na izvršnu, zakonodavnu i sudsku"], ["Ruso", "republika — zakoni samo uz odobrenje naroda"]], "pomoc": ["Jedan veruje kraljevima, jedan narodu, a jedan deli vlast.", "Ruso je napisao Društveni ugovor.", "Iz lekcije: Volter — prosvećeni apsolutizam; Monteskje — podela vlasti; Ruso — republika."], "objasnjenje": "Volter je za prosvećeni apsolutizam, Monteskje za podelu vlasti (parlamentarnu monarhiju), Ruso za republiku.", "iz_udzbenika": {"strana": 35, "odeljak": "Prosvetiteljstvo — Volter, Monteskje, Ruso", "tekst": "Tri najpoznatija prosvetitelja predlagala su različita uređenja države.", "slika": "04-doba-prosvetiteljstva/03-volter.jpg"}}, {"id": "pros-povezi-dela", "vrsta": "povezi", "tezina": "srednje", "pojmovi": ["volter", "monteskje", "ruso", "enciklopedija", "drustveni-ugovor", "parlamentarna-monarhija"], "pitanje": "Poveži pojam sa onim što ga opisuje.", "parovi": [["Volter", "kritika rimokatoličke crkve i verske netrpeljivosti"], ["Monteskje", "parlamentarna monarhija po engleskom uzoru"], ["Društveni ugovor", "Rusoovo delo o slobodi i blagostanju građana"], ["Enciklopedija", "„Biblija prosvećenih”"]], "pomoc": ["Dva levo su ljudi, dva su knjige.", "Ko je za uzor uzeo Englesku?", "Iz lekcije: Volter kritikuje crkvu; Monteskje — parlamentarna monarhija; Ruso — Društveni ugovor."], "objasnjenje": "Volter je pisao protiv crkve i verske netrpeljivosti, Monteskje je hteo parlamentarnu monarhiju, Ruso je napisao Društveni ugovor, a Enciklopedija je bila „Biblija prosvećenih”.", "iz_udzbenika": {"strana": 35, "odeljak": "Prosvetiteljstvo", "tekst": "Lekcija opisuje Voltera, Monteskjea, Rusoa i Enciklopediju."}}, {"id": "pros-izbor-monteskje", "vrsta": "izbor", "tezina": "lako", "pojmovi": ["monteskje", "podela-vlasti"], "pitanje": "Na koja tri dela je Monteskje hteo da podeli vlast?", "odgovori": [{"tekst": "Izvršnu, zakonodavnu i sudsku", "tacan": true}, {"tekst": "Crkvenu, vojnu i carsku", "tacan": false, "zasto": "To nisu grane vlasti; Monteskje deli vlast prema poslu — ko izvršava, ko donosi zakone, ko sudi."}, {"tekst": "Kraljevsku, plemićku i seljačku", "tacan": false, "zasto": "To su društveni slojevi, a ne grane vlasti."}, {"tekst": "Prusku, rusku i austrijsku", "tacan": false, "zasto": "To su države prosvećenog apsolutizma, a ne delovi vlasti."}], "pomoc": ["Jedna grana donosi zakone.", "Druga sudi, treća sprovodi odluke.", "Iz lekcije: izvršna, zakonodavna i sudska vlast."], "objasnjenje": "Monteskje je tražio podelu vlasti na izvršnu, zakonodavnu i sudsku.", "iz_udzbenika": {"strana": 35, "odeljak": "Prosvetiteljstvo — Monteskje", "tekst": "Monteskje je smatrao da vlast treba podeliti na izvršnu, zakonodavnu i sudsku.", "slika": "04-doba-prosvetiteljstva/04-monteskje.jpg"}}, {"id": "pros-dopuni-ideje", "vrsta": "dopuni", "tezina": "lako", "pojmovi": ["volter", "ruso", "monteskje"], "pitanje": "Dopuni rečenicu imenima prosvetitelja.", "tekst": "Prosvećeni apsolutizam zagovarao je {{Volter}}, republiku {{Ruso}}, a podelu vlasti {{Monteskje}}.", "ponudjene": ["Volter", "Ruso", "Monteskje", "Fridrih II", "Josif II"], "pomoc": ["Ko se dopisivao sa caricom i družio sa kraljem?", "Ko je napisao Društveni ugovor?", "Iz lekcije: Volter — prosvećeni apsolutizam, Ruso — republika, Monteskje — podela vlasti."], "objasnjenje": "Volter je verovao prosvećenim vladarima, Ruso narodu, a Monteskje podeli vlasti.", "iz_udzbenika": {"strana": 35, "odeljak": "Prosvetiteljstvo", "tekst": "Volter, Monteskje i Ruso predlagali su različita uređenja države."}}, {"id": "pros-dopuni-ruso", "vrsta": "dopuni", "tezina": "srednje", "pojmovi": ["ruso", "drustveni-ugovor", "republika"], "pitanje": "Dopuni rečenicu o Rusoovim idejama.", "tekst": "U delu {{Društveni ugovor}} Ruso piše da cilj države mora biti {{sloboda}} i blagostanje svakog građanina, a zakoni se smeju donositi samo uz odobrenje {{naroda}}.", "ponudjene": ["Društveni ugovor", "Enciklopedija", "sloboda", "vojska", "naroda", "kralja"], "pomoc": ["Enciklopediju su pisali mnogi; Ruso ima i svoje posebno delo.", "Ruso veruje narodu, a ne kralju.", "Iz lekcije: Društveni ugovor — sloboda i blagostanje građana, zakoni uz odobrenje naroda."], "objasnjenje": "U Društvenom ugovoru Ruso traži slobodu i blagostanje svakog građanina i zakone koje odobrava narod — zato mu je republika najbolja.", "iz_udzbenika": {"strana": 35, "odeljak": "Prosvetiteljstvo — Ruso", "tekst": "Ruso u Društvenom ugovoru piše da je cilj države sloboda i blagostanje svakog građanina i da zakone mora da odobri narod.", "slika": "04-doba-prosvetiteljstva/05-ruso.jpg"}}, {"id": "pros-dopuni-monteskje", "vrsta": "dopuni", "tezina": "tesko", "pojmovi": ["monteskje", "podela-vlasti", "parlamentarna-monarhija"], "pitanje": "Dopuni rečenicu (bez ponuđenih reči).", "tekst": "Monteskje je za uzor uzeo {{Englesku|Veliku Britaniju|Britaniju}} i tražio parlamentarnu {{monarhiju}}, a vlast je delio na izvršnu, zakonodavnu i {{sudsku}}.", "pomoc": ["Uzor je jedina velika sila koja nije bila apsolutistička.", "Parlament ograničava kralja — uređenje i dalje ima kralja.", "Iz lekcije: parlamentarna monarhija po engleskom uzoru; izvršna, zakonodavna i sudska vlast."], "objasnjenje": "Monteskje: parlamentarna monarhija po engleskom uzoru i podela vlasti na izvršnu, zakonodavnu i sudsku.", "iz_udzbenika": {"strana": 35, "odeljak": "Prosvetiteljstvo — Monteskje", "tekst": "Monteskje se zalagao za parlamentarnu monarhiju po engleskom uzoru i podelu vlasti na tri dela.", "slika": "04-doba-prosvetiteljstva/04-monteskje.jpg"}}, {"id": "pros-tn-volter-crkva", "vrsta": "tacno_netacno", "tezina": "srednje", "pojmovi": ["volter", "svestenstvo", "sloboda-vere"], "tvrdnja": "Volter je branio rimokatoličku crkvu od kritičara.", "tacno": false, "ispravke": [{"tekst": "Volter je kritikovao rimokatoličku crkvu i sveštenstvo i pisao protiv verske netrpeljivosti.", "tacan": true}, {"tekst": "Volter je kritikovao samo vladare, a sa Volterom, ne sa Rusoom."}, {"tekst": "Zato što u republici vlada najpametniji filozof", "tacan": false, "zasto": "„Savez filozofa i kraljeva” je Volterova ideja; Ruso veruje narodu."}], "pomoc": ["Korak 1: Ko, po Rusou, treba da odobri zakone?", "Korak 2: U kom uređenju narod bira vlast?", "Iz lekcije: zakoni samo uz odobrenje naroda → najbolji oblik je republika."], "objasnjenje": "Ako zakone mora da odobri narod, najbolje je uređenje u kome narod bira vlast — republika.", "iz_udzbenika": {"strana": 35, "odeljak": "Prosvetiteljstvo — Ruso", "tekst": "Pošto zakoni mogu da se donose samo uz odobrenje naroda, Ruso republiku smatra najboljim uređenjem.", "slika": "04-doba-prosvetiteljstva/05-ruso.jpg"}}, {"id": "pros-zakljuci-podela", "vrsta": "zakljuci", "tezina": "srednje", "pojmovi": ["monteskje", "podela-vlasti", "apsolutizam"], "pitanje": "Zašto je Monteskjeova podela vlasti bila kritika apsolutizma?", "odgovori": [{"tekst": "U apsolutizmu je sva vlast u rukama jednog vladara, a podela je raspoređuje na tri dela", "tacan": true}, {"tekst": "Zato što je podela vlasti značila ukidanje svih zakona", "tacan": false, "zasto": "Jedna od tri grane je upravo zakonodavna — zakoni ostaju."}, {"tekst": "Zato što je davala svu vlast crkvi", "tacan": false, "zasto": "Prosvetitelji su kritikovali moć crkve; podela vlasti govori o izvršnoj, zakonodavnoj i sudskoj vlasti."}, {"tekst": "Zato što je tražila da vladar ima još više vlasti", "tacan": false, "zasto": "Suprotno — podela ograničava vladara."}], "pomoc": ["Korak 1: Koliko vlasti ima apsolutistički vladar?", "Korak 2: Šta se desi s tom vlašću kad se podeli na tri dela?", "Iz lekcije: Monteskje kritikuje apsolutizam i deli vlast na izvršnu, zakonodavnu i sudsku."], "objasnjenje": "Apsolutizam znači neograničenu vlast jednog vladara; ako se vlast podeli na tri dela, niko više nema svu vlast.", "iz_udzbenika": {"strana": 35, "odeljak": "Prosvetiteljstvo — Monteskje", "tekst": "Monteskje je kritikovao apsolutizam francuskih kraljeva i tražio podelu vlasti."}}, {"id": "pros-lanac-ruso", "vrsta": "lanac", "tezina": "tesko", "pojmovi": ["ruso", "republika", "drustveni-ugovor"], "karike": ["Ruso: cilj države je sloboda i blagostanje svakog građanina", "?", "Najbolji oblik uređenja je republika"], "praznina": 1, "odgovori": [{"tekst": "Zakoni smeju da se donose samo uz odobrenje naroda", "tacan": true}, {"tekst": "Vlast treba podeliti po engleskom uzoru", "tacan": false, "zasto": "To je Monteskje, i on vodi ka parlamentarnoj monarhiji, ne ka republici."}, {"tekst": "Prosvećeni vladar treba da ima neograničenu vlast", "tacan": false, "zasto": "To je Volterov prosvećeni apsolutizam — suprotno republici."}, {"tekst": "Narod je retko dostojan da vlada sam", "tacan": false, "zasto": "To piše Volter Katarini; Ruso misli da se narod ređe vara od vladara."}], "pomoc": ["Korak 1: Ko odlučuje o zakonima ako je cilj sloboda svakog građanina?", "Korak 2: Odbaci ideje drugih prosvetitelja (Volter, Monteskje).", "Iz lekcije: zakoni se mogu donositi samo uz odobrenje naroda → republika."], "objasnjenje": "Ako država postoji radi slobode svakog građanina, zakone mora da odobri narod — a to je moguće u republici.", "iz_udzbenika": {"strana": 35, "odeljak": "Prosvetiteljstvo — Ruso", "tekst": "Iz uverenja da zakone odobrava narod Ruso izvodi da je republika najbolje uređenje."}}, {"id": "pros-ko-sam-volter", "vrsta": "ko_sam", "tezina": "lako", "pojmovi": ["volter", "bastilja", "prosveceni-apsolutizam"], "tragovi": ["Dva puta sam bio zatvoren u Bastilji i morao sam u izgnanstvo u Englesku.", "Dopisivao sam se sa Katarinom II, a neko vreme sam živeo na dvoru Fridriha II.", "Najbolje uređenje mi je „savez filozofa i kraljeva” — prosvećeni apsolutizam."], "odgovori": [{"tekst": "Volter", "tacan": true}, {"tekst": "Ruso", "tacan": false, "zasto": "Ruso je bio za republiku, ne za savez s kraljevima."}, {"tekst": "Monteskje", "tacan": false, "zasto": "Monteskje je bio za podelu vlasti i parlamentarnu monarhiju."}, {"tekst": "Fridrih II", "tacan": false, "zasto": "Fridrih je bio kralj kod koga je Volter boravio, a ne zatvorenik Bastilje."}], "objasnjenje": "To je Fransoa Volter — prosvetitelj koji je verovao prosvećenim vladarima i zbog svojih dela bio progonjen u Francuskoj.", "iz_udzbenika": {"strana": 36, "odeljak": "Znatiželja — Volter i vladari", "tekst": "Volter je dva puta bio u Bastilji, živeo u izgnanstvu, boravio kod Fridriha II i dopisivao se sa Katarinom II.", "slika": "04-doba-prosvetiteljstva/03-volter.jpg"}}, {"id": "pros-ko-sam-monteskje", "vrsta": "ko_sam", "tezina": "srednje", "pojmovi": ["monteskje", "podela-vlasti", "parlamentarna-monarhija"], "tragovi": ["Bio sam jedan od pisaca Enciklopedije.", "Kritikovao sam apsolutizam francuskih kraljeva i za uzor uzeo Englesku.", "Vlast bih podelio na izvršnu, zakonodavnu i sudsku."], "odgovori": [{"tekst": "Monteskje", "tacan": true}, {"tekst": "Volter", "tacan": false, "zasto": "I Volter je pisao za Enciklopediju, ali on je za prosvećeni apsolutizam, a ne za podelu vlasti."}, {"tekst": "Ruso", "tacan": false, "zasto": "I Ruso je pisao za Enciklopediju, ali on je za republiku."}, {"tekst": "Josif II", "tacan": false, "zasto": "Josif II je bio car koji je vladao apsolutistički — suprotno podeli vlasti."}], "objasnjenje": "To je Šarl Monteskje — kritičar apsolutizma, pristalica parlamentarne monarhije i podele vlasti.", "iz_udzbenika": {"strana": 35, "odeljak": "Prosvetiteljstvo — Monteskje", "tekst": "Monteskje je kritikovao apsolutizam francuskih kraljeva i zastupao podelu vlasti.", "slika": "04-doba-prosvetiteljstva/04-monteskje.jpg"}}, {"id": "pros-ko-sam-ruso", "vrsta": "ko_sam", "tezina": "tesko", "pojmovi": ["ruso", "drustveni-ugovor", "republika"], "tragovi": ["I ja sam pisao za Enciklopediju.", "Smatram da se narod u izboru vara mnogo ređe nego vladar.", "Napisao sam Društveni ugovor."], "odgovori": [{"tekst": "Ruso", "tacan": true}, {"tekst": "Volter", "tacan": false, "zasto": "Volter je pisao da je narod retko dostojan da vlada sam — suprotno drugom tragu."}, {"tekst": "Monteskje", "tacan": false, "zasto": "Monteskje je za parlamentarnu monarhiju; Društveni ugovor nije njegov."}, {"tekst": "Katarina II", "tacan": false, "zasto": "Katarina je bila carica i Volterova prepiskačica, nije pisala za Enciklopediju."}], "objasnjenje": "To je Žan-Žak Ruso, pisac Društvenog ugovora, koji je verovao narodu i smatrao republiku najboljim uređenjem.", "iz_udzbenika": {"strana": 36, "odeljak": "Svedočanstvo — Ruso", "tekst": "Ruso u Društvenom ugovoru piše da se narod u izboru vara ređe nego vladar.", "slika": "04-doba-prosvetiteljstva/05-ruso.jpg"}}, {"id": "pros-uporedi-volter-ruso", "vrsta": "uporedi", "tezina": "tesko", "pojmovi": ["volter", "ruso", "monteskje", "prosveceni-apsolutizam", "republika"], "a": "Volter", "b": "Ruso", "pitanje": "Na koga se odnosi tvrdnja — Voltera, Rusoa, obojicu ili nijednog?", "tvrdnje": [{"tekst": "Najbolje uređenje je prosvećeni apsolutizam, „savez filozofa i kraljeva”.", "odgovor": "a", "zasto": "To je Volterova ideja; Ruso je za republiku."}, {"tekst": "Zakoni se mogu donositi samo uz odobrenje naroda.", "odgovor": "b", "zasto": "Ruso u „Društvenom ugovoru” — odatle mu je republika najbolje uređenje."}, {"tekst": "Pisao je za Enciklopediju.", "odgovor": "oba", "zasto": "Enciklopediju su pisali najpoznatiji prosvetitelji — Volter, Ruso i Monteskje."}, {"tekst": "Zalagao se za podelu vlasti na izvršnu, zakonodavnu i sudsku.", "odgovor": "nijedan", "zasto": "Podelu vlasti je zastupao Monteskje."}, {"tekst": "Dopisivao se sa ruskom caricom Katarinom II.", "odgovor": "a", "zasto": "Volter je sa Katarinom vodio dugogodišnju prepisku; ona je posle njegove smrti otkupila njegovu biblioteku."}], "pomoc": ["Ko je verovao vladarima, a ko narodu?", "Volter → prosvećeni apsolutizam; Ruso → republika; podela vlasti je ideja trećeg prosvetitelja.", "Iz lekcije: Enciklopediju su pisali Volter, Ruso i Monteskje."], "objasnjenje": "Volter je verovao prosvećenim vladarima, Ruso narodu (republika), a podela vlasti je Monteskjeova ideja. Obojica su pisali za Enciklopediju.", "iz_udzbenika": {"strana": 35, "odeljak": "Prosvetiteljstvo; Svedočanstvo", "tekst": "Volter zagovara prosvećeni apsolutizam, a Ruso republiku; obojica su bili među piscima Enciklopedije."}}, {"id": "pros-uporedi-monteskje-ruso", "vrsta": "uporedi", "tezina": "srednje", "pojmovi": ["monteskje", "ruso", "parlamentarna-monarhija", "republika"], "a": "Monteskje", "b": "Ruso", "pitanje": "Na koga se odnosi tvrdnja — Monteskjea, Rusoa, obojicu ili nijednog?", "tvrdnje": [{"tekst": "Za uzor je uzeo Englesku.", "odgovor": "a", "zasto": "Monteskje: parlamentarna monarhija po engleskom uzoru."}, {"tekst": "Najbolje uređenje mu je republika.", "odgovor": "b", "zasto": "Ruso, jer zakone mora da odobri narod."}, {"tekst": "Napisao je Društveni ugovor.", "odgovor": "b", "zasto": "Društveni ugovor je Rusoovo delo."}, {"tekst": "Pisao je za Enciklopediju.", "odgovor": "oba", "zasto": "Obojica su, uz Voltera, pisali Enciklopediju."}, {"tekst": "Najbolje uređenje mu je „savez filozofa i kraljeva”.", "odgovor": "nijedan", "zasto": "To je Volterova ideja prosvećenog apsolutizma."}], "pomoc": ["Jedan zadržava kralja uz parlament, drugi bira republiku.", "Treći prosvetitelj (Volter) verovao je kraljevima.", "Iz lekcije: Monteskje — parlamentarna monarhija; Ruso — Društveni ugovor, republika."], "objasnjenje": "Monteskje zadržava monarhiju ali je ograničava parlamentom; Ruso traži republiku. Obojica su pisali Enciklopediju.", "iz_udzbenika": {"strana": 35, "odeljak": "Prosvetiteljstvo — Monteskje i Ruso", "tekst": "Monteskje se zalaže za parlamentarnu monarhiju, a Ruso za republiku."}}, {"id": "pros-izvor-ruso", "vrsta": "izvor", "tezina": "srednje", "pojmovi": ["ruso", "republika", "drustveni-ugovor"], "izvor": {"autor": "Žan-Žak Ruso", "naslov": "Društveni ugovor (sažetak odlomka)", "tekst": "Monarhija je uvek lošija od republike. U republici javno mnjenje dovodi na najviše položaje prosvećene i sposobne ljude, a narod se u izboru vara mnogo ređe nego vladar. Sposoban čovek u kraljevskoj vladi redak je koliko i budala na čelu republike.", "napomena": "Odlomak je prepričan; udžbenik, str. 36 (Svedočanstvo)."}, "pitanje": "Zašto je, prema ovom izvoru, republika bolja od monarhije?", "odgovori": [{"tekst": "Zato što narod bolje bira sposobne ljude nego što to čini vladar", "tacan": true}, {"tekst": "Zato što u republici nema zakona", "tacan": false, "zasto": "Ruso piše da se zakoni donose uz odobrenje naroda — zakoni postoje, samo ih odobrava narod."}, {"tekst": "Zato što republika ima jaču vojsku", "tacan": false, "zasto": "O vojsci u odlomku nema ni reči; Ruso poredi kako se biraju ljudi na vlast."}, {"tekst": "Zato što je narod nedostojan da vlada sam", "tacan": false, "zasto": "To je Volterov stav iz pisma Katarini — Ruso tvrdi suprotno."}], "pomoc": ["Pronađi u odlomku ko bira ljude na najviše položaje.", "Ruso poredi ko se ređe vara u izboru — narod ili vladar.", "Iz lekcije: po Rusou se zakoni donose samo uz odobrenje naroda, pa je najbolje uređenje republika."], "objasnjenje": "Ruso veruje da narod, kroz javno mnjenje, na vlast dovodi sposobne i prosvećene ljude i da se u izboru vara ređe od vladara — zato je republika bolja.", "iz_udzbenika": {"strana": 36, "odeljak": "Svedočanstvo", "tekst": "Udžbenik donosi odlomak iz Rusoovog „Društvenog ugovora” u kome on poredi monarhiju i republiku i pita kako autori posmatraju ulogu naroda.", "slika": "04-doba-prosvetiteljstva/05-ruso.jpg"}}, {"id": "pros-objasni-monteskje", "vrsta": "objasni", "tezina": "srednje", "pojmovi": ["monteskje", "podela-vlasti", "parlamentarna-monarhija", "apsolutizam"], "pitanje": "Šta je Monteskje predlagao umesto apsolutizma i zašto? Objasni svojim rečima.", "uzor": "Monteskje je kritikovao apsolutizam francuskih kraljeva, u kome je sva vlast u rukama jednog čoveka. Predlagao je parlamentarnu monarhiju po uzoru na Englesku, u kojoj je vlast podeljena na izvršnu, zakonodavnu i sudsku. Tako nijedan deo vlasti ne bi bio neograničen.", "ideje": ["Kritikovao je apsolutizam francuskih kraljeva.", "Predlagao je parlamentarnu monarhiju po engleskom uzoru.", "Vlast treba podeliti na izvršnu, zakonodavnu i sudsku.", "Podela sprečava da jedan čovek ima svu vlast."], "objasnjenje": "Monteskjeova ideja je ograničena, podeljena vlast — suprotnost apsolutizmu.", "iz_udzbenika": {"strana": 35, "odeljak": "Prosvetiteljstvo — Monteskje", "tekst": "Monteskje je kritikovao apsolutizam i zalagao se za parlamentarnu monarhiju i podelu vlasti.", "slika": "04-doba-prosvetiteljstva/04-monteskje.jpg"}}]}, {"naslov": "Prosvećeni apsolutizam", "zadaci": [{"id": "apso-izbor-definicija", "vrsta": "izbor", "tezina": "lako", "pojmovi": ["prosveceni-apsolutizam", "apsolutizam", "prosvetiteljstvo"], "pitanje": "Šta je prosvećeni apsolutizam?", "odgovori": [{"tekst": "Vladavina u kojoj vladar, sa neograničenom vlašću, uvodi mere na dobrobit društva po idejama prosvetitelja", "tacan": true}, {"tekst": "Uređenje u kome narod bira vlast na određeno vreme", "tacan": false, "zasto": "To je republika — Rusoov ideal."}, {"tekst": "Podela vlasti na izvršnu, zakonodavnu i sudsku", "tacan": false, "zasto": "To je Monteskjeov predlog; u prosvećenom apsolutizmu vladar zadržava svu vlast."}, {"tekst": "Vladavina crkve u ime prosvetitelja", "tacan": false, "zasto": "Prosvetitelji su kritikovali moć crkve; Marija Terezija je crkvu čak stavila pod nadzor države."}], "pomoc": ["Reč „apsolutizam” znači neograničenu vlast vladara.", "„Prosvećeni” znači da prihvata ideje prosvetitelja.", "Iz lekcije: vladar koristi apsolutna ovlašćenja da uvede mere na dobrobit društva i države."], "objasnjenje": "U prosvećenom apsolutizmu vladar zadržava neograničenu vlast, ali je koristi da sprovodi reforme po idejama prosvetitelja.", "iz_udzbenika": {"strana": 35, "odeljak": "Prosvećeni apsolutizam", "tekst": "Pojedini vladari prihvatili su ideje prosvetiteljstva i, koristeći apsolutna ovlašćenja, uvodili mere na dobrobit društva i države."}}, {"id": "apso-izbor-oblasti", "vrsta": "izbor", "tezina": "srednje", "pojmovi": ["prosveceni-apsolutizam", "reforma"], "pitanje": "Na jačanju čega su radili vladari prosvećenog apsolutizma? (više tačnih)", "odgovori": [{"tekst": "Državne uprave", "tacan": true}, {"tekst": "Vojske", "tacan": true}, {"tekst": "Privrede", "tacan": true}, {"tekst": "Moći crkve nad državom", "tacan": false, "zasto": "Bilo je obrnuto — država je preuzimala nadzor nad crkvom (Marija Terezija), a manastiri su raspuštani (Josif II)."}, {"tekst": "Vlasti plemstva nad vladarom", "tacan": false, "zasto": "Vladari su jačali svoju vlast; Petar I je silom slomio otpor plemstva."}], "pomoc": ["Cilj je bila jača država.", "Tri oblasti: kako se država vodi, kako se brani i od čega živi.", "Iz lekcije: radi se na jačanju državne uprave, vojske i privrede."], "objasnjenje": "Prosvećeni apsolutizam je jačao državnu upravu, vojsku i privredu.", "iz_udzbenika": {"strana": 35, "odeljak": "Prosvećeni apsolutizam", "tekst": "Vladari su radili na jačanju državne uprave, vojske i privrede."}}, {"id": "apso-dopuni-drzave", "vrsta": "dopuni", "tezina": "lako", "pojmovi": ["prosveceni-apsolutizam", "habzburska-monarhija", "pruska", "rusija"], "pitanje": "Dopuni rečenicu.", "tekst": "Prosvećeni apsolutizam obeležio je {{XVIII}} vek, naročito u Habzburškoj monarhiji, {{Pruskoj}} i {{Rusiji}}.", "ponudjene": ["XVIII", "XVI", "Pruskoj", "Francuskoj", "Rusiji", "Holandiji"], "pomoc": ["U Francuskoj su delovali prosvetitelji, ali kralj nije postao „prosvećen”; Holandija je republika.", "Seti se vladara sa krunom na karti.", "Iz lekcije: XVIII vek — Habzburška monarhija, Pruska i Rusija."], "objasnjenje": "Prosvećeni apsolutizam je obeležio XVIII vek, naročito u Habzburškoj monarhiji, Pruskoj i Rusiji.", "iz_udzbenika": {"strana": 35, "odeljak": "Prosvećeni apsolutizam", "tekst": "Prosvećeni apsolutizam obeležio je XVIII vek, naročito u Habzburškoj monarhiji, Pruskoj i Rusiji."}}, {"id": "apso-lanac-narod", "vrsta": "lanac", "tezina": "srednje", "pojmovi": ["prosveceni-apsolutizam", "reforma"], "karike": ["Vladari prihvataju ideje prosvetiteljstva", "Jačaju državnu upravu, vojsku i privredu", "?"], "praznina": 2, "odgovori": [{"tekst": "Da bi mere uspele, popravlja se i položaj običnog naroda", "tacan": true}, {"tekst": "Ukidaju monarhiju i uvode republiku", "tacan": false, "zasto": "Vladari su ostali na vlasti — to je „apsolutizam” u nazivu."}, {"tekst": "Zabranjuju sve prosvetiteljske knjige", "tacan": false, "zasto": "Prosvećeni vladari su se dopisivali s prosvetiteljima; Enciklopediju su zabranile francuske vlasti."}], "pomoc": ["Ko radi, plaća poreze i služi vojsku?", "Lekcija kaže šta je trebalo da se uradi da bi mere uspele.", "Iz lekcije: da bi mere uspele, trebalo je popraviti i položaj običnog naroda."], "objasnjenje": "Jačanje države nije moglo da uspe bez naroda — zato je trebalo popraviti i položaj običnih ljudi.", "iz_udzbenika": {"strana": 35, "odeljak": "Prosvećeni apsolutizam", "tekst": "Da bi mere uspele, trebalo je popraviti i položaj običnog naroda."}}, {"id": "apso-zakljuci-narod", "vrsta": "zakljuci", "tezina": "tesko", "pojmovi": ["prosveceni-apsolutizam", "reforma", "kmetstvo"], "pitanje": "Lekcija kaže da je za uspeh reformi trebalo popraviti položaj običnog naroda. Koji primer iz lekcije to najbolje pokazuje?", "odgovori": [{"tekst": "Marija Terezija je strogo ograničila obaveze seljaka prema plemstvu", "tacan": true}, {"tekst": "Petar I i Katarina II su seljake pretvarali u kmetove", "tacan": false, "zasto": "To je pogoršalo položaj seljaka — primer suprotnog, da bi se pridobilo plemstvo."}, {"tekst": "Fridrih II je udvostručio teritoriju Pruske", "tacan": false, "zasto": "To je jačanje države i vojske, a ne poboljšanje položaja naroda."}, {"tekst": "Josif II je raspustio stotine manastira", "tacan": false, "zasto": "To je pogodilo crkvu i pomoglo manufakturama, ne govori direktno o položaju selj
