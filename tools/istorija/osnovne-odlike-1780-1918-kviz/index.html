vi su početkom XX veka i u njima Srbija oslobađa druge krajeve."}, {"tekst": "Ukidanjem Mletačke republike", "tacan": false, "zasto": "Mletačka republika je ukinuta 1797, ali to nije stvorilo Srbiju."}], "pomoc": ["Srbi su se podigli protiv turske vlasti — dva puta.", "Slika Katarine Ivanović prikazuje jedan događaj iz te borbe.", "Iz lekcije: Kneževina Srbija nastaje kao rezultat Prvog i Drugog srpskog ustanka."], "objasnjenje": "Ustanci početkom XIX veka stvorili su Kneževinu Srbiju.", "iz_udzbenika": {"strana": 14, "odeljak": "Srpski narod od kraja XVIII veka do Prvog svetskog rata", "tekst": "Početkom XIX veka, kao rezultat Prvog i Drugog srpskog ustanka, nastaje Kneževina Srbija."}, "osa": {"naziv": "Srpski ustanci i Kneževina Srbija", "od": 1800, "do": 1830, "traka": "srbi", "oznaka": "početak XIX veka"}, "lekcija": 1}, {"id": "sr-izbor-mitropolija", "vrsta": "izbor", "tezina": "srednje", "pojmovi": ["karlovacka-mitropolija", "habzburska-monarhija"], "pitanje": "Kako je bila organizovana srpska crkva u Habzburškoj monarhiji, koja je čuvala nacionalni i verski identitet Srba?", "odgovori": [{"tekst": "U Karlovačku mitropoliju", "tacan": true}, {"tekst": "Pod vođstvom cetinjskih mitropolita Petrovića Njegoša", "tacan": false, "zasto": "Cetinjski mitropoliti su vodili Crnu Goru, ne Srbe u Habzburškoj monarhiji."}, {"tekst": "Bila je deo rimokatoličke crkve", "tacan": false, "zasto": "Srpska crkva je bila zasebna i čuvala je srpski verski identitet."}, {"tekst": "Nije postojala nikakva srpska crkva", "tacan": false, "zasto": "Postojala je — Karlovačka mitropolija."}], "pomoc": ["Ime dolazi od grada na Dunavu, u Sremu.", "Mitropolija je crkvena oblast.", "Iz lekcije: srpska crkva organizovana u Karlovačku mitropoliju."], "objasnjenje": "Karlovačka mitropolija je čuvala nacionalni i verski identitet Srba u Habzburškoj monarhiji.", "iz_udzbenika": {"strana": 14, "odeljak": "Srpski narod od kraja XVIII veka do Prvog svetskog rata", "tekst": "Nacionalni i verski identitet Srba u Habzburškoj monarhiji čuva srpska crkva organizovana u Karlovačku mitropoliju."}, "lekcija": 1}, {"id": "sr-izbor-osmanski-krajevi", "vrsta": "izbor", "tezina": "tesko", "pojmovi": ["raska-oblast", "kosovo-i-metohija", "severna-makedonija", "balkanski-ratovi"], "pitanje": "Koji krajevi sa srpskim stanovništvom su posle 1878. ostali pod osmanskom vlašću sve do balkanskih ratova? (Više tačnih.)", "odgovori": [{"tekst": "Raška oblast", "tacan": true}, {"tekst": "Kosovo i Metohija", "tacan": true}, {"tekst": "Severni i severozapadni delovi današnje Severne Makedonije", "tacan": true}, {"tekst": "Bosna i Hercegovina", "tacan": false, "zasto": "BiH je 1878. okupirala Habzburška monarhija — više nije bila pod turskom upravom."}, {"tekst": "Crna Gora", "tacan": false, "zasto": "Crna Gora je 1878. priznata kao nezavisna država."}], "pomoc": ["Traži krajeve južno od Srbije.", "Jedan kraj je 1878. promenio vlast, ali ne ka slobodi.", "Iz lekcije: pod osmanskom vlašću ostaju Raška oblast, Kosovo, Metohija i delovi današnje Severne Makedonije."], "objasnjenje": "Raška, Kosovo, Metohija i delovi Severne Makedonije oslobođeni su tek u balkanskim ratovima; BiH je 1878. prešla pod Austrougarsku.", "iz_udzbenika": {"strana": 14, "odeljak": "Srpski narod od kraja XVIII veka do Prvog svetskog rata", "tekst": "Deo Srba i dalje živi pod osmanskom vlašću — u Raškoj oblasti, na Kosovu, u Metohiji i u delovima današnje Severne Makedonije."}, "lekcija": 1}, {"id": "sr-tn-berlinski", "vrsta": "tacno_netacno", "tezina": "lako", "pojmovi": ["berlinski-kongres", "knezevina-srbija", "crna-gora"], "tvrdnja": "Na Berlinskom kongresu 1878. Srbija i Crna Gora priznate su kao nezavisne države.", "tacno": true, "pomoc": ["Šta je Srbija do 1878. priznavala?", "Šta se 1878. promenilo za obe srpske države?", "Iz lekcije: Srbija i Crna Gora priznate su za nezavisne na Berlinskom kongresu 1878."], "objasnjenje": "Tačno — 1878. obe srpske države postaju i zvanično nezavisne.", "iz_udzbenika": {"strana": 14, "odeljak": "Srpski narod od kraja XVIII veka do Prvog svetskog rata", "tekst": "Kneževina Srbija je do Berlinskog kongresa 1878. priznavala vrhovnu vlast sultana; Crna Gora je, kao i Srbija, tada priznata za nezavisnu."}, "osa": {"naziv": "Berlinski kongres", "od": 1878, "traka": "srbi"}, "lekcija": 1}, {"id": "sr-tn-sultan", "vrsta": "tacno_netacno", "tezina": "srednje", "pojmovi": ["knezevina-srbija", "berlinski-kongres", "osmansko-carstvo"], "tvrdnja": "Kneževina Srbija je od svog nastanka bila potpuno nezavisna država.", "tacno": false, "ispravke": [{"tekst": "Kneževina Srbija je do Berlinskog kongresa 1878. priznavala vrhovnu vlast osmanskog sultana.", "tacan": true}, {"tekst": "Kneževina Srbija je do 1878. bila deo Habzburške monarhije.", "tacan": false, "zasto": "Srbija je nastala ustancima protiv Turaka i priznavala je vlast sultana, ne Habzburga."}, {"tekst": "Kneževina Srbija je nezavisnost dobila tek u balkanskim ratovima.", "tacan": false, "zasto": "Nezavisnost je priznata 1878; u balkanskim ratovima Srbija oslobađa druge krajeve."}], "pomoc": ["Kneževina nije isto što i nezavisna država.", "Čiju je vrhovnu vlast priznavala?", "Iz lekcije: do Berlinskog kongresa 1878. priznavala je vrhovnu vlast osmanskog sultana."], "objasnjenje": "Kneževina Srbija je imala svoju vlast, ali je do 1878. priznavala vrhovnu vlast sultana.", "iz_udzbenika": {"strana": 14, "odeljak": "Srpski narod od kraja XVIII veka do Prvog svetskog rata", "tekst": "Kneževina Srbija je do Berlinskog kongresa 1878. priznavala vrhovnu vlast osmanskog sultana."}, "osa": {"naziv": "Berlinski kongres", "od": 1878, "traka": "srbi"}, "lekcija": 1}, {"id": "sr-tn-bih", "vrsta": "tacno_netacno", "tezina": "srednje", "pojmovi": ["bosna-i-hercegovina", "habzburska-monarhija"], "tvrdnja": "Godine 1878. Bosna i Hercegovina oslobođena je i pripojena Srbiji.", "tacno": false, "ispravke": [{"tekst": "Godine 1878. Habzburška monarhija je okupirala Bosnu i Hercegovinu, koja je dotad bila pod turskom upravom.", "tacan": true}, {"tekst": "Godine 1878. Bosna i Hercegovina postala je nezavisna kneževina.", "tacan": false, "zasto": "Nezavisne su postale Srbija i Crna Gora; BiH je okupirala Habzburška monarhija."}, {"tekst": "Godine 1878. Bosnu i Hercegovinu je zauzela Crna Gora.", "tacan": false, "zasto": "BiH je okupirala Habzburška (Austrougarska) monarhija."}], "pomoc": ["Pod čiju vlast je BiH prešla 1878?", "Zbog toga se povećao broj Srba pod austrougarskom vlašću.", "Iz lekcije: 1878. Habzburška monarhija okupira BiH."], "objasnjenje": "BiH je 1878. iz turske prešla pod austrougarsku vlast — zato je više Srba živelo u Austrougarskoj.", "iz_udzbenika": {"strana": 14, "odeljak": "Srpski narod od kraja XVIII veka do Prvog svetskog rata", "tekst": "Broj Srba pod austrougarskom vlašću povećao se kada je Habzburška monarhija 1878. okupirala Bosnu i Hercegovinu."}, "osa": {"naziv": "Okupacija Bosne i Hercegovine", "od": 1878, "traka": "srbi"}, "lekcija": 1}, {"id": "sr-tn-crna-gora", "vrsta": "tacno_netacno", "tezina": "tesko", "pojmovi": ["crna-gora", "petrovici-njegosi", "obrenovici"], "tvrdnja": "Crna Gora se borila za osamostaljenje pod vođstvom knezova iz dinastije Obrenović.", "tacno": false, "ispravke": [{"tekst": "Crnu Goru su vodili cetinjski mitropoliti iz porodice Petrović Njegoš.", "tacan": true}, {"tekst": "Crnu Goru su vodili Karađorđevići.", "tacan": false, "zasto": "Karađorđevići i Obrenovići su naizmenično vladali Srbijom."}, {"tekst": "Crnu Goru je vodio osmanski sultan.", "tacan": false, "zasto": "Crna Gora se upravo borila za osamostaljenje od turske vlasti."}], "pomoc": ["Obrenovići su jedna od dve srpske dinastije u Srbiji.", "Crnu Goru su vodili crkveni poglavari sa Cetinja.", "Iz lekcije: cetinjski mitropoliti iz porodice Petrovića Njegoša."], "objasnjenje": "Crnu Goru vode mitropoliti iz porodice Petrović Njegoš; Obrenovići i Karađorđevići vladaju Srbijom.", "iz_udzbenika": {"strana": 14, "odeljak": "Srpski narod od kraja XVIII veka do Prvog svetskog rata", "tekst": "Crna Gora se pod vođstvom cetinjskih mitropolita iz porodice Petrovića Njegoša borila za osamostaljenje od turske vlasti."}, "lekcija": 1}, {"id": "sr-dopuni-srbija", "vrsta": "dopuni", "tezina": "lako", "pojmovi": ["knezevina-srbija", "karadjordjevici", "obrenovici"], "pitanje": "Dopuni rečenice o Kneževini Srbiji.", "tekst": "Ukidanjem turskog feudalnog uređenja Srbija je postala zemlja {{slobodnih seljaka}}. Srbijom su naizmenično vladale dve dinastije — {{Karađorđevići}} i {{Obrenovići}}.", "ponudjene": ["slobodnih seljaka", "kmetova", "Karađorđevići", "Obrenovići", "Habzburgovci", "Petrovići Njegoši"], "pomoc": ["Kad nestane feudalnog gospodara, seljak postaje …", "Dinastije nose imena po vođama ustanaka.", "Iz lekcije: zemlja slobodnih seljaka; Karađorđevići i Obrenovići."], "objasnjenje": "Srbija postaje zemlja slobodnih seljaka; vladaju je naizmenično Karađorđevići i Obrenovići.", "iz_udzbenika": {"strana": 14, "odeljak": "Srpski narod od kraja XVIII veka do Prvog svetskog rata", "tekst": "Ukidanjem turskog feudalnog uređenja Srbija postaje zemlja slobodnih seljaka; do početka XX veka naizmenično vladaju Karađorđevići i Obrenovići."}, "lekcija": 1}, {"id": "sr-dopuni-habzburg", "vrsta": "dopuni", "tezina": "srednje", "pojmovi": ["gradjanstvo", "karlovacka-mitropolija", "habzburska-monarhija"], "pitanje": "Dopuni rečenice o Srbima u Habzburškoj monarhiji.", "tekst": "Najimućniji i najobrazovaniji sloj Srba u Habzburškoj monarhiji bilo je {{građanstvo}}, koje je ulagalo u kulturne i {{prosvetne}} ustanove. Nacionalni i verski identitet čuvala je {{Karlovačka mitropolija}}.", "ponudjene": ["građanstvo", "plemstvo", "prosvetne", "vojne", "Karlovačka mitropolija", "Pećka patrijaršija"], "pomoc": ["Isti sloj koji jača i u ostatku Evrope.", "Ustanove za školovanje su …", "Iz lekcije: građanstvo ulaže u kulturne i prosvetne ustanove; Karlovačka mitropolija."], "objasnjenje": "Srpsko građanstvo i Karlovačka mitropolija čuvali su identitet ija okupira BiH.", "Iz lekcije: Berlinski kongres, 1878."], "objasnjenje": "Berlinski kongres je 1878; Srbija i Crna Gora tada postaju nezavisne.", "iz_udzbenika": {"strana": 14, "odeljak": "Srpski narod od kraja XVIII veka do Prvog svetskog rata", "tekst": "Srbija i Crna Gora priznate su kao nezavisne države na Berlinskom kongresu 1878."}, "lekcija": 1}, {"id": "sr-datum-mletacka", "vrsta": "datum", "tezina": "srednje", "pojmovi": ["mletacka-republika"], "dogadjaj": "Ukidanje Mletačke republike", "pitanje": "Koje godine je ukinuta Mletačka republika, na čijem prostoru su takođe živeli Srbi?", "godina": 1797, "traka": "srbi", "pomoc": ["Pred sam kraj XVIII veka.", "Godinu dana posle Dženerove vakcine.", "Iz lekcije: Mletačka republika je ukinuta 1797."], "objasnjenje": "Mletačka republika je ukinuta 1797; do tada su i u njoj živeli Srbi.", "iz_udzbenika": {"strana": 14, "odeljak": "Srpski narod od kraja XVIII veka do Prvog svetskog rata", "tekst": "Srbi su živeli i na prostoru Mletačke republike do njenog ukidanja 1797."}, "lekcija": 1}, {"id": "sr-poredjaj-srbi", "vrsta": "poredjaj", "tezina": "lako", "pojmovi": ["knezevina-srbija", "berlinski-kongres", "balkanski-ratovi"], "pitanje": "Poređaj događaje iz srpske istorije hronološki.", "stavke": [{"tekst": "Prvi i Drugi srpski ustanak — nastaje Kneževina Srbija", "godina": 1800, "do": 1830, "naziv": "Srpski ustanci i Kneževina Srbija", "traka": "srbi", "oznaka": "početak XIX veka"}, {"tekst": "Berlinski kongres priznaje nezavisnost Srbije i Crne Gore", "godina": 1878, "naziv": "Berlinski kongres", "traka": "srbi"}, {"tekst": "Balkanski ratovi oslobađaju Rašku, Kosovo i Metohiju", "godina": 1900, "do": 1914, "naziv": "Balkanski ratovi", "traka": "srbi", "oznaka": "početak XX veka"}], "pomoc": ["Prvo mora nastati država, pa tek onda biti priznata.", "Balkanski ratovi su početkom XX veka.", "Iz lekcije: ustanci (početak XIX veka) → Berlinski kongres (1878) → balkanski ratovi (početak XX veka)."], "objasnjenje": "Ustanc ropolitima.", "Šta im je bilo zajedničko 1878. i početkom XX veka?", "Iz lekcije: str. 14 — Srbija i Crna Gora."], "objasnjenje": "Različitog porekla i dinastija, Srbija i Crna Gora zajedno dobijaju nezavisnost 1878. i zajedno ratuju u balkanskim ratovima.", "iz_udzbenika": {"strana": 14, "odeljak": "Srpski narod od kraja XVIII veka do Prvog svetskog rata", "tekst": "Udžbenik opisuje Kneževinu Srbiju i Crnu Goru kao dve srpske države, obe priznate kao nezavisne 1878."}, "lekcija": 1}, {"id": "sr-uporedi-dva-carstva", "vrsta": "uporedi", "tezina": "tesko", "pojmovi": ["habzburska-monarhija", "osmansko-carstvo", "karlovacka-mitropolija", "raska-oblast"], "a": "Srbi u Habzburškoj (Austrougarskoj) monarhiji", "b": "Srbi pod osmanskom vlašću (posle 1878)", "pitanje": "Na koju grupu Srba se odnosi tvrdnja — A, B, obe ili nijednu?", "tvrdnje": [{"tekst": "Najimućniji sloj, građanstvo, ulaže u kulturne i prosvetne ustanove.", "odgovor": "a", "zasto": "To lekcija kaže za Srbe u Habzburškoj monarhiji."}, {"tekst": "Identitet čuva Karlovačka mitropolija.", "odgovor": "a", "zasto": "Karlovačka mitropolija je srpska crkva u Habzburškoj monarhiji."}, {"tekst": "Zbog pritisaka se stalno iseljavaju u Srbiju.", "odgovor": "b", "zasto": "Pritisci turskih vlasti i muslimanskih suseda teraju Srbe iz osmanskih krajeva."}, {"tekst": "Njihov broj se povećao 1878. okupacijom Bosne i Hercegovine.", "odgovor": "a", "zasto": "Okupacijom BiH više Srba je došlo pod austrougarsku vlast."}, {"tekst": "Oslobođeni su u balkanskim ratovima.", "odgovor": "b", "zasto": "Balkanski ratovi oslobađaju Rašku, Kosovo, Metohiju i delove Makedonije."}, {"tekst": "Žive u državi koju vode Karađorđevići i Obrenovići.", "odgovor": "nijedan", "zasto": "Tim dinastijama vlada Kneževina Srbija, ne carstva."}], "pomoc": ["Jedna grupa je bogatija i ima crkvenu organizaciju, druga trpi pritiske.", "Šta se desilo 1878. sa BiH?", "Iz lekcije: Srbi u Habzburškoj — građanstvo, Karlovačka mitropolija; pod Osmanlijama — Raška, Kosovo, Metohija, iseljavanje."], "objasnjenje": "Srbi u Habzburškoj monarhiji čuvaju identitet kroz kulturu i crkvu; Srbi pod Osmanlijama trpe pritiske dok ih ne oslobode balkanski ratovi.", "iz_udzbenika": {"strana": 14, "odeljak": "Srpski narod od kraja XVIII veka do Prvog svetskog rata", "tekst": "Udžbenik opisuje položaj Srba u Habzburškoj monarhiji i pod osmanskom vlašću posle 1878."}, "lekcija": 1}, {"id": "sr-ko-sam-katarina", "vrsta": "ko_sam", "tezina": "srednje", "pojmovi": ["katarina-ivanovic", "prvi-srpski-ustanak"], "tragovi": ["Moje delo je u udžbeniku uz odeljak o srpskom narodu.", "Oko 1844/45. naslikala sam uljem burnu bitku sa dimom i vatrom.", "Moja slika prikazuje oslobođenje Beograda u Prvom srpskom ustanku.", "Bila sam prva srpska slikarka."], "odgovori": [{"tekst": "Katarina Ivanović", "tacan": true}, {"tekst": "Marijana", "tacan": false, "zasto": "Marijana je simbol Francuske na karikaturi „Kina – kolač”, a ne slikarka."}, {"tekst": "Kraljica Viktorija", "tacan": false, "zasto": "Viktorija je britanska kraljica, prikazana na karikaturi o Kini."}, {"tekst": "„Istorija” sa karikature", "tacan": false, "zasto": "„Istorija” je ženska figura na karikaturi „Klackalica nacija”."}], "objasnjenje": "To je Katarina Ivanović, prva srpska slikarka, autorka slike „Oslobođenje Beograda u Prvom srpskom ustanku”.", "iz_udzbenika": {"strana": 14, "odeljak": "Srpski narod od kraja XVIII veka do Prvog svetskog rata", "tekst": "Sliku Oslobođenje Beograda u Prvom srpskom ustanku naslikala je prva srpska slikarka Katarina Ivanović, oko 1844/45.", "slika": "01-osnovne-odlike-perioda-1780-1918/09-oslobodjenje-beograda.jpg"}, "osa": {"naziv": "Slika „Oslobođenje Beograda”", "od": 1844, "do": 1845, "traka": "srbi"}, "lekcija": 1}, {"id": "sr-objasni-podeljen", "vrsta": "objasni", "tezina": "lako", "pojmovi": ["habzburska-monarhija", "osmansko-carstvo", "knezevina-srbija", "crna-gora"], "pitanje": "Zašto kažemo da je srpski narod u periodu 1780–1918. živeo podeljen? function helpHTML(z, s, fresh) {

// ---------- outcome ----------
function fail(z, text, given) {
  const s = st(z.id);
  s.miss++;
  (s.log = s.log || []).push({ v: given || '', ok: false });
  const ended = s.miss > steps(z);
  if (ended) { s.status = helpOn() ? 'revealed' : 'failed'; s.pts = 0; firstTry() && learnFrom(z, 0); if (helpOn()) place(z, false); toast(helpOn() ? 'Evo odgovora' : 'Netačno', false); }
  else toast(text || 'Netačno — pokušaj ponovo', false);
  finishCheck(); save(); renderItem(true); renderNav(); refreshScore();
  if (ended ? s.status === 'revealed' : helpOn() && !mobile()) openDrawer();
}
function succeed(z, given, pts) {   // pts: set only by self-graded `objasni`
  const s = st(z.id);
  s.status = 'ok'; s.pts = pts != null ? pts : ptsFor(s.miss);
  (s.log = s.log || []).push({ v: given || '', ok: true });
  if (firstTry()) learnFrom(z, s.pts);
  s.placed = place(z, true);
  toast('Tačno! +' + s.pts + (s.placed ? ' · na vremenskoj osi' : ''), true);
  finishCheck(); save(); renderItem(false); renderNav(); refreshScore();
  openDrawer();
}
const firstTry = () => !(state.mode === 'test' && att() && att().phase === 'ispravka');   // Ispravka does not change mastery

// ---------- item renderers ----------
const main = document.getElementById('main');
function frame(z, s, inner) {

    inner + '<div class="help-inline" id="helpInline"></div><div class="iactions" id="actions"></div>' +
    (isDone(s) ? '<div class="expl' + (s.status === 'ok' ? '' : ' rev') + '">' + (s.status === 'failed' ? 'Netačno. Odgovor ćeš videti u Ispravci.' : fmt(z.objasnjenje || '')) + '</div>' : '') + questionFig(z, s) + '</div>';

    (INFO.zasticeno ? 'this.parentNode.outerHTML=\'<p class=&quot;ref&quot;>Slika uz ovo pitanje je u <a href=&quot;' + esc(INFO.zasticeno) + '&quot;>verziji sa slikama iz udžbenika (lozinka)</a>.</p>\'' : 'this.parentNode.remove()') +

function prelude(z, s) {   // what stands above the options: a source, a cause→effect chain, the clues so far
  const done = isDone(s), right = z.odgovori && z.odgovori.find(o => o.tacan);
  if (z.vrsta === 'izvor') { const iz = z.izvor;
    return '<div class="src">' + (iz.autor || iz.naslov ? '<p class="who">' + esc([iz.autor, iz.naslov].filter(Boolean).join(' — ')) + '</p>' : '') +
      '<blockquote>' + fmt(iz.tekst) + '</blockquote>' + (iz.napomena ? '<p class="nt">' + fmt(iz.napomena) + '</p>' : '') + '</div>'; }
  if (z.vrsta === 'lanac') return '<div class="chain">' + z.karike.map((k, i) => (i ? '<span class="ar">→</span>' : '') +
    (i === z.praznina ? '<div class="lk q' + (done && s.status !== 'failed' ? ' ok' : '') + '">' + (done && s.status !== 'failed' ? fmt(right.tekst) : '?') + '</div>' : '<div class="lk">' + fmt(k) + '</div>')).join('') + '</div>';
  if (z.vrsta === 'ko_sam') { const n = Math.min(z.tragovi.length, done ? z.tragovi.length : s.miss + 1);
    return '<ul class="clues">' + z.tragovi.slice(0, n).map((t, i) => '<li><span class="k">Trag ' + (i + 1) + '</span>' + fmt(t) + '</li>').join('') + '</ul>'; }
  return '';
}
function renderChoice(z, s) {   // izbor, zakljuci, lanac, izvor, ko_sam (+ the correction step of tacno_netacno)
  const opts = shuffled(z.odgovori, z.id);
  const multi = z.odgovori.filter(o => o.tacan).length > 1;
  const ui = s.ui; ui.wrong = ui.wrong || []; ui.pick = ui.pick || [];
  const done = isDone(s), showRight = s.status === 'ok' || s.status === 'revealed';
  const why = o => o.zasto && (helpOn() || (done && s.status !== 'failed')) ? '<span class="why">' + fmt(o.zasto) + '</span>' : '';
  main.innerHTML = frame(z, s, prelude(z, s) + '<h2 class="q">' + fmt(z.pitanje || (z.vrsta === 'ko_sam' ? 'Ko sam ja?' : 'Koja karika nedostaje?')) + '</h2><div class="opts">' + opts.map(([o, i]) =>
    '<button type="button" class="opt' + (multi ? '' : ' round') + (ui.wrong.includes(i) ? ' wrong' : '') + (showRight && o.tacan ? ' right' : '') +
    (!done && ui.pick.includes(i) ? ' picked' : '') + '" data-i="' + i + '"' + (done || ui.wrong.includes(i) ? ' disabled' : '') + '><span class="box"></span><span><span class="ot">' + fmt(o.tekst) + '</span>' +
    (ui.wrong.includes(i) ? why(o) : '') + '</span></button>').join('') + '</div>');
  if (!done && multi) actions([['btnCheck', 'Proveri', 'ok']]);
  if (!done && z.vrsta === 'ko_sam' && s.miss < steps(z)) { actions([['btnClue', 'Još jedan trag']]); document.getElementById('btnClue').addEventListener('click', () => { ui.why = null; fail(z, 'Novi trag', 'zatražen novi trag'); }); }
  main.querySelectorAll('.opt').forEach(b => b.addEventListener('click', () => {
    const i = +b.dataset.i;

  if (m === state.mode) return;
  state.mode = m;
  state.cur = m === 'test' && !att() ? '_start' : (listIds().find(id => !isDone(st(id))) || '_sum');
  closeDrawer(); save(); refresh();
}));
document.getElementById('mReset').addEventListener('click', () => {
  if (state.mode === 'ucenje') {
    if (!confirm('Počni učenje ispočetka — novi izbor zadataka?')) return;
    newLearning();
  } else {
    const a = att(); if (!a || a.end || !confirm('Odustati od ovog testa? Neće biti zabeležen.')) return;
    state.tests = state.tests.filter(t => t.id !== a.id); state.active = null; state.cur = '_start';
  }
  save(); refresh();
});
document.getElementById('mRepeat').addEventListener('click', () => {
  const rev = state.ucenje.items.filter(z => (state.ucenje.b[z.id] || {}).status === 'revealed').map(z => z.id);
  rev.forEach(id => { delete state.ucenje.b[id]; });
  if (rev.length) { state.cur = rev[0]; save(); refresh(); }
});

// ---------- init ----------
if (!state.ucenje) newLearning();
if (!byId(state.cur) && !['_sum', '_start', '_znanje', '_osa'].includes(state.cur) && !String(state.cur).startsWith('r:') && !lekRoute()) state.cur = state.mode === 'test' ? '_start' : state.ucenje.items[0].id;
refresh();
let introSeen = false; try { introSeen = localStorage.getItem(STATE_KEY + ':intro') === '1'; } catch (e) {}
if (!introSeen) showIntro();
</script>
