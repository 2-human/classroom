<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Osnovne odlike perioda 1780–1918 — kviz</title>
<style>

 :root{--hub-bg:#faf8f2;--hub-card:#fff;--hub-ink:#2b2b2b;--hub-head:#3a3528;--hub-mute:#6b6456;--hub-line:#e6e0d2;--hub-soft:#f3ecd8;--hub-accent:#b1271f;--hub-ok:#1f7a3a;--hub-nav-w:280px;--hub-drawer-w:440px}
 html:has(.app-body){overflow:hidden}
 .app-body{margin:0;height:100vh;height:100dvh;overflow:hidden;display:flex;flex-direction:column;max-width:100vw;background:var(--hub-bg);color:var(--hub-ink);font-family:system-ui,Segoe UI,Roboto,Arial,sans-serif}
 .app-bar{flex:0 0 auto;display:flex;align-items:center;gap:14px;padding:8px 16px;background:var(--hub-card);border-bottom:1px solid var(--hub-line);min-width:0;position:relative;z-index:50}
 .app-bar .app-menu{display:none;padding:0;width:36px;height:34px;font-size:18px;line-height:1;border:1px solid var(--hub-line);background:var(--hub-card);color:var(--hub-head);border-radius:7px;cursor:pointer}
 .app-bar .app-menu:hover{background:var(--hub-soft);color:var(--hub-head)}
 .brand{font-weight:700;font-size:15px;color:var(--hub-head);text-decoration:none;white-space:nowrap}
 .brand:hover{color:var(--hub-accent)}
 .app-crumbs{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--hub-mute);min-width:0;overflow:hidden;white-space:nowrap}
 .app-crumbs a{color:var(--hub-mute);text-decoration:none}
 .app-crumbs a:hover{color:var(--hub-accent)}
 .app-crumbs .sep{color:#b9b2a0}
 .app-crumbs .cur{color:var(--hub-head);font-weight:600;overflow:hidden;text-overflow:ellipsis}
 .bar-right{margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end;min-width:0}
 .app-grid{flex:1 1 auto;display:grid;grid-template-columns:var(--hub-nav-w) minmax(0,1fr);min-height:0}
 .app-nav{background:var(--hub-card);border-right:1px solid var(--hub-line);overflow:auto;padding:10px 10px 40px;min-height:0}
 .app-filter{width:100%;font:inherit;font-size:13px;padding:7px 9px;border:1px solid var(--hub-line);border-radius:6px;margin:0 0 4px;background:#fff;color:var(--hub-ink)}
 .app-filter:focus{outline:none;border-color:var(--hub-mute)}
 .app-nav .sec{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--hub-mute);padding:12px 6px 4px}
 .app-nav .cnt{font-size:11px;color:var(--hub-mute);font-variant-numeric:tabular-nums;letter-spacing:0;text-transform:none}
 .f-hide{display:none!important}
 .app-main{position:relative;overflow:auto;min-width:0;min-height:0;transition:margin-right .18s ease}
 .app-drawer{position:fixed;top:var(--htop,50px);right:0;bottom:0;width:var(--hub-drawer-w);max-width:100vw;background:var(--hub-card);border-left:1px solid var(--hub-line);box-shadow:-8px 0 24px rgba(58,53,40,.10);transform:translateX(105%);transition:transform .18s ease;z-index:60;display:flex;flex-direction:column}
 .app-drawer.open{transform:none}
 .drawer-head{display:flex;align-items:flex-start;gap:10px;padding:14px 16px 10px;border-bottom:1px solid var(--hub-line)}
 .drawer-head h2{margin:0;font-size:16px;color:var(--hub-head);flex:1 1 auto;overflow-wrap:anywhere}
 .app-drawer .drawer-close{border:0;background:none;padding:0 4px;font-size:24px;line-height:1;cursor:pointer;color:var(--hub-mute)}
 .app-drawer .drawer-close:hover{background:none;color:var(--hub-accent)}
 .drawer-body{flex:1 1 auto;overflow:auto;padding:12px 16px 24px;font-size:13px;line-height:1.55}
 .drawer-foot{flex:0 0 auto;border-top:1px solid var(--hub-line);padding:10px 16px;font-size:12px;color:var(--hub-mute)}
 .mtabs{display:flex;gap:2px;border-bottom:1px solid var(--hub-line);flex-wrap:wrap;background:var(--hub-card);padding:0 12px}
 .mtabs a{text-decoration:none;color:var(--hub-mute);font-size:13px;padding:9px 12px 8px;border-bottom:2px solid transparent}
 .mtabs a[aria-current="page"]{color:var(--hub-head);border-bottom-color:var(--hub-accent);font-weight:600}
 .bar-menu-wrap{position:relative}
 .bar-menu{display:none;position:absolute;right:0;top:calc(100% + 8px);z-index:70;background:var(--hub-card);border:1px solid var(--hub-line);border-radius:10px;box-shadow:0 6px 20px rgba(0,0,0,.16);padding:8px;min-width:240px}
 .bar-menu.open{display:flex;flex-direction:column;align-items:stretch;gap:6px}
 .tbl{width:100%;border-collapse:collapse;background:var(--hub-card);border:1px solid var(--hub-line);border-radius:6px;font-size:13px}
 .tbl th{text-align:left;font-weight:600;font-size:11.5px;color:var(--hub-mute);padding:8px 10px;border-bottom:1px solid var(--hub-line);background:#fcfaf4;white-space:nowrap}
 .tbl td{padding:7px 10px;border-bottom:1px solid #f0ebe0;vertical-align:top}
 .tbl td.num,.tbl th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
 .tbl tr.clk{cursor:pointer} .tbl tr.clk:hover td{background:#fbf7ec}
 @media (min-width:1200px){ .app-body:has(.app-drawer.open) .app-main{margin-right:var(--hub-drawer-w)} }
 @media (max-width:760px){
   .app-bar{gap:10px;padding:8px 12px}
   .app-bar .app-menu{display:inline-block}
   .app-crumbs{display:none}
   .app-grid{grid-template-columns:minmax(0,1fr)}
   .app-nav{position:fixed;top:var(--htop,50px);left:0;bottom:0;width:300px;max-width:88vw;z-index:55;transform:translateX(-105%);transition:transform .18s ease;box-shadow:8px 0 24px rgba(58,53,40,.10)}
   .app-nav.open{transform:none}
   .app-drawer{width:100vw}
 }
 @media print{
   html:has(.app-body){overflow:visible}
   .app-body{height:auto;overflow:visible;display:block}
   .app-grid{display:block}
   .app-main,.app-nav{overflow:visible}
   .app-drawer,.app-filter,.app-menu,.bar-menu-wrap,.mtabs{display:none!important}
 }

 .les{max-width:860px;padding:22px 28px 80px;line-height:1.6;color:#2b2b2b}
 .les h1{font-size:25px;margin:0 0 4px;color:#3a3528}
 .les .meta{color:#6b6456;font-size:13.5px;margin:0 0 6px}
 .les .meta a{color:#b1271f;text-decoration:none}
 .les section{margin:22px 0;scroll-margin-top:12px}
 .les h2{font-size:18px;color:#3a3528;margin:0 0 8px;padding-bottom:5px;border-bottom:1px solid #e6e0d2}
 .les h3{font-size:15.5px;color:#3a3528;margin:0 0 6px}
 .les section.l3{margin-left:14px;padding-left:12px;border-left:3px solid #f3ecd8}
 .les .str{font-size:12px;font-weight:400;color:#6b6456;margin-left:6px;white-space:nowrap}
 .les ul,.les ol{padding-left:22px;margin:6px 0} .les li{margin:3px 0}
 .les p{margin:6px 0}
 .les a{color:#b1271f}
 .les .pojam{border-bottom:1px dotted #b9b2a0}
 .les blockquote{margin:8px 0;padding:6px 14px;border-left:3px solid #c98a2c;background:#fefcf7}
 .les .tbl{overflow-x:auto} .les table{border-collapse:collapse;font-size:14px;margin:8px 0}
 .les th,.les td{border:1px solid #e6e0d2;padding:4px 8px;text-align:left;vertical-align:top} .les th{background:#f3ecd8}
 .strana{margin:26px 0 14px;scroll-margin-top:12px;background:#fff;border:1px solid #e6e0d2;border-radius:10px;overflow:hidden}
 .strana .pg{display:flex;justify-content:space-between;align-items:center;padding:7px 12px;font-size:12.5px;color:#6b6456;background:#fbf7ec;border-bottom:1px solid #e6e0d2}
 .strana .pg b{color:#3a3528}
 .strana .pg button{font:inherit;font-size:12px;border:1px solid #e6e0d2;background:#fff;border-radius:6px;padding:2px 9px;cursor:pointer;color:#3a3528}
 .strana img{display:block;width:100%;height:auto;cursor:zoom-in}
 .strana.zoom{overflow-x:auto} .strana.zoom img{width:auto;max-width:none;cursor:zoom-out}
 .strana.nema{padding:12px;color:#9b9387;font-size:13.5px;background:#fefcf7}
 .notes-lbl{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:#1f7a3a;margin:0 0 -12px}
 .gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin-top:8px}
 .gal figure{margin:0;background:#fff;border:1px solid #e6e0d2;border-radius:8px;overflow:hidden;scroll-margin-top:12px}
 .gal img{display:block;width:100%;height:auto} .gal figcaption{font-size:12.5px;color:#6b6456;padding:6px 9px}
 .hit{animation:hit 2.4s ease-out} @keyframes hit{0%{box-shadow:0 0 0 4px rgba(201,138,44,.55)}100%{box-shadow:0 0 0 4px rgba(201,138,44,0)}}

 :root{--ink:#2b2b2b;--muted:#6b6456;--edge:#b1271f;--accent:#1f7a3a;--border:#e6e0d2;--soft:#fefcf7;--warn:#c98a2c;
       --sea:#cfe6f2;--land:#efeae0;--land-se:#f3ecd8;--bord:#8a8170}
 *{box-sizing:border-box}
 button{font:inherit;padding:7px 14px;border:1px solid var(--edge);background:#fff;color:var(--edge);border-radius:8px;cursor:pointer}
 button:hover{background:var(--edge);color:#fff}
 button.ok{border-color:var(--accent);color:var(--accent)} button.ok:hover{background:var(--accent);color:#fff}
 button:disabled{opacity:.45;cursor:default;background:#fff;color:inherit}
 .opt:disabled,.tn button:disabled,.mcell:disabled,.blank:disabled{opacity:1;cursor:default}
 .opt:disabled:not(.right):not(.wrong){opacity:.6}
 .bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-size:14px}
 .bar-menu-btn{padding:5px 12px;font-size:16px;line-height:1;border-color:var(--muted);color:#3a3528}
 .bar-menu-btn:hover{background:#f3ecd8;color:#3a3528}
 .bar-menu button{width:100%;text-align:left}
 .bar-menu .menu-link{display:block;font-size:13px;color:var(--edge);text-decoration:none;padding:7px 14px;border:1px dashed #e6b0b0;border-radius:8px}
 .mode-switch{display:inline-flex}
 .ms-btn{padding:5px 12px;border-color:#6b6456;color:#3a3528;min-width:5.5em}
 .ms-btn:first-child{border-radius:8px 0 0 8px} .ms-btn:last-child{border-radius:0 8px 8px 0;border-left:none}
 .ms-btn:hover{background:#f3ecd8;color:#3a3528}
 .ms-btn.active{background:#3a3528;color:#fff;border-color:#3a3528}
 .stat{background:#f3ecd8;border:1px solid #e1d8c2;border-radius:8px;padding:4px 10px;white-space:nowrap}
 .stat b{font-size:15px;color:var(--accent)}
 .intro p{font-size:14px;color:#4a4434;line-height:1.6;margin:0 0 10px}
 .intro ul{margin:0 0 10px;padding-left:18px;font-size:13.5px;line-height:1.55}
 /* navigation: items */
 .it-row{display:flex;align-items:center;gap:8px;width:100%;border:0;border-radius:5px;background:none;color:var(--ink);font:inherit;font-size:13px;text-align:left;padding:5px 6px;cursor:pointer}
 a.it-row{text-decoration:none;box-sizing:border-box}
 .it-row:hover{background:#f6f1e4;color:var(--ink)}
 .it-row.sel{background:#efe7d2;font-weight:600}
 .it-row.off{opacity:.4}
 .it-row .st{flex:0 0 16px;text-align:center;color:#b9b2a0}
 .it-row.ok .st{color:var(--accent)} .it-row.rev .st,.it-row.fail .st{color:var(--edge)} .it-row.part .st{color:var(--warn)}
 .it-row .lbl{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
 .it-row .pt{flex:0 0 auto;font-size:11px;color:var(--muted);font-weight:400;font-variant-numeric:tabular-nums}
 .tz{flex:0 0 auto;display:inline-block;min-width:1.5em;text-align:center;font-size:10px;font-weight:700;border-radius:8px;padding:1px 5px;letter-spacing:.02em}
 .tz-lako{background:#e3f2e8;color:#1f6b3a} .tz-srednje{background:#fbefd5;color:#8a5a14} .tz-tesko{background:#f8dcd8;color:#8a2a22}
 .tz-legend{display:flex;gap:8px;flex-wrap:wrap;font-size:11px;color:var(--muted);padding:2px 6px 0}
 /* main: item */
 .item{padding:20px 24px 40px;max-width:1100px}
 .ihead{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-bottom:8px}
 .vchip{font-size:11px;text-transform:uppercase;letter-spacing:.05em;border:1px solid var(--border);border-radius:9px;padding:1px 8px;background:#fff}
 .item h2.q{font-size:18px;line-height:1.4;color:#3a3528;margin:0 0 14px}
 .opts{display:flex;flex-direction:column;gap:8px;max-width:640px}
 .opt{display:flex;gap:10px;align-items:flex-start;text-align:left;border:1px solid var(--border);background:#fff;color:var(--ink);border-radius:8px;padding:10px 12px;font-size:14.5px;line-height:1.4}
 .opt:hover{background:#fbf7ec;color:var(--ink)}
 .opt.picked{border-color:#3a3528;background:#f6f1e4}
 .opt.wrong{border-color:#e6b0b0;background:#fdecec;color:#8a2a22} .opt.wrong .ot{text-decoration:line-through}
 .opt.right{border-color:#9fd5b6;background:#e8f5ec;color:#13602c;font-weight:600}
 .opt .box{flex:0 0 18px;height:18px;border:1.5px solid #6b6456;border-radius:4px;margin-top:1px}
 .opt.picked .box{background:#3a3528;box-shadow:inset 0 0 0 3px #fff}
 .opt.round .box{border-radius:50%}
 .tn{display:flex;gap:12px;margin:4px 0 14px}
 .tn button{min-width:8em;padding:10px 18px;font-size:15px}
 .tn button.right{background:var(--accent);border-color:var(--accent);color:#fff}
 .tn button.wrong{background:#fdecec;border-color:#e6b0b0;color:#8a2a22}
 .stmt{font-size:16px;line-height:1.5;border-left:3px solid #e1d8c2;padding:6px 12px;margin:0 0 14px;background:#fff}
 .sub-q{font-weight:600;color:#3a3528;margin:16px 0 8px}
 .cloze{font-size:16px;line-height:2.3;max-width:720px}
 .blank{display:inline-block;min-width:5.5em;border:0;border-bottom:2px solid #6b6456;background:#fff;text-align:center;font:inherit;font-weight:600;color:#3a3528;padding:0 6px;margin:0 3px;border-radius:4px 4px 0 0;cursor:pointer}
 input.blank{cursor:text;width:7em}
 .blank:hover{background:#fbf7ec;color:#3a3528}
 .blank.cur{border-bottom-color:var(--edge);background:#fff7f3}
 .blank.lock{border-bottom-color:var(--accent);background:#e8f5ec;color:#13602c;cursor:default}
 .blank.bad{border-bottom-color:var(--edge);background:#fdecec;color:#8a2a22}
 .blank.rev{border-bottom-color:var(--warn);background:#fdf3e2;color:#8a5a14}
 .bank{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 0}
 .bank button{padding:5px 12px;border-color:#6b6456;color:#3a3528;border-radius:16px}
 .bank button:hover{background:#f3ecd8;color:#3a3528}
 .bank button.used{opacity:.3;pointer-events:none}
 .match{display:grid;grid-template-columns:1fr 1fr;gap:10px 28px;max-width:720px}
 .match .col{display:flex;flex-direction:column;gap:8px}
 .mcell{text-align:left;border:1px solid var(--border);background:#fff;color:var(--ink);border-radius:8px;padding:9px 12px;font-size:14px}
 .mcell:hover{background:#fbf7ec;color:var(--ink)}
 .mcell.cur{border-color:#3a3528;box-shadow:0 0 0 2px rgba(58,53,40,.15)}
 .mcell.done{border-color:#9fd5b6;background:#e8f5ec;color:#13602c;cursor:default}
 .mcell.rev{border-color:#ecc98a;background:#fdf3e2;color:#8a5a14;cursor:default}
 .mcell.bad{animation:shake .3s;border-color:#e6b0b0;background:#fdecec}
 .mcell .n{display:inline-block;min-width:1.4em;font-weight:700;margin-right:6px;color:var(--muted)}
 @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
 .iactions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:18px}
 .fb{font-size:14px;font-weight:600;min-height:1.4em}
 .fb.ok{color:var(--accent)} .fb.bad{color:var(--edge)} .fb.info{color:var(--muted);font-weight:400}
 .expl{margin-top:14px;padding:10px 14px;border-radius:8px;background:#e8f5ec;border:1px solid #bfe0c8;color:#13602c;font-size:14px;line-height:1.5;max-width:720px}
 .expl.rev{background:#fdf3e2;border-color:#f0d878;color:#6b4a10}
 .help-inline{display:none}
 /* map */
 .mapwrap{position:relative;margin-top:6px;border:1px solid var(--border);border-radius:8px;overflow:hidden;background:var(--sea);aspect-ratio:1/1;max-height:70vh;touch-action:none}
 .mapwrap svg{width:100%;height:100%;display:block;cursor:crosshair}
 .mapwrap svg.drag{cursor:grabbing}
 .mapwrap .c{fill:var(--land);stroke:var(--bord);stroke-width:.6;vector-effect:non-scaling-stroke}
 .mapwrap .c.se{fill:var(--land-se)}
 .mapwrap .c.se:hover{fill:#e9dcb8}
 .mapwrap .c.hit{fill:#bfe0c8} .mapwrap .c.miss{fill:#f3c9c4} .mapwrap .c.revc{fill:#f6dca6}
 .mapwrap .mk{pointer-events:none}
 .mapwrap .mk circle{stroke:#fff;vector-effect:non-scaling-stroke}
 .mapwrap .mk text{font-size:13px;font-weight:700;paint-order:stroke;stroke:#fff;stroke-width:3px;vector-effect:non-scaling-stroke}
 .zbar{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px}
 .zbar button{width:36px;height:36px;padding:0;font-size:18px;font-weight:700;background:#fff;border-color:#6b6456;color:#3a3528;box-shadow:0 1px 3px rgba(0,0,0,.2)}
 .zbar button:hover{background:#f3ecd8;color:#3a3528}
 .zhint{position:absolute;left:10px;bottom:8px;font-size:11.5px;color:var(--muted);background:rgba(255,255,255,.85);border-radius:6px;padding:3px 8px;pointer-events:none}
 .clues{list-style:none;margin:0 0 6px;padding:0;max-width:720px}
 .clues li{padding:7px 10px;margin:0 0 6px;border-left:3px solid #e1d8c2;background:#fff;font-size:14.5px;line-height:1.45}
 .clues li:last-child{border-left-color:var(--edge)}
 .clues .k{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-right:6px}
 /* drawer content */
 .hl h3{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:14px 0 6px}
 .hl ol{margin:0;padding-left:20px} .hl li{margin:0 0 10px;line-height:1.5}
 .hl li.new{animation:flash 1.2s}
 @keyframes flash{0%{background:#fff3c4}100%{background:transparent}}
 .hl .placeholder{color:#9b9387;font-style:italic}
 .hl .chips{display:flex;flex-wrap:wrap;gap:6px}
 .hl .pchip{font-size:12px;border:1px solid var(--border);border-radius:10px;padding:1px 9px;background:#fefcf7}
 .hl a{color:var(--edge);text-decoration:none}
 .hl ul{margin:0;padding-left:18px} .hl ul li{margin:3px 0}
 .hl .ref{font-size:12px;color:var(--muted);margin:0 0 6px}
 .hl figure{margin:6px 0 10px} .hl figure img{display:block;max-width:100%;border-radius:6px;border:1px solid var(--border)}
 .qfig{margin:16px 0 0;max-width:720px} .qfig img{display:block;max-width:100%;max-height:62vh;border-radius:8px;border:1px solid var(--border);cursor:zoom-in}
 .qfig.zoom{max-width:none;overflow-x:auto} .qfig.zoom img{max-width:none;max-height:none;cursor:zoom-out}
 .qfig figcaption{font-size:12.5px;color:var(--muted);margin-top:5px}
 .hl figcaption{font-size:11.5px;color:var(--muted);margin-top:4px}
 .hl .book{border-left:3px solid #e1d8c2;padding:2px 0 2px 12px;margin:6px 0 4px}
 .hl .odeljak{margin:10px 0 4px;padding:8px 12px;background:#fefcf7;border:1px solid #e6e0d2;border-radius:8px;font-size:14px;line-height:1.5}
 .hl .odeljak summary{cursor:pointer;font-weight:600;color:#3a3528;font-size:13px}
 .hl .odeljak ul,.hl .odeljak ol{padding-left:20px;margin:6px 0} .hl .odeljak li{margin:3px 0} .hl .odeljak p{margin:6px 0}
 .hl .odeljak table{border-collapse:collapse;font-size:13px} .hl .odeljak th,.hl .odeljak td{border:1px solid #e6e0d2;padding:3px 6px}
 .hl .tekst-links{display:flex;flex-wrap:wrap;gap:6px 14px;margin:8px 0 4px;font-size:13.5px}
 .hl .tekst-links a{color:var(--edge);font-weight:600;text-decoration:none}
 /* the lesson (protected copy): main column via the nav, or one part of it in the wide drawer */
 .app-drawer.wide{width:min(820px,100vw)}
 .app-drawer .les{padding:0;max-width:none}
 .app-drawer .les section,.app-drawer .les .strana{margin:0 0 16px}
 .lekbar{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}
 .lekbar button{font-size:13px;padding:6px 12px}
 /* summary */
 .sum{padding:22px 26px 40px;max-width:860px}
 .sum h1{font-size:22px;margin:0 0 6px;color:#3a3528}
 .sum .big{font-size:30px;font-weight:700;color:var(--accent)}
 .sum .tbl{margin:14px 0}

<script>
(function () {
  const root = document.documentElement;
  const bar = document.querySelector('.app-bar');
  function setTop() { if (bar) root.style.setProperty('--htop', bar.offsetHeight + 'px'); }
  window.addEventListener('resize', setTop);
  setTop();

  // ☰ navigation (only shown at ≤760px)
  const nav = document.getElementById('app-nav');
  const navBtn = document.getElementById('app-menu');
  const navOverlay = () => window.matchMedia && window.matchMedia('(max-width:760px)').matches;
  function setNav(open) {
    if (!nav) return;
    nav.classList.toggle('open', !!open);
    if (navBtn) navBtn.setAttribute('aria-expanded', String(!!open));
  }
  if (navBtn) navBtn.addEventListener('click', e => { e.stopPropagation(); setNav(!nav.classList.contains('open')); });

  // navigation filter: case- and diacritic-insensitive (š, č, ć, ž, đ)
  const filter = document.getElementById('app-filter');
  const norm = s => String(s || '').toLowerCase().replace(/đ/g, 'd').normalize('NFD').replace(/[̀-ͯ]/g, '');
  function applyFilter() {
    const q = norm(filter.value.trim());
    document.querySelectorAll('#app-nav [data-filter]').forEach(el =>
      el.classList.toggle('f-hide', !!q && !norm(el.dataset.filter).includes(q)));
    document.querySelectorAll('#app-nav [data-filter-group]').forEach(g =>
      g.classList.toggle('f-hide', !!q && !g.querySelector('[data-filter]:not(.f-hide)')));
  }
  if (filter) filter.addEventListener('input', applyFilter);

  // ⋯ menus: a button with data-menu="<id>" toggles .bar-menu#<id>; a button inside closes it
  function setMenu(m, open) {
    m.classList.toggle('open', !!open);
    const b = document.querySelector('[data-menu="' + m.id + '"]');
    if (b) b.setAttribute('aria-expanded', String(!!open));
  }
  document.querySelectorAll('[data-menu]').forEach(btn => {
    const m = document.getElementById(btn.dataset.menu);
    if (!m) return;
    btn.addEventListener('click', e => { e.stopPropagation(); setMenu(m, !m.classList.contains('open')); });
    m.addEventListener('click', e => { e.stopPropagation(); if (e.target.closest('button')) setMenu(m, false); });
  });
  document.addEventListener('click', e => {
    // composedPath: the clicked node may already be re-rendered away (e.g. a step's "next" button)
    if (!e.composedPath().some(n => n.dataset && n.dataset.keepMenus)) document.querySelectorAll('.bar-menu.open').forEach(m => setMenu(m, false));
    if (nav && nav.classList.contains('open') && navOverlay() && !nav.contains(e.target)) setNav(false);
  });
  document.addEventListener('keydown', e => {
    if (e.key !== 'Escape') return;
    document.querySelectorAll('.bar-menu.open').forEach(m => setMenu(m, false));
    const x = document.querySelector('.app-drawer.open .drawer-close');
    if (x && x.offsetParent !== null) x.click();
  });

  window.HubShell = { setNav, setMenu, applyFilter, navOverlay };
})();
</script>

"Koje godine je Kolumbo otkrio Ameriku i tako započeo novi vek?", "godina": 1492, "traka": "svet", "pomoc": ["Bilo je to pri samom kraju XV veka.", "Samo dve godine posle karte sveta iz 1490. na kojoj Amerike još nema.", "Iz lekcije: Kolumbovo otkriće Amerike, 1492."], "objasnjenje": "Kolumbo je stigao do Amerike 1492; ta godina je početak novog veka.", "iz_udzbenika": {"strana": 10, "odeljak": "Novi vek – pojam i hronološki okviri", "tekst": "Početak novog veka udžbenik vezuje za Kolumbovo otkriće Amerike 1492. godine."}, "lekcija": 1}, {"id": "nv-datum-kraj", "vrsta": "datum", "tezina": "lako", "pojmovi": ["novi-vek", "prvi-svetski-rat"], "dogadjaj": "Kraj Prvog svetskog rata", "pitanje": "Koje godine se završio Prvi svetski rat, a s njim i novi vek?", "godina": 1918, "traka": "svet", "pomoc": ["Ista godina je i u naslovu lekcije.", "Period koji učimo traje od 1780. do te godine.", "Iz lekcije: kraj Prvog svetskog rata 1918. je kraj novog veka."], "objasnjenje": "Novi vek se završava 1918. godine, krajem Prvog svetskog rata.", "iz_udzbenika": {"strana": 10, "odeljak": "Novi vek – pojam i hronološki okviri", "tekst": "Novi vek traje do kraja Prvog svetskog rata, 1918. godine."}, "lekcija": 1}, {"id": "nv-datum-vat", "vrsta": "datum", "tezina": "srednje", "pojmovi": ["parna-masina", "dzejms-vat", "rani-novi-vek"], "dogadjaj": "Vatova parna mašina", "pitanje": "Koje godine je Džejms Vat napravio parnu mašinu kojom se završava rani novi vek?", "godina": 1769, "traka": "otkrica", "pomoc": ["Bilo je to u drugoj polovini XVIII veka, malo pre 1780.", "Samo jedanaest godina pre početka perioda koji učimo.", "Iz lekcije: Vatova parna mašina, 1769."], "objasnjenje": "Vatova parna mašina (1769) zatvara rani novi vek i pokreće industrijsku revoluciju.", "iz_udzbenika": {"strana": 10, "odeljak": "Novi vek – pojam i hronološki okviri", "tekst": "Rani novi vek traje od velikih geografskih otkrića do pronalaska Vatove parne mašine 1769."}, "lekcija": 1}, {"id": "nv-datum-rani", "vrsta": "datum", "tezina": "srednje", "pojmovi": ["rani-novi-vek", "predindustrijsko-doba"], "dogadjaj": "Rani novi vek", "pitanje": "Od koje do koje godine traje rani novi vek (predindustrijsko doba)? Upiši početnu i završnu godinu.", "od": 1492, "do": 1769, "traka": "svet", "pomoc": ["Počinje kad i ceo novi vek.", "Završava se jednim pronalaskom britanskog pronalazača.", "Iz lekcije: od Kolumbovog otkrića (1492) do Vatove parne mašine (1769)."], "objasnjenje": "Rani novi vek traje od 1492. do 1769, od početka velikih geografskih otkrića do Vatove parne mašine.", "iz_udzbenika": {"strana": 10, "odeljak": "Novi vek – pojam i hronološki okviri", "tekst": "U 6. razredu učeni su događaji ranog novog veka, od velikih geografskih otkrića krajem XV veka do Vatove parne mašine 1769."}, "lekcija": 1}, {"id": "nv-tn-predindustrijsko", "vrsta": "tacno_netacno", "tezina": "lako", "pojmovi": ["rani-novi-vek", "predindustrijsko-doba"], "tvrdnja": "Rani novi vek se naziva i predindustrijsko doba, jer je trajao do početka industrije.", "tacno": true, "pomoc": ["„Pred” znači „pre”.", "Rani novi vek se završava parnom mašinom, a sa njom počinje industrija.", "Iz lekcije: rani novi vek = predindustrijsko doba, do Vatove parne mašine 1769."], "objasnjenje": "Tačno. Rani novi vek je doba pre industrije — završava se pronalaskom parne mašine.", "iz_udzbenika": {"strana": 10, "odeljak": "Novi vek – pojam i hronološki okviri", "tekst": "Rani novi vek udžbenik naziva i predindustrijskim dobom; traje do Vatove parne mašine."}, "osa": {"naziv": "Rani novi vek", "od": 1492, "do": 1769, "traka": "svet"}, "lekcija": 1}, {"id": "nv-tn-britanija", "vrsta": "tacno_netacno", "tezina": "srednje", "pojmovi": ["industrija", "velika-britanija", "parna-masina"], "tvrdnja": "Industrija zasnovana na parnoj mašini počela je da se razvija najpre u Francuskoj.", "tacno": false, "ispravke": [{"tekst": "Industrija je najpre počela da se razvija u Velikoj Britaniji, gde je parna mašina primenjena u preradi tkanina, metala i drveta.", "tacan": true}, {"tekst": "Industrija je najpre počela da se razvija u Rusiji.", "tacan": false, "zasto": "Rusija se u lekciji javlja kao velika sila, ali razvoj industrije počinje u Velikoj Britaniji, domovini Džejmsa Vata."}, {"tekst": "Industrija je najpre počela da se razvija u Sjedinjenim Američkim Državama.", "tacan": false, "zasto": "SAD nastaju tek krajem XVIII veka; parna mašina se prvo koristi u Velikoj Britaniji."}], "pomoc": ["Odakle je bio Džejms Vat?", "Industrija je krenula tamo gde je mašina prvo primenjena.", "Iz lekcije: parnom mašinom u Velikoj Britaniji počinje razvoj industrije."], "objasnjenje": "Vat je bio britanski pronalazač, pa se industrija najpre razvija u Velikoj Britaniji.", "iz_udzbenika": {"strana": 10, "odeljak": "Novi vek – pojam i hronološki okviri", "tekst": "Parna mašina se krajem XVIII veka koristi u preradi tkanina, metala i drveta, čime u Velikoj Britaniji počinje razvoj industrije."}, "lekcija": 1}, {"id": "nv-dopuni-pojmovi", "vrsta": "dopuni", "tezina": "lako", "pojmovi": ["industrija", "revolucija", "industrijska-revolucija"], "pitanje": "Dopuni rečenice.", "tekst": "Industrija je privredna grana zasnovana na korišćenju {{mašina}} u proizvodnji. Industrijska revolucija je masovni prelazak sa {{ručne}} na mašinsku proizvodnju. Revolucija je {{nagla}} i često nasilna promena postojećeg poretka.", "ponudjene": ["mašina", "ručne", "nagla", "životinja", "spora", "mašinske"], "pomoc": ["Industrija = proizvodnja uz pomoć …?", "Revolucija je suprotno od spore, postepene promene.", "Iz lekcije: industrija koristi mašine; industrijska revolucija = prelazak sa ručne na mašinsku proizvodnju."], "objasnjenje": "Industrija koristi mašine; industrijska revolucija je nagli, masovni prelazak sa ručne na mašinsku proizvodnju.", "iz_udzbenika": {"strana": 11, "odeljak": "Definicije", "tekst": "Revolucija je prevrat, nagla i često nasilna promena poretka; industrijska revolucija je preokret u proizvodnji — prelazak sa ručne na mašinsku."}, "lekcija": 1}, {"id": "nv-dopuni-okviri", "vrsta": "dopuni", "tezina": "srednje", "pojmovi": ["novi-vek", "rani-novi-vek", "velika-geografska-otkrica"], "pitanje": "Dopuni rečenice o granicama novog veka.", "tekst": "Novi vek dolazi posle {{srednjeg}} veka. Rani novi vek počinje velikim geografskim otkrićima krajem {{XV}} veka, a završava se pronalaskom parne mašine britanskog pronalazača {{Džejmsa Vata|Vata|Džejms Vat}}.", "ponudjene": ["srednjeg", "starog", "XV", "XVIII", "Džejmsa Vata", "Kristifora Kolumba"], "pomoc": ["Koji vek prethodi novom?", "Kolumbo plovi 1492 — u kom je to veku?", "Iz lekcije: rani novi vek traje od velikih geografskih otkrića krajem XV veka do Vatove parne mašine."], "objasnjenje": "Novi vek sledi posle srednjeg; njegov rani deo traje od otkrića krajem XV veka do Vatove parne mašine 1769.", "iz_udzbenika": {"strana": 10, "odeljak": "Novi vek – pojam i hronološki okviri", "tekst": "Novi vek dolazi posle srednjeg veka; rani novi vek obuhvata period od velikih geografskih otkrića do Vatove parne mašine."}, "lekcija": 1}, {"id": "nv-povezi-definicije", "vrsta": "povezi", "tezina": "lako", "pojmovi": ["revolucija", "industrijska-revolucija", "industrija", "kolonija", "istocno-pitanje"], "pitanje": "Poveži pojam sa njegovim značenjem.", "parovi": [["revolucija", "nagla, često nasilna promena političkog ili društvenog poretka"], ["industrijska revolucija", "masovni prelazak sa ručne na mašinsku proizvodnju"], ["industrija", "privredna grana zasnovana na korišćenju mašina"], ["kolonija", "posed strane sile u dalekim, prekomorskim krajevima"], ["Istočno pitanje", "pitanje opstanka Osmanskog carstva na Balkanu i Bliskom istoku"]], "pomoc": ["Kreni od pojma koji je najlakši — kolonija ili industrija.", "Industrija je grana privrede; industrijska revolucija je preokret, promena.", "Iz lekcije: „?” kućice na str. 11–13 objašnjavaju ove pojmove."], "objasnjenje": "Revolucija je nagla promena; industrijska revolucija je takva promena u proizvodnji; kolonija je prekomorski posed; Istočno pitanje se tiče opstanka Osmanskog carstva.", "iz_udzbenika": {"strana": 11, "odeljak": "Definicije", "tekst": "Udžbenik u „?” kućicama objašnjava pojmove revolucija, industrijska revolucija, kolonija i Istočno pitanje."}, "lekcija": 1}, {"id": "nv-zakljuci-revolucija", "vrsta": "zakljuci", "tezina": "srednje", "pojmovi": ["industrijska-revolucija", "parna-masina", "revolucija"], "pitanje": "Zašto se promene koje je pokrenula Vatova parna mašina nazivaju „revolucijom”, iako u njima nije bilo oružane borbe?", "odgovori": [{"tekst": "Zato što je širenje industrijske proizvodnje naglo i duboko promenilo privredu i društvo Evrope, a zatim i drugih kontinenata", "tacan": true}, {"tekst": "Zato što su radnici odmah srušili vlast kraljeva", "tacan": false, "zasto": "Lekcija tako nešto ne kaže; borba za radnička prava je trajala dugo, a ne kao brzo rušenje vlasti."}, {"tekst": "Zato što je parna mašina prvo korišćena u ratu", "tacan": false, "zasto": "Prvo je korišćena u preradi tkanina, metala i drveta — u proizvodnji, ne u ratu."}, {"tekst": "Zato što se desila u isto vreme kad i Francuska revolucija", "tacan": false, "zasto": "Vreme nije razlog naziva; „revolucija” ovde znači preokret — u proizvodnji."}], "pomoc": ["Korak 1: Šta reč revolucija znači — mora li uvek da bude nasilna?", "Korak 2: Šta je industrija promenila — samo fabrike ili i život ljudi i država?", "Iz lekcije: širenje industrijske proizvodnje imalo je dalekosežne posledice na privredni i društveni razvoj."], "objasnjenje": "Revolucija je preokret. Prelazak sa ručne na mašinsku proizvodnju toliko je promenio privredu i društvo da se zove industrijska revolucija.", "iz_udzbenika": {"strana": 11, "odeljak": "Novi vek – pojam i hronološki okviri", "tekst": "Širenje industrijske proizvodnje imalo je dalekosežne posledice na privredu i društvo Evrope i drugih kontinenata, pa se kaže da je Vatov pronalazak pokrenuo industrijsku revoluciju."}, "lekcija": 1}, {"id": "nv-zakljuci-granica", "vrsta": "zakljuci", "tezina": "tesko", "pojmovi": ["rani-novi-vek", "parna-masina", "industrijska-revolucija"], "pitanje": "Zašto udžbenik granicu između ranog novog veka i perioda 1780–1918 stavlja kod jednog pronalaska, a ne kod rata ili smene vladara?", "odgovori": [{"tekst": "Zato što je taj pronalazak pokrenuo industrijsku revoluciju, a ona je najvažnija odlika celog novog perioda", "tacan": true}, {"tekst": "Zato što u to vreme nije bilo nijednog rata", "tacan": false, "zasto": "Lekcija ne tvrdi da nije bilo ratova; granica je pronalazak zbog njegovih dalekosežnih posledica."}, {"tekst": "Zato što je Džejms Vat bio kralj Velike Britanije", "tacan": false, "zasto": "Vat je bio pronalazač, ne vladar."}, {"tekst": "Zato što je parna mašina odmah ukinula feudalizam u celoj Evropi", "tacan": false, "zasto": "Feudalizam je ukinut tek u prvoj polovini XIX veka, pod uticajem promena posle Francuske revolucije."}], "pomoc": ["Korak 1: Po čemu se period posle 1780. najviše razlikuje od ranijeg? (rast gradova, fabrike, železnica…)", "Korak 2: Šta je pokrenulo sve te promene?", "Iz lekcije: rani novi vek je predindustrijsko doba; Vatova mašina pokreće industrijsku revoluciju."], "objasnjenje": "Period 1780–1918 je doba industrije. Zato ga od predindustrijskog doba odvaja pronalazak koji je pokrenuo industrijsku revoluciju.", "iz_udzbenika": {"strana": 10, "odeljak": "Novi vek – pojam i hronološki okviri", "tekst": "Rani novi vek, predindustrijsko doba, završava se Vatovom parnom mašinom 1769, koja pokreće industrijsku revoluciju."}, "osa": {"naziv": "Vatova parna mašina", "od": 1769, "traka": "otkrica"}, "lekcija": 1}, {"id": "nv-lanac-vat", "vrsta": "lanac", "tezina": "lako", "pojmovi": ["parna-masina", "dzejms-vat", "industrija"], "karike": ["Džejms Vat pronalazi parnu mašinu", "?", "U Velikoj Britaniji počinje razvoj industrije"], "praznina": 1, "odgovori": [{"tekst": "Mašina počinje da se koristi u preradi tkanina, metala i drveta", "tacan": true}, {"tekst": "Kolumbo otkriva Ameriku", "tacan": false, "zasto": "Kolumbovo otkriće (1492) je skoro tri veka starije i nema veze sa parnom mašinom."}, {"tekst": "Izbija Francuska revolucija", "tacan": false, "zasto": "Francuska revolucija je posledica nezadovoljstva seljaštva i građanstva, a ne korak od mašine do industrije."}, {"tekst": "Gradi se automobil", "tacan": false, "zasto": "Automobilski saobraćaj se razvija tek krajem XIX veka, uz motor sa unutrašnjim sagorevanjem."}], "pomoc": ["Korak 1: Pronalazak sam po sebi ne menja ništa — mora negde da se upotrebi.", "Korak 2: Gde je parna mašina prvo radila?", "Iz lekcije: koristila se u preradi tkanina, metala i drveta."], "objasnjenje": "Kad je parna mašina počela da se koristi u preradi tkanina, metala i drveta, u Velikoj Britaniji je počeo razvoj industrije.", "iz_udzbenika": {"strana": 10, "odeljak": "Novi vek – pojam i hronološki okviri", "tekst": "Vatova parna mašina se krajem XVIII veka koristi u preradi tkanina, metala i drveta, čime počinje razvoj industrije."}, "osa": {"naziv": "Vatova parna mašina", "od": 1769, "traka": "otkrica"}, "lekcija": 1}, {"id": "nv-lanac-revolucija", "vrsta": "lanac", "tezina": "srednje", "pojmovi": ["industrija", "industrijska-revolucija"], "karike": ["Parna mašina u preradi tkanina, metala i drveta", "Razvoj industrije u Velikoj Britaniji", "?", "Kaže se da je Vatov pronalazak pokrenuo industrijsku revoluciju"], "praznina": 2, "odgovori": [{"tekst": "Industrijska proizvodnja se širi i menja privredu i društvo Evrope, pa i drugih kontinenata", "tacan": true}, {"tekst": "Industrija ostaje samo u jednoj britanskoj radionici", "tacan": false, "zasto": "Da je ostala u jednoj radionici, ne bi bilo „revolucije” — upravo širenje proizvodnje daje taj naziv."}, {"tekst": "Britanija gubi trinaest kolonija u Severnoj Americi", "tacan": false, "zasto": "Gubitak kolonija je posledica Američkog rata za nezavisnost, ne širenja industrije."}, {"tekst": "Plemstvo zabranjuje mašine", "tacan": false, "zasto": "Lekcija to ne kaže; plemstvo gubi prevlast zbog promena posle Francuske revolucije."}], "pomoc": ["Korak 1: Šta se mora desiti sa industrijom da bi se promena nazvala revolucijom?", "Korak 2: Na koje države i kontinente se promena proširila?", "Iz lekcije: širenje industrijske proizvodnje imalo je dalekosežne posledice na privredni i društveni razvoj."], "objasnjenje": "Industrija se proširila iz Britanije na Evropu i druge kontinente i promenila privredu i društvo — zato govorimo o industrijskoj revoluciji.", "iz_udzbenika": {"strana": 11, "odeljak": "Novi vek – pojam i hronološki okviri", "tekst": "Širenje industrijske proizvodnje imalo je dalekosežne posledice na evropske države, a zatim i na zemlje drugih kontinenata."}, "lekcija": 1}, {"id": "nv-izvor-karta-1490", "vrsta": "izvor", "slika_u_pitanju": true, "tezina": "lako", "pojmovi": ["velika-geografska-otkrica", "novi-vek"], "izvor": {"autor": "Nepoznati kartograf", "naslov": "Karta sveta iz 1490. (opis slike)", "tekst": "Stara ovalna karta sveta. Na njoj su ucrtane samo Evropa, Azija i Afrika — svet koji su Evropljani tada poznavali. Amerike i Australije na karti nema.", "napomena": "Odlomak je prepričan; udžbenik, str. 10 (slika levo)."}, "pitanje": "Koji kontinenti su ucrtani na karti iz 1490?", "odgovori": [{"tekst": "Evropa, Azija i Afrika", "tacan": true}, {"tekst": "Evropa, Amerika i Australija", "tacan": false, "zasto": "Amerika i Australija još nisu bile poznate Evropljanima; otkrivene su tokom ranog novog veka."}, {"tekst": "Svi kontinenti", "tacan": false, "zasto": "Karta je nastala pre Kolumbovog putovanja 1492, pa Ameriku ne prikazuje."}, {"tekst": "Samo Evropa", "tacan": false, "zasto": "Evropljani su tada poznavali i Aziju i Afriku — ceo Stari svet."}], "pomoc": ["Karta je nastala dve godine pre Kolumbovog putovanja.", "Koji svet su Evropljani poznavali pre velikih otkrića?", "Iz lekcije: na karti iz 1490. je Stari svet — Evropa, Azija, Afrika."], "objasnjenje": "Karta iz 1490. prikazuje Stari svet — Evropu, Aziju i Afriku; Amerike još nema, jer je Kolumbo stigao do nje tek 1492.", "iz_udzbenika": {"strana": 10, "odeljak": "Karte sveta iz 1490. i 1794.", "tekst": "Na str. 10 su dve karte sveta, iz 1490. i 1794; udžbenik pita koji su kontinenti ucrtani na starijoj karti.", "slika": "01-osnovne-odlike-perioda-1780-1918/01-karta-sveta-1490.jpg"}, "osa": {"naziv": "Karta sveta iz 1490.", "od": 1490, "traka": "svet"}, "lekcija": 1}, {"id": "nv-izvor-karta-1794", "vrsta": "izvor", "slika_u_pitanju": true, "tezina": "srednje", "pojmovi": ["velika-geografska-otkrica", "rani-novi-vek"], "izvor": {"autor": "Nepoznati kartograf", "naslov": "Karta sveta iz 1794. (opis slike)", "tekst": "Karta sveta u dve polulopte, ukrašena nebeskim kartama u uglovima. Ucrtane su Amerika, Afrika, Evropa i Azija, ali i Australija.", "napomena": "Odlomak je prepričan; udžbenik, str. 10 (slika desno)."}, "pitanje": "Šta možemo da zaključimo kad ovu kartu uporedimo sa kartom iz 1490?", "odgovori": [{"tekst": "Da su Evropljani tokom ranog novog veka otkrili Severnu i Južnu Ameriku i Australiju", "tacan": true}, {"tekst": "Da su Afrika i Azija otkrivene tek posle 1490.", "tacan": false, "zasto": "Afrika i Azija su ucrtane već na karti iz 1490 — one pripadaju Starom svetu."}, {"tekst": "Da se oblik kontinenata promenio za tri veka", "tacan": false, "zasto": "Kontinenti se nisu menjali; menjalo se ono što su Evropljani znali o svetu."}, {"tekst": "Da je Amerika otkrivena posle 1794.", "tacan": false, "zasto": "Amerika je već na ovoj karti, a otkrivena je 1492."}], "pomoc": ["Šta ima na karti iz 1794, a nema na karti iz 1490?", "Ti kontinenti su otkriveni između dve karte — u kom periodu?", "Iz lekcije: tokom ranog novog veka otkriveni su Amerika i Australija (Okeanija)."], "objasnjenje": "Poređenje karata pokazuje šta je otkriveno između 1490. i 1794 — Severna i Južna Amerika i Australija.", "iz_udzbenika": {"strana": 10, "odeljak": "Karte sveta iz 1490. i 1794.", "tekst": "Udžbenik traži da se karte uporede i da se kaže koje su kontinente evropski istraživači otkrili tokom ranog novog veka.", "slika": "01-osnovne-odlike-perioda-1780-1918/02-karta-sveta-1794.jpg"}, "osa": {"naziv": "Karta sveta iz 1794.", "od": 1794, "traka": "svet"}, "lekcija": 1}, {"id": "nv-izvor-brodovi", "vrsta": "izvor", "tezina": "srednje", "pojmovi": ["parobrod", "industrijska-revolucija", "kristifor-kolumbo"], "izvor": {"autor": "Udžbenik (potpisi uz tri slike broda)", "naslov": "Karavela, Savana i Luzitanija", "tekst": "Kolumbo je sa tri karavele putovao od Španije do San Salvadora dva meseca. Prvi američki parobrod Savana prešao je Atlantik do Liverpula 1819. za 27 dana. Brod Luzitanija sa četiri dimnjaka plovio je 1907. od Liverpula do Njujorka od 7. do 13. septembra.", "napomena": "Odlomak je prepričan; udžbenik, str. 10."}, "pitanje": "Koju promenu u pomorskom saobraćaju pokazuju ove tri slike?", "odgovori": [{"tekst": "Brodovi pokretani parom postaju sve veći i brži, pa putovanje preko okeana traje sve kraće", "tacan": true}, {"tekst": "Putovanja traju sve duže jer su brodovi sve teži", "tacan": false, "zasto": "Obrnuto: od dva meseca, preko 27 dana, do oko nedelju dana."}, {"tekst": "Brodovi i dalje zavise samo od vetra", "tacan": false, "zasto": "Savana i Luzitanija imaju dimnjake — pokreće ih para, pa ne zavise od vetra kao karavela."}, {"tekst": "Preko Atlantika se plovi samo iz Španije", "tacan": false, "zasto": "Savana i Luzitanija plove između Amerike i Liverpula u Velikoj Britaniji."}], "pomoc": ["Uporedi trajanje putovanja.", "Šta imaju Savana i Luzitanija, a karavela nema?", "Iz lekcije: dva meseca (karavela) → 27 dana (Savana, 1819) → oko šest dana (Luzitanija, 1907)."], "objasnjenje": "Industrija je donela parobrode — veće, brže i nezavisne od vetra; put preko Atlantika skraćen je sa dva meseca na nekoliko dana.", "iz_udzbenika": {"strana": 10, "odeljak": "Brodovi kroz novi vek", "tekst": "Udžbenik prikazuje Kolumbovu karavelu, parobrod Savanu i Luzitaniju i traži da se opišu promene koje je industrijski napredak doneo u pomorskom saobraćaju.", "slika": "01-osnovne-odlike-perioda-1780-1918/03-brodovi-karavela-savana-luzitanija.jpg"}, "lekcija": 1}, {"id": "nv-izbor-savana", "vrsta": "izbor", "tezina": "srednje", "pojmovi": ["parobrod"], "pitanje": "Koliko je prvom američkom parobrodu Savana 1819. trebalo da pređe Atlantik do Liverpula?", "odgovori": [{"tekst": "27 dana", "tacan": true}, {"tekst": "Dva meseca", "tacan": false, "zasto": "Dva meseca je trajalo Kolumbovo putovanje karavelama, pre pojave parobroda."}, {"tekst": "Oko šest dana", "tacan": false, "zasto": "Toliko je 1907. trajala plovidba Luzitanije, mnogo većeg i bržeg broda."}, {"tekst": "Jedan dan", "tacan": false, "zasto": "Ni najbrži brod iz lekcije nije prešao Atlantik za dan; Savana je plovila skoro mesec dana."}], "pomoc": ["Bilo je kraće od Kolumbovih dva meseca, ali duže od Luzitanije.", "Skoro mesec dana.", "Iz lekcije: Savana — preko Atlantika za 27 dana, 1819."], "objasnjenje": "Savana je Atlantik prešla za 27 dana — upola brže od karavela, ali mnogo sporije od Luzitanije 1907.", "iz_udzbenika": {"strana": 10, "odeljak": "Brodovi kroz novi vek", "tekst": "Prvi američki parobrod Savana preplovio je 1819. Atlantik od američke obale do Liverpula za 27 dana.", "slika": "01-osnovne-odlike-perioda-1780-1918/03-brodovi-karavela-savana-luzitanija.jpg"}, "osa": {"naziv": "Parobrod Savana preko Atlantika", "od": 1819, "traka": "otkrica"}, "lekcija": 1}, {"id": "nv-datum-savana", "vrsta": "datum", "tezina": "tesko", "pojmovi": ["parobrod"], "dogadjaj": "Parobrod Savana preko Atlantika", "pitanje": "Koje godine je prvi američki parobrod Savana preplovio Atlantik?", "godina": 1819, "traka": "otkrica", "pomoc": ["Bilo je to pola veka posle Vatove parne mašine.", "U drugoj deceniji XIX veka.", "Iz lekcije: Savana, 1819, 27 dana do Liverpula."], "objasnjenje": "Savana je 1819. preplovila Atlantik za 27 dana — jedan od prvih plodova parne mašine na moru.", "iz_udzbenika": {"strana": 10, "odeljak": "Brodovi kroz novi vek", "tekst": "Potpis uz sliku kaže da je Savana 1819. stigla od američke obale do Liverpula za 27 dana.", "slika": "01-osnovne-odlike-perioda-1780-1918/03-brodovi-karavela-savana-luzitanija.jpg"}, "lekcija": 1}, {"id": "nv-poredjaj-brodovi", "vrsta": "poredjaj", "tezina": "lako", "pojmovi": ["parobrod", "kristifor-kolumbo"], "pitanje": "Poređaj putovanja preko Atlantika od najranijeg do najkasnijeg.", "stavke": [{"tekst": "Kolumbo sa tri karavele stiže do San Salvadora", "godina": 1492, "naziv": "Kolumbovo otkriće Amerike", "traka": "svet"}, {"tekst": "Parobrod Savana prelazi Atlantik za 27 dana", "godina": 1819, "naziv": "Parobrod Savana preko Atlantika", "traka": "otkrica"}, {"tekst": "Luzitanija plovi od Liverpula do Njujorka", "godina": 1907, "naziv": "Luzitanija: Liverpul–Njujork", "traka": "otkrica"}], "pomoc": ["Najranije je putovanje na jedrima.", "Parobrod sa jedrima i jednim dimnjakom stariji je od broda sa četiri dimnjaka.", "Iz lekcije: karavela 1492 → Savana 1819 → Luzitanija 1907."], "objasnjenje": "Karavela (1492) → Savana (1819) → Luzitanija (1907); svako sledeće putovanje bilo je kraće.", "iz_udzbenika": {"strana": 10, "odeljak": "Brodovi kroz novi vek", "tekst": "Tri slike brodova pokazuju kako se pomorski saobraćaj menjao od Kolumba do početka XX veka.", "slika": "01-osnovne-odlike-perioda-1780-1918/03-brodovi-karavela-savana-luzitanija.jpg"}, "lekcija": 1}, {"id": "nv-poredjaj-okviri", "vrsta": "poredjaj", "tezina": "srednje", "pojmovi": ["novi-vek", "rani-novi-vek", "parna-masina"], "pitanje": "Poređaj događaje i izvore hronološki, od najranijeg do najkasnijeg.", "stavke": [{"tekst": "Nastaje karta sveta bez Amerike", "godina": 1490, "naziv": "Karta sveta iz 1490.", "traka": "svet"}, {"tekst": "Kolumbo otkriva Ameriku", "godina": 1492, "naziv": "Kolumbovo otkriće Amerike", "traka": "svet"}, {"tekst": "Vat pravi parnu mašinu", "godina": 1769, "naziv": "Vatova parna mašina", "traka": "otkrica"}, {"tekst": "Nastaje karta sveta sa Amerikom i Australijom", "godina": 1794, "naziv": "Karta sveta iz 1794.", "traka": "svet"}, {"tekst": "Završava se Prvi svetski rat", "godina": 1918, "naziv": "Kraj Prvog svetskog rata", "traka": "svet"}], "pomoc": ["Karta bez Amerike morala je nastati pre Kolumbovog otkrića.", "Parna mašina je nekoliko decenija starija od druge karte.", "Iz lekcije: 1490 karta → 1492 Kolumbo → 1769 Vat → 1794 karta → 1918 kraj rata."], "objasnjenje": "Karta iz 1490. → Kolumbo 1492 → Vat 1769 → karta iz 1794 → kraj Prvog svetskog rata 1918.", "iz_udzbenika": {"strana": 10, "odeljak": "Novi vek – pojam i hronološki okviri", "tekst": "Novi vek traje od 1492. do 1918; rani novi vek se završava 1769; na str. 10 su karte iz 1490. i 1794."}, "lekcija": 1}, {"id": "nv-uporedi-karte", "vrsta": "uporedi", "tezina": "tesko", "pojmovi": ["velika-geografska-otkrica", "novi-vek", "rani-novi-vek"], "a": "Karta sveta iz 1490.", "b": "Karta sveta iz 1794.", "pitanje": "Na koju kartu se odnosi tvrdnja — A, B, obe ili nijednu?", "tvrdnje": [{"tekst": "Na njoj je ucrtana Afrika.", "odgovor": "oba", "zasto": "Afrika je deo Starog sveta i poznata je Evropljanima i pre 1490."}, {"tekst": "Na njoj su ucrtane Amerika i Australija.", "odgovor": "b", "zasto": "Ti kontinenti su otkriveni tokom ranog novog veka, posle 1490."}, {"tekst": "Nastala je pre početka novog veka.", "odgovor": "a", "zasto": "Novi vek počinje 1492, a karta je iz 1490."}, {"tekst": "Nastala je posle Vatove parne mašine.", "odgovor": "b", "zasto": "Parna mašina je iz 1769, a karta iz 1794."}, {"tekst": "Nastala je posle kraja novog veka.", "odgovor": "nijedan", "zasto": "Novi vek se završava 1918; obe karte su mnogo starije."}], "pomoc": ["Uporedi godine karata sa 1492. i 1769.", "Stari svet (Evropa, Azija, Afrika) poznat je od ranije.", "Iz lekcije: novi vek 1492–1918; rani novi vek do 1769."], "objasnjenje": "Starija karta je nastala neposredno pre novog veka i prikazuje Stari svet; mlađa je iz vremena posle parne mašine i prikazuje i otkrivene kontinente.", "iz_udzbenika": {"strana": 10, "odeljak": "Karte sveta iz 1490. i 1794.", "tekst": "Udžbenik stavlja jednu do druge karte sveta iz 1490. i 1794. i traži da se uporede.", "slika": "01-osnovne-odlike-perioda-1780-1918/02-karta-sveta-1794.jpg"}, "lekcija": 1}, {"id": "nv-uporedi-brodovi", "vrsta": "uporedi", "tezina": "lako", "pojmovi": ["parobrod", "kristifor-kolumbo"], "a": "Kolumbova karavela", "b": "Luzitanija", "pitanje": "Na koji brod se odnosi tvrdnja — A, B, oba ili nijedan?", "tvrdnje": [{"tekst": "Pokreće je vetar u jedrima.", "odgovor": "a", "zasto": "Karavela je jedrenjak; Luzitanija ima četiri dimnjaka i pokreće je para."}, {"tekst": "Preplovila je Atlantik.", "odgovor": "oba", "zasto": "Oba broda su plovila preko Atlantika — karavela do San Salvadora, Luzitanija do Njujorka."}, {"tekst": "Put je trajao oko nedelju dana.", "odgovor": "b", "zasto": "Luzitanija je plovila od 7. do 13. septembra 1907; karavelama je trebalo dva meseca."}, {"tekst": "Isplovila je iz Liverpula.", "odgovor": "b", "zasto": "Kolumbo je krenuo iz Španije; Luzitanija iz Liverpula."}, {"tekst": "Bila je prvi američki parobrod.", "odgovor": "nijedan", "zasto": "Prvi američki parobrod je Savana (1819)."}], "pomoc": ["Jedan brod je iz 1492, drugi iz 1907.", "Šta je industrija donela brodovima?", "Iz lekcije: karavela — Španija–San Salvador, dva meseca; Luzitanija — Liverpul–Njujork, 7–13. septembar 1907."], "objasnjenje": "Karavela je jedrenjak kome je trebalo dva meseca; Luzitanija je parni brod koji je 1907. Atlantik prešao za oko šest dana.", "iz_udzbenika": {"strana": 10, "odeljak": "Brodovi kroz novi vek", "tekst": "Potpisi uz slike porede Kolumbove karavele i brod Luzitaniju po trajanju plovidbe.", "slika": "01-osnovne-odlike-perioda-1780-1918/03-brodovi-karavela-savana-luzitanija.jpg"}, "osa": {"naziv": "Luzitanija: Liverpul–Njujork", "od": 1907, "traka": "otkrica"}, "lekcija": 1}, {"id": "nv-ko-sam-vat", "vrsta": "ko_sam", "tezina": "lako", "pojmovi": ["dzejms-vat", "parna-masina", "industrijska-revolucija"], "tragovi": ["Moj pronalazak je granica između ranog novog veka i perioda koji učiš.", "Bio sam britanski pronalazač.", "Moja mašina je počela da radi u preradi tkanina, metala i drveta.", "Godine 1769. napravio sam parnu mašinu."], "odgovori": [{"tekst": "Džejms Vat", "tacan": true}, {"tekst": "Kristifor Kolumbo", "tacan": false, "zasto": "Kolumbo je moreplovac koji je 1492. stigao do Amerike; njime novi vek počinje."}, {"tekst": "Vilhelm Konrad Rendgen", "tacan": false, "zasto": "Rendgen je 1895. otkrio iks-zrake, više od veka posle parne mašine."}, {"tekst": "Robert Koh", "tacan": false, "zasto": "Koh je otkrio uzročnike tuberkuloze i kolere (1882, 1884)."}], "objasnjenje": "To je Džejms Vat; njegova parna mašina (1769) pokrenula je industrijsku revoluciju.", "iz_udzbenika": {"strana": 10, "odeljak": "Novi vek – pojam i hronološki okviri", "tekst": "Parna mašina britanskog pronalazača Džejmsa Vata krajem XVIII veka počinje da se koristi u preradi tkanina, metala i drveta."}, "osa": {"naziv": "Vatova parna mašina", "od": 1769, "traka": "otkrica"}, "lekcija": 1}, {"id": "nv-ko-sam-kolumbo", "vrsta": "ko_sam", "tezina": "srednje", "pojmovi": ["kristifor-kolumbo", "novi-vek", "velika-geografska-otkrica"], "tragovi": ["Moje putovanje je trajalo oko dva meseca.", "Plovio sam sa tri karavele od Španije do San Salvadora.", "Mojim otkrićem počinje novi vek.", "Godine 1492. stigao sam do Amerike."], "odgovori": [{"tekst": "Kristifor Kolumbo", "tacan": true}, {"tekst": "Džejms Vat", "tacan": false, "zasto": "Vat je pronalazač parne mašine (1769); njime se rani novi vek završava, ne počinje."}, {"tekst": "Kapetan Luzitanije", "tacan": false, "zasto": "Luzitanija je plovila 1907. od Liverpula do Njujorka za oko šest dana."}, {"tekst": "Kapetan parobroda Savana", "tacan": false, "zasto": "Savana je 1819. prešla Atlantik za 27 dana, pokretana parom."}], "objasnjenje": "To je Kristifor Kolumbo; njegovim dolaskom u Ameriku 1492. počinju novi vek i velika geografska otkrića.", "iz_udzbenika": {"strana": 10, "odeljak": "Brodovi kroz novi vek", "tekst": "Kolumbu je trebalo dva meseca da sa tri karavele stigne od Španije do San Salvadora.", "slika": "01-osnovne-odlike-perioda-1780-1918/03-brodovi-karavela-savana-luzitanija.jpg"}, "osa": {"naziv": "Kolumbovo otkriće Amerike", "od": 1492, "traka": "svet"}, "lekcija": 1}, {"id": "nv-objasni-dve-celine", "vrsta": "objasni", "tezina": "srednje", "pojmovi": ["novi-vek", "rani-novi-vek", "predindustrijsko-doba", "industrijska-revolucija"], "pitanje": "Na koja dva dela se deli novi vek i šta ih razdvaja? Objasni svojim rečima.", "uzor": "Novi vek traje od Kolumbovog otkrića Amerike 1492. do kraja Prvog svetskog rata 1918. Prvi deo je rani novi vek ili predindustrijsko doba, do Vatove parne mašine 1769. Drugi deo, od 1780. do 1918, obeležava industrijska revolucija koju je ta mašina pokrenula.", "ideje": ["Novi vek traje od 1492. do 1918.", "Prvi deo je rani novi vek (predindustrijsko doba).", "Granica je Vatova parna mašina (1769).", "Drugi deo obeležava industrijska revolucija."], "objasnjenje": "Granica između dva dela novog veka je pronalazak koji je pokrenuo industrijsku revoluciju.", "iz_udzbenika": {"strana": 10, "odeljak": "Novi vek – pojam i hronološki okviri", "tekst": "Novi vek se deli na rani novi vek (do 1769) i period 1780–1918, koji obeležava industrijska revolucija."}, "osa": {"naziv": "Novi vek", "od": 1492, "do": 1918, "traka": "svet"}, "lekcija": 1}, {"id": "nv-objasni-brodovi", "vrsta": "objasni", "tezina": "tesko", "pojmovi": ["parobrod", "industrijska-revolucija"], "pitanje": "Opiši kako je industrijski napredak promenio pomorski saobraćaj od Kolumba do 1907. Koristi primere brodova iz lekcije.", "uzor": "Kolumbo je jedrenjacima plovio do Amerike dva meseca, a brzina je zavisila od vetra. Parobrod Savana je 1819. prešao Atlantik za 27 dana. Luzitanija, veliki brod sa četiri dimnjaka, plovila je 1907. od Liverpula do Njujorka za oko šest dana. Para je brodove učinila većim, bržim i nezavisnim od vetra.", "ideje": ["Jedrenjaci su zavisili od vetra i plovili dugo (dva meseca).", "Parobrod Savana (1819) — 27 dana.", "Luzitanija (1907) — oko šest dana.", "Brodovi postaju veći, brži i ne zavise od vetra."], "objasnjenje": "Industrija je na more donela paru — put preko Atlantika skraćen je sa dva meseca na oko nedelju dana.", "iz_udzbenika": {"strana": 10, "odeljak": "Brodovi kroz novi vek", "tekst": "Udžbenik pita kakve je promene industrijski napredak doneo u pomorskom saobraćaju i za to daje tri broda.", "slika": "01-osnovne-odlike-perioda-1780-1918/03-brodovi-karavela-savana-luzitanija.jpg"}, "lekcija": 1}]}, {"naslov": "Napredak tehnike i medicine", "zadaci": [{"id": "ev-izbor-gradovi", "vrsta": "izbor", "tezina": "lako", "pojmovi": ["industrija"], "pitanje": "Zašto je u XIX veku raslo gradsko stanovništvo?", "odgovori": [{"tekst": "Zbog razvoja poljoprivrede i industrije", "tacan": true}, {"tekst": "Zbog trgovine robljem u Africi", "tacan": false, "zasto": "Trgovina robljem je posledica prisustva Evropljana u Africi; rast gradova lekcija vezuje za poljoprivredu i industriju."}, {"tekst": "Zato što su seljaci postali najmanji sloj", "tacan": false, "zasto": "Seljaštvo je i dalje bilo najbrojniji sloj."}, {"tekst": "Zbog ukidanja železnice", "tacan": false, "zasto": "Železnička mreža se tada gradila, a ne ukidala."}], "pomoc": ["Gde su nastajale fabrike?", "Ko je hranio sve veće gradove?", "Iz lekcije: razvoj poljoprivrede i industrije doveo je do porasta gradskog stanovništva."], "objasnjenje": "Fabrike su privlačile ljude u gradove, a bolja poljoprivreda je mogla da ih prehrani — gradovi su rasli.", "iz_udzbenika": {"strana": 11, "odeljak": "Evropa od kraja XVIII do početka XX veka", "tekst": "Razvoj poljoprivrede i industrije doveo je u XIX veku do porasta gradskog stanovništva."}, "lekcija": 1}, {"id": "ev-izbor-vazdusni", "vrsta": "izbor", "tezina": "srednje", "pojmovi": ["motor-sa-unutrasnjim-sagorevanjem", "elektricna-energija"], "pitanje": "Koja vrsta saobraćaja počinje da se razvija na samom početku XX veka?", "odgovori": [{"tekst": "Vazdušni saobraćaj", "tacan": true}, {"tekst": "Železnički saobraćaj", "tacan": false, "zasto": "Železnička mreža se gradi već tokom XIX veka."}, {"tekst": "Pomorski saobraćaj jedrenjacima", "tacan": false, "zasto": "Jedrenjaci su stari — Kolumbo je njima plovio još 1492."}, {"tekst": "Parobrodski saobraćaj preko Atlantika", "tacan": false, "zasto": "Parobrod Savana je prešao Atlantik već 1819."}], "pomoc": ["Motor sa unutrašnjim sagorevanjem je pokrenuo i automobile i nešto što leti.", "Reč je o najmlađoj vrsti saobraćaja u lekciji.", "Iz lekcije: uz automobilski, na samom početku XX veka razvija se i vazdušni saobraćaj."], "objasnjenje": "Krajem XIX veka razvija se automobilski, a na samom početku XX veka i vazdušni saobraćaj.", "iz_udzbenika": {"strana": 11, "odeljak": "Evropa od kraja XVIII do početka XX veka", "tekst": "Pored železnice razvija se automobilski, a na samom početku XX veka i vazdušni saobraćaj."}, "lekcija": 1}, {"id": "ev-tn-smrtnost", "vrsta": "tacno_netacno", "tezina": "lako", "pojmovi": ["industrijska-revolucija"], "tvrdnja": "Zbog napretka medicine i tehnologije u XIX veku smrtnost je porasla, a ljudi su živeli kraće.", "tacno": false, "ispravke": [{"tekst": "Napredak medicine i tehnologije produžio je ljudski vek i smanjio smrtnost.", "tacan": true}, {"tekst": "Napredak medicine nije uticao na dužinu života.", "tacan": false, "zasto": "Uticao je — lekcija kaže da je ljudski vek produžen."}, {"tekst": "Smrtnost je porasla zbog vakcina.", "tacan": false, "zasto": "Vakcine (Džener, Paster) štite od bolesti i smanjuju smrtnost."}], "pomoc": ["Šta rade vakcine i lekovi?", "Ljudi su počeli da žive duže ili kraće?", "Iz lekcije: produžen je ljudski vek i smanjena smrtnost."], "objasnjenje": "Napredak medicine i tehnologije produžio je život i smanjio smrtnost.", "iz_udzbenika": {"strana": 11, "odeljak": "Evropa od kraja XVIII do početka XX veka", "tekst": "Napredak medicine i tehnologije produžio je ljudski vek i smanjio smrtnost."}, "lekcija": 1}, {"id": "ev-tn-motor", "vrsta": "tacno_netacno", "tezina": "srednje", "pojmovi": ["elektricna-energija", "motor-sa-unutrasnjim-sagorevanjem"], "tvrdnja": "Električna energija i motor sa unutrašnjim sagorevanjem počeli su da se koriste u prvim decenijama XIX veka.", "tacno": false, "ispravke": [{"tekst": "Počeli su da se koriste u poslednjim decenijama XIX veka.", "tacan": true}, {"tekst": "Počeli su da se koriste još u XVIII veku, uz parnu mašinu.", "tacan": false, "zasto": "U XVIII veku se pojavljuje parna mašina; električna energija i motor su stvar kraja XIX veka."}, {"tekst": "Počeli su da se koriste tek posle Prvog svetskog rata.", "tacan": false, "zasto": "Već pre 1918. omogućili su automobile, pa i avione početkom XX veka."}], "pomoc": ["Automobil i avion dolaze na samom kraju perioda.", "Električna energija i motor su ih omogućili malo pre toga.", "Iz lekcije: poslednje decenije XIX veka — električna energija i motor sa unutrašnjim sagorevanjem."], "objasnjenje": "Električna energija i motor sa unutrašnjim sagorevanjem stižu u poslednjim decenijama XIX veka.", "iz_udzbenika": {"strana": 11, "odeljak": "Evropa od kraja XVIII do početka XX veka", "tekst": "U poslednjim decenijama XIX veka počinje upotreba električne energije i motora sa unutrašnjim sagorevanjem."}, "lekcija": 1}, {"id": "ev-dopuni-saobracaj", "vrsta": "dopuni", "tezina": "srednje", "pojmovi": ["zeleznica", "motor-sa-unutrasnjim-sagorevanjem"], "pitanje": "Dopuni rečenice o saobraćaju.", "tekst": "Izgradnja {{železničke}} mreže olakšala je kretanje ljudi i robe. Krajem XIX veka, zahvaljujući motoru sa unutrašnjim sagorevanjem, razvija se {{automobilski}} saobraćaj, a na samom početku XX veka i {{vazdušni}}.", "ponudjene": ["železničke", "automobilski", "vazdušni", "rečne", "konjski", "podzemni"], "pomoc": ["Šta je u XIX veku povezivalo gradove šinama?", "Motor pokreće vozila na putu i u vazduhu.", "Iz lekcije: železnica; automobilski i vazdušni saobraćaj."], "objasnjenje": "Železnica (XIX vek), pa automobil (kraj XIX veka) i avion (početak XX veka).", "iz_udzbenika": {"strana": 11, "odeljak": "Evropa od kraja XVIII do početka XX veka", "tekst": "Železnička mreža je olakšala kretanje ljudi i robe; krajem XIX veka razvija se automobilski, a početkom XX veka i vazdušni saobraćaj."}, "lekcija": 1}, {"id": "ev-povezi-naucnici", "vrsta": "povezi", "tezina": "lako", "pojmovi": ["edvard-dzener", "dzozef-lister", "robert-koh", "luj-paster", "vilhelm-konrad-rendgen"], "pitanje": "Poveži naučnika sa njegovim otkrićem.", "parovi": [["Edvard Džener", "vakcina protiv velikih boginja"], ["Džozef Lister", "sterilisanje medicinskih instrumenata"], ["Robert Koh", "uzročnici tuberkuloze i kolere"], ["Luj Paster", "vakcina protiv besnila"], ["Vilhelm Konrad Rendgen", "iks-zraci"]], "pomoc": ["Rendgenski snimak nosi ime po jednom od njih.", "Dvojica su napravila vakcine — Džener protiv boginja, drugi protiv besnila.", "Iz lekcije: tabela važnijih medicinskih otkrića, str. 11."], "objasnjenje": "Džener — velike boginje; Lister — sterilisanje; Koh — tuberkuloza i kolera; Paster — besnilo; Rendgen — iks-zraci.", "iz_udzbenika": {"strana": 11, "odeljak": "Važnija medicinska otkrića (tabela)", "tekst": "Tabela navodi šest otkrića, naučnike koji su ih napravili i godine.", "slika": "01-osnovne-odlike-perioda-1780-1918/04-tabela-medicinskih-otkrica.jpg"}, "lekcija": 1}, {"id": "ev-povezi-godine", "vrsta": "povezi", "tezina": "srednje", "pojmovi": ["edvard-dzener", "dzozef-lister", "robert-koh", "luj-paster", "vilhelm-konrad-rendgen"], "pitanje": "Poveži godinu sa medicinskim otkrićem.", "parovi": [["1796.", "vakcina protiv velikih boginja"], ["1861.", "sterilisanje medicinskih instrumenata"], ["1882.", "uzročnik tuberkuloze"], ["1884.", "uzročnik kolere"], ["1885.", "vakcina protiv besnila"], ["1895.", "iks-zraci"]], "pomoc": ["Jedino otkriće iz XVIII veka je prva vakcina.", "Koh je dva uzročnika otkrio u razmaku od dve godine — prvo tuberkulozu.", "Iz lekcije: 1796 Džener, 1861 Lister, 1882 i 1884 Koh, 1885 Paster, 1895 Rendgen."], "objasnjenje": "1796 boginje · 1861 sterilisanje · 1882 tuberkuloza · 1884 kolera · 1885 besnilo · 1895 iks-zraci.", "iz_udzbenika": {"strana": 11, "odeljak": "Važnija medicinska otkrića (tabela)", "tekst": "Tabela daje godine otkrića od 1796. do 1895.", "slika": "01-osnovne-odlike-perioda-1780-1918/04-tabela-medicinskih-otkrica.jpg"}, "lekcija": 1}, {"id": "ev-datum-dzener", "vrsta": "datum", "tezina": "srednje", "pojmovi": ["edvard-dzener"], "dogadjaj": "Džener: vakcina protiv velikih boginja", "pitanje": "Koje godine je Edvard Džener napravio vakcinu protiv velikih boginja?", "godina": 1796, "traka": "otkrica", "pomoc": ["To je najstarije otkriće u tabeli — još u XVIII veku.", "Godinu dana pre ukidanja Mletačke republike.", "Iz lekcije: Džener, 1796."], "objasnjenje": "Džener je vakcinu protiv velikih boginja napravio 1796 — prvo otkriće iz tabele.", "iz_udzbenika": {"strana": 11, "odeljak": "Važnija medicinska otkrića (tabela)", "tekst": "Prva vakcina u tabeli je Dženerova vakcina protiv velikih boginja iz 1796.", "slika": "01-osnovne-odlike-perioda-1780-1918/04-tabela-medicinskih-otkrica.jpg"}, "lekcija": 1}, {"id": "ev-poredjaj-mesano", "vrsta": "poredjaj", "tezina": "srednje", "pojmovi": ["edvard-dzener", "parobrod", "dzozef-lister", "vilhelm-konrad-rendgen"], "pitanje": "Poređaj pronalaske i otkrića hronološki.", "stavke": [{"tekst": "Džener pravi vakcinu protiv velikih boginja", "godina": 1796, "naziv": "Džener: vakcina protiv velikih boginja", "traka": "otkrica"}, {"tekst": "Parobrod Savana prelazi Atlantik", "godina": 1819, "naziv": "Parobrod Savana preko Atlantika", "traka": "otkrica"}, {"tekst": "Lister ukazuje na sterilisanje instrumenata", "godina": 1861, "naziv": "Lister: sterilisanje instrumenata", "traka": "otkrica"}, {"tekst": "Rendgen otkriva iks-zrake", "godina": 1895, "naziv": "Rendgen: iks-zraci", "traka": "otkrica"}, {"tekst": "Luzitanija plovi od Liverpula do Njujorka", "godina": 1907, "naziv": "Luzitanija: Liverpul–Njujork", "traka": "otkrica"}], "pomoc": ["Samo jedno je iz XVIII veka, samo jedno iz XX veka.", "Savana je iz prve polovine XIX veka, Lister iz sredine.", "Iz lekcije: 1796 → 1819 → 1861 → 1895 → 1907."], "objasnjenje": "Džener 1796 → Savana 1819 → Lister 1861 → Rendgen 1895 → Luzitanija 1907.", "iz_udzbenika": {"strana": 11, "odeljak": "Evropa od kraja XVIII do početka XX veka", "tekst": "Tabela medicinskih otkrića i potpisi uz brodove na str. 10–11 daju godine napretka tehnike i medicine."}, "lekcija": 1}, {"id": "ev-poredjaj-medicina", "vrsta": "poredjaj", "tezina": "tesko", "pojmovi": ["dzozef-lister", "robert-koh", "luj-paster", "vilhelm-konrad-rendgen"], "pitanje": "Poređaj medicinska otkrića hronološki (godine su blizu!).", "stavke": [{"tekst": "Sterilisanje medicinskih instrumenata", "godina": 1861, "naziv": "Lister: sterilisanje instrumenata", "traka": "otkrica"}, {"tekst": "Uzročnik tuberkuloze", "godina": 1882, "naziv": "Koh: uzročnik tuberkuloze", "traka": "otkrica"}, {"tekst": "Uzročnik kolere", "godina": 1884, "naziv": "Koh: uzročnik kolere", "traka": "otkrica"}, {"tekst": "Vakcina protiv besnila", "godina": 1885, "naziv": "Paster: vakcina protiv besnila", "traka": "otkrica"}, {"tekst": "Iks-zraci", "godina": 1895, "naziv": "Rendgen: iks-zraci", "traka": "otkrica"}], "pomoc": ["Najranije je otkriće o instrumentima, najkasnije iks-zraci.", "Koh je prvo otkrio uzročnika tuberkuloze, a Paster je odmah posle Koha.", "Iz lekcije: 1861, 1882, 1884, 1885, 1895."], "objasnjenje": "Lister 1861 → Koh 1882 (tuberkuloza) → Koh 1884 (kolera) → Paster 1885 → Rendgen 1895.", "iz_udzbenika": {"strana": 11, "odeljak": "Važnija medicinska otkrića (tabela)", "tekst": "Pet od šest otkrića iz tabele pada u drugu polovinu XIX veka, između 1861. i 1895.", "slika": "01-osnovne-odlike-perioda-1780-1918/04-tabela-medicinskih-otkrica.jpg"}, "lekcija": 1}, {"id": "ev-zakljuci-medicina", "vrsta": "zakljuci", "tezina": "srednje", "pojmovi": ["edvard-dzener", "luj-paster", "robert-koh"], "pitanje": "Šta je bila zajednička posledica otkrića kao što su vakcine, sterilisanje instrumenata i otkrivanje uzročnika bolesti?", "odgovori": [{"tekst": "Ljudi su živeli duže, a smrtnost se smanjila", "tacan": true}, {"tekst": "Gradovi su se ispraznili", "tacan": false, "zasto": "Gradsko stanovništvo je u XIX veku raslo, a ne opadalo."}, {"tekst": "Seljaštvo je prestalo da bude najbrojniji sloj", "tacan": false, "zasto": "Seljaštvo je i dalje bilo najbrojnije; medicina nije menjala odnose među slojevima."}, {"tekst": "Počela je industrijska revolucija", "tacan": false, "zasto": "Industrijsku revoluciju pokreće Vatova parna mašina, ne medicinska otkrića."}], "pomoc": ["Korak 1: Šta svako od ovih otkrića sprečava ili leči?", "Korak 2: Šta to znači za dužinu života?", "Iz lekcije: napredak medicine i tehnologije produžio je ljudski vek i smanjio smrtnost."], "objasnjenje": "Vakcine štite od bolesti, sterilisanje sprečava zaraze, a poznavanje uzročnika pomaže lečenju — zato ljudi žive duže.", "iz_udzbenika": {"strana": 11, "odeljak": "Evropa od kraja XVIII do početka XX veka", "tekst": "Napredak medicine i tehnologije produžio je ljudski vek i smanjio smrtnost; tabela navodi najvažnija otkrića.", "slika": "01-osnovne-odlike-perioda-1780-1918/04-tabela-medicinskih-otkrica.jpg"}, "lekcija": 1}, {"id": "ev-zakljuci-gradovi", "vrsta": "zakljuci", "tezina": "tesko", "pojmovi": ["industrija", "radnistvo", "zeleznica"], "pitanje": "Koje objašnjenje najbolje povezuje rast gradova u XIX veku sa ostalim promenama iz lekcije?", "odgovori": [{"tekst": "Fabrike u gradovima trebale su radnike, bolja poljoprivreda mogla je da prehrani više ljudi, a železnica je olakšala kretanje ljudi i robe", "tacan": true}, {"tekst": "Ljudi su bežali u gradove od vazdušnog saobraćaja", "tacan": false, "zasto": "Vazdušni saobraćaj se javlja tek početkom XX veka, a rast gradova počinje u XIX."}, {"tekst": "Gradovi su rasli jer su plemići dobili više vlasti", "tacan": false, "zasto": "Plemstvo je u XIX veku gubilo prevlast, a ne dobijalo vlast."}, {"tekst": "Gradovi su rasli samo zbog vakcina", "tacan": false, "zasto": "Medicina je produžila život svima, ali lekcija rast gradova vezuje za industriju i poljoprivredu."}], "pomoc": ["Korak 1: Šta lekcija navodi kao uzrok rasta gradova?", "Korak 2: Ko je radio u fabrikama i kako su ljudi i roba stizali u grad?", "Iz lekcije: razvoj poljoprivrede i industrije → porast gradskog stanovništva; železnica → lakše kretanje ljudi i robe."], "objasnjenje": "Industrija je stvarala posao u gradovima (radništvo), poljoprivreda je hranila više ljudi, a železnica ih je povezivala — sve zajedno je uvećalo gradove.", "iz_udzbenika": {"strana": 11, "odeljak": "Evropa od kraja XVIII do početka XX veka", "tekst": "Razvoj poljoprivrede i industrije uvećao je gradsko stanovništvo; železnička mreža je olakšala kretanje ljudi i robe."}, "lekcija": 1}, {"id": "ev-lanac-medicina", "vrsta": "lanac", "tezina": "lako", "pojmovi": ["edvard-dzener", "luj-paster"], "karike": ["Džener i Paster prave vakcine", "Napreduju medicina i tehnologija", "?"], "praznina": 2, "odgovori": [{"tekst": "Ljudi žive duže, a smrtnost opada", "tacan": true}, {"tekst": "Ljudi se masovno iseljavaju iz Evrope", "tacan": false, "zasto": "Lekcija ne povezuje medicinu sa iseljavanjem; posledica je duži život."}, {"tekst": "Velike sile gube kolonije", "tacan": false, "zasto": "Kolonije se gube iz drugih razloga (npr. pobuna u 13 kolonija); medicina produžava život."}, {"tekst": "Počinje rani novi vek", "tacan": false, "zasto": "Rani novi vek počinje 1492, mnogo pre ovih otkrića."}], "pomoc": ["Korak 1: Čemu služi vakcina?", "Korak 2: Ako manje ljudi umire od bolesti, šta se dešava sa dužinom života?", "Iz lekcije: produžen ljudski vek, smanjena smrtnost."], "objasnjenje": "Vakcine i ostala otkrića doveli su do dužeg života i manje smrtnosti.", "iz_udzbenika": {"strana": 11, "odeljak": "Evropa od kraja XVIII do početka XX veka", "tekst": "Napredak medicine i tehnologije produžio je ljudski vek i smanjio smrtnost.", "slika": "01-osnovne-odlike-perioda-1780-1918/04-tabela-medicinskih-otkrica.jpg"}, "lekcija": 1}, {"id": "ev-lanac-gradovi", "vrsta": "lanac", "tezina": "lako", "pojmovi": ["industrija", "radnistvo"], "karike": ["Razvijaju se poljoprivreda i industrija", "?", "U gradovima nastaje novi sloj — radništvo"], "praznina": 1, "odgovori": [{"tekst": "Raste gradsko stanovništvo", "tacan": true}, {"tekst": "Gradovi se prazne", "tacan": false, "zasto": "Obrnuto: u XIX veku gradsko stanovništvo raste."}, {"tekst": "Ukida se železnica", "tacan": false, "zasto": "Železnička mreža se tada širi."}, {"tekst": "Plemstvo preuzima fabrike", "tacan": false, "zasto": "Lekcija to ne kaže; plemstvo gubi prevlast, a privredne promene jačaju građanstvo."}], "pomoc": ["Korak 1: Gde su fabrike?", "Korak 2: Šta se dešava sa brojem ljudi u gradovima?", "Iz lekcije: razvoj poljoprivrede i industrije → porast gradskog stanovništva u XIX veku."], "objasnjenje": "Industrija i poljoprivreda su uvećale gradove, a u njima je nastalo radništvo — ljudi koji žive od rada u fabrikama.", "iz_udzbenika": {"strana": 11, "odeljak": "Evropa od kraja XVIII do početka XX veka", "tekst": "U XIX veku raste gradsko stanovništvo, a pojavljuje se i radništvo, gradski sloj koji živi od rada u fabrikama."}, "lekcija": 1}, {"id": "ev-lanac-motor", "vrsta": "lanac", "tezina": "srednje", "pojmovi": ["elektricna-energija", "motor-sa-unutrasnjim-sagorevanjem"], "karike": ["Tehnološki napredak krajem XIX veka", "Počinje upotreba motora sa unutrašnjim sagorevanjem", "?"], "praznina": 2, "odgovori": [{"tekst": "Razvija se automobilski, a početkom XX veka i vazdušni saobraćaj", "tacan": true}, {"tekst": "Gradi se prva železnička mreža", "tacan": false, "zasto": "Železnica je starija — gradi se tokom XIX veka, uz paru."}, {"tekst": "Vat pravi parnu mašinu", "tacan": false, "zasto": "Parna mašina je iz 1769, više od veka ranije."}, {"tekst": "Kolumbo plovi do Amerike", "tacan": false, "zasto": "Kolumbo je plovio 1492, na jedrima."}], "pomoc": ["Korak 1: Šta pokreće motor sa unutrašnjim sagorevanjem?", "Korak 2: Koje nove vrste saobraćaja nastaju na kraju perioda?", "Iz lekcije: pored železnice razvija se automobilski, a na samom početku XX veka i vazdušni saobraćaj."], "objasnjenje": "Motor sa unutrašnjim sagorevanjem omogućio je automobile, a početkom XX veka i letelice.", "iz_udzbenika": {"strana": 11, "odeljak": "Evropa od kraja XVIII do početka XX veka", "tekst": "Poslednjih decenija XIX veka koriste se električna energija i motor sa unutrašnjim sagorevanjem; razvijaju se automobilski i vazdušni saobraćaj."}, "lekcija": 1}, {"id": "ev-izvor-tabela", "vrsta": "izvor", "tezina": "tesko", "pojmovi": ["robert-koh", "luj-paster", "dzozef-lister", "vilhelm-konrad-rendgen", "edvard-dzener"], "izvor": {"autor": "Udžbenik (tabela)", "naslov": "Važnija medicinska otkrića", "tekst": "Vakcina protiv velikih boginja — Džener, 1796. Sterilisanje instrumenata — Lister, 1861. Uzročnik tuberkuloze — Koh, 1882. Uzročnik kolere — Koh, 1884. Vakcina protiv besnila — Paster, 1885. Iks-zraci — Rendgen, 1895.", "napomena": "Odlomak je prepričan; udžbenik, str. 11."}, "pitanje": "Šta tabela pokazuje o tome kada su se medicinska otkrića nizala?", "odgovori": [{"tekst": "Većina otkrića (pet od šest) pada u drugu polovinu XIX veka, a četiri između 1882. i 1895.", "tacan": true}, {"tekst": "Sva otkrića su iz XVIII veka", "tacan": false, "zasto": "Samo Dženerova vakcina (1796) je iz XVIII veka; ostale su iz XIX."}, {"tekst": "Otkrića su ravnomerno raspoređena kroz ceo novi vek, od 1492.", "tacan": false, "zasto": "Najranije otkriće u tabeli je iz 1796, a većina je zbijena između 1861. i 1895."}, {"tekst": "Sva otkrića je napravio jedan naučnik", "tacan": false, "zasto": "U tabeli je pet naučnika; samo Koh ima dva otkrića."}], "pomoc": ["Prebroj otkrića posle 1860.", "Koliko ih je između 1880. i 1895?", "Iz lekcije: 1796, 1861, 1882, 1884, 1885, 1895."], "objasnjenje": "Otkrića se gomilaju krajem XIX veka (1882, 1884, 1885, 1895) — medicina tada napreduje sve brže.", "iz_udzbenika": {"strana": 11, "odeljak": "Važnija medicinska otkrića (tabela)", "tekst": "Tabela na str. 11 navodi šest otkrića od 1796. do 1895, sa naučnicima i godinama.", "slika": "01-osnovne-odlike-perioda-1780-1918/04-tabela-medicinskih-otkrica.jpg"}, "lekcija": 1}, {"id": "ev-uporedi-dzener-koh", "vrsta": "uporedi", "tezina": "srednje", "pojmovi": ["edvard-dzener", "robert-koh"], "a": "Edvard Džener", "b": "Robert Koh", "pitanje": "Na koga se odnosi tvrdnja — Dženera, Koha, obojicu ili nijednog?", "tvrdnje": [{"tekst": "Napravio je vakcinu.", "odgovor": "a", "zasto": "Džener je napravio vakcinu protiv velikih boginja; Koh je otkrivao uzročnike bolesti."}, {"tekst": "Otkrio je uzročnike tuberkuloze i kolere.", "odgovor": "b", "zasto": "To su Kohova otkrića iz 1882. i 1884."}, {"tekst": "Njegovo otkriće je iz XVIII veka.", "odgovor": "a", "zasto": "Džener — 1796; Koh je radio krajem XIX veka."}, {"tekst": "Doprineo je smanjenju smrtnosti.", "odgovor": "oba", "zasto": "Svako medicinsko otkriće iz tabele doprinelo je dužem životu i manjoj smrtnosti."}, {"tekst": "Otkrio je iks-zrake.", "odgovor": "nijedan", "zasto": "Iks-zrake je otkrio Rendgen 1895."}], "pomoc": ["Jedan je napravio vakcinu, drugi je otkrivao uzročnike.", "Pogledaj godine — XVIII ili XIX vek?", "Iz lekcije: Džener 1796 (velike boginje); Koh 1882 i 1884 (tuberkuloza, kolera)."], "objasnjenje": "Džener (1796) je napravio prvu vakcinu iz tabele; Koh je krajem XIX veka otkrio dva uzročnika bolesti. Obojica su doprineli manjoj smrtnosti.", "iz_udzbenika": {"strana": 11, "odeljak": "Važnija medicinska otkrića (tabela)", "tekst": "Tabela navodi Dženerovu vakcinu (1796) i Kohova otkrića uzročnika tuberkuloze (1882) i kolere (1884).", "slika": "01-osnovne-odlike-perioda-1780-1918/04-tabela-medicinskih-otkrica.jpg"}, "lekcija": 1}, {"id": "ev-ko-sam-dzener", "vrsta": "ko_sam", "tezina": "lako", "pojmovi": ["edvard-dzener"], "tragovi": ["Moje otkriće je najstarije u tabeli medicinskih otkrića.", "Napravio sam ga još u XVIII veku, 1796.", "Napravio sam vakcinu protiv velikih boginja."], "odgovori": [{"tekst": "Edvard Džener", "tacan": true}, {"tekst": "Luj Paster", "tacan": false, "zasto": "Paster je napravio vakcinu protiv besnila, 1885."}, {"tekst": "Robert Koh", "tacan": false, "zasto": "Koh nije pravio vakcine, nego je otkrio uzročnike tuberkuloze i kolere."}, {"tekst": "Džozef Lister", "tacan": false, "zasto": "Lister je 1861. ukazao na potrebu sterilisanja instrumenata."}], "objasnjenje": "To je Edvard Džener — vakcina protiv velikih boginja, 1796.", "iz_udzbenika": {"strana": 11, "odeljak": "Važnija medicinska otkrića (tabela)", "tekst": "Prvo otkriće u tabeli je Dženerova vakcina protiv velikih boginja, 1796.", "slika": "01-osnovne-odlike-perioda-1780-1918/04-tabela-medicinskih-otkrica.jpg"}, "osa": {"naziv": "Džener: vakcina protiv velikih boginja", "od": 1796, "traka": "otkrica"}, "lekcija": 1}, {"id": "ev-ko-sam-koh", "vrsta": "ko_sam", "tezina": "srednje", "pojmovi": ["robert-koh"], "tragovi": ["Jedini sam naučnik koji se u tabeli otkrića javlja dva puta.", "Nisam pravio vakcine, nego sam tražio ono što izaziva bolesti.", "Godine 1882. otkrio sam uzročnika tuberkuloze, a 1884. uzročnika kolere."], "odgovori": [{"tekst": "Robert Koh", "tacan": true}, {"tekst": "Luj Paster", "tacan": false, "zasto": "Paster je napravio vakcinu protiv besnila 1885; u tabeli je jednom."}, {"tekst": "Vilhelm Konrad Rendgen", "tacan": false, "zasto": "Rendgen je otkrio iks-zrake 1895."}, {"tekst": "Edvard Džener", "tacan": false, "zasto": "Džener je 1796. napravio vakcinu protiv velikih boginja."}], "objasnjenje": "To je Robert Koh — uzro
