čnici tuberkuloze (1882) i kolere (1884).", "iz_udzbenika": {"strana": 11, "odeljak": "Važnija medicinska otkrića (tabela)", "tekst": "Robert Koh je otkrio uzročnika tuberkuloze 1882. i uzročnika kolere 1884.", "slika": "01-osnovne-odlike-perioda-1780-1918/04-tabela-medicinskih-otkrica.jpg"}, "osa": {"naziv": "Koh: uzročnik tuberkuloze", "od": 1882, "traka": "otkrica"}, "lekcija": 1}, {"id": "ev-ko-sam-lister", "vrsta": "ko_sam", "tezina": "tesko", "pojmovi": ["dzozef-lister"], "tragovi": ["Moje otkriće nije ni vakcina ni uzročnik bolesti, nego način rada lekara.", "Ukazao sam na nešto što je moralo da se radi sa alatom pre operacije.", "Godine 1861. pokazao sam da medicinske instrumente treba sterilisati."], "odgovori": [{"tekst": "Džozef Lister", "tacan": true}, {"tekst": "Robert Koh", "tacan": false, "zasto": "Koh je otkrio uzročnike tuberkuloze i kolere — to su uzročnici bolesti."}, {"tekst": "Luj Paster", "tacan": false, "zasto": "Paster je napravio vakcinu protiv besnila (1885)."}, {"tekst": "Vilhelm Konrad Rendgen", "tacan": false, "zasto": "Rendgen je otkrio iks-zrake (1895), a ne pravilo o instrumentima."}], "objasnjenje": "To je Džozef Lister — 1861. ukazao je na potrebu sterilisanja medicinskih instrumenata.", "iz_udzbenika": {"strana": 11, "odeljak": "Važnija medicinska otkrića (tabela)", "tekst": "Džozef Lister je 1861. ukazao na potrebu sterilisanja medicinskih instrumenata.", "slika": "01-osnovne-odlike-perioda-1780-1918/04-tabela-medicinskih-otkrica.jpg"}, "osa": {"naziv": "Lister: sterilisanje instrumenata", "od": 1861, "traka": "otkrica"}, "lekcija": 1}, {"id": "ev-objasni-promene", "vrsta": "objasni", "tezina": "srednje", "pojmovi": ["industrija", "zeleznica", "elektricna-energija"], "pitanje": "Navedi bar tri promene koje su obeležile Evropu XIX veka i za jednu objasni zašto se desila.", "uzor": "U XIX veku rastu gradovi, jer se razvijaju industrija i poljoprivreda. Napredak medicine produžava život i smanjuje smrtnost. Železnica olakšava kretanje ljudi i robe, a krajem veka električna energija i motor sa unutrašnjim sagorevanjem donose automobile, pa početkom XX veka i avione.", "ideje": ["Rast gradova zbog razvoja industrije i poljoprivrede.", "Duži život i manja smrtnost zbog napretka medicine.", "Železnica olakšava kretanje ljudi i robe.", "Električna energija i motor donose automobilski i vazdušni saobraćaj."], "objasnjenje": "Promene XIX veka su povezane — industrija, nauka i saobraćaj menjaju način života.", "iz_udzbenika": {"strana": 11, "odeljak": "Evropa od kraja XVIII do početka XX veka", "tekst": "Udžbenik nabraja rast gradova, napredak medicine, železnicu, električnu energiju i motor kao odlike XIX veka."}, "lekcija": 1}]}, {"naslov": "Društvo i velike sile", "zadaci": [{"id": "dr-izbor-najbrojniji", "vrsta": "izbor", "tezina": "lako", "pojmovi": ["seljastvo", "gradjanstvo"], "pitanje": "Koji društveni sloj je u XIX veku i dalje bio najbrojniji?", "odgovori": [{"tekst": "Seljaštvo", "tacan": true}, {"tekst": "Građanstvo", "tacan": false, "zasto": "Uloga građanstva je jačala, ali seljaka je i dalje bilo najviše."}, {"tekst": "Plemstvo", "tacan": false, "zasto": "Plemstvo je malobrojno i u XIX veku gubi prevlast."}, {"tekst": "Radništvo", "tacan": false, "zasto": "Radništvo je nov sloj XIX veka; još nije bilo najbrojnije."}], "pomoc": ["Većina ljudi je i dalje živela na selu.", "Ko obrađuje zemlju?", "Iz lekcije: seljaštvo je i dalje najbrojniji sloj."], "objasnjenje": "Iako gradovi rastu, većina ljudi su i dalje seljaci.", "iz_udzbenika": {"strana": 11, "odeljak": "Društvo", "tekst": "Seljaštvo je i dalje najbrojniji sloj, ali privredne promene jačaju ulogu građanstva."}, "lekcija": 1}, {"id": "dr-izbor-prevlast", "vrsta": "izbor", "tezina": "tesko", "pojmovi": ["plemstvo", "svestenstvo", "feudalizam", "apsolutizam"], "pitanje": "Koji slojevi su u prvoj polovini XIX veka izgubili prevlast koju su imali od srednjeg veka? (Više tačnih.)", "odgovori": [{"tekst": "Plemstvo", "tacan": true}, {"tekst": "Sveštenstvo", "tacan": true}, {"tekst": "Građanstvo", "tacan": false, "zasto": "Građanstvo je tada jačalo i želelo da sačuva uticaj i bogatstvo."}, {"tekst": "Seljaštvo", "tacan": false, "zasto": "Seljaštvo nikad nije imalo prevlast — bilo je najbrojnije, ali ne i najmoćnije."}, {"tekst": "Radništvo", "tacan": false, "zasto": "Radništvo je novi sloj XIX veka i tek počinje borbu za svoja prava."}], "pomoc": ["Ko je imao povlastice u feudalnom poretku?", "Dva sloja — jedan se bori, drugi se moli.", "Iz lekcije: plemstvo i sveštenstvo gube prevlast koju su imali od srednjeg veka."], "objasnjenje": "Ukidanjem apsolutizma i feudalizma plemstvo i sveštenstvo gube prevlast; jača građanstvo.", "iz_udzbenika": {"strana": 12, "odeljak": "Društvo", "tekst": "Posle ukidanja apsolutističke monarhije i feudalnog uređenja plemstvo i sveštenstvo gube prevlast koju su imali od srednjeg veka."}, "osa": {"naziv": "Ukidanje apsolutizma i feudalizma", "od": 1800, "do": 1850, "traka": "svet", "oznaka": "prva polovina XIX veka"}, "lekcija": 1}, {"id": "dr-izbor-sile", "vrsta": "izbor", "tezina": "srednje", "pojmovi": ["velike-sile", "velika-britanija", "francuska", "nemacka", "rusija", "habzburska-monarhija", "italija"], "pitanje": "Koje države su krajem XIX veka bile evropske velike sile? (Više tačnih.)", "odgovori": [{"tekst": "Velika Britanija", "tacan": true}, {"tekst": "Francuska", "tacan": true}, {"tekst": "Nemačka", "tacan": true}, {"tekst": "Rusija", "tacan": true}, {"tekst": "Habzburška monarhija", "tacan": true}, {"tekst": "Italija", "tacan": true}, {"tekst": "Osmansko carstvo", "tacan": false, "zasto": "Osmansko carstvo slabi; o njegovom opstanku se vodi Istočno pitanje."}, {"tekst": "Španija", "tacan": false, "zasto": "Španija je u prvim decenijama XIX veka izgubila većinu kolonija i nije među velikim silama."}], "pomoc": ["Ima ih šest.", "Dve od njih su zainteresovane za Balkan, dve žele da održe Osmansko carstvo.", "Iz lekcije: V. Britanija, Francuska, Nemačka, Rusija, Habzburška monarhija i Italija."], "objasnjenje": "Šest velikih sila — V. Britanija, Francuska, Nemačka, Rusija, Habzburška monarhija i Italija — imalo je četiri petine stanovnika Evrope.", "iz_udzbenika": {"strana": 12, "odeljak": "Velike sile", "tekst": "Krajem XIX veka četiri petine stanovnika Evrope živelo je u šest velikih sila."}, "lekcija": 1}, {"id": "dr-tn-revolucija", "vrsta": "tacno_netacno", "tezina": "lako", "pojmovi": ["francuska-revolucija", "seljastvo", "gradjanstvo"], "tvrdnja": "Nezadovoljstvo seljaštva i građanstva postojećim poretkom dovelo je krajem XVIII veka do Francuske revolucije.", "tacno": true, "pomoc": ["Ko su bili najbrojniji i sve jači slojevi?", "Šta se dešava kad oni nisu zadovoljni poretkom?", "Iz lekcije: nezadovoljstvo ovih slojeva dovelo je do Francuske revolucije."], "objasnjenje": "Tačno — seljaštvo i građanstvo, nezadovoljni poretkom, pokrenuli su promene koje su dovele do Francuske revolucije.", "iz_udzbenika": {"strana": 11, "odeljak": "Društvo", "tekst": "Nezadovoljstvo seljaštva i građanstva postojećim poretkom dovelo je krajem XVIII veka do Francuske revolucije."}, "osa": {"naziv": "Francuska revolucija", "od": 1770, "do": 1800, "traka": "svet", "oznaka": "kraj XVIII veka"}, "lekcija": 1}, {"id": "dr-tn-radnicka-prava", "vrsta": "tacno_netacno", "tezina": "srednje", "pojmovi": ["radnistvo"], "tvrdnja": "Borba za radnička prava brzo je uspela i završila se do sredine XIX veka.", "tacno": false, "ispravke": [{"tekst": "Borba za radnička prava trajala je dugo i nastavila se i u XX veku.", "tacan": true}, {"tekst": "Radnici se nisu borili za svoja prava jer su uslovi u fabrikama bili dobri.", "tacan": false, "zasto": "Život i rad u prvim fabrikama bili su veoma teški — zato je i počela borba."}, {"tekst": "Borba za radnička prava počela je tek posle Prvog svetskog rata.", "tacan": false, "zasto": "Radničke demonstracije u Londonu bile su već sredinom XIX veka."}], "pomoc": ["Kakvi su bili uslovi u prvim fabrikama?", "Da li se borba završila u XIX veku?", "Iz lekcije: borba za radnička prava trajala je dugo i nastavila se u XX veku."], "objasnjenje": "Uslovi u fabrikama bili su teški, a borba radnika duga — nastavila se i u XX veku.", "iz_udzbenika": {"strana": 12, "odeljak": "Društvo", "tekst": "Život i rad u prvim fabrikama bili su veoma teški; borba za radnička prava trajala je dugo i nastavila se u XX veku."}, "lekcija": 1}, {"id": "dr-tn-sile-stanovnistvo", "vrsta": "tacno_netacno", "tezina": "tesko", "pojmovi": ["velike-sile"], "tvrdnja": "Krajem XIX veka u šest velikih sila živela je oko polovina stanovnika Evrope.", "tacno": false, "ispravke": [{"tekst": "U velikim silama živele su četiri petine stanovnika Evrope.", "tacan": true}, {"tekst": "U velikim silama živela je jedna petina stanovnika Evrope.", "tacan": false, "zasto": "Bilo je obrnuto — samo petina je živela van velikih sila."}, {"tekst": "U velikim silama živelo je celo stanovništvo Evrope.", "tacan": false, "zasto": "Postojale su i manje zemlje kojima su sile nametale volju."}], "pomoc": ["Bilo je mnogo više od polovine.", "Razlomak sa imeniocem pet.", "Iz lekcije: četiri petine stanovništva Evrope."], "objasnjenje": "Četiri petine (80%) Evropljana živelo je u šest velikih sila — zato su one mogle da nameću volju ostalima.", "iz_udzbenika": {"strana": 12, "odeljak": "Velike sile", "tekst": "Krajem XIX veka četiri petine stanovništva Evrope živelo je u Velikoj Britaniji, Francuskoj, Nemačkoj, Rusiji, Habzburškoj monarhiji i Italiji."}, "lekcija": 1}, {"id": "dr-dopuni-slojevi", "vrsta": "dopuni", "tezina": "lako", "pojmovi": ["seljastvo", "gradjanstvo", "radnistvo"], "pitanje": "Dopuni rečenice o društvu XIX veka.", "tekst": "Najbrojniji sloj je i dalje bilo {{seljaštvo}}, ali su privredne promene jačale ulogu {{građanstva}}. Novi sloj koji živi od rada u fabrikama zove se {{radništvo}}.", "ponudjene": ["seljaštvo", "građanstva", "radništvo", "plemstva", "sveštenstvo"], "pomoc": ["Selo, grad, fabrika — tri sloja.", "Novi sloj je nastao u fabrikama.", "Iz lekcije: seljaštvo najbrojnije; građanstvo jača; radništvo je novina XIX veka."], "objasnjenje": "Seljaštvo je najbrojnije, građanstvo jača, a radništvo je nov sloj XIX veka.", "iz_udzbenika": {"strana": 12, "odeljak": "Društvo", "tekst": "Seljaštvo je najbrojnije, građanstvo jača, a važna novina XIX veka je radništvo."}, "lekcija": 1}, {"id": "dr-povezi-slojevi", "vrsta": "povezi", "tezina": "lako", "pojmovi": ["seljastvo", "gradjanstvo", "plemstvo", "radnistvo"], "pitanje": "Poveži društveni sloj sa onim što se s njim dešava u XIX veku.", "parovi": [["seljaštvo", "i dalje najbrojniji sloj"], ["građanstvo", "jača zbog privrednih promena i čuva stečeno bogatstvo"], ["plemstvo", "gubi prevlast koju je imalo od srednjeg veka"], ["radništvo", "novi gradski sloj koji živi od rada u fabrikama"]], "pomoc": ["Jedan sloj je nov, jedan gubi, jedan jača.", "Najbrojniji sloj živi na selu.", "Iz lekcije: str. 11–12, odeljak o društvu."], "objasnjenje": "Seljaštvo — najbrojnije; građanstvo — jača; plemstvo — gubi prevlast; radništvo — nastaje u fabrikama.", "iz_udzbenika": {"strana": 12, "odeljak": "Društvo", "tekst": "Udžbenik opisuje kako se u XIX veku menja položaj seljaštva, građanstva, plemstva i sveštenstva i kako nastaje radništvo."}, "lekcija": 1}, {"id": "dr-povezi-uzroci", "vrsta": "povezi", "tezina": "tesko", "pojmovi": ["gradjanstvo", "francuska-revolucija", "radnistvo", "velike-sile"], "pitanje": "Poveži uzrok sa njegovom posledicom.", "parovi": [["privredne promene", "jačanje uloge građanstva"], ["nezadovoljstvo seljaštva i građanstva poretkom", "Francuska revolucija"], ["promene posle Francuske revolucije", "ukidanje apsolutizma i feudalizma"], ["teški uslovi rada u fabrikama", "duga borba za radnička prava"], ["rivalstvo velikih sila", "sukobljeni savezi i trka za kolonijama"]], "pomoc": ["Kreni od revolucije — šta joj prethodi, a šta iz nje sledi?", "Radnici se bore zato što … ; sile sklapaju saveze zato što …", "Iz lekcije: odeljak „Uzrok → posledica”, str. 11–12."], "objasnjenje": "Privreda jača građanstvo; nezadovoljstvo vodi u revoluciju, a ona u ukidanje feudalizma; teški uslovi vode u borbu radnika; rivalstvo u saveze i kolonije.", "iz_udzbenika": {"strana": 12, "odeljak": "Društvo i Velike sile", "tekst": "Udžbenik povezuje privredne promene, nezadovoljstvo slojeva, Francusku revoluciju, rad u fabrikama i rivalstvo velikih sila."}, "lekcija": 1}, {"id": "dr-zakljuci-volja", "vrsta": "zakljuci", "tezina": "lako", "pojmovi": ["velike-sile"], "pitanje": "Zašto su velike sile mogle da nameću volju manjim zemljama?", "odgovori": [{"tekst": "Zbog svoje privredne i vojne snage", "tacan": true}, {"tekst": "Zato što su sve imale istu veru", "tacan": false, "zasto": "Lekcija ne govori o veri kao izvoru moći; razlog je privredna i vojna snaga."}, {"tekst": "Zato što su bile međusobno složne", "tacan": false, "zasto": "Bile su suparnice — sklapale su sukobljene saveze."}, {"tekst": "Zato što su manje zemlje to tražile", "tacan": false, "zasto": "Volja se nameće onome ko to ne želi; manje zemlje nisu imale snage da se odupru."}], "pomoc": ["Korak 1: Šta čini državu jakom?", "Korak 2: Novac i oružje.", "Iz lekcije: zahvaljujući privrednoj i vojnoj snazi nametale su volju manjim zemljama."], "objasnjenje": "Bogatstvo i vojska davali su velikim silama moć da odlučuju umesto manjih zemalja.", "iz_udzbenika": {"strana": 12, "odeljak": "Velike sile", "tekst": "Zahvaljujući privrednoj i vojnoj snazi velike sile su nametale volju manjim zemljama."}, "lekcija": 1}, {"id": "dr-zakljuci-feudalizam", "vrsta": "zakljuci", "tezina": "srednje", "pojmovi": ["francuska-revolucija", "apsolutisticka-monarhija", "feudalizam"], "pitanje": "Zašto su u prvoj polovini XIX veka u većini evropskih zemalja ukinuti apsolutistička monarhija i feudalno uređenje?", "odgovori": [{"tekst": "Pod uticajem promena koje je donela Francuska revolucija", "tacan": true}, {"tekst": "Zbog otkrića vakcine protiv velikih boginja", "tacan": false, "zasto": "Vakcina je produžila život, ali nije menjala politički poredak."}, {"tekst": "Zato što je to naredio Berlinski kongres", "tacan": false, "zasto": "Berlinski kongres je 1878, decenijama kasnije, i tiče se Balkana."}, {"tekst": "Zato što su plemići sami tražili da izgube povlastice", "tacan": false, "zasto": "Plemstvo je gubilo prevlast, a ne tražilo da je izgubi."}], "pomoc": ["Korak 1: Koji veliki događaj s kraja XVIII veka je srušio stari poredak u jednoj zemlji?", "Korak 2: Kako su se njegove ideje proširile?", "Iz lekcije: pod uticajem promena koje je donela Francuska revolucija ukinuti su apsolutizam i feudalizam."], "objasnjenje": "Francuska revolucija je pokazala da se stari poredak može srušiti; pod njenim uticajem apsolutizam i feudalizam nestaju u većini Evrope.", "iz_udzbenika": {"strana": 11, "odeljak": "Društvo", "tekst": "Pod uticajem promena koje je donela Francuska revolucija, u prvoj polovini XIX veka u većini evropskih zemalja ukinuti su apsolutistička monarhija i feudalno uređenje."}, "osa": {"naziv": "Ukidanje apsolutizma i feudalizma", "od": 1800, "do": 1850, "traka": "svet", "oznaka": "prva polovina XIX veka"}, "lekcija": 1}, {"id": "dr-zakljuci-gradjanstvo", "vrsta": "zakljuci", "tezina": "tesko", "pojmovi": ["gradjanstvo", "francuska-revolucija"], "pitanje": "Građanstvo je krajem XVIII veka bilo nezadovoljno poretkom, a u XIX veku je želelo da sačuva postojeće stanje. Kako to objasniti?", "odgovori": [{"tekst": "Kada je posle promena steklo uticaj i bogatstvo, građanstvu je više bilo stalo da ih zaštiti nego da menja poredak", "tacan": true}, {"tekst": "Građanstvo je u XIX veku izgubilo svo bogatstvo", "tacan": false, "zasto": "Naprotiv — imućno građanstvo je imalo šta da zaštiti."}, {"tekst": "Građanstvo je postalo deo plemstva", "tacan": false, "zasto": "Lekcija to ne kaže; plemstvo je gubilo prevlast, a građanstvo jačalo kao poseban sloj."}, {"tekst": "Građanstvo nikada nije bilo nezadovoljno", "tacan": false, "zasto": "Lekcija kaže da je nezadovoljstvo seljaštva i građanstva dovelo do Francuske revolucije."}], "pomoc": ["Korak 1: Šta je građanstvo dobilo kad su ukinuti apsolutizam i feudalizam?", "Korak 2: Kako se ponaša neko ko je stekao ono što je želeo?", "Iz lekcije: imućno građanstvo želi da sačuva uticaj i zaštiti stečeno bogatstvo."], "objasnjenje": "Dok je bilo bez moći, građanstvo je tražilo promenu; kad je steklo uticaj i bogatstvo, htelo je da ih sačuva.", "iz_udzbenika": {"strana": 12, "odeljak": "Društvo", "tekst": "Posle ukidanja feudalnog uređenja imućno građanstvo nastoji da sačuva uticaj i zaštiti stečeno bogatstvo."}, "lekcija": 1}, {"id": "dr-lanac-revolucija", "vrsta": "lanac", "tezina": "lako", "pojmovi": ["francuska-revolucija", "seljastvo", "gradjanstvo"], "karike": ["Seljaštvo i građanstvo nezadovoljni su postojećim poretkom", "?", "U većini zemalja ukidaju se apsolutizam i feudalizam"], "praznina": 1, "odgovori": [{"tekst": "Izbija Francuska revolucija", "tacan": true}, {"tekst": "Počinje Američki rat za nezavisnost", "tacan": false, "zasto": "Taj rat je pobuna naseljenika u 13 kolonija protiv Britanije, ne pobuna slojeva protiv evropskog poretka."}, {"tekst": "Džener pravi vakcinu", "tacan": false, "zasto": "Vakcina je medicinsko otkriće i ne ruši poredak."}, {"tekst": "Održava se Berlinski kongres", "tacan": false, "zasto": "Berlinski kongres je 1878. i tiče se Balkana."}], "pomoc": ["Korak 1: Nezadovoljstvo → nagla promena poretka. Kako se to zove?", "Korak 2: U kojoj zemlji se to desilo krajem XVIII veka?", "Iz lekcije: nezadovoljstvo je dovelo do Francuske revolucije."], "objasnjenje": "Nezadovoljstvo seljaštva i građanstva → Francuska revolucija → ukidanje apsolutizma i feudalizma.", "iz_udzbenika": {"strana": 11, "odeljak": "Društvo", "tekst": "Nezadovoljstvo seljaštva i građanstva dovelo je do Francuske revolucije, a pod njenim uticajem ukinuti su apsolutizam i feudalizam."}, "osa": {"naziv": "Francuska revolucija", "od": 1770, "do": 1800, "traka": "svet", "oznaka": "kraj XVIII veka"}, "lekcija": 1}, {"id": "dr-lanac-radnici", "vrsta": "lanac", "tezina": "srednje", "pojmovi": ["radnistvo"], "karike": ["Nastaju fabrike", "Pojavljuje se radništvo", "Život i rad u prvim fabrikama su veoma teški", "?"], "praznina": 3, "odgovori": [{"tekst": "Počinje duga borba za radnička prava", "tacan": true}, {"tekst": "Radnici se vraćaju na selo i fabrike se zatvaraju", "tacan": false, "zasto": "Lekcija to ne kaže — gradovi i industrija rastu tokom celog XIX veka."}, {"tekst": "Radništvo postaje najbrojniji sloj", "tacan": false, "zasto": "Najbrojniji je i dalje seljaštvo."}, {"tekst": "Ukida se feudalizam", "tacan": false, "zasto": "Feudalizam se ukida pod uticajem Francuske revolucije, ne zbog uslova u fabrikama."}], "pomoc": ["Korak 1: Šta rade ljudi kad su im uslovi rada teški?", "Korak 2: Pogledaj sliku demonstracija u Londonu.", "Iz lekcije: borba za radnička prava trajala je dugo i nastavila se u XX veku."], "objasnjenje": "Teški uslovi u fabrikama pokrenuli su borbu radnika za svoja prava — dugu, sve do XX veka.", "iz_udzbenika": {"strana": 12, "odeljak": "Društvo", "tekst": "Radništvo živi od rada u fabrikama; uslovi su bili teški, a borba za radnička prava duga.", "slika": "01-osnovne-odlike-perioda-1780-1918/05-radnicke-demonstracije-london.jpg"}, "lekcija": 1}, {"id": "dr-lanac-kolonije", "vrsta": "lanac", "tezina": "tesko", "pojmovi": ["velike-sile", "kolonija", "jagma-za-afrikom", "kina"], "karike": ["Velike sile imaju veliku privrednu i vojnu snagu", "Među njima raste rivalstvo", "?", "Dele se Afrika i Kina"], "praznina": 2, "odgovori": [{"tekst": "Nadmeću se za nove kolonije", "tacan": true}, {"tekst": "Ukidaju svoje vojske", "tacan": false, "zasto": "Vojna snaga je izvor njihove moći — ne ukidaju je."}, {"tekst": "Sklapaju jedan zajednički savez svih sila", "tacan": false, "zasto": "Savezi su bili međusobno sukobljeni, ne jedan zajednički."}, {"tekst": "Otvaraju svoje luke kineskoj trgovini", "tacan": false, "zasto": "Bilo je obrnuto: Kina i Japan su primorani da otvore luke evropskim silama i SAD."}], "pomoc": ["Korak 1: Kako se vidi rivalstvo velikih sila?", "Korak 2: Šta su Afrika i Kina za velike sile — saveznici ili plen?", "Iz lekcije: rivalstvo se ogledalo u sukobljenim savezima i nadmetanju za nove kolonije."], "objasnjenje": "Snaga → rivalstvo → trka za kolonijama → podela Afrike i pokušaji podele Kine.", "iz_udzbenika": {"strana": 12, "odeljak": "Velike sile", "tekst": "Rivalstvo velikih sila ogledalo se u sklapanju sukobljenih saveza i u nadmetanju za nove kolonije."}, "lekcija": 1}, {"id": "dr-izvor-demonstracije", "vrsta": "izvor", "slika_u_pitanju": true, "tezina": "srednje", "pojmovi": ["radnistvo", "london"], "izvor": {"autor": "Udžbenik (slika sa potpisom)", "naslov": "Radničke demonstracije u Londonu sredinom XIX veka", "tekst": "Velika masa ljudi okupljena na otvorenom prostoru u Londonu. Prema potpisu, to su radnici koji demonstriraju sredinom XIX veka.", "napomena": "Odlomak je prepričan; udžbenik, str. 12 (potpis je slabo čitljiv)."}, "pitanje": "Šta nam ova slika govori o radništvu XIX veka?", "odgovori": [{"tekst": "Da su se radnici zbog teških uslova rada okupljali i javno borili za svoja prava", "tacan": true}, {"tekst": "Da su radnici slavili kraj borbe za radnička prava", "tacan": false, "zasto": "Borba je tek trajala — nastavila se i u XX veku."}, {"tekst": "Da su radnici bili najbrojniji sloj u Evropi", "tacan": false, "zasto": "Masa na jednoj slici ne dokazuje to; najbrojnije je bilo seljaštvo."}, {"tekst": "Da su demonstrirali plemići koji su gubili prevlast", "tacan": false, "zasto": "Potpis kaže da su to radničke demonstracije."}], "pomoc": ["Ko demonstrira, po potpisu?", "Zašto bi radnici izašli na ulice?", "Iz lekcije: život i rad u prvim fabrikama bili su veoma teški; borba za radnička prava trajala je dugo."], "objasnjenje": "Slika svedoči o borbi radnika za prava; uzrok su teški uslovi u prvim fabrikama.", "iz_udzbenika": {"strana": 12, "odeljak": "Društvo", "tekst": "Uz odeljak o radništvu udžbenik donosi sliku radničkih demonstracija u Londonu sredinom XIX veka.", "slika": "01-osnovne-odlike-perioda-1780-1918/05-radnicke-demonstracije-london.jpg"}, "osa": {"naziv": "Radničke demonstracije u Londonu", "od": 1840, "do": 1860, "traka": "svet", "oznaka": "sredina XIX veka"}, "lekcija": 1}, {"id": "dr-izvor-klackalica", "vrsta": "izvor", "tezina": "lako", "pojmovi": ["velike-sile", "velika-britanija", "sjedinjene-americke-drzave"], "izvor": {"autor": "Američki satirični časopis, 1898.", "naslov": "Klackalica nacija (opis karikature)", "tekst": "Na jednom kraju daske su Velika Britanija i SAD, na drugom Rusija, Nemačka i Francuska, a Kina visi na kraju daske. Ženska figura „Istorija” pokušava da održi ravnotežu. U središtu klackalice je top. Strana Britanije i SAD je pretegla.", "napomena": "Odlomak je prepričan; udžbenik, str. 12."}, "pitanje": "Koje države karikatura prikazuje kao najmoćnije?", "odgovori": [{"tekst": "Veliku Britaniju i SAD", "tacan": true}, {"tekst": "Rusiju, Nemačku i Francusku", "tacan": false, "zasto": "One su na drugoj strani daske, koja je lakša."}, {"tekst": "Kinu", "tacan": false, "zasto": "Kina samo visi na kraju daske — ona nije igrač, nego je predmet nadmetanja."}, {"tekst": "Sve države su prikazane kao jednako jake", "tacan": false, "zasto": "Klackalica nije u ravnoteži — jedna strana je pretegla."}], "pomoc": ["Na klackalici je jača strana ona koja je pretegla.", "Ko sedi na težoj strani?", "Iz lekcije: kao najmoćnije prikazane su V. Britanija i SAD."], "objasnjenje": "Strana Velike Britanije i SAD je pretegla — karikaturista ih vidi kao najmoćnije.", "iz_udzbenika": {"strana": 12, "odeljak": "Velike sile", "tekst": "Karikatura „Klackalica nacija” iz američkog časopisa (1898) prikazuje borbu velikih sila za prevlast u svetu.", "slika": "01-osnovne-odlike-perioda-1780-1918/06-karikatura-klackalica-nacija.jpg"}, "osa": {"naziv": "Karikatura „Klackalica nacija”", "od": 1898, "traka": "svet"}, "lekcija": 1}, {"id": "dr-izvor-top", "vrsta": "izvor", "tezina": "tesko", "pojmovi": ["velike-sile"], "izvor": {"autor": "Američki satirični časopis, 1898.", "naslov": "Klackalica nacija (opis karikature)", "tekst": "Velike sile sede na dve strane klackalice, a „Istorija” pokušava da ih održi u ravnoteži. Klackalica se oslanja na top postavljen u njenom središtu.", "napomena": "Odlomak je prepričan; udžbenik, str. 12."}, "pitanje": "Šta karikaturista poručuje time što je klackalica postavljena na top?", "odgovori": [{"tekst": "Da ravnoteža među velikim silama počiva na vojnoj sili i pretnji ratom", "tacan": true}, {"tekst": "Da su velike sile odustale od oružja", "tacan": false, "zasto": "Top u središtu znači suprotno — oružje drži ceo odnos."}, {"tekst": "Da je top Kinin, pa je Kina najjača", "tacan": false, "zasto": "Kina visi na kraju daske i nema moć; top predstavlja vojnu silu na kojoj počiva odnos sila."}, {"tekst": "Da se sile takmiče samo u trgovini", "tacan": false, "zasto": "Top nije simbol trgovine nego vojne snage."}], "pomoc": ["Šta je top — alat za trgovinu ili oružje?", "Na čemu se oslanja cela klackalica?", "Iz lekcije: velike sile su volju nametale i vojnom snagom; odnos sila počiva na oružju."], "objasnjenje": "Top u središtu govori da odnos velikih sila drži vojna sila — ravnoteža može da se prekine ratom.", "iz_udzbenika": {"strana": 12, "odeljak": "Velike sile", "tekst": "Udžbenik uz karikaturu traži da se objasni simbolika topa u središtu klackalice.", "slika": "01-osnovne-odlike-perioda-1780-1918/06-karikatura-klackalica-nacija.jpg"}, "osa": {"naziv": "Karikatura „Klackalica nacija”", "od": 1898, "traka": "svet"}, "lekcija": 1}, {"id": "dr-uporedi-plemstvo-gradjanstvo", "vrsta": "uporedi", "tezina": "srednje", "pojmovi": ["plemstvo", "gradjanstvo", "francuska-revolucija"], "a": "Plemstvo", "b": "Građanstvo", "pitanje": "Na koji sloj se odnosi tvrdnja — A, B, oba ili nijedan?", "tvrdnje": [{"tekst": "Imalo je prevlast još od srednjeg veka.", "odgovor": "a", "zasto": "Plemstvo (uz sveštenstvo) je imalo prevlast od srednjeg veka."}, {"tekst": "Jača zbog privrednih promena.", "odgovor": "b", "zasto": "Privredne promene jačaju ulogu građanstva."}, {"tekst": "Gubi prevlast u prvoj polovini XIX veka.", "odgovor": "a", "zasto": "Ukidanjem feudalizma plemstvo gubi prevlast."}, {"tekst": "Njegovo nezadovoljstvo doprinelo je Francuskoj revoluciji.", "odgovor": "b", "zasto": "Do revolucije je dovelo nezadovoljstvo seljaštva i građanstva."}, {"tekst": "Bilo je najbrojniji sloj.", "odgovor": "nijedan", "zasto": "Najbrojnije je bilo seljaštvo."}], "pomoc": ["Jedan sloj je stari, povlašćeni; drugi je u usponu.", "Ko je bio nezadovoljan starim poretkom?", "Iz lekcije: plemstvo gubi prevlast; građanstvo jača."], "objasnjenje": "Plemstvo je stari povlašćeni sloj koji gubi prevlast; građanstvo jača i posle revolucije čuva svoj uticaj.", "iz_udzbenika": {"strana": 12, "odeljak": "Društvo", "tekst": "Privredne promene jačaju građanstvo, a posle ukidanja feudalizma plemstvo i sveštenstvo gube prevlast."}, "lekcija": 1}, {"id": "dr-uporedi-seljastvo-radnistvo", "vrsta": "uporedi", "tezina": "tesko", "pojmovi": ["seljastvo", "radnistvo", "knezevina-srbija"], "a": "Seljaštvo", "b": "Radništvo", "pitanje": "Na koji sloj se odnosi tvrdnja — A, B, oba ili nijedan?", "tvrdnje": [{"tekst": "Najbrojniji sloj u XIX veku.", "odgovor": "a", "zasto": "Seljaštvo je i dalje najbrojnije."}, {"tekst": "Gradski sloj koji živi od rada u fabrikama.", "odgovor": "b", "zasto": "To je definicija radništva."}, {"tekst": "Nova pojava XIX veka.", "odgovor": "b", "zasto": "Seljaka je bilo oduvek; radništvo nastaje sa fabrikama."}, {"tekst": "Njegovo nezadovoljstvo dovelo je do Francuske revolucije.", "odgovor": "a", "zasto": "Do revolucije su doveli nezadovoljni seljaštvo i građanstvo; radništvo je tada tek nastajalo."}, {"tekst": "U Srbiji je posle ukidanja turskog feudalnog uređenja postalo slobodno.", "odgovor": "a", "zasto": "Srbija postaje zemlja slobodnih seljaka."}, {"tekst": "Imalo je prevlast od srednjeg veka.", "odgovor": "nijedan", "zasto": "Prevlast su imali plemstvo i sveštenstvo."}], "pomoc": ["Jedan sloj je star i živi na selu, drugi je nov i živi u gradu.", "Ko je postojao krajem XVIII veka, pre fabrika?", "Iz lekcije: seljaštvo najbrojnije; radništvo — novina XIX veka."], "objasnjenje": "Seljaštvo je stari, najbrojniji sloj; radništvo je novi gradski sloj nastao sa fabrikama.", "iz_udzbenika": {"strana": 12, "odeljak": "Društvo", "tekst": "Seljaštvo je najbrojniji sloj, a radništvo je gradski sloj koji živi od rada u fabrikama, važna novina XIX veka."}, "lekcija": 1}, {"id": "dr-objasni-radnistvo", "vrsta": "objasni", "tezina": "srednje", "pojmovi": ["radnistvo", "industrija"], "pitanje": "Ko su bili radnici u XIX veku i zašto su se borili za svoja prava? Objasni svojim rečima.", "uzor": "Radništvo je novi gradski sloj koji je nastao sa fabrikama i živi od svog rada u njima. Život i rad u prvim fabrikama bili su veoma teški, pa su radnici počeli da se bore za svoja prava, na primer demonstracijama kao u Londonu sredinom XIX veka. Ta borba je trajala dugo i nastavila se u XX veku.", "ideje": ["Radništvo živi od rada u fabrikama, u gradu.", "Nastalo je kao nov sloj u XIX veku.", "Uslovi rada i života bili su veoma teški.", "Borba za prava trajala je dugo, i u XX veku."], "objasnjenje": "Radništvo je dete industrije, a njegova borba — posledica teških uslova u prvim fabrikama.", "iz_udzbenika": {"strana": 12, "odeljak": "Društvo", "tekst": "Radništvo je gradski sloj koji živi od rada u fabrikama; borba za radnička prava trajala je dugo.", "slika": "01-osnovne-odlike-perioda-1780-1918/05-radnicke-demonstracije-london.jpg"}, "lekcija": 1}, {"id": "dr-objasni-klackalica", "vrsta": "objasni", "tezina": "tesko", "pojmovi": ["velike-sile", "kina"], "pitanje": "Opiši karikaturu „Klackalica nacija” (1898) i objasni šta poručuje o odnosima velikih sila.", "uzor": "Na klackalici sede velike sile — na jednoj strani Velika Britanija i SAD, na drugoj Rusija, Nemačka i Francuska, a Kina visi na kraju daske. Strana Britanije i SAD je pretegla, pa su one prikazane kao najmoćnije. „Istorija” pokušava da održi ravnotežu, ali klackalica stoji na topu, što znači da odnos sila počiva na vojnoj sili i pretnji ratom.", "ideje": ["Dve grupe sila na dve strane klackalice.", "V. Britanija i SAD su pretegle — najmoćnije su.", "Top u središtu = ravnoteža počiva na vojnoj sili.", "Kina visi na kraju daske — ona je predmet nadmetanja sila."], "objasnjenje": "Karikatura prikazuje rivalstvo velikih sila kao krhku ravnotežu koju drži oružje.", "iz_udzbenika": {"strana": 12, "odeljak": "Velike sile", "tekst": "Udžbenik pita koje su države predstavljene kao najmoćnije i šta znači top na karikaturi.", "slika": "01-osnovne-odlike-perioda-1780-1918/06-karikatura-klackalica-nacija.jpg"}, "osa": {"naziv": "Karikatura „Klackalica nacija”", "od": 1898, "traka": "svet"}, "lekcija": 1}]}, {"naslov": "Evropa i drugi kontinenti", "zadaci": [{"id": "sv-izbor-sad", "vrsta": "izbor", "tezina": "lako", "pojmovi": ["americki-rat-za-nezavisnost", "sjedinjene-americke-drzave", "kolonija"], "pitanje": "Kako su krajem XVIII veka nastale Sjedinjene Američke Države?", "odgovori": [{"tekst": "Pobunom evropskih naseljenika u trinaest britanskih kolonija — u Američkom ratu za nezavisnost", "tacan": true}, {"tekst": "Raspadom španskog carstva u Americi", "tacan": false, "zasto": "Od španskih kolonija nastale su latinoameričke države, od Meksika do Argentine."}, {"tekst": "Odlukom Berlinskog kongresa", "tacan": false, "zasto": "Berlinski kongres je 1878. i odlučivao je o Balkanu, ne o Americi."}, {"tekst": "Odvajanjem od Portugalije", "tacan": false, "zasto": "Od Portugalije se odvojio Brazil."}], "pomoc": ["Čije su kolonije bile u Severnoj Americi?", "Naseljenici su se pobunili protiv vlasti Velike Britanije.", "Iz lekcije: u Američkom ratu za nezavisnost od trinaest kolonija nastaju SAD."], "objasnjenje": "Naseljenici trinaest kolonija pobunili su se protiv Britanije; u Američkom ratu za nezavisnost nastale su SAD.", "iz_udzbenika": {"strana": 12, "odeljak": "Prostorni okviri novog veka", "tekst": "Krajem XVIII veka pobuna naseljenika u trinaest kolonija u Severnoj Americi uzdrmala je britansku vlast; u Američkom ratu za nezavisnost nastaju SAD."}, "osa": {"naziv": "Američki rat za nezavisnost", "od": 1770, "do": 1800, "traka": "svet", "oznaka": "kraj XVIII veka"}, "lekcija": 1}, {"id": "sv-izbor-brazil", "vrsta": "izbor", "tezina": "lako", "pojmovi": ["brazil", "portugalija"], "pitanje": "Od koje države je Brazil u prvim decenijama XIX veka proglasio nezavisnost?", "odgovori": [{"tekst": "Od Portugalije", "tacan": true}, {"tekst": "Od Španije", "tacan": false, "zasto": "Od španskih kolonija nastale su druge latinoameričke države; Brazil je bio portugalski."}, {"tekst": "Od Velike Britanije", "tacan": false, "zasto": "Britanija je izgubila trinaest kolonija u Severnoj Americi, ne Brazil."}, {"tekst": "Od Francuske", "tacan": false, "zasto": "Francuze su Britanci istisnuli iz Severne Amerike i Indije; Brazil nije bio francuski."}], "pomoc": ["Brazil je jedina velika zemlja Južne Amerike koja nije bila španska.", "Bila je to druga iberijska kolonijalna sila.", "Iz lekcije: Brazil proglašava nezavisnost od Portugalije."], "objasnjenje": "Brazil je bio portugalska kolonija i nezavisnost je proglasio u isto vreme kad i Španija gubi svoje kolonije.", "iz_udzbenika": {"strana": 12, "odeljak": "Prostorni okviri novog veka", "tekst": "U prvim decenijama XIX veka Španija gubi većinu kolonija, a Brazil proglašava nezavisnost od Portugalije."}, "osa": {"naziv": "Španija gubi kolonije, nezavisnost Brazila", "od": 1800, "do": 1830, "traka": "svet", "oznaka": "prve decenije XIX veka"}, "lekcija": 1}, {"id": "sv-izbor-roblje", "vrsta": "izbor", "tezina": "srednje", "pojmovi": ["afrika", "robovlasnistvo"], "pitanje": "Šta je pokrenulo prisustvo evropskih moreplovaca u Africi od kraja XV veka?", "odgovori": [{"tekst": "Trgovinu crnim robljem", "tacan": true}, {"tekst": "Nastanak latinoameričkih država", "tacan": false, "zasto": "Latinoameričke države nastaju od španskih kolonija u Americi, početkom XIX veka."}, {"tekst": "Odmah podelu cele Afrike", "tacan": false, "zasto": "Podela gotovo cele Afrike desila se tek do početka XX veka, četiri veka kasnije."}, {"tekst": "Ukidanje feudalizma u Africi", "tacan": false, "zasto": "Lekcija o tome ništa ne kaže; feudalne odnose je ukinuo Japan."}], "pomoc": ["Afrika je od kraja XV veka bila meta trgovačkih poduhvata.", "Čime su Evropljani trgovali — a što je ljude pretvaralo u robu?", "Iz lekcije: prisustvo evropskih moreplovaca pokrenulo je trgovinu crnim robljem."], "objasnjenje": "Evropski moreplovci su u Africi pokrenuli trgovinu robljem; mnogo kasnije sile su podelile i sam kontinent.", "iz_udzbenika": {"strana": 13, "odeljak": "Prostorni okviri novog veka", "tekst": "Afrika je od kraja XV veka meta trgovačkih poduhvata evropskih moreplovaca, čije je prisustvo pokrenulo trgovinu crnim robljem."}, "lekcija": 1}, {"id": "sv-izbor-japan", "vrsta": "izbor", "tezina": "tesko", "pojmovi": ["japan", "koreja", "kolonijalizam"], "pitanje": "Šta važi za Japan u XIX veku? (Više tačnih.)", "odgovori": [{"tekst": "Ukinuo je feudalne odnose", "tacan": true}, {"tekst": "Modernizovao je privredu i vojsku po uzoru na Zapad", "tacan": true}, {"tekst": "Krajem veka je pretvorio Koreju u koloniju", "tacan": true}, {"tekst": "Ostao je ekonomski i vojno zaostalo carstvo", "tacan": false, "zasto": "To lekcija kaže za Kinu; Japan se reformama modernizovao."}, {"tekst": "Nikada nije otvorio luke za strance", "tacan": false, "zasto": "Sredinom XIX veka i Japan je bio primoran da otvori luke evropskim silama i SAD."}], "pomoc": ["Japan je krenuo drugim putem od Kine.", "Reforme → snaga → i sam osvaja.", "Iz lekcije: Japan ukida feudalne odnose, modernizuje privredu i vojsku, pretvara Koreju u koloniju."], "objasnjenje": "Japan je reformama po uzoru na Zapad ukinuo feudalizam, modernizovao privredu i vojsku i postao kolonijalna sila (Koreja).", "iz_udzbenika": {"strana": 13, "odeljak": "Prostorni okviri novog veka", "tekst": "Japan je reformama po uzoru na Zapad ukinuo feudalne odnose, modernizovao privredu i vojsku i krajem XIX veka pretvorio Koreju u koloniju."}, "osa": {"naziv": "Japan pretvara Koreju u koloniju", "od": 1870, "do": 1900, "traka": "svet", "oznaka": "kraj XIX veka"}, "lekcija": 1}, {"id": "sv-tn-jagma", "vrsta": "tacno_netacno", "tezina": "lako", "pojmovi": ["jagma-za-afrikom", "afrika", "kolonija"], "tvrdnja": "Do početka XX veka evropske sile podelile su gotovo ceo afrički kontinent.", "tacno": true, "pomoc": ["Kako se zove trka sila za Afrikom?", "Da li je ostalo mnogo slobodnih afričkih zemalja?", "Iz lekcije: podela gotovo cele Afrike — „jagma za Afrikom”."], "objasnjenje": "Tačno — to je „jagma za Afrikom”; kolonizacija je donela surovo iskorišćavanje ljudi i bogatstava.", "iz_udzbenika": {"strana": 13, "odeljak": "Prostorni okviri novog veka", "tekst": "Do početka XX veka evropske sile podelile su gotovo celu Afriku; to se naziva „jagma za Afrikom”."}, "osa": {"naziv": "Jagma za Afrikom", "od": 1870, "do": 1910, "traka": "svet", "oznaka": "do početka XX veka"}, "lekcija": 1}, {"id": "sv-tn-luke", "vrsta": "tacno_netacno", "tezina": "lako", "pojmovi": ["kina", "japan"], "tvrdnja": "Kina i Japan su sredinom XIX veka dobrovoljno otvorili luke jer su želeli zapadni uticaj.", "tacno": false, "ispravke": [{"tekst": "Bili su primorani da otvore luke za trgovinu sa evropskim silama i SAD.", "tacan": true}, {"tekst": "Otvorili su luke tek posle Prvog svetskog rata.", "tacan": false, "zasto": "Luke su otvorene sredinom XIX veka."}, {"tekst": "Luke su otvorili samo za trgovinu sa Afrikom.", "tacan": false, "zasto": "Luke su otvorene evropskim silama i SAD."}], "pomoc": ["Do početka XIX veka obe zemlje su se opirale evropskom uticaju.", "Da li je onda otvaranje bilo dobrovoljno?", "Iz lekcije: sredinom XIX veka bili su primorani da otvore luke."], "objasnjenje": "Kina i Japan su se dugo opirali; luke su otvorili pod pritiskom evropskih sila i SAD.", "iz_udzbenika": {"strana": 13, "odeljak": "Prostorni okviri novog veka", "tekst": "Kina i Japan su se do početka XIX veka opirali evropskom uticaju, a sredinom XIX veka bili su primorani da otvore luke."}, "osa": {"naziv": "Kina i Japan otvaraju luke", "od": 1840, "do": 1860, "traka": "svet", "oznaka": "sredina XIX veka"}, "lekcija": 1}, {"id": "sv-tn-japan-kolonija", "vrsta": "tacno_netacno", "tezina": "srednje", "pojmovi": ["japan", "kolonijalizam", "koreja"], "tvrdnja": "Krajem XIX veka Japan je, kao i Kina, postao plen evropskih sila koje su ga delile.", "tacno": false, "ispravke": [{"tekst": "Japan je i sam postao kolonijalna sila — pretvorio je Koreju u koloniju i pokušao da se širi na račun Kine.", "tacan": true}, {"tekst": "Japan je postao kolonija Koreje.", "tacan": false, "zasto": "Obrnuto — Japan je Koreju pretvorio u svoju koloniju."}, {"tekst": "Japan je postao kolonija SAD.", "tacan": false, "zasto": "Japan je otvorio luke za trgovinu, ali nije postao kolonija; reformisao se i sam osvajao."}], "pomoc": ["Šta je Japan uradio posle otvaranja luka?", "Na karikaturi o Kini, ko pored evropskih vladara seče kolač?", "Iz lekcije: Japan je pretvorio Koreju u koloniju i postao kolonijalna sila."], "objasnjenje": "Za razliku od Kine, Japan se modernizovao i sam postao kolonijalna sila.", "iz_udzbenika": {"strana": 13, "odeljak": "Prostorni okviri novog veka", "tekst": "Japan je krajem XIX veka pretvorio Koreju u koloniju i pokušao da se proširi na račun Kine, pa i on postaje kolonijalna sila."}, "osa": {"naziv": "Japan pretvara Koreju u koloniju", "od": 1870, "do": 1900, "traka": "svet", "oznaka": "kraj XIX veka"}, "lekcija": 1}, {"id": "sv-dopuni-afrika", "vrsta": "dopuni", "tezina": "lako", "pojmovi": ["jagma-za-afrikom", "kolonija"], "pitanje": "Dopuni rečenicu.", "tekst": "Podela gotovo cele Afrike među evropskim silama do početka XX veka naziva se {{jagma za Afrikom}}. Kolonizacija je donela surovo {{iskorišćavanje}} stanovništva i prirodnih bogatstava.", "ponudjene": ["jagma za Afrikom", "Istočno pitanje", "iskorišćavanje", "prosvećivanje"], "pomoc": ["„Jagma” znači otimanje, grabljenje.", "Šta su sile radile sa ljudima i bogatstvima kolonija?", "Iz lekcije: „jagma za Afrikom”; surovo iskorišćavanje."], "objasnjenje": "Jagma za Afrikom je grabljenje afričkog kontinenta; za Afrikance je značila surovo iskorišćavanje.", "iz_udzbenika": {"strana": 13, "odeljak": "Prostorni okviri novog veka", "tekst": "Evropske sile su do početka XX veka podelile gotovo celu Afriku; kolonizacija je donela surovo iskorišćavanje ljudi i bogatstava."}, "osa": {"naziv": "Jagma za Afrikom", "od": 1870, "do": 1910, "traka": "svet", "oznaka": "do početka XX veka"}, "lekcija": 1}, {"id": "sv-dopuni-spanija", "vrsta": "dopuni", "tezina": "srednje", "pojmovi": ["spanija", "latinska-amerika"], "pitanje": "Dopuni rečenice o španskom carstvu.", "tekst": "Španija je početkom {{XVI}} veka stvorila veliko carstvo u Srednjoj i Južnoj Americi. U prvim decenijama {{XIX}} veka ostala je bez većine kolonija, od kojih su nastale nezavisne države od {{Meksika}} do {{Argentine}}.", "ponudjene": ["XVI", "XIX", "XVIII", "Meksika", "Argentine", "Kanade", "Brazila"], "pomoc": ["Carstvo je nastalo ubrzo posle Kolumba.", "Najsevernija i najjužnija od tih država.", "Iz lekcije: carstvo početkom XVI veka; gubitak u prvim decenijama XIX veka; od Meksika do Argentine."], "objasnjenje": "Špansko carstvo u Americi trajalo je od početka XVI do prvih decenija XIX veka; od njega su nastale države od Meksika do Argentine.", "iz_udzbenika": {"strana": 12, "odeljak": "Prostorni okviri novog veka", "tekst": "Španija, koja je početkom XVI veka stvorila carstvo u Americi, izgubila je većinu kolonija u prvim decenijama XIX veka."}, "osa": {"naziv": "Španija gubi kolonije, nezavisnost Brazila", "od": 1800, "do": 1830, "traka": "svet", "oznaka": "prve decenije XIX veka"}, "lekcija": 1}, {"id": "sv-dopuni-japan", "vrsta": "dopuni", "tezina": "tesko", "pojmovi": ["japan", "koreja", "kina"], "pitanje": "Dopuni rečenice (bez ponuđenih reči).", "tekst": "Japan je sproveo reforme po uzoru na {{Zapad|zapad}}: ukinuo je feudalne odnose i modernizovao privredu i vojsku. Krajem XIX veka pretvorio je {{Koreju|Koreja}} u koloniju i pokušao da se proširi na račun {{Kine|Kina}}.", "pomoc": ["Po čijem uzoru — Istoka ili Zapada?", "Jedna susedna zemlja je postala japanska kolonija, a druga, veća, bila je meta širenja.", "Iz lekcije: reforme po uzoru na Zapad; Koreja; širenje na račun Kine."], "objasnjenje": "Japan je reformama po uzoru na Zapad postao jak i sam se širio — na Koreju i na račun Kine.", "iz_udzbenika": {"strana": 13, "odeljak": "Prostorni okviri novog veka", "tekst": "Japan se reformisao po uzoru na Zapad, krajem XIX veka pretvorio Koreju u koloniju i pokušao da se proširi na račun Kine."}, "lekcija": 1}, {"id": "sv-povezi-kolonije", "vrsta": "povezi", "tezina": "lako", "pojmovi": ["spanija", "portugalija", "velika-britanija", "japan"], "pitanje": "Poveži državu sa onim što joj se desilo sa kolonijama.", "parovi": [["Španija", "izgubila većinu kolonija u Srednjoj i Južnoj Americi"], ["Portugalija", "Brazil proglašava nezavisnost od nje"], ["Velika Britanija", "izgubila trinaest kolonija, a širila se u Indiji i Australiji"], ["Japan", "pretvorio Koreju u koloniju"]], "pomoc": ["Jedna od ovih država nije gubila, nego je stekla koloniju.", "Brazil je bio portugalski, Meksiko i Argentina španski.", "Iz lekcije: str. 12–13, prostorni okviri novog veka."], "objasnjenje": "Španija i Portugalija gube Ameriku, Britanija gubi 13 kolonija ali dobija nove, Japan postaje kolonijalna sila.", "iz_udzbenika": {"strana": 12, "odeljak": "Prostorni okviri novog veka", "tekst": "Udžbenik opisuje kako su Britanija, Španija i Portugalija gubile, a Britanija i Japan sticale kolonije."}, "lekcija": 1}, {"id": "sv-povezi-oblasti", "vrsta": "povezi", "tezina": "srednje", "pojmovi": ["sjedinjene-americke-drzave", "latinska-amerika", "afrika", "kina"], "pitanje": "Poveži oblast sveta sa onim što se u njoj dešava u XVIII i XIX veku.", "parovi": [["Severna Amerika", "trinaest kolonija se odvaja i nastaju SAD"], ["Srednja i Južna Amerika", "nastaju države od Meksika do Argentine"], ["Afrika", "sile do početka XX veka dele gotovo ceo kontinent"], ["Kina", "ostaje ogromno, ali zaostalo carstvo koje se opire strancima"], ["Indija", "Britanci istiskuju Francuze i šire kolonije"]], "pomoc": ["Krenite od Amerike — severni i južni deo su imali različite gospodare.", "Koji kontinent je bio meta „jagme”?", "Iz lekcije: str. 12–13."], "objasnjenje": "Amerika se oslobađa (SAD, Latinska Amerika), Afrika se deli, Kina se opire, a u Indiji jača Britanija.", "iz_udzbenika": {"strana": 13, "odeljak": "Prostorni okviri novog veka", "tekst": "Lekcija prati kolonije i nezavisnost na više kontinenata — u Americi, Africi i Aziji."}, "lekcija": 1}, {"id": "sv-zakljuci-britanija", "vrsta": "zakljuci", "tezina": "lako", "pojmovi": ["velika-britanija", "kolonija", "americki-rat-za-nezavisnost"], "pitanje": "Zašto je Velika Britanija posle Američkog rata za nezavisnost širila kolonije u Indiji, Kanadi i Australiji?", "odgovori": [{"tekst": "Da nadoknadi gubitak trinaest kolonija u Severnoj Americi", "tacan": true}, {"tekst": "Da bi pomogla Španiji da sačuva svoje carstvo", "tacan": false, "zasto": "Lekcija ne govori o takvoj pomoći; Britanija je nadoknađivala sopstveni gubitak."}, {"tekst": "Zato što je Berlinski kongres to odobrio", "tacan": false, "zasto": "Berlinski kongres je 1878. i tiče se Balkana."}, {"tekst": "Da bi oslobodila te zemlje", "tacan": false, "zasto": "Kolonije se osnivaju radi iskorišćavanja bogatstava, ne radi oslobađanja."}], "pomoc": ["Korak 1: Šta je Britanija izgubila krajem XVIII veka?", "Korak 2: Kako se nadoknađuje gubitak?", "Iz lekcije: gubitak je nadoknadila širenjem kolonija u Indiji, Kanadi, na Pacifiku, u Australiji i Novom Zelandu."], "objasnjenje": "Izgubivši trinaest kolonija, Britanija je nove posede tražila na drugim stranama sveta.", "iz_udzbenika": {"strana": 12, "odeljak": "Prostorni okviri novog veka", "tekst": "Gubitak trinaest kolonija Britanija je nadoknadila širenjem kolonija u Indiji, Kanadi, na Tihom okeanu, u Australiji i Novom Zelandu."}, "osa": {"naziv": "Američki rat za nezavisnost", "od": 1770, "do": 1800, "traka": "svet", "oznaka": "kraj XVIII veka"}, "lekcija": 1}, {"id": "sv-zakljuci-japan", "vrsta": "zakljuci", "tezina": "srednje", "pojmovi": ["japan", "kina", "kolonijalizam"], "pitanje": "Zašto je Japan krajem XIX veka postao kolonijalna sila, a Kina nije?", "odgovori": [{"tekst": "Japan je sproveo reforme po uzoru na Zapad i modernizovao privredu i vojsku, a Kina je ostala zaostala i opirala se zapadnim uticajima", "tacan": true}, {"tekst": "Japan nikada nije morao da otvori luke strancima", "tacan": false, "zasto": "I Japan je sredinom XIX veka bio primoran da otvori luke."}, {"tekst": "Kina je bila mnogo manja od Japana", "tacan": false, "zasto": "Kina je bila ogromno carstvo — veličina nije bila problem, nego zaostalost."}, {"tekst": "Velike sile su Kini zabranile da ima vojsku", "tacan": false, "zasto": "Lekcija to ne kaže; Kina je ostala ekonomski i vojno zaostala."}], "pomoc": ["Korak 1: Kako je svaka od njih reagovala na zapadni uticaj?", "Korak 2: Šta Japanu daje snagu da osvaja?", "Iz lekcije: Japan — reforme, modernizacija, Koreja; Kina — zaostala, protiv stranaca."], "objasnjenje": "Japan je od Zapada preuzeo modernu privredu i vojsku i postao kolonijalna sila; Kina je odbijala promene i postala meta sila.", "iz_udzbenika": {"strana": 13, "odeljak": "Prostorni okviri novog veka", "tekst": "Kina je ostala ekonomski i vojno zaostala, a Japan je reformama po uzoru na Zapad postao kolonijalna sila."}, "lekcija": 1}, {"id": "sv-zakljuci-kolonija", "vrsta": "zakljuci", "tezina": "srednje", "pojmovi": ["kolonija", "kolonijalizam", "afrika"], "pitanje": "Na osnovu definicije kolonije, šta je bio glavni cilj evropskih sila kada su delile Afriku?", "odgovori": [{"tekst": "Iskorišćavanje prirodnih bogatstava i stanovništva dalekih krajeva", "tacan": true}, {"tekst": "Širenje medicinskih otkrića u Afriku", "tacan": false, "zasto": "Lekcija o tome ne govori; kolonizacija je donela surovo iskorišćavanje."}, {"tekst": "Pomoć afričkim narodima da stvore nezavisne države", "tacan": false, "zasto": "Obrnuto — sile su podelile kontinent među sobom."}, {"tekst": "Zaštita Osmanskog carstva", "tacan": false, "zasto": "Zaštita Osmanskog carstva je deo Istočnog pitanja i nema veze sa podelom Afrike."}], "pomoc": ["Korak 1: Pročitaj definiciju — zbog čega se osniva kolonija?", "Korak 2: Šta je kolonizacija donela Africi?", "Iz lekcije: kolonija je naselje osnovano radi iskorišćavanja prirodnih bogatstava; kolonizacija je donela surovo iskorišćavanje ljudi i bogatstava."], "objasnjenje": "Kolonije su osnivane radi bogatstava; podela Afrike značila je surovo iskorišćavanje njenih ljudi i prirode.", "iz_udzbenika": {"strana": 13, "odeljak": "Prostorni okviri novog veka", "tekst": "Kolonija je posed strane sile osnovan radi iskorišćavanja prirodnih bogatstava; kolonizacija Afrike donela je surovo iskorišćavanje.", "slika": "01-osnovne-odlike-perioda-1780-1918/07-podela-afrike.jpg"}, "osa": {"naziv": "Jagma za Afrikom", "od": 1870, "do": 1910, "traka": "svet", "oznaka": "do početka XX veka"}, "lekcija": 1}, {"id": "sv-lanac-sad", "vrsta": "lanac", "tezina": "lako", "pojmovi": ["americki-rat-za-nezavisnost", "sjedinjene-americke-drzave", "velika-britanija"], "karike": ["Naseljenici u trinaest kolonija dižu pobunu protiv Britanije", "?", "Britanija širi kolonije u Indiji, Kanadi, Australiji i Novom Zelandu"], "praznina": 1, "odgovori": [{"tekst": "U Američkom ratu za nezavisnost nastaju SAD", "tacan": true}, {"tekst": "Španija gubi Meksiko", "tacan": false, "zasto": "Meksiko se odvaja od Španije, ne od Britanije; to ne objašnjava britansko širenje."}, {"tekst": "Počinje jagma za Afrikom", "tacan": false, "zasto": "Podela Afrike je krajem XIX veka, mnogo kasnije."}, {"tekst": "Japan zauzima Koreju", "tacan": false, "zasto": "To se dešava krajem XIX veka u Aziji."}], "pomoc": ["Korak 1: Kako se završila pobuna?", "Korak 2: Šta je Britanija izgubila?", "Iz lekcije: u Američkom ratu za nezavisnost nastaju SAD; Britanija gubitak nadoknađuje drugde."], "objasnjenje": "Pobuna → SAD → Britanija traži nove kolonije.", "iz_udzbenika": {"strana": 12, "odeljak": "Prostorni okviri novog veka", "tekst": "Pobuna u trinaest kolonija dovela je do nastanka SAD, a Britanija je gubitak nadoknadila drugim kolonijama."}, "osa": {"naziv": "Američki rat za nezavisnost", "od": 1770, "do": 1800, "traka": "svet", "oznaka": "kraj XVIII veka"}, "lekcija": 1}, {"id": "sv-lanac-japan", "vrsta": "lanac", "tezina": "srednje", "pojmovi": ["japan", "koreja", "kolonijalizam"], "karike": ["Sredinom XIX veka Japan je primoran da otvori luke", "?", "Japan pretvara Koreju u koloniju"], "praznina": 1, "odgovori": [{"tekst": "Japan sprovodi reforme po uzoru na Zapad — ukida feudalizam, modernizuje privredu i vojsku", "tacan": true}, {"tekst": "Japan se odriče vojske", "tacan": false, "zasto": "Bez vojske ne bi mogao da osvoji Koreju; vojsku je modernizovao."}, {"tekst": "Japan zatvara sve luke zauvek", "tacan": false, "zasto": "Luke su ostale otvorene; Japan je umesto toga učio od Zapada."}, {"tekst": "Japan postaje britanska kolonija", "tacan": false, "zasto": "Japan nije postao kolonija; postao je kolonijalna sila."}], "pomoc": ["Korak 1: Šta Japanu treba da bi mogao da osvaja?", "Korak 2: Odakle je preuzeo uzor?", "Iz lekcije: reforme po uzoru na Zapad → Japan postaje kolonijalna sila."], "objasnjenje": "Otvaranje luka → reforme po uzoru na Zapad → Japan i sam osvaja Koreju.", "iz_udzbenika": {"strana": 13, "odeljak": "Prostorni okviri novog veka", "tekst": "Posle otvaranja luka Japan je sproveo reforme po uzoru na Zapad i krajem XIX veka pretvorio Koreju u koloniju."}, "osa": {"naziv": "Japan pretvara Koreju u koloniju", "od": 1870, "do": 1900, "traka": "svet", "oznaka": "kraj XIX veka"}, "lekcija": 1}, {"id": "sv-lanac-afrika", "vrsta": "lanac", "tezina": "tesko", "pojmovi": ["afrika", "robovlasnistvo", "jagma-za-afrikom"], "karike": ["Od kraja XV veka evropski moreplovci stižu u Afriku", "Počinje trgovina crnim robljem", "Do početka XX veka sile dele gotovo ceo kontinent", "?"], "praznina": 3, "odgovori": [{"tekst": "Stanovništvo i prirodna bogatstva Afrike surovo se iskorišćavaju", "tacan": true}, {"tekst": "Afrika postaje velika sila", "tacan": false, "zasto": "Velike sile su evropske; Afrika je bila njihov plen."}, {"tekst": "U Africi nastaju države od Meksika do Argentine", "tacan": false, "zasto": "Te države su u Latinskoj Americi."}, {"tekst": "Afrika otvara luke kao Kina i Japan", "tacan": false, "zasto": "Otvaranje luka lekcija vezuje za Kinu i Japan; Afrika je podeljena."}], "pomoc": ["Korak 1: Šta je bio cilj osnivanja kolonija?", "Korak 2: Šta je to značilo za ljude u Africi?", "Iz lekcije: kolonizacija je donela surovo iskorišćavanje stanovništva i prirodnih bogatstava."], "objasnjenje": "Od trgovine robljem do podele kontinenta — Afrika je za Evropljane bila izvor bogatstva, a za Afrikance surovo iskorišćavanje.", "iz_udzbenika": {"strana": 13, "odeljak": "Prostorni okviri novog veka", "tekst": "Evropljani u Africi pokreću trgovinu robljem; do početka XX veka dele kontinent, a kolonizacija donosi surovo iskorišćavanje."}, "osa": {"naziv": "Jagma za Afrikom", "od": 1870, "do": 1910, "traka": "svet", "oznaka": "do početka XX veka"}, "lekcija": 1}, {"id": "sv-izvor-afrika", "vrsta": "izvor", "slika_u_pitanju": true, "tezina": "lako", "pojmovi": ["afrika", "jagma-za-afrikom", "velike-sile"], "izvor": {"autor": "Gravira s kraja XIX veka (opis slike)", "naslov": "Predstavnici sila raspravljaju o podeli Afrike", "tekst": "U svečanoj dvorani muškarci u odelima sede oko velikog stola, a iza njih visi velika karta. Prema potpisu, to su predstavnici evropskih sila i SAD koji krajem XIX veka raspravljaju o podeli afričkog kontinenta.", "napomena": "Odlomak je prepričan; udžbenik, str. 13."}, "pitanje": "Ko, prema ovoj slici, odlučuje o sudbini Afrike?", "odgovori": [{"tekst": "Predstavnici evropskih sila i SAD", "tacan": true}, {"tekst": "Afrički vladari", "tacan": false, "zasto": "Potpis govori samo o predstavnicima evropskih sila i SAD."}, {"tekst": "Osmanski sultan", "tacan": false, "zasto": "Osmansko carstvo nije među onima koji dele Afriku na ovoj slici."}, {"tekst": "Japanski car", "tacan": false, "zasto": "Japan se širio u Aziji; o Africi raspravljaju evropske sile i SAD."}], "pomoc": ["Pročitaj potpis — ko sedi za stolom?", "Zašto im treba velika karta?", "Iz lekcije: predstavnici evropskih sila i SAD raspravljaju o podeli Afrike krajem XIX veka."], "objasnjenje": "O Africi odlučuju predstavnici sila za stolom, daleko od nje — to je „jagma za Afrikom”.", "iz_udzbenika": {"strana": 13, "odeljak": "Prostorni okviri novog veka", "tekst": "Gravira prikazuje predstavnike evropskih sila i SAD koji krajem XIX veka raspravljaju o podeli Afrike.", "slika": "01-osnovne-odlike-perioda-1780-1918/07-podela-afrike.jpg"}, "osa": {"naziv": "Jagma za Afrikom", "od": 1870, "do": 1910, "traka": "svet", "oznaka": "do početka XX veka"}, "lekcija": 1}, {"id": "sv-izvor-kina", "vrsta": "izvor", "tezina": "srednje", "pojmovi": ["kina", "velike-sile", "kolonija"], "izvor": {"autor": "Francuska karikatura, 1898.", "naslov": "Kina – kolač kraljeva i careva (opis karikature)", "tekst": "Iza stola kineski mandarin, visoki državni službenik, očajno diže ruke. Pred njim kraljica Viktorija, car Vilhelm II, car Nikolaj II, Marijana kao simbol Francuske i japanski samuraj nožem seku pitu na kojoj piše „Kina”.", "napomena": "Odlomak je prepričan; udžbenik, str. 13."}, "pitanje": "Šta rade predstavnici velikih sila Kini, prema karikaturi?", "odgovori": [{"tekst": "Dele je među sobom kao kolač, na svoje interesne zone", "tacan": true}, {"tekst": "Pomažu joj da se modernizuje", "tacan": false, "zasto": "Nož i pita pokazuju deljenje plena, ne pomoć; mandarin je očajan."}, {"tekst": "Brane je od Japana", "tacan": false, "zasto": "Japanski samuraj i sam seče kolač zajedno sa ostalima."}, {"tekst": "Slave sa Kinom zajednički praznik", "tacan": false, "zasto": "Mandarin očajno diže ruke — Kina je žrtva, ne domaćin slavlja."}], "pomoc": ["Šta se radi sa kolačem?", "Kako se oseća kineski mandarin?", "Iz lekcije: vladari sila seku Kinu kao kolač — dele je među sobom."], "objasnjenje": "Karikatura prikazuje Kinu kao kolač koji vladari velikih sila i Japan seku i dele, a Kina je bespomoćna.", "iz_udzbenika": {"strana": 13, "odeljak": "Prostorni okviri novog veka", "tekst": "Francuska karikatura iz 1898. prikazuje vladare velikih sila i japanskog samuraja kako dele Kinu, dok mandarin bespomoćno gleda.", "slika": "01-osnovne-odlike-perioda-1780-1918/08-karikatura-kina-kolac.jpg"}, "osa": {"naziv": "Karikatura „Kina – kolač kraljeva i careva”", "od": 1898, "traka": "svet"}, "lekcija": 1}, {"id": "sv-izvor-samuraj", "vrsta": "izvor", "tezina": "tesko", "pojmovi": ["japan", "kolonijalizam", "kina"], "izvor": {"autor": "Francuska karikatura, 1898.", "naslov": "Kina – kolač kraljeva i careva (opis karikature)", "tekst": "Kinu kao pitu seku, sleva nadesno, britanska kraljica Viktorija, nemački car Vilhelm II, ruski car Nikolaj II, Marijana kao simbol Francuske — i japanski samuraj.", "napomena": "Odlomak je prepričan; udžbenik, str. 13."}, "pitanje": "Šta nam prisustvo japanskog samuraja među evropskim vladarima govori o Japanu krajem XIX veka?", "odgovori": [{"tekst": "Da je Japan i sam postao kolonijalna sila koja se širi na račun Kine", "tacan": true}, {"tekst": "Da je Japan bio evropska država", "tacan": false, "zasto": "Japan je azijska država; za stolom je jer se ponaša kao velike sile."}, {"tekst": "Da Japan štiti Kinu od Evropljana", "tacan": false, "zasto": "Samuraj seče kolač zajedno sa ostalima — ne štiti Kinu."}, {"tekst": "Da je Japan bio kolonija Velike Britanije", "tacan": false, "zasto": "Japan nije bio kolonija; karikatura ga prikazuje kao ravnopravnog sa silama."}], "pomoc": ["Šta samuraj radi — brani ili seče?", "Šta je Japan uradio sa Korejom?", "Iz lekcije: Japan je pretvorio Koreju u koloniju i pokušao da se proširi na račun Kine."], "objasnjenje": "Samuraj za stolom pokazuje da je Japan posle reformi postao kolonijalna sila i učestvovao u deljenju Kine.", "iz_udzbenika": {"strana": 13, "odeljak": "Prostorni okviri novog veka", "tekst": "Na karikaturi Kinu dele vladari Britanije, Nemačke, Rusije, Francuske i japanski samuraj.", "slika": "01-osnovne-odlike-perioda-1780-1918/08-karikatura-kina-kolac.jpg"}, "osa": {"naziv": "Karikatura „Kina – kolač kraljeva i careva”", "od": 1898, "traka": "svet"}, "lekcija": 1}, {"id": "sv-uporedi-kina-japan", "vrsta": "uporedi", "tezina": "srednje", "pojmovi": ["kina", "japan"], "a": "Kina", "b": "Japan", "pitanje": "Na koju državu se odnosi tvrdnja — A, B, obe ili nijednu?", "tvrdnje": [{"tekst": "Do početka XIX veka opirala se većem uticaju evropskih sila.", "odgovor": "oba", "zasto": "Obe države su se opirale evropskom uticaju."}, {"tekst": "Sredinom XIX veka morala je da otvori luke.", "odgovor": "oba", "zasto": "I Kina i Japan su bili primorani da otvore luke evropskim silama i SAD."}, {"tekst": "Sprovela je reforme po uzoru na Zapad.", "odgovor": "b", "zasto": "Japan se reformisao; Kina se opirala zapadnim uticajima."}, {"tekst": "Ostala je ogromno, ali ekonomski i vojno zaostalo carstvo.", "odgovor": "a", "zasto": "To je opis Kine."}, {"tekst": "Pretvorila je Koreju u koloniju.", "odgovor": "b", "zasto": "Koreju je u koloniju pretvorio Japan."}, {"tekst": "Proglasila je nezavisnost od Portugalije.", "odgovor": "nijedan", "zasto": "To je uradio Brazil."}], "pomoc": ["Do sredine XIX veka imaju istu sudbinu.", "Posle otvaranja luka idu različitim putem.", "Iz lekcije: Kina — zaostala, protiv stranaca; Japan — reforme, Koreja."], "objasnjenje": "Kina i Japan su do sredine XIX veka slični, a onda se razilaze — Japan se modernizuje i osvaja, Kina zaostaje.", "iz_udzbenika": {"strana": 13, "odeljak": "Prostorni okviri novog veka", "tekst": "Kina i Japan su otvorili luke sredinom XIX veka; Kina je ostala zaostala, a Japan se reformisao."}, "lekcija": 1}, {"id": "sv-uporedi-spanija-britanija", "vrsta": "uporedi", "tezina": "tesko", "pojmovi": ["spanija", "velika-britanija", "kolonija", "velike-sile"], "a": "Španija", "b": "Velika Britanija", "pitanje": "Na koju državu se odnosi tvrdnja — A, B, obe ili nijednu?", "tvrdnje": [{"tekst": "Izgubila je kolonije u Americi.", "odgovor": "oba", "zasto": "Britanija je izgubila trinaest kolonija, a Španija većinu kolonija u Srednjoj i Južnoj Americi."}, {"tekst": "Gubitak je nadoknadila u Indiji, Kanadi i Australiji.", "odgovor": "b", "zasto": "To je britanski put; Španija nije nadoknadila gubitak."}, {"tekst": "Od njenih kolonija nastale su države od Meksika do Argentine.", "odgovor": "a", "zasto": "To su bivše španske kolonije."}, {"tekst": "Početkom XVI veka stvorila je veliko carstvo u Americi.", "odgovor": "a", "zasto": "Špansko carstvo u Srednjoj i Južnoj Americi nastaje početkom XVI veka."}, {"tekst": "Krajem XIX veka bila je velika sila.", "odgovor": "b", "zasto": "Britanija je među šest velikih sila; Španija nije."}, {"tekst": "Brazil je proglasio nezavisnost od nje.", "odgovor": "nijedan", "zasto": "Brazil se odvojio od Portugalije."}], "pomoc": ["Obe su izgubile deo Amerike, ali je samo jedna našla zamenu.", "Koja je na spisku velikih sila?", "Iz lekcije: str. 12 — Britanija i Španija posle gubitka kolonija."], "objasnjenje": "Obe gube Ameriku; Britanija nadoknađuje gubitak i ostaje velika sila, Španija gubi carstvo.", "iz_udzbenika": {"strana": 12, "odeljak": "Prostorni okviri novog veka", "tekst": "Britanija gubi trinaest kolonija ali se širi drugde; Španija gubi većinu kolonija i od njih nastaju latinoameričke države."}, "lekcija": 1}, {"id": "sv-objasni-kolonija", "vrsta": "objasni", "tezina": "lako", "pojmovi": ["kolonija", "kolonijalizam"], "pitanje": "Šta je kolonija i zašto su evropske sile osnivale kolonije? Objasni svojim rečima.", "uzor": "Kolonija je posed neke strane sile u dalekim, prekomorskim krajevima. Sile su ih osnivale da bi iskorišćavale prirodna bogatstva tih krajeva, ali i njihovo stanovništvo. Krajem XIX veka velike sile su se nadmetale za nove kolonije.", "ideje": ["Kolonija je posed strane sile daleko, preko mora.", "Cilj je iskorišćavanje prirodnih bogatstava.", "Iskorišćavano je i stanovništvo."], "objasnjenje": "Kolonija je prekomorski posed osnovan radi bogatstava; zato su se sile za njih takmičile.", "iz_udzbenika": {"strana": 12, "odeljak": "Definicije", "tekst": "Kolonija je posed strane sile u prekomorskim krajevima, naselje osnovano radi iskorišćavanja prirodnih bogatstava."}, "lekcija": 1}, {"id": "sv-objasni-kina-kolac", "vrsta": "objasni", "tezina": "srednje", "pojmovi": ["kina", "velike-sile", "japan"], "pitanje": "Opiši karikaturu „Kina – kolač kraljeva i careva” (1898) i objasni njen naziv.", "uzor": "Na karikaturi kraljica Viktorija, car Vilhelm II, car Nikolaj II, Marijana kao simbol Francuske i japanski samuraj nožem seku pitu na kojoj piše Kina, a kineski mandarin očajno diže ruke. Naziv znači da je Kina za kraljeve i careve velikih sila kolač koji dele među sobom, na interesne zone ili kolonije, a Kina ne može da se odupre.", "ideje": ["Vladari velikih sila (i Japan) seku Kinu kao kolač.", "Kineski mandarin je bespomoćan i očajan.", "Naziv znači da sile dele Kinu među sobom."], "objasnjenje": "Karikatura ismeva sile koje dele Kinu kao plen.", "iz_udzbenika": {"strana": 13, "odeljak": "Prostorni okviri novog veka", "tekst": "Udžbenik traži da se karikatura opiše, kaže šta sile rade Kini i objasni njen naziv.", "slika": "01-osnovne-odlike-perioda-1780-1918/08-karikatura-kina-kolac.jpg"}, "osa": {"naziv": "Karikatura „Kina – kolač kraljeva i careva”", "od": 1898, "traka": "svet"}, "lekcija": 1}, {"id": "sv-objasni-japan", "vrsta": "objasni", "tezina": "tesko", "pojmovi": ["japan", "kina", "kolonijalizam"], "pitanje": "Kina i Japan su sredinom XIX veka imali sličnu sudbinu, a krajem veka jedna je bila plen, a druga osvajač. Objasni kako je do toga došlo.", "uzor": "Obe zemlje su se dugo opirale evropskom uticaju i obe su sredinom XIX veka bile primorane da otvore luke evropskim silama i SAD. Japan je zatim sproveo reforme po uzoru na Zapad — ukinuo feudalne odnose i modernizovao privredu i vojsku — pa je postao dovoljno jak da Koreju pretvori u koloniju i da se širi na račun Kine. Kina se opirala zapadnim uticajima i ostala ekonomski i vojno zaostala, pa su je velike sile delile.", "ideje": ["Obe su bile primorane da otvore luke.", "Japan se reformisao po uzoru na Zapad.", "Japan postaje kolonijalna sila (Koreja).", "Kina ostaje zaostala i postaje meta sila."], "objasnjenje": "Razlika je u odgovoru na Zapad — Japan je preuzeo modernizaciju, Kina ju je odbijala.", "iz_udzbenika": {"strana": 13, "odeljak": "Prostorni okviri novog veka", "tekst": "Kina je ostala zaostalo carstvo, a Japan je reformama postao kolonijalna sila."}, "lekcija": 1}]}, {"naslov": "Osmansko carstvo i Istočno pitanje", "zadaci": [{"id": "ip-izbor-definicija", "vrsta": "izbor", "tezina": "lako", "pojmovi": ["istocno-pitanje", "osmansko-carstvo"], "pitanje": "Šta je Istočno pitanje?", "odgovori": [{"tekst": "Pitanje opstanka Osmanskog carstva na Balkanu i Bliskom istoku", "tacan": true}, {"tekst": "Pitanje podele Kine među velikim silama", "tacan": false, "zasto": "Podelu Kine prikazuje karikatura „Kina – kolač”; Istočno pitanje se tiče Osmanskog carstva."}, {"tekst": "Pitanje nezavisnosti trinaest kolonija", "tacan": false, "zasto": "To je rešeno u Američkom ratu za nezavisnost, krajem XVIII veka."}, {"tekst": "Pitanje otvaranja japanskih luka", "tacan": false, "zasto": "Otvaranje luka u Japanu i Kini nije deo Istočnog pitanja."}], "pomoc": ["„Istok” je ovde Balkan i Bliski istok.", "Koje carstvo je tamo vladalo i slabilo?", "Iz lekcije: Istočno pitanje = pitanje opstanka Osmanskog carstva."], "objasnjenje": "Istočno pitanje je diplomatski naziv za problem opstanka Osmanskog carstva.", "iz_udzbenika": {"strana": 13, "odeljak": "Definicije", "tekst": "Istočno pitanje je pitanje opstanka Osmanskog carstva na Balkanu i na Bliskom istoku."}, "lekcija": 1}, {"id": "ip-izbor-oblasti", "vrsta": "izbor", "tezina": "srednje", "pojmovi": ["osmansko-carstvo", "balkansko-poluostrvo"], "pitanje": "Kojim oblastima je Osmansko carstvo i dalje vladalo krajem XVIII veka? (Više tačnih.)", "odgovori": [{"tekst": "Većim delom Balkanskog poluostrva", "tacan": true}, {"tekst": "Bliskim istokom", "tacan": true}, {"tekst": "Severnom Afrikom", "tacan": true}, {"tekst": "Indijom", "tacan": false, "zasto": "U Indiji su se borili Britanci i Francuzi; tamo nije bilo osmanske vlasti."}, {"tekst": "Korejom", "tacan": false, "zasto": "Koreja je krajem XIX veka postala japanska kolonija."}], "pomoc": ["Tri oblasti oko istočnog Sredozemlja.", "Jedna je u Evropi, jedna u Aziji, jedna u Africi.", "Iz lekcije: veći deo Balkana, Bliski istok i severna Afrika."], "objasnjenje": "Krajem XVIII veka Osmansko carstvo i dalje drži veći deo Balkana, Bliski istok i severnu Afriku.", "iz_udzbenika": {"strana": 13, "odeljak": "Prostorni okviri novog veka", "tekst": "Osmansko carstvo krajem XVIII veka i dalje vlada većim delom Balkanskog poluostrva, Bliskog istoka i severne Afrike."}, "lekcija": 1}, {"id": "ip-izbor-zasto-odrzati", "vrsta": "izbor", "tezina": "srednje", "pojmovi": ["francuska", "velika-britanija", "osmansko-carstvo"], "pitanje": "Zašto su Francuska i Velika Britanija nastojale da održe Osmansko carstvo?", "odgovori": [{"tekst": "Zbog svojih trgovačkih i političkih interesa", "tacan": true}, {"tekst": "Zato što su želele da balkanski narodi ostanu bez države zbog vere", "tacan": false, "zasto": "Lekcija ne navodi veru; razlog su trgovački i politički interesi."}, {"tekst": "Zato što su bile saveznice Japana", "tacan": false, "zasto": "Japan nema veze sa Istočnim pitanjem u ovoj lekciji."}, {"tekst": "Zato što su želele same da osvoje Balkan", "tacan": false, "zasto": "Za osmanske teritorije na Balkanu bile su zainteresovane Rusija i Habzburška monarhija."}], "pomoc": ["Ove dve sile žive od trgovine i kolonija.", "Kome bi pripao Balkan da carstvo propadne — i da li bi to odgovaralo Britaniji?", "Iz lekcije: Francuska i V. Britanija nastoje da ga održe zbog trgovačkih i političkih interesa."], "objasnjenje": "Francuskoj i Britaniji je opstanak Osmanskog carstva odgovarao zbog trgovine i politike — da Balkan ne pripadne suparnicima.", "iz_udzbenika": {"strana": 13, "odeljak": "Prostorni okviri novog veka", "tekst": "Francuska i Velika Britanija nastoje da održe Osmansko carstvo zbog svojih trgovačkih i političkih interesa."}, "lekcija": 1}, {"id": "ip-tn-interesi", "vrsta": "tacno_netacno", "tezina": "lako", "pojmovi": ["habzburska-monarhija", "rusija", "osmansko-carstvo"], "tvrdnja": "Habzburška monarhija i Rusija bile su zainteresovane za osmanske teritorije na Balkanu.", "tacno": true, "pomoc": ["Koje velike sile su susedi Balkana?", "Jedna sa severa, jedna sa severoistoka.", "Iz lekcije: Habzburška monarhija i Rusija zainteresovane su za osmanske teritorije na Balkanu."], "objasnjenje": "Tačno — susedne sile, Habzburška monarhija i Rusija, želele su osmanske teritorije na Balkanu.", "iz_udzbenika": {"strana": 13, "odeljak": "Prostorni okviri novog veka", "tekst": "Habzburška monarhija i Rusija zainteresovane su za osmanske teritorije na Balkanu."}, "lekcija": 1}, {"id": "ip-dopuni", "vrsta": "dopuni", "tezina": "srednje", "pojmovi": ["istocno-pitanje", "rusija", "habzburska-monarhija", "francuska"], "pitanje": "Dopuni rečenice o Istočnom pitanju.", "tekst": "Za osmanske teritorije na Balkanu zanimale su se {{Rusija}} i Habzburška monarhija, dok su {{Francuska}} i Velika Britanija nastojale da carstvo održe. Balkanski narodi su težili {{oslobođenju}} i stvaranju nezavisnih država. Problem opstanka carstva u diplomatiji se zvao {{Istočno pitanje}}.", "ponudjene": ["Rusija", "Francuska", "Italija", "oslobođenju", "ujedinjenju sa Turskom", "Istočno pitanje", "jagma za Afrikom"], "pomoc": ["Jedna sila je istočno, druga zapadno.", "Šta žele narodi pod tuđom vlašću?", "Iz lekcije: Rusija i Habzburgovci — teritorije; Francuska i Britanija — održati carstvo; balkanski narodi — oslobođenje."], "objasnjenje": "Tri strane — sile koje žele teritorije, sile koje žele da održe carstvo i narodi koji žele slobodu — čine Istočno pitanje.", "iz_udzbenika": {"strana": 13, "odeljak": "Prostorni okviri novog veka", "tekst": "Rusija i Habzburška monarhija žele osmanske teritorije, Francuska i Britanija carstvo održavaju, a balkanski narodi teže oslobođenju."}, "lekcija": 1}, {"id": "ip-povezi-strane", "vrsta": "povezi", "tezina": "lako", "pojmovi": ["istocno-pitanje", "rusija", "francuska", "balkansko-poluostrvo"], "pitanje": "Poveži učesnika Istočnog pitanja sa onim što želi.", "parovi": [["Rusija i Habzburška monarhija", "osmanske teritorije na Balkanu"], ["Francuska i Velika Britanija", "da se Osmansko carstvo održi"], ["balkanski narodi", "oslobođenje i nezavisne države"]], "pomoc": ["Ko živi pod osmanskom vlašću?", "Ko ima trgovačke interese?", "Iz lekcije: str. 13 — tri strane Istočnog pitanja."], "objasnjenje": "Jedni hoće teritorije, drugi opstanak carstva, treći slobodu.", "iz_udzbenika": {"strana": 13, "odeljak": "Prostorni okviri novog veka", "tekst": "Udžbenik opisuje suprotstavljene interese sila i balkanskih naroda prema Osmanskom carstvu."}, "lekcija": 1}, {"id": "ip-zakljuci-narodi", "vrsta": "zakljuci", "tezina": "lako", "pojmovi": ["balkansko-poluostrvo", "osmansko-carstvo"], "pitanje": "Zašto su balkanski narodi bili protiv održavanja Osmanskog carstva?", "odgovori": [{"tekst": "Težili su oslobođenju od turske vlasti i stvaranju svojih nezavisnih država", "tacan": true}, {"tekst": "Želeli su da postanu britanske kolonije", "tacan": false, "zasto": "Težili su nezavisnosti, ne novoj tuđoj vlasti."}, {"tekst": "Želeli su da se Osmansko carstvo proširi na Afriku", "tacan": false, "zasto": "Carstvo je već vladalo severnom Afrikom; narodi su želeli slobodu."}, {"tekst": "Bili su zadovoljni turskom vlašću", "tacan": false, "zasto": "Da su bili zadovoljni, ne bi težili oslobođenju."}], "pomoc": ["Korak 1: Pod čijom vlašću su živeli?", "Korak 2: Šta želi narod pod tuđom vlašću?", "Iz lekcije: balkanski narodi teže oslobođenju od turske vlasti i stvaranju nezavisnih država."], "objasnjenje": "Balkanski narodi su želeli svoje države, pa im opstanak Osmanskog carstva nije odgovarao.", "iz_udzbenika": {"strana": 13, "odeljak": "Prostorni okviri novog veka", "tekst": "Balkanski narodi teže oslobođenju od turske vlasti i stvaranju nezavisnih država."}, "lekcija": 1}, {"id": "ip-zakljuci-tesko", "vrsta": "zakljuci", "tezina": "tesko", "pojmovi": ["istocno-pitanje", "velike-sile"], "pitanje": "Zašto se opstanak Osmanskog carstva u diplomatiji zvao „pitanje” — nešto što se dugo nije moglo rešiti?", "odgovori": [{"tekst": "Zato što su se interesi velikih sila i balkanskih naroda sudarali, pa nijedno rešenje nije odgovaralo svima", "tacan": true}, {"tekst": "Zato što niko nije znao gde se carstvo nalazi", "tacan": false, "zasto": "Carstvo je bilo poznato — vladalo je Balkanom, Bliskim istokom i severnom Afrikom."}, {"tekst": "Zato što su sve sile želele isto", "tacan": false, "zasto": "Upravo suprotno — jedne su htele teritorije, druge opstanak carstva."}, {"tekst": "Zato što je Osmansko carstvo bilo velika sila", "tacan": false, "zasto": "Nije bilo među šest velikih sila; slabilo je."}], "pomoc": ["Korak 1: Šta žele Rusija i Habzburgovci, a šta Francuska i Britanija?", "Korak 2: Šta žele balkanski narodi? Može li se svima udovoljiti?", "Iz lekcije: problem opstanka Osmanskog carstva u diplomatiji se zove Istočno pitanje."], "objasnjenje": "Svaka strana je htela nešto drugo, pa je opstanak carstva ostao otvoreno „pitanje” diplomatije.", "iz_udzbenika": {"strana": 13, "odeljak": "Prostorni okviri novog veka", "tekst": "Suprotstavljeni interesi sila i težnje balkanskih naroda čine problem opstanka Osmanskog carstva — Istočno pitanje."}, "lekcija": 1}, {"id": "ip-lanac", "vrsta": "lanac", "tezina": "srednje", "pojmovi": ["istocno-pitanje", "osmansko-carstvo"], "karike": ["Rusija i Habzburška monarhija žele osmanske teritorije na Balkanu", "Francuska i Britanija žele da održe Osmansko carstvo", "Balkanski narodi teže oslobođenju", "?"], "praznina": 3, "odgovori": [{"tekst": "Opstanak Osmanskog carstva postaje Istočno pitanje", "tacan": true}, {"tekst": "Počinje jagma za Afrikom", "tacan": false, "zasto": "Jagma za Afrikom je trka za afričke kolonije, ne problem Osmanskog carstva."}, {"tekst": "Nastaju SAD", "tacan": false, "zasto": "SAD nastaju u Američkom ratu za nezavisnost, daleko od Balkana."}, {"tekst": "Osmansko carstvo postaje velika sila", "tacan": false, "zasto": "Ono slabi; o njegovom opstanku se raspravlja."}], "pomoc": ["Korak 1: Tri strane žele tri različite stvari.", "Korak 2: Kako diplomatija zove taj problem?", "Iz lekcije: problem opstanka Osmanskog carstva = Istočno pitanje."], "objasnjenje": "Sukob interesa oko Osmanskog carstva naziva se Istočno pitanje.", "iz_udzbenika": {"strana": 13, "odeljak": "Prostorni okviri novog veka", "tekst": "Interesi sila i težnje balkanskih naroda oko Osmanskog carstva čine Istočno pitanje."}, "lekcija": 1}, {"id": "ip-uporedi", "vrsta": "uporedi", "tezina": "srednje", "pojmovi": ["istocno-pitanje", "rusija", "habzburska-monarhija", "francuska", "velika-britanija"], "a": "Rusija i Habzburška monarhija", "b": "Francuska i Velika Britanija", "pitanje": "Na koju grupu se odnosi tvrdnja — A, B, obe ili nijednu?", "tvrdnje": [{"tekst": "Zainteresovane su za osmanske teritorije na Balkanu.", "odgovor": "a", "zasto": "To su sile susedne Balkanu."}, {"tekst": "Nastoje da održe Osmansko carstvo.", "odgovor": "b", "zasto": "Francuska i Britanija ga održavaju zbog trgovačkih i političkih interesa."}, {"tekst": "Ubrajaju se u velike sile.", "odgovor": "oba", "zasto": "Sve četiri su među šest velikih sila."}, {"tekst": "Teže stvaranju sopstvenih nezavisnih država na Balkanu.", "odgovor": "nijedan", "zasto": "To je težnja balkanskih naroda."}, {"tekst": "Njihova volja je ključna za Istočno pitanje.", "odgovor": "oba", "zasto": "Upravo sukob ove dve grupe sila čini Istočno pitanje teško rešivim."}], "pomoc": ["Jedna grupa želi, druga brani.", "Ko sve od njih je velika sila?", "Iz lekcije: Rusija i Habzburgovci — teritorije; Francuska i Britanija — održavanje carstva."], "objasnjenje": "Dve grupe velikih sila imale su suprotne ciljeve; balkanski narodi su treća strana.", "iz_udzbenika": {"strana": 13, "odeljak": "Prostorni okviri novog veka", "tekst": "Habzburška monarhija i Rusija žele osmanske teritorije, a Francuska i Britanija nastoje da održe carstvo."}, "lekcija": 1}, {"id": "ip-objasni", "vrsta": "objasni", "tezina": "srednje", "pojmovi": ["istocno-pitanje", "osmansko-carstvo", "balkansko-poluostrvo"], "pitanje": "Objasni svojim rečima šta je Istočno pitanje i ko je u njemu šta želeo.", "uzor": "Istočno pitanje je pitanje opstanka Osmanskog carstva na Balkanu i Bliskom istoku. Rusija i Habzburška monarhija želele su osmanske teritorije na Balkanu, a Francuska i Velika Britanija su nastojale da carstvo održe zbog trgovačkih i političkih interesa. Balkanski narodi su težili oslobođenju i stvaranju nezavisnih država.", "ideje": ["Pitanje opstanka Osmanskog carstva.", "Rusija i Habzburška monarhija žele njegove teritorije.", "Francuska i Britanija žele da ga održe.", "Balkanski narodi žele oslobođenje."], "objasnjenje": "Istočno pitanje je čvor suprotstavljenih interesa oko slabog Osmanskog carstva.
