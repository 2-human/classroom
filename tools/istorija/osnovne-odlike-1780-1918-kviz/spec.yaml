# Osnovne odlike perioda 1780–1918 — kviz po lekciji (tip: lesson-quiz; vidi templates/lesson-quiz/README.md).
# Pitanja su napisana sopstvenim rečima na osnovu lekcije „1.1. Osnovne odlike perioda 1780–1918.”
# (istorija, 7. razred, str. 10–14; str. 15 nije snimljena). Težište je na razumevanju: zašto, šta je
# iz čega proisteklo, kako to znamo iz izvora — ne na pamćenju.
title: Osnovne odlike perioda 1780–1918 — kviz
title_short: Osnovne odlike 1780–1918
locale: sr
nivo: osnovna
razred: 7
banka_lekcije: [1]
description: >-
  Kviz za lekciju Osnovne odlike perioda 1780–1918: novi vek i njegove granice, industrijska
  revolucija, napredak tehnike i medicine, društvo i velike sile, kolonije na drugim kontinentima,
  Istočno pitanje i srpski narod — uzroci i posledice, izvori (karte, karikature, slike), poređenja,
  vremenska osa i objašnjavanje svojim rečima.

# Vremenska osa lekcije. Događaji koje udžbenik datira samo vekom („krajem XVIII veka”) stoje na osi
# kao raspon tog dela veka, uvek sa istim nazivom i godinama.
osa:
  od: 1480
  do: 1920
  trake:
