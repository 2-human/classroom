          - Ko je postojao krajem XVIII veka, pre fabrika?
          - "Iz lekcije: seljaštvo najbrojnije; radništvo — novina XIX veka."
        objasnjenje: Seljaštvo je stari, najbrojniji sloj; radništvo je novi gradski sloj nastao sa fabrikama.
        iz_udzbenika:
          strana: 12
          odeljak: Društvo
          tekst: Seljaštvo je najbrojniji sloj, a radništvo je gradski sloj koji živi od rada u fabrikama, važna novina XIX veka.

      - id: dr-objasni-radnistvo
        vrsta: objasni
        tezina: srednje
        pojmovi: [radnistvo, industrija]
        pitanje: Ko su bili radnici u XIX veku i zašto su se borili za svoja prava? Objasni svojim rečima.
        uzor: Radništvo je novi gradski sloj koji je nastao sa fabrikama i živi od svog rada u njima. Život i rad u prvim fabrikama bili su veoma teški, pa su radnici počeli da se bore za svoja prava, na primer demonstracijama kao u Londonu sredinom XIX veka. Ta borba je trajala dugo i nastavila se u XX veku.
        ideje:
          - Radništvo živi od rada u fabrikama, u gradu.
          - Nastalo je kao nov sloj u XIX veku.
          - Uslovi rada i života bili su veoma teški.
          - Borba za prava trajala je dugo, i u XX veku.
        objasnjenje: Radništvo je dete industrije, a njegova borba — posledica teških uslova u prvim fabrikama.
        iz_udzbenika:
          strana: 12
          odeljak: Društvo
          tekst: Radništvo je gradski sloj koji živi od rada u fabrikama; borba za radnička prava trajala je dugo.
          slika: 01-osnovne-odlike-perioda-1780-1918/05-radnicke-demonstracije-london.jpg

      - id: dr-objasni-klackalica
        vrsta: objasni
        tezina: tesko
        pojmovi: [velike-sile, kina]
        pitanje: Opiši karikaturu „Klackalica nacija” (1898) i objasni šta poručuje o odnosima velikih sila.
        uzor: Na klackalici sede velike sile — na jednoj strani Velika Britanija i SAD, na drugoj Rusija, Nemačka i Francuska, a Kina visi na kraju daske. Strana Britanije i SAD je pretegla, pa su one prikazane kao najmoćnije. „Istorija” pokušava da održi ravnotežu, ali klackalica stoji na topu, što znači da odnos sila počiva na vojnoj sili i pretnji ratom.
        ideje:
          - Dve grupe sila na dve strane klackalice.
          - V. Britanija i SAD su pretegle — najmoćnije su.
          - Top u središtu = ravnoteža počiva na vojnoj sili.
          - Kina visi na kraju daske — ona je predmet nadmetanja sila.
        objasnjenje: Karikatura prikazuje rivalstvo velikih sila kao krhku ravnotežu koju drži oružje.
        iz_udzbenika:
          strana: 12
          odeljak: Velike sile
          tekst: Udžbenik pita koje su države predstavljene kao najmoćnije i šta znači top na karikaturi.
          slika: 01-osnovne-odlike-perioda-1780-1918/06-karikatura-klackalica-nacija.jpg
        osa: {naziv: "Karikatura „Klackalica nacija”", od: 1898, traka: svet}

  - naslov: Evropa i drugi kontinenti
