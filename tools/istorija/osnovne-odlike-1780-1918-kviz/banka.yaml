      - id: dr-izvor-klackalica
        vrsta: izvor
        tezina: lako
        pojmovi: [velike-sile, velika-britanija, sjedinjene-americke-drzave]
        izvor:
          autor: Američki satirični časopis, 1898.
          naslov: Klackalica nacija (opis karikature)
          tekst: Na jednom kraju daske su Velika Britanija i SAD, na drugom Rusija, Nemačka i Francuska, a Kina visi na kraju daske. Ženska figura „Istorija” pokušava da održi ravnotežu. U središtu klackalice je top. Strana Britanije i SAD je pretegla.
          napomena: "Odlomak je prepričan; udžbenik, str. 12."
        pitanje: Koje države karikatura prikazuje kao najmoćnije?
        odgovori:
          - {tekst: "Veliku Britaniju i SAD", tacan: true}
          - {tekst: "Rusiju, Nemačku i Francusku", tacan: false, zasto: "One su na drugoj strani daske, koja je lakša."}
          - {tekst: "Kinu", tacan: false, zasto: "Kina samo visi na kraju daske — ona nije igrač, nego je predmet nadmetanja."}
          - {tekst: "Sve države su prikazane kao jednako jake", tacan: false, zasto: "Klackalica nije u ravnoteži — jedna strana je pretegla."}
        pomoc:
          - Na klackalici je jača strana ona koja je pretegla.
          - Ko sedi na težoj strani?
          - "Iz lekcije: kao najmoćnije prikazane su V. Britanija i SAD."
        objasnjenje: Strana Velike Britanije i SAD je pretegla — karikaturista ih vidi kao najmoćnije.
        iz_udzbenika:
          strana: 12
          odeljak: Velike sile
          tekst: Karikatura „Klackalica nacija” iz američkog časopisa (1898) prikazuje borbu velikih sila za prevlast u svetu.
          slika: 01-osnovne-odlike-perioda-1780-1918/06-karikatura-klackalica-nacija.jpg
        osa: {naziv: "Karikatura „Klackalica nacija”", od: 1898, traka: svet}

      - id: dr-izvor-top
        vrsta: izvor
        tezina: tesko
        pojmovi: [velike-sile]
        izvor:
          autor: Američki satirični časopis, 1898.
          naslov: Klackalica nacija (opis karikature)
          tekst: Velike sile sede na dve strane klackalice, a „Istorija” pokušava da ih održi u ravnoteži. Klackalica se oslanja na top postavljen u njenom središtu.
          napomena: "Odlomak je prepričan; udžbenik, str. 12."
        pitanje: Šta karikaturista poručuje time što je klackalica postavljena na top?
        odgovori:
          - {tekst: "Da ravnoteža među velikim silama počiva na vojnoj sili i pretnji ratom", tacan: true}
          - {tekst: "Da su velike sile odustale od oružja", tacan: false, zasto: "Top u središtu znači suprotno — oružje drži ceo odnos."}
          - {tekst: "Da je top Kinin, pa je Kina najjača", tacan: false, zasto: "Kina visi na kraju daske i nema moć; top predstavlja vojnu silu na kojoj počiva odnos sila."}
          - {tekst: "Da se sile takmiče samo u trgovini", tacan: false, zasto: "Top nije simbol trgovine nego vojne snage."}
        pomoc:
          - Šta je top — alat za trgovinu ili oružje?
          - Na čemu se oslanja cela klackalica?
          - "Iz lekcije: velike sile su volju nametale i vojnom snagom; odnos sila počiva na oružju."
        objasnjenje: Top u središtu govori da odnos velikih sila drži vojna sila — ravnoteža može da se prekine ratom.
        iz_udzbenika:
          strana: 12
          odeljak: Velike sile
          tekst: Udžbenik uz karikaturu traži da se objasni simbolika topa u središtu klackalice.
          slika: 01-osnovne-odlike-perioda-1780-1918/06-karikatura-klackalica-nacija.jpg
        osa: {naziv: "Karikatura „Klackalica nacija”", od: 1898, traka: svet}

      - id: dr-uporedi-plemstvo-gradjanstvo
        vrsta: uporedi
        tezina: srednje
        pojmovi: [plemstvo, gradjanstvo, francuska-revolucija]
        a: Plemstvo
        b: Građanstvo
        pitanje: Na koji sloj se odnosi tvrdnja — A, B, oba ili nijedan?
        tvrdnje:
          - {tekst: "Imalo je prevlast još od srednjeg veka.", odgovor: a, zasto: "Plemstvo (uz sveštenstvo) je imalo prevlast od srednjeg veka."}
          - {tekst: "Jača zbog privrednih promena.", odgovor: b, zasto: "Privredne promene jačaju ulogu građanstva."}
          - {tekst: "Gubi prevlast u prvoj polovini XIX veka.", odgovor: a, zasto: "Ukidanjem feudalizma plemstvo gubi prevlast."}
          - {tekst: "Njegovo nezadovoljstvo doprinelo je Francuskoj revoluciji.", odgovor: b, zasto: "Do revolucije je dovelo nezadovoljstvo seljaštva i građanstva."}
          - {tekst: "Bilo je najbrojniji sloj.", odgovor: nijedan, zasto: "Najbrojnije je bilo seljaštvo."}
        pomoc:
          - Jedan sloj je stari, povlašćeni; drugi je u usponu.
          - Ko je bio nezadovoljan starim poretkom?
          - "Iz lekcije: plemstvo gubi prevlast; građanstvo jača."
        objasnjenje: Plemstvo je stari povlašćeni sloj koji gubi prevlast; građanstvo jača i posle revolucije čuva svoj uticaj.
        iz_udzbenika:
