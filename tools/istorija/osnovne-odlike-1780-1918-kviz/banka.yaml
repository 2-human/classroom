      - id: sr-objasni-podeljen
        vrsta: objasni
        tezina: lako
        pojmovi: [habzburska-monarhija, osmansko-carstvo, knezevina-srbija, crna-gora]
        pitanje: Zašto kažemo da je srpski narod u periodu 1780–1918. živeo podeljen? Objasni svojim rečima.
        uzor: Srbi su živeli u više država istovremeno. Na početku perioda bili su podeljeni između Habzburškog i Osmanskog carstva (i Mletačke republike do 1797). Kasnije su nastale dve srpske države, Srbija i Crna Gora, ali je mnogo Srba i dalje živelo u Austrougarskoj i pod osmanskom vlašću.
        ideje:
          - Srbi žive u Habzburškom i Osmanskom carstvu.
          - Nastaju dve srpske države — Srbija i Crna Gora.
          - Deo Srba ostaje u Austrougarskoj i pod Osmanlijama.
        objasnjenje: Srpski narod je bio rasut po više država i carstava — zato govorimo o podeljenom narodu.
        iz_udzbenika:
          strana: 14
          odeljak: Srpski narod od kraja XVIII veka do Prvog svetskog rata
          tekst: Srbi žive u Habzburškom i Osmanskom carstvu, u Srbiji i u Crnoj Gori.

      - id: sr-objasni-1878
        vrsta: objasni
        tezina: tesko
        pojmovi: [berlinski-kongres, bosna-i-hercegovina, knezevina-srbija, crna-gora]
        pitanje: Zašto je 1878. jedna od najvažnijih godina za srpski narod u ovom periodu? Navedi bar dve posledice.
        uzor: Na Berlinskom kongresu 1878. Srbija i Crna Gora priznate su kao nezavisne države; Srbija više ne priznaje vrhovnu vlast sultana. Iste godine Habzburška monarhija okupira Bosnu i Hercegovinu, pa se povećava broj Srba pod austrougarskom vlašću. Raška, Kosovo, Metohija i delovi Makedonije ostaju pod Osmanlijama sve do balkanskih ratova.
        ideje:
          - Nezavisnost Srbije i Crne Gore na Berlinskom kongresu.
          - Kraj vrhovne vlasti sultana nad Srbijom.
          - Okupacija BiH — više Srba pod Austrougarskom.
          - Deo Srba i dalje ostaje pod osmanskom vlašću.
        objasnjenje: Godina 1878. donosi nezavisnost, ali i novu podelu — zato je prelomna.
        iz_udzbenika:
          strana: 14
          odeljak: Srpski narod od kraja XVIII veka do Prvog svetskog rata
          tekst: Berlinski kongres 1878. priznaje nezavisnost Srbije i Crne Gore, a iste godine Habzburška monarhija okupira BiH.
        osa: {naziv: "Berlinski kongres", od: 1878, traka: srbi}
