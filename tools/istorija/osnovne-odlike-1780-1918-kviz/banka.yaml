      - id: sr-uporedi-srbija-cg
        vrsta: uporedi
        tezina: srednje
        pojmovi: [knezevina-srbija, crna-gora, petrovici-njegosi, karadjordjevici, obrenovici]
        a: Kneževina Srbija
        b: Crna Gora
        pitanje: Na koju državu se odnosi tvrdnja — A, B, obe ili nijednu?
        tvrdnje:
          - {tekst: "Nastala je kao rezultat Prvog i Drugog srpskog ustanka.", odgovor: a, zasto: "Ustanci su stvorili Kneževinu Srbiju."}
          - {tekst: "Vodili su je cetinjski mitropoliti iz porodice Petrović Njegoš.", odgovor: b, zasto: "To je Crna Gora."}
          - {tekst: "Priznata je kao nezavisna na Berlinskom kongresu 1878.", odgovor: oba, zasto: "Obe srpske države postale su nezavisne 1878."}
          - {tekst: "Naizmenično su njome vladali Karađorđevići i Obrenovići.", odgovor: a, zasto: "Te dve dinastije su vladale Srbijom."}
          - {tekst: "U balkanskim ratovima oslobađala je krajeve pod osmanskom vlašću.", odgovor: oba, zasto: "Srbija i Crna Gora su zajedno vodile balkanske ratove."}
          - {tekst: "U njoj je srpska crkva bila organizovana u Karlovačku mitropoliju.", odgovor: nijedan, zasto: "Karlovačka mitropolija je bila u Habzburškoj monarhiji."}
        pomoc:
          - Dve srpske države — jedna iz ustanaka, druga pod mitropolitima.
          - Šta im je bilo zajedničko 1878. i početkom XX veka?
          - "Iz lekcije: str. 14 — Srbija i Crna Gora."
        objasnjenje: Različitog porekla i dinastija, Srbija i Crna Gora zajedno dobijaju nezavisnost 1878. i zajedno ratuju u balkanskim ratovima.
        iz_udzbenika:
          strana: 14
          odeljak: Srpski narod od kraja XVIII veka do Prvog svetskog rata
          tekst: Udžbenik opisuje Kneževinu Srbiju i Crnu Goru kao dve srpske države, obe priznate kao nezavisne 1878.

      - id: sr-uporedi-dva-carstva
        vrsta: uporedi
        tezina: tesko
        pojmovi: [habzburska-monarhija, osmansko-carstvo, karlovacka-mitropolija, raska-oblast]
        a: Srbi u Habzburškoj (Austrougarskoj) monarhiji
        b: Srbi pod osmanskom vlašću (posle 1878)
        pitanje: Na koju grupu Srba se odnosi tvrdnja — A, B, obe ili nijednu?
        tvrdnje:
          - {tekst: "Najimućniji sloj, građanstvo, ulaže u kulturne i prosvetne ustanove.", odgovor: a, zasto: "To lekcija kaže za Srbe u Habzburškoj monarhiji."}
          - {tekst: "Identitet čuva Karlovačka mitropolija.", odgovor: a, zasto: "Karlovačka mitropolija je srpska crkva u Habzburškoj monarhiji."}
          - {tekst: "Zbog pritisaka se stalno iseljavaju u Srbiju.", odgovor: b, zasto: "Pritisci turskih vlasti i muslimanskih suseda teraju Srbe iz osmanskih krajeva."}
          - {tekst: "Njihov broj se povećao 1878. okupacijom Bosne i Hercegovine.", odgovor: a, zasto: "Okupacijom BiH više Srba je došlo pod austrougarsku vlast."}
          - {tekst: "Oslobođeni su u balkanskim ratovima.", odgovor: b, zasto: "Balkanski ratovi oslobađaju Rašku, Kosovo, Metohiju i delove Makedonije."}
          - {tekst: "Žive u državi koju vode Karađorđevići i Obrenovići.", odgovor: nijedan, zasto: "Tim dinastijama vlada Kneževina Srbija, ne carstva."}
        pomoc:
          - Jedna grupa je bogatija i ima crkvenu organizaciju, druga trpi pritiske.
          - Šta se desilo 1878. sa BiH?
