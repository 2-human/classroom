# Banka zadataka — 1.1. Osnovne odlike perioda 1780–1918. (istorija, 7. razred, str. 10–14). Spaja se u spec.yaml.
# Pitanja sopstvenim rečima na osnovu beleške tools/istorija/_source/lekcije-7/01-osnovne-odlike-perioda-1780-1918.md.
# Str. 15 (kraj odeljka o Srbima, rezime i pitanja) nije snimljena — nijedan zadatak ne zavisi od nje.
# Svaki pogrešan ponuđeni odgovor ima `zasto` — greška treba da nauči, ne samo da kazni.
# Događaji datirani samo vekom stoje na osi kao raspon (npr. „krajem XVIII veka” = 1770–1800), uvek isto.

delovi:
  - naslov: Novi vek i industrijska revolucija
    zadaci:
      - id: nv-izbor-pocetak
        vrsta: izbor
        tezina: lako
        pojmovi: [novi-vek, kristifor-kolumbo]
        pitanje: Kojim događajem počinje novi vek?
        odgovori:
          - {tekst: "Kolumbovim otkrićem Amerike", tacan: true}
          - {tekst: "Pronalaskom Vatove parne mašine", tacan: false, zasto: "Parna mašina (1769) ne otvara novi vek, nego zatvara njegov prvi deo — rani novi vek."}
          - {tekst: "Francuskom revolucijom", tacan: false, zasto: "Francuska revolucija izbija krajem XVIII veka, gotovo tri veka posle početka novog veka."}
          - {tekst: "Krajem Prvog svetskog rata", tacan: false, zasto: "Kraj Prvog svetskog rata (1918) je kraj novog veka, a ne njegov početak."}
        pomoc:
          - Novi vek dolazi posle srednjeg veka — traži događaj s kraja XV veka.
          - Reč je o putovanju preko Atlantika.
          - "Iz lekcije: novi vek traje od Kolumbovog otkrića Amerike 1492. do kraja Prvog svetskog rata 1918."
        objasnjenje: Novi vek počinje Kolumbovim otkrićem Amerike 1492, a završava se krajem Prvog svetskog rata 1918.
        iz_udzbenika:
          strana: 10
          odeljak: Novi vek – pojam i hronološki okviri
          tekst: Novi vek je period posle srednjeg veka; počinje Kolumbovim otkrićem Amerike 1492. i traje do kraja Prvog svetskog rata 1918.
        osa: {naziv: "Kolumbovo otkriće Amerike", od: 1492, traka: svet}

      - id: nv-datum-kolumbo
        vrsta: datum
        tezina: lako
        pojmovi: [novi-vek, kristifor-kolumbo, velika-geografska-otkrica]
        dogadjaj: "Kolumbovo otkriće Amerike"
        pitanje: Koje godine je Kolumbo otkrio Ameriku i tako započeo novi vek?
        godina: 1492
        traka: svet
        pomoc:
          - Bilo je to pri samom kraju XV veka.
          - Samo dve godine posle karte sveta iz 1490. na kojoj Amerike još nema.
          - "Iz lekcije: Kolumbovo otkriće Amerike, 1492."
        objasnjenje: Kolumbo je stigao do Amerike 1492; ta godina je početak novog veka.
        iz_udzbenika:
          strana: 10
          odeljak: Novi vek – pojam i hronološki okviri
          tekst: Početak novog veka udžbenik vezuje za Kolumbovo otkriće Amerike 1492. godine.

      - id: nv-datum-kraj
        vrsta: datum
        tezina: lako
        pojmovi: [novi-vek, prvi-svetski-rat]
        dogadjaj: "Kraj Prvog svetskog rata"
        pitanje: Koje godine se završio Prvi svetski rat, a s njim i novi vek?
        godina: 1918
        traka: svet
        pomoc:
          - Ista godina je i u naslovu lekcije.
          - Period koji učimo traje od 1780. do te godine.
          - "Iz lekcije: kraj Prvog svetskog rata 1918. je kraj novog veka."
        objasnjenje: Novi vek se završava 1918. godine, krajem Prvog svetskog rata.
        iz_udzbenika:
          strana: 10
          odeljak: Novi vek – pojam i hronološki okviri
          tekst: Novi vek traje do kraja Prvog svetskog rata, 1918. godine.

      - id: nv-datum-vat
        vrsta: datum
        tezina: srednje
        pojmovi: [parna-masina, dzejms-vat, rani-novi-vek]
        dogadjaj: "Vatova parna mašina"
        pitanje: Koje godine je Džejms Vat napravio parnu mašinu kojom se završava rani novi vek?
        godina: 1769
        traka: otkrica
        pomoc:
          - Bilo je to u drugoj polovini XVIII veka, malo pre 1780.
          - Samo jedanaest godina pre početka perioda koji učimo.
          - "Iz lekcije: Vatova parna mašina, 1769."
        objasnjenje: Vatova parna mašina (1769) zatvara rani novi vek i pokreće industrijsku revoluciju.
        iz_udzbenika:
          strana: 10
          odeljak: Novi vek – pojam i hronološki okviri
          tekst: Rani novi vek traje od velikih geografskih otkrića do pronalaska Vatove parne mašine 1769.

      - id: nv-datum-rani
        vrsta: datum
        tezina: srednje
        pojmovi: [rani-novi-vek, predindustrijsko-doba]
        dogadjaj: "Rani novi vek"
        pitanje: Od koje do koje godine traje rani novi vek (predindustrijsko doba)? Upiši početnu i završnu godinu.
        od: 1492
        do: 1769
        traka: svet
        pomoc:
          - Počinje kad i ceo novi vek.
          - Završava se jednim pronalaskom britanskog pronalazača.
          - "Iz lekcije: od Kolumbovog otkrića (1492) do Vatove parne mašine (1769)."
        objasnjenje: Rani novi vek traje od 1492. do 1769, od početka velikih geografskih otkrića do Vatove parne mašine.
        iz_udzbenika:
          strana: 10
          odeljak: Novi vek – pojam i hronološki okviri
          tekst: U 6. razredu učeni su događaji ranog novog veka, od velikih geografskih otkrića krajem XV veka do Vatove parne mašine 1769.

      - id: nv-tn-predindustrijsko
        vrsta: tacno_netacno
        tezina: lako
        pojmovi: [rani-novi-vek, predindustrijsko-doba]
        tvrdnja: "Rani novi vek se naziva i predindustrijsko doba, jer je trajao do početka industrije."
        tacno: true
        pomoc:
          - „Pred” znači „pre”.
          - Rani novi vek se završava parnom mašinom, a sa njom počinje industrija.
          - "Iz lekcije: rani novi vek = predindustrijsko doba, do Vatove parne mašine 1769."
        objasnjenje: Tačno. Rani novi vek je doba pre industrije — završava se pronalaskom parne mašine.
        iz_udzbenika:
          strana: 10
          odeljak: Novi vek – pojam i hronološki okviri
          tekst: Rani novi vek udžbenik naziva i predindustrijskim dobom; traje do Vatove parne mašine.
        osa: {naziv: "Rani novi vek", od: 1492, do: 1769, traka: svet}

      - id: nv-tn-britanija
        vrsta: tacno_netacno
        tezina: srednje
        pojmovi: [industrija, velika-britanija, parna-masina]
        tvrdnja: Industrija zasnovana na parnoj mašini počela je da se razvija najpre u Francuskoj.
        tacno: false
        ispravke:
          - {tekst: "Industrija je najpre počela da se razvija u Velikoj Britaniji, gde je parna mašina primenjena u preradi tkanina, metala i drveta.", tacan: true}
          - {tekst: "Industrija je najpre počela da se razvija u Rusiji.", tacan: false, zasto: "Rusija se u lekciji javlja kao velika sila, ali razvoj industrije počinje u Velikoj Britaniji, domovini Džejmsa Vata."}
          - {tekst: "Industrija je najpre počela da se razvija u Sjedinjenim Američkim Državama.", tacan: false, zasto: "SAD nastaju tek krajem XVIII veka; parna mašina se prvo koristi u Velikoj Britaniji."}
        pomoc:
          - Odakle je bio Džejms Vat?
          - Industrija je krenula tamo gde je mašina prvo primenjena.
          - "Iz lekcije: parnom mašinom u Velikoj Britaniji počinje razvoj industrije."
        objasnjenje: Vat je bio britanski pronalazač, pa se industrija najpre razvija u Velikoj Britaniji.
        iz_udzbenika:
          strana: 10
          odeljak: Novi vek – pojam i hronološki okviri
          tekst: Parna mašina se krajem XVIII veka koristi u preradi tkanina, metala i drveta, čime u Velikoj Britaniji počinje razvoj industrije.

      - id: nv-dopuni-pojmovi
        vrsta: dopuni
        tezina: lako
        pojmovi: [industrija, revolucija, industrijska-revolucija]
        pitanje: Dopuni rečenice.
        tekst: "Industrija je privredna grana zasnovana na korišćenju {{mašina}} u proizvodnji. Industrijska revolucija je masovni prelazak sa {{ručne}} na mašinsku proizvodnju. Revolucija je {{nagla}} i često nasilna promena postojećeg poretka."
        ponudjene: [mašina, ručne, nagla, životinja, spora, mašinske]
        pomoc:
          - Industrija = proizvodnja uz pomoć …?
          - Revolucija je suprotno od spore, postepene promene.
          - "Iz lekcije: industrija koristi mašine; industrijska revolucija = prelazak sa ručne na mašinsku proizvodnju."
        objasnjenje: Industrija koristi mašine; industrijska revolucija je nagli, masovni prelazak sa ručne na mašinsku proizvodnju.
        iz_udzbenika:
          strana: 11
          odeljak: Definicije
          tekst: Revolucija je prevrat, nagla i često nasilna promena poretka; industrijska revolucija je preokret u proizvodnji — prelazak sa ručne na mašinsku.

      - id: nv-dopuni-okviri
        vrsta: dopuni
        tezina: srednje
        pojmovi: [novi-vek, rani-novi-vek, velika-geografska-otkrica]
        pitanje: Dopuni rečenice o granicama novog veka.
        tekst: "Novi vek dolazi posle {{srednjeg}} veka. Rani novi vek počinje velikim geografskim otkrićima krajem {{XV}} veka, a završava se pronalaskom parne mašine britanskog pronalazača {{Džejmsa Vata|Vata|Džejms Vat}}."
        ponudjene: [srednjeg, starog, XV, XVIII, Džejmsa Vata, Kristifora Kolumba]
        pomoc:
          - Koji vek prethodi novom?
          - Kolumbo plovi 1492 — u kom je to veku?
          - "Iz lekcije: rani novi vek traje od velikih geografskih otkrića krajem XV veka do Vatove parne mašine."
        objasnjenje: Novi vek sledi posle srednjeg; njegov rani deo traje od otkrića krajem XV veka do Vatove parne mašine 1769.
        iz_udzbenika:
          strana: 10
          odeljak: Novi vek – pojam i hronološki okviri
          tekst: Novi vek dolazi posle srednjeg veka; rani novi vek obuhvata period od velikih geografskih otkrića do Vatove parne mašine.

      - id: nv-povezi-definicije
        vrsta: povezi
        tezina: lako
        pojmovi: [revolucija, industrijska-revolucija, industrija, kolonija, istocno-pitanje]
        pitanje: Poveži pojam sa njegovim značenjem.
        parovi:
          - ["revolucija", "nagla, često nasilna promena političkog ili društvenog poretka"]
          - ["industrijska revolucija", "masovni prelazak sa ručne na mašinsku proizvodnju"]
          - ["industrija", "privredna grana zasnovana na korišćenju mašina"]
          - ["kolonija", "posed strane sile u dalekim, prekomorskim krajevima"]
          - ["Istočno pitanje", "pitanje opstanka Osmanskog carstva na Balkanu i Bliskom istoku"]
        pomoc:
          - Kreni od pojma koji je najlakši — kolonija ili industrija.
          - Industrija je grana privrede; industrijska revolucija je preokret, promena.
          - "Iz lekcije: „?” kućice na str. 11–13 objašnjavaju ove pojmove."
        objasnjenje: Revolucija je nagla promena; industrijska revolucija je takva promena u proizvodnji; kolonija je prekomorski posed; Istočno pitanje se tiče opstanka Osmanskog carstva.
        iz_udzbenika:
          strana: 11
          odeljak: Definicije
          tekst: Udžbenik u „?” kućicama objašnjava pojmove revolucija, industrijska revolucija, kolonija i Istočno pitanje.

      - id: nv-zakljuci-revolucija
        vrsta: zakljuci
        tezina: srednje
        pojmovi: [industrijska-revolucija, parna-masina, revolucija]
        pitanje: Zašto se promene koje je pokrenula Vatova parna mašina nazivaju „revolucijom”, iako u njima nije bilo oružane borbe?
        odgovori:
          - {tekst: "Zato što je širenje industrijske proizvodnje naglo i duboko promenilo privredu i društvo Evrope, a zatim i drugih kontinenata", tacan: true}
          - {tekst: "Zato što su radnici odmah srušili vlast kraljeva", tacan: false, zasto: "Lekcija tako nešto ne kaže; borba za radnička prava je trajala dugo, a ne kao brzo rušenje vlasti."}
          - {tekst: "Zato što je parna mašina prvo korišćena u ratu", tacan: false, zasto: "Prvo je korišćena u preradi tkanina, metala i drveta — u proizvodnji, ne u ratu."}
          - {tekst: "Zato što se desila u isto vreme kad i Francuska revolucija", tacan: false, zasto: "Vreme nije razlog naziva; „revolucija” ovde znači preokret — u proizvodnji."}
        pomoc:
          - "Korak 1: Šta reč revolucija znači — mora li uvek da bude nasilna?"
          - "Korak 2: Šta je industrija promenila — samo fabrike ili i život ljudi i država?"
          - "Iz lekcije: širenje industrijske proizvodnje imalo je dalekosežne posledice na privredni i društveni razvoj."
        objasnjenje: Revolucija je preokret. Prelazak sa ručne na mašinsku proizvodnju toliko je promenio privredu i društvo da se zove industrijska revolucija.
        iz_udzbenika:
          strana: 11
          odeljak: Novi vek – pojam i hronološki okviri
          tekst: Širenje industrijske proizvodnje imalo je dalekosežne posledice na privredu i društvo Evrope i drugih kontinenata, pa se kaže da je Vatov pronalazak pokrenuo industrijsku revoluciju.

      - id: nv-zakljuci-granica
        vrsta: zakljuci
        tezina: tesko
        pojmovi: [rani-novi-vek, parna-masina, industrijska-revolucija]
        pitanje: Zašto udžbenik granicu između ranog novog veka i perioda 1780–1918 stavlja kod jednog pronalaska, a ne kod rata ili smene vladara?
        odgovori:
          - {tekst: "Zato što je taj pronalazak pokrenuo industrijsku revoluciju, a ona je najvažnija odlika celog novog perioda", tacan: true}
          - {tekst: "Zato što u to vreme nije bilo nijednog rata", tacan: false, zasto: "Lekcija ne tvrdi da nije bilo ratova; granica je pronalazak zbog njegovih dalekosežnih posledica."}
          - {tekst: "Zato što je Džejms Vat bio kralj Velike Britanije", tacan: false, zasto: "Vat je bio pronalazač, ne vladar."}
          - {tekst: "Zato što je parna mašina odmah ukinula feudalizam u celoj Evropi", tacan: false, zasto: "Feudalizam je ukinut tek u prvoj polovini XIX veka, pod uticajem promena posle Francuske revolucije."}
        pomoc:
          - "Korak 1: Po čemu se period posle 1780. najviše razlikuje od ranijeg? (rast gradova, fabrike, železnica…)"
          - "Korak 2: Šta je pokrenulo sve te promene?"
          - "Iz lekcije: rani novi vek je predindustrijsko doba; Vatova mašina pokreće industrijsku revoluciju."
        objasnjenje: Period 1780–1918 je doba industrije. Zato ga od predindustrijskog doba odvaja pronalazak koji je pokrenuo industrijsku revoluciju.
        iz_udzbenika:
          strana: 10
          odeljak: Novi vek – pojam i hronološki okviri
          tekst: Rani novi vek, predindustrijsko doba, završava se Vatovom parnom mašinom 1769, koja pokreće industrijsku revoluciju.
        osa: {naziv: "Vatova parna mašina", od: 1769, traka: otkrica}

      - id: nv-lanac-vat
        vrsta: lanac
        tezina: lako
        pojmovi: [parna-masina, dzejms-vat, industrija]
        karike:
          - Džejms Vat pronalazi parnu mašinu
          - "?"
          - U Velikoj Britaniji počinje razvoj industrije
        praznina: 1
        odgovori:
          - {tekst: "Mašina počinje da se koristi u preradi tkanina, metala i drveta", tacan: true}
          - {tekst: "Kolumbo otkriva Ameriku", tacan: false, zasto: "Kolumbovo otkriće (1492) je skoro tri veka starije i nema veze sa parnom mašinom."}
          - {tekst: "Izbija Francuska revolucija", tacan: false, zasto: "Francuska revolucija je posledica nezadovoljstva seljaštva i građanstva, a ne korak od mašine do industrije."}
          - {tekst: "Gradi se automobil", tacan: false, zasto: "Automobilski saobraćaj se razvija tek krajem XIX veka, uz motor sa unutrašnjim sagorevanjem."}
        pomoc:
          - "Korak 1: Pronalazak sam po sebi ne menja ništa — mora negde da se upotrebi."
          - "Korak 2: Gde je parna mašina prvo radila?"
          - "Iz lekcije: koristila se u preradi tkanina, metala i drveta."
        objasnjenje: Kad je parna mašina počela da se koristi u preradi tkanina, metala i drveta, u Velikoj Britaniji je počeo razvoj industrije.
        iz_udzbenika:
          strana: 10
          odeljak: Novi vek – pojam i hronološki okviri
          tekst: Vatova parna mašina se krajem XVIII veka koristi u preradi tkanina, metala i drveta, čime počinje razvoj industrije.
        osa: {naziv: "Vatova parna mašina", od: 1769, traka: otkrica}

      - id: nv-lanac-revolucija
        vrsta: lanac
        tezina: srednje
        pojmovi: [industrija, industrijska-revolucija]
        karike:
          - Parna mašina u preradi tkanina, metala i drveta
          - Razvoj industrije u Velikoj Britaniji
          - "?"
          - Kaže se da je Vatov pronalazak pokrenuo industrijsku revoluciju
        praznina: 2
        odgovori:
          - {tekst: "Industrijska proizvodnja se širi i menja privredu i društvo Evrope, pa i drugih kontinenata", tacan: true}
          - {tekst: "Industrija ostaje samo u jednoj britanskoj radionici", tacan: false, zasto: "Da je ostala u jednoj radionici, ne bi bilo „revolucije” — upravo širenje proizvodnje daje taj naziv."}
          - {tekst: "Britanija gubi trinaest kolonija u Severnoj Americi", tacan: false, zasto: "Gubitak kolonija je posledica Američkog rata za nezavisnost, ne širenja industrije."}
          - {tekst: "Plemstvo zabranjuje mašine", tacan: false, zasto: "Lekcija to ne kaže; plemstvo gubi prevlast zbog promena posle Francuske revolucije."}
        pomoc:
          - "Korak 1: Šta se mora desiti sa industrijom da bi se promena nazvala revolucijom?"
          - "Korak 2: Na koje države i kontinente se promena proširila?"
          - "Iz lekcije: širenje industrijske proizvodnje imalo je dalekosežne posledice na privredni i društveni razvoj."
        objasnjenje: Industrija se proširila iz Britanije na Evropu i druge kontinente i promenila privredu i društvo — zato govorimo o industrijskoj revoluciji.
        iz_udzbenika:
          strana: 11
          odeljak: Novi vek – pojam i hronološki okviri
          tekst: Širenje industrijske proizvodnje imalo je dalekosežne posledice na evropske države, a zatim i na zemlje drugih kontinenata.

      - id: nv-izvor-karta-1490
        vrsta: izvor
        slika_u_pitanju: true
        tezina: lako
        pojmovi: [velika-geografska-otkrica, novi-vek]
        izvor:
          autor: Nepoznati kartograf
          naslov: Karta sveta iz 1490. (opis slike)
          tekst: Stara ovalna karta sveta. Na njoj su ucrtane samo Evropa, Azija i Afrika — svet koji su Evropljani tada poznavali. Amerike i Australije na karti nema.
          napomena: "Odlomak je prepričan; udžbenik, str. 10 (slika levo)."
        pitanje: Koji kontinenti su ucrtani na karti iz 1490?
        odgovori:
          - {tekst: "Evropa, Azija i Afrika", tacan: true}
          - {tekst: "Evropa, Amerika i Australija", tacan: false, zasto: "Amerika i Australija još nisu bile poznate Evropljanima; otkrivene su tokom ranog novog veka."}
          - {tekst: "Svi kontinenti", tacan: false, zasto: "Karta je nastala pre Kolumbovog putovanja 1492, pa Ameriku ne prikazuje."}
          - {tekst: "Samo Evropa", tacan: false, zasto: "Evropljani su tada poznavali i Aziju i Afriku — ceo Stari svet."}
        pomoc:
          - Karta je nastala dve godine pre Kolumbovog putovanja.
          - Koji svet su Evropljani poznavali pre velikih otkrića?
          - "Iz lekcije: na karti iz 1490. je Stari svet — Evropa, Azija, Afrika."
        objasnjenje: Karta iz 1490. prikazuje Stari svet — Evropu, Aziju i Afriku; Amerike još nema, jer je Kolumbo stigao do nje tek 1492.
        iz_udzbenika:
          strana: 10
          odeljak: Karte sveta iz 1490. i 1794.
          tekst: Na str. 10 su dve karte sveta, iz 1490. i 1794; udžbenik pita koji su kontinenti ucrtani na starijoj karti.
          slika: 01-osnovne-odlike-perioda-1780-1918/01-karta-sveta-1490.jpg
        osa: {naziv: "Karta sveta iz 1490.", od: 1490, traka: svet}

      - id: nv-izvor-karta-1794
        vrsta: izvor
        slika_u_pitanju: true
        tezina: srednje
