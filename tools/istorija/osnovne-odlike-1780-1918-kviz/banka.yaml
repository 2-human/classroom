          odeljak: Društvo
          tekst: Privredne promene jačaju građanstvo, a posle ukidanja feudalizma plemstvo i sveštenstvo gube prevlast.

      - id: dr-uporedi-seljastvo-radnistvo
        vrsta: uporedi
        tezina: tesko
        pojmovi: [seljastvo, radnistvo, knezevina-srbija]
        a: Seljaštvo
        b: Radništvo
        pitanje: Na koji sloj se odnosi tvrdnja — A, B, oba ili nijedan?
        tvrdnje:
          - {tekst: "Najbrojniji sloj u XIX veku.", odgovor: a, zasto: "Seljaštvo je i dalje najbrojnije."}
          - {tekst: "Gradski sloj koji živi od rada u fabrikama.", odgovor: b, zasto: "To je definicija radništva."}
          - {tekst: "Nova pojava XIX veka.", odgovor: b, zasto: "Seljaka je bilo oduvek; radništvo nastaje sa fabrikama."}
          - {tekst: "Njegovo nezadovoljstvo dovelo je do Francuske revolucije.", odgovor: a, zasto: "Do revolucije su doveli nezadovoljni seljaštvo i građanstvo; radništvo je tada tek nastajalo."}
          - {tekst: "U Srbiji je posle ukidanja turskog feudalnog uređenja postalo slobodno.", odgovor: a, zasto: "Srbija postaje zemlja slobodnih seljaka."}
          - {tekst: "Imalo je prevlast od srednjeg veka.", odgovor: nijedan, zasto: "Prevlast su imali plemstvo i sveštenstvo."}
        pomoc:
